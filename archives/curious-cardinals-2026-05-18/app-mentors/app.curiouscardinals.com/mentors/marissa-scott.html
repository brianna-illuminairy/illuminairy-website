xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"86878500-0ca6-4bea-bfad-06cad101b90a\"}":{"__typename":"Favorites","uuid":"86878500-0ca6-4bea-bfad-06cad101b90a","photoUrl":"https://ucarecdn.com/96d9ad7f-3b35-4c90-bdaf-02767ef8e066/","title":"Janet Fish","type":"ARTIST"},"Favorites:{\"uuid\":\"47f78865-b567-4cdf-946e-6397551d11c2\"}":{"__typename":"Favorites","uuid":"47f78865-b567-4cdf-946e-6397551d11c2","photoUrl":"https://ucarecdn.com/0587d860-92d4-4480-9ecf-5293725263dd/","title":"How to Be You","type":"BOOK"},"Favorites:{\"uuid\":\"eb6bd497-cd2b-4ded-a3be-794e95668e60\"}":{"__typename":"Favorites","uuid":"eb6bd497-cd2b-4ded-a3be-794e95668e60","photoUrl":"https://ucarecdn.com/e6444f15-7961-4614-99a1-6595dd04efb0/","title":"Abbey Road ","type":"ALBUM"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"52841c01-33a8-4f41-bc6f-acf40326a68b\"}":{"__typename":"DeepDives","uuid":"52841c01-33a8-4f41-bc6f-acf40326a68b","content":"\u003cp\u003eI currently have a big ambition to create a blog. I’m just getting familiar with all of the ins and outs of blogging websites, and I am excited to have an outlet to share some of my writing. I will mainly write about new places I visit, and I would love to tie in photography as well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"f00f7b7b-50b5-4405-a484-d98d9321b681\"}":{"__typename":"DeepDives","uuid":"f00f7b7b-50b5-4405-a484-d98d9321b681","content":"\u003cp\u003eMy mom is Native American and we are members of the Iroquois Confederacy. Holding this identity has given me a keen awareness of student’s varying backgrounds, values, and experiences. I don’t believe identities are something to be ignored, and as a mentor it is important for me to decentralize myself and my own experience to truly step into the students’ shoes as individuals. At times it is useful to reflect on my own experience and what I personally found valuable when I was younger, but I also think it is important to remain cognizant that every student is different with unique experiences from me, and from each other!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c55701c6-1872-4b2d-bd47-02d6a3a7142c\"}":{"__typename":"DeepDives","uuid":"c55701c6-1872-4b2d-bd47-02d6a3a7142c","content":"\u003cp\u003eIn high school I worked at a locally owned cookie shop. This sparked my love for chocolate chip cookies particularly, and gave me plenty of expertise in identifying a great one. I am on a lifelong quest to find the best chocolate chip cookie in every city I visit. I could talk for hours about all of the qualities the perfect cookie must have.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"41119efe-fef9-465c-9f06-f22b51099e68\"}":{"__typename":"School","uuid":"41119efe-fef9-465c-9f06-f22b51099e68","name":"Royalton-Hartland High School ","city":"Middleport","type":"HIGH","state":"NY","country":"United States","zip":"14105"},"Education:{\"uuid\":\"604979fd-f72f-48eb-89a5-77e6f49e4e8d\"}":{"__typename":"Education","uuid":"604979fd-f72f-48eb-89a5-77e6f49e4e8d","school":{"__ref":"School:{\"uuid\":\"41119efe-fef9-465c-9f06-f22b51099e68\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"2788d2df-f781-4f5c-a59b-2bde270ffbef\"}":{"__typename":"Education","uuid":"2788d2df-f781-4f5c-a59b-2bde270ffbef","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Sociology \u0026 Visual Art ","degree":null},"MentorPublicProfile:{\"uuid\":\"448f03dd-b72c-4588-a46d-42e12ecbf9b1\"}":{"__typename":"MentorPublicProfile","uuid":"448f03dd-b72c-4588-a46d-42e12ecbf9b1","displayName":"Marissa S.","slug":"marissa-scott","biography":"\u003cp\u003eHey! My name is Marissa and I am a rising senior at Brown University where I am pursuing a degree in Sociology and Visual Art. I am inspired by creativity in all forms, including making creative connections across people, disciples, and cultures. Studying sociology has taught me to think outside the box in this way, to ask critical questions not just through visual work, but about the world all around me. I love to think about how the social climate, laws, education, and media influence who we are and what we stand for. I bring this guiding curiosity into everything I do, including how I teach and mentor.\u003cbr\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI’ve studied abroad in Italy on two different occasions, once with RISD and second with the University of Bologna. This is where I deepened my love for art history and I've since worked on different design and research opportunities. I’ve illustrated for academic research, designed educational materials for policy initiatives, and worked at an arts education non profit supporting creative programming for youth in Los Angeles.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe perspective I’ve gained living in another part of the world has also given me an appreciation for the ways policy shapes our lived experience. I am an analyst for Brown Initiative for Policy where I work on a student-led team that wrote and proposed a bill to the Rhode Island State House. This has shown me how empowering it is to find and use your voice in many different ways, whether through writing, a speech, or a painting.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond the serious studies, I dance with several groups on campus, and serve as a peer advisor for first-year students. This role confirmed how much I love and appreciate mentorship. Watching my advisees grow beyond what they thought was possible has been one of the most rewarding parts of my college experience.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLastly, I come from a small rural town in Western New York, where there was not a robust system of post-high school support or guidance. Most of my college search process came from late-night internet research sessions and the help of online communities, which is why I believe so deeply in the power of accessible mentorship, across time and space!\u0026nbsp;\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"BhgZWvG3WKapnpAiPmHM00ndHf96byNRaRCLe6028lu4I","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThis past semester I studied abroad in Italy where I was directly enrolled at the University of Bologna. This meant that 100% of the learning I was doing was in Italian. I’m proud of myself for putting myself out there and proving that I could live my life in a complete new language that I only began studying 2 years ago! \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"86878500-0ca6-4bea-bfad-06cad101b90a\"}"},{"__ref":"Favorites:{\"uuid\":\"47f78865-b567-4cdf-946e-6397551d11c2\"}"},{"__ref":"Favorites:{\"uuid\":\"eb6bd497-cd2b-4ded-a3be-794e95668e60\"}"}],"causesSupported":[],"major":"Sociology \u0026 Visual Art ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"52841c01-33a8-4f41-bc6f-acf40326a68b\"}"},{"__ref":"DeepDives:{\"uuid\":\"f00f7b7b-50b5-4405-a484-d98d9321b681\"}"},{"__ref":"DeepDives:{\"uuid\":\"c55701c6-1872-4b2d-bd47-02d6a3a7142c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/be92b871-cb0b-4ae7-bf26-5579cb07d383/-/preview/-/format/jpg/","https://ucarecdn.com/f3e6e661-599b-4c99-8c2f-8d24cd729b05/-/preview/-/format/jpg/","https://ucarecdn.com/dabbff54-09fb-4615-a555-027b33427060/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"604979fd-f72f-48eb-89a5-77e6f49e4e8d\"}"},{"__ref":"Education:{\"uuid\":\"2788d2df-f781-4f5c-a59b-2bde270ffbef\"}"}],"hiredAt":"2025-05-14T14:27:55.113Z","topics":["Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","Visual Arts / Graphic Design","Video / Photography","K-6 Storybook","History Project","Web Design","Public Speaking","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"marissa-scott\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"448f03dd-b72c-4588-a46d-42e12ecbf9b1\"}"}}},"_sentryTraceData":"a501e7c84503472fb9d349a6f82ca81f-93171767616c0223-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e
