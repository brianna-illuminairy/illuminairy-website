xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"63cad903-30e4-4009-999d-182a371a01b4\"}":{"__typename":"Favorites","uuid":"63cad903-30e4-4009-999d-182a371a01b4","photoUrl":"https://ucarecdn.com/4cfaef91-5abb-4911-b8c3-12e6150c85ba/","title":"Napoleon Dynamite","type":"MOVIE"},"Favorites:{\"uuid\":\"14887571-cfee-4c6d-8155-5d178aa37442\"}":{"__typename":"Favorites","uuid":"14887571-cfee-4c6d-8155-5d178aa37442","photoUrl":"https://ucarecdn.com/4cfaef91-5abb-4911-b8c3-12e6150c85ba/","title":"Taylor Swift ","type":"ARTIST"},"Favorites:{\"uuid\":\"688c8af5-998f-489c-8d4a-3c420a9d7cd3\"}":{"__typename":"Favorites","uuid":"688c8af5-998f-489c-8d4a-3c420a9d7cd3","photoUrl":"https://ucarecdn.com/4cfaef91-5abb-4911-b8c3-12e6150c85ba/","title":"Just Dance","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"61cd7962-322b-43c6-aeea-03c3637f0250\"}":{"__typename":"DeepDives","uuid":"61cd7962-322b-43c6-aeea-03c3637f0250","content":"\u003cp\u003eEveryone is on their own timeline. Instead of comparing yourself to others, focus on one thing you can do each day to push yourself forward. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"7a461bf9-53fb-4c75-b86f-64312266e0ee\"}":{"__typename":"DeepDives","uuid":"7a461bf9-53fb-4c75-b86f-64312266e0ee","content":"\u003cp\u003eThe effort I put into prioritizing having fun and spending time with family and friends as much as I prioritize academics. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"af50cc12-f567-4147-802c-05e116c807e3\"}":{"__typename":"DeepDives","uuid":"af50cc12-f567-4147-802c-05e116c807e3","content":"\u003cp\u003eI tutored two students in high school, and meeting with them became some of my favorite times each week. I love meeting new people, and the added layer of working together to learn from each other is so rewarding and worthwhile. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"17e58dc8-df37-4ffa-8b7b-c83a012b88b8\"}":{"__typename":"DeepDives","uuid":"17e58dc8-df37-4ffa-8b7b-c83a012b88b8","content":"\u003cp\u003eI laugh at everything! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"7ec9da57-0206-4793-804c-d3080ce79e9f\"}":{"__typename":"School","uuid":"7ec9da57-0206-4793-804c-d3080ce79e9f","name":"Buckingham Browne \u0026 Nichols School","city":"Cambridge","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"40562f03-e0a9-4c91-9ba3-b4c08dac4664\"}":{"__typename":"Education","uuid":"40562f03-e0a9-4c91-9ba3-b4c08dac4664","school":{"__ref":"School:{\"uuid\":\"7ec9da57-0206-4793-804c-d3080ce79e9f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"0553d823-b7ca-48a4-9f96-e6f41afe1cbb\"}":{"__typename":"Education","uuid":"0553d823-b7ca-48a4-9f96-e6f41afe1cbb","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Journalism","degree":null},"MentorPublicProfile:{\"uuid\":\"7e71b36a-d138-4b09-b7eb-bf326eca749f\"}":{"__typename":"MentorPublicProfile","uuid":"7e71b36a-d138-4b09-b7eb-bf326eca749f","displayName":"Ava L.","slug":"ava-levinson-1","biography":"\u003cp\u003eHi! I'm Ava, and I'm a junior at Northwestern University studying journalism, Spanish and marketing. I love giraffes, going on boat rides and painting!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've been involved with journalism since high school, when I led my school's award-winning newspaper as the editor in chief. I developed technical skills like writing, editing and fact-checking news articles, and built strong life skills including organization, time management, leadership and how to effectively work with individuals based on their unique strengths and communication styles.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I started college, my aim was to learn more about myself and what kind of journalism I wanted to do. I joined two magazines as a writer and editor, one for general news and one music based. I loved interviewing new people and storytelling, but it wasn’t until taking a video journalism course my sophomore year that I felt I had found what I loved to do. Combining my love for meeting people and learning new things with producing video led me to where I am now.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the summer before junior year, I moved to New York City to independently direct, film, edit and produce a video series about the impact social media has on young, emerging music artists. I met so many incredible people my age and ended the summer with a product that encapsulated my experiences and shared them through video.\u0026nbsp;More recently, I made a short documentary as a one-person crew about a man who was wrongfully imprisoned for nearly 30 years, focusing on the relationship he had with his mother. I learned how to manage each part of the production process as well as how to approach and cover a topic as sensitive as this one.\u0026nbsp;And I loved every second of the process.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTrying to figure out what I love to do absorbed so much of my energy growing up. I remember feeling lost and stressed each time someone asked me, “But what do you want to \u003cem\u003edo\u003c/em\u003e?” I know how overwhelming it can feel (I still feel that way sometimes), and I want to be there to help other students find their passion and gain confidence exploring it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI open up quickly and love socializing. I'm so excited to meet and work with you!\u003c/p\u003e","teachingVideoPlaybackId":"a4pGPeHIs0002aGwAJyzcZ2gHmHPnKpOkA8VLXi4adbVU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"63cad903-30e4-4009-999d-182a371a01b4\"}"},{"__ref":"Favorites:{\"uuid\":\"14887571-cfee-4c6d-8155-5d178aa37442\"}"},{"__ref":"Favorites:{\"uuid\":\"688c8af5-998f-489c-8d4a-3c420a9d7cd3\"}"}],"causesSupported":[],"major":"Journalism","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"61cd7962-322b-43c6-aeea-03c3637f0250\"}"},{"__ref":"DeepDives:{\"uuid\":\"7a461bf9-53fb-4c75-b86f-64312266e0ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"af50cc12-f567-414
