ll},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"fd537073-0e45-4a2a-af0e-58e92ad34364\"}":{"__typename":"Education","uuid":"fd537073-0e45-4a2a-af0e-58e92ad34364","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d1158e53-c756-4929-87fd-7b1f48ed1b60\"}":{"__typename":"MentorPublicProfile","uuid":"d1158e53-c756-4929-87fd-7b1f48ed1b60","displayName":"Jonathan S.","slug":"jonathan-siskind","biography":"\u003cp\u003eI’m sure one of the first things your eyes jumped to on my bio page was that big burst of flame on my rightmost profile picture. To any concerned parent skimming my page – there is no need to worry – I’m no arsonist! In fact, I consider myself quite the opposite. While an arsonist might burn things down to destroy them, my area of expertise is in creating and building things. First and foremost, I consider myself a “maker.” Over the years, I have amassed a workshop full of tools and machines in my home basement where I have created all manner of mechanisms and contraptions, including a robotic submarine, a remote-controlled flying ornithopter, the wrist-mounted flamethrower that you saw above, and so much more. This passion for tinkering is what landed me on my path to pursue mechanical engineering at Stanford University. In college, I am a co-lead of a division of the Stanford Space Initiative – one of the most populated and highest-funded student organizations at Stanford, where I am leading a project to send autonomous, solar-powered rovers to Antarctica. Furthermore, I am also a student researcher in the cutting-edge Stanford Robotics Lab (SRL), where I am working on various high-level projects in robotics.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOutside of these engineering pursuits, my other forte is in civics and government. I have been immensely politically engaged for much of my life. I was president of my high school’s competitive debate team, and I also worked as a legislative director on an environmental advocacy campaign where I met with countless senators, representatives, and other high-ranking government officials to push for cleaner environmental standards. At Stanford, I continue to take advanced courses in current events and political affairs, and I partake in several civics-related clubs and events on campus. I pride myself on being able to explain, teach, and discuss complicated political issues from a strictly unbiased and nonpartisan lens.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAs a mentor for your child, I can guarantee one thing – I will make my teaching as immersive and engaging as can be. If I am tasked with teaching your child engineering, I can promise that your child and I will be creating fun engineering projects from scratch. If I am tasked with teaching your child civics and government, I’ll make sure to engage your child in challenging and thought-provoking questions that might not necessarily have the right answer. Even if I am tasked with teaching your child foundational academics like math or science, I can guarantee that I’ll be relating abstract concepts to real-world applications so that your child can see for themselves how math and science play into their everyday lives. I personally never learned very well from sitting in hour-long lectures with a rambling instructor – my most formative learning experiences were all from actively doing, not passively listening. I understand that is the best way to learn, and that is how I aim to teach.\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"wkI4vLlCyO9fSG8EHIv0056D01aAlTk8M7ta5L7OES4vM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI have gotten the fantastic opportunity to work in the Stanford Robotics Lab – one of the leading robotics labs in the world! As the only undergraduate in the lab, I am constantly being pushed to rapidly learn new skills and implement ideas with precision. Over the past 8 months I have spent in the lab, I have learned more than I ever thought possible; I have built a camera that is used by an underwater robot that explored the depths of the Mediterranean Sea, I have designed components on new cutting-edge robotic arms, and so much more.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eSee my lab's work at:\u003c/p\u003e\u003cp\u003ehttps://manips.sites.stanford.edu \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"9d01f587-3f17-46f6-9c0f-3cf450284eeb\"}"},{"__ref":"Favorites:{\"uuid\":\"c165c6a2-09ab-4895-b8ac-e7d55896a439\"}"},{"__ref":"Favorites:{\"uuid\":\"e3e9d32c-0c97-42ba-836b-152f403bce34\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5b0999d7-a70a-4a6b-8f57-3c3c55b14213\"}"}],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"767a957b-715b-486b-a86e-c109a8ead8f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"a5783f34-bfa7-403f-8c02-23e5880ae05e\"}"},{"__ref":"DeepDives:{\"uuid\":\"837593ea-efdc-4e84-a126-3ceef193106b\"}"},{"__ref":"DeepDives:{\"uuid\":\"59dffe75-69fe-4160-95df-d6a7cd3a3a4a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/18b4c030-73c6-4680-9d1c-3783601cbf3c/-/preview/-/format/jpg/","https://ucarecdn.com/ac88a54a-28fb-4c70-a2f0-1aced84072ca/-/preview/-/format/jpg/","https://ucarecdn.com/cc4729b5-6c2f-44e5-912e-e5a6a2721836/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"06d793b7-6361-4b19-bc35-83e12c1b3378\"}"},{"__ref":"Education:{\"uuid\":\"fd537073-0e45-4a2a-af0e-58e92ad34364\"}"}],"hiredAt":"2023-07-06T20:01:05.875Z","topics":["Journalism","6-8 Grade Science","Ro
