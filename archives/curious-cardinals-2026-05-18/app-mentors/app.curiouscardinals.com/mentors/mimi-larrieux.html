xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"bc14d538-72b3-459f-b1bb-9b72480e1aa4\"}":{"__typename":"DeepDives","uuid":"bc14d538-72b3-459f-b1bb-9b72480e1aa4","content":null,"videoPlaybackId":"romgMU4AoXnX3DzXi02Mlkpe6UEEOhx02wXjqgc81BphU","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"2244232f-a186-48b2-a5f9-c69b9a265eca\"}":{"__typename":"DeepDives","uuid":"2244232f-a186-48b2-a5f9-c69b9a265eca","content":"\u003cp\u003eMy identity as a Haitian-American woman is extremely impactful when it comes to my teaching style, simply because it had a large impact on my personal development and where I am today. Growing up as a women in STEM in predominately homogenous spaces, I often found myself combatting imposter syndrome and struggled to find solutions on my own. Steadfastly independent in all regards this was a difficult reality to come to terms with. It was not until I found my first mentor that I learned how to approach these new challenges with unwavering confidence and resilience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy mentors instilled in me the confidence necessary to tackle new challenges and pursue my dreams no matter how outside of the box, simply through creating a support system that I could always rely on both academically and personally. Having someone in your corner, always there to motivate and support you at the intersection of these two disciplines made a world of difference for me and allowed me to flourish from high school to present. This support system forms the foundation of my philosophy as a mentor, and i've been so grateful to witness my mentees from undergraduate extracurriculars to my students at Stanford continue to tackle new obstacles head on with myself and their family in their corner.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"d6deec07-b150-462f-82a4-b0b4c97b420c\"}":{"__typename":"DeepDives","uuid":"d6deec07-b150-462f-82a4-b0b4c97b420c","content":"\u003cp\u003eThe answer to this question is two fold - \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, i'm so proud that I've been granted the opportunity to pursue my Master's degree in Mechanical at Stanford on a full scholarship, while serving as a Teaching Assistant through my tenure here. The decision to double major in undergrad while trying to balance my extracurriculars was widely regarded as unwise by my peers, but I was determined to pursue all of my interests and that the intersection of the two degrees would position me perfectly to design innovative technology that would positively impact global health.\u003cbr\u003e\u003cbr\u003eAthletically, finding my way overseas as a professional volleyball player after only playing one year in the NCAA at the D3 level was quite a feat. Even after being told no so many times by coaches and other individuals, I was determined to continue fostering my love for the game and use that same determination that has made me so successful in the classroom on the court. A great lesson in never giving up and creating your own opportunities, it's an accomplishment that still amazes me to this day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"aa74f802-68c1-4561-96a9-f37bd136179b\"}":{"__typename":"DeepDives","uuid":"aa74f802-68c1-4561-96a9-f37bd136179b","content":null,"videoPlaybackId":"St536d7VFXAuvt99JIB36XOKRjE85iiZzOjZ02Aaouc00","question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"d337d3ad-d584-4d73-a888-a7ea53043fcf\"}":{"__typename":"School","uuid":"d337d3ad-d584-4d73-a888-a7ea53043fcf","name":"Middlesex School","city":"Concord","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01742"},"Education:{\"uuid\":\"a8702e15-abba-4c75-8706-5f50b17279d5\"}":{"__typename":"Education","uuid":"a8702e15-abba-4c75-8706-5f50b17279d5","school":{"__ref":"School:{\"uuid\":\"d337d3ad-d584-4d73-a888-a7ea53043fcf\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"c6ffe84f-d566-403f-8cf0-b2888b110715\"}":{"__typename":"Education","uuid":"c6ffe84f-d566-403f-8cf0-b2888b110715","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Biomedical Engineering and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"b49404c4-dd9b-452c-8128-6f8bc7a4f875\"}":{"__typename":"MentorPublicProfile","uuid":"b49404c4-dd9b-452c-8128-6f8bc7a4f875","displayName":"Mimi L.","slug":"mimi-larrieux","biography":"\u003cp\u003eHello! My name is Mimi and i'm an Engineer, Professional Athlete, Baking Enthusiast and proud Hatian-American.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy journey to this point has been nothing short of unique, so i'll do my best to give you a succinct glimpse into the experiences that have shaped me and how it's made me so passionate about mentorship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI started off attending a boarding high school in New England - it sounds peculiar to some but it's actually pretty common where i'm from. There I learned quickly that I had a love for all things STEM, while also developing a deep appreciation for writing as instilled by my school's unique and renowned required program. Moving to college, I knew I wanted to pursue a degree in Engineering with a focus on global health, but I was still balancing my love for volleyball and a curiosity for computer science. Combining these interests, I was able to graduate \u003cem\u003emagna cum laude\u003c/em\u003e with degrees in Biomedical Engineering (Tau Beta Pi member and BME Design Fellow) and Computer Science while continuing to participate in volleyball both at my university and off campus. In the process, I interned at companies including Meta, Microsoft, and Edwards Lifesciences.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter graduating I enrolled at Stanford to pursue a Master's degree in Mechanical Engineering (concentrations in Manufacturing and Product Realization, Biomechanical Engineering, and Design Methodology), as I felt I was missing some of the machining and end to end design process experience necessary to  create the products I dreamed of developing made an impact on global health in the developing world. Following an impactful first year in my program, I decided to take a step back to pursue my another passion while I was still physically able - I signed contracts to play volleyball professionally in Austria and Portugal. These experiences not only introduced me to new cultures through the countries I resided in and other foreign teammates, but also strengthened my resolve when it came to understanding the tools necessary to make the positive impact through innovation and design that i've always dreamed of.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOf course I could go on about my past experiences and my future plans, but the reality is that none of this would have been possible if it wasn't for the mentors that I has found along the way. These individuals instilled in me the confidence necessary to go after my dreams, pushed me while providing support both academically and athletically, and provided the security necessary for me to boldly and a unapologetically investigate my interests.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy journey is far from over, and I hope to share the tools i've acquired along the way with more students interested in paving their own path and gaining the confidence necessary to become meaningful contributors in any space they desire. From balancing a heavy course-load with extracurriculars to academic support navigating writing projects to more challenging STEM courses, I can't wait to continue my mentorship journey beyond my students at Stanford to the next generation of innovators and go-getters!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"ZpsPf2NmcIVulD4XOkJmshAEzsmufqToPWyTHCIl1hM","teachingVideoDescription":null,"greatestAchievement":"\u003cbr\u003e","favorites":[],"causesSupported":[],"major":"Biomedical Engineering and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bc14d538-72b3-459f-b1bb-9b72480e1aa4\"}"},{"__ref":"DeepDives:{\"uuid\":\"2244232f-a186-48b2-a5f9-c69b9a265eca\"}"},{"__ref":"DeepDives:{\"uuid\":\"d6deec07-b150-462f-82a4-b0b4c97b420c\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa74f802-68c1-4561-96a9-f37bd136179b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c691f2ee-ed1c-49ca-95ba-9b3ae1815fee/-/preview/-/format/jpg/","https://ucarecdn.com/05b3989a-01a2-4622-8fa4-223068747e05/-/preview/-/format/jpg/","https://ucarecdn.com/fe636c53-5643-469c-9aa3-3b8ec0dc5775/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a8702e15-abba-4c75-8706-5f50b17279d5\"}"},{"__ref":"Education:{\"uuid\":\"c6ffe84f-d566-403f-8cf0-b2888b110715\"}"}],"hiredAt":"2025-05-30T10:57:00.275Z","topics":["Calculus","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Physics","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Computer Science","K-6 Storybook","Sports Journalism","Business / Entrepreneurship","Coding / Programming","Medicine / Health","Sports Analytics","Robotics / Electronics / CAD","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c942d968-716c-4352-9dd1-9c8441a54458/","https://ucarecdn.com/4d492211-7b83-4aa5-a016-8991edde1bb6/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mimi-larrieux\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b49404c4-dd9b-452c-8128-6f8bc7a4f875\"}"}}},"_sentryTraceData":"e737fdd2f9364726b6dee2882f78137c-9d587cf0d3075c8d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e737fdd2f9364726b6dee2882f78137c,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page
