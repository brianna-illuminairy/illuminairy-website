xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"d8e274d3-909d-4912-8288-6b620ee0649f\"}":{"__typename":"DeepDives","uuid":"d8e274d3-909d-4912-8288-6b620ee0649f","content":"\u003cp\u003eOne of my most meaningful passion projects was my work with the Coalition for Tobacco-Free Kids State Youth Council in Hawaii, where I served as Legislative Spokesperson for four years. What started as an interest in public health policy became a hands-on crash course in grassroots organizing, legislative advocacy, and youth mobilization.\u003c/p\u003e\u003cp\u003eI worked directly with state lawmakers to draft and propose legislation addressing underage substance abuse and tobacco-related products — learning how to translate community needs into policy language that could actually pass. I presented our policy priorities to over 20 lawmakers, neighborhood boards, and community groups, building coalitions and securing endorsements. Beyond the legislative work, I led advocacy workshops for 60+ new recruits, teaching them how to write compelling testimony and speak confidently to decision-makers.\u003c/p\u003e\u003cp\u003eSome of my favorite moments were organizing statewide rallies with 250+ participants each and spearheading an awareness campaign that collected 20,000+ slippers for underserved teens across Hawaii. It taught me that change doesn't just happen in legislative chambers — it requires community engagement, strategic messaging, and persistence.\u003c/p\u003e\u003cp\u003eThis project shaped how I approach my work today. It showed me that policy isn't abstract — it's a tool that directly impacts people's lives. And it reinforced my belief that young people don't need to wait until they're \"qualified\" to create change; they just need to care enough to show up and do the work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"483eee0b-9ff2-47a0-bd69-231c410cb289\"}":{"__typename":"DeepDives","uuid":"483eee0b-9ff2-47a0-bd69-231c410cb289","content":"\u003cp\u003eIn my free time, I love cafe-hopping to try yummy drinks and pastries, listening to pop punk and true crime podcasts, playing Monopoly Deal with friends, stargazing at the beach, and staying active through running and hiking!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f63e18ad-d8be-4ffd-b01f-202e27056645\"}":{"__typename":"School","uuid":"f63e18ad-d8be-4ffd-b01f-202e27056645","name":"Punahou School","city":"Honolulu","type":"HIGH","state":"Hawaii","country":"United States","zip":"96822"},"Education:{\"uuid\":\"358a6af0-b39c-4a5e-a5c7-14b14cbf1540\"}":{"__typename":"Education","uuid":"358a6af0-b39c-4a5e-a5c7-14b14cbf1540","school":{"__ref":"School:{\"uuid\":\"f63e18ad-d8be-4ffd-b01f-202e27056645\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"d6612d8a-0982-4c10-be28-9d056ebf2fb8\"}":{"__typename":"Education","uuid":"d6612d8a-0982-4c10-be28-9d056ebf2fb8","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Global Affairs, minors in Global Health Studies, Statistics \u0026 Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"9b96ea52-1073-4cf0-a764-2f7a1983f88c\"}":{"__typename":"MentorPublicProfile","uuid":"9b96ea52-1073-4cf0-a764-2f7a1983f88c","displayName":"Zoey D.","slug":"zoey-duan","biography":"\u003cp\u003eHi! I'm Zoey, a senior at Yale University majoring in Global Affairs with certificates (minor equivalents) in Global Health Studies and Statistics \u0026amp; Data Science. I'm passionate about helping students translate their curiosity into intellectual growth and meaningful projects that showcase prepare them for future opportunities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I started college, I knew I cared about policy, health equity, and social impact — but I didn't know how to turn those interests into tangible research experiences and career pathways. At Yale, I've found ways to do just that:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eServed as board member and Quality Improvement department director HAVEN Free Clinic, Yale's student-run primary care clinic that serves 600+ local uninsured patients\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWorked with non-profit think tank on research at the nexus of AI and climate change, investigating distributional impacts of AI and data center development in LMICs, publishing policy paper and presenting to 8+ research conferences and organizations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExplored research in biochemistry, infectious disease, health economics, clinical models, qualitative analysis, and more, working with institutions like Johns Hopkins Medicine, Yale School of Medicine, Yale School of Public Health, and more!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOrganized and headed large-scale international educational (Model United Nations) conferences for high school students in Taiwan, Korea, and South Asia\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI love showing students different ways to engage in not only their local communities, but also the world! In doing so, they can deepen their passions and find a career that is not only exciting but also meaningful.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I'm qualified to help\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWith 5+ years of experience in mentorship and tutoring, I am not only comfortable working students from a wide range of age groups and backgrounds, but I am also well-versed in pedagogy that uses evidence-driven, empathy-first approaches. From providing private lessons that helped to jumpstart learning in advanced classes to guiding students through extracurricular projects that have earned national awards, I bring both practical experience and genuine mentorship that generates real results and growth.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI specialize in guiding high school and college students through:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects: \u003c/strong\u003estarting a club or nonprofit, designing research proposals, finding mentors, disseminating work across platforms\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTest prep: \u003c/strong\u003etackling SSAT, P-SAT, SAT, and AP-subject tests, creating study plans, practicing with evidence-based strategies\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege and scholarship applications: \u003c/strong\u003eunderstanding fit, crafting compelling narratives for competitive programs and colleges\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTechnical skills building\u003c/strong\u003e: statistical programming, data analysis, video editing, web design, other professional skill development\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic guidance\u003c/strong\u003e: math, writing, english, history, foreign languages, etc.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might involve:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTrying and practicing different learning and studying techniques that help students not only \u003cem\u003ewhat\u003c/em\u003e to learn, but also \u003cem\u003ehow\u003c/em\u003e to learn\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming research questions that align with your interests and available resources\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a strategic timeline for applications, projects, or skill development\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReviewing and strengthening essays, research proposals, or CVs with specific, actionable feedback\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you're excited to explore the world, develop meaningful projects, and build confidence in your academic journey, I'd love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"oRUo00xLeJJsKXe9QqIUVbzrLMizn006JEYSzv9czTKAI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Global Affairs, minors in Global Health Studies, Statistics \u0026 Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d8e274d3-909d-4912-8288-6b620ee0649f\"}"},{"__ref":"DeepDives:{\"uuid\":\"483eee0b-9ff2-47a0-bd69-231c410cb289\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/09617a51-9be6-45d2-a2a7-0503a445a555/-/preview/-/format/jpg/","https://ucarecdn.com/46f344b3-9f57-4e77-bdba-2422123dbd1f/-/preview/-/format/jpg/","https://ucarecdn.com/2344a5a0-b22d-4929-8081-16cfc9284967/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"358a6af0-b39c-4a5e-a5c7-14b14cbf1540\"}"},{"__ref":"Education:{\"uuid\":\"d6612d8a-0982-4c10-be28-9d056ebf2fb8\"}"}],"hiredAt":"2026-02-03T01:55:52.699Z","topics":["Statistics","Geometry","Algebra I","Algebra II","Pre-Algebra","K-5 Grade Math","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Biology","Writing","Mandarin Chinese","Japanese","Economics","Reading","College Essay Writing","Executive Function","Academic Coaching","History","K-6 Storybook","Creative Writing","History Project","Video / Photography","Business / Entrepreneurship","Medicine / Health","Web Design","STEM Project","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"zoey-duan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9b96ea52-1073-4cf0-a764-2f7a1983f88c\"}"}}},"_sentryTraceData":"84e17bfbf7c441b08fb531fd01e2dc04-a7f2393ff984e301-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=84e17bfbf7c441b08fb531fd01e2dc04,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/men
