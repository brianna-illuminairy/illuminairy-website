xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"b88e35c6-a986-4d58-bbfa-f554da43dce3\"}":{"__typename":"CausesSupported","uuid":"b88e35c6-a986-4d58-bbfa-f554da43dce3","name":"Wise Readers to Leaders","description":"\u003cp\u003eWorked as a mentor and volunteer for four years and over summers! \u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"50d67321-22e9-482e-a6a4-6ecd4a7ca528\"}":{"__typename":"CausesSupported","uuid":"50d67321-22e9-482e-a6a4-6ecd4a7ca528","name":"Stand With Us","description":"\u003cp\u003eRaised awareness to fight antisemitism as intern and teen leader.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/103c9063-891e-4a3b-8f99-38357940eaaf/"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d43704f3-4b27-4442-b50b-f73c8acaadc2\"}":{"__typename":"DeepDives","uuid":"d43704f3-4b27-4442-b50b-f73c8acaadc2","content":"\u003cp\u003eWhen I was in high school, I did a variety of things over the summer, each year depending on what I was passionate about and interested in. I worked at Summer at Brentwood, my school's summer camp, as a tennis coach for a few weeks and taught private and group tennis lessons. I took an online class at Santa Monica Community College because I wanted to learn internet programming in a relaxed way (and they didn't offer it at my school). I worked as an executive assistant in a real estate office and as a mentor for students from underserved communities trough Wise Readers to Leaders, a nonprofit. I trained with my varsity tennis team all of August to get ready for the season, and caught up on reading all the books I didn't get he chance to read during the busy months of school. But, most importantly, I travelled with my family, spent time with my friends, and finally caught up on much needed rest and relaxation that I lacked during the year. Spending time doing all my activities was incredible, but I am so grateful that I let myself adventure and enjoy during the summers too!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"44b76313-5cfb-4ef5-9cd9-5a4ab6b71084\"}":{"__typename":"DeepDives","uuid":"44b76313-5cfb-4ef5-9cd9-5a4ab6b71084","content":"\u003cp\u003eI chose my major because I was fascinated by the opportunity to use two different parts of my brain to study fields that have so many differences, but that overlap so seamlessly. Being able to get a degree from USC's Marshall School of Business and Viterbi School of Engineering at the same time in this first cohort of AI for Business students is special because I am exposed to people who are so unique from one another, and I am surrounded by kids even more driven than myself who inspire me everyday. I am able to take classes in computer science and business at the same time and hear from guest speakers who come directly from both fields. I never thought I would be an engineer, but with the surfacing of AI in almost every field, I jumped at the chance to actually be at the forefront of the creation and ethical use of this technology. I love my major because I know I will graduate equipped with the skills to go into any field I want and I will not be restricted to just one skill set or job. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"88fd88a5-b93b-4414-84af-e7a09b00584c\"}":{"__typename":"DeepDives","uuid":"88fd88a5-b93b-4414-84af-e7a09b00584c","content":"\u003cp\u003eGrowing up at a rigorous private school in LA, there were many instances where I struggled to balance academics, friends, athletics, and every other expectation placed on me. Having my older sister as a mentor for me to talk to and get advice from made my experience navigating high school and applying to college so much better, so every time I have had the opportunity to mentor younger students, I have found it fulfilling to watch them grow and find success. Being a mentor is important to me because I know that I can not only help a student academically or with starting a project, but I can also just be a person my mentee can come to for life advice and connect with when things get tough. I am always just a phone call or text away! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"6a7fde35-430c-4489-a9ea-6e671a50b494\"}":{"__typename":"DeepDives","uuid":"6a7fde35-430c-4489-a9ea-6e671a50b494","content":"\u003cp\u003eDuring my middle and high school years, I spent a lot of time doing such a variety of different activities including tennis, community service with Stand with Us and Wise Readers to Leaders, mentoring at Brentwood school, and tons of classes that I never thought I would take. I was very outgoing and said yes to most of the opportunities that came my way. I randomly signed up for AP computer science in ninth grade because my eighth grade science teacher thought I would like it, and now half of my degree in college is going to be from computer science work! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"be122fc4-dcc7-46d5-97e7-786a8bd73446\"}":{"__typename":"School","uuid":"be122fc4-dcc7-46d5-97e7-786a8bd73446","name":"Brentwood School, East Campus","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90049"},"Education:{\"uuid\":\"b053460b-2d59-4013-95af-369e3f1bac2e\"}":{"__typename":"Education","uuid":"b053460b-2d59-4013-95af-369e3f1bac2e","school":{"__ref":"School:{\"uuid\":\"be122fc4-dcc7-46d5-97e7-786a8bd73446\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"09f862cd-8678-43e3-b443-d887f4913dfd\"}":{"__typename":"Education","uuid":"09f862cd-8678-43e3-b443-d887f4913dfd","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Artificial Intelligence for Business","degree":null},"MentorPublicProfile:{\"uuid\":\"42dc9570-c2c3-4521-a9f7-a6ca2112e59e\"}":{"__typename":"MentorPublicProfile","uuid":"42dc9570-c2c3-4521-a9f7-a6ca2112e59e","displayName":"Bella Y.","slug":"bella-yadegar","biography":"\u003cp\u003eHi, I'm Bella! I'm a social and committed Artificial Intelligence for Business student at the University of Southern California which means I study in both the business and engineering schools. I love my major because I am able to take classes that vary from computer science to economics to the ethical usage of AI. I am passionate about learning through hands-on experience and am the recruitment chair of a business club, TAMID, which consults with startups in Israel. I love to try out different approaches to problems and spend time figuring out creative ways to make my projects viable. I am also passionate about equal opportunity in STEM and spent two years as president of Girls Who Code in high school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also love spending time with my friends and family and playing tennis or going for a run after class. I know school can be stressful, but I'm here to help, and together, I know we can make it seem manageable. I have experience working with kids of elementary age to high school age, teaching them tennis and mentoring them, but also teaching different academic subjects including math and economics. To me, success means overall happiness, achievement, and contentment with our lives. I have been so lucky to accomplish my academic and personal goals thus far, and I am here to make sure you do the same!\u003c/p\u003e","teachingVideoPlaybackId":"KcRDksmbzfuwM7DGcjD2ZD9RRbZRZ2QSbhfiMLRokTw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b88e35c6-a986-4d58-bbfa-f554da43dce3\"}"},{"__ref":"CausesSupported:{\"uuid\":\"50d67321-22e9-482e-a6a4-6ecd4a7ca528\"}"}],"major":"Artificial Intelligence for Business","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d43704f3-4b27-4442-b50b-f73c8acaadc2\"}"},{"__ref":"DeepDives:{\"uuid\":\"44b76313-5cfb-4ef5-9cd9-5a4ab6b71084\"}"},{"__ref":"DeepDives:{\"uuid\":\"88fd88a5-b93b-4414-84af-e7a09b00584c\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a7fde35-430c-4489-a9ea-6e671a50b494\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6bd88b85-27e2-4a23-8653-db985e80867a/-/preview/-/format/jpg/","https://ucarecdn.com/8d1c6c39-cc50-4d83-87dc-5b21e86ac42f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","educati
