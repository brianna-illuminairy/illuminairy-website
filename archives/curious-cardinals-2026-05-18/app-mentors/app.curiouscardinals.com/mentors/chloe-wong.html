xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"54372af1-30bf-46f6-9e89-7141190521b2\"}":{"__typename":"DeepDives","uuid":"54372af1-30bf-46f6-9e89-7141190521b2","content":"\u003cp\u003eEven though I’m pursuing a career in healthcare, mentorship has always been one of the most meaningful parts of what I do. I’m fascinated by how people learn and think, which is actually what led me to study cognitive science at Barnard. Mentorship allows me to apply that interest in a very real way by helping students build confidence, curiosity, and better ways of learning.\u003c/p\u003e\u003cp\u003eWhen I was younger, having mentors who encouraged curiosity and big questions made a huge difference in how I approached school and my future. I see mentorship as a chance to provide that same kind of guidance for students — not just helping them get through homework, but helping them understand how to think, explore interests, and navigate challenges.\u003c/p\u003e\u003cp\u003eI especially enjoy working with middle and high school students because it’s such an important time for developing confidence and intellectual curiosity. Students often start to form beliefs about what they are “good at,” and having the right support can completely change how they see themselves as learners.\u003c/p\u003e\u003cp\u003eEven as I juggle my path toward healthcare and other projects, mentorship is something I intentionally make time for because I find it genuinely rewarding. Helping students connect ideas, ask better questions, and realize their potential is incredibly fulfilling, and it’s a privilege to be part of that process.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"1c1e6036-c2df-4cca-9cdf-876eef031e4e\"}":{"__typename":"School","uuid":"1c1e6036-c2df-4cca-9cdf-876eef031e4e","name":"Flintridge Sacred Heart Academy","city":"La Cañada Flintridge","type":"HIGH","state":"California","country":"United States","zip":"91011"},"Education:{\"uuid\":\"d3f6374f-af4c-4a10-8c61-a1e873cac399\"}":{"__typename":"Education","uuid":"d3f6374f-af4c-4a10-8c61-a1e873cac399","school":{"__ref":"School:{\"uuid\":\"1c1e6036-c2df-4cca-9cdf-876eef031e4e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}":{"__typename":"School","uuid":"67d96877-4245-4f9b-a557-94f9ecabd290","name":"Barnard College","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"b2d3c8c2-6bd2-4976-8482-87ce85e6de31\"}":{"__typename":"Education","uuid":"b2d3c8c2-6bd2-4976-8482-87ce85e6de31","school":{"__ref":"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"365399da-ba36-4954-bfd3-cca6905af7a6\"}":{"__typename":"MentorPublicProfile","uuid":"365399da-ba36-4954-bfd3-cca6905af7a6","displayName":"Chloe W.","slug":"chloe-wong","biography":"\u003cp\u003eHi! I’m Chloe, a graduate of Barnard College at Columbia University where I studied Cognitive Science with a concentration in psychology and decision science. My academic interests focus on how people think, learn, and make decisions, especially at the intersection of neuroscience, behavioral science, and emerging technologies like artificial intelligence. I’ve always been fascinated by how the brain works and how understanding our thinking patterns can help students learn more effectively and confidently.\u003c/p\u003e\u003cp\u003eI love working with middle and high school students not just as a tutor, but as a mentor who helps them develop confidence, curiosity, and strong thinking skills. My goal in sessions is to help students understand \u003cem\u003ehow to learn\u003c/em\u003e, not just what to memorize. Many students feel overwhelmed by information in school, so I focus on helping them build systems for thinking clearly, approaching complex problems step by step, and becoming more independent learners.\u003c/p\u003e\u003cp\u003eBecause of my background in cognitive science, I often incorporate insights from brain science and learning research into mentoring. We explore questions like how memory works, why certain study strategies are more effective than others, and how habits and mindset influence academic performance. I also enjoy introducing students to big ideas in neuroscience, psychology, and artificial intelligence in ways that spark curiosity and connect what they are learning in school to the real world. Many students find it exciting to see how topics like brain science, AI, and human behavior are shaping the future.\u003c/p\u003e\u003cp\u003eOutside of academics, I’ve worked in research environments, healthcare settings, and early-stage startup communities in New York. These experiences help me show students how subjects like science, psychology, and technology translate into real careers and real-world impact. I especially enjoy mentoring students who are curious about STEM, healthcare, entrepreneurship, or exploring interdisciplinary ideas about the future of technology and society.\u003c/p\u003e\u003cp\u003eMy mentoring style is supportive, thoughtful, and highly personalized. Some students want help building stronger study habits and confidence in challenging classes, while others want to explore advanced ideas in neuroscience, psychology, or AI. My goal is to create sessions that feel collaborative, motivating, and intellectually exciting while helping students grow into curious, independent thinkers.\u003c/p\u003e","teachingVideoPlaybackId":"B2ZxTdL36L9Se5b4p8ejEWzbB003eW36UQPUGS6i5Nsg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne experience I’m particularly proud of was completing my degree in Cognitive Science at Barnard College while actively exploring how to apply what I was learning beyond the classroom. Cognitive science is an interdisciplinary field that combines psychology, neuroscience, and decision science to understand how people think and learn, and studying it changed the way I approach both learning and mentoring.\u003c/p\u003e\u003cp\u003eDuring my time at Barnard and Columbia, I became especially interested in how insights from brain science and behavioral research could help people learn more effectively. I sought out opportunities in research, healthcare environments, and mentoring settings where I could see these ideas applied in real life. Being able to translate complex ideas about how the brain works into something practical and understandable for others is something I care deeply about.\u003c/p\u003e\u003cp\u003eWhat I’m most proud of is how I’ve taken those experiences and used them to support other students. Mentorship allows me to share strategies that make learning less intimidating and more empowering. For example, helping students understand how memory works, how to approach challenging subjects step by step, or how to build confidence in areas they once felt discouraged by.\u003c/p\u003e\u003cp\u003eMore broadly, I’m proud of building a path that connects my interests in science, mentorship, and real-world impact. Whether it’s through mentoring students, working in healthcare environments, or exploring new technologies like AI that shape how people learn and make decisions, I’m excited by opportunities to help others think more clearly and grow intellectually.\u003c/p\u003e\u003cp\u003eFor me, the most rewarding part is seeing a student begin to believe in their ability to understand something that once felt impossible. Moments like that remind me why mentorship and education are so powerful.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"54372af1-30bf-46f6-9e89-7141190521b2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/53fc422e-aeb9-4032-8ef9-05137553d025/-/preview/-/format/jpg/","https://ucarecdn.com/cdb8f829-0c31-4d05-8eb6-83533cb97c0f/-/preview/-/format/jpg/","https://ucarecdn.com/c0d3893d-c939-4261-b011-b711397596e3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d3f6374f-af4c-4a10-8c61-a1e873cac399\"}"},{"__ref":"Education:{\"uuid\":\"b2d3c8c2-6bd2-4976-8482-87ce85e6de31\"}"}],"hiredAt":"2026-03-12T01:49:42.302Z","topics":["K-5 Grade Math","Biology","6-8 Grade Science","Writing","Mandarin Chinese","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Creative Writing","Fashion / Cosmetics","Film / Theater","Sports Journalism","Business / Entrepreneurship","Medicine / Health","Machine Learning / AI","Law / Government / Policy","Public Speaking","Journalism","Sustainability","Debate"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"chloe-wong\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"365399da-ba36-4954-bfd3-cca6905af7a6\"}"}}},"_sentryTraceData":"e66bd30c65ec4b91bd72d84e5359952e-817a821422229e6b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e66bd30c65ec4b91bd72d84e5359952e,sentry-sample_rate=0.
