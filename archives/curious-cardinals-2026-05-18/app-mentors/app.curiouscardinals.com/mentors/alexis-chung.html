xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e718e542-3048-4b0f-8c0a-51159470135a\"}":{"__typename":"Favorites","uuid":"e718e542-3048-4b0f-8c0a-51159470135a","photoUrl":"https://ucarecdn.com/92b0752b-c584-4e6d-b121-3cfbbbf1f368/","title":"Vince Staples by Vince Staples","type":"ALBUM"},"Favorites:{\"uuid\":\"8c33f1dd-5959-4df8-a55c-dcb5f286c050\"}":{"__typename":"Favorites","uuid":"8c33f1dd-5959-4df8-a55c-dcb5f286c050","photoUrl":"https://ucarecdn.com/344540c3-0813-4955-a61a-8090cc4cca51/","title":"Booksmart","type":"MOVIE"},"Favorites:{\"uuid\":\"7fec6314-79a4-42b5-becf-2bcce46bdea0\"}":{"__typename":"Favorites","uuid":"7fec6314-79a4-42b5-becf-2bcce46bdea0","photoUrl":"https://ucarecdn.com/a9f13f5b-4180-48d0-bb89-4ce7ebb92249/","title":"San Francisco","type":"CITY"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c359a0e5-af47-4d4f-a196-bb3ca734c573\"}":{"__typename":"DeepDives","uuid":"c359a0e5-af47-4d4f-a196-bb3ca734c573","content":"\u003cp\u003eIt's become very apparent to me that the barrier to entry to colleges and corporations can be lowered with the right access to people who can provide relevant information about the admissions process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe same can be said for things like personal finance, essay writing, and executive function coaching - a student's ability to excel in these subjects has a direct correlation with whether they are in spaces that give them access to those who have excelled previously. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about providing this kind of access to my students, and have a deep desire to share the information and knowledge that I have collected over the years into the subjects that interest me most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8239bc23-473d-4020-9762-bd304f9e327c\"}":{"__typename":"DeepDives","uuid":"8239bc23-473d-4020-9762-bd304f9e327c","content":"\u003cp\u003eI love my hobbies! They are what I am most passionate about in life. My two main ones are:\u003c/p\u003e\u003cbr\u003e\u003cp\u003e1) Music (I play piano, electric guitar, I also DJ, and I am learning how to play the drums this year!)\u003c/p\u003e\u003cp\u003e2) Sports (I longboard, snowboard, rollerblade, play pickleball, take dance classes, and I am very passionate about ping pong (lol))\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d3d13a71-54bd-4ed6-a1b9-f1cd509463fe\"}":{"__typename":"DeepDives","uuid":"d3d13a71-54bd-4ed6-a1b9-f1cd509463fe","content":"\u003cp\u003eI was super angsty!! I had a lot of big feelings that I was experiencing for the first time that I didn't know what to do with. I definitely carried that \"no one understands me\" energy. Looking back, I wish I was kinder to myself and didn't put so much pressure on my shoulders. I was definitely a perfectionist and threw myself into my studies and extracurriculars, resulting in my mental health being sacrificed. While I believe in hard work and dedication, I also don't believe in sacrificing one's mental health for the sake of an achievement. With my mentees, I definitely will prioritize a healthy mind in addition to mentorship, as I've experienced first-hand what it feels like to neglect that. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a4799d2b-b448-439a-aea1-dee1b174b9de\"}":{"__typename":"DeepDives","uuid":"a4799d2b-b448-439a-aea1-dee1b174b9de","content":"\u003cp\u003eI've been an avid journal-er for around 4 years now.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt the beginning of each year I write a page with my goals for the year, and document month by month my progress and any significant events that occurred. I'll also add daily journal entries to capture how I'm feeling and thinking at the current moment. My favorite part is when the year ends and I create a year in review section where I consolidate all the major events, accomplishments, travels, and life moments that occurred in the past year.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm able to open up my collection of journals now and see exactly what I was feeling, thinking, and working towards in the past and it's been a great way to document my 20s.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"82bdc911-603b-43c1-b1d3-b63e93a0afaf\"}":{"__typename":"Education","uuid":"82bdc911-603b-43c1-b1d3-b63e93a0afaf","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"International Development Studies","degree":null},"School:{\"uuid\":\"a898bb92-2553-487b-bac2-5bbf69f4debc\"}":{"__typename":"School","uuid":"a898bb92-2553-487b-bac2-5bbf69f4debc","name":"Orange County School of the Arts","city":"Santa Ana","type":"HIGH","state":"California","country":"United States","zip":"92701"},"Education:{\"uuid\":\"0701ff9e-912f-4d13-b7f6-8d16aea393a1\"}":{"__typename":"Education","uuid":"0701ff9e-912f-4d13-b7f6-8d16aea393a1","school":{"__ref":"School:{\"uuid\":\"a898bb92-2553-487b-bac2-5bbf69f4debc\"}"},"startYear":"2014","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"329c82b8-0f19-454b-bc11-a7334380b7df\"}":{"__typename":"MentorPublicProfile","uuid":"329c82b8-0f19-454b-bc11-a7334380b7df","displayName":"Alexis C.","slug":"alexis-chung","biography":"\u003cp\u003eHi! I'm Alexis - I'm currently a PMM @ Google working on growth for Pixel. I'm a previous UCLA grad and attended OCSA for film and television in high school!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm Korean American and grew up in Southern California for the majority of my life. I was a super emotional and angsty teenager and felt really lost and confused during my adolescence. I wish I had someone to guide me and reassure me during this part of my life and I hope to be that person for my mentees. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI definitely have a creative/musical streak to me - I have spent a lot of my time singing in choirs, playing electric guitar, and recording my mixes on my DJ decks. I also interned in the film \u0026amp; music industries throughout college and have a big appreciation for the entertainment industry. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm really looking forward to guiding my mentees in many areas - whether it be college applications, writing, video editing, music, investing, etc., I am really excited to get to know my mentees on a personal level and help unlock their goals. Let's chat!\u003c/p\u003e","teachingVideoPlaybackId":"wgAmrSYQF9wpYAjfrxqcAGaDZvKnBy5L402eb01px8pIE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThe achievement that I'm most proud of is changing the negative thought patterns that I grew accustomed to during high school. I was a pretty pessimistic teenager and had a very negative outlook on myself and my life, and I realized during my senior year of college that I wanted to change that.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThus began a years-long process of reading as many self-help books as I can, implementing healthy habits like journaling and exercising (and being off my phone!), and practicing gratefulness everyday.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough my self education, I was able to recognize when I was about to start a negative thought loop, eventually stop that loop from occurring, and finally reversing that loop to end in a more positive direction.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm super proud to say that today I consider myself an optimist - I genuinely believe that life is beautiful and comes with so many opportunities to connect, learn, and grow. Changing the way that I think has brought me a profound sense of confidence and resilience, and it excites me to bring these attributes into everything that I do.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e718e542-3048-4b0f-8c0a-51159470135a\"}"},{"__ref":"Favorites:{\"uuid\":\"8c33f1dd-5959-4df8-a55c-dcb5f286c050\"}"},{"__ref":"Favorites:{\"uuid\":\"7fec6314-79a4-42b5-becf-2bcce46bdea0\"}"}],"causesSupported":[],"major":"International Development Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c359a0e5-af47-4d4f-a196-bb3ca734c573\"}"},{"__ref":"DeepDives:{\"uuid\":\"8239bc23-473d-4020-9762-bd304f9e327c\"}"},{"__ref":"DeepDives:{\"uuid\":\"d3d13a71-54bd-4ed6-a1b9-f1cd509463fe\"}"},{"__ref":"DeepDives:{\"uuid\":\"a4799d2b-b448-439a-aea1-dee1b174b9de\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/76b4a302-ff32-47e1-bbad-88d9ba1956d7/-/preview/-/format/jpg/","https://ucarecdn.com/5ce7e9af-bcab-4fad-8220-c2ea027f39a6/-/preview/-/format/jpg/","https://ucarecdn.com/a31ba9d9-66aa-4817-b72c-5ae13c3c872b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"82bdc911-603b-43c1-b1d3-b63e93a0afaf\"}"},{"__ref":"Education:{\"uuid\":\"0701ff9e-912f-4d13-b7f6-8d16aea393a1\"}"}],"hiredAt":"2024-02-22T00:49:38.519Z","topics":["Writing","Executive Function","Academic Coaching","College Essay Writing","Reading","Creative Writing","Music","Video / Photography","Finance / Investing"],"communityBadges":["https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexis-chung\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"329c82b8-0f19-454b-bc11-a7334380b7df\"}"}}},"_sentryTraceData":"ee83d9bccd334490b72b4e729c5680f6-8477c9b973980f5d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ee83d9bccd334490b72b4e729c5680f6,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alexis-chung"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().
