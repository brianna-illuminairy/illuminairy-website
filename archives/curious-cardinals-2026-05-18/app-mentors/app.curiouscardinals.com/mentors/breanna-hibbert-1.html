xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bed178aa-15fd-498c-8ece-fe62dc5a48f6\"}":{"__typename":"DeepDives","uuid":"bed178aa-15fd-498c-8ece-fe62dc5a48f6","content":"\u003cp\u003eI chose Political Science and International Studies because I’ve always been curious about how people, cultures, and governments interact. In college, I wanted a major that would let me ask big questions—like why certain policies succeed in one country but not another, or how history and culture influence political decisions today. These fields pushed me to think critically, compare perspectives, and understand the complexities behind global issues. What I appreciate most is that my majors didn’t just teach me about politics—they gave me frameworks to analyze problems, challenge assumptions, and think about solutions from multiple angles.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3f3767c0-09af-4de3-8239-29198a4f3ca4\"}":{"__typename":"School","uuid":"3f3767c0-09af-4de3-8239-29198a4f3ca4","name":"Glenelg Country School","city":"Ellicott City","type":"HIGH","state":"Maryland","country":"United States","zip":"21042"},"Education:{\"uuid\":\"5c65acd2-afc8-426e-9f96-7504310ec3dd\"}":{"__typename":"Education","uuid":"5c65acd2-afc8-426e-9f96-7504310ec3dd","school":{"__ref":"School:{\"uuid\":\"3f3767c0-09af-4de3-8239-29198a4f3ca4\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"58c809d3-d3e2-4b7e-98b1-801b9a330acc\"}":{"__typename":"Education","uuid":"58c809d3-d3e2-4b7e-98b1-801b9a330acc","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Political Science and International Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"503d339a-6975-4870-b2b3-d9b1d2e5ec52\"}":{"__typename":"MentorPublicProfile","uuid":"503d339a-6975-4870-b2b3-d9b1d2e5ec52","displayName":"Breanna H.","slug":"breanna-hibbert-1","biography":"\u003cp\u003eI recently graduated from Northwestern University with a Bachelor of Arts in Political Science and International Studies. Over the next year, I will be moving to Spain as a Fulbright English Teaching Assistant, where I hope to immerse myself in cross-cultural exchange while deepening my understanding of global education systems. After my time abroad, I plan to attend law school and pursue a career in international human rights law. My long-term goal is to advocate for marginalized communities across borders and help shape policies that promote equity, justice, and human dignity on a global scale.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion for human rights has driven me to seek out a diverse range of professional experiences throughout college. I’ve interned at policy and consulting firms such as McGuireWoods Consulting and Albright Stonebridge Group, gaining insight into government affairs and international strategy. I also became deeply involved in grassroots organizing, advocating for electoral reform through Ranked Choice Voting initiatives. In addition, I conducted legal research on pretrial risk assessment tools, which deepened my interest in justice reform and evidence-based policymaking.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside this work, I’ve built strong mentorship and teaching skills through my engagement with youth. I coached children ages 4–18 as a swim coach, served as a Peer Advisor supporting university students, and most recently, volunteered as an elementary school teacher. These experiences strengthened my ability to lead, adapt, and connect with people across a wide range of ages and backgrounds.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern, I also found community in Swim Club and the Global Engagement Summit, a student-led organization that hosts an annual summit in Chicago for young social entrepreneurs from around the world. Through these roles, I connected with changemakers across cultures, learned about innovative social justice initiatives, and contributed to projects that support community-driven impact. These experiences not only broadened my global perspective but also reinforced my commitment to equity and collaboration.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m a first-generation American with Caribbean roots—my mother is from Guyana and my father is from Jamaica. Growing up in a multicultural household shaped my worldview and made me deeply appreciative of diverse cultures, traditions, and perspectives. I also have a younger brother who recently graduated from high school, and I love spending time with him. Family is incredibly important to me, and my background continues to influence the way I connect with others and approach the world with openness and curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and work, I love to read, especially fantasy and romance novels. My favorite series is \u003cem\u003eThrone of Glass\u003c/em\u003e. I also enjoy traveling; I recently returned from a trip to Southeast Asia that I absolutely loved, and I plan to explore more of Europe in the coming year. These hobbies give me balance, joy, and new perspectives that enrich both my personal and professional life.\u003c/p\u003e","teachingVideoPlaybackId":"cAmuhChjV02FNHSGBdrAb6z2FpZN5IMtfsDDmzeA41x4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Political Science and International Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bed178aa-15fd-498c-8ece-fe62dc5a48f6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/85266224-8d94-4359-915c-fff4179fc942/-/preview/-/format/jpg/","https://ucarecdn.com/311c92c8-6a37-4c02-82d0-226e93a5fcf7/-/preview/-/format/jpg/","https://ucarecdn.com/a0fbc2bf-bc56-4d5f-874c-ce46779c9012/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5c65acd2-afc8-426e-9f96-7504310ec3dd\"}"},{"__ref":"Education:{\"uuid\":\"58c809d3-d3e2-4b7e-98b1-801b9a330acc\"}"}],"hiredAt":"2025-09-13T01:48:39.552Z","topics":["K-5 Grade Math","Writing","Spanish","College Essay Writing","History","Reading","Executive Function","Academic Coaching","Creative Writing","History Project","Law / Government / Policy","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"breanna-hibbert-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"503d339a-6975-4870-b2b3-d9b1d2e5ec52\"}"}}},"_sentryTraceData":"d165389759d0405d8cb669812b0b515d-a3ee6a09045fd10b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d165389759d0405d8cb669812b0b515d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"breanna-hibbert-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerH
