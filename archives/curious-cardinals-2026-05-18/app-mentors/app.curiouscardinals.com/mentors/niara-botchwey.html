xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"eaaeb162-ec5b-4b2e-9406-a22cfc0f4d82\"}":{"__typename":"DeepDives","uuid":"eaaeb162-ec5b-4b2e-9406-a22cfc0f4d82","content":"\u003cp\u003eIn the summer after 9th grade, I worked at a STEAM-focused summer camp for elementary school students. We used creative tools like 3D printing, Minecraft, and team-building games to introduce kids to science and technology in fun, hands-on ways. It was my first real job, and it taught me a lot about patience, responsibility, and how to build trust with younger students. I realized how much I enjoyed helping others feel confident and curious—whether they were learning to code or trying something new on the playground.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStarting the next summer, I joined Georgia Tech’s Project ENGAGES program, where I conducted research on alternative ways to break down fibrin blood clots, a major factor in sickle cell disease complications. My project focused specifically on proteases and their role in clot degradation. Beyond the science, I was learning how to navigate Atlanta on my own, communicate professionally with mentors, plan and run experiments, and manage my time in a demanding, real-world setting.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTogether, these experiences helped me grow both as a scientist and a leader—teaching me how to take initiative, collaborate across age groups, and balance curiosity with responsibility.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"7c31cee3-9a22-4607-b1f3-8221ee32bc7a\"}":{"__typename":"DeepDives","uuid":"7c31cee3-9a22-4607-b1f3-8221ee32bc7a","content":"\u003cp\u003eMentorship has shaped every stage of my life, so choosing to give that back has always felt natural—not like a detour from what I want to do, but a core part of it. I’ve been lucky to have people invest in me early on: researchers who trusted me with experiments at 16, teachers who encouraged my curiosity, and mentors who helped me believe I belonged in spaces where I didn’t always see myself represented.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether I was guiding younger students through college essays as Vice President of Harvard’s You Can Too Mentoring chapter, or supporting girls in STEM through Strong Women, Strong Girls, I found that mentorship isn’t just about advice—it’s about helping someone recognize their own potential and take steps toward it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy background is in biomedical engineering, and I’ve spent years doing research in sickle cell disease, women’s health, and global health. But what I’m most proud of are the moments I’ve helped someone else understand a hard concept, find their voice, or believe they’re capable of more. Mentorship allows me to merge what I know with who I am—and to offer students what was once offered to me: a sense that they’re seen, capable, and supported.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"72dbcefc-7f4f-4adf-b8f7-d547c27c5046\"}":{"__typename":"DeepDives","uuid":"72dbcefc-7f4f-4adf-b8f7-d547c27c5046","content":"\u003cp\u003eIn my spare time, I love reading and creative writing. From a young age, I’ve been entranced by vast fantasy worlds and brave heroines—stories where characters shape and change the worlds they live in. That passion for immersive storytelling stayed with me through childhood and into high school, where I was part of a fiercely competitive Reading Bowl team that led our district by reading and analyzing a wide range of books in great detail.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing a voracious reader inspired me to try my hand at creative writing. I enjoy crafting my own stories, imagining new worlds and characters, and exploring ideas through writing. For me, reading and writing aren’t just hobbies—they’re ways to understand human experiences, connect with others, and express creativity beyond the everyday.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLately, this creativity has expanded to many other areas of my life. With more time to cook for myself and my family after graduating college, I’ve come to appreciate the creativity in cooking—how flavors and spices work together in the kitchen, and how chemistry and fun tools can affect flavor profiles. I’ve also extended this creativity to online pursuits—having always been interested in mobile games, I’ve spent time since high school thinking about and coding gaming projects that I find engaging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese creative outlets not only enrich my life but also inspire me to approach challenges with curiosity and imagination.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d9890e6a-acd9-4ce8-aff9-d2e8e99a4d96\"}":{"__typename":"DeepDives","uuid":"d9890e6a-acd9-4ce8-aff9-d2e8e99a4d96","content":"\u003cp\u003eIf I could give my middle or high school self any advice, it would be to trust the process of growth and exploration. During that time, I often felt a strong pressure to define exactly who I was and what I wanted to do. Looking back, I would remind myself that it’s okay not to have all the answers right away—and that each experience, whether successful or challenging, is part of the journey toward discovering your passions and long-term goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would encourage myself to stay open, curious, and willing to take intellectual and creative risks. Every academic subject, extracurricular activity, or volunteer role offers an opportunity to learn—not just about the world, but about yourself. I’d also emphasize the importance of maintaining perspective: excellence isn’t about having everything figured out early; it’s about continuing to grow, adapt, and pursue the things that excite and challenge you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn short, I’d reassure myself that exploration is not a detour from success, but the path to it—and that staying committed to curiosity, excellence, and purpose will always lead somewhere meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"4c5b9172-eea0-443b-a071-44e7510693fd\"}":{"__typename":"School","uuid":"4c5b9172-eea0-443b-a071-44e7510693fd","name":"Drew Charter School Junior/ Senior Academy (Yates Campus)","city":"Atlanta","type":"HIGH","state":"Georgia","country":"United States","zip":"30317"},"Education:{\"uuid\":\"6114fd62-43ca-4078-bef9-fd0882c24f8d\"}":{"__typename":"Education","uuid":"6114fd62-43ca-4078-bef9-fd0882c24f8d","school":{"__ref":"School:{\"uuid\":\"4c5b9172-eea0-443b-a071-44e7510693fd\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"2f6df293-2645-40cf-83aa-ff8d9199d92b\"}":{"__typename":"Education","uuid":"2f6df293-2645-40cf-83aa-ff8d9199d92b","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2025","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"8befea45-ce12-495b-b31b-a68843818931\"}":{"__typename":"MentorPublicProfile","uuid":"8befea45-ce12-495b-b31b-a68843818931","displayName":"Niara B.","slug":"niara-botchwey","biography":"\u003cp\u003eHello! I’m Niara Botchwey, a recent graduate of Harvard College with a degree in Biomedical Engineering. I specialize in academic tutoring, mentoring, and helping students develop their interests—especially in science, health, and research. My goal is always to meet students where they are and support them in building confidence, curiosity, and direction.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile at Harvard, I conducted research with the Harvard Global Health Institute on public health initiatives in South Africa, worked at MIT studying biological systems, and interned with a women’s telehealth clinic focused on high-risk pregnancies. These experiences helped shape my passion for equity in healthcare and allowed me to grow as both a researcher and a problem-solver.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I served as President of Harvard’s Women in STEM organization, played on Harvard’s national championship winning Quadball team (a real sport, inspired by Harry Potter!), and volunteered with young people living with chronic illnesses like sickle cell disease, helping to plan events and tutor students. I also worked closely with younger students through Strong Women, Strong Girls, a mentorship-based leadership program, and served as Vice President of Harvard’s chapter of You Can Too Mentoring, where I supported low-income high school students throughout the college application process. Through these and other service and advocacy efforts, I was honored to receive both the Evelynn Hammonds Award for Exceptional Service to BGLTQ+ Inclusion and the Harvard Caribbean Club Senior Award.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m originally from Atlanta, where I attended Drew Charter School. I was an early and enthusiastic learner—serving as Student Government President, competing on our state championship tennis team, and winning awards in both science and reading competitions. In high school, I loved both science and reading—I was a district Reading Bowl champion, AP Scholar with Distinction, and Harvard Book Award recipient. I won the National Geoscience Award for Women in Science, a Silver Medal at the District Science Fair, and the Society for In Vitro Biology’s Greatest Achievement Award, and I conducted original research at Georgia Tech that earned me 4th place in the world in Biomedical \u0026amp; Health Sciences at the International Science and Engineering Fair (ISEF). I also received a Senate Commendation from the Georgia Legislature and the U.S. President’s Volunteer Service Award for over 400 hours of service.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve worked with students of all ages through STEM camps, reading programs, and one-on-one tutoring. In my free time, I enjoy reading, running, playing piano, and cooking. Whether your child needs academic support, help launching a project, or mentorship as they navigate their path, I’m excited to guide them with patience, insight, and encouragement.\u003c/p\u003e","teachingVideoPlaybackId":"rFpC6eRmylmegJydqmnwT7o02u00Vk6eiwsB7P02wxqz00o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"eaaeb162-ec5b-4b2e-9406-a22cfc0f4d82\"}"},{"__ref":"DeepDives:{\"uuid\":\"7c31cee3-9a22-4607-b1f3-8221ee32bc7a\"}"},{"__ref":"DeepDives:{\"uuid\":\"72dbcefc-7f4f-4adf-b8f7-d547c27c5046\"}"},{"__ref":"DeepDives:{\"uuid\":\"d9890e6a-acd9-4ce8-aff9-d2e8e99a4d96\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9dc3fb0d-bdc0-4224-940e-b28f8bb03c71/-/preview/-/format/jpg/","https://ucarecdn.com/7bc478a5-4638-4602-9e66-46013dc1a8c4/-/preview/-/format/jpg/","https://ucarecdn.com/fb4f127d-2a19-41fd-9ea2-a14a9d4d34b1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6114fd62-43ca-4078-bef9-fd0882c24f8d\"}"},{"__ref":"Education:{\"uuid\":\"2f6df293-2645-40cf-83aa-ff8d9199d92b\"}"}],"hiredAt":"2025-06-27T13:06:49.339Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Creative Writing","Music","Video / Photography","Finance / Investing","Medicine / Health","STEM Project","Aviation / Aerospace","Sustainability","Public Speaking","Debate"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"niara-botchwey\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8befea45-ce12-495b-b31b-a68843818931\"}"}}},"_sentryTraceData":"0a33dd930cc24147aff51adcb20bf5e3-a0cd22b56a7cc94d-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=0a33dd930cc24147aff51adcb20bf5e3,sentry-s
