oPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"9e22317a-6be7-4ae1-92b9-2a24c138aad6\"}":{"__typename":"School","uuid":"9e22317a-6be7-4ae1-92b9-2a24c138aad6","name":"Homeschooled","city":"Madison","type":"HIGH","state":"WI","country":"USA","zip":"53716"},"Education:{\"uuid\":\"504e5c13-0578-4029-b1ab-795a6de238b8\"}":{"__typename":"Education","uuid":"504e5c13-0578-4029-b1ab-795a6de238b8","school":{"__ref":"School:{\"uuid\":\"9e22317a-6be7-4ae1-92b9-2a24c138aad6\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"fc878ccc-bc9c-40c2-9229-727e39873439\"}":{"__typename":"Education","uuid":"fc878ccc-bc9c-40c2-9229-727e39873439","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2024","major":"BA in Philosophy \u0026 Economics; MA in Media and Business Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"ca62304b-75a2-4289-b7ff-8cabc35d933d\"}":{"__typename":"MentorPublicProfile","uuid":"ca62304b-75a2-4289-b7ff-8cabc35d933d","displayName":"Henry H.","slug":"henry-hillgorman","biography":"\u003cp\u003eHenry loves teaching/mentoring and is so excited to be a part of Curious Cardinals (and finds it awkward to talk about himself in the third person)!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHenry is a lifelong homeschooler! Up until 10th grade he played competitive soccer -- he got to captain the Wisconsin Olympic Development team, and even got scouted to play professionally. During sophomore year Henry stepped away from soccer to pursue comedy. Almost every Saturday Henry would take the 5am bus the four hours to Chicago, spend the day practicing and performing comedy, and would then take the overnight bus back home. Henry also interned for several political campaigns and nonprofits in Wisconsin and Chicago. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring undergrad Henry studied philosophy, economics and wrote an honors thesis through the Ethics in Society Program. Henry also received his master's from Stanford, doing a self-directed program, with most of his coursework focused on education and business/entrepreneurship. During his master's Henry was a TA for several classes on campus, and consistently received some of the highest student reviews across the entire university -- Henry's favorite experience and proudest accomplishment while at Stanford. Outside of the classroom at Stanford, Henry was president of the sketch comedy team, created his own online satirical talk show, was a row house RA for several years, and was a tour guide. Henry was also briefly on the frisbee team as a benchwarmer.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, Henry has experience in applied economic research, private equity, venture capital, business development, and is currently a founder of a stealth startup. \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"BA in Philosophy \u0026 Economics; MA in Media and Business Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3676784b-57d7-47d5-ad80-1656abda83ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"1dd904d1-acf3-489b-8f41-e8b91df2ace3\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d4e087a-0a5c-4a76-8cf3-bf4d3bd67d96\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/86c57446-112b-4cde-a4d4-a3f62056e046/-/preview/-/format/jpg/","https://ucarecdn.com/ec34b655-e3b5-4a2a-ad78-51dd7f5b5851/-/preview/-/format/jpg/","https://ucarecdn.com/afa6f9f4-f8bb-4537-8a17-bf1b6052fbe3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE",
