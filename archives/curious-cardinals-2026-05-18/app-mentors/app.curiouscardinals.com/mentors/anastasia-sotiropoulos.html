xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"68173fa8-c14c-4eea-95b3-e1d26cb25e6f\"}":{"__typename":"Favorites","uuid":"68173fa8-c14c-4eea-95b3-e1d26cb25e6f","photoUrl":"https://ucarecdn.com/7fa5a84b-76ee-44e8-a5fd-d2ffe270dee2/","title":"Ramy Youssef","type":"ACTOR"},"Favorites:{\"uuid\":\"c630dde2-7455-4c7e-a5a8-084239eb4b67\"}":{"__typename":"Favorites","uuid":"c630dde2-7455-4c7e-a5a8-084239eb4b67","photoUrl":"https://ucarecdn.com/7efbf4e0-50d8-4c64-b781-d280212f68d9/","title":"Mario Kart (obviously)","type":"GAME"},"Favorites:{\"uuid\":\"aea67512-6c31-4686-b775-9be960345343\"}":{"__typename":"Favorites","uuid":"aea67512-6c31-4686-b775-9be960345343","photoUrl":"https://ucarecdn.com/4f0a358a-83e4-4512-8411-19ddf5e3a831/","title":"Giannis Antetokounmpo","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"abc82390-0a9f-4176-83be-5f84df0f0d04\"}":{"__typename":"CausesSupported","uuid":"abc82390-0a9f-4176-83be-5f84df0f0d04","name":"Prison Renaissance","description":"\u003cp\u003eUsing art and community to end cycles of incarceration.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/5433abbd-2022-49ff-b3cd-f4ea1e92c449/"},"CausesSupported:{\"uuid\":\"c84d4ab9-d6ce-4f64-b450-6167506e8cc7\"}":{"__typename":"CausesSupported","uuid":"c84d4ab9-d6ce-4f64-b450-6167506e8cc7","name":"Matriculate","description":"\u003cp\u003eProud to have served as a mentor to low-income, high-achieving high schoolers.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/ebbbc3a7-f3f2-459f-b72b-e39a6b824092/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3820288e-3d82-48c4-a316-fb513e3f87db\"}":{"__typename":"DeepDives","uuid":"3820288e-3d82-48c4-a316-fb513e3f87db","content":null,"videoPlaybackId":"LnZRPUyQX7IzGEesxzsKASScYrCO7007rB6KhXNXBlj8","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"884ef28e-1739-4f75-a20c-8a0dd3b73a01\"}":{"__typename":"DeepDives","uuid":"884ef28e-1739-4f75-a20c-8a0dd3b73a01","content":null,"videoPlaybackId":"dvKb02n1TfRrSt01F6r0100UnJqji022Xe018DADby1Tau46c","question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"aaf9f7d6-670b-4386-9487-f1e646921012\"}":{"__typename":"DeepDives","uuid":"aaf9f7d6-670b-4386-9487-f1e646921012","content":"\u003cp\u003eIt was a journey! I distinctly remember listing three potential majors on my admissions application (at Stanford, you don't have to declare until the end of your sophomore year): Political Science, Communication, Film \u0026amp; Media Studies. I ended up majoring in none of these! I used those two years of allotted, ~undeclared~ exploration to take classes in a number of majors. At one point, I thought I wanted to become a public defender and officially declared in Comparative Studies in Race \u0026amp; Ethnicity-- a major that many choose to eventually attend law school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA lot of those CSRE classes were cross-listed with the Psychology Department, such as “Race \u0026amp; Crime,” taught by an esteemed researcher/professor. Courses like this one led me to read up on the courses within the psychology major and found myself fascinated by their topics and breadth. I also thought back to how, in the one PoliSci course I took—Campaigns, Voting, Media, and Elections—what I found most fascinating was the unit on political psychology: what leads people to vote the way they do, /why/ media influences them the way it does.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis is all to say it was not a linear journey for me (there was a pandemic/gap year in the middle of declaring), and my interests have continued to evolve as I am now completing my master’s in Journalism. My advice is to be ok with the uncertainty and prioritize taking classes you truly enjoy— for me, a major naturally emerged from that.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f892ca01-c905-44f8-8dc6-f024b5ebc971\"}":{"__typename":"DeepDives","uuid":"f892ca01-c905-44f8-8dc6-f024b5ebc971","content":"\u003cp\u003eMy dream job is something I expect to evolve as I learn more about myself, but right now it's to become a journalist/documentary filmmaker! I'm especially interested in stories that cover with both domestic and international human rights, as well as their intersection with mental health. I'm excited to be working for Stanford's Human Rights in Trauma Mental Health Lab this year; I'm not cut off from the idea of working in healthcare as a therapist or psychologist, but right now I'm very excited to delve into all things journalism and science communication.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"b50cc057-fc06-46ac-8e65-4d8dd35273f7\"}":{"__typename":"School","uuid":"b50cc057-fc06-46ac-8e65-4d8dd35273f7","name":"The Episcopal School of Dallas","city":"Dallas","type":"HIGH","state":"Texas","country":"United States","zip":"75229"},"Education:{\"uuid\":\"252125e8-9b98-4d2d-a425-890b00c0113f\"}":{"__typename":"Education","uuid":"252125e8-9b98-4d2d-a425-890b00c0113f","school":{"__ref":"School:{\"uuid\":\"b50cc057-fc06-46ac-8e65-4d8dd35273f7\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"2e834bcd-f8b9-43fb-af93-d3031cfc8e4f\"}":{"__typename":"Education","uuid":"2e834bcd-f8b9-43fb-af93-d3031cfc8e4f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2025","major":"B.A. in Psychology + Creative Writing, M.A. in Journalism (Data Journalism/Doc Film)","degree":null},"MentorPublicProfile:{\"uuid\":\"9972a21c-2d39-466a-84ba-e5967ce06e7c\"}":{"__typename":"MentorPublicProfile","uuid":"9972a21c-2d39-466a-84ba-e5967ce06e7c","displayName":"Anastasia S.","slug":"anastasia-sotiropoulos","biography":"\u003cp\u003e“Imagination is more important than knowledge.” -Albert Einstein\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHey! My name is Anastasia (ah-nah-stah-SEE-ah). I moved to Stanford from my hometown of Dallas, Texas when I was 18, undecided on what I wanted to study but positive that I loved storytelling. Some of my earliest memories are of setting up a cardboard box on my grandparents’ living room floor to create the outline of a TV, from where I would report “nightly news” segments I’d conjured up. Years later, I would serve as editor-in-chief of my high school’s newspaper.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, I decided to study something new and wound up exploring a number of majors. After discovering my passion for unraveling the inner workings of why people feel, think, and behave the way they do, I graduated with a B.A. in Psychology. I found my favorite classes, however, in the English Department. Classes on short stories, memoirs, screenwriting, and more resulted in my (beloved) minor in Creative Writing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy studies in psychology and other disciplines only deepened my interest in mental healthcare, the criminal legal system, and international human rights. And as someone who’s always believed in the power of stories to incite change, I ended up where I began… a journalist! I recently graduated with an M.A. in Data Journalism.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m thrilled to be pursuing the intersection of data journalism and creativity. Whether it be through documentary film, narrative writing, podcasting, or virtual reality, I’m driven to tell important stories through a variety of mediums. One of my favorite stories was nominated for an International Women’s Podcasting Award. I made it with my friend who I made through the Prison Renaissance Project, an organization that pairs Stanford students with incarcerated artists/activists at San Quentin State Prison to make art together.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs the daughter of Greek immigrants, I’ve had the importance of education instilled in me from a young age. I care deeply about its accessibility, which I find inseparable from quality mentorship. I fell in love with mentoring through the nonprofit Matriculate during undergrad, through which I mentored low-income, high-achieving high school students as they applied to college. Over many months, my mentees and I developed trusting relationships—something I realized is not only integral to the process, but also what makes it most rewarding.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow as a mentor at Curious Cardinals, I’m especially passionate about connecting with neurodivergent students. My own lifelong experiences with mental health and ADHD have contributed greatly to my love for psychology and my drive to empower students who navigate similar challenges.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, I enjoyed being a peer counselor and the graduate student coordinator for The Bridge, Stanford’s peer mental health hotline. I’ve also enjoyed supporting community wellbeing as a residential assistant, living among freshmen transitioning into college. In my free time, I love driving around the Bay with my friends, dabbling in stand up, and being Wingstop’s biggest fan.\u003c/p\u003e","teachingVideoPlaybackId":"3XpgwoSrFHijRou18xKkqsjyfYWdO02un102joBQJTMu8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn 6th grade, I got wrapped into a Disney Channel talent search program after responding to a radio ad... Bella Thorne  told me she had no notes for my monologue performance, forever my greatest achievement. Tragically, my parents said I could not quit middle school and move to California :(\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"68173fa8-c14c-4eea-95b3-e1d26cb25e6f\"}"},{"__ref":"Favorites:{\"uuid\":\"c630dde2-7455-4c7e-a5a8-084239eb4b67\"}"},{"__ref":"Favorites:{\"uuid\":\"aea67512-6c31-4686-b775-9be960345343\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"abc82390-0a9f-4176-83be-5f84df0f0d04\"}"},{"__ref":"CausesSupported:{\"uuid\":\"c84d4ab9-d6ce-4f64-b450-6167506e8cc7\"}"}],"major":"B.A. in Psychology + Creative Writing, M.A. in Journalism (Data Journalism/Doc Film)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3820288e-3d82-48c4-a316-fb513e3f87db\"}"},{"__ref":"DeepDives:{\"uuid\":\"884ef28e-1739-4f75-a20c-8a0dd3b73a01\"}"},{"__ref":"DeepDives:{\"uuid\":\"aaf9f7d6-670b-4386-9487-f1e646921012\"}"},{"__ref":"DeepDives:{\"uuid\":\"f892ca01-c905-44f8
