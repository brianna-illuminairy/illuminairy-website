xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0b287b67-7298-4ab1-9b2a-0742eb989b2d\"}":{"__typename":"Favorites","uuid":"0b287b67-7298-4ab1-9b2a-0742eb989b2d","photoUrl":"https://ucarecdn.com/8ab1184c-2aa8-474e-a9fb-468c0744589e/","title":"Chicago","type":"CITY"},"Favorites:{\"uuid\":\"42f2d3d3-1661-4da3-a401-88d94ba35457\"}":{"__typename":"Favorites","uuid":"42f2d3d3-1661-4da3-a401-88d94ba35457","photoUrl":"https://ucarecdn.com/95e347ef-66e6-4808-bdde-1e18d5818f34/","title":"Paddington","type":"MOVIE"},"Favorites:{\"uuid\":\"40b77a8f-98cd-4632-b991-016cb616a44f\"}":{"__typename":"Favorites","uuid":"40b77a8f-98cd-4632-b991-016cb616a44f","photoUrl":"https://ucarecdn.com/e03f0302-6714-4f65-8381-3beca458537e/","title":"Laufey","type":"ARTIST"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"900ce7b1-d593-4b23-97a3-03a3d9a61270\"}":{"__typename":"DeepDives","uuid":"900ce7b1-d593-4b23-97a3-03a3d9a61270","content":"\u003cp\u003eMy greatest source of motivation is my family. I have two younger siblings and strive to be the best role model I can be for them. Their admiration, kindness, and support push me to work hard and set a positive example in everything I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"902ac52e-9cc7-4929-96e9-3ff66d6b2a23\"}":{"__typename":"DeepDives","uuid":"902ac52e-9cc7-4929-96e9-3ff66d6b2a23","content":"\u003cp\u003eI love to play golf! I have been golfing since I was 7 years old and spent my summers traveling to play tournaments. Also, I like to read books in my free time. My goal is to read one book a week. My most recent book I read was \"Gift From The Sea\" by Anne Morrow Lindbergh. Other than that, you can find me in a coffee shop or watching a movie with my roommates!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"cd488d94-faea-4098-9888-8cefa2c93ad1\"}":{"__typename":"DeepDives","uuid":"cd488d94-faea-4098-9888-8cefa2c93ad1","content":"\u003cp\u003eIn high school, I always struggled with math and felt behind in my classes compared to my peers. I was able to go to tutoring after school and received one-on-one mentorship with one of my school's tutors. It was an invaluable experience because I felt like I could learn the concepts at my own pace. My tutor never made me feel dumb for asking questions; it was such a comfortable environment. Because of her, I was able to excel in my math classes and tackle my imposter syndrome. I strive to be a mentor to others the way she was to me. I understand what it feels like to feel behind in class and be scared to ask questions. I aim to create a welcoming and safe environment for mentorship and to help guide the student.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"4644a285-22bf-4856-91b2-4f682df7518a\"}":{"__typename":"School","uuid":"4644a285-22bf-4856-91b2-4f682df7518a","name":"Stevenson High School","city":"Lincolnshire","type":"HIGH","state":"Illinois","country":"United States","zip":"60069"},"Education:{\"uuid\":\"880e5a40-fa55-4830-876c-cf9760273f95\"}":{"__typename":"Education","uuid":"880e5a40-fa55-4830-876c-cf9760273f95","school":{"__ref":"School:{\"uuid\":\"4644a285-22bf-4856-91b2-4f682df7518a\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"c15372cb-6e5a-4529-a7e8-394cf002cee0\"}":{"__typename":"Education","uuid":"c15372cb-6e5a-4529-a7e8-394cf002cee0","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"038d824d-db32-4b64-9ce0-8726b928bf20\"}":{"__typename":"MentorPublicProfile","uuid":"038d824d-db32-4b64-9ce0-8726b928bf20","displayName":"Emily D.","slug":"emily-duan","biography":"\u003cp\u003eHi! My name is Emily Duan and I am a student at UCLA pursuing a Bachelor's degree in Economics, with a minor in Film, Television, and Digital Media.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy journey began in high school, where I was a member of Future Business Leaders of America, and had the opportunity to compete in different areas of business. My team built marketing platforms, wrote investment theses, and presented them to judges. Here, I found an interest for business, specifically marketing and finance.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSimultaneously, I loved editing videos for my friends and family. So, my passion for creating videos inspired me to combine these interests to college.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt UCLA, I have taken on several leadership roles. I serve as the Finance Director for the Undergraduate Business Society and the President of Business in Entertainment, and I am also an avid member of the Bruin Book Club. I wanted to combine my passion for movies with my interest in business, so this summer, I am a Finance Intern at Disney. Last summer, I worked as Procurement Intern at NBCU where I helped budget and order golf carts for the studio. Here, this helped my technical skills in finance and learn how to negotiate to different vendors.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHowever, I wanted to develop my passion for reading and writing, so I was able to get an internship in development at Fox Studios, where I edited and read numerous scripts submitted to the studio including The Simpsons and Bob's Burgers. Here, I was able to strengthen my comprehension skills and learn what makes a great story.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my academic and professional pursuits, I enjoy playing golf as part of UCLA Club Golf and was previously the captain of my high school's golf team where we won the state championship. As a mentor, I aim to engage students in a way that is both immersive and practical. I was a volunteer golf coach and am able to translate my teaching skills from the golf course to the classroom. Through my experience coaching golf, I learned the important of teaching in a concise manner while letting the student apply their skills.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf tasked with teaching reading or English, I will use my love of reading and writing to help them write stronger pieces of writing that showcase their voice. I can use the tools I learned at Fox Studios to help mentor students write stories and develop their voice. If tasked with filmmaking, I will be able to use my internship experiences at Disney, Fox, and NBCUniversal to help my students create videos to show to their friends and family.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith my Economics degree, I learn best when my professors allow me to apply my skills as opposed to listening to lectures for hours. Therefore, for foundational subjects like math, I will focus on concise teaching methods that encourage the application of skills rather than passive listening.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt the end of the day, I will be there for your student. I want to help them grow into the best student and person they can be. As a former golf coach, I understood the importance of being there for your students and I promise to help them achieve their goals.\u003c/p\u003e","teachingVideoPlaybackId":"00qcqtAEPLyLfq01Q66i01j7oZtLj8G7uMiE9SeeCTDiVM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI have a secret talent that I am going to share with you: I can juggle golf balls using my golf club and my record is 330 bounces.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0b287b67-7298-4ab1-9b2a-0742eb989b2d\"}"},{"__ref":"Favorites:{\"uuid\":\"42f2d3d3-1661-4da3-a401-88d94ba35457\"}"},{"__ref":"Favorites:{\"uuid\":\"40b77a8f-98cd-4632-b991-016cb616a44f\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"900ce7b1-d593-4b23-97a3-03a3d9a61270\"}"},{"__ref":"DeepDives:{\"uuid\":\"902ac52e-9cc7-4929-96e9-3ff66d6b2a23\"}"},{"__ref":"DeepDives:{\"uuid\":\"cd488d94-faea-4098-9888-8cefa2c93ad1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fb04b7e9-7e3b-4929-9c9b-870070eafb18/-/preview/-/format/jpg/","https://ucarecdn.com/003ec62e-0fe2-4932-9720-469de6e69d36/-/preview/-/format/jpg/","https://ucarecdn.com/235cfc47-1629-48d8-887f-9790980a3470/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"880e5a40-fa55-4830-876c-cf9760273f95\"}"},{"__ref":"Education:{\"uuid\":\"c15372cb-6e5a-4529-a7e8-394cf002cee0\"}"}],"hiredAt":"2024-07-20T14:10:18.377Z","topics":["Literature","K-5 Grade Math","Pre-Algebra","Writing","Algebra I","Algebra II","Film / Theater","Public Speaking","Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"emily-duan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"038d824d-db32-4b64-9ce0-8726b928bf20\"}"}}},"_sentryTraceData":"6cac16769ae24e1592d8edb5ae16f83e-8a511ba5ca7bab3a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=6cac16769ae24e1592d8edb5ae16f83e,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"emily-duan"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
