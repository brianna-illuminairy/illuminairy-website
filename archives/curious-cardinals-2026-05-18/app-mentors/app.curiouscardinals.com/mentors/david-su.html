xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b787f709-f458-4f02-87da-def075f42695\"}":{"__typename":"Favorites","uuid":"b787f709-f458-4f02-87da-def075f42695","photoUrl":"https://ucarecdn.com/4c7d2d23-9358-4589-a8da-daa2c4c1203b/","title":"Golden State Warriors","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"1409ec05-6ad7-408b-a12a-8bd8fd16c3f9\"}":{"__typename":"Favorites","uuid":"1409ec05-6ad7-408b-a12a-8bd8fd16c3f9","photoUrl":"https://ucarecdn.com/bdc74966-21f2-4f18-9e3e-91c71ac2d7e0/","title":"GNX - Kendrick Lamar","type":"ALBUM"},"Favorites:{\"uuid\":\"c4a500d8-dbfd-4fad-ae8c-7b22758fdc32\"}":{"__typename":"Favorites","uuid":"c4a500d8-dbfd-4fad-ae8c-7b22758fdc32","photoUrl":"https://ucarecdn.com/5eef4523-e089-46f1-8e6f-412f320e8c14/","title":"Basketball","type":"SPORT"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c4fe1aea-a9b4-4769-b403-2fae202b26ad\"}":{"__typename":"DeepDives","uuid":"c4fe1aea-a9b4-4769-b403-2fae202b26ad","content":"\u003cp\u003eThe best piece of advice I could give to my middle or high school self is to never limit myself to what I can accomplish. This is a cliche saying but it's true: You are your own greatest enemy. The first step in accomplishing anything is the belief that you can do it. By limiting yourself to what you think you can do, you miss out on opportunities that could lead to great things. Whether it's starting that business, creating that project, or applying to that job, its important to remember that you can't do it if you don't even try.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8a52f8db-1384-48a3-a5cf-911c67f3fb4e\"}":{"__typename":"DeepDives","uuid":"8a52f8db-1384-48a3-a5cf-911c67f3fb4e","content":"\u003cp\u003eI have a lot of hobbies like cooking, DJing, and video games. However, my biggest passion is sports. Growing up in Seattle and the Bay Area, I was blessed with championship teams to root for in the Seattle Seahawks and Golden State Warriors. I have been playing basketball competitively since I was in elementary school, and more recently I am a UCLA IM flag football champion. Ask me anything about basketball or football!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"231100ca-c2b7-4e5e-ad05-4f0d65b8daac\"}":{"__typename":"DeepDives","uuid":"231100ca-c2b7-4e5e-ad05-4f0d65b8daac","content":"\u003cp\u003eMy greatest source of motivation is the potential impact I can make on others. Above everything else, my main goal is to be the best person I can be, whether that is as a teacher, employee, friend, or stranger. Ultimately, the only thing guaranteed you can leave behind is the impact you've made on others, and that is important to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"5081b329-c722-4d0e-98a6-686c84a2a6f0\"}":{"__typename":"DeepDives","uuid":"5081b329-c722-4d0e-98a6-686c84a2a6f0","content":"\u003cp\u003eMy dream job is to become a full-time software engineer, while also being able to work on my other passions on the side, such as DJing and coaching basketball.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"506954ad-da64-4519-a967-6a8cd1c00433\"}":{"__typename":"School","uuid":"506954ad-da64-4519-a967-6a8cd1c00433","name":"Carlmont High School","city":"Belmont","type":"HIGH","state":"California","country":"United States","zip":"94002"},"Education:{\"uuid\":\"c07503c6-3433-4509-8090-a1632a8d7320\"}":{"__typename":"Education","uuid":"c07503c6-3433-4509-8090-a1632a8d7320","school":{"__ref":"School:{\"uuid\":\"506954ad-da64-4519-a967-6a8cd1c00433\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"09bf2d54-3a6f-4228-bc42-f1a1edef7266\"}":{"__typename":"Education","uuid":"09bf2d54-3a6f-4228-bc42-f1a1edef7266","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science B.S","degree":null},"MentorPublicProfile:{\"uuid\":\"6993f4e2-fd77-4b77-9ea5-d77e9100391a\"}":{"__typename":"MentorPublicProfile","uuid":"6993f4e2-fd77-4b77-9ea5-d77e9100391a","displayName":"David S.","slug":"david-su","biography":"\u003cp\u003eHi, my name is David, and I’m a Curious Cardinals mentor with a passion for teaching, learning, and inspiring others. I grew up in Seattle before moving to the Bay Area, where I attended Carlmont High School. At Carlmont, I was fortunate to be part of the #1 journalism program in the country. During that time, I wrote award-winning story beats and feature articles that taught me the power of storytelling. I also co-hosted and produced podcasts, which gave me valuable experience in both collaboration and creative communication. These experiences shaped my ability to express ideas clearly and to connect with audiences across different mediums.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am now a fourth-year student at UCLA, majoring in computer science. My academic journey has been driven by a deep curiosity for building things that combine creativity and technical skill. In particular, I enjoy working on projects involving artificial intelligence and large language models, exploring how these technologies can be applied to solve real-world problems. Beyond my coursework, I’m involved in student organizations such as the Association of Chinese Americans and my school’s business club, where I help foster a sense of community and focus on professional development.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I currently work at a nonprofit foundation, where I am developing AI applications to streamline IT workflows. This role has been especially rewarding, as it allows me to apply what I’ve learned in the classroom to make a tangible impact on an organization’s efficiency and success. I find it motivating to use my skills not just for innovation, but also for service.\u003c/p\u003e\u003cp\u003eTeaching has always been one of my strongest passions. Whether it’s computer science, mathematics, college applications, basketball, or even cooking, I truly enjoy passing on what I know to help others grow. I believe that teaching and mentorship are powerful ways to improve myself while also empowering others, and that philosophy is at the heart of why I mentor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not studying or working, I love cooking and experimenting with new recipes, playing and watching sports, and DJing. I also enjoy traveling and recently had the chance to visit both Asia and Europe. These trips broadened my worldview and deepened my appreciation for different cultures, food, and ways of life. Altogether, my journey has been shaped by curiosity, creativity, and a drive to connect with people, and I hope to continue sharing that with others through mentorship. I'm excited to get to know you more and work with you!\u003c/p\u003e","teachingVideoPlaybackId":"3019TX13nIHgWPlW9hjRZf7eo02PFsJYNsaSeusJqVGiA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b787f709-f458-4f02-87da-def075f42695\"}"},{"__ref":"Favorites:{\"uuid\":\"1409ec05-6ad7-408b-a12a-8bd8fd16c3f9\"}"},{"__ref":"Favorites:{\"uuid\":\"c4a500d8-dbfd-4fad-ae8c-7b22758fdc32\"}"}],"causesSupported":[],"major":"Computer Science B.S","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c4fe1aea-a9b4-4769-b403-2fae202b26ad\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a52f8db-1384-48a3-a5cf-911c67f3fb4e\"}"},{"__ref":"DeepDives:{\"uuid\":\"231100ca-c2b7-4e5e-ad05-4f0d65b8daac\"}"},{"__ref":"DeepDives:{\"uuid\":\"5081b329-c722-4d0e-98a6-686c84a2a6f0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4c43ae79-9102-4508-98ee-352d85690188/-/preview/-/format/jpg/","https://ucarecdn.com/221c80d3-2c73-4bd9-9927-12b0141383c9/-/preview/-/format/jpg/","https://ucarecdn.com/e2eb195d-1a0f-4d4d-98fd-c880f1aea8ea/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c07503c6-3433-4509-8090-a1632a8d7320\"}"},{"__ref":"Education:{\"uuid\":\"09bf2d54-3a6f-4228-bc42-f1a1edef7266\"}"}],"hiredAt":"2025-08-29T04:29:30.075Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Physics","Writing","College Essay Writing","Reading","Computer Science","Academic Coaching"],"communityBadges":[],"restrictedProfileVisibility":
