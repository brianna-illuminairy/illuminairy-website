xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"012d0482-1bfa-476d-966e-16fdbe618be3\"}":{"__typename":"Favorites","uuid":"012d0482-1bfa-476d-966e-16fdbe618be3","photoUrl":"https://ucarecdn.com/2349a4be-431f-45fa-b85b-7fc2ef8eac87/","title":"The Weeknd","type":"ARTIST"},"Favorites:{\"uuid\":\"98b6f09b-c1fd-42c2-8b08-bc7ac437406d\"}":{"__typename":"Favorites","uuid":"98b6f09b-c1fd-42c2-8b08-bc7ac437406d","photoUrl":"https://ucarecdn.com/e91311f0-0f8a-47dd-984c-8b57afabd47b/","title":"Mo Salah","type":"ATHLETE"},"Favorites:{\"uuid\":\"d717ab03-6405-4ab7-ab8b-ea68a124bee3\"}":{"__typename":"Favorites","uuid":"d717ab03-6405-4ab7-ab8b-ea68a124bee3","photoUrl":"https://ucarecdn.com/459d19d2-35dd-4b09-8e40-1c510f5d2107/","title":"Interstellar","type":"MOVIE"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"3099d9ca-278d-4b63-8857-bae136850d8f\"}":{"__typename":"DeepDives","uuid":"3099d9ca-278d-4b63-8857-bae136850d8f","content":"\u003cp\u003eMy greatest source of motivation comes from pursuing endeavors that have the potential to create a meaningful impact. Whether working individually or as part of a team, I am driven by the knowledge that my efforts can contribute to a larger purpose.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my journey, I have been intentional in selecting experiences that align with my future aspirations and goals. Each step I’ve taken has been purposeful, ensuring that I am building the skills and knowledge necessary to create a positive difference in the lives of others. This deliberate approach keeps me focused and energized, knowing that my work is contributing to something greater than myself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, what inspires me most is the opportunity to make a lasting impact, and that passion fuels my determination to succeed and grow continuously.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a6eaeb8c-1080-42a7-bcce-1011e89a518e\"}":{"__typename":"DeepDives","uuid":"a6eaeb8c-1080-42a7-bcce-1011e89a518e","content":"\u003cp\u003eMy grandfather's battle with Alzheimer's disease profoundly shaped my understanding of healthcare and the impact of unmet medical needs. Witnessing firsthand how this illness affected not only him but also our entire family highlighted the far-reaching consequences of conditions with limited treatment options. This experience ignited a passion within me to contribute directly to healthcare and drug development, with the goal of addressing unmet medical needs like Alzheimer's and improving access to life-changing medicines for underserved communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePharmacy offered the perfect avenue to combine my desire to make a tangible difference in patients' lives with my interest in science and innovation. By pursuing a career in pharmacy, I aim to play a pivotal role in advancing treatments and ensuring they reach those who need them most. My ultimate goal is to positively impact patients globally by improving their quality of life and expanding access to essential medications.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"c2a758d7-047c-4187-bcc1-350770f5cc6e\"}":{"__typename":"DeepDives","uuid":"c2a758d7-047c-4187-bcc1-350770f5cc6e","content":"\u003cp\u003eAs an Egyptian immigrant, my identity has profoundly shaped the way I approach teaching and mentorship. Growing up with the values of resilience, adaptability, and community, I’ve learned to appreciate diverse perspectives and the power of seeing challenges through different lenses.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy background allows me to approach problem-solving and learning with creativity and an openness to exploring multiple viewpoints. I aim to instill these same qualities in my mentees, encouraging them to think critically, embrace diverse ideas, and approach challenges from new angles.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing an immigrant has also given me a deep understanding of the importance of inclusivity and the value of bridging cultural gaps. I strive to create a supportive environment where mentees feel heard, understood, and empowered to achieve their goals, no matter their background or circumstances. My journey helps me empathize with those who may feel like outsiders or who are navigating unfamiliar territories, as I’ve walked a similar path.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, my identity helps me connect with mentees on a deeper level, offering insights and perspectives that might not be immediately obvious. By sharing my experiences and encouraging them to see the bigger picture, I aim to equip them with the confidence and skills to succeed in their own unique journeys.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"27786d9a-8530-4d2e-a4b3-0a2a49bc3ba3\"}":{"__typename":"DeepDives","uuid":"27786d9a-8530-4d2e-a4b3-0a2a49bc3ba3","content":"\u003cp\u003eThroughout my journey in school and university, I’ve had the privilege of working with incredible mentors who played a significant role in my success and professional growth. Their guidance not only helped me navigate challenges but also inspired me to strive for excellence and pursue my goals with confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe mentorship is one of the most powerful tools for shaping the next generation of leaders. It fosters growth, builds confidence, and nurtures potential in a way that transforms bright students into accomplished professionals. The opportunity to contribute to someone’s development excites me, as I know firsthand how impactful mentorship can be.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I think about my long-term goals, building a legacy is one of the most meaningful aspirations I hold. Mentorship allows me to leave a lasting impact by sharing knowledge and experiences that can resonate far beyond my own career. What I impart to someone else—whether it’s wisdom, skills, or encouragement—has the potential to shape their path and inspire them to achieve great things.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, mentorship is more than guidance; it’s an investment in the future. It’s a way to contribute to a cycle of growth and excellence, ensuring that what I’ve learned and achieved can benefit others for years to come.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"68d15d76-d64f-428a-8fa5-ff9cd4399dbc\"}":{"__typename":"School","uuid":"68d15d76-d64f-428a-8fa5-ff9cd4399dbc","name":"Hillsborough High School","city":"Hillsborough Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08844"},"Education:{\"uuid\":\"221ba0fc-9203-42d6-8163-fac332fbbae4\"}":{"__typename":"Education","uuid":"221ba0fc-9203-42d6-8163-fac332fbbae4","school":{"__ref":"School:{\"uuid\":\"68d15d76-d64f-428a-8fa5-ff9cd4399dbc\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a61a129e-3632-4145-86eb-0180f6a7589f\"}":{"__typename":"School","uuid":"a61a129e-3632-4145-86eb-0180f6a7589f","name":"Rutgers University–New Brunswick","city":"New Brunswick","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08901"},"Education:{\"uuid\":\"e6eb9f66-c383-46db-bb50-894c0bb70ee7\"}":{"__typename":"Education","uuid":"e6eb9f66-c383-46db-bb50-894c0bb70ee7","school":{"__ref":"School:{\"uuid\":\"a61a129e-3632-4145-86eb-0180f6a7589f\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2025","major":"Pharmacy","degree":null},"MentorPublicProfile:{\"uuid\":\"1a814b81-9a64-4479-8c67-19e099f8b1b6\"}":{"__typename":"MentorPublicProfile","uuid":"1a814b81-9a64-4479-8c67-19e099f8b1b6","displayName":"Karim A.","slug":"karim-abdelhalim-1","biography":"\u003cp\u003eHi all! My name is Karim Abdelhalim. I grew up in Egypt and moved to the U.S. about 10 years ago. I recently graduated from Rutgers University with my Doctor of Pharmacy (PharmD) degree and am currently pursuing a 2-year program that combines clinical practice and industry experience. In my first year, I am working alongside medical teams in the hospital setting, gaining direct clinical insights and aiding in optimizing medical care for patients, with a focus on oncology. In my second year, I will transition to the pharmaceutical industry, where I plan to apply these learnings to help address unmet medical needs and advance patient care through innovative therapies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am a driven and passionate professional deeply committed to improving patient outcomes through innovative research and impactful healthcare initiatives. My academic and professional pursuits have been fueled by the desire to bridge the gap between cutting-edge scientific discoveries and patients with unmet medical needs.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI have immersed myself in rigorous coursework and meaningful extracurricular activities to prepare for a dynamic career in healthcare. Beyond academics, my experiences have included clinical rotations, research initiatives, and leadership roles that honed my analytical and interpersonal skills. Whether collaborating on research projects to optimize patient care or serving as a leader in student organizations, I have consistently sought opportunities to learn, grow, and contribute meaningfully, while also finding ways to empower my fellow underclassmen.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the highlights of my journey was being recently selected for a post-doctoral fellowship program at Bristol Myers Squibb, a leader within the pharmaceutical industry, an accolade that underscores my dedication to professional excellence and continuous learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my academic and professional pursuits, I am deeply committed to mentorship and community engagement. I have guided peers and younger students in navigating their own academic and career journeys, emphasizing the importance of resilience, curiosity, and collaboration. These interactions have been incredibly rewarding and have strengthened my belief in the power of knowledge-sharing and support networks.    \u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy spending time with family and friends having game and movie nights. I also enjoy watching and playing soccer in my spare time, and have recently taken up cooking!     \u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs I continue to grow in my career, I am excited to tackle complex challenges, drive impactful initiatives, and collaborate with diverse teams to make a tangible difference in the world of healthcare, all while collaborating and empowering younger professionals and students entering the field.\u003c/p\u003e","teachingVideoPlaybackId":"00c1F01SegB8Pb00C4N2zuRt1FEJ3xISFjwv008Sfgl02zVs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I am most proud of is my work at Promise Clinic, a student-run clinic dedicated to providing free healthcare services to underserved communities. As a member of the clinic team, I had the privilege of working alongside a multidisciplinary group of students and physicians to deliver care to patients who might not otherwise have access to essential healthcare services.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy role involved conducting medication reviews, counseling patients, and collaborating with fellow team members to optimize treatment plans. One of my most rewarding experiences was working with a patient struggling to manage their chronic conditions due to limited resources and health literacy. Through consistent communication, education, and support, our team was able to improve the patient's understanding of their medications and encourage lifestyle changes that significantly enhanced their health outcomes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis experience not only allowed me to apply my clinical knowledge in a real-world setting but also instilled in me a deep sense of purpose. It reinforced my commitment to addressing health disparities and inspired me to advocate for accessible healthcare solutions. I am proud to have been part of an initiative that truly exemplifies the power of teamwork, compassion, and dedication in making a tangible difference in people's lives.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"012d0482-1bfa-476d-966e-16fdbe618be3\"}"},{"__ref":"Favorites:{\"uuid\":\"98b6f09b-c1fd-42c2-8b08-bc7ac437406d\"}"},{"__ref":"Favorites:{\"uuid\":\"d717ab03-6405-4ab7-ab8b-ea68a124bee3\"}"}],"causesSupported":[],"major":"Pharmacy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3099d9ca-278d-4b63-8857-bae136850d8f\"}"},{"__r
