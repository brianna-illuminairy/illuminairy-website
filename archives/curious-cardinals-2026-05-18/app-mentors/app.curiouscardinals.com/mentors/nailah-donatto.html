xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"92a7d7d7-afd5-40c0-ad8c-5711c3f2feca\"}":{"__typename":"Favorites","uuid":"92a7d7d7-afd5-40c0-ad8c-5711c3f2feca","photoUrl":"https://ucarecdn.com/54181f91-ae12-4a04-9b5a-6d148ea9c4ed/","title":"Aliyah Boston","type":"ATHLETE"},"Favorites:{\"uuid\":\"5e500fb5-2b14-4738-b5ad-1412f1d54b22\"}":{"__typename":"Favorites","uuid":"5e500fb5-2b14-4738-b5ad-1412f1d54b22","photoUrl":"https://ucarecdn.com/07a673c8-fe98-4ab6-bd97-75e127c80516/","title":"Basketball","type":"SPORT"},"Favorites:{\"uuid\":\"f26d80cb-8d21-427a-a6bd-d51f19c39cb5\"}":{"__typename":"Favorites","uuid":"f26d80cb-8d21-427a-a6bd-d51f19c39cb5","photoUrl":"https://ucarecdn.com/38753c79-b0b0-4f70-9b02-c7e370f90f75/","title":"New York City","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f078bbf5-5f93-4f42-8d44-d05ba727f431\"}":{"__typename":"DeepDives","uuid":"f078bbf5-5f93-4f42-8d44-d05ba727f431","content":"\u003cp\u003eI've always valued education and being a role model for other people. My first interaction with mentorship was demonstrated to me in my own home. My sister is a mentor for me  in more ways than I can count, so I understand how impactful mentorship can be from the mentee's perspective and from a mentor's perspective. I have so many first hand experiences with mentorship that I want to continue to distribute my knowledge and expertise on to others for their success. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e09fc680-cd15-4c73-abcb-0bac23938fec\"}":{"__typename":"DeepDives","uuid":"e09fc680-cd15-4c73-abcb-0bac23938fec","content":"\u003cp\u003eMost summers I kept myself very busy. I took time during the school year researching summer programs across the country to ensure that I could make the most of those three months. My diligence led to acceptance into programs hosted by Carnegie Mellon, UChicago, and Stanford. I even spent 5 weeks in New York City with Jane Street Finance! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ca83efe9-33bc-42ec-aae8-2d5fe5f02f3c\"}":{"__typename":"DeepDives","uuid":"ca83efe9-33bc-42ec-aae8-2d5fe5f02f3c","content":"\u003cp\u003eI want to start a non-profit organization that allows people from all backgrounds to contribute to charity. I have ideas in the works! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"ea0ade3b-f2e5-4bb5-be59-520d41f44d27\"}":{"__typename":"DeepDives","uuid":"ea0ade3b-f2e5-4bb5-be59-520d41f44d27","content":"\u003cp\u003eMy dream job is a pharmaceutical manufacturer. I want to synthesize life- changing medicines that are accessible to all who need them. Another component of my career will be to destigmatize the drug industry and healthcare reform. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"027cdc23-a0ea-4697-8e41-0ab650e87488\"}":{"__typename":"School","uuid":"027cdc23-a0ea-4697-8e41-0ab650e87488","name":"Liberty High School","city":"Liberty","type":"HIGH","state":"Texas","country":"United States","zip":"77575"},"Education:{\"uuid\":\"9f7d0178-e3ab-4351-8678-75568fb43c8b\"}":{"__typename":"Education","uuid":"9f7d0178-e3ab-4351-8678-75568fb43c8b","school":{"__ref":"School:{\"uuid\":\"027cdc23-a0ea-4697-8e41-0ab650e87488\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"66370ee2-6d4e-45d8-9e72-790f8c9440ee\"}":{"__typename":"Education","uuid":"66370ee2-6d4e-45d8-9e72-790f8c9440ee","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Chemical Engineering","degree":null},"Testimonial:b0ded2a9-dd76-4619-bc95-8ec4a27e3054":{"__typename":"Testimonial","id":"b0ded2a9-dd76-4619-bc95-8ec4a27e3054","text":"Nailah has truly been an exceptional help these past 7 months. From the moment she became my mentor, I felt like we instantly bonded! She is such an amazing listener and fun person to talk to. She also made learning beyond fun! She is so hardworking and talented, and that certainly did not go unnoticed. She is a wonderful person and never failed to put a smile on my face. I really appreciate Nailah so much, and I truly hope she can be my mentor next school year too!","date":"2025-06-04 02:35:06.154+00","rating":5,"endorser":{"__typename":"Endorser","name":"Siana Brayboy","tagline":"","avatar":null}},"Testimonial:beec3118-a52c-49aa-8018-a401fc5f9cc6":{"__typename":"Testimonial","id":"beec3118-a52c-49aa-8018-a401fc5f9cc6","text":"What an amazing mentor! Professional, yet makes learning so much fun! We are so grateful to have her!","date":"2025-06-02 10:59:24.634+00","rating":5,"endorser":{"__typename":"Endorser","name":"Lauren Silvers","tagline":"","avatar":null}},"Testimonial:ac1d1f5c-2aa7-442d-99ba-b7434b976766":{"__typename":"Testimonial","id":"ac1d1f5c-2aa7-442d-99ba-b7434b976766","text":"The best testimonial  for  excellence  is the response to the question, \"how was your lesson this week?\".\n\"It was great!!\".\nFreddie was excited every week to be with his mentor, Nailah.\nShe created a rapport that made it easy for Freddie to  gain confidence and  skill..","date":"2025-05-29 11:18:41.264+00","rating":5,"endorser":{"__typename":"Endorser","name":"Valencia Arceneaux","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"2c2a1af0-c27d-4b15-9699-2481741973af\"}":{"__typename":"MentorPublicProfile","uuid":"2c2a1af0-c27d-4b15-9699-2481741973af","displayName":"Nailah D.","slug":"nailah-donatto","biography":"\u003cp\u003eNailah is currently pursuing a Bachelor’s degree in Chemical Engineering with a minor in Music at Stanford University.\u003c/p\u003e\u003cp\u003eNailah grew up in a small rural town in southeast Texas with just over 800 people! Working in labs and music halls across the country fostered her love for math, science, and music. During high school, she became a Texas State Champion in Poetry Interpretation and a three-time Texas All-State Choir member. She balanced these achievements with four years on the varsity track and basketball teams.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNailah’s passion for mentoring and teaching began in her final year of high school when she started her own tutoring business for students overwhelmed by their workload. This venture expanded into coaching middle school children in voice lessons. Nailah hopes to continue nurturing her passion for teaching and mentoring by encouraging students from all backgrounds and age groups to achieve all they set their minds to.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOvercoming the small-town mindset, Nailah pursued her ambitions in California, where she currently attends university and conducts research in a wastewater treatment laboratory. In her free time, she enjoys singing with her A-cappella group, which she co-directs, watching sports, and solving escape rooms with friends. Nailah also finds relaxation in building Lego sets, watching Marvel movies, and playing solitaire.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"LAOZwbI3GTj8Nmtwsfq1c1YmOCFYNX5K9K6KyxvACsU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThe Summer of 2022, I attended a program at Carnegie Mellon University, at the end of the program I was awarded the Math Alumni Award by the universities math professors. I was really proud for winning because I stayed after class everyday to get extra work. Going the extra mile pays off!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"92a7d7d7-afd5-40c0-ad8c-5711c3f2feca\"}"},{"__ref":"Favorites:{\"uuid\":\"5e500fb5-2b14-4738-b5ad-1412f1d54b22\"}"},{"__ref":"Favorites:{\"uuid\":\"f26d80cb-8d21-427a-a6bd-d51f19c39cb5\"}"}],"causesSupported":[],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f078bbf5-5f93-4f42-8d44-d05ba727f431\"}"},{"__ref":"DeepDives:{\"uuid\":\"e09fc680-cd15-4c73-abcb-0bac23938fec\"}"},{"__ref":"DeepDives:{\"uuid\":\"ca83efe9-33bc-42ec-aae8-2d5fe5f02f3c\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea0ade3b-f2e5-4bb5-be59-520d41f44d27\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/577a0763-ad23-4fdf-96a0-54d1ece656b8/-/preview/-/format/jpg/","https://ucarecdn.com/241fd472-2b0a-430d-a333-77f864043dd3/-/preview/-/format/jpg/","https://ucarecdn.com/02f98e62-6088-4348-824b-b44331eca947/-/preview/-/format/jpg/"],"pron
