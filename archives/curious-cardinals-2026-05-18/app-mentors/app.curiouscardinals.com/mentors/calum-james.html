xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7fb58a0e-fe5d-417b-893b-1b1fc5eafb9a\"}":{"__typename":"DeepDives","uuid":"7fb58a0e-fe5d-417b-893b-1b1fc5eafb9a","content":"\u003cp\u003eIn my spare time, sport is a big part of my life. I’ve played soccer for most of my life, starting at club level and continuing through high school, and now I play competitively at Trinity College Dublin. It’s something I really enjoy, not just for the competition but for the structure and consistency it brings. Training regularly and playing matches has taught me a lot about discipline, teamwork, and performing under pressure.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside soccer, I’ve gotten really into endurance sports. I’ve completed an Ironman 70.3 (1.2 mile swim, 56 mile bike ride, and 13.1 mile run), which was a huge challenge but also one of the most rewarding things I’ve done. Training for it pushed me physically and mentally and taught me how to stay consistent over long periods of time even when progress feels slow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also signed up to run the New York City Marathon, where I’ll be raising money for type one diabetes. That’s something that means a lot to me as a type 1 diabetic, and it adds another layer of purpose to the training.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also done a number of adventure races and endurance events around Ireland, which I enjoy because they’re a bit more unpredictable and require you to adapt. Whether it’s cycling, running, or just being outdoors in a tough environment, I like the challenge of pushing myself and seeing how far I can go.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d06d7d5b-e921-4691-9bdc-e708f41652ca\"}":{"__typename":"DeepDives","uuid":"d06d7d5b-e921-4691-9bdc-e708f41652ca","content":"\u003cp\u003eMy long term goal is to work in venture capital, specifically focused on science and healthcare. I’m really interested in finding and supporting early stage ideas that can actually improve how healthcare works, whether that’s through better technology, better data systems, or new approaches to treatment and prevention.\u003c/p\u003e\u003cp\u003eWhat draws me to venture is the combination of science, strategy, and people. You need to understand the underlying science well enough to know what is real and what is not, but you also need to think about how something becomes a company, how it scales, and whether it can actually have real impact. I like that balance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis summer, I’ll be working in business operations, which I’m excited about because it gives me a better understanding of how companies actually run day to day. I think that operational perspective is really important if you want to work in venture, because you’re not just evaluating ideas, you’re supporting founders who are building something from the ground up.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also about to start as a venture scout in Europe, where I’ll be sourcing early stage startups and learning how investors evaluate opportunities. That’s something I’m really looking forward to because it puts me directly in the ecosystem and helps me build a strong understanding of what makes a company stand out.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLong term, I want to be in a position where I can help identify and support companies that are solving meaningful problems in healthcare and science. I think there’s a lot of opportunity to improve how information is used, how decisions are made, and how care is delivered, and I want to be part of building that future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"c628e3de-6cca-430a-98b8-15d7848c1322\"}":{"__typename":"DeepDives","uuid":"c628e3de-6cca-430a-98b8-15d7848c1322","content":"\u003cp\u003eSomething about me that isn’t obvious right away is that I have type one diabetes. It’s not something you would notice just from meeting me, but it’s a big part of my life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt’s something I’ve learned to manage alongside everything else I do, whether that’s academics, sport, or other commitments. Playing competitive football, training for endurance events, and completing an Ironman 70.3 all required a lot of extra planning, discipline, and awareness because I always have to think about things like energy levels, nutrition, and recovery more carefully.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, it’s never been something I’ve let limit what I do. If anything, it’s made me more structured and resilient. It’s taught me how to stay consistent, how to deal with setbacks, and how to keep going even when things are not perfect.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think it’s shaped how I approach challenges in general. I don’t expect things to be easy, but I know I can figure them out and adapt. And I bring that mindset into everything I do, whether it’s in sport, academics, or working on projects.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"78e2f29e-b260-46ba-af79-2ce7ac25fbe1\"}":{"__typename":"DeepDives","uuid":"78e2f29e-b260-46ba-af79-2ce7ac25fbe1","content":"\u003cp\u003eI always knew I wanted to study some form of science. I’ve always been interested in how things work and understanding systems at a deeper level.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI chose neuroscience specifically because I did a neuroscience research project in high school and really enjoyed it. It was the first time I got to explore how the brain actually functions and how that connects to behavior and decision making, and that stuck with me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, it’s felt like a really strong foundation for what I want to do long term. Neuroscience gives me a solid scientific background, but it also connects to real world problems, especially in healthcare and human behavior, which I find really interesting.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt also pushes me to think both analytically and conceptually, which is something I value. Overall, it felt like the right balance of science, application, and long term relevance for the path I want to pursue.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"e1b99b33-e1f0-4ee7-bdc8-927dd9799262\"}":{"__typename":"Education","uuid":"e1b99b33-e1f0-4ee7-bdc8-927dd9799262","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"8f521aa0-8c54-4437-873c-5d17b9586d17\"}":{"__typename":"Education","uuid":"8f521aa0-8c54-4437-873c-5d17b9586d17","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Neuroscience and Behavior","degree":null},"MentorPublicProfile:{\"uuid\":\"1715a5f0-f402-4c9c-8fee-08833719995c\"}":{"__typename":"MentorPublicProfile","uuid":"1715a5f0-f402-4c9c-8fee-08833719995c","displayName":"Calum U.","slug":"calum-james","biography":"\u003cp\u003eI am a second year undergraduate in the Trinity College Dublin and Columbia University Dual BA program, studying Neuroscience and Behavior. My academic interests focus on how people make decisions, how the brain processes information, and how this translates into real world behavior, especially in high pressure environments. I am particularly interested in applying scientific thinking beyond the classroom to solve practical problems in areas like healthcare, performance, and human behavior.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlongside my studies, I have spent a significant amount of time involved in entrepreneurship. I have gone through the process of co-founding a company, speaking with users, working with accelerators, and pitching ideas in competitive environments. Through this, I have learned how to take an idea from concept to something that can actually be tested and improved in the real world. I have worked closely with teams, sought feedback from mentors and industry professionals, and developed a strong understanding of how to think critically about problems, communicate clearly, and adapt quickly.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy scientific experience has been shaped through both academic and practical work. I completed a research internship with Anew Material, where I worked on developing and testing biodegradable films. This involved designing and running experiments, analyzing material properties, and iterating based on results. The experience strengthened my ability to think experimentally, troubleshoot problems, and work systematically. I was also selected for the Johnson and Johnson Winning in STEM program in Ireland, where I engaged with industry professionals and gained exposure to real world applications of science in healthcare and biotechnology.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSport has also played a major role in shaping who I am. I play competitive soccer at Trinity College Dublin, which has taught me discipline, consistency, and how to perform under pressure. Training and competing at a high level has reinforced the importance of preparation, resilience, and teamwork. I am also an Ironman 70.3 finisher, which reflects my commitment to long term goals and the ability to push through physically and mentally demanding challenges.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I spend a lot of time breaking down complex material into clear and understandable concepts. I focus on learning in a way that allows me to actually apply what I know, rather than just memorize information. I am particularly strong at simplifying difficult topics and helping others see how different ideas connect. I care about helping students build confidence in how they think, not just what they know. My approach is structured, clear, and focused on making sure concepts actually make sense. I aim to create an environment where students feel comfortable asking questions, working through problems, and improving over time.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"xMlvE2Dnlu8K0100nouy01hUhcJQt00WQXBsW39eB1OyMo8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience and Behavior","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7fb58a0e-fe5d-417b-893b-1b1fc5eafb9a\"}"},{"__ref":"DeepDives:{\"uuid\":\"d06d7d5b-e921-4691-9bdc-e708f41652ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"c628e3de-6cca-430a-98b8-15d7848c1322\"}"},{"__ref":"DeepDives:{\"uuid\":\"78e2f29e-b260-46ba-af79-2ce7ac25fbe1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1862f35b-a708-4054-bfed-11d11e244c95/-/preview/-/format/jpg/","https://ucarecdn.com/efc50cb6-4672-4b0f-adbb-bf9662b2327e/-/preview/-/format/jpg/","https://ucarecdn.com/c189354c-865e-4a26-b972-a02009229154/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e1b99b33-e1f0-4ee7-bdc8-927dd9799262\"}"},{"__ref":"Education:{\"uuid\":\"8f521aa0-8c54-4437-873c-5d17b9586d17\"}"}],"hiredAt":"2026-04-14T03:08:15.844Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"calum-james\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1715a5f0-f402-4c9c-8fee-08833719995c\"}"}}},"_sentryTraceData":"389b2cf40c434dfa82c2b3131d111206-bf6203ddc8a9169c-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=389b2cf40c434dfa82c2b3131d111206,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"calum-james"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager
