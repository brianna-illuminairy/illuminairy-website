xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9a5a541a-5eb2-4133-b126-b466cd65f0d5\"}":{"__typename":"DeepDives","uuid":"9a5a541a-5eb2-4133-b126-b466cd65f0d5","content":"\u003cp\u003eI would tell myself to start focusing on what I truly want to do. This is something I have only recently understood, but remember my time in middle / high school -- shutting out my own genuine interests for things that made me seem 'cool' or gave me some kind of upward trajectory socially. Pursuing these 'cool' things was never rewarding, and I have recently found many things that I genuinely enjoy, which has been significantly more rewarding when I pursue them with real, deep interest.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"b199046c-3b36-47e4-b6ec-cb690eb60a2e\"}":{"__typename":"DeepDives","uuid":"b199046c-3b36-47e4-b6ec-cb690eb60a2e","content":"\u003cp\u003eMy dad is by far my greatest role model / mentor in my life. I hope one day to live a life similar to his -- with a loving family that mutually supports each other, several interests and hobbies that he pursues in his free time, relationships with friends that have spanned his entire lifetime, and a great job that allows him flexibility to take care of all of the great things in his life. I love asking him about his life and journey to reaching his current life, and always find his advice extremely helpful and insightful. Whenever I face a dilemma or problem that I don't know the answer to, he is the first person I think to ask for help, and he is always willing to talk it through.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a196913b-d003-4c47-8e28-31b7e79fcd65\"}":{"__typename":"DeepDives","uuid":"a196913b-d003-4c47-8e28-31b7e79fcd65","content":"\u003cp\u003eMentorship is important to me because of  the deep appreciation for mentorship that I have received from role models in my life. There have been plenty of times in my life where I have been overwhelmed, confused, unaware, etc, and have received critical mentorship. I love being able to be on the other side of this dynamic, to share my own accumulated wisdom with others when I have been in their shoes before. I am an older brother, and find my relationship with my brother incredibly rewarding, especially when I can provide insights into things I have experienced previously. I also was a counselor at a summer camp, and experienced a similar relationship with my campers -- I remembered being their age and found it particularly rewarding to share my own experiences from when I was in their shoes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d9ce6ef5-76c5-41a5-a52d-c6918020c67b\"}":{"__typename":"DeepDives","uuid":"d9ce6ef5-76c5-41a5-a52d-c6918020c67b","content":"\u003cp\u003eHobbies are something I have recently fell in love with. The most important hobby in my life is fitness and health -- I love listening to podcasts about health, cooking healthy food, working out every day, and playing sports with friends. In addition to fitness, I have recently found a new love for chess, and play whenever I am not doing something else. I love the strategy that goes into the game, and how with any move, the entire strategy can change. I also love watching movies, having a specific appreciation for psychological thriller movies and plot-twists. Further, I love classic rock music, history documentaries, and spending time with friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6\"}":{"__typename":"School","uuid":"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6","name":"Parkland High School","city":"Allentown","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"18104"},"Education:{\"uuid\":\"591e13f3-c889-49f8-835b-ca6ed00f933c\"}":{"__typename":"Education","uuid":"591e13f3-c889-49f8-835b-ca6ed00f933c","school":{"__ref":"School:{\"uuid\":\"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"f6e6127f-cf97-41d3-ae9e-aaefb1a497fa\"}":{"__typename":"Education","uuid":"f6e6127f-cf97-41d3-ae9e-aaefb1a497fa","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"7ba0a0e7-8462-4404-9f2a-a7b501ec7e4d\"}":{"__typename":"MentorPublicProfile","uuid":"7ba0a0e7-8462-4404-9f2a-a7b501ec7e4d","displayName":"Sam O.","slug":"sam-oxfeld","biography":"\u003cp\u003eHello!\u003cbr\u003e\u003cbr\u003eMy name is Sam Oxfeld, and I am currently a Junior at Northwestern University studying Economics and History. I am originally from Allentown, Pennsylvania, a small town about an hour outside of Philadelphia.\u003cbr\u003e\u003cbr\u003eHaving been an older brother my entire life, as well as a camp counselor for the past 3 summers, I have grown to appreciate mentorship to the highest degree. I have found incredible mentorship from my parents, friends, and role models though out my life, which has guided me throughout uncertain and difficult times. This mentorship has been instrumental, and, as a result, I love being able to play the part of mentor and role model.\u003cbr\u003e\u003cbr\u003eI have just concluded a semester abroad in Madrid, and am excited to return to Chicago to complete my final two years of college. I will be going into finance after college and am particularly interested in investing and banking. On campus, I am an officer for an organization that provides critical career recruitment services to Northwestern students pursuing careers in finance. Through this organization, I have loved being able to give back all of the advice that I received in my first two years at Northwestern. \u003cbr\u003e\u003cbr\u003eI also love playing basketball with friends, classic rock music, learning guitar, fitness, and watching psychological thriller movies.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"8D5b1l0200VSKYgRY6PJwYK2obq01003X7OAACVFddNIM1w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9a5a541a-5eb2-4133-b126-b466cd65f0d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"b199046c-3b36-47e4-b6ec-cb690eb60a2e\"}"},{"__ref":"DeepDives:{\"uuid\":\"a196913b-d
