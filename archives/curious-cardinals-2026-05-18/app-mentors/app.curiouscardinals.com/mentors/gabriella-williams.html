xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"75eb947d-763a-431c-84ea-1183d64eb48c\"}":{"__typename":"DeepDives","uuid":"75eb947d-763a-431c-84ea-1183d64eb48c","content":null,"videoPlaybackId":"Rqu9Z02Fn00V00FNtM8005HqGzuAsOrQdfACpUq37cSRHeQ","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d0a2175c-08b4-4290-a439-ec1724a089a7\"}":{"__typename":"DeepDives","uuid":"d0a2175c-08b4-4290-a439-ec1724a089a7","content":"\u003cp\u003eThroughout my high school years, I dedicated myself to tutoring and mentoring a second-grade girl at a local neighborhood center aimed at tackling social and economic challenges. Over the course of three years, I witnessed the remarkable transformation that our collaboration sparked, igniting a profound passion within me for unlocking collective potential and fostering positive community impact. Although my involvement at the center has evolved due to academic commitments, my journey continued as a prototyping shop trainer at Northwestern University.In my role, leading training sessions with resilience has consistently resulted in numerous \"Aha\" moments and fostered an unparalleled sense of connection and energy within the shop. These experiences have continued to inspire me, reinforcing my commitment to mentorship and the profound impact it can have on individuals and communities alike.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f9452f10-10e7-4de7-90cd-a40d7bb220c3\"}":{"__typename":"DeepDives","uuid":"f9452f10-10e7-4de7-90cd-a40d7bb220c3","content":"\u003cp\u003eIf I could offer advice to my younger self in middle or high school, I would stress the significance of forming relationships with everyone in the school community, not just those directly linked to academic success. While grades and recommendations are crucial, I've learned that meaningful connections with individuals such as the lunch staff, janitors, and campus traffic managers can profoundly shape daily experiences. By fostering relationships across all levels of the school community, I would have gained a deeper understanding of the real world and developed empathy and perspective much earlier. These connections offer insights into diverse perspectives and life experiences, providing an education that goes beyond the classroom.mIt's important to recognize that many service workers on campus engage more frequently with students than faculty, offering valuable learning opportunities. Acknowledging and appreciating their wisdom can enrich the entire campus community, contributing to a more inclusive and supportive environment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"71610726-45ab-4cc6-b03a-491537fda511\"}":{"__typename":"DeepDives","uuid":"71610726-45ab-4cc6-b03a-491537fda511","content":"\u003cp\u003eYou might not guess it at first, but I'm not exactly a TV and movie buff. Growing up, I didn't watch much TV or many movies, so I never quite got into the habit. While my friends joke about my lack of knowledge on actors' names or classic films, I surprise them with my deep understanding of pop culture.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn another note, I'm the unofficial personal maintenance repairwoman in my house of nine girls! From fixing leaky faucets to assembling furniture, I've got it covered. In fact, for Secret Santa, they even got me my own personalized monogrammed tool kit. It's just another unexpected facet of who I am!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLastly, if you ever need to find the best gluten-free sweet treat in town, I'm your go-to person! Dealing with Celiac Disease hasn't stopped me from enjoying delicious desserts. In fact, it's turned me into a connoisseur of gluten-free goodies. Whether I'm at home or traveling, I always seek out the tastiest gluten-free delights to satisfy my sweet tooth and share with others :)\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"9d5c7df7-ea40-459f-97f2-409cb13272dc\"}":{"__typename":"School","uuid":"9d5c7df7-ea40-459f-97f2-409cb13272dc","name":"Skyline High School","city":"Ann Arbor","type":"HIGH","state":"Michigan","country":"United States","zip":"48103"},"Education:{\"uuid\":\"5e46905c-282a-41ab-a61d-e4e9408fd19a\"}":{"__typename":"Education","uuid":"5e46905c-282a-41ab-a61d-e4e9408fd19a","school":{"__ref":"School:{\"uuid\":\"9d5c7df7-ea40-459f-97f2-409cb13272dc\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"3c62d2b1-d4a6-4452-b44e-c9adc29d589a\"}":{"__typename":"Education","uuid":"3c62d2b1-d4a6-4452-b44e-c9adc29d589a","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Manufacturing and Design Engineering ","degree":null},"Testimonial:178707a6-88df-4bc2-b74d-66018f48454b":{"__typename":"Testimonial","id":"178707a6-88df-4bc2-b74d-66018f48454b","text":"Gabriela has been a wonderful mentor for our daughter, Nadia. With incredible patience and technical insight, she’s helped Nadia take the first steps toward her dream of building a flying car one day! From imaginative sketches to learning 3D modeling and coding, Gabriela has guided her with care and enthusiasm — and Nadia always looks forward to their sessions. Gabriela has also shared thoughtful ideas to keep Nadia engaged offline (like CrunchLabs and KiwiCo kits), which shows how deeply she cares about her mentees. She’s also been flexible with scheduling, which we’ve really appreciated during busy school weeks and travel.\n\nGabriela’s mentorship has truly nurtured Nadia’s scientific spark, and we’re extremely grateful for that! Thank you, Gabriela!","date":"2025-06-03 07:54:25.271+00","rating":5,"endorser":{"__typename":"Endorser","name":"Niketha Sushilkumar","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"be5257bb-e422-46de-9558-8a9983473ccf\"}":{"__typename":"MentorPublicProfile","uuid":"be5257bb-e422-46de-9558-8a9983473ccf","displayName":"Gabriella W.","slug":"gabriella-williams","biography":"\u003cp\u003eHey! I'm Gabriella, big fan of the outdoors, constantly on the move, and all about finding the funny in everything. I’m currently navigating the dual paths of a Bachelor's and Master's in Manufacturing and Design Engineering/Mechanical Engineering at Northwestern University. I grew up in Ann Arbor, Michigan, which means I’m all about that Wolverine football spirit (Go Blue!) and I’m a big fan of experiencing all four seasons to the fullest.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my role as a Shop Trainer and Prototyping Specialist at the Segal Design Institute, I have the privilege of mentoring engineering students, leading advanced machining projects, and prioritizing safety and innovation. My passion for engineering is not confined to academia; it extends into personal projects and research in rapid AI manufacturing. My professional journey has been enriched by internships at Nike and Lear Corporation, where I embraced operational excellence and strategic initiative implementation, gaining invaluable industry insights along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not immersed in engineering, I indulge in baking gluten-free treats, exploring thrift shops with friends, conquering national parks, or unwinding in a hammock with a good self-help book. Currently, I’m reading \"SPRINT – How to Solve Big Problems and Test New Ideas in Just Five Days,\" a testament to my love for tackling challenges with innovative solutions! My quest to explore the great outdoors has taken me to 18 of the 62 national parks, with plans to visit eight more this summer. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the heart of my endeavors is a profound passion for unleashing collective potential. My experiences have shown me the transformative power of mentorship, and as a mentor, my mission is to empower my mentees to explore their passions, think creatively, and pursue excellence with resilience and determination. I aspire to be a catalyst for growth, inspiring my mentees to unlock their full potential and navigate their paths with confidence and curiosity.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"WQaCn3EllDyDFjiluiCBhi43qr401FvFwduQdNxXaD9w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Manufacturing and Design Engineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"75eb947d-763a-431c-84ea-1183d64eb48c\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0a2175c-08b4-4290-a439-ec1724a089a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9452f10-10e7-4de7-90cd-a40d7bb220c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"71610726-45ab-4cc6-b03a-491537fda511\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/18c785af-fc10-4d3a-8db4-b80fec84811e/-/preview/-/format/jpg/","https://ucarecdn.com/65dd7792-8c52-49bf-882e-0f51fc1dd661/-/preview/-/format/jpg/","https://ucarecdn.com/2ade66da-8dd2-4324-b69c-a6eaefb882c1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5e46905c-282a-41ab-a61d-e4e9408fd19a\"}"},{"__ref":"Education:{\"uuid\":\"3c62d2b1-d4a6-4452-b44e-c9adc29d589a\"}"}],"hiredAt":"2024-03-11T17:53:00.548Z","topics":["Visual Arts / Graphic Design","Robotics / Electronics / CAD","STEM Project"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:178707a6-88df-4bc2-b74d-66018f48454b"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gabriella-williams\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"be5257bb-e422-46de-9558-8a9983473ccf\"}"}}},"_sentryTraceData":"7dae26be9bb34e0598c5961a711b6dad-a95501a140a1ca63-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7dae26be9bb34e0598c5961a711b6dad,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"gabriella-williams"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n
