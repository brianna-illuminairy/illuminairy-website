xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c04d42bb-79a3-4e5c-972f-c3a9f99b09f7\"}":{"__typename":"Favorites","uuid":"c04d42bb-79a3-4e5c-972f-c3a9f99b09f7","photoUrl":"https://ucarecdn.com/5231af34-a9e9-4ad3-bc8d-e952060baacd/","title":"Don't Think Twice, It's Alright by Bob Dylan","type":"SONG"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6db7be9d-9840-457c-ae48-4f213e204344\"}":{"__typename":"DeepDives","uuid":"6db7be9d-9840-457c-ae48-4f213e204344","content":"\u003cp\u003eMy dream job would be working as an investigative reporter for a major American news outlet like the New York Times, ProPublica, or the Boston Globe. More than anything, I enjoy the challenge of deeply reporting a new story that changes the discourse about a particular organization, government agency, or local problem. I did that this summer when worked with a prominent investigative news outlet in Peru to look into the rise of organized crime in civil construction projects across the country. And I did that on the Crimson when I looked at the plague of overcrowded housing that was rising in the Allston neighborhood of Boston as a confluence of trends, including immigration patterns and the local housing crisis, created dangerous and demeaning conditions for the area's undocumented population. My dream is to continue that kind of work as I graduate and move into the full-time workforce.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"69fde27f-6971-43c7-8121-2edc9a1b4c7a\"}":{"__typename":"DeepDives","uuid":"69fde27f-6971-43c7-8121-2edc9a1b4c7a","content":"\u003cp\u003eMy greatest mentors have always been my editors. Good reporting and writing are both such challenging skills that can only be taught by direct, one-on-one interpersonal mentoring. It has to be personalized and there has to be a real relationship for it to work, and the editing process is the ideal place for that to happen. As an editor myself this year, I tried to take on the high expectations and standards I've always been held to alongside the valuable lessons and conversations about how to present information in an intentional way and deliver that to both my reporters, and the many friends of mine who I have given help in writing cover letters, application supplements, and class essays.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7064b432-5b85-4e61-80c5-25d3319ea587\"}":{"__typename":"DeepDives","uuid":"7064b432-5b85-4e61-80c5-25d3319ea587","content":"\u003cp\u003eMy major, which is an interdisciplinary social science field that includes philosophy, political science, and history at its core, has been a highlight of my college experience. I chose it because the major dedicates extensive time to high-level social and political theory that taught me to think in a sophisticated way. Reading canonical theorists like Michel Foucault, Jean-Jacques Rousseau, Theodor Adorno, and Emile Durkheim have given me deep experiencing not just in processing facts and information, but instead in quickly learning and engaging with \u003cem\u003etheory\u003c/em\u003e: that is, ideas about how entire systems (the economy, the government, religion) work, and ways of interpreting that world that propose original relationships between the material and the abstract. While this is primarily college- and graduate-level thinking, that background has given me excellent fluency in mentoring students in all sorts of analysis across social science and humanities fields, whether that be in fiction passages for English class, or historical documents for APUSH. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"13687869-b20e-429d-84ab-960fbffbe2c5\"}":{"__typename":"DeepDives","uuid":"13687869-b20e-429d-84ab-960fbffbe2c5","content":"\u003cp\u003eI'm a passionate learner, and in high school I often spent time reading classic literature like the Iliad or trying to become more fluent in languages like Latin and Italian. In mentorship, I work well with driven learners like me! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3c823eb3-44d9-4706-abf0-1ae81403d6c4\"}":{"__typename":"School","uuid":"3c823eb3-44d9-4706-abf0-1ae81403d6c4","name":"Boston Latin School (BLS)","city":"Boston","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02115"},"Education:{\"uuid\":\"91bf4411-d9ca-4ba8-bc54-c2143ec32cb0\"}":{"__typename":"Education","uuid":"91bf4411-d9ca-4ba8-bc54-c2143ec32cb0","school":{"__ref":"School:{\"uuid\":\"3c823eb3-44d9-4706-abf0-1ae81403d6c4\"}"},"startYear":"2016","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"cac9faa2-3573-40fe-a3f8-c7fe8db35491\"}":{"__typename":"Education","uuid":"cac9faa2-3573-40fe-a3f8-c7fe8db35491","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Social Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"b5ab7001-0078-4a24-be15-aa6336b4a24a\"}":{"__typename":"MentorPublicProfile","uuid":"b5ab7001-0078-4a24-be15-aa6336b4a24a","displayName":"Jack T.","slug":"jack-trapanick","biography":"\u003cp\u003eHey! I'm Jack, a Harvard senior pursuing a career as a news reporter and with expertise in teaching essay writing and student journalism. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore Harvard, I edited my high school student paper's opinion section, while here I Harvard, I switched into hard news and became a metro reporter covering Harvard's relationship with Boston and its long-running expansion across the Charles River. My stories brought me to all sorts of unexpected places, including Boston's biotech industry, all corners of Cambridge's city government, masses at neighborhood churches, and local aid networks run by community nonprofits.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy 80+ stories ranged from breaking news to deeply-sourced investigations on the cover of our weekly print edition. In my final year on the Crimson, I mentored a team of 20 younger metro reporters in the skills it takes to build relationships with influential local officials and leaders, evaluate possible angles for the a complicated set of reported facts, and ultimately write a clear, informative, and original story based on their information. That year editing over 100 originally-reported news stories gave me great experience in editing and crafting narratives that will be closely read and picked apart by the public -- and equips me well to help high school students interested in improving their essay skills, putting together a college essay, or who already work in student journalism in some capacity. I hope you'll reach out to me if I can be of assistance with any of those abilities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore college, I attended an exam school with an intensive curriculum and an AP-heavy courseload, where I edited the student paper, led our GSA, and regularly competed in public speaking. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, I study a mix of anthropology and philosophy, and have also become fluent in Spanish through courses and summer journalism work abroad in South America.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith that experience, I would be thrilled to assist students in any kind of nonfiction essay/journalistic or similar kinds of writing; to tutor students in a range of subjects in the humanities, including AP Literature, Latin, Spanish, English and History classes; or to help improve executive functioning strategies necessary to make any of those projects happen. \u003c/p\u003e","teachingVideoPlaybackId":"7vzpuIHp002ujxmLHWDquzwLUNDxuATMXtFfpPf800Syo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c04d42bb-79a3-4e5c-972f-c3a9f99b09f7\"}"}],"causesSupported":[],"major":"Social Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6db7be9d-9840-457c-ae48-4f213e204344\"}"},{"__ref":"DeepDives:{\"uuid\":\"69fde27f-6971-43c7-8121-2edc9a1b4c7a\"}"},{"__ref":"DeepDives:{\"uuid\":\"7064b432-5b85-4e61-80c5-25d3319ea587\"}"},{"__ref":"DeepDives:{\"uuid\":\"13687869-b20e-429d-84ab-960fbffbe2c5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2694c672-523f-4f7a-b6ab-e718c295abd2/-/preview/-/format/jpg/","https://ucarecdn.com/3f7e8077-6c27-4514-9b9a-ac0cc603ee27/-/preview/-/format/jpg/","https://ucarecdn.com/ab328e86-479c-435f-82c8-d43ce60fe2af/-/preview/-/format/jpg/"],"prono
