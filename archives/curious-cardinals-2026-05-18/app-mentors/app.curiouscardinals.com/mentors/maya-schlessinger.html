xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bed6a02f-6168-4221-8265-816299e9abdd\"}":{"__typename":"Favorites","uuid":"bed6a02f-6168-4221-8265-816299e9abdd","photoUrl":"https://ucarecdn.com/3280d233-d314-4360-bc1c-93f46a8e684d/","title":"Mindy Kaling","type":"ACTOR"},"Favorites:{\"uuid\":\"fd5bcfde-1e36-4152-9971-06666a649cfb\"}":{"__typename":"Favorites","uuid":"fd5bcfde-1e36-4152-9971-06666a649cfb","photoUrl":"https://ucarecdn.com/f9b1c117-2a2d-4277-9513-440e21565a42/","title":"Folklore by Taylor Swift","type":"ALBUM"},"Favorites:{\"uuid\":\"77cdb345-d79a-4b34-b4fa-99677b014088\"}":{"__typename":"Favorites","uuid":"77cdb345-d79a-4b34-b4fa-99677b014088","photoUrl":"https://ucarecdn.com/4c0ac6bf-3afd-45ff-8201-e3eff41bc362/","title":"Mamma Mia","type":"MOVIE"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"cfd8e50d-2ca6-464e-9f8a-2be3a82e1ab4\"}":{"__typename":"DeepDives","uuid":"cfd8e50d-2ca6-464e-9f8a-2be3a82e1ab4","content":"\u003cp\u003eIn high school, I spent my summers going to sleep away camp! There was truly no place I loved more. From learning how to make friendship bracelets to paddle boarding on the lake- I cherished my summers of constant activity and close community. My favorite activities were cooking and going all out for color war. I embraced my silly side at camp and am forever grateful for that space to learn and grow. My camp friends and memories are still some of my best, and I hold them close to my heart. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"65e3cbef-5045-488c-9943-e2925da5a586\"}":{"__typename":"DeepDives","uuid":"65e3cbef-5045-488c-9943-e2925da5a586","content":"\u003cp\u003eI would tell my middle school self to try everything; you never know what's going to stick! After years of telling my mom that I wasn't interested in journalism, I finally decided to join the school newspaper to see what it was all about. Before I knew it, I was editor-in-chief and found a real passion for writing. I wish I could go back and tell myself that there is no way to know if you like something until you try. In college, I've tried so many different things I never thought I would, and I think that's what education is all about: exploring our curiosities!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"12a8a995-4447-4b02-a86a-54a39f30b8d6\"}":{"__typename":"DeepDives","uuid":"12a8a995-4447-4b02-a86a-54a39f30b8d6","content":"\u003cp\u003eIn high school, I started a community service sewing club called Clothing for a Cause. I wanted to spread my love of sewing and direct it towards something meaningful. At bimonthly meetings, I taught members how to operate the sewing machine and create beautiful garments. By the end of each year, we shipped large boxes of hand-made pieces to the Native American Heritage Association for reservations in need. It was the most rewarding thing to create something from nothing and help a community in need.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"069a0f97-9565-4e70-9402-0df05d9dcb80\"}":{"__typename":"DeepDives","uuid":"069a0f97-9565-4e70-9402-0df05d9dcb80","content":"\u003cp\u003eIn my free time, I love to upcycle my clothes! This means that I take my old pieces and turn them into new ones through sewing. One of my favorite transformations was turning a pair of plaid pajama pants into a Clueless-inspired skirt! Sewing is a great creative outlet for me to express myself and freshen up my closet at no cost!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"eed85ca9-b63a-4829-bf6f-843d06523583\"}":{"__typename":"School","uuid":"eed85ca9-b63a-4829-bf6f-843d06523583","name":"Pascack Valley High School","city":"Hillsdale","type":"HIGH","state":"New Jersey","country":"United States","zip":"07642"},"Education:{\"uuid\":\"41a4634f-eae7-412e-beb5-5e065a8a2da1\"}":{"__typename":"Education","uuid":"41a4634f-eae7-412e-beb5-5e065a8a2da1","school":{"__ref":"School:{\"uuid\":\"eed85ca9-b63a-4829-bf6f-843d06523583\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"b85c3379-8fed-4c5d-ad1a-67c179451d37\"}":{"__typename":"Education","uuid":"b85c3379-8fed-4c5d-ad1a-67c179451d37","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Law, History, and Society","degree":null},"MentorPublicProfile:{\"uuid\":\"26c6b43c-c882-4b59-8d34-f5f5123d2294\"}":{"__typename":"MentorPublicProfile","uuid":"26c6b43c-c882-4b59-8d34-f5f5123d2294","displayName":"Maya S.","slug":"maya-schlessinger","biography":"\u003cp\u003eHi, I'm Maya! I'm a rising junior at Vanderbilt University where I'm studying Law, History, and Society with a minor in Business. I'm a true student at heart and love learning about anything and everything from historic social movements to real-world mathematical applications! My favorite classes in school are English, History, and Math!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI have experiences working with middle school and high school aged-kids as a math tutor and a sleepaway camp counselor! My favorite part of these experiences was definitely getting to know each and everyone’s individual personalities and interests. I love to watch them grow as people and students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm involved in my school newspaper and absolutely love to write. Campus life, arts, and culture is my specialty! My favorite format is a feature story, where I get to interview prominent figures in my community! I love coming up with thoughtful questions and making connections with inspiring change-makers. I am most proud of my pieces about a teen self-published author and a Holocaust survivor. I’ve even won some journalism awards for my work!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am also passionate about community service. As a former Girl Scout, I love to give back to the local troops and help with cookie sales! I am also on the executive board for my school’s Relay for Life walk, which raises money for cancer research and patient care! It is such a special initiative that brings the community together to fight for a cure. The last two years were wildly successful, and we've raised over $100,000!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnother campus organization I am a part of is called Students Consulting for Non-Profit Organizations (SCNO). Throughout the year, we work with a local non-profit to solve their problems through free consulting services! This past year, I served as a Senior Consultant to the Tennessee Alliance for Legal Services. I greatly enjoyed collaborating with my peers on this challenging project and was so proud of the final deliverables we shared! It was so cool to share our hard work with the non-profit executives and even cooler to hear that they have implemented our ideas! \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eOn the weekends, you can find me baking cookies, listening to Taylor Swift, or playing pickleball with my friends and family! I also love to watch sitcoms like Brooklyn Nine-Nine.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the future, I hope to become an entertainment lawyer. Combining my passions of law and the arts would be so fulfilling, and going to school in “Music City” Nashville has affirmed my dream.\u0026nbsp;I am studying for the LSAT this summer to get closer to reaching that goal!\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"01tr01Ry4DLnkQoNWI95HVvt3ik1GWs401qSjKVaF6NxxQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bed6a02f-6168-4221-8265-816299e9abdd\"}"},{"__ref":"Favorites:{\"uuid\":\"fd5bcfde-1e36-4152-9971-06666a649cfb\"}"},{"__ref":"Favorites:{\"uuid\":\"77cdb345-d79a-4b34-b4fa-99677b014088\"}"}],"causesSupported":[],"major":"Law, History, and Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cfd8e50d-2ca6-464e-9f8a-2be3a82e1ab4\"}"},{"__ref":"DeepDives:{\"uuid\":\"65e3cbef-5045-488c-9943-e2925da5a586\"}"},{"__ref":"DeepDives:{\"uuid\":\"12a8a995-4447-4b02-a86a-54a39f30b8d6\"}"},{"__ref":"DeepDives:{\"uuid\":\"069a0f97-9565-4e70-9402-0df05d9dcb80\"}"}],"active":true,"profilePhotos":["https:/
