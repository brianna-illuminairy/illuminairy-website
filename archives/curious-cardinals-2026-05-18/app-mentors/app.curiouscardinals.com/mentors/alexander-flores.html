xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5b8ea0cb-c78e-4d53-8bd7-b966ec396079\"}":{"__typename":"DeepDives","uuid":"5b8ea0cb-c78e-4d53-8bd7-b966ec396079","content":"\u003cp\u003eLooking back at my middle school/high school years, there were many opportunities that I should have taken advantage of but did not. I was reserved, quiet, and only talked when needed, which limited my networking chances. Get out there, meet as many people as you can, and find common ground with your peers. Even the smallest of interactions can go a long way, which is why starting conversations is an opportunity for you to expand your worldview. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"98c2d5bb-f576-4ccf-b792-ad6e1cf9987e\"}":{"__typename":"DeepDives","uuid":"98c2d5bb-f576-4ccf-b792-ad6e1cf9987e","content":"\u003cp\u003eMentorship is important to me because of what it has taught me throughout my own academic journey. Having a mentor to guide me through my academic years steered me towards accomplishing my own goals and allowed me to break out of my shell in new environments. I seek to offer students guidance and pathfinding in their own pursuits so they may realize their calling. It is inspiring to learn from someone you view as your future self, and oftentimes spending time with that individual is enough to spark the fire that ignites your passion. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5438456e-f5f9-4689-ab4e-90c45150846e\"}":{"__typename":"DeepDives","uuid":"5438456e-f5f9-4689-ab4e-90c45150846e","content":"\u003cp\u003eI chose my major because I have always been fascinated with rockets and airplanes. A core childhood memory for me was watching in awe as the Space Shuttle Endeavor was being transported to the California Science Center in Los Angeles. Ever since that moment, my sights were set on the stars and above. I am an intrinsic problem-solver with strengths in math and physics, so naturally I enrolled in the Aerospace Engineering Department. After two years of core engineering courses and building amateur rockets, I found my passion for fluids and propulsion. I have worked as a propulsion engineer at a collegiate rocketry club for two years, where I learned the principles of manufacturing, liquid engine design, and CAD. The possibility of humans reaching Mars and other parts of the universe becomes a more obtainable outcome every decade, and I believe now more than ever Aerospace Engineers can impact the history of humanity. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c7155fc3-e1ed-4a0e-b6f9-fb92f26e3bd8\"}":{"__typename":"DeepDives","uuid":"c7155fc3-e1ed-4a0e-b6f9-fb92f26e3bd8","content":"\u003cp\u003eMy dream job is to be the CEO of my own Reusable Rocket Company. I believe that the future of space exploration and discovery lies in the technology of reusable rockets. These reusable rockets will facilitate the commercialization of space by lowering the launch cost of rockets significantly. Through these efforts, I hope to make space travel accessible to the public, so everyone can experience the wonder and awe of traveling to outer space. I am highly inspired by the projects of innovative rocket companies such as SpaceX, Relativity, and Blue Origin. I aim to work at one of these three companies once I enter into industry so I can gain a better understanding of their business models. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"c654f81c-63fd-4fbb-bcad-4c96207f9ce7\"}":{"__typename":"School","uuid":"c654f81c-63fd-4fbb-bcad-4c96207f9ce7","name":"Cathedral High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90012"},"Education:{\"uuid\":\"984ac566-3076-4717-8208-6aebd25760b8\"}":{"__typename":"Education","uuid":"984ac566-3076-4717-8208-6aebd25760b8","school":{"__ref":"School:{\"uuid\":\"c654f81c-63fd-4fbb-bcad-4c96207f9ce7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b8d7ac6b-1315-4810-aad9-7d5923c30a74\"}":{"__typename":"School","uuid":"b8d7ac6b-1315-4810-aad9-7d5923c30a74","name":"University of California San Diego","city":"La Jolla","type":"COLLEGE","state":"California","country":"United States","zip":"92093"},"Education:{\"uuid\":\"8a0ee937-939a-4086-96f5-3f328d84842b\"}":{"__typename":"Education","uuid":"8a0ee937-939a-4086-96f5-3f328d84842b","school":{"__ref":"School:{\"uuid\":\"b8d7ac6b-1315-4810-aad9-7d5923c30a74\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Aerospace Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"88153d2e-a866-4662-9c8a-4a58609c81a3\"}":{"__typename":"MentorPublicProfile","uuid":"88153d2e-a866-4662-9c8a-4a58609c81a3","displayName":"Alexander F.","slug":"alexander-flores","biography":"\u003cp\u003eHey! I'm Alex, a passionate rocket enthusiast and business-savvy entrepreneur. I grew up in Los Angeles and moved to San Diego to study Aerospace Engineering at UCSD. After graduating in June 2025, I continued at UCSD to pursue my Master of Science in Mechanical Engineering. My professional goal is to work as a propulsion engineer in the Aerospace Industry to revolutionize reusable rocket technology.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my undergraduate career, I worked as a propulsion engineer at UCSD's Rocket Propulsion Laboratory (RPL). I focused on optimizing the engine performance of our liquid bipropellant rocket \u003cem\u003ePhoenix\u003c/em\u003e. I enjoy designing and creating models in Computer Aided Design (CAD) platforms and bringing them to life through the manufacturing process. During my time as a propulsion engineer, I've learnt the intricacies of rocketry: from fuel composition ratios and nozzle design to compressible flow. Throughout my time at RPL, I have coded MATLAB scripts, manufactured test stand components, outsourced rocket components, and researched optimization methods for increasing the efficiency of our rocket. Through these experiences, I have honed my engineering skills to be practical and comprehensive. \u003cbr\u003e\u003cbr\u003eApart from engineering, I love teaching students and helping them achieve their academic endeavors. I contributed towards developing a problem-solving curriculum for high school students across San Diego titled \u003cem\u003eProblem Solving Like an Expert.\u003c/em\u003e I developed project-based learning modules that incorporate written and hands-on components. Some of the projects within this curriculum include a cardboard moon rover, egg drop parachute, and even a soccer penalty simulator. In addition to this curriculum, for the past two years I have worked as a workshop facilitator/tutor to aid students in tackling university level STEM courses. I base my lesson plans on encouraging students to think about their problem-solving approach. Taking this approach encourages students to think about why and how they arrive at their solutions. My vocation to education is helping others achieve their own academic goals.\u003cbr\u003e\u003cbr\u003eI am a business-oriented individual that firmly believes in the spirit of entrepreneurship. This past year I served as the VP of Business Development for Rocket Propulsion Laboratory, where I acquired sponsorships and industry connections on behalf of the organization. This experience has taught me to appreciate and learn first-hand about the inner workings of business practices and networking. One major milestone during my tenure as VP was helping to organize the first Aerospace Career fair at UCSD. My ultimate aspiration is to one day create my own business in the Aerospace Sector, ideally in the satellite and reusable rocket field. \u003cbr\u003e\u003cbr\u003eI am excited to teach, connect with, and learn from the brilliant minds here at Curious Cardinals!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"lkTWSqMFDKEnkYvuw93lFYL4Js4DkEMrAng00wvU8P3E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Aerospace Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5b8ea0cb-c78e-4d53-8bd7-b966ec396079\"}"},{"__ref":"DeepDives:{\"uuid\":\"98c2d5bb-f576-4ccf-b792-ad6e1cf9987e\"}"},{"__ref":"DeepDives:{\"uuid\":\"5438456e-f5f9-4689-ab4e-90c45150846e\"}"},{"__ref":"DeepDives:{\"uuid\":\"c7155fc3-e1ed-4a0e-b6f9-fb92f26e3bd8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9a97c7f9-4ba6-4ace-9636-459f50dd9b1b/-/preview/-/format/jpg/","https://ucarecdn.com/50896198-2df7-4c01-bd51-c394f4794621/-/preview/-/format/jpg/","https://ucarecdn.com/cd633cc5-1ab6-4e9d-91fd-5399fbbd2111/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"984ac566-3076-4717-8208-6aebd25760b8\"}"},{"__ref":"Education:{\"uuid\":\"8a0ee937-939a-4086-96f5-3f328d84842b\"}"}],"hiredAt":"2025-09-16T03:04:23.080Z","topics":["Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Geometry","Physics","Chemistry","Academic Coaching","Executive Function"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexander-flores\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"88153d2e-a866-4662-9c8a-4a58609c81a3\"}"}}},"_sentryTraceData":"2b492e90f55f4decb6761154f729d1ee-9fc5e8de8e8e1275-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2b492e90f55f4decb6761154f729d1ee,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alexander-flores"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
