xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"c8f0f995-eb79-48ad-9fdd-a738d2d38a64\"}":{"__typename":"CausesSupported","uuid":"c8f0f995-eb79-48ad-9fdd-a738d2d38a64","name":"826 Valencia","description":"\u003cp\u003eCurrently a writing tutor for K-12 students in San Francisco.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ad17907a-dde0-4493-a488-308c15a98d20\"}":{"__typename":"DeepDives","uuid":"ad17907a-dde0-4493-a488-308c15a98d20","content":"\u003cp\u003eMy great-grandmother forbade my grandma from attending school. There simply wasn't enough money, and too many mouths to feed.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBecause of these circumstances, my grandma was illiterate for her entire life. But she made an effort to learn, and eventually picked up conversational Malay, Mandarin, and English through daily interactions. I could never hide anything from her because she understood all these languages 😅 Her story inspires me to learn through experience and osmosis.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6d67f90c-e0cb-454c-9c01-5f53f4e8e039\"}":{"__typename":"DeepDives","uuid":"6d67f90c-e0cb-454c-9c01-5f53f4e8e039","content":"\u003cp\u003eI'm currently working on CycleOS, an Android app that visualizes how my sleep, exercise, and menstrual symptoms might interact and vary throughout the menstrual cycle.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d545dc55-da7b-4941-95df-7b314cbfea5d\"}":{"__typename":"DeepDives","uuid":"d545dc55-da7b-4941-95df-7b314cbfea5d","content":"\u003cp\u003eGet up and stretch whenever possible. Be physically active!!! Don't sit for 8h at your computer, your short-sightedness and lower back pain will worsen exponentially when you do that...\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"3445b6c8-1edb-4104-8cae-7afd98009397\"}":{"__typename":"School","uuid":"3445b6c8-1edb-4104-8cae-7afd98009397","name":"Nanyang Polytechnic","city":"Singapore","type":"HIGH","state":"Singapore","country":"Singapore","zip":"569773"},"Education:{\"uuid\":\"52a84588-9ff4-4051-b2c6-373a0d0a40fa\"}":{"__typename":"Education","uuid":"52a84588-9ff4-4051-b2c6-373a0d0a40fa","school":{"__ref":"School:{\"uuid\":\"3445b6c8-1edb-4104-8cae-7afd98009397\"}"},"startYear":"2017","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}":{"__typename":"School","uuid":"0a298df6-dac8-4a1d-8e35-77e7b609185d","name":"Minerva University","city":"San Francisco","type":"COLLEGE","state":"California","country":"United States","zip":"94103"},"Education:{\"uuid\":\"6063f414-cfea-4fd0-a29e-818510060b45\"}":{"__typename":"Education","uuid":"6063f414-cfea-4fd0-a29e-818510060b45","school":{"__ref":"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}"},"startYear":"2021","endYear":null,"expectedGradY -time at IBM for a year after high school\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCoached 5 award-winning competitors in web design and development\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePlaced 5th among 32 countries in full-stack Web Design and Development \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"rCnuMQHR7SsXCg8yaSRvl202CKUSh4psoGvRxTA01EkxA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMaking a career pivot from computer science to health psychology research ✌🏼\u003c/p\u003e","favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"c8f0f995-eb79-48ad-9fdd-a738d2d38a64\"}"}],"major":"Computational Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ad17907a-dde0-4493-a488-308c15a98d20\"}"},{"__ref":"DeepDives:{\"uuid\":\"6d67f90c-e0cb-454c-9c01-5f53f4e8e039\"}"},{"__ref":"DeepDives:{\"uuid\":\"d545dc55-da7b-4941-95df-7b314cbfea5d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/91eccf12-d079-4c95-866b-c58474271ec0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"52a84588-9ff4-4051-b2c6-373a0d0a40fa\"}"},{"__ref":"Education:{\"uuid\":\"6063f414-cfea-4fd0-a29e-818510060b45\"}"}],"hiredAt":"2025-04-23T23:31:17.386Z","topics":["Creative Writing","Visual Arts / Graphic Design","Business / Entrepreneurship","Coding / Programming","Medicine / Health","Web Design","STEM Project","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/f5ae8359-9f55-41d8-a96b-8f3dc3ad05db/","https://ucarecdn.com/c278d819-50e0-435a-a1b0-1b3a8793462f/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"pei-qi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"28d8fb92-a545-4597-b500-4c8a83826322\"}"}}},"_sentryTraceData":"512e56890bc744adaf
