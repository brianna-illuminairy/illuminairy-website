t":"\u003cp\u003eI would tell my high school self to keep doing the things I love and to not be afraid to stray from the norm. Also, to keep an open mind when talking to different people. Finally, have fun you're a teenager!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"64886b72-5d04-471e-9832-0b388ffcdeb5\"}":{"__typename":"School","uuid":"64886b72-5d04-471e-9832-0b388ffcdeb5","name":"Radnor High School","city":"Wayne","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19087"},"Education:{\"uuid\":\"11c5da16-239d-433e-992c-7c17612137bf\"}":{"__typename":"Education","uuid":"11c5da16-239d-433e-992c-7c17612137bf","school":{"__ref":"School:{\"uuid\":\"64886b72-5d04-471e-9832-0b388ffcdeb5\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"be7c0900-c928-4f2c-aad0-7766c5be671f\"}":{"__typename":"Education","uuid":"be7c0900-c928-4f2c-aad0-7766c5be671f","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Learning \u0026 Organizational Change and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"fce5aaf1-108d-46fa-a245-843d91fc5417\"}":{"__typename":"MentorPublicProfile","uuid":"fce5aaf1-108d-46fa-a245-843d91fc5417","displayName":"Zach R.","slug":"zach-rosenblum","biography":"\u003cp\u003eHey! My name is Zach Rosenblum, and I’m a Learning \u0026amp; Organizational Change and Economics student at Northwestern University. Passionate about music and teamwork, I’m looking to pursue a career in the music and entertainment industry or follow a path in consulting.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy love for live events, rooting for Philadelphia sports teams, and attending concerts of some of my favorite artists led me to join the student organization A\u0026amp;O Productions. Introducing me to common practices in the entertainment industry, A\u0026amp;O has helped me realize a professional path in the music business (and put together amazing free concerts on campus). I’m excited to share my skills in communication, negotiation, and marketing, along with tips and skills from college that I would have loved to have known beforehand.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern, my studies cover “the human side of business,” delving into topics in psychology, global communication, team dynamics, as well as business cases and economic models. Reflecting my upbringing, I’ve always been told that “decisions are made by discussions,” emphasizing the importance of hearing people out. The collaborative and constantly active characteristics of my family and academic environment have helped me excel and keeps me on the lookout for ways to improve my team.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school and work, you’ll find me working out, shooting hoops, finding a recipe to cook, or watching the Hulu series “The Bear.” I’m thrilled to mentor, learn from those around me, and create a positive impact wherever I can!\u003c/p\u003e","teachingVideoPlaybackId":"s5rbhbDliooKDK37YItmng00aUT1YM01ZhPKUlTtb6TII","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a5383c2d-cfc0-497d-971c-c0de5241fcee\"}"},{"__ref":"Favorites:{\"uuid\":\"90e9e2f3-b799-4d89-9644-0809101fef19\"}"},{"__ref":"Favorites:{\"uuid\":\"ce0c177a-5284-4b38-8960-b27c3d555e4b\"}"}],"causesSupported":[],"major":"Learning \u0026 Organizational Change and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7ba43a98-9c34-4faa-9b79-6cf062ca
