xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"47ceddbd-4a42-492d-bc63-a65d6cdad7db\"}":{"__typename":"Favorites","uuid":"47ceddbd-4a42-492d-bc63-a65d6cdad7db","photoUrl":"https://ucarecdn.com/bfb20bdc-7912-4443-bff0-2bd16ca866cc/","title":"Golden State Warriors","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"0c2d173b-ca98-4e5b-8290-833f145e33bf\"}":{"__typename":"Favorites","uuid":"0c2d173b-ca98-4e5b-8290-833f145e33bf","photoUrl":"https://ucarecdn.com/9ccf9697-3c1b-4d16-97e4-195823524300/","title":"Liar's Poker - Michael Lewis","type":"BOOK"},"Favorites:{\"uuid\":\"58c4e9d0-7342-4979-b479-1207fc60ce43\"}":{"__typename":"Favorites","uuid":"58c4e9d0-7342-4979-b479-1207fc60ce43","photoUrl":"https://ucarecdn.com/4c2049c5-7f8a-431f-bc4f-2930ac5d8e76/","title":"San Francisco","type":"CITY"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"12e5dca4-ff5f-4c54-8d9e-ba7455dd3e70\"}":{"__typename":"DeepDives","uuid":"12e5dca4-ff5f-4c54-8d9e-ba7455dd3e70","content":"\u003cp\u003eOrchard Oaks! My brother and I co-founded Orchard Oaks, a satirical clothing company that mocked Vineyard Vines. Our logo featured a shark eating the Vineyard Vines whale, poking fun at VV and the brand's perceived prepiness and pretentiousness. We sold just under $10,000 worth of apparel — t-shirts, sweatshirts, hats, and towels. Initially, our sales were to family and friends, but through social media marketing we eventually grew the brand large enough to be noticed by Vineyard Vines. Yes, you read that correctly. One day, a law firm representing VV sent us a cease-and-desist letter, marking the end of Orchard Oaks' run.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am still in disbelief that the brand was successful enough to be noticed by VV. I find it funny that real corporate adults likely sat in a meeting and discussed us, having no idea that we were only high schoolers. The experience was a lot of fun and taught me the steps involved in starting an E-commerce business.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"e7e10e05-31cf-4827-9382-3c1b7bac2c03\"}":{"__typename":"DeepDives","uuid":"e7e10e05-31cf-4827-9382-3c1b7bac2c03","content":"\u003cp\u003eMy greatest source of motivation is by far my parents. They have invested so much time, energy, and resources into my upbringing—from the thousands of car rides to school, practices, and sports games, to the endless hours spent helping me study for tests, write essays, and of course, apply to college. My parents gave me an amazing childhood and I would love to be able to do the same for my future kids.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"16ceb64a-b916-4456-8017-116ca2ff24f1\"}":{"__typename":"DeepDives","uuid":"16ceb64a-b916-4456-8017-116ca2ff24f1","content":"\u003cp\u003eLike many kids, I once dreamed of becoming a professional athlete. First football, then I moved onto baseball, and finally basketball. Also like many kids, I eventually realized that I would not become a professional athlete. Still, my love for sports never faded. As I grew older I became interested in the analytics and business side of sports. I started reading about statistical methods that sports front offices use to evaluate players and make personnel decisions; I followed the growth and regression of different sports leagues, observing the business strategies the leagues were implementing to market their respective sport. And most recently, it has been exciting to see how the contentious market for live sports broadcasting rights has completely upended the television industry.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5070f7fb-3b71-46a8-bc22-5ba3405baece\"}":{"__typename":"DeepDives","uuid":"5070f7fb-3b71-46a8-bc22-5ba3405baece","content":"\u003cp\u003eI have two older brothers who have guided me every step of the way thus far in my life. Without their direction, I would have been way less prepared for all that I've experienced. I have seen firsthand the power of mentorship to provide individuals with meaningful support and take them to new heights.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"7d0d3806-a4c7-4044-927a-05cce6a0fe81\"}":{"__typename":"Education","uuid":"7d0d3806-a4c7-4044-927a-05cce6a0fe81","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics and Radio/TV/Film","degree":null},"School:{\"uuid\":\"d0dbca29-a041-4a61-8ed2-db2218b54912\"}":{"__typename":"School","uuid":"d0dbca29-a041-4a61-8ed2-db2218b54912","name":"Stuart Hall High School","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94109"},"Education:{\"uuid\":\"679506bf-14b7-48d3-a8f1-507108f170a7\"}":{"__typename":"Education","uuid":"679506bf-14b7-48d3-a8f1-507108f170a7","school":{"__ref":"School:{\"uuid\":\"d0dbca29-a041-4a61-8ed2-db2218b54912\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"fc79c72e-9a97-40b2-80dd-f164edd94622\"}":{"__typename":"MentorPublicProfile","uuid":"fc79c72e-9a97-40b2-80dd-f164edd94622","displayName":"Mattheus T.","slug":"mattheus-tellini","biography":"\u003cp\u003eMy name is Mattheus and I’m from San Francisco, went to college outside of Chicago, and now live in New York City. I am a huge people-person—I come from a big family; I have lived in three regions of the country and have loved meeting all different types of people, and I’m always looking to strike up a conversation.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated from Northwestern University, where I studied Economics and Radio/TV/Film. I am grateful that Northwestern allowed me to pursue such a unique double major. I have a variety of academic interests—including business, statistics, technology, sociology, and stand-up comedy—all of which I was able to take classes in at NU. I had an amazing 4-year experience and I hope that every student can find a school and an academic niche that they truly love. I’d be happy to help with anything college process related—the search, the applications, the essays, the interviews, the decision… you name it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the near future I will be working in consulting. I will start as a generalist but will eventually pick a sector of focus. I am particularly interested in the technology and consumer \u0026amp; retail spaces. I know too well what it is like to feel uncertainty about your future career. At the beginning of college I planned to pursue a job in the entertainment industry, working two TV/film related internships in back-to-back summers. However, heading into my junior year I had a change of heart and I pivoted, instead recruiting for consulting. Career uncertainty is a completely natural feeling for students and it is something I’d love to help you navigate.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I was the Student Body President of my high school; I’ve co-founded an E-commerce clothing company, and I’ve produced a mini comedy TV show about my family for my family. I love bringing creative ideas to life, whether it’s a formal project as described above, or simply organizing a fun get-together with friends. Lastly, I’m a massive sports fan and have enjoyed creating friendships through sports. I ski, surf, and play basketball.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow that I have graduated college I realize how special being a student is. From getting to see your friends every day and growing up together, to learning interesting material that might relate to one of your passions or future career paths, going to school is a blessing. I look forward to getting to know you better and helping you make the most of your academic and extracurricular journey!\u003c/p\u003e","teachingVideoPlaybackId":"xSzHIlvBKlC1sZXmjDwSCXaQEC1Jh9ljcXJLewAuqqQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"47ceddbd-4a42-492d-bc63-a65d6cdad7db\"}"},{"__ref":"Favorites:{\"uuid\":\"0c2d173b-ca98-4e5b-8290-833f145e33bf\"}"},{"__ref":"Favorites:{\"uuid\":\"58c4e9d0-7342-4979-b479-1207fc60ce43\"}"}],"causesSupported":[],"major":"Economics and Radio/TV/Film","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"12e5dca4-ff5f-4c54-8d9e-ba7455dd3e70\"}"},{"__ref
