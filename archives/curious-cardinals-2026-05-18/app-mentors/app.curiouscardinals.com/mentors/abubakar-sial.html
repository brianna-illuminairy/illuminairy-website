xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b9a898db-94df-45ed-bfdb-37ad82064e7f\"}":{"__typename":"Favorites","uuid":"b9a898db-94df-45ed-bfdb-37ad82064e7f","photoUrl":"https://ucarecdn.com/816edada-eb11-4003-9d29-c5447a1b5d88/","title":"Leonardo DiCaprio","type":"ACTOR"},"Favorites:{\"uuid\":\"f93f0756-b8fc-465f-addb-f4a8d9add743\"}":{"__typename":"Favorites","uuid":"f93f0756-b8fc-465f-addb-f4a8d9add743","photoUrl":"https://ucarecdn.com/ba64176f-4149-42b5-9ce3-3436ccb85790/","title":"Muhammad Ali","type":"ATHLETE"},"Favorites:{\"uuid\":\"007e06cd-4970-4828-9152-52dc7a00d741\"}":{"__typename":"Favorites","uuid":"007e06cd-4970-4828-9152-52dc7a00d741","photoUrl":"https://ucarecdn.com/1fb573bd-9719-4b22-ab91-4b7d8369c8a7/","title":"To Kill A Mockingbird","type":"BOOK"},"CausesSupported:{\"uuid\":\"038acde7-bc46-4239-a4d1-26b3efdb9cc5\"}":{"__typename":"CausesSupported","uuid":"038acde7-bc46-4239-a4d1-26b3efdb9cc5","name":"DonorsChoose","description":"\u003cp\u003e\u003cbr\u003eI support their mission to directly fund classrooms and teachers in\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"f09c879b-1a89-476b-9ceb-3903495a0f39\"}":{"__typename":"CausesSupported","uuid":"f09c879b-1a89-476b-9ceb-3903495a0f39","name":"Girls Who Code","description":"\u003cp\u003eI value their work in closing the gender gap in technology and ex\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e7f3913b-5b90-4b4e-9ff3-6e58b1128b4a\"}":{"__typename":"DeepDives","uuid":"e7f3913b-5b90-4b4e-9ff3-6e58b1128b4a","content":"\u003cp\u003eBroaden your horizon by engaging in diverse activities outside of academics and explore as many endeavors as you can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"18d0704e-e82b-4bec-bf1b-44efed12343a\"}":{"__typename":"DeepDives","uuid":"18d0704e-e82b-4bec-bf1b-44efed12343a","content":"\u003cp\u003eWe all tend to make mistakes but when a pursuit is unguided, it tends to lead to more serious and more frequent errors in decision making. Additionally, it slows down the learning process. Regardless of talent, experience cannot be substituted for any other skill. Mentorship allows me to share my life experiences with younger students and help them achieve more than they would otherwise. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"da69070f-0e7b-4a84-a041-c0d4865f2896\"}":{"__typename":"DeepDives","uuid":"da69070f-0e7b-4a84-a041-c0d4865f2896","content":"\u003cp\u003eI really hope to scale my EdTech startup and make it a global platform, where students prepare for high stakes exams across the world. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c1555c38-19eb-4ff5-b9f9-324d9c8b06ab\"}":{"__typename":"DeepDives","uuid":"c1555c38-19eb-4ff5-b9f9-324d9c8b06ab","content":"\u003cp\u003eI was really fascinated by the concept of flying. Aerodynamics and propulsion caught my interest because they involve such sophisticated use of air steams to gain elevation or movement. The fact that such principles were grounded in physics and math made it an obvious choice for me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"d3c5528e-05b2-4527-b853-d9e04a2e66e3\"}":{"__typename":"School","uuid":"d3c5528e-05b2-4527-b853-d9e04a2e66e3","name":"SICAS Liberty Complex SLC","city":"Lahore","type":"HIGH","state":"Punjab","country":"Pakistan","zip":"54000"},"Education:{\"uuid\":\"b9aa2427-d2bb-481e-9421-48af710c51be\"}":{"__typename":"Education","uuid":"b9aa2427-d2bb-481e-9421-48af710c51be","school":{"__ref":"School:{\"uuid\":\"d3c5528e-05b2-4527-b853-d9e04a2e66e3\"}"},"startYear":"2003","endYear":"2008","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b1ce3f9c-8770-4a99-b8c8-ce4d7714122f\"}":{"__typename":"School","uuid":"b1ce3f9c-8770-4a99-b8c8-ce4d7714122f","name":"Purdue University","city":"West Lafayette","type":"COLLEGE","state":"Indiana","country":"United States","zip":"47907"},"Education:{\"uuid\":\"4c12e573-e850-45af-a3f0-0fdfc122f446\"}":{"__typename":"Education","uuid":"4c12e573-e850-45af-a3f0-0fdfc122f446","school":{"__ref":"School:{\"uuid\":\"b1ce3f9c-8770-4a99-b8c8-ce4d7714122f\"}"},"startYear":"2009","endYear":null,"expectedGradYear":"2013","major":"Aerospace Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"7a2a52d5-50d5-4ed4-bb54-f2a954acccd6\"}":{"__typename":"MentorPublicProfile","uuid":"7a2a52d5-50d5-4ed4-bb54-f2a954acccd6","displayName":"Abubakar S.","slug":"abubakar-sial","biography":"\u003cp\u003eI have always been drawn to understanding how things work, especially in math and physics. That curiosity shaped many of my early academic choices and eventually led me to pursue a degree in Aerospace Engineering. I was fascinated by the idea that abstract principles could explain real-world phenomena and be used to design systems that actually fly. That mindset continues to influence how I think and how I work with students today.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eSince graduating, I have spent more than a decade teaching and mentoring high school students from different academic backgrounds and countries. My focus has always been on helping students develop clarity, confidence, and direction rather than just preparing them for exams. Many of my former students have gone on to study at leading universities in the United States, and some have since graduated and built careers across engineering, business, and technology. Seeing students grow into capable and self-assured individuals has been one of the most meaningful parts of my journey.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAlongside teaching, I am the founder of an EdTech startup focused on helping students perform better in high stakes exams. The platform brings together structured learning resources and academic support designed around how students actually study and prepare. Today, it is used by students in more than 125 countries. This exposure has given me a broader perspective on the common challenges students face across different education systems, as well as the habits and strategies that lead to real academic progress. As a consequence, I have developed a strong interest in helping students pursue entrepreneurship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI have also been involved in national and international STEM competitions and have served as a startup judge at the MassChallenge accelerator. These experiences have allowed me to engage with ambitious students and founders, evaluate ideas, and support people who are trying to build meaningful solutions.\u003c/p\u003e\u003cp\u003eOutside of work, I enjoy reading and writing, particularly around themes of education, growth, and decision making. I occasionally share reflections through short blog style posts on my Instagram page, @abz.log.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAt my core, I enjoy working with curious students who ask thoughtful questions, challenge assumptions, and want to build a strong foundation for their future. \u003c/p\u003e","teachingVideoPlaybackId":"JEwKVNF5lDGoM00bjLkTdD7xCdVftkpIWdkst00jmZXw8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I am most proud of is building a learning platform from the ground up that is now used by students across more than 125 countries. It started as a simple idea rooted in a frustration I saw every day as a teacher. Students were working hard but navigating a fragmented system of notes, videos, past papers, and advice with no clear structure tying it all together. I wanted to create something that genuinely helped them learn better and feel more in control of their preparation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eIn the early stages, progress was slow and uncertain. There were long periods with limited resources, small teams, and constant trade-offs. I had to balance teaching, mentoring, and building the product while also figuring out how to reach students globally. What kept me going was the feedback from students who said the platform helped them understand concepts more clearly, stay consistent, and feel less overwhelmed.\u003c/p\u003e\u003cp\u003eOver time, usage grew beyond what I initially imagined. Students from different countries, school systems, and backgrounds began using the platform, and many started reaching out to request more subjects and features. That demand felt like validation that the work was meaningful and solving a real problem.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eWhat makes me proud is not just the scale, but the impact. Knowing that something I helped build is supporting students in their academic journeys, and in some cases helping them access opportunities they might not have otherwise had, is deeply fulfilling. It represents persistence, belief in a purpose, and a commitment to improving how students learn.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b9a898db-94df-45ed-bfdb-37ad82064e7f\"}"},{"__ref":"Favorites:{\"uuid\":\"f93f0756-b8fc-465f-addb-f4a8d9add743\"}"},{"__ref":"Favorites:{\"uuid\":\"007e06cd-4970-4828-9152-52dc7a00d741\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"038acde7-bc46-4239-a4d1-26b3efdb9cc5\"}"},{"__ref":"CausesSupported:{\"uuid\":\"f09c879b-1a89-476b-9ceb-3903495a0f39\"}"}],"major":"Aerospace Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e7f3913b-5b90-4b4e-9ff3-6e58b1128b4a\"}"},{"__ref":"DeepDives:{\"uuid\":\"18d0704e-e82b-4bec-bf1b-44efed12343a\"}"},{"__ref":"DeepDives:{\"uuid\":\"da69070f-0e7b-4a84-a041-c0d4865f2896\"}"},{"__ref":"DeepDives:{\"uuid\":\"c1555c38-19eb-4ff5-b9f9-324d9c8b06ab\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/de938e93-1164-4463-bb45-6d927f486971/-/preview/-/format/jpg/","https://ucarecdn.com/0d6314af-d6ce-4123-ac71-0126fce205c3/-/preview/-/format/jpg/","https://ucarecdn.com/6b1593b7-dbb0-4604-8a45-61cb0fac25cd/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b9aa2427-d2bb-481e-9421-48af710c51be\"}"},{"__ref":"Education:{\"uuid\":\"4c12e573-e850-45af-a3f0-0fdfc122f446\"}"}],"hiredAt":"2026-02-05T05:10:35.183Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Business / Entrepreneurship","STEM Project","Aviation / Aerospace","Public Speaking","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"abubakar-sial\"}})":{"__ref":"MentorPublicProfile:{\"uu
