xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"abe5a811-785d-40c3-bc8c-77daaa652df0\"}":{"__typename":"Favorites","uuid":"abe5a811-785d-40c3-bc8c-77daaa652df0","photoUrl":"https://ucarecdn.com/cf7370fd-ac52-411c-96ba-dde1d0743e43/","title":"The Secret Garden","type":"BOOK"},"Favorites:{\"uuid\":\"1101284c-0469-4b7c-91dd-2eae81a15425\"}":{"__typename":"Favorites","uuid":"1101284c-0469-4b7c-91dd-2eae81a15425","photoUrl":"https://ucarecdn.com/91765e2d-e560-41cf-9b93-19a74e6c1503/","title":"Kate Lewis","type":"ARTIST"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"261f4132-205c-41be-b584-637e305f7583\"}":{"__typename":"DeepDives","uuid":"261f4132-205c-41be-b584-637e305f7583","content":"\u003cp\u003eIn my free time, I’m really active and love being outdoors. I do \u003cstrong\u003eyoga, go hiking, take long walks on the trail\u003c/strong\u003e, and basically try to spend as much time outside as I can. That’s one of the things I love about \u003cstrong\u003eAustin\u003c/strong\u003e — it’s such a great city for staying active. I also really value \u003cstrong\u003ephysical wellness\u003c/strong\u003e because I’ve seen how much it helps with \u003cstrong\u003emental well-being\u003c/strong\u003e, keeping me energized and balanced.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c9dd44c1-65bf-4b13-8811-08094bfdd05f\"}":{"__typename":"DeepDives","uuid":"c9dd44c1-65bf-4b13-8811-08094bfdd05f","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is becoming \u003cstrong\u003ebilingual\u003c/strong\u003e and living in a \u003cstrong\u003eSpanish-speaking country\u003c/strong\u003e. I’ve always been fascinated by languages and cultures, and I’d love to fully immerse myself in a new place, connect with people in their native language, and experience life from a different perspective. It’s something I’m excited to work toward because I think it would not only be personally rewarding but also broaden the way I see the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"ec5dc8b4-ce7f-4f30-a703-8c9b41b47cb4\"}":{"__typename":"DeepDives","uuid":"ec5dc8b4-ce7f-4f30-a703-8c9b41b47cb4","content":"\u003cp\u003eAs a high school student, I was extremely driven and motivated, but also very shy. I worked hard and cared deeply about doing well, even if I wasn’t always the most outspoken person in the room. Since then, life experiences and \u003cstrong\u003eliving abroad in Sydney, Australia\u003c/strong\u003e and living in \u003cstrong\u003eNashville, New York, Austin, and San Diego\u003c/strong\u003e have helped me grow into a much more confident version of myself. Because of that journey, I’m passionate about supporting all types of students including highly confident students and those who are quieter or still finding their voice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"0b3b50d6-0a10-4abf-9a64-6eea26cf596e\"}":{"__typename":"School","uuid":"0b3b50d6-0a10-4abf-9a64-6eea26cf596e","name":"Charter School of Wilmington","city":"Wilmington","type":"HIGH","state":"Delaware","country":"United States","zip":"19807"},"Education:{\"uuid\":\"34495adb-c56b-4055-8a16-8186ab45b01d\"}":{"__typename":"Education","uuid":"34495adb-c56b-4055-8a16-8186ab45b01d","school":{"__ref":"School:{\"uuid\":\"0b3b50d6-0a10-4abf-9a64-6eea26cf596e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"489e7e37-06f1-4f40-98e8-f50f72813dd5\"}":{"__typename":"Education","uuid":"489e7e37-06f1-4f40-98e8-f50f72813dd5","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Human and Organizational Development (Business/Psych)","degree":null},"MentorPublicProfile:{\"uuid\":\"ad47cfe0-5e3a-405c-8bc9-af2b71301449\"}":{"__typename":"MentorPublicProfile","uuid":"ad47cfe0-5e3a-405c-8bc9-af2b71301449","displayName":"Hannah C.","slug":"hannah-clatworthy","biography":"\u003cp\u003eHi! I’m \u003cstrong\u003eHannah Clatworthy\u003c/strong\u003e, and I currently live and work in \u003cstrong\u003eAustin, Texas\u003c/strong\u003e, where I’m an \u003cstrong\u003eEmerging Technology Specialist at Dell Technologies\u003c/strong\u003e. My work focuses on innovation and helping teams think creatively about how technology can support real people and real problems. While my role sits in the tech space, my background — and the way I approach mentoring — is grounded just as much in communication, creativity, and curiosity as it is in strategy or business.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m originally from \u003cstrong\u003eDelaware\u003c/strong\u003e, and I graduated from \u003cstrong\u003eVanderbilt University\u003c/strong\u003e, where I studied \u003cstrong\u003eHuman \u0026amp; Organizational Development\u003c/strong\u003e with a focus on leadership, along with minors in \u003cstrong\u003eLiterary Studies and English\u003c/strong\u003e. I’ve always been drawn to the intersection of analytical and creative thinking, and I never felt like I had to choose one path over another. My humanities and language-based background taught me how to think critically, communicate clearly, and engage deeply with ideas — skills that translate across industries, roles, and academic disciplines. Because of this, I enjoy supporting students from \u003cem\u003eall\u003c/em\u003e backgrounds, whether you’re focused on business, technology, the humanities, or still exploring what excites you most.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore Dell, I worked in fast-paced,client-facing environments, including a summer internship in New York with \u003cstrong\u003eAlphaSights a financial research firm\u003c/strong\u003e, and I’ve also spent time in creative spaces like an art gallery in Nashville. These experiences helped me build confidence, learn how to manage multiple priorities, and understand how different industries value different skill sets — but how strong communication and curiosity matter everywhere.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m passionate about mentoring because I remember how overwhelming it can feel to juggle coursework, extracurriculars, internships, and the pressure to “have a plan.” I’m here to help with \u003cstrong\u003ecoursework\u003c/strong\u003e, \u003cstrong\u003eprojects\u003c/strong\u003e, and \u003cstrong\u003epassion ideas\u003c/strong\u003e — whether that’s talking through an essay, shaping a presentation, brainstorming an independent project, or figuring out how to turn something you’re excited about into a meaningful experience. I also enjoy helping students prepare for interviews, navigate early professional environments, and learn how to talk about their experiences with confidence and authenticity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe careers aren’t built in a straight line, and you don’t need everything figured out right away. Exploring different interests, asking questions, and taking risks are all part of the process. I’m excited to connect through Curious Cardinals and support students as they develop their ideas, grow their skills, and build paths that feel both fulfilling and true to who they are.\u003c/p\u003e","teachingVideoPlaybackId":"C4SsN3c7Vue02AugtvdWxbgmAMQYISrKybwk1E2mS01ck","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"abe5a811-785d-40c3-bc8c-77daaa652df0\"}"},{"__ref":"Favorites:{\"uuid\":\"1101284c-0469-4b7c-91dd-2eae81a15425\"}"}],"causesSupported":[],"major":"Human and Organizational Development (Business/Psych)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"261f4132-205c-41be-b584-637e305f7583\"}"},{"__ref":"DeepDives:{\"uuid\":\"c9dd44c1-65bf-4b13-8811-08094bfdd05f\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec5dc8b4-ce7f-4f30-a703-8c9b41b47cb4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cc523a92-49e0-4d1c-b38d-70a803bad3ae/-/preview/-/format/jpg/","https://ucarecdn.com/93304fd6-e115-42c3-8408-39192fe528af/-/preview/-/format/jpg/","https://ucarecdn.com/b4a1a35f-70fa-45b6-8f37-9005269db36e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"34495adb-c56b-4055-8a16-8186ab45b01d\"}"},{"__ref":"Education:{\"uuid\":\"489e7e37-06f1-4f40-98e8-f50f72813dd5\"}"}],"hiredAt":"2025-12-19T01:42:16.032Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","6-8 Grade Science","Biology","Writing","Spanish","College Essay Writing","Academic Coaching","Executive Function","Reading","History","K-6 Storybook","Creative Writing","Music","History Project","Video / Photography","F
