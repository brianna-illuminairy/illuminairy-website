xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"acc1c164-5c71-4493-bc68-832142b9b801\"}":{"__typename":"Favorites","uuid":"acc1c164-5c71-4493-bc68-832142b9b801","photoUrl":"https://ucarecdn.com/b5d5f9a0-7222-4bd4-8a12-e6775b7003f3/","title":"Daniel Day-Lewis","type":"ACTOR"},"Favorites:{\"uuid\":\"0a0958e3-7a25-46ff-8900-82c197a1637a\"}":{"__typename":"Favorites","uuid":"0a0958e3-7a25-46ff-8900-82c197a1637a","photoUrl":"https://ucarecdn.com/4481808f-b852-46d9-800d-0efe1fc058fe/","title":"Unreasonable Hospitality by Will Guidara","type":"BOOK"},"Favorites:{\"uuid\":\"5bdfc5fd-cce4-47f9-a6f2-47c01e44efe1\"}":{"__typename":"Favorites","uuid":"5bdfc5fd-cce4-47f9-a6f2-47c01e44efe1","photoUrl":"https://ucarecdn.com/992da737-cfe5-42bb-ab03-3ba339bab98d/","title":"New York Yankees","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"e795d42e-77fb-486c-8c78-8147ff8cb10e\"}":{"__typename":"Favorites","uuid":"e795d42e-77fb-486c-8c78-8147ff8cb10e","photoUrl":"https://ucarecdn.com/992da737-cfe5-42bb-ab03-3ba339bab98d/","title":"New York Yankees","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"26c6dcb6-9a90-4915-999c-803960f55c4c\"}":{"__typename":"DeepDives","uuid":"26c6dcb6-9a90-4915-999c-803960f55c4c","content":"\u003cp\u003eI one day hope to open up my own business.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d96986f8-5ebf-4ffa-a9b5-d30ced7cddda\"}":{"__typename":"DeepDives","uuid":"d96986f8-5ebf-4ffa-a9b5-d30ced7cddda","content":"\u003cp\u003eI've been consistently mentoring in one form or another for basically my entire. \u003cbr\u003e\u003cbr\u003eOn my path to my black belt in MMA at around 9 years old, I was selected to my dojos \"leadership and competition team.\" One of my responsibilities on this team was to lead classes for much younger students. Here I learned the values of mentoring, as I helped instill my younger students with basic ideas of persvearence and commitment, helping many of them develop life long connections to the sport of MMA.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I mentored the same  middle division advisory every single week for three years. I built long-lasting connections with each of my mentees and watched each and everyone of them develop into extremely strong students in their own ways. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I'm a mentor to my older sister. I've been there for her in every possible way, learning more from her than I could possibly teach.\u003cbr\u003e\u003cbr\u003eFrom all these mentorships, I've learned that commitment to a mentee is the most important aspect of a mentorship. If a task or project seems hard, treacherous, or unreasonable, I know from all my experiences that just a little commitment goes a long way and more often than not leads to success.\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"24854281-34de-4f38-b155-4e5e8ecc2338\"}":{"__typename":"DeepDives","uuid":"24854281-34de-4f38-b155-4e5e8ecc2338","content":"\u003cp\u003eI created a documentary for my school's dining staff. This project took me nearly an entire summer to create but it detailed the ins and outs of how they operated every single day, and even showed personal stories and interpersonal connections in the kitchen. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ff23e4a9-6bdf-4ebe-a5e5-c428269b015f\"}":{"__typename":"DeepDives","uuid":"ff23e4a9-6bdf-4ebe-a5e5-c428269b015f","content":"\u003cp\u003eI like to go to the gym, make movies, cook for my family/friends (or myself), play pickup basketball, watch TV (mostly old Office clips), or watch the Knicks\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"ebe5e575-6532-4978-8c24-9de0e98cd08e\"}":{"__typename":"School","uuid":"ebe5e575-6532-4978-8c24-9de0e98cd08e","name":"Horace Mann School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"025b57d0-6c09-43e4-bfaa-7b0e29fffd6e\"}":{"__typename":"Education","uuid":"025b57d0-6c09-43e4-bfaa-7b0e29fffd6e","school":{"__ref":"School:{\"uuid\":\"ebe5e575-6532-4978-8c24-9de0e98cd08e\"}"},"startYear":"2010","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"9102d579-46e8-4930-9712-fecf704c478d\"}":{"__typename":"Education","uuid":"9102d579-46e8-4930-9712-fecf704c478d","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Hotel Administration and Hospitality","degree":null},"MentorPublicProfile:{\"uuid\":\"05d9beb1-1c01-4aef-9739-1894deaf9371\"}":{"__typename":"MentorPublicProfile","uuid":"05d9beb1-1c01-4aef-9739-1894deaf9371","displayName":"Jack C.","slug":"jack-chasen","biography":"\u003cp\u003eHi! My name is Jack Chasen. I’m a Cornell student studying in the Nolan School of Hotel Administration. I am very passionate about the business/finance side, but I have always had an interest in the actual hospitality industry.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up on the Upper West Side in New York City and have attended Horace Mann School for essentially my whole life. There, I quickly learned that I loved learning and quickly got to know my teachers in those every subject, who were instrumental in my academic success at school.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I was seven years old, my family hired a babysitter on weekends to watch me and my little sister when they went out. She was a filmmaking student at Dartmouth, and it was through her that I learned the foundations of film and storytelling through film. Since then, I’ve made countless movies for myself, for school, and work. My favorite part about film is the way it can make people feel and how an emotionally touching movie arguably has more power over someone’s emotions than any other artistic medium.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt school, I was a mentor for my school’s middle division mentor program. For three years, I visited the same exact middle school advisory every week, helping them with school stress, running fun activities with them, or just chatting over some Dunkin Donuts.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also figured I’d mention here that I am a bit of an athlete. In addition to being a captain of my school's football team and varsity basketball player, I am also a first-degree Black Belt in MMA.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve interned at Rachel Harrison Communications, a leading hotel/restaurant PR company. There, I helped them with their media presence, client outreach, and creative strategy. I also renovated and fixed their website and even acted as a handmodel in a photoshoot! That summer, I also worked as a prep hand and stagiaire at the restaurant Dante West Village in NYC.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve also done some academic research. Last year, I conducted a research study into the impact of Yelp reviews on restaurants with the help of a Princeton PhD student. We found that Yelp reviews are instrumental in determining restaurant success and are regularly an early predictor of restaurant longevity.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am a very creative person with skills in humanities, math, film, podcasting, writing, or just about anything that requires a little outside-the-box thinking and problem solving. I’m looking forward to meeting all of you!\u003c/p\u003e","teachingVideoPlaybackId":"cy5VrgnKJEDbFP02tvGDQj02NGeRj02B29zsQfeehCIxgk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy black belt in Mixed Martial Arts that I earned in 2023\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"acc1c164-5c71-4493-bc68-832142b9b801\"}"},{"__ref":"Favorites:{\"uuid\":\"0a0958e3-7a25-46ff-8900-82c197a1637a\"}"},{"__ref":"Favorites:{\"uuid\":\"5bdfc5fd-cce4-47f9-a6f2-47c01e44efe1\"}"},{"__ref":"Favorites:{\"uuid\":\"e795d42e-77fb-486c-8c78-8147ff8cb10e\"}"}],"causesSupported":[],"major":"Hotel Administration and Hospitality","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"26c6dcb6-9a90-4915-999c-803960f55c4c\"}"},{"__ref":"DeepDiv
