xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"872f6b0d-7210-4852-8143-39c8381fa215\"}":{"__typename":"Favorites","uuid":"872f6b0d-7210-4852-8143-39c8381fa215","photoUrl":"https://ucarecdn.com/d8ba3e49-b265-4d4f-83da-4525ad450007/","title":"Shutter Island","type":"MOVIE"},"Favorites:{\"uuid\":\"944d6d22-c35c-46ca-868b-27acc71e2f04\"}":{"__typename":"Favorites","uuid":"944d6d22-c35c-46ca-868b-27acc71e2f04","photoUrl":"https://ucarecdn.com/d27a2ee2-fc95-4636-a770-9611424487b8/","title":"Philadelphia Eagles (Go Birds)","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"3c83b05c-8cad-4968-8535-69453b1a8a3a\"}":{"__typename":"Favorites","uuid":"3c83b05c-8cad-4968-8535-69453b1a8a3a","photoUrl":"https://ucarecdn.com/cdbd24fa-7290-4228-bd8d-e6f19d863d0a/","title":"\"Could You Be Loved\"","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6728823a-c94a-4b8b-b0c4-39d08d715458\"}":{"__typename":"DeepDives","uuid":"6728823a-c94a-4b8b-b0c4-39d08d715458","content":"\u003cp\u003eTake that chance that seems out of reach. If you give it your all, you'll be surprised to see where you land. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"348f7cc1-464d-44b3-8cb7-51053dda6df0\"}":{"__typename":"DeepDives","uuid":"348f7cc1-464d-44b3-8cb7-51053dda6df0","content":"\u003cp\u003eI grew up with many siblings, mentoring my younger ones along the way. I've had many mentors in my life as well, and there's no better feeling than passing down the favor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4ddcd4a9-5f39-40f1-a57f-d4d0098f0f08\"}":{"__typename":"DeepDives","uuid":"4ddcd4a9-5f39-40f1-a57f-d4d0098f0f08","content":"\u003cp\u003eIn high school, I co-founded \u003cem\u003eComputer Literacy Education Outreach\u003c/em\u003e (CLEO), a nonprofit that teaches seniors how to use technology. At first, I thought I’d just be showing people how to send emails — instead, I became a professional password resetter, part-time tech therapist, and full-time “Why is my screen black?” troubleshooter. Now CLEO has 50+ chapters worldwide, but it all started with me trying (and failing) to explain FaceTime to my grandpa over the phone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e6946ca4-bf2a-4c4a-b494-b83581afe73f\"}":{"__typename":"DeepDives","uuid":"e6946ca4-bf2a-4c4a-b494-b83581afe73f","content":"\u003cp\u003eIn my life, I hope to make a meaningful impact on people and society. I hope to be able to look back at something purposeful and be able to say, \"I did that\".\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"470b8647-dd9a-4516-ab7f-0b1e0f9a19d6\"}":{"__typename":"School","uuid":"470b8647-dd9a-4516-ab7f-0b1e0f9a19d6","name":"Canterbury School","city":"Fort Myers","type":"HIGH","state":"Florida","country":"United States","zip":"33919"},"Education:{\"uuid\":\"14bfbe2b-9cd4-45ed-9589-c89820ec1139\"}":{"__typename":"Education","uuid":"14bfbe2b-9cd4-45ed-9589-c89820ec1139","school":{"__ref":"School:{\"uuid\":\"470b8647-dd9a-4516-ab7f-0b1e0f9a19d6\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"4819ad6c-5906-47ad-b889-5ff79d2bbded\"}":{"__typename":"Education","uuid":"4819ad6c-5906-47ad-b889-5ff79d2bbded","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics-Finance \u0026 Statistics","degree":null},"MentorPublicProfile:{\"uuid\":\"ba5fdb65-184d-4c28-a485-3c8e93acd0f1\"}":{"__typename":"MentorPublicProfile","uuid":"ba5fdb65-184d-4c28-a485-3c8e93acd0f1","displayName":"Christian L.","slug":"christian-laquis","biography":"\u003cp\u003eMy name is Christian Laquis. I'm a rising sophomore at the Wharton School of Business studying finance and statistics with a minor in Energy and Sustainability. I'll be joining Goldman Sachs as an Investment Banker during the summer of 2027.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm a middle child between two brothers and a sister, and I was born and raised in Fort Myers, Florida, where I grew up fishing, boating, going to the beach, and playing lacrosse. I attended Canterbury High School, where I took 13 AP courses, was captain of the Varsity Swim and Lacrosse Teams, and graduated Summa Cum Laude. I was also President and international finalist of my school's DECA chapter, NHS Treasurer, and Prefect. In addition, I did a lot more in high school (which I'll include as a list below, or you can check out my linkedin)!\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy journey as a leader began in high school when I co-founded Computer Literacy Education Outreach (CLEO). The idea was born after my grandfather in Trinidad passed away, and I realized how difficult it had been to connect with him because he didn’t understand how to use his phone or video calls. What started as a small club to help seniors in local retirement homes with technology has grown into a nonprofit with over 50 chapters worldwide. Today, CLEO empowers hundreds of high school students to teach thousands of seniors essential digital skills, reconnecting them with loved ones and bridging the generational gap through shared experiences and friendships. One of my favorite moments was helping a senior named Nancy recover her lost email account so she could finally see photos of her grandchildren again — the joy on her face reminded me why I do this work.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of CLEO, I’m passionate about marine conservation and sustainability. Growing up in Southwest Florida, I witnessed the effects of hurricanes, red tide, and climate change firsthand. After Hurricane Ian devastated my hometown, I led relief efforts – clearing debris, delivering supplies, and even ferrying stranded residents from Sanibel Island by boat. These experiences have shaped my commitment to making a real-world impact, whether in environmental work, community service, or business.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also bring a range of professional experience to my work with Curious Cardinals, from interning in commercial real estate and transaction advisory to leading investment research teams at Wharton. Across all of these experiences, I’ve learned how to solve problems creatively, adapt quickly, and communicate clearly, skills I now use to mentor and guide students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Curious Cardinals, I combine my love for problem-solving, mentorship, and curiosity to help students challenge themselves, explore new ideas, and pursue their passions with purpose. Whether it’s tackling a complex project, building a new skill, or simply learning how to think differently, I strive to inspire students to see challenges as opportunities and to believe in their own potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLinkedin: https://www.linkedin.com/in/christian-laquis/ \u003c/p\u003e\u003cp\u003eHigh School Accomplishments:\u003c/p\u003e\u003cp\u003e•Summa Cum Laude •Headmaster's Cup Award •Gold President's Service Award •Canterbury Varsity Lacrosse Captain's Leadership Award •Yale Book Award •AP Scholar with Distinction Award \u0026amp; Commended National Merit Scholar •DECA President \u0026amp; 1st place State+International Finalist •Canterbury Varsity Lacrosse (Team Captain) •Canterbury Varsity Swim and Dive (Team Captain) • National Honor Society Treasurer • National Science Honor Society • Mu Alpha Theta (National Math Honor Society) • National Spanish Honor Society •National English Honor Society •Rho Kappa (National Social Studies Honor Society) •Scholar-Athlete Society\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"202NnDP00PNYh01HUqJhF00Sb02gvPqUrFlwTIYCXJmi009jc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"872f6b0d-7210-4852-8143-39c8381fa215\"}"},{"__ref":"Favorites:{\"uuid\":\"944d6d22-c35c-46ca-868b-27acc71e2f04\"}"},{"__ref":"Favorites:{\"uuid\":\"3c83b05c-8cad-4968-8535-69453b1a8a3a\"}"}],"causesSupported":[],"major":"Economics-Finance \u0026 Statistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6728823a-c94a-4b8b-b0c4-39d08d715458\"}"},{"__ref":"DeepDives:{\"uuid\":\"348f7cc1-464d-44b3-8cb7-51053dda6df0\"}"},{"__ref":"DeepDives:{\"uuid\":\"4ddcd4a9-5f39-40f1-a57f-d4d0098f0f08\"}"},{"__ref":"DeepDives:{\"uuid\":\"e6946ca4-bf2a-4c4a-b494-b83581afe73f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c6fe8eef-eb84-41ea-a5eb-44a9eb6753ee/-/preview/-/format/jpg/","https://ucarecdn.com/675b90bc-68f2-4fc1-ac87-33dd4d6fe5a0/-/preview/-/format/jpg/","https://ucarecdn.com/2a435e65-e350-495b-89f8-a26b5b22f19e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"14bfbe2b-9cd4-45ed-9589-c89820ec1139\"}"},{"__ref":"Education:{\"uuid\":\"4819ad6c-5906-47ad-b889-5ff79d2bbded\"}"}],"hiredAt":"2025-08-09T12:26:47.592Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Physics","Writing","Spanish","Academic Coaching","College Essay Writing","Economics","Executive Function","Creative Writing","K-6 Storybook","Business / Entrepreneurship","Finance / Investing","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"christian-laquis\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ba5fdb65-184d-4c28-a485-3c8e93acd0f1\"}"}}},"_sentryTraceData":"b0dd142dda0c4a3c96fbd694c9af3df3-8b20b673ad3dd9bd-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b0dd142dda0c4a3c96fbd694c9af3df3,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"christian-laquis"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-
