xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"01e054cd-4eca-4eb9-86ca-34215e038ffc\"}":{"__typename":"DeepDives","uuid":"01e054cd-4eca-4eb9-86ca-34215e038ffc","content":"\u003cp\u003eI am interested in quantifying uncertainty. What better way to do so than studying metrics (statistics) and one of the most uncertain topics (religion)!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"a5fbf6ab-cfd7-45f1-8c5b-23436a774292\"}":{"__typename":"DeepDives","uuid":"a5fbf6ab-cfd7-45f1-8c5b-23436a774292","content":"\u003cp\u003eI come from a diverse background and value all the cultures I've had the opportunity to engage with. My identity and heritage emphasizes diversity and it goes to on to help me be more understanding and supportive to those different than me. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe my diversity helps me gauge others in a more comprehensive way and motivates me to learn and share effectively. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a646e72a-c563-4baf-a41b-e38cd42182f0\"}":{"__typename":"DeepDives","uuid":"a646e72a-c563-4baf-a41b-e38cd42182f0","content":"\u003cp\u003eThough a lot of my work has focused on connecting research to policy measures, I value my entrepreneurial endeavors. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the past, I have built news apps and event contract platforms. Currently I am building a localization system for event contracts. Going through the raising period!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"fe44dead-40b5-4ba3-b720-d9821a65ce37\"}":{"__typename":"DeepDives","uuid":"fe44dead-40b5-4ba3-b720-d9821a65ce37","content":"\u003cp\u003eI'm a class-A content consumer. Ranging from religious texts to Instagram Reels, I scroll (no pun intended). \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've watched and reviewed almost a thousand movies over the last five years, written two scripts, read the Bible, Quaran and the Old Testament. I'm a big fan of Salman Rushdie and love magical realism.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope to keep exploring and making content in the future!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"535b07e7-7c2d-47be-9b42-c2a508a63d5d\"}":{"__typename":"Education","uuid":"535b07e7-7c2d-47be-9b42-c2a508a63d5d","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Statistics, Religion, Political Science","degree":null},"School:{\"uuid\":\"9db0c741-64f2-4342-8511-1d689f987ced\"}":{"__typename":"School","uuid":"9db0c741-64f2-4342-8511-1d689f987ced","name":"West Windsor-Plainsboro High School South","city":"West Windsor Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08550"},"Education:{\"uuid\":\"a6573057-8374-443a-b9db-82e73d36f32a\"}":{"__typename":"Education","uuid":"a6573057-8374-443a-b9db-82e73d36f32a","school":{"__ref":"School:{\"uuid\":\"9db0c741-64f2-4342-8511-1d689f987ced\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"e7e011e9-9738-4b27-9742-1d4db22f4468\"}":{"__typename":"MentorPublicProfile","uuid":"e7e011e9-9738-4b27-9742-1d4db22f4468","displayName":"Joshua M.","slug":"joshua-midha","biography":"\u003cp\u003eHey! I'm Josh from Princeton, NJ. I've lived in 12 different places, watched 212 movies this year, and am interested in modeling uncertainty.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver the last 5 years, I've had unique opportunities to explore things that interest me. From passing bills in Congress on carbon incentives to building misinformation tools for Twitter, I've learned a lot and am excited to share my skills and insights with you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've worked big and small—whether at large government agencies or in my own smaller, though still exciting, personal ventures. I've also spent a lot of time in academia, writing papers, presenting at conferences, and refining research processes and methodologies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI completed my first year of college at Duke University in Durham, North Carolina. I've had the chance to take interesting classes in statistics, politics, computer science, and theology. I've also been involved with several political groups on campus, research labs, and the undergraduate law review.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic interests have varied, including behavioral science as a means of counterterrorism, network science and game theory, LLMs and sentiment analysis, and Islamic poetry and Chinese film. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am excited to share my experiences with y'all and hopefully make some new ones!\u003c/p\u003e","teachingVideoPlaybackId":"00t01ST7os6hAlM2oEtgvTZZ3K2EyLjeE4zzTqouOobIA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics, Religion, Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"01e054cd-4eca-4eb9-86ca-34215e038ffc\"}"},{"__ref":"DeepDives:{\"uuid\":\"a5fbf6ab-cfd7-45f1-8c5b-23436a774292\"}"},{"__ref":"DeepDives:{\"uuid\":\"a646e72a-c563-4baf-a41b-e38cd42182f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"fe44dead-40b5-4ba3-b720-d9821a65ce37\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0aa83fae-e488-478e-81b7-d5025d2583a8/-/preview/-/format/jpg/","https://ucarecdn.com/dfbb37ad-6117-4d69-bf50-c5ab86dce488/-/preview/-/format/jpg/","https://ucarecdn.com/b90c7a65-d76c-42c4-9778-037a4fb391d9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"535b07e7-7c2d-47be-9b42-c2a508a63d5d\"}"},{"__ref":"Education:{\"uuid\":\"a6573057-8374-443a-b9db-82e73d36f32a\"}"}],"hiredAt":"2024-07-18T01:10:53.913Z","topics":["Statistics","World Cultures","Law / Government / Policy","Machine Learning / AI","Journalism"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"joshua-midha\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e7e011e9-9738-4b27-9742-1d4db22f4468\"}"}}},"_sentryTraceData":"ab48a4ad0ee94f1d8d221161d7fc6a25-8d9e012bdca0f6a2-1","_sent
