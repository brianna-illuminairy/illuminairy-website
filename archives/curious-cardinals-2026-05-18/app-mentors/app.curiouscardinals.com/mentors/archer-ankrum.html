xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e53c5c44-4db3-4f4d-a60e-e4669c13c285\"}":{"__typename":"Favorites","uuid":"e53c5c44-4db3-4f4d-a60e-e4669c13c285","photoUrl":"https://ucarecdn.com/9c265d05-5f58-4b98-a9d1-e69fa3d265f9/","title":"Michael Heizer","type":"ARTIST"},"Favorites:{\"uuid\":\"3aeb6766-0550-498c-bd33-01499b177d7a\"}":{"__typename":"Favorites","uuid":"3aeb6766-0550-498c-bd33-01499b177d7a","photoUrl":"https://ucarecdn.com/7744a407-fa6a-4646-b0a5-987e74b11f62/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"11479e34-2b42-47d1-8b49-25ea440e1cd5\"}":{"__typename":"Favorites","uuid":"11479e34-2b42-47d1-8b49-25ea440e1cd5","photoUrl":"https://ucarecdn.com/54b227c4-6801-42db-a56c-97b16793b8da/","title":"Kung Fu Panda","type":"MOVIE"},"CausesSupported:{\"uuid\":\"854f6904-a6b0-490c-acd3-fd7d459db79f\"}":{"__typename":"CausesSupported","uuid":"854f6904-a6b0-490c-acd3-fd7d459db79f","name":"Engineers Without Borders","description":"\u003cp\u003eI support STEM access, hands-on learning, equity, and mentorship.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/79225c3d-f446-4f05-a705-46f3a50c5f18/"},"CausesSupported:{\"uuid\":\"46d5dff7-2838-492b-b8f9-fb239c171b3e\"}":{"__typename":"CausesSupported","uuid":"46d5dff7-2838-492b-b8f9-fb239c171b3e","name":"UNICEF USA","description":"\u003cp\u003eI support children’s health, education, and protection.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d72dffe3-c35b-490b-b9e2-18dc206b4ea5/"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"fdb9cb78-e9e1-48da-904f-c177f3e8abe8\"}":{"__typename":"DeepDives","uuid":"fdb9cb78-e9e1-48da-904f-c177f3e8abe8","content":"\u003cp\u003eMy greatest role model and mentor is my brother. For a long time, I didn’t really know what I was interested in. One day after school, he was my ride home, but he stayed late to do work with the robotics club. Without another ride, I ended up staying too. That was the first time I was really exposed to that kind of hands-on engineering environment, and I loved it. I didn’t realize it in the moment, but him staying late after school had completely changed the direction of my life and set me on the path toward the kinds of projects I work on now.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7707d1d5-6783-45e5-b75e-99dd51de92ac\"}":{"__typename":"DeepDives","uuid":"7707d1d5-6783-45e5-b75e-99dd51de92ac","content":"\u003cp\u003eWoodworking. In my spare time, you’ll often find me in Columbia’s wood shop. I enjoy the process of taking raw materials from start to finish without always having a clear idea in mind. I like sketching directly onto the wood to guide my cuts, and slowly turning pieces on a lathe as I experiment with my hands. Instead of traditional engineering, where you're trying to optimize for something, with woodworking, there’s more of an artistic flavor.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"850fc5ea-ba8b-4095-b738-d7741dd3c66b\"}":{"__typename":"DeepDives","uuid":"850fc5ea-ba8b-4095-b738-d7741dd3c66b","content":"\u003cp\u003eOut of all the things I could be doing, I’m drawn to mentorship because I want to help other people find the kinds of projects that actually bring them joy. Working on a project can be so much more meaningful than school, it’s where you get to build, fail, figure things out, and see your ideas come to life. I’ve found a lot of fulfillment in that process myself, and I want to help other people experience that same sense of excitement in whatever they create.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"eb27a6df-7823-4d59-ae7c-6ab0f5e87ae8\"}":{"__typename":"DeepDives","uuid":"eb27a6df-7823-4d59-ae7c-6ab0f5e87ae8","content":"\u003cp\u003eWorking at SpaceX has always been a dream of mine. Engineering is all about problem-solving. I’ve learned one of the best ways to solve problems is to fail fast and learn from those mistakes. My favorite projects, like designing drones, manufacturing rocket components, and assembling satellites, have all involved turning ideas that seemed out of reach into something real. SpaceX represents that mindset at a much larger scale, where you’re constantly pushed to solve hard, meaningful problems in a fast-paced environment where what you build actually changes what’s possible for humanity.\u0026nbsp;\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"1a2e7662-dc99-4ae7-a9b2-cddd1f41738a\"}":{"__typename":"School","uuid":"1a2e7662-dc99-4ae7-a9b2-cddd1f41738a","name":"Kealakehe High School","city":"Kailua-Kona","type":"HIGH","state":"Hawaii","country":"United States","zip":"96740"},"Education:{\"uuid\":\"fcb75781-2841-4e0b-9d1c-a99208d6400e\"}":{"__typename":"Education","uuid":"fcb75781-2841-4e0b-9d1c-a99208d6400e","school":{"__ref":"School:{\"uuid\":\"1a2e7662-dc99-4ae7-a9b2-cddd1f41738a\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"74b4d168-af39-414c-a2cd-3d44d571fa10\"}":{"__typename":"Education","uuid":"74b4d168-af39-414c-a2cd-3d44d571fa10","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"9a41dc86-57bb-4511-ab81-aef2ddd65ee6\"}":{"__typename":"MentorPublicProfile","uuid":"9a41dc86-57bb-4511-ab81-aef2ddd65ee6","displayName":"Archer A.","slug":"archer-ankrum","biography":"\u003ch2\u003e\u003c/h2\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eINTRODUCTION\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI am a rising sophomore at Columbia University, majoring in Mechanical Engineering at the Fu Foundation School of Engineering and Applied Science. Much of my experience comes from hands-on work in robotics, research, and leadership roles that have required critical thinking, collaboration, and problem-solving under constraints. I am especially interested in helping students build confidence in STEM and explore what they are capable of achieving.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eAWARDS / CREDENTIALS\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI have been recognized in several academic and technical competitions at the state, national, and international level. I am a two-time Hawai‘i State Science and Engineering Fair Finalist, two-time National CTE Momentum Competition winner, a 2nd place SkillsUSA state competitor, and a Top 8 International Public Policy Forum qualifier. I have also received honorable mention in the Mauna Kea Scholars program for scientific research proposals and earned multiple industrial certifications, including Lean Six Sigma, OSHA 10, FAA drone certifications, and manufacturing-related training credentials. In addition, in high school I was a three-season varsity athlete and have received academic excellence recognition for maintaining strong performance alongside athletics.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003ePROJECTS\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eMuch of my experience comes from hands-on engineering work across robotics, aerospace, manufacturing, and research projects. In robotics, I was a 4-year member of my school’s FRC team, where I served as manufacturing lead and co-captain. In parallel, I worked on marine robotics through an ROV project and aerospace systems through a separate TARC rocketry team. My experience also extends into research and applied engineering projects. As a Mauna Kea Scholars participant, I developed research proposals in astrophysics and imaging technologies.\u003c/p\u003e\u003cp\u003eOutside of structured school and research settings. Through my summer breaks in high school I continued to build experience through applied summer projects, construction-related engineering work (freshman summer), ROV-based data collection (sophomore summer), drone-based environmental data collection (junior summer), and manufacturing-projects such as airdropping 3D-printed stethoscopes in Ukraine to support the relief effort (senior summer).\u003c/p\u003e\u003cp\u003eAt the university level, I am currently working on a Satellite project and contributing to a small interdisciplinary engineering team, where I collaborate on system design and prototyping. I have also been involved in applied engineering experiences such as working with David Vallencourt in a small project team and exploring motorsports engineering through Formula SAE (FSAE), focusing on design, manufacturing, and performance optimization. Across all of these experiences, I have consistently focused on using engineering as a tool to solve real-world problems through design, iteration, and teamwork.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eWHAT I CAN DO WITH YOU?\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI can help students break down difficult STEM concepts, develop structured approaches to problem-solving, and build confidence in technical subjects. Whether it’s engineering design, research projects, or competition preparation, I focus on helping students think step-by-step and develop independent reasoning skills. I also bring experience co-founding a nonprofit, where I helped build programs, organize projects, and support teams in turning ideas into real impact. That experience lets me also guide students working on passion projects, clubs, or nonprofits of their own from early planning to execution. I emphasize consistency and discipline, drawing from my own experience balancing academics, athletics, leadership roles, and long-term projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eWHY I MIGHT BE A GOOD FIT?\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eMy background in robotics, research, and engineering competitions has given me a strong foundation of hands-on experience solving open-ended, real-world problems. I have spent years turning ideas into projects, from robotics systems to research proposals, which has taught me how to guide others through the same creative and technical process. Because of this, I bring both practical insight and a passion for helping students explore their own ideas, especially when starting from curiosity rather than a fixed plan. I aim to make projects feel more engaging and exploratory, where students feel supported in building something unique to them.\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Loc5dXB84k402B3poLpCkxl3tNeEQxWkPFOZMJ8Rb9vM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m proud of manufacturing medical equipment that was airdropped into Ukraine to support humanitarian relief. I worked with military officials in the area to 3D-print stethoscopes and help ensure essential medical tools could reach people in need.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e53c5c44-4db3-4f4d-a60e-e4669c13c285\"}"},{"__ref":"Favorites:{\"uuid\":\"3aeb6766-0550-498c-bd33-01499b177d7a\"}"},{"__ref":"Favorites:{\"uuid\":\"11479e34-2b42-47d1-8b49-25ea440e1cd5\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"854f6904-a6b0-490c-acd3-fd7d459db79f\"}"},{"__ref":"CausesSupported:{\"uuid\":\"46d5dff7-2838-492b-b8f9-fb239c171b3e\"}"}],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fdb9cb78-e9e1-48da-904f-c177f3e8abe8\"}"},{"__ref":"DeepDives:{\"uuid\":\"7707d1d5-6783-45e5-b75e-99dd51de92ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"850fc5ea-ba8b-4095-b738-d7741dd3c66b\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb27a6df-7823-4d59-ae7c-6ab0f5e87ae8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6b63a05f-c21f-483d-81b2-50fbb2fad46f/-/preview/-/format/jpg/","https://ucarecdn.com/7849cb50-ec02-4087-8368-f19f87552f29/-/preview/-/format/jpg/","https://ucarecdn.com/c75a6181-8ece-418c-aded-5781f7610e01/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"fcb75781-2841-4e0b-9d1c-a99208d6400e\"}"},{"__ref":"Education:{\"uuid\":\"74b4d168-af39-414c-a2cd-3d44d571fa10\"}"}],"hiredAt":"2026-04-22T23:53:19.568Z","topics":["Aviation / Aerospace","Machine Learning / AI","Robotics / Electronics / CAD","STEM Project","Web Design"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"archer-ankrum\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9a41dc86-57bb-4511-ab81-aef2ddd65ee6\"}"}}},"_sentryTraceData":"f16b2f636a1b4945a340e2ac43d28978-91473e888d3f5a53-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f16b2f636a1b4945a340e2ac43d28978,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"archer-ankrum"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
