xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"02df7b14-dc8b-4541-a83b-7930a6b0bf32\"}":{"__typename":"Favorites","uuid":"02df7b14-dc8b-4541-a83b-7930a6b0bf32","photoUrl":"https://ucarecdn.com/95660225-89aa-4574-bc4b-d4f8d1c92f7e/","title":"The Legend of Zelda: Breath of the Wild","type":"GAME"},"Favorites:{\"uuid\":\"a852eb06-9568-4ece-a604-258abfd090bc\"}":{"__typename":"Favorites","uuid":"a852eb06-9568-4ece-a604-258abfd090bc","photoUrl":"https://ucarecdn.com/0ab59bd1-e449-4001-b006-ad5de1fd5846/","title":"Aaron Judge","type":"ATHLETE"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"3514eb6a-f505-4c62-8c57-0022c04fb546\"}":{"__typename":"DeepDives","uuid":"3514eb6a-f505-4c62-8c57-0022c04fb546","content":"\u003cp\u003eOut of all the things I could be doing, I choose mentorship because I know how transformative it can be. Throughout my journey, I’ve been fortunate to have mentors who took the time to guide me, challenge me, and invest in my growth. Whether it was helping me navigate career decisions, pushing me to think differently, or working on personal ventures, those moments of mentorship had a lasting impact.\u003c/p\u003e\u003cp\u003eI want to provide the same for others. I want to pass on encouragement, perspective, and a sense of possibility. I believe that kind of guidance can change someone’s trajectory, just like it did for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8f95c66a-f0e1-4292-8f1f-1517d90be05a\"}":{"__typename":"DeepDives","uuid":"8f95c66a-f0e1-4292-8f1f-1517d90be05a","content":"\u003cp\u003eIn my spare time, I really enjoy being active and following sports. I like both watching and playing, whether that’s tennis, basketball, or even MMA. I also play the drums and piano, and love all genres of music. When I am not playing sports or listening to music, I am trying different restaurants.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"562a52fc-5f2d-4de7-a3b8-8522942cde50\"}":{"__typename":"DeepDives","uuid":"562a52fc-5f2d-4de7-a3b8-8522942cde50","content":"\u003cp\u003eSomething I’m extremely proud of is starting my nonprofit, Trash Troopers. It began as a small campus beautification idea, but over time, it grew into a real initiative that brought people together to improve the environment. The impact of TrashTroopers was immense as we were able to have over 1,000 volunteers, have an economic impact of over $300,000, and travel across the country and around the world. I’m proud not only of the impact it had, but also of the process. I was able to learn how to mobilize volunteers, pitch the idea in competitions, and adapt when things didn’t go as planned. It showed me that even a simple idea can make a difference when you’re willing to put in the work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"2e40af54-efba-4825-a7f2-d47c9eb02f25\"}":{"__typename":"DeepDives","uuid":"2e40af54-efba-4825-a7f2-d47c9eb02f25","content":"\u003cp\u003eSomething that isn’t obvious right away is that I’ve become a big fan of country music. I didn’t grow up listening to it, but after spending time in Nashville, I’ve really come to appreciate the genre. I’ve even gone to events like the CMA Awards, which gave me a whole new appreciation for country music. It’s not something people expect from me at first, but it’s become a big part of my experience at Vanderbilt.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"ea373e46-4328-4fb8-843b-5a4ffc7b5b24\"}":{"__typename":"School","uuid":"ea373e46-4328-4fb8-843b-5a4ffc7b5b24","name":"Academy for Information Technology","city":"Scotch Plains","type":"HIGH","state":"NJ","country":"UNited States of America","zip":"07076"},"Education:{\"uuid\":\"a5ea62b6-3073-40dd-80af-87307763b002\"}":{"__typename":"Education","uuid":"a5ea62b6-3073-40dd-80af-87307763b002","school":{"__ref":"School:{\"uuid\":\"ea373e46-4328-4fb8-843b-5a4ffc7b5b24\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"1828dfec-a603-4030-836a-c8c78d2841aa\"}":{"__typename":"Education","uuid":"1828dfec-a603-4030-836a-c8c78d2841aa","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Human \u0026 Organizational Development","degree":null},"MentorPublicProfile:{\"uuid\":\"4f5ae6fb-e709-4688-bcdf-7ef3e7ab7ddc\"}":{"__typename":"MentorPublicProfile","uuid":"4f5ae6fb-e709-4688-bcdf-7ef3e7ab7ddc","displayName":"Joshua C.","slug":"joshua-chan","biography":"\u003cp\u003eHi! My name is Joshua, and I’m currently a student at Vanderbilt University, where I’m majoring in Human \u0026amp; Organizational Development with a minor in Business. I grew up in New Jersey and have one older sister. In school, I’ve explored a mix of classes that bring together business, psychology, and technology. Outside the classroom, I am involved in the Vanderbilt Innovation and Entrepreneurship Society, consulting clubs, and the Asian American Student Association. I also spend a lot of time on entrepreneurial projects. I founded TrashTroopers, a nonprofit focused on campus beautification. We were able to scale to multiple universities, establish an advisory board, and travel around the world. Some of my favorite memories include traveling to London for a pitch competition, placing in the top three in a Kansas City social venture creation challenge, and attending a sustainability conference in Miami. I love seeing how new places and people spark fresh ideas. I also launched ForgetMeNot, an app designed to help individuals with cognitive decline. These projects have shown me that even small ideas can grow into something meaningful when you put in the effort and bring others along with you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I’ve gained experience in finance and consulting and these opportunities have pushed me to think critically, work on teams, and grow in fast-paced environments. I’ve been able to work in New Jersey, Nashville, Washington D.C, and New York, with each place giving me a chance to grow personally. These experiences have helped me navigate different professional cultures and communities. When I’m not working on school or projects, you can usually find me enjoying sports, music, or food. I grew up playing both the piano and drums and am a huge fan of tennis. At the heart of everything I do is curiosity. I’m always looking for new experiences, new people to meet, and new ideas to explore. Mentorship is especially exciting to me because it’s a chance to share what I’ve learned while also continuing to learn from others along the way. Whether it’s starting an entrepreneurial project or exploring career interests, I want to be a supportive guide who helps students reflect on themselves, try new things, and recognize that even mistakes are valuable steps in the learning process. More than anything, I hope to help students discover their passions, build confidence in their abilities, and truly enjoy the process of growth and discovery. I’m very flexible when it comes to discussing different topics, so please don’t hesitate to reach out with any questions or ideas.\u003c/p\u003e","teachingVideoPlaybackId":"XMSex9O62TDLbeXfE4CxRv02s5nx00YzUBChOlTm200LSQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"02df7b14-dc8b-4541-a83b-7930a6b0bf32\"}"},{"__ref":"Favorites:{\"uuid\":\"a852eb06-9568-4ece-a604-258abfd090bc\"}"}],"causesSupported":[],"major":"Human \u0026 Organizational Development","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3514eb6a-f505-4c62-8c57-0022c04fb546\"}"},{"__ref":"DeepDives:{\"uuid\":\"8f95c66a-f0e1-4292-8f1f-1517d90be05a\"}"},{"__ref":"DeepDives:{\"uuid\":\"562a52fc-5f2d-4de7-a3b8-8522942cde50\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e40af54-efba-4825-a7f2-d47c9eb02f25\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b8a1706b-167f-4835-bb4a-421378887b3c/-/preview/-/format/jpg/","https://ucarecdn.com/ffab82f4-70c4-4eb2-a6c1-b023a853df74/-/preview/-/format/jpg/","https://ucarecdn.com/08bab98a-d738-4a96-bccd-8eb0fbbc8dad/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a5ea62b6-3073-40dd-80af-87307763b002\"}"},{"__ref":"Education:{\"uuid\":\"1828dfec-a603-4030-836a-c8c78d2841aa\"}"}],"hiredA
