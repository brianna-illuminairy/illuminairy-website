xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c3fb6a00-825a-4a65-bcf1-1c98808db2cf\"}":{"__typename":"Favorites","uuid":"c3fb6a00-825a-4a65-bcf1-1c98808db2cf","photoUrl":"https://ucarecdn.com/c8f12afc-929e-4c35-af95-960265cd00ea/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"3a250571-ee49-4a47-b83a-b875901c992f\"}":{"__typename":"Favorites","uuid":"3a250571-ee49-4a47-b83a-b875901c992f","photoUrl":"https://ucarecdn.com/f0b48fe9-2b84-4fc5-8c20-c1913aab2fa3/","title":"The Hunger Games Series","type":"BOOK"},"Favorites:{\"uuid\":\"815cb692-3b98-45c1-82f2-924a136300ea\"}":{"__typename":"Favorites","uuid":"815cb692-3b98-45c1-82f2-924a136300ea","photoUrl":"https://ucarecdn.com/c1b689ba-db2d-4a93-9011-c5e852ba85bd/","title":"Flee the Facility on Roblox","type":"GAME"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8717529e-8b27-40ad-afbf-f3b8dc096055\"}":{"__typename":"DeepDives","uuid":"8717529e-8b27-40ad-afbf-f3b8dc096055","content":"\u003cp\u003eI hope to travel to at least one country on every continent. My dream destinations at the moment are Greece, Japan, Ireland, and France!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0f172384-f732-415d-9b9e-9dd4525e0c48\"}":{"__typename":"DeepDives","uuid":"0f172384-f732-415d-9b9e-9dd4525e0c48","content":"\u003cp\u003eI would tell my younger self that everything that is meant to be will be. I feel like I was always stressed out about the next big test or application, constantly believing that missing one step would be the downfall of my future. However, I have come to learn that everything meant to happen to me will happen, and everything happens for a reason.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"ac13338d-0c21-4590-9222-95ac9657e0c4\"}":{"__typename":"DeepDives","uuid":"ac13338d-0c21-4590-9222-95ac9657e0c4","content":"\u003cp\u003eMusic is my biggest motivation and my biggest source of inspiration. Every morning, the music I pick to listen to sets the mood of the day, and I have learned to use that to my advantage. Whether it's for studying, combing through my emotions, or simply walking to class, every song I listen to has an intention to make me better every day. Music has always been there for me, and it's something I can always rely on to pick me up. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"69ebf3c7-0d10-4920-930d-475ff377c325\"}":{"__typename":"DeepDives","uuid":"69ebf3c7-0d10-4920-930d-475ff377c325","content":"\u003cp\u003eGrowing up in Miami, being constantly surrounded by the Hispanic community, and learning about my own Nicaraguan heritage have impacted everything about my life, including how I teach. While my culture can help me better connect to  Hispanic students, I feel that growing up in a place full of people who are so different from one another helps me understand students from many different walks of life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"26a2b56f-5a56-430e-a97e-1654278870eb\"}":{"__typename":"School","uuid":"26a2b56f-5a56-430e-a97e-1654278870eb","name":"School For Advanced Studies","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33178"},"Education:{\"uuid\":\"1c62ced0-5f1b-405f-84dd-b3d924ea8d59\"}":{"__typename":"Education","uuid":"1c62ced0-5f1b-405f-84dd-b3d924ea8d59","school":{"__ref":"School:{\"uuid\":\"26a2b56f-5a56-430e-a97e-1654278870eb\"}"},"startYear":"2023","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"ecbecd0c-0ebe-4f05-b93a-86beaa2e8507\"}":{"__typename":"Education","uuid":"ecbecd0c-0ebe-4f05-b93a-86beaa2e8507","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"1b392806-80ec-4016-a9af-77adac27d292\"}":{"__typename":"MentorPublicProfile","uuid":"1b392806-80ec-4016-a9af-77adac27d292","displayName":"Brooke A.","slug":"brooke-alexander","biography":"\u003cp\u003eHi! I'm Brooke, a freshman at Columbia University studying biochemistry, and I help students build strong STEM foundations and navigate the college application process!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAbout Me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I started high school, I had no idea what I wanted to do. However, with amazing teachers, I discovered a passion for STEM, and learned that I want to make others love science too! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the past few years, I have:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCompleted my associate's degree through my school's dual-enrollment program, building a strong foundation in pre-med coursework (like physics and chemistry) and gaining basic laboratory skills\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTutored my peers in general chemistry and calculus independently and through school organizations like the Science Honors Society\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelped countless classmates through the college application process, and watched them get admitted into schools such as Princeton and  Duke\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy Specialties \u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI work best with students who need thorough explanations or those who want someone to make tough subjects fun!  Topics include:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cu\u003eGeneral/Honors Chemistry\u003c/u\u003e (periodic trends, titrations, naming compounds, types of reactions, kinetics, etc.)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cu\u003eAP Calculus AB, Calculus II \u003c/u\u003e(limits, derivatives, integration, series, and applications)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cu\u003eThe Pre-Medical Process\u003c/u\u003e (requirements, exploring specialties, and finding opportunities)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I'm also suited for helping students at any stage in the college process, whether that be deciding which colleges to apply to, getting through writer's block, or helping you make that final decision on where to go!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFurthermore, as someone who always has a busy schedule while balancing a heavy course load, I've learned a lot about time management, effective study strategies, and overcoming procrastination, which are lessons I incorporate into every session.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow I Can Help You\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eThrough my tutoring experience and recent firsthand experience with the college application process, I understand how to work with students at all levels and navigate the challenges high schoolers face.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical  session with me might include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ethorough explanations of topics, using real-world scenarios to break down ideas and make information memorable\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003estep-by-step breakdowns of difficult questions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003epractice problems, with detailed explanations \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003etalking through your thought process, to understand where you might need more help\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ediscussing all things you, and how to make you shine through your writing and application\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eOutside the Classroom\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eBesides school, I love to bake, play Roblox with friends, and watch movies. I'm also a big music enthusiast (my current obsessions being Bad Bunny, Harry Styles, and Taylor Swift), and as a true Miami girl, I love the beach and spending time in the sun. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether you need help in your STEM classes or want guidance through one of the most daunting processes of your high school career, I'd love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"PIAVN5Qimze02wpQWqQbAcYUutKRqWeFQoGJHXVqWgl4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c3fb6a00-825a-4a65-bcf1-1c98808db2cf\"}"},{"__ref":"Favorites:{\"uuid\":\"3a250571-ee49-4a47-b83a-b875901c992f\"}"},{"__ref":"Favorites:{\"uuid\":\"815cb692-3b98-45c1-82f2-924a136300ea\"}"}],"causesSupported":[],"major":"Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8717529e-8b27-40ad-afbf-f3b8dc096055\"}"},{"__ref":"DeepDives:{\"uuid\":\"0f172384-f732-415d-9b9e-9dd4525e0c48\"}"},{"__ref":"DeepDives:{\"uuid\":\"ac13338d-0c21-4590-9222-95ac9657e0c4\"}"},{"__ref":"DeepDives:{\"uuid\":\"69ebf3c7-0d10-4920-930d-475ff377c325\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f885b3ca-339f-40ee-a956-a3d0be22fd68/-/preview/-/format/jpg/","https://ucarecdn.com/daa64bdc-d185-4168-bc32-4e455b316397/-/preview/-/format/jpg/","https://ucarecdn.com/cd44d958-e50d-49b6-82f0-cd07e5ed1796/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1c62ced0-5f1b-405f-84dd-b3d924ea8d59\"}"},{"__ref":"Education:{\"uuid\":\"ecbecd0c-0ebe-4f05-b93a-86beaa2e8507\"}"}],"hiredAt":"2026-03-16T22:52:05.628Z","topics":["Calculus","K-5 Grade Math","Algebra I","Chemistry","6-8 Grade Science","Writing","College Essay Writing","History","Reading","Executive Function","Academic Coaching","K-6 Storybook","Medicine / Health","STEM Project","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"brooke-alexander\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1b392806-80ec-4016-a9af-77adac27d292\"}"}}},"_sentryTraceData":"53cf5769b6274bb58eb2fac1
