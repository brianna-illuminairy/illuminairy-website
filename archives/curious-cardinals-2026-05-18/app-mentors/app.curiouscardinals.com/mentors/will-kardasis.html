xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d0c8b3a6-d501-4fd5-bbfd-b7c43c963fe1\"}":{"__typename":"DeepDives","uuid":"d0c8b3a6-d501-4fd5-bbfd-b7c43c963fe1","content":"\u003cp\u003eMake a list of the things in and outside of school that excite you and embrace them! Also, step outside of your comfort zone every now and then-- this is the best way to grow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a8299251-4a55-49c7-9d97-41aa72161af3\"}":{"__typename":"DeepDives","uuid":"a8299251-4a55-49c7-9d97-41aa72161af3","content":"\u003cp\u003eI knew I wanted to go to medical school, so I started taking the premed classes, one of which I heard horror stories about-- organic chemistry... but I absolutely loved it. It demonstrated the beauty of science to me: learning how things work and applying this knowledge logically to solve problems. I then found out that biochemistry is bascially organic chemistry reactions that create life, and I was sold.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"aa2946c8-fd3c-42cd-a863-fd47fe20cfcc\"}":{"__typename":"DeepDives","uuid":"aa2946c8-fd3c-42cd-a863-fd47fe20cfcc","content":"\u003cp\u003eI want to be a sports medicine doctor. One of my favorite hobbies is fitness and therefore I love the musculoskeletal system! Incorporating aspects of your hobbies into your career is such an exciting thing and I highly recommend my students do the same!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"154e322d-3828-4256-8cfb-de0d56a06537\"}":{"__typename":"DeepDives","uuid":"154e322d-3828-4256-8cfb-de0d56a06537","content":"\u003cp\u003eI always keep in mind things to look forward too-- not just career milestones but more short-term things like holidays, trips, time with family, and even just watching a movie or playing video games at the end of the night. Picturing my work as a path to a reward helps me be so much more productive.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"b72f2d5d-c2b8-4bb8-9596-33553de198e2\"}":{"__typename":"School","uuid":"b72f2d5d-c2b8-4bb8-9596-33553de198e2","name":"Glenbrook North High School","city":"Northbrook","type":"HIGH","state":"Illinois","country":"United States","zip":"60062"},"Education:{\"uuid\":\"5d9bcfa9-26ee-41b4-84da-25986ffaee80\"}":{"__typename":"Education","uuid":"5d9bcfa9-26ee-41b4-84da-25986ffaee80","school":{"__ref":"School:{\"uuid\":\"b72f2d5d-c2b8-4bb8-9596-33553de198e2\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}":{"__typename":"School","uuid":"9a91466f-187b-4e9b-8a98-c02cef7bf621","name":"University of Michigan","city":"Ann Arbor","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48109"},"Education:{\"uuid\":\"d3aabdbc-f3af-4144-bd98-3fe259db1898\"}":{"__typename":"Education","uuid":"d3aabdbc-f3af-4144-bd98-3fe259db1898","school":{"__ref":"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2020","major":"Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"fd62c8db-d1b6-414e-96bc-082c80b8c57c\"}":{"__typename":"MentorPublicProfile","uuid":"fd62c8db-d1b6-414e-96bc-082c80b8c57c","displayName":"Will K.","slug":"will-kardasis","biography":"\u003cp\u003eHi! I’m Will, and I’m in my final year of medical school. I’ve always been curious about how things work, especially when it comes to science and the human body. That curiosity led me to study medicine, where I get to combine problem-solving with helping people every day.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I’m passionate about filmmaking, music, fitness, and cooking! I think having creative and physical outlets is really important, and I love exploring new ways to grow outside the classroom.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I want to be someone who can help students not only with academics, but also with figuring out what excites them in life! I know how hard it can be to feel uncertain about the future, or to feel pressure to follow a path that doesn’t feel like your own. That’s why I believe so strongly in the power of being honest with yourself—about what you love, what drives you, and who you want to become. It’s something I’ve learned through my own journey, and I believe it’s the foundation of finding purpose and passion.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m here to support students through whatever part of the journey they’re on—whether that means helping with schoolwork, exploring new interests, or just being someone to talk to. I’m excited to listen, encourage, and help you grow into the person you’re meant to be!\u003c/p\u003e","teachingVideoPlaybackId":"cQqKya6H02X1sQ39fLWOIhUG9GxYnYXOFewlGHK8csWw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d0c8b3a6-d501-4fd5-bbfd-b7c43c963fe1\"}"},{"__ref":"DeepDives:{\"uuid\":\"a8299251-4a55-49c7-9d97-41aa72161af3\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa2946c8-fd3c-42cd-a863-fd47fe20cfcc\"}"},{"__ref":"DeepDives:{\"uuid\":\"154e322d-3828-4256-8cfb-de0d56a06537\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3396f0e7-cb1a-4440-8d72-306adbd46fab/-/preview/-/format/jpg/","https://ucarecdn.com/bab7051c-a7b0-4343-81f5-9791b0ddd6cc/-/preview/-/format/jpg/","https://ucarecdn.com/bdc8cccc-ae96-4c66-9867-58a3807e65bf/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"5d9bcfa9-26ee-41b4-84da-25986ffaee80\"}"},{"__ref":"Education:{\"uuid\":\"d3aabdbc-f3af-4144-bd98-3fe259db1898\"}"}],"hiredAt":"2025-04-21T04:09:24.183Z","topics":["Algebra I","Chemistry","Biology","Physics","Academic Coaching","Executive Function","College Essay Writing","Music","Visual Arts / Graphic Design","Film / Theater","Sports Journalism","Video / Photography","Medicine / Health","Sports Analytics"],"communityBadges":["https://ucarecdn.com/bc931f8b-f00f-4064-8767-bece7541c20e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"will-kardasis\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fd62c8db-d1b6-414e-96bc-082c80b8c57c\"}"}}},"_sentryTraceData":"53b9890d2a724d0c8a2d9d3c273ec042-bce332bed0c0db41-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=53b9890d2a724d0c8a2d9d3c273ec042,sentry-sample_rate=0.
