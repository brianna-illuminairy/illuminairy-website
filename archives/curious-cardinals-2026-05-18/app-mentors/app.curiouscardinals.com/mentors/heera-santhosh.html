xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e4ec0787-c715-4abc-a024-4f4945cb2474\"}":{"__typename":"Favorites","uuid":"e4ec0787-c715-4abc-a024-4f4945cb2474","photoUrl":"https://ucarecdn.com/37827660-0860-4f51-8d40-aff5f640f364/","title":"Lauren Graham","type":"ACTOR"},"Favorites:{\"uuid\":\"b000cebf-a6d0-463a-8dc5-7178962e11ee\"}":{"__typename":"Favorites","uuid":"b000cebf-a6d0-463a-8dc5-7178962e11ee","photoUrl":"https://ucarecdn.com/d2adee39-0d99-4af0-9087-c8c965416bd1/","title":"Superache (Conan Gray)","type":"ALBUM"},"Favorites:{\"uuid\":\"221cc65d-1c5f-49e7-9360-25e6b3ad6797\"}":{"__typename":"Favorites","uuid":"221cc65d-1c5f-49e7-9360-25e6b3ad6797","photoUrl":"https://ucarecdn.com/a19c7046-2240-4a5b-907e-dd86b5dc2f3c/","title":"Pride and Prejudice","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1a7c3042-54cc-4935-89f0-e43828fc517b\"}":{"__typename":"DeepDives","uuid":"1a7c3042-54cc-4935-89f0-e43828fc517b","content":"\u003cp\u003eMentorship matters to me because it’s how I’ve built bridges - between who I was, who I am, and who I want to become. I wouldn’t be where I am today without the mentors who challenged and believed in me, and I see mentorship as a way to pay that forward. It’s not just about offering advice - it’s about creating space for someone else to feel seen, supported, and empowered to pursue what excites them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"7ccc1e7b-1c15-4d69-aaa1-8ec71d8fc115\"}":{"__typename":"DeepDives","uuid":"7ccc1e7b-1c15-4d69-aaa1-8ec71d8fc115","content":"\u003cp\u003eOnce, I dreamed I was piloting a hot air balloon shaped like a giant neuron across the Sahara Desert - my mission was to deliver synaptic messages to forgotten civilizations. Every time I dropped a neurotransmitter capsule, a city would light up with electricity and start debating Aristotle in perfect unison. Somewhere in the dream, Einstein showed up riding a camel and asked if I wanted to co-author a paper. I said yes, but only if we could write it in Morse code using the blinking of fireflies.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a69bcb0e-9e25-40d6-b0ce-b566dcd04fa5\"}":{"__typename":"DeepDives","uuid":"a69bcb0e-9e25-40d6-b0ce-b566dcd04fa5","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is building a global pediatric neuro-oncology center that not only drives cutting-edge research—like using patient-derived organoids to model brain tumors - but also ensures that every child, regardless of where they’re born, has access to compassionate, innovative care. I want it to be a place where science, equity, and hope converge.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"81011d95-44c8-467a-84d8-6cf4bb79013d\"}":{"__typename":"DeepDives","uuid":"81011d95-44c8-467a-84d8-6cf4bb79013d","content":"\u003cp\u003eI’d tell my younger self: stop measuring your worth by someone else’s timeline. Comparison will always blur your own path, and imposter syndrome only has power when you forget that growth isn’t supposed to feel comfortable. You don’t need to do everything all at once - balance isn’t a weakness, it’s what allows you to keep going without burning out. Celebrate the small wins, stay curious, and trust that you're exactly where you're meant to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"a91cf073-280e-4aff-ad27-8642f0fc3999\"}":{"__typename":"School","uuid":"a91cf073-280e-4aff-ad27-8642f0fc3999","name":"International Academy East","city":"Troy","type":"HIGH","state":"Michigan","country":"United States","zip":"48083"},"Education:{\"uuid\":\"2010dc5c-82fd-454b-86ed-2fd81510df15\"}":{"__typename":"Education","uuid":"2010dc5c-82fd-454b-86ed-2fd81510df15","school":{"__ref":"School:{\"uuid\":\"a91cf073-280e-4aff-ad27-8642f0fc3999\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"042d8e27-3faf-4a7f-9dd2-cc9e28f420b6\"}":{"__typename":"Education","uuid":"042d8e27-3faf-4a7f-9dd2-cc9e28f420b6","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Neuroscience and Behavior","degree":null},"MentorPublicProfile:{\"uuid\":\"474139ba-be97-4d8c-b039-5ebf1bec1c20\"}":{"__typename":"MentorPublicProfile","uuid":"474139ba-be97-4d8c-b039-5ebf1bec1c20","displayName":"Heera S.","slug":"heera-santhosh","biography":"\u003cp\u003eHi there! I’m Heera Santhosh - a first-year undergraduate at Columbia University studying Neuroscience \u0026amp; Behavior with minors in Chemistry and Statistics. I grew up in the suburbs of Michigan and graduated as valedictorian from a public IB high school, and now I’m thriving as a proud transplant to the energy and vibrancy of New York City.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m an aspiring pediatric neuro-oncologist on the pre-medical professional track, passionate about understanding the brain and how we can use science and storytelling to create change. I’m deeply drawn to biology, chemistry, psychology, and neuroscience - not just as individual subjects, but for the ways they intertwine to explain who we are. I truly believe learning should be interdisciplinary, curiosity-fueled, and fun.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I served as President of Mu Alpha Theta (Math Honor Society), captained my Science Olympiad team for three years, and competed in Forensics (competitive public speaking) and HOSA at the international level. These experiences weren’t just about accolades (though those came too!) - they taught me how to think critically, communicate effectively, and lead with heart.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and research, you can find me rollerblading (as a rink veteran of 11 years), scrapbooking, Thai restaurant-hopping, listening to music (Conan Grey and Harry Styles are my favorites), perfecting my Cooking Fever strategy, indulging in my completely healthy M\u0026amp;Ms addiction, adding to my small but mighty camera collection, binging Gilmore Girls and The Crown, spending hours on end in the lab working on my neurodegenerative rehabilitation research, traveling, and experimenting with my exotic smoothie combos.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy proudest accomplishments include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eValedictorian, Class of 2024 (International Academy East)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFinalist, 2024 Coca-Cola Scholars Program\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNational UN Ambassador Awardee (2023)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e1st Place, Michigan Science \u0026amp; Engineering Fair (2022 and 2023)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePerfect ACT Score\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnd some of my favorite projects:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFounding \u003cem\u003eAid2Day\u003c/em\u003e, a now-international, student-run nonprofit supporting pediatric cancer patients, during my freshman year of high school. Our team of 125+ students in 28 countries has raised over $300,000!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBeginning my research in Neuromuscular Regenerative Rehabilitation as an intern at Wayne State University. I took matters into my own hands, cold-emailed professors like no tomorrow and landed this position in high school. I am beyond excited to be presenting my own findings (on a low-cost isokinetic dynamometer I co-designed!) at the 2025 American Physiology Summit, where I will be honored with the Barbara A. Horwitz \u0026amp; John A. Horowitz Excellence in Undergraduate Research Award\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServing as the Engagement Director of Columbia University Science Olympiad. has been a full-circle moment for me. After years of competing and leading Science Olympiad teams in high school, I now get to help shape the experience for other passionate students from behind the scenes. I oversee outreach and engagement efforts, build mentorship pipelines for our competitors, and help run one of the largest student-organized STEM tournaments on the East Coast.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTaking on the role of Publicity Editor for the Columbia University Journal of Global Health. I recently moderated a Q\u0026amp;A with the former International President of Doctors Without Borders on delivering humanitarian aid in conflict zones.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBeing selected as a Teaching Fellow for the ACComPLISHED Community Health Worker Program at Columbia’s Neurology Department. I mentor NYC high schoolers on health equity topics like stroke prevention, dementia awareness, and insurance literacy.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eAs a mentor, I’m here to be your biggest supporter and guide - not just for schoolwork, but for life. I don’t believe success has to look the same for everyone. My goal is to ignite your curiosity, celebrate your individuality, and help you feel confident, capable, and excited about learning. Our sessions won’t be limited to a textbook—they’ll be filled with questions, lightbulb moments, and laughter. And I’ll always be someone you can talk to, confide in, and count on - whether you’re figuring out organic chemistry or just life in general.\u003c/p\u003e","teachingVideoPlaybackId":"aJXnGoU919oqmWuUYAMeYH1X02q21Ptj6DUPti5AWdE8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e4ec0787-c715-4abc-a024-4f4945cb2474\"}"},{"__ref":"Favorites:{\"uuid\":\"b000cebf-a6d0-463a-8dc5-7178962e11ee\"}"},{"__ref":"Favorites:{\"uuid\":\"221cc65d-1c5f-49e7-9360-25e6b3ad6797\"}"}],"causesSupported":[],"major":"Neuroscience and Behavior","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1a7c3042-54cc-4935-89f0-e43828fc517b\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ccc1e7b-1c15-4d69-aaa1-8ec71d8fc115\"}"},{"__ref":"DeepDives:{\"uuid\":\"a69bcb0e-9e25-40d6-b0ce-b566dcd04fa5\"}"},{"__ref":"DeepDives:{\"uuid\":\"81011d95-44c8-467a-84d8-6cf4bb79013d\
