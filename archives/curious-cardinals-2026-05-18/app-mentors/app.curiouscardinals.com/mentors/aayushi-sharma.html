xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"cd7390fc-4f4b-44a8-8145-ab04c7afa747\"}":{"__typename":"DeepDives","uuid":"cd7390fc-4f4b-44a8-8145-ab04c7afa747","content":"\u003cp\u003eAs I reflect back on my academic and personal journeys, I find that I had incredible mentors who lead me discover life-changing passions. These mentors have supported me and shown me what is possible! Without them, I wouldn't be who I am today, and it is extremely important to me to carry that forward to the next generation of students. I find that in these large transitory periods in high school and middle school, the right person can really provide the guidance and stability students might need. As someone who has mentored a few students now, it is extremely rewarding and valuable to see how students can change and grow into their interests and passions!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4f16bfa5-7f57-450b-83e1-5edc99d68bd0\"}":{"__typename":"DeepDives","uuid":"4f16bfa5-7f57-450b-83e1-5edc99d68bd0","content":"\u003cp\u003eIn my spare time, I like listening to and playing music! As someone who was in a band and a choir, I like to try and learn new instruments all the time. Currently, I am working on learning the acoustic guitar!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"71c959ef-18b2-4fe1-91b4-f1b7ca17d7f1\"}":{"__typename":"DeepDives","uuid":"71c959ef-18b2-4fe1-91b4-f1b7ca17d7f1","content":"\u003cp\u003eLike many children, I had a dream to become an astronaut. As I grew, I realized that it was kind of silly, and switched my aspirations to many things: doctor, veterinarian, pilot, pastry chef, etc. I eventually found my passion for building and bringing new ideas to life, which led me to pursue engineering. And engineering leads me back to my silly dream of being an astronaut. Through my passion for creativity, I found myself working at NASA and designing new devices for the same astronauts I looked up to as a kid!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"48b1c7c4-2220-4f64-b3d4-9d9eb4ad3a5c\"}":{"__typename":"DeepDives","uuid":"48b1c7c4-2220-4f64-b3d4-9d9eb4ad3a5c","content":"\u003cp\u003eAs a woman of color in STEM, I have struggled a lot with imposter syndrome. In classes, projects, and work, I have often been the only girl in the room. I would feel hesitant to speak up, contribute ideas, or point out mistakes - in fear that I was wrong or seem like I don't belong. However, I realized that it was silly to think that way! It wasn't easy, but realizing that I work just as hard as everyone else and seeing my ideas and designs come to life helped me understand: progress over perfection. I gave myself the grace to make mistakes to learn from and grow to fully grasp concepts. All of that has helped me become a better mentor, and I strive to help students feel confident to ask questions and feel comfortable to explore their passions and creativity without fear of being judged. I show students how to focus on their progress and growth, rather than their areas of improvement, so they can stay motivated and inspire themselves as much as they inspire me every day! If a student struggles with imposter syndrome, I am always happy to talk and give students tools to work through it! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"0b3b50d6-0a10-4abf-9a64-6eea26cf596e\"}":{"__typename":"School","uuid":"0b3b50d6-0a10-4abf-9a64-6eea26cf596e","name":"Charter School of Wilmington","city":"Wilmington","type":"HIGH","state":"Delaware","country":"United States","zip":"19807"},"Education:{\"uuid\":\"0b8f7ee9-e2f2-46f7-83df-819bc9325e76\"}":{"__typename":"Education","uuid":"0b8f7ee9-e2f2-46f7-83df-819bc9325e76","school":{"__ref":"School:{\"uuid\":\"0b3b50d6-0a10-4abf-9a64-6eea26cf596e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}":{"__typename":"School","uuid":"0505e371-93af-4291-ab60-2728b5ad4443","name":"Northeastern University","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02115"},"Education:{\"uuid\":\"e518d995-13a0-4a71-b26b-bdcabd995486\"}":{"__typename":"Education","uuid":"e518d995-13a0-4a71-b26b-bdcabd995486","school":{"__ref":"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering and Bioengineering with Minor in Material Science","degree":null},"MentorPublicProfile:{\"uuid\":\"1c1c2f49-5e29-42ef-a163-45dabb70512a\"}":{"__typename":"MentorPublicProfile","uuid":"1c1c2f49-5e29-42ef-a163-45dabb70512a","displayName":"Aayushi S.","slug":"aayushi-sharma","biography":"\u003cp\u003eAayushi is a graduate from Northeastern University in Boston and is originally from Delaware! She is passionate about creativity and learning, which led her to be the first person at Northeastern University to achieve a combined bachelor's degree in Mechanical Engineering and Bioengineering, along with a Minor in Material Science. Currently, she is employed at NASA, developing Life Support Systems for astronauts! She has had previous industry experience in medical devices at Boston Scientific and in robotics at Product Insight, as well as research experience at Northeastern University and Harvard University.\u003c/p\u003e\u003cp\u003eAdditionally, she has project experience in creating robots, creating accessible products for clients with disabilities, coding, and creating websites, to name a few side projects!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDue to her passion for learning, Aayushi likes to help others learn too! She has many years of experience with mentorship. While in high school, she was tutor at Kumon and MathPlus, focusing on K-6 Math and Reading, as well as Pre-Algebra, Algebra, Geometry, Trigonometry, SAT Math, and Pre-Calculus topics. She served as president of the Student Leadership Initiative Program, which was a mentorship program to connect upperclassmen to underclassmen. Aayushi continued to be a mentor in college, as teacher's assistant for Biomaterials class and tutor for Calculus. She also mentored first-year engineering students on engineering design projects for three years, leading first-years to navigate deadlines, working in a team, technical design aspects, budgets, material selection, project planning, and much more to successfully develop games, apps, and products. She helped lead underclassmen to design and build a bionic hand, focusing on 3D CAD modeling, 3D printing, and mechanics.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs someone who scored a perfect SAT Math on her first attempt, Aayushi's approach to learning is focused on cultivating a growth mindset and developing consistent habits. She values connecting with students and helping them become excited about learning! Her teaching style is very interactive, placing an importance on cultivating an environment in which students feel comfortable asking questions and for advice. Aayushi strives to help students with organization and time-management, as those are some of the biggest barriers to effective studying or project progress and can cause students to lose focus and motivation quickly.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her free-time, Aayushi likes to read, run (currently training for her 2nd half marathon), play dungeons and dragons, thrift, and enjoy live music events. She also loves experimenting with painting, baking, and crocheting. She used to be in a band in college and sing in her college choir, and continues her passion for music by playing the guitar now!\u003c/p\u003e","teachingVideoPlaybackId":"pywavJCyHmpMmJlWunMS6b9JQGQe7cohgCBt00v5GD3c","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering and Bioengineering with Minor in Material Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cd7390fc-4f4b-44a8-8145-ab04c7afa747\"}"},{"__ref":"DeepDives:{\"uuid\":\"4f16bfa5-7f57-450b-83e1-5edc99d68bd0\"}"},{"__ref":"DeepDives:{\"uuid\":\"71c959ef-18b2-4fe1-91b4-f1b7ca17d7f1\"}"},{"__ref":"DeepDives:{\"uuid\":\"48b1c7c4-2220-4f64-b3d4-9d9eb4ad3a5c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ff6f08b9-6b88-4d74-a1fc-9df2547d63bc/-/preview/-/format/jpg/","https://ucarecdn.com/c56c0d2d-66bf-4ea0-88dd-f1b087492c46/-/preview/-/format/jpg/","https://ucarecdn.com/277f5408-dbc6-44a0-97d3-3b2f8e612716/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0b8f7ee9-e2f2-46f7-83df-819bc9325e76\"}"},{"__ref":"Education:{\"uuid\":\"e518d995-13a0-4a71-b26b-bdcabd995486\"}"}],"hiredAt":"2025-10-31T17:46:55.420Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Biology","Physics","Writing","Academic Coaching","College Essay Writing","Executive Function","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Web Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"aayushi-sharma\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1c1c2f49-5e29-42ef-a163-45dabb70512a\"}"}}},"_sentryTraceData":"0d0f522b5ede4b48ba77d49daa221151-a1ed1793373a1452-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=0d0f522b5ede4b48ba77d49daa221151,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"aayushi-sharma"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></h
