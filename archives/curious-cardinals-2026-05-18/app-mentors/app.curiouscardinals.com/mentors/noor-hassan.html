xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"28b42be6-f7e1-42cc-9adb-ba3e885af37c\"}":{"__typename":"Favorites","uuid":"28b42be6-f7e1-42cc-9adb-ba3e885af37c","photoUrl":"https://ucarecdn.com/afecaddb-7c86-4dcb-8efc-db57cebf5855/","title":"Mohamed Salah","type":"ATHLETE"},"Favorites:{\"uuid\":\"7ea2ee88-99df-499b-b749-8a738c2fde84\"}":{"__typename":"Favorites","uuid":"7ea2ee88-99df-499b-b749-8a738c2fde84","photoUrl":"https://ucarecdn.com/01fc56ad-8fb1-43e7-8b8c-c3628a7227e8/","title":"Liverpool ","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"771e88d4-b732-4d12-88ca-61dfba300c62\"}":{"__typename":"CausesSupported","uuid":"771e88d4-b732-4d12-88ca-61dfba300c62","name":"Islamic Relief","description":"\u003cp\u003eI support this cause because they provide people around the world with resources\u003c/p\u003e","photoUrl":"https://ucarecdn.com/7f29a141-bbc7-4469-b0fb-1c65795fff80/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cc426ec6-ec83-4030-a110-67cd0ed3f22e\"}":{"__typename":"DeepDives","uuid":"cc426ec6-ec83-4030-a110-67cd0ed3f22e","content":null,"videoPlaybackId":"Ju5FMfXT6eoyaG7YHmpPUd6HSvo4GKeVPpP00aiPcMMs","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9393c8aa-65e2-479c-a643-f228f821fc4c\"}":{"__typename":"DeepDives","uuid":"9393c8aa-65e2-479c-a643-f228f821fc4c","content":"\u003cp\u003eIf I were to speak with my middle and high school self, I would tell her to be more confident. It’s okay to ask questions in class, even if they seem simple. It’s okay to make mistakes, whether it’s on a test or missing a shot on the field. I would remind her that confidence doesn’t mean perfection, but believing in yourself enough to try, learn, and grow. I’d also tell her not to hold back from being herself, because at the end of the day, no one is paying as much attention to us as we think. It’s like the spotlight effect; we often feel like everyone’s watching, but really, they’re not. Take the risk. Go talk to someone new, raise your hand to answer the question, call for the ball on the field, sign up for the school play, because those daily risks are what help you grow and discover who you are. Every time you step out of your comfort zone, you gain confidence, even if things don’t go perfectly. What matters most isn't being the best, but being brave enough to try, so take the chance, be yourself, and trust that you’re capable of more than you think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"ca6cc66e-1c36-4061-85d2-280fb39d5a79\"}":{"__typename":"School","uuid":"ca6cc66e-1c36-4061-85d2-280fb39d5a79","name":"Milton High School","city":"Milton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02186"},"Education:{\"uuid\":\"0dc2c1a3-da91-4607-8848-a71ace232452\"}":{"__typename":"Education","uuid":"0dc2c1a3-da91-4607-8848-a71ace232452","school":{"__ref":"School:{\"uuid\":\"ca6cc66e-1c36-4061-85d2-280fb39d5a79\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b662c538-dd09-45a6-960f-37078ba9c3ce\"}":{"__typename":"School","uuid":"b662c538-dd09-45a6-960f-37078ba9c3ce","name":"UMass Boston","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02125"},"Education:{\"uuid\":\"133d7738-200f-4c39-976e-edf3ba747543\"}":{"__typename":"Education","uuid":"133d7738-200f-4c39-976e-edf3ba747543","school":{"__ref":"School:{\"uuid\":\"b662c538-dd09-45a6-960f-37078ba9c3ce\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"0b884f5a-aa5d-410b-8996-e08f7635f54c\"}":{"__typename":"MentorPublicProfile","uuid":"0b884f5a-aa5d-410b-8996-e08f7635f54c","displayName":"Noor H.","slug":"noor-hassan","biography":"\u003ch2\u003e\u003cstrong\u003eNoor H.\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003cstrong\u003ePsychology \u0026amp; Cognitive Science (Passion Project)\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi! I’m Noor, an Honors Psychology graduate and a Cognitive Science master’s student at the University of Pompeu Fabra in Barcelona, Spain. I’m passionate about understanding how people learn, not just through lectures and labs, but through real-world experience. My work bridges the gap between brain science, culture, and human adaptability.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe that learning happens everywhere: in classrooms, labs, and across borders. My studies have taken me across three continents, from the U.S. to South Korea to Spain, where I explore how the mind works through psychology, linguistics, and culture. Along the way, I discovered how learning new languages and immersing myself in different communities helped me understand people, and myself, on a deeper level.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eMy Experience\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOver the past few years, I’ve had the opportunity to:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConduct neurocognitive research in UMass Boston’s Early Minds Lab, studying how our senses shape perception.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLearn research skills like scientific writing, grant proposal development, data analysis, and EEG (a method that lets scientists “listen” to brain activity).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eContribute to NIH-funded research and present findings that connect neuroscience to education.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMentor first-year college students as a peer advisor, supporting their academic and personal growth.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eVolunteer as a youth mentor for Muslim middle and high school students in Boston, helping them build confidence and self-expression.\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences taught me to think critically, design meaningful projects, communicate complex ideas, and most importantly, how to learn through doing.\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhat I Specialize In\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI mentor students interested in:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eIntroductory psychology or neuroscience research, from forming hypotheses to collecting and analyzing data.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eScholarship and research grant applications, including crafting strong proposals and personal narratives.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStudy abroad planning and applications, offering insight into adapting to new academic systems, cultures, and languages.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eI love helping students connect their passions to meaningful opportunities, whether that’s a research project, fellowship, internship, or cross-cultural experience.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m Qualified to Help\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve been recognized with multiple academic scholarships and research grants, including NIH funding, UMass Boston’s PACE Research Grant, and the Undergraduate Research Fund. I was also named a U.S. Fulbright Semifinalist (2025), reflecting my commitment to global, research-based learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy mentoring approach is reflective and strategic. I focus on helping students turn curiosity into confidence and create tangible plans for growth.\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eOutside of Academics\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside the classroom and lab, I’m passionate about learning languages, traveling, and exploring cultures. I’m fluent in Arabic and English, and currently learning Spanish and Portuguese through classes, music, and daily experiences.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not studying or mentoring, you’ll probably find me at the gym (I love to lift!), discovering new cafés, or taking long walks with a good playlist.\u003c/p\u003e\u003chr\u003e","teachingVideoPlaybackId":"00wGd01GQRBTggeCnE47q7pX028sq01TJXjwtoTLjRq501Sc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m really proud of starting my university’s powerlifting club. I had been training and competing for a while and wanted to bring that community to campus, so I organized practices, recruited members, and got the club officially recognized. I even qualified and competed at USAPL Collegiate Nationals! It was an amazing experience.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"28b42be6-f7e1-42cc-9adb-ba3e885af37c\"}"},{"__ref":"Favorites:{\"uuid\":\"7ea2ee88-99df-499b-b749-8a738c2fde84\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"771e88d4-b732-4d12-88ca-61dfba300c62\"}"}],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cc426ec6-ec83-4030-a110-67cd0ed3f22e\"}"},{"__ref":"DeepDives:{\"uuid\":\"9393c8aa-65e2-479c-a643-f228f821fc4c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c2de0704-0f8d-4e41-b099-943a9610665e/-/preview/-/fo
