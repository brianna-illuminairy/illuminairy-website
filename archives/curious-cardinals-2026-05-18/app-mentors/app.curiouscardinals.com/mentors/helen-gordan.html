xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"16a0416d-51dc-48ec-b530-30af0c5d3d4a\"}":{"__typename":"DeepDives","uuid":"16a0416d-51dc-48ec-b530-30af0c5d3d4a","content":"\u003cp\u003eHigh school is such a special time for exploration — try as many new things as you can. Join clubs, take classes, reach out to mentors. Are you interested in mechanical engineering? Make yourself a lie detector! Do you think journalism is cool? Pitch a story to the local paper! Interested in the lifestyle of a doctor? Reach out to your pediatrician and ask her if you can shadow for a day.! The sky is the limit and you will find so many people willing to help. Oh— and leave time to have fun :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"585095c1-171f-497d-a34c-188a779ceb7c\"}":{"__typename":"DeepDives","uuid":"585095c1-171f-497d-a34c-188a779ceb7c","content":"\u003cp\u003eTo me, mentorship embodies growth and human connection. It’s a symbiosis — as a mentor, I have the privilege of witnessing the transformation of those I support and can learn from my mentee too. By investing in others, we create a ripple effect, spreading knowledge, inspiration, and confidence.\u0026nbsp; I am so grateful to all those who guided me in high school, college, and now. I want to help guide the next generation of leaders!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"03e77669-ca1f-47a4-9ed4-7af6d6ecf98d\"}":{"__typename":"DeepDives","uuid":"03e77669-ca1f-47a4-9ed4-7af6d6ecf98d","content":"\u003cp\u003eRight now (I’m always open to change!), my dream job is as a physician-entrepreneur. As a physician, I can observe the patient experience and draw conclusions on pressing needs; as an engineer, I will have the skill set necessary to develop solutions for those needs. By drawing on these two disciplines, I hope to develop patient-centric technologies that improve accessibility and health outcomes.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"da1f9d76-59b7-41c2-a5cf-0cac0e35092d\"}":{"__typename":"DeepDives","uuid":"da1f9d76-59b7-41c2-a5cf-0cac0e35092d","content":"\u003cp\u003eYou might find me sitting outside with a book (recent favorites include Demon Copperhead, Rules of Civility, and With the Old Breed). In summer, I like to trail run. In winter, I like to ski. I love the physical arts — pottery, woodworking, collaging — anything where I can use my hands. I love to go to stand-up comedy shows, music events, and anywhere where I can see my friends!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"fe149663-4357-448b-9343-2465aeac7c7a\"}":{"__typename":"Education","uuid":"fe149663-4357-448b-9343-2465aeac7c7a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":"2022","expectedGradYear":"2023","major":"Electrical Engineering + Pre-Med","degree":"Bachelors of Science"},"School:{\"uuid\":\"888d454a-5e56-4edf-aee3-81e83892b286\"}":{"__typename":"School","uuid":"888d454a-5e56-4edf-aee3-81e83892b286","name":"Menlo-Atherton High School","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"b035ead8-db6d-46b2-b78d-3dd7dd3e013e\"}":{"__typename":"Education","uuid":"b035ead8-db6d-46b2-b78d-3dd7dd3e013e","school":{"__ref":"School:{\"uuid\":\"888d454a-5e56-4edf-aee3-81e83892b286\"}"},"startYear":"2012","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"e61bdb37-5fec-4092-8f15-e302f901d873\"}":{"__typename":"MentorPublicProfile","uuid":"e61bdb37-5fec-4092-8f15-e302f901d873","displayName":"Helen G.","slug":"helen-gordan","biography":"Helen graduated from Stanford in 2022 with a B.S. in Electrical Engineering. She is taking a gap year to pursue other interests — skiing, woodworking, and travel, among others! — before beginning medical school at Mt. Sinai in August. She loves thinking about the connection between electricity and the human body — and the ways we can harness electrical signals to develop life-saving therapies. \n\nIn high school, Helen played competitive soccer — winning seven state championships and a national championship — but was sidelined by a series of concussions. After quitting the sport, she dove into robotics and discovered the magic of engineering. Armed with this new toolkit, Helen investigated the blackbox of the brain and traumatic brain injury by building biosensors in a research project that became an INTEL International Science and Engineering Fair Finalist.\n\nLike many, Helen found it difficult to decide on a major in college. She took biology courses, worked in an archaeology lab, and volunteered at a free medical clinic. However, she was most fascinated by the electrical engineering courses that helped explain the concepts that power the modern world. She completed internships at both Tesla and Apple, and worked on a computational platform to perform mathematical functions on brain signals under the mentorship of Dr. Paul Nuyujukian.  \n\nShe has loved having the freedom to explore varied interests and combine them in an interdisciplinary manner, and is passionate about helping students explore their own interests in a way that helps them to do the same! She hopes, above all, to fuel curiosity and love of learning for her students.","teachingVideoPlaybackId":"CtAJ9xn7V6ipkWbONJPM352fHohGUrIrt02WRLVIuKmI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Electrical Engineering + Pre-Med","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"16a0416d-51dc-48ec-b530-30af0c5d3d4a\"}"},{"__ref":"DeepDives:{\"uuid\":\"585095c1-171f-497d-a34c-188a779ceb7c\"}"},{"__ref":"DeepDives:{\"uuid\":\"03e77669-ca1f-47a4-9ed4-7af6d6ecf98d\"}"},{"__ref":"DeepDives:{\"uuid\":\"da1f9d76-59b7-41c2-a5cf-0cac0e35092d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/25d7c300-7976-4ed7-9175-42dbde449b71/-/crop/603x602/88,0/-/preview/-/format/jpg/","https://ucarecdn.com/0635b395-2789-45a4-92b3-3a4f4577f9bb/-/preview/-/format/jpg/","https://ucarecdn.com/fbb3f762-c9f1-40cd-8110-2cb9f8d2cdd3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fe149663-4357-448b-9343-2465aeac7c7a\"}"},{"__ref":"Education:{\"uuid\":\"b035ead8-db6d-46b2-b78d-3dd7dd3e013e\"}"}],"hiredAt":"2023-02-01T00:32:16.440Z","
