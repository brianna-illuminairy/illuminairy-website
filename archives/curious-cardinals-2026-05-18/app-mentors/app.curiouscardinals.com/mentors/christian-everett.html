xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bc252f35-6873-4b48-a274-0890cbd7989a\"}":{"__typename":"DeepDives","uuid":"bc252f35-6873-4b48-a274-0890cbd7989a","content":"\u003cp\u003eYes, I loved science as a kid, but why did I choose Molecular and Cellular Biology specifically? I fell in love with understanding the world around me, and I wanted to learn about the foundational units of life - from sports nutrition to medicine and illness. Biology can span so many different topics like memory encoding or tumor formation, and I wanted to know how this all worked.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c4cc3ee7-22a4-4bd2-9263-8d9bc5fa57ba\"}":{"__typename":"DeepDives","uuid":"c4cc3ee7-22a4-4bd2-9263-8d9bc5fa57ba","content":"\u003cp\u003eMy dream job is to be a team physician for the Dallas Cowboys football team. I grew up as a HUGE Cowboys fan (although I was a soccer player myself), and I'm also really passionate about medicine. At college, I collaborate with the Stanford football team physician on an Orthopaedic Surgery research project seeking to improve surgical decision-making for knee dislocations in young athletes. This research experience has fascinated me with sports medicine and propelled me one step closer to my dream of being a Dallas Cowboys team physician.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"75942a93-7bed-486c-bc14-d41198cf33ed\"}":{"__typename":"DeepDives","uuid":"75942a93-7bed-486c-bc14-d41198cf33ed","content":"\u003cp\u003eI'm the oldest among all of my cousins/siblings in my family, so mentorship is something that came naturally. Developing as a mentor, though, I've fallen in love with the process of teaching inspiring young students, and making sure that my challenges don't just become learning lessons for myself. Instead, I hope to pass on my lived knowledge to other students and elevate them to be the best student, person, athlete, chef, or whatever it is they hope to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f1f591bc-73ca-469b-b7c8-050ecef617a4\"}":{"__typename":"DeepDives","uuid":"f1f591bc-73ca-469b-b7c8-050ecef617a4","content":"\u003cp\u003eI love being active! As students, we spend so much time sitting down in class or doing homework that I've got to be moving during my free time. Whether that's playing pick-up soccer, hiking, or walking to a restaurant, I love being active surrounded by friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"87f8fadf-1f00-4816-baa5-6aa4469fe250\"}":{"__typename":"Education","uuid":"87f8fadf-1f00-4816-baa5-6aa4469fe250","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biology (Molecular, Cellular, and Developmental Biology)","degree":"BS"},"School:{\"uuid\":\"960fa318-5ddb-4db9-a8d7-dfed69451092\"}":{"__typename":"School","uuid":"960fa318-5ddb-4db9-a8d7-dfed69451092","name":"Highland Park High School","city":"Dallas","type":"HIGH","state":"Texas","country":"United States","zip":"75205"},"Education:{\"uuid\":\"99dc0646-c9ae-4f9a-ab91-a005548fad97\"}":{"__typename":"Education","uuid":"99dc0646-c9ae-4f9a-ab91-a005548fad97","school":{"__ref":"School:{\"uuid\":\"960fa318-5ddb-4db9-a8d7-dfed69451092\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"fa40a112-5b00-45d7-ac07-928c084bf04f\"}":{"__typename":"MentorPublicProfile","uuid":"fa40a112-5b00-45d7-ac07-928c084bf04f","displayName":"Christian W.","slug":"christian-everett","biography":"Christian is a junior at Stanford University pursuing a degree in Biology and currently applying to medical school. Born and raised in Dallas, Christian grew up with a love for sports (huge Dallas Cowboys fan) and a fascination with science. Now, he studies molecular and cellular biology, anatomy, chemistry, physics, and sports medicine, learning the intricate ways that basic science underlies our bodies' abilities and the world around us. Beyond classes, Christian is a research assistant in the Stanford Medicine Department of Orthopaedic Surgery, a healthcare clinic volunteer, co-chair of the Stanford American Indian Organization, and an avid gym-goer. This past summer, Christian scored in the 99th percentile on the MCAT, and he plans to attend medical school after graduation in 2024. Outside of academics, Christian loves to stay active, whether that be playing soccer, weight-lifting, trying new food with friends, or something more relaxing like watching sci-fi movies. Christian is thrilled to share his passion for science and show them that chemistry is more exciting than just acids and bases - it's what powers everything our bodies can accomplish!","teachingVideoPlaybackId":"FvzvEAIA9prYOR00MlgeKwvb4v007XbDupgjhcMIcVAFk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology (Molecular, Cellular, and Developmental Biology)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bc252f35-6873-4b48-a274-0890cbd7989a\"}"},{"__ref":"DeepDives:{\"uuid\":\"c4cc3ee7-22a4-4bd2-9263-8d9bc5fa57ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"75942a93-7bed-486c-bc14-d41198cf33ed\"}"},{"__ref":"DeepDives:{\"uuid\":\"f1f591bc-73ca-469b-b7c8-050ecef617a4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/19ba7d5a-d626-44ac-9217-f2183fa235ad/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"87f8fadf-1f00-4816-baa5-6aa4469fe250\"}"},{"__ref":"Education:{\"uuid\":\"99dc0646-c9ae-4f9a-ab91-a005548fad97\"}"}],"hiredAt":"2023-04-04T00:09:02.035Z","topics":["6-8 Grade Science","Chemistry","Biology","Physics","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Coding / Programming","Medicine / Health","Sports Analytics","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"christian-everett\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fa40a112-5b00-45d7-ac07-928c084bf04f\"}"}}},"_sentryTraceData":"dd447648de204147be60629222dd8f3d-949a429e08a47519-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry
