xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"209626cd-850d-4625-9d74-4fb60605cd3b\"}":{"__typename":"DeepDives","uuid":"209626cd-850d-4625-9d74-4fb60605cd3b","content":"\u003cp\u003eIn my free time, I love traveling, seeing live music, cooking, and—thanks to my current students—I've discovered a new love for crafting! I'm also a lover of languages and am currently learning French (I'm A1 right now), Irish, and Italian!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"46ee1e3e-bc19-4c34-b5b0-dc200dd1fbb7\"}":{"__typename":"DeepDives","uuid":"46ee1e3e-bc19-4c34-b5b0-dc200dd1fbb7","content":"\u003cp\u003eStanding at 6' 7\" and 83-years-old, E. Lee Walker–or the Gentle Giant as he may lovingly be called by some–is my greatest mentor. Lee is not important to me because he served as the first President of Dell Technologies, nor because I received an A in his class freshman year; Lee is an incredible mentor to me because he sees me for who I am, excites and nourishes\u0026nbsp;my passions, and leads me towards opportunities I did not even imagine were available to me. As a man from a small town in Texas who has gone on to achieve great things, our shared identities allow me to dream as big as he did with the confidence that anything is possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"54c44bbf-2488-4a40-a262-a0e573e00a97\"}":{"__typename":"DeepDives","uuid":"54c44bbf-2488-4a40-a262-a0e573e00a97","content":"\u003cp\u003eSlow down every once in a while to appreciate what's all around you. Keep having fun and working hard. Nurture your hobbies!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"40850515-b896-4721-8a4e-9f829518e1ed\"}":{"__typename":"DeepDives","uuid":"40850515-b896-4721-8a4e-9f829518e1ed","content":"\u003cp\u003eMy dream job is to work as a social impact consultant, working hand-in-hand with non-profits, philanthropies, and foundations to solve complex problems and maximize the impact they are able to deliver to their communities. The sectors I specifically want to work in are education, advocacy, and the environment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"d363913c-5b86-4d73-8042-032aa800777f\"}":{"__typename":"School","uuid":"d363913c-5b86-4d73-8042-032aa800777f","name":"Central High School","city":"San Angelo","type":"HIGH","state":"Texas","country":"United States","zip":"76901"},"Education:{\"uuid\":\"a73e5777-1096-4798-9aea-dd99c3f1e391\"}":{"__typename":"Education","uuid":"a73e5777-1096-4798-9aea-dd99c3f1e391","school":{"__ref":"School:{\"uuid\":\"d363913c-5b86-4d73-8042-032aa800777f\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}":{"__typename":"School","uuid":"bc77f602-b393-4fa6-9e11-df16e522c65d","name":"The University of Texas at Austin","city":"Austin","type":"COLLEGE","state":"Texas","country":"United States","zip":"78712"},"Education:{\"uuid\":\"c8ea7710-d036-4dd6-826b-4ae6baa70235\"}":{"__typename":"Education","uuid":"c8ea7710-d036-4dd6-826b-4ae6baa70235","school":{"__ref":"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Government","degree":null},"MentorPublicProfile:{\"uuid\":\"9e97395b-3643-4832-91e4-fb1ca36d2d3b\"}":{"__typename":"MentorPublicProfile","uuid":"9e97395b-3643-4832-91e4-fb1ca36d2d3b","displayName":"Andrea M.","slug":"andrea-meadorsafont","biography":"\u003cp\u003eHi y'all! My name is Andrea Meador-Safont, and I'm a recent grad from the University of Texas at Austin, now based in Madrid, Spain, where I teach English to elementary school kids aged 3 to 12!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a kid from a small town, I have always been guided by a love for caring for people and being active in my community. Since the 2nd grade, I was involved in community theatre and went on to compete with my high school’s Speech team. As President of my team junior and senior year, a State Champion, and a national semifinalist, I learned the importance of mentorship (both receiving and giving) and how valuable public speaking can be as a tool for confidence-building, advocacy, and self-expression.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also grew up in a multicultural household—my mother immigrated to the U.S. from Spain—so I was raised bilingual in Spanish and English. Speaking two languages helped me connect with so many people in my community, including middle schoolers in English as a Second Language (ESL) classes, whom I had the opportunity to tutor in high school.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese experiences shaped my passion for education and my decision to pursue a degree in Government (Political Science) and Plan II Honors, with a minor in Spanish. During college, I was excited to dive into the professional world and try working many different types of jobs. My love for politics, advocacy, and social impact guided me through internships at all levels of government, from Senatorial campaigns to the U.S. Department of State. During my time in D.C., I was put in charge of overseeing a UN Peacekeeping Operation in Somalia and had the opportunity to learn firsthand what multilateral negotiations are like at the UN Security Council level. In addition to my studies, I also served on the Plan II Director’s Student Advisory Board, where I helped shape the curriculum and culture for my small, interdisciplinary honors program, and I was the Career \u0026amp; Personal Development Chair of my sorority, mentoring members in professional growth. One of my favorite college experiences was studying abroad for a semester at Sciences Po in Paris, France, where I studied international politics and policy with a hugely diverse group of students and reveled in French culture.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about politics, education, and advocacy work in the social sector, and plan to work in social impact consulting after my time in Spain. The biggest lesson I’ve learned, especially this year, is that I love helping students develop confidence in their voices and ideas. As a mentor, my goal is to encourage curiosity, critical thinking, and self-expression while making learning engaging and fun!\u003c/p\u003e","teachingVideoPlaybackId":"KAaQnr3bvaJm4Z3i02e1Rqz1eaIeHwRW6gDZmdwp02kS00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my greatest achievements to date has been writing a research paper on democracy and the threat of authoritarianism globally. I was invited to collaborate with the intergovernmental organization International IDEA in their Panama office, and spent last summer working among researchers to understand and strengthen Panamanian democracy. My contributions are soon to be published in a multilingual journal published by the Electoral Tribunal of Panama.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Government","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"209626cd-850d-4625-9d74-4fb60605cd3b\"}"},{"__ref":"DeepDives:{\"uuid\":\"46ee1e3e-bc19-4c34-b5b0-dc200dd1fbb7\"}"},{"__ref":"DeepDives:{\"uuid\":\"54c44bbf-2488-4a40-a262-a0e573e00a97\"}"},{"__ref":"DeepDives:{\"uuid\":\"40850515-b896-4721-8a4e-9f829518e1ed\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/19e9332c-8d11-42a9-96ae-d8d4a4976250/-/preview/-/format/jpg/","https://ucarecdn.com/52db1a2a-e6cc-4b86-97f0-23e417c255bd/-/preview/-/format/jpg/","https://ucarecdn.com/c7d38992-eaaf-44f4-8904-2bf4ab0f1f89/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a73e5777-1096-4798-9aea-dd99c3f1e391\"}"},{"__ref":"Education:{\"uuid\":\"c8ea7710-d036-4dd6-826b-4ae6baa70235\"}"}],"hiredAt":"2025-02-05T13:53:18.012Z","topics":["Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","K-6 Storybook","Creative Writing","Music","Film / Theater","History Project","Video / Photography","Law / Government / Policy","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/7e9ab2cb-d457-4e4e-9f2d-4946a44b3ea9/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"andrea-meadorsafont\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9e97395b-3643-4832-91e4-fb1ca36d2d3b\"}"}}},"_sentryTraceData":"9b
