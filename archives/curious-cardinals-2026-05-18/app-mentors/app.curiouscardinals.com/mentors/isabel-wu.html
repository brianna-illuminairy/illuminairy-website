xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e994f0c2-143c-498b-9f05-1f3c099e12f6\"}":{"__typename":"Favorites","uuid":"e994f0c2-143c-498b-9f05-1f3c099e12f6","photoUrl":"https://ucarecdn.com/dcb319b1-9ff9-40e9-8d1a-33bd4a196805/","title":"Lana Del Rey","type":"ARTIST"},"Favorites:{\"uuid\":\"81280b5a-68a9-4fe8-a4f0-7e68e94c69a7\"}":{"__typename":"Favorites","uuid":"81280b5a-68a9-4fe8-a4f0-7e68e94c69a7","photoUrl":"https://ucarecdn.com/ce689497-30e3-4b75-9c2f-ee02da9d56ed/","title":"The Brothers Karamazov","type":"BOOK"},"Favorites:{\"uuid\":\"c3fc83e2-03ad-41bd-aec0-d8b891cb35e3\"}":{"__typename":"Favorites","uuid":"c3fc83e2-03ad-41bd-aec0-d8b891cb35e3","photoUrl":"https://ucarecdn.com/360d1521-b8b1-446e-8434-b17e090b4e1f/","title":"Matt Damon","type":"ACTOR"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"09028fd8-7d67-4268-90b5-a1d5973ea806\"}":{"__typename":"DeepDives","uuid":"09028fd8-7d67-4268-90b5-a1d5973ea806","content":"\u003cp\u003eIf I could give my high school self advice, I would tell her to maintain an open mind. This is because whatever assumptions I had held closely about the world and myself were liable to change not just once, but many times. By shifting into this growth/change mindset I was able to open my mind to many different possibilities. It also helps with dealing with curveballs in life. Life is not a destination but an adventure, and while that is advice one often hears, I have only felt it more and more as I get older.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"18258afb-f6bd-4ee2-8c55-64c3fb14aa7e\"}":{"__typename":"DeepDives","uuid":"18258afb-f6bd-4ee2-8c55-64c3fb14aa7e","content":"\u003cp\u003eMentorship matters to me because I think it is a crucial element of success in many aspects of life. When we grow up we are taking many cues from parents or peers. Parents have a lot of wisdom to give, but have only one perspective on life. Peers are often influential on us because those are the people we may be seeing a lot in our day-to-day. However because they are the same age as you, they may also be figuring things out for themselves. A mentor who is older but still relatable to you can provide a lot of helpful guidance on how to navigate the modern world and be an important confidant. For me, mentors have provided crucial guidance both practically in my decisions, and emotionally as I was working through issues that were specific to my environment. I found in college, mentors who were familiar with the college environment I was in provided the best guidance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2b1e389c-0265-45f4-8874-0fd0a8469389\"}":{"__typename":"DeepDives","uuid":"2b1e389c-0265-45f4-8874-0fd0a8469389","content":"\u003cp\u003eOne passion project that I have been working on is a series of essays on my personal experience and how they intersect with broader themes about life. It is an opportunity for me to deep dive into things that I have been thinking about and share with people I care about to spark a discussion. In the future I would love to convert these into a series of podcasts, in the style of a Radiolab episode or This American Life.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"03f538cd-4c66-48a5-90d1-0d2bd17094f7\"}":{"__typename":"DeepDives","uuid":"03f538cd-4c66-48a5-90d1-0d2bd17094f7","content":"\u003cp\u003eMy greatest source of motivation comes primarily through discipline and curiosity. Discipline keeps me going and helps to build habits that become automatic after a little while, and curiosity keeps me excited. When I become curious about something and learn more about it, it motivates me to learn even more, or find work that is related to that subject, etc. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"90cf5748-1d02-48ef-8c4c-bad577054099\"}":{"__typename":"School","uuid":"90cf5748-1d02-48ef-8c4c-bad577054099","name":"Hudson High School","city":"Hudson","type":"HIGH","state":"Ohio","country":"United States","zip":"44236"},"Education:{\"uuid\":\"c46c4690-c659-4550-91b5-62974dc6c74f\"}":{"__typename":"Education","uuid":"c46c4690-c659-4550-91b5-62974dc6c74f","school":{"__ref":"School:{\"uuid\":\"90cf5748-1d02-48ef-8c4c-bad577054099\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"1c2a160e-331e-44d5-b90f-16f289c2dd69\"}":{"__typename":"Education","uuid":"1c2a160e-331e-44d5-b90f-16f289c2dd69","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"4ecbad99-6be8-4eea-b8c6-aa55ffacb584\"}":{"__typename":"MentorPublicProfile","uuid":"4ecbad99-6be8-4eea-b8c6-aa55ffacb584","displayName":"Isabel W.","slug":"isabel-wu","biography":"\u003cp\u003eIsabel Wu is a graduate of Harvard University class of 2023. She studied economics with a focus in educational studies. Additionally, she studied Chinese for four semesters, getting a citation in Chinese language at Harvard. Isabel studied Chinese in order to more easily communicate with her parents and relatives, and also enjoys learning about Chinese culture and history. Within education Isabel is passionate about higher education and its transitions into the workplace, as well as designing methods to help students discover their paths. She has conducted research on the new graduate job market and helped to create a data tool to visualize the national trends. Alongside education, Isabel enjoys literature. Some of her favorite books from college include To the Lighthouse by Virginia Woolf, 100 Years of Solitude by Gabriel Garcia Marquez, and The Interpreter by Suki Kim. In college she participated in a number of extracurriculars including the Harvard Association for US-China Relations, where she helped to design curricula for Chinese high school students. Her classes include an interdisciplinary look at AI, the philosophy of happiness, and public speaking. She also joined a dance group for the first time, where she participated in Chinese and Korean traditional dance, as well as K-pop style. Lastly, Isabel joined her house committee at Harvard, where she helped to put together events for her house (dorm) that would help to encourage community. In her free time Isabel loves to go for runs (she recently ran her first half marathon), read books, and cook. \u003c/p\u003e","teachingVideoPlaybackId":"ZL3pUjEJan4wguLSZ775dixcOI9xzgwLjoU6YtF2IqA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e994f0c2-143c-498b-9f05-1f3c099e12f6\"}"},{"__ref":"Favorites:{\"uuid\":\"81280b5a-68a9-4fe8-a4f0-7e68e94c69a7\"}"},{"__ref":"Favorites:{\"uuid\":\"c3fc83e2-03ad-41bd-aec0-d8b891cb35e3\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"09028fd8-7d67-4268-90b5-a1d5973ea806\"}"},{"__ref":"DeepDives:{\"uuid\":\"18258afb-f6bd-4ee2-8c55-64c3fb14aa7e\"}"},{"__ref":"DeepDives:{\"uuid\":\"2b1e389c-0265-45f4-8874-0fd0a8469389\"}"},{"__ref":"DeepDives:{\"uuid\":\"03f538cd-4c66-48a5-90d1-0d2bd17094f7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1a979d56-09ae-4454-be1a-501523da36f8/-/crop/692x692/0,116/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c46c4690-c659-4550-91b5-62974dc6c74f\"}"},{"__ref":"Education:{\"uuid\":\"1c2a160e-331e-44d5-b90f-16f289c2dd69\"}"}],"hiredAt":"2023-06-07T01:17:47.475Z","topics":["Reading","Business / Entrepreneurship","Web Design","Coding / Programming","Law / Government / Policy","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","Geometry","Calculus","Algebra II","Algebra I","Writing","Academic Coaching","College Essay Writing","Computer Science","Economics"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isabel-wu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4ecbad99-6be8-4eea-b8c6-aa55ffacb584\"}"}}},"_sentryTraceData":"9eedf4a866304a99ae0293d82ad5cd2e-9f9ff236b12ff684-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea1
