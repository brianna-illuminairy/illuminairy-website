xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2b952bbb-a1c8-4000-b788-2db657159e51\"}":{"__typename":"Favorites","uuid":"2b952bbb-a1c8-4000-b788-2db657159e51","photoUrl":"https://ucarecdn.com/98f24051-12ee-40be-af84-710736d4de57/","title":"Pride and Prejudice","type":"MOVIE"},"Favorites:{\"uuid\":\"4643f780-b948-407b-8a36-092f5fea8eb7\"}":{"__typename":"Favorites","uuid":"4643f780-b948-407b-8a36-092f5fea8eb7","photoUrl":"https://ucarecdn.com/b12e9485-0908-447c-b758-2af5d0645143/","title":"Bitter Sweet Symphony","type":"SONG"},"Favorites:{\"uuid\":\"1243384a-0643-4763-a07b-4d50db001c10\"}":{"__typename":"Favorites","uuid":"1243384a-0643-4763-a07b-4d50db001c10","photoUrl":"https://ucarecdn.com/720f6be0-d8e4-4b2b-9479-c31d9e6c8cfa/","title":"Chicago","type":"CITY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"785ec5ba-f8cb-4e0e-86da-d60c69d77ab2\"}":{"__typename":"DeepDives","uuid":"785ec5ba-f8cb-4e0e-86da-d60c69d77ab2","content":"\u003cp\u003eI spent my high school summers finding a balance between learning, service, and creativity. While I took college-level Spanish classes, worked as a student healthcare intern, and made progress toward earning my Girl Scout Gold Award, I also volunteered at local animal shelters, made jewelry, baked for fun, and spent time with friends, either stargazing in wine country or relaxing at the beach.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"50db0484-56a4-4d79-a312-81ce4fb0987a\"}":{"__typename":"DeepDives","uuid":"50db0484-56a4-4d79-a312-81ce4fb0987a","content":"\u003cp\u003eOne passion project I am currently leading is the Opioid Overdose Prevention \u0026amp; Safety program, which I founded in May 2023. Through this initiative, I develop and lead educational sessions on naloxone use while partnering with local nonprofits as well as homeless shelters to reduce stigma/raise community awareness. In collaboration with hospitals, my team has distributed over 1,000 naloxone kits to emergency rooms and community centers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"5fabb837-3c2f-4e08-b883-b137480e8d89\"}":{"__typename":"DeepDives","uuid":"5fabb837-3c2f-4e08-b883-b137480e8d89","content":"\u003cp\u003eAs a high school student, I was organized, motivated, and committed to balancing academics, leadership, and community service. I pursued the full IB Diploma and served as President of the National Honor Society, Key Club, and National Charity League, where I learned leadership is less about having all the answers and more about helping others find their own. Beyond academics, I interned at a local healthcare practice, helped lead a nutrition initiative for individuals experiencing homelessness, played varsity lacrosse, earned my Girl Scout Gold Award, and launched a community project focused on reducing opioid overdose—an experience that inspired me to pursue public health with greater intention.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b0854d66-a013-4b4e-9a75-82d74688e29c\"}":{"__typename":"DeepDives","uuid":"b0854d66-a013-4b4e-9a75-82d74688e29c","content":"\u003cp\u003eThe advice I would give my high school self is, “Whatever you’re not changing, you’re choosing.” Back then, I often felt like certain challenges were out of my control or that I just did not have enough time to fix things. In reality, a lot of what held me back came from not believing I could make a difference or from hesitating to take that first step. I wish I had realized sooner that even small actions can lead to meaningful change and that choosing to stay stuck is often a choice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"dece36d2-b8d2-40ca-8d19-6ab89eabc524\"}":{"__typename":"School","uuid":"dece36d2-b8d2-40ca-8d19-6ab89eabc524","name":"Great Oak High School","city":"Temecula","type":"HIGH","state":"California","country":"United States","zip":"92592"},"Education:{\"uuid\":\"afe3a0be-39dc-4c15-868d-8d99df5fe237\"}":{"__typename":"Education","uuid":"afe3a0be-39dc-4c15-868d-8d99df5fe237","school":{"__ref":"School:{\"uuid\":\"dece36d2-b8d2-40ca-8d19-6ab89eabc524\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"dbd85934-ba26-405e-9fca-7a8942fbcbc5\"}":{"__typename":"Education","uuid":"dbd85934-ba26-405e-9fca-7a8942fbcbc5","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Psychology and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"9af7667c-86c0-4f4e-b1ff-f2b212a0ca80\"}":{"__typename":"MentorPublicProfile","uuid":"9af7667c-86c0-4f4e-b1ff-f2b212a0ca80","displayName":"Lauren R.","slug":"lauren-rhee","biography":"\u003cp\u003eHi! My name is Lauren Rhee and I am from Southern California. Currently, I’m a rising sophomore at Brown University, where I intend to double concentrate in Psychology and Economics. While I previously studied at Cornell University, I chose to transfer to Brown because its open curriculum allows me to design a more flexible academic path. Like tracing your own outline instead of fitting into a pre-drawn template, Brown supplements me with the opportunity to shape my learning experience with more variety.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat same mindset carries into the way I work with and teach others. From my perspective, every learner has their own shape—some thrive with structure, others with creativity, and many somewhere in between. To accommodate, I enjoy adapting my approach to best support whoever I am working with, whether that means breaking down a challenging homework problem, brainstorming ideas for an essay, or reviewing a resume.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile I am new to formal tutoring, I have always been someone peers and younger students turn to for support, especially when they feel stuck. This is because my goal is not just to help students complete a task, but to help them understand how they learn and what works best for them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNevertheless, my interest in supporting others goes beyond academics. Over the years, I have been deeply involved in service and leadership roles that have shaped how I show up for people in all areas of life. I was honored to receive the United States Senate Certificate of Accomplishment and the U.S. House of Representatives Certificate of Special Congressional Recognition for creating a nutrition and gardening curriculum for women and children in Maneadero, Mexico. Many of these families had experienced domestic abuse and lacked access to fresh produce, so the program focused on expanding healthy eating options and building long-term wellness habits.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also received the National Charity League Modelette Award and the Gold Presidential Volunteer Service Award, which recognized my ongoing commitment to community service. Whether I was writing letters for hospital patients, volunteering at animal shelters, working the register at a thrift store to raise money for school supplies, building a garden for a home supporting families in medical crisis, or painting with seniors at my local senior center, I always tried to show up with care and purpose. These experiences taught me the value of consistency and helped me discover a genuine passion for mentoring and dedicating my time to meaningful commitments, which is why I decided to join Curious Cardinals.\u003c/p\u003e","teachingVideoPlaybackId":"Sbqn1hF01k8PEqoEnqnjxrYiBwMTrIgR2rLyO011BKrxs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my proudest accomplishments is seeing the Northern Lights, something that has fascinated me since I was a child. I used to read about them in books and watch videos, completely mesmerized by the idea that something so magical could exist in the real world. For years, it felt like a distant dream. Standing under that glowing, shifting sky felt surreal. It was a moment of awe, but also one of simple pride. Knowing that I followed through on something that once felt out of reach reminded me that even the most whimsical childhood dreams can be achieved with enough intention. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"2b952bbb-a1c8-4000-b788-2db657159e51\"}"},{"__ref":"Favorites:{\"uuid\":\"4643f780-b948-407b-8a36-092f5fea8eb7\"}"},{"__ref":"Favorites:{\"uuid\":\"1243384a-0643-4763-a07b-4d50db001c10\"}"}],"causesSupported":[],"major":"Psychology and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"785ec5ba-f8cb-4e0e-86da-d60c69d77ab2\"}"},{"__ref":"DeepDives:{\"uuid\":\"50db0484-56a4-4d79-a312-81ce4fb0987a\"}"},{"__ref":"DeepDives:{\"uuid\":\"5fabb837-3c2f-4e08-b883-b137480e8d89\"}"},{"__ref":"DeepDives:{\"uuid\":\"b0854d66-a013-4b4e-9a75-82d74688e29c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c8773c91-cb9f-45c2-aa9a-713d62a62a90/-/preview/-/format/jpg/","https://ucarecdn.com/d1e2b797-a0e5-43e0-8364-e6404b522752/-/preview/-/format/jpg/","https://ucarecdn.com/6b392d25-9ae7-426d-8b85-a684648b7558/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"afe3a0be-39dc-4c15-868d-8d99df5fe237\"}"},{"__ref":"Education:{\"uuid\":\"dbd85934-ba26-405e-9fca-7a8942fbcbc5\"}"}],"hiredAt":"2025-05-29T23:19:51.973Z","topics":["K-5 Grade Math","Biology","Writing","College Essay Writing","Economics","Academic Coaching"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lauren-rhee\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9af7667c-86c0-4f4e-b1ff-f2b212a0ca80\"}"}}},"_sentryTraceData":"8691f87d852e44eeb0d6a6f1623f22c1-9d6a3af1da0914b3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8691f87d852e44eeb0d6a6f1623f22c1,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"lauren-rhee"},"buildId":"ZAcrs1hPe6xc
