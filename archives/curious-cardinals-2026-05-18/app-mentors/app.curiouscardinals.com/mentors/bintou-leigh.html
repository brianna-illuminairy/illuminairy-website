xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0b612c3d-17b0-4934-92c1-cf0b7ae3a0f7\"}":{"__typename":"Favorites","uuid":"0b612c3d-17b0-4934-92c1-cf0b7ae3a0f7","photoUrl":"https://ucarecdn.com/0fa208cd-825b-4fe3-afc1-4da844e670c0/","title":"Football (not the American one)","type":"SPORT"},"Favorites:{\"uuid\":\"b3ccf771-7c4f-4264-b4bf-c8176b9628ee\"}":{"__typename":"Favorites","uuid":"b3ccf771-7c4f-4264-b4bf-c8176b9628ee","photoUrl":"https://ucarecdn.com/66568cb5-68ed-4ea7-ad17-17348d138a41/","title":"Cillian Murphy","type":"ACTOR"},"Favorites:{\"uuid\":\"475ceb71-bfad-4e1f-94b4-4fd3c66b43e8\"}":{"__typename":"Favorites","uuid":"475ceb71-bfad-4e1f-94b4-4fd3c66b43e8","photoUrl":"https://ucarecdn.com/01253678-35fd-4755-acfd-949db2468804/","title":"Lana del rey","type":"ARTIST"},"CausesSupported:{\"uuid\":\"b06df8af-ce38-4a9f-9f6d-e83a9bafb379\"}":{"__typename":"CausesSupported","uuid":"b06df8af-ce38-4a9f-9f6d-e83a9bafb379","name":"SOS Children's Village, The Gambia","description":"\u003cp\u003eProvides family unit, care, education and homes to children in The Gambia.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/b2576efe-896a-4ad5-b528-347bcc26625e/"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"410f8861-3902-4f9b-87da-0844b8c43718\"}":{"__typename":"DeepDives","uuid":"410f8861-3902-4f9b-87da-0844b8c43718","content":"\u003cp\u003eOne passion project I’ve built is my journey into social media and UGC creation. What started as casual posting turned into a deep interest in digital storytelling and brand strategy. I became intentional about learning content trends, audience engagement, and analytics, and eventually began creating user-generated content for brands.\u003c/p\u003e\u003cp\u003eThrough this, I learned how to pitch myself, negotiate rates, analyze performance data, and stay consistent without external structure. I also developed resilience, navigating algorithm changes, rejected pitches, and content that didn’t perform.\u003c/p\u003e\u003cp\u003eMore than anything, this project strengthened my confidence and showed me how creativity and entrepreneurship can intersect. It’s been both a creative outlet and a hands-on education in branding, strategy, and self-discipline.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c77d2ffa-d5ca-4ebc-8eb8-37876dec260a\"}":{"__typename":"DeepDives","uuid":"c77d2ffa-d5ca-4ebc-8eb8-37876dec260a","content":"\u003cp\u003eIn my spare time, I’m usually doing something that lets me slow down. I love watching films, especially thrillers and period pieces. I’m drawn to stories that build tension quietly and focus on atmosphere and character psychology. I always recommend \u003cem\u003ePrisoners\u003c/em\u003e , \u003cem\u003eLady Macbeth\u003c/em\u003e, \u003cem\u003ePortrait of a Lady on Fire\u003c/em\u003e and \u003cem\u003eThe Witch\u003c/em\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not watching something, I like working with my hands, pottery has become a really grounding practice for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also spend a lot of time working out. Fitness, for me, is about discipline and mental clarity. Moving my body helps me reset, especially after long days.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd then there’s writing poetry, which is probably the most personal of my hobbies. I write when I’m overwhelmed, inspired, confused and whenever I need to process something. It’s reflective, and it helps me make sense of experiences in a way nothing else really does.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"f6ed03d8-d384-476c-ba37-6b1cf3ed07aa\"}":{"__typename":"DeepDives","uuid":"f6ed03d8-d384-476c-ba37-6b1cf3ed07aa","content":"\u003cp\u003eMy greatest source of motivation is internal. I’m not driven as much by competition or external praise as I am by a commitment to becoming the best version of myself. I often picture a future version of me. I want to become someone who is steady, confident, compassionate, and impactful. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat vision feels less like pressure and more like guidance. It helps me stay disciplined, but in a gentle way. I’m motivated by growth and the idea that effort compounds, that showing up consistently builds not just results but character. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0fa895f7-b5f9-4840-96b3-f21944f12682\"}":{"__typename":"DeepDives","uuid":"0fa895f7-b5f9-4840-96b3-f21944f12682","content":"\u003cp\u003eI would tell my middle or high school self to be kinder to herself. Negative self-talk may seem small, but quietly shapes how you see your worth and abilities. You don’t become stronger by criticizing yourself, you grow by challenging yourself with compassion.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d also remind her to fully experience each moment instead of constantly rushing to the next milestone. So much of life happens in the in-between friendships and small wins.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I’d encourage her to build close relationships with mentors. Ask questions, seek guidance, and let people support you. You don’t have to navigate everything alone, and the right mentors can help you see your potential more clearly.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"fa34c098-bb78-4c24-87dc-2696f1ca28ca\"}":{"__typename":"School","uuid":"fa34c098-bb78-4c24-87dc-2696f1ca28ca","name":"African Leadership Academy","city":"Roodepoort","type":"HIGH","state":"Gauteng","country":"South Africa","zip":"2040"},"Education:{\"uuid\":\"4399bd92-b1fb-461e-bf20-9942f6a2fbd8\"}":{"__typename":"Education","uuid":"4399bd92-b1fb-461e-bf20-9942f6a2fbd8","school":{"__ref":"School:{\"uuid\":\"fa34c098-bb78-4c24-87dc-2696f1ca28ca\"}"},"startYear":"2021","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b489689c-0735-4110-b8cc-73974f5ff471\"}":{"__typename":"Education","uuid":"b489689c-0735-4110-b8cc-73974f5ff471","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"History of Science, Medicine and Public Health","degree":null},"MentorPublicProfile:{\"uuid\":\"fc9a21cb-a554-43f6-8e57-58b8d1715f4b\"}":{"__typename":"MentorPublicProfile","uuid":"fc9a21cb-a554-43f6-8e57-58b8d1715f4b","displayName":"Bintou L.","slug":"bintou-leigh","biography":"\u003cp\u003e\u003cstrong\u003eBintou, Biomedical Research \u0026amp; Storytelling (Academic Mentorship + Passion Project)\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eHi! I’m Bintou Leigh, a junior at Yale University on the pre-med track, majoring in the History of Science, Medicine, and Public Health. I help students turn big interests in science, health, and storytelling through content creation into projects they’re genuinely proud of.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eA bit about me:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI grew up across seven countries, mostly on the African continent, which shaped me into a global citizen and sparked my curiosity about how culture, science, and healthcare intersect. Along the way, I picked up French, Arabic, and Wolof (and I’m currently learning Spanish).\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy journey in research started in high school with a summer internship at the Edward Francis Small Teaching Hospital in The Gambia, where I wrote a paper on inadequate government funding in healthcare and proposed improvements to post-operative care, some of which were implemented within the month. Later, I studied public healthcare systems in Krakow, Poland, working in a hospital and interviewing surgeons about practicing medicine in a post-communist system. Today, I work in a lab at the Yale School of Medicine, modeling 3D nuclei using Dragonfly software. These experiences taught me not just how research works, but how to ask good questions, communicate clearly, and turn ideas into real-world impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eIn September 2025, I also started a passion project in content creation and UGC (user-generated content) after noticing how much opportunities now depend on building a digital presence. What began as an experiment quickly turned into real-world experience in digital marketing, video editing, storytelling, and audience building, and I’ve since used these skills to generate income and collaborate with brands. Content creation taught me how to move from being a passive consumer of social media to a strategic creator, and I now mentor students who want to build their own UGC portfolios, grow an audience, or use content creation to support future academic and professional goals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI mentor students who want to explore:\u003cbr\u003e• \u003cstrong\u003eBiomedical and public health research\u003c/strong\u003e (from shaping a research question to writing clearly about results)\u003cbr\u003e\u003cbr\u003e• \u003cstrong\u003eScientific and academic writing\u003c/strong\u003e (essays, research papers, proposals, and presentations)\u003cbr\u003e\u003cbr\u003e• \u003cstrong\u003ePassion projects in science or health\u003c/strong\u003e (turning “I’m interested in medicine” into something concrete)\u003cbr\u003e\u003cbr\u003e• \u003cstrong\u003eContent creation and digital storytelling\u003c/strong\u003e (using video, writing, or social media to share ideas that matter)\u003cbr\u003e\u003cbr\u003eI also help students build the skills that make projects actually succeed: planning, confidence, clear communication, and learning how to talk about their work with pride.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help you:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy first mentorship experience was in Diepsloot, South Africa, where I worked one-on-one with a middle school student on both academic goals and personal growth. That experience shaped my approach to mentoring: I focus on the whole student, not just grades or test scores. Since coming to Yale, I’ve continued this work through my involvement on the student executive committee at Dwight Hall, a nonprofit that leads weekly youth engagement initiatives in New Haven. Through Dwight Hall, I’ve partnered with The Cedarhurst School to provide therapeutic educational support to middle school students, helping them build confidence, structure, and a stronger relationship with learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eA typical session with me might involve:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e• Turning a broad interest (“I like medicine” or “I like science”) into a focused, doable project\u003cbr\u003e\u003cbr\u003e• Mapping out a clear step-by-step plan with milestones\u003cbr\u003e\u003cbr\u003e• Improving your writing, presentations, or research idea so it feels confident and compelling\u003cbr\u003e\u003cbr\u003e• Building both academic skills and self-belief along the way\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eOutside of school\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eOutside of Yale, I love fitness, films, and traveling. I’m a huge fan of storytelling in all forms, whether that’s research writing or video editing. I started content creation in 2025 and turned it into a small digital marketing income stream. And yes, I will always say yes to hot chocolate, no matter the weather.\u003c/p\u003e","teachingVideoPlaybackId":"Bpi2Etkhpqiw7b5yWR2002ZeKoOEZrhTLySnJY84JZGE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eFounding a small non-profit initiative in The Gambia to deliver styled clothing packs to underprivileged children was one of the most formative experiences of my life. What began as a simple observation, that many children had access to clothing, but not clothing that made them feel confident, coordinated, or proud, became a structured community effort grounded in dignity and collaboration.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0b612c3d-17b0-4934-92c1-cf0b7ae3a0f7\"}"},{"__ref":"Favorites:{\"uuid\":\"b3ccf771-7c4f-4264-b4bf-c8176b9628ee\"}"},{"__ref":"Favorites:{\"uuid\":\"475ceb71-bfad-4e1f-94b4-4fd3c66b43e8\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b06df8af-ce38-4a9f-9f6d-e83a9bafb379\"}"}],"major":"History of Science, Medicine and Public Health","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"410f8861-3902-4f9b-87da-0844b8c43718\"}"},{"__ref":"DeepDives:{\"uuid\":\"c77d2ffa-d5ca-4ebc-8eb8-37876dec260a\"}"},{"__ref":"DeepDives:{\"uuid\":\"f6ed03d8-d384-476c-ba37-6b1cf3ed07aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"0fa895f7-b5f9-4840-96b3-f21944f12682\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1151d794-f302-4eb4-927c-8950e3576b38/-/preview/-/format/jpg/","https://ucarecdn.com/682e6d39-7c4a-4a43-ae2e-2c7a9ba27f57/-/preview/-/format/jpg/","https://ucarecdn.com/fae26840-937e-4dc0-a9bc-5d5608672714/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4399bd92-b1fb-461e-bf20-9942f6a2fbd8\"}"},{"__ref":"Education:{\"uuid\":\"b489689c-0735-4110-b8cc-73974f5ff471\"}"}],"hiredAt":"2026-02-01T07:45:53.604Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Chemistry","Biology","Writing","French","College Essay Writing","Reading","Academic Coaching","History","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Business / Entrepreneurship","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"bintou-leigh\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fc9a21cb-a554-43f6-8e57-58b8d1715f4b\"}"}}},"_sentryTraceData":"341697ad7d4a4ee89a0e0eac3fc18f12-840d7072c680150d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529c
