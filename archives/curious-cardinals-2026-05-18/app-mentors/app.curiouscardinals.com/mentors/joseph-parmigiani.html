xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"177ed8f3-25a5-4a8f-a076-afe9f962ee38\"}":{"__typename":"Favorites","uuid":"177ed8f3-25a5-4a8f-a076-afe9f962ee38","photoUrl":"https://ucarecdn.com/0710ecf1-e791-4c91-87bc-7f442c8c7778/","title":"Rihanna","type":"ARTIST"},"Favorites:{\"uuid\":\"409ba351-a1d9-4f87-a7fc-3c38ab463f60\"}":{"__typename":"Favorites","uuid":"409ba351-a1d9-4f87-a7fc-3c38ab463f60","photoUrl":"https://ucarecdn.com/c7a55b90-ca5c-49ff-a177-1c64d31fcd5a/","title":"New York City ","type":"CITY"},"Favorites:{\"uuid\":\"8249c4f8-5de0-4794-9485-1213b608ca95\"}":{"__typename":"Favorites","uuid":"8249c4f8-5de0-4794-9485-1213b608ca95","photoUrl":"https://ucarecdn.com/79c466c8-d754-48ab-911b-407437e74e46/","title":"Portland Trail Blazers","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"fbbd6585-3645-49e6-a1a2-a1c2218406e7\"}":{"__typename":"CausesSupported","uuid":"fbbd6585-3645-49e6-a1a2-a1c2218406e7","name":"Alliance for Sustainability","description":"\u003cp\u003eI advocate for sustainability, health, equity, and kindness (S.H.E. Kindness).\u003c/p\u003e","photoUrl":"https://ucarecdn.com/a483dc52-520e-4fc8-ae14-8922254a7f85/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"44b7e94f-438d-4400-9a60-02ef5a44845e\"}":{"__typename":"DeepDives","uuid":"44b7e94f-438d-4400-9a60-02ef5a44845e","content":"\u003cp\u003eTake the leap! Whether it's a challenging class, an athletic opportunity, a cold email to a professor, or an exciting job opportunity, go for it! Your ideas are valuable and you deserve to push towards achieving goals. You will never regret not taking a step forward. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd if you need it, ask for help! Everyone around you- parents, teachers, friends- they all want to help you succeed! In high school especially, I was so worried about burdening other people with my \"problems\" that I so often was unable to progress forward. It's not a sign of weakness to ask for help from someone, it is a sign of strength. \u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9b3d1108-ff82-41e7-aba3-05b0fe617701\"}":{"__typename":"DeepDives","uuid":"9b3d1108-ff82-41e7-aba3-05b0fe617701","content":"\u003cp\u003eThe summer after my freshman year of high school, I mainly focused on having fun with my friends! I went on an unforgettable camping trip in June. I also volunteered with my local food bank, and began thinking about a potential environmental science fair project. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe summer after my sophomore year of high school, I was hyper-fixated on getting a job. It took until early August, but I got a job at a restaurant, and I ended up working there through my entire junior and senior years, all the way until I left for college (over two years later). Outside of work, I spent time with my friends and intensified my training for my upcoming cross-country season. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter my junior year of high school, I was much more focused on building my college list and starting applications. I kept an extremely open mind, aiming to research one college per day (while this seems daunting, it only takes a few minutes!) I organized the information I had found, and had a robust college list and began to work on application essays by the end of the summer. I also kept working at the restaurant and training for cross country. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, I wanted to spend the summer celebrating my achievements in high school, relaxing, and getting ready for college. The summer after graduation is truly a special time, and I have so many unforgettable memories with my now-called \"home friends.\" I also kept working, and made sure I was on-time with my pre-arrival tasks (which are important to do the summer before college!)\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4fcc3047-51e6-4d10-96fd-ca9fbb30a245\"}":{"__typename":"DeepDives","uuid":"4fcc3047-51e6-4d10-96fd-ca9fbb30a245","content":"\u003cp\u003eI'm so grateful for what my mentors- parents, teachers, professors, and friends- have taught me, and I continue to learn from them every day. It's both empowering and important for me to give back these skills to others as a mentor. I want to give my mentees the tools I have, and see them flourish! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7c30c094-b887-48a6-9f15-19f574af1a04\"}":{"__typename":"DeepDives","uuid":"7c30c094-b887-48a6-9f15-19f574af1a04","content":"\u003cp\u003eI have always been so curious about the world around me. One of my favorite pastimes as a young kid (and still something I love now) is aimlessly staring out the window on a long drive. The outdoor landscape and horizon are so enchanting, and I want to learn as much as I can about them. I also love organizing and visualizing information in a beautifully succinct way. Studying Earth Sciences with a minor in Statistics allows me to further these youthful passions. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm also considering a minor in Italian. I'm an Italian citizen, and I have lots of family members in Italy. It's a big part of my identity, and I want to learn more about the Italian language and culture. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"48626807-8d0b-43fe-a1d4-a0cb6038904d\"}":{"__typename":"School","uuid":"48626807-8d0b-43fe-a1d4-a0cb6038904d","name":"Corvallis High School","city":"Corvallis","type":"HIGH","state":"Oregon","country":"United States","zip":"97330"},"Education:{\"uuid\":\"b184aa52-4022-426b-b026-13aa6cb2a3a2\"}":{"__typename":"Education","uuid":"b184aa52-4022-426b-b026-13aa6cb2a3a2","school":{"__ref":"School:{\"uuid\":\"48626807-8d0b-43fe-a1d4-a0cb6038904d\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"aff6c456-b18e-4e33-af73-4d2296ef6c92\"}":{"__typename":"Education","uuid":"aff6c456-b18e-4e33-af73-4d2296ef6c92","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Earth Sciences ","degree":null},"MentorPublicProfile:{\"uuid\":\"4c986716-0095-4023-a087-0bffaae4cf5b\"}":{"__typename":"MentorPublicProfile","uuid":"4c986716-0095-4023-a087-0bffaae4cf5b","displayName":"Joseph P.","slug":"joseph-parmigiani","biography":"\u003cp\u003eHello! My name is Joe Parmigiani, and I'm an incoming sophomore at Dartmouth College studying Earth Sciences with a minor in Statistics! I'm fascinated by weather and climate, and how data analysis and visualization can be applied to science. I'm very detail-oriented and work well with numbers. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDartmouth is an amazing place to pursue external hobbies and experiences outside of classes. The beauty here is truly unmatched, and I love spending time outdoors here. I'm a part of the Triathlon Team here and I taught snowboarding lessons this past winter! I also had the opportunity to work as a consultant this past spring with a local nonprofit organization that manages trails in the area, and it was amazing to give back to such a beautiful community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm also a trumpet player and I perform with the Dartmouth College Wind Ensemble. I love the beauty of classical music, and our Mexican Initiative Repertoire is truly incredible to be a part of.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love sports and sports writing, especially college football, college basketball, and the NBA. In the fall, during college football season, I organized a weekly ranking of teams with ballots from other Dartmouth students as part of the Sports Analytics club here!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor the past six months, I've been a remote intern for a nonprofit organization based in Minneapolis, Minnesota. The organization fights for sustainability through outreach and policy programs as well as a sustainability-focused curriculum for K-12 schools. I've learned the ins and outs of how nonprofits function, written grant proposals (including one for the Minnesota State Legislature for up to $300,000), and had the opportunity to write feature pieces for the newsletter. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've learned so much from just one year at Dartmouth, and I am excited to help you master your craft, whatever that may be!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"aCplFjJmek01bYE5K4wXY2xnK1Re2vT02xGQqeDdLS0268","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was a Team Project Finalist at the International Science and Engineering Fair in 2022, during my sophomore year of high school! Alongside my sister and best friend, we designed a novel air quality monitoring device for community-scale testing, and used it to test income-based air pollution disparities in cities across our home state of Oregon. While the networking opportunities and the free trip to Atlanta, Georgia were unforgettable, what I'm most proud of is my role as a team member. Our team often dealt with conflicts, but we all shared the same passion and goals to push towards success. I try to approach group projects now with the same zeal I had back then. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"177ed8f3-25a5-4a8f-a076-afe9f962ee38\"}"},{"__ref":"Favorites:{\"uuid\":\"409ba351-a1d9-4f87-a7fc-3c38ab463f60\"}"},{"__ref":"Favorites:{\"uuid\":\"8249c4f8-5de0-4794-9485-1213b608ca95\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"fbbd6585-3645-49e6-a1a2-a1c2218406e7\"}"}],"major":"Earth Sciences ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"44b7e94f-438d-4400-9a60-02ef5a44845e\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b3d1108-ff82-41e7-aba3-05b0fe617701\"}"},{"__ref":"DeepDives:{\"uuid\":\"4fcc3047-51e6-4d10-96fd-ca9fbb30a245\"}"},{"__ref":"DeepDives:{\"uuid\":\"7c30c094-b887-48a6-9f15-19f574af1a04\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5284855c-5435-49ee-941a-e69d29ce827b/-/preview/-/format/jpg/","https://ucarecdn.com/a1330e57-680c-49ac-9f38-d8f27ac28b73/-/preview/-/format/jpg/","https://ucarecdn.com/59f655a7-220c-4e65-aca4-30d079b911b6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b184aa52-4022-426b-b026-13aa6cb2a3a2\"}"},{"__ref":"Educati
