xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b44407d9-3d77-4e75-943f-0c4d546af0b9\"}":{"__typename":"Favorites","uuid":"b44407d9-3d77-4e75-943f-0c4d546af0b9","photoUrl":"https://ucarecdn.com/2d0b3b04-c221-4b64-a78d-ee842dff05dd/","title":"SR3MM by Rae Sremmurd","type":"ALBUM"},"Favorites:{\"uuid\":\"e31b9e56-0d96-4100-8735-f9318f6d4ec3\"}":{"__typename":"Favorites","uuid":"e31b9e56-0d96-4100-8735-f9318f6d4ec3","photoUrl":"https://ucarecdn.com/e70986fa-b834-4172-ae92-389d841b62d1/","title":"Victor Wembanyama","type":"ATHLETE"},"Favorites:{\"uuid\":\"2c3b8860-dbba-4782-829d-551982802ae8\"}":{"__typename":"Favorites","uuid":"2c3b8860-dbba-4782-829d-551982802ae8","photoUrl":"https://ucarecdn.com/548c30d1-b84d-4a95-8d7c-d1042e7a8b86/","title":"The Hitchhiker's Guide to the Galaxy","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ca40b56e-55ad-4a58-805f-b3f5ed4fcec3\"}":{"__typename":"DeepDives","uuid":"ca40b56e-55ad-4a58-805f-b3f5ed4fcec3","content":"\u003cp\u003eI have always loved creating and building, and Engineering always stood out to me as the best discipline for that. I am studying Electrical Engineering because of my interests in technology at a fundamental level. I also chose to do a Robotics masters because it combines my background in mechanical, electrical, and software design into an application area that I am very excited about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"b31f95f2-ecae-4bdc-b7e2-85c5465e626f\"}":{"__typename":"DeepDives","uuid":"b31f95f2-ecae-4bdc-b7e2-85c5465e626f","content":"\u003cp\u003eSomething I am extremely proud of is my work with the Penn Aerial Robotics club. This past year I was the lead of the fuselage team for our 15 foot wingspan (and nearly 10 feet long) plane that competed in the SAE Aerospace competition. Our plane is able to carry double it's own weight in payload and placed second among US universities and ninth internationally. I am proud of all the work that my team and I put in over the past year in designing, manufacturing, and perfecting this plane.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"360d5df6-e47e-4d74-9387-5000da8cdb7e\"}":{"__typename":"DeepDives","uuid":"360d5df6-e47e-4d74-9387-5000da8cdb7e","content":"\u003cp\u003eI worked at several Lego robotics camps in the Bay Area in high school, helping create curriculums and teach elementary and middle school aged students basic ideas in robotics and design. I found it to be an extremely rewarding job as I could share my passion for technology and engineering with younger kids and help guide them in exploring their interests in STEM.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"57ffe396-d301-4e4d-bb82-ba4281178f67\"}":{"__typename":"DeepDives","uuid":"57ffe396-d301-4e4d-bb82-ba4281178f67","content":"\u003cp\u003eMy dream job would be creating products that improve the world, which could be in the variety of areas I am interested in. I would love to work in creating the computers of the future in chip design. I would also be excited about getting a little more hands on with hardware in embedded systems, or with mechanical systems in a robotics field.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"0bfda57b-830f-484c-84b4-2b5aedf9b4bf\"}":{"__typename":"School","uuid":"0bfda57b-830f-484c-84b4-2b5aedf9b4bf","name":"Dougherty Valley High School","city":"San Ramon","type":"HIGH","state":"California","country":"United States","zip":"94582"},"Education:{\"uuid\":\"86f9eac1-062a-4139-a55b-10a2265c8926\"}":{"__typename":"Education","uuid":"86f9eac1-062a-4139-a55b-10a2265c8926","school":{"__ref":"School:{\"uuid\":\"0bfda57b-830f-484c-84b4-2b5aedf9b4bf\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"5079866a-000f-4ae8-b425-940406fe3c33\"}":{"__typename":"Education","uuid":"5079866a-000f-4ae8-b425-940406fe3c33","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Electrical Engineering / Robotics","degree":null},"MentorPublicProfile:{\"uuid\":\"23d8e3d3-7df1-4d08-93bb-8a105af7a265\"}":{"__typename":"MentorPublicProfile","uuid":"23d8e3d3-7df1-4d08-93bb-8a105af7a265","displayName":"Ayan B.","slug":"ayan-bhatia","biography":"\u003cp\u003eHi! I'm Ayan (he/him) and I'm studying Electrical Engineering (undergraduate) and Robotics (masters) at the University of Pennsylvania. I grew up in the California Bay Area (San Ramon) and went to Dougherty Valley High School. I always like to keep myself busy, and in high school that could mean anything from leading my high school’s math club to becoming an Eagle scout with my Boy Scout troop. I would say leadership and mentorship are some of my biggest strengths.\u003c/p\u003e\u003cp\u003eI have a variety of experience with teaching and tutoring. In high school I volunteered tutored for AP courses in math, physics, and computer science during the school year. In the summer I taught kids at Lego robotics summer camps, leading instruction and developing curriculums for elementary and middle school aged children. I currently also provide college application guidance and essay editing for current high school seniors, and my students got into schools / programs like Vanderbilt, Carnegie Mellon, Rice, Georgia Tech CS, and Berkeley MET this past cycle. I always find teaching super rewarding as I want to help the next generation succeed and support my community.\u003c/p\u003e\u003cp\u003eIn college on the weekends, I work on engineering build projects ranging from 15 foot wingspan airplanes to compete in intercollegiate events to creating disability adapted products for Philadelphia children. I also work in a device engineering lab at Penn where I research memory operation at high temperatures (up to 1000 degrees Celsius!). In my free time I enjoy playing intramural basketball, exploring Philadelphia restaurants, and going to concerts. I'm excited to work with Curious Cardinals.\u003c/p\u003e","teachingVideoPlaybackId":"6dSX8kSkvUrPTtKWiC4LXNrZvXx01MPuR2n3rXY1OPSQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b44407d9-3d77-4e75-943f-0c4d546af0b9\"}"},{"__ref":"Favorites:{\"uuid\":\"e31b9e56-0d96-4100-8735-f9318f6d4ec3\"}"},{"__ref":"Favorites:{\"uuid\":\"2c3b8860-dbba-4782-829d-551982802ae8\"}"}],"causesS
