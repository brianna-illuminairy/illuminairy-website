xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"02878075-3595-4030-a383-9f3436859080\"}":{"__typename":"DeepDives","uuid":"02878075-3595-4030-a383-9f3436859080","content":"\u003cp\u003eI would tell myself to be fearless and try everything! This is such an amazing stage of life to learn about yourself and things that matter to you. As a middle school and high school student, I was very focused on academics and school sports. I would have told myself to take advantage of learning opportunities outside of the traditional classroom learning space. I would tell myself to embrace activities just for fun such as cooking and art projects. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d69edcd6-8f22-4f91-ab52-d2c72aff3474\"}":{"__typename":"DeepDives","uuid":"d69edcd6-8f22-4f91-ab52-d2c72aff3474","content":"\u003cp\u003eMentorship is an opportunity to develop a lifelong connection with someone as a role model, resource, and leader. In every stage of life, we have questions and worries connected to this transition period. Mentors provide us with an outlet to ask questions and feel supported as we explore our future paths. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"130c3120-24ba-4afc-86bf-f8515d4dc11d\"}":{"__typename":"DeepDives","uuid":"130c3120-24ba-4afc-86bf-f8515d4dc11d","content":"\u003cp\u003eDuring the summer of my junior year at Stanford University, I worked for the Farmlink Project. The nonprofit is dedicated to providing relief for food insecurity and reducing food waste. I am passionate about sustainability and the food space. At the organization, I designed and compiled a cookbook to showcase recipes from the Farmlink community and famous chefs who focus on food sustainability. Excerpts and prints from the cookbook were shared at the Gates Awards Ceremony. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c2304790-f1fc-4a47-8127-27f364adddb8\"}":{"__typename":"DeepDives","uuid":"c2304790-f1fc-4a47-8127-27f364adddb8","content":"\u003cp\u003eI am very interested in the food industry and enjoy spending my spare time cooking and baking. Since moving to New York, I have begun creating made-to-order cakes. I develop my own recipes and create artistically decorated cakes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"5e1bc47c-86d3-438a-a881-fa31ea8c1847\"}":{"__typename":"School","uuid":"5e1bc47c-86d3-438a-a881-fa31ea8c1847","name":"St. Andrew's Episcopal School","city":"Austin","type":"HIGH","state":"Texas","country":"United States","zip":"78735"},"Education:{\"uuid\":\"41524990-0ba5-4512-8c48-0597437b32db\"}":{"__typename":"Education","uuid":"41524990-0ba5-4512-8c48-0597437b32db","school":{"__ref":"School:{\"uuid\":\"5e1bc47c-86d3-438a-a881-fa31ea8c1847\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a9167302-3642-42e3-8015-d11159f6d99a\"}":{"__typename":"Education","uuid":"a9167302-3642-42e3-8015-d11159f6d99a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Science, Technology, and Society","degree":null},"MentorPublicProfile:{\"uuid\":\"801c177d-9bca-4b51-9a88-9ca179916ba0\"}":{"__typename":"MentorPublicProfile","uuid":"801c177d-9bca-4b51-9a88-9ca179916ba0","displayName":"Natalie H.","slug":"natalie-hojel","biography":"\u003cp\u003eHi, I'm Natalie! I am originally from Mexico City and grew up between Mexico City and Austin, Texas. Both bilingual and bicultural, I recognize that there are multiple ways to view circumstances and serve as a problem solver. My background has driven my curiosity to understand different people, perspectives, and cultures. This interest drives my approach when working with new students!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI studied at Stanford University, specializing in product design, entrepreneurship, and art history.  I chose my major because I wish to know both why and how objects and ideas are formed and how they can best be designed for a positive customer experience. I honed my skills in using design thinking as a tool for innovation and problem-solving through Stanford d.school courses. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, I moved to New York City and worked at a product design consulting firm on the strategy team. I am now working at Farfetch as a Farfetch Platform Solutions product manager. Through these positions, I leverage my strengths in communication, interpersonal relationships, and understanding individuals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I care about understanding each individual student's needs and interests. I believe that immersion and engagement are key to creating effective learning environments. I am excited to create lessons and course structures designed for each student I work with!\u003c/p\u003e","teachingVideoPlaybackId":"kV41bmQmP00HtLKUw02WrX01ozL3aPdBH6oL02O7fzqFbVg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Science, Technology, and Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"02878075-3595-4030-a383-9f3436859080\"}"},{"__ref":"DeepDives:{\"uuid\":\"d69edcd6-8f22-4f91-ab52-d2c72aff3474\"}"},{"__ref":"DeepDives:{\"uuid\":\"130c3120-24ba-4afc-86bf-f8515d4dc11d\"}"},{"__ref":"DeepDives:{\"uuid\":\"c2304790-f1fc-4a47-8127-27f364adddb8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a260bd42-2485-425d-abca-ddd6604dd3d3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"41524990-0ba5-4512-8c48-0597437b32db\"}"},{"__ref":"Education:{\"uuid\":\"a9167302-3642-42e3-8015-d11159f6d99a\"}"}],"hiredAt":"2024-01-19T18:26:55.696Z","topics":["Business / Entrepreneurship","History Project","Visual Arts / Graphic Design","Literature","Cooking","Fashion / Cosmetics","Writing","College Essay Writing","Academic Coaching","Executive Function","History","Reading","French","Spanish","Sustainability","Product Design","Video / Photography","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"natalie-hojel\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"801c177d-9bca-4b51-9a88-9
