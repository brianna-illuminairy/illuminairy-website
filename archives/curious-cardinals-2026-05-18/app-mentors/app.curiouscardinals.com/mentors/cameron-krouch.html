61772f1d\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"8c1ba949-f132-4b57-94a5-ab5944abac57\"}":{"__typename":"Education","uuid":"8c1ba949-f132-4b57-94a5-ab5944abac57","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science","degree":"B.S."},"School:{\"uuid\":\"e3b780ac-8985-4df0-80e8-a04d0764a7b9\"}":{"__typename":"School","uuid":"e3b780ac-8985-4df0-80e8-a04d0764a7b9","name":"George Ranch High School","city":"Richmond","type":"HIGH","state":"Texas","country":"United States","zip":"77469"},"Education:{\"uuid\":\"9b680a90-6bf1-43f4-9cc1-4df8d87c3ab8\"}":{"__typename":"Education","uuid":"9b680a90-6bf1-43f4-9cc1-4df8d87c3ab8","school":{"__ref":"School:{\"uuid\":\"e3b780ac-8985-4df0-80e8-a04d0764a7b9\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"7f29e3f2-dc92-4e86-86c1-740043e8bbce\"}":{"__typename":"MentorPublicProfile","uuid":"7f29e3f2-dc92-4e86-86c1-740043e8bbce","displayName":"Cameron K.","slug":"cameron-krouch","biography":"\u003cp\u003eCameron is a rising junior at Stanford University, where he majors in Computer Science and minors in Theatre \u0026amp; Performance Studies (which he likes to call acting). He grew up in Sugar Land, Texas, which is a suburb of Houston. In 2021, he graduated from George Ranch High School, where he founded two clubs, the Junior State of America club, and the English National Honor Society. In high school, he was an active participant in community and school theatre and won numerous awards at the Texas Thespians Festival and Junior Theatre Festival. He has always had a passion for teaching and giving back to his community and has spent many of his summers working for a summer camp in North Houston and teaching musical theatre summer camps back home. His love for the intertwining of artistry and engineering stems from his first visit to Disney World as a kid. \u003cbr\u003e\u003cbr\u003eIn college, Cameron has continued to foster his love for both acting and computer science. Though he mainly studies computer science, his main extra-curricular involvement has been with theatre. He has acted in productions such as Julius Caesar and Sweeney Todd since going to Stanford and has a particular interest in American Family Dramas such as Long Day's Journey Into Night by Eugene O'Neill. His favorite musical, though, is Hadestown. Cameron is also a first-generation college student and has a particular interest in encouraging other students with similar backgrounds to pursue what their hearts desire. Outside of his main academic interests, he is also interested in American politics and has taken a few classes around citizenship and the American political system at Stanford.\u003cbr\u003e\u003cbr\u003eIn his free time, Cameron enjoys listening to alt/indie pop music, drinking black coffee, watching the Houston Astros, and reviewing various ice creams. He is also a huge fan of college sports and is on the Stanford Axe Committee (Stanford's Football interest group). \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThe summer going into my junior year of high school, I placed 9th in the animatronics event at the Technology Student Association Nationals in Washington, D.C! I'm also very proud of being a first-generation student at Stanford and try not to take a single day there for granted. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e45d3bac-870d-4bad-814f-aa72ad79e9a9\"}"},{"__ref":"Favorites:{\"uuid\":\"15c63ad1-ecc3-41fd-8d2a-fe0a9bd330ea\"}"},{"__ref":"Favorites:{\"uuid\":\"7aa78c46-570d-4883-b22a-ac3d090a
