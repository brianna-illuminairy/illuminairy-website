xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ac42d2f1-e59b-42b2-b682-e5fb7287d512\"}":{"__typename":"Favorites","uuid":"ac42d2f1-e59b-42b2-b682-e5fb7287d512","photoUrl":"https://ucarecdn.com/aacd5fcf-6040-42b5-a3b1-6f8456a220c1/","title":"Stick Season - Noah Kahan","type":"ALBUM"},"Favorites:{\"uuid\":\"adf065a4-2015-4759-ab89-6cf5b5094a0f\"}":{"__typename":"Favorites","uuid":"adf065a4-2015-4759-ab89-6cf5b5094a0f","photoUrl":"https://ucarecdn.com/56ef73c7-a74c-4b83-9124-5d0bfd6a0356/","title":"Los Angeles!","type":"CITY"},"Favorites:{\"uuid\":\"ac4b2d38-9245-4c49-9c18-ea939eb1d508\"}":{"__typename":"Favorites","uuid":"ac4b2d38-9245-4c49-9c18-ea939eb1d508","photoUrl":"https://ucarecdn.com/e2b35dc0-e9e9-4424-8161-316ee06cb236/","title":"Taylor Swift","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"08cce6d4-5437-478b-a3b5-0cf463bff2b6\"}":{"__typename":"DeepDives","uuid":"08cce6d4-5437-478b-a3b5-0cf463bff2b6","content":"\u003cp\u003eIn high school, the subjects I was most interested in were science and math. Because of these interests, it felt natural to go into engineering, especially since I loved the technical problem-solving side of the field. At the same time, I was fascinated by biology and learning about how the body works and functions. These combined interests, along with my goal of helping people going through difficult diseases or injuries, led me to Biomedical Engineering, and it has been the perfect major for me. One thing I’ve loved about Biomedical Engineering is how broad the field is. When I first joined the major, I wasn’t exactly sure what I wanted to do, and the variety gave me room to explore. Now, with more experience, I know I want to focus on sensor design and biochemical and biological assay development.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"788b4536-fcec-449c-abdb-50304a6151f6\"}":{"__typename":"DeepDives","uuid":"788b4536-fcec-449c-abdb-50304a6151f6","content":"\u003cp\u003eI spent my summers in high school participating in college prep programs, which were both fun and engaging while giving me an early glimpse of what college might be like! Through them, I got a sense of how professors teach, what homework could look like, and what it feels like to live in a dorm. Beyond academics, I made incredible memories and formed lifelong friendships with people I still make a point to see throughout the year!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"23298ded-65ad-4a39-b684-886ec22c9455\"}":{"__typename":"DeepDives","uuid":"23298ded-65ad-4a39-b684-886ec22c9455","content":"\u003cp\u003eI’m big on self-improvement, so I spend a lot of my free time working out, making healthy meals, and diving into books or podcasts that inspire me. I love trying out new tips and tricks and seeing how they fit into my routine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"04b981c4-ad68-4505-82ed-21ecb6372e79\"}":{"__typename":"DeepDives","uuid":"04b981c4-ad68-4505-82ed-21ecb6372e79","content":"\u003cp\u003eAs a high school student, I was super eager to be involved in everything. I joined multiple clubs, spent hours at dance every night, challenged myself with AP courses, and volunteered. At first, I struggled to manage my time while balancing so many commitments. It was not until college that I truly learned how to handle different responsibilities, and that skill has allowed me to thrive in the activities I am most passionate about today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"44bba81d-5ad5-4ed2-b164-03994ebdcf47\"}":{"__typename":"School","uuid":"44bba81d-5ad5-4ed2-b164-03994ebdcf47","name":"Viewpoint School","city":"Calabasas","type":"HIGH","state":"California","country":"United States","zip":"91302"},"Education:{\"uuid\":\"74e08182-6fdd-4e6f-a97e-08a6f5dc74a4\"}":{"__typename":"Education","uuid":"74e08182-6fdd-4e6f-a97e-08a6f5dc74a4","school":{"__ref":"School:{\"uuid\":\"44bba81d-5ad5-4ed2-b164-03994ebdcf47\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"d40cd91a-0364-4186-986d-3655baf76b84\"}":{"__typename":"Education","uuid":"d40cd91a-0364-4186-986d-3655baf76b84","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"f9349a2c-9843-4ab9-9962-44666815a16c\"}":{"__typename":"MentorPublicProfile","uuid":"f9349a2c-9843-4ab9-9962-44666815a16c","displayName":"Sarena W.","slug":"sarena-wapnick","biography":"\u003cp\u003eHi! I’m Sarena, and I recently completed my Master’s degree in Biomedical Engineering through a combined BS/MS program at Northwestern University. I graduated with my bachelor’s degree this past June and finished my master’s this December. I came into college as an undecided engineering major, knowing I liked science, math, and the principles of engineering, but not yet sure which area I was most passionate about. One quarter into my sophomore year, after some self-reflection, I realized that I wanted to pursue a field where I could truly make a difference. Biomedical Engineering immediately clicked for me because it combined my love of problem-solving with the chance to design technologies that could make a real difference in patients’ lives. As I learned more about the field, I was struck by how interdisciplinary it is, drawing on everything from biology to mechanics to electronics, which made me feel like there would always be room to grow and explore within it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo start applying that passion, I joined a Northwestern University lab working on wearable devices for point-of-care diagnostics. My very first project was a sweat-sensing device that monitored muscle tissue acidosis during exercise, which eventually led to me co-authoring a high-impact publication. Since then, I have been working on a device to track wound healing without contact, aimed at helping patients with chronic wounds. These projects taught me not only technical skills but also the importance of understanding the bigger picture of research rather than just focusing on isolated tasks. I also gained experience in biological research at USC’s Keck School of Medicine, where I worked on understanding changes in protein expression that occur with retinal degeneration. These experiences have solidified my interest in pursuing a PhD in Biomedical Engineering, which I will begin at USC this fall, focusing on drug delivery and nanomedicine platforms.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the lab, my biggest passion has always been dance. I grew up as a competitive dancer, traveling to conventions and competitions almost every month. Dance gave me discipline, an eye for detail, and a community I still feel so connected to. Even now, dance continues to be a huge part of my life. During my six-month gap between completing my master’s and starting my PhD, I am pursuing dance professionally in Los Angeles, taking classes, performing, and continuing to grow as an artist. Beyond the technique, dance has been a creative outlet and a source of resilience for me, teaching me how to express myself, work through challenges, and carry that energy into other parts of my life. For me, dance and engineering are more connected than they might seem. Both let me combine creativity with precision, whether it is experimenting with choreography or designing a new device.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am deeply passionate about sharing what I love with others. Teaching younger dancers has been one of my favorite experiences, and watching their faces light up when they finally master a move is incredibly rewarding. I hope to bring that same energy to mentoring, helping students discover their own passions and pursue them with confidence.\u003c/p\u003e","teachingVideoPlaybackId":"z4eU11V6b00Oq6L7tHVQVPuSALyVtHBDFcINknWTi1BQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing a co-author on a wearable device research article published in Science Translational Medicine!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ac42d2f1-e59b-42b2-b682-e5fb7287d512\"}"},{"__ref":"Favorites:{\"uuid\":\"adf065a4-2015-4759-ab89-6cf5b5094a0f\"}"},{"__ref":"Favorites:{\"uuid\":\"ac4b2d38-9245-4c49-9c18-ea939eb1d508\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"08cce6d4-5437-478b-a3b5-0cf463bff2b6\"}"},{"__ref":"DeepDives:{\"uuid\":\"788b4536-fcec-449c-abdb-50304a6151f6\"}"},{"__ref":"DeepDives:{\"uuid\":\"23298ded-65ad-4a39-b684-886ec22c9455\"}"},{"__ref":"DeepDives:{\"uuid\":\"04b981c4-ad68-4505-82ed-21ecb6372e79\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/90a61514-c542-418c-af7b-d648da81e19f/-/preview/-/format/jpg/","https://ucarecdn.com/59c989fa-15ce-4cc2-b571-da8ac6413c48/-/preview/-/format/jpg/","https://ucarecdn.com/7ea64f49-38d2-45c6-a1c2-a7d0a7bbeb4b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"74e08182-6fdd-4e6f-a97e-08a6f5dc74a4\"}"},{"__ref":"Education:{\"uuid\":\"d40cd91a-0364-4186-986d-3655baf76b84\"}"}],"hiredAt":"2025-09-06T15:29:49.039Z","topics":["Algebra I","Algebra II","Calculus","Geometry","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Physics","Executive Function","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sarena-wapnick\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f9349a2c-9843-4ab9-9962-44666815a16c\"}"}}},"_sentryTraceData":"ab583327c7014639af01e2e4ee04c3bd-81e7501cc7ea1ac9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ab583327c7014639af01e2e4ee04c3bd,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":
