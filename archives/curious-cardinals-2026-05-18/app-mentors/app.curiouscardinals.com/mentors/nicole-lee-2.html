xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7a9cd603-b751-4e66-b1e7-e2d1bd92960e\"}":{"__typename":"DeepDives","uuid":"7a9cd603-b751-4e66-b1e7-e2d1bd92960e","content":"\u003cp\u003eI would tell my middle or high school self that there is \u003cem\u003eso much to learn\u003c/em\u003e, and you don’t need to have everything figured out right away. Being curious, asking questions, and trying things you’re not immediately good at matters far more than getting it “right” the first time. Growth comes from exploring, not from having a perfect plan.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"62208105-7ce2-4539-abc8-d09fe0cf8b2a\"}":{"__typename":"DeepDives","uuid":"62208105-7ce2-4539-abc8-d09fe0cf8b2a","content":"\u003cp\u003eI didn’t always know I wanted to work in aerospace. I didn’t really have access to those kinds of classes or programs until college. I started by following what I enjoyed in engineering, and once I got to do hands-on projects, it clicked. The projects helped me realize aerospace was a perfect fit because it combined problem-solving, teamwork, and building things that feel meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"e6dcb0b7-a2b2-41a2-8ccb-d10973cb1c92\"}":{"__typename":"DeepDives","uuid":"e6dcb0b7-a2b2-41a2-8ccb-d10973cb1c92","content":"\u003cp\u003eSo many people invested their time and belief in me along the way, and those moments made a real difference. Mentorship is how I pay that forward, by helping students feel supported, capable, and excited about learning and growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"20a70d6a-0118-4d06-be52-39d5a0a30ff4\"}":{"__typename":"DeepDives","uuid":"20a70d6a-0118-4d06-be52-39d5a0a30ff4","content":"\u003cp\u003eI spent my summers volunteering by doing projects for my community. It was a way for me to learn, try new things, and feel useful before I really knew what direction I wanted to go in\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"a1aaea43-5200-44f7-a255-3f01763f2006\"}":{"__typename":"School","uuid":"a1aaea43-5200-44f7-a255-3f01763f2006","name":"University High School","city":"Tucson","type":"HIGH","state":"AZ","country":"USA","zip":"85745"},"Education:{\"uuid\":\"0b44bce2-602a-4494-806c-ab16b829ea00\"}":{"__typename":"Education","uuid":"0b44bce2-602a-4494-806c-ab16b829ea00","school":{"__ref":"School:{\"uuid\":\"a1aaea43-5200-44f7-a255-3f01763f2006\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}":{"__typename":"School","uuid":"11470c0e-6098-4972-92d0-60616358bd13","name":"California Institute of Technology","city":"Pasadena","type":"COLLEGE","state":"California","country":"United States","zip":"91125"},"Education:{\"uuid\":\"76523f5b-6232-4851-941d-718b8709802f\"}":{"__typename":"Education","uuid":"76523f5b-6232-4851-941d-718b8709802f","school":{"__ref":"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering + Business, Economics, and Managementng","degree":null},"MentorPublicProfile:{\"uuid\":\"34f5acb3-b4a7-45cc-94f7-d291d49fdffc\"}":{"__typename":"MentorPublicProfile","uuid":"34f5acb3-b4a7-45cc-94f7-d291d49fdffc","displayName":"Nicole L.","slug":"nicole-lee-2","biography":"\u003cp\u003e\u003cstrong\u003eNicole (Nic) Lee \u003c/strong\u003eis a graduate student at the Massachusetts Institute of Technology (MIT), where she is pursuing an S.M./Ph.D. in Aeronautics and Astronautics alongside MIT’s Technology \u0026amp; Policy Program. Her work sits at the intersection of human-centered engineering, spaceflight, and health, with a focus on how technology can better support people operating in extreme environments.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNicole’s primary research is in human systems engineering and space medicine. She works in MIT’s Human Systems Laboratory developing wearable countermeasure technologies for astronauts, an “electro-suit” designed to help mitigate muscle and cardiovascular deconditioning during long-duration space missions. Her interests span biomechanics, physiology, design, and policy, and she is especially excited by projects that blend engineering with real-world impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore MIT, Nicole earned her undergraduate degree at Caltech, where she double-majored in Mechanical Engineering and Business, Economics, and Management, with a minor in Aerospace. During that time, she was deeply involved in research, leadership, and community-building, including Engineers Without Borders, student government, and STEM outreach. She is also a Brooke Owens Fellow and has received multiple academic and leadership awards for her work and service.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the lab, Nicole spends much of her time mentoring, organizing, and building communities. She has worked with a range of educational and mentorship programs and cares deeply about making STEM more accessible and inclusive, particularly for students who may not initially see themselves represented in technical fields. She is passionate about closing gaps in aerospace and engineering and believes strongly in mentorship as a tool for confidence-building and self-discovery.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, Nicole aims to help students not only learn technical concepts, but also develop curiosity, critical thinking, and a sense of ownership over their ideas. She enjoys working with students on passion projects, research explorations, and creative problem-solving challenges, especially those related to space, engineering design, human health, or technology with social impact. She strives to meet students where they are, encourage big questions, and show that there is no single “right path” into STEM.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNicole hopes students come away from working with her feeling more confident, more curious, and more excited about exploring their interests, whether that leads them toward engineering, science, policy, or something entirely new.\u003c/p\u003e","teachingVideoPlaybackId":"s33whGHlsRrpjVRjmRI02nM4Y3700Guuww98YuxfVSQxM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering + Business, Economics, and Managementng","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7a9cd603-b751-4e66-b1e7-e2d1bd92960e\"}"},{"_
