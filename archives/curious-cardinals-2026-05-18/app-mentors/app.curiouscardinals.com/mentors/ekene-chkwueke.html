xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7aa78ff6-8f4c-4027-b99a-15af753f9eac\"}":{"__typename":"DeepDives","uuid":"7aa78ff6-8f4c-4027-b99a-15af753f9eac","content":"\u003cp\u003eIf I were to jump into a time machine and give my Middle School self a piece of advice to hold close to my heart, it would be to thrive for better and never look back. Back in middle school, I was often afraid to speak up in class and showcase who I was, unfortunately, it hindered a lot\u0026nbsp;of my growth as a student because my teachers didn't know how to help me as I was more worried\u0026nbsp;about being wrong instead\u0026nbsp;of trying\u0026nbsp;my very best to learn. With this advice, I'm sure my younger self in Middle school would flourish instead\u0026nbsp;of learning such a lesson much later.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1158dbff-4b99-4adc-af8a-b16ff86032b2\"}":{"__typename":"DeepDives","uuid":"1158dbff-4b99-4adc-af8a-b16ff86032b2","content":"\u003cp\u003e\u003cbr\u003eMentorship matters\u0026nbsp;to me because\u0026nbsp;it puts an individual in a position where they become responsible\u0026nbsp;or aim to enable the development of another. In this case, I as a mentor\u0026nbsp;would be responsible\u0026nbsp;for my mentee's\u0026nbsp;growth as a person and as a student and would oversee their development\u0026nbsp;with the time\u0026nbsp;I spend with them. My mentorship will provide them a vision to see beyond their capabilities\u0026nbsp;and know they also have the chance\u0026nbsp;to surpass\u0026nbsp;my accomplishments and achieve\u0026nbsp;their personal\u0026nbsp;goals as well as dreams.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"00306895-0456-493f-b8a0-fd75cc8dc6e4\"}":{"__typename":"DeepDives","uuid":"00306895-0456-493f-b8a0-fd75cc8dc6e4","content":"\u003cp\u003e\u003cbr\u003ePersonally, I hope to give back to my home country\u0026nbsp;Nigeria in a significant way. With the poor economy, social\u0026nbsp;injustice, and lack of educational resources, I aim to return and become\u0026nbsp;a public servant\u0026nbsp;for my people and help advocate for them to experience\u0026nbsp;a peaceful regime and lifestyle of comfort. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f6951186-cf31-4a08-a343-0bc05305b5ba\"}":{"__typename":"DeepDives","uuid":"f6951186-cf31-4a08-a343-0bc05305b5ba","content":"\u003cp\u003eI'm aiming to become president\u0026nbsp;of Nigeria later down\u0026nbsp;the line in the future, I believe\u0026nbsp;all my experiences\u0026nbsp;and living in the United\u0026nbsp;States\u0026nbsp;have taught me something meaningful to bring back to my motherland.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"fa6691b3-64eb-4de9-981d-1641f73b9566\"}":{"__typename":"School","uuid":"fa6691b3-64eb-4de9-981d-1641f73b9566","name":"E.L. Haynes Public Charter School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20011"},"Education:{\"uuid\":\"99c1bfd9-616e-4beb-8187-6a036d4bda11\"}":{"__typename":"Education","uuid":"99c1bfd9-616e-4beb-8187-6a036d4bda11","school":{"__ref":"School:{\"uuid\":\"fa6691b3-64eb-4de9-981d-1641f73b9566\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"5927008a-7947-4d87-afe6-67217e095f1c\"}":{"__typename":"Education","uuid":"5927008a-7947-4d87-afe6-67217e095f1c","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Sociology ","degree":null},"MentorPublicProfile:{\"uuid\":\"d62f6122-e394-4299-a878-d591bd55d7a1\"}":{"__typename":"MentorPublicProfile","uuid":"d62f6122-e394-4299-a878-d591bd55d7a1","displayName":"Ekene C.","slug":"ekene-chkwueke","biography":"\u003cp\u003eHi!\u003c/p\u003e\u003cp\u003eMy name is Ekene Chukwueke, but most people call me Ek because it's much easier. I was born in Nigeria and lived there for over eight years before coming to the United States. And ever since then, I've been and I still continue to adjust to the American culture!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eWhat matters most to me is my family, I honestly cannot do without them as they've pushed and supported me throughout so much of my struggles as a student and as a person, so I give them
