xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6f86801b-6d54-4d23-9ca2-d2ce5b61142d\"}":{"__typename":"DeepDives","uuid":"6f86801b-6d54-4d23-9ca2-d2ce5b61142d","content":"\u003cp\u003eI would tell my younger self to not get too focused on the day-to-day worries of middle and high school, but look forward to and work for my dreams and big aspirations in the future. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"629491a3-3524-42aa-9e64-0d6dcfebb2ed\"}":{"__typename":"DeepDives","uuid":"629491a3-3524-42aa-9e64-0d6dcfebb2ed","content":"\u003cp\u003eIf I do nothing but one thing in this world I hope to make a difference for the better. Whether that looks like giving a meal to someone in need, providing life-saving medical help, or just being a positive influence on the people that I surround myself with. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a05fcec1-921d-4d13-9797-05520712fd80\"}":{"__typename":"DeepDives","uuid":"a05fcec1-921d-4d13-9797-05520712fd80","content":"\u003cp\u003eI chose my major because I believe the medical field and being a Physicians Assistant in particular gives me a hands-on opportunity to help people in a way that has a lifelong impact. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"01d79bca-cac7-4961-a5ab-58548077abcc\"}":{"__typename":"DeepDives","uuid":"01d79bca-cac7-4961-a5ab-58548077abcc","content":"\u003cp\u003eI believe that mentorship has a special ability to engage and impact kids that are going through a period of life that truly will shape their lives, and to be a part of that is an honor and an opportunity to pass on what I have learned. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"4307002f-3aa8-4805-94cd-f22600beed35\"}":{"__typename":"School","uuid":"4307002f-3aa8-4805-94cd-f22600beed35","name":"Christian Heritage School","city":"Dalton","type":"HIGH","state":"Georgia","country":"United States","zip":"30721"},"Education:{\"uuid\":\"15612c35-8b64-4382-b397-7dcdfa4dce9e\"}":{"__typename":"Education","uuid":"15612c35-8b64-4382-b397-7dcdfa4dce9e","school":{"__ref":"School:{\"uuid\":\"4307002f-3aa8-4805-94cd-f22600beed35\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"8f9e5c64-ca83-4e0c-bb24-9a503ffc49ad\"}":{"__typename":"School","uuid":"8f9e5c64-ca83-4e0c-bb24-9a503ffc49ad","name":"Samford University","city":"Homewood","type":"COLLEGE","state":"Alabama","country":"United States","zip":"35229"},"Education:{\"uuid\":\"f18eadad-44b4-4f52-a8f3-6acb2e9c5826\"}":{"__typename":"Education","uuid":"f18eadad-44b4-4f52-a8f3-6ac
