}":{"__typename":"Education","uuid":"1b088898-844d-47fd-b476-ec6c248db361","school":{"__ref":"School:{\"uuid\":\"23c69c54-b7a4-425b-bf43-6ac52372fc1f\"}"},"startYear":"2015","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1160ddbe-fa36-4ca4-86f5-b1d341a94219\"}":{"__typename":"Education","uuid":"1160ddbe-fa36-4ca4-86f5-b1d341a94219","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"51e181a1-4744-4b15-a5c6-35aac4ad845f\"}":{"__typename":"MentorPublicProfile","uuid":"51e181a1-4744-4b15-a5c6-35aac4ad845f","displayName":"Gustavo T.","slug":"gustavo-toledo","biography":"\u003cp\u003eHi! I’m Gustavo, and I’m currently a Junior at Yale studying political science—though I currently find myself studying abroad for the semester at the University of Amsterdam in the Netherlands. I’m hoping to attend law school in the future!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI think my life background is a big reason that I find myself interested in politics and the law. I grew up queer and in a Puerto Rican and Cuban family in one of the most conservative parts of Florida, so I’ve always had a keen interest in the law and learning how it affects the communities around me.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile I was in high school, my love for politics and geography took the form of extracurriculars: I was student body president, co-captain of my school’s debate team, and was always eager to participate in model congress and UN activities. I’ve always had a passion for learning about the world around me: when I was little, I’d compete with myself to memorize as many countries, capitals, and flags as I could, and I still share the same enthusiasm today! My love for travel and experiencing different cultures started at a young age, and continues to be the driving force behind my decision to study abroad. \u003cbr\u003e\u003cbr\u003eWhile I’ve been at Yale, I’ve been able to more meaningfully engage with geopolitics and the law: I’ve taken classes on everything from Bioarchaeology to Comparative Immigration Policy, and being able to meaningfully research the topics I’m interested in has been incredibly interesting. I’ve also been able to explore the law more directly through extracurricular and professional activities: through working in Yale’s flagship European Model UN conference, I was able to travel to Athens, Greece while sharing my interest in geopolitics with hundreds of international students. I worked as a community organizer in my home county, working to register voters with People Power for Florida; and this past summer, I learned about different legal careers through an internship at a law firm in New York city.\u003cbr\u003e\u003cbr\u003eI am incredibly grateful for the opportunities I’ve had and the learning journey I am currently on. As someone who attended a small public school that often lacked resources for mentorship and one-on-one guidance, I’m so excited to be able to share what I’ve learned over the past few years, and serve as a role-model for driven and hardworking students. I’m so excited for the future and it will bring!\u003c/p\u003e","teachingVideoPlaybackId":"01QypONrpJcYVDHEtCFGytpf01CaPWEFTO7qlGMp2VwT4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003ePerhaps my most unexpected achievement is my bid to the International Science and Engineering fair (ISEF) in the spring of 2021.\u003cbr\u003e\u003cbr\u003eDue to COVID-19, my school was forced to shuffle student schedules in my senior year, and I was randomly placed in a science research class that I had no intention of taking originally. Despite this, I redesigned my project, and designed a research experiment to determine whether surface texturing (like dimples on a golf ball) could help objects move faster through water as well. Having had no previous experience or interest in fluid dynamics, the project was an opportunity to dive into a new field of research with passion and determination. The research—admittedly to my own surprise—would go on to place in my regional science fair, and compete as a finalist at ISEF in the spring.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"893a8907-d75b-4f05-9f65-ab8d43927781\"}"},{"__ref":"Favorites:{\"uuid\":\"b28615c4-dbd6-4a06-8b39-d705c907386d\"}"},{"__ref":"Favorites:{\"uuid\":\"d2a25bc2-4a51-4f24-af92-4868030d1ffa\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"01dd47b8-52c2-4d1e-b4a6-a9e2fcfeb117\"}"},{"__ref":"CausesSupported:{\"uuid\":\"ee3ead19-5a9e-4f1c-837b-6527e38f3cca\"}"}],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3dd21dd6-a621-4c3e-81bf-5086daf6abf7\"}"},{"__ref":"DeepDives:{\"uuid\":\"b6a57f28-b1b2-462b-af48-d605a7904311\"}"},{"__ref":"DeepDives:{\"uuid\":\"b3a76671-4b19-4f85-859d-97195022a1f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"d8155f04-20dd-4ee5-a008-228cfb3f228d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/717b781f-55f0-4434-bca1-fcc1f5e869fc/-/preview/-/format/jpg/","https://ucarecdn.com/2fc5df22-4094-41e8-9831-c37ecabddde4/-/preview/-/format/jpg/","https://ucarecdn.com/51229747-3247-4ade-a102-7bdd09f8f85a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1b088898-844d-47fd-b476-ec6c248db361\"}"},{"__ref":"Education:{\"uuid\":\"1160ddbe-fa36-4ca4-86f5-b1d341a94219\"}"}],"hiredAt":"2023-10-18T09:00:47.112Z","topics":["Writing","Spanish","College Essay Writing","Academic Coaching","History","Reading"],"communityBadges":["https
