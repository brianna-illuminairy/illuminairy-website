xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"5207f34f-76fd-4834-8893-c94fd4b783b8\"}":{"__typename":"DeepDives","uuid":"5207f34f-76fd-4834-8893-c94fd4b783b8","content":"\u003cp\u003eAs a high school student, I was able to create a nice balance between my academic life and my social life. While I wouldn’t describe myself as a perfectionist, I was still dedicated to achieving the personal standards I set for myself. Coming from a small school, I truly valued the close-knit community it offered, which allowed me to build meaningful connections and engage with everyone I encountered. I also took full advantage of extracurricular opportunities, participating in as many sports as possible and being a part of the student government to contribute to my school community in any way possible.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"b7d249f4-642b-4573-99b9-f5506acbffab\"}":{"__typename":"DeepDives","uuid":"b7d249f4-642b-4573-99b9-f5506acbffab","content":"\u003cp\u003eDuring the COVID season, I had the opportunity to mentor children from underserved and underprivileged public schools who had just received new computers. Even though our meetings were virtual, the experience was incredibly fulfilling. I looked forward to each session, whether it was helping them with schoolwork or simply talking about their day. Seeing the smiles on their faces reminded me of the profound impact that even small acts of kindness can have. It reinforced the importance of giving back in any way possible and showed me that mentorship is a two-way street—rewarding not only for the mentees but also for the mentor. That experience solidified my belief in the power of connection and support, inspiring me to continue mentoring and making a difference where I can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"25a1a382-2cce-4272-8323-6bd884656800\"}":{"__typename":"DeepDives","uuid":"25a1a382-2cce-4272-8323-6bd884656800","content":"\u003cp\u003eI always made it a point to stay active during the summers, balancing my time between work, volunteering, and exploring the beautiful island of Puerto Rico. One of the most rewarding experiences was working for Puerto Rico’s congressman in Washington, D.C., which gave me valuable insights into leadership and public service. However, my true passion has always been volunteering. I dedicated my time to Habitat for Humanity, helping refurbish and paint houses, and also worked with children’s camps, where I could contribute to creating memorable experiences for the kids. Beyond that, I loved exploring the island, visiting its stunning beaches, and discovering hidden gems with friends. For me, summer has always been a time to refresh, reconnect, and dive deeper into the things that matter most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"3be40597-10c0-4a1f-a1b9-bb2ea5dba72d\"}":{"__typename":"DeepDives","uuid":"3be40597-10c0-4a1f-a1b9-bb2ea5dba72d","content":"\u003cp\u003eMy greatest source of motivation will always be making my parents proud. I deeply admire the hard work and sacrifices they’ve made throughout their lives to give me the opportunities I have today. I feel a strong sense of gratitude toward them and strive to reflect their dedication through my own efforts and achievements.\u003c/p\u003e\u003cp\u003eI’m also a firm believer in the power of kindness. I’m motivated by the idea that small, thoughtful actions—whether it’s holding a door open, offering a genuine smile, or simply saying “good morning”—can brighten someone’s day. These little moments of connection may seem small, but they carry great significance, and they inspire me to contribute positively wherever I can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"97d1560d-c872-46a6-9d9d-2a227662e244\"}":{"__typename":"School","uuid":"97d1560d-c872-46a6-9d9d-2a227662e244","name":"Colegio Puertorriqueño de Niñas","city":"Guaynabo","type":"HIGH","state":"Guaynabo","country":"Puerto Rico","zip":"00968"},"Education:{\"uuid\":\"4a55e2b5-cc5e-46ed-b60b-2c31a2bff3c3\"}":{"__typename":"Education","uuid":"4a55e2b5-cc5e-46ed-b60b-2c31a2bff3c3","school":{"__ref":"School:{\"uuid\":\"97d1560d-c872-46a6-9d9d-2a227662e244\"}"},"startYear":"2010","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c9b44e42-4328-4891-94b9-d3074236050b\"}":{"__typename":"School","uuid":"c9b44e42-4328-4891-94b9-d3074236050b","name":"University of Notre Dame","city":"Notre Dame","type":"COLLEGE","state":"Indiana","country":"United States","zip":"46556"},"Education:{\"uuid\":\"dbda81ee-4c33-4a31-a701-6d409cee545b\"}":{"__typename":"Education","uuid":"dbda81ee-4c33-4a31-a701-6d409cee545b","school":{"__ref":"School:{\"uuid\":\"c9b44e42-4328-4891-94b9-d3074236050b\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"b35df827-0678-4d58-97fe-a23d3406243e\"}":{"__typename":"MentorPublicProfile","uuid":"b35df827-0678-4d58-97fe-a23d3406243e","displayName":"Ceciliana F.","slug":"ceciliana-ferraiuoli-1","biography":"\u003cp\u003eHi! My name is Ceci. I’m currently a freshman at the University of Notre Dame, studying Civil Engineering with a minor in Corporate Practice.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a proud Puerto Rican, I am deeply passionate about sharing my love for the Spanish language and my culture. The strong sense of community and belonging I experienced growing up in Puerto Rico has instilled in me a profound desire to help others in any way I can. Because of this, I’ve been an active volunteer in various initiatives, including helping restore homes for underserved communities, tutoring students from public schools, cleaning local beaches, and more.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I’ve always been drawn to mathematics. Since I was little, I’ve loved how the field’s tangible nature allows for clear solutions to every problem. In high school, I was actively involved in the Student Council, the class board, and many clubs. My favorite classes included AP Calculus, Algebra II, Introduction to Law, and Puerto Rican History.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I enjoy staying active by playing sports and going on road trips to explore the beautiful beaches and rivers of Puerto Rico. I also love spending quality time with friends and family!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can’t wait to connect with you and support you on your journey!\u003c/p\u003e","teachingVideoPlaybackId":"gKsqe01Ou4FWuQCOzIzOQe1aTAN5uBzc35lN6R8zvyYA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5207f34f-76fd-4834-8893-c94fd4b783b8\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7d249f4-642b-4573-99b9-f5506acbffab\"}"},{"__ref":"DeepDives:{\"uuid\":\"25a1a382-2cce-4272-8323-6bd884656800\"}"},{"__ref":"DeepDives:{\"uuid\":\"3be40597-10c0-4a1f-a1b9-bb2ea5dba72d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/27e02509-b186-462c-8c80-e74fbd5ecb71/-/preview/-/format/jpg/","https://ucarecdn.com/7b3b3798-9907-4394-a91b-63c86f33107a/-/preview/-/format/jpg/","https://ucarecdn.com/3523ca32-498c-4338-924b-be29b5251865/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4a55e2b5-cc5e-46ed-b60b-2c31a2bff3c3\"}"},{"__ref":"Education:{\"uuid\":\"dbda81ee-4c33-4a31-a701-6d409cee545b\"}"}],"hiredAt":"2024-12-10T16:03:45.874Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Spanish","Executive Function","Academic Coaching"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ceciliana-ferraiuoli-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b35df827-0678-4d58-97fe-a23d3406243e\"}"}}},"_sentryTraceData":"96f429504cd74f00ac40eb3d6b709b39-ad9d8d79519027cd-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=96f429504cd74f00ac40eb3d6b709b39,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ceciliana-ferraiuoli-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager
