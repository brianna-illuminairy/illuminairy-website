"California","country":"United States","zip":"94022"},"Education:{\"uuid\":\"772c0cc3-e3f2-4f99-a01e-916e5b74f742\"}":{"__typename":"Education","uuid":"772c0cc3-e3f2-4f99-a01e-916e5b74f742","school":{"__ref":"School:{\"uuid\":\"e64c6623-fcdc-488b-8961-13d0fbee5430\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"Testimonial:06f545fd-27b4-4c42-9f8e-9ae405043a76":{"__typename":"Testimonial","id":"06f545fd-27b4-4c42-9f8e-9ae405043a76","text":"Grady was the perfect match for Asher. He had a way of teaching that made concepts click for Asher—often more quickly and clearly than his actual teachers. They built a strong rapport and accomplished a lot during their hour-long sessions. Asher had always resisted the idea of having a tutor and was actively against it—until he met Grady.","date":"2025-06-03 23:30:47.313+00","rating":5,"endorser":{"__typename":"Endorser","name":"Christy K","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"a9f5dd8a-6d2c-441a-bce9-470d07121bab\"}":{"__typename":"MentorPublicProfile","uuid":"a9f5dd8a-6d2c-441a-bce9-470d07121bab","displayName":"Grady H.","slug":"grady-harrison","biography":"I am Grady Hofmann. I was born in Maryland and moved to the Bay Area when I was three.  I am the youngest of three brothers and love my brothers to death.  I grew up with them as my best friends.\n\nAcademically, I am a sophomore at Stanford pursuing a major in Biology and a minor in Computer Science. I am also on the pre-medical track with aspirations to go to medical school after college.  I had a bone marrow transplant over 10 years ago and have been constantly surrounded my medicine.  I want to hopefully become a doctor to be able to give back to the system that helped me so much.\n\nIn my free time, I love to be around the water.  I started fishing as early as I can remember and started a commercial fishing company with my brothers 7 years ago. I loved boating and fishing so much that I got my Captain's license over the summer. \nThroughout high school, I also participated in Marine biology Research looking into tracking great white sharks and bluefin tuna.   I also love to surf all along the California coast. Lastly, I played lacrosse for the past 8 years and I am on the club lacrosse team at Stanford.\n\n\n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1141f01f-d2a8-41b9-abf7-d90d0d673b19\"}"},{"__ref":"Favorites:{\"uuid\":\"0ae902d5-8b76-4ca3-bfce-d9d0a7156a58\"}"}],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4db06549-4974-4208-8602-7738ec5ac9e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"5f6f285c-0544-411c-ad3b-2846d0bbebd9\"}"},{"__ref":"DeepDives:{\"uuid\":\"3bf7f980-b805-430f-9fe5-d9da5a033248\"}"},{"__ref":"DeepDives:{\"uuid\":\"97c91b69-7535-4a62-ab41-fcf9fcc11997\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a5938210-dcd5-4d6a-aae4-e57dbb84265b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"8ad356dd-c2f1-4c6c-b646-2f89118a0172\"}"},{"__ref":"Education:{\"uuid\":\"772c0cc3-e3f2-4f99-a01e-916e5b74f742\"}"}],"hiredAt":"2022-11-03T19:44:49.000Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","College Essay Writing","Computer Science","Academic Coaching"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:06f545fd-27b4-4c42-9f8e-9ae405043a76"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"grady-harrison\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":
