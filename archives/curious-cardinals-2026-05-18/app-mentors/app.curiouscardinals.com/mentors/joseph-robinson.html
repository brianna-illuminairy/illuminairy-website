xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3eef406b-b422-47b9-8460-c39f86a0aa81\"}":{"__typename":"Favorites","uuid":"3eef406b-b422-47b9-8460-c39f86a0aa81","photoUrl":"https://ucarecdn.com/3f952e39-e004-4cc9-b08f-2a90c8698788/","title":"GO:OD AM - Mac Miller","type":"ALBUM"},"Favorites:{\"uuid\":\"c55b53eb-5b38-401f-bd77-62c75aa8c0c8\"}":{"__typename":"Favorites","uuid":"c55b53eb-5b38-401f-bd77-62c75aa8c0c8","photoUrl":"https://ucarecdn.com/3f952e39-e004-4cc9-b08f-2a90c8698788/","title":"Joel Anthony","type":"ATHLETE"},"Favorites:{\"uuid\":\"5288dc80-d896-4d42-bfd7-625173de79d6\"}":{"__typename":"Favorites","uuid":"5288dc80-d896-4d42-bfd7-625173de79d6","photoUrl":"https://ucarecdn.com/3f952e39-e004-4cc9-b08f-2a90c8698788/","title":"Miami","type":"CITY"},"CausesSupported:{\"uuid\":\"73f985ea-c1a7-4b09-a19d-56035bc63cb9\"}":{"__typename":"CausesSupported","uuid":"73f985ea-c1a7-4b09-a19d-56035bc63cb9","name":"Bay Area Friendship Circle","description":"\u003cp\u003eBuddies up disabled teens with abled people for hanging out and fun on Sundays!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8a460829-18c2-46b9-8176-f40156f4b532\"}":{"__typename":"DeepDives","uuid":"8a460829-18c2-46b9-8176-f40156f4b532","content":"\u003cp\u003eFollow \u003cem\u003eany \u003c/em\u003esmall inclination of interest or passion. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think in middle/high school its \"cool\" not to care about things. This is a bad way to be for two reasons.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e1.  You're delaying growing into the true you. \u003c/p\u003e\u003cbr\u003e\u003cp\u003e2. In the real world, the only thing that matters are the things that you care about. You figure out what those things are - and correctly, I may add - by diving deep down into your interests or things you feel gravitationally drawn to. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo don't follow the crowd. Follow your own interests and feelings, even if the path it leads you down may be one by yourself. I promise that isolation is so temporary in the grand scheme of your life, but you will find the most genuine people who are truly meant to surround you by just following your true interests. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d92d0719-ed96-47c3-a348-83ac92022d73\"}":{"__typename":"DeepDives","uuid":"d92d0719-ed96-47c3-a348-83ac92022d73","content":"\u003cp\u003eIt's the closest thing we have to seeing the future. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentors should be the people who are only a few years ahead of where you want to be that can help light the path of the otherwise unknown.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLife is scary and filled with unknowns. The highest value mentorship delivers is providing you a framework, or someone you can pick the brains of, to help light that dark, scary path. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDon't get me wrong, that path is still your own, and it will differ from mine. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut having someone who is only a few years older than you, so they are contextually and timely attuned to your current phase in life, makes a huge difference in understanding future planning and your future self. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"aa3cb98a-cc61-4987-b9bc-e9e4bf96d7af\"}":{"__typename":"DeepDives","uuid":"aa3cb98a-cc61-4987-b9bc-e9e4bf96d7af","content":"\u003cp\u003eFear of not living up to my greatest potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere is nothing more bothersome to me than untapped potential. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo not exhaust every resource within my reach to help catapult me to the highest level of my own potential would be a very unsettling existence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e07f7a73-6fa7-4ffd-a227-d6bf4f635d9c\"}":{"__typename":"DeepDives","uuid":"e07f7a73-6fa7-4ffd-a227-d6bf4f635d9c","content":"\u003cp\u003eWriting a show like Seinfeld or Curb Your Enthusiasm.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYour whole existence is to hang out with your friends, be observant / introspective, and make humor out of every situation. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI don't see how anyone could complain about that lifestyle. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"facc884a-ab34-4c89-8a47-f47a2273e29b\"}":{"__typename":"School","uuid":"facc884a-ab34-4c89-8a47-f47a2273e29b","name":"Coral Glades High School","city":"Coral Springs","type":"HIGH","state":"Florida","country":"United States","zip":"33065"},"Education:{\"uuid\":\"1881fdbd-517f-4e3b-980f-73eac7d42bab\"}":{"__typename":"Education","uuid":"1881fdbd-517f-4e3b-980f-73eac7d42bab","school":{"__ref":"School:{\"uuid\":\"facc884a-ab34-4c89-8a47-f47a2273e29b\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"6e7f170d-c9f8-4faf-afc5-7ead1d7d99b4\"}":{"__typename":"Education","uuid":"6e7f170d-c9f8-4faf-afc5-7ead1d7d99b4","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Public Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"ffe76456-8b95-4d2f-8cb9-d3e66308a0f2\"}":{"__typename":"MentorPublicProfile","uuid":"ffe76456-8b95-4d2f-8cb9-d3e66308a0f2","displayName":"Joseph R.","slug":"joseph-robinson","biography":"\u003cp\u003e\"\u003cem\u003eLearning is not memorizing information\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eLearning is changing your behavior\u003c/em\u003e\"\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHey y'all, my name is Joe and I am a proud life-long learner.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy learning is rooted in the public education system of Broward County (South Florida) Schools, where it then blossomed through private higher-education at Duke University. Today it is nurtured through the sunshine and water I provide it myself as I enter the real-world, working as a cybersecurity analyst at Palo Alto Networks. Being out of the school system does not mean my education ceases to exist, as I think any situation you're an active participant of is a learning opportunity. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt university I studied public policy and political science. I felt that the two worked in tandem to one another: it taught you how individual actors worked within a system (political science) and then how a system operated itself (public policy). I \u003cem\u003elove \u003c/em\u003eunderstanding and thinking about the way in which things work, especially through the lens of the human condition. I continue this education by being a veracious consumer on studying the greats of their respective fields (Steve Jobs, Michael Jordan, Anthony Bourdain).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI feel an obligation and importance towards community, and the democratization of information. In high school I co-founded a financial literacy organization that served the South Florida Foster Care System, and at Duke I chaired the Cyber Team to help grow and spread awareness on cyber safety.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my education I'm an avid basketball fan (Miami Heat and Duke, of course).  I also prioritize my mental well-being and look to challenge myself in my day-to-day. This has led me to an active workout streak of over 250 days in an attempt to do something every single day for at least a year!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship is important to me because I find learning from your peers one of the most effective ways of learning. Especially when the person is only just a few years ahead of you on the unknown path that is life. While wisdom comes with age, having a mentor only so many years older than yourself helps the mentor/mentee relationship by providing a more contextually and up-to-date understanding of the way in which the world is currently working.\u003c/p\u003e","teachingVideoPlaybackId":"AkXF01IPQHxvGRbP4c4YCQBYGZITu9nai8MvHJUFmTGE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3eef406b-b422-47b9-8460-c39f86a0aa81\"}"},{"__ref":"Favorites:{\"uuid\":\"c55b53eb-5b38-401f-bd77-62c75aa8c0c8\"}"},{"__ref":"Favorites:{\"uuid\":\"5288dc80-d896-4d42-bfd7-625173de79d6\"}"}],"causesSupported":[{"__ref":"Causes
