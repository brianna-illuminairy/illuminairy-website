 Molecular Psychiatry. His love for biology and coding earned him a Top 50 placement in the USA Biology Olympiad, an AIME distinction award, and Platinum placement in the USA Computing Olympiad. Additionally, his passion for poetry led to him being named a National YoungArts Winner and a National Scholastic Art and Writing Awards Gold Medalist.\u0026nbsp;His work can be found in literary magazines such as The Adroit Journal, Los Angeles Review, and more. He also loves to build mobile and web apps for fun, and is currently working on an AI-driven educational platform.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen applying to college, he got into Penn's M\u0026amp;T Program, Columbia, Brown, Northwestern, WashU, Rice, and CMU Computer Science, among others. He hopes to guide future scholars in achieving their most successful future possible.\u003c/p\u003e","teachingVideoPlaybackId":"rhfl13CXUIVjjr63kH02HgKbwAvmfYSSyf42wifcYXTM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7f6b0bfc-7c58-4192-ac82-1eebbab32bb6\"}"}],"causesSupported":[],"major":"CS + Finance (M\u0026T)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"54e31aa5-739b-4935-8a3a-fc59a97f827e\"}"},{"__ref":"DeepDives:{\"uuid\":\"6037bba0-40c8-457d-a9a1-c9e3ee0bb38a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/75107879-66fc-40dd-9a81-032ba5d7a79a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0c8db8bd-6331-4365-be14-96ff8d0584bd\"}"},{"__ref":"Education:{\"uuid\":\"16e4ffe3-217a-4a15-978c-311f4fad6540\"}"}],"hiredAt":"2025-04-30T16:25:46.792Z","topics":["Biology","Physics","Writing","Computer Science","Academic Coaching","Executive Function","College Essay Writing","Creative Writing","Video / Photography","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Medicine / Health","Web Design","STEM Project","Machine Learning / AI","Public Speaking","Statistics","Ca
