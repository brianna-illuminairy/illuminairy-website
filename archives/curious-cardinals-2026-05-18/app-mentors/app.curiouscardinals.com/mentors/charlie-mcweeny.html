xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"8d03f15b-65c8-4815-b552-f8da38697a4d\"}":{"__typename":"DeepDives","uuid":"8d03f15b-65c8-4815-b552-f8da38697a4d","content":"\u003cp\u003eI'm a twin!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1134c954-7660-43f7-818f-f0f6a92cda31\"}":{"__typename":"DeepDives","uuid":"1134c954-7660-43f7-818f-f0f6a92cda31","content":"\u003cp\u003eI run, bike, hike, fish, climb, alpine ski, nordic ski, and explore the wilderness of Montana any other way I can!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fd425a4f-c325-4e74-910f-aaf47d90e8eb\"}":{"__typename":"DeepDives","uuid":"fd425a4f-c325-4e74-910f-aaf47d90e8eb","content":"\u003cp\u003eI became a Politics major in order to think critically about how we structure the world around us.  I loved the opportunities for interdisciplinary exploration in Politics, from highly quantitative studies to theoretical discussions and historical analysis.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"711521ce-0070-4d9b-a775-b24788ebe4f0\"}":{"__typename":"DeepDives","uuid":"711521ce-0070-4d9b-a775-b24788ebe4f0","content":"\u003cp\u003eIn high school, I spent my summers as a camp counselor and washing dishes in a kitchen.\u0026nbsp; I loved spending time outside and serving as a mentor to campers, exploring environmental science, art, and athletics.\u0026nbsp; Working in a kitchen was a great experience for me, and remains one of the hardest but most rewarding jobs I’ve ever had; I got to order anything I wanted off the menu for dinner every night, even if it was the last portion of the meal we had!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"c773d499-ea3c-44ae-8465-b22201e9dd5a\"}":{"__typename":"School","uuid":"c773d499-ea3c-44ae-8465-b22201e9dd5a","name":"School For Ethics \u0026 Global","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20036"},"Education:{\"uuid\":\"f9ab8e72-adb1-45ab-9138-9a929a20e494\"}":{"__typename":"Education","uuid":"f9ab8e72-adb1-45ab-9138-9a929a20e494","school":{"__ref":"School:{\"uuid\":\"c773d499-ea3c-44ae-8465-b22201e9dd5a\"}"},"startYear":"2020","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"7f45e997-d096-4f83-bd0d-43ab9128f364\"}":{"__typename":"Education","uuid":"7f45e997-d096-4f83-bd0d-43ab9128f364","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Politics","degree":null},"MentorPublicProfile:{\"uuid\":\"b2b34b75-6d85-474b-ac0c-f0764536946f\"}":{"__typename":"MentorPublicProfile","uuid":"b2b34b75-6d85-474b-ac0c-f0764536946f","displayName":"Charlie M.","slug":"charlie-mcweeny","biography":"\u003cp\u003eHowdy!\u0026nbsp; I’m Charlie, a recent graduate of Princeton currently living and working in Missoula, Montana.\u0026nbsp; I help middle and high school students discover what they’re passionate about and write the playbook to translate these ambitions into actionable projects and tangible change in their community.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy “Why Curious Cardinals?”\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI participated in all of the usual high school clubs, from Model United Nations to student government.\u0026nbsp; I couldn’t shake the feeling, however, that these clubs weren’t meaningful; they didn’t have a tangible benefit to my community, and lots of people participated just to pad college applications.\u0026nbsp; Midway through high school I dropped these clubs and:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConvinced my principal to let me sit on the actual School Committee as a Student Representative;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBegan publishing a weekly newsletter comparing news coverage from across the political spectrum of current events;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCompleted an oral history project on the decline of manufacturing in the post-industrial county I grew up in.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese projects were far more rewarding than my clubs had been, but I was figuring it all out on my own. I didn’t have a mentor to help me brainstorm, stay on track, or navigate roadblocks. I joined Curious Cardinals to provide that guidance and structure to other students!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA Bit About Me:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI graduated \u003cem\u003eMagna Cum Laude\u003c/em\u003e in Politics from Princeton and minored in English.\u0026nbsp; I rowed on the Men’s Lightweight Rowing Team for four years, including as part of the 2022 IRA National Champions. \u0026nbsp; My studies ranged from Irish Literature to Judicial Politics, and I published a chapter on the architecture of mass incarceration in \u003cem\u003eCarceral Architecture\u003c/em\u003e, a collection of essays edited by Basile Baudez and Victoria Bergbauer.\u0026nbsp; I was recognized for achievements both on and off the water,\u0026nbsp;including as an Empacher-IRCA Scholar Athlete and\u0026nbsp;a Schaeffer Fellow in Government Service.\u0026nbsp; In the summers, I interned for the Clinton Health Access Initiative in Pretoria, South Africa and for a federal judge in the Eastern District of New York.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eProjects I Can Help With:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eFor too many students today, long-term passions get lost in the shuffle of daily homework and assignments.\u0026nbsp; That’s where a good coach or mentor comes in.\u0026nbsp; The path for a high school rower to successful collegiate athlete is clear.\u0026nbsp; But there’s no playbook for the aspiring journalist, researcher, or community advocate.\u0026nbsp; I love helping students write that playbook: figuring out what excites them, making a plan, and sticking with it until they’ve built something they’re proud of.\u0026nbsp; I can help with projects including:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAppointment to positions in local government (ask me about my little brother, who is now the Town Fence Viewer);\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOral History projects;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePolitics, Law, and History newsletters;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eJournalism \u0026amp; research on local politics and government, especially criminal justice;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublic speaking, critical thinking, time-management, prioritization, and executive functioning.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Experience:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve tutored everywhere from prisons to rowing shells, and love working with a wide array of students.\u0026nbsp; I’ve helped incarcerated students at Garden State Youth Correctional Facility secure GEDs through Math and ELA tutoring, and\u0026nbsp;I led my rowing team’s participation in STEM to Stern, a program that expanded access to rowing while providing tutoring in STEM through engaging, hands-on projects.\u0026nbsp; No matter the setting, I meet students where they are and help them get where they want to go.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMore About Me:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI love biking, skiing, running, rafting, hiking, and exploring the wilderness of Montana through any other means I can.\u0026nbsp; I have three siblings, including a twin sister (we’re not at all competitive).\u0026nbsp; I’m always looking for book recommendations, and have very strong feelings about Chobani yogurt!\u003c/p\u003e","teachingVideoPlaybackId":"IlayX51RklBzm02tA1PwsQZYqMR0031DpGID95I9B01DhE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Politics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8d03f15b-65c8-4815-b552-f8da38697a4d\"}"},{"__re
