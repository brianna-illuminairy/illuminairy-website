d":"758b5904-e03d-422b-969a-9ba8a0dc732d","content":null,"videoPlaybackId":"Za5heM1v9yIHb01kqtUpyjh9m01VnsMP01FehnmIGdGj5k","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"6cf522a6-9447-493a-9ceb-d263b2faf057\"}":{"__typename":"Education","uuid":"6cf522a6-9447-493a-9ceb-d263b2faf057","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Modern Culture and Media","degree":null},"School:{\"uuid\":\"4f1ac739-bd83-444b-882d-324053cb5fdb\"}":{"__typename":"School","uuid":"4f1ac739-bd83-444b-882d-324053cb5fdb","name":"Li Po Chun United World College of Hong Kong","city":"Hong Kong","type":"HIGH","state":"New Territories","country":"Hong Kong","zip":"00000"},"Education:{\"uuid\":\"f3b44f24-b07a-488d-b043-85d90cf2e5da\"}":{"__typename":"Education","uuid":"f3b44f24-b07a-488d-b043-85d90cf2e5da","school":{"__ref":"School:{\"uuid\":\"4f1ac739-bd83-444b-882d-324053cb5fdb\"}"},"startYear":"2017","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"a19c2a5c-75eb-4147-bff2-f6a7e16af860\"}":{"__typename":"MentorPublicProfile","uuid":"a19c2a5c-75eb-4147-bff2-f6a7e16af860","displayName":"Lana H.","slug":"lana-hadziosmanovic","biography":"\u003cp\u003eHello! I’m Lana, a passionate language learner and educator with a diverse background. Born in the US to Bosnian and Jamaican parents, I grew up in Bosnia. At 16, I received a scholarship to study at an international boarding school in Hong Kong. I am a big language nerd, studying Spanish, Korean, and Dutch for several years now, an experienced English teacher, children’s book illustrator, animator, gardener, part-time sailor, and artist!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn Hong Kong, I completed the International Baccalaureate (IB) diploma. Knowing the trials and tribulations of studying the IB, I would love to mentor any students through their IB diplomas, especially HL Economics, HL English L\u0026amp;L, HL Visual Arts, SL Biology and SL Math, as well as the equivalent AP level courses. While in Hong Kong, I was accepted at Brown University, so I am also quite keen to mentor students through the entire college application process.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy teaching journey began in Ecuador in 2019, where I studied Spanish and taught English to middle schoolers, followed by volunteer work at Brown, teaching English to adult immigrants. While living in Korea, besides studying Korean myself, I taught English to senior citizens and kindergarteners. Now in the Netherlands, I teach English to primary and high school students while continuing to hone my Dutch. My experience as both a language teacher and learner has given me a lovely pedagogical toolbox adaptable to any type of learner. Beyond tutoring the languages I speak (Spanish, Korean, Dutch, Bosnian, Croatian, Serbian, and English), I also have a few tricks up my sleeve to assist students in learning any other language they wish to learn.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBesides teaching, I also serve on the board of UciMo Foundation, an NGO in my hometown in Bosnia, where I manage community projects and teach a course on Balkan history and activism to high schoolers. As a mentor, I am hoping to pay forward all the skills I gained through trial and error in the NGO sector: project management, collaboration with multiple stakeholders, development of long term goals and mission statements, etc.. As a project grows and shifts, what I believe is most important to impart to mentees is that which should lie at the core of every project—the selfless desire to help one’s local or global community.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m excited to connect with you and share my passion for learning and teaching!\u003c/p\u003e","teachingVideoPlaybackId":"kh1h35D2yxkswi01z025rW7gx2oUo4jOMi016C3ggZ2sVo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Modern Culture and Media","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2fabf81c-6e34-45ce-badd-d3ad6d23cfa1\"}"},{"__ref":"DeepDives:{\"uuid\":\"efe210be-6a64-4f89-bcbe-9b02767b7c11\"}"},{"__ref":"DeepDives:{\"uuid\":\"2ba2b7a9-4abf-4b1d-a20a-41523829f4e4\"}"},{"__ref":"DeepDives:{\"uuid\":\"758b5904-e03d-422b-969a-9ba8a0dc732d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/92bb54b4-b475-4887-90f6-1951f1f4410b/-/preview/-/format/jpg/","https://ucarecdn.com/6255757f-4d1f-4936-b4d9-3fde8fa86b10/-/preview/-/format/jpg/","https://ucarecdn.com/e374cc09-b036-432b-84fc-22bfc610d054/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6cf522a6-9447-493a-9ceb-d263b2faf057\"}"},{"__ref":"Education:{\"uuid\":\"f3b44f24-b07a-488d-b043-85d90cf2e5da\"}"}],"hiredAt":"2025-02-27T17:01:13.806Z","topics":["K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Sustainability","Journalism","Public Speaking","Debate"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lana-hadziosmanovic\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a19c2a5c-75eb-4147-bff2-f6a7e16af860\"}"}}},"_sentryTraceData":"dc74cc013e704574a596d83a1d0af4c9-98139da6d13281fd-0","_sentryBaggage":"sentry-environment=vercel-production,sen
