xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"fe0eb5b3-83cf-478e-927d-8bfd2644b580\"}":{"__typename":"DeepDives","uuid":"fe0eb5b3-83cf-478e-927d-8bfd2644b580","content":"\u003cp\u003eThe biggest thing I would tell myself is to take a deep breath and slow down. I was an extremely hard worker in middle school and high school and would always be so hard on myself when things didn't go right (like a pop quiz or essay) and that past mindset makes me now look back with not much fondness at that time. \u003cbr\u003e\u003cbr\u003eA lot rides on school, especially leading up to college and eventually jobs and thus life! But NOTHING IS MORE IMPORTANT than mental health and finding what makes you happy! So though I would advise past me to keep working hard, I would want me to find joy in learning and being curious. Life will always through you more and more obstacles, but the right mindset will help you through it in addition to your education. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"98585958-fe70-40fd-82ee-6423fe9854fa\"}":{"__typename":"DeepDives","uuid":"98585958-fe70-40fd-82ee-6423fe9854fa","content":"\u003cp\u003eMentorship matters so much to me because I had to be my own mentor! Despite my learning disabilities, I  taught myself how to study, take notes, and rehearse to keep up with everyone around me. No one should have to go through that, and thus I want to be a mentor that past me should have had! A mentor is more than just a tutor, an integral aspect of who someone becomes one day and what methods they use to motivate themselves and push for success. \u003cbr\u003e\u003cbr\u003eI had a rough time from elementary school to high school, and thus sharing that understanding and compassion with a mentee means the world to me. I see my mentor strategy as a friend chatting to another friend about the world and helping each other out: maintaining a low stress and welcoming environment that all students deserve. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"fa1b93ec-5e27-4a91-92c5-3738685d5240\"}":{"__typename":"DeepDives","uuid":"fa1b93ec-5e27-4a91-92c5-3738685d5240","content":"\u003cp\u003eI think the right answer is WHY NOT? I love teaching others! Seeing the lightbulb go off or when something clicks, is an unmatched feeling that I couldn't get I any other position. Mentoring fuels my day with so much positivity as it makes me feel like I am making a good, impactful change in our future generations. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"cb18e3b2-65b1-4062-93b8-f714f1a19bc3\"}":{"__typename":"DeepDives","uuid":"cb18e3b2-65b1-4062-93b8-f714f1a19bc3","content":"\u003cp\u003eIn the midst of high school learning about all this math, history, chemistry, physics, etc... I realized the workings of our our planet Earth was a subject I never knew about. I always had a passion for hiking, running, climbing, swimming...but I always have wanted to stop and think about what was really at play:\u003cbr\u003eWhy do we have mountains? \u003cbr\u003eWhy is there fresh and saltwater? \u003cbr\u003eWhy is global warming happening?  \u003cbr\u003eHow does farming even work? \u003cbr\u003eWhy do animals go extinct? \u003cbr\u003e\u003cbr\u003eI quickly learned that nature was my passion, as it was the intersection of every single subject in school: math, chemistry, physics, and history, are all right there! \u003cbr\u003eEarth Systems, which is a fancy Stanford word for applied environmental sciences and process, is a major I quickly found to encapsulate this love. Further, I wanted my future career to focus on sustainability, which this major truly set me up for. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"5490ecaf-22f0-4c48-9a14-d249cccf7202\"}":{"__typename":"School","uuid":"5490ecaf-22f0-4c48-9a14-d249cccf7202","name":"Canyon Hills High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92124"},"Education:{\"uuid\":\"7daed2e1-953b-43a5-9e30-814ed9464eeb\"}":{"__typename":"Education","uuid":"7daed2e1-953b-43a5-9e30-814ed9464eeb","school":{"__ref":"School:{\"uuid\":\"5490ecaf-22f0-4c48-9a14-d249cccf7202\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e461097e-f594-4c13-994b-7df93cfa492c\"}":{"__typename":"Education","uuid":"e461097e-f594-4c13-994b-7df93cfa492c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Earth Systems (BS \u0026 MS)","degree":null},"MentorPublicProfile:{\"uuid\":\"ec4fa2b4-1e80-4e2f-bbb8-dc10b53b8fa4\"}":{"__typename":"MentorPublicProfile","uuid":"ec4fa2b4-1e80-4e2f-bbb8-dc10b53b8fa4","displayName":"Calista O.","slug":"cali-ordas","biography":"\u003cp\u003eHello! My name is Calista (Cali), a Stanford University student, currently pursuing a BS in Earth Systems (2025) from San Diego. I love hiking, dancing, traveling, painting, adventuring, and most of all talking to new people and making new friends all over the world!\u003cbr\u003e\u003cbr\u003eEXPERIENCE\u003cbr\u003eI have worked hands-on with a variety of students in professional learning environments and in particular experience with working with students of varying learning disabilities (ADHD, Dyslexia, ADD, Downs, Autism) since 2019, working virtually and in the classroom as I have many learning disabilities myself. I am passionate about involving students in environmental studies and helping them understand the workings of natural processes, anthropogenic impacts, and the world around us is a vital skill as we step into a future of sustainability! Hands-on learning is my go-to! I love making friends with all of my mentees and love learning alongside them. \u003cbr\u003e\u003cbr\u003eOTHER WORK EXPERIENCE:\u003cbr\u003eI interned at McKinsey in 2023 and secured a full-time position post-graduation. In 2022, I was a research intern at Stanford’s Earth Department, analyzing urban soil contamination. From 2008 to 2021, I was a dedicated Girl Scout, earning my bronze, silver, and gold awards through many community service projects. \u003cbr\u003e\u003cbr\u003eFUN FACTS!\u003cbr\u003eI hope to one day travel the world! I just finished a semester in Australia's great barrier reef and went backpacking in New Zealand...had the best time ever! Additionally, I have a strong background in the performing arts, winning the National Dance Honors Society Dancer of the Year in 2021.\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"FQjqrxtVzoAOLJNcRhtABjJQfpToqJCWVONa7aOOUao","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Earth Systems (BS \u0026 MS)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fe0eb5b3-83cf-478e-927d-8bfd2644b580\"}"},{"__ref":"DeepDives:{\"uuid\":\"98585958-fe70-40fd-82ee-6423fe9854fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"fa1b93ec-5e27-4a91-92c5-3738685d5240\"}"},{"__ref":"DeepDives:{\"uuid\":\"cb18e3b2-65b1-4062-93b8-f714f1a19bc3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6560b8c0-57b3-4f19-8ea8-bb07e7001d51/-/preview/-/format/jpg/","https://ucarecdn.com/c6a09738-0128-4e52-ac37-4383108b69f1/-/preview/-/format/jpg/","https://ucarecdn.com/10a4ca5b-696a-4d08-af3c-dbd8492953bb/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7daed2e1-953b-43a5-9e30-814ed9464eeb\"}"},{"__ref":"Education:{\"uuid\":\"e461097e-f594-4c13-994b-7df93cfa492c\"}"}],"hiredAt":"2023-11-29T23:19:34.796Z","topics":["Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Physics","Writing","Spanish","Academic Coaching","College Essay Writing","Executive Function","Reading"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"cali-ordas\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ec4fa2b4-1e80-4e2f-bbb8-dc10b53b8fa4\"}"}}},"_sentryTraceData":"7825ec26403d408e9d7af410c5621763-bbf71374b340d316-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace
