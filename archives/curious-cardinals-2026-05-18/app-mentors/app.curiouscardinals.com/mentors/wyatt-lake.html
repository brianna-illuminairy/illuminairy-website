xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"13b3c88a-46d3-45ac-a317-b721a970f00b\"}":{"__typename":"Favorites","uuid":"13b3c88a-46d3-45ac-a317-b721a970f00b","photoUrl":"https://ucarecdn.com/5cade03b-79b2-42c5-a3e0-4945055974a7/","title":"Matt Damon","type":"ACTOR"},"Favorites:{\"uuid\":\"18d5d77d-7231-498b-bfba-84b7f4621b7f\"}":{"__typename":"Favorites","uuid":"18d5d77d-7231-498b-bfba-84b7f4621b7f","photoUrl":"https://ucarecdn.com/86a20944-0384-4a25-bbfe-dbd952b7eae0/","title":"Lionel Messi","type":"ATHLETE"},"Favorites:{\"uuid\":\"61b67184-424e-4608-b30b-1d40d6517fa8\"}":{"__typename":"Favorites","uuid":"61b67184-424e-4608-b30b-1d40d6517fa8","photoUrl":"https://ucarecdn.com/cc210b86-9764-4708-b617-9d021dce0e05/","title":"Noah Kahan","type":"ARTIST"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"fed00180-3653-4b91-a26c-cba2bfe03a59\"}":{"__typename":"DeepDives","uuid":"fed00180-3653-4b91-a26c-cba2bfe03a59","content":"\u003cp\u003eI’d tell my middle and high school self that life isn’t decided nearly as early as it feels, and that confidence should come from growth and character, not just achievements or other people’s approval. Learn how to think deeply, stay disciplined, take care of your body, and get comfortable being uncomfortable, because almost everything worthwhile takes time and uncertainty. Don’t waste energy worrying about being judged — most people are focused on themselves — and don’t abandon the things you genuinely love just because they aren’t the “practical” path. The people around you matter more than you realize, and while ambition is important, don’t become so focused on success that you forget to actually enjoy being young.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2ae1bacf-1907-4647-adb5-8022c5c218ee\"}":{"__typename":"DeepDives","uuid":"2ae1bacf-1907-4647-adb5-8022c5c218ee","content":"\u003cp\u003eMentorship matters to me because the right mentor can completely change the trajectory of someone’s life by giving them perspective, confidence, and guidance they wouldn’t have developed alone. A good mentor doesn’t just teach skills — they help people avoid unnecessary mistakes, see bigger opportunities, and push beyond what they thought they were capable of. I think growth happens much faster when you learn from people who have already faced the challenges you’re trying to navigate, and I also believe mentorship creates a cycle where people who were once helped eventually help others in return.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1b1d2796-0d52-4ba6-a65e-dd1172a19545\"}":{"__typename":"DeepDives","uuid":"1b1d2796-0d52-4ba6-a65e-dd1172a19545","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is building something meaningful that has a lasting impact on other people, whether that’s through business, leadership, or creating opportunities for others to succeed. I want to push myself to the highest level I’m capable of, not just financially, but as someone who is respected for discipline, ambition, and the ability to inspire and lead others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b9cd1af3-c5d9-44b4-af30-231b776084bd\"}":{"__typename":"DeepDives","uuid":"b9cd1af3-c5d9-44b4-af30-231b776084bd","content":"\u003cp\u003eI chose my majors because they combine the analytical and technical skills I enjoy with the ability to solve real-world problems. Economics gives me insight into markets, incentives, and decision-making, while mechanical engineering challenges me to think quantitatively and design solutions from the ground up. Together, they align well with my interests in business, finance, innovation, and building things that have practical impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"94449128-a8af-45cb-8b47-ed5616258844\"}":{"__typename":"School","uuid":"94449128-a8af-45cb-8b47-ed5616258844","name":"Hanover High School","city":"Hanover","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"cf1f3763-ba25-4160-9943-dabd45f0f8bb\"}":{"__typename":"Education","uuid":"cf1f3763-ba25-4160-9943-dabd45f0f8bb","school":{"__ref":"School:{\"uuid\":\"94449128-a8af-45cb-8b47-ed5616258844\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"f104fcd3-c4c5-4d48-b19a-05eceb902fc3\"}":{"__typename":"Education","uuid":"f104fcd3-c4c5-4d48-b19a-05eceb902fc3","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical engineering and economics","degree":null},"MentorPublicProfile:{\"uuid\":\"2cdd8acf-4fd2-4ca7-8a97-ebaa633d4087\"}":{"__typename":"MentorPublicProfile","uuid":"2cdd8acf-4fd2-4ca7-8a97-ebaa633d4087","displayName":"Wyatt L.","slug":"wyatt-lake","biography":"\u003cp\u003eMy name is Wyatt Lake, and I’m a Yale sophomore double majoring in Mechanical Engineering and Economics. I’ve always been someone who likes to stay busy and challenge myself in different ways, whether that’s through academics, work, or the things I care about outside the classroom. I’ve had the chance to work on some pretty incredible projects so far, including helping with autonomous vehicle research for the U.S. Army Corps of Engineers and being part of a NASA high-altitude balloon project that sent experiments to space. Those experiences showed me that learning really sticks when you get to apply it to something real. Outside of school, I love staying active and grounded. Skiing, hiking, karate, and rugby have all shaped who I am and how I approach life. I care a lot about growth, showing up for people, and constantly trying to get a little better at whatever I’m doing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore college, one of the biggest influences on my life was teaching karate. I spent five years as an instructor working with students from ages five to twenty five, and it taught me way more than just how to lead a class. I learned how to be patient, how to communicate clearly, and how to meet people where they are. I also competed at a high level during that time, representing the USA AAU national team and competing in the WUKF World Championship. Balancing teaching with competing gave me a unique perspective. I got to experience both sides of growth, pushing myself to perform while also helping others build confidence and belief in themselves. Those years really shaped how I think about mentorship. To me, it’s not about having all the answers. It’s about listening, encouraging, and helping people see what they are capable of.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the things I am most proud of at Yale is a project people now know as the Yale Sandwich Guy. It started as a simple idea to sell affordable breakfast sandwiches on campus, but it quickly became something way bigger than I expected. Yes, it has made money, but what matters more to me is the community it has created. Standing on Cross Campus in the mornings, I get to meet so many different people and start their days with something positive. It showed me how powerful small ideas can be when they are built with intention and consistency. Running this project taught me responsibility and problem solving, but it also reminded me that leadership is really about bringing people together and creating spaces where others feel welcome and supported.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"in9lVNvqQ7vursGhDzyMVrPd5l4tFA7gzUsE2QrptEY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was competing on the USA WUKF National Team for Karate\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"13b3c88a-46d3-45ac-a317-b721a970f00b\"}"},{"__ref":"Favorites:{\"uuid\":\"18d5d77d-7231-498b-bfba-84b7f4621b7f\"}"},{"__ref":"Favorites:{\"uuid\":\"61b67184-424e-4608-b30b-1d40d6517fa8\"}"}],"causesSupported":[],"major":"Mechanical engineering and economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fed00180-3653-4b91-a26c-cba2bfe03a59\"}"},{"__ref":"DeepDives:{\"uuid\":\"2ae1bacf-1907-4647-adb5-8022c5c218ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b1d2796-0d52-4ba6-a65e-dd1172a19545\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9cd1af3-c5d9-44b4-af30-231b776084bd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1cc069c1-a2a2-4d6f-8357-fb43c3b07ea7/-/previ
