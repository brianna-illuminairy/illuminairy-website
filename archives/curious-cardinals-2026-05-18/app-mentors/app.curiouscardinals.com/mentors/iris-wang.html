xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4756c62c-6e57-4a75-8055-9e415ceb8d98\"}":{"__typename":"DeepDives","uuid":"4756c62c-6e57-4a75-8055-9e415ceb8d98","content":"\u003cp\u003eRun a marathon or do an Iron Man! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope to stay active past college athletics and I've always been a big fan of a long run even as a sprinter!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3b3e412a-05c3-46ef-a9a1-afe78c9fb1c3\"}":{"__typename":"DeepDives","uuid":"3b3e412a-05c3-46ef-a9a1-afe78c9fb1c3","content":"\u003cp\u003eWhile high school calculus II and III initially scared me off from the math track, Brown's open curriculum and Applied Math (APMA) department helped me find a new spark for math. Seeing its application to my own research now has reaffirmed my decision in studying Applied Math and Biology. This field prepares me for medical school with the biology requirements and also has many practical applications in computational biology and mathematical modeling. Within my upper level APMA classes I got to see stories unfold from an equation and several inputs (like in the Bare-Rock model, modeling a planet with no atmosphere). From here, I could create my own story, adding in new variables and parameters. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"977f6d14-da58-4c5e-b9ee-430b919299d5\"}":{"__typename":"DeepDives","uuid":"977f6d14-da58-4c5e-b9ee-430b919299d5","content":"\u003cp\u003eAlthough my ultimate goal is to become a doctor, my dream job would be to work as a food critic. Food and traveling have had a significant impact on my upbringing. Also, imagine traveling around the world and trying food for free! I think I have pretty good taste in food too :). In my free time, I try out new restaurants in Providence (our food scene is underrated) and rate them on Beli (follow me!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1a021804-f15b-4146-9260-6719efd75801\"}":{"__typename":"DeepDives","uuid":"1a021804-f15b-4146-9260-6719efd75801","content":"\u003cp\u003eTrack and school have both taught me the importance of discipline and all its forms. I am most motivated by the pursuit of becoming more disciplined. Whether its training yourself to become a morning person, allocating enough time in your today to study and focus, or forcing yourself to complete that workout, these actions all stem from strong discipline. I'm most inspired by the people around me who live out these different aspects of discipline. Transitioning to college is challenging because you're given immense freedom and no instructions. Setting rules and goals for yourself will set you up for success!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"245beacc-ee3a-493d-b877-1d01e540d195\"}":{"__typename":"School","uuid":"245beacc-ee3a-493d-b877-1d01e540d195","name":"Cherry Creek High School","city":"Greenwood Village","type":"HIGH","state":"Colorado","country":"United States","zip":"80111"},"Education:{\"uuid\":\"bbcd0866-9f64-456f-99e2-9920490a4353\"}":{"__typename":"Education","uuid":"bbcd0866-9f64-456f-99e2-9920490a4353","school":{"__ref":"School:{\"uuid\":\"245beacc-ee3a-493d-b877-1d01e540d195\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"48361cc9-655f-4662-ba15-672ab7df39ab\"}":{"__typename":"Education","uuid":"48361cc9-655f-4662-ba15-672ab7df39ab","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Applied Mathematics-Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"70381d06-7f00-408a-9f9f-b7733f468bab\"}":{"__typename":"MentorPublicProfile","uuid":"70381d06-7f00-408a-9f9f-b7733f468bab","displayName":"Iris W.","slug":"iris-wang","biography":"\u003cp\u003eHey hey! I'm Iris and I'm currently a junior studying Applied Math-Biology on the pre-med track at Brown University. Since high school I pursued my passion for a career in medicine, spending 300 hours volunteering at my local hospital. Other pursuits in high school included expanding a non-profit to 4 additional senior living centers and coordinating grant funding, taking 15 AP classes, and sprinting to 4th in state in the 300m hurdles for 2 years in a row. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Brown, I've been able to expand upon and grow my pre-med pursuits as well as indulge in other topics. I've been able to take courses in Applied Dynamical Systems and Immunology but also classes like American Literature and Advanced Spanish. I'm involved in Doctors Without Borders and the Varsity Track and Field team.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past summer I was able to attend my first research conference and present one of my abstracts on long intergenic non-coding RNA and its effects on external wound healing. This opportunity led me to my current work examining conditional entropy in VDJ recombination sites in a lab here at Brown. I was also able to shadow a craniofacial surgeon as well as work with a Rhode Island hospital on Alzhemier's outreach for their Memory and Aging Program. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLets connect over cooking, painting, skiing, a good romantic comedy, or your favorite local coffee shops (I'm always looking for recommendations!). I'd love to learn more about you, your passions, and any questions you might have about me!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditional links: https://www.linkedin.com/in/iris-wang-1a40071a9/\u003c/p\u003e","teachingVideoPlaybackId":"vGhVf6i417NV00tEs6LN02xnaYPq5kXRyj8IkLxaBTWAk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Mathematics-Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4756c62c-6e57-4a75-8055-9e415ceb8d98\"}"},{"__ref":"DeepDives:{\"uuid\":\"3b3e412a-05c3-46ef-a9a1-afe78c9fb1c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"977f6d14-da58-4c5e-b9ee-430b919299d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a021804-f15b-4146-9260-6719efd75801\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f0827941-afd2-41da-b96d-1dc41482a727/-/preview/-/format/jpg/","https://ucarecdn.com/72faddd0-978a-42d5-86a3-b6ae28b6b8c8/-/preview/-/format/jpg/","https://ucarecdn.com/940369cb-7d5a-4d76-b3a0-83802dd2af68/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","edu
