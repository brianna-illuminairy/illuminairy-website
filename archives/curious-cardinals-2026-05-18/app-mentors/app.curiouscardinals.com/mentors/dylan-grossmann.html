xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e9878e49-1fef-44aa-b573-65985784d549\"}":{"__typename":"Favorites","uuid":"e9878e49-1fef-44aa-b573-65985784d549","photoUrl":"https://ucarecdn.com/ad524870-6bd3-4bdd-bfc0-5d87da86a355/","title":"The Dark Knight","type":"MOVIE"},"Favorites:{\"uuid\":\"6410ddf7-8343-4135-a70c-151f5219d4e6\"}":{"__typename":"Favorites","uuid":"6410ddf7-8343-4135-a70c-151f5219d4e6","photoUrl":"https://ucarecdn.com/7be2acb9-f267-4750-b369-508975c889a6/","title":"Chicago","type":"CITY"},"Favorites:{\"uuid\":\"8569b6d1-d1b8-46f6-b516-0aa6b7c5a788\"}":{"__typename":"Favorites","uuid":"8569b6d1-d1b8-46f6-b516-0aa6b7c5a788","photoUrl":"https://ucarecdn.com/065ad093-bdde-4e39-a6fc-694226c477d4/","title":"Daisy Jones \u0026 The Six","type":"BOOK"},"CausesSupported:{\"uuid\":\"16040fe6-bd14-4b16-bd2e-f9c357819363\"}":{"__typename":"CausesSupported","uuid":"16040fe6-bd14-4b16-bd2e-f9c357819363","name":"Comfort Ahead","description":"\u003cp\u003eAs President and Founder of Comfort Ahead I facilitate all of our operations! \u003c/p\u003e","photoUrl":"https://ucarecdn.com/a5af0617-9878-47f2-a089-741c856f4377/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"520f38bc-0590-4346-b440-4f19f2384388\"}":{"__typename":"DeepDives","uuid":"520f38bc-0590-4346-b440-4f19f2384388","content":"\u003cp\u003eI would tell my middle school and high school self \"hey! slow down and never take any opportunity for granted!\" I think we can get so caught up in crossing things off a to-do list, that we forget how meaningful and rewarding learning and doing is. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d6fbe595-f1f9-47f7-9931-15db206c249a\"}":{"__typename":"DeepDives","uuid":"d6fbe595-f1f9-47f7-9931-15db206c249a","content":"\u003cp\u003eI want to write a memoir and I want people to read it. The work of Patti Smith, Judy Chicago, Tara Westover, and even Colin Jost, among others, fill my bookshelf. I am deeply interested in how the life stories of one person can inform the real life of another. I want to reflect on my life, in print, and I hope it can inspire a new way of thinking or living for others. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"244b5b02-4364-46af-bd19-230969f107c1\"}":{"__typename":"DeepDives","uuid":"244b5b02-4364-46af-bd19-230969f107c1","content":"\u003cp\u003eMentorship has been an integral part of achieving my goals thus far. I cannot overstate my gratitude to the countless mentors who have guided me, challenged me, and inspired my aspirations. It was the mentors I had who encouraged me to get involved in my community, start comfort ahead, apply to Penn, and sparked my interest in working in the art world. I could not have done it without them, and I want to provide that mentorship to others. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"86e9dbd8-a7ba-4c0b-b13c-7145077fe277\"}":{"__typename":"DeepDives","uuid":"86e9dbd8-a7ba-4c0b-b13c-7145077fe277","content":"\u003cp\u003eIn my spare time I like to take yoga or pilates classes, read my book-of-the-moment, and sit myself in a coffee shop to write in my little blue journal for hours and hours. Most especially, I like to wander aimlessly with my best friends, exploring, reading and trading books, sharing stories, and laughing about the silly intricacies of our days. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"1ab65370-5ce6-429b-9789-b25aa3bded10\"}":{"__typename":"School","uuid":"1ab65370-5ce6-429b-9789-b25aa3bded10","name":"Highland Park High School","city":"Highland Park","type":"HIGH","state":"Illinois","country":"United States","zip":"60035"},"Education:{\"uuid\":\"ae6ed66f-9765-41f1-80c5-622a907eb129\"}":{"__typename":"Education","uuid":"ae6ed66f-9765-41f1-80c5-622a907eb129","school":{"__ref":"School:{\"uuid\":\"1ab65370-5ce6-429b-9789-b25aa3bded10\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"895ba348-4865-491d-86dc-c3324b5915bb\"}":{"__typename":"Education","uuid":"895ba348-4865-491d-86dc-c3324b5915bb","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Art History","degree":null},"MentorPublicProfile:{\"uuid\":\"841c9401-9eab-4a03-bf9d-3f6d4da2bf34\"}":{"__typename":"MentorPublicProfile","uuid":"841c9401-9eab-4a03-bf9d-3f6d4da2bf34","displayName":"Dylan G.","slug":"dylan-grossmann","biography":"\u003cp\u003eIf there’s one thing you should know about me, it’s that I love asking questions– especially the kind that don’t have easy answers. I’m currently studying History of Art at The University of Pennsylvania, where I spend a lot of time thinking about how the art we see reflects the world we live in. Whether I'm writing about a new exhibition for\u003cem\u003e t-art magazine\u003c/em\u003e, organizing a career panel through the Art History Undergraduate Board, or parsing through a massive reading assignment, I'm always looking for ways to make art feel more approachable, exciting, and alive.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, I’m the founder of Comfort Ahead, a non profit that donates bedding to homeless shelters and refugee resettlement programs. What started as a deeply personal struggle with insomnia became a platform to provide something most people take for granted: a good night’s sleep. We’ve now helped hundreds of families across the country, and even launched chapters in multiple states!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m a big believer in community—whether it’s my team at Penn’s Arthur Ross Gallery, my cohort in the Penn Women in Leadership Program, or even the people on my campus tours, I always want everyone to feel comfortable and welcome. I try to bring that same energy into mentorship. I never learned best by sitting still and taking notes; I learn through conversation, curiosity, and hands-on engagement. That’s the kind of experience I hope to share.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether we’re talking about U.S. History, social impact, or anything in between, I'm here to meet students where they are, connecting big ideas to real-life impact. Not only answering big questions, but encouraging students to ask them themselves and to feel confident in the pursuit of answering them.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy proudest achievement is getting into a very selective art history class at Penn, where six students are able to go to the Venice Biennale (a very important biannual art exhibition) in Venice, Italy with their professor. The class is only open to upperclassman, but I was persistent with my application and the professor, and was able to be a part of the class. It was an amazing experience, and affirmed my passion for the major I had chosen. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e9878e49-1fef-44aa-b573-65985784d549\"}"},{"__ref":"Favorites:{\"uuid\":\"6410ddf7-8343-4135-a70c-151f5219d4e6\"}"},{"__ref":"Favorites:{\"uuid\":\"8569b6d1-d1b8-46f6-b516-0aa6b7c5a788\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"16040fe6-bd14-4b16-bd2e-f9c357819363\"}"}],"major":"Art History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"520f38bc-0590-4346-b440-4f19f2384388\"}"},{"__ref":"DeepDives:{\"uuid\":\"d6fbe595-f1f9-47f7-9931-15db206c249a\"}"},{"__ref":"DeepDives:{\"uuid\":\"244b5b02-4364-46af-bd19-230969f107c1\"}"},{"__ref":"DeepDives:{\"uuid\":\"86e9dbd8-a7ba-4c0b-b13c-7145077fe277\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3d13e4cd-a173-4f2f-8cf1-ce97eea9573d/-/preview/-/format/jpg/","https://ucarecdn.com/b4ab6029-7d10-4db5-b542-5ed39e352ffe/-/preview/-/format/jpg/","https://ucarecdn.com/69d78d23-ee6c-4c7b-b822-cfd0f9c7fe0a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ae6ed66f-9765-41f1-80c5-622a907eb129\"}"},{"__ref":"Education:{\"uuid\":\"895ba348-4865-491d-86dc-c3324b5915bb\"}"}],"hiredAt":"2025-05-09T10:40:46.372Z","topics":["K-5 Grade Math","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","K-6 Storybook","History Project","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"dylan-grossmann\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"841c9401-9eab-4a03-bf9d-3f6d4da2bf34\"}"}}},"_sentryTraceData":"d14b1c4430c540a6a13646813d112ba0-ba1cc2cbe1b4c30e-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d14b1c4430c540a6a13646813d112ba0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"dylan-grossmann"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
