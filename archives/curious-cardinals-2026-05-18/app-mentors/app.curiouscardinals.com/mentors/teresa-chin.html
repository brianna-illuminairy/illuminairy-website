xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"921fa9a7-5401-4a9f-8c75-b4c8008b3081\"}":{"__typename":"DeepDives","uuid":"921fa9a7-5401-4a9f-8c75-b4c8008b3081","content":"\u003cp\u003eComing from a community of refugees from Myanmar, I've witnessed the challenges that my people have faced in accessing quality education, healthcare, and other basic amenities. As a student and future physician, it is my goal to help bridge these gaps. Mentorship is one way to start. I'm excited to foster connections with students and help them find their passion!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8011962a-1748-4665-a946-74e5814306f8\"}":{"__typename":"DeepDives","uuid":"8011962a-1748-4665-a946-74e5814306f8","content":"\u003cp\u003eIn high school, I was very driven to succeed academically. I worked hard and also enjoyed activities like marching band, cooking for charity, and local church activities. I would say I bought into a particular culture or idea of success. Looking back, my hard work did pay off and I learned important skills such as time management, networking, and efficiency. As I get older, I'm glad that the \"why\" behind what I do has gotten more clear. As a mentor, I hope to help students find their \"why\" as well, on top of building skills needed for success.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7e447a54-8cab-4829-8673-c34d4279ad13\"}":{"__typename":"DeepDives","uuid":"7e447a54-8cab-4829-8673-c34d4279ad13","content":"\u003cp\u003eIn my free time I love to spend time with family and friends—whether by cooking a new recipe, hiking, playing pickleball, or watching a trashy reality show. Recently, I've also been watching One Piece! (I've got a long way to go!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9c794981-7e12-4b6a-94ef-38c8ee4dcbfd\"}":{"__typename":"School","uuid":"9c794981-7e12-4b6a-94ef-38c8ee4dcbfd","name":"Coppell High School","city":"Coppell","type":"HIGH","state":"Texas","country":"United States","zip":"75019"},"Education:{\"uuid\":\"524edb39-4883-4ace-a0a3-f4a17a91b561\"}":{"__typename":"Education","uuid":"524edb39-4883-4ace-a0a3-f4a17a91b561","school":{"__ref":"School:{\"uuid\":\"9c794981-7e12-4b6a-94ef-38c8ee4dcbfd\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}":{"__typename":"School","uuid":"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41","name":"Rice University","city":"Houston","type":"COLLEGE","state":"Texas","country":"United States","zip":"77005"},"Education:{\"uuid\":\"c3f5eae7-6cfc-4aa7-b523-5955fb2dbf6e\"}":{"__typename":"Education","uuid":"c3f5eae7-6cfc-4aa7-b523-5955fb2dbf6e","school":{"__ref":"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"903a9ea6-f92d-4394-b2b6-67ae315aa1e0\"}":{"__typename":"MentorPublicProfile","uuid":"903a9ea6-f92d-4394-b2b6-67ae315aa1e0","displayName":"Teresa C.","slug":"teresa-chin","biography":"\u003cp\u003eHi! My name is Teresa, and I am a pre-medical student who majored in neuroscience at Rice University. I hope to attend medical school next fall.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout college, I enjoyed researching neurodevelopmental disorders and exploring how different experiments can shed insight into diseases and help us create treatments for patients. I taught neuroscience to middle and high school students, honing the skill of making complex topics approachable and enjoyable for younger students. I am also passionate about using research to understand the needs and provide for underserved communities. This past year, I worked with refugees in Mizoram, India, exploring how political and social factors impact health outcomes and access to education. This international research broadened my perspective and deepened my commitment to advancing health \u0026amp; educational equity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I am active in my local community. I volunteer for a local hospice in Dallas, engaging with patients and families, and I also tutor low-income students through my church each week. In 2023, I also co-founded a club that raises awareness about hospice work and HIV/AIDS, allowing me to combine my passions for healthcare and community service.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about mentorship because I believe that each student has unlimited potential and unique gifts—they just need a little help in uncovering what that will exactly look like! Mentorship allows me to be part of that process and give back to others. My role is to create a supportive environment where students can build confidence in their abilities, find their passion, and feel empowered to tackle challenges. I am excited to make a positive impact on the lives of Curious Cardinals students to help them succeed and grow!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"921fa9a7-5401-4a9f-8c75-b4c8008b3081\"}"},{"__ref":"DeepDives:{\"uuid\":\"8011962a-1748-4665-a946-74e5814306f8\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e447a54-8cab-4829-8673-c34d4279ad13\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/174d9949-4b12-46aa-a78a-fef98742bebf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"524edb39-4883-4ace-a0a3-f4a17a91b561\"}"},{"__ref":"Education:{\"uuid\":\"c3f5eae7-6cfc-4aa7-b523-5955fb2dbf6e\"}"}],"hiredAt":"2024-10-22T05:16:27.066Z","topics":["Algebra I","Algebra II","K-5 Grade Math","Biology","STEM Project","Chemistry","Physics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"teresa-chin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"903a9ea6-f92d-4394-b2b6-67ae315aa1e0\"}"}}},"_sentryTraceData":"e4c503b35b8f46bcbf5cb1910761d008-a9415c85c10f337e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e4c503b35b8f46bcbf5cb1910761d008,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"teresa-chin"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName
