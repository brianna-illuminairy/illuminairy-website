xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8c7c22f1-da07-45c1-8923-5af25f0d81ca\"}":{"__typename":"DeepDives","uuid":"8c7c22f1-da07-45c1-8923-5af25f0d81ca","content":"\u003cp\u003eYou're doing an amazing job, keep going and put your best effort into everything you do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"28a5e309-bd4c-493a-bf54-f17915db4f7d\"}":{"__typename":"DeepDives","uuid":"28a5e309-bd4c-493a-bf54-f17915db4f7d","content":"\u003cp\u003eI joined my schools FRC and fell in love with robotics and mechanical engineering. I realized my passion for designing custom systems and having them execute percise motions. Having great leads that supported my journey really helped me decide on mechanical engineering.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"c03a1b5b-62b2-42c2-880e-62cac9b0be8c\"}":{"__typename":"DeepDives","uuid":"c03a1b5b-62b2-42c2-880e-62cac9b0be8c","content":"\u003cp\u003eI am Indian American who grew up in an extremely diverse city. I love embracing all cultures which allows me to better connect with people. I also know 3 languages and am working on learning 2 more which assists in my communication ability. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ddef54c6-4171-49dc-9d24-26d3104eae8c\"}":{"__typename":"DeepDives","uuid":"ddef54c6-4171-49dc-9d24-26d3104eae8c","content":"\u003cp\u003eI like to paint landscapes using realism and cook new varieties of foods. I enjoy being active and outdoors and love to play volleyball.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"adb980ca-49d2-4bec-a21a-ff7d2d360f59\"}":{"__typename":"School","uuid":"adb980ca-49d2-4bec-a21a-ff7d2d360f59","name":"Yonkers Middle High School","city":"Yonkers","type":"HIGH","state":"New York","country":"United States","zip":"10705"},"Education:{\"uuid\":\"3bfbb760-a5cc-4210-818f-bd1fbf698d49\"}":{"__typename":"Education","uuid":"3bfbb760-a5cc-4210-818f-bd1fbf698d49","school":{"__ref":"School:{\"uuid\":\"adb980ca-49d2-4bec-a21a-ff7d2d360f59\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"9538a9c8-6379-4580-ac4e-7bc50c555208\"}":{"__typename":"Education","uuid":"9538a9c8-6379-4580-ac4e-7bc50c555208","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"aa570529-837f-41cd-8189-58ffdbe5f8de\"}":{"__typename":"MentorPublicProfile","uuid":"aa570529-837f-41cd-8189-58ffdbe5f8de","displayName":"Nayana Z.","slug":"nayana-zachariah","biography":"\u003cp\u003eHi, my name is Nayana Zachariah, and I am a mechanical engineering student at Cornell University with a strong passion for robotics, aerospace technology, and innovative engineering design. I enjoy working on challenging technical problems and developing systems that combine analytical thinking with hands-on engineering. Through my coursework and extracurricular involvement, I have continued to strengthen my skills in modeling complex systems, mechanical design, and collaborative problem solving while developing a deeper understanding of how engineering can be applied to solve real-world problems.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOne of the most meaningful parts of my experience at Cornell has been my involvement with the Cornell Mars Rover team, where I work on AstroTech development. Being part of this project has allowed me to contribute to advanced robotic systems designed for space exploration applications while collaborating with students across multiple engineering disciplines. Through this experience, I have developed technical skills in system design, engineering analysis, and robotics while learning how to work effectively within a fast-paced and highly collaborative team environment. I especially enjoy the process of taking ideas from concept to implementation and solving the real-world challenges that come with complex engineering projects. Working on the Mars Rover team has also strengthened my ability to communicate technical ideas, adapt to evolving design challenges, and contribute within multidisciplinary engineering teams.\u0026nbsp;\u003c/p\u003e\u003cp\u003eBeyond my technical work, I am passionate about mentorship, leadership, and building supportive communities within engineering. I currently serve as a peer advisor, where I assist freshmen as they transition into Cornell’s rigorous academic environment. In this role, I help students navigate both academic and personal challenges while providing guidance, encouragement, and support throughout their adjustment to college life. This experience has strengthened my communication, mentorship, and leadership skills while allowing me to positively impact the student community.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am also the Director of Student Services within the Society of Women Engineers (SWE), where I organize both professional and recreational events that help engineering students at Cornell become more connected with one another. Through SWE, I work to foster a supportive and collaborative environment while creating opportunities for professional development, networking, and community building among students in STEM.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOverall, I am driven by curiosity, innovation, and the desire to create impactful technologies. I am excited to continue expanding my knowledge in robotics and mechanical systems while pursuing opportunities that challenge me both technically and personally.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"Imm00KUxF1nGkYrdqBhCmG71byj2SmWVPLzUhb1FIMbM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8c7c22f1-da07-45c1-8923-5af25f0d81ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"28a5e309-bd4c-493a-bf54-f17915db4f7d\"}"},{"__ref":"DeepDives:{\"uuid\":\"c03a1b5b-62b2-42c2-880e-62cac9b0be8c\"}"},{"__ref":"DeepDives:{\"uuid\":\"ddef54c6-4171-49dc-9d24-26d3104eae8c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1a95352f-854f-40aa-93f4-4eaaec5fcacd/-/preview/-/format/jpg/","https://ucarecdn.com/0c7a9346-9e87-4737-b61b-0b0d95e22644/-/preview/-/format/jpg/","https://ucarecdn.com/bd775f10-14
