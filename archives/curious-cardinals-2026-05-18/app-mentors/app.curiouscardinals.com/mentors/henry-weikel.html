ng, especially around the UK.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f8587fb5-b7e8-45fe-9f11-7ed5f0eaeb04\"}":{"__typename":"School","uuid":"f8587fb5-b7e8-45fe-9f11-7ed5f0eaeb04","name":"Dos Pueblos High School","city":"Goleta","type":"HIGH","state":"California","country":"United States","zip":"93117"},"Education:{\"uuid\":\"95024b7f-3974-46f6-a937-ab7cea739815\"}":{"__typename":"Education","uuid":"95024b7f-3974-46f6-a937-ab7cea739815","school":{"__ref":"School:{\"uuid\":\"f8587fb5-b7e8-45fe-9f11-7ed5f0eaeb04\"}"},"startYear":"2009","endYear":"2013","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518\"}":{"__typename":"School","uuid":"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518","name":"University of Oxford","city":"Oxford","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"OX1 2JD"},"Education:{\"uuid\":\"468ff946-2ac9-44e1-aea0-e71f24e433ac\"}":{"__typename":"Education","uuid":"468ff946-2ac9-44e1-aea0-e71f24e433ac","school":{"__ref":"School:{\"uuid\":\"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2020","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"7387baaf-384e-4f14-8e23-afd77af8b72d\"}":{"__typename":"MentorPublicProfile","uuid":"7387baaf-384e-4f14-8e23-afd77af8b72d","displayName":"Henry W.","slug":"henry-weikel","biography":"\u003cp\u003eHello, I'm Henry! After studying English at Berkeley (Bachelor's with High Honors) and Oxford (Master's with Distinction), I embarked on a career as a professional writer, working for a range of start-ups, universities, and publications. Through these experiences, I developed a keen appreciation of the importance of language in all fields—and a unique sense of the strategies held in common by successful academic, technical, and business writing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, with ten years of experience as a tutor, I enjoy teaching a wide range of subjects, covering college admissions, test prep, long term passion projects, and advanced coursework in the humanities and social sciences. In all of these fields, my focus is the same: helping students form an intense, personal, and lasting relationship with language. As a tutor, I've helped students tackle most major humanities and social sciences exams; as a writing instructor, I've taught courses at universities and high schools everywhere from Riyadh to Seoul; as an admissions consultant, I've helped dozens of students get accepted to undergraduate and graduate degrees at Harvard, Oxford, and other top programs; and as a debate coach, I've taught hundreds of students, including many state champions, at Berkeley, Stanford, and Andover. I tutored online consistently throughout my two degrees, so I have developed a set of strategies to help students get the most out of each session.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcross all of these experiences, I have learned that engaging, project-based instruction always leads to the best results. So whether you want to publish a piece of creative writing, start an academic blog for your research, get into a top college, or just ace your AP coursework, I'm looking forward to helping you use those longer term goals to build skills incrementally!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHere are a few recent projects that I've enjoyed helping students with:\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e- Writing an academic blog post on AI regulation policies\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- Self-publishing a collection of short stories\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- Writing the script for a podcast episode on Nietzsche\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- Creating a content strategy for a student's new business\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cbr\u003e\u00
