xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"988c0e3d-0189-437a-8a03-e0f797c5e333\"}":{"__typename":"Favorites","uuid":"988c0e3d-0189-437a-8a03-e0f797c5e333","photoUrl":"https://ucarecdn.com/ea33666e-dab0-474b-a51e-0df9b5f673ac/","title":"Leaving the Atocha Station","type":"BOOK"},"Favorites:{\"uuid\":\"e1da23d9-c312-465a-8d4c-b719f2cd59dd\"}":{"__typename":"Favorites","uuid":"e1da23d9-c312-465a-8d4c-b719f2cd59dd","photoUrl":"https://ucarecdn.com/2149be6f-3523-4534-a0c9-1744d35b2b36/","title":"The Princess Bride","type":"MOVIE"},"Favorites:{\"uuid\":\"c5ee666e-6c80-4429-91c8-3c5082092392\"}":{"__typename":"Favorites","uuid":"c5ee666e-6c80-4429-91c8-3c5082092392","photoUrl":"https://ucarecdn.com/085fea7f-0960-4ea5-9dab-93caf1b18c89/","title":"Dark Side of the Moon - Pink Floyd","type":"ALBUM"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"743785f7-d11d-4470-8b0b-6f19bbe4e38e\"}":{"__typename":"DeepDives","uuid":"743785f7-d11d-4470-8b0b-6f19bbe4e38e","content":"\u003cp\u003eMy mother has worked as a public school teacher for nearly the past 30 years—and not without plenty of challenges. But in the face of them all (even a years-long battle with cancer) she has always been the most empathetic and radiantly friendly person I've ever known. I hope to embody even a fraction of the example she has set for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"9ee9e9a1-3dc7-475b-91d6-ffbdfaad3a9b\"}":{"__typename":"DeepDives","uuid":"9ee9e9a1-3dc7-475b-91d6-ffbdfaad3a9b","content":"\u003cp\u003eNo one has ever guessed based on my accent or demeanor, but I was born and raised in a tiny town in rural Mississippi! It was an upbringing that taught me a lot, and it was nice to spend so much time in nature (at times I miss the tranquility of being alone by a forest creek or in a sun-lit field), but ever since graduating high school I've thrown myself headlong into new environments. I'd never left the US until sophomore year of college, but in the last three years alone I've visited 30 countries! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5efd4da1-eca0-496a-bcde-7fb7dff3c589\"}":{"__typename":"DeepDives","uuid":"5efd4da1-eca0-496a-bcde-7fb7dff3c589","content":"\u003cp\u003eI kept pretty busy during my high school summers! I worked side jobs, saving up for the school year. I was a waiter at a BBQ restaurant; I cut grass and power-washed buildings for my school; I practiced tennis (I was the team captain, so I had to keep my skills up); I baked in the Mississippi heat, marching a 35-pound set of tenor drums throughout band camp.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"24588507-7064-4921-ba28-0e600e8d4b0c\"}":{"__typename":"DeepDives","uuid":"24588507-7064-4921-ba28-0e600e8d4b0c","content":"\u003cp\u003ePut yourself out there! Try out whatever activities tempt you until you find yourself obsessed with something, practicing it relentlessly and aspiring to achieve greatness in it. Read for pleasure and your own edification and not only for school. Surround yourself with peers you want to learn from (there is truth to the Spanish proverb \"tell me who your friends are, and I will tell you who you are\"). More than anything, if you build a comfortability with tackling challenges that discomfort you, nothing can stand in your way (take it from the shy kid that now teaches public speaking).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"58761058-105c-48e8-9322-190e358ec51c\"}":{"__typename":"School","uuid":"58761058-105c-48e8-9322-190e358ec51c","name":"Quitman High School","city":"Quitman","type":"HIGH","state":"Mississippi","country":"United States","zip":"39355"},"Education:{\"uuid\":\"3736d5db-75cf-46f1-9de0-01b86cd9ab00\"}":{"__typename":"Education","uuid":"3736d5db-75cf-46f1-9de0-01b86cd9ab00","school":{"__ref":"School:{\"uuid\":\"58761058-105c-48e8-9322-190e358ec51c\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"853ead57-7f4f-4b69-9c30-9023e82a0d94\"}":{"__typename":"Education","uuid":"853ead57-7f4f-4b69-9c30-9023e82a0d94","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Social Studies","degree":null},"Testimonial:8b2401d5-7c37-4f4c-9129-5a55ae0e93ff":{"__typename":"Testimonial","id":"8b2401d5-7c37-4f4c-9129-5a55ae0e93ff","text":"Logan is kind, thoughtful and inspiring. Working with him has been a pleasure for my son and has opened him to new ideas and possibilities. He’s a great role model for any high schooler!","date":"2025-08-20 19:02:25.415+00","rating":5,"endorser":{"__typename":"Endorser","name":"Ann Klein","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"17834813-d7dc-474e-9cd1-002b09bf0312\"}":{"__typename":"MentorPublicProfile","uuid":"17834813-d7dc-474e-9cd1-002b09bf0312","displayName":"Logan K.","slug":"logan-kelly-1","biography":"\u003cp\u003eI started my academic career with an interest in understanding humanity in its full spectrum. Majoring in Social Studies, I studied how humans interact at the societal level through the disciplines of history, economics, government, and sociology. Still, I had questions about how we humans operate at a more intimate scale, so I minored in Mind/Brain/Behavior, tackling these questions through neuroscientific, psychological, and philosophical lenses.\u003c/p\u003e\u003cp\u003eI have eight years of teaching experience spanning from one-on-one test-prep tutoring sessions to public-speaking lectures delivered to classrooms of sixty. Education is so essential to my life that the first club I joined in college was Harvard Model Congress (HMC), a governmental simulation conference meant to develop the next generation of leaders through real-world practice. Through HMC, I've now taught hundreds of students in person on four separate continents and in eleven different countries.\u003c/p\u003e\u003cp\u003eToday, I am especially passionate about helping students make sense of difficult texts, especially those classics that form the bedrock of our modern-day literature, philosophy, and history. I firmly believe that engagement with the classics strengthens a student's mind in all applications; regardless of the particular goals of the student, consistent reading and analysis of philosophy and literature yield universally positive results.\u003c/p\u003e\u003cp\u003eTo this effect, I've recently dedicated much of my free time to reading the 'Great Books' that comprise the ancient intellectual conversation that has developed knowledge in nearly all academic fields: literature, mathematics, philosophy, history, etc. Learning geometry straight from Euclid's (beautifully illustrated) \u003cem\u003eElements\u003c/em\u003e is much more fun than sitting in a compulsory math class. Reading Aristotle's \u003cem\u003ePoetics\u003c/em\u003e alongside Shakespeare's \u003cem\u003eHenry V\u003c/em\u003e or Virginia Woolf's \"On Not Knowing Greek\" with to Euripides' \u003cem\u003eMedea\u003c/em\u003e allows one to connect places physically and temporally distant in one mind, to analyze competing traditions, and to see what is 'accidental' in individual societies/cultues/humans vs. what is essential to \u003cem\u003eall\u003c/em\u003e. Tremendous instruction and delight can be found in the classics (old and new), so I am more than happy to guide interested students towards that curiosity that pays off for a lifetime.\u003c/p\u003e\u003cp\u003eBefore graduating in May of 2024, I received the Frederick Sheldon Postgraduate Traveling Fellowship, which will support me in training in Brazilian Jiu-Jitsu in Rio de Janeiro for the next year. Following this, I plan on pursuing a Masters and PhD in Philosophy, sharpening my background in Metaphysics, Epistemology, and Philosophy of Mind. After this, I aim to become a professor and writer of philosophy and philosophical fiction. Throughout it all, I hope to continue living a life of learning.\u003c/p\u003e","teachingVideoPlaybackId":"CZgZV1TSv9leYEn01Jtj62cd8vwxxh3Tt200S4VItAFIU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn my final month of college, I won the Thomas Temple Hoopes Prize (awarded to ~4% of Harvard seniors) for my 100-page senior thesis analyzing the radical divergence in drug policy between Spain and Portugal. Over the previous summer, I had spent a month each in Lisbon and Madrid interviewing legislators, policy-architects, and health professionals—as well as diving into periodicals in their national libraries—to uncover the previously missing explanation.\u003c/p\u003e\u003cp\u003eThe challenges were manyfold. For example, I had to fly out to lead Harvard Model Congress Europe (a conference of ~500 college and high school students in Spain) the very same day the thesis was due, \u003cem\u003eand\u003c/em\u003e an airline strike resulted in the cancellation of a third of our staff's flights. We overcame that challenge through the strength of our board's teamwork and planning. In fact, the quantity and gravity of such challenges only made the reward of a \u003cem\u003esuccessful conference and thesis\u003c/em\u003e all the more gratifying.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"988c0e3d-0189-437a-8a03-e0f797c5e333\"}"},{"__ref":"Favorites:{\"uuid\":\"e1da23d9-c312-465a-8d4c-b719f2cd59dd\"}"},{"__ref":"Favorites:{\"uuid\":\"c5ee666e-6c80-4429-91c8-3c5082092392\"}"}],"causesSupported":[],"major":"Social Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"743785f7-d11d-4470-8b0b-6f19bbe4e38e\"}"},{"__ref":"DeepDives:{\"uuid\":\"9ee9e9a1-3dc7-475b-91d6-ffbdfaad3a9b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5efd4da1-eca0-496a-bcde-7fb7dff3c589\"}"},{"__ref":"DeepDives:{\"uuid\":\"24588507-7064-4921-ba28-0e600e8d4b0c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/10843a51-33af-4f10-a421-bd112fc11aa8/-/preview/-/format/jpg/","https://ucarecdn.com/af627eab-161d-43a2-9bd8-fd28239207e0/-/preview/-/format/jpg/","https://ucarecdn.com/36985a5b-a798-4b90-a501-878bad6131d7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3736d5db-75cf-46f1-9de0-01b86cd9ab00\"}"},{"__ref":"Education:{\"uuid\":\"853ead57-7f4f-4b69-9c30-9023e82a0d94\"}"}],"hiredAt":"2024-10-15T00:31:02.816Z","topics":["Philosophy","Public Speaking","Debate","World Cultures","Law / Government / Policy","Journalism"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:8b2401d5-7c37-4f4c-9129-5a55ae0e93ff"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"logan-kelly-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"17834813-d7dc-474e-9cd1-002b09bf0312\"}"}}},"_sentryTraceData":"9c944598a43e4d1bac425f5fc52ff256-a981890d56bcf135-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9c944598a43e4d1bac425f5fc52ff256,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"logan-kelly-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
