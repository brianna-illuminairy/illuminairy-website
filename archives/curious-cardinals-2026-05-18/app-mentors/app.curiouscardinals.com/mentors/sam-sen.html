xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"90881c60-101a-45b1-92fc-331ac3c50886\"}":{"__typename":"DeepDives","uuid":"90881c60-101a-45b1-92fc-331ac3c50886","content":"\u003cp\u003eI chose Materials Science and Engineering because it builds directly on my background in physics and engineering while being more applied. During undergrad, I liked understanding how materials behave from a physics perspective, but I wanted to work in a field where that knowledge connects more clearly to real applications.\u003c/p\u003e\u003cp\u003eMaterials science sits between theory and practice. It lets me use the physics I already know while working on materials that are designed, processed, and tested for specific uses. I’m especially interested in biomaterials because it combines engineering principles with biological and medical applications, which makes the work both challenging and practical.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b49a0347-b44b-4808-9095-b0bf7a2b24a9\"}":{"__typename":"DeepDives","uuid":"b49a0347-b44b-4808-9095-b0bf7a2b24a9","content":"\u003cp\u003eMentorship matters to me because having someone explain things clearly and meet you where you are can make a huge difference. Throughout my own academic experience, I’ve seen how confusing or overwhelming things can feel without guidance, especially in technical subjects. Having access to someone who’s willing to slow down, answer questions, and talk through problems makes learning a lot more manageable.\u003c/p\u003e\u003cp\u003eI value mentorship because it’s not just about getting help with content, but about building confidence and learning how to approach challenges more thoughtfully. A good mentor helps make things feel less intimidating and more doable, and that kind of support can change how someone engages with school or a project long term.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"fd8efeb2-278a-4316-af90-965d2d5e7908\"}":{"__typename":"DeepDives","uuid":"fd8efeb2-278a-4316-af90-965d2d5e7908","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is helping improve medical devices through work in biomaterials and bioelectronics, especially in ways that make treatment more effective and more accessible. A lot of current medical technologies work, but many are expensive, difficult to maintain, or limited by the materials they use.\u003c/p\u003e\u003cp\u003eI’m interested in developing or improving materials that interact better with the body while also being more durable and practical, which can help reduce costs and expand access. Whether it’s in medical testing, treatment devices, or long-term implants, I’d like my work to focus on making technologies that are not only innovative, but usable and available to more people!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9d7cd157-80f1-4c74-83fb-8934ad6daf22\"}":{"__typename":"DeepDives","uuid":"9d7cd157-80f1-4c74-83fb-8934ad6daf22","content":"\u003cp\u003eIn my spare time,  I love traveling, trying new foods, and checking out different coffee shops. I’m a big coffee person! So I like making different cold brews and syrups at home. I also really enjoy cooking and trying new recipes, especially dishes from different cuisines.\u003c/p\u003e\u003cp\u003eI love going to concerts, listening to music, and watching shows and movies. \u003cem\u003eGilmore Girls\u003c/em\u003e is my all-time favorite, and I’m absolutely a comfort-show rewatcher. I also really enjoy spending time with my friends, whether that’s going out, cooking together, or just hanging out and talking!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"b8a0d649-e613-4868-908d-0e50b42fa8ee\"}":{"__typename":"School","uuid":"b8a0d649-e613-4868-908d-0e50b42fa8ee","name":"Lakeland High School","city":"Shrub Oak","type":"HIGH","state":"New York","country":"United States","zip":"10588"},"Education:{\"uuid\":\"619e23d1-fa53-4023-8726-053bd00ca9bb\"}":{"__typename":"Education","uuid":"619e23d1-fa53-4023-8726-053bd00ca9bb","school":{"__ref":"School:{\"uuid\":\"b8a0d649-e613-4868-908d-0e50b42fa8ee\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"7dbdec61-1df2-4d0d-a460-5b315820efcb\"}":{"__typename":"School","uuid":"7dbdec61-1df2-4d0d-a460-5b315820efcb","name":"Binghamton University","city":"Binghamton","type":"COLLEGE","state":"New York","country":"United States","zip":"13902"},"Education:{\"uuid\":\"9bf5c370-67f0-4109-a050-b081f98dd451\"}":{"__typename":"Education","uuid":"9bf5c370-67f0-4109-a050-b081f98dd451","school":{"__ref":"School:{\"uuid\":\"7dbdec61-1df2-4d0d-a460-5b315820efcb\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Physics \u0026 engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"3ce60a4e-5c99-4d78-8920-aa828c022306\"}":{"__typename":"MentorPublicProfile","uuid":"3ce60a4e-5c99-4d78-8920-aa828c022306","displayName":"Sam s.","slug":"sam-sen","biography":"\u003cp\u003eHi, I’m Sam! I’m a Materials Science and Engineering master’s student at the University of Pennsylvania, and I studied physics and engineering as an undergrad at Binghamton University. Right now, I’m doing independent research in the HWANG Lab at Penn, where I work on polymer and ceramic composite materials for dental restorative applications. I also work in the chairman's office at Penn Dermatology, where I handle grants and digital design. A lot of my work is hands-on and problem-based, which is part of why I enjoy breaking down complex ideas in a clear and practical way!\u003c/p\u003e\u003cp\u003eI’m interested in academic tutoring and passion project coaching. This includes working through math and physics topics, as well as supporting creative or communication-based projects by helping students organize ideas and figure out next steps. I’m drawn to work that involves explaining concepts clearly, thinking through problems step by step, and helping ideas feel more manageable.\u003c/p\u003e\u003cp\u003eThroughout my academic life, I’ve spent a lot of time tutoring and teaching in different settings. I’ve worked one on one with students, in small groups, and in classroom or enrichment programs. My experience includes tutoring math and science, working at Mathnasium, and teaching in camp and classroom environments. I’ve also been involved in outreach programs where I helped design hands-on activities to explain physics concepts to younger students. These experiences shaped how I approach teaching, with a focus on clarity and patience.\u003c/p\u003e\u003cp\u003eMy sessions are structured but relaxed. I don’t assume prior knowledge, and I’m always open to revisiting something if it’s not clicking yet. I like breaking problems down, talking through the reasoning, and helping students build habits they can use across classes. For larger assignments or projects, I focus on making things feel organized and doable.\u003c/p\u003e\u003cp\u003eOutside of school, I really enjoy traveling and trying new places. One of my favorite trips was to Switzerland! I also love exploring different cuisines, checking out new coffee shops, going to concerts, and watching movies.\u003c/p\u003e\u003cp\u003eIf you’re looking for someone who’s knowledgeable, calm, and easy to talk to, I’d be happy to work with you!                                                                                                                                                                                                   \u003c/p\u003e","teachingVideoPlaybackId":"n6aGBdlhl4LuUhgl02iI6bim02yKIwVcYTvQpkWN00CyoU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Physics \u0026 engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"90881c60-101a-45b1-92fc-331ac3c50886\"}"},{"__ref":"DeepDives:{\"uuid\":\"b49a0347-b44b-4808-9095-b0bf7a2b24a9\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd8efeb2-278a-4316-af90-965d2d5e7908\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d7cd157-80f1-4c74-83fb-8934ad6daf22\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5d61f044-4efc-4ed3-838f-8b1c5a3b873f/-/preview/-/format/jpg/","https://ucarecdn.com/97ecd1a8-e595-4188-a4c3-e098ab33309f/-/preview/-/format/jpg/","https://ucarecdn.com/04d591cb-8ce2-42c0-a80d-b0ab0972637c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"619e23d1-fa53-4023-8726-053bd00ca9bb\"}"},{"__ref":"Education:{\"uuid\":\"9bf5c370-67f0-4109-a050-b081f98dd451\"}"}],"hiredAt":"2026-01-28T18:14:39.361Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Calculus","Precalculus / Trigonometry","Physics","6-8 Grade Science","Academic Coaching","Executive Function","K-6 Storybook","STEM Project","Sustainability"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sam-sen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3ce60a4e-5c99-4d78-8920-aa828c022306\"}"}}},"_sentryTraceData":"bdcdccd3ae0a49f8a8ad5acf5671154a-b71a6d672a57c068-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=bdcdccd3ae0a49f8a8ad5acf5671154a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sam-sen"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
