xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"12b205df-9c03-4e59-acb5-17a95e2530d0\"}":{"__typename":"DeepDives","uuid":"12b205df-9c03-4e59-acb5-17a95e2530d0","content":"\u003cp\u003eMy grandfather and grandmother are my greatest role models. They immigrated to the US not knowing what they were getting into and worked tirelessly to guarantee a future for their kids and ultimately me. They are my motivation to work hard every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"25d06e2e-00c5-4210-bcc6-ab1165f5eebb\"}":{"__typename":"DeepDives","uuid":"25d06e2e-00c5-4210-bcc6-ab1165f5eebb","content":"\u003cp\u003eI was quiet, I never really liked raising my hand in class unless I was 100% confident I knew the answer, and even then it was rare. Some great teachers and interesting subjects helped me find a passion for government and other subjects in school. I was also on the basketball team, in which I averaged a record-low 0.2 points per game.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d4de53e2-8d95-4cb9-a62d-6e182954a680\"}":{"__typename":"DeepDives","uuid":"d4de53e2-8d95-4cb9-a62d-6e182954a680","content":"\u003cp\u003eI spent my summers mostly working; I found that I learned more invaluable life skills int he restaurants I worked in then in any classroom I had been in. Experiencing the real world and meeting real people helped shape my perspective on the world and drove my passion for policy as well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2dab889a-dfcf-477b-880a-0d27605693ed\"}":{"__typename":"DeepDives","uuid":"2dab889a-dfcf-477b-880a-0d27605693ed","content":"\u003cp\u003eDon't be afraid to try new things. The world has so much to offer, and the fear of the unknown cannot be the reason you go through life without experiencing all that you can. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"fddcdb7b-0940-4592-b7e1-93c17e81f204\"}":{"__typename":"School","uuid":"fddcdb7b-0940-4592-b7e1-93c17e81f204","name":"School Without Walls","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20037"},"Education:{\"uuid\":\"aedd4e9f-7a3e-4a50-89bd-2f2f8192481c\"}":{"__typename":"Education","uuid":"aedd4e9f-7a3e-4a50-89bd-2f2f8192481c","school":{"__ref":"School:{\"uuid\":\"fddcdb7b-0940-4592-b7e1-93c17e81f204\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"e4c1b3ea-a821-41d0-b3f4-1d7026cd900f\"}":{"__typename":"Education","uuid":"e4c1b3ea-a821-41d0-b3f4-1d7026cd900f","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Statistics \u0026 Public Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"b559aece-285f-4296-b2d9-ac838da524c1\"}":{"__typename":"MentorPublicProfile","uuid":"b559aece-285f-4296-b2d9-ac838da524c1","displayName":"James S.","slug":"james-setty","biography":"\u003cp\u003eHey! I'm James and I am from Washington DC. I am studying statistics and public policy at Duke University and I want to work in Government in the future. Outside of school, I love playing basketball, chess, video games, and hanging out with friends. I've worked as a mentor in many different capacities: whether it be as a captain on the basketball team, teaching phonics to students from marginalized communities, or founding a club delegation that appeared at a national conference; I have always strived to mentor with the philosophy of guiding everyone's unique path rather than forcing mentees into roles or situations that didn't fit them. I'm super excited to get to work with you and be a part of your academic journey!\u003c/p\u003e","teachingVideoPlaybackId":"SwGkpCVwQX3aoLfRprbg83eCXg5oh1TrovTBghI79hg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics \u0026 Public Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"12b205df-9c03-4e59-acb5-17a95e2530d0\"}"},{"__ref":"DeepDives:{\"uuid\":\"25d06e2e-00c5-4210-bcc6-ab1165f5eebb\"}"},{"__ref":"DeepDives:{\"uuid\":\"d4de53e2-8d95-4cb9-a62d-6e182954a680\"}"},{"__ref":"DeepDives:{\"uuid\":\"2dab889a-dfcf-477b-880a-0d27605693ed\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/12b1bddb-2be2-4439-9cd8-1eafe0309391/-/preview/-/format/jpg/"],"pro
