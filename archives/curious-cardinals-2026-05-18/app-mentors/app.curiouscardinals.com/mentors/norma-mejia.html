xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"eb956ae0-cbc0-4ca0-835c-8eb460bda8e6\"}":{"__typename":"Favorites","uuid":"eb956ae0-cbc0-4ca0-835c-8eb460bda8e6","photoUrl":"https://ucarecdn.com/d5c53575-404a-42c7-b90e-7b044b44d4b7/","title":"Jenna Ortega","type":"ACTOR"},"Favorites:{\"uuid\":\"40007d9b-40ec-48fe-838a-4f0987b069dd\"}":{"__typename":"Favorites","uuid":"40007d9b-40ec-48fe-838a-4f0987b069dd","photoUrl":"https://ucarecdn.com/666c52a1-a587-4e66-8912-92e9ff3f18c8/","title":"DtMF by Bad bUnny","type":"ALBUM"},"Favorites:{\"uuid\":\"0fd6764c-851c-4c1f-884c-7190522c13a2\"}":{"__typename":"Favorites","uuid":"0fd6764c-851c-4c1f-884c-7190522c13a2","photoUrl":"https://ucarecdn.com/76ab2658-0f2e-4375-a08e-1d961cfc2bc7/","title":"Bad Bunny","type":"ARTIST"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"7759ad9c-14e3-40bf-a228-17a9ee13d839\"}":{"__typename":"DeepDives","uuid":"7759ad9c-14e3-40bf-a228-17a9ee13d839","content":"\u003cp\u003eI know what it feels like to follow a creative path without a clear guide. Even now, as a senior in college studying film, I’m still learning new things about the industry and often wish I’d had more support before college. Mentorship is my way of giving students that head start — creating a space where they feel encouraged, curious, and confident enough to bring their ideas to life. I care deeply about making creative opportunities accessible, and I love helping students discover that their passions are worth pursuing, no matter how big or small.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a47ac90d-a151-4263-a7f9-91847ccf25bd\"}":{"__typename":"DeepDives","uuid":"a47ac90d-a151-4263-a7f9-91847ccf25bd","content":"\u003cp\u003eI chose film because I’ve always been fascinated by the way stories connect people. Growing up, movies were my window into different worlds and perspectives, and I wanted to learn how to create that same impact for others. Film combines so many things I love — writing, visuals, sound, and collaboration — and it challenges me to keep experimenting and finding new ways to express ideas. Along the way, it’s also opened the door for me to explore other creative mediums like photography and podcasting, which have deepened my love for storytelling even more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"63b771c5-33ae-4257-b519-3b96d78ac691\"}":{"__typename":"DeepDives","uuid":"63b771c5-33ae-4257-b519-3b96d78ac691","content":"\u003cp\u003eCurrently, I am working on a short German Expressionist–inspired film, which I’m shooting on Super 8mm film. I’m experimenting with how light, shadow, and movement can create mood and emotion in the surreal, distorted style of that era. Working with film instead of digital has been a challenge, but it pushes me to think carefully about every frame and embrace creativity within limitations. This project excites me because it’s a chance to explore the roots of cinema while discovering new ways to bring my own ideas to life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b7866822-c7cf-428a-b7e0-9a6459b80455\"}":{"__typename":"DeepDives","uuid":"b7866822-c7cf-428a-b7e0-9a6459b80455","content":"\u003cp\u003eIn my spare time, I love hanging out with friends—whether that’s having game nights, cooking together, or just catching up. I also really enjoy traveling, from exploring new countries to taking little day trips wherever I’m living at the time!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e2333d3d-4b7a-45e6-a9f1-afd4f4d6e193\"}":{"__typename":"School","uuid":"e2333d3d-4b7a-45e6-a9f1-afd4f4d6e193","name":"YES Prep East End Secondary","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77012"},"Education:{\"uuid\":\"1a85c3f3-1c1e-480a-9ee0-71ee5413563a\"}":{"__typename":"Education","uuid":"1a85c3f3-1c1e-480a-9ee0-71ee5413563a","school":{"__ref":"School:{\"uuid\":\"e2333d3d-4b7a-45e6-a9f1-afd4f4d6e193\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}":{"__typename":"School","uuid":"843cb79b-75a7-4415-89cc-0166c307ba4b","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"CT","country":"USA","zip":"06511"},"Education:{\"uuid\":\"4637a3ef-d899-4d01-8ad0-3d6ff99d6efa\"}":{"__typename":"Education","uuid":"4637a3ef-d899-4d01-8ad0-3d6ff99d6efa","school":{"__ref":"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Film and Media Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"b852734e-f66f-4e44-90da-d5a3f93ac3a5\"}":{"__typename":"MentorPublicProfile","uuid":"b852734e-f66f-4e44-90da-d5a3f93ac3a5","displayName":"Norma M.","slug":"norma-mejia","biography":"\u003cp\u003eHi! My name is Norma, and I’m a senior at Yale University majoring in Film \u0026amp; Media Studies. At my core, I’m a storyteller—I love the way stories connect people, spark imagination, and make the world feel a little smaller and brighter. Whether it’s through filmmaking, screenwriting, photography, or even podcasting, I’m always exploring new ways to capture experiences and share them with others.\u003c/p\u003e\u003cp\u003eOne of the most meaningful parts of my college journey has been studying and traveling abroad. In early 2024, I spent four months in Barcelona before heading to the University of Cambridge for the summer, all while traveling across Europe during those eight months. In 2025, I continued this spirit of exploration by spending time in Mexico City, where I immersed myself in community life and drew inspiration for my senior thesis, and in Taiwan, where I explored street photography as a way of capturing fleeting moments and everyday beauty. These experiences shaped me not just as a filmmaker but as a person—teaching me how to adapt, listen, and find inspiration in unexpected places.\u003c/p\u003e\u003cp\u003eRight now, I am working on my senior thesis: an experimental anthology of short films shot across different formats—from Super 8mm film to camcorders to 6K digital cameras. The project questions what we think of as “quality” in filmmaking and explores how powerful stories can be made with any kind of equipment. It reflects my belief that creativity isn’t limited by resources, but rather fueled by curiosity and passion.\u003c/p\u003e\u003cp\u003eOutside of academics, I’m someone who loves making memories in everyday life. I enjoy hanging out with friends, hosting game nights, and planning little adventures—whether it’s traveling to a new country or taking a spontaneous day trip nearby. Photography helps me capture these moments, while writing gives me a chance to reflect on them and build stories out of my lived experiences. I see myself as a multifaceted creative, always curious and always excited to learn.\u003c/p\u003e\u003cp\u003eAs a mentor, I am committed to bringing this same warmth and enthusiasm to the students I work with. I know firsthand how overwhelming it can feel to choose a creative path without a clear roadmap, and I want my students to feel supported, encouraged, and empowered as they discover their own voices. My hope is that through mentorship, I can be both a guide and a cheerleader—someone who helps students dream big, try new things, and see the value in the stories only they can tell.\u003c/p\u003e","teachingVideoPlaybackId":"fsEhP96IBrCc2JXfa00h6HpTNrf4Q7jzfNGNGVfudpMI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is being selected for my first gallery exhibition! My travel photography will be part of a group exhibition at the Glasgow Gallery of Photography in January 2026. It’s such an exciting opportunity to share my work publicly, and it reminds me why I love documenting the world. Achievements like this inspire me to keep creating, experimenting, and helping students bring their own projects to life. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"eb956ae0-cbc0-4ca0-835c-8eb460bda8e6\"}"},{"__ref":"Favorites:{\"uuid\":\"40007d9b-40ec-48fe-838a-4f0987b069dd\"}"},{"__ref":"Favorites:{\"uuid\":\"0fd6764c-851c-4c1f-884c-7190522c13a2\"}"}],"causesSupported":[],"major":"Film and Media Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7759ad9c-14e3-40bf-a228-17a9ee13d839\"}"},{"__ref":"DeepDives:{\"uuid\":\"a47ac90d-a151-4263-a7f9-91847ccf25bd\"}"},{"__ref":"DeepDives:{\"uuid\":\"63b771c5-33ae-4257-b519-3b96d78ac691\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7866822-c7cf-428a-b7e0-9a6459b80455\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0
