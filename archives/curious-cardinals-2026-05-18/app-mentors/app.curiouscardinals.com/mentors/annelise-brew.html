xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"cdcbe526-6347-40d3-885b-7e7e1fdd12a9\"}":{"__typename":"DeepDives","uuid":"cdcbe526-6347-40d3-885b-7e7e1fdd12a9","content":"\u003cp\u003ePlaying competitive soccer, hiking every trail in my town during lockdown, becoming a camp counselor, and spending time with family.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"7e82fe1e-7d8f-4d90-a97e-fe81be796968\"}":{"__typename":"DeepDives","uuid":"7e82fe1e-7d8f-4d90-a97e-fe81be796968","content":"\u003cp\u003eMy mom! She's not only my best friend, but also an incredible head and neck surgeon, mentor to underrepresented communities in medical school, and a former track runner. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"dba3ee0e-1c0c-493f-8c46-589bf9dc05c3\"}":{"__typename":"DeepDives","uuid":"dba3ee0e-1c0c-493f-8c46-589bf9dc05c3","content":"\u003cp\u003eYou will always find me outdoors. Whether I'm running, hiking, skiing, biking, or swimming, I'm always the happiest exploring beautiful areas.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"ad62ed52-531c-4654-9b00-1e98baf13f80\"}":{"__typename":"DeepDives","uuid":"ad62ed52-531c-4654-9b00-1e98baf13f80","content":"\u003cp\u003eProfessional ice cream taste tester. And if that doesn't work out (or pay the bills), a managing director at a private equity firm.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"95382ea5-a697-4bd5-a482-710ba9431b33\"}":{"__typename":"School","uuid":"95382ea5-a697-4bd5-a482-710ba9431b33","name":"Sacred Heart Schools, Atherton","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"68ec97a6-794b-4471-ad7c-224c34edb3aa\"}":{"__typename":"Education","uuid":"68ec97a6-794b-4471-ad7c-224c34edb3aa","school":{"__ref":"School:{\"uuid\":\"95382ea5-a697-4bd5-a482-710ba9431b33\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d728b8f9-6533-4db5-98be-3c7c5d90ebe8\"}":{"__typename":"Education","uuid":"d728b8f9-6533-4db5-98be-3c7c5d90ebe8","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Management Science \u0026 Engineering, Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"31312920-c456-4a5d-a919-6e48e3fb8da7\"}":{"__typename":"MentorPublicProfile","uuid":"31312920-c456-4a5d-a919-6e48e3fb8da7","displayName":"Ellie B.","slug":"annelise-brew","biography":"\u003cp\u003eEllie Brew is a junior at Stanford University studying Management Science \u0026amp; Engineering and Computer Science. Ellie is passionate about fostering female representation in traditionally male-dominated fields. As the president of Stanford Women in Finance, a club with over 500 active members, she works to bridge the gender gap in finance, inspiring young women to pursue a career in this sector.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of her academic and leadership roles, Ellie is an avid runner who has explored every trail within a 10-mile radius of Stanford’s campus while training for marathons. Her love for the outdoors also inspired a high school passion project, in collaboration with a beloved teacher, to fundraise for land conservation efforts supporting a local indigenous tribe, blending her interests in sustainability and community outreach.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn 2022, Ellie graduated from Sacred Heart Preparatory in Atherton, CA as a National Merit Scholar and AP Scholar with Distinction. She was co-captain of the varsity soccer team and led the Women’s group, a club focusing on gender equity and fostering dialogue around global women’s issues through lunchtime discussions.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHer work experience includes internships at Fortress Investment Group and JMI Equity, where she gained experience in private credit and software growth equity, respectively. She has also conducted research on sustainable water management in the Central Coast of California at Stanford’s Bill Lane Center for the American West.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether she is hiking, tackling the NYT crossword puzzle, or experimenting with new recipes with ingredients from the local farmer’s market, Ellie approaches every opportunity with dedication and curiosity. Inspired by her mother’s career in medicine and her father’s advocacy for women in finance, she hopes to continue empowering young women to break barriers and reach their fullest potential.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"sSlSYu02KkDpkTQVE01iNxN94ixG99eMils7ibs02rJ02Zo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Management Science \u0026 Engineering, Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cdcbe526-6347-40d3-885b-7e7e1fdd12a9\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e82fe1e-7d8f-4d90-a97e-fe81be796968\"}"},{"__ref":"DeepDives:{\"uuid\":\"dba3ee0e-1c0c-493f-8c46-589bf9dc05c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"ad62ed52-531c-4654-9b00-1e98baf13f80\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/792be9c8-999b-408f-892a-60a65712517c/-/preview/-/format/jpg/","https://ucarecdn.com/12ac6342-d4ed-4d6b-b3fa-2fb49dfe8d84/-/preview/-/format/jpg/","https://ucarecdn.com/198352a6-1cfd-4297-9fde-92d8661ffd5b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"68ec97a6-794b-4471-ad7c-224c34edb3aa\"}"},{"__ref":"Education:{\"uuid\":\"d728b8f9-6533-4db5-98be-3c7c5d90ebe8\"}"}],"hiredAt":"2024-10-09T09:47:50.292Z","topics":["Finance / Investing","Business / Entrepreneurship","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Calculus","Algebra I","Algebra II","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"annelise-brew\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"31312920-c456-4a5d-a919-6e48e3fb8da7\"}"}}},"_sentryTraceData":"fe950b6fefb943bd9900bc12abf31005-9ab349112c19102d-1","_sentryBaggage":"sentry-enviro
