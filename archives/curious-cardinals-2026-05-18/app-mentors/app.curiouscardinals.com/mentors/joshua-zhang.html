xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"dd1b33f9-e684-4050-b2f0-b6a1a42563c8\"}":{"__typename":"Favorites","uuid":"dd1b33f9-e684-4050-b2f0-b6a1a42563c8","photoUrl":"https://ucarecdn.com/89b0c7b0-043d-4ea6-a519-dad1c03fab90/","title":"Pitch Perfect","type":"MOVIE"},"Favorites:{\"uuid\":\"9bb012d3-d462-49ac-b871-04d38699c3f4\"}":{"__typename":"Favorites","uuid":"9bb012d3-d462-49ac-b871-04d38699c3f4","photoUrl":"https://ucarecdn.com/2134e6bb-2158-4016-90f7-a9b40ee8047f/","title":"LA Dodgers","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"0a19c210-0093-4164-9c0e-7c4d0973a359\"}":{"__typename":"CausesSupported","uuid":"0a19c210-0093-4164-9c0e-7c4d0973a359","name":"Christian Community Action","description":"\u003cp\u003eCCA provides help, hope, \u0026amp; housing to families in New Haven.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/34c4733b-5ba5-438c-b495-4c2311a794d0/"},"CausesSupported:{\"uuid\":\"0808c3b4-06d9-4181-b36f-e4f984fa1ae6\"}":{"__typename":"CausesSupported","uuid":"0808c3b4-06d9-4181-b36f-e4f984fa1ae6","name":"World Vision","description":"\u003cp\u003eWorking with children and families to uproot poverty and create better futures.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/5af12a3c-b463-4e43-93fe-37791751cb8d/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9cb5adb7-fba3-448c-a4eb-6dc4773514c8\"}":{"__typename":"DeepDives","uuid":"9cb5adb7-fba3-448c-a4eb-6dc4773514c8","content":"\u003cp\u003eRelax, take a deep breath! I have some good news for you: there's no singular college, achievement, or opportunity that has a monopoly on the path to success!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a teenager attending an intense, high-pressure public school, I distinctly remember how each rejection from a summer program or internship or club leadership role felt like a deadly sting. Yet as I’ve gone through college and begun to see how life can never truly be linear, I’ve come to better understand and even appreciate the unique path that I’ve taken to get to where I am. Hearing about the stories of older adults has also encouraged me and shown me that there are so many ways to achieve any one particular goal. So the next time you are applying to something and feel like you couldn’t live without having a specific experience or pedigree, don’t fret, because that’s not true!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0d353157-fb19-411b-87fd-c89556dfaa38\"}":{"__typename":"DeepDives","uuid":"0d353157-fb19-411b-87fd-c89556dfaa38","content":"\u003cp\u003eComputer Science and Economics is one of a handful of joint majors at Yale, and I chose it because of my fascination with each of the two subject areas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eComputer Science was a subject I dabbled in during high school and I enjoyed the uniquely tangible aspect of it, where you can see the product of your work in a very concrete way (i.e. a program, a website, a game you’ve built, etc.). Additionally, growing up in an increasingly digitized world, I wanted to better understand how the various kinds of technology in our lives work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEconomics at its core is all about why people make the decisions they do, and for that reason, I believe it is a critical subject to better understand the world we live in. Every individual, business, or organization is motivated by different kinds of incentives, whether those incentives are tangible or not. Being able to recognize and analyze these incentives is an invaluable skillset I can apply in every circumstance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"4ea3113c-f9e9-4e0d-b51f-ad6f7abd95ba\"}":{"__typename":"DeepDives","uuid":"4ea3113c-f9e9-4e0d-b51f-ad6f7abd95ba","content":"\u003cp\u003eMy greatest source of motivation in life is my Christian faith, which pushes me to love and care for others in the same way God does for me. I believe that God has given the world the greatest gift that exists — His son Jesus Christ, who lived a perfect life and died for our sins so that we could have eternal life and a hope that overcomes the fear of death! With the hope, joy, and peace I have in this truth, I strive to serve others and live my life sacrificially in all that I do, whether I’m working on a group project with someone or helping my family member with the dishes. I believe that the purpose of my life is to serve God and others, and it pushes me towards patience, kindness, and compassion, even when life gets hard.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"ae3a9b92-6c1d-499b-8c6d-0004f90d9c9f\"}":{"__typename":"DeepDives","uuid":"ae3a9b92-6c1d-499b-8c6d-0004f90d9c9f","content":"\u003cp\u003eMentorship has deeply impacted me from my early childhood to my time in college thus far, and it has had a profound positive impact on who I am today. Mentors throughout my life have taught me everything from the beauty of conversation and being curious about others to the inner workings of the legal system and procedures in mock trial.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I’ve stepped into various teaching or mentoring roles myself, I’ve constantly been pushed outside of my own comfort zone while simultaneously learning more about others and the world around me. It’s a mutual process of growing and I’m always grateful for the opportunity to be on either side of the mentorship relationship!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"8faed7a8-1ef2-46db-80ef-cffd69c1f0b1\"}":{"__typename":"School","uuid":"8faed7a8-1ef2-46db-80ef-cffd69c1f0b1","name":"Canyon Crest Academy","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92130"},"Education:{\"uuid\":\"0766968e-4912-4c8b-a989-4a86c43b7ee8\"}":{"__typename":"Education","uuid":"0766968e-4912-4c8b-a989-4a86c43b7ee8","school":{"__ref":"School:{\"uuid\":\"8faed7a8-1ef2-46db-80ef-cffd69c1f0b1\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a9fe5274-b391-4fcb-8ea4-17856fbf8435\"}":{"__typename":"Education","uuid":"a9fe5274-b391-4fcb-8ea4-17856fbf8435","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"f3c0130a-360d-4ccd-b104-be67d9eec0d5\"}":{"__typename":"MentorPublicProfile","uuid":"f3c0130a-360d-4ccd-b104-be67d9eec0d5","displayName":"Joshua Z.","slug":"joshua-zhang","biography":"\u003cp\u003eHello! My name is Joshua Zhang, and I’m a senior at Yale University studying Computer Science and Economics. I grew up in sunny San Diego, California, but it’s been a lovely change of pace to experience the four seasons here on the Northeast!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me \u0026amp; my qualifications\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy academic and professional path has centered around economics, business, finance, and data-driven problem-solving—and I love helping younger students discover how exciting and empowering these fields can be.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePersonally, I’ve had the privilege of:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWorking as an Investment Banking Summer Analyst at Wells Fargo, where I built valuation and M\u0026amp;A materials for C-suite clients, and supported diligence for a $2.5B+ transaction\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eApplying analytics in economic consulting at Competition Dynamics, producing expert reports for patent litigation alongside PhD economists\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAnalyzing digital-identity markets as a summer analyst at 1414 Ventures, a technology-focused venture capital firm.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond my professional experiences, I’ve spent years teaching, mentoring, and coaching students of all ages:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAs a First-Year Counselor at Yale, I mentor college freshmen through academic transitions, time management, goal-setting, and big-picture life questions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAs a Politics, Law, and Economics Instructor at Yale Young Global Scholars, a summer program for high school students, I designed and taught interactive seminar courses\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIn high school, I co-founded the Volunteer Tutors Organization, running summer programs and teaching math and science to elementary and middle-school students\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not working or studying, you’ll probably find me jamming out to Taylor Swift, trying new workout routines, or exploring the great outdoors, whether that’s hiking, zip lining, or white water rafting! Looking ahead, I’ll be joining Bain \u0026amp; Company as a management consultant after I graduate!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow I hope to help\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e1. Academic Mentorship\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn subjects including:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eMath (Elementary through High School level, i.e. Algebra, Geometry, Pre-Calculus)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEconomics (micro, macro, data analysis \u0026amp; econometrics, health, competition \u0026amp; industrial organization, financial)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBusiness (marketing, corporate finance, personal finance, strategy, etc.)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eI have a knack for helping students:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eUnderstand abstract concepts by relating them to real-world examples and applications, like how exponential functions can drive financial decisions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuild strong foundations in problem-solving by breaking a difficult concept into intuitive steps\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExplore quantitative fields in ways that feel creative, accessible, and fun\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e2. Business- \u0026amp; Finance-Related Passion Projects\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor students curious about the real-world applications of these fields, I’d be excited to guide passion projects such as:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eStarting a small business or social venture\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a social media “brand” or interest-driven project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLearning how investing, markets, or corporate strategy work\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExploring professional development: networking genuinely, finding mentors, setting goals, and telling your story with confidence\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePlanning an actionable project from brainstorming to execution\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing real-world skills like pitching ideas, presenting confidently, or emailing professionals to make cold connections\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy goal is always to meet students where they are and help them grow in confidence, curiosity, and independence. Whether you’re looking for someone who will come alongside you in unraveling tricky concepts or you’re motivated to build something, I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"D01wU9kV2pnsbf602hqv3We8NyvwvFv4SVSD7iaBf2Cfw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"dd1b33f9-e684-4050-b2f0-b6a1a42563c8\"}"},{"__ref":"Favorites:{\"uuid\":\"9bb012d3-d462-49ac-b871-04d38699c3f4\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0a19c210-0093-4164-9c0e-7c4d0973a359\"}"},{"__ref":"CausesSupported:{\"uuid\":\"0808c3b4-06d9-4181-b36f-e4f984fa1ae6\"}"}],"major":"Computer Science and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9cb5adb7-fba3-448c-a4eb-6dc4773514c8\"}"},{"__ref":"DeepDives:{\"uuid\":\"0d353157-fb19-411b-87fd-c89556dfaa38\"}"},{"__ref":"DeepDives:{\"uuid\":\"4ea3113c-f9e9-4e0d-b51f-ad6f7abd95ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"ae3a9b92-6c1d-499b-8c6d-0004f90d9c9f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/386ec739-4504-41dd-b25e-1e966852d07f/-/preview/-/format/jpg/","https://ucarecdn.com/be5900be-6161-4756-accf-ed0b8a7a74e6/-/preview/-/format/jpg/","https://ucarecdn.com/27e1d50c-0185-41c9-adfd-86627a11776a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0766968e-4912-4c8b-a989-4a86c43b7ee8\"}"},{"__ref":"Education:{\"uuid\":\"a9fe5274-b391-4fcb-8ea4-17856fbf8435\"}"}],"hiredAt":"2025-11-18T16:36:41.764Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Economics","Computer Science","Reading","History"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"joshua-zhang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f3c0130a-360d-4ccd-b104-be67d9eec0d5\"}"}}},"_sentryTraceData"
