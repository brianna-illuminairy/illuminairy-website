js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bb53f847-af3a-4fe6-bce7-e489bfb117fe\"}":{"__typename":"Favorites","uuid":"bb53f847-af3a-4fe6-bce7-e489bfb117fe","photoUrl":"https://ucarecdn.com/21e0eb43-53c6-40b6-8268-5910105444cb/","title":"Sinners","type":"MOVIE"},"Favorites:{\"uuid\":\"3ab66113-5a9d-4168-a7c9-db50a0c29b69\"}":{"__typename":"Favorites","uuid":"3ab66113-5a9d-4168-a7c9-db50a0c29b69","photoUrl":"https://ucarecdn.com/407984a7-eb87-4e0e-bbc2-a47fac1809c7/","title":"Song of Solomon","type":"BOOK"},"Favorites:{\"uuid\":\"c8f1b930-6db9-4ddf-8334-d38e44fdf38a\"}":{"__typename":"Favorites","uuid":"c8f1b930-6db9-4ddf-8334-d38e44fdf38a","photoUrl":"https://ucarecdn.com/0a0011e5-ddf4-4f1e-a2bd-34e349dc4590/","title":"Shea Butter Baby ","type":"ALBUM"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"fcee1901-0fac-4bd4-a532-c95ffdddbb20\"}":{"__typename":"DeepDives","uuid":"fcee1901-0fac-4bd4-a532-c95ffdddbb20","content":"\u003cp\u003eI can’t talk about myself with out introducing Ms. Martha Jane, better known as My Great Aunt Mothe. She is my greatest role model and mentor.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAunt Mothe is my grandma’s older sister, the middle child of 13 kids, and was born in 1946. There are so many reasons why this incredible woman has shaped me. First and foremost, she is the most loving person I’ve ever met.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI lived with her off and on during my childhood and moved in with her during middle school. Her home and her embrace have always been the safest place I’ve known. She didn’t have to take me in, love me, or raise me, but she did without question.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe’s my dad’s aunt, and my dad isn’t even my biological father, though I didn’t know that for years. But despite all of that, I was always hers. Despite this, I was always hers. I wasn’t just her great niece, I was her blood, I was her kin, I was her daughter. I would not be where I am in my life without her. Her unconditional love protected me and gifted my life with prosperity.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne example of that unconditional love happened around school. I was severely behind in my early years of school. One day in particular,\u0026nbsp; she sat me down at our dining room table and said to me, “I don’t care if you make an F or an A, as long as I see you at this table everyday trying to get your lessons”.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnd every day, she was right there with me. Never impatient, never angry, never disappointed, gently guiding my steps, answering every question she could, and fueling my creativity and dreams. She never, not once in my life, asked to see my grades, and I graduated with a 4.7 GPA.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe also taught me what it means to be strong and work hard. She has worked all her life, starting on the family farm at age 3 and finally retiring from being a CNA at 77. She is a Black woman who grew up during the height of the Civil Rights movement and worked to help establish the NAACP in our small predominantly white town. Though she never married or had any children of her own, she raised many children. Despite heartache, grief, and challenges, that woman never stops. She never slows down and she never turns away anyone who needs help.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe’s my greatest role model because I could live a million lives and still not live up to her.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut every time I show up for someone with patience, every time I love without condition, every time I believe in someone before they believe in themselves–that’s her. That’s her legacy, and I carry it forward with pride.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6db31b3e-2fad-4381-a468-4529f980e9ed\"}":{"__typename":"DeepDives","uuid":"6db31b3e-2fad-4381-a468-4529f980e9ed","content":"\u003cp\u003e\u003cem\u003eDon't worry yourself sick. Everything is going to work out.\u003c/em\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI spent so much of my life feeling heavy. Completely overwhelmed. I had all these huge dreams, but I couldn’t see past feeling stuck.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStuck in tiny Taylorsville.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStuck in a cycle of poverty, addiction, and violence that so many in my family fell into.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI dedicated my life to “making it out.” I read every book I could. I took every class I could. I worked every shift I could. I couldn’t see past that dream.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut even then, that dream wasn’t just for me. It was for my whole family, especially my siblings. Every action I took toward college wasn’t really for the thing itself. It was for them, so they could see something different. So they’d know it was possible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d stay up all night studying, finishing assignments. If the kids were with me, I’d help them finish their work first, which took a while because they were behind in school too. I’d go from class straight to clocking in at McDonald’s or waiting tables. My feet would hurt so bad by the end of the night. And I still had to face every emotion–every bit of grief, frustration, and fear I was carrying; (during most of middle and high school, my mom wasn’t in the picture). \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd every time I thought I was at the edge–too exhausted, too hurt, too alone–I’d think about my siblings. Their faces, their voices, their eyes looking up at me. And then I’d realize I wasn’t at the edge. There was still more stone to climb.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can’t put into words how afraid I was. Afraid that none of what I was doing would matter. Afraid I couldn’t pull it off. That we were all a lost cause.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut when I saw that confetti on the computer screen, when I saw that I got in, it hit me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was always going to make it.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"010fd176-df9a-4e96-ab12-17362d1f1f6c\"}":{"__typename":"DeepDives","uuid":"010fd176-df9a-4e96-ab12-17362d1f1f6c","content":"\u003cp\u003eA recent passion project I was working on was my first short film. I took a class through the CSRE (Critical Studies on Race and Ethnicity) department, and for the final project we could either write a traditional essay or create something more personal. I chose to create a short film that explores my racial background through the stories of the women who raised me–my mom and my Aunt Mothe.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe film went through many different iterations. At first, it was going to be a story of my ancestors on each side. Then it became a story of my family. Eventually, it landed on a story of me.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI interviewed my mom, who is a white woman. She talked about growing up in deep poverty and shared a story about her father–who was a Klan member–trying to kill a Black man. Her words offer a painful and complex view into the intersections of whiteness, family, violence, and poverty. I used audio from her interview and layered it with footage of the backroads from back home.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI then included a video I recorded of my Aunt Mothe talking to me. At the time, she didn’t even know I was recording. I had asked her why she never left home, even though she always encouraged me to. She talked about the responsibility she held in our family, the sacrifices of her mama, and the meanness of her daddy. Though there were overlaps in our stories, she told me that things are different now, and that I should go live my life. The footage was stark, cutting from her washing dishes, to her sitting, to her slipping out of frame. It’s some of my favorite work. Even though there’s no direct mention of race, it lives in every layer.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFinally, I introduced the side of my biological father that I never really knew. I shared the place he came from–Costa Chica, home to the often-invisible Afro-Mexican population. I brought in photos from a recent trip I took there, where I got to meet my grandmother and great-grandmother for the first time. I layered the sounds of their music and dance with audio and footage I had taken at church during a family reunion on Aunt Mothe’s side.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis project is something I’m continuing to build. I’ve been collecting more footage and audio, and I hope to turn it into a longer, more in-depth docu-series. It’s a work of memory, legacy, and healing. And it reminds me that storytelling isn’t just about expression–it’s about reclaiming the narratives that shaped us.\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"587066d6-2dcd-4c99-8652-9515edb57955\"}":{"__typename":"DeepDives","uuid":"587066d6-2dcd-4c99-8652-9515edb57955","content":"\u003cp\u003eWell… ummm… psychology is really, \u003cem\u003ereally\u003c/em\u003e cool.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI came to Stanford dead set on majoring in Communications and International Relations. Then it changed to English. Then to Political Science. Truth be told, I didn’t know what I wanted. So my freshman year, I just took whatever class sparked my interest: a camping class, Arabic, Intro to Political Science, Intro to Psychology.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe other classes were fine, interesting even, but nothing captivated me like psychology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis whole field of study is about understanding people. How we develop, how we think, how we act, how we react to the color red, how our brains process visual input. All of it, every single bit, grabbed me hard and pulled me in. Nothing else sparked my curiosity like psychology. And somehow… I was good at it.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut more than that, psychology is closely aligned with my dream of helping people. Because how are you going to help people if you don’t understand them? Too many people working in government or nonprofit spaces either don’t actually care about the people they claim to serve, or they don’t take the time to understand them and their lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePsychology has made me more aware of how I work, how other people work, and how we can use that knowledge to make lasting change. One example that inspires me is the use of wise interventions–small, evidence-based changes that can have a huge impact on someone’s life, especially in education or mental health settings. That kind of work excites me, because it’s both human and scalable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat mix of fascination and purpose, of curiosity and care, is what helped me realize psychology wasn’t just a major. It was a path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"57f36dfa-f91a-4438-b10a-31143e1df407\"}":{"__typename":"School","uuid":"57f36dfa-f91a-4438-b10a-31143e1df407","name":"Alexander Central High School","city":"Taylorsville","type":"HIGH","state":"North Carolina","country":"United States","zip":"28681"},"Education:{\"uuid\":\"7b81a9b5-495a-4b83-87a8-e4d4f1680daa\"}":{"__typename":"Education","uuid":"7b81a9b5-495a-4b83-87a8-e4d4f1680daa","school":{"__ref":"School:{\"uuid\":\"57f36dfa-f91a-4438-b10a-31143e1df407\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"ca86b52c-95fa-4619-acbf-b35d108a7f8e\"}":{"__typename":"Education","uuid":"ca86b52c-95fa-4619-acbf-b35d108a7f8e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Psychology ","degree":null},"MentorPublicProfile:{\"uuid\":\"37196ef2-7e86-4ff4-b059-8f8f1f414c84\"}":{"__typename":"MentorPublicProfile","uuid":"37196ef2-7e86-4ff4-b059-8f8f1f414c84","displayName":"Ana G.","slug":"ana-j","biography":"\u003cp\u003eHello y'all!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne thing about me is I deeply care about people–understanding people, their emotions, their struggles, and their stories. I care about the journey of humanity, how we’ve been shaped by pain and joy, and how we can begin to heal and heal each other. I care about using my life, my experiences, my knowledge, and my passion to make the world a better place through community.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese values guide everything I do. They’re why I chose to study psychology in college and why I hope to pursue a graduate degree in a field related to public policy, government, or nonprofit work. My dream is to build spaces that center healing, love, and care, especially for communities that have been historically overlooked and exploited.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI come from a big family, and I carry them with me in everything I do. I’m the oldest daughter, with an older brother who recently joined the Air Force, a younger brother, and two younger sisters. Growing up with a single mother meant I often stepped in to help raise my siblings. I consider that one of my greatest accomplishments. It has been difficult, but it has taught me how to love with my whole heart, how to lead with empathy, and how to show up even when no one’s watching. When I wasn’t with my mom, I was often with my great-aunt, who’s almost 80 now and full of wisdom she’s passed down to me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt was a hard adjustment at Stanford, coming from a first-gen, low-income background and a small town in the South (shout out Taylorsville, NC!). Despite this, Stanford has opened my life to so many opportunities. I have tried from and took advantage of every program abroad I could. Last summer I went to Tanzania, I’m currently on my way to Ghana, and I’ll be studying abroad in Italy this spring. Traveling is one of my greatest passions and it reminds me how big and beautiful this world is. Outside of traveling, I also like hiking, cooking, reading, swimming, and films/filmmaking!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also been a research assistant at the STARCK Lab at Stanford, which focuses on social psychology, particularly around racism, identity, and diversity. This work has deepened my understanding of how systems shape our experiences and how we can use research to challenge injustice. On the teaching side, I’ve been a teaching fellow with the King Institute and the Equity Lab, where I’ve had the privilege of co-teaching a college-level course to high school students on the philosophies of Malcolm X and Martin Luther King Jr. Being in those classrooms, building community and helping young folks think critically about justice and freedom, that’s some of the most meaningful work I’ve done.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn sum, I believe that every act in our life can be an act of love: loving yourself and others. Whether that’s pursuing a passion that brings you to life, learning how to overcome anxiety in a professional setting, or giving a person a smile as you pass them on the street.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis is what makes our dreams not just reality, but bigger than what we could imagine–bigger than ourselves. In fact, it makes our dreams into a legacy we can be proud of.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo your family: I promise to care deeply for your student, to show up with love, to help them grow into everything they already carry within them, \u003cstrong\u003eand to have fun along the way\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"HJEpH3OfJQ01tSBYKo028MlquoZUE5zEcXYl00J00eI00A3k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bb53f847-af3a-4fe6-bce7-e489bfb117fe\"}"},{"__ref":"Favorites:{\"uuid\":\"3ab66113-5a9d-4168-a7c9-db50a0c29b69\"}"
