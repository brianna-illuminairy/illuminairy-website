xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"40df4d50-abd7-4236-abaa-5e834af5cdab\"}":{"__typename":"Favorites","uuid":"40df4d50-abd7-4236-abaa-5e834af5cdab","photoUrl":"https://ucarecdn.com/f7e894f9-5407-4d8b-bcfc-66d9ead4d09b/","title":"The Muppet Movie","type":"MOVIE"},"Favorites:{\"uuid\":\"a654b44a-963d-420a-bf40-a2a2e4c11a5b\"}":{"__typename":"Favorites","uuid":"a654b44a-963d-420a-bf40-a2a2e4c11a5b","photoUrl":"https://ucarecdn.com/2853586e-434a-4dd5-ab95-9861b06e14f1/","title":"Ilona Maher","type":"ATHLETE"},"Favorites:{\"uuid\":\"70583df0-107d-4651-84c7-85082c266d34\"}":{"__typename":"Favorites","uuid":"70583df0-107d-4651-84c7-85082c266d34","photoUrl":"https://ucarecdn.com/3b3da2f5-a738-43fb-9cc3-1f43d63296dc/","title":"Beyoncé","type":"ARTIST"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b827cdc4-6cdc-4c44-b540-1fcb69c4b388\"}":{"__typename":"DeepDives","uuid":"b827cdc4-6cdc-4c44-b540-1fcb69c4b388","content":"\u003cp\u003eI spent my summers as a camper, then counselor-in-training, and eventually a counselor at Camp O-AT-KA, a summer camp for boys in Sebago, Maine. It was a service-oriented experience that involved mentorship as a sailing instructor, tennis coach, lifeguard, theatre instructor, and arts administrator. Those summers were unforgettable and incredibly formative -- it shaped me into someone who's independent, responsible, and a sensible leader who can stay calm under high pressure circumstances.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy all-time favorite camp memory is playing Troy Bolton in our junior production of High School Musical. Despite getting hit in the face by a basketball and snapping my glasses in half mid-performance, I had the time of my life! Camp O-AT-KA taught me to take risks, and without the encouragement to take on this first-ever acting experience, I might not have discovered that acting is my lifelong passion. As a mentor, I encourage all my mentees to take similar risks to discover themselves!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"ac7b4c91-2ce6-4c9d-b6e2-923dc777f7e9\"}":{"__typename":"DeepDives","uuid":"ac7b4c91-2ce6-4c9d-b6e2-923dc777f7e9","content":"\u003cp\u003eIn high school, I was a bit of a black sheep. I went to an all-boys, private college preparatory school with a curriculum that taught love was \"intrinsically disordered\" if it wasn't strictly between a man and a woman. I always found myself at a sort of crossroads, feeling outcast by my peers and unwelcome by instructors. But I wasn't a victim of my circumstances. Instead, I took action.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt started with a conversation with my school's president. Then, the counseling department. And eventually, a presentation before the school's board of trustees \u003cem\u003eand\u003c/em\u003e principals council to discuss the school's social climate. The conclusion: I was allowed to start an after-school club for LGBTQ+ students and allies, rooted in an educational and service-driven mission. Through our club's outreach, we raised over $500 and campaigned for an inclusive prom policy for all.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo, to answer the question, I was someone who wasn't afraid to speak up and create opportunities for myself. But more importantly, I was an advocate for social justice and equality, through and through.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"5bbf79b6-6318-4bb4-9910-1a2fb527c9e4\"}":{"__typename":"DeepDives","uuid":"5bbf79b6-6318-4bb4-9910-1a2fb527c9e4","content":"\u003cp\u003eMy dream job is to work in the film industry as a writer and actor! I'm incredibly passionate about telling stories that matter, and I'm excited to commit my life to this work!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1e51edf6-013b-4025-bbc3-e451a323d204\"}":{"__typename":"DeepDives","uuid":"1e51edf6-013b-4025-bbc3-e451a323d204","content":"\u003cp\u003eIn my spare time, I love starting random creative projects. My latest is a puppet-making endeavor, since I'm such a huge fan of Jim Henson and The Muppets.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"d234c2a3-f72f-49fc-98a3-fee4ce08b3a2\"}":{"__typename":"School","uuid":"d234c2a3-f72f-49fc-98a3-fee4ce08b3a2","name":"Chaminade College Preparatory School","city":"Frontenac","type":"HIGH","state":"Missouri","country":"United States","zip":"63131"},"Education:{\"uuid\":\"4d21096c-5036-44f8-8668-91259b5355fa\"}":{"__typename":"Education","uuid":"4d21096c-5036-44f8-8668-91259b5355fa","school":{"__ref":"School:{\"uuid\":\"d234c2a3-f72f-49fc-98a3-fee4ce08b3a2\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"ce20c676-6122-47ae-ae13-fdd1798c73c2\"}":{"__typename":"Education","uuid":"ce20c676-6122-47ae-ae13-fdd1798c73c2","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Theatre","degree":null},"MentorPublicProfile:{\"uuid\":\"5ec0c42a-f4d1-4c30-9852-d01b3ab225c6\"}":{"__typename":"MentorPublicProfile","uuid":"5ec0c42a-f4d1-4c30-9852-d01b3ab225c6","displayName":"Jack S.","slug":"jack-shadden","biography":"\u003cp\u003eHi! I'm Jack and I'm a sophomore at Northwestern University studying theatre, film, and creative writing. I'm also super passionate about social justice and am very involved in my community, especially in LGBTQ+ outreach.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy experience includes:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFounding a volunteer service organization, Young Queer Creatives, to address mental health inequality in local LGBTQ+ youth through expressive arts therapy;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWriting an award-winning short story, \u003cem\u003eBlossom\u003c/em\u003e, featured in Missouri Youth Write (Scholastic Gold Key recipient);\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFounding and presiding over my high school's Queer \u0026amp; Ally Club, an unprecedented safe space for LGBTQ+ students that campaigned for an inclusive prom policy and overall curriculum;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServing as President for 5 high school clubs, including the Sustainability Corps, International Thespian Society, Cardinal \u0026amp; White Newspaper, Band Leadership Group, and Queer \u0026amp; Ally Club;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCommitting 273 hours of service in a 12-month period (President's Volunteer Service Award: Gold Package recipient);\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a viral TikTok account (@Polarbeannn) with more than 300K followers and 10M views; and\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStudying screenwriting, playwriting, advanced prose, poetry, and creative non-fiction writing in a rigorous collegiate setting.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm an actor, primarily, so I'm usually in a short film, musical, or play at any given time. But in my free time, I love to build puppets, watch films, and volunteer at local organizations in downtown Chicago!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve also lived with ADHD all my life, and I offer ADHD coaching sessions for those interested in establishing healthy coping strategies and effective habits to mitigate executive function struggles. I know how it feels, and I'd love to help!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you're looking for mentorship in creative writing, leadership, community outreach, filmmaking, content creation, or ADHD task management, please reach out! I'd love to work with you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSome additional fun facts:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI grew up in St. Louis, MO, but now I study in Evanston, IL and spend my summers working in Los Angeles, CA.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMy favorite four films are The Muppet Movie (1979), Singin' in the Rain (1952), Everything Everywhere All at Once (2022), and Little Miss Sunshine (2006).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMy greatest artistic inspiration is Beyoncé, as an artist, performer, and cultural icon.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSome other artists that inspire me are Taika Waititi, Bill Hader, and Donald Glover.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI’m the world's biggest Muppets fan.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMy dream is to write and star in a network sitcom, and I absolutely love comedy writing!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSo, if any of this sounds remotely interesting, please don't hesitate to reach out with any questions you may have. Hope to work with you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e(Pro Tip: The Muppets are the key to my heart, so do with that what you will).\u003c/p\u003e","teachingVideoPlaybackId":"D00aCTAryXj00Z02TNvvN8sLKz2WfeZigJZrnKkwKPCyn8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"40df4d50-abd7-4236-abaa-5e834af5cdab\"}"},{"__ref":"Favorites:{\"uuid\":\"a654b44a-963d-420a-bf40-a2a2e4c11a5b\"}"},{"__ref":"Favorites:{\"uuid\":\"70583df0-107d-4651-84c7-85082c266d34\"}"}],"causesSupported":[],"major":"Theatre","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b827cdc4-6cdc-4c44-b540-1fcb69c4b388\"}"},{"__ref":"DeepDives:{\"uuid\":\"ac7b4c91-2ce6-4c9d-b6e2-923dc777f7e9\"}"},{"__ref":"DeepDives:{\"uuid\":\"5bbf79b6-6318-4bb4-9910-1a2fb527c9e4\"}"},{"__ref":"DeepDives:{\"uuid\":\"1e51edf6-013b-4025-bbc3-e451a323d204\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e9c932ae-1153-4394-95ac-73de2816bb38/-/preview/-/format/jpg/","https://ucarecdn.com/7ceef744-43d0-42a3-8f4c-e08600b5abaa/-/preview/-/format/jpg/","https://ucarecdn.com/e7873781-e1f0-41a1-a349-2a5872ba6d88/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4d21096c-5036-44f8-8668-91259b5355fa\"}"},{"__ref":"Educa
