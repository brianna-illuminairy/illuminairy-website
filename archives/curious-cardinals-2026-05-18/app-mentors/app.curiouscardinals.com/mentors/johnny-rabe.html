xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c4adc3c5-307e-48a4-95a0-81b0bd9d2f63\"}":{"__typename":"DeepDives","uuid":"c4adc3c5-307e-48a4-95a0-81b0bd9d2f63","content":"\u003cp\u003eI would tell my high school self that there is no point in trying to force life forward. I definitely struggled with a tendency to be very future-focused, and, while I do understand that that is a natural part of the high school era, I would encourage myself to keep gratitude for the present in mind.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4aadbbc3-4e17-4259-99ae-a0a546030db1\"}":{"__typename":"DeepDives","uuid":"4aadbbc3-4e17-4259-99ae-a0a546030db1","content":"\u003cp\u003eOver the last year I have started writing a great deal more. I have always enjoyed writing and creating, but I have started following more ideas through to a completed state. In 2023 I performed three original one-person cabarets in San Francisco and Chicago, working to tell stories through collections of song. The three shows surveyed my time in college, the transition period of starting the next chapter of life, and the idea of change and newness.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4efc30b7-e483-4918-92d2-35485358c8bc\"}":{"__typename":"DeepDives","uuid":"4efc30b7-e483-4918-92d2-35485358c8bc","content":"\u003cp\u003eI wanted to pursue the things that I love in ways that would challenge me and prepare me for a future in which I could use my talents to the best of my ability. Going into college there were several areas of study that I wanted to pursue,, so when applying for schools I prioritized finding a university that provided excellent interdisciplinary opportunities. If I were to streamline my passions into three fields they would be Theater, History, and Music, and so I wanted to find a place where I could engage with these subjects in a way that would complement and enhance each other. I loved my classes in all three areas and am very grateful that I pursued all three.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"fc054e27-45c8-4aa5-96e9-a3af0e7bc636\"}":{"__typename":"DeepDives","uuid":"fc054e27-45c8-4aa5-96e9-a3af0e7bc636","content":"\u003cp\u003eEach summer I worked at a local outdoor history museum, and I took classes in a subject that I was interested in at a local university. At the museum, I I worked as a “History Connector”, helping kids from educational programs connect with the various exhibits at the museum. At the local universities, I took classes in writing, Renaissance Art History, and Modern American Politics. I also spent time hanging out with friends and reading.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"b997582c-226c-41eb-9829-1a0ae391e8c4\"}":{"__typename":"School","uuid":"b997582c-226c-41eb-9829-1a0ae391e8c4","name":"The Chicago Academy for the Arts","city":"Chicago","type":"HIGH","state":"IL","country":"United States","zip":"60642"},"Education:{\"uuid\":\"72479942-41d1-4304-9079-5318313b6ce1\"}":{"__typename":"Education","uuid":"72479942-41d1-4304-9079-5318313b6ce1","school":{"__ref":"School:{\"uuid\":\"b997582c-226c-41eb-9829-1a0ae391e8c4\"}"},"startYear":"2015","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e1ffdd4d-c2dd-44e2-81fc-d259eca0d641\"}":{"__typename":"Education","uuid":"e1ffdd4d-c2dd-44e2-81fc-d259eca0d641","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"International Relations, Music, Theater \u0026 Performance Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"390ac638-295a-4667-bf61-7998472610dd\"}":{"__typename":"MentorPublicProfile","uuid":"390ac638-295a-4667-bf61-7998472610dd","displayName":"Johnny R.","slug":"johnny-rabe","biography":"\u003cp\u003eHello! I graduated from Stanford University this past June and currently live in Brooklyn, NY, where I'm working as an actor and an editorial consultant for L'Officiel USA, a fashion magazine founded in Paris in 1920.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor as long as I can remember I have been obsessed with storytelling. Whether it be dressing up as Star Wars characters in my basement as a child, working on the development of new musicals, or editing cover stories for fashion magazines, I am driven by a passion to facilitate connection between individuals and enhance peoples' abilities to communicate in a truthful, effective, and impactful way. I began working as a professional actor when I was ten years old and have performed in regional theaters across the country, in tours, and on Broadway. After concentrating in musical theater at the Chicago Academy for the Arts, I attended Stanford University to pursue a liberal arts education that would comprehensively enhance my understanding of the world. This pursuit led me to take classes on topics ranging from Samurai in Feudal Japan to the current state of the European Union. Through double majoring in Music and International Relations and minoring in Theater, I was exposed to a broad variety of disciplines and practices, and I honed my writing and research capabilities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am very grateful for having had access to wonderful teachers and mentors across my studies and would love to help students find their passions and hone their skills just as my mentors helped me. As a mentor, my philosophy is to cultivate the practice of asking the question \"Why?\" I strongly believe that everything is interesting if you pursue this question, and that it opens doors for truly individual learning. If something is interesting it is fun, and once someone is interested there are no limits to what they can learn.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"International Relations, Music, Theater \u0026 Performance Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c4adc3c5-307e-48a4-95a0-81b0bd9d2f63\"}"},{"__ref":"DeepDives:{\"uuid\":\"4aadbbc3-4e17-4259-99ae-a0a546030db1\"}"},{"__ref":"DeepDives:{\"uuid\":\"4efc30b7-e483-4918-92d2-35485358c8bc\"}"},{"__ref":"DeepDives:{\"uuid\":\"fc054e27-45c8-4aa5-96e9-a3af0e7bc636\"}"}],"active":true,"prof
