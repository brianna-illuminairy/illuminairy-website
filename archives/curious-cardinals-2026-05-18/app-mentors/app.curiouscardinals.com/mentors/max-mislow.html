xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a80dad78-14e2-4e93-8c6f-7d4a7375954f\"}":{"__typename":"Favorites","uuid":"a80dad78-14e2-4e93-8c6f-7d4a7375954f","photoUrl":"https://ucarecdn.com/3f228926-3528-4e6d-8c04-087b7184b5b2/","title":"New England Patriots","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"c73eafba-e982-46a9-8629-d87b28066a5d\"}":{"__typename":"Favorites","uuid":"c73eafba-e982-46a9-8629-d87b28066a5d","photoUrl":"https://ucarecdn.com/1e3ae2ed-7482-4928-96f9-5901fbf771a2/","title":"Men In Black","type":"MOVIE"},"Favorites:{\"uuid\":\"8e8b07ac-f858-48db-96a6-e06a3dc208d9\"}":{"__typename":"Favorites","uuid":"8e8b07ac-f858-48db-96a6-e06a3dc208d9","photoUrl":"https://ucarecdn.com/78c88385-47f7-4689-87e9-8a2baa2488fe/","title":"Hybrid Theory - Linkin Park","type":"ALBUM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c1550b93-e10a-46aa-b692-3632ef42c4cd\"}":{"__typename":"DeepDives","uuid":"c1550b93-e10a-46aa-b692-3632ef42c4cd","content":"\u003cp\u003eMentorship matters to me because I believe in paying things forward. Growing up, I had several incredible mentors that pushed me to be the very best version of myself. Had it not been for their guidance, I would not be where I am today. I hope to inspire the next generation of students to surpass their limits and push forward the frontiers of scientific discovery by pursuing careers in groundbreaking STEM research.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"8c354c9b-2e2a-4ee2-9a67-46fda62bc399\"}":{"__typename":"DeepDives","uuid":"8c354c9b-2e2a-4ee2-9a67-46fda62bc399","content":"\u003cp\u003eMy greatest source of motivation is my mom. Having grown up in a single parent household, I witnessed how hard my mom worked to make sure that I had the tools and resources I needed to be successful. After a long day of work, she was never too tired to help me with my homework, pick me up from swim practice, or listen about my day at school. I work hard so that I can make my mom proud and show her that her own hard work paid off.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"63ab2b0d-396b-476d-b73d-0b48e48cf726\"}":{"__typename":"DeepDives","uuid":"63ab2b0d-396b-476d-b73d-0b48e48cf726","content":"\u003cp\u003eI chose to study neuroscience because I believe it that the brain is one of the final frontiers of human knowledge. Despite centuries of study, neuroscientists have barely scratched the surface of what there is to know. In recent years (by which I mean decades), we have developed a good understanding of some of the structures, function, and pathways within the brain. However, we have yet to truly understand how neurons work together to process and understand information, as well as how the entire collection of neurons in the brain comes together to form consciousness. The difficulty and magnitude of these problems are what made me fall in love with neuroscience, and I truly believe that we will never run out of things to discover about the brain!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"501309ae-5257-48d2-80a3-a5d9410dae11\"}":{"__typename":"School","uuid":"501309ae-5257-48d2-80a3-a5d9410dae11","name":"McDonogh School","city":"Owings Mills","type":"HIGH","state":"Maryland","country":"United States","zip":"21117"},"Education:{\"uuid\":\"79bac023-6b5b-46ab-b3a8-e939d02468f3\"}":{"__typename":"Education","uuid":"79bac023-6b5b-46ab-b3a8-e939d02468f3","school":{"__ref":"School:{\"uuid\":\"501309ae-5257-48d2-80a3-a5d9410dae11\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"15bec578-4e84-4ffc-a304-17e76cd4aae3\"}":{"__typename":"Education","uuid":"15bec578-4e84-4ffc-a304-17e76cd4aae3","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"4e5013eb-e1d7-43dd-9722-a8a3b05bb6f2\"}":{"__typename":"MentorPublicProfile","uuid":"4e5013eb-e1d7-43dd-9722-a8a3b05bb6f2","displayName":"Max M.","slug":"max-mislow","biography":"\u003cp\u003eHi all! My name is Max. I am a sophomore at Brown University studying Neuroscience on the premed track. I am passionate about mentoring students interested in developing a career in the life sciences and scientific research, and about assisting them with securing research opportunities that will open doors to competitive colleges. Having grown up in a family of doctors, I was always drawn to STEM, but it was only in college through my coursework that I truly uncovered a passion for research and medicine. I hope to inspire students in the 9th-12th grades to pursue careers in these fields.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFirst, a little about myself. I am currently involved in three separate labs. As an undergraduate research assistant for the BrainGate group at Brown, I define the neural basis of \"handedness\" using brain-computer interfaces (BCIs). BrainGate offers a unique opportunity to work directly with paraplegic patients who have had BCIs implanted, decoding their brain signals to operate simple effectors like a mouse cursor or soft robotic. During the summers, I conduct wet lab research for the Handa Lab at the Johns Hopkins Medicine Wilmer Eye Institute, investigating the biological mechanisms by which cigarette smoking acts as a risk factor for Age-Related Macular Degeneration (AMD). Finally, I also perform retrospective chart reviews for a neurologist at the Rhode Island Hospital Comprehensive Stroke Center, where I help investigate risk factors for patients who have suffered ischemic strokes. Being involved in these three distinct types of research has given me a deep appreciation for the breadth of approaches and material that the world of research has to offer.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of research and school, I hold two different volunteer positions. In the Miriam Hospital Emergency Department, I assist with patient transport, exam room preparation, and wherever else I can be helpful to ensure patients feel comfortable. At the Rhode Island Society for the Prevention of Cruelty to Animals (RISPCA), I provide care and attention to shelter dogs, clean and sterilize kennels, and help prepare them for adoption. On campus, I write for The Triple Helix, a student-run science journal focused on making science accessible to the general student body. I also serve as the student leader for the Brown University Neuroscience Department of Undergraduates (NeuroDUG), where I organize events, secure funding, mentor students in finding research and choosing courses, and act as a liaison between neuroscience majors and faculty.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA fun fact about me is that I am currently a probationary firefighter for the West Greenwich Volunteer Fire Department, which is the only volunteer fire company in Rhode Island that trains with live fire! Some of my hobbies include playing electric guitar, lifting weights, reading, scuba diving, and hiking. \u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy ultimate goal as a Curious Cardinals Mentor is to help students navigate the complex and oftentimes overwhelming world of research in addition to serving as a guide to student's career and college applications.\u003c/p\u003e","teachingVideoPlaybackId":"8v6ELaNoO023miF01baKWCGNfbz3Fc1TtRtPhLCaIwxyY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a80dad78-14e2-4e93-8c6f-7d4a7375954f\"}"},{"__ref":"Favorites:{\"uuid\":\"c73eafba-e982-46a9-8629-d87b28066a5d\"}"},{"__ref":"Favorites:{\"uuid\":\"8e8b07ac-f858-48db-96a6-e06a3dc208d9\"}"}],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c1550b93-e10a-46aa-b692-3632ef42c4cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"8c354c9b-2e2a-4ee2-9a67-46fda62bc399\"}"},{"__ref":"DeepDives:{\"uuid\":\"63ab2b0d-396b-476d-b73d-0b48e48cf726\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4a473704-3ada-42ab-9ddf-03a7e9f38d9f/-/preview/-/format/jpg/","https://ucarecdn.com/96e9b188-2cc9-4fff-ba0e-feed30ba4ccf/-/preview/-/format/jpg/","https://ucarecdn.com/b59cd1e0-20b7-4f64-b1c8-0e25d97eec80/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"79bac023-6b5b-46ab-b3a8-e939d02468f3\"}"},{"__ref":"Education:{\"uuid\":\"15bec578-4e84-4ffc-a304-17e76cd4aae3\"}"}],"hiredAt":"2025-10-23T22:57:30.715Z","topics":["Biology","Writing","Academic Coaching","College Essay Writing","Medicine / Health"],"communityBadges":["http
