xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ad21b942-2207-4c5f-9eab-c9c873b3687f\"}":{"__typename":"Favorites","uuid":"ad21b942-2207-4c5f-9eab-c9c873b3687f","photoUrl":"https://ucarecdn.com/344f7343-21bb-4075-817e-2d081fc586b8/","title":"Coloring Book by Chance the Rapper","type":"ALBUM"},"Favorites:{\"uuid\":\"2b10df56-1c69-4c86-917a-0f296fa669fa\"}":{"__typename":"Favorites","uuid":"2b10df56-1c69-4c86-917a-0f296fa669fa","photoUrl":"https://ucarecdn.com/9c8ada6e-7109-45c7-88a0-1fcc239c0ab7/","title":"Cien Años de Soledad by Gabriel Garcia Marquez","type":"BOOK"},"Favorites:{\"uuid\":\"264221b9-04df-4c08-9535-66b0f7009c78\"}":{"__typename":"Favorites","uuid":"264221b9-04df-4c08-9535-66b0f7009c78","photoUrl":"https://ucarecdn.com/da578917-1e4f-4c8a-aa08-c60f98ca4527/","title":"Chicago","type":"CITY"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4a9a2e64-0740-4ea1-bdff-62f22eaea26c\"}":{"__typename":"DeepDives","uuid":"4a9a2e64-0740-4ea1-bdff-62f22eaea26c","content":"\u003cp\u003eAmbassador or senior diplomat\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"01ed96a8-8d5c-40db-8833-0ba6ff23d4be\"}":{"__typename":"DeepDives","uuid":"01ed96a8-8d5c-40db-8833-0ba6ff23d4be","content":"\u003cp\u003eWork hard, play hard -- my social life was important to me, but school always came first. I was the captain of the varsity baseball team, but far from the best player.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"bbbd8a93-fc56-4137-960e-e686c36eabc4\"}":{"__typename":"DeepDives","uuid":"bbbd8a93-fc56-4137-960e-e686c36eabc4","content":"\u003cp\u003eAlways some kind of adventure. One summer I biked from Amsterdam to Barcelona unsupported. Another summer I worked at an embassy in Kosovo. Other summers I scaled the Grand Teton in Wyoming and Mt. Shasta in California.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"3f6b6005-92b2-4774-aeaf-6f4b69204ace\"}":{"__typename":"School","uuid":"3f6b6005-92b2-4774-aeaf-6f4b69204ace","name":"Latin School of Chicago","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60610"},"Education:{\"uuid\":\"3eecea68-27ed-4275-881b-d11fe632c5e1\"}":{"__typename":"Education","uuid":"3eecea68-27ed-4275-881b-d11fe632c5e1","school":{"__ref":"School:{\"uuid\":\"3f6b6005-92b2-4774-aeaf-6f4b69204ace\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"83352c7d-02e5-454b-9250-f93478566557\"}":{"__typename":"Education","uuid":"83352c7d-02e5-454b-9250-f93478566557","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Government","degree":null},"MentorPublicProfile:{\"uuid\":\"547f4f37-3472-440d-82b7-deab3b422fec\"}":{"__typename":"MentorPublicProfile","uuid":"547f4f37-3472-440d-82b7-deab3b422fec","displayName":"Peter J.","slug":"peter-jones","biography":"\u003cp\u003eHello! I am a recent graduate of Harvard University, where I immersed myself in Government, Spanish Literature, and Russian. Exploring these three fields side by side gave me a panoramic view of how people organize societies, tell stories, and exchange ideas across cultures. Harvard’s environment was electrifying from the first day, though it took a little while to find my footing amid so many brilliant voices. Once I did, I cherished every lively classroom debate, every late-night reading group, and every chance to connect concepts that at first seemed unrelated. Soon I will cross the pond to begin graduate school at the University of Oxford, where I will study International Relations. I look forward to the same atmosphere of curiosity and debate, and I am eager to help the students I teach or mentor discover that excitement for themselves. Sharing ideas, asking thoughtful questions, and discovering unexpected connections between subjects are truly the moments I value most in any learning environment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor the past five years I have tutored and mentored students of many ages and backgrounds. My work has covered standardized test preparation, English language arts, high-school mathematics, and writing skills. During hundreds of tutoring sessions I have learned that patience, flexibility, and a friendly attitude matter as much as subject knowledge. Students tell me that I am easygoing and agreeable, and I strive to create a space where they feel comfortable asking questions, making mistakes, and trying again. Guiding someone through a stubborn algebra problem or helping them refine a thesis sentence is rewarding precisely because I can watch confidence replace uncertainty in real time. Whether meeting online after school or sitting at a kitchen table on Saturday morning, I aim to bring steady energy and genuine enthusiasm to every lesson. Consistency builds trust, and trust makes real learning possible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I am not studying or tutoring, you will likely find me outdoors, on the road, or practicing a new language. Travel and language study let me connect with people and cultures beyond my own, and those experiences continually shape my perspective in the classroom. Hiking local trails or exploring a distant city gives me space to recharge and reflect. I am also a lifelong fan of the Chicago Cubs. Following the team through every inning, every season, reminds me of the value of optimism, resilience, and community, qualities that guide my approach to both academic life and mentorship. \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ad21b942-2207-4c5f-9eab-c9c873b3687f\"}"},{"__ref":"Favorites:{\"uuid\":\"2b10df56-1c69-4c86-917a-0f296fa669fa\"}"},{"__ref":"Favorites:{\"uuid\":\"264221b9-04df-4c08-9535-66b0f7009c78\"}"}],"causesSupported":[],"major":"Government","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4a9a2e64-0740-4ea1-bdff-62f22eaea26c\"}"},{"__ref":"DeepDives:{\"uuid\":\"01ed96a8-8d5c-40db-8833-0ba6ff23d4be\"}"},{"__ref":"DeepDives:{\"uuid\":\"bbbd8a93-fc56-4137-960e-e686c36eabc4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cacd6fad-1af4-4d88-b521-5ff4cc582b0b/-/preview/-/format/jpg/","https://ucarecdn.com/a2f44cbf-79f2-4823-ad06-58516b7a2288/-/preview/-/format/jpg/","https://ucarecdn.com/f9abe58f-dd10-43e9-8143-63a0736602ee/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3eecea68-27ed-4275-881b-d11fe632c5e1\"}"},{"__ref":"Education:{\"uuid\":\"83352c7d-02e5-454b-9250-f93478566557\"}"}],"hiredAt":"2025-07-06T12:53:09.105Z","topics":["Pre-A
