xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e12f7069-5995-4c8c-97a9-bd9967de93cb\"}":{"__typename":"DeepDives","uuid":"e12f7069-5995-4c8c-97a9-bd9967de93cb","content":"\u003cp\u003eI love dancing in my free time! I used to dance with a ballet company when I was younger, and it’s still something that makes me really happy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"914864de-205d-4aeb-9855-81e09a222bdd\"}":{"__typename":"DeepDives","uuid":"914864de-205d-4aeb-9855-81e09a222bdd","content":"\u003cp\u003eIn high school, I wasn’t always good at everything right away, and that’s something I had to get used to. I learned that it's okay to take your time and not have everything figured out immediately.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"78a89443-963d-4403-94bf-2338625c0377\"}":{"__typename":"DeepDives","uuid":"78a89443-963d-4403-94bf-2338625c0377","content":"\u003cp\u003eOne thing I hope to accomplish is to create opportunities for students, especially those from underrepresented backgrounds, to access the resources they need to succeed. I want to help make education more accessible and give students the tools to believe in their potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"e8805263-57f7-49c2-9c0e-16cbdbb9878d\"}":{"__typename":"DeepDives","uuid":"e8805263-57f7-49c2-9c0e-16cbdbb9878d","content":"\u003cp\u003eMy greatest role model is my dad. He showed me how education can truly change your life. His dedication to learning and growing, no matter where he started, has always inspired me to value education and keep pushing forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"3aa736e7-84e1-47bc-af2a-a7ea9fccad25\"}":{"__typename":"School","uuid":"3aa736e7-84e1-47bc-af2a-a7ea9fccad25","name":"H. H. Dow High School","city":"Midland","type":"HIGH","state":"Michigan","country":"United States","zip":"48640"},"Education:{\"uuid\":\"7c1c908c-0523-4d22-84ae-2e8d0b509aaa\"}":{"__typename":"Education","uuid":"7c1c908c-0523-4d22-84ae-2e8d0b509aaa","school":{"__ref":"School:{\"uuid\":\"3aa736e7-84e1-47bc-af2a-a7ea9fccad25\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"72cdd191-25d8-4676-9682-fd8cace914bb\"}":{"__typename":"Education","uuid":"72cdd191-25d8-4676-9682-fd8cace914bb","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"4ecd6a79-988d-43c7-bff4-4261d1bf2021\"}":{"__typename":"MentorPublicProfile","uuid":"4ecd6a79-988d-43c7-bff4-4261d1bf2021","displayName":"Anjali D.","slug":"anjali-debrah","biography":"\u003cp\u003eHi! I’m Anjali Debrah, a first-year student at Northwestern University. I really care about helping students feel confident and supported in their learning—especially when things get tough. I know how important it is to have someone who believes in you and reminds you that you can figure things out, even when it feels overwhelming.\u003c/p\u003e\u003cp\u003eMy dad is from Ghana, and that’s a big part of why I’m passionate about education and mentorship. I’ve spent time teaching middle schoolers in Ghana, especially about budgeting and money habits. It showed me how much students can do when they’re given the tools and encouragement to grow. I want to be someone who helps students see their potential—because once you believe in yourself, everything changes.\u003c/p\u003e\u003cp\u003eRight now, I’m working on building a small library for a K–9 school in Ghana. I’ve been collecting books and study materials to make sure students there have access to resources that can open doors for them.\u003c/p\u003e\u003cp\u003eI love connecting with students and creating a space where they can ask questions, try new things, and grow at their own pace. \u003c/p\u003e","teachingVideoPlaybackId":"en5OP00ySQp7a7gPfuMLg6DAcfa16CqPy6OWv3hrTAnE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e12f7069-5995-4c8c-97a9-bd9967de93cb\"}"},{"__ref":"DeepDives:{\"uuid\":\"914864de-205d-4aeb-9855-81e09a222bdd\"}"},{"__ref":"DeepDives:{\"uuid\":\"78a89443-963d-4403-94bf-2338625c0377\"}"},{"__ref":"DeepDives:{\"uuid\":\"e8
