xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9c403a2e-d739-48be-9bd7-a9c3f5f75315\"}":{"__typename":"Favorites","uuid":"9c403a2e-d739-48be-9bd7-a9c3f5f75315","photoUrl":"https://ucarecdn.com/1d0e1d97-ed68-485e-ae2e-aa6d215b6413/","title":"Barcelona","type":"CITY"},"Favorites:{\"uuid\":\"3a492385-4478-475b-b629-f0dbeb83e887\"}":{"__typename":"Favorites","uuid":"3a492385-4478-475b-b629-f0dbeb83e887","photoUrl":"https://ucarecdn.com/80887949-bf29-4fad-b3bf-761e5f9c66a2/","title":"Lionel Messi","type":"ATHLETE"},"Favorites:{\"uuid\":\"7592334b-c06d-4488-95b9-5e3b60701ec0\"}":{"__typename":"Favorites","uuid":"7592334b-c06d-4488-95b9-5e3b60701ec0","photoUrl":"https://ucarecdn.com/4a9c0e36-55b7-497e-8a78-a282f43d2eef/","title":"Un Verano Sin Ti","type":"ALBUM"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"15879e97-cbfb-42cd-a977-64c45f1ccfde\"}":{"__typename":"DeepDives","uuid":"15879e97-cbfb-42cd-a977-64c45f1ccfde","content":"\u003cp\u003eI launched \u003cem\u003eThe Green Room,\u003c/em\u003e a filmed comedy podcast at Northwestern that blends real, raw conversations with humor to make people laugh and think. In under a year, we’ve hosted professional comedians, TikTok celebrities, and campus basketball stars. The podcast has  reached over 150,000 views across social media platforms, and it’s been incredible to see it grow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2490079b-5d6c-4041-8f59-18164146b68f\"}":{"__typename":"DeepDives","uuid":"2490079b-5d6c-4041-8f59-18164146b68f","content":"\u003cp\u003eAs cliché as it sounds, be yourself and lean into your passions, whatever they may be. In high school, I often felt caught between two worlds: the theater kids and the athletes. I loved musical theater, but I also loved playing sports. During my junior year, I was the starting center midfielder for the varsity soccer team and was cast as the lead in the school musical. At first, I didn’t want to take the role—I was afraid of being made fun of and fully embracing the “theater kid” label, a group I never completely fit into.\u003c/p\u003e\u003cp\u003eThankfully, I took the leap. On opening night, the captain of the football team came up to me and said, \u003cem\u003e“Bro, I always sleep through these things, but you were so funny I didn’t even nap. Good job.”\u003c/em\u003e That moment taught me an important lesson: I didn’t have to fit into a single box. I’m not  a jock or a theater kid—I’m me.\u003c/p\u003e\u003cp\u003eForget trying to fit into a label. Be yourself. It’ll always pay off.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0d3290c5-d24d-474d-9516-001f56a1bff8\"}":{"__typename":"DeepDives","uuid":"0d3290c5-d24d-474d-9516-001f56a1bff8","content":"\u003cp\u003eI chose to be a mentor because I know how much my younger self would have benefited from having someone like this in their corner. That’s why I’m so drawn to Curious Cardinals—it’s not just transactional tutoring; it’s about building real connections and having meaningful conversations that go beyond the subject at hand. I love helping people grow, sharing knowledge, and creating genuine connections. Mentorship gives me the opportunity to do all of that while making a lasting impact, and that’s something I’m truly passionate about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"6b1a7521-4649-498f-83df-d1c587932f5d\"}":{"__typename":"DeepDives","uuid":"6b1a7521-4649-498f-83df-d1c587932f5d","content":"\u003cp\u003eI want to get good at dancing Salsa. Like \u003cem\u003ereally\u003c/em\u003e good.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"4bb04755-5015-4db4-8e70-a20937f9a249\"}":{"__typename":"School","uuid":"4bb04755-5015-4db4-8e70-a20937f9a249","name":"Wilmington Friends School","city":"Wilmington","type":"HIGH","state":"Delaware","country":"United States","zip":"19803"},"Education:{\"uuid\":\"1b449431-2790-4243-a1fb-c071237737cb\"}":{"__typename":"Education","uuid":"1b449431-2790-4243-a1fb-c071237737cb","school":{"__ref":"School:{\"uuid\":\"4bb04755-5015-4db4-8e70-a20937f9a249\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"da4197d5-cfde-4180-b1c2-153e7964936c\"}":{"__typename":"Education","uuid":"da4197d5-cfde-4180-b1c2-153e7964936c","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Radio/TV/Film","degree":null},"MentorPublicProfile:{\"uuid\":\"139c03d7-abcb-4587-8760-09e5905ac96f\"}":{"__typename":"MentorPublicProfile","uuid":"139c03d7-abcb-4587-8760-09e5905ac96f","displayName":"Andres P.","slug":"andres-pardo","biography":"\u003cp\u003eHi, I’m Andrés! I care deeply about connection—whether it’s through laughter, storytelling, or meaningful conversations. I believe everyone has a unique story to tell, and I love finding ways to help people express themselves and grow, whether it’s on stage, on a podcast, or in a tutoring session.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m a senior at Northwestern University, where I study Radio/Television/Film with minors in Entrepreneurship and Portuguese. My studies combine my love for creativity with practical skills in media production and business. Along the way, I’ve explored acting, filmmaking, and storytelling, and I’ve learned how to take ideas from concept to reality.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’m all about creative projects and performance. I co-host \u003cem\u003eThe Green Room\u003c/em\u003e, a comedy podcast where we dive into humor, interviews, and lively discussions. I also host \u003cem\u003eThe Shallow End\u003c/em\u003e, a satirical campus news show that blends comedy and current events. On campus, I’ve performed stand-up and improv, and I co-founded Northwestern’s only open-access improv troupe to make comedy a welcoming space for everyone. Sharing laughter and connecting with audiences has been one of the most rewarding parts of my college experience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I need to recharge, you’ll find me outdoors. Whether its hiking through the mountains, snowboarding, or playing soccer, being outside and active is an integral part of who I am. Music is another big passion of mine; as the lead singer for my band, \u003cem\u003eWalter\u003c/em\u003e, I get to collaborate and create performances that bring people together. Whether I’m on stage with a mic or in front of the camera, performing is my way of expressing myself and building meaningful connections.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a proud Puerto Rican, I’m passionate about sharing my heritage. Working as a tour guide in Puerto Rico has allowed me to introduce visitors to our island’s rich culture, from its vibrant history to the sounds of bomba and the taste of fresh empanadas. It’s incredibly fulfilling to help others experience what makes Puerto Rico so special. Speaking Portuguese has also been a meaningful journey, giving me new ways to engage with Latin culture and connect with people across languages.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the heart of everything I do is a love for learning and helping others succeed. Whether it’s sharing a laugh, breaking down a tough concept, or celebrating a breakthrough, I’m passionate about creating spaces where people feel supported and empowered. I’m excited to bring that energy to tutoring and help you reach your goals!\u003c/p\u003e","teachingVideoPlaybackId":"mzhSKtiBKrDNv00n8dlsSWXTO1Y29vLE9TVPC7cWRCpM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9c403a2e-d739-48be-9bd7-a9c3f5f75315\"}"},{"__ref":"Favorites:{\"uuid\":\"3a492385-4478-475b-b629-f0dbeb83e887\"}"},{"__ref":"Favorites:{\"uuid\":\"7592334b-c06d-4488-95b9-5e3b60701ec0\"}"}],"causesSupported":[],"major":"Radio/TV/Film","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"15879e97-cbfb-42cd-a977-64c45f1ccfde\"}"},{"__ref":"DeepDives:{\"uuid\":\"2490079b-5d6c-4041-8f59-18164146b68f\"}"},{"__ref":"DeepDives:{\"uuid\":\"0d3290c5-d24d-474d-9516-001f56a1bff8\"}"},{"__ref":"DeepDives:{\"uuid\":\"6b1a7521-4649-498f-83df-d1c587932f5d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/141694e1-2e77-4ebd-8bca-cf9314c01443/-/preview/-/format/jpg/"],"prono
