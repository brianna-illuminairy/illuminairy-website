xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7a9923ad-5df3-4428-9f8f-03daeffb9054\"}":{"__typename":"DeepDives","uuid":"7a9923ad-5df3-4428-9f8f-03daeffb9054","content":"\u003cp\u003eI was homeschooled until ninth grade and was privileged enough to have access to tutors, such as family friends or local teachers, who taught me in one-on-one or small-group settings. So from a young age, this small-scale teaching style facilitated intimate learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne such tutor was Miss Amy. She has since written multiple books, run multiple marathons, become the first female broadcaster on a sports radio station in my city for the St. Louis Blues hockey team, and now co-hosts her own political radio show. But before all that, she was my writing tutor. She taught me pretty much everything I know about putting together a sentence. My earliest memories with writing consisted of my sitting on her lap and dictating to her weekly newsletters, on topics ranging from safari animals to whoopee cushions. This environment encouraged me to explore my interests in a free-form fashion so I could develop the independence to write on my own in the future.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow, I am a college student studying International Relations, a major encompassing many aspects of both written and verbal communication. And I can honestly say that Miss Amy started and continued my journey with this skillset.\u0026nbsp;\u003c/p\u003e\u003cp\u003eCurious Cardinals prides itself in its relational approach, cultivating long-term dynamics between students and tutors over long periods of time—maybe even years. So I want to be for someone what Miss Amy was for me.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"33628398-d2e2-413a-bf56-7b94887def1a\"}":{"__typename":"DeepDives","uuid":"33628398-d2e2-413a-bf56-7b94887def1a","content":"\u003cp\u003eWhen I am not studying, I conduct research for my major advisor regarding Liberia’s intended war crimes court, presenting my findings in weekly meetings and having thoughtful conversations spurring me on to further research.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I am a member of the field hockey team, where I enjoy competing with my teammates in practice, conditioning, and lift, and travel with them from coast to coast for games.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond hockey, I take any opportunity to be active–boxing, taking a hike, (and might have an untapped interest in triathlons). I am a sucker for spontaneity and adventure and would visit every continent if given the chance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn between activities, you will often find me listening to music, whether R\u0026amp;B, Gospel, oldies, jazz, boogie, or anything Michael Jackson. I enjoy singing and playing the box drum for a Christian athlete group (FCA) on campus, freestyle dancing (whenever a good song comes on), and helping lead a club (Tikkun Olam Makers or TOM) for medical devices.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, this spring I am looking forward to volunteering at a local homeless shelter for Spanish-speaking youth and organizing service work for urban ministries through my youth group.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"883b4558-8090-4ee4-9562-5f8a51e2dc35\"}":{"__typename":"DeepDives","uuid":"883b4558-8090-4ee4-9562-5f8a51e2dc35","content":"\u003cp\u003eComing from a family of six kids, it has always been important for me to work. So although June and July would be packed with field hockey tournaments, I made sure to tuck in work opportunities between these dates. Many of my jobs have been in the food industry, working as a waitress for a quaint general store/restaurant a block from my house or a roller-skate waitress for a local Sonic (:\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, I enjoy spending quality time with kids, especially from inner-city communities. So the past two summers, I have worked at a Christian sports camp designed for urban youth, engaging in activities such as tubing, archery, dancing/making cheers, and faith-driven fellowship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a72b2e2f-8219-4457-9569-8d52a4fffc22\"}":{"__typename":"DeepDives","uuid":"a72b2e2f-8219-4457-9569-8d52a4fffc22","content":"\u003cp\u003eAlongside my major advisor, I am researching Liberia’s impending war crimes court to supplement a case study in his future book. During weekly meetings, I present my findings and receive feedback on research techniques. Sectors of research include the court’s planning, timeline, background, role of Liberian government and international community, prospects moving forward.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut beyond this structure, my professor allows me to delve into “rabbit trails” and see where the research naturally takes me. For example, last week I learned about the election of corrupt officials to this court. Ironically, many of these officials are often linked to the previous war lord responsible for overseeing the war atrocities, previously working for him in some capacity. So although the war lord was convicted and sentenced to five years in jail, his influence still lingers in the country. So this week, I decided to investigate who might be the loyal parties of this war lord, only to discover that he has been making phone calls to his previous rebel faction party \u003cem\u003ein prison\u003c/em\u003e, consulting them on decision-making.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUnearthing information like this propels me to continue exploring each week. And even better, I get to dialogue with my professor who knows ten times more than I do. Every time I leave our conversations, I feel like I learned even just 1% more about the topic, which propels me to further research.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"ee2cc507-42e8-4c3a-b7bd-1e2623f6ddf5\"}":{"__typename":"School","uuid":"ee2cc507-42e8-4c3a-b7bd-1e2623f6ddf5","name":"John Burroughs School","city":"St. Louis","type":"HIGH","state":"Missouri","country":"United States","zip":"63124"},"Education:{\"uuid\":\"7a4e8cce-e3e7-4a1b-9e29-f04298d1c648\"}":{"__typename":"Education","uuid":"7a4e8cce-e3e7-4a1b-9e29-f04298d1c648","school":{"__ref":"School:{\"uuid\":\"ee2cc507-42e8-4c3a-b7bd-1e2623f6ddf5\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b7023554-f14b-4ca2-ba38-bfea9b353f5b\"}":{"__typename":"Education","uuid":"b7023554-f14b-4ca2-ba38-bfea9b353f5b","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"International Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"9a078d85-5aaf-4e92-8e1d-4cf9b3d685f4\"}":{"__typename":"MentorPublicProfile","uuid":"9a078d85-5aaf-4e92-8e1d-4cf9b3d685f4","displayName":"Esther P.","slug":"esther-pottebaum","biography":"\u003cp\u003ePleasure to meet you! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have the privilege of studying International Relations with a primary specialization in Social Development and Human Well-Being. On a broad level, I am driven to study factors which affect the quality of life for marginalized populations. In particular, my areas of geographical interest include Africa and Latin America. Upon graduation, I plan on attending law school to gain the expertise to craft innovative yet legally feasible policies. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy goal is to empower the political rights of locals, particularly at the community level, through implementing their opinions into long-term solutions. These aspirations for law diverge into two directions–either international or urban planning law. The former interest was sparked when participating in Model UN for several years in high school, as I got to debate and collaborate on proposals regarding hometown-specific issues as well as issues in representing countries around the world. I am continuing to pursue this interest by learning specifically about transitional justice and the intersection of domestic and international judicial standards. In college, I have taken several courses on rebel groups and post-conflict societies, for example, and am currently conducting research for a professor on Liberia’s impending war crimes court. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe latter, urban planning law, has grabbed my interest ever since I got involved in a community development project through my home church, which is renovating an abandoned strip mall into a business collaboration space, daycare, bank for micro loans, café, and church. I am drawn to the core mission of this project, which is not contributing resources to the neighborhood, but facilitating long-term change by stimulating employment, strengthening family dynamics, and addressing community-specific needs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately regarding both interests, I seek to bridge the gap between academia and the real world by using learned knowledge to extend impact beyond the walls of the classroom through fieldwork and first-hand experience with the target population. \u003c/p\u003e","teachingVideoPlaybackId":"hCWRgy26sNKJWdWKd402gwh015rmeSjqrgxD9GwlU4cb00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7a9923ad-5df3-4428-9f8f-03daeffb9054\"}"},{"__ref":"DeepDives:{\"uuid\":\"33628398-d2e2-413a-bf56-7b94887def1a\"}"},{"__ref":"DeepDives:{\"uuid\":\"883b4558-8090-4ee4-9562-5f8a51e2dc35\"}"},{"__ref":"DeepDives:{\"uuid\":\"a72b2e2f-8219-4457-9569-8d52a4fffc22\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/574a6058-b4e2-4c65-88a2-53d51668d831/-/preview/-/format/jpg/","https://ucarecdn.com/2922a22e-b847-4aa6-93f3-5996e81aab20/-/preview/-/format/jpg/","https://ucarecdn.com/253ed569-10ef-4754-82c3-6a9c52184f2b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"7a4e8cce-e3e7-4a1b-9e29-f04298d1c648\"}"},{"__ref":"Education:{\"uuid\":\"b7023554-f14b-4ca2-ba38-bfea9b353f5b\"}"}],"hiredAt":"
