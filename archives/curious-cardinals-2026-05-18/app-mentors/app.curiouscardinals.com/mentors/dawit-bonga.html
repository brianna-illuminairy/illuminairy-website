time, I love playing basketball, getting lost in video games (no one does FIFA like me), and exploring new places. I recently traveled to Puerto Rico for the first time—it was an amazing experience, and it made me want to travel as much as I can.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I stayed deeply involved in my community. I worked with a nonprofit called Mission Bit to bring tech education to students from underrepresented areas. Through Mission Bit, I helped organize large-scale events like hackathons and info sessions with companies like Verizon and Bloomberg. I also led clothing drives and fundraisers to support local homeless shelters. My community involvement earned me several awards, and I was honored to become both a Gates Scholar and an Amazon Future Engineer.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow at Yale, I stay active in the New Haven community by tutoring students and volunteering at food banks. I’m also continuing to grow my technical skills through personal coding projects and by working as a student tech helper.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m really excited to be your CC mentor. I truly believe everyone has so much potential—and having the right support can make all the difference in unlocking it.\u003c/p\u003e","teachingVideoPlaybackId":"jpuCxlBxwr7kz2ntjoGQPMUO95Vq02q86klOiWfZlV94","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science and History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1c7ed67d-1ef4-4b2c-9c97-d96432a96099\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d0433c8-be6f-4f58-8363-01b20c9b841b\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e41d6cd-7c2c-4650-829e-320d2ea26b87\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3e4e2006-e6b9-4194-96d1-1b578439692b/-/preview/-/format/jpg/","https://ucarecdn.com/b03135fb-abd5-4c48-8d54-baf5f65c29d1/-/preview/-/format/jpg/","https://ucarecdn.com/dc0e92ce-d31a-4dcb-bdce-ad0e2a2f1522/-/preview/-/f
