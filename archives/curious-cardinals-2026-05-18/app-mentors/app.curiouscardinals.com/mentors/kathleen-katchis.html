xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2f2c2202-0019-4cd5-81c0-c977b608556b\"}":{"__typename":"Favorites","uuid":"2f2c2202-0019-4cd5-81c0-c977b608556b","photoUrl":"https://ucarecdn.com/96d188c6-f14c-4764-86ee-2f27bb901e9b/","title":"The Defining Decade","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ef5a1eca-4148-4a1b-829a-fba51c212d9d\"}":{"__typename":"DeepDives","uuid":"ef5a1eca-4148-4a1b-829a-fba51c212d9d","content":"\u003cp\u003eI decided to major in Computer Science because I wanted to develop solid quantitative skills while also tapping into my creative side. Computer science is a field where you can mix technical know-how with creativity, which has allowed me to work on cool projects and uncover exciting insights.\u003c/p\u003e\u003cp\u003eAnother big reason I chose this path is because AI is changing the game across every industry, and I wanted to be right in the middle of that transformation. Staying ahead of these trends is not only exciting, but it’s also crucial for my long-term goal of pursuing a career in technology and patent law. \u003c/p\u003e\u003cp\u003eAs a mentor, I’m excited to bring this experience and enthusiasm to help you on your journey. I know firsthand how challenging and rewarding it can be to navigate computer science, and I’m here to help you build your skills, explore your creativity, and understand how technology is shaping our world. I’m looking forward to sharing what I’ve learned and helping you achieve your goals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e8f026ba-bf2a-4c72-b2e8-0af8abf335be\"}":{"__typename":"DeepDives","uuid":"e8f026ba-bf2a-4c72-b2e8-0af8abf335be","content":"\u003cp\u003eMentorship matters to me because it’s been a game-changer in my own life. Throughout my academic and professional journey, I’ve been lucky to have mentors who guided, supported, and challenged me. They helped me see my potential, navigate difficult decisions, and stay motivated when things got tough. Without their influence, I wouldn’t be where I am today.\u003c/p\u003e\u003cp\u003eBecause of those experiences, I’m passionate about the role I can play as a mentor to others. I know how impactful it can be to have someone in your corner who genuinely cares about your success and is willing to share their knowledge and experiences. Mentorship is about more than just giving advice—it’s about building relationships, inspiring confidence, and helping others realize what they’re capable of. For me, it’s incredibly rewarding to be that source of support for someone else, especially when I see them achieve their goals and grow into their potential. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"3691c1c9-6f89-4dec-b50e-00e4f89ef733\"}":{"__typename":"School","uuid":"3691c1c9-6f89-4dec-b50e-00e4f89ef733","name":"John L Miller North High School","city":"Great Neck","type":"HIGH","state":"New York","country":"United States","zip":"11023"},"Education:{\"uuid\":\"b0702a29-952b-45fa-8cdb-ee62e5d9dcf1\"}":{"__typename":"Education","uuid":"b0702a29-952b-45fa-8cdb-ee62e5d9dcf1","school":{"__ref":"School:{\"uuid\":\"3691c1c9-6f89-4dec-b50e-00e4f89ef733\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"9683ad82-e539-44c9-8561-b5123e6122bd\"}":{"__typename":"Education","uuid":"9683ad82-e539-44c9-8561-b5123e6122bd","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"550cae83-c10b-4ea1-ab04-9dbd9d301090\"}":{"__typename":"MentorPublicProfile","uuid":"550cae83-c10b-4ea1-ab04-9dbd9d301090","displayName":"Kathleen K.","slug":"kathleen-katchis","biography":"\u003cp\u003eHi there! I’m Kathleen Katchis, and I’m excited to tell you why I’d love to be your mentor through Curious Cardinals. I recently graduated from Vanderbilt University with a degree in Computer Science and Engineering Management, and I’m currently working as a Strategy Analyst at Capital One. I’m passionate about the intersections of business, technology, and law—fields that I’m continuing to explore as I prepare to apply to law school.\u003c/p\u003e\u003cp\u003eWhat truly drives me is helping students like you achieve your academic and passion project goals, especially in the realms of computer science, business, and STEM. Throughout my own journey, I’ve been lucky to have amazing mentors who have supported and guided me, and now I want to pay that forward.\u003c/p\u003e\u003cp\u003eI’ve had the opportunity to tutor students for the ACT, work as a STEM Peer Tutor at Vanderbilt, mentor new students at Vanderbilt’s School of Engineering, and serve as a teaching assistant for Program Design and Data Structures. These experiences have shown me how impactful a good mentor can be, and I’m eager to bring that same support to you.\u003c/p\u003e\u003cp\u003eWhether you’re looking to excel in your studies, start a new project, or just need someone to help you navigate the challenges and opportunities ahead, I’m here to help. I’m passionate about breaking down complex concepts, providing guidance on how to approach big goals, and sharing insights from my experiences in computer science, business, and STEM.\u003c/p\u003e\u003cp\u003eIn my free time, I love to travel, try new restaurants, and stay active—so I know how important it is to balance hard work with the things you love. As your mentor, I’m committed to helping you find that balance while achieving your goals.\u003c/p\u003e","teachingVideoPlaybackId":"QYDe2A015pH02YhCoKdS22X9m9MSYAdhp5Ij3X6BB321M","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2f2c2202-0019-4cd5-81c0-c977b608556b\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ef5a1eca-4148-4a1b-829a-fba51c212d9d\"}"},{"__ref":"DeepDives:{\"uuid\":\"e8f026ba-bf2a-4c72-b2e8-0af8abf335be\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7c02dc2d-4a6b-4587-a6a2-0ebfad9fd52d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b0702a29-952b-45fa-8cdb-ee62e5d9dcf1\"}"},{"__ref":"Education:{\"uuid\":\"9683ad82-e539-44c9-8561-b5123e6122bd\"}"}],"hiredAt":"2024-08-14T22:06:27.364Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kathleen-katchis\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"550cae83-c10b-4ea1-ab04-9dbd9d301090\"}"}}},"_sentryTraceData":"74b377a3bf454b2bb311c5f3db7c7431-9996380048237ad9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=74b377a3bf454b2bb311c5f3db7c7431,
