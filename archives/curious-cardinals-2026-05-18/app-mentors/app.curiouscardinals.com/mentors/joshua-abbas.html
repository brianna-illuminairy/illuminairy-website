{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics and Statistics","degree":null},"MentorPublicProfile:{\"uuid\":\"021d34c1-093c-49c6-a1b0-4967a664e05c\"}":{"__typename":"MentorPublicProfile","uuid":"021d34c1-093c-49c6-a1b0-4967a664e05c","displayName":"Joshua A.","slug":"joshua-abbas","biography":"\u003cp\u003eMy name is Josh, and I am a sophomore at Duke University studying Economics and Statistics. I have been interested in mathematics and investing from a young age, so the double major was my best fit. In high school, I was an FBLA national champion, investing club founder, and started my own film marketing agency, which were accomplishments that helped me propel as a college student. I also took French throughout high school, and I am proficient in Spanish, which are great languages to learn.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile I am currently still deciding what I want to do postgrad, I am most interested in management consulting, private equity, capital markets, and hedge funds. When I am not in school, you can find me giving tours on Duke’s campus as a tour guide, watching/playing basketball, working out at the gym, and spending time with my friends in the dining hall. I am a huge country/rap, sports, and poker fan, but I enjoy talking to people about literally anything.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have been a mentor for students since high school, where I mainly focused on SAT tutoring, college applications, and mathematics. As someone who didn’t grow up with many financial resources, I struggled to get through high school, start passion projects, and understand the daunting college application process. My parents are immigrants from Iran and Peru, so they knew nothing about the American academic system and how to support me in my endeavors. Curious Cardinals was an excellent fit for me because I want to be a resource for mentees to discu
