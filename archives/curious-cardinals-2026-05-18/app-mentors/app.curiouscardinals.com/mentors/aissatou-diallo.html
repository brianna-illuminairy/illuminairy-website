xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"1b5831c3-1b94-4f96-964c-5985951012dc\"}":{"__typename":"DeepDives","uuid":"1b5831c3-1b94-4f96-964c-5985951012dc","content":"\u003cp\u003eI was all over the place in high school. I loved both Math and English, played soccer, did theater, never missed a club meeting, managed the basketball team, and danced even though I wasn’t particularly good at it. I’ve since honed in on my interests, but I’m still deeply inspired by the curious, energetic girl I was back then. She said yes to everything that sparked joy, and I try to carry that same energy into everything I do today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ecfb3459-1cf6-4c0b-a705-6f875a0015fa\"}":{"__typename":"DeepDives","uuid":"ecfb3459-1cf6-4c0b-a705-6f875a0015fa","content":"\u003cp\u003eI’d tell my middle and high school self to remember the things you truly love to do—and not just remember them, but \u003cem\u003ecommit\u003c/em\u003e to them. It’s easy to commit to things society tells you are important—grades, schools, jobs—but the things that light you up from the inside? They matter just as much. Whether it’s running, making jewelry, writing, or watching films until you start seeing the world in scenes and camera angles—those passions aren’t distractions, they’re directions. They make you more grounded, more imaginative, and more yourself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"3fb28d3d-8498-4f11-98da-26ce3cc59392\"}":{"__typename":"DeepDives","uuid":"3fb28d3d-8498-4f11-98da-26ce3cc59392","content":"\u003cp\u003eMy greatest role model is Ms. Kussell, my middle school math teacher—who later became an assistant principal and, over time, one of my closest friends. I’ve known her for ten years now, and it’s been a true gift not just to have her as a mentor, but to watch her grow and be continually inspired by the life she leads. If I’m lucky, I hope to be just like her someday: kind, sharp, endlessly curious, an avid reader, a gardener, an honest person, and a truly \u003cem\u003egreat\u003c/em\u003e teacher—both in and outside the classroom.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"d072be1b-40b7-4247-bbbc-779501444749\"}":{"__typename":"DeepDives","uuid":"d072be1b-40b7-4247-bbbc-779501444749","content":"\u003cp\u003eMy mother was born and raised in Guinea, and one of the greatest gifts she gave me was a deep appreciation for slowness—not in the sense of being behind, but in embracing a patient, deliberate approach to life. In our home, learning happened slowly: through storytelling, slow cooking, long conversations with relatives that stretched late into the night. That same spirit shapes my teaching style today. I believe real learning takes time, and that rushing through concepts or forcing pace can get in the way of true understanding. I try to create space for reflection, repetition, and relationship—trusting that sometimes the slowest path is actually the most meaningful one.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}":{"__typename":"School","uuid":"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5","name":"Choate Rosemary Hall","city":"Wallingford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06492"},"Education:{\"uuid\":\"70da8d47-07cc-40fd-9c17-0b2ca234aead\"}":{"__typename":"Education","uuid":"70da8d47-07cc-40fd-9c17-0b2ca234aead","school":{"__ref":"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"a5b9361e-3492-42eb-9f02-0a17b297805b\"}":{"__typename":"Education","uuid":"a5b9361e-3492-42eb-9f02-0a17b297805b","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"History and Literature ","degree":null},"MentorPublicProfile:{\"uuid\":\"e6cebcee-4ac1-412a-a390-f719d1e17215\"}":{"__typename":"MentorPublicProfile","uuid":"e6cebcee-4ac1-412a-a390-f719d1e17215","displayName":"Aissatou D.","slug":"aissatou-diallo","biography":"\u003cp\u003eHi! I’m Aissatou (eye-ash-too), a Harvard senior graduating with High Honors in History \u0026amp; Literature and a minor in Computer Science. Within my major, I focused on American Studies with a subfield in film, and I have a deep love for analyzing art and cinema—especially how culture and storytelling intersect. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI previously created K–12 sustainability lessons across NYC public schools that helped students connect environmental concepts to daily life. I’ve also mentored high-schoolers through SAT prep, essay writing, and creative passion projects—one highlight was supporting a team that launched its own fashion magazine. Throughout my mentorship work, I’ve developed focus-building strategies for students with ADHD and mood disorders, ensuring they feel seen, supported, and empowered to excel. I also used to be co-director of Harvard's peer-counselling group! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’m passionate about politics, creative writing, jewelry-making, and running—I even ran the New York City Marathon my sophomore year. Whether I’m editing a short film, organizing a community project, or coding, I’m driven by curiosity, creativity, and a commitment to helping others find their voice.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History and Literature ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1b5831c3-1b94-4f96-964c-5985951012dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"ecfb3459-1cf6-4c0b-a705-6f875a0015fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"3fb28d3d-8498-4f11-98da-26ce3cc59392\"}"},{"__ref":"DeepDives:{\"uuid\":\"d072be1b-40b7-4247-bbbc-779501444749\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/56b5636b-b8b0-4a9a-b496-7223d05ea158/-/preview/-/format/jpg/","https://ucarecdn.com/70a54bd0-4c0e-4585-9c1e-3c8f98bc69fc/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"70da8d47-07cc-40fd-9c17-0b2ca234aead\"}"},{"__ref":"Education:{\"uuid\":\"a5b9361e-3492-42eb-9f02-0a17b297805b\"}"}],"hiredAt":"2025-04-29T13:13:34.998Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Writing","French","College Essay Writing","Reading","History","Academic Coaching"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"aissatou-diallo\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e6cebcee-4ac1-412a-a390-f719d1e17215\"}"}}},"_sentryTraceData":"1fc996920206485ebbd9344074a40386-8327bb8b1ae17c8c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1fc996920206485ebbd9344074a40386,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"aissatou-diallo"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
