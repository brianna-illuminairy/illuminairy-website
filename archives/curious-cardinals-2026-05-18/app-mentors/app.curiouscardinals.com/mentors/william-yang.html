xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"abe484ac-66a4-4575-910b-0865e6bd1f4e\"}":{"__typename":"Favorites","uuid":"abe484ac-66a4-4575-910b-0865e6bd1f4e","photoUrl":"https://ucarecdn.com/ba41dde0-375c-40d9-a283-28a07f0c3852/","title":"Volleyball","type":"SPORT"},"Favorites:{\"uuid\":\"5edf1527-9e4e-4fcd-8aca-b10214eb85fb\"}":{"__typename":"Favorites","uuid":"5edf1527-9e4e-4fcd-8aca-b10214eb85fb","photoUrl":"https://ucarecdn.com/0aed5640-0db7-43d5-8b73-fae1659186d0/","title":"Laufey","type":"ARTIST"},"Favorites:{\"uuid\":\"5b110384-0f1c-4838-893f-3c5e2ab771f9\"}":{"__typename":"Favorites","uuid":"5b110384-0f1c-4838-893f-3c5e2ab771f9","photoUrl":"https://ucarecdn.com/6c4b20bf-6050-4b75-b8fc-90db000d2a3d/","title":"Che gelida manina","type":"SONG"},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"c42265ff-e309-4abf-afb7-0f0d0c62ee9f\"}":{"__typename":"DeepDives","uuid":"c42265ff-e309-4abf-afb7-0f0d0c62ee9f","content":"\u003cp\u003eWhen I was in 2nd grade, I read a book about Thomas Edison and decided I was going to be an inventor. It felt like a silly childhood dream at the time, but I stuck with it — and now I get to “invent” for real through my research in communication technologies, finding new ways to bring the world together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"5142742e-9aef-412f-8281-71df4fdc0a07\"}":{"__typename":"DeepDives","uuid":"5142742e-9aef-412f-8281-71df4fdc0a07","content":"\u003cp\u003eIn middle and high school, I was definitely curious and smart, but also pretty stubborn. I had lots of passions but didn’t always know how to turn them into something concrete — and I wasn’t the best at taking risks. Eventually, I figured out how to channel that stubbornness into trying new things, and learned that taking a few calculated risks can actually open the door to some really exciting achievements.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f402bcae-bf05-4362-b2bd-86d99fb32ed9\"}":{"__typename":"DeepDives","uuid":"f402bcae-bf05-4362-b2bd-86d99fb32ed9","content":"\u003cp\u003eI’ve been lucky to have phenomenal mentors guiding me at every step, and I believe deeply in paying it forward. Mentorship excites me because I know the students I work with will go on to make an even greater impact on the world than I ever could.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2959ebaa-12cf-49a6-a281-f9d319c5de1e\"}":{"__typename":"DeepDives","uuid":"2959ebaa-12cf-49a6-a281-f9d319c5de1e","content":"\u003cp\u003eI knew I wanted to do some kind of engineering, but I wasn’t set on electrical at all — it was almost a happy accident that I took the intro to circuits course first. To my surprise, I absolutely loved it. One class led to another, and soon I was geeking out over semiconductors and communication technologies. What started as a chance class ended up sparking a passion that grew into my career path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"1c090e5f-9a33-4edc-8e49-040cd0e17b93\"}":{"__typename":"School","uuid":"1c090e5f-9a33-4edc-8e49-040cd0e17b93","name":"Keller High School","city":"Keller","type":"HIGH","state":"Texas","country":"United States","zip":"76248"},"Education:{\"uuid\":\"2700834c-1afe-4c62-a2fc-e6b20c272693\"}":{"__typename":"Education","uuid":"2700834c-1afe-4c62-a2fc-e6b20c272693","school":{"__ref":"School:{\"uuid\":\"1c090e5f-9a33-4edc-8e49-040cd0e17b93\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"7605abf0-f6b3-4333-9236-6c563318cde9\"}":{"__typename":"Education","uuid":"7605abf0-f6b3-4333-9236-6c563318cde9","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"cafc997e-0570-4c2d-8dca-ae1eb20e696d\"}":{"__typename":"MentorPublicProfile","uuid":"cafc997e-0570-4c2d-8dca-ae1eb20e696d","displayName":"William Y.","slug":"william-yang","biography":"\u003cp\u003eHi! I’m William, a first-year Electrical Engineering PhD student at the University of Pennsylvania. I recently graduated from Princeton University with a Bachelor’s degree in Electrical and Computer Engineering, where I also pursued minors in Computer Science and Vocal Performance. I’m passionate about helping students connect their curiosity in STEM or the arts to hands-on projects they’ll be proud to share.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I was in high school, I was fascinated by STEM, robotics, and music — but I didn’t know how to bring those passions together into something both real and marketable. At Princeton, I found ways to do just that:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearched machine learning for circuit design\u003c/strong\u003e (i.e., teaching computers to design electronics) and presented at the International Solid-State Circuits Conference\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDesigned and taught STEM workshops\u003c/strong\u003e as director of IgniteSTEM, Princeton’s education-oriented entrepreneurship club\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePursued my passion for singing\u003c/strong\u003e, performing in operas and traveling internationally with my a cappella group\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI love showing students that your interests don’t have to fit into a box — you can combine them in exciting and unexpected ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI specialize in guiding K-12 students through:\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege-readiness projects \u003c/strong\u003e(research experiences, competitions, portfolios, and presentations to help build credibility for your passions)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003c/strong\u003e (starting a club or nonprofit, designing an engineering prototype, or creative projects in music)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch mentorship\u003c/strong\u003e (learning about the research process, designing and running projects, and presenting your findings with confidence)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePortfolio building\u003c/strong\u003e (curating recordings, repertoire, and performance videos to showcase for auditions or applications)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSTEM subject guidance\u003c/strong\u003e (math, physics, computer science, electronics/robotics)\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAs a TA for Princeton’s ECE courses and labs, a leader with IgniteSTEM, and a mentor for peers in both engineering and music, I’ve guided students through projects ranging from coding a simulation to writing research abstracts to preparing performances. Students and parents can feel confident that I bring both academic rigor and coaching experience to every session.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming innovative project ideas and connecting them to real-world applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding out a week-by-week roadmap so you feel confident and supported\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGuiding you through application material preparation from essays and resumes to portfolios and presentation practice\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down a complex concept into easy, visual steps\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eOutside of engineering\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I like to sing, thrift, and play volleyball with friends. Otherwise, I’m most likely working on my engineering projects and PhD research while listening to my 7-hour opera playlist on a loop.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re excited to explore your interests, try ambitious projects, and grow your confidence, I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"sNzzkcwPCommnXkuReP01uSF02QRSqJ1bwz6H3kSyfm01Q","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"abe484ac-66a4-4575-910b-0865e6bd1f4e\"}"},{"__ref":"Favorites:{\"uuid\":\"5edf1527-9e4e-4fcd-8aca-b10214eb85fb\"}"},{"__ref":"Favorites:{\"uuid\":\"5b110384-0f1c-4838-893f-3c5e2ab771f9\"}"}],"causesSupported":[],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c42265ff-e309-4abf-afb7-0f0d0c62ee9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"5142742e-9aef-412f-8281-71df4fdc0a07\"}"},{"__ref":"DeepDives:{\"uuid\":\"f402bcae-bf05-4362-b2bd-86d99fb32ed9\"}"},{"__ref":"DeepDives:{\"uuid\":\"2959ebaa-12cf-49a6-a281-f9d319c5de1e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/181c0c8d-3a09-4a12-a1e7-84f359dde688/-/preview/-/format/jpg/","https://ucarecdn.com/21756cc6-76d3-4a2d-b9e9-526f351de290/-/preview/-/format/jpg/","https://ucarecdn.com/3fa23e96-3b72-4975-b562-8fb41e701537/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2700834c-1afe-4c62-a2fc-e6b20c272693\"}"},{"__ref":"Education:{\"uuid\":\"7605abf0-f6b3-4333-9236-6c563318cde9\"}"}],"hiredAt":"2025-09-26T08:27:39.633Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Physics","Academic Coaching","Executive Function","Computer Science","Music","Coding / Programming","Robotics / Electronics / CAD","Machine Learning / AI","STEM Project"],"communi
