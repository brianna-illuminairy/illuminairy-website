74287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"ba706b7c-e37d-430b-83f7-0183d8532720\"}":{"__typename":"MentorPublicProfile","uuid":"ba706b7c-e37d-430b-83f7-0183d8532720","displayName":"Mahalia F.","slug":"mahalia-foster-1","biography":"\u003cp\u003eHi! My name is Mahalia, and I’m a third-year student studying biomedical engineering at Northwestern University. I grew up in Brooklyn Park, Minnesota, and I completed the IB diploma program at my school, which allowed me to achieve my goal of being admitted to Northwestern!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship has always been a significant part of my life. I was a peer leader in both middle and high school, and I have been a Peer Adviser at Northwestern for 2 years. I love helping students navigate how to achieve their goals, and I especially enjoy and am skilled at helping students navigate times of transition.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I was in high school, I struggled with organization and time management. This meant that I had to workshop a lot of different organization and study skills. I believe that organization looks different for everyone, and I’m committed to helping students find methods and tools that work best for them.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am very passionate about math and science, but since I was in the IB program in high school, I have experience taking high-level classes in every subject. I was a member of my high school’s math league team, and I have a lot of experience teaching math subjects to others.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince I’m an engineering student I have completed a few design projects throughout my time at college. To complete these projects I had to work with a team and complete many different project checkpoints, so I learned a lot of valuable skills on project management. I am also knowledgeable in design sketches as a result of these projects.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love to go to the gym, color, and watch TV with my friends (mostly sitcoms). I also love video games, and one fun fact about me is I built my own gaming PC when I was in high school. I also adopted a cat my sophomore year of college whom I abolutely LOVE. Her name is Pasta and she's a 2-year-old light brown tabby cat. I look forward to meeting you!\u003c/p\u003e","teachingVideoPlaybackId":"02gXdzWGos4woxIT017NfF02IDyQbcODN1kPyRoiwpxF1s","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1a7c93ed-38c5-4025-b029-ab94d826263c\"}"},{"__ref":"Favorites:{\"uuid\":\"feaf1886-2eb1-4a56-b7b3-5bdbc77c22fa\"}"},{"__ref":"Favorites:{\"uuid\":\"d32ce084-69fb-404c-8009-a179218ec78e\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"67dd9228-2ff7-4d8c-8c55-a0abeeb417ab\"}"},{"__ref":"DeepDives:{\"uuid\":\"ae1c47ce-f5f6-4dad-b31c-328a9bac6f5a\"}"},{"__ref":"DeepDives:{\"uuid\":\"cd39e9f3-105d-4233-ac29-3fdda71119e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"71747a3e-50db-4481-872d-e556db8f8f4f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3532328c-0141-4f79-b63e-fa92ddd8239b/-/preview/-/format/jpg/","https://ucarecdn.com/6a5140d1-7b37-454f-bb75-fe4ab67e3e5a/-/preview/-/format/jpg/","https://ucarecdn.com/7a4debce-146a-4f20-9ee0-bc3ed55125d6/-/preview/-/format/jpg/"],"pronouns":"THEY_THEM","gender":"NON_BINARY","education":[{"__ref":"Education:{\"uuid\":\"460786e3-daef-4d5b-b3f5-c26e198d5861\"}"},{"__ref":"Education:{\"uuid\":\"07124735-1a78-42b4-a2bf-15d73e003870\"}"}],"hiredAt":"2024-10-18T04:35:16.527Z","topics":["Biology","Chemistry","Physics","Product Design","STEM Project"],"communityBa
