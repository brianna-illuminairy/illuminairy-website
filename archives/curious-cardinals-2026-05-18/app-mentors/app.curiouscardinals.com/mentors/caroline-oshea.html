xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d362612b-8d68-44cd-961a-09af61b5195e\"}":{"__typename":"Favorites","uuid":"d362612b-8d68-44cd-961a-09af61b5195e","photoUrl":"https://ucarecdn.com/99b894bd-91eb-4188-8e35-1cce9ac04525/","title":"Volleyball! I have played since I was 10","type":"SPORT"},"Favorites:{\"uuid\":\"8e2826e4-4480-426b-abf5-a0a45669192f\"}":{"__typename":"Favorites","uuid":"8e2826e4-4480-426b-abf5-a0a45669192f","photoUrl":"https://ucarecdn.com/99b894bd-91eb-4188-8e35-1cce9ac04525/","title":"Los Angeles! Here is a photo of me at the Getty Villa :)","type":"CITY"},"Favorites:{\"uuid\":\"e7c4d45c-fd7c-47ad-8ecb-f2b9ceef7baf\"}":{"__typename":"Favorites","uuid":"e7c4d45c-fd7c-47ad-8ecb-f2b9ceef7baf","photoUrl":"https://ucarecdn.com/99b894bd-91eb-4188-8e35-1cce9ac04525/","title":"Harry Potter - No question","type":"MOVIE"},"CausesSupported:{\"uuid\":\"d6673fab-291c-488d-b716-f9a614f59c2b\"}":{"__typename":"CausesSupported","uuid":"d6673fab-291c-488d-b716-f9a614f59c2b","name":"","description":"\u003cp\u003eNational Charity League - was a member for 7 years and helped numerous charities\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d9f4bd35-7b2d-4921-afcd-73eddbc5f127\"}":{"__typename":"DeepDives","uuid":"d9f4bd35-7b2d-4921-afcd-73eddbc5f127","content":"\u003cp\u003eWhen I graduate, I plan on pursuing a career in investment banking - if I had told myself this two years ago, I don't think I ever would have believed I could accomplish something like this. However, receiving mentorship from older girls in my sorority who had gone a similar career route instilled in me the belief that I could really achieve anything that I set my mind to. As such, I hope to be able to inspire other students enough to where they feel, similar to how I did, that their is no ceiling to what they can achieve as long as they set their mind to it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"430d73bc-9c77-47b1-90ab-aedab2cd7c7c\"}":{"__typename":"DeepDives","uuid":"430d73bc-9c77-47b1-90ab-aedab2cd7c7c","content":"\u003cp\u003eTo inspire other students interested in economics to have not just an intro level understanding of the topic, but to truly have a passion for it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"e667ee6b-a0d2-45d9-8102-f04e8f6c7a02\"}":{"__typename":"DeepDives","uuid":"e667ee6b-a0d2-45d9-8102-f04e8f6c7a02","content":"\u003cp\u003eMy twin sister! She is my best friend and I am so lucky to have her by my side. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"295b766c-1249-4a45-a39b-1b361383425a\"}":{"__typename":"DeepDives","uuid":"295b766c-1249-4a45-a39b-1b361383425a","content":"\u003cp\u003eI was a competitive volleyball player all throughout high school, so the majority of my summer was spent in practices, workouts and travel tournaments! In my free time, I loved volunteering and reading and also taught an online tutoring class during the pandemic. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}":{"__typename":"School","uuid":"693ea7b8-def0-456d-88a4-4055bd090a62","name":"Marlborough School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90004"},"Education:{\"uuid\":\"bd981d45-aa7d-48b1-b27d-9e0317c9e899\"}":{"__typename":"Education","uuid":"bd981d45-aa7d-48b1-b27d-9e0317c9e899","school":{"__ref":"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}"},"startYear":"2015","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"9f6cb853-af90-4999-aa56-251ccfd4586c\"}":{"__typename":"Education","uuid":"9f6cb853-af90-4999-aa56-251ccfd4586c","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"41f889ff-22e8-41da-a11f-60435a75d401\"}":{"__typename":"MentorPublicProfile","uuid":"41f889ff-22e8-41da-a11f-60435a75d401","displayName":"Caroline O.","slug":"caroline-oshea","biography":"\u003cp\u003e\"Opportunities don't happen - You create them\" - Chris Grosser\u003cbr\u003e\u003cbr\u003eHi all! My name is Caroline O'Shea, and I am a junior at Northwestern University majoring in Economics and double minoring in Data Science and Entrepreneurship. I plan on pursuing a career in Investment Banking after college, and I am passionate about mentoring students in areas such as economics, entrepreneurship, communication and leadership, algebra and pre-algebra, and academic coaching/organization. \u003cbr\u003e\u003cbr\u003eGrowing up attending an all girls middle and high school (along with being in a sorority at Northwestern) has taught me the importance and impact that female empowerment can have on encouraging young women to succeed. As such, given how grateful I am for the mentors that have helped me up until this point, having the opportunity to provide the same experience for other young girls interested in pursuing the career of their choice would be an incredibly fulfilling experience  Additionally, I am more then happy to help students navigate the college process and compiling a solid list of schools!\u003c/p\u003e","teachingVideoPlaybackId":"mc4EnegAmY01Dp6szm01aHDKzCr01R6nsOT1rEUgya1En4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eEntering freshman year having gone to an all girls school for the previous 7 years, entering a major and field like economics that was primarily male dominated was a culture shock. In the beginning, I felt intimidated and oftentimes discouraged regarding my abilities to pursue a career in the banking field given how male saturated the market was. However, through mentorship via other girls in my sorority who had entered the banking space and collaborating with the other girls in my economics courses, I am happy to share that I will be pursuing a career in investment banking after I graduate after going through the recruiting process this summer! \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d362612b-8d68-44cd-961a-09af61b5195e\"}"},{"__ref":"Favorites:{\"uuid\":\"8e2826e4-4480-426b-abf5-a0a45669192f\"}"},{"__ref":"Favorites:{\"uuid\":\"e7c4d45c-fd7c-47ad-8ecb-f2b9ceef7baf\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"d6673fab-291c-488d-b716-f9a61
