xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ca2b67b3-79ea-4ef4-894e-f01c4b872c0d\"}":{"__typename":"Favorites","uuid":"ca2b67b3-79ea-4ef4-894e-f01c4b872c0d","photoUrl":"https://ucarecdn.com/57476f9a-93f7-47fb-b157-aac0e17f689a/","title":"Aalas Ka Pedh","type":"ALBUM"},"Favorites:{\"uuid\":\"06f147e1-68cd-4a10-bedb-e8c64a881e58\"}":{"__typename":"Favorites","uuid":"06f147e1-68cd-4a10-bedb-e8c64a881e58","photoUrl":"https://ucarecdn.com/16b1564f-2455-4fdf-849e-436b4dce1fbf/","title":"Virat Kohli","type":"ATHLETE"},"Favorites:{\"uuid\":\"2991e4d0-a6b1-4ade-805a-7b7feacee0b8\"}":{"__typename":"Favorites","uuid":"2991e4d0-a6b1-4ade-805a-7b7feacee0b8","photoUrl":"https://ucarecdn.com/cba17ffd-301a-47d3-84fe-90f5d06d7106/","title":"Toronto","type":"CITY"},"CausesSupported:{\"uuid\":\"916cc006-651b-4edf-b41b-e809ff8c9b14\"}":{"__typename":"CausesSupported","uuid":"916cc006-651b-4edf-b41b-e809ff8c9b14","name":"Heart and Stroke Canada","description":"\u003cp\u003eVolunteering\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c4144dfe-2437-4f51-9afa-12f312508837\"}":{"__typename":"DeepDives","uuid":"c4144dfe-2437-4f51-9afa-12f312508837","content":"\u003cp\u003eWhen I’m not studying or working on a startup project, you will almost certainly find me sitting around a table playing board games or card games. For me, it’s the perfect way to unplug from screens and relax while still keeping my brain happily engaged in solving puzzles.\u003c/p\u003e\u003cp\u003eI’m a huge fan of games that mix long-term strategy with resource management. Take \u003cem\u003eWingspan\u003c/em\u003e, for example. On the surface, it’s a relaxing, beautifully illustrated game about birds, but underneath, it’s a brilliant optimization puzzle.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love the challenge of figuring out how to build a highly efficient \"engine\" where every move compounds and sets you up for the next. Then there are games like \u003cem\u003eCatan\u003c/em\u003e, which completely bring out my entrepreneurial side. \u003cem\u003eCatan\u003c/em\u003e is all about supply chains, playing the probabilities of the dice, and the social art of convincing your friends to trade you that one piece of ore you desperately need to build a city.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also have a deep appreciation for the timeless classics. I play \u003cem\u003eChess\u003c/em\u003e because it is the ultimate test of pure logic. There’s no luck involved. It is just you, the board, and your ability to anticipate the downstream effects of your decisions. It requires the exact same root-cause analysis and forward-thinking that I use in process engineering.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut honestly, I am equally happy just grabbing a standard 52-card deck. There is something incredibly elegant about how versatile a standard deck of cards is. Card games are all about variance. You can't control what you draw; you just have to read the room, adapt on the fly, and figure out how to make the absolute most out of the hand you’ve been dealt.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I love tabletop gaming because it’s a tactile, highly social experience. It is a fun, low-stakes way to test out different strategies, learn how other people think, and just spend quality time connecting with friends offline.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3a02f2ce-0755-4087-a7bf-ac75fabba0c1\"}":{"__typename":"DeepDives","uuid":"3a02f2ce-0755-4087-a7bf-ac75fabba0c1","content":"\u003cp\u003eTo me, mentorship is never a one-way transaction. I have always believed that the absolute best way to master a complex system is to teach it to someone else.\u003c/p\u003e\u003cp\u003eIn engineering and science, it is very easy to hide behind complicated jargon. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eYou can memorize formulas for stoichiometry or recite the rules of quantum mechanics and trick yourself into thinking you understand them. But the moment a student looks at you and asks \"why,\" all those illusions shatter. If I cannot explain a concept simply enough for a student to grasp it intuitively, it means my own foundational understanding is flawed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis idea is the core of the Feynman Technique, and it is a principle I rely on heavily. Every time I mentor a student, it forces me to break down complex topics into their most basic, logical parts. When I have to invent an analogy to explain a difficult chemistry concept, like comparing electron orbitals to the layout of a hotel, it actually deepens and solidifies my own mental models. Teaching keeps my technical knowledge grounded and prevents me from taking intellectual shortcuts.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond just academic reinforcement, mentorship is the ultimate training ground for communication and leadership. Working with a student who is frustrated or overwhelmed forces me to step outside my own perspective. I cannot just give them the answer. I have to actively listen, figure out how their unique brain works, and adapt my process to fit their specific needs. That kind of real-time problem-solving is an invaluable skill, whether you are helping a student pass a final exam, leading an iGEM research team, or building a startup.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, mentorship matters to me because it creates a perfect continuous improvement loop. My mentees get the systems, confidence, and guidance they need to succeed, and in return, the process of teaching them makes me a clearer thinker, a stronger communicator, and a better leader.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"5ceaec11-4518-4b6c-a30b-f7b7734f15dd\"}":{"__typename":"DeepDives","uuid":"5ceaec11-4518-4b6c-a30b-f7b7734f15dd","content":"\u003cp\u003eA passion project that has completely absorbed my time recently is Faverit, a startup concept I developed and incubated through the University of Toronto Hatchery. At its core, Faverit is a reimagining of the peer-to-peer (P2P) gig economy, designed specifically for hyper-local communities like a university campus.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost traditional gig platforms today are highly rigid and strictly transactional. I wanted to build something much more fluid and community-driven. I noticed that within a campus ecosystem, there is a constant demand for micro-tasks. Someone is stuck in the library studying for finals and desperately needs a coffee, or a student needs a specific textbook dropped off across campus. Faverit was designed to connect people instantly for these small, everyday favors. It is a decentralized network where anyone can be a requester or a fulfiller at any given moment, lowering the barrier to entry for the gig economy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHowever, the hardest part of building a P2P network is not the software. The hardest part is liquidity and motivation. How do you actually get people to go out of their way to do a favor for a stranger?\u003c/p\u003e\u003cp\u003eThis is where I leaned heavily into social engineering and gamification. As an engineer, I am used to optimizing physical systems, but Faverit required me to engineer human behavior. We realized very quickly that for micro-tasks, money alone is not always the strongest motivator. People are deeply driven by status, reputation, and a sense of community belonging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo solve the motivation problem, we designed Faverit to feel less like a corporate job board and more like a cooperative multiplayer game. We integrated reputation scores, community leaderboards, and tiered trust badges. When you completed a favor on the platform, you did not just earn a small fee. You leveled up your social standing within the campus ecosystem. We engineered a system where the most helpful people became highly visible and celebrated.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis gamified approach naturally filtered out bad actors and encouraged incredibly high engagement. It was a masterclass in behavioral psychology. It is fascinating to see how tweaking a reward loop, adding a visual badge, or changing the wording of a notification can fundamentally shift user behavior and create a self-sustaining, high-trust community. Building Faverit allowed me to take my process-engineering mindset out of the lab and apply it directly to human interactions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1c3aa402-fd4f-4a94-a134-0ca5b273dc6e\"}":{"__typename":"DeepDives","uuid":"1c3aa402-fd4f-4a94-a134-0ca5b273dc6e","content":"\u003cp\u003eI chose to major in Chemical Engineering because it is, in my opinion, the most versatile and impactful problem-solving toolkit you can acquire. While many people hear “chemical engineering” and immediately picture oil refineries or people in lab coats mixing beakers, the reality of the discipline is much broader. It is fundamentally the study of how to transform raw materials into valuable products efficiently, safely, and at a massive scale.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was drawn to the field because I have always been fascinated by systems and processes. A chemical engineer does not just invent a new material in a test tube. They figure out how to manufacture millions of gallons of it continuously without the system breaking down or becoming economically unviable. That transition from a small-scale scientific discovery to a large-scale, real-world application is incredibly exciting to me. It requires a deep understanding of thermodynamics, fluid mechanics, and process control, combined with a pragmatic, Continuous Improvement mindset.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut what really solidified my decision was the unique position Chemical Engineering holds at the intersection of the two most critical challenges of our generation: sustainable energy and bioprocessing.\u003c/p\u003e\u003cp\u003eI am deeply passionate about the transition to a clean energy economy. The solutions to our energy crisis are not just electrical or mechanical. They are inherently chemical. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether it is developing advanced battery technologies for grid-scale storage, optimizing the efficiency of hydrogen fuel cells, or working on nuclear safety protocols like I did at Ontario Power Generation, chemical engineers are the ones designing the physical infrastructure of the future. We are the ones figuring out how to make sustainable technologies efficient enough to compete economically with fossil fuels.\u003c/p\u003e\u003cp\u003eSimultaneously, the world is experiencing a revolution in bioprocessing and synthetic biology, which I experienced firsthand as President of the UofT iGEM team. We are moving toward a future where we can engineer microorganisms to produce everything from life-saving pharmaceuticals to biodegradable plastics, effectively replacing traditional petrochemical manufacturing. Chemical engineering bridges the gap between the biological design of these organisms and the industrial bioreactors needed to scale them up.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I chose this major because I did not want to be limited to one specific industry. I wanted a foundational skill set that would allow me to walk into a nuclear plant, a biotech startup, or even a software company, analyze their most complex workflows, and engineer a better, more efficient system.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"0dc8230c-078b-4822-8d18-cb8b1a99604b\"}":{"__typename":"School","uuid":"0dc8230c-078b-4822-8d18-cb8b1a99604b","name":"The International School Bangalore (TISB)","city":"Bengaluru","type":"HIGH","state":"Karnataka","country":"India","zip":"562125"},"Education:{\"uuid\":\"1e232ec7-ee8a-4f8f-b78c-672bc7657e6f\"}":{"__typename":"Education","uuid":"1e232ec7-ee8a-4f8f-b78c-672bc7657e6f","school":{"__ref":"School:{\"uuid\":\"0dc8230c-078b-4822-8d18-cb8b1a99604b\"}"},"startYear":"2009","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e33b553b-d2f0-4167-8ef5-8cdea7fc8167\"}":{"__typename":"School","uuid":"e33b553b-d2f0-4167-8ef5-8cdea7fc8167","name":"University of Toronto","city":"Toronto","type":"COLLEGE","state":"Ontario","country":"Canada","zip":"M5S 1A1"},"Education:{\"uuid\":\"0deba18a-737f-4ca7-a1d4-17d2cb2e4b43\"}":{"__typename":"Education","uuid":"0deba18a-737f-4ca7-a1d4-17d2cb2e4b43","school":{"__ref":"School:{\"uuid\":\"e33b553b-d2f0-4167-8ef5-8cdea7fc8167\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"b5cc2120-33a1-464e-8ae4-dad3e5fbdd1e\"}":{"__typename":"MentorPublicProfile","uuid":"b5cc2120-33a1-464e-8ae4-dad3e5fbdd1e","displayName":"Amogh M.","slug":"amogh-manivannan","biography":"\u003cp\u003eHi! I'm \u003cstrong\u003eAmogh.\u003c/strong\u003e I am a chemical engineering student at the University of Toronto with a deep passion for helping high school students unlock their full potential in STEM.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy own journey into rigorous, high-level science started in high school when I participated in the \u003cem\u003eSummer Science Program\u003c/em\u003e (SSP), a highly selective research program operated in affiliation with \u003cem\u003eMIT\u003c/em\u003e and \u003cem\u003eCaltech.\u003c/em\u003e That experience completely changed how I approached learning. In fact, it was so transformative that I later returned to SSP as a Teaching Assistant to guide the next generation of ambitious students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout university, I have loved applying math and science to real-world challenges. I have had the opportunity to analyze safety data for \u003cstrong\u003eOntario Power Generation\u003c/strong\u003e's nuclear reactors, improve critical ambulance supply chains for Toronto Paramedics, and even launch my own tech startup through the UofT Hatchery incubator. I also served as \u003cstrong\u003ePresident of iGEM Toronto\u003c/strong\u003e, a major university biotech research team, leading over 60 students and managing a $25,000 budget.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat all of these fast-paced environments taught me is that success requires much more than raw intelligence. It requires strategy, resilience, and a deeply supportive environment. I learned this most profoundly by serving as a \u003cstrong\u003eUniversity Residence Don\u003c/strong\u003e, where I was responsible for the academic and personal well-being of a residence hall full of first-year students. Navigating the stressful transition to college with them showed me that when a bright student suddenly struggles with Chemistry or Calculus, it is almost never a lack of ability. Most often, they are simply overwhelmed by expectations, juggling too many extracurriculars, or lacking the right time-management skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis is exactly the holistic mindset I bring to my mentorship. When I work with a student, we look honestly at what went wrong on a recent test, find the root cause of the confusion, and build a personalized study system. I specialize in breaking down intimidating topics into intuitive concepts. Drawing on my time running the university \u003cstrong\u003eChemical Engineering Student Council\u003c/strong\u003e, I love using fun, highly visual analogies to make complex science finally click for students who feel disconnected from the material.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis is exactly the mindset I bring to mentoring. My ultimate goal is for my mentees to walk away not just with higher test scores, but with genuine, lasting confidence. I want to equip them with a sharper, more adaptable way of approaching hard problems that they can carry into college and beyond. I cannot wait to help you build your blueprint for success!\u003c/p\u003e","teachingVideoPlaybackId":"J8WRLs18QQfLCjMQYfyvttO5uCRbfCY5Fwl02XusrDq4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI worked overnight at a diner for 2 years to help pay my tuition and that fact I survived that while getting through school was incredibly important to me. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ca2b67b3-79ea-4ef4-894e-f01c4b872c0d\"}"},{"__ref":"Favorites:{\"uuid\":\"06f147e1-68cd-4a10-bedb-e8c64a881e58\"}"},{"__ref":"Favorites:{\"uuid\":\"2991e4d0-a6b1-4ade-805a-7b7feacee0b8\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"916cc006-
