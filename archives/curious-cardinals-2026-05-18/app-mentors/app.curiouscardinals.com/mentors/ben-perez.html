xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6f60964c-cd6d-4af7-9a52-5a6d83d11add\"}":{"__typename":"Favorites","uuid":"6f60964c-cd6d-4af7-9a52-5a6d83d11add","photoUrl":"https://ucarecdn.com/7d661c63-5fa3-495c-b9d8-0bfdccc47f0c/","title":"Cincinnati Bengals","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"741431a9-0cf4-4165-b580-42228a81dc9f\"}":{"__typename":"Favorites","uuid":"741431a9-0cf4-4165-b580-42228a81dc9f","photoUrl":"https://ucarecdn.com/fcd86095-5ae2-44d4-ac68-254c9cd08696/","title":"Good Will Hunting ","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"bc7f299c-076c-4416-84ed-c0cf984f5994\"}":{"__typename":"DeepDives","uuid":"bc7f299c-076c-4416-84ed-c0cf984f5994","content":"\u003cp\u003eIn my free time, I like to hang out with my friends and watch sports, especially the NFL, Formula 1, and the Premier League. I also try to read as much as possible and lift in the gym whenever I can. I like playing FIFA and other video games to relax and watch whatever is the new hot show on Netflix or HBO!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ebc996de-8700-4245-b6b8-02ec256ebe0c\"}":{"__typename":"DeepDives","uuid":"ebc996de-8700-4245-b6b8-02ec256ebe0c","content":"\u003cp\u003eI fell in love with economics during my senior year of high school when I took AP Economics. It was my first time learning about the subject and I was amazed at how such basic topics as supply and demand impact every aspect of our lives. I even wrote my college essay on how much I love econ!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"f78944df-0b03-420e-89fe-1df944855047\"}":{"__typename":"DeepDives","uuid":"f78944df-0b03-420e-89fe-1df944855047","content":"\u003cp\u003eMentorship was very impactful during my time at Northwestern, as I explored all that the financial industry had to offer. I talked to countless upperclassmen and alumni, and my mentors in my finance clubs played a huge role in preparing for interviews and eventually receiving an internship. I now try to help others as much as I can as I saw firsthand how much of an impact mentorship can make, and I believe Curious Cardinals is a great place to do that!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"313bd48d-8451-4e65-bf8c-a90228341b24\"}":{"__typename":"DeepDives","uuid":"313bd48d-8451-4e65-bf8c-a90228341b24","content":"\u003cp\u003eI played three sports in high school: lacrosse, soccer, and track and field. I eventually focused on lacrosse, a sport I have played my entire life. I worked just as hard in class as I did on the field, and especially loved English, History, and Economics. I was a member of a few different clubs, and would spend the weekends either playing sports of simply hanging out with friends.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"e554ed0b-1440-4650-8b1c-ba14fe9a5768\"}":{"__typename":"School","uuid":"e554ed0b-1440-4650-8b1c-ba14fe9a5768","name":"The Summit Country Day School","city":"Cincinnati","type":"HIGH","state":"Ohio","country":"United States","zip":"45208"},"Education:{\"uuid\":\"b60d2c3c-982f-4ee1-ab91-e3926751ea61\"}":{"__typename":"Education","uuid":"b60d2c3c-982f-4ee1-ab91-e3926751ea61","school":{"__ref":"School:{\"uuid\":\"e554ed0b-1440-4650-8b1c-ba14fe9a5768\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"550959de-772a-40a6-87ca-c2fed7bcf49c\"}":{"__typename":"Education","uuid":"550959de-772a-40a6-87ca-c2fed7bcf49c","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics ","degree":null},"MentorPublicProfile:{\"uuid\":\"5d278f3d-9760-4429-b906-04e192dd3315\"}":{"__typename":"MentorPublicProfile","uuid":"5d278f3d-9760-4429-b906-04e192dd3315","displayName":"Ben P.","slug":"ben-perez","biography":"\u003cp\u003eHi! I’m Ben, and I’m a senior at Northwestern University studying economics with a minor in business. I am originally from Cincinnati, Ohio. I am passionate about finance and economics and will be working as an investment banking analyst in New York after graduating. I have interned in many different roles within the finance world, from a small one-person startup freshman year, to working at large financial institutions such as Goldman Sachs and Bank of America during my sophomore and junior year.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am a member and mentor of multiple finance clubs at Northwestern, having been a President of one and a Vice President of another earlier in my college career. In my free time, I love to read, watch sports with my friends, work out, and play video games. I root for Chelsea Football Club and the Cincinnati Bengals, as well as have recently got into Formula One!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I would be happy to help in a wide range of subjects, from economics, business and math, to writing and reading\u0026nbsp; comprehension (economics is just as much reading as it is math!).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"8cAzR5c6k6etO8Cj00SaYl02HNpm9ezuu6eQxRzifeu98","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6f60964c-cd6d-4af7-9a52-5a6d83d11add\"}"},{"__ref":"Favorites:{\"uuid\":\"741431a9-0cf4-4165-b580-42228a81dc9f\"}"}],"causesSupported":[],"major":"Economics ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bc7f299c-076c-4416-84ed-c0cf984f5994\"}"},{"__ref":"DeepDives:{\"uuid\":\"ebc996de-8700-4245-b6b8-02ec256ebe0c\"}"},{"__ref":"DeepDives:{\"uuid\":\"f78944df-0b03-420e-89fe-1df944855047\"}"},{"__ref":"DeepDives:{\"uuid\":\"313bd48d-8451-4e65-bf8c-a90228341b24\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/11e08aa3-76a0-4290-b0c0-84cc550f80cc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b60d2c3c-982f-4ee1-ab91-e3926751ea61\"}"},{"__ref":"Education:{\"uuid\":\"550959de-772a-40a6-87ca-c2fed7bcf49c\"}"}],"hiredAt":"2024-09-27T12:17:24.967Z","topics":["Executive Function","K-5 Grade Math","Algebra I","Economics","Reading","Public Speaking","Business / E
