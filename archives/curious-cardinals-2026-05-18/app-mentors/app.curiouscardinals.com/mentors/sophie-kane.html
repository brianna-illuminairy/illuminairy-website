xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6149d7e0-a64e-4e8d-abec-cc49835c3744\"}":{"__typename":"Favorites","uuid":"6149d7e0-a64e-4e8d-abec-cc49835c3744","photoUrl":"https://ucarecdn.com/d11f7bc9-913a-4c69-abd2-8d826d4cab3c/","title":"Come Away with Me by Norah Jones","type":"ALBUM"},"Favorites:{\"uuid\":\"87b07c8e-75ca-4d15-b097-dc8db5a42183\"}":{"__typename":"Favorites","uuid":"87b07c8e-75ca-4d15-b097-dc8db5a42183","photoUrl":"https://ucarecdn.com/0c7453b0-797a-47fb-b69e-408e579b9afc/","title":"Paris","type":"CITY"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"69807124-51c5-4add-b446-e40b75ac5ea1\"}":{"__typename":"DeepDives","uuid":"69807124-51c5-4add-b446-e40b75ac5ea1","content":"\u003cp\u003eI absolutely loved the American Studies major. It is interdisciplinary, so it gave me complete control over my academic experience and introduced me to disciplines I didn't even know existed!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"99b7f07a-30ab-4036-9c61-5c618d416cd1\"}":{"__typename":"DeepDives","uuid":"99b7f07a-30ab-4036-9c61-5c618d416cd1","content":"\u003cp\u003eHaving had a broad array of experiences in academia, I feel uniquely equipped to help others make the most of their time as a student (the best job one can have).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b04b77c6-4fac-46d1-9aff-0adfb650fb9f\"}":{"__typename":"DeepDives","uuid":"b04b77c6-4fac-46d1-9aff-0adfb650fb9f","content":"\u003cp\u003eI hope to write a book! I attempted it once at 14 years old, and I would like to rediscover my love for creative fiction writing as an adult someday.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"53695e8c-6536-4525-9d0f-2fe06e97fc3b\"}":{"__typename":"School","uuid":"53695e8c-6536-4525-9d0f-2fe06e97fc3b","name":"American School of Brasilia","city":"Brasilia","type":"HIGH","state":"Distrito Federal","country":"Brazil","zip":"70200-650"},"Education:{\"uuid\":\"5f36493c-a6cf-4bbb-ab0c-f9aa9188f009\"}":{"__typename":"Education","uuid":"5f36493c-a6cf-4bbb-ab0c-f9aa9188f009","school":{"__ref":"School:{\"uuid\":\"53695e8c-6536-4525-9d0f-2fe06e97fc3b\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b446246d-dba4-4188-88ed-a648198326a4\"}":{"__typename":"Education","uuid":"b446246d-dba4-4188-88ed-a648198326a4","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"American Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"69ca9bb6-5448-416b-8f93-ada4ebf237d0\"}":{"__typename":"MentorPublicProfile","uuid":"69ca9bb6-5448-416b-8f93-ada4ebf237d0","displayName":"Sophie K.","slug":"sophie-kane","biography":"\u003cp\u003eSophie is a master’s student at the University of Oxford studying Comparative Social Policy through a Rotary scholarship. She grew up all around the world attending international schools in countries from Mozambique to France to Brazil, where she graduated as valedictorian of her high school in 2019. At the American School of Brasilia, Brazil she served as student council vice president and editor of the student newspaper. While at Yale, she majored in American Studies, taking courses in history, political science, economics, literature, critical theory, and legal studies. She is also an alum of the prestigious year-long course in Grand Strategy. Outside the classroom, Sophie founded the Yale Votes Initiative as an independent student organization and served as president, working with the university administration to boost campus voter participation.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring her undergraduate summers, Sophie worked on a presidential campaign, on Capitol Hill, and in the legal office of the District of Columbia’s public defender’s service. She was awarded the Yale Women in Government Fellowship and the Yale Law School Arthur Liman Undergraduate Fellowship for her summer pursuits.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBetween her Oxford courses, when she isn’t attempting rowing, attending Oxford Union debates, or brushing up on her French with the French society, she is usually on the hunt for new novels to read and new films to watch at her local theater. Feeling very privileged to continue to be a student herself, Sophie aspires to help her mentees find the joy in learning. Having served as a tour guide and student representative for the Yale admissions office and visitor center for many years, Sophie also hopes to help students achieve their college admission goals while making the most of their high school experience.\u0026nbsp;\u003c
