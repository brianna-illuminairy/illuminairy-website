xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3d2d2aa5-9980-423c-be3a-6604950faeb2\"}":{"__typename":"DeepDives","uuid":"3d2d2aa5-9980-423c-be3a-6604950faeb2","content":"\u003cp\u003eIn my spare time, I enjoy hiking, baking, and dancing. I recently moved to Montana and have had a blast exploring all of the new trails. I have also mastered the recipe for a delicious raspberry lemon loaf and strawberry shortcake. I am a huge horror movie fanatic and love the ocean! In another life, I would be a marine biologist.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3b7bfbdc-f10a-4912-a132-57f1c8c9ca36\"}":{"__typename":"DeepDives","uuid":"3b7bfbdc-f10a-4912-a132-57f1c8c9ca36","content":"\u003cp\u003eOver the spring, a mentee of mine and I have been working together on a fashion passion project. Drawing on inspiration from our closets, favorite clothing brands, and a beach aesthetic, we aim to create a cute, comfy, and affordable clothing line that empowers others to been confident and comfortable in their own style and skin!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"1d2dc8aa-a215-4d4b-a83b-a788730e6055\"}":{"__typename":"DeepDives","uuid":"1d2dc8aa-a215-4d4b-a83b-a788730e6055","content":"\u003cp\u003eAlthough I am not sure what the title of my dream job would be, it would involve the insertion between education, healthcare, and youth development. Whether that be increasing awareness and accessibility around these topics or working with surrounding policies, I hope to support the communities around me through my work. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c3a0e1a2-1f97-464b-9f58-77ccb27b6583\"}":{"__typename":"DeepDives","uuid":"c3a0e1a2-1f97-464b-9f58-77ccb27b6583","content":"\u003cp\u003eIn my lifetime, one thing I hope to accomplish is obtaining my diving certification and going shark diving in the Maldives! I hope to explore my interests in the shark gut microbiome and how their migration patterns due to climate change have influenced it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"9c355a46-d17f-47de-ab06-5e81b8a5d3fd\"}":{"__typename":"School","uuid":"9c355a46-d17f-47de-ab06-5e81b8a5d3fd","name":"Colorado College","city":"Colorado Springs","type":"COLLEGE","state":"Colorado","country":"United States","zip":"80903"},"Education:{\"uuid\":\"5219d3d3-3038-4a86-9fe3-d901635ec3dc\"}":{"__typename":"Education","uuid":"5219d3d3-3038-4a86-9fe3-d901635ec3dc","school":{"__ref":"School:{\"uuid\":\"9c355a46-d17f-47de-ab06-5e81b8a5d3fd\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Neuroscience","degree":null},"School:{\"uuid\":\"73db4979-3917-4509-b0cf-48e8c3e46b02\"}":{"__typename":"School","uuid":"73db4979-3917-4509-b0cf-48e8c3e46b02","name":"Middlebury Union High School","city":"Middlebury","type":"HIGH","state":"Vermont","country":"United States","zip":"05753"},"Education:{\"uuid\":\"c2464682-5015-401b-acf0-ff2c211d8e04\"}":{"__typename":"Education","uuid":"c2464682-5015-401b-acf0-ff2c211d8e04","school":{"__ref":"School:{\"uuid\":\"73db4979-3917-4509-b0cf-48e8c3e46b02\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"63d6ac58-8736-4461-b1b9-a510ae1337c9\"}":{"__typename":"MentorPublicProfile","uuid":"63d6ac58-8736-4461-b1b9-a510ae1337c9","displayName":"Diya T.","slug":"diya-taylor","biography":"\u003cp\u003eAt the end of May, Diya graduated from Colorado College with a major in Neuroscience and minors in Education and Molecular Biology. Diya is currently located in Bozeman Montana and works at the local hospital as a patient care technician in the Emergency department. She also works as a lab manager at Montana State University exploring the role of eye tracking as a form of communication for children with learning and cognitive disabilities. During this time, she plans to apply to either med or law school. She attended high school in Middlebury Vermont, the land of cows and Ben \u0026amp; Jerry’s. During her undergrad, Diya was co-president of student clubs North Boys and PANSOCC (psychology and neuroscience students of color club). Diya is passionate about global and medical outreach along with all things STEM related. Her dream job would involve the intersection between healthcare, education, and youth development.\u003c/p\u003e\u003cp\u003eIn India, Nicaragua, and Puerto Rico, Diya has worked to excite K-12 students about STEM while also teaching English and American Sign Language. She has also aided in hurricane relief by aiding in rebuilding damaged schools and homes and providing medical assistance to those who were injured by such events.  At Colorado College, Diya was also a Community Engaged Scholar which allowed her to become involved with her community about things ranging from diabetes awareness to providing shelter for the homeless. At Curious Cardinals she is focused on teaching STEM subjects along with Spanish, American Sign Language, and Dance related courses. Diya hopes to inspire and help students find what they are passionate about pursue it to its full extent!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3d2d2aa5-9980-423c-be3a-6604950faeb2\"}"},{"__ref":"DeepDives:{\"uuid\":\"3b7bfbdc-f10a-4912-a132-57f1c8c9ca36\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d2dc8aa-a215-4d4b-a83b-a788730e6055\"}"},{"__ref":"DeepDives:{\"uuid\":\"c3a0e1a2-1f97-464b-9f58-77ccb27b6583\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c0c7064a-a4e5-494c-ae68-dcbaaa98bb61/-/crop/652x653/163,0/-/preview/-/format/jpg/","https://ucarecdn.com/fdaa7622-9259-4fdf-afaa-5a2f1dab530e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5219d3d3-3038-4a86-9fe3-d901635ec3dc\"}"},{"__ref":"Education:{\"uuid\":\"c2464682-5015-401b-acf0-ff2c211d8e04\"}"}],"hiredAt":"2021-08-19T20:01:49.000Z","topics":["Algebra I","Geometry","K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","American Sign Language","Academic Coaching","Executive Function","Film / Theater","K-6 Storybook","Music","Visual Arts / Graphic Design","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/b0476bde-b06a-4efc-981a-41f0c9317731/","https://ucarecdn.com/8447c46d-a4b5-464d-8b8c-1daae5a90ac6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPu
