xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"418f3bd6-f8b1-4bd3-a1c2-e4ca8e2667e5\"}":{"__typename":"Favorites","uuid":"418f3bd6-f8b1-4bd3-a1c2-e4ca8e2667e5","photoUrl":"https://ucarecdn.com/6b463fed-9283-4e3d-867f-54bbabe3d485/","title":"UND Hockey","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"cbd7cdf4-1700-4cc7-baef-4042841c18a3\"}":{"__typename":"Favorites","uuid":"cbd7cdf4-1700-4cc7-baef-4042841c18a3","photoUrl":"https://ucarecdn.com/529f77da-eb81-4a73-9461-2bfd6b048132/","title":"The Nightingale","type":"BOOK"},"Favorites:{\"uuid\":\"d779c1b6-ed65-49c0-b3ee-dd56d295165a\"}":{"__typename":"Favorites","uuid":"d779c1b6-ed65-49c0-b3ee-dd56d295165a","photoUrl":"https://ucarecdn.com/e2a64620-d8be-48bd-89d0-63f918cfc607/","title":"Stick Season","type":"ALBUM"},"CausesSupported:{\"uuid\":\"d3c73e82-3ed8-40f2-8395-0934ab1c78b0\"}":{"__typename":"CausesSupported","uuid":"d3c73e82-3ed8-40f2-8395-0934ab1c78b0","name":"North Dakota Leadership Seminar","description":"\u003cp\u003eVolunteerism, leadership development, civic engagement, mentorship\u003c/p\u003e","photoUrl":"https://ucarecdn.com/6c74920e-3977-4819-8c24-9ef89a4e0256/"},"CausesSupported:{\"uuid\":\"bea6f9dc-9686-43ec-9481-1b10dd76b089\"}":{"__typename":"CausesSupported","uuid":"bea6f9dc-9686-43ec-9481-1b10dd76b089","name":"The Diabetes Link","description":"\u003cp\u003eCommunity building and advocacy for young adults with diabetes\u003c/p\u003e","photoUrl":"https://ucarecdn.com/8f704814-d95a-41ba-b5de-516ca5ca975a/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b3155a6b-1890-4ad7-9f48-710bd0bfbb54\"}":{"__typename":"DeepDives","uuid":"b3155a6b-1890-4ad7-9f48-710bd0bfbb54","content":"\u003cp\u003eComing into Brown, I was excited to have the opportunity to explore my eclectic academic interests like Spanish, policy, sustainability, entrepreneurship, calculus, and art. I have been able to satisfy these interests during my time at Brown while exploring new ones as well such as anthropology, public health, and economics. \u003cstrong\u003eI search for and utilize \u003c/strong\u003eresources and opportunities from the University to explore these topics while staying grounded in one of my largest goals of \u003cstrong\u003ecreating positive change\u003c/strong\u003e. It is important for me to pursue a career which constantly pushes me to \u003cstrong\u003egrow\u003c/strong\u003e, forces me to look at problems from various angles, and \u003cstrong\u003ecollaborate\u003c/strong\u003e with others from diverse backgrounds. I intend to combine these aspects and skills to create a \u003cstrong\u003elasting impact in the world\u003c/strong\u003e.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTaking my first economics class at Brown reframed how I thought of the field of economics - it is a social science that studies how people and groups make decisions to best utilize limited resources. I’ve always enjoyed studying social sciences—how people act and the impact their actions have on a larger scale. I find it extremely interesting that economics is a mathematical explanation for human behavior. Economics \u003cstrong\u003ecombines my interests\u003c/strong\u003e of human behavior and improving community conditions with a logical aspect of numbers and math. Additionally, economics \u003cstrong\u003eprovides tools \u003c/strong\u003efor understanding public policy. If I desire to create a positive impact, it is necessary to understand motivations and a topic which impacts all areas of life—scarce resources like money, time, and markets.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m interested in pursuing a career in potential fields of public policy, law, or social entrepreneurship. In reflecting on my academic and professional goals, studying general economics for my undergraduate degree provides flexibility, engages my interests, and generates direction and opportunities for my academics and future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e5fd9a2c-65f2-458b-a792-8220f63a22f2\"}":{"__typename":"DeepDives","uuid":"e5fd9a2c-65f2-458b-a792-8220f63a22f2","content":"\u003cp\u003eI am extremely proud of my ability to take advantage of hard situations, like my diagnosis of type 1 diabetes. Here is a letter I wrote to diabetes, reflecting on my challenges and accomplishments: \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDear Diabetes,\u0026nbsp;\u003c/p\u003e\u003cp\u003eI hate you.\u0026nbsp;\u003c/p\u003e\u003cp\u003eYou entered a six-year-old’s life and changed her entire world. The little girl did not know what you were. She didn’t know of your other victims, the pain you specialized in, or the opportunities you’d bring. I was that little girl.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI was only six and had just started kindergarten. You were treated like a guest—everyone fussing over you, getting you whatever you wanted. Whether or not I liked it, you were constantly there, a phantom lurking behind me. I didn’t know what you were or why you were here. I didn’t know about the shots until they were everyday. I didn’t know about the mathematical skills I’d have to hone. I didn’t know about the worry or fear you brought onto my parents. I didn’t know how this was the beginning of the end of my childhood bliss. I didn’t know. And you stole it from me.\u0026nbsp;\u003c/p\u003e\u003cp\u003eYou brought pain: physical, emotional, and mental. You brought loneliness: classmates refusing to play with me, adults staring, family members not understanding. You brought illnesses: hospital visits, depression and anxiety, devices leeched to my body to keep me alive. You brought anger: at my parents for letting this happen, at the world for choosing me, at myself for not being strong enough to not get diagnosed.\u0026nbsp;\u003c/p\u003e\u003cp\u003eBut you also brought a lifetime of opportunity.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI was able to use my diabetes as a catalyst to find my voice. My experience with advocacy started young. I educated my classmates about why I would prick my finger or needed to eat candy in class. Then it began compounding and soon, at age ten, I had a national platform at a Children’s Congress to meet other juvenile diabetics from across the world, share my story, and fight for rights with legislation.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI worked with my Congress members at a national level regarding issues from Medicare coverage of supplies to the Affordable Care Act discussion within the Department of Justice. I met other diabetics, listening to their experiences while sharing my own. I researched global trends regarding diabetes and what life with diabetes meant in developing countries—it’s a death sentence.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI attended Camp Maverick, an ADA-sponsored diabetes camp where I spent a week connected to other diabetics. My close friends and I still spend weekends in the summer tubing at a lake or meeting up at one of our colleges for hockey games in the winter. We spend 2 weeks giving back as camp counselors and reminisce on our time as campers. After 10 years, I continue to have the opportunity to pay it forward. I am a counselor who models confidence, resilience, and humor for the next young generation of diabetes. I show them that our condition does not define us, but it can empower us.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs I got older, new struggles emerged. Numbers magnified, I matured, and new fears were exposed. My twelve-year-old self faced the realization of what awaited my adulthood regarding the relationship between choices and the limitations of healthcare. I fear I will not be able to choose a career for love but one for healthcare. My dreams of leaving home to travel and learn and grow faltered as the question arose of if I could afford the medicine to keep me alive.\u0026nbsp;\u003c/p\u003e\u003cp\u003eYou burden your victims with exponential costs. I was scared, but I would not be backed into a corner. I found power in my voice, speaking and writing and sharing with hopes of creating meaningful change. And I was going to do just that: make change.\u0026nbsp;\u003c/p\u003e\u003cp\u003eYou taught me advocacy: I used my experience to help myself and others grow their rights.\u0026nbsp;\u003c/p\u003e\u003cp\u003eYou taught me initiative: I used my research skills to apply to online fellowships in order to continuously better myself and learn.\u0026nbsp;\u003c/p\u003e\u003cp\u003eYou taught me about emotional intelligence: I used this to decipher what my body and mind required while also understanding how to logically and empathetically attune to others’ needs.\u0026nbsp;\u003c/p\u003e\u003cp\u003eYou taught me how to build community: I used my voice to share my story and let others know they were not alone.\u0026nbsp;\u003c/p\u003e\u003cp\u003eYou may have started my journey to create change, but you do not decide the journey.\u0026nbsp;\u003c/p\u003e\u003cp\u003eYou do not control it—I do.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAnd I choose to use it as a tool to connect and teach others.\u0026nbsp;\u003c/p\u003e\u003cp\u003eMoving 2,000 miles away from my family to pursue my dream college, and you did not make it easy. But, by attending diabetes camp when I was growing up and searching for organizations that support type 1 diabetics made it easier.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI not only have met other diabetics on campus, but I am a leader of the Diabetes Link at Brown—searching for advocacy opportunities, making partnerships with various offices, and building community. I strive to connect with other diabetics to help them know they are not alone, and help myself realize this too.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThen in December, everything I worked for—my advocacy efforts, the struggle to accept my condition, my allergy to adhesive, creating community—came to fruition when my baby brother was diagnosed.\u0026nbsp;\u003c/p\u003e\u003cp\u003eFourteen years after my own diagnosis, I watched my biggest fear play out.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAt age fifteen, my brother handled his diagnosis with poise and interest, using his math-oriented mind to manage the new condition. He left the hospital with a continuous glucose monitor and an insulin pump ordered—it was so different from my diagnosis. We talked about how we feel when our blood sugar is not in range; how to count carbs; how to approach telling teachers and friends about his new reality.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAnd we talked about camp.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWe both attended ADA Camp Maverick together for the first time—me as a counselor and him as a camper. I was anxious, sharing my second home with my family; I wanted him to love it. And he did. And everyone loved him too.\u0026nbsp;\u003c/p\u003e\u003cp\u003eSeeing my baby brother thrive in this new environment meant so much to me. That coupled with the joy I get simply by being back at camp and around my friends renewed my energy to advocate.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAfter camp I spent my summer interning for the Diabetes Patient Advocacy Coalition where I tracked legislation and created communications to advocate for the patient voice and patient experience—my voice and my brother’s experience.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI continue to find communities and opportunities to make the best of my life with diabetes. I do not let my condition define me—I let it propel me. I use my experiences and challenges to help others feel seen, advocate for better health policies, and navigate personal growth.\u0026nbsp;\u003c/p\u003e\u003cp\u003eDear Diabetes—you came into my life in a 0.4 percent chance. You gave me no choice regarding your presence in my life.\u0026nbsp;\u003c/p\u003e\u003cp\u003eBut it is still my life.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAnd I continue to use you as a catalyst to create change.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"3a7b5820-5ad0-4b64-89c8-301ae0d1d0f8\"}":{"__typename":"DeepDives","uuid":"3a7b5820-5ad0-4b64-89c8-301ae0d1d0f8","content":"\u003cp\u003eAs a student, I have set and reflected on countless goals—academic, professional, personal—for various timelines—this semester, my summer plans, my five-year timeline—over numerous years. I have learned about growth mindsets, pivoted when necessary, reflected and adapted. Yet, I have always come back to the goal I’ve had since I was ten: helping others and making a positive difference.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am a North Dakotan attending university in Rhode Island. Many assume growing up in rural America comes with limited opportunities, but it has provided me with a unique perspective to experience life through a mindset and point of view others may not consider. Because of this dichotomy, I am planning to put together various parts of my identity and stitch them together to employ and prioritize the aspects I value most in my future. I have purposefully searched for opportunities both within my immediate communities and outside for ways to sharpen my skills and expose myself to different ideas.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;As an undergraduate in an elite institution, I am immersed in the world of scholarship, understanding the importance of cultivating deep relationships with peers and professors. I search and utilize resources to achieve my goal of exploring ideas while staying grounded in my values. I’ve worked hard to identify my personal values and set of ethics; I use these as cornerstones to direct me to opportunities I choose to spend time on, inform me how I treat others, and drive my desire to learn, serve, and lead. I believe leaders emerge with the values and ethics of their various communities, bringing them into their present and future, and have a duty to step forward to serve others.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI continue to strive to be this leader. I hope to devote my future career to addressing critical issues like the climate, women’s health issues, pre-existing health conditions and helping improve people's lives in a variety of ways.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhile activism and community engagement have always been passions of mine, I enjoy educating myself, hearing from diverse perspectives, and engaging in discussions that encourage critical thinking. I continue to hold this in my heart, constantly searching for opportunities to explore ideas, gain skills, and travel. It is important for me to seek out opportunities and pursue a career which constantly pushes me to grow, challenges me to look at problems from various angles, and collaborate with others from diverse backgrounds.\u0026nbsp;\u003c/p\u003e\u003cp\u003eIt is important for me to push myself and take advantage of opportunities that will assist me in achieving my dream of creating and contributing meaningful change in our society.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"72c88a8c-5f2f-41a9-a37f-049e458a36f5\"}":{"__typename":"School","uuid":"72c88a8c-5f2f-41a9-a37f-049e458a36f5","name":"Century High School","city":"Bismarck","type":"HIGH","state":"North Dakota","country":"United States","zip":"58503"},"Education:{\"uuid\":\"5237eafd-5b9a-4ed3-b411-3992a952736c\"}":{"__typename":"Education","uuid":"5237eafd-5b9a-4ed3-b411-3992a952736c","school":{"__ref":"School:{\"uuid\":\"72c88a8c-5f2f-41a9-a37f-049e458a36f5\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"5d2b48d3-e28e-42d0-99d7-fc052c37197d\"}":{"__typename":"Education","uuid":"5d2b48d3-e28e-42d0-99d7-fc052c37197d","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"0dc0205c-2acd-423a-91a4-642a351fc901\"}":{"__typename":"MentorPublicProfile","uuid":"0dc0205c-2acd-423a-91a4-642a351fc901","displayName":"Annelise K.","slug":"annelise-klein","biography":"\u003cp\u003eHi everyone! I’m Annelise, from Bismarck, North Dakota and a current junior at Brown studying economics. I’m interested in helping students connect to the social sciences and the arts or pursue change-making passion projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMore about me!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI am a current junior at Brown University studying economics on the public policy track, however, a few years ago in high school I was told my only opportunity as an \"accelerated\" student was to pursue engineering at the state university. This only fueled my desire to find opportunities to challenge myself and pursue my interests. I was set on being able to combine my academic interests like calculus, writing, and history with my passions of music, advocacy, and art. I have found ways to do this:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e2023 US Presidential Scholar \u003c/strong\u003efrom North Dakota from my accomplishments in academics, public service, leadership and activities, and my writing.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch and Project Development \u003c/strong\u003ethrough Civics Unplugged Fellowships in areas of sustainable design, period poverty, the impact of appropriations on the fair and efficient collection of taxes, and rural outreach.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOmicron Delta Epsilon member \u003c/strong\u003efor being recognized for my high grades in economic courses at Brown.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI love working with students in different ways to see how they can combine passions and reframe certain subjects.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I can help\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI mentor students grades K-12 with:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege Readiness \u003c/strong\u003e(Proof reading essays, organization, portfolios)\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion Projects \u003c/strong\u003e(building a website, starting a club, linking with research, areas of public health/advocacy/social science/more)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch Mentorship\u003c/strong\u003e (learning about the process, planning the timeline, presenting findings, linking with a passion project)\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic Guidance \u003c/strong\u003e(math, English, history, journalism, social sciences)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy mentorship style\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI have experience working as a camp counselor and mentor in various experiences: high schoolers and leadership, elementary and middle-school aged kids and summer camp, peers and grammar/writing, high schoolers and college mentorship. All of these experiences have shaped my approach to mentorship and built my love to help others through this work. I believe it is important to customize my approach to each one of your needs and meet you where you are at so we can end in a place where you feel a sense of achievement and pride.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me looks like:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConnecting topics of interest into a defined area of focus using critical thinking\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding out a roadmap together that aligns your goals and ends with a concrete achievement\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSharing resources and guiding you through how to use them\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eChecking in with you to see how the progress looks, any areas of confusion, and overall confidence\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside of school\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIf I’m not finding a new coffee shop with friends or going on a walk with my dog, you can find me thrifting while listening to a mix of Noah Kahan, Caamp, and Sabrina Carpenter. I like binging shows with my friends (yes we did have a \u003cem\u003eThe Summer I Turned Pretty\u003c/em\u003e watch party) or going to art museums.\u0026nbsp;\u003c/p\u003e\u003cp\u003eIf you enjoy learning, are looking for guidance, or are a curious person, I’d love to get to know you and help you pursue your goals! I can’t wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"uw200mjnRvcBLheinSYHdyvgbRWI6h1QPx01XIfximtQU","teachingVideoDescription":null,"greatestAchievement":"\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eUS Presidential Scholar\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOmicron Delta Epsilon member \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHigh School Valedictorian \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAP Scholar with Distinction \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eScholastic Writing and Arts National Medalist \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eElks Foundation Most Valuable Scholar \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePEO Stars Scholarship Recipient\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWells Fargo Sallie Mae Scholarship Recipient\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDelta Gamma Merit Scholarship Recipient \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eJoyce Ivy Foundation Summer Scholar \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWe The People Competition Unit Winner\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNational Honors Society Member\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"418f3bd6-f8b1-4bd3-a1c2-e4ca8e2667e5\"}"},{"__ref":"Favorites:{\"uuid\":\"cbd7cdf4-1700-4cc7-baef-4042841c18a3\"}"},{"__ref":"Favorites:{\"uuid\":\"d779c1b6-ed65-49c0
