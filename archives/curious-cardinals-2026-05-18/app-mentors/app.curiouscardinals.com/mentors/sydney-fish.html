xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"eea8894d-69a1-4ee5-b4a7-a18ec2aaecf1\"}":{"__typename":"DeepDives","uuid":"eea8894d-69a1-4ee5-b4a7-a18ec2aaecf1","content":"\u003cp\u003eI am deeply drawn to mentorship and teaching others. I truly love building relationships with others and fostering longterm connections. Through my academic, professional, and leadership experiences, I have learned invaluable skills that I hope to pass on to my mentee. I want to see you succeed!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"56ba2e7d-3653-41b5-b1bf-203adab6eb8b\"}":{"__typename":"DeepDives","uuid":"56ba2e7d-3653-41b5-b1bf-203adab6eb8b","content":"\u003cp\u003eMy background has enabled me to provide attentive, personalized mentorship tailored to each student’s learning style and personality. As a second-generation, mixed-race student who grew up in a biracial household with an immigrant mother and a large extended family, I’ve learned how to meaningfully connect with diverse perspectives and interact with many different personality types.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e559771c-7639-4a4f-bce9-59344aaa2246\"}":{"__typename":"DeepDives","uuid":"e559771c-7639-4a4f-bce9-59344aaa2246","content":"\u003cp\u003eIn high school, I launched an initiative to create and distribute over 8,000 masks during the height of the COVID-19 pandemic. I built a website with sewing tutorials, organized material drop-offs, led fundraising, and partnered with local organizations to make sure protective gear reached those who needed it most. Seeing the relief and gratitude from under resourced communities reminded me how much impact one idea can have. That experience will always be one of my proudest moments.”\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"155ce6d3-2971-44a0-8803-828bb2a4ad81\"}":{"__typename":"DeepDives","uuid":"155ce6d3-2971-44a0-8803-828bb2a4ad81","content":"\u003cp\u003eI absolutely love the outdoors, singing, playing guitar, readings, but most of all, spending time with my incredible community. In the winter, I love to ski and sled with my friends. In the summer, you can find me at the beach or hiking!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}":{"__typename":"School","uuid":"70146acc-a4ce-459e-8969-b791ab43dfb2","name":"Menlo School","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"902e33e2-10b9-42b3-9b03-8b1c4c97d6bb\"}":{"__typename":"Education","uuid":"902e33e2-10b9-42b3-9b03-8b1c4c97d6bb","school":{"__ref":"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"d96e2091-9d2c-409c-a187-3df0a4b4eeb9\"}":{"__typename":"Education","uuid":"d96e2091-9d2c-409c-a187-3df0a4b4eeb9","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Industrial and Labor Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"f3abc4bb-3e1b-431a-ba67-1fde761b7dbe\"}":{"__typename":"MentorPublicProfile","uuid":"f3abc4bb-3e1b-431a-ba67-1fde761b7dbe","displayName":"Sydney F.","slug":"sydney-fish","biography":"\u003cp\u003e\u003cstrong\u003eHi, I’m Sydney. It’s nice to meet you!\u003cbr\u003e\u003c/strong\u003eWhat matters most to me as a mentor is creating a space where students feel supported—not just academically, but professionally and personally. I believe mentorship should be holistic: helping students navigate coursework, career decisions, and the challenges of college life while building confidence and resilience. My goal is to be someone students can rely on for guidance, encouragement, and honest advice. Education should empower, and I strive to make learning engaging, relevant, and transformative.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI bring this philosophy to everything I do. At Cornell University, I’m pursuing a Bachelor of Science in Industrial and Labor Relations with a minor in Law and Society, maintaining a \u003cstrong\u003e4.11 GPA\u003c/strong\u003e while exploring the intersections of law, ethics, and psychology. My passion for law and advocacy has led me to roles such as \u003cstrong\u003eLitigation Assistant Intern at Kobre \u0026amp; Kim\u003c/strong\u003e, where I supported trial-bound teams and contributed to pro bono asylum cases, and \u003cstrong\u003eLegal Research Aide to multiple Cornell professors\u003c/strong\u003e, assisting with projects that examine law and compliance. I also worked on \u003cstrong\u003eCongressman Andy Kim’s political campaign\u003c/strong\u003e, an experience that strengthened my commitment to civic engagement and inclusive leadership.\u003c/p\u003e\u003cp\u003eOutside the classroom, I thrive in collaborative, high-energy environments. As \u003cstrong\u003eVice President of New Member Education for Cornell Mock Trial\u003c/strong\u003e, I design and teach curriculum, lead seminars, and provide one-on-one coaching to help new members succeed in our program. I’ve earned national recognition for my performance as an attorney, including the title of \u003cstrong\u003eAll-National Attorney\u003c/strong\u003e. Additionally, as \u003cstrong\u003eVice President of Professional for the Korean American Students Association\u003c/strong\u003e, I launched the organization’s first alumni mentorship program—another way I’ve worked to build meaningful connections and empower others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy commitment to inclusion drives everything I do. I believe every student deserves access to mentorship and opportunities that help them thrive. Beyond academics, I love connecting with people, exploring new ideas, and embracing challenges that push me outside my comfort zone. Some of my hobbies include playing guitar, golf, and singing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m outgoing, passionate, and deeply invested in helping others grow. My ultimate goal is to inspire confidence and curiosity—because when students feel empowered, they can achieve more than they imagined.\u003c/p\u003e","teachingVideoPlaybackId":"hIG5GQrmCfGcNapDqPK9GDmyZRn23k02hjcXIIcl5oFA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Industrial and Labor Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"eea8894d-69a1-4ee5-b4a7-a18ec2aaecf1\"}"},{"__ref":"DeepDives:{\"uuid\":\"56ba2e7d-3653-41b5-b1bf-203adab6eb8b\"}"},{"__ref":"DeepDives:{\"uuid\":\"e559771c-7639-4a4f-bce9-59344aaa2246\"}"},{"__ref":"DeepDives:{\"uuid\":\"155ce6d3-2971-44a0-8803-828bb2a4ad81\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/985a40a5-eaa5-4413-bb84-66ffbe4459a7/-/preview/-/format/jpg/","https://ucarecdn.com/615d6c3c-0487-4882-844a-7ff171cb8fb2/-/preview/-/format/jpg/","https://ucarecdn.com/e1da4bbc-42ed-4af1-bf65-1366a95d617b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"902e33e2-10b9-42b3-9b03-8b1c4c97d6bb\"}"},{"__ref":"Education:{\"uuid\":\"d96e2091-9d2c-409c-a187-3df0a4b4eeb9\"}"}],"hiredAt":"2025-12-04T03:07:06.134Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Creative Writing","Film / Theater","Business / Entrepreneurship","Law / Government / Policy","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sydney-fish\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f3abc4bb-3e1b-431a-ba67-1fde761b7dbe\"}"}}},"_sentryTraceData":"f7bd95714db84fc290325ff28aa8963d-b2d5b192f564eff6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f7bd95714db84fc290325ff28aa8963d,sentry-sample_rate=0.2,sentry-transaction=
