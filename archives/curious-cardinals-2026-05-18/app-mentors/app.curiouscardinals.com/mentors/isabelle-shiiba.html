xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5ed84d6b-6614-454f-baf4-8207c9f43e0f\"}":{"__typename":"Favorites","uuid":"5ed84d6b-6614-454f-baf4-8207c9f43e0f","photoUrl":"https://ucarecdn.com/d2b3fbc9-fb13-4d24-91c7-9c78f849b960/","title":"Princess Mononoke","type":"MOVIE"},"Favorites:{\"uuid\":\"f4f42cce-27bb-4720-9237-111e423d6a98\"}":{"__typename":"Favorites","uuid":"f4f42cce-27bb-4720-9237-111e423d6a98","photoUrl":"https://ucarecdn.com/1824586c-955b-4d73-bab5-baa3ed3e9ec6/","title":"New York Mets","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"3a051376-0671-4650-af6e-d7443e192f43\"}":{"__typename":"CausesSupported","uuid":"3a051376-0671-4650-af6e-d7443e192f43","name":"Palestinian Liberation and Support","description":"\u003cp\u003eI'm a huge activist for the liberation of Palestinian people and human rights\u003c/p\u003e","photoUrl":"https://ucarecdn.com/94f0cecc-2f78-4d10-9cbc-4d081ce0efcd/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2baf5761-e8e5-4bd2-9fc2-a5e6c823ffba\"}":{"__typename":"DeepDives","uuid":"2baf5761-e8e5-4bd2-9fc2-a5e6c823ffba","content":"\u003cp\u003eIn my spare time I love to travel, read books, go to concerts/listen to musics, and eat. Currently since I'm living in Japan, I am trying to explore as much of Japan as possible. I just explored the intense winter of Hokkaido, Japan (the northern most island of Japan), and I hope to visit Hiroshima, Okinawa, and Miyazaki before I leave in July. Since I live in Kyoto, I often explore the hiking trails by my house or visit nearby cities such as Osaka, Nara and Kobe. I've also been to other spots in the world such as Hawaii, Romania, Italy, Greece, Turkey, Thailand, Canada, England.. and more to come! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring breaks throughout the day I love to read historical fiction books to step into someones shoes from different time periods. I also am a big music person and need it to function. My favorite genres are R\u0026amp;B, hip-hop, funk, and now I'm getting into old J-pop as well as new Japanese hip-hop. Live concerts are also one of my favorite activities, and I even went to a concert by myself to see Little Simz. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy last and most important hobby is being a Mets fan (baseball!!). In NYC I live only 15 minutes away from Citi Field, so in the summer I go to a game once a week (sometimes more) and I watch their games everyday. I'm definitely a die-hard Mets fan, and I hope they can win a World Series in my lifetime. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b352efd8-2f53-4372-8b61-e7c714f9d900\"}":{"__typename":"DeepDives","uuid":"b352efd8-2f53-4372-8b61-e7c714f9d900","content":"\u003cp\u003eI wish I could tell my middle-school self to have advocated for myself more. I feel like I didn't do much outside of school, and I wish I did more extracurriculars, got into hobbies, or had more interests. For example, I loved playing in band, so I wish I found a way to keep playing clarinet outside of my 3x a week music class. I failed to communicate my interests and desires with my parents or teachers, so I lost a lot of seeds of interests from middle school to high school. If I shared my interests, perhaps I could've found a way to keep playing instruments today. Even if middle school feels too young to make your own decisions, I had interests that I wish I advocated for and figured ways to explore them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"dbdd9a04-a1c9-444b-92d5-91d5e0dc974f\"}":{"__typename":"DeepDives","uuid":"dbdd9a04-a1c9-444b-92d5-91d5e0dc974f","content":"\u003cp\u003eI am half-Japanese and half-Romanian, born and raised in Queens, NYC, in Jackson Heights. I was very comfortable in my highly diverse upbringing and communities, however, when I went to Brandeis I suddenly became one of the only women in my classes, and one of the only multi-lingual people. Struggling with the imposter syndrome that came with this transition in college, I was determined to overcome it by holding roles that can increase diversity, representation, and resources for all students. Because of this, I learned to not only advocate for myself, but for future generations. This is part of what drives me to teach and mentor: to be a role model. My teaching style is to encourage students from all backgrounds, regardless of existing knowledge on a topic. Curiosity and motivation is the most important ingredients to being a student. I want to open doors of opportunities, the way others have done for me, and help all my mentees learn more about themselves and their interests. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"0a5fdc6b-1df7-4c88-adbd-e7d66a2306a7\"}":{"__typename":"DeepDives","uuid":"0a5fdc6b-1df7-4c88-adbd-e7d66a2306a7","content":"\u003cp\u003eI hope to one day lead my own research team, whether it be in a University, a biotech company, or perhaps start my own company. I want to be a principal investigator to inspire and mentor other students from diverse backgrounds, while doing cool science! I want to cultivate a safe space amongst researchers and provide others with opportunities to excel. I'd also like to start a scholarship fund for under-represented students to pursue STEM-related careers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"f6a0ffb5-af93-4255-a025-337323aca54e\"}":{"__typename":"School","uuid":"f6a0ffb5-af93-4255-a025-337323aca54e","name":"High School for Health Professions and Human Services","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10003"},"Education:{\"uuid\":\"787a310c-5798-44ff-8d7a-78a576c1031b\"}":{"__typename":"Education","uuid":"787a310c-5798-44ff-8d7a-78a576c1031b","school":{"__ref":"School:{\"uuid\":\"f6a0ffb5-af93-4255-a025-337323aca54e\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"cfb3b6c1-0894-4d5a-ac7c-bbd39ac58611\"}":{"__typename":"School","uuid":"cfb3b6c1-0894-4d5a-ac7c-bbd39ac58611","name":"Brandeis University","city":"Waltham","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02453"},"Education:{\"uuid\":\"271c73a0-2be6-4edd-9f0a-49caa374f4a4\"}":{"__typename":"Education","uuid":"271c73a0-2be6-4edd-9f0a-49caa374f4a4","school":{"__ref":"School:{\"uuid\":\"cfb3b6c1-0894-4d5a-ac7c-bbd39ac58611\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biological Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"d202be35-be7f-4fe4-8dbf-abe242742c78\"}":{"__typename":"MentorPublicProfile","uuid":"d202be35-be7f-4fe4-8dbf-abe242742c78","displayName":"Isabelle S.","slug":"isabelle-shiiba","biography":"\u003cp\u003eIsabelle is motivated to work with other motivated and curious students across all ages, backgrounds, and interests. She has a wide range of experience working with students in classrooms, workshops, and one-on-one mentoring and tutoring. She has tutored high schoolers in math/science/SAT-prep, taught math to middle schoolers at BEAM, and ran STEM projects with elementary school students. She also has extensive research experience and hopes to help her mentee build a science project, learn to read research papers, or tackle math and science puzzles and problem sets. Isabelle hopes to expand her mentorship experience and is open to academic coaching, STEM-related help (math or science lessons/projects), Japan-related explorations, application/scholarship writing, organizational skills, starting projects out of school, and much more!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIsabelle is a current first-year PhD student at the University of Chicago for Biophysical Sciences. She graduated from Brandeis University in May 2024, where she earned a B.S. in Biological Physics. Before she began her graduate school journey, Isabelle lived in Kyoto, Japan for a year as a Fulbright Fellow. She conducted experimental research at Kyoto University on swarming robotics composed of biological materials. Isabelle loves to travel and she was inspired to return to Japan because she studied abroad in Osaka during her junior year at Brandeis.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIsabelle is a strong advocate for leveling the higher-education playing field, and has worked in many roles to increase educational equity. She has taught at non-profits such as teaching math to middle schoolers at Bridge to Enter Advanced Mathematics (BEAM) and running a hands-on after-school STEM program at Girlstart. Isabelle also started the Physics Club at Brandeis University, where she served as the co-founder and co-president. She also was the undergraduate representative of the Biophysics major where her goal was to increase support, inclusion, and resources for biophysics students. Isabelle often finds herself as one of the only female-indentifying people in her classes, lab meetings, or workshops/conferences; this drives her to take roles as the representation she seeks for throughout her academic and scientific career.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIsabelle is committed to helping her students succeed, chase their interests, and explore new interests. She wants to help students pursue new directions outside of traditional schooling, while also supporting her students to thrive in the academic setting.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIsabelle is from Queens, NYC and can speak roughly 4 languages: Romanian, Japanese, Spanish and English. She is also a Posse STEM scholar and has received numerous fellowships, so she has many tips on how to find and seize opportunities. Please reach out if any of Isabelle's passions, experiences, or goals align with yours!\u003c/p\u003e","teachingVideoPlaybackId":"WbaghZlGCgbLqfosIMzz6XyU9fRPj4N7yr2BXtgTGQ8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy biggest accomplishment was graduating from Brandeis with an honors Bachelor of Science in biophyiscs, magna cum laude, debt free. I received a full-tuition scholarship, the Posse Scholarship, worked as a residential advisor, worked in a lab, and won outside scholarships to pay for college. I am now fully funded to do research in Japan, and I will be fully funded throughout my PhD for the next 5 years.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5ed84d6b-6614-454f-baf4-8207c9f43e0f\"}"},{"__ref":"Favorites:{\"uuid\":\"f4f42cce-27bb-4720-9237-111e423d6a98\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"3a051376-0671-4650-af6e-d7443e192f43\"}"}],"major":"Biological Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2baf5761-e8e5-4bd2-9fc2-a5e6c823ffba\"}"},{"__ref":"DeepDives:{\"uuid\":\"b352efd8-2f53-4372-8b61-e7c714f9d900\"}"},{"__ref":"DeepDives:{\"uuid\":\"dbdd9a04-a1c9-444b-92d5-91d5e0dc974f\"}"},{"__ref":"DeepDives:{\"uuid\":\"0a5fdc6b-1df7-4c88-adbd-e7d66a2306a7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/95851b3d-c659-404c-8a27-3bb37236d527/-/preview/-/format/jpg/","https://ucarecdn.com/7e2153b7-9ced-487a-8a55-713dc8cd116a/-/preview/-/format/jpg/","https://ucarecdn.com/795cf4db-be9e-436c-9184-1be4c3ce86bb/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"787a310c-5798-44ff-8d7a-78a576c1031b\"}"},{"__ref":"Education:{\"uuid\":\"271c73a0-2be6-4edd-9f0a-49caa374f4a4\"}"}],"hiredAt":"2025-02-12T13:31:44.162Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","College Essay Writing","Academic Coaching","Reading"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/fe18a7d8-d65b-4523-ab43-2a809d9f45e6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isabelle-shiiba\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d202be35-be7f-4fe4-8dbf-abe242742c78\"}"}}},"_sentryTraceData":"bded834738eb42f3acbed989f75ace3b-a72c507b406b2803-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=bded834738eb42f3acbed989f75ace3b,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"isabelle-shiiba"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"
