xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9b35759e-b8f6-4545-904e-a7392bee4a27\"}":{"__typename":"Favorites","uuid":"9b35759e-b8f6-4545-904e-a7392bee4a27","photoUrl":"https://ucarecdn.com/486bbedb-2eb9-4062-8de5-f426849cf272/","title":"Zendaya","type":"ACTOR"},"Favorites:{\"uuid\":\"04871c31-0c49-434d-b7ab-0685208bbf7a\"}":{"__typename":"Favorites","uuid":"04871c31-0c49-434d-b7ab-0685208bbf7a","photoUrl":"https://ucarecdn.com/486bbedb-2eb9-4062-8de5-f426849cf272/","title":"Views by Drake","type":"ALBUM"},"Favorites:{\"uuid\":\"53a885f1-fcff-4749-8948-5ab96157e5a9\"}":{"__typename":"Favorites","uuid":"53a885f1-fcff-4749-8948-5ab96157e5a9","photoUrl":"https://ucarecdn.com/486bbedb-2eb9-4062-8de5-f426849cf272/","title":"Jhene Aiko","type":"ARTIST"},"CausesSupported:{\"uuid\":\"b8c57eb4-b6d1-4943-8e3c-8e4f0bf52637\"}":{"__typename":"CausesSupported","uuid":"b8c57eb4-b6d1-4943-8e3c-8e4f0bf52637","name":"Girls who Code","description":"\u003cp\u003eThis is an organization that encourages young women to pursue programming.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/db5fd99f-14a1-4ca1-b584-aa4e73e3a223/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b448ba42-8fa5-44d1-9b02-4d105863aea1\"}":{"__typename":"DeepDives","uuid":"b448ba42-8fa5-44d1-9b02-4d105863aea1","content":"\u003cp\u003eCherish the experiences you have in these short years, you'll remember when you prioritized your happiness and friendships more than stressing over the little things. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3aa05ce5-2f01-44db-9718-641f53431741\"}":{"__typename":"DeepDives","uuid":"3aa05ce5-2f01-44db-9718-641f53431741","content":"\u003cp\u003eI value relationships with mentees and love when I feel like I've motivated a student and made them feel confident in their abilities and intelligence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7201665c-2044-4ef2-974c-a0ef408719f0\"}":{"__typename":"DeepDives","uuid":"7201665c-2044-4ef2-974c-a0ef408719f0","content":"\u003cp\u003eI've always loved coding and I learned earlier on because my older brother is a software developer. I love the problem solving aspect and figuring out tiny bugs that solve big problems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"95fe659b-9360-4a11-acfc-304485a45748\"}":{"__typename":"DeepDives","uuid":"95fe659b-9360-4a11-acfc-304485a45748","content":"\u003cp\u003eI want to work for a company that uses technology in an ethical way, ideally promoting sustainability in the US and has a good company culture with lots of team building and teamwork in general. Coding has always had the stereotype of loners in a corner on a laptop but I think of more as a collaborative effort with a team to bounce ideas off of.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6\"}":{"__typename":"School","uuid":"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6","name":"Parkland High School","city":"Allentown","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"18104"},"Education:{\"uuid\":\"ea88ab78-f0d3-4978-9d30-14594a7905de\"}":{"__typename":"Education","uuid":"ea88ab78-f0d3-4978-9d30-14594a7905de","school":{"__ref":"School:{\"uuid\":\"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"fe658649-9af6-4fca-905b-92f850b10d3c\"}":{"__typename":"Education","uuid":"fe658649-9af6-4fca-905b-92f850b10d3c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"6f2d7ccb-9879-41d5-b912-6d6a2eed051f\"}":{"__typename":"MentorPublicProfile","uuid":"6f2d7ccb-9879-41d5-b912-6d6a2eed051f","displayName":"Susan A.","slug":"susan-ahmed","biography":"\u003cp\u003e I am a computer science graduate from Stanford University, and my journey so far has been shaped by a blend of technology, creativity, and culture. A fun fact about me is that I’m Egyptian and spent part of my childhood living there. Growing up between two cultures gave me a deep appreciation for diversity, different ways of thinking, and the importance of community. That background continues to influence the way I approach problem-solving, collaboration, and creativity today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, I went on a cross-country road trip with my two older brothers. It was one of the most unforgettable experiences of my life. We traveled through seven different national parks and crossed over 12 states. Being surrounded by such vast landscapes and natural beauty really deepened my love for the outdoors and showed me how refreshing it can be to step away from screens and immerse myself in nature. That trip also strengthened the bond I share with my brothers and reminded me how valuable family is in shaping who I am.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and work, art is one of my greatest passions. I enjoy experimenting with all kinds of mediums, from calligraphy and drawing to painting and design. I’m also a big fan of consuming media, including books, movies, and especially music. Recently, I started experimenting with mixing and producing music, which has been an exciting way to merge my background in computer science with my love for art. I am fascinated by the intersection of technology and creativity, and I am always looking for ways to bring those two worlds together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFashion is another area where I get to express myself. I love putting together outfits, browsing Pinterest for inspiration, and even upcycling thrifted clothing to create something completely new. Designing and making my own clothes has become both a creative outlet and a way to live more sustainably.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, something I care deeply about is representation and empowerment. As a woman in computer science, I have seen firsthand the challenges that underrepresented groups face in the field. In both high school and college, I worked on initiatives to support and mentor women and students from marginalized communities, encouraging them to pursue education and careers in areas that have historically felt inaccessible. I believe that creating inclusive spaces in technology is not only important, it is essential for building a future where innovation truly reflects the voices of anyone and everyone.\u003c/p\u003e","teachingVideoPlaybackId":"tbXpymIF1n7FnESeChK39QAsfdy01qnW8bmob8uapGZ4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting into Stanford, I grew up in a family where my parents did not attend university in the United States and my brothers went to a school close to home. Being away from family is difficult, but it taught me to be on my own and learn to be more independent. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"9b35759e-b8f6-4545-904e-a7392bee4a27\"}"},{"__ref":"Favorites:{\"uuid\":\"04871c31-0c49-434d-b7ab-0685208bbf7a\"}"},{"__ref":"Favorites:{\"uuid\":\"53a885f1-fcff-4749-8948-5ab96157e5a9\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b8c57eb4-b6d1-4943-8e3c-8e4f0bf52637\"}"}],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b448ba42-8fa5-44d1-9b02-4d105863aea1\"}"},{"__ref":"DeepDives:{\"uuid\":\"3aa05ce5-2f01-44db-9718-641f53431741\"}"},{"__ref":"DeepDives:{\"uuid\":\"7201665c-2044-4ef2-974c-a0ef408719f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"95fe659b-9360-4a11-acfc-304485a45748\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/22a92409-d6ec-4eec-81af-f7aa7adec523/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ea88ab78-f0d3-4978-9d30-14594a7905de\"}"},{"__ref":"Education:{\"uuid\":\"fe658649-9af6-4fca-905b-92f850b10d3c\"}"}],"hiredAt":"2024-02-04T23:35:16.165Z","topics":["Coding / Programming","History Project","K-5 Grade Math","STEM Project","Geometry","Pre-Algebra","Calculus","Algebra I","Algebra II","Arabic","Spanish","Visual Arts / Graphic Design","Computer Science","Public Speaking","Debate","Sustainability","Web Design","Executive Function","6-8 Grade Science"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampa
