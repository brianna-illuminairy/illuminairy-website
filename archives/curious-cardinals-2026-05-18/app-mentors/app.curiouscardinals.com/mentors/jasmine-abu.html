xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6cf5640b-3d1d-4a3f-9e28-e8e0dba52deb\"}":{"__typename":"DeepDives","uuid":"6cf5640b-3d1d-4a3f-9e28-e8e0dba52deb","content":"\u003cp\u003eDuring my high school summers, I was immersed in the sport of lacrosse, dedicating myself to improving my skills and confidence. I attended several training camps, practiced with friends, and even with my dad in our backyard. This dedication not only improved my abilities but also gave me a better understanding of teamwork and communication, skills that have helped me in both academic and personal settings. \u003c/p\u003e\u003cp\u003eAlongside my lacrosse practice, I spent two summers as a camp counselor at a sleepaway camp. This experience taught me valuable leadership skills and how to create a fun and supportive environment for the campers. 🏕️\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"4ff30cd2-8a57-4908-8bf0-2c0d38ec7226\"}":{"__typename":"DeepDives","uuid":"4ff30cd2-8a57-4908-8bf0-2c0d38ec7226","content":"\u003cp\u003eWhile many people find the unknown unsettling, I find it to be a source of comfort and excitement. The fact that my future career path is not yet defined is my greatest motivation. The possibilities are endless, offering me a wide space for exploration and discovery. This uncertainty is not a limitation; it's a blank canvas for me to create the future I want!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e6492ba1-bc57-4519-beb5-dcdb76cfd111\"}":{"__typename":"DeepDives","uuid":"e6492ba1-bc57-4519-beb5-dcdb76cfd111","content":"\u003cp\u003e\"Just do it\". Like the famous Nike slogan, I would tell my middle and high school self to try out as many things as possible. Embark on curiosity, embark on uncertainty, embark on adventure. I believe that the only thing that is stopping one from achieving something, is doubt. Secondly, I would advise my younger self to take a breath, and understand that everything will be okay. No matter how stressful or chaotic or uncertain life can be, things will truly get better no matter what happens. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"caba9070-7a32-4bdc-bbb7-564c10d4ff87\"}":{"__typename":"School","uuid":"caba9070-7a32-4bdc-bbb7-564c10d4ff87","name":"Fort Hamilton High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"11209"},"Education:{\"uuid\":\"e787df35-0072-499d-9cff-3ef4a3f34c1c\"}":{"__typename":"Education","uuid":"e787df35-0072-499d-9cff-3ef4a3f34c1c","school":{"__ref":"School:{\"uuid\":\"caba9070-7a32-4bdc-bbb7-564c10d4ff87\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}":{"__typename":"School","uuid":"9a91466f-187b-4e9b-8a98-c02cef7bf621","name":"University of Michigan","city":"Ann Arbor","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48109"},"Education:{\"uuid\":\"7358dc93-33ab-4326-9525-a07d347153c5\"}":{"__typename":"Education","uuid":"7358dc93-33ab-4326-9525-a07d347153c5","school":{"__ref":"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Urban Technology","degree":null},"MentorPublicProfile:{\"uuid\":\"655c4f07-4c5e-4a32-b9ce-93b242fd3647\"}":{"__typename":"MentorPublicProfile","uuid":"655c4f07-4c5e-4a32-b9ce-93b242fd3647","displayName":"Jasmine A.","slug":"jasmine-abu","biography":"\u003cp\u003eHi! My name is Jasmine, and I am a student at the University of Michigan, majoring in Urban Technology with a minor in UX Design. I am also originally from Brooklyn, New York City! I am passionate about all things design, with a particular focus on graphic and user experience design. I'm also fascinated by the intersection of design and the urban landscape, specifically in the development of tools like navigational and transit applications. I am eager to learn more about how technology can improve and enhance the quality of life in cities and how it can be interwoven into the urban landscape.\u003c/p\u003e\u003cp\u003eMy love for drawing and creativity has been a lifelong passion, spanning from carving soap as a kid to creating digital illustrations now. While art has always been a constant, my high school years also saw me balancing creative pursuits with athletics. You could often find me on the lacrosse field or in the yoga room rehearsing K-pop choreographies. Lacrosse was a great outlet for me to connect with people, and I formed many great friendships through the sport. Winning the division championships in my senior year was an amazing milestone and a perfect way to close that chapter of my life.\u003c/p\u003e\u003cp\u003eMoving into college, I knew that I wanted to continue dancing but also connect more with my cultural heritage as a person of half-Japanese and half-African American descent. I joined an African dance group on campus called Amala Dancers. Through this group, I've had the opportunity to learn about all types of African dance styles across the diaspora and to learn how to choreograph with others as well!\u003c/p\u003e\u003cp\u003eTo continue working on my design skills, I am the Co-Graphics and Marketing Chair for the Japanese Student Association, which is a great way for me to connect more with the Japanese community. Additionally, I practice my design skills professionally by being a part of MDesign, a design consultancy on campus. This role helps me understand design fundamentals and improve my skills through hands-on experience. Collaborating with others is a great way to not only create more engaging logos, websites, and graphics but also to learn from different perspectives and ideas.\u003c/p\u003e\u003cp\u003eWhen I'm at home, I love to cook and try new recipes, usually ending up covered in flour after trying to perfect making dough from scratch. You can also spot me baking all sorts of cakes in my rice cooker and attempting to make cream cheese frosting with just a fork. While these kitchen adventures might not always go as planned, they're a fun way to experiment and be creative outside of my academic and design pursuits.\u003c/p\u003e","teachingVideoPlaybackId":"5m6mvnWyvyy767dBSKYcxdkNs9MFaOtnj5wMR5zMfmg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Urban Technology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6cf5640b-3d1d-4a3f-9e28-e8e0dba52deb\"}"},{"__ref":"DeepDives:{\"uuid\":\"4ff30cd2-8a57-4908-8bf0-2c0d38ec7226\"}"},{"__ref":"DeepDives:{\"uuid\":\"e6492ba1-bc57-4519-beb5-dcdb76cfd111\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/51cb43d3-5b98-467d-9c6e-ed5bccf0a2ab/-/preview/-/format/jpg/","https://ucarecdn.com/d4f8ab84-2b44-48da-8f3f-1e99cd34f937/-/preview/-/format/jpg/","https://ucarecdn.com/478c67c1-5361-4ad7-9cd5-83dd32d7a073/-/pre
