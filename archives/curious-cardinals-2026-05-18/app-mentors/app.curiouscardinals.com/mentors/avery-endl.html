xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c44c2690-a067-4ee5-9579-e49c0f60639d\"}":{"__typename":"Favorites","uuid":"c44c2690-a067-4ee5-9579-e49c0f60639d","photoUrl":"https://ucarecdn.com/11812ab6-b11c-4977-9415-079c510b8511/","title":"Buffalo Bills","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"3511b958-5812-4ae9-9c0b-47fc3d4a1330\"}":{"__typename":"Favorites","uuid":"3511b958-5812-4ae9-9c0b-47fc3d4a1330","photoUrl":"https://ucarecdn.com/bbec8992-a030-409d-95d9-0b1d0847d074/","title":"Going to California -Led Zeppelin","type":"SONG"},"Favorites:{\"uuid\":\"1f7b98be-d5e1-4d6a-82bd-834dcdfd93ed\"}":{"__typename":"Favorites","uuid":"1f7b98be-d5e1-4d6a-82bd-834dcdfd93ed","photoUrl":"https://ucarecdn.com/a5b5671f-3d3c-486e-a32c-255391c4b5dc/","title":"Justin Bieber ","type":"ARTIST"},"CausesSupported:{\"uuid\":\"8f45b0b6-db5a-4866-9010-2b87539fddae\"}":{"__typename":"CausesSupported","uuid":"8f45b0b6-db5a-4866-9010-2b87539fddae","name":"Dementia Society of America","description":"\u003cp\u003eI support raising dementia awareness and aid as it heavily affects families.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/f70e4b6f-920c-4d3f-a539-95f1ee662710/"},"CausesSupported:{\"uuid\":\"2b85b11a-b46d-4363-9cef-7056d53e48d4\"}":{"__typename":"CausesSupported","uuid":"2b85b11a-b46d-4363-9cef-7056d53e48d4","name":"SPCA- Society for the Prevention of Cruelty to Animals","description":"\u003cp\u003eI strongly support animal rights and safety! My family has fostered three dogs!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/9a57728d-338f-4899-9224-d48fb71017d2/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"07510712-52e6-4bd6-ae10-755095e02a99\"}":{"__typename":"DeepDives","uuid":"07510712-52e6-4bd6-ae10-755095e02a99","content":"\u003cp\u003eIn my spare time, I love to go on outings with friends or family! I am always willing to go somewhere new and try new foods or activities! I love a beach or pool day as well as a hiking or playing my guitar!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"d5f8ec64-9400-4288-afdd-9b15d0faefab\"}":{"__typename":"DeepDives","uuid":"d5f8ec64-9400-4288-afdd-9b15d0faefab","content":"\u003cp\u003eSomething I am extremely proud is an instance when my family and I saved three small puppies! While on a family vacation in New Mexico, we found three abandoned puppies. We were able to take them for medical care and fly them back to Buffalo to find them each a loving new home!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"28a25e50-90d7-4d64-be97-eed1f9ba9da8\"}":{"__typename":"DeepDives","uuid":"28a25e50-90d7-4d64-be97-eed1f9ba9da8","content":"\u003cp\u003eMy dream job would be to become an ophthalmologist! I have been interested in eye surgery and health care since I was young and am hoping to pursue a career in that field!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"38109cfc-b73c-47a1-a363-4b89dc6405ee\"}":{"__typename":"DeepDives","uuid":"38109cfc-b73c-47a1-a363-4b89dc6405ee","content":"\u003cp\u003eI chose the major Human Biology, Health, and Society because I felt it overlapped the medical field with a social aspect. The combination of studying biology and general health within society is eye opening and very unique!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"48dc89bd-3956-465b-b162-c94427280c28\"}":{"__typename":"School","uuid":"48dc89bd-3956-465b-b162-c94427280c28","name":"Nardin Academy ","city":"Buffalo","type":"HIGH","state":"NY","country":"United States","zip":"14216"},"Education:{\"uuid\":\"441104dc-4442-4850-b8b3-663fbc4fc3e6\"}":{"__typename":"Education","uuid":"441104dc-4442-4850-b8b3-663fbc4fc3e6","school":{"__ref":"School:{\"uuid\":\"48dc89bd-3956-465b-b162-c94427280c28\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"4404e666-42b7-45da-9f93-18ef151715b8\"}":{"__typename":"Education","uuid":"4404e666-42b7-45da-9f93-18ef151715b8","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Human Biology, Health, and Society","degree":null},"MentorPublicProfile:{\"uuid\":\"53ea8118-ec6f-401f-8b5c-4c402e03ebf6\"}":{"__typename":"MentorPublicProfile","uuid":"53ea8118-ec6f-401f-8b5c-4c402e03ebf6","displayName":"Avery E.","slug":"avery-endl","biography":"\u003cp\u003eHello! My name is Avery Endl and I am from Buffalo, New York! I am currently studying Human Biology, Health, and Society at Cornell University. I am a pre med track student and hope to one day pursue a career in the healthcare field!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in Buffalo allowed me to constantly be surrounded by a close knit, supportive community. Living in “the city of good neighbors” was a driving force toward a career in health care. Getting to know so many unique and interesting people inspired me to study a field in which I can contribute and give back to my incredible community. For these reasons, I value family, friendships and social relationships most in life. I believe that forming strong and different connections with people is what builds a true and original character in a person.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn order to stay involved in my community, I enjoy structured organizations and activities both at home and at school! Having family in the Dementia community, I became very involved in elderly care and programs at assisted living communities. From early highschool up into the present, I volunteer at local assisted living facilities to engage with Buffalo’s elderly community. I often spend time playing board games, walking around the courtyard areas, and assisting with meal times. I find this branch of volunteering to be one of the most unique and valuable experiences, providing the chance to connect with an age group of individuals that continue to enlighten and enhance my day to day.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a pre med track student, I have been extremely lucky to experience an occupation as a pre and postoperative consultant. Working at an eyecare center with LASIK patients, I have been able to provide before and after surgery instructions and consultation for the past two summers. This job has not only taught me an endless amount of academic knowledge but has provided the opportunity to interact with individuals in a healthcare setting. This job truly motivated and solidified my interest and love of the healthcare community.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school and community activities, I love spending time playing guitar and listening to music! I participated in school theater throughout most of my life and love to attend acapella and musical performances at Cornell! I also enjoy reading, and taking walks with my childhood dog named Honey!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWith strong values in community, family, and social connection, I am extremely committed to forming strong bonds with others through knowledge and personal growth. I hope to form bonds with a variety of unique and different people from across the world while traveling and continuing my academic journey in the future!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"o01896FeT29KHwylK6XMtl3u5ytKuihYQnkTx6dX1Nrk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c44c2690-a067-4ee5-9579-e49c0f60639d\"}"},{"__ref":"Favorites:{\"uuid\":\"3511b958-5812-4ae9-9c0b-47fc3d4a1330\"}"},{"__ref":"Favorites:{\"uuid\":\"1f7b98be-d5e1-4d6a-82bd-834dcdfd93ed\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8f45b0b6-db5a-4866-9010-2b87539fddae\"}"},{"__ref":"CausesSupported:{\"uuid\":\"2b85b11a-b46d-4363-9cef-7056d53e48d4\"}"}],"major":"Human Biology, Health, and Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"07510712-52e6-4bd6-ae10-755095e02a99\"}"},{"__ref":"DeepDives:{\"uuid\":\"d5f8ec64-9400-4288-afdd-9b15d0faefab\"}"},{"__ref":"DeepDives:{\"uuid\":\"28a25e50-90d7-4d64-be97-eed1f9ba9da8\"}"},{"__ref":"DeepDives:{\"uuid\":\"38109cfc-b73c-47a1-a363-4b89dc6405ee\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d884141a-3fce-40a9-bb6a-e8d950cfb1e6/-/preview/-/format/jpg/","https://ucarecdn.
