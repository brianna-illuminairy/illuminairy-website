5deb34eeed3","content":"\u003cp\u003eThere is nothing like the a-ha moment, when a student that you're working with just \"gets it.\" 5+ years later and it's never gotten old.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ce7d3ab9-e9cb-4688-b06a-d5174f7bfc90\"}":{"__typename":"DeepDives","uuid":"ce7d3ab9-e9cb-4688-b06a-d5174f7bfc90","content":"\u003cp\u003eI wanted to get the toolkit that every engineer gets, which allows them to take a problem they've never seen and invent a unique solution. But I also wanted a life-centered major, one that revolved around advancing a more sustainable humankind.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"d9b057a8-742f-491c-bf56-4792e603ac38\"}":{"__typename":"DeepDives","uuid":"d9b057a8-742f-491c-bf56-4792e603ac38","content":"\u003cp\u003eI used to want to go to boarding school because I thought it would be exactly like Hogwarts. P.S: I went to boarding school and it was more like Hogwarts than I thought! Dream big and silly.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4a9d500b-cf18-4730-b569-191b17640169\"}":{"__typename":"Education","uuid":"4a9d500b-cf18-4730-b569-191b17640169","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Bioengineering","degree":null},"School:{\"uuid\":\"0317d3f6-2d9b-41d0-ae28-b5892108123a\"}":{"__typename":"School","uuid":"0317d3f6-2d9b-41d0-ae28-b5892108123a","name":"Palisades Charter High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90272"},"Education:{\"uuid\":\"55e1ba86-4a59-429c-9104-d63328102324\"}":{"__typename":"Education","uuid":"55e1ba86-4a59-429c-9104-d63328102324","school":{"__ref":"School:{\"uuid\":\"0317d3f6-2d9b-41d0-ae28-b5892108123a\"}"},"startYear":"2018","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"4f999646-5a61-4437-b637-b1c3c7ef5d59\"}":{"__typename":"MentorPublicProfile","uuid":"4f999646-5a61-4437-b637-b1c3c7ef5d59","displayName":"Benjamin Z.","slug":"benjamin-zaidel","biography":"Benjamin is a freshman at Stanford University planning on majoring in Bioengineering. He grew up in Southern California (the best part of CA) and graduated in the top 1% at his high school. In his junior year, Benjamin became disillusioned with the way math was taught in public schools. Rote memorization was causing students to lose faith in a beautiful subject. He met with school counselors and math teachers and decided the best way to help was to take action himself. Benjamin subsequently became a volunteer peer tutor, arriving early every morning before school to teach disadvantaged students. He eventually transitioned to private tutoring to help a larger volume of students succeed. \n\nBenjamin believes that the most important thing about teaching math is a strong foundation from which individuals can build successfully. Outside of traditional math, Benjamin has also studied and written papers on discrete mathematics, linear bifurcation, and chaos theory, and looks forward to exploring the intersection between math and other arts with Curious Cardinals. In his free time, Benjamin likes to go on food crawls, design Minecraft homes with his two younger sisters, and bike on the beach.\n\nAt Stanford, Benjamin is conducting summer research with Dr. Paul Wang, renowned Director of the Stanford Cardiac Arrhythmia Service and Professor of Medicine and of Bioengineering, where he will use programming to help map ventricular tachycardia in a perfused heart system. Benjamin also facilitates 1-on-1 mentorship events for Vietnamese students as a Public Service Co-Chair for the Stanford Vietnamese Student Association and is an avid writer for The Stanford Daily.","teachingVideoPlaybackId":"kw6xMcSIGgL2CBIiDKUbd2pVPv02v4CZbBV7gMAXMcfk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1de8da48-9cae-4c49-9350-947ec6a73a7c\"}"},{"__ref":"Favorites:{\"uuid\":\"8974541d-7ae9-416d-a7e8-ffd39573b858\"}"},{"__ref":"Favorites:{\"uuid\":\"c5d32efb-b6b0-477f-b585-1aa1a3a2146a\"}"}],"causesSupported":[],"major":"Bioengineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"105670dd-f674-4793-894e-24df3a839c8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"895bd84e-ae1f-4cc7-b4dd-15deb34eeed3\"}"},{"__ref":"DeepDives:{\"uuid\":\"ce7d3ab9-e9cb-4688-b06a-d5174f7bfc90\"}"},{"__ref":"DeepDives:{\"uuid\":\"d9b057a8-742f-491c-bf56-4792e603ac38\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9606d6e3-e923-45c0-bc52-6ac4894b9b75/-/crop/653x653/0,163/-/preview/-/format/jpg/","https://ucarecdn.com/01107cd1-d351-4f34-86d1-f06aba126d91/-/preview/-/format/jpg/","https://ucarecdn.com/a274d46f-125b-4997-bf90-c4d45959a1d1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4a9d500b-cf18-4730-b569-191b17640169\"}"},{"__ref":"Education:{\"uuid\":\"55e1ba86-4a59-429c-9104-d63328102324\"}"}],"hiredAt":"2021-08-17T07:34:09.000Z","topics":["STEM Pro
