xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a8f8a6b6-a429-4089-9838-97f92ddd1e27\"}":{"__typename":"Favorites","uuid":"a8f8a6b6-a429-4089-9838-97f92ddd1e27","photoUrl":"https://ucarecdn.com/5226d4d6-a7c7-48a1-a042-8b795289c6e3/","title":"The God of Small Things, Arundhati Roy","type":"BOOK"},"Favorites:{\"uuid\":\"6dfc2a37-4f80-4165-9fbd-7714d3178c5c\"}":{"__typename":"Favorites","uuid":"6dfc2a37-4f80-4165-9fbd-7714d3178c5c","photoUrl":"https://ucarecdn.com/5226d4d6-a7c7-48a1-a042-8b795289c6e3/","title":"Dance Nation","type":"PLAY"},"Favorites:{\"uuid\":\"052d41ac-5262-41a5-9bdd-6cb13d6c67bd\"}":{"__typename":"Favorites","uuid":"052d41ac-5262-41a5-9bdd-6cb13d6c67bd","photoUrl":"https://ucarecdn.com/5226d4d6-a7c7-48a1-a042-8b795289c6e3/","title":"The Electric Lady, Janelle Monae","type":"ALBUM"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4ac19262-1b0c-4052-80d1-9a5a4639ff98\"}":{"__typename":"DeepDives","uuid":"4ac19262-1b0c-4052-80d1-9a5a4639ff98","content":"\u003cp\u003eIn high school, I did a book long erasure poetry project of Jack Kerouac's \"On The Road\" with collage... because I hated it so much. Also, I knitted a fish sweater!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"40ccf08b-728a-4418-bfc1-21f26512cd0a\"}":{"__typename":"DeepDives","uuid":"40ccf08b-728a-4418-bfc1-21f26512cd0a","content":"\u003cp\u003eWorld peace. (No, really - world peace.) Not that I'm delusional enough to think that any individual - especially an individual studying Comparative Literature - can bring this about. But I want to be a good person, and I want to be kind, and ethical, and at the very least leave the world a little better than it was (or at the very very least! no worse.)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"3000e0f7-b683-4f51-9841-19bf1c197f18\"}":{"__typename":"DeepDives","uuid":"3000e0f7-b683-4f51-9841-19bf1c197f18","content":"\u003cp\u003eI'd like to be a professor in a little liberal arts college in the middle of nowhere, and live in a little house with a dog and a partner and teach people poetry. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"785658ef-36cd-4596-8e4f-a8ef70bc14c4\"}":{"__typename":"DeepDives","uuid":"785658ef-36cd-4596-8e4f-a8ef70bc14c4","content":"\u003cp\u003eI chose my major because I love literature, but for me literature is simply a lens through which to look at the world. I disliked how English Literature siloed itself from a meta-awareness of what it means to study the world through narrative, and through the English language. Comparative Literature has allowed me to study what I'm passionate about in a more diverse way, and has also allowed me to pursue my love of language learning. Middle Eastern Studies has allowed me to study abroad in Jordan, and grounded my study of literature in a comprehensive knowledge of the politics, history and demographics of the places in which the literature I read originates.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"6525a402-805b-4009-8c55-4cb370bcb87e\"}":{"__typename":"School","uuid":"6525a402-805b-4009-8c55-4cb370bcb87e","name":"Stephen Perse Foundation (Senior School)","city":"Cambridge","type":"HIGH","state":"England","country":"United Kingdom","zip":"CB2 1HF"},"Education:{\"uuid\":\"1c014c28-2bcb-4337-b18b-d804e7f74ea0\"}":{"__typename":"Education","uuid":"1c014c28-2bcb-4337-b18b-d804e7f74ea0","school":{"__ref":"School:{\"uuid\":\"6525a402-805b-4009-8c55-4cb370bcb87e\"}"},"startYear":"2016","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"9ac0db28-e5f6-48a2-bbcb-5fc65da032eb\"}":{"__typename":"Education","uuid":"9ac0db28-e5f6-48a2-bbcb-5fc65da032eb","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Comparative Literature \u0026 Middle Eastern Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"1ef71089-db0b-45c9-8ff9-bfbbef6111b1\"}":{"__typename":"MentorPublicProfile","uuid":"1ef71089-db0b-45c9-8ff9-bfbbef6111b1","displayName":"Remi S.","slug":"remi-seamon","biography":"\u003cp\u003eHi, I'm Remi! I'm a sophomore at Columbia University majoring in Comparative Literature and Middle Eastern Studies. I grew up in Cambridge, England, where I first discovered my love for poetry. Through high school, I wrote and published poems in independent magazines, won prizes and attended workshops. I also have experience interning at literary journals. I would love to help mentor other young people in the craft of writing poetry, as well as reading it, since I believe writing poetry without reading it is like painting with your eyes shut.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm also proficient in French and Arabic as these are the literatures I study in my course, and would love to help people gain more confidence in their language skills in these languages. Moreover, I'm passionate about language and literature as means of creating community and as tools for social justice. During my time at Columbia, I have organized several poetry events with the aim of speaking out against genocide. My other commitments at Columbia have included writing and editing for Columbia's Human Rights Magazine and Columbia's Film Journal. I also love to help people work on their academic writing as well as their creative writing, and have been trained in how to help individuals grow as writers through approaching specific pieces they need assistance on, particularly essays for class, or even applications. My knowledge also extends to the field of psychology, as it's a subject I studied intensely in high school, alongside history and literary theory.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor fun, I love to read (my favorite poets are Ilya Kaminsky, francine j. harris, Richard Siken and Terrance Hayes), cook, paint, knit, and go on walks all over Manhattan. I believe in food as a vital source of community and one of the most meaningful parts of college for me has been creating an alternate space for Jewish students on campus and cooking Shabbat dinners every Friday.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to working with you!\u003c/p\u003e","teachingVideoPlaybackId":"I015uMJq00ntZw01HbHk2bXNaIBQjt1YTB2EW72r8A83z4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a8f8a6b6-a429-4089-9838-97f92ddd1e27\"}"},{"__ref":"Favorites:{\"uuid\":\"6dfc2a37-4f80-4165-9fbd-7714d3178c5c\"}"},{"__ref":"Favorites:{\"uuid\":\"052d41ac-5262-41a5-9bdd-6cb13d6c67bd\"}"}],"causesSupported":[],"major":"Comparative Literature \u0026 Middle Eastern Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4ac19262-1b0c-4052-80d1-9a5a4639ff98\"}"},{"__ref":"DeepDives:{\"uuid\":\"40ccf08b-728a-4418-bfc1-21f26512cd0a\"}"},{"__ref":"DeepDives:{\"uuid\":\"3000e0f7-b683-4f51-9841-19bf1c197f18\"}"},{"__ref":"DeepDives:{\"uuid\":\"785658ef-36cd-4596-8e4f-a8ef70bc14c4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/025bc750-d105-4055-a959-230b8dec285e/-/preview/-/format/jpg/","https://ucarecdn.com/289aa1dd-f426-48cf-a9db-48c02a65e9d2/-/preview/-/format/jpg/","https://ucarecdn.com/027aa1ef-9c0d-4141-9c70-81699d14cf28/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1c014c28-2bcb-4337-b18b-d804e7f74ea0\"}"},{"__ref":"Education:{\"uuid\":\"9ac0db28-e5f6-48a2-bbcb-5fc65da032eb\"}"}],"hiredAt":"2024-03-06T21:24:44.214Z","topics":["Writing","French","College Essay Writing","Executive Function","Reading","History","Academic Coaching","Creative Writing","Film / Theater","Visual Arts / Graphic Design","History Project","Journalism","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"remi-seamon\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1ef71089-db0b-45c9-8ff9-bfbbef6111b1\"}"}}},"_sentryTraceData":"76beca77e42b4363be9974b771a1e8cd-91117ddae3ff171f-0","_sentryBaggage":"sentry-environment=
