xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2b66f92f-d98b-48a1-8acc-0d89e73b7bf6\"}":{"__typename":"Favorites","uuid":"2b66f92f-d98b-48a1-8acc-0d89e73b7bf6","photoUrl":"https://ucarecdn.com/556a952b-38d0-48cc-abfb-9dacb4f7b225/","title":"Tom Lake by Ann Patchett","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4a6f9c0a-6628-4bd4-b64f-25232408e0c4\"}":{"__typename":"DeepDives","uuid":"4a6f9c0a-6628-4bd4-b64f-25232408e0c4","content":null,"videoPlaybackId":"HJhnDrInjzyRpqOfD7hY25m01FLgXScVWXWK00z5uYCss","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"08425e8a-e42b-4a00-b8ce-27f6351ff193\"}":{"__typename":"DeepDives","uuid":"08425e8a-e42b-4a00-b8ce-27f6351ff193","content":null,"videoPlaybackId":"SOyLvY7zLizS5cHIY00WQlop100BktO00kbcBP47goDJB8","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"f0bc4133-fbdb-4939-86f9-3fd78acc92b3\"}":{"__typename":"DeepDives","uuid":"f0bc4133-fbdb-4939-86f9-3fd78acc92b3","content":"\u003cp\u003eMy early education laid the foundation for a lifelong love of learning that has been my companion and motivator ever since. From ages five to twelve, I circumnavigated the globe with my sister and our parents on a too-small, 32-foot sailboat. During those seven years at sea, my parents homeschooled us, turning the oceans we sailed and the 27 countries we visited into our classrooms. Guided by my mom and dad, our teachers were the people we met along the way. We learned from necessity, curiosity. We memorized the ritual of a formal sevusevu offering of kava, made to a Fijian village chief to ask for permission to anchor in his island’s harbor. We dissected a squid found lodged in the stomach of a mahi-mahi I had caught, identifying the translucent organs. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese early experiences instilled in me an insatiable curiosity that has helped me discover my academic and personal passions. However, my upbringing also set me apart from my classmates when I returned to \"real\" school in 7th grade. The transition was challenging—like when I realized I had no idea who Beyoncé was! In an attempt to fit in, I quickly gave myself a crash course in pop culture and focused on blending in.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I've grown older, I've come to see that the differences resulting from my unique childhood are precisely what make me who I am. Rather than trying to blend in, I now let my curiosity run freely and embrace these distinctions. I want to help others celebrate their unique traits and nurture their enthusiasm for learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c96780ba-bc63-4b34-a236-452883dd61ac\"}":{"__typename":"DeepDives","uuid":"c96780ba-bc63-4b34-a236-452883dd61ac","content":"\u003cp\u003eChoosing my major was both incredibly confusing and, ultimately, quite simple. Let me explain.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've always had broad interests, ranging from English and writing to government and politics. The prospect of narrowing my focus to a single major felt daunting. Thankfully, I didn’t have to declare my college major until my sophomore year.\u003c/p\u003e\u003cp\u003eDuring my first two semesters at Yale, I enrolled in courses that sparked my curiosity: Cognitive Science of Language, Medical Anthropology, Intro to Psychology, Defining Families, and more. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs the year wrapped up and my decision loomed, I realized that most of the courses I’d taken shared a common theme: investigating how people relate to one another and to themselves. It was then that it clicked—I wanted to study psychology to continue deepening my understanding of people.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, as a PhD student studying Clinical Psychology, I’m thrilled to keep fueling my curiosity in a field that I’m passionate about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"ca37fe1f-bf43-4ed5-a5fc-d01c484c45d8\"}":{"__typename":"School","uuid":"ca37fe1f-bf43-4ed5-a5fc-d01c484c45d8","name":"Buffalo Seminary","city":"Buffalo","type":"HIGH","state":"New York","country":"United States","zip":"14222"},"Education:{\"uuid\":\"36deebb6-3567-4f36-8607-386fc633308b\"}":{"__typename":"Education","uuid":"36deebb6-3567-4f36-8607-386fc633308b","school":{"__ref":"School:{\"uuid\":\"ca37fe1f-bf43-4ed5-a5fc-d01c484c45d8\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b2fad16f-681f-4a1c-b660-f4f4d56257d4\"}":{"__typename":"Education","uuid":"b2fad16f-681f-4a1c-b660-f4f4d56257d4","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Psychology","degree":null},"Testimonial:306778b1-26f5-4490-8512-4e01db5f036f":{"__typename":"Testimonial","id":"306778b1-26f5-4490-8512-4e01db5f036f","text":"Abigail was an amazing mentor. She always taught me how to grow and how to increase my writing structure, my grammar, and all the little bits and pieces I needed to make my story flow. she truly showed enthusiasm for her work on my novel. Abigail truly a gem and she helped me improve so much! If you get a mentor like Abigail or any of the other mentors that the curious cardinal program possesses, you will not be disappointed. They will help you and your child reach their full potential indefinitely!","date":"2025-08-20 01:39:51.399+00","rating":5,"endorser":{"__typename":"Endorser","name":"Charlee Pascale","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"12878033-b65f-4b6b-9d87-bac97c4ffa0f\"}":{"__typename":"MentorPublicProfile","uuid":"12878033-b65f-4b6b-9d87-bac97c4ffa0f","displayName":"Abigail H.","slug":"abigail-hopkins","biography":"\u003cp\u003eBeing a mentor has always been a passion of mine. In college, my favorite activity was leading incoming first-years on pre-orientation hiking trips and mentoring them throughout their first year. While I still love hiking (and cooking, reading, and painting) in my free time, I want to help guide and support students to achieve their academic and personal goals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy own academic interests range from psychology, to Shakespearean plays, to creative writing. I majored in Psychology at Yale, conducting my own original research on belonging as my senior thesis. High school was where I studied (and often performed) Shakespearean plays and sonnets, and it was in college that I deepened my love of writing my own plays, poetry, and short stories.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am currently pursuing a PhD in Clinical Psychology with the goal of becoming a therapist once I graduate. Prior to starting my PhD, I spent the last four years living in England and working as a project manager for a large health technology company. During this time, I honed my organizational and professional skills while cultivating a love for travel. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m dedicated to helping my mentees develop their own organizational strategies, empowering them to succeed not just in school, but in their personal lives for years to come.\u003c/p\u003e","teachingVideoPlaybackId":"026GIHItExDLsUnx55Iy86HYfCXnE1InbW8nbSqQlXr4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2b66f92f-d98b-48a1-8acc-0d89e73b7bf6\"}"}],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4a6f9c0a-6628-4bd4-b64f-25232408e0c4\"}"},{"__ref":"DeepDives:{\"uuid\":\"08425e8a-e42b-4a00-b8ce-27f6351ff193\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0bc4133-fbdb-4939-86f9-3fd78acc92b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"c96780ba-bc63-4b34-a236-452883dd61ac\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/aef932c5-8715-4fca-9283-2a11a2302b32/-/preview/-/format/jpg/","https://ucarecdn.com/ff701613-97a3-4660-a131-b0bc8b21aae1/-/preview/-/format/jpg/","https://ucarecdn.com/62d78095-d920-4f7e-b9f3-bba5340829ef/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"36deebb6-3567-4f36-8607-386fc633308b\"}"},{"__ref":"Education:{\"uuid\":\"b2fad16f-681f-4a1c-b660-f4f4d56257d4\"}"}],"hiredAt":"2024-08-16T16:27:56.748Z","topics":["Writing","Executive Function","College Essay Writing","Academic Coaching","Reading","K-6 Storybook","Creative Writing","Public Spe
