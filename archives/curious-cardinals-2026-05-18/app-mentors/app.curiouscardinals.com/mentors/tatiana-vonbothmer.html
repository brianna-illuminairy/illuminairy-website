xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e2b45c85-1ddc-4b75-8427-33156f888e6c\"}":{"__typename":"DeepDives","uuid":"e2b45c85-1ddc-4b75-8427-33156f888e6c","content":"\u003cp\u003eI would encourage my middle or high school self to not worry too much about the little things; everything will work itself out in the end, and stressing out about life takes away from experiencing its beautiful moments. Take a deep breath, allocate time to both work and self-care, and continue doing what you’re doing!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b6038b45-7aa9-4cc7-9afb-6100e453b6eb\"}":{"__typename":"DeepDives","uuid":"b6038b45-7aa9-4cc7-9afb-6100e453b6eb","content":"\u003cp\u003eIn my lifetime, I hope to make some sort of measurable impact, whether it be writing a novel, filming a documentary, or teaching a classroom of children. I want to know that I have affected the world and the people around me in some wonderful way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9930a26a-f7db-4b03-a504-1f207c267442\"}":{"__typename":"DeepDives","uuid":"9930a26a-f7db-4b03-a504-1f207c267442","content":"\u003cp\u003eI chose to study English because I love to read literature and bring significance out of its prose and narrative. I believe that language contains so much meaning, and I am always eager to dissect it. I also think everyone can learn so much from reading fiction, and that novels, no matter from what decade, can expose something special about our modern lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"328ed2d7-90f1-49eb-a448-2ecaca01eed6\"}":{"__typename":"DeepDives","uuid":"328ed2d7-90f1-49eb-a448-2ecaca01eed6","content":"\u003cp\u003eIn high school, my teachers noted that I had a “quiet confidence” in the classroom. While I may have appeared reserved, sometimes even shy, I was intentional about sharing my thoughts about the subject, though not always. I think it’s invaluably important to think critically about what you’re learning in school, and to refine your thoughts before you share them; but also, to remember that you belong in the classroom, no matter where you are, and that your voice matters.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"d91174d1-e485-45fe-8fe2-dcf4d76a755e\"}":{"__typename":"School","uuid":"d91174d1-e485-45fe-8fe2-dcf4d76a755e","name":"Cate School","city":"Carpinteria","type":"HIGH","state":"California","country":"United States","zip":"93013"},"Education:{\"uuid\":\"a4703b5c-faa7-4374-8abd-7bb51ace4f57\"}":{"__typename":"Education","uuid":"a4703b5c-faa7-4374-8abd-7bb51ace4f57","school":{"__ref":"School:{\"uuid\":\"d91174d1-e485-45fe-8fe2-dcf4d76a755e\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"836632a9-a826-408b-8898-70d188f480a3\"}":{"__typename":"Education","uuid":"836632a9-a826-408b-8898-70d188f480a3","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"a61157e4-2124-42c2-8afb-0ad2cc52a522\"}":{"__typename":"MentorPublicProfile","uuid":"a61157e4-2124-42c2-8afb-0ad2cc52a522","displayName":"Tatiana v.","slug":"tatiana-vonbothmer","biography":"\u003cp\u003eHi! I’m Tatiana, a third-year undergraduate at Brown University concentrating in English Literature, with a love for reading and writing. I grew up between San Francisco and Santa Barbara, before making my way to the East Coast for college!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have always been passionate about teaching the next generation. I have over two years of experience working at preschools, where I engage four-to-five-year-olds in reading, skill building, creative activities, and learning about the world. Moreover, in high school I served two years as a Peer Writing Tutor, helping my classmates to effectively write academic papers, creative nonfiction pieces, and journalistic articles. I was also Editor-in-Chief of our student-led newspaper, where I coordinated, managed, and edited submissions covering campus life and global events; in this role, I initiated the incorporation of video articles, created a social media account, and started the inclusion of community kindness notes! Furthermore, in high school I founded “Book and Clothing Swaps,” bringing together our Environmental Club, Fashion Club, and Book Club to create an on-campus thrifting experience, helping to limit waste and instead give used books and clothing articles a second home.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs an undergraduate student at Brown, I am a section editor for my school newspaper’s creative nonfiction magazine, and was formerly a copy editor for various student newspapers, editing and fact-checking nonfiction and fictional articles across genres such as the arts, modern culture, world news, and lifestyle to assist my peers’ writing with respect to grammar, clarity, accuracy, and flow. I love writing and editing, especially when the practice relates to the arts. This past summer, I worked as a gallery intern and grant writer at a non-profit photography gallery in San Francisco that exhibits the innovative work of emerging Bay Area artists. In collaboration with the gallery’s executive director, financial team, and a diverse group of artists and curators, I researched, wrote, and edited grants to cultivate funding for future exhibitions, bringing in thousands of dollars to support the work of amazing artists!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have been lucky enough to continue diving into my love for art, specifically photography and film, through Brown’s open curriculum, where I have taken a myriad of courses concerning both the practice of and theory behind modern media. My other academic interests include philosophy, history, religious studies, and constitutional law, and I have most enjoyed my humanities courses where my various areas of interests intersect; I have taken a philosophy course that discussed the ethical dilemmas within modern literature, a law course that studied Supreme Court decisions regarding freedom of religion, and a film course that considered the philosophy of aesthetics. My passions continue to converge outside of the classroom, where I love to compare literature with on-screen adaptations, engage in philosophical debates with friends, coach kids in tennis, and discuss current events while spending time with my family.\u003c/p\u003e","teachingVideoPlaybackId":"WhWw81BoaaCpyJbtf1bNQMb2M3I4qSV00TIoGEVak00is","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e2b45c85-1ddc-4b75-8427-33156f888e6c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b6038b45-7aa9-4cc7-9afb-6100e453b6eb\"}"},{"__ref":"DeepDives:{\"uuid\":\"9930a26a-f7db-4b03-a504-1f207c267442\"}"},{"__ref":"DeepDives:{\"uuid\":\"328ed2d7-90f1-49eb-a448-2ecaca01eed6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f3a4749d-952d-4805-9f3e-9a8e72a626bc/-/preview/-/format/jpg/","https://ucarecdn.com/fb41462f-0e02-479e-a517-876018798a79/-/preview/-/format/jpg/","https://ucarecdn.com/e662a235-03a3-4ae1-a989-3b96a38cd873/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a4703b5c-faa7-4374-8abd-7bb51ace4f57\"}"},{"__ref":"Education:{\"uuid\":\"836632a9-a826-408b-8898-70d188f480a3\"}"}],"hiredAt":"2025-12-02T17:59:38.812Z","topics":["K-5 Grade Math","Writing","Reading","Executive Function","Academic Coaching","K-6 Storybook","Creative Writing","Film / Theater","Video / Photography","Law / Government / Policy","Journalism"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/c278d819-50e0-435a-a1b0-1b3a8793462f/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tatiana-vonbothmer\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a61157e4-2124-42c2-8afb-0ad2cc52a522\"}"}}},"_sentryTraceData":"1249b548aa864a39ab67f0e653b6098a-89868de0450d7045-0","_sentryBaggage":"sentry-environment=vercel-production,sent
