xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"edd0ce67-6e4c-482f-810b-b89144462cca\"}":{"__typename":"Favorites","uuid":"edd0ce67-6e4c-482f-810b-b89144462cca","photoUrl":"https://ucarecdn.com/f588631d-9467-4f10-a9ef-a75033bfab96/","title":"Chicago","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"07ee0eed-ab45-49dc-9a1c-e03de9abef5a\"}":{"__typename":"DeepDives","uuid":"07ee0eed-ab45-49dc-9a1c-e03de9abef5a","content":"\u003cp\u003eIf I could talk to my younger self, I would tell her to stop doubting whether she belongs in certain spaces. There were so many moments where I felt intimidated or like I had to prove myself constantly, especially as a first-generation student pursuing big goals. I would remind myself that being different is not a weakness, it is actually one of the things that gives me perspective, resilience, and purpose.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would also tell myself not to be afraid to take opportunities, even if they seem out of reach. A lot of the experiences that shaped me most happened because I said yes before feeling fully ready, or because even if i didn't think I would get it, I still submitted the application \"just in case\". Whether it was leadership roles, speaking publicly, creating content, pursuing medicine, or attending Stanford, I learned that confidence often comes after you take the first step, not before.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think I’d also remind myself that success means more when you bring others with you. Some of the things I am most proud of are not awards or accomplishments, but the ways I have been able to support my community, mentor others, and create opportunities for students who may not always see themselves represented in STEM, healthcare, or higher education.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd honestly, I would probably tell myself to breathe a little more and celebrate the small wins. Younger me spent so much time worrying about the future that she sometimes forgot to recognize how far she had already come. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b08fdd02-4f47-45b7-a15e-2570b8915d80\"}":{"__typename":"DeepDives","uuid":"b08fdd02-4f47-45b7-a15e-2570b8915d80","content":"\u003cp\u003eMentorship matters deeply to me because I genuinely would not be where I am today without the guidance and support I received from others throughout my journey. Whether it was teachers who believed in my potential, upperclassmen who helped me navigate unfamiliar spaces, or professionals who took the time to share advice and encouragement, mentorship gave me access to opportunities, confidence, and perspectives that I may not have found on my own.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of that, I see mentorship as a powerful way to create community and open doors for others. I care deeply about helping students feel supported. I want to be the kind of mentor who not only shares advice, but also helps students build confidence in themselves and recognize their own potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"791b0032-7adf-416e-9aed-301e650c5ed1\"}":{"__typename":"DeepDives","uuid":"791b0032-7adf-416e-9aed-301e650c5ed1","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is becoming a physician who creates accessible, community-centered healthcare spaces for underserved populations. Beyond simply practicing medicine, I hope to eventually open my own clinic or nonprofit healthcare space that focuses on culturally competent, compassionate care, particularly for communities that are often overlooked or face barriers to accessing quality healthcare. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1db11fad-81bd-4ecb-9bd1-3ca5898bb2c8\"}":{"__typename":"DeepDives","uuid":"1db11fad-81bd-4ecb-9bd1-3ca5898bb2c8","content":"\u003cp\u003eChoosing my major was honestly a difficult and emotional process for me because I changed my mind many times along the way. Although I am now declared in Biology, it took a lot of self-reflection, uncertainty, and even moments of doubt to get there. There were periods where I questioned whether I should continue on the pre-med track at all, and I spent many sleepless nights trying to figure out what path felt right for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I chose Biology because it aligned well with both my long-term goal of becoming a physician and the many other passions I want to pursue outside of the classroom. One thing that was really important to me was finding a major that gave me flexibility and allowed many of my pre-med prerequisite courses to also count toward my degree requirements. That flexibility matters because I care deeply about being involved in things beyond academics, including STEM education, mentorship, volunteering, tutoring, and community outreach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I also love about Biology is that it gives me room to explore interdisciplinary interests. In addition to healthcare, I am passionate about sustainability and environmental science, and I hope to eventually explore how the healthcare field can become more environmentally sustainable while still preserving patient safety and quality care. I find it exciting that biology connects to so many larger conversations about public health, innovation, and the future of medicine.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3cf5006a-c7ea-432a-ad84-af2a70ede76b\"}":{"__typename":"School","uuid":"3cf5006a-c7ea-432a-ad84-af2a70ede76b","name":"DeVry University Advantage Academy","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60640"},"Education:{\"uuid\":\"3f1609e9-75f3-4c41-a374-8953a6480cc0\"}":{"__typename":"Education","uuid":"3f1609e9-75f3-4c41-a374-8953a6480cc0","school":{"__ref":"School:{\"uuid\":\"3cf5006a-c7ea-432a-ad84-af2a70ede76b\"}"},"startYear":"2022","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a38822c4-bce6-4687-9387-9d29172d02b4\"}":{"__typename":"Education","uuid":"a38822c4-bce6-4687-9387-9d29172d02b4","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Cellular, Molecular, and Organismal Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"5fac7b46-7e10-4b32-a82f-1e9c9c66c10d\"}":{"__typename":"MentorPublicProfile","uuid":"5fac7b46-7e10-4b32-a82f-1e9c9c66c10d","displayName":"Lupe M.","slug":"lupe-miranda-1","biography":"\u003cp\u003eAs a first-generation college student at Stanford University, I care deeply about creating spaces where students feel supported, empowered, and seen. Much of the work I pursue is rooted in community, mentorship, and improving access to opportunities for students from underrepresented backgrounds. Growing up with the mindset of “siempre se debe dar para atrás”, always give back, shaped the way I approach leadership, service, and education.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I am exploring the intersection of medicine, and healthcare that is human-centered, while pursuing the pre-med track in hopes of being a pediatrician or OB/GYN. I am especially interested in how thoughtful design and culturally competent care can improve patient outcomes, particularly for Latine and underserved communities. My interests span healthcare, bioengineering, education, and community advocacy, and I am passionate about finding creative ways to make systems more equitable and accessible.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I spend much of my time involved in mentorship, service, and leadership initiatives. I have volunteered in clinical and community settings, including at Samaritan House Clinic, where I witnessed firsthand the importance of compassionate, patient-centered care, and the Boys and Girls Club in East Palo Alto. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough my leadership roles, including serving as Director of DEI for my sorority, and community-focused positions within student organizations such as my role of Director of Volunteer Engagement \u0026amp; Services for Project ALMMA (Awareness, Learning, and Mental health for iMmigrants and Allies). I have coordinated volunteer opportunities, built partnerships with local organizations, and helped create meaningful programming centered on mentorship and outreach. I care deeply about exposing younger students, especially first-generation students and students of color, to opportunities in higher education, STEM, and healthcare.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also enjoy creating content focused on student life, wellness, skincare, and educational experiences on social media, where I have built an engaged online community. Through platforms like Instagram and TikTok, I love sharing authentic experiences, recommendations, and advice in ways that feel approachable and relatable. Communication and storytelling have become important tools for me in both advocacy and mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome of the experiences that have shaped me most include balancing rigorous academics with leadership and service commitments, navigating college as a first-generation student, and continuously learning how to uplift others while pursuing my own goals. I hope to become a physician who not only provides excellent care, but also advocates for underserved communities and helps diversify the future of medicine and STEM.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I strive to be someone students can feel comfortable asking questions, learning from, and growing alongside. Whether discussing academics, leadership, college transitions, healthcare careers, or finding confidence in unfamiliar spaces, I hope to help students feel capable of pursuing goals they may not have always seen reflected around them.\u003c/p\u003e","teachingVideoPlaybackId":"2RIAewunvJuiOYyl01AvAnW2YHwaG4bkw7ZAsaZk00uAA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I am really proud of is being the first person in my family to graduate from high school, earn an associate degree, and now attend college in a completely new state at Stanford University!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"edd0ce67-6e4c-482f-810b-b89144462cca\"}"}],"causesSupported":[],"major":"Cellular, Molecular, and Organismal Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"07ee0eed-ab45-49dc-9a1c-e03de9abef5a\"}"},{"__ref":"DeepDives:{\"uuid\":\"b08fdd02-4f47-45b7-a15e-2570b8915d80\"}"},{"__ref":"DeepDives:{\"uuid\":\"791b0032-7adf-416e-9aed-301e650c5ed1\"}"},{"__ref":"DeepDives:{\"uuid\":\"1db11fad-81bd-4ecb-9bd1-3ca5898bb2c8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6fd63ad3-c287-45de-8099-7b54016bf387/-/preview/-/format/jpg/","https://ucarecdn.com/040e5ee5-5622-4d58-8317-766b6f117cd7/-/preview/-/format/jpg/","https://ucarecdn.com/559d3008-4189-46f2-8ff2-48c0999f56b2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3f1609e9-75f3-4c41-a374-8953a6480cc0\"}"},{"__ref":"Education:{\"uuid\":\"a38822c4-bce6-4687-9387-9d29172d02b4\"}"}],"hiredAt":"2026-05-07T16:58:40.911Z","topics":["K-6 Storybook","Fashion / Cosmetics","Video / Photography","Finance / Investing","Medicine / Health","STEM Project","Sustainability"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lupe-miranda-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5fac7b46-7e10-4b32-a82f-1e9c9c66c10d\"}"}}},"_sentryTraceData":"5f1f263ca1944eeb8af5ab17fac7bf0e-89f05cf4bee372c6-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5f1f263ca1944eeb8af5ab17fac7bf0e,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"lupe-miranda-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gs
