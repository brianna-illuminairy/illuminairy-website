ound his greatest academic passion from using STEM skills to attempt to solve environmental issues.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, Brett passed his time playing tennis, running track, helping lead his school’s Model United Nations program, conducting his own research project for a Marine Chemistry program, and starting his own paper straw distribution business. He enjoyed spending time with his friends outdoors, commonly going on hikes, camping, and even occasionally SCUBA diving.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eWhile at Stanford, Brett spends his time mainly by aiding in Energy Club projects, still playing tennis, and conducting fluid mechanics research. His favorite energy club project was a research- oriented financial documentation of a renewable energy project in Chile, where he learned about how international renewable energy projects are financed. Brett never even knew what fluid mechanics was when he began as a research assistant in the Environmental Fluid Mechanics Laboratory. Since then, he has helped a PhD student with their thesis experiment, conducted a project of his own, and is currently working in Germany at the University of Rostock’s Institute of Fluid Mechanics.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eBrett is determined to help students reach their goals as STEM students, entrepreneurs, environmentalists, or whatever else they may have in mind.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"fwQ42H01GTYe01JusUt02Mws9qcw02xS97WJOxdxHahvKiM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environmental Systems Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9cd2c0d2-c9bf-493b-8e0f-7b4f78f213ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"69142960-8aa4-42b1-899a-6424eb99b785\"}"},{"__ref":"DeepDives:{\"uuid\":\"8348af80-ca30-4b
