xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0060b867-2989-44f7-ac27-324209c1c24d\"}":{"__typename":"Favorites","uuid":"0060b867-2989-44f7-ac27-324209c1c24d","photoUrl":"https://ucarecdn.com/25ac13f7-0436-45ca-8d27-d854880b0b11/","title":"Monopoly","type":"GAME"},"Favorites:{\"uuid\":\"6cbb4312-648a-4c99-a009-902de58dc49f\"}":{"__typename":"Favorites","uuid":"6cbb4312-648a-4c99-a009-902de58dc49f","photoUrl":"https://ucarecdn.com/7c0c0979-273c-47bc-ad63-647773582569/","title":"Soccer","type":"SPORT"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6e576903-4b40-4d4b-9fea-f8c4c8ddc46a\"}":{"__typename":"DeepDives","uuid":"6e576903-4b40-4d4b-9fea-f8c4c8ddc46a","content":"\u003cp\u003eI care about mentorship because the gap between 'school' and the 'real world' is way too wide. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I was in high school, no one told me that the social sciences and AI could live in the same project, or that statistics could help me understand the stock market. I want to be the bridge for my students by showing them how the concepts they’re learning today actually turn into the careers and projects of tomorrow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"d60fee85-a440-4dce-8e10-0992448049f3\"}":{"__typename":"DeepDives","uuid":"d60fee85-a440-4dce-8e10-0992448049f3","content":"\u003cp\u003eI grew up in Singapore, then the UK, then the US. The combination of culture made me reflect on how to balance between pragmatism \u0026amp; interest.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am here to make my mentors both get good grades by also develop useful skills for college and beyond!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"77700ee8-c63d-4368-bb71-0a206bdd1e75\"}":{"__typename":"DeepDives","uuid":"77700ee8-c63d-4368-bb71-0a206bdd1e75","content":"\u003cp\u003eI chose \u003cstrong\u003eUrban Studies\u003c/strong\u003e for undergrad at first because of my deep interest in cities and make cities 'click'. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLater, I start to understand that for any discipline to stay relevant in the future, we need to use data science and AI toolkits. This is why I switched to \u003cstrong\u003eData Science and AI Engineering\u003c/strong\u003e later on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"cda771d3-67fa-476e-8ec7-c554b1aa2907\"}":{"__typename":"DeepDives","uuid":"cda771d3-67fa-476e-8ec7-c554b1aa2907","content":"\u003cp\u003eStop studying for the grade and start building your 'superpower toolbox.' \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI wish I had known earlier that coding and statistics aren't just for software engineers — they are the keys that unlock any door, from finance to sociology to environmental sciences. \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eFocus on finding a problem you care about solving\u003c/strong\u003e, and use the 'boring' subjects to build the tools you need to solve it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"c817c1f0-7227-4193-a3ee-a3f8421e36d2\"}":{"__typename":"School","uuid":"c817c1f0-7227-4193-a3ee-a3f8421e36d2","name":"University College London","city":"London","type":"HIGH","state":"England","country":"United Kingdom","zip":"WC1N 1ES"},"Education:{\"uuid\":\"56566eae-f5de-45cc-9321-c75310de21b1\"}":{"__typename":"Education","uuid":"56566eae-f5de-45cc-9321-c75310de21b1","school":{"__ref":"School:{\"uuid\":\"c817c1f0-7227-4193-a3ee-a3f8421e36d2\"}"},"startYear":"2021","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"89aed0c2-4d5a-4e66-92d5-d474737e8eb9\"}":{"__typename":"Education","uuid":"89aed0c2-4d5a-4e66-92d5-d474737e8eb9","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2025","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"e31cb49c-302e-4c81-a20d-e4e97914604f\"}":{"__typename":"MentorPublicProfile","uuid":"e31cb49c-302e-4c81-a20d-e4e97914604f","displayName":"Matt X.","slug":"matt-xi","biography":"\u003cp\u003eHi there! I’m Matt, a graduate engineer and AI specialist currently working at \u003cstrong\u003eARM \u003c/strong\u003e(we make your iPhone chip!), where I spend my days using GenAI to help design the next generation of computer chips. My journey has taken me from urban/real-estate analytics in the \u003cstrong\u003eUK London Mayor's Office\u003c/strong\u003e, to environmental risk \u0026amp; financial modeling at \u003cstrong\u003eMoody's Analytics\u003c/strong\u003e, and now to the cutting edge of AI engineering. But throughout my professional path, one thing has remained constant: \u003cstrong\u003emy love for teaching and mentorship.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eMy Tutoring Philosophy: Math with a Purpose\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOver years of tutoring Algebra and Statistics to high school students in both \u003cstrong\u003eNew York and Singapore\u003c/strong\u003e, I’ve observed a consistent trend: math only feels \"hard\" when it feels \"useless.\" I specialize in breaking that barrier. By deconstructing intimidating concepts into \u003cstrong\u003edigestible, relatable chunks\u003c/strong\u003e, I help middle and high school students move past the \"when will I ever use this?\" phase. My goal isn’t just to help a student pass an exam; it’s to help them develop the \u003cstrong\u003equantitative intuition\u003c/strong\u003e that governs our world—equipping them with a mental toolkit that serves them for a lifetime.\u003c/p\u003e\u003ch3\u003e\u003c/h3\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eThe Multidisciplinary Edge: Coding for Everyone\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOne of the most important things I share with my students is that \u003cstrong\u003ecoding is not just for future software engineers.\u003c/strong\u003e It is a superpower for the artist, the historian, the economist, and the activist. Because of my background in the social sciences, I specialize in combining data science with \"non-tech\" topics. We can take any subject you care about and use Python or statistics to uncover new insights.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy Philosophy: Math \u0026amp; Stats with a Purpose\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI have extensive experience tutoring students in \u003cstrong\u003eAlgebra and Statistics\u003c/strong\u003e, helping them move past the \"when will I ever use this?\" phase. \u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003ePassion Projects: Turning Interest into Impact\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eBeyond the classroom, I am deeply invested in the world of \u003cstrong\u003eAgentic AI, LLMs (Large Language Models), and Financial Modeling\u003c/strong\u003e. I’m a firm believer that the best way to learn is by \u003cem\u003edoing\u003c/em\u003e. \u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFor the Social Scientist:\u003c/strong\u003e We can use data science tools to analyze city delays or social trends.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFor the Budding Investor:\u003c/strong\u003e We can dive into the statistics behind day trading and options—interests of mine that provide a perfect playground for applied math.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eMy Tutoring Philosophy\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI treat my students as collaborators. I focus on helping kids identify what they are truly interested in—whether that's gaming, finance, or environmental science—and then showing them how math and stats can be their \"superpower\" in that field. I want to give students the confidence to not only answer questions but to ask better ones.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently based in \u003cstrong\u003eSan Diego\u003c/strong\u003e, I bring a mix of East Coast drive (from my time in New York) and a focused, engineering-mindset to every session. I look forward to helping you or your child turn academic requirements into a launchpad for a true passion project!\u003c/p\u003e","teachingVideoPlaybackId":"oxkMKWM00r00jyBdGpiLka6nWXlg01upuYRZBC3X5b3mc00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eRepresented Singapore for the Asian Games in Weiqi (Go/Baduk).\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0060b867-2989-44f7-ac27-324209c1c24d\"}"},{"__ref":"Favorites:{\"uuid\":\"6cbb4312-648a-4c99-a009-902de58dc49f\"}"}],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6e576903-4b40-4d4b-9fea-f8c4c8ddc46a\"}"},{"__ref":"DeepDives:{\"uuid\":\"d60fee85-a440-4dce-8e10-0992448049f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"77700ee8-c63d-4368-bb71-0a206bdd1e75\"}"},{"__ref":"DeepDives:{\"uuid\":\"cda771d3-67fa-476e-8ec7-c554b1aa2907\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d4f4dac6-2eb4-44bc-bad7-a82b2c3cb39b/-/preview/-/format/jpg/","https://ucarecdn.com/a81c100c-fa8c-4455-97ff-407fc7012b8a/-/preview/-/format/jpg/","https://ucarecdn.com/9c03a850-98e9-4b25-a6bf-2ad16aeb1e03/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"56566eae-f5de-45cc-9321-c75310de21b1\"}"},{"__ref":"Education:{\"uuid\":\"89aed0c2-4d5a-4e66-92d5-d474737e8eb9\"}"}],"hiredAt":"2026-02-09T14:57:44.304Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Sports Analytics","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"matt-xi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e31cb49c-302e-4c81-a20d-e4e97914604f\"}"}}},"_sentryTraceData":"9aefdbf23b344ddc9f618167d7171108-b65bceb675
