xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"966ad194-6caf-46cd-8c1a-2e677160a671\"}":{"__typename":"Favorites","uuid":"966ad194-6caf-46cd-8c1a-2e677160a671","photoUrl":"https://ucarecdn.com/a1648bef-38b5-46af-b24c-caa9fd4bbb05/","title":"Harry Potter and the Chamber of Secrets","type":"BOOK"},"Favorites:{\"uuid\":\"36efe9e9-ac5d-4040-8751-df71c60eb5d9\"}":{"__typename":"Favorites","uuid":"36efe9e9-ac5d-4040-8751-df71c60eb5d9","photoUrl":"https://ucarecdn.com/ceea29aa-ca23-4f50-89cd-aaa67e5028ce/","title":"Taylor Swift","type":"ARTIST"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a29abc9e-9966-4b16-9a81-ab86c34baf60\"}":{"__typename":"DeepDives","uuid":"a29abc9e-9966-4b16-9a81-ab86c34baf60","content":"\u003cp\u003eMy dream job is becoming a judge. While it may not seem like I'm interested in law from my majors, my biggest hope in life is that I'm able to enact real change. By being a judge, I can make rulings on life-changing cases, be a crucial part of national law-making, and make a significant difference on our country!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1a684274-24f8-4172-bbbc-a125fcd4d38c\"}":{"__typename":"DeepDives","uuid":"1a684274-24f8-4172-bbbc-a125fcd4d38c","content":"\u003cp\u003eSome advice I'd give to my middle/high school self is to spend time doing what I love. Throughout my life, singing has always been an activity that has brought me incredible amounts of joy--but I never spent enough time doing it! In college, I'm taking several voice classes so that I can reconnect with the activity that used to make me incredibly happy--and I just love it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"40ed1c66-f01d-40ee-b34a-98079b4c7fd3\"}":{"__typename":"DeepDives","uuid":"40ed1c66-f01d-40ee-b34a-98079b4c7fd3","content":"\u003cp\u003eAs the world gets tougher to navigate, there's one thing that is just NOT going away--and that's AI! As a Computer Science \u0026amp; Economics major, I believe that I will be equipped to understand the financial \u0026amp; technological changes that will continue to become more and more pertinent in the way that we live our lives!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"19d29634-cc90-4a0a-bb3c-6bf1ccf603cd\"}":{"__typename":"DeepDives","uuid":"19d29634-cc90-4a0a-bb3c-6bf1ccf603cd","content":"\u003cp\u003eThroughout high school and college, the most valuable parts of my life was my ability to connect with those older than me, who served as mentor figures. Knowing that they had already paved a path before was not only a relief, but it was comforting. My mentors were there for me through everything--and that's who I hope to be for someone else. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"d7a32ab1-56b6-477d-a3ec-1a53f18ec19a\"}":{"__typename":"School","uuid":"d7a32ab1-56b6-477d-a3ec-1a53f18ec19a","name":"Torrey Pines High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92130"},"Education:{\"uuid\":\"5d0b0ede-3baf-4b64-b067-b6b5628e3fbb\"}":{"__typename":"Education","uuid":"5d0b0ede-3baf-4b64-b067-b6b5628e3fbb","school":{"__ref":"School:{\"uuid\":\"d7a32ab1-56b6-477d-a3ec-1a53f18ec19a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc\"}":{"__typename":"School","uuid":"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc","name":"Claremont McKenna College","city":"Claremont","type":"COLLEGE","state":"California","country":"United States","zip":"91711"},"Education:{\"uuid\":\"628d4e17-de36-4fd2-be46-73f73d7f1e94\"}":{"__typename":"Education","uuid":"628d4e17-de36-4fd2-be46-73f73d7f1e94","school":{"__ref":"School:{\"uuid\":\"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics \u0026 Computer Science (Harvey Mudd College)","degree":null},"MentorPublicProfile:{\"uuid\":\"7eba8d17-0511-4569-b899-3f0bc2144260\"}":{"__typename":"MentorPublicProfile","uuid":"7eba8d17-0511-4569-b899-3f0bc2144260","displayName":"Nethra M.","slug":"nethra-mahendran","biography":"\u003cp\u003eHi, I'm Nethra (Nay-thra)! I'm a sophomore at Claremont McKenna College (CMC) studying Economics with a double major in Computer Science at Harvey Mudd College. I've always loved the intersection of problem-solving, strategy, and creativity–and that's shaped everything from the businesses I started to consulting and research projects I've been part of.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy passion for leading and creating began in high school when I launched my small jewelry business, Nethiart. I grew my business through social media \u0026amp; local events, reaching both local and international customers. My creative outlet which started off as a hobby eventually became a real venture wherein I learned to combine storytelling, design, and data to connect with people. This interest launched me into helping others with their projects and passions within consulting and of course, mentorship!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of college, I recently founded a pro-bono consulting firm called Sol Consulting, which supports small business throughout Southern California.\u0026nbsp; I’ve worked alongside clients in various industries, including personal fitness and even financial advising. My support for these small businesses has ranged from operational restructuring to rebranding and marketing. As a consultant and mentor, witnessing the flourishing projects of passionate individuals is a dream come true; whether it is gaining new clients or a student discovering their unique voice, I take pride in their successes as if they are my own.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn Claremont McKenna’s campus, I’m a Research Assistant at the Kravis Leadership Institute, wherein I study leadership competencies and co-host a podcast that interviews inspirational leaders around the world. I’m an active competitor on the CMC Model United Nations team (currently fourth in the nation!) where I’ve competed internationally (placing 2nd at Harvard WorldMUN in the Philippines) and now train other students in debate and policy research. I participate in government consulting through the Path Consulting group, researching policy implementation and feasibility mapping alongside local city councils. These academic experiences have led me to immensely value collaboration, communication, and empowering others to lead with confidence.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I balance my extracurricular activities with sports, music, and community! I’m on the Claremont Colleges Women’s Club Volleyball team (we won nationals last year!), I sing and play the guitar, and serve as a mentor through the Asian-Pacific American Mentorship program at my school. I love puzzles like the New York Times Mini Crossword, which matches my love for problem-solving, quick thinking, and creativity!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat brings me the most joy is discovering what others are passionate about and giving them the tools to turn that spark into action. Whether it's designing a passion project, learning how to tell your story, or finding confidence in your individual strengths, I want students to walk away feeling empowered and supported.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m absolutely thrilled to work with students who are curious, ambitious, and open to exploring all sorts of ideas–that’s where real growth \u0026amp; creativity comes from!\u003c/p\u003e","teachingVideoPlaybackId":"pHcspTxk9X651ncYVygGIX02stLfzYr25ue8OiEfhvgU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"966ad194-6caf-46cd-8c1a-2e677160a671\"}"},{"__ref":"Favorites:{\"uuid\":\"36efe9e9-ac5d-4040-8751-df71c60eb5d9\"}"}],"causesSupported":[],"major":"Economics \u0026 Computer Science (Harvey Mudd College)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a29abc9e-9966-4b16-9a81-ab86c34baf60\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a684274-24f8-4172-bbbc-a125fcd4d38c\"}"},{"__ref":"DeepDives:{\"uuid\":\"40ed1c66-f01d-40ee-b34a-98079b4c7fd3\"}"},{"__ref":"DeepDives:{\"uuid\":\"19d29634-cc90-4a0a-bb3c-6bf1ccf603cd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/07dfd615-f79f-4f58-a2e8-2ed3411bdf98/-/preview/-/format/jpg/","https://ucarecdn.com/db5dc0d8-913e-431a-8e27-848b003982bc/-/preview/-/format/jpg/","https://uc
