xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f5b527f4-c90b-4b6a-b36b-b325fa665714\"}":{"__typename":"DeepDives","uuid":"f5b527f4-c90b-4b6a-b36b-b325fa665714","content":"\u003cp\u003eMentorship matters to me because I have benefited greatly from it. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I found a mentor in my English teacher, and in college, I found a mentor in entrepreneur Brad Keywell, the co-founder of several publically traded companies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough these experiences, I found that mentors were like icebreakers, helping me feel comfortable trying new things, exploring unfamiliar or uncomfortable territory, and succeeding. This effect is something I hope to extend to my mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"4c8f1490-74c0-4f61-806d-361a2b1d2601\"}":{"__typename":"DeepDives","uuid":"4c8f1490-74c0-4f61-806d-361a2b1d2601","content":"\u003cp\u003eI believe that discipline—not motivation—has driven the majority of professional and academic steps. Unlike motivation, discipline relies only on oneself. In this sense, it is intrinsic and transferable from one ambition to the next. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"688a04dd-33d0-41c1-9bef-ea62864867ec\"}":{"__typename":"DeepDives","uuid":"688a04dd-33d0-41c1-9bef-ea62864867ec","content":"\u003cp\u003eThe single piece of advice I'd offer to my younger self and to my mentees is this: seek out experiential learning. In other words, look for places in which the onus is on you—the student—to make something, anything happen, and not solely on the teacher or advisor. To adopt this mindset is to adopt a sense of self-responsibility, making middle and high school even more rewarding and educational.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"59bbb3d2-4dcf-4cf2-bfed-d5157b962aa8\"}":{"__typename":"DeepDives","uuid":"59bbb3d2-4dcf-4cf2-bfed-d5157b962aa8","content":"\u003cp\u003eI went to a traditional public high school where I played baseball and basketball, participated in student government, and wrote for the school paper. I tried it all and learned lessons from each experience. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the classroom, I created academic opportunities for myself, eventually splitting my time between the high school classroom and the University of Michigan, where I was a dual enrollment student. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn doing so, I involved myself in two communities: one inside my high school's walls and another beyond it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"c53cbfbd-d5b0-47d4-a5cd-9191c83641e7\"}":{"__typename":"School","uuid":"c53cbfbd-d5b0-47d4-a5cd-9191c83641e7","name":"Community High School","city":"Ann Arbor","type":"HIGH","state":"Michigan","country":"United States","zip":"48104"},"Education:{\"uuid\":\"11717aee-6a81-494f-bd9d-b9b97c697c0a\"}":{"__typename":"Education","uuid":"11717aee-6a81-494f-bd9d-b9b97c697c0a","school":{"__ref":"School:{\"uuid\":\"c53cbfbd-d5b0-47d4-a5cd-9191c83641e7\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"c7972b83-3354-4e71-9b7a-fc97a3c01c5a\"}":{"__typename":"Education","uuid":"c7972b83-3354-4e71-9b7a-fc97a3c01c5a","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics and Sustainable Development","degree":null},"MentorPublicProfile:{\"uuid\":\"2f146a1c-b992-49d0-b575-6a521cd2b486\"}":{"__typename":"MentorPublicProfile","uuid":"2f146a1c-b992-49d0-b575-6a521cd2b486","displayName":"Noah B.","slug":"noah-bernstein","biography":"\u003cp\u003eHi! My name is Noah, and I'm a junior at Columbia, where I study Economics and Sustainable Development (essentially climate science and policy). In my spare time, I race on the Columbia Ski Team and edit for the student newspaper.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStudent journalism is something I stumbled into as a sophomore in high school, and I have found it to be the highlight of my academic experience since. During high school, I interviewed local politicians and business leaders, and in college, I interviewed Speaker Mike Johnson, produced a special edition of the \u003cem\u003eNew York Magazine\u003c/em\u003e, and appeared on CNN. All of these experiences have changed my perspective, emphasizing the ability to ask good questions, write concisely, and be entrepreneurial. I bring a similarly journalistic approach to my mentorship founded on curiosity, communication, and creativity. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also view my role as a mentor as one informed by my educational journey, during which I attended public elementary school, private middle school, public high school, a community college, a public university, and, now, a private university. Through this process, I've encountered countless teachers, taking note the characteristics that shape positive (and negative) learning environments. In doing so, I hope to create a supportive mentor/mentee relationship, prioritizing independence and offering support, when needed.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics and Sustainable Development","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f5b527f4-c90b-4b6a-b36b-b325fa665714\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c8f1490-74c0-4f61-806d-361a2b1d2601\"}"},{"__ref":"DeepDives:{\"uuid\":\"688a04dd-33d0-41c1-9bef-ea62864867ec\"}"},{"__ref":"DeepDives:{\"uuid\":\"59bbb3d2-4dcf-4cf2-bfed-d5157b962aa8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9ea6f245-3b4c-4a56-9bcd-40b0420405fe/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"11717aee-6a81-494f-bd9d-b9b97c697c0a\"}"},{"__ref":"Education:{\"uuid\":\"c7972b83-3354-4e71-9b7a-fc97a3c01c5a\"}"}],"hiredAt":"2024-06-30T12:01:36.512Z","topics":["Finance / Investing","Business / Entrepreneurship","Negotiation","History Project","Visual Arts / Graphic Design","Philosophy","Literature","Sustainability","Global Health","Law / Government / Policy","Journalism","World Cultures","Debate","Public Speaking","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometr
