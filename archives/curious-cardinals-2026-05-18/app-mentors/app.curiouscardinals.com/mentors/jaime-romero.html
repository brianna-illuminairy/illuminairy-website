xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"6f2f8334-d12a-4dcc-94ab-bc1bbfeb1129\"}":{"__typename":"CausesSupported","uuid":"6f2f8334-d12a-4dcc-94ab-bc1bbfeb1129","name":"Live Like Lou","description":"\u003cp\u003eRaised $50,000 for ALS research!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"52dfdb10-2a3f-4173-bc97-747fece70855\"}":{"__typename":"DeepDives","uuid":"52dfdb10-2a3f-4173-bc97-747fece70855","content":"\u003cp\u003eLife is too interesting to live it in the back seat.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"85eb291b-f558-4b50-82b5-0a5decec5848\"}":{"__typename":"DeepDives","uuid":"85eb291b-f558-4b50-82b5-0a5decec5848","content":"\u003cp\u003eCurrently creating a new business where we put personal interior designers in your pocket! Super fun learning full stack websites and using foundational models.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8969fef6-a5c0-4d74-8509-5eb8866f3481\"}":{"__typename":"DeepDives","uuid":"8969fef6-a5c0-4d74-8509-5eb8866f3481","content":"\u003cp\u003eI've always had great mentors that shared their passion for people, science, and creativity. All those things are best when shared!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"7dd7ad7e-15bc-4453-96ab-563a74472350\"}":{"__typename":"DeepDives","uuid":"7dd7ad7e-15bc-4453-96ab-563a74472350","content":"\u003cp\u003eA coffee drinking, soccer playing, roboticist.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}":{"__typename":"School","uuid":"62e59c56-ee46-4213-b082-758af3ff99db","name":"Phillips Exeter Academy","city":"Exeter","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03833"},"Education:{\"uuid\":\"b4e37c7a-05ca-403b-bab4-7331feb6e046\"}":{"__typename":"Education","uuid":"b4e37c7a-05ca-403b-bab4-7331feb6e046","school":{"__ref":"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"3c8c091e-7458-48ad-bdc6-88fe02869b3f\"}":{"__typename":"Education","uuid":"3c8c091e-7458-48ad-bdc6-88fe02869b3f","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"0e9866c9-8b3c-4e54-81c5-dc153702bf62\"}":{"__typename":"MentorPublicProfile","uuid":"0e9866c9-8b3c-4e54-81c5-dc153702bf62","displayName":"jaime r.","slug":"jaime-romero","biography":"\u003cp\u003eFamily, friends, robots—in that order. If it can be built with your hands, there’s a good chance I’ve made it. Over the years, my projects have stretched from the artistic to the technical: a hand-pressed vinyl record of \u003cem\u003eKentucky Rain\u003c/em\u003e, hand-sewn jackets, drones that follow me around, and even a #1 ranked FIRST Robotics Competition robot. Each creation reflects the same drive: I love taking ideas of products and making them into a reality with my own two hands.\u003c/p\u003e\u003cp\u003eThat instinct has carried me into my current path. I’m now studying robotics and machine learning at the University of Pennsylvania. We live in a great time to explore the adaptation of learning methods to make smart, adaptable, and more stable machines. In a way, I see robotics as a space where craftsmanship meets computation and where my curiosities turn into real-world impact.\u003c/p\u003e\u003cp\u003eBefore returning to school, I worked at General Motors, where I was part of teams that lived and breathed engineering challenges. I contributed to the development and tuning of control systems—balancing safety, performance, and innovation in an environment where small adjustments can make massive differences. It was a setting where theory met practice every day, and I gained an appreciation for the scale and responsibility that comes with engineering at a global level.\u003c/p\u003e\u003cp\u003eOutside of engineering, I’ve always valued movement and community. Soccer has been a lifelong passion—it keeps me grounded, pushes me physically, and connects me with others in ways few things can. I’ve also channeled that energy into helping families and friends affected by ALS. Which sadly has affected the people around me quite heavily. Through fundraising efforts, I’ve been able to help raise enough to purchase a new cargo truck for a friend navigating life with ALS and contribute over $50,000 to support Live Like Lou an organization dedicated to researching ALS. For me, physical activity and service go hand in hand as they both tie us to the community around us and let me talk to completely new people with completely different lives.\u003c/p\u003e\u003cp\u003eStill, whether I’m working on cars, drones, or code, the heart of my motivation has always been people. Family and friends come first, and I see technology as something that should serve and empower human connection. That’s why I’m always excited to meet others with the same passion for building, experimenting, and learning. The best ideas are rarely made in isolation—they spark from collaboration, late-night problem solving, or testing something that almost works until it finally does.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"02Vr38TiHYN4FMFX02d7sG3pOglqD5h00YeE6Q8Q3Ione4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6f2f8334-d12a-4dcc-94ab-bc1bbfeb1129\"}"}],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"52dfdb10-2a3f-4173-bc97-747fece70855\"}"},{"__ref":"DeepDives:{\"uuid\":\"85eb291b-f558-4b50-82b5-0a5decec5848\"}"},{"__ref":"DeepDives:{\"uuid\":\"8969fef6-a5c0-4d74-8509-5eb8866f3481\"}"},{"__ref":"DeepDives:{\"uuid\":\"7dd7ad7e-15bc-4453-96ab-563a74472350\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/675cc993-bf74-494d-a20e-d8f96f42fe65/-/preview/-/format/jpg/","https://ucarecdn.com/cb6ad719-fd54-431b-a2ba-5a1b23ae0f10/-/preview/-/format/jpg/","https://ucarecdn.com/7b8a02e9-090a-4d1d-960c-7a182c0aeacc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b4e37c7a-05ca-403b-bab4-7331feb6e046\"}"},{"__ref":"Edu
