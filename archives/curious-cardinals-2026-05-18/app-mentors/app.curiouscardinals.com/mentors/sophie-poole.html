xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7062c298-3d9b-4fed-856d-34fcd70e34b7\"}":{"__typename":"DeepDives","uuid":"7062c298-3d9b-4fed-856d-34fcd70e34b7","content":"\u003cp\u003eTry everything and see what sticks! On a whim, I signed up for the Journalism class and I ended up finding one of my greatest passions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"41fb224d-ac4b-4392-b80c-db7d9e870464\"}":{"__typename":"DeepDives","uuid":"41fb224d-ac4b-4392-b80c-db7d9e870464","content":"\u003cp\u003eGreta Gerwig! A fellow Barnard alum, she's made and been in some of my favorite movies, like Little Women, Ladybird, and Frances Ha. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"82000727-d384-4173-9feb-2d485eb77a84\"}":{"__typename":"DeepDives","uuid":"82000727-d384-4173-9feb-2d485eb77a84","content":"\u003cp\u003eI love going to museums and art galleries. In Madrid this past year, I was so lucky to be near the Prado so I could see Las Meninas and Garden of Earthly Delights whenever I felt like it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"cd63fac8-acc9-444c-aa8b-f8817802763e\"}":{"__typename":"DeepDives","uuid":"cd63fac8-acc9-444c-aa8b-f8817802763e","content":"\u003cp\u003eI wanted to learn to think critically about the social implications of literature, performance, and culture. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}":{"__typename":"School","uuid":"67d96877-4245-4f9b-a557-94f9ecabd290","name":"Barnard College","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"caaaf13d-9942-4daf-b3d1-84fdf91767e8\"}":{"__typename":"Education","uuid":"caaaf13d-9942-4daf-b3d1-84fdf91767e8","school":{"__ref":"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":"2022","major":"English, Philosophy","degree":"Bachelors"},"School:{\"uuid\":\"8395920a-f2e4-4dcc-80db-3b47042bbb30\"}":{"__typename":"School","uuid":"8395920a-f2e4-4dcc-80db-3b47042bbb30","name":"Mercer Island High School","city":"Mercer Island","type":"HIGH","state":"Washington","country":"United States","zip":"98040"},"Education:{\"uuid\":\"0b603fc3-56ac-45b4-8cf2-c6e9ba4e95a6\"}":{"__typename":"Education","uuid":"0b603fc3-56ac-45b4-8cf2-c6e9ba4e95a6","school":{"__ref":"School:{\"uuid\":\"8395920a-f2e4-4dcc-80db-3b47042bbb30\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"04e298ac-73d5-4b58-949a-da4f77b1d578\"}":{"__typename":"MentorPublicProfile","uuid":"04e298ac-73d5-4b58-949a-da4f77b1d578","displayName":"Sophie P.","slug":"sophie-poole","biography":"\u003cp\u003eSophie is a recent graduate of Barnard College where she majored in English (concentration in Theatre) with a minor in Philosophy. She lived in Madrid this past year as a Fulbright Research Scholar.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eHer interest in journalism began in high school, where she was the Editor in Chief of the newspaper. She also co-wrote a musical, which had its world premiere at Village Theatre, a prominent regional theatre in the Seattle area. For her work in the newspaper, she received the Stanley Ann Dunham Scholarship for demonstrating social activism, global citizenship, and academic excellence.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eOnce she arrived at Barnard College in NYC, she continued to dedicate herself to journalism and theatre. Developed initially in a playwriting course, she wrote and directed a reading of her own play, Ethanol, which won the Brandt Playwriting Award from Barnard's English Department. She was a Staff Writer and Senior Editor for The Blue and White Magazine, Columbia University's undergraduate magazine, where she interviewed authors like Nicole Krauss and Mina Seçkin, profiled Columbia students from the American South after the 2020 election, and wrote about media culture. She also volunteered at an Immigration Court Help Desk and a non-profit dedicated to helping recent immigrants learn English. She was the recipient of the Ethel Stone Lefrak Prize for Excellence in the Arts and the Helen Prince Memorial Prize for Achievement in Dramatic Composition.\u003cbr\u003e\u003cbr\u003eIn Madrid this year, she has been working on a journalism / oral history project through her Fulbright Research grant. She conducted interviews in English and Spanish with people from 10+ countries about their process of applying for Spanish citizenship through the citizenship program for Sephardic Jews. An article featuring some of her research was recently published in The Dial, a magazine dedicated to publishing locally-sourced reporting from around the world in English.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eShe is passionate about helping young people find the best ways to tell their stories, and she is thrilled to collaborate with her students on journalism projects, investigative research, academic writing, creative writing, and application processes.\u003c/p\u003e","teachingVideoPlaybackId":"6CkEJse6OGD1czAJ1iuXtH7sI3CGwooul5Tom3QlkLw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English, Philosophy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7062c298-3d9b-4fed-856d-34fcd70e34b7\"}"},{"__ref":"DeepDives:{\"uuid\":\"41fb224d-ac4b-4392-b80c-db7d9e870464\"}"},{"__ref":"DeepDives:{\"uuid\":\"82000727-d384-4173-9feb-2d485eb77a84\"}"},{"__ref":"DeepDives:{\"uuid\":\"cd63fac8-acc9-444c-aa8b-f8817802763e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b9885a92-1fb4-44ec-b2a4-34ef4b462b46/-/preview/-/format/jpg/","https://ucarecdn.com/f876b2c9-c9d2-42b6-8f0b-0ed8fe7a53e0/-/preview/-/format/jpg/","https://ucarecdn.com/6dccec79-662f-41f2-8734-e5ee9ae1a02e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"caaaf13d-9942-4daf-b3d1-84fdf91767e8\"}"},{"__ref":"Education:{\"uuid\":\"0b603fc3-56ac-45b4-8cf2-c6e9ba4e95a6\"}"}],"hiredAt":"2023-06-19T03:02:53.912Z","topics":["Philosophy","Literature","History Project","Film / Theater","Creative Writing","World Cultures","Women \u0026 Gender Studies","Journalism","Spanish","Reading","History","Executive Function","College Essay Writing","Academic Coaching","Writing"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility"
