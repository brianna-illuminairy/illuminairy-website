xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fa55e3ee-0e68-4b52-8bef-10b019e2f323\"}":{"__typename":"DeepDives","uuid":"fa55e3ee-0e68-4b52-8bef-10b019e2f323","content":"\u003cp\u003eMentorship matters to me because I want to continuously find ways to give back to the people who have helped me become who I am today. When I was in high school, my ACT tutor became one of my biggest mentors, and most importantly one of my strongest supporters. He was one of the smartest and emotionally intelligent teachers I have ever had and truly understood my academic needs and motivations as a student. My experience with my tutor gives me motivation to be a good mentor for those who are growing up in middle and high school now. Since my mentor-mentee relationship was so impactful in my high school experience, I want to be able to be that person for someone else.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"89a97fa7-15c9-4557-a656-075485203d93\"}":{"__typename":"DeepDives","uuid":"89a97fa7-15c9-4557-a656-075485203d93","content":"\u003cp\u003eThroughout my summers in high school, I attended and then became a camp counselor at Camp Echo. I went to this 7-week sleep away camp for a total of 13 years and it has thoroughly impacted who I am today. I started going to camp when I was 7 years old. Here, I spent summers in Upstate New York with a cabin of 14 girls where we would participate in a myriad of activities including sports, water sports, ziplining, cooking, etc. I learned to make a home away from home at an very young age which gave me a sense of autonomy and independence. When I aged out of being a camper, I returned to camp as a camp counselor and learned even more about myself and the impact of taking care of children. I cultivated close, individual relationships with all of my campers and promoted a safe and fun environment. My experience as a camper and a counselor continues to inform who I am today and the ways in which I build relationships and homes around the world.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"9dc51014-7d8f-4403-9008-da23ca66cc26\"}":{"__typename":"DeepDives","uuid":"9dc51014-7d8f-4403-9008-da23ca66cc26","content":"\u003cp\u003eWhen I was a high school student, I worked as hard as I could at my academics and joined a bunch of extracurricular activities. I was never good at just one subject, but maintained a balance in all of the classes I took. Since I was fortunate to have small classes in high school, I was able to make incredibly close-knit relationships with my teachers and my athletic coaches. I was the captain of the girl’s soccer team, tried out a different sports like track and field, a peer tutor, and a member of the Honor Council which upholds and monitors academic integrity within our classrooms. I always tried my best to work as hard as I could and set goals for myself along the way.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0869d01c-dd72-400b-b790-c1cf419ad922\"}":{"__typename":"DeepDives","uuid":"0869d01c-dd72-400b-b790-c1cf419ad922","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I would tell myself to not rush growing up and that the beauty of growing up lies in the things we learn along the way. When I was in middle/high school, I always wanted to be as old as my older brother. I would put immense pressure on myself to perform perfectly. I wanted to rush through growing up and get to college and adulthood. But now, I would tell my middle/high school self to slow down and that everything happens for a reason.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"6e62adb2-5fb1-4370-84b1-31a0c8cd02ef\"}":{"__typename":"School","uuid":"6e62adb2-5fb1-4370-84b1-31a0c8cd02ef","name":"Poly Prep Country Day School Middle/Upper Schools Dyker Heights Campus","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11228"},"Education:{\"uuid\":\"44dc2def-4632-4c84-9e6d-f8cf07b09f6b\"}":{"__typename":"Education","uuid":"44dc2def-4632-4c84-9e6d-f8cf07b09f6b","school":{"__ref":"School:{\"uuid\":\"6e62adb2-5fb1-4370-84b1-31a0c8cd02ef\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"de0d76cd-0f0d-4519-b173-84bd5b3602f0\"}":{"__typename":"Education","uuid":"de0d76cd-0f0d-4519-b173-84bd5b3602f0","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Psychology, Film \u0026 Media","degree":null},"MentorPublicProfile:{\"uuid\":\"d40391e2-c46a-4290-9623-20d62a0381e8\"}":{"__typename":"MentorPublicProfile","uuid":"d40391e2-c46a-4290-9623-20d62a0381e8","displayName":"Isabella J.","slug":"isabella-jalowayski","biography":"\u003cp\u003eHi! My name is Isabella (Izzy) Jalowayski and I am a recent graduate from UC Berkeley. I earned a double major in Film \u0026amp; Media and Psychology and am extremely passionate about the entertainment industry, writing, storytelling, and learning about people. I fell in love with psychology throughout high school and believe that understanding human thought, behavior, and mental processes is crucial to navigating our overall experience as people. My keen interest in human beings and social behavior translated into character building and storytelling in film and entertainment. I am so excited to share my passions in the beauty in writing, stories, and human relationships with my future mentees.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in Brooklyn, NY in a single-parent and mixed-race household. Growing up in NYC allowed me to experience a unique childhood in the most culturally diverse city. I, then, moved to California for college and studied abroad in New Zealand where I was able to broaden my horizons from a mostly urban environment to a more outdoor-oriented lifestyle. I love to spend my time with the people I love, playing soccer, watching TV and movies, and going on adventures. I currently am based in NYC and I am pursuing a career in the entertainment industry through an internship at a NYC film production company.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I was a Peer Writing Tutor through UC Berkeley’s Student Learning Center. This role was one of the highlights of my college experience and I am so excited to continue tutoring through Curious Cardinals! I can't wait to meet my future mentees and share our passions together!\u003c/p\u003e","teachingVideoPlaybackId":"Ito4r2OLMh02U1KZAI01TPeGPX6iVxMAb63WGGuDNk02VY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology, Film \u0026 Media","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fa55e3ee-0e68-4b52-8bef-10b019e2f323\"}"},{"__ref":"DeepDives:{\"uuid\":\"89a97fa7-15c9-4557-a656-075485203d93\"}"},{"__ref":"DeepDives:{\"uuid\":\"9dc51014-7d8f-4403-9008-da23ca66cc26\"}"},{"__ref":"DeepDives:{\"uuid\":\"0869d01c-dd72-400b-b790-c1cf419ad922\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3ebe1506-e81e-4157-9df2-eb6bc98a0f7c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"44dc2def-4632-4c84-9e6d-f8cf07b09f6b\"}"},{"__ref":"Education:{\"uuid\":\"de0d76cd-0f0d-4519-b173-84bd5b3602f0\"}"}],"hiredAt":"2024-09-20T05:34:29.330Z","topics":["Video / Photography","Film / Theater","STEM Project","Creative Writing","Writing"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isabella-jalowayski\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d40391e2-c46a-4290-9623-20d62a0381e8\"}"}}},"_sentryTraceData":"95846ca299aa4d5f9602f9dd3208e133-a3cb97160c8881cd-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=95846ca299aa4d5f9602f9dd3208e133,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false
