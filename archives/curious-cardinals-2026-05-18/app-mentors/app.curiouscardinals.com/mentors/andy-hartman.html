:{"__typename":"DeepDives","uuid":"42621f89-2e45-40e0-9644-08627b09b5c3","content":"\u003cp\u003eMy incredible family (including my 2 dogs)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9639ba07-7edc-497a-8e53-b32672a92840\"}":{"__typename":"DeepDives","uuid":"9639ba07-7edc-497a-8e53-b32672a92840","content":"\u003cp\u003eFail, get back up, and then fail harder\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"45b10751-1c3e-480d-9007-c8381629868c\"}":{"__typename":"DeepDives","uuid":"45b10751-1c3e-480d-9007-c8381629868c","content":"\u003cp\u003eOpening up my own restaurant and bartending there every night\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9a21bc57-11f8-4eda-9808-8a083735d28b\"}":{"__typename":"DeepDives","uuid":"9a21bc57-11f8-4eda-9808-8a083735d28b","content":"\u003cp\u003eGoing to a 7-week summer camp in Maine\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2677acc6-3307-43c8-9084-3dc6ab536654\"}":{"__typename":"School","uuid":"2677acc6-3307-43c8-9084-3dc6ab536654","name":"Fieldston High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"c12c7a56-6d4c-4109-b5ce-2be8d37199cb\"}":{"__typename":"Education","uuid":"c12c7a56-6d4c-4109-b5ce-2be8d37199cb","school":{"__ref":"School:{\"uuid\":\"2677acc6-3307-43c8-9084-3dc6ab536654\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"d6e01393-037e-4404-a591-412e72e7d023\"}":{"__typename":"Education","uuid":"d6e01393-037e-4404-a591-412e72e7d023","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Theatre","degree":null},"MentorPublicProfile:{\"uuid\":\"d7d1282c-348d-44fd-903e-cf9c9e3a7c5c\"}":{"__typename":"MentorPublicProfile","uuid":"d7d1282c-348d-44fd-903e-cf9c9e3a7c5c","displayName":"Andy H.","slug":"andy-hartman","biography":"\u003cp\u003eAndy recently graduated Summa Cum Laude from Northwestern with a major in Theatre, a certificate in Musical Theatre, and a module in Acting for Screen! Aside from theatre, he took tons of cool classes including Principles of Entrepreneurship, Designing Your Life, and Marriage 101. Outside of the classroom, you could find him going for a run on the lakefill, giving tours, editing one of his professor's books on Hip-Hop \u0026amp; Rap, hanging with friends from his fraternity, and, of course, performing in shows.\u003cbr\u003e\u003cbr\u003eAndy grew up in New York City, first going to the Trinity School from Kindergarten through 8th Grade and then to the Fieldston School from 9th through 12th Grade. He is so happy to be back at home now in the city with the best bagels and $1 pizza slices. His favorite part of the city? Obviously The Great Lawn.\u003cbr\u003e\u003cbr\u003eAndy is super excited to be a Curious Cardinals mentor! He grew up with two older siblings who very much mentored him both academically and socially. He now hopes to give back and act as an \"older brother\" in a way to his students, no matter what they're passionate about. He looks forward to bringing his enthusiasm, big heart, and genuine understanding of all different kinds of learning styles to the students he's lucky enough to work with. He can't wait to meet you and your student soon!\u003c/p\u003e","teachingVideoPlaybackId":"fpMR1vCE6iUQx4Cwe2plVj7uJFcXqPT4miO8lDYUboE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI seriously would NEVER have believed you if you told me when I was in middle or high school: \"You will get chosen by Northwestern not only for a grant to write a full-length play over the summer, but also to have it be produced as a staged reading the following year.\"\u003cbr\u003e\u003cbr\u003eI'm grateful to say that this did come true and it is truly the thing I am most proud of. I was never the most confident essay writer growing up, but I did always love creative writing - it felt like my outlet to express myself on the page in a way I couldn't articulate out loud. My passion for creative writing continued to be fostered at Northwestern and I'm so thankful for the professors that encouraged me to keep going, especially my Introduction to Playwriting professor who helped me start to develop the play in her class and then worked with me day in and day out as I continued to write it and revise it all the way until opening night.\u003cbr\u003e\u003cbr\u003eI can't even count the number of hours I spent on this entire process from writing the grant, to writing the play, to rewriting the play (over and over again), to assembling the creative team, to holding auditions and callbacks, to sitting in on rehearsals, and so much more. I learned so much about myself as an artist yes, but also as a person. I learned how to really believe in myself, be resilient, and maintain a smile on my face no matter the challenge.\u003cbr\u003e\u003cbr\u003eThis was the most special experience because it was so unexpected and taught me more than I thought working on a play ever could.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"6492b2ee-2c4e-45d1-899d-198271b7471c\"}"},{"__ref":"Favorites:{\"uuid\":\"9d82a199-a82d-484c-afaa-d3a5b8adbf33\"}"},{"__ref":"Favorites:{\"uuid\":\"35d0c4aa-371e-4ad0-83a6-309a7a88c823\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0c15c8ab-bf95-4df7-a4f2-3311404aaf1d\"}"},{"__ref":"CausesSupported:{\"uuid\":\"60d13525-c1ac-4745-bf77-d841a1158156\"}"}],"major":"Theatre","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"42621f89-2e45-40e0-9644-08627b09b5c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"9639ba07-7edc-497a-8e53-b32672a92840\"}"},{"__ref":"DeepDives:{\"uuid\":\"45b10751-1c3e-480d-9007-c8381629868c\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a21bc57-11f8-4eda-9808-8a083735d28b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1c47fbdd-32fa-442a-a8d7-26545d867247/-/preview/-/format/jpg/","https://ucarecdn.com/462b1c19-c54c-43e8-b6eb-ee51006993e9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c12c7a56-6d4c-4109-b5ce-2be8d37199cb\"}"},{"__ref":"Education:{\"uuid\":\"d6e01393-037e-4404-a591-412e72e7d023\"}"}],"hiredAt":"2023-08-03T18:19:18.507Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Film / Theater","Video / Photography","Business / Entrepreneurship","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileV
