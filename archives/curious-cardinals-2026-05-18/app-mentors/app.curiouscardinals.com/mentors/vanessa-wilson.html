xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3efb251a-1cf3-43fa-9743-03c356047bf8\"}":{"__typename":"Favorites","uuid":"3efb251a-1cf3-43fa-9743-03c356047bf8","photoUrl":"https://ucarecdn.com/83b33278-343d-4c57-aebd-e63a5f774e70/","title":"NYC!","type":"CITY"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1dac1c05-0c27-4a7f-802e-8a1ba2a64d1a\"}":{"__typename":"DeepDives","uuid":"1dac1c05-0c27-4a7f-802e-8a1ba2a64d1a","content":"\u003cp\u003eI recently just started playing pickleball\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5bf1a237-607f-49f8-9b70-17b9214723f1\"}":{"__typename":"DeepDives","uuid":"5bf1a237-607f-49f8-9b70-17b9214723f1","content":"\u003cp\u003eEverything happens for a reason, so aim to create a happiness in your life through your hobbies and the people around you, then the right opportunities will find you. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e6cfac8e-0dc5-4c3f-9d40-b61d4c88716a\"}":{"__typename":"DeepDives","uuid":"e6cfac8e-0dc5-4c3f-9d40-b61d4c88716a","content":"\u003cp\u003eTo be a broadcast TV journalist\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"86d39f77-c88e-4fb3-ab5c-acc2ae0fe79a\"}":{"__typename":"DeepDives","uuid":"86d39f77-c88e-4fb3-ab5c-acc2ae0fe79a","content":"\u003cp\u003eI believe having someone to ask for advice who has been through similar situations is super helpful, even if it’s just someone to talk to! I had so many core mentors in my life who reallyt shaped both my social and educational life and I would love to be that person for you. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"f5dbf51d-1748-4638-9ffc-79b92f409a99\"}":{"__typename":"School","uuid":"f5dbf51d-1748-4638-9ffc-79b92f409a99","name":"Dollar Academy","city":"Dollar","type":"HIGH","state":"Scotland","country":"United Kingdom","zip":"FK14 7DU"},"Education:{\"uuid\":\"2dc600d1-aff2-4863-a059-2fe198705485\"}":{"__typename":"Education","uuid":"2dc600d1-aff2-4863-a059-2fe198705485","school":{"__ref":"School:{\"uuid\":\"f5dbf51d-1748-4638-9ffc-79b92f409a99\"}"},"startYear":"2019","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"3f474508-a488-4feb-9322-610c2561326e\"}":{"__typename":"Education","uuid":"3f474508-a488-4feb-9322-610c2561326e","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Political Science and American Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"7f8411bc-86e4-4a78-b83e-ff033383648b\"}":{"__typename":"MentorPublicProfile","uuid":"7f8411bc-86e4-4a78-b83e-ff033383648b","displayName":"Vanessa W.","slug":"vanessa-wilson","biography":"\u003cp\u003eHi! I’m Vanessa, a student at Columbia University studying Political Science with a concentration in American Studies. I’ve always been deeply interested in how ideas shape the world, whether that’s through politics, media, or education, and tutoring has become one of the most meaningful ways I get to share that passion in a personal, impactful way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I care about most is helping students feel confident in their own thinking. I know from experience that learning isn’t just about memorising content, it’s about understanding how to approach problems, ask the right questions, and communicate ideas clearly. Building that confidence can completely transform how a student approaches school and challenges more broadly.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, my work focuses heavily on reading complex texts, constructing arguments, and writing at a high level as I aim to pursue a career in journalism. At Columbia, I’ve studied a range of thinkers from Plato and Rousseau to modern political scientists, and I regularly produce analytical essays that require both precision and creativity. I’ve been recognised on the Dean’s List and consistently aim for top-level work, which means I understand what strong academic performance actually looks like and how to help students get there step by step.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’ve gained hands-on experience in journalism and communication. I’ve completed a journalism internship with Good Morning Britain, had articles published, and led my school newspaper, where I created and managed an online platform. These experiences have shaped my ability to explain ideas clearly, adapt to different learning styles, and keep students engaged. I’ve also organised academic events and debates, working with students, professors, and professionals, which has strengthened my communication and leadership skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, I bring both structure and energy to sessions. I like to start with a clear goal, break concepts down into manageable steps, and make sure students leave each session feeling more confident than when they started. I tailor my approach to each student, ensuring sessions feel supportive but also productive and challenging in the right ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re looking for someone who will not only help improve grades but also build confidence, curiosity, and independent thinking, I’d love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"4hv2GiWzaUfVXkeEYBZzQlnXyZ77OHKCK41r01bWPldw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMoving to NYC straight from high school in Scotland!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"3efb251a-1cf3-43fa-9743-03c356047bf8\"}"}],"causesSupported":[],"major":"Political Science and American Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1dac1c05-0c27-4a7f-802e-8a1ba2a64d1a\"}"},{"__ref":"DeepDives:{\"uuid\":\"5bf1a237-607f-49f8-9b70-17b9214723f1\"}"},{"__ref":"DeepDives:{\"uuid\":\"e6cfac8e-0dc5-4c3f-9d40-b61d4c88716a\"}"},{"__ref":"DeepDives:{\"uuid\":\"86d39f77-c88e-4fb3-ab5c-acc2ae0fe79a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/89a5ae87-1e5f-4af0-8be1-f2e751fb6255/-/preview/-/format/jpg/","https://ucarecdn.com/f35445ce-39f2-47fb-b384-ec2eb449a210/-/preview/-/format/jpg/","https://ucarecdn.com/394f444e-9539-4f9b-969e-c5b0eb2dc460/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2dc600d1-aff2-4863-a059-2fe198705485\"}"},{"__ref":"Education:{\"uuid\":\"3f474508-a48
