xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c88633b2-7d76-46b9-9f41-47987a6641de\"}":{"__typename":"DeepDives","uuid":"c88633b2-7d76-46b9-9f41-47987a6641de","content":"\u003cp\u003eIn my spare time, I like to make things! Whether it is art, woodwork, or engineered side projects, I love working with my hands. Though the process might be a long and tedious at times, I find that it is always immensely rewarding in the end. Some of my most proud creations have come out of hours of tweaking graphic designs, sanding wood, or debugging electronics.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1c8cdef0-56f3-49c0-9170-98ddaba7fdcb\"}":{"__typename":"DeepDives","uuid":"1c8cdef0-56f3-49c0-9170-98ddaba7fdcb","content":"\u003cp\u003eI would tell myself to chase my interests more. I always loved learning about science, machines, and the way things worked, but I needed a little push to explore my favorite topics on my own time. I think I would have really enjoyed and benefited from learning more through hands on experiences, and think many others would as well!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"463d555d-bf89-4011-99de-aa50f6aa66c5\"}":{"__typename":"DeepDives","uuid":"463d555d-bf89-4011-99de-aa50f6aa66c5","content":"\u003cp\u003eOne of my favorite projects is the desk I created for my college room. I always loved the look of natural wood desks, and one day I decided that I should make one for myself. I bought a local slab of wood and got to work. It turns out that flattening and smoothing a wooden slab is not as easy as I thought - and the project took me an entire summer. But in the end, I was rewarded with a beautiful desk that I used every day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"56213b3b-afd2-43e4-bb6e-6ac617fc54d2\"}":{"__typename":"DeepDives","uuid":"56213b3b-afd2-43e4-bb6e-6ac617fc54d2","content":"\u003cp\u003eMy dream job would be designing espresso machines. Despite being a common appliance on kitchen counters all over the world, there is a lot of cool engineering going on to deliver that cup of coffee! I also love the visual design that goes into espresso machines as well as the history that comes with it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"d43e0ce8-a888-42d2-b18d-e7f973c774fd\"}":{"__typename":"School","uuid":"d43e0ce8-a888-42d2-b18d-e7f973c774fd","name":"Concord Academy","city":"Concord","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01742"},"Education:{\"uuid\":\"6d3678fa-fd6e-41d2-b255-f66eec76de59\"}":{"__typename":"Education","uuid":"6d3678fa-fd6e-41d2-b255-f66eec76de59","school":{"__ref":"School:{\"uuid\":\"d43e0ce8-a888-42d2-b18d-e7f973c774fd\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bf414d61-018f-48e0-9c3c-98b3ed3a37ca\"}":{"__typename":"School","uuid":"bf414d61-018f-48e0-9c3c-98b3ed3a37ca","name":"Tufts University","city":"Medford","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02155"},"Education:{\"uuid\":\"950ae380-083b-4680-8fce-dc84e9d5c028\"}":{"__typename":"Education","uuid":"950ae380-083b-4680-8fce-dc84e9d5c028","school":{"__ref":"School:{\"uuid\":\"bf414d61-018f-48e0-9c3c-98b3ed3a37ca\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"99c3ee59-3c2e-4eb4-90d8-97f7b61e4c64\"}":{"__typename":"MentorPublicProfile","uuid":"99c3ee59-3c2e-4eb4-90d8-97f7b61e4c64","displayName":"Liam C.","slug":"liam-campbell","biography":"\u003cp\u003eHi, I’m Liam! I am a Masters student at Stanford University studying Mechanical Engineering.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI chose to study mechanical engineering because of its broad reach in the world of science, technology, and design. Take a look around you, almost anything you interact with, whether it exists in the physical world or in the “cloud,” was likely touched by a mechanical engineer at some point in its design life cycle!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWithin the expansive world of engineering, I am most excited about the interdisciplinary field of robotics. Whether it's designing an autonomous robot to play board games using cheap electronics and recycled materials, or building educational interfaces for commercial grade robotic arms at the Tufts Center for Engineering Education \u0026amp; Outreach. I have had lots of fun interacting with robotics over the years and know that the barrier to learning robotics is much lower than you might think! I believe robotics is a great way to get started in engineering because of its exposure to good practices in design, programming techniques, prototyping methods, and general problem solving - all great skills to have in engineering and beyond.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also love art and enjoy combining visual design with engineering whenever I get the chance. I have made architectural models, graphic posters, skateboards, desks, and am currently scheming more projects than I have time to complete!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI get outside as much as I can and love running, hiking, surfing, biking, and playing ultimate frisbee.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI look forward to meeting you!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c88633b2-7d76-46b9-9f41-47987a6641de\"}"},{"__ref":"DeepDives:{\"uuid\":\"1c8cdef0-56f3-49c0-9170-98ddaba7fdcb\"}"},{"__ref":"DeepDives:{\"uuid\":\"463d555d-bf89-4011-99de-aa50f6aa66c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"56213b3b-afd2-43e4-bb6e-6ac617fc54d2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7bc9ff2a-1d5d-4b62-90cb-7694bab6a2d9/-/preview/-/format/jpg/","https://ucarecdn.com/2ebc1435-b59e-4fa9-bbd9-a4cf75048908/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6d3678fa-fd6e-41d2-b255-f66eec76de59\"}"},{"__ref":"Education:{\"uuid\":\"950ae380-083b-4680-8fce-dc84e9d5c028\"}"}],"hiredAt":"2025-02-04T21:04:23.740Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","6-8 Grade Science","Computer Science","Visual Arts / Graphic Design","Coding / Programming","Robotics / Electronics / CAD"],
