xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ec7dcb36-1063-4a59-94f9-f3ac29d1ffc8\"}":{"__typename":"DeepDives","uuid":"ec7dcb36-1063-4a59-94f9-f3ac29d1ffc8","content":"\u003cp\u003eAsk for help. There are so many resources that are at your availability, and there are people who really do want to see you succeed. You really don't know what you don't know until you ask about things you are interested in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d46a479d-4584-47e3-aae6-b51d1758d12d\"}":{"__typename":"DeepDives","uuid":"d46a479d-4584-47e3-aae6-b51d1758d12d","content":"\u003cp\u003eI chose my Statistics and Data Science as my major because I had a strong math and computer science background, but nearly no knowledge of either statistics or data science when I came into Yale. I wanted to learn something that both combined my interests and was something new, and it turned out to be a perfect fit.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"67a75793-6fdc-4616-9268-53c52c5d5df2\"}":{"__typename":"DeepDives","uuid":"67a75793-6fdc-4616-9268-53c52c5d5df2","content":"\u003cp\u003eI am very proud of being selected as Team USA's captain at the World Junior Squash Championships. I've played squash nearly my whole life, and this was the final junior tournament I participated in. I was able to extend my leadership capabilities to the younger teammates and people who had never been on a team before -- it was a responsibility and duty that I enjoyed to the fullest and am very proud to have been selected for such a role.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e53ec15a-1c68-4b0c-9f7e-b09ad46f2b6a\"}":{"__typename":"DeepDives","uuid":"e53ec15a-1c68-4b0c-9f7e-b09ad46f2b6a","content":"\u003cp\u003eI created a project to see what aspects of a golf game are most important in the PGA tour. Using data from the past 5 seasons or so, I was able to determine with high probability that greens in regulation are the most important factor in being a successful PGA tour player, and a high percentage led to more wins, prize money, and higher ranking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"82be987d-bec6-4d96-a8e8-4776b89642a8\"}":{"__typename":"School","uuid":"82be987d-bec6-4d96-a8e8-4776b89642a8","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06510"},"Education:{\"uuid\":\"74b1faf8-56b7-48b6-911a-58d3721879e9\"}":{"__typename":"Education","uuid":"74b1faf8-56b7-48b6-911a-58d3721879e9","school":{"__ref":"School:{\"uuid\":\"82be987d-bec6-4d96-a8e8-4776b89642a8\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Statistics and Data Science","degree":null},"School:{\"uuid\":\"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5\"}":{"__typename":"School","uuid":"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5","name":"Brunswick School","city":"Greenwich","type":"HIGH","state":"Connecticut","country":"United States","zip":"06830"},"Education:{\"uuid\":\"10f91fc4-a0ab-4d97-998b-afc92d2c8112\"}":{"__typename":"Education","uuid":"10f91fc4-a0ab-4d97-998b-afc92d2c8112","school":{"__ref":"School:{\"uuid\":\"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5\"}"},"startYear":"2009","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ddce9d9f-6cf4-475b-81e2-7c9e51840a78\"}":{"__typename":"MentorPublicProfile","uuid":"ddce9d9f-6cf4-475b-81e2-7c9e51840a78","displayName":"Tad C.","slug":"tad-carney","biography":"\u003cp\u003eHi! My name is Tad Carney, and I am studying Statistics and Data Science at Yale. I am a member of the Yale Varsity Squash team. Squash has been an integral part of my life: I was the captain of Brunswick School's team and Team USA at the World Junior Championships in 2022. Studying statistics and data science at Yale has been an amazing experience: I get to use all sorts of different data sets, ranging from topics such as animals to topics such as NBA player data, and from them I have learned to draw conclusions from a sheet of numbers. Outside of school and squash, I love to ski, golf, and play tennis. I have done all three for as long as I can remember, and they are my preferred ways of \"taking a break\". \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ec7dcb36-1063-4a59-94f9-f3ac29d1ffc8\"}"},{"__ref":"DeepDives:{\"uuid\":\"d46a479d-4584-47e3-aae6-b51d1758d12d\"}"},{"__ref":"DeepDives:{\"uuid\":\"67a75793-6fdc
