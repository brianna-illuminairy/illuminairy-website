xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d08eab1b-01ce-4e53-82b3-f15e7b0beaf1\"}":{"__typename":"Favorites","uuid":"d08eab1b-01ce-4e53-82b3-f15e7b0beaf1","photoUrl":"https://ucarecdn.com/349e9fa2-5cf5-4b98-9a75-2babf1899d62/","title":"Ellen Pompeo","type":"ACTOR"},"Favorites:{\"uuid\":\"950f7783-aab8-4ca0-9aff-610d9029d469\"}":{"__typename":"Favorites","uuid":"950f7783-aab8-4ca0-9aff-610d9029d469","photoUrl":"https://ucarecdn.com/b2a08fe0-ffdb-4652-a23f-873db9bc3f95/","title":"The Tortured Poets Department","type":"ALBUM"},"Favorites:{\"uuid\":\"8b3190e5-6874-449b-9ade-93f29f939a90\"}":{"__typename":"Favorites","uuid":"8b3190e5-6874-449b-9ade-93f29f939a90","photoUrl":"https://ucarecdn.com/1c252631-cd89-4674-a3ee-993b0051e6a7/","title":"Anora","type":"MOVIE"},"CausesSupported:{\"uuid\":\"58173713-0f88-4282-ab3d-ea687b0d4df2\"}":{"__typename":"CausesSupported","uuid":"58173713-0f88-4282-ab3d-ea687b0d4df2","name":"Pediatric Epilepsy Program","description":"\u003cp\u003ehttps://www.chop.edu/centers-programs/pediatric-epilepsy-program\u003c/p\u003e","photoUrl":"https://ucarecdn.com/c6eb2f3e-6f05-4af3-937c-714f57578dd6/"},"CausesSupported:{\"uuid\":\"4e0c533c-c995-4121-8bee-a663680f9db2\"}":{"__typename":"CausesSupported","uuid":"4e0c533c-c995-4121-8bee-a663680f9db2","name":"The Friendship Circle","description":"\u003cp\u003ehttps://friendsnj.com/\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d40f8db7-445c-4bb7-8860-444eb93bba2c/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c7421e3e-aabb-476c-ac49-c47493c692f7\"}":{"__typename":"DeepDives","uuid":"c7421e3e-aabb-476c-ac49-c47493c692f7","content":"\u003cp\u003eIn high school, I spent most of my free time learning something new in computer science and trying to learn Spanish. Both of these hobbies are now academic interests, though, so I suppose they don't count as \"spare time\" activities anymore. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love hanging out with my friends, watching Netflix, talking about pop culture, and most of all, doing any sort of Karaoke! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"697b0987-9939-41bb-ba57-72ef32d0ce4c\"}":{"__typename":"DeepDives","uuid":"697b0987-9939-41bb-ba57-72ef32d0ce4c","content":"\u003cp\u003eI know my computer science background is very prominent in my profile, but I'm not aiming for a software engineering job! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince starting at Northwestern, I've become very interested in immigration law and the history of U.S. borders. After graduation, I currently hope to do CS-related research in this field, but I'm still learning more and exploring different career paths! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"27a30335-d617-4462-aa6f-e5842d2ead42\"}":{"__typename":"DeepDives","uuid":"27a30335-d617-4462-aa6f-e5842d2ead42","content":"\u003cp\u003eWhen I first became interested in computer science when I was around 11 years old, I wasn't sure how or what to continue learning, as so much of the field seemed completely out of reach. My parents decided to find me a mentor who helped me explore my interests, learn new things, and develop more skills. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf it weren't for my mentor, I probably wouldn't have kept learning CS long enough for it to become my major. I hope that by becoming myself I can help others develop their own interests and explore different paths.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"dcf7be83-9173-4565-b4bb-f5deac64e3ba\"}":{"__typename":"DeepDives","uuid":"dcf7be83-9173-4565-b4bb-f5deac64e3ba","content":"\u003cp\u003eI spent most of my time exploring different interests and potential career paths! After my freshman year, I did a summer program at Stevens Institute of Technology where I was introduced to various engineering disciplines. After my junior year, I did a journalism program called Cherubs at Northwestern University, where I'm now attending! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also worked throughout the summers as a lifeguard and games attendant at Six Flags Great Adventure and as a children's party host at an indoor amusement park. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I wasn't at a summer program or working, I was mostly hanging out with my friends at the beach!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"f245fe55-8d77-4c31-b0a6-9ea63cb8e236\"}":{"__typename":"School","uuid":"f245fe55-8d77-4c31-b0a6-9ea63cb8e236","name":"Communications High School","city":"Wall Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"07719"},"Education:{\"uuid\":\"c492add1-b9d5-4d0f-9aa7-97b8f9911da9\"}":{"__typename":"Education","uuid":"c492add1-b9d5-4d0f-9aa7-97b8f9911da9","school":{"__ref":"School:{\"uuid\":\"f245fe55-8d77-4c31-b0a6-9ea63cb8e236\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"91f5e8d0-9266-4227-8590-c257eeb7fb7d\"}":{"__typename":"Education","uuid":"91f5e8d0-9266-4227-8590-c257eeb7fb7d","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2f23a540-5e6a-4d40-91f6-c8de45d3dd80\"}":{"__typename":"MentorPublicProfile","uuid":"2f23a540-5e6a-4d40-91f6-c8de45d3dd80","displayName":"Brandon K.","slug":"brandon-kopp","biography":"\u003cp\u003e\u003cstrong\u003eABOUT ME\u003c/strong\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003eHello! My name is Brandon, and I'm currently a student at Northwestern University \u003cstrong\u003emajoring in Computer Science and minoring in Legal Studies and Latin America/Caribbean Studies\u003c/strong\u003e. I was born and raised in central New Jersey, around thirty minutes from the beach and an hour from NYC. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy high school, Communications High School (CHS), is a public vocational school with a focus on the communication and media arts. \u003cstrong\u003eI took electives in radio and TV broadcasting, \u003c/strong\u003ewhere I had the chance to make 30-minute-long live TV shows. I was on the student council and held leadership positions in NTHS and SkillsUSA. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have explored so many different potential career paths throughout high school and my first year of college. I've gone through phases of wanting to go into journalism, film/TV, law, engineering, and more. Although most of these didn't end up sticking, I'm so glad I had the opportunity to try them out, even if just for a small time, because it helped me learn so much about what I am passionate about and want to do in the future.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, \u003cstrong\u003eI'm interested in pursuing either research or a career in diplomacy or international relations\u003c/strong\u003e. I'm especially interested in how media literacy is regulated through law and policy in different countries, and how effective these systems are in practice. This interest developed while I was studying abroad in Costa Rica last summer. \u003cstrong\u003eI absolutely love traveling and being immersed in new cultures\u003c/strong\u003e, and I'm currently studying abroad in Mérida, Mexico.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eCOMPUTER SCIENCE\u003c/strong\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003eI was first introduced to computer science in middle school, and my passion has only grown from there! I'm part of the Responsible Al Student Organization (RAISO) on campus, where \u003cstrong\u003eI help develop workshops to introduce students to new CS topics and help them build their own projects.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am most proficient in \u003cstrong\u003ePython\u003c/strong\u003e, but I also have experience in \u003cstrong\u003eJava, C++, Swift, and HTML/CSS/JS!\u003c/strong\u003e At Northwestern, I've worked on software development, data analysis, and interdisciplinary research. I've worked on projects that \u003cstrong\u003ecombine technical tools with real-world social impact\u003c/strong\u003e, including building dashboards for immigration and FOIA research, developing web applications, and \u003cstrong\u003ementoring students in foundational programming concepts\u003c/strong\u003e. Through both coursework and hands-on projects, I focus on using CS as a practical tool for problem-solving, communication across disciplines, and expanding access to information. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs much as I love to continue learning new advanced programming techniques, what I love most is teaching! I've helped a countless number of my friends in middle school, high school, and college who've struggled with programming classes. Through this, I've learned how to explain complex, technical concepts to people who haven't written \"Hello World\" before. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"65jJvh01cSxGeVff01YzseUiCrCCMresi79jZ5C4H6lHA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhen I was very young I suffered from epilepsy, and Dr. Bergqvist at the Children's Hospital of Philadelphia (CHOP) was able to help me by putting me on a medical version of the Ketogenic Diet. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've done a lot to give back to the community that helped me at CHOP, such as discussing my story with families new to the diet, speaking at conferences and events, and, most recently, publishing a children's book about my story. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm very proud of the work I've been able to do and hope to continue to give back in any way I can. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d08eab1b-01ce-4e53-82b3-f15e7b0beaf1\"}"},{"__ref":"Favorites:{\"uuid\":\"950f7783-aab8-4ca0-9aff-610d9029d469\"}"},{"__ref":"Favorites:{\"uuid\":\"8b3190e5-6874-449b-9ade-93f29f939a90\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"58173713-0f88-4282-ab3d-ea687b0d4df2\"}"},{"__ref":"CausesSupported:{\"uuid\":\"4e0c533c-c995-4121-8bee-a663680f9db2\"}"}],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c7421e3e-aabb-476c-ac49-c47493c692f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"697b0987-9939-41bb-ba57-72ef32d0ce4c\"}"},{"__
