xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"99920d04-1a7a-432c-a3e7-0620d94d485a\"}":{"__typename":"Favorites","uuid":"99920d04-1a7a-432c-a3e7-0620d94d485a","photoUrl":"https://ucarecdn.com/6e1333f1-3bc2-4665-b2b7-3e7c79ff8d9b/","title":"Frank Ocean ","type":"ARTIST"},"Favorites:{\"uuid\":\"b424d4a7-51be-407e-8689-ca97753f7c3f\"}":{"__typename":"Favorites","uuid":"b424d4a7-51be-407e-8689-ca97753f7c3f","photoUrl":"https://ucarecdn.com/146f95a1-9b05-4dac-a17e-1ca9f0a61361/","title":"Loud ","type":"ALBUM"},"Favorites:{\"uuid\":\"3e032db0-08de-4f1a-a5b9-9ae7985042c7\"}":{"__typename":"Favorites","uuid":"3e032db0-08de-4f1a-a5b9-9ae7985042c7","photoUrl":"https://ucarecdn.com/84270575-3c44-41e3-a561-994615cca94d/","title":"After Dark by Haruki Murakami ","type":"BOOK"},"CausesSupported:{\"uuid\":\"bbdb08ad-2fa1-4de4-950f-f396a6a3549b\"}":{"__typename":"CausesSupported","uuid":"bbdb08ad-2fa1-4de4-950f-f396a6a3549b","name":"New Haven Reads","description":"\u003cp\u003eI tutor with NHR to help children in New Haven strengthen their literacy skills \u003c/p\u003e","photoUrl":"https://ucarecdn.com/6ac6e33d-a519-4458-94dd-ff4ce0ea6412/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b658bc1d-b9f6-4fb2-8861-5dc59f3054df\"}":{"__typename":"DeepDives","uuid":"b658bc1d-b9f6-4fb2-8861-5dc59f3054df","content":"\u003cp\u003eI chose to major in neuroscience because of its unique ability to bridge multiple disciplines to address complex and pressing questions about the human brain and behavior. My passion for this field started in high school while working on an epilepsy bioinformatics study at the University of Southern California. There, I saw how collaboration between clinicians, researchers, and data scientists could transform approaches to developing therapies for neurological disorders. This early exposure to neuroscience led me to explore how the brain influences decision-making and social behavior, particularly in vulnerable populations. At Yale, I am interested in how early life stress impacts social decision-making and resilience. I hope to explore the long-term impacts of early life stressors on social decision-making and its corresponding neuronal properties.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"67e56c30-d9f7-4643-a89d-e192119edea3\"}":{"__typename":"DeepDives","uuid":"67e56c30-d9f7-4643-a89d-e192119edea3","content":"\u003cp\u003eMy summers in high school were always a mix of many things. I spent a lot of time at sports camps—whether it was swimming, soccer, or gymnastics— being outside was always one of the best parts of summer vacation. As I got older, I started volunteering at local hospitals . I also started doing research at USC, which is how I first became interested in neuroscience. And lastly, I love traveling. A part of my summer every year is spent in\u0026nbsp; France and Tunisia visiting family.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}":{"__typename":"School","uuid":"693ea7b8-def0-456d-88a4-4055bd090a62","name":"Marlborough School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90004"},"Education:{\"uuid\":\"3aa22f81-d2e0-4d4b-9590-1142f81ade06\"}":{"__typename":"Education","uuid":"3aa22f81-d2e0-4d4b-9590-1142f81ade06","school":{"__ref":"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a20a8cf5-4308-4a9e-a54d-c512536ae93b\"}":{"__typename":"Education","uuid":"a20a8cf5-4308-4a9e-a54d-c512536ae93b","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025 ","major":"Neuroscience ","degree":null},"MentorPublicProfile:{\"uuid\":\"e72aafcb-9102-42a2-ba8f-21c43b303429\"}":{"__typename":"MentorPublicProfile","uuid":"e72aafcb-9102-42a2-ba8f-21c43b303429","displayName":"Noor N.","slug":"noor-nouaili","biography":"\u003cp\u003eNoor is a senior at Yale University, majoring in Neuroscience and minoring in French. Originally from Los Angeles, she graduated from the Marlborough School in 2020. She’s currently applying to medical school and is excited to see where she will end up after graduation!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNoor is passionate about medicine, global health, and neuroscience, and she loves sharing that passion with others. She has spent the past three years completing research at Yale School of Medicine in the Molecular Psychiatry and Neuroscience department and has worked on several global health projects throughout her time at Yale. One of her favorite roles has been mentoring high school students in her lab, helping them navigate their first research projects and watching their confidence grow. Understanding that pursuing a STEM career can feel intimidating, Noor is dedicated to supporting her mentees, building their confidence, and helping them develop the tools they need to succeed.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and research, Noor enjoys playing sports—she grew up playing club soccer with LA Galaxy South Bay. At Yale, she enjoys photography, cooking, volunteering, and spending time with her friends.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"Yo57s02W4EzFEbx9C5JUpxSbvd400zV00sCdLHiLv1TUxU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"99920d04-1a7a-432c-a3e7-0620d94d485a\"}"},{"__ref":"Favorites:{\"uuid\":\"b424d4a7-51be-407e-8689-ca97753f7c3f\"}"},{"__ref":"Favorites:{\"uuid\":\"3e032db0-08de-4f1a-a5b9-9ae7985042c7\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"bbdb08ad-2fa1-4de4-950f-f396a6a3549b\"}"}],"major":"Neuroscience ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b658bc1d-b9f6-4fb2-8861-5dc59f3054df\"}"},{"__ref":"DeepDives:{\"uuid\":\"67e56c30-d9f7-4643-a89d-e192119edea3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b3e15f6f-d857-4a24-b5c8-6fabd1615d7f/-/preview/-/format/jpg/","https://ucarecdn.com/a478c409-5266-4a37-b37f-14250e248eb6/-/preview/-/format/jpg/","https://ucarecdn.com/3d061f9c-dcb4-410d-84d8-29f02a05e047/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3aa22f81-d2e0-4d4b-9590-1142f81ade06\"}"},{"__ref":"Education:{\"uuid\":\"a20a8cf5-4308-4a9e-a54d-c512536ae93b\"}"}],"hiredAt":"2024-12-04T03:07:26.886Z","topics":["K-5 Grade Math","6-8 Grade Science","Biology","Writing","French","Academic Coaching","Executive Function","College Essay Writing","K-6 Storybook","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"noor-nouaili\"}}
