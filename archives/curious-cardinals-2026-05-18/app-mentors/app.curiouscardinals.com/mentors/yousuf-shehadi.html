xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"731c4c6a-0cc4-4217-9391-ed9036c4bb24\"}":{"__typename":"Favorites","uuid":"731c4c6a-0cc4-4217-9391-ed9036c4bb24","photoUrl":"https://ucarecdn.com/c3b839dd-5c0f-4922-b002-5f947f6e8799/","title":"We're All Alone in This Toegther","type":"ALBUM"},"Favorites:{\"uuid\":\"bc561035-a27c-46b3-ac0b-c6074831d369\"}":{"__typename":"Favorites","uuid":"bc561035-a27c-46b3-ac0b-c6074831d369","photoUrl":"https://ucarecdn.com/8c9f70f0-1a99-4712-b351-6c20128dcc71/","title":"The Stationery Shop - Marjan Kamali","type":"BOOK"},"Favorites:{\"uuid\":\"d9eae8be-7152-4ab8-8119-e1f8a6bbe25d\"}":{"__typename":"Favorites","uuid":"d9eae8be-7152-4ab8-8119-e1f8a6bbe25d","photoUrl":"https://ucarecdn.com/b39250cd-9dfb-4d55-96fd-4204c603509d/","title":"Beirut, Lebanon","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"16085582-c77e-4d08-8a5e-df987656e08e\"}":{"__typename":"DeepDives","uuid":"16085582-c77e-4d08-8a5e-df987656e08e","content":"\u003cp\u003eWork hard, step out of your comfort zone, don't be afraid to get teased, and most importantly remember you are only responsible for the effort not the outcome.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"82adec56-050b-4350-99e2-a8b813cdb182\"}":{"__typename":"DeepDives","uuid":"82adec56-050b-4350-99e2-a8b813cdb182","content":"\u003cp\u003eThe best way to improve yourself is to give back, so by working with you, I am also getting better. It's a win-win!\u003c/p\u003e\u003cp\u003eI also didn't have much guidance when I was younger, so I want to be the mentor I didn't have.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"74651128-357d-4934-8934-3fc081a79539\"}":{"__typename":"DeepDives","uuid":"74651128-357d-4934-8934-3fc081a79539","content":"\u003cp\u003eMy fear that I will regret passing up opportunities that would have opened up to me had I applied myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"49e04458-f1bd-460a-916b-d013da804e6b\"}":{"__typename":"School","uuid":"49e04458-f1bd-460a-916b-d013da804e6b","name":"Choueifat - Sharjah","city":"الشارقة","type":"HIGH","state":"إمارة الشارقةّ","country":"United Arab Emirates","zip":"20202"},"Education:{\"uuid\":\"20e9cb85-f910-4351-9fbc-b2585c552798\"}":{"__typename":"Education","uuid":"20e9cb85-f910-4351-9fbc-b2585c552798","school":{"__ref":"School:{\"uuid\":\"49e04458-f1bd-460a-916b-d013da804e6b\"}"},"startYear":"2012","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"dec26202-e8e3-4424-ab08-88cc722b15ea\"}":{"__typename":"Education","uuid":"dec26202-e8e3-4424-ab08-88cc722b15ea","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d649e62e-d226-47a0-8e95-f9999dc6d955\"}":{"__typename":"MentorPublicProfile","uuid":"d649e62e-d226-47a0-8e95-f9999dc6d955","displayName":"Yousuf S.","slug":"yousuf-shehadi","biography":"\u003cp\u003eI was born and raised in what used to be a small Bedouin village in the UAE. I moved to the U.S. for college and have been teaching ever since. During my undergraduate studies at Boston University (BU), I conducted biosensor research to detect hormones linked to depression, anxiety, IBS, Parkinson’s, and more. In 2023, I flew to Seattle to present my findings to the Biomedical Engineering Society—a long way from the UAE! I am currently studying Biomedical Engineering at Columbia University, where I research synthetic biology and the gut microbiome.\u003c/p\u003e\u003cp\u003eOutside of the lab, I am passionate about community engagement. I was on the founding board of the BU Arab Student Organization, which continues to thrive today. I love working with my hands, so you can often find me in the machine shop, 3D printing, laser cutting, doing light carpentry, and even customizing my own clothes. Last year, I wore self-made outfits 90% of the time, distributed metal business cards that I laser-etched (without even having a business), and built furniture for friends.\u003c/p\u003e\u003cp\u003eI believe in the importance of representation and actively seek opportunities to be a community leader, enabling younger adolescents to benefit from my experiences and knowledge. This May, I had the honor of being the first Arab commencement speaker in BU Engineering’s illustrious history. To this day, members of the community approach me, expressing their joy at that milestone. At Columbia, I aim to cultivate a similar sense of community, as feeling seen encourages people to express their thoughts and produce better work.\u003c/p\u003e\u003cp\u003eI am passionate about teaching because I want to give back. I know how difficult it can be to admit you need help and even harder to seek it out (trust me, I’ve been there). So if you’re reading this bio, good job—you’re already halfway there! That’s why I’m excited to teach K-8 Math, Geometry, Pre-Calculus, Trigonometry, Algebra I, and Algebra II. Honestly, I will probably learn as much from you as you will learn from me. I look forward to working with you!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing the commencement speaker at Boston University's Engineering commencement. Fun fact: they rejected my high school application and I was still the speaker at their graduation!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"731c4c6a-0cc4-4217-9391-ed9036c4bb24\"}"},{"__ref":"Favorites:{\"uuid\":\"bc561035-a27c-46b3-ac0b-c6074831d369\"}"},{"__ref":"Favorites:{\"uuid\":\"d9eae8be-7152-4ab8-8119-e1f8a6bbe25d\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"16085582-c77e-4d08-8a5e-df987656e08e\"}"},{"__ref":"DeepDives:{\"uuid\":\"82adec56-050b-4350-99e2-a8b813cdb182\"}"},{"__ref":"DeepDives:{\"uuid\":\"74651128-357d-4934-8934-3fc081a79539\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/45bcc1e3-9485-4e0b-be55-dd0be3820a6f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"20e9cb85-f910-4351-9fbc-b2585c552798\"}"},{"__ref":"Education:{\"uuid\":\"dec26202-e8e3-4424-ab08-88cc722b15ea\"}"}],"hiredAt":"2024-09-20T19:36:55.730Z","topics":["K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Chemistry","Physics","Algebra I","Algebra II","6-8 Grade Science"],"communityBadges":["https://ucarecdn.com/d707fb6a-c329-42a8-b4ff-4ab0579bc14e/","https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/"],"restrictedProfileVisibilit
