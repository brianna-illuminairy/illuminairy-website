xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"26793496-f0e4-42c8-b617-dde5d3240b5b\"}":{"__typename":"Favorites","uuid":"26793496-f0e4-42c8-b617-dde5d3240b5b","photoUrl":"https://ucarecdn.com/bff824c4-6d16-4a07-8194-6ad178c913b8/","title":"Blood Harmony, by Finneas!","type":"ALBUM"},"Favorites:{\"uuid\":\"b3b92778-3da3-413d-a16f-104490f4e028\"}":{"__typename":"Favorites","uuid":"b3b92778-3da3-413d-a16f-104490f4e028","photoUrl":"https://ucarecdn.com/3affbbde-651f-461a-9687-062cd02ebad1/","title":"Minecraft","type":"GAME"},"Favorites:{\"uuid\":\"e573e7d0-77ac-4e7a-a935-c20f55627a54\"}":{"__typename":"Favorites","uuid":"e573e7d0-77ac-4e7a-a935-c20f55627a54","photoUrl":"https://ucarecdn.com/c7eb6e21-9ee1-41b5-b80e-5d865a43c2a8/","title":"Bags, by Clairo","type":"SONG"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"691e01a2-ad8b-4865-b62f-ffe6c3ca0071\"}":{"__typename":"DeepDives","uuid":"691e01a2-ad8b-4865-b62f-ffe6c3ca0071","content":"\u003cp\u003eWhen I was in high school, I excelled the most in STEM subjects. However, as I began to learn more about the world around me, I came to realize that politics touches every part of how we live, from the roads we drive on to the air we breathe. When I came to Yale, I decided to major in Political Science and explore the very foundations of our society. I've found it fascinating to explore both the theories behind lofty ideals like democracy and the practical side of bureaucratic policy implementation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"022b5e82-98be-4ae5-89d2-4c568483f882\"}":{"__typename":"DeepDives","uuid":"022b5e82-98be-4ae5-89d2-4c568483f882","content":"\u003cp\u003eOne of my favorite things to do in my spare time is play tennis. I used to play in high school, and it's a great way to get my energy out! I also like playing piano. It's quite cathartic and helps me cool off after a long day. I used to play more when I had more time, but I also enjoy playing video games (Minecraft, in particular!). Finally, I've recently picked up Poker. It's a great way to bring friends together and challenge the mind and the same time!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c90ea732-687d-4bc8-b739-ea43bb0e7e72\"}":{"__typename":"DeepDives","uuid":"c90ea732-687d-4bc8-b739-ea43bb0e7e72","content":"\u003cp\u003eI've found mentorship to be one of the most challenging, yet rewarding things I've done. In high school, I frequently mentored younger students in the political world and through tutoring as well. Investing in someone else's success and bringing them happiness is one of the best feelings in the world, and I love it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"d9332e7b-dced-411d-802b-5fd1684456f0\"}":{"__typename":"DeepDives","uuid":"d9332e7b-dced-411d-802b-5fd1684456f0","content":"\u003cp\u003eI'm very much a technology enthusiast! I love exploring and following new developments in consumer technology and computing. I actually work as a hardware and software technician on campus at Yale, and I built my own computer. I find it amazing that the things that we take for granted today are even possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"a7b4d4ea-c0d1-4f2f-aec5-b88198a1d98d\"}":{"__typename":"School","uuid":"a7b4d4ea-c0d1-4f2f-aec5-b88198a1d98d","name":"Westfield High School","city":"Westfield","type":"HIGH","state":"New Jersey","country":"United States","zip":"07090"},"Education:{\"uuid\":\"0bb5d333-23ea-4dd4-8100-3457e0f248a2\"}":{"__typename":"Education","uuid":"0bb5d333-23ea-4dd4-8100-3457e0f248a2","school":{"__ref":"School:{\"uuid\":\"a7b4d4ea-c0d1-4f2f-aec5-b88198a1d98d\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"dd8023aa-21d9-4dc0-a948-8e107fdb95f6\"}":{"__typename":"Education","uuid":"dd8023aa-21d9-4dc0-a948-8e107fdb95f6","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"33ebc0ac-41a4-44da-bd84-1a410082f274\"}":{"__typename":"MentorPublicProfile","uuid":"33ebc0ac-41a4-44da-bd84-1a410082f274","displayName":"Yenjay H.","slug":"yenjay-hu","biography":"\u003cp\u003eHi there! I'm Yenjay, and I'm excited to get to know you. I'm from a town in central NJ and I currently attend Yale. I went to a large, public high school, where I graduated as salutatorian. In high school, I ran cross country and played for the tennis team. I've actually lived in New Jersey my entire life, aside from college. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough I'm studying political science as my major, I love tutoring math and physics! They were some of my favorite classes in high school, and I've tutored over 20 students in those subjects. I like to take an understanding based approach to teaching. To me, correct answers are important, but making sure a student understands the concepts behind them is the key to learning!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbout my major: I've been involved in politics since my freshman year of high school. Having followed current events since I was young, I was excited to get involved. I've worked on campaigns at various levels of government, interned for NJ Senator Cory Booker, and advocated passionately for lowering the voting age for local elections. I'm also minoring in Statistics \u0026amp; Data Science. As a part of my studies, I've also studied abroad in Spain, learning about Spanish history and improving my Spanish skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I am involved in the Yale Political Union, the Berkeley College Orchestra, and Publius (a joint opinion publication). Alongside STEM tutoring, I'm also quite capable at editing and developing students' English skills. As someone who developing strong writing skills later on in high school, I understand the struggle of writing. I believe writing to be as vital, if not more vital, than STEM skills. Communication through writing is important, no matter what field one's in!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eExtracurricularly, I love listening to music, playing violin in orchestra, and getting out to the tennis court. I also love crafting and am exploring woodworking. In addition to mentoring, I work as a Student Tech in Yale's Student Technology Collective, providing free hardware and software support for Yale students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, some fun facts: I've been to over 30 countries. Skiing is my favorite sport. I love Legos (and use them for dorm decor!). \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI currently lead Vote16NJ, an organization I founded in my home state of New Jersey to lower the voting age for local elections to 16. I'm all about youth empowerment and advocacy! We've been endorsed by NJ Governor Murphy, and the largest city in NJ, Newark enfranchised over 7,000 students in early 2024 by lowering the voting age for their school board elections.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"26793496-f0e4-42c8-b617-dde5d3240b5b\"}"},{"__ref":"Favorites:{\"uuid\":\"b3b92778-3da3-413d-a16f-104490f4e028\"}"},{"__ref":"Favorites:{\"uuid\":\"e573e7d0-77ac-4e7a-a935-c20f55627a54\"}"}],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"691e01a2-ad8b-4865-b62f-ffe6c3ca0071\"}"},{"__ref":"DeepDives:{\"uuid\":\"022b5e82-98be-4ae5-89d2-4c568483f882\"}"},{"__ref":"DeepDives:{\"uuid\":\"c90ea732-687d-4bc8-b739-ea43bb0e7e72\"}"},{"__ref":"DeepDives:{\"uuid\":\"d9332e7b-dced-411d-802b-5fd1684456f0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cca4319c-57eb-4141-ab6c-d64d9f8439c2/-/preview/-/format/jpg/","https://ucarecdn.com/e75a06f8-b97b-48f3-9d82-bc415b2ebcf7/-/preview/-/format/jpg/","https://ucarecdn.com/6b183f53-a52d-48ad-82a2-bf65e2df220e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0bb5d333-23ea-4dd4-8100-3457e0f248a2\"}"},{"__ref":"Education:{\"uuid\":\"dd8023aa-21d9-4dc0-a948-8e107fdb95f6\"}"}],"hiredAt":"2024-12-24T07:01:20.804Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","Physics","Executive Function","Colleg
