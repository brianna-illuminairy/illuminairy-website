js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"bfc07797-a7ea-479a-98c0-6600a6382750\"}":{"__typename":"DeepDives","uuid":"bfc07797-a7ea-479a-98c0-6600a6382750","content":"\u003cp\u003eIn high school, I designed and built a small-scale wind tunnel as part of an independent research project that combined my interests in physics, engineering, and aerodynamics. I wanted to understand how different airfoil shapes affected lift and drag, so I set out to create my own experimental setup from scratch. I constructed the tunnel frame, developed a variable-speed fan system, and used smoke visualization techniques to observe airflow patterns.\u003c/p\u003e\u003cp\u003eWhat started as a simple idea turned into a months-long project involving physics calculations, data collection, and iterative design which meant learning to troubleshoot real engineering challenges along the way. The project taught me not only about the principles of fluid dynamics but also about persistence and creative problem-solving. It deepened my love for experimental science and inspired me to pursue biophysics, where the same physical principles apply at the microscopic level.\u003c/p\u003e\u003cp\u003eToday, I bring that same curiosity and “builder’s mindset” into my teaching. Whether I’m helping a student understand Newton’s laws or a complex biochemical process, I want them to see that science isn’t just something in a textbook,  it’s something you build, test, and discover yourself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"e2970982-3e68-416f-99d8-689f2e1ed502\"}":{"__typename":"DeepDives","uuid":"e2970982-3e68-416f-99d8-689f2e1ed502","content":"\u003cp\u003eIn high school, I was the kind of student who was deeply curious about everything from physics and biology to engineering and art. Academically, I did well, but my mind was always racing with ideas. I constantly wanted to start new projects, test new concepts, and dive into whatever caught my interest that week. While that curiosity drove me to learn a lot on my own, it also meant I sometimes needed guidance and structure to channel all that energy productively.\u003c/p\u003e\u003cp\u003eLooking back, I realize how important mentors were in helping me focus that curiosity without dimming it. They taught me how to turn raw enthusiasm into meaningful progress which is a lesson I now carry into my own teaching. When I work with students who have big ideas or broad interests, I see a bit of myself in them. I try to help them build the focus and confidence to turn that excitement into success, while still keeping their sense of wonder intact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"240f80b8-e1b4-42fb-a961-1c7cf2cc9057\"}":{"__typename":"DeepDives","uuid":"240f80b8-e1b4-42fb-a961-1c7cf2cc9057","content":"\u003cp\u003eMentorship matters to me because I know firsthand how transformative it can be. In high school, I had tons of passion and curiosity but I often didn’t know where to direct it. I was full of ideas and energy but needed guidance to help me focus and channel that excitement into something meaningful. The mentors I did have made all the difference. They didn’t just teach me facts; they helped me discover direction, discipline, and confidence in my abilities.\u003c/p\u003e\u003cp\u003eThat experience shaped how I approach mentorship today. I want to be the kind of person I needed back then. Someone who listens, encourages, and helps students see that their curiosity is a strength, not a distraction. To me, mentorship isn’t about giving answers; it’s about helping someone find their path and giving them the tools to navigate it on their own. Seeing a student turn uncertainty into clarity or doubt into confidence is one of the most rewarding parts of what I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"51ca1ab8-270f-4d4b-a60a-f07a934a30ea\"}":{"__typename":"DeepDives","uuid":"51ca1ab8-270f-4d4b-a60a-f07a934a30ea","content":"\u003cp\u003eI get this question all the time, and my answer is simple: I chose Molecular Biophysics and Biochemistry (MBB) because I’m addicted to interdisciplinary science. I’ve always been fascinated by how different fields like physics, chemistry, biology, computer science all come together to explain the complexity of life. I love the moments when people from completely different academic backgrounds collaborate, each bringing their own way of thinking to tackle a shared question.\u003c/p\u003e\u003cp\u003eTo me, there’s no better major than MBB for that kind of work. It sits right at the crossroads of multiple disciplines, asking questions that can only be answered through teamwork, creativity, and scientific integration. Whether it’s understanding how proteins fold, how molecular interactions drive energy transfer, or how physical forces shape biological systems, MBB invites you to look at life itself as the ultimate puzzle that no single field can solve alone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"04e72e69-9984-4bdf-8cf6-fc9618d44a9e\"}":{"__typename":"School","uuid":"04e72e69-9984-4bdf-8cf6-fc9618d44a9e","name":"North Carolina School of Science and Math - Morganton","city":"Morganton","type":"HIGH","state":"North Carolina","country":"United States","zip":"28655"},"Education:{\"uuid\":\"1d8e6a25-2bd0-45ed-ae1c-254768d91725\"}":{"__typename":"Education","uuid":"1d8e6a25-2bd0-45ed-ae1c-254768d91725","school":{"__ref":"School:{\"uuid\":\"04e72e69-9984-4bdf-8cf6-fc9618d44a9e\"}"},"startYear":"2022","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"4b2269bc-260b-4944-a08b-320054f69299\"}":{"__typename":"Education","uuid":"4b2269bc-260b-4944-a08b-320054f69299","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Molecular Biophysics and Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"171026d7-d4e2-4d63-98f6-094e92827f8d\"}":{"__typename":"MentorPublicProfile","uuid":"171026d7-d4e2-4d63-98f6-094e92827f8d","displayName":"Dylan W.","slug":"dylan-wardlaw","biography":"\u003cp\u003eDylan is a Yale student from the small town of Randleman, North Carolina, pursuing a B.S. in Molecular Biophysics and Biochemistry (MBB) along with an accelerated Master’s degree in the same field. Drawn to the molecular mechanics that power life, he conducts research in biophysics and biochemistry, studying the fine balance between structure, energy, and function at the molecular level. His curiosity about how nature engineers its most efficient systems drives him to merge physical theory with biological complexity and to bring that same sense of wonder to his students.\u003c/p\u003e\u003cp\u003eA firm believer that science is best understood through connection, he’s passionate about teaching all aspects of STEM, from the foundations of chemistry, biology, and physics to the problem-solving and analytical skills that underlie them. He takes pride in finding what makes each student click, using hands-on examples, analogies, and interactive problem-solving to make difficult concepts approachable. Whether he’s helping a middle schooler see the beauty in algebra or guiding a pre-med student through biochemistry, he believes in meeting learners where they are and helping them build confidence step by step.\u003c/p\u003e\u003cp\u003eBefore Yale, Dylan balanced a deep love of academics with athletics. In high school, he competed in baseball, football, track, and wrestling, developing discipline and teamwork that now carry over to his role on Yale’s rugby team. Outside the classroom and the lab, he’s a dedicated trading card game (TCG) player, often found strategizing through Yu-Gi-Oh! and Magic: The Gathering. He loves the creativity, logic, and storytelling in those games the same blend of imagination and reasoning he brings to science and teaching. He is also intimately familiar with how hard it is to balance schoolwork and gaming as a young boy and has a particular ability to connect with and mentor young boys who have a passion for playing online. \u003c/p\u003e\u003cp\u003eHe believes that being well-rounded is one of the greatest strengths a student can have. You don’t have to choose between being a scientist, an athlete, a gamer, or a mentor.  You can be all of them, and more. For Dylan, curiosity isn’t just a subject; it’s a way of life. He’s passionate about helping students find their voice, unlock their potential, and realize that learning isn’t about memorization, it’s about discovery, confidence, and growth.\u003c/p\u003e","teachingVideoPlaybackId":"yMfVZONaxR6VpDq24I8e00hvaORU9bVqO4Uthu3cA01iw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular Biophysics and Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bfc07797-a7ea-479a-98c0-6600a6382750\"}"},{"__ref":"DeepDives:{\"uuid\":\"e2970982-3e68-416f-99d8-689f2e1ed502\"}"},{"__ref":"DeepDives:{\"uuid\":\"240f80b8-e1b4-42fb-a961-1c7cf2cc9057\"}"},{"__ref":"DeepDives:{\"uuid\":\"51ca1ab8-270f-4d4b-a60a-f07a934a30ea\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3da86084-ec53-4e78-92e3-21d754b22419/-/preview/-/format/jpg/","https://ucarecdn.com/2c47b298-71de-4b6d-b92d-4e65e1c84ae1/-/preview/-/format/jpg/","https://ucarecdn.com/4ab00cc2-7f58-442f-b7b3-09908b338c67/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1d8e6a25-2bd0-45ed-ae1c-254768d91725\"}"},{"__ref":"Education:{\"uuid\":\"4b2269bc-260b-4944-a08b-320054f69299\"}"}],"hiredAt":"2026-01-15T15:15:47.405Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Statistics","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Finance / Investing","Robotics / Electronics / CAD","STEM Project","Aviation / Aerospace"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"dylan-wardlaw\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"171026d7-d4e2-4d63-98f6-094e
