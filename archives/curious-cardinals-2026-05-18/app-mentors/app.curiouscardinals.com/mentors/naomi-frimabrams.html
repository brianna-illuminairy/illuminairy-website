xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"693063ba-cbf2-4a47-a4ac-c96ff5b82a7f\"}":{"__typename":"DeepDives","uuid":"693063ba-cbf2-4a47-a4ac-c96ff5b82a7f","content":"\u003cp\u003eI love playing violin and trying new genres with friends. My current favorite is jazz, however I am still trying to improve my improv skills!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e11dfe2a-46b1-41d5-8efa-8361a673d9d8\"}":{"__typename":"DeepDives","uuid":"e11dfe2a-46b1-41d5-8efa-8361a673d9d8","content":"\u003cp\u003eEveryone needs a mentor at some point in their journey! Mentors can help students discover their passions, build self-confidence, understand themselves and their goals, and realize that can excel at whatever they choose to do!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1d66bed2-1ae0-4914-9bba-f7a6fcec27d3\"}":{"__typename":"DeepDives","uuid":"1d66bed2-1ae0-4914-9bba-f7a6fcec27d3","content":"\u003cp\u003eI chose Sociology as my undergraduate major because I enjoy learning about the systems we build to support each other and how we can improve societal welfare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"a9e44fca-8ee0-400f-9c1e-227ae28184fe\"}":{"__typename":"DeepDives","uuid":"a9e44fca-8ee0-400f-9c1e-227ae28184fe","content":"\u003cp\u003eIn high school, I tried to become involved with as many interesting clubs as possible! I was in musicals, sang in a choir, joined the rowing team, and even did a semester with the Mock Trial club. I took advantage of the many different experiences and hobbies available to me through a diverse high school setting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"04b4ad85-8500-4fc2-924f-868bbd82b434\"}":{"__typename":"School","uuid":"04b4ad85-8500-4fc2-924f-868bbd82b434","name":"Taylor Allderdice High School","city":"Pittsburgh","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"15217"},"Education:{\"uuid\":\"414cd2cb-370d-4ebf-9ace-15e042767cbd\"}":{"__typename":"Education","uuid":"414cd2cb-370d-4ebf-9ace-15e042767cbd","school":{"__ref":"School:{\"uuid\":\"04b4ad85-8500-4fc2-924f-868bbd82b434\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"911fe8c1-bba4-4e0e-a39d-9f090db6259b\"}":{"__typename":"School","uuid":"911fe8c1-bba4-4e0e-a39d-9f090db6259b","name":"Universitas Princeton","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"Amerika Serikat","zip":"08544"},"Education:{\"uuid\":\"499f36e3-cdc1-4d11-9cdc-54b762dffdcb\"}":{"__typename":"Education","uuid":"499f36e3-cdc1-4d11-9cdc-54b762dffdcb","school":{"__ref":"School:{\"uuid\":\"911fe8c1-bba4-4e0e-a39d-9f090db6259b\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"008b8105-943b-49d9-8c35-9f42b90ca8b9\"}":{"__typename":"MentorPublicProfile","uuid":"008b8105-943b-49d9-8c35-9f42b90ca8b9","displayName":"Naomi F.","slug":"naomi-frimabrams","biography":"\u003cp\u003eHello! I'm Naomi and I graduated from Princeton University in 2023. Currently, I am an MS Global Health candidate at Boston University. I studied Sociology along with Environmental Science, Urban Studies, and Global Health in my undergraduate degree, and I love learning about how we can build systems and environments that are more inclusive, healthy, and welcoming for everyone. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have experience working with pre-K students through adults in a variety of topics ranging from environmental education to conversational English practice. I have a fair amount of experience with helping children through adults develop English language skills as a second language. I am very passionate about educational equity, and want to assist all students in accessing strong educational resources. I am able to tutor a wide range of topics, from standardized test prep to English to elementary/middle school Math and more. I also play violin and can help students with music theory, composition and general violin skills as well.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have lots of research experience from both my undergrad and grad school classes and projects. My undergraduate senior thesis was awarded an honorable mention for the Global Health department thesis prize. I am currently working on a project examining areas in cities that are most at risk from extreme heat. Outside of academics, I am an avid traveler who loves meeting new people and exploring new areas! Whether seeing crocodiles in Ethiopia or drinking coffee in Indonesia, I love being outdoors and experiencing new environments and cultures. I take this curiosity into my tutoring approach and love to learn about each student's unique background, skills, experiences and interests! I always try to curate my lessons and materials to engage students, no matter the topic.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI started tutoring online in 2020, and have since gained over 600 hours of experience tutoring a variety of subjects. I have had both short-term and long-term students, some of whom I have had the pleasure to work with continuously over the past six years! I love helping students and their families reach their personal and educational goals, and aim to be an enthusiastic, flexible, and patient tutor.\u003c/p\u003e","teachingVideoPlaybackId":"9EvAF5hBjcfL00TqxwA72Ag3KZSl5unfZaZJ2zWRXF2o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"693063ba-cbf2-4a47-a4ac-c96ff5b82a7f\"}"},{"__ref":"DeepDives:{\"uuid\":\"e11dfe2a-46b1-41d5-8efa-8361a673d9d8\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d66bed2-1ae0-4914-9bba-f7a6fcec27d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"a9e44fca-8ee0-400f-9c1e-227ae28184fe\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/953677c3-19ed-4528-87fc-bd3ef2ddee98/-/preview/-/format/jpg/","https://ucarecdn.com/c14edc98-2bb0-40d2-9c4c-3532a4333472/-/preview/-/format/jpg/","https://ucarecdn.com/ac6a1065-0535-4230-bbb2-01a9adece65c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"414cd2cb-370d-4ebf-9ace-15e042767cbd\"}"},{"__ref":"Education:{\"uuid\":\"499f36e3-cdc1-4d11-9cdc-54b762dffdcb\"}"}],"hiredAt":"2026-04-23T02:54:38.632Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"naomi-frimabrams\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"008b8105-943b-49
