xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3d18c7bf-535e-49c3-af42-2ac29bfb9bec\"}":{"__typename":"Favorites","uuid":"3d18c7bf-535e-49c3-af42-2ac29bfb9bec","photoUrl":"https://ucarecdn.com/3d5b10f4-e9a7-46e2-8ef7-f5df41bfcc03/","title":"The Matrix","type":"MOVIE"},"Favorites:{\"uuid\":\"4d7045c9-b968-4d7f-8a7f-490f84159bd1\"}":{"__typename":"Favorites","uuid":"4d7045c9-b968-4d7f-8a7f-490f84159bd1","photoUrl":"https://ucarecdn.com/f6b9e1f6-8aec-4464-9db0-3b22bcd4aca6/","title":"Les Miserables","type":"BOOK"},"Favorites:{\"uuid\":\"218fba93-9b4b-4b51-9952-b5b10e3e76e3\"}":{"__typename":"Favorites","uuid":"218fba93-9b4b-4b51-9952-b5b10e3e76e3","photoUrl":"https://ucarecdn.com/0f337341-8575-42f2-b54a-92b1c80c654f/","title":"Bengal Tiger at the Baghdad Zoo","type":"PLAY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f6e818f9-1892-4235-b4c8-a3ef78941f52\"}":{"__typename":"DeepDives","uuid":"f6e818f9-1892-4235-b4c8-a3ef78941f52","content":"\u003cp\u003eWhile I turned my focus toward writing in college and beyond, in high school I was actually a very dedicated performer. I spent my summers at theater and choir camps and classes, refining my skills as an actor and honing my technique as a singer. I won first place in state with my four-person treble quartet and even ended up playing Jean Valjean in Les Miserables at my (all-girls) high school! (My second profile picture is me acting in the iconic experimental play Fefu and Her Friends at Brown University.) While I don’t think the professional actor life is for me, the years that I spent dedicated to performing have helped me feel much more confident in public speaking and communicating my ideas to others. I love sharing breathing and speaking techniques and exercises – they’re helpful for everyone! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1ca757a3-23b4-4618-9530-e60ca4877008\"}":{"__typename":"DeepDives","uuid":"1ca757a3-23b4-4618-9530-e60ca4877008","content":"\u003cp\u003eAs a 14-year-old freshman in high school, I had the great luck to stumble into a playwriting class at Oregon Children’s Theater. I had always loved acting and writing, and I wondered if it would be possible to do something that combined the two together. By following that curiosity, I discovered my greatest passion in life (playwriting), and met my greatest mentor, who continues to support and inspire me. Matt is an incredibly talented and capable director, playwright, and composer in Portland Oregon, who is not only full of wise insights about the craft of theater, but also deeply committed to his values of helping the next generation of theatermakers discover and refine their talents. He is an incredible teacher who always knows how to meet you exactly where you’re at and guide you to the next level of accomplishment that you’ve always been capable of. He not only showed me that I had artistic talent, but also showed me that pursuing an artistic career was possible and worth it. I never would’ve discovered this path in life if not for his mentorship, so I know how influential mentorship can be. By helping mentees discover their unique talents and passions and support them through the process of refining their craft in whatever they choose to dedicate themselves to, I hope to continue his legacy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"93f4a814-de65-4498-91ac-ed870677f7db\"}":{"__typename":"School","uuid":"93f4a814-de65-4498-91ac-ed870677f7db","name":"St. Mary's Academy","city":"Portland","type":"HIGH","state":"Oregon","country":"United States","zip":"97201"},"Education:{\"uuid\":\"de39dbfe-6fcd-455c-9376-8ee96f2f6c50\"}":{"__typename":"Education","uuid":"de39dbfe-6fcd-455c-9376-8ee96f2f6c50","school":{"__ref":"School:{\"uuid\":\"93f4a814-de65-4498-91ac-ed870677f7db\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"1c24b3f6-9cf4-44fa-82f5-3a2c02a11b82\"}":{"__typename":"Education","uuid":"1c24b3f6-9cf4-44fa-82f5-3a2c02a11b82","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Theater Arts, English","degree":null},"MentorPublicProfile:{\"uuid\":\"c4b603ee-1756-4f64-aa40-416bf8d8039e\"}":{"__typename":"MentorPublicProfile","uuid":"c4b603ee-1756-4f64-aa40-416bf8d8039e","displayName":"Madeleine A.","slug":"madeleine-adriance","biography":"\u003cp\u003eHi! I’m Madeleine, and I’m so excited about the opportunity to work with you to bring your creative dreams to life. I am a recent graduate of Brown University and a professional playwright whose most recent project was a commission to write a play for Oregon Children’s Theater back in my hometown of Portland, OR (West Coast best coast — sorry not sorry, haha). I graduated magna cum laude with honors for my Theater Arts thesis about the representation of climate change and interspecies communication in new American plays – a topic I also explored in my full-length play The Living Ones, which was chosen for a full production by the theater department. In high school, I was named the best English student in the class two years in a row, and at Brown, I worked for several years as a Writing Fellow supporting other students with their academic writing. I’ve spent the last year living in Argentina teaching English on a Fulbright grant, which has reaffirmed how passionate I am about guiding students through the maddening yet deeply rewarding process of learning new concepts. I am especially passionate about working with middle and high school students, which I’ve had the privilege to do in this recent commission – I developed the play over the course of several years incorporating feedback from teenagers and writing toward the teen actors’ strengths. I’ve also helped guide students through the process of writing plays one-on-one as an assistant teacher at Oregon Children’s Theater and in my recent work as a Fulbright grantee. As a national Scholastic Writing Award winner in high school, I am excited to help you bring your creative portfolio to life or guide you through a creative project! I also bring my passion for history, which I explored in high school through an award-winning research paper on Victor Hugo and Napoleon III, and cross-cultural connection. If you’ve never seen or read a play before or are skeptical about theater, don’t worry! I’ve also written a novel as well as a lot of poetry, and am happy to help you at whatever stage of the creative process you’re currently at. I have also been part of many theater production processes and can help guide you through the process of bringing your script to life with a full production! Outside of writing and teaching, I spend my free time practicing guitar and singing, watching and discussing movies, and trying to read books in Spanish (so hard...) You can see more about my creative work on my website madeleineadriance.com. I’m so excited to get to know you!\u003c/p\u003e","teachingVideoPlaybackId":"sATHwmGAXGi5gHLq7LejYe8XJ6GvtXhatuF02cSHHOEM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3d18c7bf-535e-49c3-af42-2ac29bfb9bec\"}"},{"__ref":"Favorites:{\"uuid\":\"4d7045c9-b968-4d7f-8a7f-490f84159bd1\"}"},{"__ref":"Favorites:{\"uuid\":\"218fba93-9b4b-4b51-9952-b5b10e3e76e3\"}"}],"causesSupported":[],"major":"Theater Arts, English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f6e818f9-1892-4235-b4c8-a3ef78941f52\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ca757a3-23b4-4618-9530-e60ca4877008\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7ee3bdb6-a3d9-43fb-8b86-28f01587c510/-/preview/-/format/jpg/","https://ucarecdn.com/f79d0f44-3a01-44bf-a8db-43b29b8d4781/-/preview/-/format/jpg/","https://ucarecdn.com/520a935c-5667-4b3e-9533-dc00c36187a8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"de39dbfe-6fcd-455c-9376-8ee96f2f6c50\"}"},{"__ref":"Education:{\"uuid\":\"1c24b3f6-9cf4-44fa-82f5-3a2c02a11b82\"}"}],"hiredAt":"2026-04-05T20:05:03.766Z","topics":["Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Music","Film / Theater","History Project","Debate","Public Speaking","Journalism"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"madeleine-adriance\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c4b603ee-1756-4f64-aa40-416bf8d8039e\"}"}}},"_sentryTraceData":"3113d4ad4ea24bf7bf779225bcd02a0d-bfa60c9de0932c79-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7
