xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e8c28093-fc70-437d-a6ac-33ac2a973e13\"}":{"__typename":"Favorites","uuid":"e8c28093-fc70-437d-a6ac-33ac2a973e13","photoUrl":"https://ucarecdn.com/6566817c-7430-4a7b-b8ba-8d171bc072d1/","title":"Olivia Dean","type":"ARTIST"},"Favorites:{\"uuid\":\"97866ac3-24b6-421a-b611-39b8bc42a633\"}":{"__typename":"Favorites","uuid":"97866ac3-24b6-421a-b611-39b8bc42a633","photoUrl":"https://ucarecdn.com/48a2cfae-1f52-4176-975f-a93260bbc3ca/","title":"Budapest","type":"SONG"},"Favorites:{\"uuid\":\"1af3b34f-bc26-4e7b-9080-7a7870df65e2\"}":{"__typename":"Favorites","uuid":"1af3b34f-bc26-4e7b-9080-7a7870df65e2","photoUrl":"https://ucarecdn.com/375d36ac-ad7a-43ac-840c-b6175c4f4ff1/","title":"Bruge, Belgium","type":"CITY"},"CausesSupported:{\"uuid\":\"b05d7c37-a353-40a0-8808-3774cb8ac56f\"}":{"__typename":"CausesSupported","uuid":"b05d7c37-a353-40a0-8808-3774cb8ac56f","name":"Vanderbilt Student Volunteers for Science","description":"\u003cp\u003eTeaching elementary kids science lessons.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"97dfe190-9287-4bac-ae9d-0a4531a5859d\"}":{"__typename":"DeepDives","uuid":"97dfe190-9287-4bac-ae9d-0a4531a5859d","content":"\u003cp\u003eTry as many different hobbies, sports, and interests as your time allows. I don't think there's a better time to explore possible interests than in high school when you're still deciding what you might want to do or study in the future. \u003c/p\u003e\u003cp\u003eI realized more recently that interests and versatility is a key factor in connecting with people, and connection with people is exceptionally important at any point in your life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"cab490a7-4aa6-4675-a0ec-04b419b745dc\"}":{"__typename":"DeepDives","uuid":"cab490a7-4aa6-4675-a0ec-04b419b745dc","content":"\u003cp\u003eI'm currently working on a market-entrance strategy for a neuromodulation device. The device is an at-home tDCS device aimed at getting people with MDD accessible and affordable treatment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"db289fae-bea0-4558-bba2-75092902a509\"}":{"__typename":"School","uuid":"db289fae-bea0-4558-bba2-75092902a509","name":"Minnehaha Academy - High School","city":"Minneapolis","type":"HIGH","state":"Minnesota","country":"United States","zip":"55406"},"Education:{\"uuid\":\"1625f7b3-7bc2-4f0e-ab9d-01f56f740425\"}":{"__typename":"Education","uuid":"1625f7b3-7bc2-4f0e-ab9d-01f56f740425","school":{"__ref":"School:{\"uuid\":\"db289fae-bea0-4558-bba2-75092902a509\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"8a225dd8-afe5-441e-b0dc-9036332e1343\"}":{"__typename":"Education","uuid":"8a225dd8-afe5-441e-b0dc-9036332e1343","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Biomedical engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"2cae107b-27c2-4165-a5ba-3eade66197b1\"}":{"__typename":"MentorPublicProfile","uuid":"2cae107b-27c2-4165-a5ba-3eade66197b1","displayName":"Griffin A.","slug":"griffin-anderson","biography":"\u003cp\u003eI am passionate about technology, medicine, and business – I am excited to work with students with many different interests, including learning new technical skills, creating 4-year plans, producing scientific research, and designing impact projects that align with your future goals!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am currently studying biomedical engineering and engineering management at Vanderbilt University. I love medical research, and my focus over the last 3 years has been on diseases and injuries that affect motor function. I work with two different research labs; in one I study a microparticle therapy for Parkinson's Disease and in the second I have been working since high school on research for spinal cord scaffolds to aid spinal cord injuries. In high school, I also worked on an independent research project studying trends in oil-instigated bacteria growth and was a researcher on a team that sent a capsule experiment to the ISS to study gravitropism.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnother big interest of mine is in business and technology strategy. In addition to several business development efforts, I have worked on a market entrance strategy for a neuromodulation device that offers therapy for Major Depressive Disorder (MDD).\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond research, I love ballet and violin, as well as art and traveling! I recently went to Italy and Japan, and will be travelling to France and Ireland this summer for a couple tech Conferences. From 8-17 years old I trained pre-professionally in Minnesota for ballet and competed at the Youth American Grand Prix in 2023 and 2022. I also taught ballet to younger students when I was in high school and helped choreograph performances. My love of art in general expands into my love for the violin which I have been playing since I was about 6 years old; in high school I competed at State competitions and organized several performances at a local nursing home.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI think mentorship offers an opportunity for guidance that is incomparable to most other forms of teaching. With mentorship, we are capable of growing and learning with the specific experiences and lessons our mentors have learned. I am excited to work towards each goal together and build the skills and confidence to keep moving towards the next one. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to support you in setting clear goals and achieving meaningful milestones—whether that begins with identifying opportunities in your community for a project or diving straight into a vision you already have.\u003c/p\u003e","teachingVideoPlaybackId":"Y24Fuos77hNxB02napOvBGU2C5pO6x7xzpEAq00QjIDs4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eLaunching a self-regulated capsule to perform an experiment that was installed on the International Space Station.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e8c28093-fc70-437d-a6ac-33ac2a973e13\"}"},{"__ref":"Favorites:{\"uuid\":\"97866ac3-24b6-421a-b611-39b8bc42a633\"}"},{"__ref":"Favorites:{\"uuid\":\"1af3b34f-bc26-4e7b-9080-7a7870df65e2\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b05d7c37-a353-40a0-8808-3774cb8ac56f\"}"}],"major":"Biomedical engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"97dfe190-9287-4bac-ae9d-0a4531a5859d\"}"},{"__ref":"DeepDives:{\"uuid\":\"cab490a7-4aa6-4675-a0ec-04b419b745dc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dfd6d698-8905-406e-94b4-dc022db70c42/-/preview/-/format/jpg/","https://ucarecdn.com/
