xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ec0e2068-8208-4dc3-b779-2488e9da1efb\"}":{"__typename":"DeepDives","uuid":"ec0e2068-8208-4dc3-b779-2488e9da1efb","content":null,"videoPlaybackId":"aTiFW2FePLfNpDoUgfrhQ7zOwijjfwlRDP84pDEYe028","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"f9676939-26ef-4ae0-b6e4-4fb7e386fb64\"}":{"__typename":"DeepDives","uuid":"f9676939-26ef-4ae0-b6e4-4fb7e386fb64","content":"\u003cp\u003eGrowing up in a Cuban household, I was taught to lead with empathy and make sure everyone feels included, something that really shaped how I teach and mentor. I’ve worked closely with students with special needs, focusing on breaking down concepts in simple, clear ways and celebrating small wins to build confidence. On my baseball team, I’ve also mentored teammates from all different cultural backgrounds, learning how to communicate across differences and support people with different learning styles. These experiences have taught me to be flexible, patient, and encouraging, always aiming to create a space where students feel understood and capable.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"22bc75ae-934b-4731-ab8b-12b9342fa3b8\"}":{"__typename":"DeepDives","uuid":"22bc75ae-934b-4731-ab8b-12b9342fa3b8","content":"\u003cp\u003eIn my spare time, I love to be outdoors. Whether it be playing baseball, golfing, or going to the beach, I love to be in nature and take in the sun. I also have a passion for music and find myself playing the guitar quite often in my spare time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c457c6df-a3a2-47d9-81a4-a138ad1eff41\"}":{"__typename":"DeepDives","uuid":"c457c6df-a3a2-47d9-81a4-a138ad1eff41","content":"\u003cp\u003eMentorship matters to me because I believe every child deserves the support and encouragement to reach their full potential. No one gets there alone. We all need people who believe in us, especially when we’re still figuring things out. I have seen firsthand how much of a difference that kind of support can make.\u003c/p\u003e\u003cp\u003eWhether it’s helping a younger player on my baseball team build confidence or supporting students through tutoring, sometimes, all it takes is someone taking the time to explain a concept differently, offer encouragement after a tough day, or simply show up consistently. I’ve seen students who were struggling in math start to excel once they had someone who was patient and willing to help.\u003c/p\u003e\u003cp\u003eMentorship is also about building community. When we lift each other up, we create spaces where everyone feels seen, heard, and capable. I want to be that kind of person for someone else; someone who listens, supports, and helps them grow both in and out of the classroom.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"4139e3b9-0b90-4a56-b847-561bb89758de\"}":{"__typename":"School","uuid":"4139e3b9-0b90-4a56-b847-561bb89758de","name":"Dr. Michael M. Krop Senior High School","city":"North Miami Beach","type":"HIGH","state":"Florida","country":"United States","zip":"33179"},"Education:{\"uuid\":\"08a14909-0863-437d-83f2-5d0436ae9cd0\"}":{"__typename":"Education","uuid":"08a14909-0863-437d-83f2-5d0436ae9cd0","school":{"__ref":"School:{\"uuid\":\"4139e3b9-0b90-4a56-b847-561bb89758de\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"1d7f1519-7386-45ff-9547-8bd231871f32\"}":{"__typename":"Education","uuid":"1d7f1519-7386-45ff-9547-8bd231871f32","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Industrial and Labor Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"2fe8da08-46bb-418c-90c1-7f15e5350e78\"}":{"__typename":"MentorPublicProfile","uuid":"2fe8da08-46bb-418c-90c1-7f15e5350e78","displayName":"Abel P.","slug":"abel-profeta-1","biography":"\u003cp\u003eHi! My name is Abel, and I’m an incoming sophomore at Cornell University studying Industrial and Labor Relations, with minors in Mathematics and Business. I’ve always been passionate about making a difference, whether that’s mentoring younger students, launching a community initiative, or helping a teammate grow.\u003c/p\u003e\u003cp\u003eI grew up in Miami, Florida, in a close-knit Cuban American household where family, hard work, and service were the cornerstones of everything we did. From an early age, I discovered that math and business weren’t just academic subjects; they were tools I could use to solve problems around me. In high school, I founded a chapter of Future Business Leaders of America and led the Math Honor Society, where I created a free after-school tutoring program for students who couldn’t afford outside help. Through these passions of helping, I started my own business, ProTutors, where I tutored and assisted children with learning disabilities who didn't receive the proper attention they deserved in school.\u0026nbsp;\u003c/p\u003e\u003cp\u003eHelping the environment and giving back to my community have always been core values for me. Growing up in Miami, I developed a deep love for the beach and the ocean. Wanting to preserve these spaces for future generations, I founded \u003cem\u003eIslandHuggers\u003c/em\u003e, a volunteer environmental organization dedicated to protecting South Florida’s coastal ecosystems. Through quarterly island cleanups, we’ve adopted three islands and removed over 6,000 pounds of trash from local waterways, turning a personal passion into a growing community effort to safeguard the places we love most.\u003c/p\u003e\u003cp\u003eThat same love for helping out extends beyond the environment. I also spend a lot of my free time volunteering with Hadassah Teens, raising money for cancer research and organizing bingo games to bring joy and connection to elderly residents in assisted living homes.\u003c/p\u003e\u003cp\u003eOutside the classroom, I enjoy playing baseball and the guitar, and I am a part of Cornell’s club baseball team.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAt Cornell, I’m pursuing a path that blends business, law, and economics, fields I believe can be powerful engines for social change. Mentorship matters to me because I know how transformative it can be. I’ve been lucky to have people in my life who believed in me, and I want to be that person for someone else. Whether your child needs help building confidence in math, navigating school life, or finding their unique voice, I bring patience, energy, and a deep belief in every student’s potential!\u003c/p\u003e","teachingVideoPlaybackId":"jfL7665LPkVdW3uCYoqXGT2kzwF9MFgWafxX26QloSU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Industrial and Labor Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ec0e2068-8208-4dc3-b779-2488e9da1efb\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9676939-26ef-4ae0-b6e4-4fb7e386fb64\"}"},{"__ref":"DeepDives:{\"uuid\":\"22bc75ae-934b-4731-ab8b-12b9342fa3b8\"}"},{"__ref":"DeepDives:{\"uuid\":\"c457c6df-a3a2-47d9-81a4-a138ad1eff41\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e604890b-c5d9-4480-8631-30d323c090e9/-/preview/-/format/jpg/","https://ucarecdn.com/7ca86a58-32af-409f-8613-88bac1acef03/-/preview/-/format/jpg/","https://ucarecdn.com/d30e22f6-a9e9-4338-98f3-70822d9ac476/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"08a14909-0863-437d-83f2-5d0436ae9cd0\"}"},{"__ref":"Education:{\"uuid\":\"1d7f1519-7386-45ff-9547-8bd231871f32\"}"}],"hiredAt":"2025-06-12T14:17:03.150Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","K-6 Storybook","Sports Journalism"],"communityBadges":["https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"abel-profeta-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2fe8da08-46bb-418c-90c1-7f15e5350e78\"}"}}},"_sentryTraceData":"8bfd86d4a5774dc7a9fd062c0a9030eb-af57289d1328baa3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-pub
