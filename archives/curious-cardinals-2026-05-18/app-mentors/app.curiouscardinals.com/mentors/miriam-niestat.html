xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b8c94b43-d74b-4fff-9118-ba9f310bbb2b\"}":{"__typename":"Favorites","uuid":"b8c94b43-d74b-4fff-9118-ba9f310bbb2b","photoUrl":"https://ucarecdn.com/dad46153-018b-4184-9a63-2f2749e8ef42/","title":"Pitch Perfect","type":"MOVIE"},"Favorites:{\"uuid\":\"e3bbf186-ff6c-4887-861d-5ae237ee823a\"}":{"__typename":"Favorites","uuid":"e3bbf186-ff6c-4887-861d-5ae237ee823a","photoUrl":"https://ucarecdn.com/10a96232-d18b-45c7-9e74-3ef8bed12f92/","title":"Noah Kahan","type":"ARTIST"},"Favorites:{\"uuid\":\"a04317ac-ebf5-47c3-9c19-daf653f233df\"}":{"__typename":"Favorites","uuid":"a04317ac-ebf5-47c3-9c19-daf653f233df","photoUrl":"https://ucarecdn.com/0292c54c-0732-4047-a58e-7590a79014b3/","title":"Chicago!","type":"CITY"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4ed916af-cbd0-4888-a34f-fe15a2b768d3\"}":{"__typename":"DeepDives","uuid":"4ed916af-cbd0-4888-a34f-fe15a2b768d3","content":"\u003cp\u003eIn my lifetime, I hope to skydive. I love the feeling of flying down a rollercoaster, and I think skydiving would fulfill that desire to free fall while enjoying a beautiful view. While the thought of skydiving is somewhat scary, it feels like a must-do bucket list item for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c3cc1de7-15f4-422f-910b-36340f60c2fc\"}":{"__typename":"DeepDives","uuid":"c3cc1de7-15f4-422f-910b-36340f60c2fc","content":"\u003cp\u003eMentorship matters to me because it empowers others to discover their passions, which in turn fuels my own drive for learning. The collaborative nature of mentorship fosters a dynamic environment where both mentor and mentee grow together, enhancing our skills and perspectives while building meaningful connections.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"a7f6ac8b-4f10-4564-be24-c5636a0fe430\"}":{"__typename":"School","uuid":"a7f6ac8b-4f10-4564-be24-c5636a0fe430","name":"Kenwood Academy High School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60615"},"Education:{\"uuid\":\"525d47c6-a82d-46c9-ace1-0f1bcbb6c814\"}":{"__typename":"Education","uuid":"525d47c6-a82d-46c9-ace1-0f1bcbb6c814","school":{"__ref":"School:{\"uuid\":\"a7f6ac8b-4f10-4564-be24-c5636a0fe430\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"f4e4b1a0-65fa-4ba5-aa00-e928ce015aed\"}":{"__typename":"Education","uuid":"f4e4b1a0-65fa-4ba5-aa00-e928ce015aed","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Ethics, Politics, and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"20645a7e-d925-4bd3-bd2e-946fab1eeffd\"}":{"__typename":"MentorPublicProfile","uuid":"20645a7e-d925-4bd3-bd2e-946fab1eeffd","displayName":"Miriam N.","slug":"miriam-niestat","biography":"\u003cp\u003eMiriam is a rising sophomore at Yale University, where she is pursuing a degree in Ethics, Politics, and Economics (EP\u0026amp;E). Drawn to the major for its interdisciplinary nature, she is passionate about exploring the intersections of these fields to gain a deeper understanding of the institutions and practices that shape society.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, Miriam is an active member of the Yale Daily News Business team. In this role, she connects with potential clients to secure advertising partnerships, helping to sustain the operations of the News. Beyond campus, she is deeply committed to giving back to the New Haven community. As a volunteer with VITA (Volunteer Income Tax Assistance), she assists low-income individuals by preparing their income taxes, ensuring they receive the financial support they need.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMiriam also has experience working with students, particularly in math, and enjoys finding creative ways to teach a wide range of topics. She is deeply focused on helping students learn for the sake of learning and in ways that best suit their individual needs. Whether it’s breaking down complex equations or exploring creative new ideas, Miriam’s teaching philosophy centers on fostering curiosity and empowering students to succeed on their own terms.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMiriam’s dedication to helping others extends beyond her academic and extracurricular pursuits. She is a regular blood donor, motivated by the belief that if she isn’t afraid of needles, she can “take one for the team” on behalf of those who are.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOriginally from Chicago, Miriam has a deep love for her neighborhood of Hyde Park. She loves swimming in Lake Michigan and also enjoys exploring the city by public transportation, finding joy in the adventure of discovering new neighborhoods and hidden gems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn her free time, Miriam enjoys indulging her curiosity by watching documentaries on a wide range of topics—her favorite being\u0026nbsp;\u003cem\u003eFree Solo\u003c/em\u003e. She also loves picking up new hobbies, from crocheting to yoga, which allow her to unwind and express her creativity in productive ways…but she can also be found indulging in less productive hobbies like playing mindless games on her phone.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMiriam’s blend of intellectual curiosity, community engagement, and adventurous spirit makes her a dynamic and compassionate individual, eager to create meaningful change!\u003c/p\u003e","teachingVideoPlaybackId":"7Q1foTDhaEEpVZRJ7MNvfXJBvw5XjCJ43okDhPgiALo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b8c94b43-d74b-4fff-9118-ba9f310bbb2b\"}"},{"__ref":"Favorites:{\"uuid\":\"e3bbf186-ff6c-4887-861d-5ae237ee823a\"}"},{"__ref":"Favorites:{\"uuid\":\"a04317ac-ebf5-47c3-9c19-daf653f233df\"}"}],"causesSupported":[],"major":"Ethics, Politics, and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4ed916af-cbd0-4888-a34f-fe15a2b768d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"c3cc1de7-15f4-422f-910b-36340f60c2fc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8f633cc7-ecc0-4615-87e6-78565a215deb/-/preview/-/format/jpg/","https://ucarecdn.com/d58342b0-29bf-492b-8f12-125e744309b9/-/preview/-/format/jpg/","https://ucarecdn.com/252a0f74-1523-4f3c-8131-c79baf0fed34/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"525d47c6-a82d-46c9-ace1-0f1bcbb6c814\"}"},{"__ref":"Education:{\"uuid\":\"f4e4b1a0-65fa-4ba5-aa00-e928ce015aed\"}"}],"hiredAt":"2025-06-19T00:31:01.291Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","History Project","Business / Entrepreneurship","Law / Government
