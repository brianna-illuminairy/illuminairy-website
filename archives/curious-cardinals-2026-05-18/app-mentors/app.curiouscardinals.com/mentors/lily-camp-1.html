xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0594417a-b316-4290-9503-8fc2b370cd3a\"}":{"__typename":"Favorites","uuid":"0594417a-b316-4290-9503-8fc2b370cd3a","photoUrl":"https://ucarecdn.com/67345feb-1a47-47fe-a7dc-0c21b2add4af/","title":"The Secret of Us","type":"ALBUM"},"Favorites:{\"uuid\":\"ef3c25b7-1084-4088-8f64-82d898bd83b6\"}":{"__typename":"Favorites","uuid":"ef3c25b7-1084-4088-8f64-82d898bd83b6","photoUrl":"https://ucarecdn.com/3a6313ea-7cb2-46af-a6d6-5fa9b85eebbe/","title":"OSU Buckeyes","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"0ff5e07a-941b-47f1-8ec9-fdf496b582a6\"}":{"__typename":"Favorites","uuid":"0ff5e07a-941b-47f1-8ec9-fdf496b582a6","photoUrl":"https://ucarecdn.com/6ded991c-dcbf-464d-9193-1aaa90005e04/","title":"Scattegories","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b3bba5a0-34c3-4e3a-863b-d992e0ed4311\"}":{"__typename":"DeepDives","uuid":"b3bba5a0-34c3-4e3a-863b-d992e0ed4311","content":"\u003cp\u003eOne piece of advice I would give my high school self is to not worry about choosing a path. I would encourage myself to explore all of my interests and understand that I will find a way to combine them in the future. I would explain that my path changes several times in college and that it is great to put yourself out there and try new things! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"b49e556c-a334-49fe-b202-dc61fcff1c67\"}":{"__typename":"DeepDives","uuid":"b49e556c-a334-49fe-b202-dc61fcff1c67","content":"\u003cp\u003eMy greatest role model is my cousin Molly. She helped me become interested in research throughout the years and has been someone who I can always go to for advice on school, research, friends, and everything in my life. She is currently pursuing her PhD in Clinical Psychology and I am so proud of her! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ae701cda-807e-4812-9e30-d1b389324266\"}":{"__typename":"DeepDives","uuid":"ae701cda-807e-4812-9e30-d1b389324266","content":"\u003cp\u003eIn my spare time my favorite thing to do is to hang out with my roommates! I live with 8 girls who have made my college experience awesome. I love to bake, go get ice cream, go to yoga, and watch a lot of food network with them! My favorite place we go is Culver's.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c84b7df0-d908-4d98-b9d6-e1105beb31e8\"}":{"__typename":"DeepDives","uuid":"c84b7df0-d908-4d98-b9d6-e1105beb31e8","content":"\u003cp\u003eOne passion project I’ve been working on is exploring how changes in the brain’s genetic activity might help us better understand and treat diseases like Alzheimer’s. I started this work during a summer research program at UCLA, where I learned how to use coding to analyze large biological datasets. Since then, I’ve been a part of a recently published study in the Gate Lab focusing on microglia and Alzheimer's. I am now submitting my honors thesis at Northwestern which is an extension of the Gate Lab study, focusing on astrocytes. I’m fascinated by how much we can learn just by looking at the data our bodies already produce, and I’m passionate about using science to bring us closer to better, more targeted healthcare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"f41ec8b9-5509-4e50-aeff-091b22b4019a\"}":{"__typename":"School","uuid":"f41ec8b9-5509-4e50-aeff-091b22b4019a","name":"Shaker Heights High School","city":"Shaker Heights","type":"HIGH","state":"Ohio","country":"United States","zip":"44120"},"Education:{\"uuid\":\"fb157511-de45-44be-b6b4-4144657e24bc\"}":{"__typename":"Education","uuid":"fb157511-de45-44be-b6b4-4144657e24bc","school":{"__ref":"School:{\"uuid\":\"f41ec8b9-5509-4e50-aeff-091b22b4019a\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"2d95a5fd-0080-41b6-bbcd-a95286a42a5f\"}":{"__typename":"Education","uuid":"2d95a5fd-0080-41b6-bbcd-a95286a42a5f","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"388005e8-237c-4e23-b099-6684a809cf65\"}":{"__typename":"MentorPublicProfile","uuid":"388005e8-237c-4e23-b099-6684a809cf65","displayName":"Lily C.","slug":"lily-camp-1","biography":"\u003cp\u003eHi! I’m Lily Camp, a senior at Northwestern University majoring in Neuroscience with a minor in Business Institutions. I’ve always known I wanted to be in science—ever since third grade when I first became curious about how the brain works. Since then, I’ve built my college experience around combining that curiosity with a drive to make real-world impact. I love exploring the intersection of science and strategy—how we can take complex data and turn it into decisions that improve people’s lives. I plan to have a career working on the business side of biotech.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Northwestern, I am a computational research assistant in the Gate Lab, a member of NEURON, a pre PhD program for undergrads, a member of women in business, and I work at CorePower Yoga in my free time as a studio team member! I love to run, read memoirs, play tennis with friends, and watch reality tv!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have been tutoring for 6 years in a combination of zoom and in person and have found a love for helping younger students find their interests. I would love to mentor any students in math or science classes and help students with passion projects or career mentoring as well. I want to advise students who may want to pursue science but don't know all of the paths available to them. I’ve been lucky to learn from mentors who encouraged me to explore everything and I want to pay that forward.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to meet you and help set you up for success!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy recent co-authorship on a paper focusing on Alzheimer's Disease! \u003c/p\u003e\u003cbr\u003e\u003cp\u003ehttps://www.nature.com/articles/s41591-025-03574-1\u003c/p\u003e\u003cbr\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0594417a-b316-4290-9503-8fc2b370cd3a\"}"},{"__ref":"Favorites:{\"uuid\":\"ef3c25b7-1084-408
