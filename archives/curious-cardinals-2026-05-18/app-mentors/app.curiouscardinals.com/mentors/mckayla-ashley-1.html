xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1b503d38-5565-470a-91b6-edeb33ab0478\"}":{"__typename":"Favorites","uuid":"1b503d38-5565-470a-91b6-edeb33ab0478","photoUrl":"https://ucarecdn.com/a7d4050a-ee28-47f7-aac7-f9be6fd2eb52/","title":"Kaytranada","type":"ARTIST"},"Favorites:{\"uuid\":\"32bb6799-8594-4436-adeb-7519b762fc1b\"}":{"__typename":"Favorites","uuid":"32bb6799-8594-4436-adeb-7519b762fc1b","photoUrl":"https://ucarecdn.com/061d5031-6d9c-4848-a756-777dbf7a3414/","title":"Hockey","type":"SPORT"},"Favorites:{\"uuid\":\"425ce273-0aee-487b-9eb1-186185207335\"}":{"__typename":"Favorites","uuid":"425ce273-0aee-487b-9eb1-186185207335","photoUrl":"https://ucarecdn.com/31581ba8-5879-414c-b453-ff5011153b99/","title":"aupitape 1: hortensia","type":"ALBUM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a518603a-a72e-4761-a66b-ac5a8990b831\"}":{"__typename":"DeepDives","uuid":"a518603a-a72e-4761-a66b-ac5a8990b831","content":"\u003cp\u003eMentorship matters to me because I have been a direct beneficiary of it throughout my time on campus. As an underclassman, I relied on the guidance of upperclassmen for advice on everything from navigating career paths, to finding my place socially, to simply learning how to manage the transition into adulthood. Those conversations and relationships shaped my college experience in meaningful ways and gave me the confidence to take on new challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of that, I have always wanted to give back. I served as a mentorship chair for our Undergraduate Engineering Council, where I had the opportunity to support younger students the way I was supported. Whether it was sharing advice on classes, offering perspective on internships, or just listening, I tried to be the kind of mentor who could make the path feel a little less overwhelming. I know firsthand how much of a difference mentorship can make, and that is why it is something I continue to value and prioritize.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4216282a-7c88-4cb8-99f3-9c8ab5fb8835\"}":{"__typename":"DeepDives","uuid":"4216282a-7c88-4cb8-99f3-9c8ab5fb8835","content":"\u003cp\u003eIn high school, I spent my summers working as a barista and doing research at Stony Brook University in the geosciences department. Being a barista was a grounding experience that taught me the value of hard work and connecting with people, while my time at Stony Brook opened my eyes to the excitement of research.\u003c/p\u003e\u003cp\u003eThat was my very first research experience, and I had the chance to learn about crystal formation, uranium-thorium dating, 3D printing, and X-ray visualization. These were all areas I had never studied before, and diving into them was both challenging and completely fascinating. It had a huge impact on me because it showed me what it felt like to be intellectually stimulated every day. I realized then that I wanted a career where I could constantly be learning and asking new questions. To me, the ability to explore something unfamiliar and gain knowledge is such a privilege, and I want to carry that sense of curiosity with me wherever I go.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and work, I also made sure to spend time doing things I loved. Growing up in California, I spent a lot of time at the beach—swimming, hanging out with friends, or just enjoying the ocean. I also loved cafe hopping and finding new spots to relax or catch up with people. Those moments gave me balance and reminded me how important it is to make space for joy and connection alongside hard work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c356e901-f1c7-41b3-a572-85067c180bc9\"}":{"__typename":"DeepDives","uuid":"c356e901-f1c7-41b3-a572-85067c180bc9","content":"\u003cp\u003eIn my spare time, I love to read, especially books about psychology and how the mind works. My favorite author is Aldous Huxley, and I’ve been enjoying his dystopian novels lately. Reading is one of my favorite ways to relax while still learning something new.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also really into coffee and tea. I love matcha and espresso tonics, and since I’ve worked as a barista for a few years, I also enjoy coming up with new drink recipes and sharing them with friends.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing at Princeton means I’m only about an hour from New York City, so I often take trips into the city with friends to explore neighborhoods, try new cafes, or just enjoy the energy of being there. I also play soccer recreationally, which I’ve been doing since I was five years old. It’s always been a fun way to stay active and connect with people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2e558be0-4fe5-47e5-94cb-d88c3992ff75\"}":{"__typename":"DeepDives","uuid":"2e558be0-4fe5-47e5-94cb-d88c3992ff75","content":"\u003cp\u003eAs you can probably tell from my profile, I have a wide range of interests. Back in middle school my best subject was English, but in high school I discovered psychology, biology, and math, and I really enjoyed all of them. At first I wondered how I could ever find a career that would let me bring all of those interests together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat is what drew me to studying Operations Research and Financial Engineering. ORFE feels like a combination of so many things I love. You can apply computer science and computational models to almost anything, whether it is modeling evolutionary biology, analyzing reading trends across the country, or studying how investor decisions affect financial markets.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eRight now, my dream job is something fast-paced where I get to think across different areas and consider many sources of influence at once. I am currently pursuing quantitative trading, but I am also open to exploring new opportunities and experiences that build on my curiosity and passion for connecting different fields.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"6cf28c16-5e7e-4b7f-bf7a-6367b1a58c7a\"}":{"__typename":"School","uuid":"6cf28c16-5e7e-4b7f-bf7a-6367b1a58c7a","name":"Trabuco Hills High School","city":"Mission Viejo","type":"HIGH","state":"California","country":"United States","zip":"92691"},"Education:{\"uuid\":\"2868f6cf-b3ed-46cc-8e6c-1988e24e7b35\"}":{"__typename":"Education","uuid":"2868f6cf-b3ed-46cc-8e6c-1988e24e7b35","school":{"__ref":"School:{\"uuid\":\"6cf28c16-5e7e-4b7f-bf7a-6367b1a58c7a\"}"},"startYear":"2021","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"3a8ca1c7-f148-4140-845d-c805510ff184\"}":{"__typename":"Education","uuid":"3a8ca1c7-f148-4140-845d-c805510ff184","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Operations Research and Financial Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"9d51a458-9449-40c1-9c12-3e6e24b58261\"}":{"__typename":"MentorPublicProfile","uuid":"9d51a458-9449-40c1-9c12-3e6e24b58261","displayName":"Mckayla A.","slug":"mckayla-ashley-1","biography":"\u003cp\u003eI am a student at Princeton University studying Operations Research and Financial Engineering (ORFE), which combines computer science, mathematics, finance, and the study of how people make decisions. What excites me about this field is that it connects abstract ideas to the real world. You can see its influence everywhere, from how companies invest to how algorithms make predictions to how we make choices in our daily lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my classes I spend a lot of time exploring machine learning and building models that help make sense of data. I enjoy the challenge of taking something complex and breaking it down into clear steps, then testing how well it works in practice. For me, learning is not just about getting the right answer. It is about understanding why something works and what we can do with that knowledge once we understand it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom I have sought out opportunities to apply these skills in real-world settings. I recently interned at a private equity firm where I learned how to analyze businesses and think about the big-picture decisions that help them grow. Next summer I will be interning at a large investment bank where I will have the chance to see finance at a global scale. These experiences have been eye-opening because they have shown me how the theories I study in class connect directly to decisions being made in the world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnother important part of my life has been working as a barista at an independent coffee shop. I have been a barista for four years and it has been one of the most grounding experiences I have had. Making coffee might seem unrelated to math or finance, but it has taught me patience, attention to detail, and the importance of small acts of kindness. It has reminded me that learning and growth happen in many places and that building connections with people is at the heart of everything we do.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I think about working with students I want to bring all of these experiences together. I know what it feels like to struggle with a new concept and I also know the excitement of when something finally clicks. I believe that learning should feel meaningful and connected to the bigger picture, not just like memorizing steps or formulas. My goal is to help students build confidence, develop curiosity, and see the value in what they are learning both in school and in life.\u003c/p\u003e","teachingVideoPlaybackId":"Xm2bavn1JieUDM01gYnE2yRvB00dZlqIU5SBm3yHvc4y8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1b503d38-5565-470a-91b6-edeb33ab0478\"}"},{"__ref":"Favorites:{\"uuid\":\"32bb6799-8594-4436-adeb-7519b762fc1b\"}"},{"__ref":"Favorites:{\"uuid\":\"425ce273-0aee-487b-9eb1-186185207335\"}"}],"causesSupported":[],"major":"Operations Research and Financial Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a518603a-a72e-4761-a66b-ac5a8990b831\"}"},{"__ref":"DeepDives:{\"uuid\":\"4216282a-7c88-4cb8-99f3-9c8ab5fb8835\"}"},{"__ref":"DeepDives:{\"uuid\":\"c356e90
