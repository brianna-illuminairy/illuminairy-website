xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cff26e4d-414c-4b95-8cfb-50960f7f26f5\"}":{"__typename":"Favorites","uuid":"cff26e4d-414c-4b95-8cfb-50960f7f26f5","photoUrl":"https://ucarecdn.com/e3e8041a-714d-459d-9a3b-f30daf2e9908/","title":"Mamma Mia, Lala Land or the Marvel series","type":"MOVIE"},"Favorites:{\"uuid\":\"83a8beee-cbbe-480a-a46e-bcd98f5b025a\"}":{"__typename":"Favorites","uuid":"83a8beee-cbbe-480a-a46e-bcd98f5b025a","photoUrl":"https://ucarecdn.com/a6459748-d3fb-43e1-a1b8-00599f9a4579/","title":"Waterpolo (but I keep up on soccer and tennis :))","type":"SPORT"},"Favorites:{\"uuid\":\"a7fc1e23-9fe7-4dcd-971e-b8c5dc33fa57\"}":{"__typename":"Favorites","uuid":"a7fc1e23-9fe7-4dcd-971e-b8c5dc33fa57","photoUrl":"https://ucarecdn.com/7219d7b3-0917-42e3-b488-dcc08f4214a7/","title":"Americanah, Unbroken, Pride and Prejudice","type":"BOOK"},"CausesSupported:{\"uuid\":\"8954dd60-14f9-4358-8a3b-2682f35e16ac\"}":{"__typename":"CausesSupported","uuid":"8954dd60-14f9-4358-8a3b-2682f35e16ac","name":"CurvyGirls","description":"\u003cp\u003eI had scoliosis as a young girl and I love to support others who may feel alone\u003c/p\u003e","photoUrl":"https://ucarecdn.com/31b9c835-08d0-4786-8438-8e3ba048a712/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a4e17d23-cadb-46f0-b1b2-717aa1cfa2fd\"}":{"__typename":"DeepDives","uuid":"a4e17d23-cadb-46f0-b1b2-717aa1cfa2fd","content":"\u003cp\u003eI largely grew up on a ranch in California, so a love for animals and any aquatic activity was naturally cultivated. I often find refuge in riding horses and being outside, either with a book or with an animal to pet! Otherwise, I also love to go to the beach, especially with friends and family, because family has always been a key aspect of my life and I love to spend quality time with my loved ones.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"3799bd29-420c-4468-a4a5-f249e238a242\"}":{"__typename":"DeepDives","uuid":"3799bd29-420c-4468-a4a5-f249e238a242","content":"\u003cp\u003eI find it very difficult to choose a single thing I would like to accomplish because I am occasionally indecisive (especially when picking where to eat) and I am overwhelmed by how much life has to offer. So, to cheat the system, professionally, I would want to speak at a UN General Assembly meeting as a lawyer and perhaps publish a book. Personally, I hope that no matter where life takes me, I will be able to give back to my parents and give them comfort in any capacity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a065f813-5d99-49b0-a730-d002994d65d3\"}":{"__typename":"DeepDives","uuid":"a065f813-5d99-49b0-a730-d002994d65d3","content":"\u003cp\u003eMentorship matters to me because I didn’t particularly have it until I was much older. When my family immigrated to the U.S. my parents did not know English or have any experience with the U.S. education system or curriculums. Meaning, in middle school I had to become very self-sufficient and responsible because my parents (understandably) did not know the language or the way different topics were taught. I learn how to seek out help very early on. Although this learning curve did give me invaluable life skills, I often wished I had mentorship from people who understood the system and to who I could relate but were also slightly removed from my personal life, so I had the confidence to be honest. Therefore, it matters to me to be able to guide children and young adults. I am not all-knowing, but I have the experience and openness to help and listen.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"fac47e64-679f-4648-8f03-838dbd59b923\"}":{"__typename":"DeepDives","uuid":"fac47e64-679f-4648-8f03-838dbd59b923","content":"\u003cp\u003eI was a highly organized and motivated individual in high school (and middle school). Although I took whichever advanced/AP classes my high school offered, participated in water polo and swimming, and worked once I turned 16, I had a very healthy work-life balance because I was very organized. I truly listened to the teachers and mothers in my life when they said “Don’t procrastinate and do the work when you are given it” because I would always do my homework right after school and thus consistently got adequate sleep and time to be with friends/enjoy the high school experience (and join clubs, play sports, and volunteer).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"e74dcfb8-a86c-48b7-a0bc-b36e1e4f17dc\"}":{"__typename":"School","uuid":"e74dcfb8-a86c-48b7-a0bc-b36e1e4f17dc","name":"Santa Ynez High School","city":"Santa Ynez","type":"HIGH","state":"California","country":"United States","zip":"93460"},"Education:{\"uuid\":\"4af88b1e-349a-472f-8ecb-72d36562c0d4\"}":{"__typename":"Education","uuid":"4af88b1e-349a-472f-8ecb-72d36562c0d4","school":{"__ref":"School:{\"uuid\":\"e74dcfb8-a86c-48b7-a0bc-b36e1e4f17dc\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"3405c589-7217-4749-bd44-c2159fa2221e\"}":{"__typename":"Education","uuid":"3405c589-7217-4749-bd44-c2159fa2221e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"International Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"49b7e3b3-a236-4930-8e3d-7a1f0f046ed4\"}":{"__typename":"MentorPublicProfile","uuid":"49b7e3b3-a236-4930-8e3d-7a1f0f046ed4","displayName":"Valentina d.","slug":"valentina-del","biography":"\u003cp\u003eHello! My name is Valentina del Solar, and I am a senior at Stanford University, majoring in International Relations with a minor in Spanish. Originally from Lima, Peru, I grew up in California and am fluent in Spanish. My passion for politics and government was sparked during high school through my involvement in the California Youth and Government Club and public speaking competitions. This foundation, paired with a growing curiosity about Peru's political landscape, inspired me to pursue International Relations as my major.\u003c/p\u003e\u003cp\u003eI’m thrilled to join the Curious Cardinal team and look forward to forming meaningful connections with mentees while helping them achieve their goals! I bring expertise and enthusiasm for government, history, and language, having earned top scores in AP US History, AP Government, and AP Spanish. My success in college admissions, coupled with the many applications I’ve completed, has equipped me with a strong understanding of essay writing, revision, and the admissions process.\u003c/p\u003e\u003cp\u003eAcademically, I am driven by a desire to understand global dynamics and the institutions that promote democracy and international security. My coursework—spanning democracy, European Union politics, foreign policy, and U.S. government—has honed my skills in research, communication, and time management while deepening my commitment to critical issues like immigration and human rights.\u003c/p\u003e\u003cp\u003eProfessionally, I am dedicated to advocacy and justice. During my recent internship with The Advocates for Human Rights, I had the privilege of drafting and delivering oral statements to the United Nations Human Rights Council and translating advocacy documents into Spanish. It was rewarding to make critical information accessible to Spanish-speaking audiences and contribute to international human rights discussions. Earlier this year, I worked with Accountability Counsel, conducting research on complaints filed with Multilateral Development Banks, developing coding frameworks, and presenting recommendations to refine NGO databases.\u003c/p\u003e\u003cp\u003eBeyond academics, I’m deeply involved in Stanford’s community. I volunteer with The Advocates for Human Rights and am a proud member of the First-Generation Low-Income Students Association, Stanford Women in Politics, and Club Water Polo. My passion for international relations also fuels my engagement with the Society for International Affairs and Stanford Latinos, where I embrace diverse perspectives and connect with like-minded peers.\u003c/p\u003e\u003cp\u003eOutside of school, I remain connected to my childhood roots. Growing up, I raised goats and chickens through 4-H, which fostered my love for animals. Today, I continue riding horses when I return home from college, competing annually during the summer—a tradition that brings me immense joy and balance.\u003c/p\u003e","teachingVideoPlaybackId":"c30202oBxydpcxVqNQX8HKzAqwvD01902iCfECvXn2gpXvM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI got accepted into Stanford, and was a strong athlete in high school, as a first-generation student who went through 13 surgeries before she was 16— and was cracking jokes through it all!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy next achievement will be graduate school! I will be attending LSE to attain my MSc in International Relations.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"cff26e4d-414c-4b95-8cfb-50960f7f26f5\"}"},{"__ref":"Favorites:{\"uuid\":\"83a8beee-cbbe-480a-a46e-bcd98f5b025a\"}"},{"__ref":"Favorites:{\"uuid\":\"a7fc1e23-9fe7-4dcd-971e-b8c5dc33fa57\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8954dd60-14f9-4358-8a3b-2682f35e16ac\"}"}],"major":"International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a4e17d23-cadb-46f0-b1b2-717aa1cfa2fd\"}"},{"__ref":"DeepDives:{\"uuid\":\"3799bd29-420c-4468-a4a5-f249e238a242\"}"},{"__ref":"DeepDives:{\"uuid\":\"a065f813-5d99-49b0-a730-d002994d65d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"fac47e64-679f-4648-8f03-838dbd59b923\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/50eef104-5c2a-4d27-a214-e2b851175ec2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4af88b1e-349a-472f-8ecb-72d36562c0d4\"}"},{"__ref":"Education:{\"uuid\":\"3405c589-7217-4749-bd44-c2159fa2221e\"}"}],"hiredAt":"2024-10-26T05:42:16.382Z","topics":["Law / Government / Policy","Writing","Academic Coaching","College Essay Writing","Spanish"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"valentina-del\"}})":{
