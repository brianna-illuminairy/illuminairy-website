xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9e77a007-f46b-4f81-91c5-32245842139a\"}":{"__typename":"DeepDives","uuid":"9e77a007-f46b-4f81-91c5-32245842139a","content":"\u003cp\u003eI’d tell myself to work hard, set goals, and give my best effort– because the habits you build early make a big difference. At the same time, I’d remind myself to enjoy the journey! Life is about growing, building meaningful relationships, and having fun along the way.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’d also say to follow what makes you happy. It’s okay if your path looks different from others’. And most importantly: be yourself. When you stay true to who you are, the right people, opportunities, and direction will come to you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"39566d46-2d69-4f22-8a2a-17a3d31142cf\"}":{"__typename":"DeepDives","uuid":"39566d46-2d69-4f22-8a2a-17a3d31142cf","content":"\u003cp\u003eMentorship matters to me because meaningful relationships are very important to me. Whether it’s my friends, family, or other supporting figures in my life, I’ve been lucky enough to be surrounded by people who cared about me not just for what I could do, but for who I was. Their support helped shape my confidence and the kind of person I strive to be today.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship is one form of relationship that is important to me! I love building genuine relationships with mentees and creating a welcoming, enjoyable space where they feel safe to ask questions, explore their interests, and be themselves. I know how helpful it is to have someone who consistently shows up for you, and I hope to be that for others!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"11c15733-e7bd-4e68-86f6-21556fa9be26\"}":{"__typename":"DeepDives","uuid":"11c15733-e7bd-4e68-86f6-21556fa9be26","content":"\u003cp\u003eI actually came into college as a premed student because I’ve always cared deeply about people and wanted to make a meaningful impact. But once I started exploring computer science here, I ended up enjoying it a lot!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI chose computer science because it blends creativity, problem-solving, and real-world impact. I love that the skills I’m learning are so usable: right now, I’m building an app for fun with my friend, I've coded programs that make my own life easier, and I can bring design ideas to life in just a few days!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo bring in the human aspect I’ve always cared about, I added a focus in management and human-centered design. I’ve taken many classes that explore how technology can be used to help people– from thoughtful design to effective leadership. It’s been so fun to combine what I love outside the classroom with what I want to pursue professionally.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf there’s one lesson I’ve learned from this journey, it’s to stay open and curious. It’s okay to pivot and explore! Even though it was scary at first, following what brings me joy has been a fulfilling path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"63999902-3df4-4c8d-a061-58566ab5dbab\"}":{"__typename":"DeepDives","uuid":"63999902-3df4-4c8d-a061-58566ab5dbab","content":"\u003cp\u003eI’ve always been someone who is busy with a lot of hobbies! I'm on the Stanford Gymnastics team so a lot of my time is spent doing gymnastics :) I’ve done it my entire life and it’s taught me so much about hard work and teamwork. Outside of that, I love staying active, being creative, and spending quality time with others. Some of my favorite hobbies right now are:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e1. Spending time outdoors.\u003c/p\u003e\u003cp\u003eLiving near Stanford, I’m lucky to be surrounded by so many beautiful places to explore. I’ve created a bucket list of hikes, beaches, gardens, and parks to check off, and I love going on walks or mini adventures outside to slow down and reflect.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e2. Arts \u0026amp; crafts.\u003c/p\u003e\u003cp\u003eI’ve always loved making things– it’s a fun and relaxing outlet for me. Lately, I’ve been really into painting tote bags (they’re functional and cute!) and bedazzling my water bottles, shoes, and anything else I can decorate with gems. I also love other forms of art– like making Spotify playlists for every occasion, or appreciating a good book or movie.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e3. Spending time with friends.\u003c/p\u003e\u003cp\u003eI’m a people person, and some of my favorite memories come from spontaneous adventures or hangouts with friends. Whether we’re exploring new cafes, going thrifting, or just catching up, I value having fun and staying connected. I think fun and friendships are just as important as work– they help keep my life balanced and meaningful!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"42f7a024-321a-4569-afb2-529b16b3adb6\"}":{"__typename":"School","uuid":"42f7a024-321a-4569-afb2-529b16b3adb6","name":"Bella Vista High School","city":"Fair Oaks","type":"HIGH","state":"California","country":"United States","zip":"95628"},"Education:{\"uuid\":\"eb3a430e-50e9-4ab6-b2a0-cdb59e8123cd\"}":{"__typename":"Education","uuid":"eb3a430e-50e9-4ab6-b2a0-cdb59e8123cd","school":{"__ref":"School:{\"uuid\":\"42f7a024-321a-4569-afb2-529b16b3adb6\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e40a9b0a-e833-4197-a416-d5ebd25d9f7f\"}":{"__typename":"Education","uuid":"e40a9b0a-e833-4197-a416-d5ebd25d9f7f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"8a9f8cc6-821a-47a5-8a9d-2d0ef56efdd3\"}":{"__typename":"MentorPublicProfile","uuid":"8a9f8cc6-821a-47a5-8a9d-2d0ef56efdd3","displayName":"Taralyn N.","slug":"taralyn-rose","biography":"\u003cp\u003eHi! My name is Taralyn and I am a junior at Stanford studying computer science, with a focus on human-centered design. I’ve spent the last couple years weaving together interests across design, strategy, and technology. At the center of everything I do is a passion for understanding others and building things that make life better– whether that’s a product, a team culture, or wonderful relationships.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy friends describe me as fun-loving, organized, and friendly. I really value forming deep relationships, working collaboratively, and spending quality time with the people I care about. I love creating environments that feel grounded, energizing, and joyful. I’m also someone who is very values-driven– many of the biggest decisions I’ve made in life, from choosing a major to how I spend my time, have been guided by what matters most to me: impact, connection, and joy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen it comes to mentorship, I was lucky to have mentors growing up who cared about me not just as a student, but as a whole person. That made a huge difference in my life, and I hope to bring that same support and presence to the students I work with.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I’m on the Stanford Women’s Gymnastics team, which has been a major part of my college experience. It’s taught me discipline, communication, and how to lead and grow on a team. I’ve also mentored and coached younger gymnasts for many years and have tutored students across a wide range of ages and subjects, from reading and writing to math and programming.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics and athletics, I love coffee shops, arts \u0026amp; crafts, playing the piano, spending time outdoors, and exploring new cities with friends. I’m big on making Spotify playlists, planning travel itineraries, and finding joy in the little things.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m so excited to be a part of Curious Cardinals and to get to know my mentees and support them as whole people—academically, personally, and everything in between!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9e77a007-f46b-4f81-91c5-32245842139a\"}"},{"__ref":"DeepDives:{\"uuid\":\"39566d46-2d69-4f22-8a2a-17a3d31142cf\"}"},{"__ref":"DeepDives:{\"uuid\":\"11c15733-e7bd-4e68-86f6-21556fa9be26\"}"},{"__ref":"DeepDives:{\"uuid\":\"63999902-3df4-4c8d-a061-58566ab5dbab\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e70fa122-29a5-49d5-85c9-f02af1fab0d2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"eb3a430e-50e9-4ab6-b2a0-cdb59e8123cd\"}"},{"__ref":"Education:{\"uuid\":\"e40a9b0a-e833-4197-a416-d5ebd25d9f7f\"}"}],"hiredAt":"2025-04-12T06:37:25.189Z","topics":["Algebra I","Algebra II","Calculus","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Academic Coaching","Computer Science"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"taralyn-rose\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8a9f8cc6-821a-47a5-8a9d-2d0ef56efdd3\"}"}}},"_sentryTraceData":"4980cc314af240fe8a836a65fcace266-acbe22b01dd310f4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4980cc314af240fe8a836a65fcace266,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"taralyn-rose"},"buildId":"ZAcrs1hPe6xcPEuk-Y
