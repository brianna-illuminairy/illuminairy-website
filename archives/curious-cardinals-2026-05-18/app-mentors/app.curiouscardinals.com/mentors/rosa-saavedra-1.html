xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b13a8421-e685-4c7a-a302-25f957c688f6\"}":{"__typename":"Favorites","uuid":"b13a8421-e685-4c7a-a302-25f957c688f6","photoUrl":"https://ucarecdn.com/c289d585-697d-4790-947e-b351d8c0e9a9/","title":"FC Barcelona","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"58a464be-7457-4ae1-a696-e50cfe22a61a\"}":{"__typename":"Favorites","uuid":"58a464be-7457-4ae1-a696-e50cfe22a61a","photoUrl":"https://ucarecdn.com/57b0a468-878e-40f4-aac9-e251ab5d2539/","title":"Pachinko","type":"BOOK"},"Favorites:{\"uuid\":\"bc8db9d3-a3b3-445f-8ffe-4340fbd1c250\"}":{"__typename":"Favorites","uuid":"bc8db9d3-a3b3-445f-8ffe-4340fbd1c250","photoUrl":"https://ucarecdn.com/5b725ae7-7cf5-4325-9303-70712c907798/","title":"The Shawshank Redemption","type":"MOVIE"},"CausesSupported:{\"uuid\":\"231b984e-9e62-407c-a2d1-86b92e734a23\"}":{"__typename":"CausesSupported","uuid":"231b984e-9e62-407c-a2d1-86b92e734a23","name":"YoungLife","description":"\u003cp\u003eI serve as a YoungLife Wyldlife leader in the Northshore area of Chicago.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/1b4183b0-e01e-4400-a70b-65a3c12cfa59/"},"CausesSupported:{\"uuid\":\"ec53f399-93dc-4aaf-b408-ce291a89c37f\"}":{"__typename":"CausesSupported","uuid":"ec53f399-93dc-4aaf-b408-ce291a89c37f","name":"Puedo Leer","description":"\u003cp\u003eI fundraised to provide mobile libraries in Nicaragua with internet and books.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/8b2a0047-24f2-4876-ab87-01cc92294216/"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8e7b299e-eb3c-4d27-8ae6-b56608ccd506\"}":{"__typename":"DeepDives","uuid":"8e7b299e-eb3c-4d27-8ae6-b56608ccd506","content":"\u003cp\u003eI am currently working on my own Passion Project at Northwestern. This school year, I am creating a monthly health newspaper (The Toilet Tribune) that goes behind bathroom stall doors. Using cool informational infographics is a super fun way to reach many groups of students and faculty with practical information on how to improve their health and wellbeing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"59f31665-091f-4a46-9cc1-3486877419ee\"}":{"__typename":"DeepDives","uuid":"59f31665-091f-4a46-9cc1-3486877419ee","content":"\u003cp\u003eIn today’s world of Zoom and decorated resumes, I’ve noticed that technology and an overemphasis on achievement have caused the value of relationships to fall somewhat by the wayside. However, through my own recent experiences with mentorship, I have realized what an invaluable asset it is; whether directed at career improvement or networking, mentorship is built upon a relationship and understanding of people as a whole. I chose to be a part of Curious Cardinals to be the person that I wish I had growing up. There is so much change to navigate in the journey from childhood to adulthood, and if I, as a mentor, can help make that process even a little easier, then I feel I’ve made a meaningful difference\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"2ea7c7fe-ea43-4423-94ce-5445c7f12ea2\"}":{"__typename":"DeepDives","uuid":"2ea7c7fe-ea43-4423-94ce-5445c7f12ea2","content":"\u003cp\u003eI am a dog person who used to walk dogs growing up. Back then, I sympathized with my client's dogs, that they would never get to see or even know of other places outside of the neighborhood. I dreamed that one day I would own a dog resort where there would be different rooms based on actual human places. In my imagination, each room would be modeled after real-world place, complete with ecosystem-inspired settings or city-like backdrops. There would be dog-sized architecture modeled after the actual places with themed play areas and unique treats to match the location.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"85525901-6b28-4798-8f0a-0740d12e7683\"}":{"__typename":"DeepDives","uuid":"85525901-6b28-4798-8f0a-0740d12e7683","content":"\u003cp\u003eCrayfish catching in my neighborhood creek, researching stem cells to generate hair follicles at the Uniformed Services University- my summers were built around a desire to quench an insatiable curiosity. From farming alongside local natives in Cuenca, Ecuador to attending Hispanic Scholarship Fund Leadership conferences, I learned the importance of service rooted in humility. Throughout high school, I spent my summers exploring different career paths, traveling with my family and taking trips into DC, eager to learn more about the world outside my doorstep.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"9fe36390-ecf2-4193-b72f-dc707dc14323\"}":{"__typename":"School","uuid":"9fe36390-ecf2-4193-b72f-dc707dc14323","name":"Winston Churchill High School","city":"Potomac","type":"HIGH","state":"Maryland","country":"United States","zip":"20854"},"Education:{\"uuid\":\"5bb35adf-9f76-4af2-82e9-0eb5541d4ee9\"}":{"__typename":"Education","uuid":"5bb35adf-9f76-4af2-82e9-0eb5541d4ee9","school":{"__ref":"School:{\"uuid\":\"9fe36390-ecf2-4193-b72f-dc707dc14323\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"8f497599-3db3-42f4-b59d-e41954b0a815\"}":{"__typename":"Education","uuid":"8f497599-3db3-42f4-b59d-e41954b0a815","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"570af59a-861f-47f0-9c48-624f30ecfe16\"}":{"__typename":"MentorPublicProfile","uuid":"570af59a-861f-47f0-9c48-624f30ecfe16","displayName":"Rosa S.","slug":"rosa-saavedra-1","biography":"\u003cp\u003e     Hi, I’m Rosa, and I am a pre-medical sophomore at Northwestern University, majoring in Neuroscience with minors in Psychology and Business Institutions. Aside from who I am on paper, I am also a self-proclaimed sushi connoisseur, a classic oldest daughter, and an explorer who loves (almost) everything outdoors. At Northwestern, outside of class, you can find me conducting research in the Graham lab downtown, studying with friends on the rooftop of Kellogg, or jogging along the lakeside (when the wind cooperates).\u003c/p\u003e\u003cbr\u003e\u003cp\u003e     When it came to my passion for medicine, it was not something that was pre-ordained, like I find so many people claim it was for them. I had always known I wanted to help others in some capacity, but I “discovered” medicine after many trial-and-error experiences within other fields. After working as a bookkeeper for a small business, shadowing an education administrator, and participating in a coding camp, I soon felt discouraged because I hadn’t experienced a cinematic ‘click’ moment. I had, of course, heard about a career in medicine, but hadn’t seriously considered it because the years of commitment felt daunting. It was not until I worked in a research position under an MD PhD that a passion for medicine became real.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e     To this day, I still consider interning at the Darling dermatology lab as a rising high-school junior to be one of my most pivotal career experiences. Ironically, I had joined the lab- not because I was considering a career in medicine at the time, but because I was intrigued by the research. Dr. Thomas Darling was conducting research to generate artificial skin with hair follicles using stem cells from tumors. At the time, I had minimal scientific knowledge beyond high school introductory STEM classes, but what I lacked in expertise I compensated in curiosity. I was utterly intrigued by the potential these specialized hair-follicle stem cells held for people suffering from severe burns to hair loss, and everything in between. \u003c/p\u003e\u003cbr\u003e\u003cp\u003e     While the time in the lab was fascinating (to say the least), what soon emerged as more exciting was the three-hour block on Mondays where I shadowed him in the dermatology clinic. It was in the clinic, watching Dr. Darling’s interactions with patients (easing their anxieties, congratulating them, or just laughing with them), where I fell in love with medicine. Correction…I don’t think I fell in love with medicine itself per se, as much as I fell (and continue to fall) in love with the people, the patients.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e     As your mentor, I want to get to know your ever-evolving story.\u0026nbsp; What were your passions yesterday? What are they now as you read this sentence? Instead of what, \u003cu\u003ewho\u003c/u\u003e do you see yourself becoming? It took me a while to discover my passion (hint: I still don’t know all the answers!), yet along the way I’ve realized that, like cells in a body, growth happens in communities. As your mentor, I want to help you navigate the inevitable uncertainty and questions that will arise, and celebrate the process alongside you.\u003c/p\u003e","teachingVideoPlaybackId":"velDJc01FLQghcOLxkpqzCZZU6wfXqJgSZxANzqEGf5M","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m proud that from a young age I’ve always felt the drive to help others and I’ve acted on it. Specifically, in high school, that meant helping those in need, especially through my ‘Spread the Word’ project. What I’m most proud of are the real differences I was able to make in children’s lives by showing up, caring, and creating change. In high school, after a cross-cultural exchange, I decided to start an initiative in my community by collecting used books and redistributing them to underserved elementary around Washington DC. I remember the awe of the children when they were able to choose a book to keep; that moment makes me very proud to this day!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b13a8421-e685-4c7a-a302-25f957c688f6\"}"},{"__ref":"Favorites:{\"uuid\":\"58a464be-7457-4ae1-a696-e50cfe22a61a\"}"},{"__ref":"Favorites:{\"uuid\":\"bc8db9d3-a3b3-445f-8ffe-4340fbd1c250\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"231b984e-9e62-407c-a2d1-86b92e734a23\"}"},{"__ref":"CausesSupported:{\"uuid\":\"ec53f399-93dc-4aaf-b408-ce291a89c37f\"}"}],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8e7b299e-eb3c-4d27-8ae6-b56608ccd506\"}"},{"__ref":"DeepDives:{\"uuid\":\"59f31665-091f-4a46-9cc1-3486877419ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"2ea7c7fe-ea43-4423-94ce-5445c7f12ea2\"}"},{"__ref":"DeepDives:{\"uuid\":\"85525901-6b28-4798-8f0a-0740d12e7683\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1bf29819-8300-4f7e-a686-c30e327447e8/-/preview/-/format/jpg/","https://ucarecdn.com/0c73881f-1244-4698-8f17-b591cde6e5c3/-/preview/-/format/jpg/","https://ucarecdn.com/c6ababf9-567e-457f-93a3-6b50d115e6b1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5bb35adf-9f76-4af2-82e9-0eb5541d4ee9\"}"},{"__ref":"Education:{\"uuid\":\"8f497599-3db3-42f4-b59d-e41954b0a815\"}"}],"hiredAt":"2025-09-02T01:36:51.852Z","topics":[],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rosa-saavedra-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"570af59a-861f-47f0-9c48-624f30ecfe16\"}"}}},"_sentryTraceData":"aaa7e4f9c42c432f8126a10c1beb4716-89532686e37f835f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=aaa7e4f9c42c432f8126a10c1beb4716,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"rosa-saavedra-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><no
