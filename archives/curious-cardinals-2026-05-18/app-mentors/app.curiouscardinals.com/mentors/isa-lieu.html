xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"e6d7a30f-eca4-475d-a31a-0efe9840bc88\"}":{"__typename":"DeepDives","uuid":"e6d7a30f-eca4-475d-a31a-0efe9840bc88","content":"\u003cp\u003eMy commitment to mentorship is rooted in my work with ACHIEVEability, a Philadelphia-based organization where I pioneered educational programs for children working to overcome generational poverty. Seeing those students realize their own potential taught me that success isn't a mysterious gift; it’s a buildable habit formed by breaking down massive \"mountains\" into strategic, winning moves. This perspective is deeply personal because of my younger brother. Watching him navigate the same high-pressure environments I’ve faced, from competitive athletics to rigorous academics, reinforced my belief that the right guide can turn a years-long struggle into a weeks-long mastery. Whether I’m helping a student master a complex data regression or helping my brother work through geometry, I want to provide the strategic methods and confidence that come from knowing not just the answer, but how it was found. For me, mentorship is the ultimate high-energy environment where I can help a student realize that their most ambitious goals are not just possible, but entirely within their reach.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"168630fe-cd84-4506-adcb-7255ae06dc02\"}":{"__typename":"DeepDives","uuid":"168630fe-cd84-4506-adcb-7255ae06dc02","content":"\u003cp\u003eAs a high school student, I was definitely someone who thrived on being busy, though I was still very much figuring out how to balance everything. A huge part of my life was spent at the pool as a competitive swimmer; that experience really shaped my discipline and taught me how to handle high-pressure situations, even if it meant many early mornings and long practices. I wasn't just focused on sports, though. I’ve always had a creative side, whether I was playing keyboard in a band or exploring my interests in photography and film. I spent my summers working as a lifeguard and swim instructor, which was my first real taste of responsibility and leadership. It taught me how to be patient and how to communicate clearly, especially when trying to help younger kids build their confidence in the water. While I took my academics seriously, I also made sure to keep things fun; I was always hanging out with my friends, whether it was playing video games or doing an escape room together.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"3775630f-e234-46dd-81a2-9f953422042f\"}":{"__typename":"DeepDives","uuid":"3775630f-e234-46dd-81a2-9f953422042f","content":"\u003cp\u003eMy greatest source of motivation is the concept of continuous improvement, the idea that any complex challenge can be mastered through discipline and a clear, strategic game plan. This mindset was forged during my years as a competitive swimmer, where I learned that reaching peak performance requires a high-energy approach and a commitment to daily growth. I thrive on the fast-paced feedback loops found in environments like a trading floor or a competitive chess match, where strategic thinking directly translates into results. Beyond my own academic and professional goals at Cornell, I am deeply motivated by the impact of mentorship; specifically, seeing my younger brother navigate the same pressures I once faced has reinforced my desire to help others turn intimidating goals into achievable wins. Whether I’m breaking down a data science regression or helping a student find their footing, I’m driven by the energy of that moment when a difficult task finally becomes manageable.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"fcc238dd-54b7-4ef1-996d-5af18e47446c\"}":{"__typename":"DeepDives","uuid":"fcc238dd-54b7-4ef1-996d-5af18e47446c","content":"\u003cp\u003eOne of the most impactful passion projects I’ve created was a teaching program I pioneered as a Volunteer Counselor and Community Service Liaison for ACHIEVEability. Working with an organization dedicated to breaking the cycle of generational poverty in Philadelphia, I noticed a need for more diverse educational engagement for the children in our summer program. I took the initiative to solicit local teachers, developing a pitch that successfully convinced over 60% of the educators I approached to donate their time and lead specialized lessons for over 50 students. This project wasn’t just about coordinating schedules; it was about creating a sustainable model where underprivileged children could gain exposure to new subjects and role models. Seeing the tangible impact of those ten different teaching sessions reinforced my belief that with the right strategic outreach and persistence, you can create meaningful educational opportunities that genuinely change a student's trajectory.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"cfdadc05-0298-43a9-bfdb-352aa7ef1d7f\"}":{"__typename":"School","uuid":"cfdadc05-0298-43a9-bfdb-352aa7ef1d7f","name":"Germantown Academy","city":"Fort Washington","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19034"},"Education:{\"uuid\":\"3b3820e3-bfd9-4fdd-92a7-b7f87722c17c\"}":{"__typename":"Education","uuid":"3b3820e3-bfd9-4fdd-92a7-b7f87722c17c","school":{"__ref":"School:{\"uuid\":\"cfdadc05-0298-43a9-bfdb-352aa7ef1d7f\"}"},"startYear":"2012","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"c95fd710-6027-4e3a-85a8-b7b06b3a7ddc\"}":{"__typename":"Education","uuid":"c95fd710-6027-4e3a-85a8-b7b06b3a7ddc","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"1d1274a9-884b-4f35-9201-8ace88f317d5\"}":{"__typename":"MentorPublicProfile","uuid":"1d1274a9-884b-4f35-9201-8ace88f317d5","displayName":"Isa L.","slug":"isa-lieu","biography":"\u003ch2\u003eHi! I’m Isa, a Sophomore at Cornell University, and I help students bridge the gap between creative thinking and data-driven strategy.\u003c/h2\u003e\u003cbr\u003e\u003cp\u003eI’m currently majoring in Economics with minors in Data Science and Art History. I know that might sound like an unusual mix, but I love showing students how the analytical world of numbers and the visual world of art actually speak the same language!\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI’ve always been driven by the idea of \"continuous improvement,\" a mindset I developed as a former All-American swimmer. I’m all about setting a goal and finding the most efficient way to crush it. Recently, I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAnalyzed the NBA through Data: I conducted an econometrics project using regression analysis to see if referee characteristics actually influence game outcomes (ask me about the results—they might surprise you!).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDeciphered 17th-Century Art: I developed a research project on how smell was depicted in Early Modern Europe, diving deep into medical illustrations to understand how people viewed the human body centuries ago.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNavigated High-Stakes Finance: I’ve successfully gone through the \"Superday\" interview gauntlet at Deutsche Bank, specializing in Fixed Income and Currencies.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI mentor students who want to build \"Passion Projects\" that stand out, specifically in:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eQuantitative Research: If you love sports, gaming, or social media, we can use Data Science to find hidden patterns and turn them into a professional research paper or presentation.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBusiness \u0026amp; Entrepreneurship: I’m a member of Pi Sigma Epsilon (a professional business frat), where I work on real-world case studies. I can help you build a business plan, understand \"Opportunity Cost,\" or prep for business competitions.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eArt History \u0026amp; Visual Analysis: I can help you curate a digital gallery, write compelling art criticism, or research the intersection of history and visual culture.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might involve:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eStrategic Game-Planning: I’m an avid chess player, and I bring that \"five moves ahead\" energy to our sessions. We won’t just do the work; we’ll strategize how to make it impressive.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInteractive Data Diving: We’ll look at real datasets—whether it's retail revenue or sports stats—and I’ll show you how to make the numbers tell a story.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHigh-Energy Pitching: I’ll help you practice presenting your ideas with the confidence of someone standing on a trading floor!\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eSome of my hobbies include\u003c/strong\u003e\u003c/h3\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePlaying Guitar: I used to be in a band, so I’m always down to talk music.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTraveling: I love hiking and staying active; I also love immersing myself in other cultures - I visited 8 different countries last summer.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eChess: I am very competitive and often spend hours playing against my brother.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"GGpp84afLZ1ZoRN4HBItk4rZj6v2pG7v4xNEz9GBAJw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e6d7a30f-eca4-475d-a31a-0efe9840bc88\"}"},{"__ref":"DeepDives:{\"uuid\":\"168630fe-cd84-4506-adcb-7255ae06dc02\"}"},{"__ref":"DeepDives:{\"uuid\":\"3775630f-e234-46dd-81a2-9f953422042f\"}"},{"__ref":"DeepDives:{\"uuid\":\"fcc238dd-54b7-4ef1-996d-5af18e47446c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/13944969-8a04-4a95-9e16-3445f3560206/-/preview/-/format/jpg/","https://ucarecdn.com/c09b17b7-a6cd-4b0b-b2c3-ef1cc395440c/-/preview/-/format/jpg/","https://ucarecdn.com/639424d5-96c4-4f4d-a948-9321f043a752/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3b3820e3-bfd9-4fdd-92a7-b7f87722c17c\"}"},{"__ref":"Education:{\"uuid\":\"c95fd710-6027-4e3a-85a8-b7b06b3a7ddc\"}"}],"hiredAt":"2026-04-16T21:41:34.786Z","topics":[],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isa-lieu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1d1274a9-884b-4f35-9201-8ace88f317d5\"}"}}},"_sentryTraceData":"381bc88a99164471943fde4c1ef3ec2b-8da765f1c9365d4e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=381bc88a99164471943fde4c1ef3ec2b,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"isa-lieu"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmana
