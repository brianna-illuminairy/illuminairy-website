xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f3e13917-764d-4c3a-852d-6061edf231f9\"}":{"__typename":"Favorites","uuid":"f3e13917-764d-4c3a-852d-6061edf231f9","photoUrl":"https://ucarecdn.com/c266752f-5fde-4e18-a140-b609aa045cd5/","title":"Curarrehue, Chile","type":"CITY"},"Favorites:{\"uuid\":\"a4900cea-b9c5-4f67-958f-fe6c154e3695\"}":{"__typename":"Favorites","uuid":"a4900cea-b9c5-4f67-958f-fe6c154e3695","photoUrl":"https://ucarecdn.com/94b33419-c790-49a1-b990-7676d910ae13/","title":"Portrait of a Lady on Fire","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0acf51b1-ee29-4c22-834d-a198045e00f0\"}":{"__typename":"DeepDives","uuid":"0acf51b1-ee29-4c22-834d-a198045e00f0","content":"\u003cp\u003eIt's okay if other people don't get it, it's your vision!! Do try to surround yourself with people who pour into you and are both brave enough and creative enough to dream.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1a15a8ac-9794-4a70-9518-098beaa8575d\"}":{"__typename":"DeepDives","uuid":"1a15a8ac-9794-4a70-9518-098beaa8575d","content":"\u003cp\u003eI'm interested in critiques of political violence as well as political philosophy! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c83debd3-38f1-4dc4-887a-a27224e2fab3\"}":{"__typename":"DeepDives","uuid":"c83debd3-38f1-4dc4-887a-a27224e2fab3","content":"\u003cp\u003eIt doesn't exist yet :) But until I create it, probably International President of Médecins Sans Frontières (MSF)!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"eb42a6f6-92c0-4d7a-be0d-6885679bd9ee\"}":{"__typename":"DeepDives","uuid":"eb42a6f6-92c0-4d7a-be0d-6885679bd9ee","content":"\u003cp\u003eI think because of my Kenyan heritage, global citizenship is at the heart of my teaching style.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"b6948901-1778-4a4d-a8db-9eff983c03a3\"}":{"__typename":"School","uuid":"b6948901-1778-4a4d-a8db-9eff983c03a3","name":"Byron Nelson High School","city":"Trophy Club","type":"HIGH","state":"Texas","country":"United States","zip":"76262"},"Education:{\"uuid\":\"af7c2762-4c5b-492b-bdfa-5223d08c4773\"}":{"__typename":"Education","uuid":"af7c2762-4c5b-492b-bdfa-5223d08c4773","school":{"__ref":"School:{\"uuid\":\"b6948901-1778-4a4d-a8db-9eff983c03a3\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"8d36799d-e10a-49c3-ac92-97fdfc4607ec\"}":{"__typename":"Education","uuid":"8d36799d-e10a-49c3-ac92-97fdfc4607ec","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Political Science; Pre-med","degree":null},"MentorPublicProfile:{\"uuid\":\"2fab61ad-3d59-41c8-9b37-aa0699efb45a\"}":{"__typename":"MentorPublicProfile","uuid":"2fab61ad-3d59-41c8-9b37-aa0699efb45a","displayName":"Amaya N.","slug":"amaya-nyamweru","biography":"\u003cp\u003eI’m a Kenyan-American, eldest daughter, and a firm believer that life is fleeting—so I try to live it fully, adventurously, and in service of others. I’m passionate about health and human rights, and I see medicine not just as a career but as a pathway to peace, particularly in conflict settings. I’m drawn to spaces where health, justice, and diplomacy intersect, and I want to dedicate my work to supporting the most vulnerable communities around the world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I concentrate in Global Conflict Studies within Political Science and am a Global Health Scholar at the Yale Jackson School for Global Affairs. I plan on taking two gap years, pursuing international fellowships before attending medical school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy studies have taken me far beyond the classroom: I’ve spent a year abroad exploring the intricate connections between community health, globalization, and human rights in places as diverse as Nepal, Jordan, Chile, India, South Africa, and Argentina. That year was deeply experiential—I conducted research alongside local communities, met with human rights commissions, engaged with civil society organizations, and even spent time with traditional healers. One unforgettable encounter was meeting one of the key brokers of the original Palestine-Israel peace agreement—a moment that reminded me how delicate and powerful the pursuit of peace can be. I’ve also had the privilege of learning from the Mapuche people in Chile, among many other communities whose resilience and wisdom reshaped how I see the world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore this, Yale awarded me the Berlin Fellowship and Richter Scholarship to complete traditional health research in Kenya, which grounded me in the realities of public health from the local level to global frameworks. Across all these experiences, I’ve sought to understand not only the systems that shape health and rights but also the human stories that animate them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics, I have a love for storytelling in all forms—through film, music, and the spontaneity of daily life. I’ve pursued music semi-professionally and embrace any opportunity for creative exploration. I believe that adventure, curiosity, and empathy are not just personal values—they’re essential tools for learning, mentoring, and understanding others.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I hope to share this perspective with students: that learning is not only about acquiring knowledge but about engaging deeply with the world, taking risks, asking bold questions, and finding joy and meaning along the way. I want students to know that it’s possible to chase big ideas, to explore cultures, and to serve humanity while still embracing the beauty and unpredictability of life.\u003c/p\u003e","teachingVideoPlaybackId":"3mnJDZaz1StGhvGoxFRjSseaXLPpXB4uE8h9D7X1yVc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f3e13917-764d-4c3a-852d-6061edf231f9\"}"},{"__ref":"Favorites:{\"uuid\":\"a4900cea-b9c5-4f67-958f-fe6c154e3695\"}"}],"causesSupported":[],"major":"Political Science; Pre-med","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0acf51b1-ee29-4c22-834d-a198045e00f0\"}"},{"__ref":"DeepDives:
