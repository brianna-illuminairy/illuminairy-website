xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e0a9cbf3-3de0-4036-a3a5-cbb4cf2b3d77\"}":{"__typename":"DeepDives","uuid":"e0a9cbf3-3de0-4036-a3a5-cbb4cf2b3d77","content":"\u003cp\u003eMy dream job is to be an English teacher -- whether at the university or high school level. I love sharing my passion for reading and writing with students of all ages.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7c21dcf7-4d36-4842-b675-eab3021f4006\"}":{"__typename":"DeepDives","uuid":"7c21dcf7-4d36-4842-b675-eab3021f4006","content":"\u003cp\u003eI chose to major in English because I have always loved reading old books and discussing why certain texts -- especially those published hundreds of years ago -- still matter to us today. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f5a0981a-70f3-4f3d-941c-4a0de02d8ceb\"}":{"__typename":"DeepDives","uuid":"f5a0981a-70f3-4f3d-941c-4a0de02d8ceb","content":"\u003cp\u003eIn high school I spent my summers volunteering as an improv instructor at local underserved elementary schools, competing at horse shows, and creating an Amazon business for outdoor hiking gear! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"382c1910-6dbd-42b0-b48c-9f8c8ed2f64d\"}":{"__typename":"DeepDives","uuid":"382c1910-6dbd-42b0-b48c-9f8c8ed2f64d","content":"\u003cp\u003eMy greatest role model is my grandfather, who is a professor of hydrology at Vanderbilt and one of my inspirations for pursuing a career in academia.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"0e451af9-629c-4ea2-82bf-a5c46f1c1b3c\"}":{"__typename":"Education","uuid":"0e451af9-629c-4ea2-82bf-a5c46f1c1b3c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"English","degree":null},"School:{\"uuid\":\"6ec7981d-733f-4e7f-9171-b8dff7b3cdea\"}":{"__typename":"School","uuid":"6ec7981d-733f-4e7f-9171-b8dff7b3cdea","name":"The Branson School","city":"Ross","type":"HIGH","state":"California","country":"United States","zip":"94957"},"Education:{\"uuid\":\"6c70087a-170d-407d-82ae-38b3a88c8874\"}":{"__typename":"Education","uuid":"6c70087a-170d-407d-82ae-38b3a88c8874","school":{"__ref":"School:{\"uuid\":\"6ec7981d-733f-4e7f-9171-b8dff7b3cdea\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"Testimonial:dc9e5cd2-75b3-458a-b25d-44e6dfa9784
