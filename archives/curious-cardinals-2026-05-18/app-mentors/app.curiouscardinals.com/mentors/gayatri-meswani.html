interact with brands from all over the world. Having grown up in India, she is a board member of the Harvard US-India Initiative and active within the international student community as a FIP leader.  Gaya aspires to work in the hospitality industry and has spent some time as a chef in Michelin-starred kitchens at two restaurants: Blue Hill at Stone Barns and Dirt Candy.\n\nGaya speaks 5 languages and is passionate about learning even more about different cultures through their languages. She also loves learning about new cultures through their cuisines; she ran the cooking club in high school and can often be found experimenting with culinary techniques, setting off fire alarms one kitchen at a time but eventually learning something valuable. \n\nShe spearheaded the leadership series, which connected Indian pioneers ranging from business tycoons to Bollywood personalities with students at her high school. She also served as editor-in-chief for the press coverage body of Asia’s largest THIMUN conference. She got the opportunity to go to The Hague to provide press coverage at THIMUN. Gaya served two terms on student government and played for her high school's soccer team for all four years. She is also an avid skier who has been certified by École du Ski Français. \n\nBefore starting at Curious Cardinals, Gaya spent 6 years as a teaching aid at a school for students with different learning needs, working on everything from helping high school students with art projects to helping lower school students articulate and regulate their emotions. Because of her special education background, she believes that inclusion and diversity must be present in every classroom and that it is important that education equips learners with emotion management skills and critical thinking.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[],"active":true,"profilePhotos":["https:/
