 very motivated to be successful, defining success by getting perfect grades and doing all the \"right\" activities to get into the best college I could. It has been a life-long learning process for me to realize that success for me comes from pursuing things I love doing and putting my all into them, not following the pre-set  \"right path\" to be successful.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e305456c-5eab-4550-8437-5bf5ffa41022\"}":{"__typename":"DeepDives","uuid":"e305456c-5eab-4550-8437-5bf5ffa41022","content":"\u003cp\u003eAt Northwestern I founded an organization focused on mobilizing a creative community to up-cycle and sell used and thrifted clothing to and from Evanston locals and Northwestern students, with profits being partially donated to a local mutual aid fund for Northwestern service workers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"62c1e9c8-64e4-415a-8cf9-1ad4e450afee\"}":{"__typename":"DeepDives","uuid":"62c1e9c8-64e4-415a-8cf9-1ad4e450afee","content":"\u003cp\u003eA watermelon with arms and legs chasing me\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"66730aa8-703c-4112-ade3-a66ff04c3ed5\"}":{"__typename":"School","uuid":"66730aa8-703c-4112-ade3-a66ff04c3ed5","name":"M479 Beacon High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10036"},"Education:{\"uuid\":\"6af70272-0253-445e-87c8-e6212129d0e2\"}":{"__typename":"Education","uuid":"6af70272-0253-445e-87c8-e6212129d0e2","school":{"__ref":"School:{\"uuid\":\"66730aa8-703c-4112-ade3-a66ff04c3ed5\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"79abee6e-38b2-4c45-912b-806357166ffb\"}":{"__typename":"Education","uuid":"79abee6e-38b2-4c45-912b-806357166ffb","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Learning \u0026 Organizational Change, Creative Writing, Business ","degree":null},"MentorPublicProfile:{\"uuid\":\"c7c0ffce-4644-466d-bc85-7b4735b3184a\"}":{"__typename":"MentorPublicProfile","uuid":"c7c0ffce-4644-466d-bc85-7b4735b3184a","displayName":"Lucia S.","slug":"lucia-shorr","biography":"\u003cp\u003eHey all! Welcome to my profile, excited to see if we're a match! (Hint - If you're entreprenuerial, creative, and passionate about storytelling or making social change, we certainly will be)\u003cbr\u003e\u003cbr\u003eI'm Lucia, I recently graduated from Northwestern University with degrees in Learning and Organizational Change and Creative Writing with minors in Integrated Marketing Communications and Business. Through my LOC classes I made an focused on understanding social inequalities and relationship dynamics and their influences in business and educational settings. Whereas in my Creative Writing major I practice not only my written craft, but my ability to express complex thoughts, tell stories, and overall learn more about myself. I have since been able to apply my diverse educational background in numerous settings - from strategy consulting, business and brand building, to non-profit management. \u003cbr\u003e\u003cbr\u003eWhile at Northwestern, I was a writer and photographer for STITCH, Northwestern's premier fashion magazine. I wrote short stories, trend reports, and analysis of campus culture! I also recruited speakers for Northwestern's Contemporary Speaker Series, to bring diverse and interesting conversations to campus. I have also always been passionate about mentoring and tutoring children/young adults and during my time at Northwestern I privately tutored Creative Writing, College Essay Writing.\u003cbr\u003e\u003cbr\u003eOff-campus I created a non-profit organization focused on up-cycling clothing to raise money for mutual aid. (If you wanna build a business or organization, I am your GIRL!) From creating a platform for clothing exchanges during the COVID-19 pandemic, Sustainable Evansotn expanded to a 12 person team, hosting full-scale pop-up events complete with live entertainment, student-designed clothing, and fundraisers for mutaul aid! It was awesome. \u003cbr\u003e\u003cbr\u003eOver the years I have also been fortunate enough to have numerous internships. I interned for PLASTARC, a sociospacial design consulting firm in NYC, where I applied my analytical skills to projects preparing office spaces for hybrid work. I interned and continued on as a part-time employee for Loughran \u0026amp; Co, a brand marketing firm in Chicago where I focused on creative strategy and growth marketing - which was geniunely so fun and exposed me to an entire new field of potential interest. And lastly, I recieved a summer consulting internship from EY last summer, and was later offered a full-time job as a Consultant where I will be focusing on projects related to Enviornment, Sustainability, and Governance (ESG). \u003cbr\u003e\u003cbr\u003eI am also a member of the Sunflower Network fundraising for a hospital in Ukraine through art and clothing sales from Ukrainian artists. I plan to continue this to whatever extent possible during my full-time job as I am passionate about utilizing creative platforms to fund lasting change in areas of need. \u003cbr\u003e\u003cbr\u003eHaving grown up in NYC, I am excited to be back. On the weekends I love to read on stoops, in parks, and at coffee shops (where I also write short pieces for my blog), go thrifting in Williamsburg, and playing Tennis or surfing with my friends! \u003cbr\u003e\u003cbr\u003eIf you think we may be a match, please reach out and I am happy to discuss what our path together could look like!\u003c/p\u003e","teachingVideoPlaybackId":"aKbIitsAn6r3dAxqEC01Wejuws01a6hPBVVO3tD9OhMMs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eFounding my non-profit at Northwestern, Sustainable Evanston, a mini-circular economy and localized model of sustainability providing the platform for accessible and sustainable clothing exchange in the Evanston Community through pop-up events and shops. A portion of the proceeds being donated from every sale to Students Organizing for Labor Rights, a mutual aid fund for campus workers. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"3407f50d-c2dd-4d59-8804-7a4e0b109860\"}"},{"__ref":"Favorites:{\"uuid\":\"c3980863-f5db-45e3-ae39-1eec5aaafd85\"}"},{"__ref":"Favorites:{\"uuid\":\"f6c9b749-33ff-4829-ba28-6d6f902a72d8\"}"}],"causesSupported":[],"major":"Learning \u0026 Organizational Change, Creative Writing, Business ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cd19f023-644a-4ba4-8226-12896d01b4af\"}"},{"__ref":"DeepDives:{\"uuid\":\"d63a79c3-41a2-4387-baa3-d62eea39194e\"}"},{"__ref":"DeepDives:{\"uuid\":\"e305456c-5eab-4550-8437-5bf5ffa41022\"}"},{"__ref":"DeepDives:{\"uuid\":\"62c1e9c8-64e4-415a-8cf9-1ad4e450afee\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c6f67320-9a98-4273-8549-fb02c4723039/-/preview/-/format/jpg/","https://ucarecdn.com/67ac668a-9757-463b-a139-0f6
