xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0e09c474-13d2-4f40-a4ed-3179757d382d\"}":{"__typename":"Favorites","uuid":"0e09c474-13d2-4f40-a4ed-3179757d382d","photoUrl":"https://ucarecdn.com/9533eaf7-bbf1-4ae2-a733-af06e79a1ee7/","title":"Everything Everywhere All at Once","type":"MOVIE"},"Favorites:{\"uuid\":\"2ab933a2-0b22-4382-b423-4855519eae9b\"}":{"__typename":"Favorites","uuid":"2ab933a2-0b22-4382-b423-4855519eae9b","photoUrl":"https://ucarecdn.com/2f678cc4-b66f-452d-98f8-b1ee258fea3b/","title":"NFR","type":"ALBUM"},"Favorites:{\"uuid\":\"9de7531f-f2d6-4fcb-9188-82b61efa6a8e\"}":{"__typename":"Favorites","uuid":"9de7531f-f2d6-4fcb-9188-82b61efa6a8e","photoUrl":"https://ucarecdn.com/7ed7d189-755b-49d3-ad5b-38e17b8209aa/","title":"The Catcher in the Rye","type":"BOOK"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"c5c64e9c-4f19-4a77-bd59-325481534136\"}":{"__typename":"DeepDives","uuid":"c5c64e9c-4f19-4a77-bd59-325481534136","content":"\u003cp\u003eBecause I am Mexican-American, I try to practice cultural humility as much as possible. I know my own experiences are just that - my own. Thus, I try my best to cultivate an environment for students to share their own lived experiences whether similar or vastly different than my own. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"302d002c-1e27-4e41-b796-1e0298586724\"}":{"__typename":"DeepDives","uuid":"302d002c-1e27-4e41-b796-1e0298586724","content":"\u003cp\u003eI am the product of great mentors who have helped me throughout my professional and academic pursuits. I wish to pay it forward by nurturing curiosity, guiding students, and setting a positive example like the mentors who helped me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4380533c-7d90-45d8-9c6b-dbe72fd21d64\"}":{"__typename":"DeepDives","uuid":"4380533c-7d90-45d8-9c6b-dbe72fd21d64","content":"\u003cp\u003eBoxing. Weightlifting. Reading. Discovering New Music. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9014daae-a1b0-465b-8751-181e75b60004\"}":{"__typename":"DeepDives","uuid":"9014daae-a1b0-465b-8751-181e75b60004","content":"\u003cp\u003eI made it a point to do something professional, fun, and academically enriching. My summers consisted of interning at my local District Attorney's office, taking AP classes, hosting book clubs with friends, and enjoying my friend's pool. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"554dfd36-1bb1-4593-9a74-6fd12698ec7a\"}":{"__typename":"School","uuid":"554dfd36-1bb1-4593-9a74-6fd12698ec7a","name":"Southwest High School","city":"El Centro","type":"HIGH","state":"California","country":"United States","zip":"92243"},"Education:{\"uuid\":\"6c5032b0-f452-4744-a8ad-ab0cdfe325d8\"}":{"__typename":"Education","uuid":"6c5032b0-f452-4744-a8ad-ab0cdfe325d8","school":{"__ref":"School:{\"uuid\":\"554dfd36-1bb1-4593-9a74-6fd12698ec7a\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"f8e1041c-c7a2-41d1-a3d0-c4b50ee2e830\"}":{"__typename":"Education","uuid":"f8e1041c-c7a2-41d1-a3d0-c4b50ee2e830","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"History ","degree":null},"MentorPublicProfile:{\"uuid\":\"1598b95d-092d-4c89-ab4a-5b72dfccdf07\"}":{"__typename":"MentorPublicProfile","uuid":"1598b95d-092d-4c89-ab4a-5b72dfccdf07","displayName":"Henry L.","slug":"henry-liera","biography":"\u003cp\u003eMy name is Henry Liera, and I am from Imperial Valley, California, an agri-business community along the U.S.-Mexico border. I graduated from Stanford University in 2022 where I majored in history with a minor in economics. Starting fall of 2025, I will begin attending Columbia Law School.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe pursuit of knowledge is something I am deeply passionate about. I am a lifelong learner who loves to give into my urges to explore my random, and vast, intellectual curiosities. Whether it’s reading about new topics, conversing with experts, or watching documentaries, learning excites me. I am especially passionate about the law, pop culture, and fitness.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI like to think of myself as a go-getter and leader. In college, I was the founder of a boxing club, started a nonpartisan organization which aimed to improve voter turnout in my hometown\u0026nbsp; during the 2020 election, and was a community manager for a cooperative living house called the Enchanted Broccoli Forest. I have lots of experience working in public service and the law including as an intern for the California Department of Education, the district office of Congresswoman Anna Eshoo, and most recently, as a legal assistant for an employment-based immigration law firm.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAdditionally, I have an extensive background in mentoring and teaching. I have taught English language arts to elementary students and math to high school students. I have helped students craft successful college applications by helping them brainstorm and draft materials. Finally, for nearly a decade, I have served as a boxing coach for my home boxing club, Sparta Boxing, where I have taught the sport to children and adults of all ages.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, tutor, and leader, I love cultivating environments that nurture an individual’s intellectual vitality and give them enough room to learn, fail, and grow. I am excited about the opportunity to work with your child to help them accomplish their academic goals, ignite and fan their passion for learning, and gain confidence in their unique abilities.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"sVg3ZEdmlYo02Q27hE6CZwxjAEU900vmXhRn2aCCybohU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am a recipient of the Gate's Scholarship from the Bill \u0026amp; Melinda Gates Foundation. I was one of 300 first generation and/or low-income students selected from over 28,000 applicants for a full four-year undergraduate scholarship.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0e09c474-13d2-4f40-a4ed-3179757d382d\"}"},{"__ref":"Favorites:{\"uuid\":\"2ab933a2-0b22-4382-b423-4855519eae9b\"}"},{"__ref":"Favorites:{
