xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e43dbbcb-78f1-4c34-9b74-167747a93311\"}":{"__typename":"Favorites","uuid":"e43dbbcb-78f1-4c34-9b74-167747a93311","photoUrl":"https://ucarecdn.com/97d5f364-2ceb-4d52-baec-36d726df100e/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"795c9432-2ca0-4dc9-93d5-da0be972d8e4\"}":{"__typename":"Favorites","uuid":"795c9432-2ca0-4dc9-93d5-da0be972d8e4","photoUrl":"https://ucarecdn.com/00d9ea76-9200-490e-ad01-9ab193a950d2/","title":"Volleyball","type":"SPORT"},"Favorites:{\"uuid\":\"55e0d02d-0273-4a5f-b930-3f51a067f080\"}":{"__typename":"Favorites","uuid":"55e0d02d-0273-4a5f-b930-3f51a067f080","photoUrl":"https://ucarecdn.com/d7e43854-0b00-44d4-8526-54fc05cdba97/","title":"The Weeknd","type":"ARTIST"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"023a6286-00ac-4e5d-889e-7d28d906f157\"}":{"__typename":"DeepDives","uuid":"023a6286-00ac-4e5d-889e-7d28d906f157","content":"\u003cp\u003eAs a high school student, I was motivated to pursue my interests, especially outside of school. I was always looking for the next opportunity, but I also enjoyed spending time with people I cared about. My favorite thing about high school was the balance that I enjoyed. I spent so much time making incredible memories, and I spent a lot of time studying and preparing for my future. I was extremely social and loved to talk with everyone about everything. Truly, I believed that no second could go to waste, and I filled my days with things that made me excited about my life and future. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a475f4fe-9c8e-40e8-8b63-5e5947475704\"}":{"__typename":"DeepDives","uuid":"a475f4fe-9c8e-40e8-8b63-5e5947475704","content":"\u003cp\u003eMy dream job is to be a Legal and Compliance Analyst at a firm in a larger city, where I can be challenged every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"eee43ada-f9a4-446d-84e9-9e60378424f5\"}":{"__typename":"Education","uuid":"eee43ada-f9a4-446d-84e9-9e60378424f5","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}":{"__typename":"School","uuid":"9a91466f-187b-4e9b-8a98-c02cef7bf621","name":"University of Michigan","city":"Ann Arbor","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48109"},"Education:{\"uuid\":\"fb6b1f4e-0fb6-4ff3-a5c8-7c67b4c32e14\"}":{"__typename":"Education","uuid":"fb6b1f4e-0fb6-4ff3-a5c8-7c67b4c32e14","school":{"__ref":"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"2e08a0d4-7b71-4f9c-8d3c-7a7a94236a39\"}":{"__typename":"MentorPublicProfile","uuid":"2e08a0d4-7b71-4f9c-8d3c-7a7a94236a39","displayName":"Keira M.","slug":"keira-morrell","biography":"\u003cp\u003eMy name is Keira Morrell, and I’m a student at the University of Michigan studying Economics, but I’ve worked in a variety of fields in the past. Across all my experiences, I’ve always been drawn to roles where I can connect with others and help create intentional, positive experiences—whether that’s through event planning, outreach, community-focused work, or tutoring.\u003c/p\u003e\u003cp\u003eThrough tutoring positions, I’ve had the chance to work closely with students of different ages and learning styles, helping them build both academic skills and confidence. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I serve as the Member Engagement Chair for Atlas Consulting Group, where I plan events that help build community within the organization. I also helped coordinate professional development opportunities for Beta Alpha Rho, a pre-law and public service organization, planning events for our current actives and all potential new members. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost recently, I worked with the Los Angeles County Public Defender’s Office, where I designed public-facing materials and provided direct insight into our work. In this role, I analyzed LA County Board of Supervisors meetings to evaluate policy developments, identify potential risks, and uncover opportunities for strategic media communication. I also assessed recent federal budget cuts impacting the office and prepared media briefings for five internal departments, outlining potential implications for clients and office operations. These experiences strengthened my ability to synthesize complex information, communicate clearly, and think strategically, while also giving me a firsthand understanding of how public service organizations navigate policy and resource challenges. Across every role, I’ve developed a strong sense of organization, a deep commitment to academic excellence, and a love for building community!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my professional and academic experiences, I enjoy pursuing hobbies that bring balance, creativity, and joy into my daily life. Reading has always been one of my favorite ways to spend time, and I’m drawn to books ranging from contemporary fiction to historical nonfiction. I love the way reading exposes me to different perspectives and helps me think more critically and empathetically, qualities I bring into group projects and leadership roles. Baking is another passion of mine, whether I’m testing a new recipe or sharing homemade treats with friends, I see it as a way of showing care and building community on a smaller scale.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also enjoy making jewelry, which has become a creative outlet that teaches me patience, attention to detail, and perseverance when designs don’t turn out perfectly the first time. In addition, I make time for fitness and enjoy a variety of workouts, from strength training to running and group fitness classes. Exercise keeps me grounded and disciplined, while also reminding me of the importance of consistency and resilience, skills that have translated into my academic and professional life. All of these experiences and interests shape who I am and the kind of community I hope to build wherever I go.\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"BOno87Bet6sfIOEVJAHzJeGeAumm901Ds3KFuOKRSKtk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e43dbbcb-78f1-4c34-9b74-167747a93311\"}"},{"__ref":"Favorites:{\"uuid\":\"795c9432-2ca0-4dc9-93d5-da0be972d8e4\"}"},{"__ref":"Favorites:{\"uuid\":\"55e0d02d-0273-4a5f-b930-3f51a067f080\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"023a6286-00ac-4e5d-889e-7d28d906f157\"}"},{"__ref":"DeepDives:{\"uuid\":\"a475f4fe-9c8e-40e8-8b63-5e5947475704\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b49ccc8d-2e4a-42a6-a20e-2a5c742dac6c/-/preview/-/format/jpg/","https://u
