xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c9db48ca-9e53-4277-841b-0b39f11f5859\"}":{"__typename":"Favorites","uuid":"c9db48ca-9e53-4277-841b-0b39f11f5859","photoUrl":"https://ucarecdn.com/992f8c74-3bff-4daf-8220-329a10af10bb/","title":"2001: A Space Odyssey","type":"MOVIE"},"Favorites:{\"uuid\":\"03bbd721-6a6e-4858-b90f-b9dbd6ae1545\"}":{"__typename":"Favorites","uuid":"03bbd721-6a6e-4858-b90f-b9dbd6ae1545","photoUrl":"https://ucarecdn.com/8d86cc0c-3634-4ea8-891d-0a19347a4a0d/","title":"Patrick Mahomes","type":"ATHLETE"},"Favorites:{\"uuid\":\"de8af52a-f774-4659-a3cb-6452b0139b40\"}":{"__typename":"Favorites","uuid":"de8af52a-f774-4659-a3cb-6452b0139b40","photoUrl":"https://ucarecdn.com/209e1b2c-735a-409f-ae5d-c767349f7784/","title":"Jacob Collier","type":"ARTIST"},"CausesSupported:{\"uuid\":\"00520bf0-ccd5-455b-85dd-d1fe12e19ee4\"}":{"__typename":"CausesSupported","uuid":"00520bf0-ccd5-455b-85dd-d1fe12e19ee4","name":"826CHI","description":"\u003cp\u003e826CHI is an amazing organization promoting creative writing for Chicago youth\u003c/p\u003e","photoUrl":"https://ucarecdn.com/c3735283-a049-4f12-a2d4-2a14d0757da6/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"61e56efb-c1ab-4d11-b946-9666fb9add4d\"}":{"__typename":"DeepDives","uuid":"61e56efb-c1ab-4d11-b946-9666fb9add4d","content":"\u003cp\u003eIf you have a dream, MAKE IT HAPPEN! I had so many ideas for films and plays and projects that I wish I would've taken the initiative on. With the internet and phones and all the resources we have this day and age, you'd be surprised with the dreams you can make a reality. I was always worried that my projects weren't going to be perfect, but I wish I would've just made them no matter what, since creating imperfect things is part of the process of learning and growing. Also, people want to see you succeed and help you, so reach out to the people in your life who you can rely on! You have an incredible power, and share those talents with the world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"7afbd1d1-4254-4bdd-a10b-62f5be1ed009\"}":{"__typename":"DeepDives","uuid":"7afbd1d1-4254-4bdd-a10b-62f5be1ed009","content":"\u003cp\u003eMy greatest role model is my mother. Raising two kids by herself was very difficult, but she has always put us first and foremost. She gave up her career as a journalist to become a teacher so she could have the same schedule as we did, and has worked many side jobs to help provide for us. She is the hardest working person I've ever met, and I am forever thankful for the dedication she put into raising me and the lessons she instilled.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e3deb981-79ce-42f4-9c8f-75c615aaeed7\"}":{"__typename":"DeepDives","uuid":"e3deb981-79ce-42f4-9c8f-75c615aaeed7","content":"\u003cp\u003eDuring my senior year of high school, our choir teacher went on leave in order to take care of her kids after COVID. We had a substitute during that time, but he suddenly left two-thirds of the way into the year, right before our huge final concert. Along with a few friends, I took up running and organizing the concert, which involved coaching soloists, leading rehearsals, hiring a band and crew, publicity, and more. It was a lot to manage, but I was excited to step up, and I'm proud to say the concert ended up being a big success.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"97b4678b-741a-4503-9398-ef28929e30af\"}":{"__typename":"DeepDives","uuid":"97b4678b-741a-4503-9398-ef28929e30af","content":"\u003cp\u003eEven though my love for the arts and education might make you assume otherwise, I am a huuuge sports fan. I grew up playing every sport I could, and, even though my competitiveness has been transferred into other pastimes, I still love watching sports. My favorites are football, soccer, and basketball. One of my favorite activities is to edit my movies while having a game on in the background. It's always great to combine your favorite activities!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"b7612144-053c-4f50-b264-fce056fef9ae\"}":{"__typename":"School","uuid":"b7612144-053c-4f50-b264-fce056fef9ae","name":"Blue Valley Northwest High School","city":"Overland Park","type":"HIGH","state":"Kansas","country":"United States","zip":"66213"},"Education:{\"uuid\":\"9a5360d3-28ab-4ad6-a63f-60d71b171249\"}":{"__typename":"Education","uuid":"9a5360d3-28ab-4ad6-a63f-60d71b171249","school":{"__ref":"School:{\"uuid\":\"b7612144-053c-4f50-b264-fce056fef9ae\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"dab431e5-d255-48be-8503-90b9a5e8518c\"}":{"__typename":"Education","uuid":"dab431e5-d255-48be-8503-90b9a5e8518c","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Radio, Television, and Film","degree":null},"MentorPublicProfile:{\"uuid\":\"9deac8d4-333e-46f0-be0f-49eeb10ff087\"}":{"__typename":"MentorPublicProfile","uuid":"9deac8d4-333e-46f0-be0f-49eeb10ff087","displayName":"Declan F.","slug":"declan-franey","biography":"\u003cp\u003eHey! My name's Declan, and I'm a junior at Northwestern University. I'm a film major and am minoring in theatre and psychology. I've always been really involved with art of all sorts, including movies, theatre, choir, dance, and playing trombone and piano. Last year, I directed my first feature film, which was an incredible experience. Outside of the arts and school, I love sports and am an avid runner!\u003c/p\u003e","teachingVideoPlaybackId":"zTyO8tx43ywMQj5Sn9wZcgUMv5CEZ91sK39HP9EJnS8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDuring my sophomore year of college, I directed a feature film titled Mixed Signals. We had over 100 people on our cast and crew and we we worked on it for over a year. While it was a demanding process, it was also incredibly invigorating and fulfilling, and nothing will beat the feeling of seeing it in a packed theater at our premiere.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c9db48ca-9e53-4277-841b-0b39f11f5859\"}"},{"__ref":"Favorites:{\"uuid\":\"03bbd721-6a6e-4858-b90f-b9dbd6ae1545\"}"},{"__ref":"Favorites:{\"uuid\":\"de8af52a-f774-4659-a3cb-6452b0139b40\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0
