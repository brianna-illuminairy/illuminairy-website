xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"415b3723-1573-4b96-bcf0-26b479027a6c\"}":{"__typename":"DeepDives","uuid":"415b3723-1573-4b96-bcf0-26b479027a6c","content":"\u003cp\u003eOut of all things I could be doing, I want to mentor to show younger students how to put the stressors of middle and high school into perspective! These years of transition and maturing can be daunting but I always found that having a college student to guide me through stressful times was a life saver!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"954f584c-4ae0-4a15-ba72-75266eb756b2\"}":{"__typename":"DeepDives","uuid":"954f584c-4ae0-4a15-ba72-75266eb756b2","content":"\u003cp\u003eAs a high school student I was extremely hard on myself when it came to academics. However, I refused to miss out on social gatherings of any type. It became difficult to balance the caliber of academic performance that I expected from myself and such a large amount of socialization so I had to learn how to make sacrifices! Looking back, I now understand that one of the most important things a student can do for their well-being is make compromises on how they spend their time. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"0e1c0141-b41f-4968-a6f1-47b9be3fdd76\"}":{"__typename":"DeepDives","uuid":"0e1c0141-b41f-4968-a6f1-47b9be3fdd76","content":"\u003cp\u003eI started a non-profit during Covid called The Heartfelt Kitchen to nourish my love for cooking. Each week, I planned, cooked and hand-delivered elaborate multi-course meals to around 30 friends and family around the Los Angeles area. All proceeds were donated to the Los Angeles food bank to relieve Covid-related hunger. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"45580d6e-e9c1-4d67-b4dc-676598a63193\"}":{"__typename":"DeepDives","uuid":"45580d6e-e9c1-4d67-b4dc-676598a63193","content":"\u003cp\u003eIn my spare time you will find me outdoors! Whether it be hiking, swimming, running or simply reading on the beach, I am my happiest in nature!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"a4111d42-1f38-4d97-bddd-cdccda14e705\"}":{"__typename":"School","uuid":"a4111d42-1f38-4d97-bddd-cdccda14e705","name":"Windward School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90066"},"Education:{\"uuid\":\"54f5b8b6-5cf0-4459-aa5e-994dfa740373\"}":{"__typename":"Education","uuid":"54f5b8b6-5cf0-4459-aa5e-994dfa740373","school":{"__ref":"School:{\"uuid\":\"a4111d42-1f38-4d97-bddd-cdccda14e705\"}"},"startYear":"2016","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"bc793afb-1fe6-4ea5-b6fe-3a41e9b475f0\"}":{"__typename":"Education","uuid":"bc793afb-1fe6-4ea5-b6fe-3a41e9b475f0","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Neuroscience and Communication Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"525551cc-a35e-4799-b231-9e181ee77edc\"}":{"__typename":"MentorPublicProfile","uuid":"525551cc-a35e-4799-b231-9e181ee77edc","displayName":"Teala F.","slug":"teala-fishman","biography":"\u003cp\u003eHi, I'm Teala! I can't wait to get to know you! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm a neuroscience and communication studies major at Northwestern University. I am currently deciding between pursuing medical school or an alternative path in the field of medicine (i.e. research, pharmaceuticals etc...). I spent this past summer shadowing at a cancer clinic in Los Angeles to help me grow closer to making this decision. Either way, I know I want to spend my professional life immersed in the world of life sciences! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn terms of extracurricular interests, I enjoy getting into conversations about anything food-related and trying out new forms of exercise. I'm a big believer that the best way to experience a new community is through their cuisine. I also enjoy spending time outdoors and would love to talk about my favorite/dream nature destinations across the country or world! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eA fun fact about me is that if I could pursue any career NOT science related, it would be starting my own clothing line!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to meeting new mentees and finding fun and engaging ways to learn!\u003c/p\u003e","teachingVideoPlaybackId":"a7pwqeIaUzwLWhw7gmqEDqlefH25YKefBelBC3TuQsg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience and Communication Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"415b3723-1573-4b96-bcf0-26b479027a6c\"}"},{"__ref":"DeepDives:{\"uuid\":\"954f584c-4ae0-4a15-ba72-75266eb756b2\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e1c0141-b41f-4968-a6f1-47b9be3fdd76\"}"},{"__ref":"DeepDives:{\"uuid\":\"45580d6e-e9c1-4d67-b4dc-676598a63193\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/18548b37-9819-485e-aac0-3201993a8067/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"54f5b8b6-5cf0-4459-aa5e-994dfa740373\"}"},{"__ref":"Education:{\"uuid\":\"bc793afb-1fe6-4ea5-b6fe-3a41e9b475f0\"}"}],"hiredAt":"2024-08-26T23:15:28.053Z","topics":["Biology","Chemistry","College Essay Writing","STEM Project","Physics","Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Global Health"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"teala-fishman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"525551cc-a35e-4799-b231-9e181ee77edc\"}"}}},"_sentryTraceData":"c11c2674c28141c2800b9dd011b3bed9-a6b112d1d61291a4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c11c2674c28141c2800b9dd011b3bed9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-
