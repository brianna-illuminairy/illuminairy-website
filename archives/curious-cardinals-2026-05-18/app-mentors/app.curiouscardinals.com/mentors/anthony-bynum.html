xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"90399480-185b-48ec-af4f-944121c3ccca\"}":{"__typename":"DeepDives","uuid":"90399480-185b-48ec-af4f-944121c3ccca","content":"\u003cp\u003eAs a child, I was mentored for behavioral reasons. I truly don't think I would be where I am today without their life experience to look upon. I just want to guide others the way I was once guided.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b53fad91-b152-44b3-9ef5-cc8d0c37a451\"}":{"__typename":"DeepDives","uuid":"b53fad91-b152-44b3-9ef5-cc8d0c37a451","content":"\u003cp\u003eI mostly worked and a lot of volunteering with my community. The summer after my junior year I did MITES, which is a 6-week program that gives you a look into MIT student life and provides insight and preparation for a STEM career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"f170992e-3631-401f-a1b6-20739cfb916d\"}":{"__typename":"DeepDives","uuid":"f170992e-3631-401f-a1b6-20739cfb916d","content":"\u003cp\u003eI'm part Saudi Arabian and Eritrean as well as African-American, so there's a lot of cultures I grew up learning from and quite a few languages I want to learn!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"fd03315a-cb14-4767-850b-6b45db73f9e5\"}":{"__typename":"DeepDives","uuid":"fd03315a-cb14-4767-850b-6b45db73f9e5","content":"\u003cp\u003eI definitely want to have a family of my own!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"80e61337-de44-41b8-ac1f-c6b19eefdc0f\"}":{"__typename":"School","uuid":"80e61337-de44-41b8-ac1f-c6b19eefdc0f","name":"Hilton Head Island High School","city":"Hilton Head Island","type":"HIGH","state":"South Carolina","country":"United States","zip":"29926"},"Education:{\"uuid\":\"a0dab8c7-bd06-4ab6-aab9-cb65d9e773bf\"}":{"__typename":"Education","uuid":"a0dab8c7-bd06-4ab6-aab9-cb65d9e773bf","school":{"__ref":"School:{\"uuid\":\"80e61337-de44-41b8-ac1f-c6b19eefdc0f\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"71f538fc-f3e6-46d3-b09b-44e5cd966823\"}":{"__typename":"Education","uuid":"71f538fc-f3e6-46d3-b09b-44e5cd966823","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering S.B.","degree":null},"MentorPublicProfile:{\"uuid\":\"a30391e2-49f5-4f21-a8b7-b10322cd1720\"}":{"__typename":"MentorPublicProfile","uuid":"a30391e2-49f5-4f21-a8b7-b10322cd1720","displayName":"Anthony B.","slug":"anthony-bynum","biography":"\u003cp\u003eHi! My name’s Anthony, but you can call me AJ! I’m a first-year student at Harvard studying Mechanical Engineering and Computer Science. I plan to work in the aerospace industry—so if you ever want to hear a rant about rockets or learn how to build one, I’m your guy! At Harvard, I’m part of the FSAE team and the Rocket Propulsion Group.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was an athlete, playing basketball, football, and track. I also started a tutoring program to support elementary school students, helping them rebuild reading, writing, and math skills that declined after the pandemic. My peers and I tutored at two local elementary schools, and we saw incredible growth in students’ confidence and standardized test scores.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also did MITES Summer the summer after my junior, a rigorous STEM experience with MIT that prepared me for college life and refined my passion for engineering.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eRight now, I’m working on a bionic hand that responds to EMG signals, an amateur rocket, an FSAE car, and improving a thermoelectric generator I built in middle school!\u003c/p\u003e\u003cp\u003e\u003cbr\u003eBeing a nerd isn't a 24/7 thing for me though. I still play basketball often, and I love to travel! In my free time, you'll find me reading my Bible or a great realistic fiction book. I'm also learning Arabic in school! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDespite being a full-time student, I'm flexible, and I definitely have time for you! I'm really excited to work with together!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"3nRsHLULll00SC80201fXO3020002QOzMM1XBMJsB2lVH2l7U","teachingVideoDescription":null,"greatestAchievement":null,"favorit
