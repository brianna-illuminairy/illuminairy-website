xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2427e800-54c9-4eac-840d-b79368d78a0b\"}":{"__typename":"DeepDives","uuid":"2427e800-54c9-4eac-840d-b79368d78a0b","content":"\u003cp\u003eI am currently in the process of co-founding a community organization with a team of 6 Yale peers that connects local New Haven residents with essential resources. We are working together to build comprehensive resource guides listing important information about all the services available in New Haven related to immigration, law, housing, food, health, and employment. Oftentimes, there are so many amazing organizations ready to help people, but those in need of these services are not aware that such resources exist! We are striving to bridge this gap within the New Haven community. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"33cf2fea-0016-4d41-a23c-f2fcd9c2e7a6\"}":{"__typename":"DeepDives","uuid":"33cf2fea-0016-4d41-a23c-f2fcd9c2e7a6","content":"\u003cp\u003eI hope to give back to the communities that have supported me so much throughout my life. In particular, I would love to go back to Oregon once I graduate and utilize the great privilege I have as a Yale graduate to make an impact in my home-state. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d28d400a-520c-4433-be92-845a3b18cca1\"}":{"__typename":"DeepDives","uuid":"d28d400a-520c-4433-be92-845a3b18cca1","content":"\u003cp\u003eSince as early as I can remember, I've been fascinated by understanding the roots of social issues. In high school, when I became incredibly passionate about criminal justice reform in my community, I spent weeks reading history books on the origins of mass incarceration and unjust policing in the U.S. I knew that in order to understand the injustice of the present moment, I had to first look back at our nation's past. I want to inspire others to feel as strongly about the importance of history as I do!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"afb3ebb6-be89-4f6b-b7ef-5adcd7c01f5b\"}":{"__typename":"DeepDives","uuid":"afb3ebb6-be89-4f6b-b7ef-5adcd7c01f5b","content":"\u003cp\u003eCut yourself some slack! High school can be so stressful and make you feel like you need to be doing everything at once, all of the time. The truth is, you will have the most success staying true to your passions and just focusing on the activities that make you happy. You can't do it all! So just do what you love, and do it well. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"db7540ff-fbab-42d7-8c0f-d66725436feb\"}":{"__typename":"School","uuid":"db7540ff-fbab-42d7-8c0f-d66725436feb","name":"Tualatin High School","city":"Tualatin","type":"HIGH","state":"Oregon","country":"United States","zip":"97062"},"Education:{\"uuid\":\"2d1b21c3-57c5-4e59-b02b-6496bd0d11dd\"}":{"__typename":"Education","uuid":"2d1b21c3-57c5-4e59-b02b-6496bd0d11dd","school":{"__ref":"School:{\"uuid\":\"db7540ff-fbab-42d7-8c0f-d66725436feb\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1ab76e54-7058-4ee4-883d-fe5a09248762\"}":{"__typename":"Education","uuid":"1ab76e54-7058-4ee4-883d-fe5a09248762","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"44fc0baf-dc21-4ff6-b831-a5572304886d\"}":{"__typename":"MentorPublicProfile","uuid":"44fc0baf-dc21-4ff6-b831-a5572304886d","displayName":"Hannah F.","slug":"hannah-figueroavelazquez-1","biography":"\u003cp\u003eHi! My name is Hannah Figueroa Velázquez, and I’m a junior at Yale University studying History with a concentration in U.S. history. I'm from Portland, Oregon, and I care deeply about social justice, politics, and public service. As someone who comes from a family of Mexican migrants, I’m especially passionate about immigration advocacy. I’m currently on the pre-law track and aspire to become an immigration lawyer, working to support and uplift migrant communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I’ve pursued this passion through summer legal internships at immigration-focused nonprofits, as well as courses like “U.S. Immigration Policy: Past to Present.” Writing has always been one of my strongest tools for advocacy – it’s how I convey what I believe and fight for what matters to me. I’ve had a deep love for writing since high school, and it's played a big role in my academic, extracurricular, and professional life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I’ve mentored students through their college applications, helping them express their authentic selves in their essays. Just last year I helped a bright, young student get into Yale! I also recently co-founded a student journalism publication that encourages free speech and diverse perspectives on campus. I truly believe writing is one of the most powerful skills a student can have – it’s how we tell the world who we are, and it's essential not only for school and jobs, but for personal growth and confidence. I’m excited to help the students I mentor build and refine their communication skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond writing, I’m a lifelong learner and someone who genuinely enjoys exploring new subjects. In high school, I took part in the International Baccalaureate (IB) program, where I challenged myself with higher-level courses in History, English, Calculus II, Physics, and Spanish. I still remember the joy of finally reaching that “ah-ha” moment in a difficult class – and as a mentor and tutor, I’m eager to help my students experience those moments too. Everyone learns differently, and I’m committed to getting creative with teaching methods to help each student succeed in their own way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I love expressing myself through fashion, music, and writing. I’m also a big fan of thrifting and vinyl hunting – my perfect day would probably involve iced coffee, sushi with a friend, and exploring vintage shops around town.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the end of the day, I’m here because I care. I care about helping students find their voice, believe in themselves, and grow into who they want to be. I can’t wait to support the next generation of changemakers!\u003c/p\u003e","teachingVideoPlaybackId":"JwEV4yjEH8cHRTXWixI8dG01wHZ1C00nPxGwhCcUYtjpQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2427e800-54c9-4eac-840d-b79368d78a0b\"}"},{"__ref":"DeepDives:{\"uuid\":\"33cf2fea-0016-4d41-a23c-f2fcd9c2e7a6\"}"},{"__ref":"DeepDives:{\"uuid\":\"d28d400a-520c-4433-be92-845a3b18cca1\"}"},{"__ref":"DeepDives:{\"uuid\":\"afb3ebb6-be89-4f6b-b7ef-5adcd7c01f5b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dd671c76-2f51-4f4b-ab8e-79d084d29c0c/-/preview/-/format/jpg/","https://ucarecdn.com/bd2082ca-2aa3-4534-a8e0-1dbd5a0206f7/-/preview/-/format/jpg/","https://ucarecdn.com/63238b51-dead-47eb-bc98-a46e1683953d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2d1b21c3-57c5-4e59-b02b-6496bd0d11dd\"}"},{"__ref":"Education:{\"uuid\":\"1ab76e54-7058-4ee4-883d-fe5a09248762\"}"}],"hiredAt":"2025-03-19T12:14:05.603Z","topics":["History Project","Literature","Women \u0026 Gender Studies","Law / Government / Policy","Race \u0026 Ethnicity","Journalism","K-5 Grade Math","Pre-Algebra","Writing","Spanish","Creative Writing","Algebra I"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hannah-figueroavelazquez-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"44fc0baf-dc21-4ff6-b831-a5572304886d\"}"}}},"_sentryTraceData":"94693d05485e4363981cffa8820af948-aecb2b71f87e9ef0-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=94693d05485e4363981cffa8820af948,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/
