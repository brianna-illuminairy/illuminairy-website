xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"06bf29a9-89a2-4c62-8a64-d2d14df17bb0\"}":{"__typename":"Favorites","uuid":"06bf29a9-89a2-4c62-8a64-d2d14df17bb0","photoUrl":"https://ucarecdn.com/c31cd937-1588-421c-97a1-1e76464480ac/","title":"Babel","type":"BOOK"},"Favorites:{\"uuid\":\"5452b37e-d226-4949-bedc-4c5211d263d5\"}":{"__typename":"Favorites","uuid":"5452b37e-d226-4949-bedc-4c5211d263d5","photoUrl":"https://ucarecdn.com/34f102a0-e11f-41d5-90c1-48608db8bde1/","title":"Gracie Abrams","type":"ARTIST"},"Favorites:{\"uuid\":\"f0b98541-86b0-4c6a-a24f-b267d0070d8a\"}":{"__typename":"Favorites","uuid":"f0b98541-86b0-4c6a-a24f-b267d0070d8a","photoUrl":"https://ucarecdn.com/78c18cde-ed4e-4982-8c73-25d50ee5dd15/","title":"Taipei, Taiwan","type":"CITY"},"CausesSupported:{\"uuid\":\"57006d02-53ab-4dd4-bf91-1d889715b0a2\"}":{"__typename":"CausesSupported","uuid":"57006d02-53ab-4dd4-bf91-1d889715b0a2","name":"World Food Programme","description":"\u003cp\u003eI donated monthly. They delivered food to war-torn or food shortage zones\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"49afd73a-df2e-49ae-959f-6b366598230c\"}":{"__typename":"DeepDives","uuid":"49afd73a-df2e-49ae-959f-6b366598230c","content":"\u003cp\u003eExperiment more. Coming from an Asian background, I felt a lot of pressure to be perfect and not making any (big) mistakes. I appeared to make a lot of turns: moving cities, changing focal subject from mathematics to English; however, I didn't diverge much from my comfort zone. I still worked on things that I could get good at with low effort.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis is not to say that I shouldn't have focused on what I could do best. It's a strategy called Zone of Genius. But I wish I'd had ventured out more, especially when under 18 I still lived with my parents carefree and they were my safety net.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"9d1b2c96-604a-4af4-9082-4be7cb396063\"}":{"__typename":"DeepDives","uuid":"9d1b2c96-604a-4af4-9082-4be7cb396063","content":"\u003cp\u003eI want to have a Wikipedia entry written about me, which means I'm accomplished. I cannot predict what they will write about yet, but I hope they write me as a kind person that do good, a great mentor/educator, and an accomplished researcher that people will seek me out for advice / consulting / policy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"9580e38f-f323-43dd-ad7f-25eaaadd1989\"}":{"__typename":"DeepDives","uuid":"9580e38f-f323-43dd-ad7f-25eaaadd1989","content":"\u003cp\u003eI was very much academic-focus in middle school (6th-9th grades) and then extracurricular-focused in high school (10-12th grades). I studied hard to get into an elite high school in Vietnam, but after I got in, I wanted to explore other interests more. I started learning programming (Python+Java) in grade 11, joined several student-led organizations outside to host tech events, educational workshops, and hackathons from then on. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a4e7b852-a1c6-4ee0-9538-388acf959bc9\"}":{"__typename":"DeepDives","uuid":"a4e7b852-a1c6-4ee0-9538-388acf959bc9","content":"\u003cp\u003eThe boring \"why\" is that I'm good at thinking, maths, and programming, which prove important for Computer Science. The petty answer is to prove that girls, women, and minorities have their places in tech and STEAM in general, and we're important pieces not just for diversity, but also for better solving larger ranges of problems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"0cae62c2-5f55-48f1-8504-1ab7cea56c24\"}":{"__typename":"School","uuid":"0cae62c2-5f55-48f1-8504-1ab7cea56c24","name":"Foreign Language Specialised School, VNU","city":"Hanoi","type":"HIGH","state":"Hanoi","country":"Vietnam","zip":"100000"},"Education:{\"uuid\":\"003f4ca2-31bf-4035-af25-15fa21fe0c2e\"}":{"__typename":"Education","uuid":"003f4ca2-31bf-4035-af25-15fa21fe0c2e","school":{"__ref":"School:{\"uuid\":\"0cae62c2-5f55-48f1-8504-1ab7cea56c24\"}"},"startYear":"2017","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}":{"__typename":"School","uuid":"0a298df6-dac8-4a1d-8e35-77e7b609185d","name":"Minerva University","city":"San Francisco","type":"COLLEGE","state":"California","country":"United States","zip":"94103"},"Education:{\"uuid\":\"80634dbf-5c7d-4402-9d5e-9ed456bd0eef\"}":{"__typename":"Education","uuid":"80634dbf-5c7d-4402-9d5e-9ed456bd0eef","school":{"__ref":"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computational Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"b7652112-a624-47f4-a5cd-3f4cd3d21404\"}":{"__typename":"MentorPublicProfile","uuid":"b7652112-a624-47f4-a5cd-3f4cd3d21404","displayName":"Chiffon N.","slug":"my-chiffon","biography":"\u003cp\u003e👋 Hi! I'm Chiffon (or My if you have Vietnamese heritage)\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm passionate about helping curious young minds discover what excites them and turn those interests into meaningful projects. As someone who just graduated from Minerva University in May 2025 with a degree in Computational Sciences, I bring a unique \u003cstrong\u003ecross-cultural perspective\u003c/strong\u003e: I've \u003cstrong\u003estudied and lived in six different cities \u003c/strong\u003eacross the US (San Francisco), South Korea (Seoul), Taiwan (Taipei), India (Hyderabad), Argentina (Buenos Aires), and Germany (Berlin), learning alongside peers from over 50 countries. This experience taught me that there are countless ways to approach problems, and I love helping students find \u003cem\u003etheir\u003c/em\u003e way.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eEducation and diversity\u003c/strong\u003e are the areas where I could make the most positive changes in our world. I use my background in computational methods and AI to address real challenges in these spaces. Currently, I'm an\u003cstrong\u003e AI safety researcher with Algoverse\u003c/strong\u003e, where I explore how we can make AI systems remain under human control through monitoring their reasoning. I am also doing \u003cstrong\u003emultilingual and multicultural AI research with SEACrowd and Cohere Labs\u003c/strong\u003e. Through these roles, I've learned that technology should serve the diversity of human experiences (languages, cultures, values, and social interactions). I am applying for Master's with Thesis to do AI research; my \u003cstrong\u003edomains of expertise are AI alignment, multilingual \u0026amp; multicultural AI, data curation, and agentic AI. \u003c/strong\u003eI'm learning reinforcement learning for value alignment and continual learning in agentic systems.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I Can Help You Grow\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm especially excited to guide students who want to explore \u003cstrong\u003eWeb Design, Programming, AI / Machine Learning (especially research), Writing/Blogging, or building something entirely their own\u003c/strong\u003e. But I'm not just here to show you what I already know, I'm here to learn \u003cem\u003ewith\u003c/em\u003e you. If you have an interest that doesn't fit neatly into these categories, I'm open to exploring it together. Some of my best learning experiences have come from diving into something new alongside someone else.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor students who want to get more technical, I can help demystify concepts in \u003cstrong\u003eTrigonometry\u003c/strong\u003e, \u003cstrong\u003eCalculus, Statistics, and Machine Learning\u003c/strong\u003e. I've spent \u003cstrong\u003e2.5 years as a Teaching Assistant\u003c/strong\u003e at Minerva University for Computer Science and Programming with Python courses, which taught me how to break down complex ideas into understandable pieces.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI can also help you with\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e\u003cem\u003elearning how to learn\u003c/em\u003e\u003c/strong\u003e (how to best absorb and retain information)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003edeveloping strategies to \u003cstrong\u003e\u003cem\u003emanage time and energy\u003c/em\u003e\u003c/strong\u003e, and generally, productivity\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003edeveloping \u003cstrong\u003e\u003cem\u003esoft skills such as critical thinking and problem-solving\u003c/em\u003e\u003c/strong\u003e through dedicated exercises and toolkit\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003esustaining \u003cstrong\u003e\u003cem\u003emotivation\u003c/em\u003e\u003c/strong\u003e (spoiler alert: it's a myth; motivation comes after action)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy Work With Me?\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI'm generally very project-focused, experimental / hands-on, and detail-oriented, which means I tend to\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eremember your project and your progress in great details\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eencourage ample writing to explain yourself and communicate with others\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003egive \u003cstrong\u003edetailed\u003c/strong\u003e guidance and feedback on your project, whether it's in proposal or implementation stage\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003echallenge you to think critically, ask \"why\" questions, and embrace the messy process of creating something from scratch.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you want to\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ebuild or design your first website\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eexplore how AI actually works,\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003edo a scoped AI research project,\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003estart a blog that reflects your unique voice,\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eorganize events for your community, or\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003efigure out what you're even passionate about in the first place\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm here to guide and support you. I've been through those journeys!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eAs an older sister, I know how important it is to have someone who listens and celebrates your wins, big or small. I'm also an avid reader 📖 (both long novels and comics), minimalist 🌱, and Tarot reader 🔮\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI speak English, Vietnamese, and a little bit of Mandarin Chinese, so if you're multilingual or learning a new language, we'll have something extra to connect over.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat You Can Expect\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy past students and friends have told me that while I might look somewhat intimidating when I'm not smiling, I'm actually \u003cstrong\u003epatient, grounded, and honest in my feedback\u003c/strong\u003e. I'll give you both encouragement and constructive criticism because I believe that's how real growth happens.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen we work together, I'll be \u003cstrong\u003eadaptive and responsive to your feedback\u003c/strong\u003e \u003cstrong\u003e(so feel free to interrupt and give me feedback).\u003c/strong\u003e Finding the right dynamic in our mentor-mentee relationship is important to me, so I'll adjust my approach to match what works best for you, while still accomplishing our weekly goals. Do remind me to keep up with my changes in mentoring style!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMost importantly, I'll show you that learning doesn't stop in the classroom: it's a lifelong journey, and the best parts happen when you're driven by curiosity.\u003c/p\u003e","teachingVideoPlaybackId":"KiTh5TRlhg00QSzQnKuIf2NcMf8fZOsljoPO4SW6iwG8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"06bf29a9-89a2-4c62-8a64-d2d14df17bb0\"}"},{"__ref":"Favorites:{\"uuid\":\"5452b37e-d226-4949-bedc-4c5211d263d5\"}"},{"__ref":"Favorites:{\"uuid\":\"f0b98541-86b0-4c6a-a24f-b267d0070d8a\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"57006d02-53ab-4dd4-bf91-1d889715b0a2\"}"}],"major":"Computational Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"49afd73a-df2e-49ae-959f-6b366598230c\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d1b2c96-604a-4af4-9082-4be7cb396063\"}"},{"__ref":"DeepDives:{\"uuid\":\"9580e38f-f323-43dd-ad7f-25eaaadd1989\"}"},{"__ref":"DeepDives:{\"uuid\":\"a4e7b852-a1c6-4ee0-9538-388acf959bc9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/32433caf-ad9d-45b1-a75d-57cd14aeb0dc/-/preview/-/format/jpg/","https://ucarecdn.com/106dd30c-9d15-49e9-aef0-5f8942c2bfe9/-/preview/-/format/jpg/","https://ucarecdn.com/3956f4ea-785f-49a8-abb5-09c5020cd529/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"003f4ca2-31bf-4035-af25-15fa21fe0c2e\"}"},{"__ref":"Education:{\"uuid\":\"80634dbf-5c7d-4402-9d5e-9ed456bd0eef\"}"}],"hiredAt":"2025-10-21T19:09:07.542Z","topics":["Calculus","Precalculus / Trigonometry","Statistics","Computer Science","Executive Function","Coding / Programming","Machine Learning / AI","Web Design"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f5ae8359-9f55-41d8-a96b-8f3dc3ad05db/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"my-chiffon\"}})":{"__r
