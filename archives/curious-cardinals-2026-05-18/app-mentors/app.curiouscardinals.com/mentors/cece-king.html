p\u003eI hope to travel to every single country in the world, incorporating more slow, sustainable travel practices each time. I'm about 11% of the way there!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"7ae9327e-b43f-4d6d-b1b0-452c3fd467c6\"}":{"__typename":"DeepDives","uuid":"7ae9327e-b43f-4d6d-b1b0-452c3fd467c6","content":"\u003cp\u003eI helped my student research US immigration law and policy. She was inspired to spend our sessions on a policy memo on why violence at the border is unethical and politically less productive. She sent it to local officials, and her congresswoman was so impressed, she personally reached out! It reminded me yet again what young people are capable of. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e9c6f688-ce03-4696-b776-674b1528b5b7\"}":{"__typename":"DeepDives","uuid":"e9c6f688-ce03-4696-b776-674b1528b5b7","content":"\u003cp\u003eI love inventing recipes! I draw inspiration from travel, cooking shows, and restaurants before experimenting myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"67ff58a1-121a-45c2-bf4e-1f00085d45ab\"}":{"__typename":"Education","uuid":"67ff58a1-121a-45c2-bf4e-1f00085d45ab","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Geography, Arabic / Middle Eastern Studies","degree":null},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"0c185746-ff7f-4303-b0f7-b15528e56f00\"}":{"__typename":"Education","uuid":"0c185746-ff7f-4303-b0f7-b15528e56f00","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"Testimonial:39c7be7d-0c72-4888-925b-6a2c27126e6e":{"__typename":"Testimonial","id":"39c7be7d-0c72-4888-925b-6a2c27126e6e","text":"Cece was an incredible mentor for my daughter! My daughter is 5 and they wrote/illustrated and printed a book together. She learned how recognize, sound out, and put together letters into words and sentences. My daughter very much looks forwards to her sessions with Cece and is now exploring how to read! We're now thinking about enrolling her little brother!","date":"2025-07-07 17:51:53.499+00","rating":5,"endorser":{"__typename":"Endorser","name":"Vlad Loktev","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"53b9fac8-7c6e-4605-baa0-21329d7b5a49\"}":{"__typename":"MentorPublicProfile","uuid":"53b9fac8-7c6e-4605-baa0-21329d7b5a49","displayName":"Cece K.","slug":"cece-king","biography":"\u003cp\u003eIn 2020, Cece took a COVID gap year to join the founding team of Curious Cardinals as Head of Mission Communication and Alignment. This fall, she is back on the CC team supporting marketing!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eShe graduated from Dartmouth in the spring of 2024, following a second gap year spent making a documentary about the radical culture of environmental stewardship on Chile's remote, biodiverse Robinson Crusoe Island. She is working on several other film projects, all of which creatively highlight marginalized voices, including an upcoming feature directed by Gurinder Chadha (“Bend it Like Beckham”) and produced by Stephen Jones (“Wonder Woman”, “Gravity”). Previously, she worked on SXSW Audience Award winning documentary The Art of Making It and Liz Plank’s disability rights film.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAn explorer at heart, she studied Arabic and Geography at Dartmouth. She was named a 2022-2023 John Robert Lewis scholar for her work on immigration reform and expanding access to Dartmouth for refugee applicants. The US Congress even gave her a formal shoutout for this work!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eShe has written a column for newspapers in Midcoast Maine and has contributed to various publications across New York and Maine. She has done research for a Foreign Affairs book on regime change in the Congo and received a Rauner Historical Accountability Fellowship to pursue an archival project on women at Dartmouth prior to coeducation. \u003cbr\u003e\u003cbr\u003eNever interested in conventional education, Cece prioritized experiential learning in high school. She spent her junior year studying policy in Washington, DC at the School for Ethics and Global Leadership and was subsequently appointed a voting member of Manhattan Community Board 8 after she was awarded a City Council Citation. She represented her 230,000 person district on the Small Business and Education Committees. \u003cbr\u003e\u003cbr\u003eShe has studied abroad in Morocco on a US State Department Scholarship and spent time living and learning in Salamanca, Spain; Nosara, Costa Rica; and Sayulita, Mexico. Cece has also performed with the largest children’s circus in North America and continues to train professionally and with the independent troupe she founded. When she’s not exploring new corners of the world, she’s hunting for waves as a leader emeritus of Dartmouth’s surf club.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI just met my first mentee's parents.  I met her in 8th grade, and now she is a freshman at Cornell. They said my Feminist History workshop inspired her to major in gender studies! \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a9e45dd3-dae1-4939-b57d-fffac68038e3\"}"},{"__ref":"Favorites:{\"uuid\":\"355ece63-98a9-4ada-804e-44946792b5ca\"}"},{"__ref":"Favorites:{\"uuid\":\"489174ad-7d65-4df4-88c5-3be3bda27823\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"04ce755a-c0c7-4803-abc0-4d842bb9bf47\"}"},{"__ref":"CausesSupported:{\"uuid\":\"bb2a9d43-7d35-40ae-865b-cceb75c23fa7\"}"}],"major":"Geography, Arabic / Middle Eastern Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"63dc7572-7e51-4e69-80f5-bcc75f68b837\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ae9327e-b43f-4d6d-b1b0-452c3fd467c6\"}"},{"__ref":"DeepDives:{\"uuid\":\"e9c6f688-ce03-4696-b776-674b1528b5b7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4d9d2564-9208-4959-9a54-f503d10be518/-/preview/-/format/jpg/","https://ucarecdn.com/2d9e9bff-a966-417e-8f2e-85b954eaa72b/-/preview/-/format/jpg/","https://ucarecdn.com/07fb0f8b-8dd5-43c4-b55c-6e10055b7ecd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"67ff58a1-121a-45c2-bf4e-1f00085d45ab\"}"},{"__ref":"Education:{\"uuid\":\"0c185746-ff7f-4303-b0f7-b15528e56f00\"}"}],"hiredAt":"2021-08-24T05:09:08.000Z","topics":["K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Law / Government / Policy","Sustainability","Journalism","Public Speaking"],"communityBadges":["ht
