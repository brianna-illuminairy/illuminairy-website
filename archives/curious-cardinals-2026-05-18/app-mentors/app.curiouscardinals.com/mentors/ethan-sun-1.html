xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"732da2d1-ea24-45f2-8a4d-e33c6eb8b17b\"}":{"__typename":"Favorites","uuid":"732da2d1-ea24-45f2-8a4d-e33c6eb8b17b","photoUrl":"https://ucarecdn.com/7c306e7e-4d8d-42d6-bdaa-0c1cf32061f2/","title":"The Miseducation of Lauryn Hill","type":"ALBUM"},"Favorites:{\"uuid\":\"f7a9f1b3-39ad-4c79-85d5-ee1e0796769e\"}":{"__typename":"Favorites","uuid":"f7a9f1b3-39ad-4c79-85d5-ee1e0796769e","photoUrl":"https://ucarecdn.com/feab3bef-0925-4e51-a37d-cf2e5e4c287d/","title":"The Deep Blue Sea","type":"PLAY"},"Favorites:{\"uuid\":\"022395e5-515b-47d7-860b-2b192b317530\"}":{"__typename":"Favorites","uuid":"022395e5-515b-47d7-860b-2b192b317530","photoUrl":"https://ucarecdn.com/5c03f6e9-ea98-4605-a3ac-896aad683153/","title":"The House of Mirth","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"778245be-6831-494a-9348-eb62955c8b47\"}":{"__typename":"DeepDives","uuid":"778245be-6831-494a-9348-eb62955c8b47","content":"\u003cp\u003eWhen I began at university, I enjoyed the research and application-oriented nature of my biology classes, but wanted more opportunities to talk in small seminar classes and read new books. My sophomore year, I picked up an English major, and now I get the perfect mix of STEM and humanities in my education.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"87a9939f-e0e3-4cc4-a466-9a2e389438eb\"}":{"__typename":"DeepDives","uuid":"87a9939f-e0e3-4cc4-a466-9a2e389438eb","content":"\u003cp\u003eTry everything and be, as the tech people say, \"agentic.\" The interests you choose to pursue should be divorced from outcomes — that is to say, if you're interested in something, and pursue it ardently without second-guessing the chance of success, you'll find yourself exactly where you want to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"38f07434-f89d-4797-99ee-e9f2d4508d33\"}":{"__typename":"DeepDives","uuid":"38f07434-f89d-4797-99ee-e9f2d4508d33","content":"\u003cp\u003eThis summer, I'll be traveling to London to conduct archival research on Jewish converts to Christianity in medieval London. I think it's an interesting case of racial and religious intersection, and a chance to dive into a surprisingly rich historical record. I'm also excited to explore new corners of London, and see a West End show!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"98257c72-57ec-4e19-bca8-fb555ec7d23b\"}":{"__typename":"School","uuid":"98257c72-57ec-4e19-bca8-fb555ec7d23b","name":"Phillips Academy — Andover","city":"Andover","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01810"},"Education:{\"uuid\":\"d9e3382c-b441-4ac6-8af5-8d38a2aef02f\"}":{"__typename":"Education","uuid":"d9e3382c-b441-4ac6-8af5-8d38a2aef02f","school":{"__ref":"School:{\"uuid\":\"98257c72-57ec-4e19-bca8-fb555ec7d23b\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"cb21140e-1a80-4d6f-a12d-027e9bf810ad\"}":{"__typename":"Education","uuid":"cb21140e-1a80-4d6f-a12d-027e9bf810ad","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biology \u0026 English","degree":null},"MentorPublicProfile:{\"uuid\":\"1595e1c8-112a-45b1-b27a-4baf1513760a\"}":{"__typename":"MentorPublicProfile","uuid":"1595e1c8-112a-45b1-b27a-4baf1513760a","displayName":"Ethan S.","slug":"ethan-sun-1","biography":"\u003cp\u003eHi! My name is Ethan, and I'm a junior Biology and English major at the University of Pennsylvania. I have experience spanning research, journalism, and management consulting—fields that, while dissimilar, together reflect what I care about most: understanding complex systems, telling compelling stories, and solving real problems.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePreviously, I worked as a student researcher in Carl June's cancer immunology lab, one of the leading research groups in the field. There, I helped identify novel antigen targets for solid tumor CAR-T cells, contributing to work at the cutting edge of cancer treatment. The experience gave me a deep appreciation for the patience and precision that rigorous science demands.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn the business side, I have professional experience in management consulting, where I learned to break down ambiguous problems and communicate solutions clearly. I also serve as an educator in my business fraternity, where I train new members on core business capabilities and help them navigate the recruiting process — something I genuinely enjoy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePerhaps closest to my heart is my work in journalism. I'm currently a features editor at 34th Street Magazine, the independent student magazine at Penn. I've written long-form pieces (between 2,000 to 4,000 words) on topics ranging from AI startup founders, college matchmaking platforms, and campus political organizing. I love to learn new things, and each story I write lets me inhabit someone else’s world for a couple weeks, before ultimately telling their story.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs you can see, I've run the gamut while in college. I'm all about pursuing disparate interests and achieving something tangible along the way. I believe that the most interesting people — and the most interesting ideas — live at the intersection of different fields. At the same time, I'm not afraid to change direction the more I discover about myself. I hope you're the same!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love to read, write, listen to podcasts (ask me for recommendations), and explore the city — most often Philly or New York — with friends. This summer, I'm hoping to pick up running and cooking. (I'll keep you posted on how that goes...)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm so excited to meet you and help bring your passions to life!\u003c/p\u003e","teachingVideoPlaybackId":"8P4NCYF2A1i4LCkPFs83UTas5CtyZzSm96eYcMcgdtA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"732da2d1-ea24-45f2-8a4d-e33c6eb8b17b\"}"},{"__ref":"Favorites:{\"uuid\":\"f7a9f1b3-39ad-4c79-85d5-ee1e0796769e\"}"},{"__ref":"Favorites:{\"uuid\":\"022395e5-515b-47d7-860b-2b192b317530\"}"}],"causesSupported":[],"major":"Biology \u0026 English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"778245be-6831-494a-9348-eb62955c8b47\"}"},{"__ref":"DeepDives:{\"uuid\":\"87a9939f-e0e3-4c
