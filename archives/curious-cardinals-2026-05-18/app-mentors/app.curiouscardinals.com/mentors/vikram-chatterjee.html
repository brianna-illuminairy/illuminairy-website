xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fdc197e5-3a35-4cc4-abf4-32ae28371cda\"}":{"__typename":"Favorites","uuid":"fdc197e5-3a35-4cc4-abf4-32ae28371cda","photoUrl":"https://ucarecdn.com/7548e83f-efc9-4fd1-b431-37a591bcafc3/","title":"The Dark Knight","type":"MOVIE"},"Favorites:{\"uuid\":\"fd01e4f1-fbd3-4fec-9fad-49d25130f54e\"}":{"__typename":"Favorites","uuid":"fd01e4f1-fbd3-4fec-9fad-49d25130f54e","photoUrl":"https://ucarecdn.com/1b85b047-e4cd-45b5-9ed1-24f1d1e8f309/","title":"All I Need - Radiohead","type":"SONG"},"Favorites:{\"uuid\":\"dca0887c-2697-48dc-a21e-4cd8a30cde78\"}":{"__typename":"Favorites","uuid":"dca0887c-2697-48dc-a21e-4cd8a30cde78","photoUrl":"https://ucarecdn.com/824f3226-df2a-4382-a2b1-842474893a50/","title":"Super Smash Brothers Ultimate","type":"GAME"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b08171a2-d798-464e-844f-8fe86f8db9c1\"}":{"__typename":"DeepDives","uuid":"b08171a2-d798-464e-844f-8fe86f8db9c1","content":"\u003cp\u003eMy dream job is to be a neuro-oncologist specializing in malignant tumors on the spine. I’ve always been fascinated by the brain and nervous system, and I want to be at the forefront of helping patients through some of the most difficult diagnoses with compassion and innovation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"30e231d5-c6cb-4d43-a267-667e49a187bd\"}":{"__typename":"DeepDives","uuid":"30e231d5-c6cb-4d43-a267-667e49a187bd","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to see all seven wonders of the world. Traveling has always been something I deeply enjoy because it gives me a greater appreciation for different cultures and histories. So far, I’ve seen Chichen Itza and the Taj Mahal, which means I’m 28 percent of the way to my goal. I’m excited to continue exploring and eventually check all seven off my list.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"d6a5f591-295c-4e18-82fa-898c96ec5e4f\"}":{"__typename":"DeepDives","uuid":"d6a5f591-295c-4e18-82fa-898c96ec5e4f","content":"\u003cp\u003eGrowing up in an Indian American and Hindu household taught me to value education, community, and lifelong learning. These principles are deeply woven into my teaching style, where I emphasize empathy  and a strong work ethic. My cultural roots also inspire me to promote self-reflection and self-understanding, helping students not just excel academically but also grow into more thoughtful and confident individuals. I believe that learning is not just about mastering content but about developing character and purpose along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2432de2c-97e3-42e1-a4d6-8349b25cc47e\"}":{"__typename":"DeepDives","uuid":"2432de2c-97e3-42e1-a4d6-8349b25cc47e","content":"\u003cp\u003eIn my spare time, I love playing table tennis and tennis on my college campus—it’s been a passion of mine since I was young and is a great way to stay active and unwind. I’m also really into alternative rock and often have bands like Radiohead and Smashing Pumpkins playing in the background. When I’m just relaxing with friends, you can usually find me playing Super Smash Bros with my roommates.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9fbeb43d-0baa-4280-97c2-03532c64f583\"}":{"__typename":"School","uuid":"9fbeb43d-0baa-4280-97c2-03532c64f583","name":"Oxford Academy","city":"Cypress","type":"HIGH","state":"California","country":"United States","zip":"90630"},"Education:{\"uuid\":\"7e5cb99c-f4b9-4f85-91b4-6d3babc21726\"}":{"__typename":"Education","uuid":"7e5cb99c-f4b9-4f85-91b4-6d3babc21726","school":{"__ref":"School:{\"uuid\":\"9fbeb43d-0baa-4280-97c2-03532c64f583\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc\"}":{"__typename":"School","uuid":"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc","name":"Claremont McKenna College","city":"Claremont","type":"COLLEGE","state":"California","country":"United States","zip":"91711"},"Education:{\"uuid\":\"24ee79d6-0073-475e-b7b6-9972951be7cb\"}":{"__typename":"Education","uuid":"24ee79d6-0073-475e-b7b6-9972951be7cb","school":{"__ref":"School:{\"uuid\":\"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"c627345a-480b-49fb-a64e-8f0f245a743a\"}":{"__typename":"MentorPublicProfile","uuid":"c627345a-480b-49fb-a64e-8f0f245a743a","displayName":"Vikram C.","slug":"vikram-chatterjee","biography":"\u003cp\u003e\u003cstrong\u003eEducation\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn high school, I reflected on the things I love doing—solving scientific problems, building strong relationships, and serving my community. I quickly discovered that medicine was the ideal career to pursue those interests. I chose to attend Claremont McKenna College—a small liberal arts college that would offer me a personal pre-med experience. Now, I am a fourth-year majoring in Neuroscience with an academic sequence in Data Science, and I will be matriculating at the Medical College of Wisconsin this summer. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eProfessional Life\u003c/strong\u003e\u003cbr\u003eMy college journey has been defined by a deep engagement in both research and patient care. From studying aggressive brain tumors at City of Hope to investigating neurodegenerative disease at UCSF, I've worked on projects that inspire me to bridge the gap between research and real-world outcomes. Outside the lab, I worked as an emergency department scribe at Pomona Valley Hospital.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm especially passionate about medical innovation. Two summers ago, I presented my abstract on Vinous CRT Catheter, a smart central venous catheter for diagnosing thrombosis, at the AIMed conference in San Diego. At my college, I'm helping develop \"RxFlow\", a business model aimed at improving communication between hospitals and external pharmacies. My long-term goal is to become a physician who helps build tools that make healthcare more efficient and accessible. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePersonal Life\u003c/strong\u003e\u003cbr\u003eOutside of medicine, I enjoy engaging with my local community. On weekends, I volunteer at the senior center to help senior citizens with smartphone and tablet issues. You'll also find me playing tennis or table tennis with anyone willing to play, or weightlifting with my roommates. Most recently, I've picked up classical guitar, and I'm working up the confidence to play a song in our next \"Tiny Hub Concert\" at the student center.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCurious Cardinals\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eBut regardless of what I'm doing, I'm driven by curiosity, community, and the desire to make a tangible impact. As a mentor with Curious Cardinals, I hope to share the lessons I've learned—both in and out of the classroom—to inspire a sense of purpose in students. Whether it’s through exploring career paths in biomedical science, or helping students discover passions of their own, I’m excited to be part of a platform that values mentorship, creativity, and lifelong learning.\u003c/p\u003e","teachingVideoPlaybackId":"JQxQrT1U02Dc00q2nrbYVIs7b7oDd02Sb01JFzT6JM9WweM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"fdc197e5-3a35-4cc4-abf4-32ae28371cda\"}"},{"__ref":"Favorites:{\"uuid\":\"fd01e4f1-fbd3-4fec-9fad-49d25130f54e\"}"},{"__ref":"Favorites:{\"uuid\":\"dca0887c-2697-48dc-a21e-4cd8a30cde78\"}"}],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b08171a2-d798-464e-844f-8fe86f8db9c1\"}"},{"__ref":"DeepDives:{\"uuid\":\"30e231d5-c6cb-4d43-a267-667e49a187bd\"}"},{"__ref":"DeepDives:{\"uuid\":\"d6a5f591-295c-4e18-82fa-898c96ec5e4f\"}"},{"__ref":"DeepDives:{\"uuid\":\"2432de2c-97e3-42e1-a4d6-8349b25cc47e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/26164e01-a7a1-4fa6-9619-1dff76a7193e/-/preview/-/format/jpg/","https://ucarecdn.com/62897141-b504-4213-a6e9-61b61e284dd6/-/preview/-/format/jpg/","https://ucarecdn.com/0b203987-6c47-4ee6-8d5f-d15d51549983/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7e5cb99c-f4b9-4f85-91b4-6d3babc21726\"}"},{"__ref":"Education:{\"uuid\":\"24ee79d6-0073-475e-b7b6
