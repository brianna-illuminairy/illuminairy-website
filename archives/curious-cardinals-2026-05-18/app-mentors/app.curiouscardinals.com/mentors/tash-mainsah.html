xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6079b663-2532-43b6-b98e-81408da49a64\"}":{"__typename":"Favorites","uuid":"6079b663-2532-43b6-b98e-81408da49a64","photoUrl":"https://ucarecdn.com/33cea8be-2c59-4c9b-9410-941e0e8dc94e/","title":"Rachel Chinouriri","type":"ARTIST"},"Favorites:{\"uuid\":\"6088442f-c252-4148-9b0c-696b39d8d68d\"}":{"__typename":"Favorites","uuid":"6088442f-c252-4148-9b0c-696b39d8d68d","photoUrl":"https://ucarecdn.com/b8545bf7-e691-406f-ba7d-2bcb2d508f1a/","title":"Manchester United!!! Ohhh United we love you \u003c3","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"5e3041a1-9e2a-4f7d-a66a-d36c9af2a1b1\"}":{"__typename":"Favorites","uuid":"5e3041a1-9e2a-4f7d-a66a-d36c9af2a1b1","photoUrl":"https://ucarecdn.com/ea15560c-189c-465b-aac3-31bf7a81d6d4/","title":"Èze, on the French Riviera","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"38bbfd1e-f437-4f8d-9f97-dc2b09685962\"}":{"__typename":"DeepDives","uuid":"38bbfd1e-f437-4f8d-9f97-dc2b09685962","content":null,"videoPlaybackId":"BIMUVO400OMgPlQ01MgZTPCCANCrMmti3vStPntdzU8x4","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"557f8ec7-843d-4172-9bf6-f5e77814ac40\"}":{"__typename":"DeepDives","uuid":"557f8ec7-843d-4172-9bf6-f5e77814ac40","content":"\u003cp\u003eI have spent the past few years returning to my love of reading that shaped my childhood. I try to read widely across genres and authors of different identities. Two of my favorite authors are Toni Morrison and Kazuo Ishiguro, and some of the best books I've read this year include So Long, See You Tomorrow by William Maxwell, and Poor Deer by Claire Oshetsky. I would love to reread some of my favorite novels from my childhood (including A Series of Unfortunate Events and The Mysterious Benedict Society) to see if they still hold up!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"99e374b1-2933-4656-9fd5-412b93e5c432\"}":{"__typename":"DeepDives","uuid":"99e374b1-2933-4656-9fd5-412b93e5c432","content":"\u003cp\u003eOne of the hardest and most rewarding things I have ever done is run the Houston Marathon in January 2025. I was never particularly athletic as a child (I'm sure my high school volleyball coach thought my 5'9 frame was wasted on such an uncoordinated girl!). My father, however, has run dozens of marathons, and I always wanted to run one in honor of him and his achievements. When I ran my first 3 miles, I thought it would be impossible for me to ever get into marathon shape. But after over a year of training, I was able to get myself across the finish line in 4 hrs and 30 minutes. Those four hours taught me more about my mental fortitude than I could have ever imagined, and I am so proud of my body and my mind for pushing me through.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"2bb40a56-66b0-45f2-9dbe-1dc4d9eba14a\"}":{"__typename":"DeepDives","uuid":"2bb40a56-66b0-45f2-9dbe-1dc4d9eba14a","content":"\u003cp\u003eI was a very shy adolescent, and struggled to make friends. School, therefore, was always first and foremost about learning. I loved English and Science in middle school, and it was during middle school that I was first introduced to public speaking. I took a class that taught me rhetorical and presentation skills that I still rely on to this day, and this led to me taking on several leadership roles in high school, including president of the Black affinity club ONYX and day student representative in school government. And luckily, I was able to make a few incredible friends who I am still close with to this day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"da669ac9-ed5e-40c0-82e9-6926adc80735\"}":{"__typename":"School","uuid":"da669ac9-ed5e-40c0-82e9-6926adc80735","name":"The Masters School","city":"Dobbs Ferry","type":"HIGH","state":"New York","country":"United States","zip":"10522"},"Education:{\"uuid\":\"dcb4b9be-e80b-4439-b66a-539e113c3b39\"}":{"__typename":"Education","uuid":"dcb4b9be-e80b-4439-b66a-539e113c3b39","school":{"__ref":"School:{\"uuid\":\"da669ac9-ed5e-40c0-82e9-6926adc80735\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"f98897c3-cfcb-4a02-96b5-cbb83bf32013\"}":{"__typename":"Education","uuid":"f98897c3-cfcb-4a02-96b5-cbb83bf32013","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Human Biology","degree":null},"Testimonial:aa342aba-c77d-46bb-b986-e5da3b59636f":{"__typename":"Testimonial","id":"aa342aba-c77d-46bb-b986-e5da3b59636f","text":"Tash has been an incredible mentor for Saaya. From the very beginning, she has brought a warm, positive, and encouraging approach that helped Saaya feel comfortable exploring her creativity. Tash breaks things down step by step, making complex ideas in songwriting and music production easy to understand and apply. She celebrates Saaya’s progress at every stage, building her confidence while also challenging her to grow.\n\nNow, she is helping Saaya explore new tools and techniques that are opening even more growth opportunities. We’re excited to see how this mentorship continues to evolve and look forward to what they will accomplish together.","date":"2025-08-20 17:04:36.244+00","rating":5,"endorser":{"__typename":"Endorser","name":"Dhaval Patel","tagline":"","avatar":null}},"Testimonial:f5de1a79-6aad-4c10-a979-c75512339c2e":{"__typename":"Testimonial","id":"f5de1a79-6aad-4c10-a979-c75512339c2e","text":"Tash worked closely with our daughter to achieve a mature, engaging, and exciting result over the summer. Both Tash and our daughter exceeded my expectations for their work. Highly recommended mentorship!","date":"2025-08-15 06:17:42.014+00","rating":5,"endorser":{"__typename":"Endorser","name":"David Eichenbaum","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"4cc135b9-194e-45e1-ae90-dc1dda97b340\"}":{"__typename":"MentorPublicProfile","uuid":"4cc135b9-194e-45e1-ae90-dc1dda97b340","displayName":"Tash M.","slug":"tash-mainsah","biography":"\u003cp\u003eHello! I’m Tash Mainsah, a multi-hyphenate who has spent her life navigating (and celebrating) complexity. I was born in Southampton, England, raised in both the UK and New York, and shaped by family roots that stretch across Zambia and Cameroon. Some of my most cherished memories are from my grandparents’ farm in Lusaka, feeding the chickens and learning how to cook our traditional Zambian dishes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve been fascinated by the brain since I was 12 years old, when I read Michio Kaku’s \u003cem\u003eThe\u003c/em\u003e \u003cem\u003eFuture of the Mind \u003c/em\u003eand decided I wanted to be a neurologist. That early spark led me to Stanford University, where I studied Human Biology and had the surreal experience of taking several neurobiology courses from Robert Sapolsky: the very professor whose lectures I had watched wide-eyed on YouTube throughout high school. Outside of my major, I explored a wide range of passions: songwriting, spoken word, African American literature, and public speaking. I also received a French notation, and was able to flex my language muscles during my semester abroad and during my year living and working in Paris after graduation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy path hasn’t always been linear. As a first-generation African student in a predominantly white academic world, I struggled with imposter syndrome that ultimately pulled me away from my dream of becoming a doctor. But in the years after college— particularly during my tenure at Boston Consulting Group— I gained confidence by proving, again and again, that I was capable, adaptable, and resilient. That growth reignited my passion for medicine, and I’m now back on the path toward becoming a physician as a post-bac premedical student at Columbia University.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also currently serve as Co-Chair and CEO of the Rosemary Education Foundation, a nonprofit founded in honor of my grandmother, Rosemary Yenge Ndi. We support students in Cameroon and Zambia through scholarships, academic programming, and research initiatives. Leading this work has deepened my commitment to educational access, youth empowerment, and supporting the African diaspora.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my greatest hope is to help students develop the kind of confidence it took me years to build. I want to be the person in their corner who reminds them, especially when the world tries to tell them otherwise, that they are more than enough. That their voice matters. That they can do hard things. Whether we’re working through chemistry problems, workshopping college essays, or exploring a passion in poetry or songwriting, I’ll bring the same care, curiosity, and heart that shaped my own journey.\u003c/p\u003e","teachingVideoPlaybackId":"U01yhTDKowV1Yq9T8TWQ67xVmyfbJ4fGnqSJ9OrgwCd00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6079b663-2532-43b6-b98e-81408da49a64\"}"},{"__ref":"Favorites:{\"uuid\":\"6088442f-c252-4148-9b0c-696b39d8d68d\"}"},{"__ref":"Favorites:{\"uuid\":\"5e3041a1-9e2a-4f7d-a66a-d36c9af2a1b1\"}"}],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"38bbfd1e-f437-4f8d-9f97-dc2b09685962\"}"},{"__ref":"DeepDives:{\"uuid\":\"557f8ec7-843d-4172-9bf6-f5e77814ac40\"}"},{"__ref":"DeepDives:{\"uuid\":\"99e374b1-2933-4656-9fd5-412b93e5c432\"}"},{"__ref":"DeepDives:{\"uuid\":\"2bb40a56-66b0-45f2-9dbe-1dc4d9eba14a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/54147f4a-eb64-4039-b612-e71e8de4d0e6/-/preview/-/format/jpg/","https://ucarecdn.com/03ab80cd-4deb-474f-bd56-50f77a769fe3/-/preview/-/format/jpg/","https://ucarecdn.com/2876bee7-9806-4f9c-bb19-1caaee54781d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"dcb4b9be-e80b-4439-b66a-539e113c3b39\"}"},{"__ref":"Education:{\"uuid\":\"f98897c3-cfcb-4a02-96b5-cbb83bf32013\"}"}],"hiredAt":"2025-05-14T13:09:06.731Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Chemistry","Physics","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","Creative Writing","Music","Business / Entrepreneurship","Medicine / Health","STEM Project","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:aa342aba-c77d-46bb-b986-e5da3b59636f"},{"__ref":"Testimonial:f5de1a79-6aad-4c10-a979-c75512339c2e"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tash-mainsah\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4cc135b9-194e-45e1-ae90-dc1dda97b340\"}"}}},"_sentryTraceData":"f6204aadb569407bb880fe03622244c8-b92028e84d11fe78-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f6204aadb569407bb880fe03622244c8,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"tash-mainsah"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
