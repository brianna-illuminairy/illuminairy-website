xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"72838f9e-9629-4093-a5cd-b47aebe27bf4\"}":{"__typename":"Favorites","uuid":"72838f9e-9629-4093-a5cd-b47aebe27bf4","photoUrl":"https://ucarecdn.com/0cad4783-c76c-45f1-8e9a-8b9dbdfc5c8c/","title":"Noah kahan Stick Season","type":"ALBUM"},"Favorites:{\"uuid\":\"9e305f85-3a6e-433e-ba03-d64561d267d4\"}":{"__typename":"Favorites","uuid":"9e305f85-3a6e-433e-ba03-d64561d267d4","photoUrl":"https://ucarecdn.com/b727ba86-8644-486e-aa9f-be35139a8402/","title":"A Picture of Dorian Gray","type":"BOOK"},"Favorites:{\"uuid\":\"0057ce77-0759-4d1d-bb28-49f6eadd3c98\"}":{"__typename":"Favorites","uuid":"0057ce77-0759-4d1d-bb28-49f6eadd3c98","photoUrl":"https://ucarecdn.com/6c56b577-5574-428c-9adc-77f98b7afe1a/","title":"Rowing ","type":"SPORT"},"CausesSupported:{\"uuid\":\"d9229e02-79d6-4c1c-baa1-6efe4b33c102\"}":{"__typename":"CausesSupported","uuid":"d9229e02-79d6-4c1c-baa1-6efe4b33c102","name":"National YMCA","description":"\u003cp\u003eI serve on the National YMCA Board right now as a youth advisory!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"87ab2e9a-37c7-4338-8ecb-87ba890d2085\"}":{"__typename":"DeepDives","uuid":"87ab2e9a-37c7-4338-8ecb-87ba890d2085","content":"\u003cp\u003eMentorship matters to me because it can completely change the way a student sees themselves. A strong mentor does more than teach, they rather build confidence, offer perspective, and help make big goals feel reachable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve seen how powerful mentorship can be in my own life, and that’s why I care so much about giving that back. I want students to feel like they have someone in their corner: someone who can challenge them, support them, and help them grow not just academically, but personally. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo me, mentorship is about creating the kind of guidance that makes students more confident, curious, and willing to take risks.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9d562f9f-2f49-4846-94cf-15b39b3de8d1\"}":{"__typename":"DeepDives","uuid":"9d562f9f-2f49-4846-94cf-15b39b3de8d1","content":"\u003cp\u003eI chose to study Political Science and Economics because they sit at the intersection of how decisions are made and how they impact people in the real world. Economics helps explain outcomes—how resources are allocated and why—while political science focuses on how those decisions are actually shaped and implemented.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy interest in this intersection grew through my experience on the national YMCA and my state’s Governor’s advisory board. In both roles, I saw how policy moves from ideas to action, and how those decisions carry real economic and social consequences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I chose this path because it allows me to understand not just what works, but how to create meaningful impact through policy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c74f6edb-a09b-41cb-818d-34dd3c472271\"}":{"__typename":"DeepDives","uuid":"c74f6edb-a09b-41cb-818d-34dd3c472271","content":"\u003cp\u003eI would tell my middle and high school self to focus more on appreciating the process, not just the outcome. It’s easy to get caught up in grades, results, and external validation, but the real value comes from the effort you put in, the mistakes you make, and the growth that happens along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome of the most meaningful progress comes from moments that don’t feel successful at the time, struggling through a difficult concept, taking a risk on something new, or putting in work without immediate recognition. Those experiences build resilience, curiosity, and confidence in a way that outcomes alone never can.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d remind myself that learning isn’t about being perfect, it’s about being consistent, open to failure, and willing to improve. If you can learn to enjoy the process, the results will follow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"79f07ae2-94df-4a57-a57f-07f49d307a6e\"}":{"__typename":"DeepDives","uuid":"79f07ae2-94df-4a57-a57f-07f49d307a6e","content":"\u003cp\u003eI was the kind of student who was always doing something—and somehow making it all work. I was deeply involved across the board, balancing academics, leadership roles, and extracurriculars, while still being someone who loved being around people. I took on a lot, not because I had to, but because I was genuinely curious and excited to be involved in different spaces.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI thrived in environments where I could lead, collaborate, and build things with others, whether that was through student organizations, policy work, or team-based projects. At the same time, I was very social—I valued friendships, energy, and being part of a community just as much as I valued achievement.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFrom the outside, it probably looked like I had everything figured out, but in reality, I was constantly learning how to manage my time, take risks, and push myself into new opportunities. I liked being the person who said yes, who showed up, and who made things happen.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, I’d describe myself as driven, curious, and very engaged—someone who wanted to do it all, and found a way to.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"485b5212-5298-4ff3-a240-b7ffbf6be3d6\"}":{"__typename":"School","uuid":"485b5212-5298-4ff3-a240-b7ffbf6be3d6","name":"Altavista Middle \u0026 High School","city":"Altavista","type":"HIGH","state":"Virginia","country":"United States","zip":"24517"},"Education:{\"uuid\":\"7f0679d6-ac0c-4cc0-8e25-49d26c2dedd8\"}":{"__typename":"Education","uuid":"7f0679d6-ac0c-4cc0-8e25-49d26c2dedd8","school":{"__ref":"School:{\"uuid\":\"485b5212-5298-4ff3-a240-b7ffbf6be3d6\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"b9af9619-973d-43dc-9008-65fff27c1e41\"}":{"__typename":"Education","uuid":"b9af9619-973d-43dc-9008-65fff27c1e41","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Political-Science/Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"8f278676-9a0c-4971-a328-1bd4b5f1a36f\"}":{"__typename":"MentorPublicProfile","uuid":"8f278676-9a0c-4971-a328-1bd4b5f1a36f","displayName":"Conner W.","slug":"conner-william","biography":"\u003cp\u003eI’m passionate about helping students turn curiosity into confidence. At my core, I care deeply about learning, not just memorizing information, but rather understanding how to think, ask better questions, and approach challenges with creativity and resilience. I believe every student has the potential to excel when they feel supported, seen, and encouraged to explore what genuinely interests them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I’ve spent my time focusing on building a strong foundation in critical thinking, problem-solving, and communication. Whether studying in structured classroom environments or pursuing independent learning, I’ve always been drawn to subjects that challenge me to connect ideas across disciplines. I’m especially interested in how knowledge can be applied in real-world contexts, and I enjoy helping others see those connections in ways that make learning more engaging and meaningful. From Economics and Philosophy, to Physics and Calculus, I've done it!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’ve been actively involved in extracurricular and professional experiences that emphasize collaboration, leadership, and mentorship. I’ve worked on projects that required teamwork, adaptability, and initiative, from policy collaboration with the national YMCA, to helping draft legislation for my home state. Now in college, I work in the policy space with Columbias economic policy institute, alongside being involved in student investment funds and other financial groups. Mentorship, in particular, has been a rewarding experience for me, guiding students, answering questions, and helping them build confidence in their abilities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the things I bring as a mentor is a personalized approach. I understand that every student learns differently, and I take the time to adapt to each student’s pace, goals, and interests. Whether it’s breaking down complex concepts, preparing for academic challenges, or exploring new topics, I aim to create a supportive and engaging environment where students feel comfortable asking questions and taking intellectual risks, so they can then execute.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf I could share one key piece of advice, it would be this: don’t be afraid to do it. Growth often comes from moments of uncertainty, and learning how to take risk is one of the most valuable skills you can develop. My goal as a mentor is to guide students through that process, helping them build not just knowledge, but confidence and independence as learners.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to work with students and families who value curiosity, effort, and a growth mindset. Together, we can make learning an experience that is not only productive, but genuinely enjoyable.\u003c/p\u003e","teachingVideoPlaybackId":"L01sFzn35Qdv6CXLYHz83pgVUblbTfoCx6ASGzlZRGsg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I’m most proud of is becoming a Coca-Cola Scholar, especially given where I come from. As a rural student, opportunities and exposure can sometimes feel limited, and before me, no one from my school—or even my broader region—had ever reached that level in the program.\u003c/p\u003e\u003cp\u003eWhat makes this especially meaningful isn’t just the recognition, but what it represents. It reflects years of pushing myself to pursue opportunities that weren’t always clearly laid out, taking initiative in spaces where I didn’t always have a roadmap, and believing that my background didn’t have to define my ceiling. There were plenty of moments where it would have been easier to stay within what was familiar, but I chose to step outside of that and aim higher.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt also feels bigger than just a personal achievement. In many ways, it set a new precedent—showing that students from my community can compete on a national level and be recognized at the highest level. That’s something I take a lot of pride in, because it opens the door for others who come from similar backgrounds.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore than anything, this experience reinforced my belief that where you start doesn’t limit where you can go, and that mindset continues to shape how I approach new challenges.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"72838f9e-9629-4093-a5cd-b47aebe27bf4\"}"},{"__ref":"Favorites:{\"uuid\":\"9e305f85-3a6e-433e-ba03-d64561d267d4\"}"},{"__ref":"Favorites:{\"uuid\":\"0057ce77-0759-4d1d-bb28-49f6eadd3c98\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"d9229e02-79d6-4c1c-baa1-6efe4b33c102\"}"}],"major":"Political-Science/Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"87ab2e9a-37c7-4338-8ecb-87ba890d2085\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d562f9f-2f49-4846-94cf-15b39b3de8d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"c74f6edb-a09b-41cb-818d-34dd3c472271\"}"},{"__ref":"DeepDives:{\"uuid\":\"79f07ae2-94df-4a57-a57f-07f49d307a6e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8fb2c974-d9f5-4e33-8ddd-9c66aa5d8aeb/-/preview/-/format/jpg/","https://ucarecdn.com/7964f1b2-df6e-42fc-9f1f-cb5878294a69/-/preview/-/format/jpg/","https://ucarecdn.com/86b90f2e-2a9a-46e9-a283-154ae73df30b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7f0679d6-ac0c-4cc0-8e25-49d26c2dedd8\"}"},{"__ref":"Education:{\"uuid\":\"b9af9619-973d-43dc-9008-65fff27c1e41\"}"}],"hiredAt":"2026-04-03T17:43:17.349Z","topics":["History Project","Finance / Investing","Business / Entrepreneurship","Medicine / Health","STEM Project","Law / Government / Policy","Sustainability","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"conner-william\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8f278676-9a0c-4971-a328-1bd4b5f1a36f\"}"}}},"_sentryTraceData":"83d296c75f444fd69ac23eb81e196237-ace2609972651ad6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=83d296c75f444fd69ac23eb81e196237,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"conner-william"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
