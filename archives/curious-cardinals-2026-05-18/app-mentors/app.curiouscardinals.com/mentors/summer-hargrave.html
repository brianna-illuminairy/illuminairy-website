xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c8597ef4-bc79-412f-9322-4cc07275d02d\"}":{"__typename":"DeepDives","uuid":"c8597ef4-bc79-412f-9322-4cc07275d02d","content":"\u003cp\u003eOne of my favorite passion projects came out of an internship with an Indigenous healthcare design agency in New Zealand during my junior year at Dartmouth. Determined to make the most of my eight weeks with their team and truly get to know the people behind the designers, I made it a goal to invite each of my 16 team member out for a one-on-one coffee at the office’s favorite café. I asked about their stories: where they’re from, what drives them, and the biggest piece of advice they’d give to someone like me, just starting out in impact-driven design. From Emma’s reminder to always follow my humanity and seize unconventional opportunities, to Livvy’s growth mindset of always pushing herself to be comfortable being uncomfortable, these conversations defined my love of this internship. Every conversation taught me that meaningful design work starts with building team connections, and that just being curious, intentional, and compassionate anywhere I go will allow me to make an impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1487e76e-8a93-4931-89eb-1038769e11d8\"}":{"__typename":"DeepDives","uuid":"1487e76e-8a93-4931-89eb-1038769e11d8","content":"\u003cp\u003eThe most important thing that motivates me, both as a designer and as a human, is knowing that what I’m working on is meaningful to someone else and is about fostering connection. In all of my creative experiences, whether it’s joining the staff at Dartmouth’s makerspace to help others discover the joy of making, or regularly seeking out long-term, global opportunities where I can truly immerse myself in a new place and culture, I’m driven by the chance to contribute to something bigger than myself. It’s the feeling of being part of a shared experience, of creating something that brings people together and helps me learn and grow in whatever I do, that inspires me always.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"9fde4519-1cb0-436b-a4e8-e721119cda72\"}":{"__typename":"DeepDives","uuid":"9fde4519-1cb0-436b-a4e8-e721119cda72","content":"\u003cp\u003eJennifer Caine, my favorite studio art professor and easily the most thoughtful, well-spoken, and introspective person I’ve ever met, has been my biggest inspiration in how I want to engage with the world. Even though I don’t plan on becoming an artist like her, she’s taught me so much about understanding and expressing your values, and how those values should drive the work you do. She has a way of helping me put words to things I’ve been trying to figure out about myself, in a way I couldn’t do on my own. Whenever I think about what a meaningful career or life looks like, I always come back to her—her confidence when she speaks, her groundedness, and the way she sees the world and her place in it. That’s the kind of clarity and purpose I hope to both embody and to help others discover.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1a94ec41-a7ca-4950-8c8b-89128e874dd0\"}":{"__typename":"DeepDives","uuid":"1a94ec41-a7ca-4950-8c8b-89128e874dd0","content":"\u003cp\u003eWhen I’m not in class or working on design projects, you’ll find me off on some ambitious side quest. Whether it’s jumping into the freezing Connecticut River every day during my senior spring or training to hike 50 miles from Mount Moosilauke to Dartmouth’s campus as part of a long-standing tradition, I’m always looking for ways to push myself outside my comfort zone. And while those bigger challenges are some of the most memorable, these adventures also exist in smaller moments, like spontaneously entering a local chili cook-off without a plan and\u0026nbsp;snagging third place!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3519acef-86f8-4772-9cc0-1584b8ff9097\"}":{"__typename":"School","uuid":"3519acef-86f8-4772-9cc0-1584b8ff9097","name":"Ravenscroft School","city":"Raleigh","type":"HIGH","state":"North Carolina","country":"United States","zip":"27615"},"Education:{\"uuid\":\"fb662129-51e0-43b1-82d2-f1907d6cdf55\"}":{"__typename":"Education","uuid":"fb662129-51e0-43b1-82d2-f1907d6cdf55","school":{"__ref":"School:{\"uuid\":\"3519acef-86f8-4772-9cc0-1584b8ff9097\"}"},"startYear":"2019","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"e7721da1-a698-47c6-b931-404ee13cdddc\"}":{"__typename":"Education","uuid":"e7721da1-a698-47c6-b931-404ee13cdddc","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Studio Art + Human-Centered Design","degree":null},"MentorPublicProfile:{\"uuid\":\"3e127180-1751-4af3-8431-2f50f556fe5e\"}":{"__typename":"MentorPublicProfile","uuid":"3e127180-1751-4af3-8431-2f50f556fe5e","displayName":"Summer H.","slug":"summer-hargrave","biography":"\u003cp\u003eI’m a senior at Dartmouth studying studio art and human-centered design, driven by a passion for making impact and exploring the world. My academic path hasn’t been a straight line—I started college planning to go into scientific research, but somewhere along the way, I stumbled into design thinking and completely fell in love with creative problem-solving. That shift opened up a whole new way of seeing the world and taught me how powerful it can be to follow what genuinely excites you, even if it’s unexpected. After graduation, I’m heading to Ecuador for a year to work with two environmental conservation NGOs on a self-developed project focused on designing educational children’s books and creating workshops for a local youth eco-club.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class, creating continues to remain at the heart of who I am. Whether I’m designing an app or website, making laser-cut jewelry at the makerspace where I work as a teaching assistant, or pulling letterpress prints for friends, I feel most alive when I’m bringing something new to life and exploring my voice through the process. I also love being outdoors. After growing up in Florida where outdoor adventures weren’t always easy to access, I’ve embraced every chance to explore New England’s wilderness. From daily dips in the Connecticut River, to hiking in the White Mountains, to leading kayaking trips with\u0026nbsp; Ledyard Canoe Club, spending time outside has become just as essential to me as making things. As a certified flatwater and sea kayaking leader, I’ve even led students on multi-day trips through the Great Lakes, Canada, and New Zealand—some of my favorite memories from college so far.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver my four years at Dartmouth, I’ve thrown myself into independent research and unconventional experiences, opportunities that have shaped me more than anything else. They’ve taught me to lead with thoughtfulness, compassion, and curiosity, while always staying open to challenges and change. This is the perspective I bring to everything I do, including my work as a mentor with Curious Cardinals. I’m passionate about helping students tap into their interests and design the kind of impact they want to have on the world. Whether it’s narrowing down a research focus, finding global opportunities that align with their passions, or building a creative portfolio or startup idea, I’m here to help them chart a path that’s exciting, meaningful, and full of possibilities.\u003c/p\u003e","teachingVideoPlaybackId":"OxF00y6aSO01ol7uZaru65uSOKMcEerIEojIpCxo028SXI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Studio Art + Human-Centered Design","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c8597ef4-bc79-412f-9322-4cc07275d02d\"}"},{"__ref":"DeepDives:{\"uuid\":\"1487e76e-8a93-4931-89eb-1038769e11d8\"}"},{"__ref":"DeepDives:{\"uuid\":\"9fde4519-1cb0-436b-a4e8-e721119cda72\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a94ec41-a7ca-4950-8c8b-89128e874dd0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b3410b4a-5ebf-45dc-a2b6-f101c7a4e623/-/preview/-/format/jpg/","https://ucarecdn.com/d2af5b30-0d41-4769-ab06-44a8a20d8058/-/preview/-/format/jpg/","https://ucarecdn.com/f0b2b8b7-3868-44f6-8b60-ed380f8767fd/-/preview/-/format/jpg/"],"pronouns":"SHE
