xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4d9baf7a-c6eb-46e4-b2dd-855efd5571f2\"}":{"__typename":"Favorites","uuid":"4d9baf7a-c6eb-46e4-b2dd-855efd5571f2","photoUrl":"https://ucarecdn.com/ba4f29de-fc7d-47d5-90fb-a9a4a68dc738/","title":"the melodic blue - baby keem","type":"ALBUM"},"Favorites:{\"uuid\":\"f07d5c97-1673-4e70-bbb0-67939e69a2b5\"}":{"__typename":"Favorites","uuid":"f07d5c97-1673-4e70-bbb0-67939e69a2b5","photoUrl":"https://ucarecdn.com/0f4e6998-7c80-4da6-a8b5-cdb549c89787/","title":"baby keem","type":"ARTIST"},"Favorites:{\"uuid\":\"4cef88b1-e96a-4647-95d0-fac1ae84f2c1\"}":{"__typename":"Favorites","uuid":"4cef88b1-e96a-4647-95d0-fac1ae84f2c1","photoUrl":"https://ucarecdn.com/eec01d91-b913-40a1-a490-de4effdfa994/","title":"steph curry","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"dfd8125f-1d90-4029-a9e4-04aa06033660\"}":{"__typename":"CausesSupported","uuid":"dfd8125f-1d90-4029-a9e4-04aa06033660","name":"North South Foundation","description":"\u003cp\u003eHelped organize the event and judge competitions\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3a89694a-b9e0-44d4-8bb9-72b3072f6110\"}":{"__typename":"DeepDives","uuid":"3a89694a-b9e0-44d4-8bb9-72b3072f6110","content":"\u003cp\u003eA passion project I’m currently working on is an app called Resonate. Resonate is designed to help people build connections over their shared interests, providing a platform for meaningful conversations and community building. The idea for Resonate stemmed from my own experiences and the desire to create a space where people can find others who share their passions, whether it’s about books, movies, hobbies, or any other interests.\u003c/p\u003e\u003cp\u003eIn developing Resonate, I’ve been involved in every aspect of the project, from brainstorming the initial concept to working on the design and user experience. The goal is to create an intuitive and engaging app that makes it easy for users to connect and share their interests. One of the most rewarding parts of this project has been seeing how it can bring people together and foster new friendships.\u003c/p\u003e\u003cp\u003eWorking on Resonate has also allowed me to apply my skills in product management, engineering, and design, while continuously learning and adapting based on user feedback. It’s been an incredible journey, and I’m excited to see how Resonate will evolve and impact people’s lives by helping them build meaningful connections.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d904f1f9-bb04-4212-9d3d-43a1f9c52114\"}":{"__typename":"DeepDives","uuid":"d904f1f9-bb04-4212-9d3d-43a1f9c52114","content":"\u003cp\u003eIn my spare time, my biggest hobby is sports, specifically basketball. I love watching the NBA, especially seeing Steph Curry dance around the court and shoot those incredible 3s. The Warriors and the Rockets are my favorite teams to watch. I also enjoy sports debate shows and love debating with my friends, especially when it comes to fantasy basketball.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy second biggest hobby is music. You can catch me vibing to music almost half the day. I listen to all types of music: rap, R\u0026amp;B, pop, indie, country, and folk. I’ve played the saxophone for 7 years, the piano for 4 years, and I’m currently learning guitar. I plan to learn drums next. I also enjoy learning to dance, which is a fun and expressive hobby for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not immersed in sports or music, I love getting food with friends or getting into nature. Whether it's exploring new places to eat or just enjoying a peaceful hike, I value spending quality time and creating memorable experiences with those close to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c13a7d79-d83a-476b-96fc-24a8a2685a7d\"}":{"__typename":"DeepDives","uuid":"c13a7d79-d83a-476b-96fc-24a8a2685a7d","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I would emphasize the importance of self-exploration. While academics and grades are undeniably important and you shouldn't slack on them, it's equally crucial to try new things and figure out what you like and what you're good at. This kind of exploration can help you develop a sense of purpose in the long term.\u003c/p\u003e\u003cp\u003eI would suggest exploring in three key areas: academics, athletics, and the arts. Academics are vital for building a strong foundation for your future, so give your best effort in school. However, don't let your focus on grades prevent you from pursuing other interests.\u003c/p\u003e\u003cp\u003eIn athletics, try out different sports and physical activities. Whether it's basketball, soccer, or swimming, find something that keeps you active and engaged. Athletics can teach you valuable life skills such as teamwork, discipline, and perseverance.\u003c/p\u003e\u003cp\u003eIn the arts, don't be afraid to experiment with music, painting, theater, or any other creative pursuit. These activities can provide a wonderful outlet for self-expression and can help you discover hidden talents.\u003c/p\u003e\u003cp\u003eBy exploring a variety of interests, you'll not only gain a well-rounded experience but also find what truly excites and motivates you. This will help you develop a more fulfilling and purposeful life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"fbe8f726-e57f-44d6-8fd7-88949d974aed\"}":{"__typename":"DeepDives","uuid":"fbe8f726-e57f-44d6-8fd7-88949d974aed","content":"\u003cp\u003eMyself in 5 years\u003c/p\u003e\u003cbr\u003e\u003cp\u003e(Check out Matthew McCounaughey's Oscar speech in 2014)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"35d1b595-abe1-4742-978c-1a8b3f822b77\"}":{"__typename":"School","uuid":"35d1b595-abe1-4742-978c-1a8b3f822b77","name":"Glenda Dawson High School","city":"Pearland","type":"HIGH","state":"Texas","country":"United States","zip":"77581"},"Education:{\"uuid\":\"a9723090-1a95-43b7-9620-f429b6cbd1f2\"}":{"__typename":"Education","uuid":"a9723090-1a95-43b7-9620-f429b6cbd1f2","school":{"__ref":"School:{\"uuid\":\"35d1b595-abe1-4742-978c-1a8b3f822b77\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"be19ff72-4776-498e-8fbd-cbe23977912b\"}":{"__typename":"Education","uuid":"be19ff72-4776-498e-8fbd-cbe23977912b","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"883ac5d4-f666-497e-97ab-986091430463\"}":{"__typename":"MentorPublicProfile","uuid":"883ac5d4-f666-497e-97ab-986091430463","displayName":"Siddharth K.","slug":"sid-krishnakumar","biography":"\u003cp\u003eHello! My name is Siddharth, and I'm thrilled to be a part of the Curious Cardinals community as a mentor. I have passions at the intersection of technology, math/science, and creativity to make the world a better place.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic and professional journey has been driven by a relentless curiosity and a desire to solve real-world problems. I'm pursuing a degree in Electrical Engineering from Duke University. During my time at university, I delved into various projects, ranging from designing circuits to working on renewable energy solutions, which honed my technical skills and fueled my passion for innovation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUpon graduation, I will be joining Microsoft as a Product Manager, where I will work on exciting projects that blend technology and user needs. My role will involve overseeing the development lifecycle of products, from ideation and design to execution and launch. I will work closely with cross-functional teams, including engineers, designers, and marketers, to ensure that the products we create are not only functional but also delightful to use.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my upcoming role at Microsoft, I am also working on a startup app called Resonate. Resonate aims to help people build connections over their shared interests, providing a platform for meaningful conversations and community building.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship is a natural extension of my love for learning and teaching. I've always enjoyed breaking down complex concepts into understandable and relatable terms, making the learning process engaging and enjoyable. I believe that mentoring is a two-way street—while I impart my knowledge, I also learn from the fresh perspectives and ideas that my mentees bring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my professional pursuits, I am an avid NBA basketball fan and love participating in fantasy basketball leagues. Music is another one of my passions—I enjoy listening to a wide range of genres, including rap, country, indie, and folk. I also love learning new instruments and can play the piano, saxophone, and guitar. Additionally, I love to dance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to embarking on this learning journey with you. Together, we can explore your interests, develop your skills, and unlock your potential. Let's connect, learn, and grow together!\u003c/p\u003e","teachingVideoPlaybackId":"QE6QV4k00PP36nLv9ePkC900K9pwH5K6qksvZ4gVSmKr8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003e4th place in the national spelling bee in 7th grade -- feels like so long ago though\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4d9baf7a-c6eb-46e4-b2dd-855efd5571f2\"}"},{"__ref":"Favorites:{\"uuid\":\"f07d5c97-1673-4e70-bbb0-67939e69a2b5\"}"},{"__ref":"Favorites:{\"uuid\":\"4cef88b1-e96a-4647-95d0-fac1ae84f2c1\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"dfd8125f-1d90-4029-a9e4-04aa06033660\"}"}],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3a89694a-b9e0-44d4-8bb9-72b3072f6110\"}"},{"__ref":"DeepDives:{\"uuid\":\"d904f1f9-bb04-4212-9d3d-43a1f9c52114\"}"},{"__ref":"DeepDives:{\"uuid\":\"c13a7d79-d83a-476b-96fc-24a8a2685a7d\"}"},{"__ref":"DeepDives:{\"uuid\":\"fbe8f726-e57f-44d6-8fd7-88949d974aed\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f14ed035-5e85-476a-aec7-3e1b79139fb5/-/preview/-/format/jpg/"],"pronou
