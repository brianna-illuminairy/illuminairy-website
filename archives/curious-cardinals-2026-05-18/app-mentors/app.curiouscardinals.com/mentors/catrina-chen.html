xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"045dd61d-7e34-4cf3-a08f-b29c1dda51e2\"}":{"__typename":"Favorites","uuid":"045dd61d-7e34-4cf3-a08f-b29c1dda51e2","photoUrl":"https://ucarecdn.com/7c6bfda6-721a-4c1a-987c-2262f3d1ed8d/","title":"Ethel Cain","type":"ARTIST"},"Favorites:{\"uuid\":\"ac9cbf61-84e0-47b9-9f90-7ba7a70a6592\"}":{"__typename":"Favorites","uuid":"ac9cbf61-84e0-47b9-9f90-7ba7a70a6592","photoUrl":"https://ucarecdn.com/dd02e9c5-1291-400b-b11d-f91ebcec5a82/","title":"Osaka","type":"CITY"},"Favorites:{\"uuid\":\"e0ea7e4e-8afe-4c21-9060-fe7a8482b52b\"}":{"__typename":"Favorites","uuid":"e0ea7e4e-8afe-4c21-9060-fe7a8482b52b","photoUrl":"https://ucarecdn.com/7e8dc189-4369-48c5-8975-7389d5eb0552/","title":"The Color of Law","type":"BOOK"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6d55b2f3-219c-439b-ad1e-9d0c097bd203\"}":{"__typename":"DeepDives","uuid":"6d55b2f3-219c-439b-ad1e-9d0c097bd203","content":"\u003cp\u003eI dream of working in public service one day! My passions align with me serving and giving back to the communities that raised me, which is why I want to pursue law school, in hopes of working in civil rights law and/or in the social impact sphere.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"9ed30152-6227-4416-a266-af031d510913\"}":{"__typename":"DeepDives","uuid":"9ed30152-6227-4416-a266-af031d510913","content":"\u003cp\u003eI hope to be able to speak at least four languages! I see a strong value in learning languages and being able to connect with different communities with different life experiences, which is why I am striving to learn at least four languages—five would be the most ideal!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo far, I am fluent in English and Mandarin-Chinese (and a bit of my native dialect, Fuzhounese), and currently learning Korean (and will be studying abroad in the summer of 2026)! After Korean, I hope to learn Spanish (at Yale and beyond), as I want to work in public service (and I love Bad Bunny’s music).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"bd6895fd-4a00-43e9-b3a1-5fa590c90eb8\"}":{"__typename":"DeepDives","uuid":"bd6895fd-4a00-43e9-b3a1-5fa590c90eb8","content":"\u003cp\u003eIt took many years for me to realize what worked for me and what didn’t in terms of studying. On the surface, I look like I have my life “figured out” academically, but simply figuring out how (or when) to study for exams took me a very long time!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor instance, I used to (and still) struggle with not being able to study for long periods, which made me believe that I was “not good at studying” or something similar. However, that is, of course, not the case, and it took me many trials and errors to find a perfect schedule suited for my personal study habits and personality. For example, I can’t study with other people (I get distracted easily), but I also can’t study in secluded spaces (it makes me feel trapped)—I also can not study on an empty stomach (food is fuel, and fuel is energy)!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"81020d04-0f14-4595-80f4-998b057e7624\"}":{"__typename":"DeepDives","uuid":"81020d04-0f14-4595-80f4-998b057e7624","content":"\u003cp\u003e“Relax and be kind to yourself because you will end up where you need to be.”\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I always chased after the next “gold star,” from a new internship that I could put on my resume or getting As for the sake of saying “I have a perfect GPA.” Yet, in this cycle of chasing constant perfection, people, including myself, tend to forget that these overbearing expectations are placed on the shoulders of children who are just starting to navigate the world.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI remember crying to my high school counselor during a stressful time during my junior year of high school because I genuinely believed that potentially getting a B in AP Statistics would “put me at a disadvantage in my college applications,” which would ultimately lead me to “disappointing my entire family,” which was, of course, not true. In retrospect, I feel extremely sorry and terrible for the way that I treated myself. No 16-year-old should have that train of thought and bear such a heavy weight, but it’s a common culture that we should all actively refrain from participating in.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere is a beautiful balance between striving for success (academic, college, etc.) and being healthy and kind in the way we treat ourselves, and it is one I am starting to embody, but wish I started even earlier. No matter how stressful things are, we, ourselves, are always the most important!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}":{"__typename":"School","uuid":"7f9a6683-e17a-47fa-9e6d-534e82c727e1","name":"Brooklyn Technical High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11217"},"Education:{\"uuid\":\"5ecd67e3-81e8-4770-af73-93b2aefffacf\"}":{"__typename":"Education","uuid":"5ecd67e3-81e8-4770-af73-93b2aefffacf","school":{"__ref":"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"60da6a6f-291d-48ef-b3a5-a81ec760f966\"}":{"__typename":"Education","uuid":"60da6a6f-291d-48ef-b3a5-a81ec760f966","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Political Science + Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"de68e0d1-6c99-4fa8-8f25-2b9ec0e13dea\"}":{"__typename":"MentorPublicProfile","uuid":"de68e0d1-6c99-4fa8-8f25-2b9ec0e13dea","displayName":"Catrina C.","slug":"catrina-chen","biography":"\u003cp\u003eHi! My name is Catrina, but feel free to call me Cat, and I am one of the Curious Cardinal mentors here to help you succeed academically or in any other aspect of your journey. I am a proud native Brooklynite, and when I am in the city (as I am currently located in New Haven, Connecticut, for college), I am always exploring new restaurants and cafes to share with my friends (and Beli followers)!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am a current first-year student at Yale University pursuing a B.A. in Political Science and Sociology, and a Certificate in Education Studies, on the pre-law track. I am heavily invested in the various Social Science departments at Yale, putting me in a position to make sense of the intersection of diverse societal institutions and structures that I am subject to, which is extremely fascinating to me. This educational journey of mine is catalyzed by my deep passions for subjects like government (civics), education, criminal justice reform, free speech, law, etc.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn the Yale campus, I am involved with the Yale Undergraduate Prison Project (YUPP) as the Advocacy Head for Prison2Public Policy, in which I conduct legal research on the Connecticut Board of Pardons and Paroles (BOPP), its history, trends in legal precedents, etc. I was also previously a Vice Chair for the 52nd Yale Model United Nations (YMUN) conference, which was a terrific experience as a former competing Delegate. For fun outside of the “professional-career” club sphere, I regularly spar and practice with the Yale Club Taekwondo team!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNot previously mentioned yet, I am also one of the 66 national 2024 QuestBridge Match Scholars on campus, which highlights my unique identity as a first-generation, low-income student. Growing up in my immigrant, non-English-speaking family that has historically been restricted by educational barriers, my academics have always been a theme and priority emphasized throughout my upbringing. From attending private tutoring programs on the weekends from a young age to studying for standardized exams for all of my educational milestones, I have always not only understood the importance of succeeding academically but also the value of receiving outside guidance from older students and mentors. In fact, I wouldn’t be the student and character that I am today without all the mentorship I received (from people outside my family) when I was applying to specialized high schools in New York City, studying for standardized exams like the SAT or AP exams in high school, applying to universities, or even selecting the clubs that I want to be a part of on the Yale campus. My life has been filled with both academic and life mentorship, which is why I am so enthusiastic about continuing this legacy of mentorship in my life at Curious Cardinals!\u003c/p\u003e","teachingVideoPlaybackId":"JaWclJyBhkJTrCKoCuBzMDAjfMLx01RZOf00SWGdPIl3k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"045dd61d-7e34-4cf3-a08f-b29c1dda51e2\"}"},{"__ref":"Favorites:{\"uuid\":\"ac9cbf61-84e0-47b9-9f90-7ba7a70a6592\"}"},{"__ref":"Favorites:{\"uuid\":\"e0ea7e4e-8afe-4c21-9060-fe7a8482b52b\"}"}],"causesSupported":[],"major":"Political Science + Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6d55b2f3-219c-439b-ad1e-9d0c097bd203\"}"},{"__ref":"DeepDives:{\"uuid\":\"9ed30152-6227-4416-a266-af031d510913\"}"},{"__ref":"DeepDives:{\"uuid\":\"bd6895fd-4a00-43e9-b3a1-5fa590c90eb8\"}"},{"__ref":"DeepDives:{\"uuid\":\"81020d04-0f14-4595-80f4-998b057e7624\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/80d3accb-5f7d-4ce9-a72f-b9148430078d/-/preview/-/format/jpg/","https://ucarecdn.com/65bc5ba4-5c83-462d-85e9-e84f8574d67e/-/preview/-/format/jpg/","https://ucarecdn.com/1bed6e18-97b7-46ae-95c2-4003a19c8890/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5ecd67e3-81e8-4770-af73-93b2aefffacf\"}"},{"__ref":"Education:{\"uuid\":\"60da6a6f-291d-48ef-b3a5-a81ec760f966\"}"}],"hiredAt":"2026-02-11T19:07:11.034Z","topics":["Algebra I","K-5 Grade Math","Writing","Academic Coaching","College Essay Writing","Executive Function","History","Debate","Journalism","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"catrina-chen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"de68e0d1-6c99-4fa8-8f25-2b9ec0e13dea\"}"}}},"_sentryTraceData":"ce75ee225a204638951cb37a3601aae6-8fcbd3d3314723f2-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ce75ee225a204638951cb37a3601aae6,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"catrina-chen"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
