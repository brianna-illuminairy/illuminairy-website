xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"551e460d-ac10-4639-a4d0-647fcb097136\"}":{"__typename":"Favorites","uuid":"551e460d-ac10-4639-a4d0-647fcb097136","photoUrl":"https://ucarecdn.com/a02ffd13-550c-46e2-a8a9-5ed8d2cc3906/","title":"Al Pacino","type":"ACTOR"},"Favorites:{\"uuid\":\"e0a279f5-e91a-47f3-9922-c4064bdb6489\"}":{"__typename":"Favorites","uuid":"e0a279f5-e91a-47f3-9922-c4064bdb6489","photoUrl":"https://ucarecdn.com/c14726c6-a630-4b5e-b501-73d765039413/","title":"Paris","type":"CITY"},"Favorites:{\"uuid\":\"574940d1-71e1-42c5-b81c-84513497bad1\"}":{"__typename":"Favorites","uuid":"574940d1-71e1-42c5-b81c-84513497bad1","photoUrl":"https://ucarecdn.com/da234867-e4c8-4b27-8c50-d5a05ff03dac/","title":"War and Peace","type":"BOOK"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"84444380-f6e3-49d3-bba4-0ef0da803906\"}":{"__typename":"DeepDives","uuid":"84444380-f6e3-49d3-bba4-0ef0da803906","content":"\u003cp\u003eNovelist and feature-film director\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"bbb1b36f-ad41-4aa8-b0f4-3d7d2a333391\"}":{"__typename":"DeepDives","uuid":"bbb1b36f-ad41-4aa8-b0f4-3d7d2a333391","content":"\u003cp\u003eAs someone who grew up in a Chinese immigrant family in the Bay Area and who ended up pursuing the humanities, my background allows me to bridge difficult conversations between different cultures and expectations, especially when it comes to working with immigrant families.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e3f710e7-f608-418f-a006-ff64b64b139a\"}":{"__typename":"DeepDives","uuid":"e3f710e7-f608-418f-a006-ff64b64b139a","content":"\u003cp\u003eI speak 5 languages!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"85f82775-355f-4a1a-ad6c-664e9d5812b9\"}":{"__typename":"School","uuid":"85f82775-355f-4a1a-ad6c-664e9d5812b9","name":"Monta Vista High School","city":"Cupertino","type":"HIGH","state":"California","country":"United States","zip":"95014"},"Education:{\"uuid\":\"e417ce59-909c-4fbe-99ea-3ab66b5b8d0c\"}":{"__typename":"Education","uuid":"e417ce59-909c-4fbe-99ea-3ab66b5b8d0c","school":{"__ref":"School:{\"uuid\":\"85f82775-355f-4a1a-ad6c-664e9d5812b9\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"d382b0ff-cfe3-45a9-aaf2-c8abec03b022\"}":{"__typename":"Education","uuid":"d382b0ff-cfe3-45a9-aaf2-c8abec03b022","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English Literature (Film Concentration) and Architectural Design","degree":null},"MentorPublicProfile:{\"uuid\":\"9ce52dae-ca33-4ee6-8b01-01dc6cc65f66\"}":{"__typename":"MentorPublicProfile","uuid":"9ce52dae-ca33-4ee6-8b01-01dc6cc65f66","displayName":"Victor L.","slug":"victor-li","biography":"\u003cp\u003eHey there! I'm Victor, and I’m a recent graduate from UPenn, where I majored in English with a concentration in film, and double majored in Architecture.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was born and raised in the California Bay Area, and after my graduation from UPenn this May, I lived in Los Angeles and worked for 4 months at United Talent Agency, one of the big 3 talent agencies in Hollywood. However, as an aspiring novelist and director, I moved to New York (where I am now) to pursue creative projects, and I'm currently writing a novel as well as filming a full-length documentary on a music subculture in Philadelphia.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI care deeply about combining ambition with authentic creative expression, which extends to both my own creative work as well as my mentorship experiences with students. I’ve not only mentored students in English Literature and crafting their art portfolios, but I’ve moreover guided students in the college admissions process who were later admitted to Stanford, UPenn, and Columbia. My work as a mentor also extends well beyond just teaching: one of my top priorities is getting to know you as a person, whether that be your favorite color, what makes you tick, what you want to be, and where you want to go.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHaving studied both English Literature and Architecture means that I have strong writing and critical thinking skills, which I apply towards helping students get their academic essays up to the highest caliber. In particular, I’ve had essays I’ve written used as teaching examples by tenured Art History professors at UPenn, and I was also an Associate Editor for the Penn History Review.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eExtracurricularly, in high school I won numerous national and international awards in writing and design, which include two Scholastic national gold medals (one in critical essay writing, and one in design), and I also co-founded a French language educational magazine that later went on to win a 1st-place prize in a scholastic journalism competition prize from the French Ministry of Education. I’ve additionally had my design work exhibited by the Milan Design Week, the City Council of Madrid, and the Nanjing Massacre Memorial Hall. I’m confident that, through these experiences, I’ll be able to take your creative projects to the highest level, whether that be writing, the visual arts, starting your own publication, or making a short film.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt UPenn, I completed numerous internships at prolific production companies in the film industry, and also worked as a research assistant for a lab in the Graduate School of Architecture. Through that, I had my design and research work shown at numerous museums around the world, and also co-authored research articles that were published in high-impact journals. This, combined with the history and literature research papers I’ve written through my coursework, means that I’m also skilled in supporting students in mentoring their research projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m able to speak 5 languages to an advanced degree: English, French, Mandarin Chinese, Spanish, and Portuguese. For French, I’ve taken a total of 3 years of French, and have interned twice in Paris, France. For Portuguese, I learned the language for a year and had a stint studying abroad in São Paulo, Brazil, where I became fluent in the language. For Spanish, I took the highest level Spanish language culture and literature course at UPenn, where I received an A. And finally, I grew up speaking and learning Mandarin Chinese, given that I grew up in a Chinese immigrant family in the Bay Area. Traveling and immersing myself in world cultures by actually living in a city and learning the language, rather than only visiting them as a tourist, is a big part of how I connect with the world.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of Curious Cardinals, you can find me working on my novel or filming my documentary. I also enjoy reading a good book, thrifting for vintage clothing, or going to IKEA. Now that I’m living in New York, I’m always finding new things to do in the city when I’m not busy mentoring students. I would absolutely love to share my love and expertise in the humanities, arts, and research with you, and work together to take your understanding and level of achievement in these fields to the next level!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"BWWLcKKV1vgA5U1wpmrerZPJw2hcJjTJ02OZqJnMPjWw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eExhibiting my design work in Madrid, through an art installation organized by the City Council of Madrid!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"551e460d-ac10-4639-a4d0-647fcb097136\"}"},{"__ref":"Favorites:{\"uuid\":\"e0a279f5-e91a-47f3-9922-c4064bdb6489\"}"},{"__ref":"Favorites:{\"uuid\":\"574940d1-71e1-42c5-b81c-84513497bad1\"}"}],"causesSupported":[],"major":"English Literature (Film Concentration) and Architectural Design","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"84444380-f6e3-49d3-bba4-0ef0da803906\"}"},{"__ref":"DeepDives:{\"uuid\":\"bbb1b36f-ad41-4aa8-b0f4-3d7d2a333391\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3f710e7-f608-418f-a006-ff64b64b139a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/aa104da4-0223-4b60-a6d8-05348812332b/-/preview/-/format/jpg/","https://ucarecdn.com/94a05ce2-9f0f-4c89-a1a7-3d29e359c875/-/preview/-/format/jpg/","https://ucarecdn.com/6536a727-8cfc-494a-be64-ec14fe57a9e1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e417ce59-909c-4fbe-99ea-3ab66b5b8d0c\"}"},{"__ref":"Education:{\"uuid\":\"d382b0ff-cfe3-45a9-aaf2-c8abec03b022\"}"}],"hiredAt":"2025-10-23T23:10:04.815Z","topics":["K-5 Grade Math","6-8 Grade Science","Biology","Writing","French","Mandarin Chinese","Spanish","Academic Coaching","College Essay Writing","Executive Function","History","Reading","Creative Writing","Fashion / Cosmetics","Film / Theater","History Project","K-6 Storybook","Video / Photography","Visual Arts / Graphic Design","Debate","Journalism","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"victor-li\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9ce52dae-ca33-4ee6-8b01-01dc6cc65f66\"}"}}},"_sentryTraceData":"ff63d87fc39d41588747e2518a91961d-80db149a1e1dde53-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ff63d87fc39d41588747e2518a91961d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"victor-li"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/
