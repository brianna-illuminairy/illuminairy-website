xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5e0c0763-9e45-4399-9462-bf61c0b301f8\"}":{"__typename":"Favorites","uuid":"5e0c0763-9e45-4399-9462-bf61c0b301f8","photoUrl":"https://ucarecdn.com/7c4062ce-782a-4c77-b4bb-b6bf908294fa/","title":"Bananagrams","type":"GAME"},"Favorites:{\"uuid\":\"8e16bf5f-bfc8-48bf-a057-1cbf11acbb5d\"}":{"__typename":"Favorites","uuid":"8e16bf5f-bfc8-48bf-a057-1cbf11acbb5d","photoUrl":"https://ucarecdn.com/66e6f0e9-51f6-45ba-9843-92a8fe693207/","title":"St. Louis Cardinals","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"9774fc3e-e635-4c13-8c81-0945bc39c950\"}":{"__typename":"Favorites","uuid":"9774fc3e-e635-4c13-8c81-0945bc39c950","photoUrl":"https://ucarecdn.com/3b9794fe-ac88-4026-b82b-61941fb1c3a3/","title":"Running","type":"SPORT"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a759790c-87ef-4e19-ad4c-8e773fe79b28\"}":{"__typename":"DeepDives","uuid":"a759790c-87ef-4e19-ad4c-8e773fe79b28","content":"\u003cp\u003eI chose human biology because it is interdisciplinary. While every human biology student must take the core - classes in basic physiology, microbiology, and evolution - we each have the freedom to explore our sub-interests within the major. I am passionate about child development and social learning, so within my major, I took classes such as social psychology, educational neuroscience, early linguistics, global child health, human nutrition, and many more. I also engaged in developmental psychology research. While I will graduate with a biology degree, biology is just one of the many subjects I had the privilege to explore within my major, and I am grateful for this diversity. I have a well-rounded understanding of the human body, from the inner workings of our physiology to the external social dynamics in our world. This is valuable, especially as I navigate a healthcare career. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"d012b41a-86da-4d83-bf50-aa6a8a03e86d\"}":{"__typename":"DeepDives","uuid":"d012b41a-86da-4d83-bf50-aa6a8a03e86d","content":"\u003cp\u003ePerhaps this is obvious to the people who know me well, but I love musical theater. I grew up performing in professional children’s theater productions, and for a while I wanted to become a professional actress. My peers in college probably don’t know this, as I study biology and plan to become a pediatric nurse. Why would a future nurse care about the performing arts? I actually find my background in theater extremely useful in healthcare. I am emotive and animated, and I find it easier to connect and communicate with people. I pride myself on being a good storyteller, and connecting with pediatric patients relies on play and stories. I can adapt and improvise, and I attribute these skills to my theatrical background. Yes, I love musical theater, and this makes me a better educator, mentor, and future nurse. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"36617222-f5d9-4570-8c3e-2cf379881ea3\"}":{"__typename":"DeepDives","uuid":"36617222-f5d9-4570-8c3e-2cf379881ea3","content":null,"videoPlaybackId":"6O69br8LCRZTwDwtV5fZQLjeYd3kPI3sjvTZOQK00T02Y","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f6dd1ba9-84af-461b-bd62-c3f73e2b1099\"}":{"__typename":"DeepDives","uuid":"f6dd1ba9-84af-461b-bd62-c3f73e2b1099","content":null,"videoPlaybackId":"Vmj3DUhvm5CH5cfWXC01sMpZoQYELyVo4c1Q9U6gx8n00","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"ac2cda5b-346b-419d-936f-243318f9c14d\"}":{"__typename":"School","uuid":"ac2cda5b-346b-419d-936f-243318f9c14d","name":"Catlin Gabel School","city":"Portland","type":"HIGH","state":"Oregon","country":"United States","zip":"97225"},"Education:{\"uuid\":\"5e573692-2aeb-4d30-acf3-c9e5b7b1574b\"}":{"__typename":"Education","uuid":"5e573692-2aeb-4d30-acf3-c9e5b7b1574b","school":{"__ref":"School:{\"uuid\":\"ac2cda5b-346b-419d-936f-243318f9c14d\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7b4824f0-5671-4855-843c-708a10d39da3\"}":{"__typename":"Education","uuid":"7b4824f0-5671-4855-843c-708a10d39da3","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"5eaf76a8-635d-427f-9451-6a17bb72cee6\"}":{"__typename":"MentorPublicProfile","uuid":"5eaf76a8-635d-427f-9451-6a17bb72cee6","displayName":"Libby R.","slug":"libby-rouffy","biography":"\u003cp\u003eHi! My name is Libby, and I am so excited to work with you! I grew up performing in professional children's theater - everything from Mary Poppins to The Wizard of Oz. As you can imagine, I am very animated and enjoy teaching concepts with robust gestures and expressions. I will happily discuss your favorite actors and singers, and maybe even create a song mnemonic or two :)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI study Human Biology at Stanford, which is a diverse major. I specifically concentrate on child development, so while I understand biology concepts, I also know a lot about psychology, global health, and education. I am passionate about understanding the physical, emotional, and mental support children need to thrive and applying this knowledge to healthcare. Next year, I will start a pediatric nursing program at UPenn - I would love to talk with you about nursing or healthcare at large!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs you might expect, I love hanging out with kids. I volunteer for Kids with Dreams, a club that offers activities for youth and young adults with special needs in Palo Alto. Our activities include basketball, dance, karate, and swimming. I have a lot of experience working with children with developmental disabilities, including Autism, and I would happily work with mentees of any age or need. I am also passionate about integrating art into healthcare. As part of my senior project, I recently wrote and illustrated a coloring book about the importance of getting booster shots for COVID-19. I would love to give you a copy or talk about how to merge your separate interests (like art and science).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy baking (cookies especially) and watching movies. I would also enjoy challenging you to a game of chess or helping you learn how to play.\u003c/p\u003e","teachingVideoPlaybackId":"MRPMeYckQ01kiMLqTjwCzDaDKE2EbleObpiCFLEWzqiM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was honored with a 2023 Sweetheart Award for making a positive difference in the life of a child with special needs. I generated lasting friendship with my 'buddy' through the Stanford Kids with Dreams program. Yes, my greatest achievement is being a really good friend :)\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5e0c0763-9e45-4399-9462-bf61c0b301f8\"}"},{"__ref":"Favorites:{\"uuid\":\"8e16bf5f-bfc8-48bf-a057-1cbf11acbb5d\"}"},{"__ref":"Favorites:{\"uuid\":\"9774fc3e-e635-4c13-8c81-0945bc39c950\"}"}],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a759790c-87ef-4e19-ad4c-8e773fe79b28\"}"},{"__ref":"DeepDives:{\"uuid\":\"d012b41a-86da-4d83-bf50-aa6a8a03e86d\"}"},{"__ref":"DeepDives:{\"uuid\":\"36617222-f5d9-4570-8c3e-2cf379881ea3\"}"},{"__ref":"DeepDives:{\"uuid\":\"f6dd1ba9-84af-461b-bd62-c3f73e2b1099\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1daa4e74-ef55-47da-b404-7c29c279c19b/-/preview/-/format/jpg/","https://ucarecdn.com/84962193-94b3-4db4-9ed4-7ebe6153cccc/-/preview/-/format/jpg/","https://ucarecdn.com/c25167ca-e6ca-40d9-97ec-33802d5f1107/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5e573692-2aeb-4d30-acf3-c9e5b7b1574b\"}"},{"__ref":"Education:{\"uuid\":\"7b4824f0-5671-4855-843c-708a10d39da3\"}"}],"hiredAt":"2024-04-03T08:51:27.627Z","topics":["STEM Project","Medicine / Health","Biology","Writing","Reading","6-8 Grade Science","Visual Arts / Graphic Design"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"libby-ro
