xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"331a3861-c3ef-48c2-817f-54b3013bdc94\"}":{"__typename":"Favorites","uuid":"331a3861-c3ef-48c2-817f-54b3013bdc94","photoUrl":"https://ucarecdn.com/d8b1fc88-b193-4154-b376-0a11ce0fdab5/","title":"When Breath Becomes Air","type":"BOOK"},"Favorites:{\"uuid\":\"edeb5c95-03e7-4f37-9bc9-8409a3185d10\"}":{"__typename":"Favorites","uuid":"edeb5c95-03e7-4f37-9bc9-8409a3185d10","photoUrl":"https://ucarecdn.com/d8b1fc88-b193-4154-b376-0a11ce0fdab5/","title":"San Francisco Giants","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"a54a7b33-d4e3-45b9-a239-947d4504dde0\"}":{"__typename":"Favorites","uuid":"a54a7b33-d4e3-45b9-a239-947d4504dde0","photoUrl":"https://ucarecdn.com/d8b1fc88-b193-4154-b376-0a11ce0fdab5/","title":"Nothing Happens","type":"ALBUM"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1143ddd3-ff62-413c-b664-92a45de281c3\"}":{"__typename":"DeepDives","uuid":"1143ddd3-ff62-413c-b664-92a45de281c3","content":"\u003cp\u003eMany biology research labs use a technique called Western blotting to identify proteins in a solution and determine their relative concentrations. This information is very important in assessing how well a condition performs against the control, or the non-treated sample. The method for measuring the concentrations, however, is pretty imprecise.\u003cbr\u003e\u003cbr\u003eTroubled by such subjectivity, I developed a programming script that analyzes images of Western blots and spits out relative and absolute concentrations of the proteins! It was incredibly useful in my lab, and I loved the feeling of making a tangible and substantive impact that makes our work better and more efficient.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5b2196f3-bed4-4d37-a7ec-8e6b70eb8eda\"}":{"__typename":"DeepDives","uuid":"5b2196f3-bed4-4d37-a7ec-8e6b70eb8eda","content":"\u003cp\u003eI came to Stanford as an intended double major in Anthropology and Public Policy. If only high-school-me could see me know.\u003cbr\u003e\u003cbr\u003eIn all seriousness, I intended to pursue humanities at Stanford simply because I did not believe in my abilities to be an engineer. I didn't believe I could compete with students who already knew how to code apps while I barely knew what a for-loop was. I didn't want to start a new educational journey already feeling behind.\u003cbr\u003e\u003cbr\u003eDuring the first quarter of my freshman year, I took the introductory programming course, a rite of passage for all Stanford students. At first, I really struggled in the course, but I soon fell in love with designing beautiful, fast, and functional code that can serve a real-world impact. Combining my interests in medicine and my new-found love of programming, I turned to Biomedical Computation. The major is incredibly flexible, allowing me to fill my pre-med requirements, study abroad, minor, and receive an honors thesis all in four years!\u003cbr\u003e\u003cbr\u003eStill interested in the humanities, I have pivoted to minoring in Health Policy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b22740de-cabd-4aaa-9413-9f1f871c5a3a\"}":{"__typename":"DeepDives","uuid":"b22740de-cabd-4aaa-9413-9f1f871c5a3a","content":"\u003cp\u003eHey Sam,\u003cbr\u003e\u003cbr\u003eI know you are probably feeling stressed or burnt-out or overwhelmed. I remember when we would go from eight-hour school days to cross country practice to four-hour shifts an In-N-Out to homework and repeat. That was crazy, huh?\u003cbr\u003e\u003cbr\u003eI am not going to tell you to drop activities because 1) I know you will not listen to me and 2) you enjoy them and you grow in them. They give us happiness, and I will never try to strip that from us.\u003cbr\u003e\u003cbr\u003eWhat I will tell you is to give yourself grace. Through all the forgetful mistakes and extensive to-do lists, the world continues. Me writing this letter to you right now should prove that. Keep loving, keep learning, and keep laughing. \u003cbr\u003e\u003cbr\u003eWe are gonna go far, kid.\u003cbr\u003e\u003cbr\u003eWith you always,\u003cbr\u003eSam\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"39afbfce-9f5e-4c65-b092-7ebe068c8d7c\"}":{"__typename":"DeepDives","uuid":"39afbfce-9f5e-4c65-b092-7ebe068c8d7c","content":"\u003cp\u003eI come from a lineage of Moroccan immigrants who flocked to the United States in the twentieth century in search of a new home. Like many North African cultures, family always comes first. There is no such thing as a \"small get-together\" or a \"quick visit.\" Everything I knew growing up was fueled on intense love and intention, and that is how I have attempted to model my life and my teaching style.\u003cbr\u003e\u003cbr\u003eWhen I teach, I put the student in the foreground of the subject material. There is no fixed schedule that must be abided by; we follow the schedule of their comprehension. As I see it, the teaching process is a partnership, as well. It takes both parties, the student and the teacher, to create a successful learning experience. I create an environment that invites questions and a dynamic that makes learning a passive experience. \u003cbr\u003e\u003cbr\u003eAs my Moroccan roots have taught me, my door is always open, as well. For immediate questions or happy remarks, I am always just one call away.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"c71479fb-d512-48de-99d9-5d69b72b0a82\"}":{"__typename":"School","uuid":"c71479fb-d512-48de-99d9-5d69b72b0a82","name":"College Park High School","city":"Pleasant Hill","type":"HIGH","state":"California","country":"United States","zip":"94523"},"Education:{\"uuid\":\"3af3c772-f1f1-4f4f-9369-9e626ffe8c4d\"}":{"__typename":"Education","uuid":"3af3c772-f1f1-4f4f-9369-9e626ffe8c4d","school":{"__ref":"School:{\"uuid\":\"c71479fb-d512-48de-99d9-5d69b72b0a82\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4ebb2898-adb9-426b-b1af-d0d43d737b0c\"}":{"__typename":"Education","uuid":"4ebb2898-adb9-426b-b1af-d0d43d737b0c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biomedical Computation","degree":null},"MentorPublicProfile:{\"uuid\":\"ad650c58-4fb5-4020-a234-05ae25935fa5\"}":{"__typename":"MentorPublicProfile","uuid":"ad650c58-4fb5-4020-a234-05ae25935fa5","displayName":"Sam B.","slug":"sam-benabou","biography":"\u003cp\u003eWelcome to my page — glad you made it! My name is Sam Benabou, and I am a student at Stanford University from Martinez, CA majoring in Biomedical Computation with a minor in Health Policy.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love connecting with people. I love ending my day with a two-hour conversation at the dining hall about proper social media etiquette. I love the random friendships that blossom out of long lines at the package center. I love smiling to strangers and smiling for myself. In the end, I feel like each day is not complete without some novel interaction.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo ensure I have that daily human connection, I am a part of several incredible communities on campus. In the Stanford Running Club, I go on late-night jogs or participate in cross-country races with other students who revel in the masochist sport of running as much as I do. In the Stanford Band, I rock out with my neon pink alto saxophone to the entire Stanford community, ensuring everyone gets to feel the funk. As a Campus Tour Guide, I am expanding that Stanford community, inviting people from across the world to their potential new home. Even in my research lab, I still find ways to prioritize community by blasting Spotify Blend playlists and creating a small book club.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile I would love to be a full-time hobby jogger/jazz soloist/backwards walker, I am a student. Majoring in a degree that encompasses both biology and computer science, my course load includes a broad overview of chemistry, biology, physics, and computer science courses. With this degree, I hope to become a clinician-policymaker, using my clinical experience and quantitative analysis skills to support health policy bills.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAs of right now, however, I am a student in Paris doing a study abroad experience. So instead of completing assignments in biochemistry courses, I am drawing nude live models and learning about the history of the Orientalism art movement. Instead of running on the Dish, I am running by the steps of the Eiffel Tower. And, most importantly, instead of learning languages like Python and C++, I am becoming proficient in French. If you want to hear more about my travels, feel free to follow along on my blog: \u003cu\u003ehttps://bonjourbenabou.wordpress.com/\u003c/u\u003e :)\u003cbr\u003e\u003cbr\u003eMy previous experiences include assisting in the instruction of a data science course at Stanford, volunteering at a local free clinic that reaches underserved populations, and serving fries and smiles as an In-N-Out associate for two years.\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Sq22wENmVfmNKA90282NX4SQGJkCJO3roSTCmPzt8004k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"331a3861-c3ef-48c2-817f-54b3013bdc94\"}"},{"__ref":"Favorites:{\"uuid\":\"edeb5c95-03e7-4f37-9bc9-8409a3185d10\"}"},{"__ref":"Favorites:{\"uuid\":\"a54a7b33-d4e3-45b9-a239-947d4504dde0\"}"}],"causesSupported":[],"major":"Biomedical Computation","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1143ddd3-ff62-413c-b664-92a45de281c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b2196f3-bed4-4d37-a7ec-8e6b70eb8eda\"}"},{"__ref":"DeepDives:{\"uuid\":\"b22740de-cabd-4aaa-9413-9f1f871c5a3a\"}"},{"__ref":"DeepDives:{\"uuid\":\"39afbfce-9f5e-4c65-b092-7ebe068c8d7c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/038d9de0-9be9-4b9b-8258-acfba4511942/-/preview/-/format/jpg/","https://ucarecdn.com/cb7aa422-7f8a-4185-a0b9-fbf7c6d94167/-/preview/-/format/jpg/","https://ucarecdn.com/4f4806bc-b83b-4714-accb-3e661258a879/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\"
