abilities and perspective on how to apply them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4ec014a2-f627-46a2-a21e-3759ca012e15\"}":{"__typename":"DeepDives","uuid":"4ec014a2-f627-46a2-a21e-3759ca012e15","content":"\u003cp\u003eI hope to start my own greeting card business! Gift-giving is something I truly love, and for years, I’ve enjoyed creating hand-painted cards for my friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9c66dbef-afc5-46a3-9901-747ff725889c\"}":{"__typename":"DeepDives","uuid":"9c66dbef-afc5-46a3-9901-747ff725889c","content":"\u003cp\u003eI chose Public Policy to develop data analysis skills that can drive systemic impact. With a strong foundation in statistics and economics, the major applies to a wide range of fields, including healthcare, education, and government,. I'm so grateful for the diverse opportunities it has exposed me to.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"50de9230-d054-4e31-b7e0-82c6cb79527d\"}":{"__typename":"School","uuid":"50de9230-d054-4e31-b7e0-82c6cb79527d","name":"Neuqua Valley High School","city":"Naperville","type":"HIGH","state":"Illinois","country":"United States","zip":"60564"},"Education:{\"uuid\":\"221d307f-900e-418f-90e5-53cca8e26e27\"}":{"__typename":"Education","uuid":"221d307f-900e-418f-90e5-53cca8e26e27","school":{"__ref":"School:{\"uuid\":\"50de9230-d054-4e31-b7e0-82c6cb79527d\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"b15fbb2c-71d7-4a46-8a52-0e6f58e8e286\"}":{"__typename":"Education","uuid":"b15fbb2c-71d7-4a46-8a52-0e6f58e8e286","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Public Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"d719c5b7-2ea4-4e1b-8526-ee1d4c444dcd\"}":{"__typename":"MentorPublicProfile","uuid":"d719c5b7-2ea4-4e1b-8526-ee1d4c444dcd","displayName":"Madeline L.","slug":"madeline-lei","biography":"\u003cp\u003eHi, I’m Madeline! I grew up in Naperville, Illinois, a suburb of Chicago, before moving to Upstate New York to attend Cornell University. I majored in Public Policy with a minor in Healthcare Design, graduating in 2023. Currently, I’m pursuing a Master’s in Health Administration at Cornell and will graduate this Spring 2025. My background includes experience in hospital operations and design, and after graduation, I’ll be stepping into a healthcare management role at Montefiore Health System in New York City.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always been drawn to healthcare, and throughout college, I explored its many facets, including pre-medical studies, public health, and healthcare administration. My passion for integrating data analytics, health and wellness, and human-centered design ultimately led me to focus on creating patient-centered, operationally efficient hospitals. Beyond healthcare, I have a strong background in education, having taught English, History, Biology, Pre-Algebra, and College Essay Writing. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic journey has been anything but linear, which is why I’m so passionate about mentorship. As someone who has always loved both the sciences and liberal arts, I understand the pressure of choosing a single career path. I believe in the interdisciplinary connections between subjects and the importance of making learning engaging and real-world relevant for all students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of healthcare, I’m a lifelong artist. Since high school, I’ve taught art classes for kids (K-5), covering everything from realistic drawing to air-dry clay and crafting. Since 2020, I’ve also sold my own artwork, including portraits, clothing designs, and children’s storybook commissions. One of my favorite projects was creating a custom wedding portrait for a couple’s anniversary!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter nearly six years in Upstate New York, I’ve developed a love for hiking and discovering new trails. I’m also passionate about exploring different music genres, and hosting dinner parties with friends. As a self-proclaimed adventurous foodie, I’m always happy to share recommendations. 😊\u003c/p\u003e","teachingVideoPlaybackId":"5IqExRBnqC7XWvagz8TuB2qzpzsALLfp5LONBVXDv00w","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI led my own cost-free art lessons as a creative director for a group of 10 kids! I designed warm-up activities and tailored each class to suit a wide age range, making them accessible for neighborhood families while providing a creative summer activity for their children.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"6a24b269-d29a-4296-b4a4-8f495d4cb284\"}"},{"__ref":"Favorites:{\"uuid\":\"4fa53dfb-6c27-4258-a0eb-0230d22d2c08\"}"}],"causesSupported":[],"major":"Public Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"61c80200-4c44-4064-bca8-e553ad79a2f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"d9519179-9c80-4ad6-9eb3-f08648184478\"}"},{"__ref":"D
