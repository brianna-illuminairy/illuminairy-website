ation in K-5 Grade Math, Pre-Algebra, Algebra I, Algebra II, Geometry, Precalculus/Trigonometry, 6-8 Grade Science, Writing, Spanish, Academic Coaching, Executive Function, Reading, Creative Writing, and Finance/Investing. I am also very excited about being a part of a variety of passion projects!\u003c/p\u003e\u003cp\u003eBeyond academics, I enjoy helping students develop essential skills like organization, time management, and study techniques through academic coaching and executive function support. I believe these foundations are just as important as subject knowledge for long-term success.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my greatest joys is watching students discover their own passions. Whether it's designing a passion project, exploring financial literacy, or diving into a completely unique area of interest, I'm ready to support the students' curiosity and help transform their ideas into meaningful learning experiences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my mentoring approach, I focus on building genuine connections with my students. I believe learning happens best when students feel comfortable, understood, and inspired. My goal is to create a supportive environment where questions are welcomed and challenges are approached with patience and creativity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to meeting your student and embarking on an exciting learning journey together!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Philosophy, Politics, and Economics","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/45b50600-5461-4e11-9c97-283371bd1769/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9d5c27d6-37d4-4515-b32c-a2b173509ce8\"}"},{"__ref":"Education:{\"uuid\":\"9d7d6c06-db7c-4d6f-8811-4ddc814465b1\"}"}],"hiredAt":"2025-05-20T10:32:03.743Z","topi
