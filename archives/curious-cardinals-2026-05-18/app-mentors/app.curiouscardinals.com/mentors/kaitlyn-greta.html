:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"ae69db86-86f7-45d1-b356-a9b5361411d8\"}":{"__typename":"DeepDives","uuid":"ae69db86-86f7-45d1-b356-a9b5361411d8","content":null,"videoPlaybackId":"I5OeY6W2Ix702o8srQTH8gwNtODMxd7IJmprB5NVLb02w","question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"90970031-fef5-4001-9d3d-fb56e7be5163\"}":{"__typename":"DeepDives","uuid":"90970031-fef5-4001-9d3d-fb56e7be5163","content":null,"videoPlaybackId":"VTTYN3X4eqHwBMeKSl87ajd01JmsHBE4gqbX9um1ORmI","question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"68444f03-2016-4bdc-97c0-c843989ce18a\"}":{"__typename":"School","uuid":"68444f03-2016-4bdc-97c0-c843989ce18a","name":"Marymount High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90077"},"Education:{\"uuid\":\"b4df0fb2-28c8-487a-a7be-94e8919c1e74\"}":{"__typename":"Education","uuid":"b4df0fb2-28c8-487a-a7be-94e8919c1e74","school":{"__ref":"School:{\"uuid\":\"68444f03-2016-4bdc-97c0-c843989ce18a\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"67374c17-7bff-4332-9ec0-02bc2c547657\"}":{"__typename":"Education","uuid":"67374c17-7bff-4332-9ec0-02bc2c547657","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Government and Religion","degree":null},"MentorPublicProfile:{\"uuid\":\"a432a1aa-4c1b-444a-aeaf-136df0ecac64\"}":{"__typename":"MentorPublicProfile","uuid":"a432a1aa-4c1b-444a-aeaf-136df0ecac64","displayName":"Kaitlyn G.","slug":"kaitlyn-greta","biography":"\u003cp\u003eWith a passion for\u0026nbsp;community development\u0026nbsp;and a love for connecting with people, I've dedicated my career to understanding and fostering positive change, both locally and globally. My academic journey at college laid the groundwork, where I majored in\u0026nbsp;government and religion, delving into the intersection of politics and religion and how religion shapes our world. This period honed my abilities to think, analyze, and critically read—skills I've have continued to carry post college.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy first full-time role post-graduation was an exciting introduction to the world of political organizing. Graduating in the midst of the 2020 presidential election, I jumped in as a\u0026nbsp;field organizer for the Nevada Democratic Party. It was an intense, yet incredibly rewarding, experience. I cherished the relationships I built with my volunteers, learning about their passions and interests and celebrating a shared sense of accomplishment. \u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTransitioning from the local to the global, my next experience led me to an\u0026nbsp;international NGO—International Crisis Group—where I joined their Development team. This role provided invaluable insights into how to fundraise across many different constituencies and best practices on nonprofit organizational management. Relocating to London with this job only reinforced my love of forming connections with people from all over the world. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring this time, I read impactful books on global development, such as Jason Hickel's\u0026nbsp;\u003cem\u003eThe Divide\u003c/em\u003e, which underscored for me the importance of\u0026nbsp;community-level development. Recognizing the need to contribute directly, I joined\u0026nbsp;Peace Corps Guatemala\u0026nbsp;in their Community Economic Development Program. For two years, I worked alongside a dedicated team in the Ministry of Economy, providing\u0026nbsp;business development services to local entrepreneurs. This personalized assistance, whether it was improving branding or creating a budget, aimed to increase the profits for local businesses, which often serve as vital sources of family income.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm committed to continuously learning about sustainable development and change through reading, listening, and engaging in conversations. Outside of my professional life, I find joy in exploring the great outdoors, experiencing diverse cultures, and meeting new people. I discovered my passions little by little, through insights gained from conversations and deep reflection. I'm incredibly grateful for the mentors in my life, including former managers and teachers, whose guidance helped me make decisions that aligned with my passions. I eagerly anticipate the opportunity to \"pay it forward,\" engaging in discussions about what excites others and collaborating to help them hone in on their own passions. I look forward to the chance to “pay it forward” and engage in conversations what excites others and work together to help hone in on your passions.\u003c/p\u003e","teachingVideoPlaybackId":"7zzLuAmEGjx02yhyJUrMSmzXXJL02xNFZJLkQ7IgjJcSI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"229ebea6-b630-47ac-828a-992c4505753b\"}"},{"__ref":"Favorites:{\"uuid\":\"e539dc8e-715b-4fb7-a4f8-16ee6c6a2871\"}"},{"__ref":"Favorites:{\"uuid\":\"881ccd85-b92f-4f8a-9869-6255de46784a\"}"}],"causesSupported":[],"major":"Government and Religion","deepDives":[{"__ref":"DeepDive
