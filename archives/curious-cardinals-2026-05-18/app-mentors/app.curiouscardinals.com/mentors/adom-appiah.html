:"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Sociology of Work \u0026 Organizations","degree":null},"MentorPublicProfile:{\"uuid\":\"89eb930a-8ff8-4bfa-970b-488add8fb01b\"}":{"__typename":"MentorPublicProfile","uuid":"89eb930a-8ff8-4bfa-970b-488add8fb01b","displayName":"Adom A.","slug":"adom-appiah","biography":"\u003cp\u003e“Our life is what our thoughts make it” - Marcus Aurelius\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eHello! My name is Adom Appiah, and I am currently pursuing a Bachelor’s degree in the Sociology of Work \u0026amp; Organizations, with a certificate in Innovation \u0026amp; Entrepreneurship, at Duke University. As a Robertson Scholar, I am passionate about the intersection of community, leadership, and innovation, always seeking ways to foster social impact through creative solutions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeing raised in Spartanburg, SC, I grew up with a curiosity about the social forces that shape individuals, organizations, and communities. This curiosity drives my work as the founder of \u003cem\u003eBall4Good\u003c/em\u003e, a nonprofit I launched in 2018 that harnesses the power of sports for positive social impact. To date, my team and I have raised over $150,000 and supported 40+ organizations through charity basketball games and other initiatives. My work has been recognized by institutions like ESPN and The Heisman Trophy Trust.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI recently had the privilege of interning with NBCUniversal during the 2024 Olympics, where I helped optimize the travel and hospitality experiences of executives and celebrity talent in Paris. Before that, I spent my summer as a teaching fellow at Breakthrough New Orleans allowed me to connect with young students through literature, meditation, and music production. I taught a 6th grade literature class!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my roles on campus, from organizing events through Duke’s Last Day of Classes to building community through Quad Council to coaching youth basketball through \u003cem\u003eCoach2Inspire\u003c/em\u003e, I aim to cultivate spaces where creativity and community thrive.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my academic and professional life, I enjoy playing soccer, reading, and honing my skills in graphic design and music production.\u003c/p\u003e","teachingVideoPlaybackId":"6yeSO02fPh2RVM1R2x5zQAJK6029rA00Wv9sIfMj1UfnM4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7fcac57d-468a-4fdd-91e9-037e38ae55e9\"}"},{"__ref":"Favorites:{\"uuid\":\"04a38774-ec76-43a6-9776-a6259e6574a7\"}"},{"__ref":"Favorites:{\"uuid\":\"e5708f05-75b8-4eb6-89a8-92db1a3957f9\"}"}],"causesSupported":[],"major":"Sociology of Work \u0026 Organizations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"999fd95c-dbe6-4aca-a122-989a7d53cebb\"}"},{"__ref":"DeepDives:{\"uuid\":\"b0f4f152-64bc-4048-ac8c-3b21916a6824\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d920fea-2d55-4837-8887-cbc16c2d60e1\"}"},{"__ref":"DeepDives:{\"uuid\":\"459e231d-9be6-4d79-9b5b-c4abfda5d5f2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a07c6858-ca94-42fc-99e2-fd4a53cdafd2/-/preview/-/format/jpg/","https://ucarecdn.com/7690a702-1c37-4c97-bcb5-cc52d248cf73/-/preview/-/format/jpg/","https://ucarecdn.com/915eab90-35ae-41b3-9815-658a2b4813c6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"eeb4fdc7-2733-4c70-9802-549f61315c27\"}"},{"__ref":"Education:{\"uuid\":\"9dfae97b-8753-4f79-967b-5bb1a07d60d1\"}"}],"hiredAt":"2024-09-27T10:53:54.411Z","topics":["Visual Arts / Graphic Design","Business / Entrepreneurship","Negotiation","Executive Function","Academic Coaching","Reading","Writing","Spo
