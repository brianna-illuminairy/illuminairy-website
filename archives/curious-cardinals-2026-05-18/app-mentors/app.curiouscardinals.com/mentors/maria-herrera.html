xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5ccca95b-ed5a-4c32-b2aa-cd8c8d0a5304\"}":{"__typename":"Favorites","uuid":"5ccca95b-ed5a-4c32-b2aa-cd8c8d0a5304","photoUrl":"https://ucarecdn.com/75dc3790-bf3d-4a50-81d9-603998dfc5ea/","title":"Hamilton ","type":"PLAY"},"Favorites:{\"uuid\":\"df0781c3-8c65-42aa-a44b-ba2927588cd2\"}":{"__typename":"Favorites","uuid":"df0781c3-8c65-42aa-a44b-ba2927588cd2","photoUrl":"https://ucarecdn.com/68123cb3-51a6-4194-a022-a30945aa4752/","title":"Abbey Road ","type":"ALBUM"},"Favorites:{\"uuid\":\"d25019f4-0a69-4263-a92f-e7caef88f8fd\"}":{"__typename":"Favorites","uuid":"d25019f4-0a69-4263-a92f-e7caef88f8fd","photoUrl":"https://ucarecdn.com/4b429ae1-ae74-49a5-8f54-143f07c18304/","title":"My Way - Frank Sinatra","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5a846d48-0d51-4a6b-aab2-531ea0518a80\"}":{"__typename":"DeepDives","uuid":"5a846d48-0d51-4a6b-aab2-531ea0518a80","content":"\u003cp\u003eEnjoy the process and follow your passions. During middle and high school, I was so focused on being the best version of myself that I sometimes lost sight of what truly made me happy. Over time, I realized that the only way to genuinely succeed is by doing what you love—not what you think others expect of you. As much as you might feel eager to graduate and start your adult life, school is a special time. You’ll miss the friendships, the learning, and even the challenges. So take a moment to appreciate where you are now, enjoy the journey, and trust that following your passions will lead you exactly where you’re meant to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5b9ca66f-5f93-4121-a41d-247acf3a4074\"}":{"__typename":"DeepDives","uuid":"5b9ca66f-5f93-4121-a41d-247acf3a4074","content":"\u003cp\u003eThe reason I am where I am today is because of the amazing mentors that have guided me along the way. I want to be able to be that for someone and help them unlock their true potential. Sometimes I'm stuck on something and all I need is a helping hand to make sure that everything is going to be okay. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8019f438-7385-4362-bb49-138f5dbb4eb5\"}":{"__typename":"DeepDives","uuid":"8019f438-7385-4362-bb49-138f5dbb4eb5","content":"\u003cp\u003eI really want to go skydiving. It doesn't seem like the biggest thing in the world but it is at the top of my bucketlist.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"6069e7f2-dab4-42a4-8a3f-34c3165fa3d6\"}":{"__typename":"DeepDives","uuid":"6069e7f2-dab4-42a4-8a3f-34c3165fa3d6","content":"\u003cp\u003eMy dad. As I get older, I realize that almost everything I do is connected in some way to the values and lessons he’s taught me. Since I was a little girl, he’s been deeply involved in helping his community and protecting the environment—always giving his time and energy, even while working a full-time job. What’s always amazed me is that no matter how busy or tired he was, he still walked into every room with a smile on his face. That kind of dedication and positivity has shaped the way I approach life. Whenever I feel overwhelmed or unsure, he’s the first person I turn to. He doesn’t just give advice he works through things with me, step by step.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"4d78a68f-83a2-49d9-9822-ceb2ff3472d7\"}":{"__typename":"School","uuid":"4d78a68f-83a2-49d9-9822-ceb2ff3472d7","name":"Carol Morgan School","city":"Santo Domingo","type":"HIGH","state":"Distrito Nacional","country":"Dominican Republic","zip":"34233"},"Education:{\"uuid\":\"92599198-a6a9-4a1f-97c3-8b4ea5dc2f32\"}":{"__typename":"Education","uuid":"92599198-a6a9-4a1f-97c3-8b4ea5dc2f32","school":{"__ref":"School:{\"uuid\":\"4d78a68f-83a2-49d9-9822-ceb2ff3472d7\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"a9567e08-e5f0-4872-a43d-e0f262b62328\"}":{"__typename":"Education","uuid":"a9567e08-e5f0-4872-a43d-e0f262b62328","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Philosophy, Politics and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"cdc9a776-35aa-4f05-ab4a-b7e7fa06bb11\"}":{"__typename":"MentorPublicProfile","uuid":"cdc9a776-35aa-4f05-ab4a-b7e7fa06bb11","displayName":"Maria H.","slug":"maria-herrera","biography":"\u003cp\u003eHi everyone! My name is María Herrera, and I’m a rising sophomore at the University of Pennsylvania. I’m originally from Santo Domingo, Dominican Republic—a small but mighty island in the Caribbean that has shaped my passion for community, sustainability, and equity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFrom a young age, I’ve been involved in service efforts, including tutoring and mentoring in local orphanages and participating in environmental clean-up initiatives. These early experiences sparked my interest in public service and advocacy, which later led me to intern at the Permanent Mission of the Dominican Republic to the United Nations and take on leadership roles in my community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy true passion lies in urban redevelopment and building more sustainable, inclusive environments in communities like mine. I believe that the intersection of urban planning, public policy, international affairs, and economics is where real, lasting change happens. That’s why I’m majoring in Philosophy, Politics, and Economics (PPE) with a minor in Environmental and Sustainability Management. I’m especially interested in how policy and investment can be used to address inequality and climate resilience in developing regions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I stay actively involved in a variety of organizations that reflect my interests. I’m a tour guide with Penn’s Kite and Key Society, where I love sharing my experience with prospective students. I’m also a consultant with the Global Research and Consulting Group, where I’ve worked on projects related to sustainable development and international trade. As the social chair of Wharton Latino, I help foster community and organize events that celebrate Latinx culture and professional growth. I also write for Wharton Women’s \u003cem\u003eWalnut Street Journal\u003c/em\u003e, focusing on economic trends in Latin America, and I work as a research and administrative assistant in the Spanish and Portuguese Department.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m passionate about exploring the world—whether through travel, cultural history, or geopolitics. I’ve been fortunate to visit many countries, and each experience has deepened my curiosity and global perspective. I also enjoy singing, hiking, and watching Formula 1. I’m known for being super talkative—my friends joke that I could hold a conversation with a wall—and I love connecting with people from all walks of life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my connection with students will come from a place of genuine understanding. I’ve been in your shoes—I know what it feels like to navigate uncertainty, to question your path, and to balance ambition with self-doubt. I believe mentorship is about more than giving advice; it’s about building trust, celebrating progress, and walking alongside someone as they discover what they’re capable of.\u003c/p\u003e","teachingVideoPlaybackId":"bd01QmrQwyeU4KyhM12VPJj8fFtB1TRqdrObzE6Gg0202E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5ccca95b-ed5a-4c32-b2aa-cd8c8d0a5304\"}"},{"__ref":"Favorites:{\"uuid\":\"df0781c3-8c65-42aa-a44b-ba2927588cd2\"}"},{"__ref":"Favorites:{\"uuid\":\"d25019f4-0a69-4263-a92f-e7caef88f8fd\"}"}],"causesSupported":[],"major":"Philosophy, Politics and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5a846d48-0d51-4a6b-aab2-531ea0518a80\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b9ca66f-5f93-4121-a41d-247acf3a4074\"}"},{"__ref":"DeepDives:{\"uuid\":\"8019f438-7385-4362-bb49-138f5dbb4eb5\"}"},{"__ref":"DeepDives:{\"uuid\":\"6069e7f2-dab4-42a4-8a3f-34c3165fa3d6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/422ed60a-cb61-4793-a251-8dd7f4e6a836/-/preview/-/format/jpg/","https://ucarecdn.com/5e8ea50a-536f-426b-9919-be6b39cc58c9/-/preview/-/format/jpg/","https://ucarecdn.com/d84d9b61-9745-4839-bb9e-899aefbd3914/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"92599198-a6a9-4a1f-97c3-8b4ea5dc2f32\"}"},{"__ref":"Education:{\"uuid\":\"a9567e08-e5f0-4872-a43d-e0f262b62328\"}"}],"hiredAt":"2025-06-27T13:15:47.233Z","topics":["K-5 Grade Math","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Music","History Project","Video / Photography","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Business / Entrepreneurship","Sustainability","Law / Government / Policy","Public Speaking","Debate"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maria-herrera\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"cdc9a776-35aa-4f05-ab4a-b7e7fa06bb11\"}"}}},"_sentryTraceData":"28922b637e4748208188341bae251702-b2b1ef7b06037068-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=28922b637e4748208188341bae251702,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"maria-herrera"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscrip
