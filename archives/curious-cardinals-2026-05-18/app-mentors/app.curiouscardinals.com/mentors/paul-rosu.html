js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"816e0f9f-84dd-4cff-b369-3b61b4ff42fe\"}":{"__typename":"Favorites","uuid":"816e0f9f-84dd-4cff-b369-3b61b4ff42fe","photoUrl":"https://ucarecdn.com/e22d9ef1-7f82-4f76-8a8c-b07a1b8376f5/","title":"The Little Prince","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ad056322-ccac-4046-bc64-55ed1d17c708\"}":{"__typename":"DeepDives","uuid":"ad056322-ccac-4046-bc64-55ed1d17c708","content":"\u003cp\u003eDon't stop learning as much as you can—but make sure to explore. There's no need to fixate too soon on just one interest, even if it seems exciting right now. Allow yourself the chance to enjoy and discover many different things. Gain a bit of knowledge about as many subjects and experiences as possible before you strongly commit to any one area. Eventually, you'll find something that deeply resonates with you. At that point, it won't even feel like a conscious choice to work or think about it—it'll simply be what naturally calls to you. So don't rush. Take your time learning broadly, doing plenty, and genuinely enjoying it along the way. The hard work will only intensify from here, so it's crucial to discover what truly excites you—because loving what you do is what will sustain you through the effort.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"290cf65f-f929-43b3-8f13-7d45c4450d12\"}":{"__typename":"DeepDives","uuid":"290cf65f-f929-43b3-8f13-7d45c4450d12","content":"\u003cp\u003eMentorship gives me an opportunity to reflect deeply on myself and continuously learn from others. No matter who I'm speaking with, I always come away having learned something valuable—whether about my own behaviors, beliefs, thought processes, or simply new ways to approach things. Mentoring someone is genuinely a two-way street; the more I invest in guiding another person, the more insights I gain myself.\u003c/p\u003e\u003cp\u003eThroughout my life, I've often found myself in the position of advising and mentoring others. People frequently come to me seeking guidance on courses, projects, or how to pursue paths I've already navigated. Each time I reflect on these experiences to provide advice, I'm forced to consider what I did right, where I went wrong, and what I wish I had done differently. Mentorship pushes me to think critically and ensures the advice I offer is better than the guidance I once received.\u003c/p\u003e\u003cp\u003eUltimately, mentorship matters deeply to me because it's a powerful avenue for personal growth. It allows me to help others flourish, and in doing so, I grow alongside them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"0dab29e1-d7f1-4b83-b587-867de7ccf9a0\"}":{"__typename":"DeepDives","uuid":"0dab29e1-d7f1-4b83-b587-867de7ccf9a0","content":"\u003cp\u003eMy greatest source of motivation is not wanting to let my future self down. Even when I don’t have a clear goal in mind, I trust that at some point I will—and when that happens, I want to be ready. I don’t want to look back and realize I jeopardized that future by not putting in the effort earlier. That belief keeps me going, even when the direction isn’t yet clear.\u003c/p\u003e\u003cp\u003eMy motivation is mostly intrinsic. I want to spend my life doing something that challenges me intellectually and excites me at the same time. I’m not entirely sure what that is yet—but I do know that the best way to reach it is by building the strongest possible foundation now. That idea of preparing myself for a meaningful future, even if I don’t fully see it yet, drives me every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"71c1d8a0-6a8b-4851-829b-db777916e518\"}":{"__typename":"DeepDives","uuid":"71c1d8a0-6a8b-4851-829b-db777916e518","content":"\u003cp\u003eA recent passion project began during my freshman year, sparked by the realization that I was nearing the end of my Latin studies—a language I'd been learning since middle school. Facing the possibility of taking my last Latin class ever, I felt a strong desire to leave behind a meaningful contribution to the field.\u003c/p\u003e\u003cp\u003eReflecting on how I could combine my various skills, I developed an AI system leveraging large-language models, designed specifically to translate Latin texts. Driven by the lack of high-quality Latin datasets, I collaborated closely with my professors to create and curate a novel dataset, as existing resources were insufficient. Through some creative techniques—which have since become widely adopted—I was able to nearly double the performance of existing translation models, like Google Translate.\u003c/p\u003e\u003cp\u003eThis project culminated in a paper I presented at the NAACL conference, marking my first significant academic contribution. It was deeply rewarding to see my work validated by the community, and equally satisfying to leverage my long-standing relationship with Latin in such a productive way. This experience laid the groundwork for much of my subsequent research and exploration into natural language processing and further applications of large-language models.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"f33f40de-78cc-4c30-bfeb-1b442cf05f8a\"}":{"__typename":"School","uuid":"f33f40de-78cc-4c30-bfeb-1b442cf05f8a","name":"East Chapel Hill High School","city":"Chapel Hill","type":"HIGH","state":"North Carolina","country":"United States","zip":"27514"},"Education:{\"uuid\":\"54cd6ed3-6e75-49da-8a3f-22ae1fb9a205\"}":{"__typename":"Education","uuid":"54cd6ed3-6e75-49da-8a3f-22ae1fb9a205","school":{"__ref":"School:{\"uuid\":\"f33f40de-78cc-4c30-bfeb-1b442cf05f8a\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"ef7d09b7-2781-4b9c-bc77-ec421ebb3084\"}":{"__typename":"Education","uuid":"ef7d09b7-2781-4b9c-bc77-ec421ebb3084","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mathematics and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"96ef06ae-a7a8-4722-a49c-f59dd8df4805\"}":{"__typename":"MentorPublicProfile","uuid":"96ef06ae-a7a8-4722-a49c-f59dd8df4805","displayName":"Paul R.","slug":"paul-rosu","biography":"\u003cp\u003eHi! I'm Paul, a student at Duke University deeply immersed in mathematics and artificial intelligence. Much of my academic life revolves around training neural networks, developing AI models, and crafting rigorous mathematical proofs related to machine learning. My passion lies in uncovering the theoretical foundations behind AI and using that knowledge to tackle intriguing problems.\u003c/p\u003e\u003cp\u003eOutside of academia, I'm equally driven by a variety of interests. Martial arts hold a special place in my life—I hold a black belt in a Japanese Jiu-Jitsu style and have recently ventured into Brazilian Jiu-Jitsu (BJJ), thoroughly enjoying the learning experience within a tight-knit community.\u003c/p\u003e\u003cp\u003eBefore college, my hobbies centered heavily around cars. I spent a fair bit of time driving and modifying vehicles, even investing considerable time in simulators. I went as far as creating a digital replica of my own GTI to improve my driving skills—though admittedly, it wasn't that accurate. Although I don't spend as much time on simulators these days, I still relish the occasional spirited drive.\u003c/p\u003e\u003cp\u003eCooking is another significant passion—I love the challenge and creativity involved in preparing elaborate, multi-course meals. Admittedly, I often find myself overcommitted, spending way more time in the kitchen than initially planned, but that's part of the joy in it!\u003c/p\u003e\u003cp\u003eMy journey with mathematics started early—I began dual-enrolling at the University of North Carolina in mathematics courses as early as the fifth grade. Let's keep that a secret though; as a Duke fan at heart, I wouldn't want anyone suspecting I'm a double agent. Over the past decade, I've consistently taken university-level math courses each semester, exploring a large range of topics from fundamental applications to much deeper theoretical concepts. This extensive background equips me to effectively mentor students interested in deepening their mathematical understanding or pursuing advanced studies.\u003c/p\u003e\u003cp\u003eI'm also quite actively engaged in research, soon approaching involvement in ten distinct projects either being prepared for submission or having already been accepted to conferences in mathematics and AI. Previously, I led the programming team of my high school's robotics club, competing at the world championships twice. Engineering projects like these have further reinforced my enthusiasm for problem-solving and innovation.\u003c/p\u003e\u003cp\u003eAs a mentor and tutor, my goal is to share not just knowledge, but also passion and curiosity. Whether you're looking to improve your skills in mathematics, dive deep into AI, explore coding projects, or simply find ways to balance academics with meaningful hobbies, I'm here to guide and support your journey.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"Cl2XxfWxPONxw1rgako0002Uig1xtvt34VejQH013gEtUQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"816e0f9f-84dd-4cff-b369-3b61b4ff42fe\"}"}],"causesSupported":[],"major":"Mathematics and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ad056322-ccac-4046-bc64-55ed1d17c708\"}"},{"__ref":"DeepDives:{\"uuid\":\"290cf65f-f929-43b3-8f13-7d45c4450d12\"}"},{"__ref":"DeepDives:{\"uuid\":\"0dab29e1-d7f1-4b83-b587-867de7ccf9a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"71c1d8a0-6a8b-4851-829b-db777916e518\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0d87d46e-77b8-454c-88ce-24c4bcf975e1/-/preview/-/format/jpg/","https://ucarecdn.com/fb50f64a-8ddc-4d3b-9a55-6bd127b1b734/-/preview/-/format/jpg/","https://ucarecdn.com/d4baba4f-5aeb-456b-8926-7bf91d76b71a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"54cd6ed3-6e75-49da-8a3f-22ae1fb9a205\"}"},{"__ref":"Education:{\"uuid\":\"ef7d09b7-2781-4b9c-bc77-ec421ebb3084\"}"}],"hiredAt":"2025-05-06T11:53:47.537Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Physics","Latin","Academic Coaching","Computer Science","Executive Function"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"paul-rosu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"96ef06ae-a7a8-4722-a49c-f59dd8df4805\"}"}}},"_sentryTraceData":"d23e4a025df34ed183cc4a18b5860328-b53d4c8d4ff19c80-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d23e4a025df34ed183cc4a18b5860328,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"paul-rosu"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
