xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"de8ac3c7-a9fc-45d1-91ed-b1eec0de0041\"}":{"__typename":"Favorites","uuid":"de8ac3c7-a9fc-45d1-91ed-b1eec0de0041","photoUrl":"https://ucarecdn.com/d0e0c3a1-4e58-48bf-9963-e8a55ae31460/","title":"Novak Djokovic","type":"ATHLETE"},"Favorites:{\"uuid\":\"cd32ecf3-3de6-4f49-8aec-4f54c219ca85\"}":{"__typename":"Favorites","uuid":"cd32ecf3-3de6-4f49-8aec-4f54c219ca85","photoUrl":"https://ucarecdn.com/4d2a4adb-fe5b-4ea7-8f07-9b15a1359ae1/","title":"Steve Lacy","type":"ARTIST"},"Favorites:{\"uuid\":\"d61a0ae9-fe71-4077-8ef8-4106b233e61b\"}":{"__typename":"Favorites","uuid":"d61a0ae9-fe71-4077-8ef8-4106b233e61b","photoUrl":"https://ucarecdn.com/05aa4a1c-2dbd-4693-9d51-a04044dc5f73/","title":"Ryan Gosling","type":"ACTOR"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"fe62d763-4ed0-4348-8c87-3a6b960e6733\"}":{"__typename":"DeepDives","uuid":"fe62d763-4ed0-4348-8c87-3a6b960e6733","content":"\u003cp\u003eGo easy on yourself. Be comfortable with where you are in life and the journey you are taking in this world. Don't be afraid to go at your own pace, whether it's faster or slower. We only have one life, so make sure to enjoy it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"22104a3a-e17d-4f31-bd66-09aa620497b3\"}":{"__typename":"DeepDives","uuid":"22104a3a-e17d-4f31-bd66-09aa620497b3","content":"\u003cp\u003eMentorship is so much more than simply a teacher-student relationship. Mentorship can and should be a formative experience for both mentor and mentee. To be able to learn and draw from the lived experiences of different individuals is one of the greatest gifts humans have, and we must make use of it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"c598b01d-217a-4117-ad96-17770919ed64\"}":{"__typename":"DeepDives","uuid":"c598b01d-217a-4117-ad96-17770919ed64","content":"\u003cp\u003eMy greatest source of motivation is definitely my parents. They immigrated to the US with so little, and yet both ended up graduating from law school. I work hard so that one day I will be the one taking care of them to pay back for all the love they have shown me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"97a849c9-1932-4c5a-8ad7-eb6fbd6df43c\"}":{"__typename":"DeepDives","uuid":"97a849c9-1932-4c5a-8ad7-eb6fbd6df43c","content":"\u003cp\u003eSomething I am incredibly proud of is being one of the two students selected from my state to be selected for the United States Senate Youth Program. I was rejected from the program the year prior, so I am most proud that I didn't give up despite my unfortunate result the year prior. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"ce44b152-aee8-4022-a264-50b89c84e15c\"}":{"__typename":"School","uuid":"ce44b152-aee8-4022-a264-50b89c84e15c","name":"Haas Hall Academy","city":"Fayetteville","type":"HIGH","state":"Arkansas","country":"United States","zip":"72703"},"Education:{\"uuid\":\"74ed72ba-a513-47ff-8373-e1e32fe12bf1\"}":{"__typename":"Education","uuid":"74ed72ba-a513-47ff-8373-e1e32fe12bf1","school":{"__ref":"School:{\"uuid\":\"ce44b152-aee8-4022-a264-50b89c84e15c\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"dd25083a-b5c5-4648-8cba-36e7ad3fe67f\"}":{"__typename":"Education","uuid":"dd25083a-b5c5-4648-8cba-36e7ad3fe67f","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"a7ea60f4-56b0-4ad0-8281-1a4c69306add\"}":{"__typename":"MentorPublicProfile","uuid":"a7ea60f4-56b0-4ad0-8281-1a4c69306add","displayName":"Joshua O.","slug":"joshua-","biography":"\u003cp\u003eHi, I’m Joshua Ofodile. I’m a sophomore at Yale studying Economics and Global Affairs, and I’m originally from Fayetteville, Arkansas—home of the Razorbacks and the place that first sparked my interest in public service. In high school, I had the chance to serve as a U.S. Senate Page and was later selected for the U.S. Senate Youth Program. I also completed a few public policy fellowships that really opened my eyes to how policy shapes people’s lives and how young people can play a role in that.\u003c/p\u003e\u003cp\u003eAt Yale, I try to stay involved in things that reflect my interests and values. I’m a member of \u003cstrong\u003eBlackGen Capital\u003c/strong\u003e, where we focus on increasing financial literacy and investment knowledge within minority communities. I also play for \u003cstrong\u003eYale Club Basketball\u003c/strong\u003e, and I’m active in the \u003cstrong\u003eYale Political Union\u003c/strong\u003e, where I get to hear a range of viewpoints and sharpen my own thinking on big political questions.\u003c/p\u003e\u003cp\u003eI know what it’s like to feel behind in a class or unsure where to even start with a subject. There’ve been moments when I needed help understanding something or just needed someone to walk through a concept with me without judgment. That’s why I care so much about mentorship—because I’ve been in that boat too, and I know how much of a difference it makes when someone’s willing to meet you where you are.\u003c/p\u003e\u003cp\u003eOutside of academics, I’m a huge fan of film—I love watching movies and even writing reviews from time to time. I also enjoy exploring new places, trying different foods, and staying active by playing tennis and basketball whenever I get the chance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether you're interested in economics, politics, writing, or just need help figuring out how to study effectively, I’d love to be in your corner.\u003c/p\u003e","teachingVideoPlaybackId":"CK01NU00lIFjdG76U7xEm00iZCu00rg47HhqaSqthkdDfPM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"de8ac3c7-a9fc-45d1-91ed-b1eec0de0041\"}"},{"__ref":"Favorites:{\"uuid\":\"cd32ecf3-3de6-4f49-8aec-4f54c219ca85\"}"},{"__ref":"Favorites:{\"uuid\":\"d61a0ae9-fe71-4077-8ef8-4106b233e61b\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fe62d763-4ed0-4348-8c87-3a6b960e6733\"}"},{"__ref":"DeepDives:{\"uuid\":\"22104a3a-e17d-4f31-bd66-09aa620497b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"c598b01d-217a-4117-ad96-17770919ed64\"}"},{"__ref":"DeepDives:{\"uuid\":\"97a849c9-1932-4c5a-8ad7-eb6f
