xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"23df1273-2be4-4502-9b3b-f60cd521bb07\"}":{"__typename":"DeepDives","uuid":"23df1273-2be4-4502-9b3b-f60cd521bb07","content":"\u003cp\u003eI came into Stanford wanting to study Psychology or Education, but I also wanted to learn some technical skills beyond the humanities. I stumbled upon Symbolic Systems, but was initially intimidated by the Computer Science requirement since I have never taken a coding class before. After my first CS106A class, I have completely fallen in love with using code to turn my dream projects into reality. I combine my passion for Symbolic Systems with Design, and have created apps such as \u003cem\u003erevisit\u003c/em\u003e, which is a travelling app that helps people generate travel itineraries. I have also worked as a founder for an EdTech startup called \u003cem\u003espellr\u003c/em\u003e, where we aimed to provide a phonic tutoring system.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSymbolic Systems has been a major that has allowed me the freedom to build what I want but to also challenge myself technically. I cannot recommend it more to anyone!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0c38654e-c887-4468-b1c1-9b25d7af904d\"}":{"__typename":"DeepDives","uuid":"0c38654e-c887-4468-b1c1-9b25d7af904d","content":"\u003cp\u003eAnyone who knows me knows that I love children. It is very hard to explain why, but I get immense pride when I see a child succeed. I had a great childhood growing up, I was raised in a beautiful family and I had amazing teachers and friends. It pains me to hear about children who do not get this experience, and I want to actively help to change that for the world. Mentoring is both an activity where I teach and I learn, and ultimately I get to make a new friend. I treat children the same way I would treat anyone my age, because I believe that children reach their potential through constant support and confidence that they are able to reach their goals, even on their own. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have also mentored extensively in the past. I was a peer mentor in high school for incoming students, a private tutor, a college mentor for incoming international students, and now I am super excited to give back once again through Curious Cardinals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2a4ac1cc-5a88-470a-a6fc-d759faf2b0c1\"}":{"__typename":"DeepDives","uuid":"2a4ac1cc-5a88-470a-a6fc-d759faf2b0c1","content":"\u003cp\u003eI was a founder of an EdTech startup called \u003cem\u003espellr\u003c/em\u003e. Our aim was to create a fully free platform where dyslexic children would be able to receive the phonics education they all deserved. I outsourced parents of dyslexic children around the nation, had many calls to understand their problem space, and ultimately also worked with their children in designing our activities better. I also talked to many dyslexia school representatives to understand the field better. Even though this lasted only one year due to team dynamics, this project taught me that anyone is able to achieve anything they want if they put their mind to it and they receive the support they need. Stanford has been a beautiful place for startups to rise, and I want to give back to the community and the world by serving as a Stanford representative and to help children reach their dreams before they even get to college!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4a5ae855-031c-4905-b75f-2f7bfa0a4c6c\"}":{"__typename":"DeepDives","uuid":"4a5ae855-031c-4905-b75f-2f7bfa0a4c6c","content":"\u003cp\u003eYou know how we always say that \"as a kid, we wanted to be a __\"? My advice to my younger self would be to go and just achieve that dream. There is always so much intimidation when it comes to reaching for one's dream, especially when you feel like you don't have the resources to do so. As a mentor, I want to help children reach for their closest dream, not only because I want them to actually be able to achieve their dream, but I also want them to realize that they are invincible and can achieve anything as long as they set their mind to it. Getting past the mind block is the biggest thing I can teach!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"c689d034-db2b-4e8a-aa94-cef31f6cefc7\"}":{"__typename":"School","uuid":"c689d034-db2b-4e8a-aa94-cef31f6cefc7","name":"St. Stephen's School","city":"Roma","type":"HIGH","state":"Lazio","country":"Italy","zip":"00153"},"Education:{\"uuid\":\"93d5412e-5f17-469f-845c-17fb80df8cba\"}":{"__typename":"Education","uuid":"93d5412e-5f17-469f-845c-17fb80df8cba","school":{"__ref":"School:{\"uuid\":\"c689d034-db2b-4e8a-aa94-cef31f6cefc7\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"76dc1a11-27b3-409a-bef4-342e33d83eb8\"}":{"__typename":"Education","uuid":"76dc1a11-27b3-409a-bef4-342e33d83eb8","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Symbolic Systems (Human Computer Interaction)","degree":null},"MentorPublicProfile:{\"uuid\":\"5c3363c5-1488-4f3b-9415-38bc374013d8\"}":{"__typename":"MentorPublicProfile","uuid":"5c3363c5-1488-4f3b-9415-38bc374013d8","displayName":"Ilaria C.","slug":"ilaria-chen","biography":"\u003cp\u003eHi! Welcome to my world :)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am an international student from Rome, Italy, and I am super passionate about anything related to languages, education, and design in tech. I am currently learning about language learning models, product design philosophies, and linguistics at Stanford. These are subjects that I love and have fun teaching about!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love to dance (check out Stanford's Alliance dance team!) and am a member of Stanford's Equestrian Team. I also love to meet with young kids and to empower them in any way I can, even just as a friend. For example, I love going to the YMCA to volunteer as a swimming teacher for the SNAP Kids.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I have worked with Stanford's Language and Cognition lab as a research assistant for a Tangrams psychology project, been a product designer for Stanford's Graduate School of Education (VR testing specifically), and I will be working with Upsolve, the nation's greatest debt relief nonprofit, as a product strategy intern this summer! I have also taught children from all backgrounds, ranging from refugee children in Rome to online tutoring in English.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFeel free to reach out anytime, always here and happy to help!\u003c/p\u003e","teachingVideoPlaybackId":"28fzxg5dwGIy87W9OohgtEtl01ToJAhdXTnJu7zXDoPc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems (Human Computer Interaction)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"23df1273-2be4-4502-9b3b-f60cd521bb07\"}"},{"__ref":"DeepDives:{\"uuid\":\"0c38654e-c887-4468-b1c1-9b25d7af904d\"}"},{"__ref":"DeepDives:{\"uuid\":\"2a4ac1cc-5a88-470a-a6fc-d759faf2b0c1\"}"},{"__ref":"DeepDives:{\"uuid\":\"4a5ae855-031c-4905-b75f-2f7bfa0a4c6c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cf5a1edd-68ca-4bde-8470-a7c8a623d145/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"93d5412e-5f17-469f-845c-17fb80df8cba\"}"},{"__ref":"Education:{\"uuid\":\"76dc1a11-27b3-409a-bef4-342e33d83eb8\"}"}],"hiredAt":"2025-03-11T11:29:12.035Z","topics":["K-5 Grade Math","Writing","Mandarin Chinese","Spanish","Latin","K-6 Storybook","Creative Writing","Business / Entrepreneurship","Web Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ilaria-chen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5c3363c5-1488-4f3b-9415-38bc374013d8\"}"}}},"_sentryTraceData":"51b0cfcb5d71470787285479136ecf7a-ab164dbb57472893-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=51b0cfcb
