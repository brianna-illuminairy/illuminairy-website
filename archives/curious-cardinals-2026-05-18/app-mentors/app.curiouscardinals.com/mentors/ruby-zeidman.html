xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d8918f1d-bd85-41ad-994a-55337ff0c7f1\"}":{"__typename":"Favorites","uuid":"d8918f1d-bd85-41ad-994a-55337ff0c7f1","photoUrl":"https://ucarecdn.com/f741cca3-4117-48ed-b608-a42368aa6cdd/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"b3fc7684-5f2a-4cf1-905b-9e8ff36ecd21\"}":{"__typename":"Favorites","uuid":"b3fc7684-5f2a-4cf1-905b-9e8ff36ecd21","photoUrl":"https://ucarecdn.com/b84571e5-9a68-47a1-8c6b-d1ed98c850a0/","title":"Charli XCX","type":"ARTIST"},"Favorites:{\"uuid\":\"b1c2c251-4fe5-4482-b870-42efbdb324aa\"}":{"__typename":"Favorites","uuid":"b1c2c251-4fe5-4482-b870-42efbdb324aa","photoUrl":"https://ucarecdn.com/2bd23ff5-fbfb-4624-9922-4a8dcfb5e2f5/","title":"Hereditary","type":"MOVIE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"937fd28b-e29d-4643-b6ca-9c60b9e6ce88\"}":{"__typename":"DeepDives","uuid":"937fd28b-e29d-4643-b6ca-9c60b9e6ce88","content":"\u003cp\u003eIf I could have any job, I would be a food reviewer (not critic necessarily because I'm not all that picky). I'm not sure if that's what the future has in store for me, but I love to write (and eat)!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"b54ed161-01c9-4222-b48e-fb7546bd3c3d\"}":{"__typename":"DeepDives","uuid":"b54ed161-01c9-4222-b48e-fb7546bd3c3d","content":"\u003cp\u003eIn high school, I was a major perfectionist, and I was always more focused on making sure I had the 'right' answers. If I had had a program like Curious Cardinals, I could've explored subjects with more curiosity and gotten more out of my classes. While grades matter, it's so important to explore and see coursework as a jumping-off point for your own educational journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"10097838-1600-415e-bbcd-2542d21471df\"}":{"__typename":"DeepDives","uuid":"10097838-1600-415e-bbcd-2542d21471df","content":"\u003cp\u003eI love working with others and getting to form close connections. This has been a common theme in most of the work I've done from literacy tutoring in high school to working at an Elementary school abroad now. I believe education and growth are deeply personal, and each mentor relationship is completely unique. Figuring out how to support mentees and getting to know them are one and the same, and it's the best part of being a mentor. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}":{"__typename":"School","uuid":"e5a76254-778b-4843-9fe4-18689765e318","name":"Sidwell Friends School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20016"},"Education:{\"uuid\":\"d8d74a28-a3b0-44d8-b564-06aeef6f1769\"}":{"__typename":"Education","uuid":"d8d74a28-a3b0-44d8-b564-06aeef6f1769","school":{"__ref":"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}"},"startYear":"2016","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}":{"__typename":"School","uuid":"67d96877-4245-4f9b-a557-94f9ecabd290","name":"Barnard College","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"9972ec84-c9c4-4002-b8cb-d366f43404d3\"}":{"__typename":"Education","uuid":"9972ec84-c9c4-4002-b8cb-d366f43404d3","school":{"__ref":"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"psychology and human rights","degree":null},"MentorPublicProfile:{\"uuid\":\"7b8896bd-827a-4c8a-b96b-79ae947f885b\"}":{"__typename":"MentorPublicProfile","uuid":"7b8896bd-827a-4c8a-b96b-79ae947f885b","displayName":"Ruby Z.","slug":"ruby-zeidman","biography":"\u003cp\u003eHi! My name is Ruby, and I grew up across Los Angeles, New York City, and Washington, D.C. I’ve been passionate about educational equity ever since high school, when I worked with a nonprofit that provided one-on-one literacy tutoring to elementary students. That experience shaped how I think about access to education. Since then, I’ve graduated from Barnard College and spent the past year working as an English Lecturer at a university in Thailand on a Princeton in Asia fellowship. I am currently a Fulbright Fellow in Taiwan, where I work at an elementary school, supporting students’ academic growth and fostering cultural exchange. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen it comes to mentorship, I take a student-centered approach and believe that what works for one student won’t necessarily resonate with another. I am passionate about academic mentorship and enjoy helping students build confidence, curiosity, and independence in their learning. I work with students in grades K–12 on reading and writing. I also do academic coaching, college essay writing, creative writing, and journalism. I worked on my high school and college newspapers, which sparked my interest in storytelling and clear communication. Writing has always been central to my academic experience, and I especially enjoy helping students strengthen their writing, whether that means developing ideas, organizing arguments, or polishing final drafts.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my teaching experience, I served as a Resident Assistant for three years in college, where I supported students with time management, organization, and navigating academic or career-related decisions, including the internship and job search process. I also worked in a social dynamics lab, where I conducted a comprehensive literature review about diversity in the field of psychology. For my senior thesis, I also ran a study that examined exam performance and sense of belonging in the classroom. As someone with many interests and a deep curiosity about the world, I believe it’s both possible and important to explore different passions. If you’re balancing multiple interests or looking for support in finding your academic direction, I’d love to work with you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work, I love reading, watching scary movies, cooking, and running. I recently completed my first 10K and am currently training for a half-marathon. I also spend much of my free time studying Mandarin and exploring Taiwan.\u003c/p\u003e","teachingVideoPlaybackId":"sIEqZPcBRezBE6jfypieSE1DOs600IXHsOesEHTjUo200","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d8918f1d-bd85-41ad-994a-55337ff0c7f1\"}"},{"__ref":"Favorites:{\"uuid\":\"b3fc7684-5f2a-4cf1-905b-9e8ff36ecd21\"}"},{"__ref":"Favorites:{\"uuid\":\"b1c2c251-4fe5-4482-b870-42efbdb324aa\"}"}],"causesSupported":[],"major":"psychology and human rights","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"937fd28b-e29d-4643-b6ca-9c60b9e6ce88\"}"},{"__ref":"DeepDives:{\"uuid\":\"b54ed161-01c9-4222-b48e-fb7546bd3c3d\"}"},{"__ref":"DeepDives:{\"uuid\":\"10097838-1600-4
