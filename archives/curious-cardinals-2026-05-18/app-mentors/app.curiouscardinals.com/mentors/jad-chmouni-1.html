xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ecadb1cd-59bd-453e-b2a8-a145d0af884e\"}":{"__typename":"DeepDives","uuid":"ecadb1cd-59bd-453e-b2a8-a145d0af884e","content":"\u003cp\u003eBe curious, despite the lectures seeming boring, uninteresting or even not understandable. Go the extra mile find a way to make yourself love the pursuit of knowledge. Nobody ever regretted learning something. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"77698317-066c-4ead-afe3-a81eabd4b7a3\"}":{"__typename":"DeepDives","uuid":"77698317-066c-4ead-afe3-a81eabd4b7a3","content":"\u003cp\u003eAs someone who had dysgraphia, struggled with understanding complex STEM subjects during high school, I always thought I was not cut out to become a Mechanical Engineer (my dream degree). However, after taking the risk and moving on with my choice of studying Mechanical Engineering, I have come to realize that every person has a special way of learning and a unique approach. I want to be the person that provides that for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"890eb4f0-fd2d-4d3a-82c5-081ffd2ef4bd\"}":{"__typename":"DeepDives","uuid":"890eb4f0-fd2d-4d3a-82c5-081ffd2ef4bd","content":"\u003cp\u003eMy heritage and typical teaching styles in Lebanon affect my teaching style in a manner that I try to move away from it. It being very theoritcal, memorization-based, and unappealing to the average teenager. I tend to make subjects more hands-on and more approachable.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2e519cba-f9ca-4a74-a2e1-215a68e6b32b\"}":{"__typename":"DeepDives","uuid":"2e519cba-f9ca-4a74-a2e1-215a68e6b32b","content":"\u003cp\u003eI am athletic, so part of my spare time is spent working out and playing sports like basketball and padel. The rest I keep for socializing, meeting new people, etc.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"0a77c6dd-363e-4023-89a8-8bd946b10d7d\"}":{"__typename":"School","uuid":"0a77c6dd-363e-4023-89a8-8bd946b10d7d","name":"College Saint Joseph Des soeurs Antonines","city":"Zahle","type":"HIGH","state":"Beqaa","country":"Lebanon","zip":"1801"},"Education:{\"uuid\":\"e6306375-f16b-4cec-9089-995a3c47eaee\"}":{"__typename":"Education","uuid":"e6306375-f16b-4cec-9089-995a3c47eaee","school":{"__ref":"School:{\"uuid\":\"0a77c6dd-363e-4023-89a8-8bd946b10d7d\"}"},"startYear":"2015","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"8d7399c9-6a7d-4dfe-9c60-d5c31a46ffe0\"}":{"__typename":"School","uuid":"8d7399c9-6a7d-4dfe-9c60-d5c31a46ffe0","name":"Politecnico Di Milano","city":"Milano","type":"COLLEGE","state":"Lombardia","country":"إيطاليا","zip":"20133"},"Education:{\"uuid\":\"eb352060-85cc-4338-a5ed-ac3c2c095bf2\"}":{"__typename":"Education","uuid":"eb352060-85cc-4338-a5ed-ac3c2c095bf2","school":{"__ref":"School:{\"uuid\":\"8d7399c9-6a7d-4dfe-9c60-d5c31a46ffe0\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"cf6f1cf1-c476-4a59-b8c4-0ace352344c2\"}":{"__typename":"MentorPublicProfile","uuid":"cf6f1cf1-c476-4a59-b8c4-0ace352344c2","displayName":"Jad C.","slug":"jad-chmouni-1","biography":"\u003cp\u003eDriven by curiosity and a passion for building meaningful solutions, I am an interdisciplinary professional with a background that bridges engineering, technology, research, and education. My journey has been shaped by a constant desire to understand how systems work—whether technical, organizational, or educational—and to transform complexity into practical, impactful outcomes that make a real difference in people’s lives.\u003c/p\u003e\u003cp\u003eMy experience spans production engineering, applied research, and tutoring, allowing me to operate comfortably at the intersection of theory and practice. I have worked on diverse projects ranging from manufacturing optimization and renewable energy systems to municipal solid waste facility design and data-driven analysis. In these roles, I have led technical assessments, developed process improvement strategies, and contributed to infrastructure and sustainability initiatives. Across all projects, I prioritize efficiency, safety, and long-term impact, while remaining attentive to real-world constraints. My academic training, complemented by extensive hands-on field experience, has strengthened my analytical mindset and enabled me to approach challenges from both technical and strategic perspectives.\u003c/p\u003e\u003cp\u003eBeyond technical expertise, I am deeply interested in learning models that connect theory with real-world application. This interest is personal as well as professional. Having experienced academic struggle during high school and later growth and achievement at the university level, I understand firsthand how transformative the right guidance, encouragement, and learning environment can be. This experience shaped my belief that meaningful learning happens when curiosity is supported by mentorship and practical experience rather than rigid instruction alone.\u003c/p\u003e\u003cp\u003eThroughout my professional path, I have consistently embraced interdisciplinary thinking and collaboration. I have worked closely with engineers, researchers, and operational staff, learning to communicate complex ideas clearly and adapt solutions to different audiences and contexts. Whether optimizing production workflows, contributing to research initiatives, or supporting learners through tutoring, I strive to connect technical rigor with human-centered outcomes.\u003c/p\u003e\u003cp\u003eI am motivated by environments that value exploration, mentorship, and continuous growth. My goal is not only to solve problems, but also to contribute to systems that empower others to learn, innovate, and thrive. By combining technical expertise with curiosity, empathy, and a collaborative mindset, I aim to create solutions that are both technically sound and socially meaningful.\u003c/p\u003e","teachingVideoPlaybackId":"UXZbevhcpIQiNsIgQX00zqO01TcFRK6wdMCJ9uefk02C02o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ecadb1cd-59bd-453e-b2a8-a145d0af884e\"}"},{"__ref":"DeepDives:{\"uuid\":\"77698317-066c-4ead-afe3-a81eabd4b7a3\"}"},{"__ref":"DeepDives:{\"uuid\":\"890eb4f0-fd2d-4d3a-82c5-081ffd2ef4bd\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e519cba-f9ca-4a74-a2e1-215a68e6b32b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/10c4cf99-b613-4f84-b7
