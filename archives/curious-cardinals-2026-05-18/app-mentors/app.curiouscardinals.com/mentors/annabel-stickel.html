xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f51ccea1-ca21-4e97-971f-294683d3ac18\"}":{"__typename":"DeepDives","uuid":"f51ccea1-ca21-4e97-971f-294683d3ac18","content":"\u003cp\u003eI have always been interested in science and medicine, so I spent most summers in highschool volunteering and shadowing doctors. Volunteering at my local hospital was a great way to serve my community and get to know what it's like to work in a hospital setting. Additionally, there are many ways to serve the broader community and gain new experiences. My sophomore summer, I went to Argentina on a study abroad program where I volunteered in hospitals and clinics; I was completely immersed in a new culture and was able to apply my Spanish skills and science skills firsthand. Lastly, I believe that highschool summers are the perfect opportunity to try something completely new! When the pandemic hit and my summer plans were cancelled, my friend and I started a tie-dye company. We hand-made our products, created a website and social media account to sell products, and learned how to market our products with advertisements and partnerships. Not only was this a fun experience, but it taught my friend and I valuable lessons about creating your own company.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b82b23d9-5a77-40de-b11b-13c521a85c17\"}":{"__typename":"DeepDives","uuid":"b82b23d9-5a77-40de-b11b-13c521a85c17","content":"\u003cp\u003eI believe that mentorship is such a powerful tool - mentorship brings about lasting relationships between the mentor and mentee, where both can learn from and build off of one another. Mentors in my life have allowed me to uncover my passions, gain new insights, and have someone to look up to and share my aspirations with. I hope to be this person for my mentee.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9fa1e040-d3a3-4bb9-8e70-1c2faca46e14\"}":{"__typename":"DeepDives","uuid":"9fa1e040-d3a3-4bb9-8e70-1c2faca46e14","content":"\u003cp\u003eI would tell my middle/high school self to not be afraid to try new things and put yourself out there. It is often hard to not care what others think, especially at this time in one's life. However, middle/high school is a great time to try new things and start to figure out what you are interested in. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d11298af-e72a-4b83-a54b-7052fa55c49f\"}":{"__typename":"DeepDives","uuid":"d11298af-e72a-4b83-a54b-7052fa55c49f","content":"\u003cp\u003ePrior to coming to Duke, I had always been interested in biology, specifically human anatomy. However, it wasn't until college that I took my first psychology class - I instantly became fascinated with the mind. Neuroscience was the perfect combination of biology and psychology, allowing me to study the foundations behind why we think and act the way we do. Neuroscience is an ever-evolving field - there is so much left to uncover, and so much progress to be made to improve human health. Overall, neuroscience was the perfect fit for me, sparking my interests and passions. But, the biggest takeaway from choosing my major is that you do not need to know what you want to major in before coming to college! There is so much to learn and explore in college, so going in with an open mind and willingness to learn will allow you to discover what you are passionate about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"955073a7-5da6-4376-9945-4d76302b9009\"}":{"__typename":"School","uuid":"955073a7-5da6-4376-9945-4d76302b9009","name":"Greenwich Academy","city":"Greenwich","type":"HIGH","state":"Connecticut","country":"United States","zip":"06830"},"Education:{\"uuid\":\"64393039-47c6-4071-a077-c35519145b5d\"}":{"__typename":"Education","uuid":"64393039-47c6-4071-a077-c35519145b5d","school":{"__ref":"School:{\"uuid\":\"955073a7-5da6-4376-9945-4d76302b9009\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"14b44d8e-8147-480e-b7f7-2352d429f955\"}":{"__typename":"Education","uuid":"14b44d8e-8147-480e-b7f7-2352d429f955","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"de4237d2-3e13-42e6-8548-806d7fdea631\"}":{"__typename":"MentorPublicProfile","uuid":"de4237d2-3e13-42e6-8548-806d7fdea631","displayName":"Annabel S.","slug":"annabel-stickel","biography":"\u003cp\u003eAnnabel is a rising junior at Duke University pursuing a degree in neuroscience with minors in economics and chemistry. From a young age, Annabel has loved science and medicine. Though she is not sure what career in medicine she wants to pursue, she is on the pre-medical track. She volunteers in the neuroscience unit at Duke University Hospital and has shadowed a variety of doctors within the Duke Hospital System. She also works in a Parkinson's Disease Lab at Duke Medical School where she analyzes mouse models with mutations in Parkinson's disease genes.\u003c/p\u003e\u003cp\u003e                                                                \u003c/p\u003e\u003cp\u003eAnnabel is also interested in business, specifically the overlap of business and healthcare. She is a member of Business Oriented Women, an all-female business organization. As head of the healthcare sector, she plans and moderates healthcare events. In addition, last Fall Annabel interned for a biotech startup specializing in wearable medical devices. From this experience, Annabel learned what it takes to start a company from the ground up and pitch ideas to investors.\u003c/p\u003e\u003cp\u003e                                                                 \u003c/p\u003e\u003cp\u003eAnnabel is very passionate about service. One of Annabel's favorite activities is volunteering through Duke Helping Hands for Alzheimer's and Neurological Disorders; every Friday, she leads creative engagement sessions for residents with dementia, connecting with them through storytelling. Additionally, last summer Annabel volunteered for SynGAP Research Fund, an advocacy organization for patients with the rare neurological disease, SYNGAP1. Serving these populations has had such a positive impact on her life - there are so many ways to get involved and serve the community.\u003c/p\u003e","t
