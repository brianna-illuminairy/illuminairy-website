xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e3009e04-b2a5-4849-a3f5-c7ffce57420b\"}":{"__typename":"Favorites","uuid":"e3009e04-b2a5-4849-a3f5-c7ffce57420b","photoUrl":"https://ucarecdn.com/251e5143-2a00-4855-a513-77552e5a7f5c/","title":"Coldplay","type":"ARTIST"},"Favorites:{\"uuid\":\"7756f104-f198-4e04-b358-7b508a2e55c5\"}":{"__typename":"Favorites","uuid":"7756f104-f198-4e04-b358-7b508a2e55c5","photoUrl":"https://ucarecdn.com/2e0253fa-5723-4e7c-826f-0c54523b64bc/","title":"Lewis Hamilton","type":"ATHLETE"},"Favorites:{\"uuid\":\"9cbe9a0a-e698-48d4-97bb-32fe0d853a10\"}":{"__typename":"Favorites","uuid":"9cbe9a0a-e698-48d4-97bb-32fe0d853a10","photoUrl":"https://ucarecdn.com/e3a94a28-105d-4cb3-84d8-4e90e2100b24/","title":"Cape Town, South Africa","type":"CITY"},"CausesSupported:{\"uuid\":\"6a87a3c2-c61a-4eed-9fef-b861bb32f112\"}":{"__typename":"CausesSupported","uuid":"6a87a3c2-c61a-4eed-9fef-b861bb32f112","name":"Engineers Without Borders USA","description":"\u003cp\u003eFounder, Stanford University Chapter\u003c/p\u003e\u003cp\u003ePresident, Princeton University Chapter\u003c/p\u003e","photoUrl":"https://ucarecdn.com/8fd9c058-2836-41f4-94eb-fb4bdc7e1edc/"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"c53c2d00-c62b-4738-977d-0daac201e9ec\"}":{"__typename":"DeepDives","uuid":"c53c2d00-c62b-4738-977d-0daac201e9ec","content":"\u003cp\u003eHonestly? You all! After spending over a decade exploring my passion for water, I'll admit that maintaining that spark through all the ups and downs of PhD life isn't always easy. There are days when experiments fail, the data doesn't cooperate, and the finish line feels impossibly far away.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut here's what I've discovered: in those moments when I'm feeling most disconnected from my work, nothing reenergizes me quite like interacting with curious students who are in the midst of discovering their own passions. Whether it's the excitement in someone's voice when a concept finally clicks, watching a mentee design their first real research project, or seeing that light-bulb moment when science stops being abstract and becomes \u003cem\u003ereal\u003c/em\u003e. That's what keeps me trudging forward.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYour questions, your fresh perspectives, and your enthusiasm remind me why I fell in love with science in the first place. So while I'm here to help guide your journey, you're also helping fuel mine. It's a pretty great exchange, if you ask me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"753542d0-44f6-4f95-baa3-b07a20caaac7\"}":{"__typename":"DeepDives","uuid":"753542d0-44f6-4f95-baa3-b07a20caaac7","content":"\u003cp\u003eStarting a chapter of Engineers Without Borders at Stanford!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI had worked with EWB as an undergrad at Princeton, where I got to design a water supply system for a rural community in the Dominican Republic called El Cajuil, and then actually travel there to implement it! Those experiences were some of the most valuable of my life. I learned so much about engineering in practice, about myself, about the world, and made lifelong friends along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo when I arrived at Stanford in 2022 and discovered they didn't have an EWB chapter, I was genuinely disappointed. But then I realized: instead of sulking about it, why not just start one myself?\u003c/p\u003e\u003cp\u003eEasier said than done! It took about three years and help from so many people, but we finally got it up and running. Now we have over 50 student members and are working on a water supply project for a community in the highlands of Ecuador.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a PhD student, you are typically encouraged to measure your success by papers published or citations earned. And sure, those matter. But building this EWB chapter will always be one of my greatest accomplishments from this phase of my life. Providing a whole new community of students with the opportunity to do meaningful work that actually changes lives? That's the kind of impact I'm really proud of.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"7687ec8e-0f8f-4206-92d2-cb5667c0781b\"}":{"__typename":"DeepDives","uuid":"7687ec8e-0f8f-4206-92d2-cb5667c0781b","content":"\u003cp\u003eProbably a lot like many of you, I was trying to do \u003cem\u003eanything and everything\u003c/em\u003e I possibly could, convinced that's what I needed to build the perfect college application! In middle school, I tried out for every sports team (though I was devastatingly cut from basketball despite being a 5'10\" sixth grader... still not over it), sang in the school choir, did dance, worked on yearbook, and joined student government. If there was a sign-up sheet, I was on it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile that exploration phase was really valuable for figuring out what I actually enjoyed, I quickly learned an important lesson: I didn't need to do everything under the sun to be an impressive college applicant. In fact, it was having the opposite effect – I was spreading myself way too thin.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo in high school, I made a shift. I focused on a limited set of activities I genuinely loved most: my school's science research program and varsity lacrosse (since my basketball career was over before it started 😅). And here's the thing: not only did this save me from complete burnout, but it actually made me a \u003cem\u003emore\u003c/em\u003e compelling applicant. My application was no longer just a laundry list of clubs I'd half-participated in. Instead, it became a window into who I was as a person and what I was truly passionate about. I could tell a coherent story, not just recite a resume.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0f9096f7-515b-4b0f-9219-b734c93aa08a\"}":{"__typename":"DeepDives","uuid":"0f9096f7-515b-4b0f-9219-b734c93aa08a","content":"\u003cp\u003eWhen I'm not knee-deep in research, you'll usually find me reading a good book, playing tennis, watching TV (my new favorite is \u003cem\u003eShrinking\u003c/em\u003e on Apple TV+, though \u003cem\u003eModern Family\u003c/em\u003e is my forever comfort show), or exploring somewhere new.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm lucky to live in the San Francisco Bay Area, which means \"exploring\" can mean anything from wine tasting in Napa, skiing in Tahoe, or hiking through Yosemite on the weekends. But I also love traveling further afield when I can. Fun fact: I've now been to 6 of the 7 continents! The only one I'm missing is Antarctica, so if anyone has tips for getting there (that don't involve selling a kidney), I'm all ears!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether it's discovering a new trail thirty minutes from home or navigating a city halfway across the world, I love the perspective that comes from stepping outside your everyday routine. Plus, it turns out that some of my best research ideas have come to me while I'm supposedly \"not working\". There's something about giving your brain permission to wander that helps creativity flourish!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"d565a0b1-c123-427c-aca0-5428cb6828f0\"}":{"__typename":"School","uuid":"d565a0b1-c123-427c-aca0-5428cb6828f0","name":"Pine Crest School","city":"Boca Raton","type":"HIGH","state":"Florida","country":"United States","zip":"33434"},"Education:{\"uuid\":\"c381dc6e-e4b1-4851-ae25-f575d06b329b\"}":{"__typename":"Education","uuid":"c381dc6e-e4b1-4851-ae25-f575d06b329b","school":{"__ref":"School:{\"uuid\":\"d565a0b1-c123-427c-aca0-5428cb6828f0\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"7739b194-ee3c-475f-afe3-949f8c912fb2\"}":{"__typename":"Education","uuid":"7739b194-ee3c-475f-afe3-949f8c912fb2","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Civil and Environmental Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"081cf7ea-7048-48eb-b7e5-f2fa9c4688be\"}":{"__typename":"MentorPublicProfile","uuid":"081cf7ea-7048-48eb-b7e5-f2fa9c4688be","displayName":"Caroline A.","slug":"caroline-adkins","biography":"\u003cp\u003eHi! My name is Caroline, I’m originally from Boca Raton, Florida, and I am currently a PhD Candidate in Environmental Engineering at Stanford University. My doctoral research focuses on tackling the global water crisis through non-traditional water supplies, but my journey to get here started almost a decade ago when I experienced a rite of passage for any middle or high school student: sitting in a classroom, waiting for a substitute teacher to pick some kind of educational movie to kill time. Luckily for me, that particular substitute teacher selected For Love of Water (FLOW), a documentary detailing the severity of the water crisis and catastrophic consequences we will face if nothing is done about it. That film sparked something in me, and I’ve been hooked ever since.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSince then, I've tried to approach the water crisis from every angle possible. A couple months after watching that documentary, I joined my high school's science research program and investigated how our local landfill could prevent liquid waste from contaminating groundwater. I then studied Environmental Engineering at Princeton with minors in Global Health and Sustainable Energy, completing my senior thesis on agricultural hydrogels – tiny beads that help crops stay hydrated during droughts. Having fallen in love with research, I came straight to Stanford for my PhD.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003ePerhaps my most impactful work, though, has been with Engineers Without Borders. At Princeton, I led a team that designed and implemented a water supply system for a rural community in the Dominican Republic. That experience taught me that solving real-world problems requires more than technical skills – it takes collaboration, adaptability, and genuine connection with the communities you're serving. When I arrived at Stanford and discovered there wasn't an EWB chapter, I started one myself. Three years later, we have over 50 members working on a water project in the highlands of Ecuador!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI'll be honest: as much as my passion has driven me to where I am today, it hasn't always been smooth sailing. I know what burnout feels like, what it's like to feel disconnected from your work and just altogether exhausted. During those moments, I had incredible people around me who lifted me back up. Since then, I've had the privilege of being that person for others – whether supporting my EWB teams at Princeton and Stanford through the inevitable challenges of international development work, or mentoring my undergraduate and master's research assistants here at Stanford as they navigate the frustrations and triumphs of the research process. Now, I'm excited to be that person for you – whether you're exploring a new interest, pursuing an ambitious project, or just trying to figure out what excites you most!\u003c/p\u003e","teachingVideoPlaybackId":"00oG2024sl008sDctCXapQilY37hO8Gv00SJw78PhRFWJKs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e3009e04-b2a5-4849-a3f5-c7ffce57420b\"}"},{"__ref":"Favorites:{\"uuid\":\"7756f104-f198-4e04-b358-7b508a2e55c5\"}"},{"__ref":"Favorites:{\"uuid\":\"9cbe9a0a-e698-48d4-97bb-32fe0d853a10\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6a87a3c2-c61a-4eed-9fef-b861bb32f112\"}"}],"major":"Civil and Environmental Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c53c2d00-c62b-4738-977d-0daac201e9ec\"}"},{"__ref":"DeepDives:{\"uuid\":\"753542d0-44f6-4f95-baa3-b07a20caaac7\"}"},{"__ref":"DeepDives:{\"uuid\":\"7687ec8e-0f8f-4206-92d2-cb5667c0781b\"}"},{"__ref":"DeepDives:{\"uuid\":\"0f9096f7-515b-4b0f-9219-b734c93aa08a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0661d633-6d5f-47af-b0ba-9669b48c9973/-/preview/-/format/jpg/","https://ucarecdn.com/51dcd3bd-df97-456c-95ba-5f3a5cc96445/-/preview/-/format/jpg/","https://ucarecdn.com/eca0498c-c959-4f45-bf91-ba7817f63dd4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c381dc6e-e4b1-4851-ae25-f575d06b329b\"}"},{"__ref":"Education:{\"uuid\":\"7739b194-ee3c-475f-afe3-949f8c912fb2\"}"}],"hiredAt":"2026-03-05T20:35:05.348Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Physics","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Coding / Programming","STEM Project"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/4f6b2e92-2aa8-4328-90be-11c5a7d63bc7/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"caroline-adkins\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"081cf7ea-7048-48eb-b7e5-f2fa9c4688be\"}"}}},"_sentryTraceData":"25689d84de734d57b0cb84126e74e902-ad0f90de4accbbb3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=25689d84de734d57b0cb84126e74e902,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"caroline-adkins"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNo
