xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2ee97d30-ce7b-4307-9f89-393c06f7706f\"}":{"__typename":"Favorites","uuid":"2ee97d30-ce7b-4307-9f89-393c06f7706f","photoUrl":"https://ucarecdn.com/e57f0400-3b80-4147-a83a-0e9b3b1ece96/","title":"Zendaya Coleman","type":"ACTOR"},"Favorites:{\"uuid\":\"ffb053e4-2465-4337-9ae6-f81f21b0b896\"}":{"__typename":"Favorites","uuid":"ffb053e4-2465-4337-9ae6-f81f21b0b896","photoUrl":"https://ucarecdn.com/4e2650ca-025e-43dc-927c-ba5758cfd4bd/","title":"Beyoncé","type":"ARTIST"},"Favorites:{\"uuid\":\"e7fa2efe-2233-434e-904d-58c80fa1ea91\"}":{"__typename":"Favorites","uuid":"e7fa2efe-2233-434e-904d-58c80fa1ea91","photoUrl":"https://ucarecdn.com/0f5699db-2b2d-4311-a393-e68e13ea004d/","title":"Swimming","type":"SPORT"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a0fbee83-9c00-40b6-b0c9-9f1a34c26191\"}":{"__typename":"DeepDives","uuid":"a0fbee83-9c00-40b6-b0c9-9f1a34c26191","content":"\u003cp\u003eAt this stage in my life, I'm honestly uncertain about what my ultimate career path will be. I've been fortunate to garner a diverse range of experiences and skills in engineering, computer science, and physics that have opened multiple intriguing avenues. From pushing the boundaries of technology as a Research and Development Engineer to potentially imparting knowledge as a Professor or venturing into the entrepreneurial world, each option presents unique opportunities and challenges. Even considering a role in shaping technology policy or rising through the ranks of the tech industry as an executive is exhilarating. Yet, I am in no rush to make a definitive choice. Instead, I'm committed to keeping an open mind, continually exploring, and seeking out new opportunities. My ultimate goal is not just to settle on a career, but to find a path that allows me to make a significant, positive impact on the world. Whether that's through technological advancements, educating others, or influencing policies, I'm excited about the journey of discovering where my passion and profession intersect.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"891152bb-818e-4be3-b927-5e810fc986fd\"}":{"__typename":"DeepDives","uuid":"891152bb-818e-4be3-b927-5e810fc986fd","content":"\u003cp\u003eI am incredibly proud of my work as a Quantum Hardware Researcher at Dartmouth. One of my most remarkable achievements in this role was when I consulted for the NASA Jet Propulsion Laboratory on the use of Quanta image sensor technology. This was not only an opportunity to work with a premier space exploration organization but also a platform to apply and extend my knowledge in the field. Moreover, I initiated and drove a cross-departmental research collaboration, bringing together expertise from different fields to design and implement a quantum sensing spectrometer. This pioneering project exemplifies the power of interdisciplinary collaboration and further demonstrates the depth and application of quantum technologies. Throughout this process, I also benchmarked quantum computers at IBM and Rigetti, deepening my understanding of their capabilities. This achievement is a testament to my technical abilities, my capacity to lead and innovate, and my passion for utilizing cutting-edge technology to solve complex problems. I am deeply honored to have been part of such a groundbreaking initiative.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"21d95cb6-8407-4e59-a404-8fdbb5cc314a\"}":{"__typename":"DeepDives","uuid":"21d95cb6-8407-4e59-a404-8fdbb5cc314a","content":"\u003cp\u003eMaking the world a better place :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"757544ed-84fd-412b-af5e-ea0f400db2a3\"}":{"__typename":"DeepDives","uuid":"757544ed-84fd-412b-af5e-ea0f400db2a3","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003e- Summer school (including taking courses in Environmental geoscience and US history)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- Lifeguarded at the beach!!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- Research at Northwestern for an environmental engineering professor\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"44ac2d61-0391-4a0a-b922-7140f285596e\"}":{"__typename":"Education","uuid":"44ac2d61-0391-4a0a-b922-7140f285596e","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Computer engineering","degree":"Bachelors of Engineering"},"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}":{"__typename":"School","uuid":"1855d7ef-1e93-4456-9092-47a74b3f8fb1","name":"New Trier Township High School - Winnetka","city":"Winnetka","type":"HIGH","state":"Illinois","country":"United States","zip":"60093"},"Education:{\"uuid\":\"541ce8cf-7033-4020-9c66-1046345cb8dd\"}":{"__typename":"Education","uuid":"541ce8cf-7033-4020-9c66-1046345cb8dd","school":{"__ref":"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"56ab341b-c60a-41e6-8ac4-4cef847d888f\"}":{"__typename":"MentorPublicProfile","uuid":"56ab341b-c60a-41e6-8ac4-4cef847d888f","displayName":"Katherine L.","slug":"katherine-lasonde","biography":"Hello! My name is Kat (Katherine) Lasonde, I am senior at Dartmouth College studying engineering physics and computer science. In particular, I am interested in quantum engineering and developing quantum hardware to reduce global warming. \nPlease see https://bit.ly/lasonde_engs for detailed and rigorous write ups of my in-class engineering projects :)\n\nOn campus, I research optical read out of Nitrogen Vacancy centers with particular applications to quantum sensing and quantum computing. I have been a teaching assistant for Object oriented programming \u0026 data structures for four terms, Embedded systems for two terms, Introduction to Environmental Engineering for two terms, Solid State Electronics for on term and introduction to computer science for one term here at Dartmouth. I was also the director for HackDartmouth, and an executive member of the Dartmouth Society of Women in Engineering. \n\nOutside of Dartmouth, I have been employed by Microsoft and Amazon Robotics, and I plan to return to Amazon Robotics upon graduation. In my free time, I love to swim, run, and hike. Recently, I have been trying gymnastics and aerials silks! Although I am a complete beginner in these clubs, I love the process of learning new kinematic skills. \n\nIn the future, I want to learn research how to improve the environment's well-being and develop carbon neutral (or negative) technologies through quantum computing. Quantum computing technologies may be the key to limiting climate change and saving the planet within our lifetimes:)\n\nPlease feel free to reach out!","teachingVideoPlaybackId":"xK5DPNv2wZHg02PqxE4reGD01KsCa02xDDpwxqFfrGkO024","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2ee97d30-ce7b-4307-9f89-393c06f7706f\"}"},{"__ref":"Favorites:{\"uuid\":\"ffb053e4-2465-4337-9ae6-f81f21b0b896\"}"},{"__ref":"Favorites:{\"uuid\":\"e7fa2efe-2233-434e-904d-58c80fa1ea91\"}"}],"causesSupported":[],"major":"Computer engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a0fbee83-9c00-40b6-b0c9-9f1a34c26191\"}"},{"__ref":"DeepDives:{\"uuid\":\"891152bb-818e-4be3-b927-5e810fc986fd\"}"},{"__ref":"DeepDives:{\"uuid\":\"21d95cb6-8407-4e59-a404-8fdbb5cc314a\"}"},{"__ref":"DeepDives:{\"uuid\":\"757544ed-84fd-412b-af5e-ea0f400db2a3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8b2d14d5-c4c1-4922-9920-d640b1c80497/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"44ac2d61-0391-4a0a-b922-7140f285596e\"}"},{"__ref":"Education:{\"uuid\":\"541ce8cf-7033-4020-9c66-1046345cb8dd\"}"}],"hiredAt":"2023-02-27T21:44:13.465Z","topics":["Coding / Programming","Machine Learning / AI","Robotics / Electronics / CAD","Product Design","STEM Project","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Chemistry","Physics","6-8 Grade Science","Algebra I","Algebra II"],"communityBadges":["https://ucarecdn.com/ceacbeeb-af28-4003-96cf-d977276b04ef/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/7603176c-
