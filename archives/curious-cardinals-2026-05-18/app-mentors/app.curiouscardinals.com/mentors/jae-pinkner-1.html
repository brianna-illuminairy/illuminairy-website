others, who perhaps haven't been as fortunate in their school journey, so far. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c5ed9439-e845-4e9b-86ef-f161c9f97e40\"}":{"__typename":"DeepDives","uuid":"c5ed9439-e845-4e9b-86ef-f161c9f97e40","content":"\u003cp\u003eIn my spare time, I can typically be found hanging out with my roommates -- whether we are embarking on missions to try new restaurants in Chicago or curling up on the couch to watch reality TV.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"376fbc4d-9d66-4a46-be7d-87666172c859\"}":{"__typename":"DeepDives","uuid":"376fbc4d-9d66-4a46-be7d-87666172c859","content":"\u003cp\u003eMy greatest mentors are my parents --  I can't choose just one over the other. They have always taught me, both through their words and by modeling it themselves, to feel comfortable and confident exploring my identity, forming new beliefs, speaking my mind, trying new things, and making mistakes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"9472ab42-f781-4962-b133-1909dd1b0241\"}":{"__typename":"DeepDives","uuid":"9472ab42-f781-4962-b133-1909dd1b0241","content":"\u003cp\u003eMy happy place is on the ski mountain! I've enjoyed skiing since I was just a toddler and I look forward to ski season every year. I love that you can always push yourself to get better and more confident, no matter how many times you've been on skis. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"8d582739-7652-4fec-9820-9de212ae08d6\"}":{"__typename":"School","uuid":"8d582739-7652-4fec-9820-9de212ae08d6","name":"Crossroads School for Arts \u0026 Sciences","city":"Santa Monica","type":"HIGH","state":"California","country":"United States","zip":"90404"},"Education:{\"uuid\":\"352db0c3-1ae1-42ce-b040-d739996d5f12\"}":{"__typename":"Education","uuid":"352db0c3-1ae1-42ce-b040-d739996d5f12","school":{"__ref":"School:{\"uuid\":\"8d582739-7652-4fec-9820-9de212ae08d6\"}"},"startYear":"2008","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"be7420ec-1910-4647-bd89-7dcbdb5a0200\"}":{"__typename":"Education","uuid":"be7420ec-1910-4647-bd89-7dcbdb5a0200","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English literature","degree":null},"Testimonial:2bde0465-5cc0-4902-a015-1594f1cbcfa8":{"__typename":"Testimonial","id":"2bde0465-5cc0-4902-a015-1594f1cbcfa8","text":"Jae has been a big help to me. I always look forward to our lessons and how it is a break from schoolwork. She always has a listening ear, and always challenges me to figure things out individually before helping me when needed. Thanks to her help, I know more about editing and content creating. I appreciate most is how patient and kind Jae is. She teaches me new things and the tools on iMovie with a positive attitude.\nI'm really thankful for everything Jae has taught me. She has made a big difference in my understanding of editing, and I hope other students get to have a mentor like her too. \n\nVanessa","date":"2025-05-27 02:49:40.208+00","rating":5,"endorser":{"__typename":"Endorser","name":"Vanessa Loo","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"26aac503-eee3-4f74-90de-b3dad9969200\"}":{"__typename":"MentorPublicProfile","uuid":"26aac503-eee3-4f74-90de-b3dad9969200","displayName":"Jae P.","slug":"jae-pinkner-1","biography":"\u003cp\u003eJae grew up in Los Angeles but is currently living in New York City, pursuing her J.D. at NYU School of Law. She graduated summa cum laude and Phi Beta Kappa from Northwestern University in June of 2025 with a major in English literature and minors in philosophy and legal studies. She has always gravitated towards the humanities because she enjoys sharing her thoughts and conversing with others in the classroom -- favoring discussion-based seminars over big lecture courses. In her first year at Northwestern, Jae was selected as a Kaplan Humanities Scholar. Outside of the classroom, Jae loves to ski, hike, draw, paint, and play the guitar and piano. She’s consistently watching the newest shows and movies. She also grew up playing every sport you can imagine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eJae decided to go to law school after a formative summer interning for a judge at the Los Angeles Superior Court. She spent the following summer interning in the Legal Affairs Department at Lionsgate in Santa Monica, CA. She took the LSAT during her junior year and applied to schools during the fall of her senior year at Northwestern.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt NYU Law, Jae volunteers with the Parole Advocacy Project, and a member of the Law and Business Association, Asian Pacific American Law Students Association, and Law Women. This upcoming summer, Jae will extern for a judge in the federal district court for the Central District of CA. In summer 2027, Jae will be a Summer Associate at a law firm in New York.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eJae has enjoyed working with kids since high school, when she first volunteered with Camp Harmony, a non-profit camp for homeless and underprivileged kids in and around the Los Angeles area. Her work with Camp Harmony inspired her to go back to her own sleepaway camp, Laurel South in Maine, to work as an in-cabin counselor and sailing instructor for ten weeks in the summer of 2022. Jae truly loved being a camp counselor, becoming a mentor and support system to kids from all around the country. She hopes to continue to serve the same purpose through her work at Curious Cardinals. \u003c/p\u003e","teachingVideoPlaybackId":"SpQcB7OE6wvcuLNph1aYkWz2q94Czs02kMsWl5PVsgY8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e42a7282-d69b-4dba-99f8-ab78e4b05517\"}"},{"__ref":"Favorites:{\"uuid\":\"abaa1023-42b0-4ad5-b1d3-8e8c30f2aa75\"}"},{"__ref":"Favorites:{\"uuid\":\"788cd56a-64bd-46aa-84fb-e14b28636ff3\"}"}],"causesSupported":[],"major":"English literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"60b5c367-8f8e-4949-8e88-c3d1284862f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"c5ed9439-e845-4e9b-86ef-f161c9f97e40\"}"},{"__ref":"DeepDives:{\"uuid\":\"376fbc4d-9d66-4a46-be7d-87666172c859\"}"},{"__ref":"DeepDives:{\"uuid\":\"9472ab42-f781-4962-b133-1909dd1b0241\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/da2ee548-31a4-485a-8b71-01eea6ca67a7/-/preview/-/format/jpg/","https://ucarecdn.com/e04a3a34-bb23-481f-a25b-a7a8494fbca2/-/preview/-/format/jpg/","https://ucarecdn.com/ce35554a-ae6f-49a8-8664-bb85bc54880e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"352db0c3-1ae1-42ce-b040-d739996d5f12\
