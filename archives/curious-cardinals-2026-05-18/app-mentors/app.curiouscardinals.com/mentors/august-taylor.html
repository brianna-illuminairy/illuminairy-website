xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"fa2b328e-16f6-4426-b4d1-77a088b98613\"}":{"__typename":"DeepDives","uuid":"fa2b328e-16f6-4426-b4d1-77a088b98613","content":"\u003cp\u003eIdentity is always on my mind. I am biracial – my Mom is Black and my Dad is White – but I am White-passing, meaning I look White and most people assume I am White. My identity has always been a tricky thing for me to wrap my head around. I always feel I belong in more categories than people give me credit for and often have a hard time owning aspects of my identity in different spaces.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat this has taught me is that everyone is more nuanced than they appear to be. No one just has one identity; we all have countless identities that are equally important to us and overlap and change in awesome and unexpected ways. I always do my best to treat people that I work and interact with as a blank slate: I take nothing about them for granted and am always excited to discover all the amazing things they have to offer. As a mentor, this means I treat the people I work with curiosity first and let them fill out their picture for me rather than the other way around. I know that I always have things to learn from people I work with, and my only hope is that I can bring something to table as well so that we both learn from each other.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"5488a298-cb1d-472c-b026-97d60922b333\"}":{"__typename":"School","uuid":"5488a298-cb1d-472c-b026-97d60922b333","name":"Jackson-Reed High School","city":"Washington","type":"HIGH","state":"DC","country":"United States","zip":"20016"},"Education:{\"uuid\":\"0c8763c6-e421-45c2-9b94-c68fd95f2b96\"}":{"__typename":"Education","uuid":"0c8763c6-e421-45c2-9b94-c68fd95f2b96","school":{"__ref":"School:{\"uuid\":\"5488a298-cb1d-472c-b026-97d60922b333\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"594d4ecc-234f-4068-ab6b-a8b36eb7eff7\"}":{"__typename":"Education","uuid":"594d4ecc-234f-4068-ab6b-a8b36eb7eff7","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Humanities","degree":null},"MentorPublicProfile:{\"uuid\":\"dc71fa0a-3e4d-46a0-b8df-d65737635a99\"}":{"__typename":"MentorPublicProfile","uuid":"dc71fa0a-3e4d-46a0-b8df-d65737635a99","displayName":"August T.","slug":"august-taylor","biography":"\u003cp\u003eFirst off, I love stories. I love watching them on TV, I love writing them, and I love reading about them in class. When I was younger, I thought for sure that the only classes I cared about were the ones where we were reading, but the older I got, the more I realized there are stories in everything. History is nothing but really interesting stories. Essays are ways for you to tell your own story about something you’ve been asked to analyze. Even science, when you think about it the right way, is just exploring the stories that shape how we understand the world. My mentoring specialties are creative passion projects and academic work in the humanities, but I believe any subject can be approached as if we’re tackling a story, and that we’ll both understand it better that way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I study Humanities with a focus on Creative Writing, and outside of class I sing in a jazz a cappella group, act in musicals, plays and short films, and keep myself busy with tons of smaller clubs and opportunities. In past summers, I have worked as a camp counselor for kids of all different ages and, most recently, have helped lead backpacking trips for incoming students at Yale. In high school, I founded my alma mater’s Creative Writing Club and brought together students from all kinds of backgrounds to create, support, and learn from one another.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy own experience with long-term mentoring comes from working on a series of fantasy novels with one seasoned writer throughout middle and high school. I know firsthand how much a mentor can reshape someone’s habits, excitement, and confidence in their work. Since coming to college, I have also been tutored one-on-one on different essays I’ve written and on how I approach math and STEM classes. I learned so much from every session that I was inspired to become a peer writing tutor myself, which taught me even more about my craft and my own strategies. I am committed to the project of mentoring and am so excited to see how far we can come together!\u003c/p\u003e","teachingVideoPlaybackId":"IutU006Aj6iy802YBGryJjh00KKuDonicBdBDfYPh1KDDk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Humanities","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fa2b328e-16f6-4426-b4d1-77a088b98613\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6d23f3f4-c2d6-4077-bdd2-b7aef213d863/-/preview/-/format/jpg/","https://ucarecdn.com/e453c6b4-8816-4b5b-a6ad-fd23e153e44e/-/preview/-/format/jpg/","https://ucarecdn.com/5f0de1e0-09b1-4c96-9899-f7528f2ef8ca/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0c8763c6-e421-45c2-9b94-c68fd95f2b96\"}"},{"__ref":"Education:{\"uuid\":\"594d4ecc-234f-4068-ab6b-a8b36eb7eff7\"}"}],"hiredAt":"2026-02-11T19:02:41.334Z","topics":["K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Writing","Spanish","College Essay Writing","Reading","History","Academic Coaching","Executive Function","K-6 Storybook","Creative Writing","Music","Film / Theater","History Project","Video / Photography","Journalism","Public Speaking","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"august-taylor\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"dc71fa0a-3e4d-46a0-b8df-d65737635a99\"}"}}},"_sentryTraceData":"d1b022d110174458949f2c75215a6e51-93e14cdde71d4b3d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d1b022d110174458949f2c75215a6e51,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"august-taylor"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body
