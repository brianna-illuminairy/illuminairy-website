in the Page Program! It has been an extremely unique and challenging year where I have working in Ad Sales, TV Production, and Brand Creative Marketing. It has been such a fulfilling experience!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3b160425-a1d6-4f07-96a1-10c311b86474\"}":{"__typename":"DeepDives","uuid":"3b160425-a1d6-4f07-96a1-10c311b86474","content":"\u003cp\u003eI wrote for the Yale Daily News one summer and went to Northwestern for a journalism summer program! I also sailed competitively during the summers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"72a95b16-7dc5-43ba-9025-df560d1bcab6\"}":{"__typename":"DeepDives","uuid":"72a95b16-7dc5-43ba-9025-df560d1bcab6","content":"\u003cp\u003eFollow your instincts to find your passion! In middle and high school, it is easy to get wrapped up in what other people are interested in and it can be overwhelming. Focus on what you find fascinating and trust your gut!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"03bc343a-eda2-4dab-9ac8-85654e68d3ee\"}":{"__typename":"School","uuid":"03bc343a-eda2-4dab-9ac8-85654e68d3ee","name":"Darien High School","city":"Darien","type":"HIGH","state":"Connecticut","country":"United States","zip":"06820"},"Education:{\"uuid\":\"316200ea-b7fe-4ef1-a3d8-16f1288a1d69\"}":{"__typename":"Education", ic content but also apply it in real-world contexts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI care deeply about fostering a supportive and engaging learning environment, where students feel empowered to ask questions and explore new ideas. My tutoring approach emphasizes collaboration and creativity, ensuring that each session is tailored to meet individual needs and learning styles.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you're looking to strengthen your writing skills, dive into data analysis, or explore marketing strategies, I'm here to guide you on your journey. My goal is to help you build not just knowledge, but also confidence in your abilities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to the opportunity to work with you and support your academic success!\u003c/p\u003e","teachingVideoPlaybackId":"IKOKX02al5y8HsJkgIM2igQWo26TRTnPtQAH9TsmDOuE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"22555c60-abfc-4d7d-ae30-c23a5816827b\"}"},{"__ref":"Favorites:{\"uuid\":\"4c328a8a-41c6-4285-a30c-c633ffcf46cb\"}"},{"__ref":"Favorites:{\"uuid\":\"65cb553e-cab7-45eb-983b-57b763039f27\"}"}],"causesSupported":[],"major":"Journalism","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7052b5ab-8fbf-4089-a7ff-7843ae878533\"}"},{"__ref":"DeepDives:{\"uuid\":\"7efede20-cfe2-4f8c-a938-8ae4cf90dda9\"}"},{"__ref":"DeepDives:{\"uuid\":\"3b160425-a1d6-4f07-96a1-10c311b86474\"}"},{"__ref":"DeepDives:{\"uuid\":\"72a95b16-7dc5-43ba-9025-df560d1bcab6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6fe36e1e-5a21-47f7-93b2-04efc857cc79/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"316200ea-b7fe-4ef1-a3d8-16f1288a1d69\"}"},{"__ref":"Education:{\"uuid\":\"b67016a1-7681-4953-a679-47169aaa17ef\"}"}],"hiredAt":"2024-10-18T16:25:39.632Z","topics":["Video / Photography","Literature","Film / Theater
