js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6bc0f91f-a6b1-47e6-b469-9bd015261636\"}":{"__typename":"DeepDives","uuid":"6bc0f91f-a6b1-47e6-b469-9bd015261636","content":"\u003cp\u003eThroughout my upbringing, I often heard the phrases \"You can't do that\" or \"You shouldn't do that\" from both my teachers and parents. It felt like every time I pursued something that required good grades, I became apprehensive about challenging myself.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMy sincere advice to both myself and anyone reading this is to embrace curiosity and embrace challenges. Explore new subjects, and become comfortable with the discomfort that comes with stepping out of your comfort zone.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eWhen I started college, I had a whole semester to determine my life's direction. Fortunately, I enrolled in an intriguing course that sparked my passion, and I have never looked back since. Many of my peers initially had their hearts set on fields like law, business, medicine, or technology, only to discover in college that they wished to pursue completely different paths.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eTherefore, I encourage you to acquire a fundamental understanding of a wide range of subjects offered by your school. Utilize this time to satisfy your curiosity so that when the decisive moment arrives, you can confidently declare that you have found the path you wish to follow for the rest of your life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"add7e22b-45f7-449b-b13d-0875756c1067\"}":{"__typename":"DeepDives","uuid":"add7e22b-45f7-449b-b13d-0875756c1067","content":"\u003cp\u003eI fully understand the significance of mentorship, as I have been fortunate to have several mentors who have played a crucial role in shaping the person I am today. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eThere are moments in both education and the professional world when you feel isolated, thinking to yourself, \"I have no idea what I'm doing.\"\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eThis feeling can be unpleasant, but it is a necessary part of challenging yourself and improving in your endeavors. During such times, having a dependable mentor is akin to having a supportive family member during work-related emergencies.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eWhen unexpected obstacles arise in life, I turn to my parents for advice and guidance. Similarly, when exams or internship projects don't go as planned, I know I can rely on my mentor for non-judgmental support and direction.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eFar too often, people experience that sense of uncertainty and accompany it with the belief that \"everyone else knows what they're doing.\" To truly succeed in any demanding pursuit, one must confront the challenges head-on and face that feeling of uncertainty. Mentors provide a safe space for you to embrace that feeling with courage and overcome it with resilience.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI hope to extend this same support to my future students. I aspire to be a guiding figure who empowers them to confront their own uncertainties with strength and determination.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"bd138cc9-81d3-4f20-b451-5a384bfdbc41\"}":{"__typename":"DeepDives","uuid":"bd138cc9-81d3-4f20-b451-5a384bfdbc41","content":"\u003cp\u003eI  regret not making the most of my high school summers. The unforeseen curveball of Covid-19 forced me to stay confined within the four walls of my house for an entire summer. However, in hindsight, I realize that I could have utilized that time more productively. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eWhile I did engage in sports and had the opportunity to intern at a local company for one summer, I now recognize that I could have prioritized activities centered around learning and serving others. Instead of merely focusing on my personal interests and extracurricular pursuits, I wish I had dedicated more energy to expanding my knowledge, acquiring new skills, and making a positive impact through service. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eThis realization fuels my determination to make the most of every future opportunity that comes my way, ensuring that I prioritize self-improvement, learning, and giving back to my community.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eCurious Cardinals is a great way to learn something new and be able to give back to your community, and I wish it were around when I was in high school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"70f7b210-2dd0-4dde-9299-d7394e0631f5\"}":{"__typename":"DeepDives","uuid":"70f7b210-2dd0-4dde-9299-d7394e0631f5","content":"\u003cp\u003e\u003cbr\u003eI constantly find myself engrossed in coding and all things related to technology. Whether it's constructing a website or delving into the intricacies of crafting a neural network from scratch, it's during the late hours of the night that my creative mind truly comes alive.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOne recent project that has captivated my attention involves utilizing a visualization package to develop math lessons. One of my favorite YouTubers, known as 3blue1brown, creates incredibly engaging videos on complex mathematical topics. These visualizations have the remarkable ability to simplify these concepts, making them more approachable.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAs someone who tutors in math and other technical subjects, I had the idea of learning how to leverage 3blue1brown's code to create my own educational lessons. This endeavor not only allows me to enhance my teaching skills but also serves as a valuable lesson in itself. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAnd, for any student interested in graphics or visual learning, I believe it's an excellent starting point that can spark their curiosity and passion!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"27b89bb0-5be2-4b08-b7b1-bc2e8a609f21\"}":{"__typename":"Education","uuid":"27b89bb0-5be2-4b08-b7b1-bc2e8a609f21","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science and Statistics","degree":"BS"},"School:{\"uuid\":\"358a5a43-08e4-432d-a29f-7a77d7a569d8\"}":{"__typename":"School","uuid":"358a5a43-08e4-432d-a29f-7a77d7a569d8","name":"Deerfield Academy","city":"Deerfield","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01342"},"Education:{\"uuid\":\"47016223-dec4-49cc-900f-882621bf574f\"}":{"__typename":"Education","uuid":"47016223-dec4-49cc-900f-882621bf574f","school":{"__ref":"School:{\"uuid\":\"358a5a43-08e4-432d-a29f-7a77d7a569d8\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"839816d6-9d5e-4e2c-94d4-1e343a675c58\"}":{"__typename":"MentorPublicProfile","uuid":"839816d6-9d5e-4e2c-94d4-1e343a675c58","displayName":"Chase M.","slug":"chase-mathis","biography":"Chase is a sophomore at Duke University pursuing a double major in Computer Science and Statistics with a minor in Mathematics. Born and raised in Las Vegas, he moved out to Massachusetts and attended Deerfield Academy, a traditional New England boarding school. Although he is not a typical New Englander, he loved Deerfield as it helped him learn to be independent.\n\nGoing into Duke, he was unsure about what he wanted to major in, but after taking one Statistics class, he fell in love with the field of Statistics. Machine Learning soon took off in popularity, and he added on a Computer Science major so that he can apply Statistics to novel Machine Learning statistics.\n\nOutside of the classroom, he loves Duke Athletics and tries to attend every basketball game. He works with the Duke Field Hockey team as a data scientist. Chase and his team use the vast amount of sports data to try and show Duke players’ their own weaknesses while scouting out opponents' weaknesses and strengths. He is very interested in Sports analytics and is one of the initial reasons Chase became interested in statistics, because he was able to combine math and sports!\n\nHe also tries to stay athletic and enjoys playing basketball, golf, football, tennis, and squash. He also likes to slow down and utilizes the vast greenery on Duke's campus to read, get some quiet, and be outside.\n\nThis summer, Chase will be working as a Research Assistant at Harvard Medical School, working on using statistics and computer science in predictive modeling, specifically in medical imaging.\n\nNext fall, Chase will be studying abroad at the University of Oxford. He looks forward to traveling around Europe and receiving an in-depth, unique education at Oxford.","teachingVideoPlaybackId":"mKRtsyL8GeykVwcD4NYmLbBcKMo1B2ugX2IunQdIWf00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science and Statistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6bc0f91f-a6b1-47e6-b469-9bd015261636\"}"},{"__ref":"DeepDives:{\"uuid\":\"add7e22b-45f7-449b-b13d-0875756c1067\"}"},{"__ref":"DeepDives:{\"uuid\":\"bd138cc9-81d3-4f20-b451-5a384bfdbc41\"}"},{"__ref":"DeepDives:{\"uuid\":\"70f7b210-2dd0-4dde-9299-d7394e0631f5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/529816ef-51d2-4d2d-91d4-edbbc0d4e836/-/crop/866x866/0,45/-/preview/-/format/jpg/","https://ucarecdn.com/2ca7ad50-9a89-4771-96f4-f247b6e79ca2/-/preview/-/format/jpg/","https://ucarecdn.com/f4f2c901-532a-43cf-a429-1d1fe7dac7be/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"27b89bb0-5be2-4b08-b7b1-bc2e8a609f21\"}"},{"__ref":"Education:{\"uuid\":\"47016223-dec4-49cc-900f-882621bf574f\"}"}],"hiredAt":"2023-03-15T19:44:05.199Z","topics":["Coding / Programming","Machine Learning / AI","Robotics / Electronics / CAD","Aviation / Aerospace","Product Design","Finance / Investing","Business / Entrepreneurship","K-5 Grade Math","Pre-Algebra","Geometry","STEM Project","Precalculus / Trigonometry","Calculus","Statistics","Biology","Chemistry","Physics
