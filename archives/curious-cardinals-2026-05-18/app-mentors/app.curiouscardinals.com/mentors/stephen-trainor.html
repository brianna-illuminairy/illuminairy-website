xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7f9a094e-88db-4b30-944b-98fc312fa8bc\"}":{"__typename":"Favorites","uuid":"7f9a094e-88db-4b30-944b-98fc312fa8bc","photoUrl":"https://ucarecdn.com/dc972783-2150-4ead-9c4a-0c169739e690/","title":"The Sun Also Rises","type":"BOOK"},"Favorites:{\"uuid\":\"846cb93e-2040-4d2b-b4e2-bb6fe675e7af\"}":{"__typename":"Favorites","uuid":"846cb93e-2040-4d2b-b4e2-bb6fe675e7af","photoUrl":"https://ucarecdn.com/5af9a510-672f-4bac-aff8-a70f2bd4992f/","title":"Volleyball","type":"SPORT"},"CausesSupported:{\"uuid\":\"859cd221-a510-4090-a3ef-4bb68a7d8766\"}":{"__typename":"CausesSupported","uuid":"859cd221-a510-4090-a3ef-4bb68a7d8766","name":"Bridge of Hope","description":"\u003cp\u003eAssisting families in transition through food/clothing distributions and crafts.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/60877c71-47ca-4301-ab98-1a7db112f462/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a159e75d-9f80-407b-9f45-95bfdd224a15\"}":{"__typename":"DeepDives","uuid":"a159e75d-9f80-407b-9f45-95bfdd224a15","content":"\u003cp\u003eLooking back on my life, my mentors were instrumental in helping me pursue computer science and programming since my family and I had little previous knowledge and didn't know where to start. Mentors are ordinary people who have been in my shoes, pushing me further, holding me accountable, and offering advice when I need it the most. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"84d5c7e4-7433-4a6d-ab66-3ce886b2a6f6\"}":{"__typename":"DeepDives","uuid":"84d5c7e4-7433-4a6d-ab66-3ce886b2a6f6","content":"\u003cp\u003eI don't consider myself quite artistic, but I enjoy making flower arrangements. Although I originally learned how to make bouquets for my girlfriend, I've found that bouquet making is an interesting challenge to combine colors, shapes, and materials to build impressive gifts for all the special people in my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a6cabd5d-ebd6-4fe8-8dc3-6730640b4c4b\"}":{"__typename":"DeepDives","uuid":"a6cabd5d-ebd6-4fe8-8dc3-6730640b4c4b","content":"\u003cp\u003eHike El Camino Del Norte, along ancient pilgrimage routes, over 500 miles from Irun to Santiago de Compostela. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"48cb5f5e-1ba8-4f21-8282-b59a42341ae8\"}":{"__typename":"DeepDives","uuid":"48cb5f5e-1ba8-4f21-8282-b59a42341ae8","content":"\u003cp\u003eI'm eternally indebted to my mentors who saw me through years of development and spurred me on. The only tangible way I can give back is through mentorship and sharing what I've learned along the way. I want to be like the same people who helped me in the past. Most of all, beyond giving concrete advice, mentorship is a valuable, personal investment in someone's future, and it's a gift to see them grow over time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"6af16c37-a9fc-485f-a922-d25b17756f14\"}":{"__typename":"School","uuid":"6af16c37-a9fc-485f-a922-d25b17756f14","name":"Helix Charter High School","city":"La Mesa","type":"HIGH","state":"California","country":"United States","zip":"91941"},"Education:{\"uuid\":\"06a44e23-7622-476e-a9ba-4a5aa4c538bf\"}":{"__typename":"Education","uuid":"06a44e23-7622-476e-a9ba-4a5aa4c538bf","school":{"__ref":"School:{\"uuid\":\"6af16c37-a9fc-485f-a922-d25b17756f14\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"0a2706bc-e7f0-4aee-a7d4-6d9a8374c707\"}":{"__typename":"Education","uuid":"0a2706bc-e7f0-4aee-a7d4-6d9a8374c707","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"086833c9-7d24-4edd-8de7-647c1efeeec0\"}":{"__typename":"MentorPublicProfile","uuid":"086833c9-7d24-4edd-8de7-647c1efeeec0","displayName":"Stephen T.","slug":"stephen-trainor","biography":"\u003cp\u003eHello! I'll try to avoid repeating details already on my profile, but I'd love to tell you more about myself and my motivations, lets dive in!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat are some of my qualifications?\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eHigh School\u003c/p\u003e\u003cp\u003e- Co-founded my school's first computer science club, teaching website development from zero to mastery\u003c/p\u003e\u003cp\u003e- Developed a full-stack fundraising (SnapRaise) clone for my school\u003c/p\u003e\u003cp\u003e- ServiceNow scholar learning full-stack web development, presented a stock projection web-app to engineers and achieved 1st place for $500 (1 of 10)\u003c/p\u003e\u003cp\u003e- Teaching Assistant for Algebra I/II, Calculus AB/BC\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUniversity\u003c/p\u003e\u003cp\u003e- Earned 2nd, 3rd places in student development and AI hackathons respectively\u003c/p\u003e\u003cp\u003e- Jane Street Immersion Program fellow (1 of 12)\u003c/p\u003e\u003cp\u003e- Teaching Assistant for Data Structures and Algorithms Course\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eRelevant Coursework\u003c/p\u003e\u003cp\u003eCalculus through linear algebra and differential equations, statistics, discrete math, automata and complexity, algorithms, data structures, low-level programming, databases, applied machine learning, human-computer interaction, data analytics\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile those were some great details, my existing teaching assistant experience is what has motivated me to continually pursue mentorship. I've learned how to teach technical content through a variety of techniques but also put myself in the shoes of my students to see what helps them learn the best.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside lecture halls...\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI'm an avid volleyball player (since middle school and now club for my university) who loves to learn about strength training, nutrition, and other sports science.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf I'm not playing volleyball or running, I'm most likely eating since I'm a huge foodie. I love to try new cuisines and restaurants but I also love trying food challenges like the 20 taco challenge in Philly (pictured at the top) or eating 62 dumplings at a dumpling festival. And.... most recently I've been getting into cooking (well because I love eating!)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I can do as a mentor\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAfter teaching a variety of subjects of many years, I've discovered different techniques to help students learn technical concepts through active recall, spaced repetition, analogies, and more! More importantly, having taken these courses, I have access to plenty of material such as quizzes, practice problems, and challenging questions to help students learn the appropriate material.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical lesson will probably include an explanation of a topic, real-world applications, extensions of this topic, and ways to practice active recall such as short quizzes (for understanding, not a grade).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlthough I'm focused on the academic mentorship side of things, another great way to learn computer science or programming topics is through hands-on experience building your own project. Always happy to assist her as well, having built many projects for myself and companies.\u003c/p\u003e","teachingVideoPlaybackId":"Q9BKjYmJpswYZ00nagnSIYMCUpYQsSWVxMtpb9UrJHtw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eEating 62 dumplings in one hour.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eJust kidding, while that is impressive, I'm most proud of my pursuit to learn Korean to speak with my grandmother. After immigrating to the States, my grandmother didn't quite pick up English as fluently as my mother did, which created a language barrier for us. I resolved to self-study Korean in high school since my school didn't offer it, and chose to continue during my university studies. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLearning Korean helped me connect with my grandmother on another level, even though my Korean isn't fluent. Now, I'm studying abroad at Yonsei University in Seoul, excited to see how I can grow my Korean skills and cultural understanding.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7f9a094e-88db-4b30-944b-98fc312fa8bc\"}"},{"__ref":"Favorites:{\"uuid\":\"846cb93e-2040-4d2b-b4e2-bb6fe675e7af\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"859cd221-a510-4090-a3ef-4bb68a7d8766\"}"}],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a159e75d-9f80-407b-9f45-95bfdd224a15\"}"},{"__ref":"DeepDives:{\"uuid\":\"84d5c7e4-7433-4a6d-ab66-3ce886b2a6f6\"}"},{"__ref":"DeepDives:{\"uuid\":\"a6cabd5d-ebd6-4fe8-8dc3-6730640b4c4b\"}"},{"__ref":"DeepDives:{\"uuid\":\"48cb5f5e-1ba8-4f21-8282-b59a42341ae8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8bd2f8fd-06a8-4e91-a5b3-8781b0762980/-/preview/-/format/jpg/","https://ucarecdn.com/fe4806d5-fafd-48b2-b99f-cec8734c7dd6/-/preview/-/format/jpg/","https://ucarecdn.com/db3b466d-8ede-4f32-a323-64d694ddb29f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"06a44e23-7622-476e-a9ba-4a5aa4c538bf\"}"},{"__ref":"Education:{\"uuid\":\"0a2706bc-e7f0-4aee-a7d4-6d9a8374c707\"}"}],"hiredAt":"2026-05-09T06:40:51.655Z","topics":[],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"stephen-trainor\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"086833c9-7d24-4edd-8de7-647c1efeeec0\"}"}}},"_sentryTraceData":"415a14d6332f430598d8eaea9f9ed827-95998c818422931e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb6
