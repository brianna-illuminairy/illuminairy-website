xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0b3eed45-0bb3-4bd8-ad94-688befd9e920\"}":{"__typename":"DeepDives","uuid":"0b3eed45-0bb3-4bd8-ad94-688befd9e920","content":"\u003cp\u003eMy majors were both described as the \"most interdisciplinary\" by my respective professors, so it offers a wide range of career options for me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6305e290-d507-44e9-8d0a-0d63baa62280\"}":{"__typename":"DeepDives","uuid":"6305e290-d507-44e9-8d0a-0d63baa62280","content":"\u003cp\u003eHiking, skiing, or curled up in my apartment watching anime. I'm either tearing it up outside or resting inside, no in-between!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"67807b4b-8e04-4d2a-9efe-adeeae78e1fc\"}":{"__typename":"DeepDives","uuid":"67807b4b-8e04-4d2a-9efe-adeeae78e1fc","content":"\u003cp\u003eThe teenage years are some of the hardest, you have to figure yourself out while also setting up the trajectory of the rest of your life. Whenever you're overwhelmed, try to stay focused on learning and building connections with peers and mentors!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"6be3b75a-3463-4198-bcd3-a7e1d87a7a0c\"}":{"__typename":"DeepDives","uuid":"6be3b75a-3463-4198-bcd3-a7e1d87a7a0c","content":"\u003cp\u003eI was on the quieter side but loved observing, I was the one that had all the tea but nobody knew it until later. I had a small but strong group of friends that are still my close friends today!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"bded69af-3673-4471-850b-360692b217a2\"}":{"__typename":"School","uuid":"bded69af-3673-4471-850b-360692b217a2","name":"Gonzaga Preparatory School","city":"Spokane","type":"HIGH","state":"Washington","country":"United States","zip":"99207"},"Education:{\"uuid\":\"fa28e2bb-3dbb-461a-9974-847626189db4\"}":{"__typename":"Education","uuid":"fa28e2bb-3dbb-461a-9974-847626189db4","school":{"__ref":"School:{\"uuid\":\"bded69af-3673-4471-850b-360692b217a2\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"63509191-7467-4d1b-bf47-68c11e2a0307\"}":{"__typename":"Education","uuid":"63509191-7467-4d1b-bf47-68c11e2a0307","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Journalism \u0026 Environmental Science","degree":null},"MentorPublicProfile:{\"uuid\":\"57d25b5c-4cf5-4b2b-b236-527170b02a91\"}":{"__typename":"MentorPublicProfile","uuid":"57d25b5c-4cf5-4b2b-b236-527170b02a91","displayName":"Jamie H.","slug":"jamie-helmick","biography":"\u003cp\u003eI’m a Northwestern University graduate (Class of 2024) with degrees in Journalism and Environmental Science, and I’m passionate about helping students grow not only academically, but also in confidence, curiosity, and self-advocacy. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe that strong mentor-student relationships are the foundation of real learning. In my experience, the greatest indicator of success isn’t just subject mastery—it’s how well a student feels understood, supported, and motivated by their mentor, which translates into resilience when faced with challenges independently.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI tutor a wide range of subjects, including Pre-Algebra, Algebra I \u0026amp; II, Geometry, Precalculus/Trigonometry, Statistics, middle school science (grades 6–8), Chemistry, Biology, Writing, Reading, History, Economics, College Essay Writing, Academic Coaching, and Executive Function. This breadth allows me to support students holistically, whether they need help mastering core content, organizing their workload, or building strong study habits that last beyond a single class.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI attended Gonzaga Preparatory School in Spokane, Washington, before moving to Evanston, Illinois (North of Chicago on Lakeshore Drive) to study at Northwestern University. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic background in journalism sharpened my communication skills and love of storytelling, which I bring into my writing instruction and college essay coaching. Meanwhile, my environmental science training strengthened my analytical thinking and problem-solving approach—skills that translate directly into math and science tutoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor creative projects, I would love to help you write an article for publishing, start up a school newspaper or magazine, or strengthen your writing and editing skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy tutoring style is patient, encouraging, and highly personalized. I work to meet students where they are, adapting lessons to their learning style and interests while maintaining clear structure and goals. I care deeply about helping students feel capable and empowered, especially those who may feel overwhelmed, discouraged, or unsure of their abilities. I also emphasize executive function skills like time management, planning, and organization, because success in school often depends on more than just understanding the material.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbove all, I aim to be a mentor students feel comfortable learning with—someone who listens, challenges them thoughtfully, and celebrates their progress. I strive to create a learning environment where students feel inspired, supported, and excited to grow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a WA state native, I love hiking, skiing, and going to the lake! Also—GO SEAHAWKS!\u003c/p\u003e","teachingVideoPlaybackId":"yrzYGIYwhiDURF3NsXch85hv00RPStOqV8xNL3dOAXFE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Journalism \u0026 Environmental Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0b3eed45-0bb3-4bd8-ad94-688befd9e920\"}"},{"__ref":"DeepDives:{\"uuid\":\"6305e290-d507-44e9-8d0a-0d63baa62280\"}"},{"__ref":"DeepDives:{\"uuid\":\"67807b4b-8e04-4d2a-9efe-adeeae78e1fc\"}"},{"__ref":"DeepDives:{\"uuid\":\"6be3b75a-3463-4198-bcd3-a7e1d87a7a0c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/222b4a34-6daf-40ac-af1d-5f5418e55bf5/-/preview/-/format/jpg/","https://ucarecdn.com/f0e521af-c7e6-487a-a364-ee3b9d639458/-/preview/-/format/jpg/","https://ucarecdn.com/965cd316-e778-4806-ae82-c0710
