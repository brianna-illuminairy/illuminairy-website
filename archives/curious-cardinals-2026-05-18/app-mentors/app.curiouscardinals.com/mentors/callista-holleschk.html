uid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"55d28522-f6c2-445f-8e6d-09a9b9ba7591\"}":{"__typename":"DeepDives","uuid":"55d28522-f6c2-445f-8e6d-09a9b9ba7591","content":"\u003cp\u003eIt will almost be two years since I started learning ballet. It has been a journey filled with ups and downs, yet I have grown and flourished in ways I could've never foreseen. I want to be able to dance: to let myself become the music and express its beauty.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"357a2d3a-fe4c-43e7-a9af-43b740319d44\"}":{"__typename":"DeepDives","uuid":"357a2d3a-fe4c-43e7-a9af-43b740319d44","content":"\u003cp\u003eMy dad's journey to get his pilots license first inspired me to get into aviation, but I felt the horizon open before me when I started building balsa wood planes and watching them soar. To me, aeronautics is the most pure and most beautiful discipline. I cannot see myself pursuing anything else!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2b137de4-dd59-4c84-8d06-e75ea255d025\"}":{"__typename":"DeepDives","uuid":"2b137de4-dd59-4c84-8d06-e75ea255d025","content":"\u003cp\u003eMy spare time is made up of a wild jumble of activities: from practicing ballet, to running, to reading Russian literature, to building model rockets and airplanes; if it involves pushing myself and learning new skills, you can find me doing it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"13b9e92f-6709-4eb3-b687-cf76ae506706\"}":{"__typename":"School","uuid":"13b9e92f-6709-4eb3-b687-cf76ae506706","name":"Green Hope High School","city":"Cary","type":"HIGH","state":"North Carolina","country":"United States","zip":"27519"},"Education:{\"uuid\":\"30efc5cf-f789-4b7c-9826-f2ae492918b5\"}":{"__typename":"Education","uuid":"30efc5cf-f789-4b7c-9826-f2ae492918b5","school":{"__ref":"School:{\"uuid\":\"13b9e92f-6709-4eb3-b687-cf76ae506706\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"14cad528-6873-455e-ac74-350b000b5a22\"}":{"__typename":"Education","uuid":"14cad528-6873-455e-ac74-350b000b5a22","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Aeronautics of Astronautics","degree":null},"MentorPublicProfile:{\"uuid\":\"7e7e8772-d8d7-4593-9c6a-b8580143d836\"}":{"__typename":"MentorPublicProfile","uuid":"7e7e8772-d8d7-4593-9c6a-b8580143d836","displayName":"Callista H.","slug":"callista-holleschk","biography":"\u003cp\u003eCallista is a junior pursuing a B.S. in Aeronautics and Astronautics at Stanford University. She is involved with a variety of personal and team projects through Stanford Flight Club and the Stanford Student Space Initiative. Callista is equally passionate about entrepreneurship, having launched SkyeLabs Innovation Inc., a startup focused on designing sustainable biopolymer aerogel insulations that won the Conrad Challenge and an honorable mention at the NASA iTech competi
