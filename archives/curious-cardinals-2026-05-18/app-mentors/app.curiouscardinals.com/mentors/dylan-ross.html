xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"7b5a007c-76f8-494d-8a6b-97e0e9f72e22\"}":{"__typename":"School","uuid":"7b5a007c-76f8-494d-8a6b-97e0e9f72e22","name":"Syracuse University","city":"Syracuse","type":"COLLEGE","state":"New York","country":"United States","zip":"13244"},"Education:{\"uuid\":\"ad7eea88-bdaf-4b13-86c6-b60b387b157a\"}":{"__typename":"Education","uuid":"ad7eea88-bdaf-4b13-86c6-b60b387b157a","school":{"__ref":"School:{\"uuid\":\"7b5a007c-76f8-494d-8a6b-97e0e9f72e22\"}"},"startYear":null,"endYear":"2022","expectedGradYear":null,"major":"Chemsitry","degree":"Bachelor of Science"},"MentorPublicProfile:{\"uuid\":\"f64bd809-8ec4-4915-87c4-807c38053394\"}":{"__typename":"MentorPublicProfile","uuid":"f64bd809-8ec4-4915-87c4-807c38053394","displayName":"Dylan R.","slug":"dylan-ross","biography":"I am currently pursuing a DDS at NYU College of Dentistry and I recently graduated from Syracuse University after earning a Bachelor of Science degree in Chemistry. I earned the distinction of Summa cum Laude with a 3.95 GPA. \n\nMy upbringing was very unique as I was born and raised in the heart of New York City. Growing up in Manhattan  allowed me to be around so many different types of people and experience a tremendous amount of independence at a young age. From elementary school to high school, I was a very serious two sport athlete who played basketball in the winter and baseball in the spring. However, the most interesting part of my high school experience was dedicating my Wednesday’s to my club (Special Needs Awareness Group) that focused on the inclusion of students with special needs. My high school, Beacon High School, was connected to another school for students with intellectual disabilities, so my brother and I focused on the mission of uniting both schools. We played ping pong together, watched movies, discussed books, and debated current events happening at the time. Most importantly, we all laughed, smiled, and formed friendships that have lasted long after I moved on to college. \n\nWhen I am not in school, I enjoy a lot of other hobbies as well. I am an extrovert and love human interaction. One of my favorite pastimes includes just simply spending time with my friends and watching my favorite New York sports teams. In addition, I love individual activities that allow me to better myself and reflect a lot about life in general. For example, I’m always going to the gym, listening to music, taking walks, or sitting down and reading a good book.\n\nMy mission as a mentor is the same mission I have for myself: Improvement. I strive to improve every day. Whether that be mentally, physically, or just being a better person to the people I care about most. Being able to help a previous Mentee of mine, while I was in college, improve in writing and reading was one of the most fulfilling experiences of my life. I really hope to instill this in my Mentee, as I would love to help them to continue to grow as a student and a human being. \n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Chemsitry","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/f3ff932c-97eb-4ce2-8465-c3d662361449/-/crop/1172x1174/0,846/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"ad7eea88-bdaf-4b13-86c6-b60b387b157a\"}"}],"hiredAt":"2023-01-26T22:26:21.321Z","topics":["K-5 Grade Math"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"dylan-ross\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f64bd809-8ec4-4915-87c4-
