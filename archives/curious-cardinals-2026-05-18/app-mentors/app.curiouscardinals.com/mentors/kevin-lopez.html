xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c5384f43-c309-479a-b135-300dd67b8f90\"}":{"__typename":"DeepDives","uuid":"c5384f43-c309-479a-b135-300dd67b8f90","content":"\u003cp\u003eI chose to major in computer science because it allows me to build things and create impact. I love designing solutions, whether that’s a large project or a small shortcut that saves a few seconds in my daily routine. Even if I spend hours building something simple, the real value is in the learning process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eComputer science is fulfilling because technology is always evolving. There’s always something new to learn, improve, or rethink. That constant growth excites me, and it’s why I know I’ll never stop learning in this field.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"49db139c-ff5b-42b6-a155-ff849e56d046\"}":{"__typename":"DeepDives","uuid":"49db139c-ff5b-42b6-a155-ff849e56d046","content":"\u003cp\u003eAs a Hispanic student, I’ve learned that hard work consistently beats talent without effort. I believe intuition isn’t something you’re born with, it’s built through experience and repetition. Pattern recognition comes from struggling through problems, making mistakes, and trying again.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my teaching, I emphasize persistence. If a student doesn’t know the answer right now, that’s okay, they \u003cem\u003ewill\u003c/em\u003e get there with enough practice and guidance. I focus on building confidence, showing students that understanding grows over time, and reinforcing that effort matters just as much as ability.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"aa792beb-fb92-4d43-b7b3-aabf78edf7d4\"}":{"__typename":"DeepDives","uuid":"aa792beb-fb92-4d43-b7b3-aabf78edf7d4","content":"\u003cp\u003eI never had an official mentor growing up, and because of that, mentorship means a lot to me. I know how valuable it would have been to have someone guide me, answer questions, or simply reassure me that confusion is part of learning. Helping others, especially students from different backgrounds, is incredibly rewarding.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEven small guidance can make a huge difference. We all live different lives, but we often struggle with similar doubts, challenges, and questions. Being able to support someone through that, even briefly, is something I would have deeply appreciated when I was younger, and it’s why I care so much about mentoring now.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"71b5be1a-a14b-42ff-8d08-8be720e60d4d\"}":{"__typename":"DeepDives","uuid":"71b5be1a-a14b-42ff-8d08-8be720e60d4d","content":"\u003cp\u003eAlmost every summer in high school was busy, centered on engineering and learning. During my freshman and sophomore years, I participated in an engineering summer program at a local community college. One of my favorite projects was recreating Baymax using styrofoam, cameras, and a speaker. It wasn’t just about building something fun, it taught me how hardware, software, and creativity come together to solve problems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe summer before my senior year, I had the opportunity to attend MIT’s MITES program (formerly MOSTEC). That experience was transformative. I learned about astrophysics software, worked with real satellite data, and explored how images sent from space are processed and analyzed. Being surrounded by students who were equally curious and motivated pushed me to think bigger about what I could do with STEM. That summer made it clear to me that learning doesn’t stop in the classroom, it accelerates when you’re challenged and supported.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"7b0fb422-844a-492d-89b7-fdf24d522032\"}":{"__typename":"School","uuid":"7b0fb422-844a-492d-89b7-fdf24d522032","name":"PSJA Early College High School","city":"San Juan","type":"HIGH","state":"Texas","country":"United States","zip":"78589"},"Education:{\"uuid\":\"77134165-062a-4508-9d71-dccf3e9710eb\"}":{"__typename":"Education","uuid":"77134165-062a-4508-9d71-dccf3e9710eb","school":{"__ref":"School:{\"uuid\":\"7b0fb422-844a-492d-89b7-fdf24d522032\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"19cfa579-fc53-401e-a7d3-372b8b3aa71e\"}":{"__typename":"Education","uuid":"19cfa579-fc53-401e-a7d3-372b8b3aa71e","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"47bba2ae-9b91-4885-ab15-19a3d2e1a659\"}":{"__typename":"MentorPublicProfile","uuid":"47bba2ae-9b91-4885-ab15-19a3d2e1a659","displayName":"Kevin L.","slug":"kevin-lopez","biography":"\u003cp\u003eI grew up in a border town in the Rio Grande Valley (RGV), one of the lowest-income regions in Texas. Growing up with financial constraints didn’t discourage me, it pushed me to work harder, ask more questions, and take ownership of my education. From an early age, I learned that access to knowledge can be life-changing, and that belief continues to guide how I learn and how I teach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I’ve always gravitated toward STEM, especially computer science, math, and engineering. I earned my Associate’s degree in Computer Science from a community college before graduating high school, while balancing a full course load and extracurricular commitments. In high school, I was deeply involved in competitive and technical organizations including Robotics, UIL competitive math, HOSA, and BPA. I didn’t just participate, I pushed myself to compete at the highest level, earning multiple state-level titles such as UIL Calculator State Champion, HOSA Interview State Champion, and BPA Integrated Office Applications State Champion, as well as advancing to the state level in robotics competitions. I graduated as valedictorian, an achievement that reflected both discipline and persistence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the experiences I’m most proud of is founding a financial literacy club at my school. In a community where money is often a stressful or avoided topic, I wanted to create a space where students could ask questions, build confidence, and learn practical skills that aren’t always taught in classrooms. Teaching peers showed me how powerful patient, supportive mentorship can be, and how much students thrive when learning feels relevant to their lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m currently studying Computer Science at Columbia University, where my coursework spans multiple engineering disciplines, including mechanical and chemical engineering. Outside the classroom, I’m involved in Columbia’s Space Initiative, working on both hardware and software for space-related projects. I also train in Brazilian Jiu Jitsu, which has reinforced lessons I value deeply as a mentor: resilience, humility, and learning through failure.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I enjoy applying technology to real-world problems. Recently, I’ve worked with small businesses in my hometown to help integrate AI tools and automation into their workflows to improve productivity, showing students that what they learn can have immediate, tangible impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is to help students build confidence, curiosity, and problem-solving skills, whether they’re learning math, coding, robotics, or exploring engineering for the first time. I care deeply about meeting students where they are, breaking down complex ideas step-by-step, and helping them see that they are capable of more than they think.\u003c/p\u003e","teachingVideoPlaybackId":"9I01DAWf023hdtwvhCZ01eLZw1N02k7mtG44aZqnogxW02QU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c5384f43-c309-479a-b135-300dd67b8f90\"}"},{"__ref":"DeepDives:{\"uuid\":\"49db139c-ff5b-42b6-a155-ff849e56d046\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa792beb-fb92-4d43-b7b3-aabf78edf7d4\"}"},{"__ref":"DeepDives:{\"uuid\":\"71b5be1a-a14b-42ff-8d08-8be720e60d4d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d30abfea-cc43-4854-b1af-5bbb867889e8/-/preview/-/format/jpg/","https://ucarecdn.com/9f133f26-bd27-46f5-bc4e-1e1867a1141d/-/preview/-/format/jpg/","https://ucarecdn.com/56a7a4a4-0b8d-4959-98b3-ac0afc6572d0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"77134165-062a-4508-9d71-dccf3e9710eb\"}"},{"__ref":"Education:{\"uuid\":\"19cfa579-fc53-401e-a7d3-372b8b3aa71e\"}"}],"hiredAt":"2026-02-02T23:52:25.309Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Chemistry","Biology","Physics","Spanish","Academic Coaching","College Essay Writing","Economics","Computer Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kevin-lopez\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"47bba2ae-9b91-4885-ab15-19a3d2e1a659\"}"}}},"_sentryTraceData":"4a19be892e4940d990be3f4b4b86b030-bb06d29cc411e17d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4a19be892e4940d990be3f4b4b86b030,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"kevin-lopez"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</
