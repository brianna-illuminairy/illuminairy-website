(I also go by Izzy), from the Bay Area, California. I'm currently a senior at Brown University studying biology. I am a pre-medical student with a passion for public health and an interest in languages and cross-cultural connections. At Brown, I'm a Meiklejohn Peer Advisor to incoming first years, a research assistant in a lab investigating lung cancer immunology, and an advocate for patients and families at our local hospital. I also play on the club volleyball team and volunteer to put on cultural events for adopted Korean kids in our region! A fun fact about me is that I studied abroad in Korea in the spring– two of my profile pictures are from when I hiked in two famous national parks there!\u0026nbsp;\u003c/p\u003e\u003cp\u003eI'm super passionate about mentorship and teaching. I began my teaching career in Nicaragua in middle school, where I taught elementary students in a rural school English. I continued to teach students in Nicaragua and the Dominican Republic in English and biology remotely (during COVID), and became president of the Peer Mentoring Program at my school. Currently at Brown, I am a Group Tutor Leader and tutor focused groups of undergraduates in General Chemistry. I have tutored students as young as 4 years old in Nicaragua and students who qualify as senior citizens (through volunteering as an English teacher in Korea)! Throughout my different roles I have been able to see the power of mentorship– the relationships I cultivated as president of my high school mock trial team have continued to help me along my journey as a leader, and as a peer advisor at my university, I get to see how I can pass my own knowledge and process along to others looking to follow the same path. I enjoy bringing mentorship into every aspect of what I do.\u003c/p\u003e\u003cp\u003eFor the last seven years, I have volunteered at a global health nonprofit aiming to spread awareness about key health issues through engaging initiatives: we aired cartoons worldwide starring Bollywood stars from India to spread awareness about HIV/AIDS; we published a VR interactive pathway with the Stanford football team and teamed up with several Olympians to raise concussion awareness; and we collated thousands of resources for adults and kids in several languages to combat COVID-19 misinformation. Projects like these helped me to realize the importance of finding an engaging format and using creativity and imagination to further education, and I’m excited to work on this connection with you.\u003c/p\u003e\u003cp\u003eI am so excited to work with you, and to bring my skills of tutoring, leadership, and mentoring to our relationship!\u003c/p\u003e","teachingVideoPlaybackId":"gAaAQsRCDv5QGOHfMMc2GWKgytxlz006A17gmKWJA8iI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0b4be81e-4aa4-4785-b8e2-9033fa0403a1\"}"},{"__ref":"DeepDives:{\"uuid\":\"c0fe1955-a36c-4ce1-b73a-90da11468fdb\"}"},{"__ref":"DeepDives:{\"uuid\":\"8736824d-8384-44d4-a6ff-3dfd41e49563\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a779bde-d1fc-4a55-8607-1b92bba565d2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f051d956-726e-4304-9022-22e7e8bbde9c/-/preview/-/format/jpg/","https://ucarecdn.com/93a47801-291a-4cfa-8e73-0b3cac6b9716/-/preview/-/format/jpg/","https://ucarecdn.com/0cbb5c32-c861-468a-9d3a-251297762f8e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0f2dbfdf-ace8-4358-91f4-b5c0283926e7\"}"},{"__ref":"Education:{\"uuid\":\"44cf4a7f-8fbe-4916-82cf-02fee01e297b\"}"}],"hiredAt":"2025-09-30T16:57:13.057Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/",
