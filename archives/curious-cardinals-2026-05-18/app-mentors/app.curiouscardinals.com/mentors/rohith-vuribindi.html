xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"ffe2ac50-1167-494f-8688-ec533da2d3fa\"}":{"__typename":"DeepDives","uuid":"ffe2ac50-1167-494f-8688-ec533da2d3fa","content":"\u003cp\u003eAs an immigrant from India, my educational experience was riddled with difficulties. Luckily, I had many peers and mentors who helped bridge the gap for me. When I teach others, I mirror the patience that others afforded me, making sure to leave whoever I'm tutored filled with confidence!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"c0c2c7c1-2b9c-42b2-a358-4bed2baa0663\"}":{"__typename":"DeepDives","uuid":"c0c2c7c1-2b9c-42b2-a358-4bed2baa0663","content":"\u003cp\u003eMy parents immigrated to the United States from India in 2005, when I was just five years old. It took a tremendous amount of courage to make that leap, especially in the face of so much uncertainty. We've turned out just fine, and we've done well for ourselves! Having been through some of the most difficult circumstances growing up, I derive my motivation to do better in my life!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1d8d3ae6-6914-4764-a38b-481a95fd235a\"}":{"__typename":"DeepDives","uuid":"1d8d3ae6-6914-4764-a38b-481a95fd235a","content":"\u003cp\u003eOne hobby I've picked up recently is sewing! I made myself a pair of pants through all the steps along the way. From picking up the fabric, to cutting out the patters, all the way to stitching and hemming my pants to fit just right! I love the creative expression involved along with the ability to be precise in measuring/cutting/sewing. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b2b56557-c9db-4568-a775-0dd251e2e765\"}":{"__typename":"DeepDives","uuid":"b2b56557-c9db-4568-a775-0dd251e2e765","content":"\u003cp\u003eMy high school microeconomics teacher (Ms. Schaeffer) was a brilliant teacher - and an amazing person in general - inspired me and taught me economics in such an interesting way that it sparked a passion to learn much more. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"eb07cfcf-3e9e-4b29-ad7f-6a0c4acb4811\"}":{"__typename":"School","uuid":"eb07cfcf-3e9e-4b29-ad7f-6a0c4acb4811","name":"Vestavia Hills High School","city":"Vestavia Hills","type":"HIGH","state":"Alabama","country":"United States","zip":"35216"},"Education:{\"uuid\":\"fe73307f-abfd-4b4f-83cd-47eb9d7ffa11\"}":{"__typename":"Education","uuid":"fe73307f-abfd-4b4f-83cd-47eb9d7ffa11","school":{"__ref":"School:{\"uuid\":\"eb07cfcf-3e9e-4b29-ad7f-6a0c4acb4811\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bd1af092-53ae-4dd6-8bc7-e13bea870cb8\"}":{"__typename":"School","uuid":"bd1af092-53ae-4dd6-8bc7-e13bea870cb8","name":"The University of Alabama in Huntsville","city":"Huntsville","type":"COLLEGE","state":"Alabama","country":"United States","zip":"35899"},"Education:{\"uuid\":\"2d213539-8032-4e58-90ab-1db7d51ff6d2\"}":{"__typename":"Education","uuid":"2d213539-8032-4e58-90ab-1db7d51ff6d2","school":{"__ref":"School:{\"uuid\":\"bd1af092-53ae-4dd6-8bc7-e13bea870cb8\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"5f880aaf-bd4a-4115-bae8-75f4ce7e9062\"}":{"__typename":"MentorPublicProfile","uuid":"5f880aaf-bd4a-4115-bae8-75f4ce7e9062","displayName":"Rohith V.","slug":"rohith-vuribindi","biography":"\u003cp\u003eHi, I'm Rohith! I'm a finance and strategy professional based in New York City with a passion for breaking down complex problems into simple, understandable solutions — which is exactly what great tutoring is all about.\u003c/p\u003e\u003cp\u003eI studied Economics and Computational Analysis at the University of Alabama in Huntsville,  earning a spot on the President's List every semester. I also minored in Mathematics and participated in my university's Joint Undergraduate Masters Program. My academic background gave me a strong foundation in quantitative reasoning, data analysis, and economic thinking that I use every single day in my professional life.\u003c/p\u003e\u003cp\u003eSince graduating, I've built a career working with some of the most sophisticated financial institutions and families in the country. I currently work in New York City advising ultra-wealthy families on financial strategy, investments, and long-term planning — work that requires taking incredibly complex information and making it clear, digestible, and actionable for the people who need it most. I also work in accounting and financial operations, managing detailed reporting and analysis across multiple clients simultaneously. Before that, I completed a rotational program at Raymond James, one of the largest financial services firms in the U.S., where I gained hands-on experience across corporate strategy, financial planning, and commercial banking.\u003c/p\u003e\u003cp\u003eI've always believed that the skills that make someone great at finance — logical thinking, breaking problems into manageable steps, finding patterns in data, and communicating clearly — are the same skills that make someone a great student. I genuinely enjoy the moment when something that once seemed impossible suddenly clicks. Whether it's a tricky math concept, an economics principle, or just learning how to approach a hard problem with patience and confidence, I love helping students discover what they're truly capable of.\u003c/p\u003e\u003cp\u003eOutside of work, I've been involved in community building and mentorship since my college days, where I served as President of my university's Honors Diversity Initiative. In that role, I organized several cultural events and worked directly with school leadership to create a more inclusive and welcoming environment for students from all walks of life. That experience reinforced something I already believed — that every student deserves a supporter in their corner who is invested in their success.\u003cbr\u003eWhen I'm not working, you'll find me sewing, exploring new cultures, or getting lost in a good book. I'm a firm believer that the best way to experience a new culture is through its food, and living in New York City means I'm never short of opportunities to do just that. My favorite author is Joan Didion — I'm drawn to her distinct prose style and the way she builds a narrative so vivid and all-encompassing that you don't just read it, you feel it.\u003c/p\u003e\u003cp\u003eI'm excited to bring my real-world experience and genuine enthusiasm for teaching to students who are ready to grow.\u003c/p\u003e","teachingVideoPlaybackId":"om4UoJZvoCgUUpAoSd4KNzMBZNCAoRMYhaV3lUQW9kI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ffe2ac50-1167-494f-8688-ec533da2d3fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"c0c2c7c1-2b9c-42b2-a358-4bed2baa0663\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d8d3ae6-6914-4764-a38b-481a95fd235a\"}"},{"__ref":"DeepDives:{\"uuid\":\"b2b56557-c9db-4568-a775-0dd251e2e765\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3520d01c-cdaa-49c7-acab-57fd8895dd77/-/preview/-/format/jpg/","https://ucarecdn.com/999464a4-5ae3-48d1-b318-6747c66b42a9/-/preview/-/format/jpg/","https://ucarecdn.com/b0a3a29a-f508-47be-ab11-57ba44aa0bb5/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"fe73307f-abfd-4b4f-83cd-47eb9d7ffa11\"}"},{"__ref":"Education:{\"uuid\":\"2d213539-8032-4e58-90ab-1db7d51ff6d2\"}"}],"hiredAt":"2026-03-01T14:55:11.343Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Writing","College Essay Writing","Economics","Reading","Creative Writing","Video / Photography","K-6 Storybook","Business / Entrepreneurship","Finance / Investing","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rohith-vuribindi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5f880aaf-bd4a-4115-bae8-75f4ce7e9062\"}"}}},"_sentryTraceData":"3278206fa4da4b0cbb20d8a610e7091c-8c4bd319f770d294-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3278206fa4da4b0cbb20d8a610e7091c,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/men
