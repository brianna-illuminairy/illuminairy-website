,"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Neuroscience and Behavior","degree":null},"MentorPublicProfile:{\"uuid\":\"663c2895-cfc3-41db-acbe-0cd30eee4c79\"}":{"__typename":"MentorPublicProfile","uuid":"663c2895-cfc3-41db-acbe-0cd30eee4c79","displayName":"Luke  S.","slug":"luke-smith","biography":"\u003cp\u003eHi, my name is Luke Smith, and I'm a sophomore at Columbia University pursuing a Neuroscience and Behavior major on a pre-med track. My journey into neuroscience began in a workshop led by my mom, where I witnessed firsthand the profound impact of understanding brain development on adolescent behavior. Seeing how the workshop empowered her students to comprehend their own actions sparked my interest in the field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNeuroscience has taught me the importance of empathy. By delving into the complexities of the human brain, we can better understand the underlying reasons for people's behaviors, fostering compassion and reducing judgment. This understanding has become a recurring theme in my life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up in a small town in Alabama and now living in bustling New York City has exposed me to diverse perspectives and life experiences. I've observed the stark contrasts between rural and urban life, not only in terms of logistics but also in terms of mindsets, needs, and aspirations. I've come to realize that while our fundamental needs may be similar, our circumstances shape our unique perspectives and behaviors.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis appreciation for diversity has extended to my extracurricular activities. For three summers, I worked as a clinical and surgical assistant, gaining valuable insights into the importance of adaptability, versatility, and responsibility. Interacting with patients from various backgrounds taught me the significance of empathy and understanding, even in challenging situations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm actively involved in a club that teaches public health curriculum to New York City high school students. Although I am close in age to my students, their experiences are vastly different from mine. Through acknowledging and exploring these differences, I adapt my teaching style and content to meet their needs to strive to create a supportive and engaging learning environment.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I find solace and balance in running, healthy eating, political strategy, and playing the piano. These activities still challenge me to think critically and push myself physically, but they also allow me to recharge and renew.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough my academic pursuits, work experiences, and extracurricular activities, I've developed a strong foundation in empathy, understanding, and adaptability. I will take these lessons forward with me into the world where I hope to enact meaningful change.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"C01BGyI010201GOerVaIKxX9fX5t6jJ01PbL56W6I00vyXE01Q","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"57f75ce3-cb36-4d45-99de-f5143c19eec1\"}"},{"__ref":"Favorites:{\"uuid\":\"38395c9d-b6ff-4f8e-8589-a2bbf8ea23b0\"}"},{"__ref":"Favorites:{\"uuid\":\"eea29400-b234-43a7-a66f-f245e0679b68\"}"}],"causesSupported":[],"major":"Neuroscience and Behavior","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c674d8f1-fd73-4ba7-ba00-b3fa03d032fe\"}"},{"__ref":"DeepDives:{\"uuid\":\"2da4b434-455f-4ba3-bcac-712c4cd286ad\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d4a0a40-db3e-4425-8ec5-26798f85de2b\"}"},{"__ref":"DeepDives:{\"uuid\":\"ab5750cd-3605-4b3f-b3ff-14063a94b2e3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0b1b1ad0-4901-45ac-873b-02a7a6e703d1/-/preview/-/format/jpg/","https://ucarecdn.com/c6e33e28-4050-4124-9696-067637c2906f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","ge
