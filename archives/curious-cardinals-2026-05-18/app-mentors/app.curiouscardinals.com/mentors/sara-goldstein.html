xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"fa773664-4c31-43b1-8168-db6af25b786c\"}":{"__typename":"DeepDives","uuid":"fa773664-4c31-43b1-8168-db6af25b786c","content":"\u003cp\u003eWhen I was in middle and high school I was very much the quiet type. I worked hard in school and loved solo activities like painting, but avoided being the center of attention or leading others. In college I tried to challenge myself by  taking on leadership experiences and putting myself out there more. I still love my quiet activities, but I've learned so much about myself and gained so many  leadership skills from stepping out of my comfort zone. I'd love to work with mentees that also may be quiet but want to break out of their shell!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2374332e-d0ae-4e58-bde2-0e91c97cd236\"}":{"__typename":"DeepDives","uuid":"2374332e-d0ae-4e58-bde2-0e91c97cd236","content":"\u003cp\u003eI love to be outside! During my gap year before college I fell in love with hiking and backpacking while exploring the national parks. Since then I've also taken on running, and am currently marathon training. So weather it's climbing a mountain, running a race, or sketching in Golden gate park, you'll find me outside quite a bit.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7ad1e335-19b8-4910-b56e-74590b094d74\"}":{"__typename":"DeepDives","uuid":"7ad1e335-19b8-4910-b56e-74590b094d74","content":"\u003cp\u003eI've also loved understanding how things work, and when I first started learning biology and learning about how people and life works I felt like I was unlocking the secrets of the universe. Every biology class I took at Stanford brought me so much joy to understand the inner workings of the people and world around me. I eventually chose to pursue biology as my major as well as the pre medical track so that I could continue learning about people an life while also helping others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"70f1ffb6-7bc4-4b6c-9096-387eb0ce6cfa\"}":{"__typename":"DeepDives","uuid":"70f1ffb6-7bc4-4b6c-9096-387eb0ce6cfa","content":"\u003cp\u003eI want to be a doctor. I am still undecided on what specialty I want to pursue and have dreamed up a few possible paths after med school. One of my current dream jobs would be to study emergency medicine followed my a wilderness medicine fellowship so that I could work as a doctor on wilderness expeditions or with search and rescue.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"d43e0ce8-a888-42d2-b18d-e7f973c774fd\"}":{"__typename":"School","uuid":"d43e0ce8-a888-42d2-b18d-e7f973c774fd","name":"Concord Academy","city":"Concord","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01742"},"Education:{\"uuid\":\"2deac273-3d3e-4bb5-82c8-221965198f39\"}":{"__typename":"Education","uuid":"2deac273-3d3e-4bb5-82c8-221965198f39","school":{"__ref":"School:{\"uuid\":\"d43e0ce8-a888-42d2-b18d-e7f973c774fd\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a24b5bc8-719c-43d6-b6a3-728d60c3918b\"}":{"__typename":"Education","uuid":"a24b5bc8-719c-43d6-b6a3-728d60c3918b","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"90f5d1d7-1719-412e-b300-41cc7401786d\"}":{"__typename":"MentorPublicProfile","uuid":"90f5d1d7-1719-412e-b300-41cc7401786d","displayName":"Sara G.","slug":"sara-goldstein","biography":"\u003cp\u003eHi! I’m Sara, a recent graduate of Stanford University, where I studied Biology with a concentration in \u003cstrong\u003eMolecular, Cellular, and Developmental Biolog\u003c/strong\u003ey. I’m currently working as a medical assistant and scribe before applying to \u003cstrong\u003emedical school\u003c/strong\u003e, and I love helping students explore how science, creativity, and compassion intersect in healthcare.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, I conducted psychiatry research on the \u003cstrong\u003eneurocircuitry of drug and opioid addiction \u003c/strong\u003eusing mouse models, which deepened my interest in the connection between biology and behavior.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs Vice President of \u003cstrong\u003eStanford Women in Medicine\u003c/strong\u003e, I mentored other premed students through the ups and downs of their journey, helping them manage academics, applications, and self-confidence along the way.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI’ve also done my own projects such as illustrating a mouse brain atlas where I tried to showcase the intricacies and beauty of brain anatomy through a series of 20 sequential drawings.\u0026nbsp;\u003c/p\u003e\u003cp\u003ePost grad I have been working closely with physicians and working independently writing \u003cstrong\u003epatient case report abstracts\u003c/strong\u003e to submit for scientific conference consideration.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThese experiences taught me how to support students not just in their studies, but in finding purpose and balance in their work.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI mentor students interested in:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBiology and health sciences\u003c/strong\u003e (neurobiology, anatomy, molecular biology)\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePremed pathways\u003c/strong\u003e, from exploring medicine to preparing strong applications\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterdisciplinary passion projects that blend art and science, such as creative health campaigns or visual projects inspired by biology\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also help students strengthen broader skills like:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eOrganization and time management\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStudy planning and goal setting\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding confidence as a learner and communicator\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI’ve guided students through research projects, premed planning, and creative interdisciplinary work, helping them translate curiosity into structured, achievable goals. My mentorship experience at \u003cstrong\u003eStanford Women in Medicine\u003c/strong\u003e taught me how to break down complex ideas, provide actionable guidance, and offer encouragement through challenges.\u003c/p\u003e\u003cp\u003eIn sessions with me, you’ll get \u003cstrong\u003epractical strategies\u003c/strong\u003e, \u003cstrong\u003ehands-on feedback\u003c/strong\u003e, and a mentor who knows what it’s like to balance academics, research, and personal projects and who can help you do the same.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy mentorship style\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI believe mentorship should be both structured and encouraging. A session with me might involve brainstorming a project idea, mapping out a study plan that actually works, or practicing how to talk about your interests with clarity and confidence. My goal is to help students feel supported, inspired, and proud of what they’re creating.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside of science\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not working or mentoring, you can find me running, hiking, skiing, or painting often with nature or anatomy-inspired themes. I love helping students bring the same creativity and balance into their own lives. If you’re curious, motivated, and ready to grow, I’d love to help you make your ideas come to life.\u003c/p\u003e","teachingVideoPlaybackId":"vI300LA94VVoRytb8gByUm1wEQwfN8BJFhH02ZGWjUjYc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fa773664-4c31-43b1-8168-db6af25b786c\"}"},{"__ref":"DeepDives:{\"uuid\":\"2374332e-d0ae-4e58-bde2-0e91c97cd236\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ad1e335-19b8-4910-b56e-74590b094d74\"}"},{"__ref":"DeepDives:{\"uuid\":\"70f1ffb6-7bc4-4b6c-9096-387eb0ce6cfa\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3b5e9719-25af-41c8-9e64-6762406fa2a7/-/preview/-/format/jpg/","https://ucarecdn.com/ed973d57-171d-413e-ad32-fb4e427ab742/-/preview/-/format/jpg/","https://ucarecdn.com/3b85c783-6cad-4019-a03a-ac2f91e67ed3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2deac273-3d3e-4bb5-82c8-221965198f39\"}"},{"__ref":"Education:{\"uuid\":\"a24b5bc8-719c-43d6-b6a3-728d60c3918b\"}"}],"hiredAt":"2025-10-31T16:48:24.718Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Physics","Academic Coaching","Executive Function","College Essay Writing","Visual Arts / Graphic Design","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sara-goldstein\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"90f5d1d7-1719-412e-b300-41cc7401786d\"}"}}},"_sentryTraceData":"f787a31227ec43b08d53c0bbe3c4caef-9852614f31c64103-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f787a31227ec43b08d53c0bbe3c4caef,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-samp
