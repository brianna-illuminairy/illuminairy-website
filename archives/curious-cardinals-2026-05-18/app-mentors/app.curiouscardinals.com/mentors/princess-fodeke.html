xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"403e2b62-4b72-43c3-87a4-d1f03fa8b93a\"}":{"__typename":"Favorites","uuid":"403e2b62-4b72-43c3-87a4-d1f03fa8b93a","photoUrl":"https://ucarecdn.com/8a240389-2137-422a-b2df-ba283bca7f28/","title":"Everything Everywhere All At Once","type":"MOVIE"},"Favorites:{\"uuid\":\"53a2922d-0e03-477a-be08-61ba137b414e\"}":{"__typename":"Favorites","uuid":"53a2922d-0e03-477a-be08-61ba137b414e","photoUrl":"https://ucarecdn.com/668d2c32-bba6-460a-8513-99f7b4e22718/","title":"Hadestown","type":"PLAY"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8ab38eaf-645c-4a69-b825-bf89674675b2\"}":{"__typename":"DeepDives","uuid":"8ab38eaf-645c-4a69-b825-bf89674675b2","content":"\u003cp\u003eI was almost \u003cem\u003etoo \u003c/em\u003ehardworking! College application season was especially brutal.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"dd05d1ce-af61-4972-a5d9-7a104564ec4b\"}":{"__typename":"DeepDives","uuid":"dd05d1ce-af61-4972-a5d9-7a104564ec4b","content":"\u003cp\u003eIn high school I was part of an online philosophy group that met with professors and lecturers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cfc6350e-6ba3-4db9-b4c6-af69a870c443\"}":{"__typename":"DeepDives","uuid":"cfc6350e-6ba3-4db9-b4c6-af69a870c443","content":"\u003cp\u003eI love to read and watch movies! Feel free to give me some recs :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8dc7e633-fd0e-4321-9fd8-4fe2a5b1b4ee\"}":{"__typename":"DeepDives","uuid":"8dc7e633-fd0e-4321-9fd8-4fe2a5b1b4ee","content":"\u003cp\u003eFor almost all of my life I've wanted to be a lawyer, but as I grow older I find myself wanting to bridge this career with something more creative. Maybe a legal intern in the fashion industry?\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"6b8ccd20-225b-41a2-9428-0197c76c5131\"}":{"__typename":"School","uuid":"6b8ccd20-225b-41a2-9428-0197c76c5131","name":"Lowndes High School","city":"Valdosta","type":"HIGH","state":"GA","country":"United States","zip":"31601"},"Education:{\"uuid\":\"c80094b6-0389-4c93-92af-5cff858adafe\"}":{"__typename":"Education","uuid":"c80094b6-0389-4c93-92af-5cff858adafe","school":{"__ref":"School:{\"uuid\":\"6b8ccd20-225b-41a2-9428-0197c76c5131\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"64b4b9c0-e27b-4196-ac3e-bbae4981bcb8\"}":{"__typename":"Education","uuid":"64b4b9c0-e27b-4196-ac3e-bbae4981bcb8","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Public Policy and International Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"09fcc375-db37-4950-afbf-af8106f417b1\"}":{"__typename":"MentorPublicProfile","uuid":"09fcc375-db37-4950-afbf-af8106f417b1","displayName":"Princess F.","slug":"princess-fodeke","biography":"\u003cp\u003eHi, my name is Princess Fodeke! Yes, that’s my real name, and no, I'm (unfortunately) not of royal lineage. Currently, I’m a member of Princeton University’s Great class of 2028, planning to major in Public and International Affairs with a potential minor in data science. I’m passionate about education, creative expression, and public service, especially when these worlds intersect. Whether I'm mentoring a student through Algebra I, brainstorming a college essay, or helping someone bring a creative project to life, I strive to make learning engaging and empowering.\u003c/p\u003e\u003cp\u003eMy journey to college began in my small town in rural South Georgia, where opportunities weren’t always abundant. Attending a public school with limited resources meant that, at the least, certain advanced coursework or enrichment programs were often unavailable. But it also meant that I had to become determined to seek opportunities beyond what was immediately in front of me. I was fortunate to be selected for the Georgia Governor’s Honors Program and, later, earn a scholarship to the Yale Young Global Scholar Program, where I explored literature, politics, philosophy, and global cultures. It was the first time I had access to that level of academic intensity and peer collaboration, and it pushed me to think more critically about the world and my place in it. As a student from an under-resourced background, these experiences deepened my interest in understanding how policy could expand access to education and uplift communities like the one I grew up in.\u003c/p\u003e\u003cp\u003eIt’s because of this that I chose to pursue Public and International Affairs as my main course of study. I want to understand how systems work and how they can be reimagined to serve students. Education isn't just personal; it's where change begins!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Princeton, I still make space to pursue the creative and community-driven work that fuels me. I write for The Daily Princetonian's Arts \u0026amp; Culture section and am a member of the Edwards Collective, a selective residential arts and humanities community, where I help plan events bridging creativity and critical thinking. I'm also active in reproductive justice work, sustainability research, and youth political organizing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a tutor and mentor, I bring a holistic and student-centered approach to the table. I love finding the right metaphor, the perfect structure, or the confidence-building strategy that helps a student unlock their potential. I also have experience in photography, social media strategy, and video editing. Whether you need help organizing your ideas, brushing up on grammar, building stronger study habits, or expressing your creativity, I’m here to support you. Every student has a story, and I’m here to help you tell it and succeed in the process.\u003c/p\u003e","teachingVideoPlaybackId":"jNCZuAutkA8E318Y019pRuCjCcbdo01gk2pUM792wBx008","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMaybe not my greatest achievement, but I recently scored almost 200,000 on lumpty.com Tetris!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"403e2b62-4b72-43c3-87a4-d1f03fa8b93a\"}"},{"__ref":"Favorites:{\"uuid\":\"53a2922d-0e03-477a-be08-61ba137b414e\"}"}],"causesSupported":[],"major":"Public Policy and International Affairs","d
