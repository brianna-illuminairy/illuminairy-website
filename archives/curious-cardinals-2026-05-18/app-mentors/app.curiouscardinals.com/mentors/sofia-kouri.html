xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a57a4d16-3f56-41a3-a437-8ce55bf99fb9\"}":{"__typename":"Favorites","uuid":"a57a4d16-3f56-41a3-a437-8ce55bf99fb9","photoUrl":"https://ucarecdn.com/a328843b-c3e9-49af-bc34-a07620ba9e88/","title":"Gego, Olga de Amaral, Lina bo Bardi","type":"ARTIST"},"Favorites:{\"uuid\":\"31e2049b-e9b2-42f4-ad4c-c6caa5aa60b6\"}":{"__typename":"Favorites","uuid":"31e2049b-e9b2-42f4-ad4c-c6caa5aa60b6","photoUrl":"https://ucarecdn.com/553a702e-8d68-4553-9078-42f609364a60/","title":"My Brilliant Friend, Elena Ferrante","type":"BOOK"},"Favorites:{\"uuid\":\"d21e921f-3622-4381-87c9-518dc5446c5f\"}":{"__typename":"Favorites","uuid":"d21e921f-3622-4381-87c9-518dc5446c5f","photoUrl":"https://ucarecdn.com/4f03d632-1bfd-4d72-aaf5-28f442c2257c/","title":"Mexico City","type":"CITY"},"CausesSupported:{\"uuid\":\"e8a361f8-0d0e-4634-b09d-ccf599e7bf32\"}":{"__typename":"CausesSupported","uuid":"e8a361f8-0d0e-4634-b09d-ccf599e7bf32","name":"Las Americas Immigrant Advocacy Center","description":"\u003cp\u003eIntakes/Credible Fear Interview preparation calls with detained asylum seekers\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4eba364b-8ffa-4538-8b5b-19ea1191bc77\"}":{"__typename":"DeepDives","uuid":"4eba364b-8ffa-4538-8b5b-19ea1191bc77","content":"\u003cp\u003eI came into college wanting to study visual art and physics as a double major... and then I took an architecture course\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"4f84058d-e445-48a8-b8a0-b01bceb14ba4\"}":{"__typename":"DeepDives","uuid":"4f84058d-e445-48a8-b8a0-b01bceb14ba4","content":"\u003cp\u003eMy father is a Cuban political refugee who grew up in Mexico, and I spent a large part of my childhood between the U.S., Mexico and Brazil as well... I think all of this has taught me the importance of internationalism, multilingualism, and getting to know places outside of where you are from! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"af5d1d12-1880-4238-8b49-a28e8b962986\"}":{"__typename":"DeepDives","uuid":"af5d1d12-1880-4238-8b49-a28e8b962986","content":"\u003cp\u003eI was so, so shy! I spent all of my time in the darkroom, reading, or listening to music. I never could have imagined myself moving abroad alone, diving into a field that requires me to put both myself and my work front and center. It was through good mentorship and the discovery of a major I was just so passionate about that I learned to make my introverted-ness a strength. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"3224da09-4d67-4a2a-8b8e-36bd911f78e7\"}":{"__typename":"School","uuid":"3224da09-4d67-4a2a-8b8e-36bd911f78e7","name":"University of Chicago Laboratory Schools","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60637"},"Education:{\"uuid\":\"47b0316b-9a42-403c-81ab-2ec2caeb245f\"}":{"__typename":"Education","uuid":"47b0316b-9a42-403c-81ab-2ec2caeb245f","school":{"__ref":"School:{\"uuid\":\"3224da09-4d67-4a2a-8b8e-36bd911f78e7\"}"},"startYear":"2008","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"464d0f34-0b13-4dab-9d32-c58e60faef28\"}":{"__typename":"Education","uuid":"464d0f34-0b13-4dab-9d32-c58e60faef28","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Architecture, Human Rights","degree":null},"MentorPublicProfile:{\"uuid\":\"0b5a9944-e5f4-45d6-bc00-91e1f679d983\"}":{"__typename":"MentorPublicProfile","uuid":"0b5a9944-e5f4-45d6-bc00-91e1f679d983","displayName":"Sofia K.","slug":"sofia-kouri","biography":"\u003cp\u003eHi! My name is Sofia, and I am a recent graduate of Yale College with degrees in Architecture and Human Rights from the Yale Law School. I love all things architecture and design, and am also a researcher, painter, photographer and writer.  I've spent summers studying social housing in Mexico and Chile, and I also try to keep one foot in the art world––– I've worked at museums like the Solomon R. Guggenheim Museum and the Yale University Art Gallery, thinking about the intersections of visual art and curation with architecture and the built environment.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time you can find me training for a marathon, making ceramics, reading or writing creative nonfiction, or learning French––– I've spent the year after graduation living in Paris, learning French (I didn't speak a word when I moved here!) while working for a publication and building my portfolio. I love talking about the confidence and strength that one acquires through moving abroad–– throughout college and even now, it is these experiences that have most shaped my academic and personal interests. Without them I would not be half the person I am today.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond design work , I'm passionate about writing and have extensive experience (over five years spent!) working with students on improving writing, both personal and academic. I've also worked extensively workshopping students' college application essays. I was a peer writing tutor at Yale all four years of college, working mostly with English second-language students or students who study things other than writing, but still seek to improve. I've worked as a copy editor for a trilingual publication. Even though I work in the visual sphere myself, I see writing as a critical skill for almost all disciplines––– I also think it can be really fun.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to meeting and working with you!\u003c/p\u003e","teachingVideoPlaybackId":"YqyVrna1S1anMwrNwUNaYBXe01tEoVB020016Igbb96qQM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThis last summer, I worked with the Solomon R. Guggenheim Museum to develop an architecture tour for them. I did archival research for the team and wrote the tour plan, so if you go on their architecture tour today, you'll be following the tour that I wrote!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a57a4d16-3f56-41a3-a437-8ce55bf99fb9\"}"},{"__ref":"Favorites:{\"uuid\":\"31e2049b-e9b2-42f4-ad4c-c6caa5aa60b6\"}"},{"__ref":"Favorites:{\"uuid\":\"d21e921f-3622-4381-87c9-518dc5446c5f\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"e8a361f8-0d0e-4634-b09d-ccf599e7bf32\"}"}],"major":"Architecture, Human Rights","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4eba364b-8ffa-4538-8b5b-19ea1191bc77\"}"},{"__ref":"DeepDives:{\"uuid\":\"4f84058d-e445-48a8-b8a0-b01bceb14ba4\"}"},{"__ref":"DeepDives:{\"uuid\":\"af5d1d12-1880-4238-8b49-a28e8b962986\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8731ea81-b9dc-4560-8082-14b9f909fa9a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"47b0316b-9a42-403c-81ab-2ec2caeb245f\"}"},{"__ref":"Education:{\"uuid\":\"464d0f34-0b13-4dab-9d32-c58e60faef28\"}"}],"hiredAt":"2025-05-06T11:05:26.197Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Music","Visual Arts / Graphic Design","History Project","Video / Photography","Law / Government / Policy","Sustainability","Journalism"],"communityBadges":["https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sofia-kouri\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0b5a9944-e5f4-45d6-bc00-91e1f679d983\"}"}}},"_sentryTraceData":"a55a25f92bbc40d3b3342a70f1ca6c8d-a455b6e9d6629bdc-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a55a25f92bbc40d3b3342a70f1ca6c8d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sofia-kouri"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.goo
