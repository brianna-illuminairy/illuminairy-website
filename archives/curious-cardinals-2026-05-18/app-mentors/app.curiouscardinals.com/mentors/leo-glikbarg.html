830a83-b4df-4ddc-8102-89a1c11324bc\"}":{"__typename":"DeepDives","uuid":"64830a83-b4df-4ddc-8102-89a1c11324bc","content":null,"videoPlaybackId":"NrFtvJ6IMR01BEwk5l494dHedLh01zmJH3Ou6NUgzgQNg","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"74a17a94-d332-4361-86a5-183276270a49\"}":{"__typename":"School","uuid":"74a17a94-d332-4361-86a5-183276270a49","name":"Dos Pueblos Engineering Academy","city":"Goleta","type":"HIGH","state":"California","country":"United States","zip":"93117"},"Education:{\"uuid\":\"7f78fb82-7f7c-44cb-90d1-2369e7321cf0\"}":{"__typename":"Education","uuid":"7f78fb82-7f7c-44cb-90d1-2369e7321cf0","school":{"__ref":"School:{\"uuid\":\"74a17a94-d332-4361-86a5-183276270a49\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7bc2221b-4004-4e60-9509-bfa1a082a67a\"}":{"__typename":"Education","uuid":"7bc2221b-4004-4e60-9509-bfa1a082a67a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2025","major":"Computer Science MS, International Relations BA","degree":null},"MentorPublicProfile:{\"uuid\":\"c27c15ab-91b5-45ba-a268-e74d8c16c782\"}":{"__typename":"MentorPublicProfile","uuid":"c27c15ab-91b5-45ba-a268-e74d8c16c782","displayName":"Leo G.","slug":"leo-glikbarg","biography":"\u003cp\u003eI’m Leo Glikbarg, a freshly minted Stanford graduate who couldn’t decide between understanding the world and building things—so I earned a B.A. in International Relations and an M.S. in Computer Science. Growing up in sunny Santa Barbara I fell for rockets, languages, and long‑form essays in equal measure; that curiosity has since carried me from avionics benches at SpaceX to AI policy briefings in Washington D.C. and venture analysis in ed‑tech finance. Whether wiring telemetry sensors into the world’s largest rocket or coding an autonomous cybersecurity agent, I’ve learned that the real thrill lies in translating complex ideas into stories that spark action.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat same mindset drives my mentorship. In our first meeting I’ll ask about the novels that kept your student up past bedtime, the TikTok channels that grab their attention, and the class units that make them groan. Once I know what lights them up, we build a “mission plan” that stitches coursework into a project they can show off proudly. A derivative becomes the slope a drone follows during a backyard flight test; narrative structure reveals itself by dissecting Pixar shorts frame by frame. Every session closes with a concise progress recap so parents stay in the loop and students see their own momentum.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also weave in the executive‑function habits I relied on when juggling code reviews, policy memos, and 4 a.m. static‑fire tests: Accountability plans, calendar sprints, and reflection rituals that turn deadlines from stressors into milestones. Students leave not only understanding content more deeply but also wielding a toolkit for organizing any future challenge.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m as committed to the person as to the material. On my cross‑country ride with Stanford Spokes, where we pedaled 3,600 miles and taught hands‑on STEM lessons in under-served classrooms each afternoon, I saw students’ confidence bloom the moment an abstract idea met a tactile challenge. That memory guides me whenever I meet a learner struggling with executive function, a budding engineer hungry for CAD skills, or a writer looking to sharpen a narrative arc. Beyond academics you’ll find me chasing coastal sunrises with my camera, hiking switchbacks, or drafting op‑eds on AI policy--pursuits I gladly weave into sessions when they help a concept click.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGreat mentors turned my own “What if…?” moments into “Watch this!” achievements. Paying that forward means helping your child see every subject as a launchpad for creativity, resilience, and impact. Whether we’re coding a trading bot, simulating an orbital transfer, or sculpting a persuasive essay, my goal is that they finish our journey not just knowing more, but dreaming bigger—and equipped with the tools to make those dreams real.\u003c/p\u003e","teachingVideoPlaybackId":"HfYwcFLgiD7UNWRO6arOK3ndl8nGMQ02dWrXzIh4cRmE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science MS, International Relations BA","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6e27366a-1c39-4187-8663-8a5fa2b0194a\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f771b6c-e866-447b-b9da-c7694b697c74\"}"},{"__ref":"DeepDives:{\"uuid\":\"deeab040-2c03-4b75-aff7-bc3009f04ed8\"}"},{"__ref":"DeepDives:{\"uuid\":\"64830a83-b4df-4ddc-8102-89a1c11324bc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/670f433c-0081-4982-ad7c-983c54c77878/-/preview/-/format/jpg/","https://ucarecdn.com/2d38cfb0-fbac-46e1-99da-9bf42101af5f/-/preview/-/format/jpg/","https://ucarecdn.com/8efd062e-0768-4543-bce0-710477da062e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7f78fb82-7f7c-44cb-90d1-2369e7321cf0\"}"},{"__ref":"Education:{\"uuid\":\"7bc2221b-4004-4e60-9509-bfa1a082a67a\"}"}],"hiredAt":"2025-07-17T18:22:18.121Z","topics":["Statistics","Calculus","Precalculus / Trigonometry","Algebra II","Physics","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Computer Science","History Project","Video / Photography","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Robotics / Electronics / CAD","STEM Project","Aviation / Aerospace","Machine Learning / AI","Law / Government / Policy","Sustainability","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"leo-glikbarg\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c27c15ab-91b5-45ba-a268-e74d8c16c782\"}"}}},"_sentryTraceData":"981038aa96f648869da33a4ac7f17858-a3986008c92e07bf-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=981038aa96f648869da33a4ac7f17858,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"leo-glikbarg"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
