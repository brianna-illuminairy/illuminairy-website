xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"13c23302-41b7-406e-93b6-29378916f9dc\"}":{"__typename":"Favorites","uuid":"13c23302-41b7-406e-93b6-29378916f9dc","photoUrl":"https://ucarecdn.com/51af4f31-5140-4011-a7d8-9f5d47eb15f9/","title":"Bruce Springsteen","type":"ARTIST"},"Favorites:{\"uuid\":\"73dd20a0-c221-4a81-96a0-34333d932307\"}":{"__typename":"Favorites","uuid":"73dd20a0-c221-4a81-96a0-34333d932307","photoUrl":"https://ucarecdn.com/58c23343-11f2-4e59-aa5c-edbdd35a3b0e/","title":"Don’t Look Back in Anger","type":"SONG"},"Favorites:{\"uuid\":\"dfa9b801-39d2-4b39-8f0e-02a66e99fddf\"}":{"__typename":"Favorites","uuid":"dfa9b801-39d2-4b39-8f0e-02a66e99fddf","photoUrl":"https://ucarecdn.com/64e767cf-690f-4884-a2f4-425cdbe77c4d/","title":"Swimming","type":"SPORT"},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"a4cbfaa4-f6d5-4610-8e48-e90cd5979bcc\"}":{"__typename":"DeepDives","uuid":"a4cbfaa4-f6d5-4610-8e48-e90cd5979bcc","content":"\u003cp\u003eI have a large family! I am one of 4 and I have a twin sister, Alanna. Outside of my immediate family, I have 27 first cousins on my Dad's side so you can imagine how hectic holidays can be\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"815c39f0-7cb6-4fb0-bb09-74cb1ff28770\"}":{"__typename":"School","uuid":"815c39f0-7cb6-4fb0-bb09-74cb1ff28770","name":"Fordham Preparatory School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10458"},"Education:{\"uuid\":\"248abe59-2b89-4b8f-9a35-206b7e546428\"}":{"__typename":"Education","uuid":"248abe59-2b89-4b8f-9a35-206b7e546428","school":{"__ref":"School:{\"uuid\":\"815c39f0-7cb6-4fb0-bb09-74cb1ff28770\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"02638de0-1761-44b7-92ca-d90a6d043f3f\"}":{"__typename":"Education","uuid":"02638de0-1761-44b7-92ca-d90a6d043f3f","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d4582e3f-cd60-4a0c-8571-c6b1552a47d6\"}":{"__typename":"MentorPublicProfile","uuid":"d4582e3f-cd60-4a0c-8571-c6b1552a47d6","displayName":"John K.","slug":"john-kelly","biography":"\u003cp\u003eHi there! I'm Jack Kelly, a senior Mechanical Engineering student at Brown University with a 3.8 GPA, but more importantly, I'm someone who believes that excellence isn't just about what you achieve, it's about how you push through challenges and support others along the way. Growing up in New York, I learned early on that success comes from combining passion with relentless work ethic, whether that's in the pool, the classroom, or helping others reach their potential. I'm an Olympic Trials qualifier, NCAA All American swimmer, current team captain, and Ivy League record holder, but I'm also an Eagle Scout, studied engineering, and have some finance experience. What defines me most is my belief that every student has untapped potential waiting to be unlocked through the right guidance and genuine encouragement.\u003c/p\u003e\u003cp\u003eLet me be honest, I've been incredibly fortunate to achieve some pretty cool things. But here's what's more important, I know what it takes to perform under pressure, manage time between demanding schedules, and bounce back from setbacks. Maintaining a 3.8 GPA in Mechanical Engineering while training 20+ hours per week taught me efficiency, prioritization, and how to break down complex problems. As team captain, I've learned that leadership isn't about being the loudest voice in the room, it's about lifting others up. I've seen how small acts of guidance can create massive positive change.\u003c/p\u003e\u003cp\u003eWhen I'm not studying or perfecting my breaststroke technique, you'll find me camping in the wilderness, strategizing over Texas Hold'em poker, or binge-watching \u003cem\u003eThe Boys\u003c/em\u003e series. My friends would describe me as intensely curious, surprisingly funny, and someone who never gives up on people. I'm the guy who stayed after practice countless times to help teammates perfect their technique, and I bring that same energy to academic mentoring.\u003c/p\u003e\u003cp\u003eHere's why I'm passionate about mentoring: I've been incredibly lucky to have coaches, professors, and mentors who saw potential in me before I saw it in myself. They didn't just teach me techniques or formulas, they taught me how to think, how to persist, and how to believe I belonged in rooms where I initially felt out of place. My mission is simple: I want to be that person for your student. Whether they're struggling with calculus, dreaming of a certain school, trying to balance athletics and academics, or simply need someone to believe in their potential, I'm here to provide both the technical knowledge and the confidence boost they need.\u003c/p\u003e\u003cp\u003eOur sessions won't be passive lectures. I believe in making connections between abstract concepts and real world applications, because understanding \u003cem\u003ewhy\u003c/em\u003e something matters is just as important as knowing \u003cem\u003ehow\u003c/em\u003e it works. I'm particularly excited to work with students who are juggling multiple passions (like athletics and academics), those who want to explore STEM fields, or anyone who needs help developing the problem solving confidence that will serve them far beyond any single subject. A few months from now, I don't just want your student to have better grades, I want them to approach challenges with curiosity instead of fear, to see setbacks as learning opportunities rather than failures, and to know they have someone in their corner who genuinely believes in their potential to achieve extraordinary things.\u003c/p\u003e\u003cp\u003eReady to dive in? Let's make some waves together\u003c/p\u003e","teachingVideoPlaybackId":"1ZA00bZzjA02F6TbIy02bsT3YlSoKzLImCh1w3xnxBOH8U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"13c23302-41b7-406e-93b6-29378916f9dc\"}"},{"__ref":"Favorites:{\"uuid\":\"73dd20a0-c221-4a81-96a0-34333d932307\"}"},{"__ref":"Favorites:{\"uuid\":\"dfa9b801-39d2-4b39-8f0e-02a66e99fddf\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a4cbfaa4-f6d5-4610-8e48-e90cd5979bcc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e031e1d5-d6ec-4600-8e6e-abd5fa0f049a/-/preview/-/format/jpg/","https://ucarecdn.com/1d1c47d3-c868-4127-886e-825a8d46882b/-/preview/-/format/jpg/","https://ucarecdn.com/df3bd22d-d60b-46db-bd1d-41664f9e9b8e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"248abe59-2b89-4b8f-9a35-206b7e546428\"}"},{"__ref":"Education:{\"uuid\":\"02638de0-1761-44b7-92ca-d90a6d043f3f\"}"}],"hiredAt":"2025-05-28T23:08:08.699Z","topics":["Pre-Algebra","Algebra I","K-5 Grade Math","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","Academic Coaching","Executive Function","Business / Entrepreneurship","Finance / Investing","Aviation / Aerospace","STEM Project","Public Speaking"],"communityB
