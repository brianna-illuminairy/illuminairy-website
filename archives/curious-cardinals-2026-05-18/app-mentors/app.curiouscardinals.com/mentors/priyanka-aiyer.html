xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"06b7c374-f0dd-4f70-85ec-507d755dd268\"}":{"__typename":"DeepDives","uuid":"06b7c374-f0dd-4f70-85ec-507d755dd268","content":"\u003cp\u003eI'm so proud of the publishing house I founded, Half Mystic Press, which champions the intersections between literature, music, and art and uplifts underrepresented voices in publishing. Working with a team of women and gender non-conforming editors and designers based all around the world, I've published six books and ten magazine issues, cultivating an artistic community as vibrant as it is diverse, and platforming writers who might never have found an audience otherwise.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"cd0d7404-cef7-48fa-a1bd-2f22641515ca\"}":{"__typename":"DeepDives","uuid":"cd0d7404-cef7-48fa-a1bd-2f22641515ca","content":"\u003cp\u003eMy greatest mentor is Cyril Wong, a poet who I read religiously growing up. In my hometown of Singapore it is extremely rare to be openly in the LGBT+ community, and Cyril's work was joyful and queer and hopeful and proud in ways I had never realised were possible. When Cyril came to my high school as a visiting author my sophomore year, he took me under his wing and started meeting with me regularly to critique my poems and introduce me to important figures in the publishing world. Eventually, he recommended me to his publisher, which led to me signing my first book deal when I was 17. Without Cyril modelling the possibilities of creative writing and taking a chance on my work, I would undoubtedly not be the person or artist that I am today. I'm endlessly grateful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5e29781c-62cf-4f60-83ec-d351b6f1b7d5\"}":{"__typename":"DeepDives","uuid":"5e29781c-62cf-4f60-83ec-d351b6f1b7d5","content":"\u003cp\u003eI love to hike, bake, read, listen to podcasts, travel, and see live music! Right now I'm trying to bake the perfect almond croissant (an incredibly nostalgic sweet treat for me—when I was younger my dad and I used to split one at our favourite café every Sunday), and I've been obsessed with the horror podcast \u003cem\u003eThe Magnus Archives, \u003c/em\u003ewhich sends a delicious chill down my spine every time I listen. My favourite place to visit is undoubtedly Rome, my favourite book is a tie between Donna Tartt's \u003cem\u003eThe Goldfinch \u003c/em\u003eand Richard Siken's \u003cem\u003eWar of the Foxes, \u003c/em\u003eand one day I want to climb the Alps.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4bc70523-0b83-4ce5-8a4e-b0d5afddc952\"}":{"__typename":"DeepDives","uuid":"4bc70523-0b83-4ce5-8a4e-b0d5afddc952","content":"\u003cp\u003eI decided to pursue a certificate in Visual Arts at Princeton having no prior experience in art, just because I took one course in the department and fell in love with it. Being part of the certificate programme meant that I had to compile a senior thesis exhibition, so for a year I took 80 photos on analogue film that followed the story of a ghost (me, in a sheet!) exploring and testing the boundaries of the living world. It is one of the most creatively difficult projects I've ever completed, and I pushed myself every day to come up with new concepts for shoots and find the time and patience to execute them. The final 80 photographs are funny, tragic, curious, and unlike anything else I've made so far. Now that my thesis is finished, I'm posting all 80 photos on Instagram and looking into the possibility of making and selling prints!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"f8a0d5eb-9eae-4063-97de-5eb09b39d94b\"}":{"__typename":"Education","uuid":"f8a0d5eb-9eae-4063-97de-5eb09b39d94b","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"English","degree":null},"School:{\"uuid\":\"101fe0d6-2516-4d89-94b0-67c175cece26\"}":{"__typename":"School","uuid":"101fe0d6-2516-4d89-94b0-67c175cece26","name":"Singapore American School","city":"Singapore","type":"HIGH","state":"Singapore","country":"Singapore","zip":"738547"},"Education:{\"uuid\":\"0634e009-d52c-4755-b1ce-8ba9230ea97d\"}":{"__typename":"Education","uuid":"0634e009-d52c-4755-b1ce-8ba9230ea97d","school":{"__ref":"School:{\"uuid\":\"101fe0d6-2516-4d89-94b0-67c175cece26\"}"},"startYear":"2007","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"54783168-61fd-46db-a650-d9e473eac926\"}":{"__typename":"MentorPublicProfile","uuid":"54783168-61fd-46db-a650-d9e473eac926","displayName":"Priyanka A.","slug":"priyanka-aiyer","biography":"\u003cp\u003eI am an internationally-award winning and critically-acclaimed writer, editor, performer, and teaching artist. Under the pen name Topaz Winters, I’m the author of three books from Button Poetry: \u003cem\u003eSo, Stranger \u003c/em\u003e(2022), \u003cem\u003ePortrait of My Body as a Crime I’m Still Committing \u003c/em\u003e(2019), and \u003cem\u003epoems for the sound of the sky before thunder \u003c/em\u003e(2017). I’ve served as the founder and editor-in-chief of the publishing house and literary journal Half Mystic Press since 2015. My peer-reviewed research on poetry and queerness in Singapore is published in the \u003cem\u003eJournal of Homosexuality\u003c/em\u003e, and is taught at the University of Southern California’s doctorate programme in educational leadership.\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003eMy poetry, essays, and art are in the world in many different forms and many different places, from \u003cem\u003eThe Straits Times\u003c/em\u003e to \u003cem\u003eAmerican Banker\u003c/em\u003e to the Singapore Writers Festival to the Center for Fiction to the Academy of American Poets. I’ve traveled across the world teaching and performing creative writing, and my photography and performance art have been exhibited in Singapore and the United States. In 2017 I gave the TEDx talk \u003cem\u003eHealing Is a Verb\u003c/em\u003e. I’m the writer and star of the critically-acclaimed short film \u003cem\u003eSUPERNOVA\u003c/em\u003e (recipient of awards from the Newark International, Across Asia Youth, Laurie Nelson, My Rode Reel, Singapore International Student, and CINE Golden Eagle Film Festivals), and from 2015 to 2022 I wrote a column of personal essays on love and music for \u003cem\u003eHalf Mystic Journal\u003c/em\u003e.\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003eI graduated in 2023 with a B.A. in English and certificates in Creative Writing, Visual Art, and Italian from Princeton University. I live between Singapore and Brooklyn, and I’m so honoured to bring my passion for all kinds of art to my students at Curious Cardinals!\u003c/p\u003e","teachingVideoPlaybackId":"5YYMszazK4dEUGA3p6BeXd5m8DY00R5AEI01tYkgtHJQs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"06b7c374-f0dd-4f70-85ec-507d755dd268\"}"},{"__ref":"DeepDives:{\"uuid\":\"cd0d7404-cef7-48fa-a1bd-2f22641515ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"5e29781c-62cf-4f60-83ec-d351b6f1b7d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"4bc70523-0b83-4ce5-8a4e-b0d5afddc952\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7853c125-8b89-4b40-9073-01afbda75d8c/-/preview/-/format/jpg/","https://ucarecdn.com/1f1af338-ea60-4693-91a2-3e07e00f0bea/-/preview/-/format/jpg/","https://ucarecdn.com/4c40d7f8-8596-475b-bdc9-caa7d269063b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f8a0d5eb-9eae-4063-97de-5eb09b39d94b\"}"},{"__ref":"Education:{\"uuid\":\"0634e009-d52c-4755-b1ce-8ba9230ea97d\"}"}],"hiredAt":"2021-08-08T17:59:40.000Z","topics":["Music","Film / Theater","History Project","History","Women \u0026 Gender Studies","Italian","Cooking","Creative Writing","Reading","Public Speaking","Literature","Journalism","Writing","Philosophy","Video / Photography"],"communityBadges":["https://ucarecdn.com/4f6b2e92-2aa8-4328-90be-11c5a7d63bc7/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\
