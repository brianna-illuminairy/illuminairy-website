xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7547422c-4f68-4f24-a496-24f6c212b783\"}":{"__typename":"Favorites","uuid":"7547422c-4f68-4f24-a496-24f6c212b783","photoUrl":"https://ucarecdn.com/c45b5941-817f-4bc2-8424-fafebbcc2d60/","title":"Messi","type":"ATHLETE"},"Favorites:{\"uuid\":\"1f1439f8-b81d-4418-ba36-060c76522f43\"}":{"__typename":"Favorites","uuid":"1f1439f8-b81d-4418-ba36-060c76522f43","photoUrl":"https://ucarecdn.com/94dc2a0e-a86f-42ca-9dbe-2c4279b435e3/","title":"Arsenal","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"3bff4911-b253-4d5b-b56f-d4d41c46805d\"}":{"__typename":"Favorites","uuid":"3bff4911-b253-4d5b-b56f-d4d41c46805d","photoUrl":"https://ucarecdn.com/f015ec41-5252-4799-86a7-f8aa5b9d13a8/","title":"Shawshank Redeption","type":"MOVIE"},"CausesSupported:{\"uuid\":\"db300033-f3e9-4c8b-a8bf-7970b3105d6e\"}":{"__typename":"CausesSupported","uuid":"db300033-f3e9-4c8b-a8bf-7970b3105d6e","name":"Project Goal","description":"\u003cp\u003eI volunteer with a non-profit afterschool program for students to play soccer\u003c/p\u003e","photoUrl":"https://ucarecdn.com/46a15ec6-5a59-49b4-a2af-8a477c55499f/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0648adb9-6856-4d05-931a-306d81474894\"}":{"__typename":"DeepDives","uuid":"0648adb9-6856-4d05-931a-306d81474894","content":"\u003cp\u003eContinue to follow what your passionate about. Don't stray from your path because you see your peers going in a different direction.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d7262160-aaec-4e40-b6ae-b5df77b5ce8a\"}":{"__typename":"DeepDives","uuid":"d7262160-aaec-4e40-b6ae-b5df77b5ce8a","content":"\u003cp\u003eI choose my major because my best friend at college is also a Mechanical Engineer. I was torn between whether to choose Applied Math and Economics or Engineering, but he convinced me to stay on the engineering path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"ab476949-afd6-4654-b632-a58f3cbb2466\"}":{"__typename":"DeepDives","uuid":"ab476949-afd6-4654-b632-a58f3cbb2466","content":"\u003cp\u003eI'm super motivated by my parents, because of all that they have done to sacrifice for me. I want to make sure they I am making the most of the resources that I'm lucky to have.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1ce01d1c-a701-4da2-a7a7-97972f9ff5a2\"}":{"__typename":"DeepDives","uuid":"1ce01d1c-a701-4da2-a7a7-97972f9ff5a2","content":"\u003cp\u003eI think mentorship has played a big role in my life, and I want to pay forward the help that I've been given on my journey. Whether career advice or a listening ear, I think it's super important to be available to help younger people who may be trying to follow in the same path that I've been on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"5f41d4ea-47f9-4577-9143-b2b49b3baf15\"}":{"__typename":"School","uuid":"5f41d4ea-47f9-4577-9143-b2b49b3baf15","name":"Trinity SchooI","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10024"},"Education:{\"uuid\":\"30c6c950-21f0-4372-a16b-9c4eadd55e18\"}":{"__typename":"Education","uuid":"30c6c950-21f0-4372-a16b-9c4eadd55e18","school":{"__ref":"School:{\"uuid\":\"5f41d4ea-47f9-4577-9143-b2b49b3baf15\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"f0db1322-8db3-4cd5-9f0e-1c5fd512495e\"}":{"__typename":"Education","uuid":"f0db1322-8db3-4cd5-9f0e-1c5fd512495e","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering / Africana Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"6c151a4a-de14-428d-9b31-f84ec194e9e1\"}":{"__typename":"MentorPublicProfile","uuid":"6c151a4a-de14-428d-9b31-f84ec194e9e1","displayName":"Carter S.","slug":"carter-smith","biography":"\u003cp\u003eHi, I’m Carter. I’m a junior at Brown University studying Mechanical Engineering and I play on the men’s soccer team. A big part of who I am is being curious about how things work and always wanting to learn a little more than what’s required. Whether I’m in the classroom, on the field, or working on a personal project, I’m usually asking questions and trying to understand the bigger picture.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Brown, I’ve enjoyed diving into classes that challenge me to think critically and solve problems in new ways. I like projects where I can take an idea and slowly shape it into something real through trial, feedback, and iteration. I’m especially drawn to hands-on work and creative problem solving, where mistakes are part of the learning process and improvement comes from doing, not just reading or watching.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing a Division I athlete has shaped how I approach everything else in my life. Soccer has taught me discipline, teamwork, and how to stay focused when things get uncomfortable. Balancing practices, travel, and academics has pushed me to manage my time well and show up prepared, even on long days. I’ve also become really interested in how athletes use data, design, and technology to train smarter and stay healthy, and how those ideas can translate beyond sports.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school and soccer, I enjoy building things and experimenting with design just for fun. I like opening up CAD software and messing around with everyday objects to see how they might be improved or reimagined. There’s something satisfying about starting with a blank screen and slowly refining an idea until it makes sense. I don’t always know where these projects will lead, but I enjoy the process of exploration.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurious Cardinals feels like a community where that mindset fits naturally. I enjoy conversations with people who are thoughtful, open minded, and excited about learning, even when they are still figuring things out. I’m always eager to hear different perspectives, ask good questions, and challenge my own assumptions. For me, curiosity is about staying humble, staying engaged, and being excited about what I still have left to learn.\u003c/p\u003e","teachingVideoPlaybackId":"fwZgDlRQ3Dj1JwETAU1Y3UgYTIj01PxGfBR1Ge8RZ1b00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI think the thing that I have done that I am most proud of is being selected as a Caroline D. Bradley Scholar. CDB is a national merit scholarship that selects gifted youth across the country and provides full compensation for private high school. This scholarship changed the trajectory of my life, and I would love to talk to middle schoolers especially about the opportunity!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7547422c-4f68-4f24-a496-24f6c212b783\"}"},{"__ref":"Favorites:{\"uuid\":\"1f1439f8-b81d-4418-ba36-060c76522f43\"}"},{"__ref":"Favorites:{\"uuid\":\"3bff4911-b253-4d5b-b56f-d4d41c46805d\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"db300033-f3e9-4c8b-a8bf-7970b3105d6e\"}"}],"major":"Mechanical Engineering / Africana Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0648adb9-6856-4d05-931a-306d81474894\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7262160-aaec-4e40-b6ae-b5df77b5ce8a\"}"},{"__ref":"DeepDives:{\"uuid\":\"ab476949-afd6-4654-b632-a58f3cbb2466\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ce01d1c-a701-4da2-a7a7-97972f9ff5a2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fbb77265-664b-4033-9bf5-c936bd55deee/-/preview/-/format/jpg/","https://ucarecdn.com/b397c5f9-abc8-474b-a4c3-138c203995b3/-/preview/-/format/jpg/","https://ucarecdn.com/8861ca57-0203-4f2c-b9e8-92b958559124/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"30c6c950-21f0-4372-a16b-9c4eadd55e18\"}"},{"__ref":"Education:{\"uuid\":\"f0db1322-8db3-4cd5-9f0e-1c5fd512495e\"}"}],"hiredAt":"2025-12-21T16:55:37.302Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Spanish","Executive Function","College Essay Writing","Robotics / Electronics / CAD","Aviation / Aerospace"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"
