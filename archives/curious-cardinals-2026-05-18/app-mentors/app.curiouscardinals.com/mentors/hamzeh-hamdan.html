xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"ed2a232a-ef61-4e8f-8f5b-bcfaa05bbf11\"}":{"__typename":"CausesSupported","uuid":"ed2a232a-ef61-4e8f-8f5b-bcfaa05bbf11","name":"Greater Chicago Food Depository","description":"","photoUrl":"https://ucarecdn.com/7d937721-8456-462e-b755-59b62d4ec75c/"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"e1308b90-0b18-4d33-8475-8427b030ac9e\"}":{"__typename":"DeepDives","uuid":"e1308b90-0b18-4d33-8475-8427b030ac9e","content":"\u003cp\u003eDuring my freshman year of college, I met up with a friend of a friend in my math class. He logs onto a website I'd never seen before, enters a password that takes him past a paywall, and shows me this new chatbot that could answer whatever question asked to it. I was immediately fascinated by the technology I was watching. Being 19 years old, we all geeked out and hypothesized what would happen if this technology ended up in the wrong hands: from all the poor grandmothers who would fall for more advanced phishing scams to Twitter breaking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis fascination started one year before ChatGPT was released to the public. I started taking computer science and statistics courses, trying to better understand how the models were created. As the models got better, I started implementing it in my life, and showing others how to do so, and that's the part I've enjoyed the most.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLike most tech, AI can easily be overcomplicated and difficult to understand. I've enjoyed helping simplify it, and bringing real value to those I mentor!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"d4f28c11-517c-47c1-86a0-c0fdb4957425\"}":{"__typename":"School","uuid":"d4f28c11-517c-47c1-86a0-c0fdb4957425","name":"Coronado High School","city":"El Paso","type":"HIGH","state":"Texas","country":"United States","zip":"79912"},"Education:{\"uuid\":\"39ea9575-8bd3-441f-ac57-0748208c6b67\"}":{"__typename":"Education","uuid":"39ea9575-8bd3-441f-ac57-0748208c6b67","school":{"__ref":"School:{\"uuid\":\"d4f28c11-517c-47c1-86a0-c0fdb4957425\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"7e1ba1c9-719c-41f4-a331-7906ade22158\"}":{"__typename":"Education","uuid":"7e1ba1c9-719c-41f4-a331-7906ade22158","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Statistics and Computer Science","degree":null},"Testimonial:5a30aee6-a5bb-4c36-a540-4f67f60228fc":{"__typename":"Testimonial","id":"5a30aee6-a5bb-4c36-a540-4f67f60228fc","text":"C will be starting at his fourth new school in 3 years this fall. Through it all, Hamzeh has been a grounding force; a familiar friendly face. Always cheerful, Hamzeh gently encourages C to be curious and optimistic through their builds together.","date":"2025-06-02 04:58:20.805+00","rating":5,"endorser":{"__typename":"Endorser","name":"Judith","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"c88ed456-55d7-4852-918e-789dd381ffa0\"}":{"__typename":"MentorPublicProfile","uuid":"c88ed456-55d7-4852-918e-789dd381ffa0","displayName":"Hamzeh H.","slug":"hamzeh-hamdan","biography":"\u003cp\u003eHi! I'm Hamzeh, a \u003cstrong\u003eSoftware Engineer at Cresset Capital\u003c/strong\u003e in Chicago, where I build AI infrastructure used across the firm: governance systems that monitor model outputs, analytics dashboards tracking AI adoption, and internal tools that let teams use LLMs in their day-to-day workflows. I recently \u003cstrong\u003egraduated with honors from Harvard\u003c/strong\u003e, where I studied Computer Science and Statistics with a minor in Math, and wrote my senior thesis on economic spillovers between the U.S. and Chinese stock markets.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor the past \u003cstrong\u003etwo years through Curious Cardinals\u003c/strong\u003e, I've worked with \u003cstrong\u003eexecutives, parents, and families\u003c/strong\u003e on how to actually integrate AI into their lives. Sessions range from \"what even is ChatGPT and how do I talk to it\" to building custom Claude Projects, designing automated workflows, scoping full software builds, and thinking through which AI tool fits which problem. I enjoy meeting people wherever they're starting from, whether that's complete beginner or someone who's been experimenting on their own and wants to go deeper.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eThings I love teaching:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAI literacy and fluency\u003c/strong\u003e: how these tools actually work, how to talk to them so you get useful answers back, the real differences between Claude, ChatGPT, and Perplexity, and how to pick the right one for the job.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eIncorporating AI into your daily life\u003c/strong\u003e: figuring out where AI can genuinely save you time and where it can't, then setting up the right tools and habits to make it stick.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eA few things I've built with people I've worked with:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eA \u003cstrong\u003e\"voice GPT\"\u003c/strong\u003e trained on someone's writing style so they could draft email and text replies that actually sound like them\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCustom \u003cstrong\u003eClaude skills for email triage and management\u003c/strong\u003e, surfacing what needs a reply, what's waiting on someone else, and what can be archived\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eA \u003cstrong\u003edashboard for monitoring art auctions\u003c/strong\u003e across multiple houses\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDaily news summarizers\u003c/strong\u003e tailored to specific industries and reading preferences, written at a higher academic level with a bias detection section\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eEvery person I work with ends up with something different, because the right AI setup depends entirely on what your days actually look like. If you have something in mind that's adjacent to any of this, or you're not sure yet and want to explore, message me and we'll figure out whether I'm the right match.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ed2a232a-ef61-4e8f-8f5b-bcfaa05bbf11\"}"}],"major":"Statistics and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e1308b90-0b18-4d33-8475-8427b030ac9e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d308f691-23c5-42cf-bb80-b83667625a15/-/preview/-/format/jpg/","https://ucarecdn.com/0a9f2f10-ecfb-49ce-b9ab-ebc459c3fba4/-/preview/-/format/jpg/","https://ucarecdn.com/40b4e9ff-24c5-485e-bde8-a9736570a8e1/-/preview/-/
