xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b174f5fb-413c-4a25-91b4-2d082c9969ce\"}":{"__typename":"DeepDives","uuid":"b174f5fb-413c-4a25-91b4-2d082c9969ce","content":"\u003col\u003e\u003cli\u003e\u003cp\u003eHere are some advice I would give to myself. \u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eEmbrace Exploration\u003c/strong\u003e: This phase of your life is unlike any other. The world is vast, and there's so much to discover. Dive into diverse subjects, hobbies, and activities. Join that club, pick up that instrument, or venture into that sport. You don't have to be perfect at it; the joy lies in the journey of discovery.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eValue Failure\u003c/strong\u003e: I know this might sound strange, but cherish every stumble and fall. Every mistake you make now is a step closer to your goals. Failures aren't the opposite of success; they're part of it. Each time you fail, you learn, grow, and become better prepared for the challenges of the future.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDiverse Experiences Lead to Insight\u003c/strong\u003e: By trying various activities and immersing yourself in different environments, you'll develop a broader perspective. This depth and breadth of experience will shape your worldview, help you discover your true passions, and guide your future decisions.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStay Curious\u003c/strong\u003e: That innate curiosity you have? Nurture it. Ask questions, seek answers, and keep that wonder alive. It will lead you to opportunities and pathways you might never have imagined.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDon’t Fear Judgment\u003c/strong\u003e: At times, you might be hesitant to step out of your comfort zone for fear of what others might think. Remember, everyone is too engrossed in their own journey to focus on yours for long. Those who matter will support you, and those who don't, well, they don't matter.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTime is on Your Side\u003c/strong\u003e: Right now, you have the greatest gift: time. Time to experiment, time to change paths, and time to retry. Later in life, responsibilities might tie you down, so make the most of these free years.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef\"}":{"__typename":"School","uuid":"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90089"},"Education:{\"uuid\":\"f623c77c-2771-41c1-9f7a-058dac1dc706\"}":{"__typename":"Education","uuid":"f623c77c-2771-41c1-9f7a-058dac1dc706","school":{"__ref":"School:{\"uuid\":\"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Business Administration","degree":"Bachelor's Degree"},"School:{\"uuid\":\"f9fad1e5-3c8f-4fdf-a802-a3f9a6d8e60d\"}":{"__typename":"School","uuid":"f9fad1e5-3c8f-4fdf-a802-a3f9a6d8e60d","name":"Folsom High School‎","city":"Folsom","type":"HIGH","state":"California","country":"United States","zip":"95630"},"Education:{\"uuid\":\"44a5167b-9b7b-47a3-a90f-1d03d2e421ab\"}":{"__typename":"Education","uuid":"44a5167b-9b7b-47a3-a90f-1d03d2e421ab","school":{"__ref":"School:{\"uuid\":\"f9fad1e5-3c8f-4fdf-a802-a3f9a6d8e60d\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"0e314eb6-c0b2-47b8-82ea-c66a60b7060f\"}":{"__typename":"MentorPublicProfile","uuid":"0e314eb6-c0b2-47b8-82ea-c66a60b7060f","displayName":"Takuto K.","slug":"takuto-kakeda","biography":"\u003cp\u003eHello! My name is Takuto Kakeda, and I'm currently a Business Administration major at the USC's Marshall School of Business. I'm currently double minoring in AI application and product design, showcasing my interests in the intersection of tech and business. \u003c/p\u003e\u003cp\u003e\u003cbr\u003eI have a background in startups and have a passion to build something from an idea to an end user. Some of my project have included an NPO that helps international students develop their conversational English over live calls, an AI tool that enables 24/7/365 automated order-taking for businesses through POS intercoms, and others. \u003cbr\u003e\u003cbr\u003eFrom those experiences, I have taken a huge interest in ed-tech startups and products at different companies while consulting others and building my own products around that area. \u003cbr\u003e\u003cbr\u003eIn addition, I have some private equity and venture capital experience and can also help on the finance side. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn a personal note, I'm fluently bilingual, speaking and writing in both English and Japanese. My passions outside of work and academics include exploring cultures, beatboxing, traveling, and volunteering. I've always been intrinsically motivated to learn and grow, and I firmly believe that every experience, whether in the classroom or the real world, is an opportunity for personal and professional development. \u003c/p\u003e","teachingVideoPlaybackId":"8UIrQRBADeJeOhCwMc2tnJ201xqfxL3qOzIqpzk02O7lg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my most cherished accomplishments is founding and building FEMO from the ground up. FEMO is a NPO that helps international students practice their conversational Englihs through live calls. \u003cbr\u003e\u003cbr\u003eWhen I embarked on the FEMO journey, I had a vision but was stepping into uncharted waters. The process of transforming that initial idea into a full-fledged organization was both daunting and exhilarating.\u003c/p\u003e\u003cp\u003eEvery aspect of establishing FEMO, from assembling a passionate team and setting our mission and values, to the countless hours strategizing our growth, offered a rich learning experience. Overcoming hurdles, adapting to unforeseen challenges, and witnessing the tangible impact of our efforts strengthened my resolve and deepened my understanding of organizational dynamics.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eHowever, the most rewarding aspect of FEMO was not just its successful establishment, but the myriad of skills, insights, and experiences it afforded me. It was this rigorous groundwork at FEMO that seamlessly paved my way into the startup ecosystem. The transition felt natural; I was taking forward all the lessons from building an organization and applying them to an entrepreneurial setting.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eStarting with FEMO and then transitioning to startups, I learned the importance of adaptability, resilience, and a growth mindset. Every setback, every win, and every pivot point were instrumental in shaping my entrepreneurial acumen. Today, as I reflect upon my journey, I feel immense pride not only in the milestones achieved but also in the transformative journey of growth and learning that FEMO initiated for me.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b174f5fb-413c-4a25-91b4-2d082c9969ce\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9e27ba10-5bd8-4c5b-b10d-51c197107ca6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f623c77c-2771-41c1-9f7a-058dac1dc706\"}"},{"__ref":"Education:{\"uuid\":\"44a5167b-9b7b-47a3-a90f-1d03d2e421ab\"}"}],"hiredAt":"2023-09-26T14:58:21.824Z","topics":["Business / Entrepreneurship","Coding / Programming","Web Design"],"communityBadges":["https://ucarecdn.com/7f8f1ed3-79b5-41c5-b8fd-a444de85708b/","https://ucarecdn.com/b98f175c-f982-4497-bb8d-4a9c11113cd8/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"takuto-kakeda\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0e314eb6-c0b2-47b8-82ea-c66a60b7060f\"}"}}},"_sentryTraceData":"7364b6fa70ce493cbb11312ae8a6d190-9be672c4f9685509-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7364b6fa70ce493cbb11312ae8a6d190,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"takuto-kakeda"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
