xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e73b7d35-a3eb-4b2c-9fee-3c6f9fc985d9\"}":{"__typename":"Favorites","uuid":"e73b7d35-a3eb-4b2c-9fee-3c6f9fc985d9","photoUrl":"https://ucarecdn.com/c6583520-ef21-42fb-9173-fdb3415dab36/","title":"Goodfellas","type":"MOVIE"},"Favorites:{\"uuid\":\"93cd2b4a-bf93-4e6d-9bc3-6ef25b265b64\"}":{"__typename":"Favorites","uuid":"93cd2b4a-bf93-4e6d-9bc3-6ef25b265b64","photoUrl":"https://ucarecdn.com/728e410d-c3d6-487f-bac0-fae2460d0594/","title":"Demon Copperhead by Barbara Kingsolver","type":"BOOK"},"Favorites:{\"uuid\":\"6f4e91e6-30ce-4ac5-a7f8-8c30bb32248f\"}":{"__typename":"Favorites","uuid":"6f4e91e6-30ce-4ac5-a7f8-8c30bb32248f","photoUrl":"https://ucarecdn.com/728e410d-c3d6-487f-bac0-fae2460d0594/","title":"Wide Open Spaces by the Dixie Chicks","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"039eef19-163c-4545-819f-67f90b5efad7\"}":{"__typename":"DeepDives","uuid":"039eef19-163c-4545-819f-67f90b5efad7","content":"\u003cp\u003eDon't stress about what's beyond your control! Focus on doing your best and working your hardest and everything will work out exactly the way it's supposed to.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"980231ec-2fe3-4692-9862-12f90d96add0\"}":{"__typename":"DeepDives","uuid":"980231ec-2fe3-4692-9862-12f90d96add0","content":"\u003cp\u003eI would not be where I am today without the help of so many others. I feel passionate about paying all the motivation and inspiration that I've received from others forward. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e0b1b710-5863-4ab3-bd2a-24d9e40f1b25\"}":{"__typename":"DeepDives","uuid":"e0b1b710-5863-4ab3-bd2a-24d9e40f1b25","content":"\u003cp\u003eDefinitely a dolphin trainer. I think this would be the most fun way to spend my days ever! Who knows...there's still time for me to change paths!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e5a82176-e941-4f27-94b9-30e9170b48f9\"}":{"__typename":"DeepDives","uuid":"e5a82176-e941-4f27-94b9-30e9170b48f9","content":"\u003cp\u003eI looooove to be outside whether that means walking, running, hiking or just hanging out. I also am an online shopping addict. I love to scroll through Etsy or discover new brands and designers!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"da0da760-7466-4238-a579-67037f4ffe1b\"}":{"__typename":"School","uuid":"da0da760-7466-4238-a579-67037f4ffe1b","name":"Pelham Memorial High School","city":"Village of Pelham","type":"HIGH","state":"New York","country":"United States","zip":"10803"},"Education:{\"uuid\":\"6b93950b-e2e4-401c-8157-892e3aa33566\"}":{"__typename":"Education","uuid":"6b93950b-e2e4-401c-8157-892e3aa33566","school":{"__ref":"School:{\"uuid\":\"da0da760-7466-4238-a579-67037f4ffe1b\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"79c1d7a9-6635-4768-bc40-53783aa43fd6\"}":{"__typename":"Education","uuid":"79c1d7a9-6635-4768-bc40-53783aa43fd6","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Public Policy Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"27237675-20d2-4080-9c10-98735c8d8a65\"}":{"__typename":"MentorPublicProfile","uuid":"27237675-20d2-4080-9c10-98735c8d8a65","displayName":"Charlotte  E.","slug":"charlotte-edmunds","biography":"\u003cp\u003eHi! My name is Charlotte. I recently graduated from Vanderbilt University in Nashville where I loved hanging out with my friends, going on long runs, and listening to country music! I now work in NYC as a women's accessories buyer for Bloomingdale's.\u003cbr\u003e\u003cbr\u003eAt my core I am a lover of learning and life. The classroom is my happy place, and that's why I am here--to help you make it yours as well! I am obsessed with trying new things, whether that be skydiving, horseback riding (I worked at a ranch in Wyoming this summer), ceramics, or knitting. I am constantly trying to expand my repertoire of skills and knowledge and promise that I will be quick to pick up on whatever it is that you're passionate about and want to work on together!\u003cbr\u003e\u003cbr\u003eI am a big reader and am well-equipped to take on any literacy, grammar, or writing related challenges. I am also a skilled public speaker, and have in-depth experience learning about/working in public policy, journalism, media, and fashion. Most importantly, however, I pride myself on being a great listener. I was lucky enough to have role models take the time to listen to what I had to say. Now it's my turn to be that mentor for you!\u003cbr\u003e\u003cbr\u003eI cannot wait to meet one another and learn together!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy senior year of college I wrote a thesis on Airbnbs and their effects on the housing market and culture of Nashville. It ended up being 120 pages and landed me high honors! Even though it was the hardest thing I've ever done, it is also my greatest accomplishment. It reminded me how capable I am when I put my mind to something.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e73b7d35-a3eb-4b2c-9fee-3c6f9fc985d9\"}"},{"__ref":"Favorites:{\"uuid\":\"93cd2b4a-bf93-4e6d-9bc3-6ef25b265b64\"}"},{"__ref":"Favorites:{\"uuid\":\"6f4e91e6-30ce-4ac5-a7f8-8c30bb32248f\"}"}],"causesSupported":[],"major":"Public Policy Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"039eef19-163c-4545-819f-67f90b5efad7\"}"},{"__ref":"DeepDives:{\"uuid\":\"980231ec-2fe3-4692-9862-12f90d96add0\"}"},{"__ref":"DeepDives:{\"uuid\":\"e0b1b710-5863-4ab3-bd2a-24d9e40f1b25\"}"},{"__ref":"DeepDives:{\"uuid\":\"e5a82176-e941-4f27-94b9-30e9170b48f9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9c721eca-f4a7-45fc-ab21-df231f8b2362/-/preview/-/format/jpg/","https://ucarecdn.com/ba96bc8e-46db-48d4-a590-bde4dc031916/-/preview/-/format/jpg/","https://ucarecdn.com/490a6e05-0794-4d61-9000-94f3a095765b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6b93950b-e2e4-401c-8157-892e3aa33566\"}"},{"__ref":"Education:{\"uuid\":\"79c1d7a9-6635-4768-bc40-53783aa43fd6\"}"}],"hiredAt":"2023-12-05T23:48:10.716Z","topics":["Literature","History Project","Fashion / Cosmetics","Business / Entrepreneurship","Journali
