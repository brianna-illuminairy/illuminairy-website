xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"876ee980-0109-4baa-be72-b3cee3c0cc65\"}":{"__typename":"DeepDives","uuid":"876ee980-0109-4baa-be72-b3cee3c0cc65","content":"\u003cp\u003ePhysician\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8875e23e-54b3-4233-ac1f-f0f9730482b1\"}":{"__typename":"DeepDives","uuid":"8875e23e-54b3-4233-ac1f-f0f9730482b1","content":"\u003cp\u003eIn high school, I spent one of my summers at the University of Chicago in the Mathematical and Computational Research in Biological Sciences (MAC-RIBS) program. There, I was introduced to computational approaches for analyzing biological data, including projects using supercomputers to study the human genome and identify potentially pathological variants. That experience sparked my initial interest in genomics, showing me how mathematics, computer science, and biology could intersect to answer complex questions about human health. It was one of the first times I saw how big data could be applied to medicine, and it set me on the path toward my later research in neuroscience and genomic medicine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"fb148cce-a5e6-412c-bdb1-f20f2c75219a\"}":{"__typename":"DeepDives","uuid":"fb148cce-a5e6-412c-bdb1-f20f2c75219a","content":"\u003cp\u003eRun, hike, swim in the Gulf of Mexico (when I'm at home), and recently play pickleball!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8d441a8a-6ed4-4b04-b34a-2e4e662c5cc1\"}":{"__typename":"DeepDives","uuid":"8d441a8a-6ed4-4b04-b34a-2e4e662c5cc1","content":"\u003chr\u003e\u003cp\u003eI would tell my middle and high school self that you are on your own path—there’s no single “right” way to get where you’re going. Lean into your unique interests, even if they feel different from what others around you are doing, and don’t be afraid to take the road less traveled. Following your passions will open doors you never imagined, and you’ll never regret choosing authenticity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2499e853-a83d-4c54-8ccb-b67fd10910d0\"}":{"__typename":"School","uuid":"2499e853-a83d-4c54-8ccb-b67fd10910d0","name":"Community School of Naples","city":"Naples","type":"HIGH","state":"Florida","country":"United States","zip":"34109"},"Education:{\"uuid\":\"17b4aa52-98c4-4817-8b88-9f289d7c63bd\"}":{"__typename":"Education","uuid":"17b4aa52-98c4-4817-8b88-9f289d7c63bd","school":{"__ref":"School:{\"uuid\":\"2499e853-a83d-4c54-8ccb-b67fd10910d0\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"6a81370a-ecb8-4215-80cd-502446ad52b4\"}":{"__typename":"Education","uuid":"6a81370a-ecb8-4215-80cd-502446ad52b4","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"fd7848fc-f053-44e3-b872-b962810fb404\"}":{"__typename":"MentorPublicProfile","uuid":"fd7848fc-f053-44e3-b872-b962810fb404","displayName":"Lauren G.","slug":"lauren-guerra","biography":"\u003cp\u003eHi! My name is Lauren Guerra, and I recently graduated from Northwestern University with a degree in Neuroscience. Over the past few years, I’ve conducted research at the National Institutes of Health on multiple sclerosis, where I studied why some patients develop more aggressive forms of the disease and explored new ways to track inflammation in the brain. This experience shaped my passion for translational medicine and confirmed my desire to pursue a career that blends research with patient care. I am currently studying at the University of Cambridge to pursue a master’s degree in Genomic Medicine through Northwestern’s Findlay Fellowship. Following this program, I will matriculate to medical school in the United States, having been accepted to several programs, including Northwestern University’s Feinberg School of Medicine.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond the lab, I am committed to supporting refugee and immigrant communities. As a campus leader with an organization in Chicago that serves refugee families, I coordinated student volunteers and provided academic mentorship to refugee youth navigating new schools and cultural environments. I also traveled to the U.S.–Mexico border with Northwestern to learn more about the challenges asylum seekers face in accessing healthcare and education. These experiences deepened my understanding of global health inequities and inspired me to design health literacy workshops that help refugee families better navigate the medical system, ask questions with confidence, and feel empowered in their care.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEqually important to me is mentorship. At Northwestern, I served as a peer tutor and Teaching Assistant in neuroscience and chemistry, roles that gave me the chance to guide students through challenging material, build their confidence, and celebrate their progress. I also co-founded the Pre-Surgical Society, a student organization dedicated to bridging the opportunity gap in medicine by connecting undergraduates with surgeon mentors at Northwestern’s Feinberg School of Medicine. Through this work, I helped create a barrier-free space for students to explore medical careers and gain mentorship that might not otherwise have been accessible. Mentorship has been a throughline in my journey—I’ve benefited enormously from the guidance of my own mentors, and I find it deeply meaningful to pay that forward by supporting others, both academically and personally.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I’m an avid runner. I’ve completed many half-marathons and find that running helps me recharge, set long-term goals, and connect with others who share the same love for the outdoors. I hope to run a full marathon soon. I’m excited to bring my enthusiasm for learning, mentoring, and discovery to Curious Cardinals and to support students in reaching their goals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"nXLCWQALRSFn02UtI9aMnFej02hsKDoTsxiJ6XDqtKDQc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"876ee980-0109-4baa-be72-b3cee3c0cc65\"}"},{"__ref":"DeepDives:{\"uuid\":\"8875e23e-54b3-4233-ac1f-f0f9730482b1\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb148cce-a5e6-412c-bdb1-f20f2c75219a\"}"},{"__ref":"DeepDives:{\"uuid\":\"8d441a8a-6ed4-4b04-b34a-2e4e662c5cc1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/904462b3-7f83-4be1-a1f5-76944c2b7084/-/preview/-/format/jpg/","https://ucarecdn.com/97dd71cf-1768-4e83-8ce0-ece36f64f87e/-/preview/-/format/jpg/","https://ucarecdn.com/9835bbba-cea7-42e1-a108-315bfdf9a1b8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"17b4aa52-98c4-4817-8b88-9f289d7c63bd\"}"},{"__ref":"Education:{\"uuid\":\"6a81370a-ecb8-4215-80cd-502446ad52b4\"}"}],"hiredAt":"2025-09-16T02:56:15.587Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Chemistry","Biology","Physics","6-8 Grade Science","Academic Coaching","Executive Function","College Essay Writing","Reading","Creative Writing","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lauren-guerra\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fd7848fc-f053-44e3-b872-b962810fb404\"}"}}},"_sentryTraceData":"bd036bc6875c402bb991bb46a3233214-a03a5f63ef4999ef-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=bd036bc6875c402bb991bb46a3233214,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"lauren-guerra"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInn
