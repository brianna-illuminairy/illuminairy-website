 of Southern California, I have learned skills in everything from writing and producing a TV show, starting a business from the ground up, speaking in front of thousands, and so much more. I'm ready and excited to take all the awesome resources and experiences I've gained and spread them to as many as possible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAll my life, I've been the beneficiary of caring mentors, dedicated teachers, and incredible support systems. In the same breath, I know that not everyone is fortunate enough to have all those awesome things. No matter where you come from, everyone should have at least one person to uplift them unconditionally and maybe teach them a thing or two along the way. I hope I can be that person for anyone who needs it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut a little bit more about me! I think there are three things you should know that are integral to my being and can explain all the rest about me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e1. I LOVE the outdoors. If I could sleep in a hammock and cook over a fire outside my nice apartment building every night, I would. I guess I could, but I think my parents would have something to say about that. I wear Chacos everyday (if you know, you know), I'm vegan, and I have spent the past 12 summers at summer camp, both being a camper and working there.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e2. Rubik's Cubes make up a large part of my life. I can solve one is ten seconds and started the Rubik's Cube club at USC, CubeSC! I absolutely love puzzles and problem solving.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e3. I am a self-proclaimed jack-of-all-trades. Now, I would never claim to be particularly amazing at all those things, but I have to be busy with some new skill, subject matter, or adventure. It is what has allowed me to be a tour guide at USC, taken me to Ukraine twice, helped me build multiple startups, and so much more.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSO, all of this said, I'm so excited to get to work with you and help you achieve whatever goals you may have. Not only will we improve in whatever area you are looking for, but do it in a way that feels good for you and definitely isn't boring!\u003c/p\u003e","teachingVideoPlaybackId":"YpoV2J2eEFtpjTCKMdanoD1CQUCqWRTbQ83noUmMGQ00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c2240531-ed6f-4034-a0e4-a39dd82eb224\"}"},{"__ref":"Favorites:{\"uuid\":\"b18da4cc-850d-46ce-8185-546e8d03b9e7\"}"},{"__ref":"Favorites:{\"uuid\":\"5837b61a-5caa-4621-83d3-5ea0edcb7c4b\"}"}],"causesSupported":[],"major":"Journalism and Social Entrepreneurship","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"150008b4-8856-4182-aab2-48220a679f2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"d3fe8632-0aea-4663-9ca2-f929a759be8f\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1a4c9bc-c75a-4a3f-8679-18015b006ec6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/68122383-e792-48a2-83ff-92258fce8d5a/-/preview/-/format/jpg/","https://ucarecdn.com/dbbcb054-528b-444a-9a6b-2ebe5b5bf001/-/preview/-/format/jpg/","https://ucarecdn.com/e73ee4ab-c246-4926-ab4c-e1bb9a1aa99c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"484beecd-f573-46ca-9b96-20ea75683eba\"}"},{"__ref":"Education:{\"uuid\":\"f453725a-5e09-4d97-b08f-e8d88db8fd86\"}"}],"hiredAt":"2024-10-29T11:02:05.890Z","topics":["Business / Entrepreneurship","Video / Photography","Writing","French","Creative Writing","Sports Journalism","Public Speaking","Finance / Investing"],"communityBadges":["https://ucarecdn.com/b98f175c-f982-4497-bb8d-4a9c11113cd8/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jack-waterman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"436b7bc9-cf3c-4bef-8b83-a5b501a40fe5\"}"}}},"_sentryTraceData":"6c002360749a49f5936605f84125
