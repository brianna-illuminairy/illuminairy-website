xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"89d6bef3-7913-450f-8263-647ab525d4e2\"}":{"__typename":"Favorites","uuid":"89d6bef3-7913-450f-8263-647ab525d4e2","photoUrl":"https://ucarecdn.com/fac673a8-a52b-467c-a0a3-b66292a00974/","title":"Stick Season - Noah Kahan","type":"ALBUM"},"Favorites:{\"uuid\":\"be5831ff-f97f-4853-8ff1-586efea96144\"}":{"__typename":"Favorites","uuid":"be5831ff-f97f-4853-8ff1-586efea96144","photoUrl":"https://ucarecdn.com/6c6db59a-6c8e-461c-8cc0-562953ec9f8d/","title":"Payton Pritchard","type":"ATHLETE"},"Favorites:{\"uuid\":\"b0533f3a-9902-4842-a0aa-ef0f72d65160\"}":{"__typename":"Favorites","uuid":"b0533f3a-9902-4842-a0aa-ef0f72d65160","photoUrl":"https://ucarecdn.com/01bfab55-3851-4bbe-ac42-ecea9d05943f/","title":"New England Patriots","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f10bfb4b-3a54-464a-8849-eb287bd472a4\"}":{"__typename":"DeepDives","uuid":"f10bfb4b-3a54-464a-8849-eb287bd472a4","content":"\u003cp\u003eWhen I'm not studying or training, I enjoy watching and playing all types of sports (lacrosse, football, basketball, etc). As an avid fantasy football manager, NFL is my favorite. I also enjoy creating graphic designs/videos for fun!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"cbedacb0-94c4-4d91-ae33-8d07e976848d\"}":{"__typename":"DeepDives","uuid":"cbedacb0-94c4-4d91-ae33-8d07e976848d","content":"\u003cp\u003eTwo years ago, I worked on a downloadable application to connect tutors within my high school district to students in need of academic assistance. The fully functional app was available in the Apple App Store and had over 100 downloads before I graduated!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"bdd04a5f-6788-4c25-903e-62a974f57ddd\"}":{"__typename":"DeepDives","uuid":"bdd04a5f-6788-4c25-903e-62a974f57ddd","content":"\u003cp\u003eMy dream job would be working with a group of friends as a software engineer within a startup! Hopefully, one of us in the future will create a world-changing idea that will produce lasting impact!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"6e5209eb-68b2-4031-9856-185d30805a7e\"}":{"__typename":"School","uuid":"6e5209eb-68b2-4031-9856-185d30805a7e","name":"Pilgrim High School","city":"Warwick","type":"HIGH","state":"Rhode Island","country":"United States","zip":"02888"},"Education:{\"uuid\":\"a11673f0-e75e-4c71-a2d5-41861e356c1d\"}":{"__typename":"Education","uuid":"a11673f0-e75e-4c71-a2d5-41861e356c1d","school":{"__ref":"School:{\"uuid\":\"6e5209eb-68b2-4031-9856-185d30805a7e\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"feae3738-8782-4604-ba1d-996792a57184\"}":{"__typename":"Education","uuid":"feae3738-8782-4604-ba1d-996792a57184","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science - Applied Math - Econ","degree":null},"MentorPublicProfile:{\"uuid\":\"1e5e981b-ce32-4073-b076-8baa7c6279d3\"}":{"__typename":"MentorPublicProfile","uuid":"1e5e981b-ce32-4073-b076-8baa7c6279d3","displayName":"Griffin T.","slug":"griffin-taylor","biography":"\u003cp\u003eAt Brown, I continue to take CS courses related to programming, specifically software engineering. With an interest in both Economics and Mathematics, I hope to pair the two with CS in a dual concentration offered by Brown. This year, I will continue to work with Tedx@Brown as a tech and web associate, gearing up for our fifteenth annual presentation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I am a student-athlete playing for the Men’s Squash team, and am partnered with the Boomer Esiason Foundation as a BEF college athlete. As a BEF endorsed representative, I spread awareness for student athletes living and excelling with Cystic Fibrosis. Also, being from New England, I am (by default) a diehard Boston fan, and you can always catch me watching the puck drop for the Bruins, or the 4th quarter of a Patriots game!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlthough it’s my first time tutoring with Curious Cardinals, I have been a tutor for over four years through my own program, The Salty Scholar. As part of the service, I designed my own website and have used programs such as Google Meet and Zoom to meet with students affected by long absences in hospitals due to Cystic Fibrosis complications. Through the years, I have tutored students on a weekly basis from around the country, and I continue to give back to the community. Recently, I fundraised over $3,000 and ran the NYC Half Marathon in support of Cystic Fibrosis.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOverall, I’m excited to work with students who share the same passion for math and technology as I do. Please feel free to reach out with any questions or concerns, and I look forward to meeting you!\u003c/p\u003e","teachingVideoPlaybackId":"q7trx3tjQpyCs00500BN29ZW4Ws4wvUvRzHWv7sZgZLZk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"89d6bef3-7913-450f-8263-647ab525d4e2\"}"},{"__ref":"Favorites:{\"uuid\":\"be5831ff-f97f-4853-8ff1-586efea96144\"}"},{"__ref":"Favorites:{\"uuid\":\"b0533f3a-9902-4842-a0aa-ef0f72d65160\"}"}],"causesSupported":[],"major":"Computer Science - Applied Math - Econ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f10bfb4b-3a54-464a-8849-eb287bd472a4\"}"},{"__ref":"DeepDives:{\"uuid\":\"cbedacb0-94c4-4d91-ae33-8d07e976848d\"}"},{"__ref":"DeepDives:{\"uuid\":\"bdd04a5f-6788-4c25-903e-62a974f57ddd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/585175f6-bbdb-48b2-8e5f-ce178690da1b/-/preview/-/format/jpg/","https://ucarecdn.com/1a28969d-510d-450c-9611-b9433807c84c/-/preview/-/format/jpg/","https://ucarecdn.com/7ed8143d-2ef4-4193-be16-6a15891b52cf/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a11673f0-e75e-4c71-a2d5-41861e356c1d\"}"},{"__ref":"Education:{\"uuid\":\"feae3738-8782-4604-ba1d-996792a57184\"}"}],"hiredAt":"2024-08-26T23:51:24.957Z","topics":["Coding / Programming","Sports Analytics","Web Design","Game Design","Product Design","Statistics","Calculus","Algebra I","Algebra II","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Computer Science"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"
