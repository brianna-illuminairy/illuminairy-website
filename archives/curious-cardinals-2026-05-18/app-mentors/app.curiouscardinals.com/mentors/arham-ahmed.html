xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ec9dbfa7-a4f4-4259-a27a-7c7a94d28736\"}":{"__typename":"DeepDives","uuid":"ec9dbfa7-a4f4-4259-a27a-7c7a94d28736","content":"\u003cp\u003eFollow your curiosity, even when it leads you somewhere no one around you fully understands.\u003c/p\u003e\u003cp\u003eThere will be moments when your interests feel too big, too abstract, or too impractical for the world you currently occupy. You will wonder why you care so deeply about geopolitics, about refugees, about the invisible structures that govern human lives. Let yourself care anyway. That restlessness is not a distraction. It is your compass.\u003c/p\u003e\u003cp\u003eSay yes to the experiences that scare you a little. Cross the ocean. Ask the uncomfortable question in class. Start the nonprofit. Walk into the factory, the protest, the unfamiliar city. The world will teach you things that no syllabus ever could, but only if you are willing to show up for it.\u003c/p\u003e\u003cp\u003eYou do not need to have all the answers yet. You just need to stay curious, stay hungry, and trust that every thread you pull will eventually lead somewhere worth going.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"4d3a524a-cff5-4379-a175-2c447a955ab3\"}":{"__typename":"DeepDives","uuid":"4d3a524a-cff5-4379-a175-2c447a955ab3","content":"\u003cp\u003eGrowing up with Bangladeshi roots instilled in me a deep respect for the power of education. In South Asian culture, learning is not merely a personal pursuit — it is a communal investment, something families and communities pour themselves into collectively. That ethos shaped how I see my role as a mentor: not as someone standing above a student, but as someone genuinely invested in their growth, the way a community invests in one of its own.\u003c/p\u003e\u003cp\u003eLiving and working abroad in Tokyo deepened that perspective considerably. Immersing myself in a culture so different from my own taught me how to listen before I speak, how to meet people where they are, and how to find understanding across difference. It also gave me a profound appreciation for the student experience — the vulnerability of being a learner in an unfamiliar space, working hard to find your footing.\u003c/p\u003e\u003cp\u003eTogether, these parts of my identity make me a mentor who leads with empathy, adapts to each student's unique context, and genuinely believes that every young person, regardless of background, is capable of thinking rigorously and beautifully about the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"eb71fbf4-d1b5-41ac-9fc5-3f7c181bda49\"}":{"__typename":"DeepDives","uuid":"eb71fbf4-d1b5-41ac-9fc5-3f7c181bda49","content":"\u003cp\u003eCuriosity is contagious. Every time a student asks a question I have never considered, they hand me a new way of seeing the world. My greatest motivation is not what I give to students — it is what they unknowingly give back to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"53d09c04-2d02-476a-a599-8bbfd38de7fa\"}":{"__typename":"DeepDives","uuid":"53d09c04-2d02-476a-a599-8bbfd38de7fa","content":"\u003cp\u003eI chose my major as Political Science because I needed a framework for the chaos I was already witnessing.\u003c/p\u003e\u003cp\u003eI did not choose Political Science so much as it chose me. Long before I declared a major, I was already asking the questions it tries to answer: Why do some nations flourish while others fracture? What holds a democracy together, and what quietly tears it apart? How do the decisions of a few powerful actors ripple outward into the lives of millions of ordinary people?\u003c/p\u003e\u003cp\u003eThen came the experiences that made those questions impossible to ignore. Watching a revolution unfold in real time. Standing inside a factory and seeing how global economic systems touch individual human lives. Advocating for refugees who had been rendered invisible by the very political structures I was beginning to study.\u003c/p\u003e\u003cp\u003ePolitical Science gave me a language for what I was seeing, a set of tools rigorous enough to hold the weight of those questions. It sits at the intersection of history, philosophy, economics, and human nature, which is to say it sits at the intersection of everything that matters.\u003c/p\u003e\u003cp\u003eI did not want a major. I wanted answers. This came closest.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2be3f0c6-bbd9-48b7-8c4e-f9086220a997\"}":{"__typename":"School","uuid":"2be3f0c6-bbd9-48b7-8c4e-f9086220a997","name":"William Carey Academy","city":"Chattogram","type":"HIGH","state":"Chittagong Division","country":"Bangladesh","zip":"4000"},"Education:{\"uuid\":\"ef8b89d2-06c3-4ce8-bad2-3fa666cf8b0a\"}":{"__typename":"Education","uuid":"ef8b89d2-06c3-4ce8-bad2-3fa666cf8b0a","school":{"__ref":"School:{\"uuid\":\"2be3f0c6-bbd9-48b7-8c4e-f9086220a997\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"d559ff8e-ab61-447d-bdaa-33cc75b6c227\"}":{"__typename":"Education","uuid":"d559ff8e-ab61-447d-bdaa-33cc75b6c227","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Political Science ","degree":null},"MentorPublicProfile:{\"uuid\":\"7439e6d5-93bd-4dec-9202-0b6ab7eaea13\"}":{"__typename":"MentorPublicProfile","uuid":"7439e6d5-93bd-4dec-9202-0b6ab7eaea13","displayName":"Arham A.","slug":"arham-ahmed","biography":"\u003cp\u003eI am a Political Science student concentrating in International Affairs and Political Theory, driven by one fundamental question: \u003cem\u003ehow does the world actually work?\u003c/em\u003e From the mechanics of democracy to the rise and fall of nations, I am endlessly fascinated by the forces, seen and unseen, that shape the geopolitical landscape we all inhabit. Game theory, to me, is not just an academic concept. It is a lens for understanding why countries go to war, why climate agreements collapse, and why rational actors so often produce irrational outcomes.\u003c/p\u003e\u003cp\u003eMy curiosity has never been content to stay within the walls of a classroom. I worked as an English language trainer in Tokyo, Japan, navigating the beautifully complex terrain of cross-cultural communication firsthand. I stepped inside a garments manufacturing factory to understand how sustainable economic development operates at the ground level, not through the abstraction of a textbook, but through direct observation of the people and systems that make it real. Most formatively, I had the rare and profound experience of witnessing the July Revolution in Bangladesh, watching grassroots organizing unfold in real time and seeing ordinary people, through sheer collective will, reshape the political order around them. These experiences did not simply inform my studies. They became the very reason I pursue them.\u003c/p\u003e\u003cp\u003eDuring my high school years, I founded the Chittagong Rohingya Initiative, a nonprofit dedicated to raising awareness and funds for Rohingya refugees through community outreach and crowdfunding campaigns. Leading that effort taught me something no course could fully teach: that meaningful change begins with compelling people to care, and that communication, storytelling, and strategic thinking matter every bit as much as good intentions.\u003c/p\u003e\u003cp\u003eWhen I am not traveling or immersed in academic journals at the library, I work at my university's mathematics department, a role that keeps my analytical thinking sharp and reinforces my belief that intellectual rigor and genuine curiosity are never in conflict.\u003c/p\u003e\u003cp\u003eAs a mentor, I will challenge you to think critically, question your assumptions, and develop arguments that are truly your own. I bring warmth, creativity, and a deep enthusiasm for ideas to every conversation, because my goal has never been to lecture. It has always been to think alongside you.\u003c/p\u003e","teachingVideoPlaybackId":"4vMmlGcowDRW1IBMAGApYB7BCZyCUokRl8Zw0002GOG01Y","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Political Science ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ec9dbfa7-a4f4-4259-a27a-7c7a94d28736\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d3a524a-cff5-4379-a175-2c447a955ab3\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb71fbf4-d1b5-41ac-9fc5-3f7c181bda49\"}"},{"__ref":"DeepDives:{\"uuid\":\"53d09c04-2d02-476a-a599-8bbfd38de7fa\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/55d4dfb9-0957-4e9d-9efd-fbb027f25505/-/preview/-/format/jpg/","https://ucarecdn.com/0464e25e-5bee-467d-82b0-569fba2461fc/-/preview/-/format/jpg/","https://ucarecdn.com/3a84df43-fcc3-43ca-97f9-c535a85e1ec7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ef8b89d2-06c3-4ce8-bad2-3fa666cf8b0a\"}"},{"__ref":"Education:{\"uuid\":\"d559ff8e-ab61-447d-bdaa-33cc75b6c227\"}"}],"hiredAt":"2026-03-17T15:27:21.136Z","topics":["K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Writing","Japanese","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","History Project","Creative Writing","K-6 Storybook","Business / Entrepreneurship","Law / Government / Policy","Journalism","Debate","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"arham-ahmed\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7439e6d5-93bd-4dec-9202-0b6ab7eaea13\"}"}}},"_sentryTraceData":"e356984648c240cc9da175d388a4b937-a898eeeafa3b5a03-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e356984648c240cc9da175d388a4b937,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"arham-ahmed"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","is
