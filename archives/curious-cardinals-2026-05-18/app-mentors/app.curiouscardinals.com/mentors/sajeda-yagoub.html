xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2db3f15c-3a67-4e12-86b8-858c1b0d4128\"}":{"__typename":"Favorites","uuid":"2db3f15c-3a67-4e12-86b8-858c1b0d4128","photoUrl":"https://ucarecdn.com/46913c99-3836-48f4-a82f-8d945de60bf8/","title":"Lady Midnight","type":"BOOK"},"Favorites:{\"uuid\":\"945d2c3f-b142-4de0-a5d9-fd31ec9738a0\"}":{"__typename":"Favorites","uuid":"945d2c3f-b142-4de0-a5d9-fd31ec9738a0","photoUrl":"https://ucarecdn.com/5f2a4197-6531-4580-9359-c2c66be7d03d/","title":"Chicago!","type":"CITY"},"Favorites:{\"uuid\":\"afb322c2-7d88-4c2d-ba6d-5b589caaa9e7\"}":{"__typename":"Favorites","uuid":"afb322c2-7d88-4c2d-ba6d-5b589caaa9e7","photoUrl":"https://ucarecdn.com/b9a15108-e321-41a1-a9e7-e878a6efe7c3/","title":"Les Miserable (musical but still;))","type":"PLAY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b64b8576-94e2-45e4-ac2a-52f3a02ba60b\"}":{"__typename":"DeepDives","uuid":"b64b8576-94e2-45e4-ac2a-52f3a02ba60b","content":"\u003cp\u003eOne piece of advice that I would give my younger self is that life is not linear and that it's okay for things to take a bit longer than you think. One thing that my professor said that has stuck with me till this day is that if you think an experiment, something you've never done before, is going to take a certain amount of time, double it and then add some more time. Unexpected things happen, but they're all to help you get to where you need to be!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7ec8ba81-388f-4a7a-a3a1-06f7d30d1f09\"}":{"__typename":"DeepDives","uuid":"7ec8ba81-388f-4a7a-a3a1-06f7d30d1f09","content":"\u003cp\u003eI chose Bioengineering because I feel like it is the best way I can understand the world. Ever since I was younger, I have had a fondness for the world around me, everything from the flora and fauna, the oceans (I actually wanted to be a marine biologist for the longest time), to the people and societies. I love learning about the composition of systems, what goes into them, and how systems interact with each other. Combining that with my interest in medical research, I chose to pursue Bioe.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e9bd438b-4554-47fd-aa4c-8ff6fec0c153\"}":{"__typename":"DeepDives","uuid":"e9bd438b-4554-47fd-aa4c-8ff6fec0c153","content":"\u003cp\u003eArt art and art! I love photography, painting, digital art, music (currently learning guitar), crocheting, jewelry making. I also enjoy learning languages and playing sports particularly soccer and deep dives on random topics.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"17c23568-b5a9-4375-81c7-83a91fe030ee\"}":{"__typename":"DeepDives","uuid":"17c23568-b5a9-4375-81c7-83a91fe030ee","content":"\u003cp\u003eTime flies by very quickly these days and with how easy it is to get caught up in consuming media and doomscrolling it's easy to feel disconnected. We've all heard the saying \"A picture is worth a thousand words.\" I have been working on a personal photography project to capture life off screen. Every person lives a different life, and we can only ever get a glimpse of what they show us. Photos capture the little moments, expressions and interactions that we miss going about our daily lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"05979f43-71df-49e1-9216-56481282dbc8\"}":{"__typename":"School","uuid":"05979f43-71df-49e1-9216-56481282dbc8","name":"Evanston Township High School","city":"Evanston","type":"HIGH","state":"Illinois","country":"United States","zip":"60201"},"Education:{\"uuid\":\"530bdf57-51f9-4924-b95a-01407deddb7b\"}":{"__typename":"Education","uuid":"530bdf57-51f9-4924-b95a-01407deddb7b","school":{"__ref":"School:{\"uuid\":\"05979f43-71df-49e1-9216-56481282dbc8\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"eaad7c9e-61e5-4c88-896d-96a61f1c4d6f\"}":{"__typename":"Education","uuid":"eaad7c9e-61e5-4c88-896d-96a61f1c4d6f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Bioengineering","degree":null},"MentorPublicProfile:{\"uuid\":\"8be287ff-737d-4df2-8380-9f54293d1f4a\"}":{"__typename":"MentorPublicProfile","uuid":"8be287ff-737d-4df2-8380-9f54293d1f4a","displayName":"Sajeda Y.","slug":"sajeda-yagoub","biography":"\u003cp\u003eSajeda is a Bioengineering student at Stanford University, originally from Chicago. She has always been an observer of the world around her, curious about both the small details and the larger patterns that shape her environment. Growing up, she found joy in the simplest forms of discovery. Whether it was caring for plants, catching tiny frogs that appeared after summer rains, or collecting leaves she thought were beautiful to share with family and friends. These early explorations planted the seeds for her fascination with the natural world. In high school, her interest grew deeper through chemistry and biology classes, which revealed to her what she considered the “blueprints of life.” These subjects showed her how complex systems could be broken down, understood, and then reimagined—a perspective that eventually led her to bioengineering. She chose the field because of its inherently interdisciplinary nature, offering her the chance to approach nature through math, chemistry, biology, and physics, and to use that foundation to design solutions that bridge theory and practice, from computational models to functional prototypes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout her schooling years, Sajeda has always been involved in community and self-exploration. Outside of her studies, she is involved in communities, including the Muslim Student Union and Stanford Black Muslim Coalition, working to provide a welcoming environment for students to be in community and explore their faith, and find mentorship. She also worked with the Stanford chapter of National Funbotics, a group focused on teaching engineering through hands-on experience to students K-12 who would not easily have the opportunity otherwise. Alongside her academic and community work, art has remained an important part of Sajeda’s life. For seven years, she played in a wide range of musical ensembles, from jazz bands and orchestras to high-energy pep bands at sports games, developing both discipline and creativity through music. Her interest in the visual arts has evolved as well. Starting with drawing and painting, she eventually found herself drawn to photography as a way to capture fleeting yet meaningful moments, whether it be the way sunlight filters through leaves or the expressions of people she encounters. For her, art is a form of reflection and self-expression, a way to slow down and honor the beauty of everyday life. Always curious and eager to grow, she continues to explore new artistic mediums while balancing them with her scientific and engineering pursuits. She looks forward to mentoring the next generation of thinkers and helping them find their passions!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"cImaGJzfubEkJ01iu2BeHbOhYs02sOiUEZS02pQuvAABMw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2db3f15c-3a67-4e12-86b8-858c1b0d4128\"}"},{"__ref":"Favorites:{\"uuid\":\"945d2c3f-b142-4de0-a5d9-fd31ec9738a0\"}"},{"__ref":"Favorites:{\"uuid\":\"afb322c2-7d88-4c2d-ba6d-5b589caaa9e7\"}"}],"causesSupported":[],"major":"Bioengineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b64b8576-94e2-45e4-ac2a-52f3a02ba60b\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ec8ba81-388f-4a7a-a3a1-06f7d30d1f09\"}"},{"__ref":"DeepDives:{\"uuid\":\"e9bd438b-4554-47fd-aa4c-8ff6fec0c153\"}"},{"__ref":"DeepDives:{\"uuid\":\"17c23568-b5a9-4375-81c7-83a91fe030ee\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/41200971-e2f1-41af-8a88-629245130ce3/-/preview/-/format/jpg/","https://ucarecdn.com/aa9a780e-f554-4e81-bf32-160b227cc3be/-/preview/-/format/jpg/","https://ucarecdn.com/f8afa761-753c-4c61-ae4b-114a840a698e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"530bdf57-51f9-4924-b95a-01407deddb7b\"}"},{"__ref":"Education:{\"uuid\":\"eaad7c9e-61e5-4c88-896d-96a61f1c4d6f\"}"}],"hiredAt":"2025-09-08T18:22:46.175Z","topics":["Pre-Algebra",
