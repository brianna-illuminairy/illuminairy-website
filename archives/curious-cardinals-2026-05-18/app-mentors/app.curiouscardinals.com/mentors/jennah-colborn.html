xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"75924e17-615b-4dbe-af8c-15433ba78e4d\"}":{"__typename":"Favorites","uuid":"75924e17-615b-4dbe-af8c-15433ba78e4d","photoUrl":"https://ucarecdn.com/7b890ee5-feab-4782-87e0-e7595a03d256/","title":"Clueless","type":"MOVIE"},"Favorites:{\"uuid\":\"5290689c-7cef-45e4-af48-bb4b90b60a1e\"}":{"__typename":"Favorites","uuid":"5290689c-7cef-45e4-af48-bb4b90b60a1e","photoUrl":"https://ucarecdn.com/20c750c3-af0e-4e2d-9ee9-ff131528dd9a/","title":"New Amerykah Part Two: Return of the Ankh","type":"ALBUM"},"Favorites:{\"uuid\":\"c79716c4-89b2-476a-8c97-0f84bfc94470\"}":{"__typename":"Favorites","uuid":"c79716c4-89b2-476a-8c97-0f84bfc94470","photoUrl":"https://ucarecdn.com/10eedab3-f05b-4f3e-8526-1791f0ac334f/","title":"Anna Karenina","type":"BOOK"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b3100621-8434-4641-8fd1-419625b4addf\"}":{"__typename":"DeepDives","uuid":"b3100621-8434-4641-8fd1-419625b4addf","content":"\u003cp\u003eWhere do I start?! My #1 hobby is travel. Any free time and money I can scrape together, I use to go somewhere new. My favorite place I've been to is Istanbul! I also love to read in my free time, which goes along really well with traveling, since there's often downtime on trains or buses. I'll read anything, but my favorite subjects are art, spirituality, social justice, science fiction, and environmentalism. I love to create, so you can often find me doodling, sketching or painting. Like any other human being, I also love listening to music-- recently I've been obsessed with Erykah Badu. Physically, I enjoy being outdoors as much as possible, and when I can, I like to hike, surf, ski, or chill on the beach. Finally, I spend my remaining free time seeking out any cats in the area and petting them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}":{"__typename":"School","uuid":"11470c0e-6098-4972-92d0-60616358bd13","name":"California Institute of Technology","city":"Pasadena","type":"COLLEGE","state":"California","country":"United States","zip":"91125"},"Education:{\"uuid\":\"cdc6c3a0-0669-435a-bd94-1d1519678da9\"}":{"__typename":"Education","uuid":"cdc6c3a0-0669-435a-bd94-1d1519678da9","school":{"__ref":"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":"2022","major":"Physics","degree":"Bachelor's of Science"},"School:{\"uuid\":\"8faed7a8-1ef2-46db-80ef-cffd69c1f0b1\"}":{"__typename":"School","uuid":"8faed7a8-1ef2-46db-80ef-cffd69c1f0b1","name":"Canyon Crest Academy","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92130"},"Education:{\"uuid\":\"2860bde1-07c3-4d0c-96a9-96d413e82752\"}":{"__typename":"Education","uuid":"2860bde1-07c3-4d0c-96a9-96d413e82752","school":{"__ref":"School:{\"uuid\":\"8faed7a8-1ef2-46db-80ef-cffd69c1f0b1\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"01c61548-7d46-4730-b87d-92080509f313\"}":{"__typename":"MentorPublicProfile","uuid":"01c61548-7d46-4730-b87d-92080509f313","displayName":"Jennah C.","slug":"jennah-colborn","biography":"\u003cp\u003eJennah earned her B.S. in Physics at Caltech in 2022. She shines at the intersection of art, culture, and science, finding joy especially in work that amplifies BIPOC perspectives. She loves to continually learn-- you can almost always find her either devouring a new book or striking up conversation with a stranger in a cafe-- but at the end of the day, she prides herself most on being an empathic presence in her loved ones' lives.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAs a natural communicator and \"people person\", Jennah realized halfway through her degree that all physicists didn't have to follow the same linear career path. Her interests soon pivoted to science communication, a field dedicated to bridging the knowledge gap between academia and the general public. Jennah spent her final years of undergrad working for organizations like Caltech, NASA, and the Smithsonian Institution as a scientific journalist and illustrator, and even had the opportunity to work on the media team for a marine conservation nonprofit abroad.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eToday, Jennah works as a data visualization scientist for Caltech, where she gets to combine her creative and scientific skills every day. She recently received Caltech's Chang prize, which will fund up to a year of her independent research into sustainable fashion technologies in 2024. \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"75924e17-615b-4dbe-af8c-15433ba78e4d\"}"},{"__ref":"Favorites:{\"uuid\":\"5290689c-7cef-45e4-af48-bb4b90b60a1e\"}"},{"__ref":"Favorites:{\"uuid\":\"c79716c4-89b2-476a-8c97-0f84bfc94470\"}"}],"causesSupported":[],"major":"Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b3100621-8434-4641-8fd1-419625b4addf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9b285392-5f15-40ff-b742-b9339bd4bd4e/-/preview/-/format/jpg/","https://ucarecdn.com/6e65f3a6-1d36-4338-b766-a2d74ba82c36/-/preview/-/format/jpg/","https://ucarecdn.com/5678b7d3-e62b-426b-88b8-e7f633dcdaec/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cdc6
