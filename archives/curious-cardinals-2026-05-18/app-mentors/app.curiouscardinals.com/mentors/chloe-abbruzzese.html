f":"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"44d85611-c2b8-43d0-9f56-7426913cf93c\"}":{"__typename":"Education","uuid":"44d85611-c2b8-43d0-9f56-7426913cf93c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Global Affairs \u0026 Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"007e34df-2bca-402d-bc4b-25ea4d55c3c1\"}":{"__typename":"MentorPublicProfile","uuid":"007e34df-2bca-402d-bc4b-25ea4d55c3c1","displayName":"Chloe A.","slug":"chloe-abbruzzese","biography":"\u003cp\u003eHello! My name is Chloe Abbruzzese, and I’m a junior at Yale University studying Global Affairs with a certificate in German Studies. At my core, I care deeply about helping students find confidence in their abilities, clarity in their work, and joy in learning. Mentorship has been one of the most meaningful parts of my college experience, and I’m excited to support students in reaching their academic and personal goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I spend most of my time thinking about international relations, policy analysis, and how data can help us understand the world. I’ve taken coursework in applied quantitative analysis, microeconomics, strategy, and even introductory AI, which has given me a strong analytical foundation. I love helping students strengthen their writing, organization, and problem-solving skills — especially when a subject feels overwhelming. My goal is always to make complex ideas feel manageable and to help students build habits that last.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’ve learned a lot through my professional and extracurricular involvements. I currently work in Yale’s Office of International Affairs as a Study Abroad Student-Coordinator, where I help undergraduates navigate academic planning, program selection, and decisions that shape their time at Yale. Before that, I served as a Residential Fellow and Instructor for Yale Young Global Scholars, mentoring more than 1,800 high school students from over 150 countries. I led workshops, supported residential life, and taught in a program that combined literature, philosophy, and culture — an experience that strengthened both my teaching skills and my appreciation for diverse perspectives.\u003c/p\u003e\u003cp\u003eI’ve also had the chance to study abroad in Vienna and intern at the International Institute for Applied Systems Analysis, where I worked on research and event coordination for international environmental policy projects. These experiences taught me the value of clear communication and thoughtful guidance, especially when navigating unfamiliar challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also deeply involved in the arts. I serve as the President of Yale Dancers and the Executive Director of the Alliance for Dance at Yale, coordinating rehearsals, performances, and outreach for a vibrant campus community. Dance has taught me discipline, creativity, and how to foster supportive team environments — all qualities I bring into my mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbove all, I care about helping students grow. Whether you’re looking to improve academically, develop better study strategies, or simply gain confidence, I’m here to support you every step of the way. I truly believe that with the right support, every student can thrive, discover their strengths, and enjoy learning in a way that feels meaningful to them. I’m committed to creating a supportive, encouraging environment where students feel
