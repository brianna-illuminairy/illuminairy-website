xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bccf6b8a-c8db-4a9c-8644-8e0d7a8f7403\"}":{"__typename":"Favorites","uuid":"bccf6b8a-c8db-4a9c-8644-8e0d7a8f7403","photoUrl":"https://ucarecdn.com/ca91d8b0-9998-4280-8b2c-92c6656241a7/","title":"Roseland NYC Live: Portishead","type":"ALBUM"},"Favorites:{\"uuid\":\"3601a01c-7503-49a3-9e37-baacece40a47\"}":{"__typename":"Favorites","uuid":"3601a01c-7503-49a3-9e37-baacece40a47","photoUrl":"https://ucarecdn.com/79091bcf-ec45-4a9c-a985-f05a789203bf/","title":"Future","type":"ARTIST"},"Favorites:{\"uuid\":\"e194858c-ddf6-4a0d-a2b8-43f0fd45118d\"}":{"__typename":"Favorites","uuid":"e194858c-ddf6-4a0d-a2b8-43f0fd45118d","photoUrl":"https://ucarecdn.com/72d48e51-01cd-49ca-a3dc-2b384940163b/","title":"East of Eden: John Steinbeck","type":"BOOK"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"30057f3c-deae-4f75-a88b-04e420d1eafc\"}":{"__typename":"DeepDives","uuid":"30057f3c-deae-4f75-a88b-04e420d1eafc","content":"\u003cp\u003eI'm very proud of my work for the Gina Ortiz Jones mayoral campaign in my hometown of San Antonio. Despite having always been interested in politics, I had never been able to actually work in the field, so in the second semester of my senior year, I decided to cold email the office of a candidate in my city's mayoral race whom I most aligned with politically. I ended up getting a role as a campaign fellow and spent the next 5 months working as much as I could to help get her elected, eventually succeeding. This work not only cemented in my mind that politics is something I wanted to do, but also made me feel accomplished in that I took a step to make my community a better place, and my hard work paid off in achieving that goal. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"aa5c1e8a-ccc5-45bd-923a-b20535a9fdb0\"}":{"__typename":"DeepDives","uuid":"aa5c1e8a-ccc5-45bd-923a-b20535a9fdb0","content":"\u003cp\u003eBoth of my parents are immigrants, coming from Brazil to the United States. They were able to make such a drastic move because of the work they put into their education, and they imparted the values onto me as a student. That idea, that hard work and dedication pay off, is one that I would love to impart to any mentees of mine. Sometimes, all a student needs is that push and reassurance that their hard work is being seen and acknowledged, to truly succeed. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0654d31a-2d09-4c45-bd11-a8baa1d34282\"}":{"__typename":"DeepDives","uuid":"0654d31a-2d09-4c45-bd11-a8baa1d34282","content":"\u003cp\u003eI think mentorship, especially mentorship from current university students to students still in their primary or secondary education, is the best way for both parties to learn and succeed together. I still have a lot to learn in terms of being a better student, and a great way for this growth to come to me is by imparting the knowledge I do have onto people who will soon be in my academic position. A mentorship is a great way for somebody in my position to help others succeed, and also develop important life skills that are gained through helping someone learn.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"842a49d6-9f1b-403a-83f8-41498c89d249\"}":{"__typename":"DeepDives","uuid":"842a49d6-9f1b-403a-83f8-41498c89d249","content":"\u003cp\u003eIn high school, I would consider myself a motivated student, but not to the extent that I never had fun. I went to a small private school that greatly emphasized academics, and my parents also always made sure I kept my grades up, so education was always the top priority in my mind. That being said, I definitely enjoyed my high school experience a lot. I wasn't trapped studying in my room for hours at a time; I still made sure to hang out with my friends, play sports, and, in general, do things that I enjoy. I always made sure to do my work, but in terms of extracurriculars, I really devoted myself to the things that I enjoyed. Once I had more or less decided what I wanted to study in college, I made sure to pursue opportunities that aligned with those interests, and joined together my own passions with those that work well with what I wanted to do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"e462bb2e-e585-4754-8b62-8618d56262c0\"}":{"__typename":"School","uuid":"e462bb2e-e585-4754-8b62-8618d56262c0","name":"Keystone School","city":"San Antonio","type":"HIGH","state":"Texas","country":"United States","zip":"78212"},"Education:{\"uuid\":\"dc650582-1c4d-4b37-b29c-12492806e6b8\"}":{"__typename":"Education","uuid":"dc650582-1c4d-4b37-b29c-12492806e6b8","school":{"__ref":"School:{\"uuid\":\"e462bb2e-e585-4754-8b62-8618d56262c0\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"50a2732a-45ad-4184-8ca0-66a3fbde2ab4\"}":{"__typename":"Education","uuid":"50a2732a-45ad-4184-8ca0-66a3fbde2ab4","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Political Science and History","degree":null},"MentorPublicProfile:{\"uuid\":\"271f9d44-3e2c-4357-8137-a8398c131391\"}":{"__typename":"MentorPublicProfile","uuid":"271f9d44-3e2c-4357-8137-a8398c131391","displayName":"Andre A.","slug":"andre-aguiar","biography":"\u003cp\u003eHey guys! My name is André Aguiar. I’m currently a freshman at Columbia University studying political science and history, and I am super excited to be joining the Curious Cardinals team! I was born and raised in San Antonio, Texas, and I’m still getting used to the cold up here in New York but have so far really enjoyed my time at Columbia.\u003c/p\u003e\u003cp\u003eI always point to 2016, when I was just a fourth grader, to the moment when my interest and love for politics began. To me, there is no aspect of life that politics does not affect, and whether it be history, literature, or even something not classically associated with the political realm like science, I like to keep a perspective of how these fields are affected by political happenings and how the fields themselves affect the politics of an era. In terms of work experience, I’ve spent time on three different campaigns since my senior year of high school. One in San Antonio and two in NYC, one of which is ongoing. Campaign work has helped me understand at the ground level both the impact of politics and how legislation, even at a local level, affects people across a district, city, or state.\u003c/p\u003e\u003cp\u003eAt Curious Cardinals I’m specializing as an academic mentorship leader. I have experience in mentorship both in academics and as a supervisor for younger children. I’ve always found that helping mentor someone is a great way to reinforce your own knowledge and that a great mentorship not only helps a student in need but can forge a relationship that continues to help beyond the first class or subject that the relationship was built upon. I’ve spent a summer as a camp counselor in charge of children ages 5-12 at a sports-oriented camp. This experience helped me better learn how to interact in a leadership position with children younger than me and how to make them feel like we are friends while also maintaining a professional relationship.\u003c/p\u003e\u003cp\u003eOutside of academics, I’m a big fan of sports, having played both soccer and basketball my whole life. I watch a lot of football (big Pats fan) and basketball (Go Spurs Go), so I’d love to talk ball anytime. I also played a lot of video games in high school, although I have been playing less since I came up to college. I’m also a big movie watcher, with some of my favorites being \u003cem\u003eCity of God, Persona, and Do the Right Thing\u003c/em\u003e.\u003c/p\u003e","teachingVideoPlaybackId":"mkwodbaIUIb7l8ii6SvT95QwRDHQqXB8fMMFBAfGT3o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bccf6b8a-c8db-4a9c-8644-8e0d7a8f7403\"}"},{"__ref":"Favorites:{\"uuid\":\"3601a01c-7503-49a3-9e37-baacece40a47\"}"},{"__ref":"Favorites:{\"uuid\":\"e194858c-ddf6-4a0d-a2b8-43f0fd45118d\"}"}],"causesSupported":[],"major":"Political Science and History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"30057f3c-deae-4f75-a88b-04e420d1eafc\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa5c1e8a-ccc5-45bd-923a-b20535a9fdb0\"}"},{"__ref":"DeepDives:{
