xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7bee040a-33b0-45c8-b279-ed430f1a8c7e\"}":{"__typename":"DeepDives","uuid":"7bee040a-33b0-45c8-b279-ed430f1a8c7e","content":"\u003cp\u003eMentoring matters to me because it’s not just about teaching—it’s about building connections and watching others grow. Throughout high school, I accidentally became a tutor, and it turned out to be one of the best things I ever did. It all started when a friend’s mom asked me to help her kid with homework, and before I knew it, I was hooked. Who knew explaining sentence structures could be so satisfying? I quickly realized I loved not just the teaching but also the connections I made with students—turning what could have been just another homework session into a lasting friendship.\u003c/p\u003e\u003cp\u003eEventually, I found myself tutoring at a Catholic K-9 school in Dorchester, just outside Boston. Picture a mix of controlled chaos and rewarding “aha” moments. It was hectic, but seeing those lightbulb moments made it all worthwhile. Mentoring gives me the chance to make a real difference, not just in a student’s education, but in their confidence and outlook on life. That’s why it’s so important to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"30b6393f-bed8-4887-bfd2-81f5240f326d\"}":{"__typename":"DeepDives","uuid":"30b6393f-bed8-4887-bfd2-81f5240f326d","content":"\u003cp\u003eIf I could give my middle or high school self some advice, I’d say: Don’t be shy— just ask for help! Think of older students as your personal gps for navigating school life. They’ve already done the trial and error, so why not skip straight to the good stuff? And don’t forget your teachers—they’re like secret life coaches disguised as educators, just waiting to drop some wisdom if you ask.\u003c/p\u003e\u003cp\u003eOh, and one more thing: reconnect with those friends you haven’t talked to in forever. Sometimes the best conversations start with, “Hey, remember me?” You’d be surprised how much a simple message can turn into a great catch-up (or at least a funny story). Bottom line: Don’t go through school solo—team up, ask around, and make the most of the people around you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"21627806-429e-4b56-a622-efdb77bd3090\"}":{"__typename":"DeepDives","uuid":"21627806-429e-4b56-a622-efdb77bd3090","content":"\u003cp\u003eThis is such an easy question, I LOVE fishing. I love fishing—it's been a passion of mine since I was five years old. My earliest memory is being on a boat with my dad feeling seasick, yet the nauseous feeling faded immediately once he caught that first fish. The excitement made me forget everything else. Since then, I've cherished every moment we spent together fishing, especially since he often travels for work.\u003c/p\u003e\u003cp\u003eThese days, I’m out on the water whenever I can be, always optimistic and experimenting with new techniques, even if it means going hours without a bite. Fishing centers me and provides a peaceful escape from life’s stresses. It’s also something I love to share with others. I love bonding with my elderly neighbor over our fishing stories and going fishing with friends and family. Fishing has always brought me happiness and meaningful connections.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"488a0fca-0765-4198-bc97-2bc3fca7098f\"}":{"__typename":"DeepDives","uuid":"488a0fca-0765-4198-bc97-2bc3fca7098f","content":"\u003cp\u003eDuring my high school summers, I was your friendly neighborhood barista! I loved cooking up lattes at a coffee shop and mastering the art of small talk with caffeine-deprived customers. When I wasn’t perfecting my espresso shots, I was out with friends, soaking up the sun, and hitting the beach. I’m obsessed with anything involving the water—boating, fishing, you name it. There’s nothing quite like an early morning fishing trip followed by an afternoon of chilling on the sand.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"24feaecf-08b0-46b5-92a3-8f27d6138534\"}":{"__typename":"School","uuid":"24feaecf-08b0-46b5-92a3-8f27d6138534","name":"St. Sebastian's School","city":"Needham","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02492"},"Education:{\"uuid\":\"b1348747-ddc4-469b-a27f-87d21529ea9c\"}":{"__typename":"Education","uuid":"b1348747-ddc4-469b-a27f-87d21529ea9c","school":{"__ref":"School:{\"uuid\":\"24feaecf-08b0-46b5-92a3-8f27d6138534\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"d94e1f74-3ad3-42f5-8e0a-c7780dce113a\"}":{"__typename":"Education","uuid":"d94e1f74-3ad3-42f5-8e0a-c7780dce113a","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Applied Mathematics and Economics, Classics (Latin)","degree":null},"MentorPublicProfile:{\"uuid\":\"b7c61646-0040-4a78-9393-ea07567063cb\"}":{"__typename":"MentorPublicProfile","uuid":"b7c61646-0040-4a78-9393-ea07567063cb","displayName":"Alex Y.","slug":"alex-yang","biography":"\u003cp\u003eHI! I’m Alex Yang, and I grew up in a suburb just outside Boston. I attended St. Sebastian’s School for high school, a small Catholic all-boys school. Now I’m at Brown University, diving into Applied Mathematics, Economics, and Classics (Latin)—because why not juggle numbers, ancient languages, and everything in between?\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not deciphering Latin texts or calculating complex equations, you’ll find me fishing and boating in the summer or snowboarding in the winter. I’m also a sports enthusiast, especially college sports. I have a special love for basketball, football, and ultimate frisbee. I consider myself outdoorsy. I love hiking, swimming, going on walks, and driving. My 3-year-old yellow Labrador, Ella, is my partner in crime for my hiking and backpacking adventures. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love traveling and exploring new places. I’ve traveled to many countries in Asia, China, Taiwan, Korea, Malaysia just to name a few. I am definitely a salty over sweet type of person. I’m all about lemon Italian ice over ice cream, and cheese is basically its own food group for me. My love for coffee runs deep, thanks to my days working at a coffee shop, so I’m practically a professional coffee drinker. So if your ever wondering where Alex Yang is, you'll find me out on the water, hitting the slopes, or just enjoying a good cup of joe.\u003c/p\u003e","teachingVideoPlaybackId":"qS00l9QWwrxYI3XiI4fjVK9S9htWBcPJctIV31ZffJPw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Mathematics and Economics, Classics (Latin)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7bee040a-33b0-45c8-b279-ed430f1a8c7e\"}"},{"__ref":"DeepDives:{\"uuid\":\"30b6393f-bed8-4887-bfd2-81f5240f326d\"}"},{"__ref":"DeepDives:{\"uuid\":\"21627806-429e-4b56-a622-efdb77bd3090\"}"},{"__ref":"DeepDives:{\"uuid\":\"488a0fca-0765-4198-bc97-2bc3fca7098f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/53084ba6-351a-4803-9bb1-eccc81c6f91a/-/preview/-/format/jpg/","https://ucarecdn.com/395841ee-58d1-4303-8eb6-eb4f051e326a/-/preview/-/format/jpg/","https://ucarecdn.com/c4b05a74-32f0-4fa8-ae48-129eda5f30e2/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b1348747-ddc4-469b-a27f-87d21529ea9c\"}"},{"__ref":"Education:{\"uuid\":\"d94e1f74-3ad3-42f5-8e0a-c7780dce113a\"}"}],"hiredAt":"2024-08-16T16:16:47.052Z","topics":["K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Latin","Mandarin Chinese","Algebra I","Algebra II"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alex-yang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b7c61646-0040-4a78-9393-ea07567063cb\"}"}}},"_sentryTraceData":"b4eb37fbe3424d179f27011b6d4a2f59-98fa4c3a8636c802-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b4eb37fbe3424d17
