c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2259dcd2-d806-4c77-87cb-72e79896c5a3\"}":{"__typename":"DeepDives","uuid":"2259dcd2-d806-4c77-87cb-72e79896c5a3","content":"\u003cp\u003eI see myself in curious high schoolers and want them to flourish :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1d9184c7-22d1-4b12-9b81-5c0708455550\"}":{"__typename":"DeepDives","uuid":"1d9184c7-22d1-4b12-9b81-5c0708455550","content":"\u003cp\u003ePublish a book, ideally fiction\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2353d7b7-385b-4995-8368-ffd0730631f5\"}":{"__typename":"DeepDives","uuid":"2353d7b7-385b-4995-8368-ffd0730631f5","content":"\u003cp\u003eI initially applied for Neuroscience, but didn't like biology as much as I enjoyed coding.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3f7bb59e-69c3-4dc3-b1dc-def38260b166\"}":{"__typename":"School","uuid":"3f7bb59e-69c3-4dc3-b1dc-def38260b166","name":"Calcutta International School","city":"Kolkata","type":"HIGH","state":"West Bengal","country":"India","zip":"700107"},"Education:{\"uuid\":\"72f18cce-724f-4237-a634-5ba624963b42\"}":{"__typename":"Education","uuid":"72f18cce-724f-4237-a634-5ba624963b42","school":{"__ref":"School:{\"uuid\":\"3f7bb59e-69c3-4dc3-b1dc-def38260b166\"}"},"startYear":"2012","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"8a5d267e-b33e-4ee0-a88b-0c0bd6a1daba\"}":{"__typename":"Education","uuid":"8a5d267e-b33e-4ee0-a88b-0c0bd6a1daba","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science \u0026 Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"282d3491-8810-408b-b429-4691e3bc18c5\"}":{"__typename":"MentorPublicProfile","uuid":"282d3491-8810-408b-b429-4691e3bc18c5","displayName":"Aranyo R.","slug":"aranyo-ray","biography":"\u003cp\u003e\u003cstrong\u003eHi there, I'm Aranyo, a recent Yale grad in CS \u0026amp; Psychology.\u003c/strong\u003e I work in consulting and have dabbled in regtech, agritech, behavioral sciences, AI, and finance over the years. I love to read books across genres and watch horror films!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I presented at ISEF thrice, for my work with local farmers (on developing a low-cost nanopesticide - which later won the Diana Award). My second project was a culturally adapted diagnostic game app for autism, which was awarded First Place by the APA and 4th Grand overall (and later won the Congressional App Challenge). In junior year, I expanded my research through MIT's SSP in Biochemistry. I also learned college math through Stanford ULO and attended LaunchX. Happy to talk about these experiences :)\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I worked in 2 psych labs and was funded as a Wu Tsai Scholar to work on implicit bias. I also worked with the Consulting Club on projects with Google, BeyondMeat, and Uber. I was a TA for 2 comp sci courses in functional programming and data structures. My research has also entailed experiments with neurodiverse children and patients with alcohol use disorder.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI can help you use tools like Qualtrics to design surveys and Python, R, or Excel for advanced data analytics. I'm also proficient in graphic design using the Adobe suite, and on using tools like ChatGPT for research \u0026amp; coding. I can guide with web and app design, with my knowledge of Android App Studio, JavaScript, TypeScript, Node, React/JSS, RESTful APIs, HTML/CSS, and SQL. I have some experience with Google Earth Engine.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAs your mentor, I'd be thrilled to help you navigate your academic and extracurricular interests.\u003c/strong\u003e I'm particularly knowledgeable about high school research and entrepreneurship opportunities, and how to gather funding \u0026amp; recognition for your next big idea (think Regeneron STS, Davidson Fellows, Ashoka Young Changemaker, Blue Ocean, etc). I love to link research projects with real-world service, and can guide you on how to translate your findings into actual value for your community. Moreover, I can help you plan for your summer, whether by writing proposals for local professors or helping with selective summer program applications. I have a comprehensive database of programs and colleges offering substantial financial aid/scholarships that I'm happy to share.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI tutor for AP Stats, Psych, CS A/Principles, Calc AB/BC, Bio, Physics, Hum Geo, Microecon, and Macroecon, based on my IB and Yale coursework. I also coach students for the SAT/ACT and can share exclusive resources for practice and learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMessage me to set up some time - I love to meet new people!\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlay
