xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7b526845-772e-43e8-9c49-aac796e50872\"}":{"__typename":"DeepDives","uuid":"7b526845-772e-43e8-9c49-aac796e50872","content":"\u003cp\u003eI jumped around through multiple majors, which was half the fun! I started with psychology, switched to cognitive science, and landed on humanities -- as someone who was desperate to try everything, I decided I'd go for two years of STEM and two years of humanities. I wanted to dip my toe in everything. It turned out to be an eclectic, creative, and super exciting four years.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"2d956d48-dad9-49b8-a80c-7e5662347026\"}":{"__typename":"DeepDives","uuid":"2d956d48-dad9-49b8-a80c-7e5662347026","content":"\u003cp\u003eIt's cliché ... but it's my parents, hands down. They're both incredibly creative (musicians and teachers!), and they really showed me the importance of valuing the arts. It's because of them that I've felt inspired and empowered to pursue an artistic career. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"00e376a2-226b-4f47-8371-24abc75ec17a\"}":{"__typename":"DeepDives","uuid":"00e376a2-226b-4f47-8371-24abc75ec17a","content":"\u003cp\u003eDuring COVID, when I was a junior and senior in high school, my biggest passion was my high school choir. The community was incredibly close, and it was pretty devastating not to be able to sing together -- so I started learning some professional audio and video editing software and turned all of our pieces into virtual choirs. It felt like the biggest way I could give back to my friends in the group -- many of whom are still my best friends! -- and to our instructor, who remains a mentor to me today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"1a604c64-c709-43cb-be63-61df4067e851\"}":{"__typename":"School","uuid":"1a604c64-c709-43cb-be63-61df4067e851","name":"Seattle Academy","city":"Seattle","type":"HIGH","state":"Washington","country":"United States","zip":"98122"},"Education:{\"uuid\":\"a9be7309-62e6-4c07-823b-ec3056d29c78\"}":{"__typename":"Education","uuid":"a9be7309-62e6-4c07-823b-ec3056d29c78","school":{"__ref":"School:{\"uuid\":\"1a604c64-c709-43cb-be63-61df4067e851\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"6f4d282b-8cde-4fb0-91ac-bb1834510780\"}":{"__typename":"Education","uuid":"6f4d282b-8cde-4fb0-91ac-bb1834510780","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Humanities \u0026 Education","degree":null},"MentorPublicProfile:{\"uuid\":\"c883b164-f1dd-499f-9d22-6cd1edb0a91c\"}":{"__typename":"MentorPublicProfile","uuid":"c883b164-f1dd-499f-9d22-6cd1edb0a91c","displayName":"Sophia S.","slug":"sophia-schloss","biography":"\u003cp\u003eHello! My name is Sophia, and I’m a recent Yale grad from Seattle. I studied humanities and education in college, and I’ve been a professional film and television actor since I was six years old. (I was most recently a series regular on the two-season Disney+ original show Big Shot!) I have always loved acting and would be thrilled to work with you on any theater/film passions. In the last six years, I’ve also worked a lot on writing for film and TV — my thesis at Yale was an original screenplay, and I’ve written some pilots as well — so, if you’re curious about screenwriting (or any creative writing, for that matter), I’d love to help!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI’m planning to continue pursuing acting professionally, as well as hopefully sell some scripts and/or work in writer’s rooms, so if you’re interested in the entertainment industry or filmmaking more generally, we can definitely come up with some fun projects together. This is true for students of all ages; I have years of experience teaching drama to elementary school-aged kids, and would love to explore storytelling, acting, and writing with young students in addition to older ones.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI’ve also done quite a bit of fiction and essay writing — as a humanities major interested in creative writing, I’ve written a lot — and would be glad to work with you on any writing assignments for class, fun personal writing projects, or both! I would also love to help with more personal writing (i.e., the writing you might do for a college common application essay).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eMy main extracurricular in high school and college was music; I come from a family of musicians and grew up playing the piano and guitar, singing, and writing songs (I’ve been in a few choirs and directed a folk music group at Yale) — so if you’re wanting to write music or work on music for a group, I’d be happy to tackle that with you.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eFinally, I’ve always been passionate about teaching — both my parents are teachers, and I knew I wanted to prioritize teaching in my life (hence working with Curious Cardinals!) — so if you’re interested in pursuing teaching, want to come up with classroom lessons, or are curious about education history, I’d love to work with you on any of that as well.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eBecause I grew up juggling professional acting with school, I’m very good with time management and staying organized while also prioritizing creative passions. If this is something you’d like help with, I’d be happy to chat with you about strategies and make some plans to stay on top of schoolwork/personal projects — we can even do that in addition to working on the projects themselves. Tons of fun and creative adventures to be had!\u003c/p\u003e","teachingVideoPlaybackId":"Ifd4UQILiMdkBxyPk8sMgi9Eov01lQ01m7TV01CwZ7FM9k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Humanities \u0026 Education","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7b526845-772e-43e8-9c49-aac796e50872\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d956d48-dad9-49b8-a80c-7e5662347026\"}"},{"__ref":"DeepDives:{\"uuid\":\"00e376a2-226b-4f47-8371-24abc75ec17a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/313b847d-77c4-48df-9ba3-9d947ee7d657/-/preview/-/format/jpg/","https://ucarecdn.com/0e280105-6427-4ee8-a7ad-e7d2880c8b3f/-/preview/-/format/jpg/","https://ucarecdn.com/cfeba20a-e2fc-4880-a590-958d04678e7f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":
