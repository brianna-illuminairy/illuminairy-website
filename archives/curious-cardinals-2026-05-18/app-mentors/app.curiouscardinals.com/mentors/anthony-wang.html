9f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"38f46d39-9d96-4d01-a795-8be273eb85b0\"}":{"__typename":"DeepDives","uuid":"38f46d39-9d96-4d01-a795-8be273eb85b0","content":"\u003cp\u003eIt gives people who don't know what to do, a guide and set course to follow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"c82d12f3-ac36-4e16-a33f-da924be49ad8\"}":{"__typename":"School","uuid":"c82d12f3-ac36-4e16-a33f-da924be49ad8","name":"The Bronx High School of Science","city":"The Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10468"},"Education:{\"uuid\":\"a67b8adc-917d-4bb4-8730-55ab06f01948\"}":{"__typename":"Education","uuid":"a67b8adc-917d-4bb4-8730-55ab06f01948","school":{"__ref":"School:{\"uuid\":\"c82d12f3-ac36-4e16-a33f-da924be49ad8\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"b69371ef-40ae-49c9-8e50-abe9ba2a1ef8\"}":{"__typename":"Education","uuid":"b69371ef-40ae-49c9-8e50-abe9ba2a1ef8","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"2acddb0a-1c95-41a9-b24f-80325f5ed78a\"}":{"__typename":"MentorPublicProfile","uuid":"2acddb0a-1c95-41a9-b24f-80325f5ed78a","displayName":"Anthony W.","slug":"anthony-wang","biography":"\u003cp\u003eI come from New York City, Queens,\u0026nbsp; and I knew I wanted to pursue Mechanical Engineering from an early age. I started with robotics in high school and have continued to learn about robotics during my education. I have now expanded more on robotics from weight optimization, simulations, and machining. I have always spent my time leading teams and working towards making a big project for a competition such as First Robotics and Robonation. Outside of school, I like to play games, cook, and create cool projects that let me build on the skills I have learned. I care a lot about learning as much as possible and I think personal projects really help demonstrate what you learn in class and to be able to build those skills on. It is a more applicable learning experience than school tests and I think any good engineer should work on personal projects and documentation to show what they know, and learned as an engineer. I’ve also been learning a lot on my own and only had a few mentors along the way, which is why I want to be a good mentor for those who didn’t have someone they could ask questions to. Being able to be the person I wanted early on in my academic career who could help guide me on what to learn and the best way to learn certain skills for engineering is very fulfilling for me. It’s also the reason why I made my robotics team in high school, in order to help teach young people who are hungry to learn but don’t have much guidance. I hope my role as a mentor will be able to not only help people with their technical questions on their passion project but to also ignite a spark for engineering as I have always had. I also want to help teach people what are good projects to work on not only for showing on college applications, but also projects that help work on fundamental engineering skills that companies and people look for in engineers. I will do my best to do what I wished someone could’ve done for me when I was young.\u003c/p\u003e","teachingVideoPlaybackId":"5QGF1l8ZhFtk3vmV9a2JgLVVZI4PFcvF2OeGmqeaqiY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDiv
