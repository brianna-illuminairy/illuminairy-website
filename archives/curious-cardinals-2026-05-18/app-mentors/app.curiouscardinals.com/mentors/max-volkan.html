xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"55a51915-69fd-4570-a285-5d45cd5befcd\"}":{"__typename":"Favorites","uuid":"55a51915-69fd-4570-a285-5d45cd5befcd","photoUrl":"https://ucarecdn.com/94de2627-cb59-4c3f-9750-9a3a06c90ae8/","title":"shadow \u0026 claw","type":"BOOK"},"Favorites:{\"uuid\":\"7837878f-9a70-4944-a80a-75dc5245de01\"}":{"__typename":"Favorites","uuid":"7837878f-9a70-4944-a80a-75dc5245de01","photoUrl":"https://ucarecdn.com/9fefbede-c6a1-419e-ba0c-29050e4c1d84/","title":"Elden Ring","type":"GAME"},"Favorites:{\"uuid\":\"3fe42bd3-cca1-4193-ae00-8563b785fc76\"}":{"__typename":"Favorites","uuid":"3fe42bd3-cca1-4193-ae00-8563b785fc76","photoUrl":"https://ucarecdn.com/04a4bd64-ae5f-4a43-ade0-d80e93b6ddc8/","title":"Cosmogramma - Flying Lotus","type":"ALBUM"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e27d2f06-8797-4ce3-8c78-4095a02e9e63\"}":{"__typename":"DeepDives","uuid":"e27d2f06-8797-4ce3-8c78-4095a02e9e63","content":"\u003cp\u003eChoosing my major came down to a single, unforgettable conversation, not during the peak of COVID, but just after restrictions had lifted. One afternoon, my friend Jake invited our usual friend group to hang out, but no one else showed up. So we ended up under this graffiti-covered overpass, just the two of us, talking for hours. At first, we joked about how weird everything still felt, but then the conversation turned toward consciousness, free will, and what it means to be human. Something shifted in me that day. I had always thought of myself as a “computer person,” someone who liked clean logic and systems. But in that moment, I realized I was just as drawn to the strange, unquantifiable stuff like the mind, emotion, experience. That conversation lit a spark, and I started seeking out ways to study both worlds at once. That’s how I found cognitive and neuroscience and I’ve been following that intersection ever since. Now I am more interested in applying these to wearable technology.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"ef9d412e-99a0-4b3c-8be9-b39f902f224c\"}":{"__typename":"DeepDives","uuid":"ef9d412e-99a0-4b3c-8be9-b39f902f224c","content":"\u003cp\u003eIn high school, I was learning a lot about myself and how my identity fits in with various groups at school. After temporarily trying to hang out with a new group of friends that I thought were \"cooler,\" I realized that I actually loved being a nerd with my day-one friends rather than trying to fit in with the popular crowd. Looking back, stepping away from the pressure to be popular and just following my gut made high school a lot of fun and a lot less stressful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9b762219-740d-4d2a-b640-43deec43f878\"}":{"__typename":"DeepDives","uuid":"9b762219-740d-4d2a-b640-43deec43f878","content":"\u003cp\u003eI feel that there a lot of heavy things that you can truly only learn for yourself. For example, your purpose in life, when to stop overthinking about a situation, or maybe even if you should switch paths in your studies or career. I think that more than a YouTube video, Instagram Reel, or even a TV show, mentorship is one of the closest things that can bring you to these kinds of self-realizations. Getting to learn about the path someone has taken, and relating it to your life puts everything at a close perspective. Mentorship also means a lot to me because it’s one of the most powerful ways to help someone see a future they didn’t know was possible. For me, that moment came after I nervously sent a cold email to a scientist at NASA whose work I admired and was pursuing a PhD at the same university. To my surprise, he agreed to meet for lunch. I was just an undergrad at the time, full of questions but unsure of my place in the world of research.  That meeting set off a domino effect that led to a research opportunity and, eventually, helped me get a Fulbright Fellowship and now research at UTokyo. Now, I want to be that person for someone else someone who opens a door and sparks confidence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c64c8ee0-82f3-43eb-8aef-0d2dcac88a3e\"}":{"__typename":"DeepDives","uuid":"c64c8ee0-82f3-43eb-8aef-0d2dcac88a3e","content":"\u003cp\u003eRecently I have been creating a brain-controlled rhythm game for my current lab! It works using brain waves that increase during relaxation (alpha waves) as well as breathing and blinking. \u003cbr\u003e\u003cbr\u003eAnother passion project that I created during my undergraduate years was a live-streaming website featuring a continuous digital radio feed. Using an Icecast server, I streamed original beats, DJ sets and digital music produced by myself, my friends, and other underground artists I admired. It was my personal way of supporting underground creativity and giving unique music a platform.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"70c0b2ed-ccc4-4778-be18-8c98bcdfcf9d\"}":{"__typename":"School","uuid":"70c0b2ed-ccc4-4778-be18-8c98bcdfcf9d","name":"Adolfo Camarillo High School","city":"Camarillo","type":"HIGH","state":"California","country":"United States","zip":"93012"},"Education:{\"uuid\":\"edc1b235-808d-4daa-8150-8cc7fe374386\"}":{"__typename":"Education","uuid":"edc1b235-808d-4daa-8150-8cc7fe374386","school":{"__ref":"School:{\"uuid\":\"70c0b2ed-ccc4-4778-be18-8c98bcdfcf9d\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"4a22a0bf-f2e7-4e86-83d5-794f8ac243d1\"}":{"__typename":"School","uuid":"4a22a0bf-f2e7-4e86-83d5-794f8ac243d1","name":"Kashiwa Campus, The University of Tokyo","city":"Kashiwa","type":"COLLEGE","state":"Chiba","country":"Japan","zip":"277-0882"},"Education:{\"uuid\":\"d082b69a-1d57-4992-92bf-e61a45e99b3b\"}":{"__typename":"Education","uuid":"d082b69a-1d57-4992-92bf-e61a45e99b3b","school":{"__ref":"School:{\"uuid\":\"4a22a0bf-f2e7-4e86-83d5-794f8ac243d1\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Human and Engineered Environmental Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"35538008-34a0-46c8-bc7c-f9d1b7b80f95\"}":{"__typename":"MentorPublicProfile","uuid":"35538008-34a0-46c8-bc7c-f9d1b7b80f95","displayName":"Maxwell V.","slug":"max-volkan","biography":"\u003cp\u003eI’m Max! I am studying cognitive science, neuroscience, computer programming, and combinations of the two fields such as neural networks and computational neuroscience. With a background in cognitive and computer science, I have just finished a Fulbright Fellowship at the University of Tokyo, where I am researching new methods and technologies for measuring brain  and heart activity in order to detect mental fatigue. I am now continuing my studies and research there as a master's student. My passion for bridging artificial intelligence and biological sciences has also led me to be a part of the NASA GeneLab Analysis Working Group, specifically contributing to their AI/Machine Learning group’s bioinformatics research. I am very interested in space travel, specifically astronaut healthcare and am involved with multiple research projects in this domain. I have also been studying Advanced Japanese for over 5 years, am living in Japan, and I’m able to have professional and scientific conversations in Japanese on a daily basis in my lab!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my academic and research activities, I am deeply passionate about coffee, digital music production, and game development. I find a lot of my inspiration in experimental music and art! I find that there are so many underground artists who are often overlooked but deserve a chance because of how genius they are. One of my core philosophies is that the media, art, and culture we engage with outside of work or school directly influence and inspire the decisions we make and the ideas we wave! For example, ever since I was a kid, the reason I wanted to study biology was because I wanted to make real life Pokemon. I believe this connection is what might have unconsciously led me to continue studying in a biological field today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn everything I pursue, whether it be programming, or engaging with creative projects, I like to go beyond understanding how things work to uncover why they matter and how they connect to our deeper passions. As your mentor, I want to help you tap into what truly makes you feel excited, and foster genuine enthusiasm about things you may have never known. For me, learning is about discovering what resonates personally, following curiosity, and ultimately connecting knowledge with passion. Looking forward to meeting with you!\u003c/p\u003e","teachingVideoPlaybackId":"SwS01f3yTrcqfFPci6bUNugNHOs6Q02tyJULfrlRgOaiE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was receiving a Fulbright Fellowship to Japan last year! When applying, I would always hear about how competitive this program was, and was honestly shocked when I received the acceptance email. It felt very gratifying as I was able to turn my Japanese language study into a life-changing research opportunity! \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"55a51915-69fd-4570-a285-5d45cd5befcd\"}"},{"__ref":"Favorites:{\"uuid\":\"7837878f-9a70-4944-a80a-75dc5245de01\"}"},{"__ref":"Favorites:{\"uuid\":\"3fe42bd3-cca1-4193-ae00-8563b785fc76\"}"}],"causesSupported":[],"major":"Human and Engineered Environmental Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e27d2f06-8797-4ce3-8c78-4095a02e9e63\"}"},{"__ref":"DeepDives:{\"uuid\":\"ef9d412e-99a0-4b3c-8be9-b39f902f224c\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b762219-740d-4d2a-b640-43deec43f878\"}"},{"__ref":"DeepDives:{\"uuid\":\"c64c8ee0-82f3-43eb-8aef-0d2dcac88a3e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/228f700e-449d-435b-bbb5-a980ce7d3a17/-/preview/-/format/jpg/","https://ucarecdn.com/111bcdfe-c143-41eb-b4ed-564964954287/-/preview/-/format/jpg/","https://ucarecdn.com/6c279bd7-6074-441f-8296-d08247b610ae/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"edc1b235-808d-4daa-8150-8cc7fe374386\"}"},{"__ref":"Education:{\"uuid\":\"d082b69a-1d57-4992-92bf-e61a45e99b3b\"}"}],"hiredAt":"2025-04-18T12:19:03.709Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Biology","Japanese","College Essay Writing","Reading","Computer Science","Executive Function","Academic Coaching","Music","Visual Arts / Graphic Design","Video / Photography","
