xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c2d5a075-8c6a-4271-905d-9fdff970af9d\"}":{"__typename":"DeepDives","uuid":"c2d5a075-8c6a-4271-905d-9fdff970af9d","content":"\u003cp\u003eI didn’t have too much trouble choosing my majors. When I picked Berkeley, it just felt like the most interesting place to spend time with words and ideas. So when I got there, I knew I wanted to understand the human experience — and also learn how to write about it. I quickly found a home in the English and Philosophy departments.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI didn’t make a pros and cons list or follow any kind of practical path when choosing my majors. Instead, I sat myself down, looked in the mirror, and got honest about the kind of mind I have: how it works, where it leans, what it grabs onto, what it finds beautiful. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd I asked myself: What fields would let me use that mind every day? What fields would make it sharper? Once I had those answers, the rest kind of just fell into place.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlong the way, I met incredible professors and took courses that challenged and inspired me. Highlights include a seminar on allegory, \u003cem\u003eLiterature and Philosophy: Minds, Morals, and the Novel\u003c/em\u003e, and \u003cem\u003eConfucius for Today\u003c/em\u003e. I even took classes on Taylor Swift and Harry Potter, where I explored songwriting, worldbuilding, and how great stories can make a cultural splash.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe intellectual journey was vast, abstract, and deeply fulfilling in ways I didn’t expect. It shaped how I see the world both inside and outside the classroom, and added a sense of purpose, some wisdom, and awe to everything I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"cfd994f2-7638-4009-aefd-2189d2353882\"}":{"__typename":"DeepDives","uuid":"cfd994f2-7638-4009-aefd-2189d2353882","content":"\u003cp\u003eI’ve been somewhat of a lucid dreamer for a handful of years now. Every so often, I’ll catch myself mid-dream doing something pretty mundane — folding laundry, checking my email — and decide to switch things up. I’ve flown over rooftops, driven through the Irish countryside with the windows down, and danced through the kitchen at camp with my best friends. I’ve wandered into Dr. Seuss illustrations, popped into the world of my favorite movie (\u003cem\u003eMarcel the Shell with Shoes On\u003c/em\u003e), and walked right into the chorus of a song just to see what it would look like.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSometimes I change the whole style of the dream — I’ll switch from animation to live action or turn everything black and white, like I’m the editor of my own little dream film. Once, I spent an entire night rearranging cloud furniture in a sky that looked suspiciously like the inside of a snow globe.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt’s strange and silly and occasionally profound, but mostly, it’s just fun — like getting to play director, actor, and soundtrack supervisor in my sleep.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"1b5bbe7e-0e05-4276-94ff-f0f58d695527\"}":{"__typename":"DeepDives","uuid":"1b5bbe7e-0e05-4276-94ff-f0f58d695527","content":"\u003cp\u003eOne thing I’m really proud of is my work as the Salads Cook at the camp where I spent three summers. I came in with no real kitchen experience and ended up creating the best salad bar the campers had ever seen. I learned everything from the ground up — showing up early, staying late, figuring out how to move fast and think on my feet in a busy environment, racing to get everything done by dinnertime when empty bellies would start to grumble.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI brought my creativity to the work and used it in a new, physical way. I came up with plant-based recipes on the spot and wrote them down as they happened, sometimes scribbling on the backs of parchment paper with pesto-covered hands. I got faster at chopping, better at eyeballing measurements, and learned to trust my instincts — to listen to texture, temperature, and smell. I crisped quinoa, baked broccoli, made dressings from scratch, and got the whole camp talking about my food.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBack at school, I ended up weaving the experience into my senior thesis. Cooking became a case study through which I could explore perception, movement, and metaphor — how physical, everyday tasks shape our cognitive frameworks and the ways we give form to thought. That kitchen reinforced what I’ve come to believe across disciplines: learning doesn’t just happen in your head — it also happens in your hands.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a2f8329e-0e6a-45ee-bb34-3f43402c32d0\"}":{"__typename":"DeepDives","uuid":"a2f8329e-0e6a-45ee-bb34-3f43402c32d0","content":"\u003cp\u003eWhen in doubt, you can find sparkle in the stars, magic in music, and interest in other people. Remember to put yourself in good company to laugh. Put yourself in the mountains to breathe. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"349a376a-3fa9-44f1-82c9-0e399c4a1271\"}":{"__typename":"School","uuid":"349a376a-3fa9-44f1-82c9-0e399c4a1271","name":"Marin Academy","city":"San Rafael","type":"HIGH","state":"California","country":"United States","zip":"94901"},"Education:{\"uuid\":\"eda86f6b-2d15-4d74-bfc5-afa2142d9d94\"}":{"__typename":"Education","uuid":"eda86f6b-2d15-4d74-bfc5-afa2142d9d94","school":{"__ref":"School:{\"uuid\":\"349a376a-3fa9-44f1-82c9-0e399c4a1271\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"0c06338b-3e15-47be-9b4e-c8ddc23eb7eb\"}":{"__typename":"Education","uuid":"0c06338b-3e15-47be-9b4e-c8ddc23eb7eb","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English \u0026 Philosophy","degree":null},"MentorPublicProfile:{\"uuid\":\"791bb967-6d14-4a7e-bb04-2e0edaafb04e\"}":{"__typename":"MentorPublicProfile","uuid":"791bb967-6d14-4a7e-bb04-2e0edaafb04e","displayName":"Jessie F.","slug":"jessie-fisher","biography":"\u003cp\u003eHi! I’m Jessie Fisher — a writer, content creator, and community builder based in San Francisco. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI studied English and Philosophy at UC Berkeley, where I wrote and cartooned for \u003cem\u003eThe Daily Californian\u003c/em\u003e, completed an honors thesis on embodiment and meaning-making, and swore by the Mezzo salad. I’m all about stories that think hard, feel big, and pay close attention.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese days, I support production for KQED’s \u003cem\u003eForum\u003c/em\u003e, where I’ve helped bring to life episodes like \u003cem\u003e“What Has a Wild Animal Taught You?”\u003c/em\u003e and \u003cem\u003e“What It’s Like to Parent with Your Friends.”\u003c/em\u003e I also build and grow SFGate’s puzzle community as part of the Audience Team — developing retention initiatives, managing relationships with puzzle creators, moderating community events, using data to understand what keeps solvers coming back, and serving as the bridge between our playing community and editorial staff. On the side, I lead editorial projects at the Cal Alumni Association. Highlights include a multimedia spotlight on the graduating class of 2025 and \u003cem\u003eThe Lair News\u003c/em\u003e — an original summer camp newspaper I created from scratch, packed with interviews, illustrations, horoscopes, inside jokes, lore, and lots of love.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI care deeply about clear, creative, community-centered communication — whether I’m coordinating a podcast rollout or getting a sentence to finally land. In a world that’s loud, fast, and always refreshing, I want more ideas scribbled in the margins, more slow talks on front porches, and more print that gets passed from hand to hand. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’ve got a story to tell, an essay to wrangle, or an idea that’s still stretching its legs — I’d love to help workshop it with you. I’m here for the brainstorms, the messy middles, and the\u0026nbsp;“wait, that actually works!” moments. Let’s roll up our sleeves, chase down the spark, and make something that feels just right.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMaybe you’re dreaming up a piece of investigative reporting. Maybe you're tackling a personal project that feels loose and unlined, but full of potential. Maybe you’ve got a big question and want to explore it from a few different angles — so we’ll hit the books and hit the streets. Or maybe you’re writing your way through something more concrete — a portfolio, a pitch, a college essay — and want it to actually sound like you\u003cem\u003e.\u003c/em\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWherever you are in the process, I’m here to think alongside you, stretch the idea, shape the story, and bring it into focus. We’ll follow what’s interesting, make room for the mess, and build something you’re proud of.\u003c/p\u003e","teachingVideoPlaybackId":"85iL1CsxtJIR5a4JB02teAd5JSQEvToj00aB9NHWvuWOw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English \u0026 Philosophy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c2d5a075-8c6a-4271-905d-9fdff970af9d\"}"},{"__ref":"DeepDives:{\"uuid\":\"cfd994f2-7638-4009-aefd-2189d2353882\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b5bbe7e-0e05-4276-94ff-f0f58d695527\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2f8329e-0e6a-45ee-bb34-3f43402c32d0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4dbf44ee-c6f1-49d4-819b-46d4ab438f0a/-/preview/-/format/jpg/","https://ucarecdn.com/4671aff8-8235-4380-8885-89063fa19477/-/preview/-/format/jpg/","https://ucarecdn.com/bc163112-a102-4824-a9ea-4e20293026b3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"eda86f6b-2d15-4d74-bfc5-afa2142d9d94\"}"},{"__ref":"Education:{\"uuid\":\"0c06338b-3e15-47be-9b4e-c8ddc23eb7eb\"}"}],"hiredAt":"2025-07-02T17:12:28.422Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Q
