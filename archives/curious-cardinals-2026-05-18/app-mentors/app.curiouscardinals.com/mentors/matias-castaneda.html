typename":"DeepDives","uuid":"710ccf4d-ff24-49e8-bc2d-cfac9f0d176f","content":null,"videoPlaybackId":"iGIlIGTYpRbEpK881yMcnIUJzkONgVIHg02JCEeJPzNU","question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"cd73e868-94ed-48db-9124-7051a3b438da\"}":{"__typename":"School","uuid":"cd73e868-94ed-48db-9124-7051a3b438da","name":"Cypress Bay High School","city":"Weston","type":"HIGH","state":"Florida","country":"United States","zip":"33332"},"Education:{\"uuid\":\"298a7cf2-9424-4d97-a41a-992dba5246d3\"}":{"__typename":"Education","uuid":"298a7cf2-9424-4d97-a41a-992dba5246d3","school":{"__ref":"School:{\"uuid\":\"cd73e868-94ed-48db-9124-7051a3b438da\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"c4c8ea74-ac0c-4c86-af9a-16039641d3ce\"}":{"__typename":"Education","uuid":"c4c8ea74-ac0c-4c86-af9a-16039641d3ce","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Journalism \u0026 International Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"6db29c7a-09d5-4210-9253-de1a1e20a907\"}":{"__typename":"MentorPublicProfile","uuid":"6db29c7a-09d5-4210-9253-de1a1e20a907","displayName":"Matias C.","slug":"matias-castaneda","biography":"\u003cp\u003eHi! My name is Matías Castañeda and I am a junior studying Journalism and International Studies at Northwestern University. Having been a student journalist in high school, I was determined to continue my passion for journalism at Northwestern. However, when I arrived on campus, I soon found many other subjects I became equally passionate about. Some examples include history, finance, and international relations, all of which I’ve made sure to pursue through different avenues. In sophomore year, I realized that all of these different passions could converge in one specific field: law. Since then, I have become more involved in the pre-law community, even founding the Undergraduate Latin American Law Association (ULALA). Having grown up near Miami and in a Colombian household, I was raised speaking Spanish and constantly reminded of my Latin American heritage. Being able to help latinx and pre-law students on their path to law school while celebrating our cultures has been particularly rewarding. \u003cbr\u003e\u003cbr\u003eOutside of school, I have three main hobbies: soccer, film, and reading. I am a very big Manchester United fan and regularly watch the Premier League to keep up with scores, even if they usually lose… Aside from soccer, I also love to watch tennis and typically root for Sinner! I am a bit of a movie nerd, and have watched hundreds of them. I love all sorts of movie trivia and can talk about them endlessly. Along with films, I also love to read. Although my love for reading began with fictional novels, I have recently begun to prefer long form essays and news articles like those printed by the New Yorker. \u003cbr\u003e\u003cbr\u003eA big reason I was excited to join Curious Cardinals was because of my passion for helping people that were once in my shoes. Having been a soccer coach and camp counselor for many years, I understand the impact that mentors can have on students. It was always incredible to see how players developed over the years into amazing human beings, and to know that one played a small part in that development was always rewarding. Having the chance to do the same in an academic setting is exciting, and I am very much looking forward to building strong, long lasting relationships with students in order to help them achieve their goals and become the best versions of themselves! \u003c/p\u003e","teach
