xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8443a357-9697-4174-856f-2397495c955c\"}":{"__typename":"Favorites","uuid":"8443a357-9697-4174-856f-2397495c955c","photoUrl":"https://ucarecdn.com/e1bf6ed4-63e2-4970-9144-4c087d10e3b2/","title":"Olivia Rodrigo","type":"ARTIST"},"Favorites:{\"uuid\":\"571ad42f-12d9-48be-9914-4a05d025801d\"}":{"__typename":"Favorites","uuid":"571ad42f-12d9-48be-9914-4a05d025801d","photoUrl":"https://ucarecdn.com/1a7fc24e-1eab-4e2d-b6ab-d7ca6df662d8/","title":"The Karate Kid","type":"MOVIE"},"Favorites:{\"uuid\":\"ae21d308-ba0f-4262-bbc0-894253f24ba3\"}":{"__typename":"Favorites","uuid":"ae21d308-ba0f-4262-bbc0-894253f24ba3","photoUrl":"https://ucarecdn.com/2799c6fb-d6cf-4a58-8925-afad8effb43c/","title":"Thee Sacred Souls","type":"ALBUM"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"e75467ac-b31f-41b5-9596-a817b34ca4df\"}":{"__typename":"DeepDives","uuid":"e75467ac-b31f-41b5-9596-a817b34ca4df","content":"\u003cp\u003eCarrying the weight of seven people on her back when she immigrated to the United States, my grandmother serves as a daily reminder of the sacrifice and love it took for me to be where I am today. She instilled in me the values of education and how no one can take that away from me. Over fifty years later, my grandmother has successfully run a restaurant in San Francisco’s Chinatown, gained full ownership of her properties, and broken the cycle of financial dependency. Her story is a living testament to the agency we all have in creating the life we want, despite the systematic obstacles. She is the reason I pursue higher education.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"ae840b33-5ccc-40c3-85f0-eb0122250776\"}":{"__typename":"DeepDives","uuid":"ae840b33-5ccc-40c3-85f0-eb0122250776","content":"\u003cp\u003eI am a self-proclaimed foodie who loves trying new restaurants with friends and family. If I had to choose my top three favorite cuisines, it would be Korean, Italian, and Mexican. My favorite foods include philly cheesesteaks, tteokbokki, malatang, and birria tacos. If you have any food—or matcha—recommendations in the San Francisco Bay Area and New Haven, please let me know!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"6ff4333a-962b-4c49-b9ae-1cc2e0ffb174\"}":{"__typename":"DeepDives","uuid":"6ff4333a-962b-4c49-b9ae-1cc2e0ffb174","content":"\u003cp\u003eAs a first-generation low-income college student, I have always worried about how I would afford higher education. I am the oldest of three siblings, and I knew that I didn’t want to place that financial burden on my parents. After meticulously applying for scholarships for two years, I earned seven merit-based ones, including the Good Tidings Community Service Scholarship, Koshland Young Leaders Award Scholarship, and The Association of Chinese Teachers Scholarship. Furthermore, I sought out paid internships each summer during high school, and taught myself financial literacy so that I could let that money compound for me. Together, the internships and scholarships I have earned offsets nearly 100% of my college costs.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d34899e5-2ddb-4035-8f1e-dac10dc9886d\"}":{"__typename":"DeepDives","uuid":"d34899e5-2ddb-4035-8f1e-dac10dc9886d","content":"\u003cp\u003eSummer 2025:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eInternship at the San Francisco Public Defender’s Office as a Young Defender where I authored investigative articles on courtroom injustices I witnessed.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTraveled to Italy with my best friend.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEarned my Driver’s License\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eSummer 2024:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eInternship with the Department of Elections, where I pre-registered youth to vote, helped revise the High School Elections Ambassador program, and compiled outreach materials for election drives.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAttended a college-preparation program at the University of Southern California.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHard-launched my youth-led organization.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eSummer 2023:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eInternship with the San Francisco Board of Supervisors as a Finance, Accounting, \u0026amp; Administration Intern. I developed Excel spreadsheets tracking the employment status of over 200 department personnels, drafted financial reports, and assisted the CFO in presenting legislation.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFundraised over $3,000 for Student Government.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked as a boba barista.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"5f0556ad-c186-4dea-a814-93de6eb53c61\"}":{"__typename":"School","uuid":"5f0556ad-c186-4dea-a814-93de6eb53c61","name":"Balboa High School","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94112"},"Education:{\"uuid\":\"aadd0d0e-b49f-436e-8e2c-02c130d8168b\"}":{"__typename":"Education","uuid":"aadd0d0e-b49f-436e-8e2c-02c130d8168b","school":{"__ref":"School:{\"uuid\":\"5f0556ad-c186-4dea-a814-93de6eb53c61\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"6c3110cd-4514-4f08-aaaf-9081b4cd5383\"}":{"__typename":"Education","uuid":"6c3110cd-4514-4f08-aaaf-9081b4cd5383","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Ethics, Politics, \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"180f4431-5134-4cf4-a181-8850e813aafc\"}":{"__typename":"MentorPublicProfile","uuid":"180f4431-5134-4cf4-a181-8850e813aafc","displayName":"Joleen D.","slug":"joleen-deng","biography":"\u003cp\u003eHello! My name is Joleen, and I am a first-year student at Yale University. I am currently studying Ethics, Politics, \u0026amp; Economics, with a plan to pursue law school and to become an attorney.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe perks of attending a liberal arts university are that you have room to explore all of your academic interests and even discover new ones. Here are a few of mine:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eLegal Studies\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSocial Justice\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEconomics \u0026amp; Entrepreneurship\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLiterature\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHistory\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePhilosophy\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, you will find me doing advocacy work for Yale’s Prison Project, reviewing prose and poetry for Yale’s Literary Magazine, and promoting community service initiatives with Yale’s Dwight Hall. In my free time, I am going on walks, indulging in a good book, or trying new cafes and restaurants with friends.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my education, I was fortunate enough to have inspiring and driven mentors, which is why I chose to work at Curious Cardinals. Over the last two years, I have provided mentorship to juniors and seniors at my former high school, which included how to bring a project idea to life and the ins and outs of the college application process.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHere is how I can help you:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion Exploration:\u003c/strong\u003e Our sessions will begin with a deep dive into your interests and how we can mobilize them.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eProject Planning: \u003c/strong\u003eChoosing between establishing an organization, creating a small business, or other project types to best reflect your objective.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege Research:\u003c/strong\u003e Curating your perfect college list based on your academic goals and personal preferences.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEssay Writing:\u003c/strong\u003e Brainstorming, drafting, editing, and finalizing essays that best showcase you as an applicant.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege Portfolio:\u003c/strong\u003e Showcasing a holistic overview of yourself through your extracurriculars, awards, identity/background, etc.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScholarship \u0026amp; Internship Search:\u003c/strong\u003e Finding external resources to support your financial and professional journey into college.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLeadership Building:\u003c/strong\u003e Learning the values of how to successfully lead as a youth and create meaningful change.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eAs a first-generation college student, I understand that pursuing higher education can be intimidating and overwhelming. My goal is to ease you through the process by helping you discover your drive and learning how to showcase it to the world. If this aligns with your goals, I would love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"mmzTgxJMjrCk6WowHhwtWPSf4ar2OZTKnOSKXEu6RiY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8443a357-9697-4174-856f-2397495c955c\"}"},{"__ref":"Favorites:{\"uuid\":\"571ad42f-12d9-48be-9914-4a05d025801d\"}"},{"__ref":"Favorites:{\"uuid\":\"ae21d308-ba0f-4262-bbc0-894253f24ba3\"}
