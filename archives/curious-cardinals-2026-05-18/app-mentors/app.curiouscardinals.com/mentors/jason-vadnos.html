xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f5aac1de-db4f-4e10-8c60-0cebdb5434a5\"}":{"__typename":"Favorites","uuid":"f5aac1de-db4f-4e10-8c60-0cebdb5434a5","photoUrl":"https://ucarecdn.com/c276729c-c8e4-4a99-9947-ddee3dbe50b4/","title":"Overwatch 2","type":"GAME"},"Favorites:{\"uuid\":\"674b6ed7-44a0-489b-8c29-2037d82849d9\"}":{"__typename":"Favorites","uuid":"674b6ed7-44a0-489b-8c29-2037d82849d9","photoUrl":"https://ucarecdn.com/42ca76f4-d1e3-46a9-b564-15f21f1b514f/","title":"The Constitution of Knowledge: A Defense of Truth","type":"BOOK"},"Favorites:{\"uuid\":\"7e1529cc-e18b-447d-9b60-29b7ccc98433\"}":{"__typename":"Favorites","uuid":"7e1529cc-e18b-447d-9b60-29b7ccc98433","photoUrl":"https://ucarecdn.com/125f3bb4-dc60-4c40-9d2d-496d0e8a2f3e/","title":"Marrakesh","type":"CITY"},"CausesSupported:{\"uuid\":\"8d0c66f1-aaba-4b2f-8a39-b435d210485b\"}":{"__typename":"CausesSupported","uuid":"8d0c66f1-aaba-4b2f-8a39-b435d210485b","name":"Every Vote Counts","description":"\u003cp\u003eAs Director of Engagement, work with 90+ colleges to get out the student vote!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d84e4757-ae17-4a2b-abed-70c2bb738419/"},"CausesSupported:{\"uuid\":\"fa9868c8-b72d-4fd1-9f1d-0826f38b0650\"}":{"__typename":"CausesSupported","uuid":"fa9868c8-b72d-4fd1-9f1d-0826f38b0650","name":"More Like US","description":"\u003cp\u003eI write articles combating polarization by highlighting Americans similarities!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/73bebc3e-cfb1-4ddb-92de-bcabdcf50960/"},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"9c23a87b-4217-41cb-b32c-017ec8c8aac3\"}":{"__typename":"DeepDives","uuid":"9c23a87b-4217-41cb-b32c-017ec8c8aac3","content":"\u003cp\u003eI am a \u003cstrong\u003eHUGE \u003c/strong\u003efoodie. I love trying new cuisines, exploring new restaurants, and making my own creations at home in the kitchen! From Ethiopian to Indonesian, pastilla to num banhchok, there is nothing better in this world than having a mix of flavors, spices, and textures dance across my palate.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"28ef081d-9f09-43f5-bf4b-45b830836f1e\"}":{"__typename":"DeepDives","uuid":"28ef081d-9f09-43f5-bf4b-45b830836f1e","content":"\u003cp\u003eMy dream job is to be a nonprofit manager, either \u003cstrong\u003eleading or founding my own organization\u003c/strong\u003e! In particular, I hope to cultivate a passion for \u003cstrong\u003ecommunity involvement and civic engagement\u003c/strong\u003e among high school and college students. I believe that every young person should see the value of actively participating in our democracy and of striving to create a positive impact on those around them, whether its through volunteerism, service fellowships, or simply voting in municipal elections! At the end of the day, I want to \u003cstrong\u003eempower the next generation to think about and solve the problems \u003c/strong\u003ethey, their communities, and their world will undoubtedly face—and to do so with joy!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e9e5f134-e7a8-4800-9838-b37a2e7914c7\"}":{"__typename":"DeepDives","uuid":"e9e5f134-e7a8-4800-9838-b37a2e7914c7","content":"\u003cp\u003eAs a lifelong student journalist, aspiring author, and voracious reader, it had always been my dream to be featured in a national media publication. And in 2024, it finally happened: \u003cstrong\u003eI was featured in\u0026nbsp;\u003cem\u003eThe New York Times\u003c/em\u003e.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCheck it out here: https://www.nytimes.com/2024/12/14/us/college-campuses-gaza-conversations.html?unlocked_article_code=1.h04.04_c.06pyUjVV4Ce3\u0026amp;smid=url-share\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"309d8b5e-122f-4f3d-97b3-b27be447adbc\"}":{"__typename":"DeepDives","uuid":"309d8b5e-122f-4f3d-97b3-b27be447adbc","content":"\u003cp\u003eAs you can probably tell by my profile photos, \u003cstrong\u003eI love travelling\u003c/strong\u003e (especially on scholarship money). Whether it's Costa Rica, Turkey, Morocco, Thailand, Zion National Park, or New York City, there is a unique joy in uncovering the sights, sounds, culture, people, and nature of different places.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd this passion for travel dovetails with \u003cstrong\u003eone of my favorite hobbies: hiking\u003c/strong\u003e. From Roman ruins to tropical rainforests and active volcanoes, I find blending adventure and physical activity truly magical. Every rock face, frozen river, and next step is a challenge I am eager to overcome.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I don't have the opportunity to be out and about though, I spend most of my time \u003cstrong\u003ereading or playing video games\u003c/strong\u003e. And if I had to choose a favorite genre of each, I would say science fiction short stories and tactical FPS!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"c0921515-0b28-413c-b452-5c266dc100d8\"}":{"__typename":"School","uuid":"c0921515-0b28-413c-b452-5c266dc100d8","name":"Plantation High School","city":"Plantation","type":"HIGH","state":"Florida","country":"United States","zip":"33313"},"Education:{\"uuid\":\"27c6c1f3-04c3-4dee-9329-2678ec1efb1d\"}":{"__typename":"Education","uuid":"27c6c1f3-04c3-4dee-9329-2678ec1efb1d","school":{"__ref":"School:{\"uuid\":\"c0921515-0b28-413c-b452-5c266dc100d8\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"acc33e5a-97a5-4420-9bad-3dd960604197\"}":{"__typename":"Education","uuid":"acc33e5a-97a5-4420-9bad-3dd960604197","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Community Advocacy and Business","degree":null},"MentorPublicProfile:{\"uuid\":\"73460edd-bb08-47c8-9831-026c70982453\"}":{"__typename":"MentorPublicProfile","uuid":"73460edd-bb08-47c8-9831-026c70982453","displayName":"Jason V.","slug":"jason-vadnos","biography":"\u003cp\u003eHey there! My name is Jason, and I’m a current sophomore at Vanderbilt University. I’m officially studying “Human and Organizational Development,” “Culture, Advocacy, and Leadership,” and “Business,” which is quite the mouthful! At the end of the day though, I’m learning how to start, grow, and manage organizations and create social impact in my community, skills which I hope to combine in my \u003cstrong\u003efuture career as a nonprofit manager.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re interested in \u003cstrong\u003eaffecting positive changes\u003c/strong\u003e in the world, pursuing a \u003cstrong\u003ecivically minded career\u003c/strong\u003e, or \u003cstrong\u003ecreating your own nonprofit/social venture, \u003c/strong\u003ethen I’m the\u003cstrong\u003e right mentor for you!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOriginally from Miami, FL, I grew up as an FGLI student in the Title I school system. The educational adversity I experienced in this environment showed me just how important it is to have role models in your life, especially those willing to work alongside you to develop your passions and pursue meaningful opportunities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat is exactly what I hope to do as a Curious Cardinals coach: help you \u003cstrong\u003ediscover a vision\u003c/strong\u003e for your future self, and provide you with the \u003cstrong\u003eknowledge and guidance\u003c/strong\u003e you need to start your journey there.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003ePlease feel free to learn more about my interests and accomplishments below.\u003c/em\u003e\u003c/p\u003e","teachingVideoPlaybackId":"yuSH3grLJnRsHXilKVJYTBY2b7fz01wkZXfHtTdzeHv4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am incredibly proud of my journey with the college application process. As a first-generation student, I had no one in my life who was knowledgeable about writing admissions essays, applying for financial aid, or simply building a college list. And at a school where guidance counselors were responsible for nearly 500 students each, I had to navigate the application process with minimal guidance and support.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHowever, with enough research, dedication, and asking for others’ insight, I was \u003cstrong\u003eaccepted into every one of the 14 schools I applied to!\u003c/strong\u003e From Brown to Swarthmore to UNC Chapel Hill, I was incredibly fortunate to have a wealth of options to choose between. Ultimately, I chose Vanderbilt because they provided me with more than \u003cstrong\u003e$275,000 in merit scholarships\u003c/strong\u003e, helping to fund both my education and two international service projects of my choice!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f5aac1de-db4f-4e10-8c60-0cebdb5434a5\"}"},{"__ref":"Favorites:{\"uuid\":\"674b6ed7-44a0-489b-8c29-2037d82849d9\"}"},{"__ref":"Favorites:{\"uuid\":\"7e1529cc-e18b-447d-9b60-29b7ccc98433\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8d0c66f1-aaba-4b2f-8a39-b435d210485b\"}"},{"__ref":"CausesSupported:{\"uuid\":\"fa9868c8-b72d-4fd1-9f1d-0826f38b0650\"}"}],"major":"Community Advocacy and Business","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9c23a87b-4217-41cb-b32c-017ec8c8aac3\"}"},{"__ref":"DeepDives:{\"uuid\":\"28ef081d-9f09-43f5-bf4b-45b830836f1e\"}"},{"__ref":"DeepDives:{\"uuid\":\"e9e5f134-e7a8-4800-9838-b37a2e7914c7\"}"},{"__ref":"DeepDives:{\"uuid\":\"309d8b5e-122f-4f3d-97b3-b27be447adbc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d9210f52-67ca-4421-9607-2e4021c766bb/-/preview/-/format/jpg/","https://ucarecdn.com/797acdc6-523a-4896-a0d2-722e0e2105f8/-/preview/-/format/jpg/","https://ucarecdn.com/7eace727-15a5-40fa-bd29-3768cde3f7a8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"27c6c1f3-04c3-4dee-9329-2678ec1efb1d\"}"},{"__ref":"Education:{\"uuid\":\"acc33e5a-97a5-4420-9bad-3dd960604197\"}"}],"hiredAt":"2024-12-10T21:39:16.718Z","topics":["History Project","Business / Entrepreneurship","Law / Government / Policy"
