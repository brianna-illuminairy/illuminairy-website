xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"266a116a-4ba9-4c5c-9c7a-9982cec6d94e\"}":{"__typename":"Favorites","uuid":"266a116a-4ba9-4c5c-9c7a-9982cec6d94e","photoUrl":"https://ucarecdn.com/526b07b9-b1e1-4d2e-b422-e2ce6f0307ce/","title":"Cillian Murphy","type":"ACTOR"},"Favorites:{\"uuid\":\"90314ea7-502a-49e4-955e-4e885b10f232\"}":{"__typename":"Favorites","uuid":"90314ea7-502a-49e4-955e-4e885b10f232","photoUrl":"https://ucarecdn.com/526b07b9-b1e1-4d2e-b422-e2ce6f0307ce/","title":"Man's Search for Meaning","type":"BOOK"},"Favorites:{\"uuid\":\"8e818ec5-f06a-4a46-a87d-416f465c3df3\"}":{"__typename":"Favorites","uuid":"8e818ec5-f06a-4a46-a87d-416f465c3df3","photoUrl":"https://ucarecdn.com/526b07b9-b1e1-4d2e-b422-e2ce6f0307ce/","title":"Waiting for Godot","type":"PLAY"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"def4e1b4-3181-4d5a-8bac-317a3a49fc9b\"}":{"__typename":"DeepDives","uuid":"def4e1b4-3181-4d5a-8bac-317a3a49fc9b","content":"\u003cp\u003eFrom a young age, I've been driven to advance cancer research, a goal inspired by witnessing several family members battle the disease. Since declaring at age eight that I wanted to cure cancer, I've matured in my approach, grounding my aspirations in practical outcomes rather than the pursuit of accolades. With over 200 hours dedicated to researching the link between cancer and nutrition, I am committed to continuing this work beyond college, aiming to contribute to the field no matter what my occupation may be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"3de9f64f-b285-4c1a-bdda-fdd9e6610685\"}":{"__typename":"DeepDives","uuid":"3de9f64f-b285-4c1a-bdda-fdd9e6610685","content":"\u003cp\u003eThroughout high school, I received numerous awards, but none were as gratifying as a phone call I received from an old friend. We initially connected over video games, an escape for him as he struggled with bullying and making friends in middle school. I promised to be there for him whenever he needed, a vow I kept long after we first met online. Years later, he called to tell me that my support had literally saved his life. Unintentionally, I had made a significant impact on someone's life; realizing that I could do so without deliberate intent was the real reward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8ba11fe1-50c6-4499-b377-4e302eef927c\"}":{"__typename":"DeepDives","uuid":"8ba11fe1-50c6-4499-b377-4e302eef927c","content":"\u003cp\u003eAlways do YOUR best. Focus on the process rather than the outcome. Remember, everyone's 'best' looks different. As long as you're giving your all, the results will naturally follow. Keep putting in the effort and you'll see the rewards.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0705b77b-7e46-414f-92ee-8a4ad3ebb7ed\"}":{"__typename":"DeepDives","uuid":"0705b77b-7e46-414f-92ee-8a4ad3ebb7ed","content":"\u003cp\u003eI believe it's essential for everyone to engage in a service-oriented job or activity at some point. Regardless of one's field, the ability to communicate effectively and cater to individual needs is invaluable. Additionally, I've discovered that teaching not only helps others learn but also deepens my own understanding of the subject. I look forward to learning from you, my mentees, just as much as I hope to teach you. Having had a supportive big brother myself, I would be deeply honored to provide that same level of support to someone else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"ccc6edcf-e29b-4747-b5a1-70ccf8024e0b\"}":{"__typename":"School","uuid":"ccc6edcf-e29b-4747-b5a1-70ccf8024e0b","name":"Pomona College","city":"Claremont","type":"COLLEGE","state":"California","country":"United States","zip":"91711"},"Education:{\"uuid\":\"4402484a-7c37-4327-9193-ed52a5bf7ac1\"}":{"__typename":"Education","uuid":"4402484a-7c37-4327-9193-ed52a5bf7ac1","school":{"__ref":"School:{\"uuid\":\"ccc6edcf-e29b-4747-b5a1-70ccf8024e0b\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Chemistry","degree":"Undergraduate"},"School:{\"uuid\":\"238e720b-60ea-470a-a642-cda124d9c6ff\"}":{"__typename":"School","uuid":"238e720b-60ea-470a-a642-cda124d9c6ff","name":"Vistamar School","city":"El Segundo","type":"HIGH","state":"California","country":"United States","zip":"90245"},"Education:{\"uuid\":\"83724486-d9f5-49c3-8ea4-bf79653430e4\"}":{"__typename":"Education","uuid":"83724486-d9f5-49c3-8ea4-bf79653430e4","school":{"__ref":"School:{\"uuid\":\"238e720b-60ea-470a-a642-cda124d9c6ff\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"dc97990c-6c54-4fba-b323-1b0cf9e66261\"}":{"__typename":"MentorPublicProfile","uuid":"dc97990c-6c54-4fba-b323-1b0cf9e66261","displayName":"Duncan R.","slug":"duncan-roth","biography":"\u003cp\u003eDuncan is a rising junior at Pomona College, majoring in chemistry. An AP chemistry class in high school sparked his interest in the field, leading him to co-author a chemistry book and establish a peer tutoring program. He has also conducted research at a UCLA lab, focusing on super-hard materials. At Pomona, Duncan has taken several advanced chemistry courses and plans to attend medical school to earn his MD/PhD.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHis proficiency in Environmental Chemistry led to an invitation to serve as a teacher’s assistant. Currently, he is exploring organic chemistry and conducting independent research on the link between nutrition and cancer, which has been an interest since high school, when he acquired a certificate in plant-based nutrition from Cornell University. Duncan has over four years of experience tutoring AP Chemistry and enjoys helping students excel in science and improve their writing skills, drawing from his background in AP Literature and AP Language.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside academics, Duncan is passionate about golf, fitness, and personal training. His personal journey overcoming Complex Regional Pain Syndrome (CRPS) has inspired his interest in health and medicine, leading him to pursue holistic medicine. Duncan is eager to work with students at Curious Cardinals, promising a fun and enriching learning experience regardless of the subject.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eP.S. Duncan prides himself as someone who is a talented nickname creator. Ask him for a unique name at any time!\u003c/p\u003e","teachingVideoPlaybackId":"79OK6eE1lWb02A01OLnI3V9CTwxlolgrfmwnTfteL01XJU","teachingVideoDescription":null,"gre
