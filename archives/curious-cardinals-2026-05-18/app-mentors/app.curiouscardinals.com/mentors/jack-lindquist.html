xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ca09e721-9da3-41b4-91c4-37b385db4739\"}":{"__typename":"DeepDives","uuid":"ca09e721-9da3-41b4-91c4-37b385db4739","content":"\u003cp\u003eI feel lucky to have had mentors who helped me grow in ways that I could not have done by myself. Whether it was my parents, a teacher, or an older teammate, mentors have taken many forms at different parts of my life, and I always strive to give back that same wisdom I received. Mentorship excites me because I get to help others learn from mistakes I've made. I want to help give others the resources necessary to point them in the right direction so they can realize their potential and pursue their passions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bfae5e52-f32a-45b1-a38d-423d7e2b7b38\"}":{"__typename":"DeepDives","uuid":"bfae5e52-f32a-45b1-a38d-423d7e2b7b38","content":"\u003cp\u003eBefore going to college, I knew I was interested in math and using it to understand how the world works. I took statistics and physics classes, but my favorite was my senior-year economics course. We learned economic theory and used it to analyze current events and case studies, and my teacher was a fantastic mentor that helped me grow outside of the classroom. When I graduated high school, I knew that I wanted to continue studying economics because it gave me the tools to think critically and make more informed financial, ethical, and day-to-day decisions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"215aac98-ecf3-49dc-86fd-23bdd407d2fa\"}":{"__typename":"DeepDives","uuid":"215aac98-ecf3-49dc-86fd-23bdd407d2fa","content":"\u003cp\u003eI would tell my younger self that it is okay to not have everything figured out. In school, I was interested in many different subjects such as math, statistics, physics, and economics but didn't know how to direct my passion into something real. It wasn't until I started talking to people who understood me and had been through the process before that I figured out how to take the next steps. This was especially true when I was applying to college. Brainstorming with my parents, teachers, and others who were close to me helped with weaving my academics and extracurriculars into a story that showed my love for learning. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b9f01f1e-771f-4d9c-a41e-854d2b502c3e\"}":{"__typename":"DeepDives","uuid":"b9f01f1e-771f-4d9c-a41e-854d2b502c3e","content":"\u003cp\u003eOne of my major life goals is to complete an Ironman. I have always been a runner, competing in cross country in middle and high school, and training for races has been a great way to get closer to my friends. Training has also taught me how to make a plan for achieving a goal over the long-term. A few months ago, my friends and I did the Hermosa Beach Triathlon which was a major milestone for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"b8a75fd2-20b8-4e24-b0e1-bc693dcbf4e8\"}":{"__typename":"School","uuid":"b8a75fd2-20b8-4e24-b0e1-bc693dcbf4e8","name":"Chadwick School","city":"Palos Verdes Peninsula","type":"HIGH","state":"California","country":"United States","zip":"90274"},"Education:{\"uuid\":\"e6fd7334-76de-44e9-ba91-3b1553b79223\"}":{"__typename":"Education","uuid":"e6fd7334-76de-44e9-ba91-3b1553b79223","school":{"__ref":"School:{\"uuid\":\"b8a75fd2-20b8-4e24-b0e1-bc693dcbf4e8\"}"},"startYear":"2021","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"c52ff64a-9ddd-42ab-baab-cc106be3b743\"}":{"__typename":"Education","uuid":"c52ff64a-9ddd-42ab-baab-cc106be3b743","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"6a7b1d73-3473-426d-9661-d2569f6a6317\"}":{"__typename":"MentorPublicProfile","uuid":"6a7b1d73-3473-426d-9661-d2569f6a6317","displayName":"Jack L.","slug":"jack-lindquist","biography":"\u003cp\u003eHi! My name is Jack Lindquist, and I am a sophomore at Cornell University's College of Arts \u0026amp; Sciences majoring in Economics with minors in Business and Data Science. I graduated from Chadwick School in Los Angeles, and I'm excited to bring everything I've learned inside and outside the classroom to students who love to learn and want to turn their passion into reality.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI came into high school curious about many different subjects: math, physics, statistics, and eventually economics. For a while, I didn't know how to turn that curiosity into direction. It wasn't until I started having real conversations with mentors (my parents, teachers, older classmates, and others) that I figured out how to connect the dots and take the next steps. That experience is a big part of why I love mentoring. I know what it feels like to have a lot of potential and not know where to direct it, and I want to be the person who helps you find your path.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Cornell, I've taken that same energy and channeled it into the community. As an Arts \u0026amp; Sciences Ambassador, I serve on student panels for prospective students, advise first-years through their transition to college, and have sat on the selection committee for the program. I was also elected by my peers as one of six student representatives on Cornell's Academic Integrity Hearing Board where I review cases and apply careful, structured analysis to reach fair verdicts. On top of that, I'm on the Marketing Subteam for the Cornell Economics Society, where I help design outreach strategies and manage communications to grow interest in economics across campus.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI work with students across a wide range of academic subjects and passion projects, including:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMath:\u003c/strong\u003e Pre-Algebra through Calculus, Statistics, and beyond\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScience:\u003c/strong\u003e Biology, Physics, Intro Computer Science/Python\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBusiness \u0026amp; Finance:\u003c/strong\u003e Economics, Finance/Investing, Business Startups/Entrepreneurship, and more\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHumanities \u0026amp; Writing:\u003c/strong\u003e College Essay Writing and Pathfinding, History, English, Spanish\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOther Creative Projects \u0026amp; Media:\u003c/strong\u003e Social Media Management, Public Speaking, Sports Analytics, Web Design\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic Coaching \u0026amp; Executive Functioning:\u003c/strong\u003e Study skills, time management, organization, and building habits that actually stick\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you're trying to ace a tough class, launch a passion project, or figure out how to tell your story for college applications, I can help you build a plan and follow through on it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I'm qualified\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eBeing good at something and being able to teach it are two different skills, and I take both seriously. Through being an Arts \u0026amp; Sciences Ambassador, I've helped dozens of students think through their transition to college and find their footing. As a peer mentor informally throughout high school and college, I've talked friends through everything from essay drafts to study strategies to figuring out what they actually want to do. My brother is also a junior in high school, and I have been helping him brainstorm and navigate the college application process. I approach every session with patience, structure, and a genuine interest in what \u003cem\u003eyou\u003c/em\u003e are working toward.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA session with me might look like:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking down a concept you've been stuck on using clear, step-by-step reasoning and real world applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorkshopping a college essay until it actually sounds like you\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a realistic and long-term roadmap for a passion project, week by week\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTalking through your goals and figuring out what your next move should be\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eOutside the classroom\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I'm not studying, I'm in the gym with my friends, on the golf course, or training for my next race. I am also a big reader (Andy Weir's \u003cem\u003eThe Martian\u003c/em\u003e is my favorite), and you'll usually find me listening to Bob Marley or watching a good comedy or action movie.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you're ready to grow, get organized, and start turning your dreams into reality, I would love to work with you! \u003cstrong\u003eLet's build something great together.\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"YMvzgrWmoNdgLNJPo6qiIu53lmQBT74ii1oF5B1a5rQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ca09e721-9da3-41b4-91c4-37b385db4739\"}"},{"__ref":"DeepDives:{\"uuid\":\"bfae5e52-f32a-45b1-a38d-423d7e2b7b38\"}"},{"__ref":"DeepDives:{\"uuid\":\"215aac98-ecf3-49dc-86fd-23bdd407d2fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9f01f1e-771f-4d9c-a41e-854d2b5
