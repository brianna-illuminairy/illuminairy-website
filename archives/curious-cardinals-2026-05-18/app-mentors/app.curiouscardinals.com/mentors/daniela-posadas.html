xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cd3b0ab8-3bab-4d04-b2da-fff526d64a1d\"}":{"__typename":"Favorites","uuid":"cd3b0ab8-3bab-4d04-b2da-fff526d64a1d","photoUrl":"https://ucarecdn.com/7a4773dc-6430-4942-a643-8c2187640126/","title":"SOS by SZA","type":"ALBUM"},"CausesSupported:{\"uuid\":\"dd93758b-0f90-4e13-bbcb-2b542e91f9b6\"}":{"__typename":"CausesSupported","uuid":"dd93758b-0f90-4e13-bbcb-2b542e91f9b6","name":"World Health Organization (WHO)","description":"\u003cp\u003eWorking to promote health, keep the world safe and serve the vulnerable.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/1ec662c8-773d-4198-890c-5d7075674a16/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9273b8d2-cb22-4efd-8d4c-0512c54b2566\"}":{"__typename":"DeepDives","uuid":"9273b8d2-cb22-4efd-8d4c-0512c54b2566","content":"\u003cp\u003eDon't be afraid to dream big!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d91582bc-1e37-48e3-b8d2-e5118b9ef6f3\"}":{"__typename":"DeepDives","uuid":"d91582bc-1e37-48e3-b8d2-e5118b9ef6f3","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to help save children’s lives while expanding access to quality education and healthcare for those growing up in underserved communities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"44215cbe-df0a-404f-9e4d-3bfecff4cb4a\"}":{"__typename":"DeepDives","uuid":"44215cbe-df0a-404f-9e4d-3bfecff4cb4a","content":"\u003cp\u003eI chose my major because I love how interdisciplinary the Human Biology program at Stanford is. It allows me to take the STEM courses I’m passionate about while also exploring the social and humanities aspects of healthcare. I’m excited by a program that connects biology with ethics, policy, and lived experience, because real-world health problems cannot be solved from a single perspective.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"9419434f-0bd3-4473-b8e3-c6aa90af5b07\"}":{"__typename":"DeepDives","uuid":"9419434f-0bd3-4473-b8e3-c6aa90af5b07","content":"\u003cp\u003eAs a high school student, I was always busy. I was active in the marching band, pre-professional clubs, leadership committees, and volunteering, all while working as a barista at Starbucks. I enjoyed the feeling of always having something to do, but I especially valued finding meaningful ways to spend my time. I devoted many hours to planning public health campaigns and providing community service opportunities for students at my high school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"6f1983b6-8a39-4edc-8895-2e16800e26e7\"}":{"__typename":"School","uuid":"6f1983b6-8a39-4edc-8895-2e16800e26e7","name":"Chapel Hill High School","city":"Douglasville","type":"HIGH","state":"Georgia","country":"United States","zip":"30135"},"Education:{\"uuid\":\"753a1ba3-765f-4193-971b-d16013574e10\"}":{"__typename":"Education","uuid":"753a1ba3-765f-4193-971b-d16013574e10","school":{"__ref":"School:{\"uuid\":\"6f1983b6-8a39-4edc-8895-2e16800e26e7\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b5241d38-6f5a-468e-90f0-199d6041b417\"}":{"__typename":"Education","uuid":"b5241d38-6f5a-468e-90f0-199d6041b417","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"276e4e7f-d7d6-4092-ae49-e335aa257378\"}":{"__typename":"MentorPublicProfile","uuid":"276e4e7f-d7d6-4092-ae49-e335aa257378","displayName":"Daniela P.","slug":"daniela-posadas","biography":"\u003cp\u003eHi everyone! My name is Daniela Posadas, and I am a first-generation undergraduate student at Stanford University studying Chemistry and Human Biology. I was born and raised in Atlanta, Georgia, and my parents are from Michoacán, Mexico, and Medellín, Colombia. I aspire to become a pediatric oncologist while leading my own research lab and biotech startup. This vision is shaped by my deep commitment to global health and by my personal experiences as the eldest daughter from a low-income family.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a first-generation student, I have experienced firsthand the power of knowledge, support, and grit. I know how these three forces can completely change the trajectory of a child's life. At the same time, I know what it feels like to have big ideas but not know where to start. I have also seen how transformative it can be when even one person truly believes in your dreams. That is why I am here.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy specialization is in Passion Project Mentorship, Biomedical Research, Pre-Med Exploration, and STEM Academic Support in Chemistry \u003c/strong\u003efor middle and high school students. I work with students who are curious about biology, chemistry, medicine, oncology, public health, biotechnology, and social impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eI help students with:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDiscovering and refining their academic and personal interests\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming and narrowing passion project ideas\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTurning ideas into concrete project plans or research questions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLearning how to read and understand scientific papers\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDesigning experiments or project frameworks\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConducting basic data analysis or literature synthesis\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating presentations, posters, or written reports\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding timelines, milestones, and achievable goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStrengthening study strategies for STEM classes\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDeveloping confidence in explaining complex ideas\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDeveloping and launching public health campaigns\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eUnderstanding chemistry and applying it in the real-world. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThrough Curious Cardinals, I hope to empower young teenagers to discover their passions, build confidence in their abilities, and design projects that give back to their communities in personal and meaningful ways. Whether I’m helping brainstorm a passion project, outlining an experimental design, or breaking down a complex chemistry concept, my goal is always to uplift and support curious young minds while getting to know them as individuals. Ultimately, I am here to help students bring their ideas to life and to encourage them to become confident changemakers.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cbr\u003eTo support this, I bring experience in:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWet-Lab Oncology Research\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCommunity Health Research\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming and Launching Public Health Initiatives\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHospital-Based Patient Advocacy\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eChemistry Tutoring\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have conducted cancer immunotherapy research at the Winship Cancer Institute at Emory University, where I studied CAR-T cell engineering and gained hands-on experience with cell culture, viral transduction, and flow cytometry. I have also interned at Grady Memorial Hospital’s Heart and Vascular Center, where I worked closely with patients, physicians, and nurse practitioners, and conducted research on social determinants of health and cardiovascular disease in underserved communities.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition, I have led and placed in statewide and international public health competitions through Georgia HOSA, earning 3rd place at the Georgia HOSA State Conference and a Public Health Excellence Award at the International HOSA Conference for community-based health initiatives.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLastly, as someone who has navigated academic challenges myself, I understand the feeling of working so hard towards a goal yet not seeing the anticipated results. This is why I prioritize patience, empathy, clarity, and encouragement in my mentoring style. I support students not only with content, but with organization, goal-setting, and self-belief. My goal is for every student I work with to feel seen, capable, and excited about what they can build.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy cooking, traveling, playing music, strength training, journaling, and reading books like\u0026nbsp;\u003cem\u003eJust Mercy\u003c/em\u003e,\u0026nbsp;\u003cem\u003eAtomic Habits\u003c/em\u003e, and\u0026nbsp;\u003cem\u003eBest Self\u003c/em\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you have big ideas, too many ideas, or no clue where to begin, it would be my pleasure to help guide you and strategize a proactive plan to bring these ideas to life :)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Lq9VBMhFWmK6YZIPBY5ODRMSBhQa6PoP01NFsK9FnnxA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am proud for advocating for myself and pursuing higher education at a top-research university!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"cd3b0ab8-3bab-4d04-b2da-fff526d64a1d\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"dd93758b-0f90-4e13-bbcb-2b542e91f9b6\"}"}],"major":"Human Biology","deepDi
