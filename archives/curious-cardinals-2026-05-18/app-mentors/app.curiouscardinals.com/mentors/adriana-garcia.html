xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ddf79da6-3b12-4d5d-8ebc-e51e468be1ba\"}":{"__typename":"Favorites","uuid":"ddf79da6-3b12-4d5d-8ebc-e51e468be1ba","photoUrl":"https://ucarecdn.com/d332b147-a80e-4347-ae70-3499a21101d2/","title":"Cristiano Ronaldo","type":"ATHLETE"},"Favorites:{\"uuid\":\"5c494c21-c099-4ca0-ad96-1c89129dfb60\"}":{"__typename":"Favorites","uuid":"5c494c21-c099-4ca0-ad96-1c89129dfb60","photoUrl":"https://ucarecdn.com/b307d5a8-c978-4230-9acf-cc117240d2c8/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"7f16ca93-c626-4ad2-b532-1d3a8f7a4a17\"}":{"__typename":"Favorites","uuid":"7f16ca93-c626-4ad2-b532-1d3a8f7a4a17","photoUrl":"https://ucarecdn.com/62962bca-4a2b-4dfd-85df-47b0ee0246b2/","title":"Softcore","type":"SONG"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"136502e3-2eb1-433d-bb50-f150d737dca0\"}":{"__typename":"DeepDives","uuid":"136502e3-2eb1-433d-bb50-f150d737dca0","content":"\u003cp\u003eIn my spare time I love reading, spending time with my friends, baking banana bread, and playing with my dog!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"78d9468c-53c2-4708-af64-a56404143b31\"}":{"__typename":"DeepDives","uuid":"78d9468c-53c2-4708-af64-a56404143b31","content":"\u003cp\u003eMentorship matters to me because it is something that I wish I had when I was in high school applying to colleges. I was lucky to find my path to Cornell, but some of my peers didn't have the same luck due to the lack of mentorship. I want to be able to be that person a student comes up to and asks all the questions they have. I want them to know they can aim higher. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"5947396a-82a8-43bc-b0f9-fec3bf4880ae\"}":{"__typename":"DeepDives","uuid":"5947396a-82a8-43bc-b0f9-fec3bf4880ae","content":"\u003cp\u003eI am extremely proud of having gotten into Cornell University. As a first generation student, I never thought I would get that far, but now I realize, I can do anything I set my mind to. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"cfedd874-1ebf-4293-855a-9b8a0c19a4ef\"}":{"__typename":"DeepDives","uuid":"cfedd874-1ebf-4293-855a-9b8a0c19a4ef","content":"\u003cp\u003eMy greatest source of motivation are my parents. They have worked hard every day to make sure that my brother and I didn't lack anything, that we had a good education, and that we always stayed true to ourselves. I want to repay them for all their efforts.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"d571bc6c-c3c3-4a37-8c50-5b9445f97f78\"}":{"__typename":"School","uuid":"d571bc6c-c3c3-4a37-8c50-5b9445f97f78","name":"Cutler Bay Senior High School","city":"Cutler Bay","type":"HIGH","state":"Florida","country":"United States","zip":"33189"},"Education:{\"uuid\":\"226f19aa-386f-4f4c-afe2-065e993f8918\"}":{"__typename":"Education","uuid":"226f19aa-386f-4f4c-afe2-065e993f8918","school":{"__ref":"School:{\"uuid\":\"d571bc6c-c3c3-4a37-8c50-5b9445f97f78\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"d9e72580-5e58-44fc-9ad8-f7b54c9f6312\"}":{"__typename":"Education","uuid":"d9e72580-5e58-44fc-9ad8-f7b54c9f6312","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2025","major":"Applied Economics and Management, Concentration in Strategy","degree":null},"MentorPublicProfile:{\"uuid\":\"6c8b3b24-c9cf-400f-b8cd-cee3e731f814\"}":{"__typename":"MentorPublicProfile","uuid":"6c8b3b24-c9cf-400f-b8cd-cee3e731f814","displayName":"Adriana G.","slug":"adriana-garcia","biography":"\u003cp\u003eHey! I’m Adriana, a recent graduate of Cornell University’s Dyson School of Applied Economics and Management with a concentration in Business Strategy and Marketing. Before Cornell, I spent two years in the Honors College at Miami Dade College, and I transferred in 2023. Having navigated the process myself, I understand how exciting, confusing, and overwhelming big academic decisions can feel, and I love helping students turn their ideas, interests, and curiosity into real projects they can be proud of.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m especially passionate about entrepreneurship, leadership, and creative strategy. Right now, I mentor community college students preparing to transfer to highly selective universities, where I support them with brainstorming, essay writing, organization, and application strategy. I’m also actively building my own creative work and personal portfolio, including writing and digital projects, which keeps me closely connected to the same creative process I guide students through. I’m constantly experimenting, iterating, and learning, and I bring that mindset into my work with students.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eProjects we can do\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI help students design hands-on projects that go beyond the classroom and create real impact, including:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePortfolio building:\u003c/strong\u003e creating a one-page personal brand site, a career-exploration mini-portfolio, or a creative portfolio (writing, design, photography, or video).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLeadership \u0026amp; impact projects:\u003c/strong\u003e launching a solve-a-problem initiative such as a tutoring program, school campaign, or community project with clear goals and measurable results.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eInternships \u0026amp; applications:\u003c/strong\u003e building an organized internship search system, polishing resumes, crafting personal statements, and creating realistic timelines.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLaunching organizations:\u003c/strong\u003e starting a student club or peer mentorship program from scratch, defining a mission, roles, and a first event.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eContent \u0026amp; audience building:\u003c/strong\u003e planning a short-form content series, podcast, or niche newsletter, plus a sustainable posting and engagement plan.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eMy mentorship style\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI focus on clarity, confidence, and creativity. I’m also very mindful that motivation isn’t constant. I’m especially thoughtful about supporting students with ADHD, attention challenges, or \"low-energy days” by designing flexible plans that work with their brains, not against them. In sessions, we break big ideas into manageable steps, create visual plans, and build systems that help students keep momentum even on tough days. My goal is always to help students build something that feels authentic to them, not just impressive on paper.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eParents:\u003c/strong\u003e I strive to be both a strong role model and a warm, supportive mentor your child enjoys working with.\u003cbr\u003e\u003cstrong\u003eStudents:\u003c/strong\u003e I’m here to hype your ideas, help you get organized, and actually make things happen with you.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eA few fun facts\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside of academics, I’m a huge fan of music, creative writing (I started a blog), travel, reading, learning languages, and trying new coffee shops. I’m fascinated by storytelling in all forms and thinking about how young people can build meaningful lives, not just impressive resumes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d love to work with you and help you create something bold, creative, and truly your own.\u003c/p\u003e","teachingVideoPlaybackId":"EFSJWyF4b017EyxHGfBD6xGxcMZoERfPhSQQiPMDhpTk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ddf79da6-3b12-4d5d-8ebc-e51e468be1ba\"}"},{"__ref":"Favorites:{\"uuid\":\"5c494c21-c099-4ca0-ad96-1c89129dfb60\"}"},{"__ref":"Favorites:{\"uuid\":\"7f16ca93-c626-4ad2-b532-1d3a8f7a4a17\"}"}],"causesSupported":[],"major":"Applied Economics and Management, Concentration in Strategy","deepDives":[{"__ref":"DeepDives:{\"uuid\"
