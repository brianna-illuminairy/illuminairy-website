xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bfd7a3e9-8696-4688-8b86-fd2d972dffed\"}":{"__typename":"Favorites","uuid":"bfd7a3e9-8696-4688-8b86-fd2d972dffed","photoUrl":"https://ucarecdn.com/c381bd23-7420-47c0-9ec0-fc0de7036427/","title":"The Art of Loving","type":"ALBUM"},"Favorites:{\"uuid\":\"52cc3b83-8990-4f42-bcb4-5dc89d3ff3d1\"}":{"__typename":"Favorites","uuid":"52cc3b83-8990-4f42-bcb4-5dc89d3ff3d1","photoUrl":"https://ucarecdn.com/1c5b3800-8bb8-472c-83fb-51aae6a5ad3c/","title":"Beloved","type":"BOOK"},"Favorites:{\"uuid\":\"678de921-5851-4257-ba49-e476a7e514da\"}":{"__typename":"Favorites","uuid":"678de921-5851-4257-ba49-e476a7e514da","photoUrl":"https://ucarecdn.com/d7e5079c-376b-42ef-9b5e-c7c5d5f8b999/","title":"My Hometown, New York City ","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"45e97769-87db-4d2f-a3bf-9ffa45c63641\"}":{"__typename":"DeepDives","uuid":"45e97769-87db-4d2f-a3bf-9ffa45c63641","content":"\u003cp\u003eEveryday, I encounter less and less people who are actually interested and passionate about going to school everyday to learn. Perhaps it is a result of the endless feeling of the 8 hours we are expected to sit in classes or the basic structure of teaching that educators often rely on or the piles of homework we take home everyday. Regardless of the cause, one thing is clear to me: something needs to change! Curious Cardinal mentorship gives students the opportunity to see that learning can actually be fun, interesting, and multifaceted. Once they see this, I am confident that finding their passions will be so much easier and they will value and love learning. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"aec381d0-1512-4f29-aa6d-539c951beedc\"}":{"__typename":"DeepDives","uuid":"aec381d0-1512-4f29-aa6d-539c951beedc","content":"\u003cp\u003eWhen you first meet me, it might not be apparent to you how much I love talking about my current hyperfixations and obsessions. However, as we get to know one another I will definitely tell you all about my absolute love for dystopian worlds and debate you on which is best. I will also implore you to try my latest recipe, which is probably a brownie or cookie. I love sharing my interests with others, and learning theirs. I look forward to hearing my mentees' during our sessions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"5f8d052a-3849-4024-b712-7b0b10c10177\"}":{"__typename":"DeepDives","uuid":"5f8d052a-3849-4024-b712-7b0b10c10177","content":"\u003cp\u003eIn Inside Out, the main protagonist, Riley, has islands that represent the aspects of her life. One of my biggest islands is definitely my family. The large size is certainly in part from the sheer number of aunts, uncles, and cousins I have, but also from the relationships I have with everyone. Everyday, I strive to make them proud by working hard and exemplifying virtues of love, kindness, and giving.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"04af0ed8-cc62-445b-8eba-48f993f163b7\"}":{"__typename":"DeepDives","uuid":"04af0ed8-cc62-445b-8eba-48f993f163b7","content":"\u003cp\u003eThough this is not one thing, one of my biggest dreams is to travel to every continent. I think the world has so much to offer in culture and history, and I want to experience it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"5f41d4ea-47f9-4577-9143-b2b49b3baf15\"}":{"__typename":"School","uuid":"5f41d4ea-47f9-4577-9143-b2b49b3baf15","name":"Trinity SchooI","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10024"},"Education:{\"uuid\":\"91e127e0-aa85-4065-b63d-cb8da1c6f63b\"}":{"__typename":"Education","uuid":"91e127e0-aa85-4065-b63d-cb8da1c6f63b","school":{"__ref":"School:{\"uuid\":\"5f41d4ea-47f9-4577-9143-b2b49b3baf15\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"b5b23aee-735a-4e11-9d08-c16e12e181fb\"}":{"__typename":"Education","uuid":"b5b23aee-735a-4e11-9d08-c16e12e181fb","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"International and Public Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"4d7fcb0d-8455-4b5a-b284-07b048fdefb0\"}":{"__typename":"MentorPublicProfile","uuid":"4d7fcb0d-8455-4b5a-b284-07b048fdefb0","displayName":"Tyler T.","slug":"tyler-timmers","biography":"\u003cp\u003eHi Everyone! My name is Tyler Timmers and I am currently a freshman at Brown University. I am concentrating in International and Public Affairs. I am devoted to helping students of all ages become more passionate about what they are learning, especially in English and History, and turn ideas into realities through projects that they can be proud of!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Academic Interests\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eDuring high school, I became very interested in \u003cstrong\u003epublic policy, journalism, and human rights\u003c/strong\u003e. I also discovered passions for \u003cstrong\u003eworking with children and event planning\u003c/strong\u003e. During my first semester at Brown, I have already pursued these interests by:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBrown Refugee Youth and Enrichment Tutoring: \u003c/strong\u003eI volunteer 3 hours of my time each week to tutor an eight-year-old Afghani refugee in subjects such as math, reading and writing. This helps support her confidence in learning and discover her academic passions.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBrown Daily Herald (BDH) Staff Writer\u003c/strong\u003e: I write articles for the BDH, specifically on news related to student life and local Providence life. This requires me to build off of skills, such as interviewing, researching, drafting, and editing, that I learned writing for my high school paper and as a student of the Yale Daily News Summer Journalism Program and School of the New York Times.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCamp Kesem Rhode Island Coordinator: \u003c/strong\u003eCamp Kesem is a national organization that provides free summer camps, day programs, and virtual meet-ups for youth facing a parent’s cancer. The Rhode Island chapter's annual Make the Magic fundraiser is an important opportunity to raise money to fund camp operations. Working with three other coordinators, I was chosen to plan Make The Magic 2026. This means I am tasked with picking a venue, finding sponsors, organizing catering, inviting guests, and more.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am dedicated to helping students define and learn about their interests, through academic mentorship, and provide them with opportunities to see their interests materialize through passion project sessions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I Can Help You\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHumanities Subject Mentorship\u003c/strong\u003e (ie: learning about history through music and movies, writing research papers, writing news articles, making an argument, reading comprehension)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege Application Readiness Projects \u003c/strong\u003e(ie: applying to internships and programs that align with your passions, academic preparedness, etc)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion Projects \u003c/strong\u003e(ie: podcast production, starting a club, planning a fundraiser, public projects that work towards solving social justice issues, starting a blog, writing a book, etc)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Qualifications To Work With You\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTrinity School NYC Discovery Day Camp Counselor (Summer 2025)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eNew York Historical Society DiMenna Children's Museum Family Programs Intern (October 2024 - July 2025)\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCreated and ran a Sunday Story Time, where I sang a name song, read \u003cem\u003eThe Polar Express\u003c/em\u003e, and taught a craft\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAssisted family programs, where I guided children ages 2-12 through many arts and crafts\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTrinity School NYC Dean Department Peer Leader (September 2024 - May 2025)\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCreated engaging lesson plans, which combined slideshows, games, and discussion questions, to educate ninth grade students every week on topics such as social media, peer pressure, student activities\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eManhattan School for Children Volunteer\u003cem\u003e \u003c/em\u003e(September 2024 - May 2025)\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eSupported Kindergarten teachers by helping students use blocks to learn addition and subtraction, reading books with students, and drawing with students during recess\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTrinity School NYC Play Pals Volunteer (September 2021 - May 2025)\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCo-founded a program to help K-4 classes learn to include all students into sports games, and other structured activities, during recess\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough so much experience working with children of all ages, I have learned the importance of balancing fun and work when teaching. I look forward to prioritizing this balance in my sessions!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat To Expect In A Session\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eGetting to know one another\u003c/strong\u003e, especially through icebreakers, so our work together is more genuine and connected, and students feel comfortable coming to me with questions and concerns\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eClearly \u003cstrong\u003eidentifying goals\u003c/strong\u003e, so that our work can be focused and I can fully support you to the best of my ability\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLearning \u003cstrong\u003etime management\u003c/strong\u003e by creating a roadmap and breaking down steps for accomplishing our goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFun activities, games and exercises\u003c/strong\u003e to help my student develop their passion and see their dreams come true\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOpen dialogue and conversation\u003c/strong\u003e to engage with our topic\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Other Interests\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI love to cook and bake, especially with my family. My favorite recipe at the moment is fudge brownies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI enjoy playing goalie in lacrosse and swimming, at the pool or beach. I also love being outside and exploring nature with my friends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love watching movies. My favorites are \u003cem\u003eCrazy Rich Asians\u003c/em\u003e, \u003cem\u003eMamma Mia \u003c/em\u003eand \u003cem\u003eIts a Wonderful Life\u003c/em\u003e. I also enjoy listening to music by Noah Kahan, Olivia Dean, Fleetwood Mac, and Lana Del Rey. When I have free time, I also love to read. My favorite books are \u003cem\u003eBeloved\u003c/em\u003e, \u003cem\u003eThe Inheritance Games\u003c/em\u003e, and \u003cem\u003eThe Catcher In The Rye\u003c/em\u003e. I am also obsessed with the Harry Potter and Hunger Games books.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eI am super excited to work with you, especially if you want to develop your passions, see your dreams become a reality, and become more confident in academics. I hope to hear from you soon!\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e- Tyler\u003c/p\u003e","teachingVideoPlaybackId":"wU1eMuvqlRcMq3iwmuT1Ijo602p4Kd01ZwNpXxTfuHScQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bfd7a3e9-8696-4688-8b86-fd2d972dffed\"}"},{"__ref":"Favorites:{\"uuid\":\"52cc3b83-8990-4f42-bcb4-5dc89d3ff3d1\"}"},{"__ref":"Favorites:{\"uuid\":\"678de921-5851-4257-ba49-e476a7e514da\"}"}],"causesSupported":[],"major":"International and Public Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"45e97769-87db-4d2f-a3bf-9ffa45c63641\"}"},{"__ref":"DeepDives:{\"uuid\":\"aec381d0-1512-4f29-aa6d-539c951beedc\"}"},{"__ref":"DeepDives:{\"uuid\":\"5f8d052a-3849-4024-b712-7b0b10c10177\"}"},{"__ref":"DeepDives:{\"uuid\":\"04af0ed8-cc62-445b-8eba-48f993f163b7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5e171aaf-f3b7-431f-a624-5c7369a045f6/-/preview/-/format/
