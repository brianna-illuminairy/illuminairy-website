xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e3366736-d309-4458-bc7f-fe1d09bc6785\"}":{"__typename":"Favorites","uuid":"e3366736-d309-4458-bc7f-fe1d09bc6785","photoUrl":"https://ucarecdn.com/a0e89527-5ea0-4eb8-900c-a63b5abddbb3/","title":"Hozier","type":"ARTIST"},"Favorites:{\"uuid\":\"8e7c8fc1-2186-44c6-8943-8590f69d4cd7\"}":{"__typename":"Favorites","uuid":"8e7c8fc1-2186-44c6-8943-8590f69d4cd7","photoUrl":"https://ucarecdn.com/473f80cf-2a5c-4ab6-b771-f14d0396b1cd/","title":"The Expanse (the whole series!)","type":"BOOK"},"Favorites:{\"uuid\":\"39b5f086-6f0a-4512-8189-6a61d9058bed\"}":{"__typename":"Favorites","uuid":"39b5f086-6f0a-4512-8189-6a61d9058bed","photoUrl":"https://ucarecdn.com/233af610-ebd1-49db-899a-e024b44be1bf/","title":"David Tennant","type":"ACTOR"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c7c675db-7068-4ea8-9aa1-87d68cb09cbc\"}":{"__typename":"DeepDives","uuid":"c7c675db-7068-4ea8-9aa1-87d68cb09cbc","content":"\u003cp\u003eApplied Physics and Chemistry might seem like a strange – and difficult –double major at first, but I've had my reasons for choosing it! The main reason is that I get an incredible range of experience between these majors. In Applied Physics I get experience with physics, and also biology (in the form of biophysics!). Chemistry gives me experience with chemistry, materials, and biology (in the form of biochemistry!). Between these, I can do  incredibly cool interdisciplinary research, where I get to combine concepts from a wide variety of fields that aren't usually combined to do cool stuff! For example, in my current research at Yale, I'm using  math from – diffusion and fluid dynamics – to inform the design of polymers made with chemistry, applied to a biological system.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"11fdf245-b1ac-4945-bc4f-3dc10b51b30d\"}":{"__typename":"DeepDives","uuid":"11fdf245-b1ac-4945-bc4f-3dc10b51b30d","content":"\u003cp\u003eMentorship is important to me because it's something I wish I had more of when I was in high school. I had a lot of ideas in high school – research and experiments for science, shows and performances for theater – but I was disorganized. Everything I tried to do got tangled up in itself and just ended up sputtering. I've had to figure out how to successfully self-guide a project smoothly from beginning to end in college, and I have – a lot! I've led teams, done research, and started several clubs. But mentorship matters to me because I want to be able to pass on these lessons to high schoolers like me – who have a ton of ideas and no idea where to go with them. Let's make something amazing!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"eff8fe2c-00a3-431e-a1e7-35a876c55687\"}":{"__typename":"DeepDives","uuid":"eff8fe2c-00a3-431e-a1e7-35a876c55687","content":"\u003cp\u003eMy dream job was to have my own science TV show, like Bill Nye or Neil deGrasse Tyson. As I've mentioned in some other parts of my profile, as well as science, I love both theater, and teaching. Getting to have my own show where I could teach the world about science would literally be a dream come true.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9b87d443-b91e-40fa-ab85-a4e06331c8e2\"}":{"__typename":"DeepDives","uuid":"9b87d443-b91e-40fa-ab85-a4e06331c8e2","content":"\u003cp\u003eIn my spare time, I love to create stuff. Largely, this involves music – I sing in several groups at Yale, and I compose, writing songs mostly for choir and acappella. But I also love to build things, and work with my hands – at Yale, I do metalworking, blacksmithing, glassblowing, and woodworking. I've made everything from jewelry to utensils to a miniature steam engine! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"4633a90c-0a64-436e-8947-fd72daf7b1d9\"}":{"__typename":"Education","uuid":"4633a90c-0a64-436e-8947-fd72daf7b1d9","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"7ba057a7-0966-4467-b762-74837ca4ac01\"}":{"__typename":"Education","uuid":"7ba057a7-0966-4467-b762-74837ca4ac01","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Applied Physics/Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"3d9e486c-c16f-4504-994d-9291e0276b8e\"}":{"__typename":"MentorPublicProfile","uuid":"3d9e486c-c16f-4504-994d-9291e0276b8e","displayName":"Everett T.","slug":"everett-tolbertschwartz","biography":"\u003cp\u003eHi! My name is Everett, and I'm a current senior at Yale studying Applied Physics and Chemistry as a double major. I'm also currently working on applying to graduate school so that I can pursue a Ph.D. in biophysical materials research! Biophysical materials is the process of using physics principles and math to create new materials that can interact with biological systems – usually for a medical goal. As an example, my current research at Yale is about creating mathematical models of the movement of endometriosis/HIV drugs in the body, and how to better deliver them to patients. I’m working on creating small polymer implants filled with medicine that harmlessly dissolve in your body over the course of \u0026gt;3 years!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve always been interested in science – in high school, I was a part of the science bowl team and a VEX robotics team lead, as well as doing research at UCLA in physical chemistry. I've also been teaching science for a long time – I’ve worked as a STEM tutor and mentor in various programs for almost a decade now, since I first started high school. Since then, I've designed chemistry experiments for Yale first-years, taught classes on making giant bubbles and the chemistry of food to high schoolers across New Haven, and demos with liquid nitrogen for students in Los Angeles, and helped students see globular clusters though telescopes in Idyllwild!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of research and science, I love singing and theater! I've done a lot of musical theater shows, and I sing baritone in the acapella group Mixed Company of Yale and the Yale Glee Club. I play piano, violin and mandolin, and I’ve been working on teaching myself guitar. I love playing and listening to folk music of all types, but my favorite is Celtic music! I also love hiking, and I’m always on the lookout for a new National Park to visit (I've gotten 19 so far, and Olympic National Park has been the best in my opinion!). When I have time, I also love travelling, and I’ve recently completed my goal of setting foot in 6 out of the 7 continents (I’ll get to Antarctica someday!). Finally, I also write poetry for fun, and have been published in several Yale literary magazines!\u003c/p\u003e","teachingVideoPlaybackId":"l8ILXjqmwUQAjRJu3Kt8m9e1rizBG8t8iAMwN45NiII","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e3366736-d309-4458-bc7f-fe1d09bc6785\"}"},{"__ref":"Favorites:{\"uuid\":\"8e7c8fc1-2186-44c6-8943-8590f69d4cd7\"}"},{"__ref":"Favorites:{\"uuid\":\"39b5f086-6f0a-4512-8189-6a61d9058bed\"}"}],"causesSupported":[],"major":"Applied Physics/Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c7c675db-7068-4ea8-9aa1-87d68cb09cbc\"}"},{"__ref":"DeepDives:{\"uuid\":\"11fdf245-b1ac-4945-bc4f-3dc10b51b30d\"}"},{"__ref":"DeepDives:{\"uuid\":\"eff8fe2c-00a3-431e-a1e7-35a876c55687\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b87d443-b91e-40fa-ab85-a4e06331c8e2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/801651fb-0b3e-4441-b81c-fbc81eb5d91e/-/preview/-/format/jpg/","https://ucarecdn.com/fb53bf94-089d-4a7b-9f8d-aa95b0fde0e9/-/preview/-/format/jpg/","https://ucarecdn.com/0b0252f6-22fb-49ee-b909-ed0bee07436e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4633a90c-0a64-436e-8947-fd72daf7b1d9\"}"},{"__ref":"Education:{\"uuid\":\"7ba057a7-0966-4467-b762-74837ca4ac01\"}"}],"hiredAt":"2025-09-24T03:20:47.148Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Spanish","Academic Coaching","Executive Function","College Essay Writing","Music","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Aviation / Aerospace"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"everett-tolbertschwartz\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3d9e486c-c16f-4504-994d-9291e0276b8e\"}"}}},"_sentryTraceData":"35c9dbc1e4154d3cb59c2ee2f3f45d40-be9fff874fd2e6f8-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=35c9dbc1e4154d3cb59c2ee2f3f45d40,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"everett-tolbertschwartz"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
