":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"10bceaaa-ab22-4e41-9835-6662040dc33d\"}":{"__typename":"DeepDives","uuid":"10bceaaa-ab22-4e41-9835-6662040dc33d","content":"\u003cp\u003eMentorship is extremely important to me because I know from firsthand experience how beneficial it can be to push us toward accomplishing our goals. Luckily, I have an older brother who has similar aspirations as I do, so he has acted as a mentor throughout my life as I embark on my journey toward becoming a physician. I am excited by the prospect of being able to help guide such bright and talented individuals in achieving their dreams!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"77f0a5ab-7bab-4cea-9811-20440e9450c9\"}":{"__typename":"DeepDives","uuid":"77f0a5ab-7bab-4cea-9811-20440e9450c9","content":"\u003cp\u003eA dream of mine that I hope to accomplish in my lifetime is to open a hospital in Sudan. Though I was born in Ireland and lived in the U.S. for most of my life, my Sudanese background has had a massive impact on my upbringing. Growing up, I was able to visit Sudan every other year to see family and friends, but as the country deteriorates from the effects of poverty, corruption, and war, it has become difficult to go back as often as I would like. To give back to the country that has had such a massive impact on my life, I hope to open a hospital that is accessible to everyone because I believe healthcare is a human right. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"a7904565-9d5c-4ff9-91f6-8453cdf81820\"}":{"__typename":"School","uuid":"a7904565-9d5c-4ff9-91f6-8453cdf81820","name":"Carl Sandburg High School","city":"Orland Park","type":"HIGH","state":"Illinois","country":"United States","zip":"60462"},"Education:{\"uuid\":\"44ac1526-be5f-45aa-a726-9ab53f6e8b01\"}":{"__typename":"Education","uuid":"44ac1526-be5f-45aa-a726-9ab53f6e8b01","school":{"__ref":"School:{\"uuid\":\"a7904565-9d5c-4ff9-91f6-8453cdf81820\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"fcf50954-1bb5-4f65-baf6-a157df7ed36f\"}":{"__typename":"Education","uuid":"fcf50954-1bb5-4f65-baf6-a157df7ed36f","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"4d96069f-e2c1-4522-9bf3-841cbafac36d\"}":{"__typename":"MentorPublicProfile","uuid":"4d96069f-e2c1-4522-9bf3-841cbafac36d","displayName":"Ahmed M.","slug":"ahmed-mahdi","biography":"\u003cp\u003e“Education is the passport to the future, for tomorrow belongs to those who prepare for it today.” - Malcolm X\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHello! My name is Ahmed Mahdi, and I am a recent graduate from Northwestern University with a major in Neuroscience and a minor in Psychology. With dreams of a career in the medical field, I am excited to start medical school at Northwestern Feinberg School of Medicine this coming fall!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs somebody who was born in Ireland to Sudanese parents and immigrated to the USA in 2010, I offer a unique perspective shaped by my upbringing and life experiences. This background has fueled my curiosity, driving me to seek knowledge not only in academic settings, but also through my daily interactions with others. I firmly believe that taking the time to understand one another on a personal level can contribute to making the world a better place!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, I actively engage in various campus organizations and clubs, fostering connection and collaboration with my peers. I hold a chair position in Northwestern’s Remote Area Medical club, where we organize and participate in volunteer medical clinics, providing free healthcare to those in underserved areas of the United States. Additionally, I have dedicated much time to a neurobiology lab, investigating the effects of neurodegenerative disorders such as Alzheimer’s on sleep quality.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I am an avid sports fan, closely following Manchester United, the Chicago Bulls, and the Chicago Bears. I also greatly enjoy traveling, exploring countries like Iceland and Argentina with my close friends, cultivating a deeper understanding of diverse cultures and traditions.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a Curious Cardinals mentor, I am dedicated to helping my mentees unlock their potential as students, creatives, and leaders. I aim to do so through interactive lessons with emphasis on problem solving skills that can be applied both inside and outside of the classroom.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"P4UJdr7OFQubjKhLjtIof8g300FhkJ00PCljZ4otbJK5Y","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c7898019-d71f-42e2-abc6-32d0e64591bc\"}"},{"__ref":"Favorites:{\"uuid\":\"65c6f648-08b9-438e
