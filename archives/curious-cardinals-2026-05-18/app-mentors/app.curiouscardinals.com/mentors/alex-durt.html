xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"653daff9-9769-490f-b822-0410d617a2bc\"}":{"__typename":"DeepDives","uuid":"653daff9-9769-490f-b822-0410d617a2bc","content":"\u003cp\u003eEveryone starts out at square zero! Everyone! Don't let the fear that other people know more or are more \"qualified\" to investigate things stop you from chasing opportunities and turning around intellectual corners. You are at the best time you could possibly be to start learning something new and ask the people around you for help. Your excitement is enough.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"aab55231-d115-4fa9-a6a3-8299c9ab24b2\"}":{"__typename":"DeepDives","uuid":"aab55231-d115-4fa9-a6a3-8299c9ab24b2","content":"\u003cp\u003eA retro digital art website coded entirely by hand in HTML \u0026amp; CSS, no AI coding support, no web design service, just good old YouTube tutorials and ancient Reddit threads (which may seem like a small feat but consider I am not a computer science native). It is so, so much fun to feel it come together creatively, rework it constantly, and troubleshoot code for something that isn't a problem set.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0debd1eb-b112-4c39-86e1-c1586fc2438b\"}":{"__typename":"DeepDives","uuid":"0debd1eb-b112-4c39-86e1-c1586fc2438b","content":"\u003cp\u003eI believe you don't truly learn anything until you can teach it. That goes for the personal and the academic. Also, what fun it is to learn through this relationship instead of toughing it out solo!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5c8628bf-a89c-4269-ba1a-48c70d011d69\"}":{"__typename":"DeepDives","uuid":"5c8628bf-a89c-4269-ba1a-48c70d011d69","content":"\u003cp\u003eI took extra classes in totally random stuff (Social Democracy! Jewish History!) and went outside constantly. I literally hiked and metaphorically hiked out to different boroughs to go see my friends. I think my high school summers taught me a whole lot more about the subway system than anything else, oops.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"40cf02de-ded8-4750-8bb1-febaf7718c85\"}":{"__typename":"Education","uuid":"40cf02de-ded8-4750-8bb1-febaf7718c85","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Ecology \u0026 Evolutionary Biology","degree":null},"School:{\"uuid\":\"8754f578-5dd9-4841-97e7-ec34566b929a\"}":{"__typename":"School","uuid":"8754f578-5dd9-4841-97e7-ec34566b929a","name":"Brearley School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10028"},"Education:{\"uuid\":\"5934b22b-640b-402c-b310-bc4012cf269a\"}":{"__typename":"Education","uuid":"5934b22b-640b-402c-b310-bc4012cf269a","school":{"__ref":"School:{\"uuid\":\"8754f578-5dd9-4841-97e7-ec34566b929a\"}"},"startYear":"2016","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"902fb43c-18b2-4725-ade4-1f81288aa86b\"}":{"__typename":"MentorPublicProfile","uuid":"902fb43c-18b2-4725-ade4-1f81288aa86b","displayName":"Alex D.","slug":"alex-durt","biography":"\u003cp\u003eHi there! My name is Alex and I'm excited to partner with you and your family in your student's learning! I am a student researcher interested in theoretical and microbial ecology, officially majoring in Ecology \u0026amp; Evolutionary Biology. I've worked on mathematical biology research in multiple fields and universities (electrophysiology and epidemiology). These projects have focused mainly on models of dynamical systems from different sides– some computational simulation, some stability analysis/population dynamics by hand. As I've worked on preparing publication-quality papers inside and outside of the classroom, I can help your student think through literature reviews or original ideas and methodology in a coherent and, most importantly, exciting way. My future goal is to pursue a PhD in ecology and go crazy with experimental design exploration along the way, and hopefully get to continue working on cool evolutionary medicine projects from there. Ever heard of the looming existential threat of antibiotic resistance? My cup of tea.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have a huge love for math and science as a teacher as well as a student. I have years of experience teaching almost all grades (K-10) in afterschool STEM enrichment programs, a calling that has been a total light in my life. I've even worked summers at a pre-K for all in my hometown, NYC. I love developing relationships with my students as we work together and continue to be friends with some years later! My absolute favorite thing is chasing my kids' curiosities down rabbitholes, which tend to lead to the most well thought-out and loved projects. I have teaching skills in basic data science, math from algebra to linear algebra, and integrative biology. I also have a dear love for the craft of writing which helps me practice and teach good science communication.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I run a volunteer program with the Yale Community Healthcare Van, working the front desk for their storefront and directly serving community members in need. I also make music-related zines for my college radio station and run a knitting circle where we talk films! Some of my current favorite movies are anything by Bong Joon Ho, West Side Story (the original), Superman (2025), Batman (2022), and 28 Days Later. My secret life hack for knitting like crazy is having a writing goal to procrastinate and a suspenseful movie to watch. I am also a big Yankees fan coming from a family that is not into sports at all, so if you want to hear my woes during the season, let me know.\u003c/p\u003e","teachingVideoPlaybackId":"w02uo8FskKpuvsk4iFb8T4i54y3yjCabZ008ysyZT3Jio","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ecology \u0026 Evolutionary Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"653daff9-9769-490f-b822-0410d617a2bc\"}"},{"__ref":"DeepDives:{\"uuid\":\"aab55231-d115-4fa9-a6a3-8299c9ab24b2\"}"},{"__ref":"DeepDives:{\"uuid\":\"0debd1eb-b112-4c39-86e1-c1586fc2438b\"}"},{"__ref":"DeepDives:{\"uuid
