urrently working on helping integrate the project into school gardens! He is also in the process of securing a patent (UPSTO: 62/412,892) for a smart case for common and expensive temperature-sensitive life saving medicines such as Epinephrine or Narcan. Since the beginning of high school, Aidan has spent his summers as an electrical engineer at V5 Systems, where he learns how the industry works and how products are built in the real world. He is always working on his portfolio of personal projects, whether he is building his friend a concussion-detecting device, or a 3’x2’ CNC CO2 Laser Cutter, he does it all with a smile and healthy obsession. When he’s not doing homework or projects, you can find Aidan playing chess, going out on weekends with his friends, and cooking at every opportunity he gets!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/42197eb5-872c-440c-96de-2b54f5acd3d0/-/crop/409x409/135,184/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"719368da-cdef-41fe-b467-914e29bfbcd7\"}"}],"hiredAt":"2021-08-20T22:56:37.000Z","topics":["Business / Entrepreneurship","Visual Arts / Graphic Design","Robotics / Electronics / CAD","Coding / Programming"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"aidan-chandra\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a1502160-e9eb-40de-bc4b-01822780dbc4\"}"}}},"_sentryTraceData":"41fddc9c071a4b39871b6a55c72f6673-9692c4dc6703d220-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=41fddc9c071a4b39871b6a55c72f6673,sentry-sample_rate=0.2,sentry-tra
