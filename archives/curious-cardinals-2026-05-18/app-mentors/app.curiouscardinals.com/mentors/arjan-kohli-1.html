tries and is currently building Mirage Labs, a company focused on designing systems that probe, disrupt, and stress-test modern AI models. His work sits at the intersection of AI safety, autonomous systems, and geopolitical strategy, with a particular emphasis on how intelligent systems behave under pressure, uncertainty, and rough conditions.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eArjan’s technical background spans machine learning, biology, and systems engineering. He has built deep learning systems for kidney cancer research, contributing to projects that apply neural networks to medical imaging and clinical decision support, and has published research in this area. He is also preparing to present deep learning research at an international conference in Rome, continuing his work at the boundary between theory and real-world deployment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside his research and entrepreneurial work, Arjan has an extensive track record as a coach and mentor. He is a multiple-time International Science and Engineering Fair (ISEF) award winner and has previously tutored and mentored students who went on to win at ISEF themselves. He personally scored perfect scores on SAT reading and math. His mentorship focuses not just on competition success, but on teaching students how to think like researchers and builders: how to identify meaningful problems, design rigorous solutions, and communicate ideas clearly under scrutiny.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eArjan has coached students across a wide range of subjects, including AP Calculus, AP Biology, computer science, finance, and economics, SAT, ACT, as well as advanced project-based work in AI and data science. Many of the students he has mentored have gone on to build companies, publish research, or pursue competitive academic pathways in STEM. His approach emphasizes depth over rote learning, helping students develop intuition, mathematical maturity, and the confidence to tackle open-ended problems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eArjan is particularly excited to coach and mentor students interested in AI, mathematics, biology, civics, history, and economics, especially those who want to bridge technical skill with real-world impact. He brings the perspective of both a researcher and a builder, helping students move from curiosity to execution.\u003c/p\u003e","teachingVideoPlaybackId":"ZA5vPP57CkGjTrlE00p601Ndp1yD01hdMFxBVBCRym3ZjE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3ff41593-77da-4185-ac40-13cb1e11097c\"}"},{"__ref":"DeepDives:{\"uuid\":\"ad51eb3f-f827-4360-bd99-8f7c33981036\"}"},{"__ref":"DeepDives:{\"uuid\":\"85e6ac29-6a48-457c-abc6-d18972090f60\"}"},{"__ref":"DeepDives:{\"uuid\":\"2def0ed3-117d-4826-a525-9b722349be9f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/721ae77f-8f6c-463e-a5b8-d92978a6c38e/-/preview/-/format/jpg/","https://ucarecdn.com/11ce55fe-a683-4f77-beb1-ef4f7fa0d043/-/preview/-/format/jpg/","https://ucarecdn.com/9f0b8f7d-3848-4a60-aeea-899ba207c428/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"505ed57e-fb5b-4e7b-91d2-ecc5eab6275f\"}"},{"__ref":"Education:{\"uuid\":\"fb262969-e1c3-4dcf-8202-f1fb9d977eee\"}"}],"hiredAt":"2026-01-21T15:55:22.082Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Academic Coaching","Executive Function","College Essay Writing","Economics","History","Computer Science","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Medicine / Health","Machine Learning / AI","Debate"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({
