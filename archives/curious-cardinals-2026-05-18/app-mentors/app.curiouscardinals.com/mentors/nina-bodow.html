xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"453f0ef6-aa58-4d5c-8f1d-290c3685d8f9\"}":{"__typename":"Favorites","uuid":"453f0ef6-aa58-4d5c-8f1d-290c3685d8f9","photoUrl":"https://ucarecdn.com/da1f0dac-d6f1-4247-9994-b18a6bd0cebf/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"1f15c774-e328-4749-aa3d-14d4723c50fa\"}":{"__typename":"Favorites","uuid":"1f15c774-e328-4749-aa3d-14d4723c50fa","photoUrl":"https://ucarecdn.com/3052c0cb-6d3f-440d-bcd5-bbf897cff89e/","title":"Soccer","type":"SPORT"},"Favorites:{\"uuid\":\"0fd3633a-ac8a-4a5f-8fb3-ac146ade6c3a\"}":{"__typename":"Favorites","uuid":"0fd3633a-ac8a-4a5f-8fb3-ac146ade6c3a","photoUrl":"https://ucarecdn.com/fbb7c384-7fdb-4249-bf10-64fd3503ccf8/","title":"Arsenal","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f931637e-7281-48db-917d-809bd09ad228\"}":{"__typename":"DeepDives","uuid":"f931637e-7281-48db-917d-809bd09ad228","content":"\u003cp\u003eI chose Physics and Philosophy because I am fascinated by the way they intersect. Also, simply, I love being an interdisciplinary student. Together these two disciplines help me develop a more flexible and analytical way of thinking. I’ve learned how to approach problems from both a scientific and conceptual angle, which I think is incredibly valuable in any field. And ultimately, I chose this major because I genuinely enjoy it. Liking what you study makes a huge difference—it keeps you curious and motivated!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"521a616b-ae23-4daf-bc94-1b24bde96e76\"}":{"__typename":"DeepDives","uuid":"521a616b-ae23-4daf-bc94-1b24bde96e76","content":"\u003cp\u003eWalking onto the varsity soccer team at Yale. ACL rehab took me over a year and was both really mentally and physically exhausting. But playing on the Yale soccer team was something I’d dreamed of since middle school, and I didn’t let my injury stop me. I’m really proud of my perseverance and determination.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"22ad7fa4-97e7-4487-93c7-2978417ef7fb\"}":{"__typename":"DeepDives","uuid":"22ad7fa4-97e7-4487-93c7-2978417ef7fb","content":"\u003cp\u003eHere are my top three spare time activities:\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCooking. I love to ditch the recipes and try to create my own unique flavor combinations. And I love to make elaborate meals and serve them to my friends or family.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eReading. At college it’s easy to forget the joy of leisurely reading, but in any free time I have I try to remind myself. Sitting in the sun soaking in the rays and a good book cannot be beat.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWalking. Living in NYC, there are infinite neighborhoods and blocks to explore. I love to wander without a destination; it’s on these walks that I’ve found some of my favorite areas and stores in the city. Plus I always end the walk feeling much more clear headed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"46201e0b-b480-4469-b782-68dd57276e10\"}":{"__typename":"DeepDives","uuid":"46201e0b-b480-4469-b782-68dd57276e10","content":"\u003cp\u003eThe summer after my sophomore year I did a backpacking trip in the Spanish Pyrenees mountains on a beautiful trail called \u003cem\u003eCarros de Foc \u003c/em\u003eor “Chariots of Fire”. We stayed in mountain hostels and hiked all day— and I also got to practice my Spanish. I have always loved to travel, but this trip in particular made me hungry to explore and backpack the world as much as possible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe summer after my junior year I did a homestay in Japan. I lived with a family of 4 (and their dog, Mamo!) in Sapporo, Japan, and attended Japanese high school all throughout July (yes they have school in July!). I was the only American in a class of 36 local Japanese students, which was an incredible and eye opening experience. I am still in touch with my host family and I miss those weeks dearly\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"9e51c1a6-5d73-4c8c-9e21-e8285d39cbff\"}":{"__typename":"School","uuid":"9e51c1a6-5d73-4c8c-9e21-e8285d39cbff","name":"Saint Ann's School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11201"},"Education:{\"uuid\":\"fe4c0366-ac6d-4943-9e25-209ffe1e6a56\"}":{"__typename":"Education","uuid":"fe4c0366-ac6d-4943-9e25-209ffe1e6a56","school":{"__ref":"School:{\"uuid\":\"9e51c1a6-5d73-4c8c-9e21-e8285d39cbff\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"c73f0915-7a94-4a28-aff1-d40ec8d0c083\"}":{"__typename":"Education","uuid":"c73f0915-7a94-4a28-aff1-d40ec8d0c083","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Physics and Philosophy","degree":null},"MentorPublicProfile:{\"uuid\":\"f385e6ce-9f45-4218-bfb7-6fe7ee8b2870\"}":{"__typename":"MentorPublicProfile","uuid":"f385e6ce-9f45-4218-bfb7-6fe7ee8b2870","displayName":"Nina B.","slug":"nina-bodow","biography":"\u003cp\u003eHey!! My name is Nina and I’m from Brooklyn, New York. I’m a rising sophomore at Yale studying Physics and Philosophy. I am also pursuing a certificate in Japanese— I’ve studied Japanese since 8th grade and am now only 2 semesters away from completing my certificate. Japan is one of my favorite places in the world!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also on the Yale Women’s soccer team. This wasn’t always the case, though: I tore my ACL my junior year of high school and did not get to play my entire senior year. I was not admitted to Yale as a student-athlete. However, I rehabbed, trained, and then this past year I walked onto the soccer team!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom and off the field, I write for the Yale Daily News, I play the trumpet, and I’m the founder and president of a food writing journalism initiative called Yeater. We just got approved as an official campus organization!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love nothing more than spending time with my friends and family; I especially enjoy trying new restaurants and sharing meals with my loved ones. I also really value my alone time and love to go on walks and find parks to venture to.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout high school and college I’ve loved immersing myself in various fields and activities. I find that it keeps me loving to learn and scratches my brain in different ways. And loving to learn is so valuable!\u003c/p\u003e","teachingVideoPlaybackId":"TukvqshPbemBQ8zTHVzGrAGlGFYVOU8jvPnxR00YdKJM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"453f0ef6-aa58-4d5c-8f1d-290c3685d8f9\"}"},{"__ref":"Favorites:{\"uuid\":\"1f15c774-e328-4749-aa3d-14d4723c50fa\"}"},{"__ref":"Favorites:{\"uuid\":\"0fd3633a-ac8a-4a5f-8fb3-ac146ade6c3a\"}"}],"causesSupported":[],"major":"Physics and Philosophy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f931637e-7281-48db-917d-809bd09ad228\"}"},{"__ref":"DeepDives:{\"uuid\":\"521a616b-ae23-4daf-bc94-1b24bde96e76\"}"},{"__ref":"DeepDives:{\"uuid\":\"22ad7fa4-97e7-4487-93c7-2978417ef7fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"46201e0b-b480-4469-b782-68dd57276e10\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e2679f7f-8e66-4870-9003-f50aa8242c3e/-/preview/-/format/jpg/","https://ucarecdn.com/4a5de187-7b6a-46e6-bb13-1a4faa0194ab/-/preview/-/format/jpg/","https://ucarecdn.com/dd2f207d-59b1-40e1-92b1-091a5debf2a8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fe4c0366-ac6d-4943-9e25-209ffe1e6a56\"}"},{"__ref":"Education:{\"uuid\":\"c73f0915-7a94-4a28-aff1-d40ec8d0c083\"}"}],"hiredAt":"2025-05-20T08:55:41.254Z","topics":["Sports Journalism","Video / Photography","K-6 Storybook","Creative Writing","Aviation / Aerospace","Machine Learning / AI","Journalism","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nina-
