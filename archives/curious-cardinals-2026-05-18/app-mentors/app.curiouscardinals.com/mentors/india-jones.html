xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f4d0d4d3-e63b-4515-9079-d2c060ff0205\"}":{"__typename":"Favorites","uuid":"f4d0d4d3-e63b-4515-9079-d2c060ff0205","photoUrl":"https://ucarecdn.com/0f704106-eec0-4fd4-8a04-afcff37bed1d/","title":"The Bourne Identity","type":"MOVIE"},"Favorites:{\"uuid\":\"b986574e-ad7d-4fef-84b6-48950d1615ea\"}":{"__typename":"Favorites","uuid":"b986574e-ad7d-4fef-84b6-48950d1615ea","photoUrl":"https://ucarecdn.com/c31bbcc8-616d-4529-aaeb-9f8e824ffefc/","title":"Surfing","type":"SPORT"},"Favorites:{\"uuid\":\"7158005f-eca4-4e11-b3d3-5c7ac33510c4\"}":{"__typename":"Favorites","uuid":"7158005f-eca4-4e11-b3d3-5c7ac33510c4","photoUrl":"https://ucarecdn.com/9aea4b57-b271-4013-b507-81642a99b327/","title":"Angle of Repose","type":"BOOK"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"70f1a16b-201b-4bec-8e7b-38623d28c328\"}":{"__typename":"DeepDives","uuid":"70f1a16b-201b-4bec-8e7b-38623d28c328","content":"\u003cp\u003eBefore freshman year, I did a language immersion program for Mandarin, and was in a musical with my cousins.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI spent my sophomore year living in Austria with my family, so I spent that summer moving and learning German. School there went until mid-July, so that summer was shortened. I was again in a musical, then headed right to field hockey preseason.\u003c/p\u003e\u003cp\u003eBy senior year, COVID had hit, so my family rented an RV and we road tripped cross-country to California, where I spent the summer rowing, preparing to apply for colleges, and organizing preseason.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe summer before college, I worked as a barista in a cafe in Rhode Island!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"db566125-7199-4db8-ae06-34b75a55065e\"}":{"__typename":"DeepDives","uuid":"db566125-7199-4db8-ae06-34b75a55065e","content":"\u003cp\u003eI was diligent and involved, but really stressed! I would love to help students learn in a way that best suits them and keep perspective on their academics while still making the most of high school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4f697a9a-5fc4-4bd9-ab2e-116e0eeb848d\"}":{"__typename":"DeepDives","uuid":"4f697a9a-5fc4-4bd9-ab2e-116e0eeb848d","content":"\u003cp\u003eAstronaut! It's a childhood dream that I haven't yet let go of...\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}":{"__typename":"School","uuid":"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5","name":"The Chapin School","city":"New York","type":"HIGH","state":"NY","country":"USA","zip":"10028"},"Education:{\"uuid\":\"9eacdef1-51c4-49f0-bea1-5cd6fcbc0abe\"}":{"__typename":"Education","uuid":"9eacdef1-51c4-49f0-bea1-5cd6fcbc0abe","school":{"__ref":"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}"},"startYear":"2008","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"87620853-6af6-4b45-9bd4-2cacc6ab0e6a\"}":{"__typename":"Education","uuid":"87620853-6af6-4b45-9bd4-2cacc6ab0e6a","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Environmental Earth Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"0e881baa-2e91-42ee-94cc-aa668a4b3a4c\"}":{"__typename":"MentorPublicProfile","uuid":"0e881baa-2e91-42ee-94cc-aa668a4b3a4c","displayName":"India J.","slug":"india-jones","biography":"\u003cp\u003eHi! I’m India Jones, a recent graduate of Dartmouth College, and a native New Yorker currently living in Boulder, Colorado.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Dartmouth, I studied Environmental Earth Sciences, which meant I took classes like oceanography, glaciology, geology, and meteorology. I stumbled into this major – before college, I’d had no experience with sciences outside the traditional biology / chemistry / physics curriculum in high school, and I learned I loved the way it taught me, very tangibly and observably, about the way the world works! As part of the major, I got to do a field study program where a group of us spent a term road tripping from Canada to the Grand Canyon doing hands-on fieldwork and learning about different aspects of Earth Sciences as we went. Over the course of my senior year, I wrote a thesis focused on post-glacial erosion rates in the Canadian sub-arctic. Ask me about geomorphology!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love languages, so I minored in German, which let me study abroad in Berlin with an amazing host family. As a fun senior spring class, I took introductory Italian, and in high school took Mandarin and Latin. I\u0026nbsp; love to learn about language patterns, quirks, and connections through podcasts and talking with my friends who speak other languages.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI had such great mentors in both college and high school, and am excited to pay it forward by getting younger students excited about learning! In the past, I’ve worked with elementary school children helping them learn to read through the America Reads program. I was also a Teacher’s Aide at a summer program for children with developmental disabilities, where I helped them read and learn basic math skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m passionate about photography, and have used that as both a hobby and a job. Professionally, I worked for the Dartmouth Alumni Office, capturing scenes of student and campus life. Personally, I recently made printed booklets filled with portraits of my friends as a graduation memento, and love playing with film photography and videography techniques. I’ve had photos exhibited in the Met, licensed by the editing app VSCO, and featured in a Dartmouth calendar.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love being active, whether that’s laps in the local pool with the retirees, hiking and skiing Colorado’s mountains, running half marathons, rollerblading with friends, or serving as President of Dartmouth Surf Club.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my spare time, I love taking advantage of whatever interesting opportunity comes my way. I was a ballkid at the US Open for three years (see the middle photo up top!), worked on a lobster fishing boat in the winter, volunteered at the Telluride Film Festival, and designed the summer dessert menu at a wine bar in New York.\u003c/p\u003e","teachingVideoPlaybackId":"HI8JtRgxlfu00G00eL93tNb2jnbwHhYFmjjfudaVnQd02Q","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f4d0d4d3-e63b-4515-9079-d2c060ff0205\"}"},{"__ref":"Favorites:{\"uuid\":\"b986574e-ad7d-4fef-84b6-48950d1615ea\"}"
