js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f0a72a37-a636-4769-b5ec-26f07cf04965\"}":{"__typename":"Favorites","uuid":"f0a72a37-a636-4769-b5ec-26f07cf04965","photoUrl":"https://ucarecdn.com/3e493574-edef-460b-8c77-5a900da5c54a/","title":"M.C. Escher","type":"ARTIST"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"77f1eed4-ee9e-4477-af69-542830d3c4db\"}":{"__typename":"DeepDives","uuid":"77f1eed4-ee9e-4477-af69-542830d3c4db","content":"\u003cp\u003eIn an Argentine household, dinner isn't over when everyone finishes eating... In fact, it probably isn't over an hour later! Everyone sticks around at the table long after all forks have been set down, and they talk -- about philosophy, current events, or just life in general. This phenomenon -- called \"sobremesa\" (over the table) -- was omnipresent in my household, and some of my most formative educational experiences happened during these extended post-meal conversations.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eAs a first-generation American with parents from Buenos Aires, I would listen intently as my parents and siblings debated science, politics, and life's big questions. This wasn't formal education, yet it's where I developed critical thinking skills and learned to engage with complex ideas through dialogue.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eThis background influences my teaching philosophy in profound ways. I believe meaningful education begins with excellent communication and thrives in conversation. While I can't share an Argentinian asado with my students, I bring the same engaging, discussion-based approach to academic mentorship.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eRather than simply presenting information, I create an environment where students actively participate in scientific inquiry, discovering important phenomena and theorems through guided exploration. This collaborative process mirrors real-world research methods and proves far more effective than passive learning. Students don't just memorize concepts—they understand them deeply by working through them conversationally.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eTeaching, in my view, is fundamentally a two-player game. When students become active participants rather than passive recipients, not only do they learn more effectively, but the entire experience becomes more enjoyable and meaningful for everyone involved.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"89d39c04-dc3c-4729-b09f-b8288f2a6961\"}":{"__typename":"DeepDives","uuid":"89d39c04-dc3c-4729-b09f-b8288f2a6961","content":"\u003cp\u003eLearn how to recognize when you need help and practice asking for it!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLike many high-achieving high schoolers, I believed I could hold the world on my shoulders if need be. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe reality is that everyone comes up against their limitations at some point, and when that moment comes, it is \u003cstrong\u003eessential\u003c/strong\u003e that you know how to navigate through it. This is what is hard to understand for young and ambitious students — that coming up against failure and emerging gracefully is a skill that must be learned sooner or later.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHow then do you learn to ask for help when you feel you don't need it? Do it anyway! It can never hurt to take the load off a little bit. Go to office hours even if you understand the material. Get in touch with your dean or academic advisor even if you have nothing pressing to talk about. Build relationships with teachers and mentors before you're in crisis mode. These connections not only provide academic support but also create a network of people invested in your success.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLearning to use these resources proactively means that when challenges inevitably arise, you'll already know how to access support effectively. The strongest students aren't those who never struggle—they're the ones who know how to bounce back when they do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eApart from that, follow your curiosity and keep your patience — it'll take you further than you can imagine. The subjects and questions that genuinely fascinate you today may well become the foundation of your future career and passions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"860f6d58-9a8e-4f03-95af-e5cad9e0003f\"}":{"__typename":"DeepDives","uuid":"860f6d58-9a8e-4f03-95af-e5cad9e0003f","content":"\u003cp\u003eI want to defy students' expectations of themselves as \"not a STEM person.\" I want to showcase math and science as a creative pursuit — something that emerges clearly at the university and research level but which they might not have been exposed to in school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm passionate about science communication — I love finding ways to explain complex topics in an accessible and engaging way. There is a wealth of knowledge which is kept behind the gate of inaccessible field-specific notation and practice. To me, demystifying these subjects is a puzzle just as rewarding and worth spending time on as producing new research.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI see mentorship as a reciprocal flow — I learn just as much by teaching and guiding my students as they learn from me. When I help students make connections or overcome challenges, I often gain new perspectives on familiar concepts. Their questions push me to deepen my own understanding and find clearer, more intuitive ways to frame complex ideas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the end, mentoring isn't just about transferring knowledge—it's about building relationships that transform both student and teacher. It's about creating those moments when a concept suddenly clicks, when a student realizes they're capable of more than they thought possible, and when curiosity ignites into genuine passion. Those moments of breakthrough and growth are what draw me to education and mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"68cec24c-5b24-42e3-8b76-c336aabf7a83\"}":{"__typename":"DeepDives","uuid":"68cec24c-5b24-42e3-8b76-c336aabf7a83","content":"\u003cp\u003eI have two older brothers — Dan and Eitan. They studied physics and math respectively and guided me through my own journey of education and intellectual discovery.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough them, I discovered that academic curiosity is profoundly contagious — I fell in love with mathematics through the puzzles they created for me during long family car rides. Those moments of playful problem-solving fundamentally shaped my relationship with learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThough our professional paths have diverged by now, we share so much in who we are, and they know me so well that their support and advice continue to be an invaluable asset as I make my way through life. Sometimes this manifests as technical collaboration — I might call Dan to help me unpack the physical significance behind why the Hydrogen atom potential admits a lower bound, or turn to Eitan when I need to articulate my strengths and \"pitch myself\". But just as often, it's simply sharing a laugh or celebrating our accomplishments together — we're brothers after all.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat truly distinguishes them as role models isn't merely their academic achievements, but how they've demonstrated that meaningful education thrives within relationships. This perspective fundamentally shapes my approach to mentorship today — I strive to create the same kind of intellectually stimulating, supportive dynamic with my students that my brothers created with me, knowing that the most transformative learning happens through kinship and genuine connections.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"9250d15c-1e69-43a9-b122-716a0bc0022b\"}":{"__typename":"School","uuid":"9250d15c-1e69-43a9-b122-716a0bc0022b","name":"The Park School of Baltimore","city":"Baltimore","type":"HIGH","state":"Maryland","country":"United States","zip":"21208"},"Education:{\"uuid\":\"d4fdd9fe-636b-4622-bfa5-cc6613f29092\"}":{"__typename":"Education","uuid":"d4fdd9fe-636b-4622-bfa5-cc6613f29092","school":{"__ref":"School:{\"uuid\":\"9250d15c-1e69-43a9-b122-716a0bc0022b\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"51b9265f-0588-4ba3-ae01-cf8fadefd751\"}":{"__typename":"Education","uuid":"51b9265f-0588-4ba3-ae01-cf8fadefd751","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"979e1b15-9b7a-4a61-bd19-4fe13762d551\"}":{"__typename":"MentorPublicProfile","uuid":"979e1b15-9b7a-4a61-bd19-4fe13762d551","displayName":"Noam B.","slug":"noam-borgnia","biography":"\u003ch3\u003e\u003cstrong\u003e👋 Hi there! I’m Noam — STEM Educator, Researcher, Math and Physics Nerd (and Proud of It)\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up in Baltimore, Maryland, where I spent my time tinkering with puzzles and backyard experiments. That same curiosity eventually led me to \u003cstrong\u003ePrinceton University\u003c/strong\u003e, where I earned my B.A. in Mathematics, and then to the \u003cstrong\u003eTechnical University of Munich\u003c/strong\u003e, where I'm currently diving deeper into the world of \u003cstrong\u003emathematical physics\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you're looking for a tutor who sees equations as tools for creativity—and science as a playground—you’re in the right place.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e🔭 What Drives Me\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eScience Communication\u003cbr\u003e\u003c/strong\u003eI live for those \u003cem\u003e“aha!”\u003c/em\u003e moments—when a big, abstract idea suddenly snaps into place and feels intuitive. Explaining complex concepts in clear, compelling ways is one of my favorite challenges.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eModern Frontiers\u003cbr\u003e\u003c/strong\u003eAsk me about \u003cstrong\u003equantum algorithms\u003c/strong\u003e, \u003cstrong\u003eferromagnetic phase transitions\u003c/strong\u003e, or the \u003cstrong\u003ephysics of espresso\u003c/strong\u003e if you want to hear me ramble on (happily) about the weird, elegant, and surprising ideas that connect math and the real world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eJoyful Problem‑Solving\u003cbr\u003e\u003c/strong\u003eFor me, solving problems is a creative act. I see equations as puzzles, not chores—and I love sharing that mindset with others.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e🎓 My Background\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePrinceton University\u003c/strong\u003e – B.A. in Mathematics\u003cbr\u003eMy senior thesis explored how \u003cstrong\u003emagnetic materials change state\u003c/strong\u003e, revealing deep connections between \u003cstrong\u003estatistical and quantum physics\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eTechnical University of Munich\u003c/strong\u003e – M.Sc. in Mathematical Physics \u003cem\u003e(in progress)\u003cbr\u003e\u003c/em\u003eCurrently exploring the math behind \u003cstrong\u003eAI and quantum computing\u003c/strong\u003e, and using \u003cstrong\u003erandom processes\u003c/strong\u003e to model real-world phenomena.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e👨‍🏫 Teaching \u0026amp; Mentoring\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eMentored \u003cstrong\u003eindependent STEM research\u003c/strong\u003e projects in topics ranging from \u003cstrong\u003egame theory\u003c/strong\u003e, to \u003cstrong\u003eaudio signal processing\u003c/strong\u003e and the \u003cstrong\u003emathematics of\u003c/strong\u003e \u003cstrong\u003esymmetry\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTutored students for \u003cstrong\u003eSAT, ACT, and AP\u003c/strong\u003e exams\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSupported \u003cstrong\u003ecollege-level courses\u003c/strong\u003e as a teaching assistant\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI love helping students go beyond just “getting the right answer” and start asking \u003cem\u003ewhy\u003c/em\u003e—and \u003cem\u003ewhat if?\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch4\u003e\u003cstrong\u003e🏔️ Life Beyond the Equations\u003c/strong\u003e\u003c/h4\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not coding simulations or proving theorems, you’ll catch me:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eHiking, skiing, climbing, or cycling through the Bavarian Alps\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSpinning up new recipes (kitchen science counts!)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHosting board game nights (lately it's been \u003cem\u003eDune Imperium\u003c/em\u003e—strategic chaos!)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch4\u003e\u003cstrong\u003e✨ My Teaching Philosophy\u003c/strong\u003e\u003c/h4\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAdventure Over Memorization\u003cbr\u003e\u003c/strong\u003eWe “follow our noses”, trust our intuition, ask bold questions, and test ideas with hands-on projects.\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuild Real‑World Tools\u003cbr\u003e\u003c/strong\u003eFrom Python notebooks, to mini‑experiments or interactive apps and websites, students create artifacts they’re proud of.\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSkills for Any Future\u003cbr\u003e\u003c/strong\u003eCreativity, logical reasoning, and open‑ended problem‑solving translate far beyond the STEM.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e🤝 Let’s Work Together\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re ready to go beyond memorizing formulas and start exploring the \u003cem\u003einventiveness\u003c/em\u003e at the heart of STEM, I’d love to be your guide. Let’s make math and physics not just understandable—but exciting.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eLooking forward to our journey!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"nWb67PdpTL47i2gnm2sr3YldOkQOBIaVtoOfKsyzLEs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f0a72a37-a636-4769-b5ec-26f07cf04965\"}"}],"causesSupported":[],"major":"Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"77f1eed4-ee9e-4477-af69-542830d3c4db\"}"},{"__ref":"DeepDives:{\"uuid\":\"89d39c04-dc3c-4729-b09f-b8288f2a6961\"}"},{"__
