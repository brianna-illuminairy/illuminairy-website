xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"dafd98bc-bfc1-4744-8376-2ed34a13719f\"}":{"__typename":"DeepDives","uuid":"dafd98bc-bfc1-4744-8376-2ed34a13719f","content":"\u003cp\u003eLINK is a club I founded in high school to bridge the gap between students with special needs and the rest of the student body. It all started after I met Louis, a student with Down syndrome whose kindness and joy deeply inspired me. I realized how much our school—and many others—were missing out by not creating more inclusive spaces.\u003c/p\u003e\u003cp\u003eThrough LINK, we organized a variety of events throughout the year, including sports clinics where students could play side-by-side, holiday celebrations that brought everyone together, and our signature event: \u003cstrong\u003eNight of the Stars\u003c/strong\u003e, an end-of-year prom where every student felt like the guest of honor. The goal was always to create meaningful, lasting friendships and to celebrate the unique strengths of every individual.\u003c/p\u003e\u003cp\u003eLINK quickly grew into one of the biggest and most active clubs on campus, and it continues to be one of the most meaningful things I’ve ever been a part of.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"9775b426-945f-4962-9ba5-2e3f47357f75\"}":{"__typename":"DeepDives","uuid":"9775b426-945f-4962-9ba5-2e3f47357f75","content":"\u003cp\u003eIn high school, I was always on the move. I played baseball every day after school and had games almost every weekend, which meant most of my studying happened late at night. Despite the packed schedule, I loved being involved—I served as school president and ran LINK, the club I started to connect students with special needs to the broader student body.\u003c/p\u003e\u003cp\u003eMy high school was all boys, which made every day lively and full of energy. The environment was competitive, funny, and close-knit—there was never a dull moment. Balancing academics, sports, and leadership roles taught me how to manage my time, stay disciplined, and most importantly, how to lead by example.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"48658024-ba76-41a7-91af-ab9375e56c38\"}":{"__typename":"DeepDives","uuid":"48658024-ba76-41a7-91af-ab9375e56c38","content":"\u003cp\u003eMy summers in high school were the perfect mix of hard work and fun. I played baseball almost every day to stay sharp and competitive, but I always made time to enjoy the break. I spent a lot of time at the beach with friends—tubing, surfing, and just hanging out in the sun. At night, we’d go out, grab food, or catch a movie. I also made it a point to spend quality time with my family, whether it was traveling together or just enjoying a slow day at home. Summers were when I could reset, have fun, and build some of my favorite memories.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3ceb304f-271a-4675-964d-3bf9515454f3\"}":{"__typename":"DeepDives","uuid":"3ceb304f-271a-4675-964d-3bf9515454f3","content":"\u003cp\u003eMentorship matters to me because it’s one of the most powerful ways to make a lasting impact on someone’s life. I’ve been lucky to have mentors who believed in me, guided me, and challenged me to grow—and I want to do the same for others. To me, mentorship is about more than just giving advice. It’s about showing up, listening, and helping someone see their own potential. Whether it’s through LINK, tutoring, or simply being there for someone younger, I’ve seen how a little encouragement and support can go a long way. It’s one of the most fulfilling things I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"cefe7a57-e384-414a-8ae7-7557bf73a4cf\"}":{"__typename":"School","uuid":"cefe7a57-e384-414a-8ae7-7557bf73a4cf","name":"Christopher Columbus High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33165"},"Education:{\"uuid\":\"58954bc2-e72a-4eef-bab2-2d655a4cc7e1\"}":{"__typename":"Education","uuid":"58954bc2-e72a-4eef-bab2-2d655a4cc7e1","school":{"__ref":"School:{\"uuid\":\"cefe7a57-e384-414a-8ae7-7557bf73a4cf\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"ffea8da1-8573-48a5-81c2-9cc10527fb32\"}":{"__typename":"Education","uuid":"ffea8da1-8573-48a5-81c2-9cc10527fb32","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Finance","degree":null},"MentorPublicProfile:{\"uuid\":\"18191c87-2c05-4b2e-a2bd-9ba35acd29e6\"}":{"__typename":"MentorPublicProfile","uuid":"18191c87-2c05-4b2e-a2bd-9ba35acd29e6","displayName":"John Barry B.","slug":"johnbarry-bertematti","biography":"\u003cp\u003eHi! I’m John-Barry (JB). I was born and raised in Miami, Florida. Growing up, I played many sports, but baseball was my main focus. I’ve always loved being active—whether it’s spending time outdoors, reading a good book, or hanging out with friends.\u003c/p\u003e\u003cp\u003eI’m currently studying finance at Wharton and loving every second of it. I’m especially passionate about giving back. In high school, I started a club that connects students with special needs to the wider student body through inclusive events, sports clinics, and volunteer mentorship. That experience helped me realize how much I enjoy building community and supporting others. I believe service isn’t just about helping—it’s about listening, learning, and growing together.\u003c/p\u003e\u003cp\u003eI also love teaching and meeting new people, which is why I’m excited to be part of programs where I can make an impact. Right now, I’m interning at a private equity firm in Miami, learning how finance can be used to drive change at a larger scale.\u003c/p\u003e","teachingVideoPlaybackId":"023lr006cJ5RIyvxpVAQVeVRIeYDBfO48gO28v6F006kd00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Finance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dafd98bc-bfc1-4744-8376-2ed34a13719f\"}"},{"__ref":"DeepDives:{\"uuid\":\"9775b426-945f-4962-9ba5-2e3f47357f75\"}"},{"__ref":"DeepDives:{\"uuid\":\"48658024-ba76-41a7-91af-ab9375e56c38\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ceb304f-271a-4675-964d-3bf9515454f3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bf125b29-952c-4a87-9d5
