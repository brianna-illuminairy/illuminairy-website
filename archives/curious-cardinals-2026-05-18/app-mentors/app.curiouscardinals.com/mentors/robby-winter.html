xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0bdfba65-9b4c-42d3-9f42-3d1eb888413f\"}":{"__typename":"Favorites","uuid":"0bdfba65-9b4c-42d3-9f42-3d1eb888413f","photoUrl":"https://ucarecdn.com/0b8e58c7-5299-41a5-bb5c-adbef347e1c6/","title":"The Amazing Adventures of Kavalier \u0026 Clay","type":"BOOK"},"Favorites:{\"uuid\":\"f0d2166b-cdd2-4df8-9869-a4e50ecb8818\"}":{"__typename":"Favorites","uuid":"f0d2166b-cdd2-4df8-9869-a4e50ecb8818","photoUrl":"https://ucarecdn.com/22536753-4d52-4a5b-bb27-2cfdeb062a53/","title":"Dancing in the Moonlight","type":"SONG"},"Favorites:{\"uuid\":\"30bfdc7b-a156-4623-a57d-86abf2fc6cef\"}":{"__typename":"Favorites","uuid":"30bfdc7b-a156-4623-a57d-86abf2fc6cef","photoUrl":"https://ucarecdn.com/7b788616-0e0c-4e10-9eca-85298bee8d6a/","title":"Eliud Kipchoge","type":"ATHLETE"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"4a1704de-6592-45c0-881b-cebcd9e4c84e\"}":{"__typename":"DeepDives","uuid":"4a1704de-6592-45c0-881b-cebcd9e4c84e","content":"\u003cp\u003eThe late, great Steve Prefontaine once said that \"To give anything less than your best is to sacrifice the gift.\" How lucky are we to be alive to push ourselves to be the best we can be?!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"51cb15f6-af50-4f0f-b8c4-05ecde4a2cad\"}":{"__typename":"DeepDives","uuid":"51cb15f6-af50-4f0f-b8c4-05ecde4a2cad","content":"\u003cp\u003eIn another life, I think I seriously would have loved being one of the puppeteers for the Muppets\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"eb285a31-1f03-4b3e-8c65-e37c521701da\"}":{"__typename":"DeepDives","uuid":"eb285a31-1f03-4b3e-8c65-e37c521701da","content":"\u003cp\u003eSometimes I keep a notepad and pen on my nightstand so that I can take notes on a vivid dream before falling back asleep. One morning, the notepad just said:\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cem\u003eRobby, Andrew, Zach, \u0026amp; Andy --- bagel heist\u003c/em\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c3b404a0-fb4e-4b58-9388-17d2c89c5cfe\"}":{"__typename":"DeepDives","uuid":"c3b404a0-fb4e-4b58-9388-17d2c89c5cfe","content":"\u003cp\u003eI think a lot of folks see math as rote and opaque. To me, math is creative, elegant, visual, and cosmic, and I've never wanted to stop learning it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"696afb87-6ec3-4817-9a74-5c3273571479\"}":{"__typename":"School","uuid":"696afb87-6ec3-4817-9a74-5c3273571479","name":"Deerfield High School","city":"Deerfield","type":"HIGH","state":"Illinois","country":"United States","zip":"60015"},"Education:{\"uuid\":\"515be468-fa63-4166-ad19-51ecc4ce453e\"}":{"__typename":"Education","uuid":"515be468-fa63-4166-ad19-51ecc4ce453e","school":{"__ref":"School:{\"uuid\":\"696afb87-6ec3-4817-9a74-5c3273571479\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"1cbad953-3193-4e7d-b9ce-329af6913261\"}":{"__typename":"Education","uuid":"1cbad953-3193-4e7d-b9ce-329af6913261","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Economics, Mathematics, \u0026 Mathematical Methods in the Social Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"229318f5-479f-4171-8a8d-c0dba3fd64cc\"}":{"__typename":"MentorPublicProfile","uuid":"229318f5-479f-4171-8a8d-c0dba3fd64cc","displayName":"Robert W.","slug":"robby-winter","biography":"\u003cp\u003eHi there! My name is Robby Winter, and I’m so excited to get to know you! I love math, long-distance running, ice cream, and Nintendo, but most of all, I love connecting with people, and I hope that’ll include you.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA little bit more about me: I’m pursuing my master’s degree in Statistics at the University of Chicago, and I’m especially interested in the ways we can use data to advance social policy, the social sciences, and medicine. I spent my undergrad years at Northwestern University, where I earned a bachelor’s degree, \u003cem\u003esumma cum laude\u003c/em\u003e, in Economics, Mathematics, and something called Mathematical Methods in the Social Sciences (which is really just fancy talk for \u003cem\u003emore\u003c/em\u003e economics and \u003cem\u003emore\u003c/em\u003e math) and an M.B.A.-level certificate in Managerial Analytics. The cornerstone of my college experience was my service as a tour guide for prospective students and a peer adviser for first-year students. When I graduated, I was awarded the Phi Beta Kappa Centennial Prize, the highest honor available to Northwestern's Arts \u0026amp; Sciences graduates. I'm proud of the contributions I made in my courses, the Visitor's Center, and the Office of New Student Programs that made that happen.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn between college and grad school, I spent two years working as an economic consultant, where I specialized in the application of economic theory and data analysis to intellectual property litigation. I was proud to receive my employer’s inaugural award for exceptional performance in recognition of my ability to translate complex technical concepts into everyday terms --- something I also love to bring to my mentoring practice.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also a big believer in the idea of “healthy body | healthy mind,” and I know that I wouldn’t be where I am today without running. I loved (and still love!) high school cross country and track \u0026amp; field, but nowadays, most of my focus is on the marathon. I’ve run Chicago and Boston and am excited to round out the rest of the World Majors (New York, London, Berlin, and Tokyo) over the next couple of years. I could talk for hours about the power of endurance sports for cultivating confidence, character, discipline, and camaraderie --- so if you bring it up, don't say I didn't warn you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not studying, working, or running, I love getting involved in Chicago’s Jewish community, trying out new bagel delis and ice cream parlors (usually not at the same time), and playing \u003cem\u003eMario\u003c/em\u003e and \u003cem\u003eZelda\u003c/em\u003e games on my Nintendo Switch.\u003c/p\u003e","teachingVideoPlaybackId":"8d9HDmXjJvCId02c2bvUdlbZWkVW2uKl62qiLvCDpkls","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0bdfba65-9b4c-42d3-9f42-3d1eb888413f\"}"},{"__ref":"Favorites:{\"uuid\":\"f0d2166b-cdd2-4df8-9869-a4e50ecb8818\"}"},{"__ref":"Favorites:{\"uuid\":\"30bfdc7b-a156-4623-a57d-86abf2fc6cef\"}"}],"causesSupported":[],"major":"Economics, Mathematics, \u0026 Mathematical Methods in the Social Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4a1704de-6592-45c0-881b-cebcd9e4c84e\"}"},{"__ref":"DeepDives:{\"uuid\":\"51cb15f6-af50-4f0f-b8c4-05ecde4a2cad\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb285a31-1f03-4b3e-8c65-e37c521701da\"}"},{"__ref":"DeepDives:{\"uuid\":\"c3b404a0-fb4e-4b58-9388-17d2c89c5cfe\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2a2266c8-26f5-4415-9916-8c98081740f6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"515be468-fa63-4166-ad19-51ecc4ce453e\"}"},{"__ref":"Education:{\"uuid\":\"1cbad953-3193-4e7d-b9ce-329af6913261\"}"}],"hiredAt":"2024-08-23T03:26:03.033Z","topics":["Precalculus / Trigonometry","Pre-Algebra","Geometry","Calculus","Algebra II","Algebra I","Statistics","Economics"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/","https://ucarecdn.com/fe18a7d8-d65b-4523-ab43-2a809d9f45e6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"robby-winter\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"229318f5-479f-4171-8a8d-c0dba3fd64cc\"}"}}},"_sentryTraceData":"e8fd583d996640f4bdc67f92f3a7dc13-92c09941f17e5c62-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e8fd583d996640f4bdc67f92f3a7dc13,sentry-sample_rate=0.2,sentry-tra
