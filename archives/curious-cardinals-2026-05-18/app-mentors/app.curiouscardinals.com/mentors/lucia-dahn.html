xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e8ddc510-3cd2-4f12-888d-ead05eb623b8\"}":{"__typename":"DeepDives","uuid":"e8ddc510-3cd2-4f12-888d-ead05eb623b8","content":"\u003cp\u003eI would tell my younger self to just start. Whether you have an assignment to complete, an email to send, a passion project to launch into the world—the longer you wait, the more stress you're likely to create for yourself. It's natural to feel worry towards things that are challenging or uncertain, but once you begin, you'll find that most things won't be as bad or difficult as you fear; the only way out of discomfort is by moving through it. The life you desire is built on a series of deeply courageous and vulnerable actions!  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"d2988de4-a554-4882-903f-d4423da74cda\"}":{"__typename":"DeepDives","uuid":"d2988de4-a554-4882-903f-d4423da74cda","content":"\u003cp\u003eGrowing up speaking both English and Spanish has given me a deep appreciation for the nuances of linguistic expression and how language can shape one's identity and sense of self—the way we speak is often tied to where we come from, who we’re with, and how we see ourselves. In the classroom, I welcome students to code-switch and use whichever language register helps them express themselves most comfortably and authentically. I view the classroom as a dynamic learning zone that demands patience, flexibility, and an open-minded attitude; by making space for students’ diverse lived experiences and linguistic backgrounds, I hope to create the conditions for deeper engagement and mutual understanding.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4734f587-45f5-45d8-9b56-b96ea548e992\"}":{"__typename":"DeepDives","uuid":"4734f587-45f5-45d8-9b56-b96ea548e992","content":"\u003cp\u003eIn high school, I loved spending my summers at home with my friends and family. It was wonderful to have the space and time to rest but also get ahead on creative projects. I enjoyed participating in virtual summer writing programs (School of the New York Times, Interlochen Arts Camp, Iowa Young Writers' Studio) and preparing writing for local and national competitions (YoungArts, Scholastic Art \u0026amp; Writing Awards, Adroit Journal). The summer before my senior year, I also had the opportunity to pursue a research project through my high school's Dan Leslie Bowden Fellowship in the Humanities—I conducted interviews and surveys to study the impact of summer writing programs on the development of young writers, and presented my findings at a symposium the following fall!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"6a4637c6-e01d-42f1-a3eb-fb626541de4c\"}":{"__typename":"DeepDives","uuid":"6a4637c6-e01d-42f1-a3eb-fb626541de4c","content":"\u003cp\u003eI hope to achieve working proficiency in at least five languages! I grew up speaking English and Spanish, and have studied Chinese for eight years. In the future, I'd love to learn even more languages, especially French, German, and Arabic. Studying different languages opens up new ways of seeing and understanding the world; it reveals the beauty of distinct forms of communication and offers insights into how people relate within cultural contexts. I also hope to publish books in the future and would love to be able to work with various languages, either through the initial writing or in translation!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}":{"__typename":"School","uuid":"1dc8c564-7629-4af5-851c-69ed64a8870e","name":"Ransom Everglades High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33133"},"Education:{\"uuid\":\"43c79151-771d-44db-90f8-44da5ac37089\"}":{"__typename":"Education","uuid":"43c79151-771d-44db-90f8-44da5ac37089","school":{"__ref":"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"dfb1c3d0-c62e-41e6-86a5-e31d1d430c8a\"}":{"__typename":"Education","uuid":"dfb1c3d0-c62e-41e6-86a5-e31d1d430c8a","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Comparative Literature ","degree":null},"MentorPublicProfile:{\"uuid\":\"2bf44f9c-3731-4d5a-9325-439e5492682d\"}":{"__typename":"MentorPublicProfile","uuid":"2bf44f9c-3731-4d5a-9325-439e5492682d","displayName":"Lucia D.","slug":"lucia-dahn","biography":"\u003cp\u003eHi! I’m Lucía Rose Dahn, a junior at Brown University studying Comparative Literature in English, Spanish, and Chinese. Growing up Cuban-American in Miami, I developed an early appreciation for the nuances of language, literature, and translation—and how storytelling can serve as a powerful tool for self-expression and social change.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship has been central to my personal, intellectual, and creative development. Since I was a child, I’ve been an avid reader, and I began writing science-fiction stories of my own in middle school. I’m still inspired by the English teachers who nurtured this love of writing and introduced me to writing competitions and summer writing programs. With this guidance, I not only improved my technical skills, but also took my love of storytelling beyond the classroom—I launched a creative writing mentorship service in 2018, and in 2022, completed a research project exploring how writing programs shape the growth of emerging storytellers.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I hope to facilitate a creative, supportive, and energizing environment that helps students embody the best version of themselves. I want to foster spaces where students feel supported to take intellectual risks, explore unfamiliar topics, express themselves authentically, and confidently move in the direction of their dreams.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMany of the activities I’m involved with at Brown are a continuation of the projects I began in high school. My time as Editor-in-Chief of my high school's literary magazine inspired me to become an English Editor for SOMOS Latinx Literary Magazine; my experiences as a speaker and organizer for TEDxRansomEvergladesSchool led me to find a home at TEDxBrownU. In my current role as Vice President, I oversee the conference logistics and closely advise the Curation team throughout the speaker sourcing, editing, and rehearsal process. I also work as a Writing Fellow at Brown’s Sheridan Center for Teaching and Learning, facilitating one-on-one mentoring sessions in various subject areas. With regard to involvement in Brown’s cultural and literary scene, I’m the Chair of Communications for Brown’s Cuba Club, where I manage the club’s social media and help organize big events such as our yearly Noche Buena dinner.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLooking ahead, I’m drawn to the intersection of storytelling and event production (TED talks, author Q\u0026amp;As, community writing workshops). I’ve interned at an independent bookstore and a publishing press, and am currently exploring careers in writing, editing, and publishing—I’m happy to chat about these industries and how to forge your own path in a creative field. In my free time, I enjoy journaling, running, playing piano, spending time with family, and vlogging. I look forward to working together!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"3afk4xk748nvVTEtnYe7G8G2RnxxIVwHQD12iIJPa9Y","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Comparative Literature ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e8ddc510-3cd2-4f12-888d-ead05eb623b8\"}"},{"__ref":"DeepDives:{\"uuid\":\"d2988de4-a554-4882-903f-d4423da74cda\"}"},{"__ref":"DeepDives:{\"uuid\":\"4734f587-45f5-45d8-9b56-b96ea548e992\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a4637c6-e01d-42f1-a3eb-fb626541de4c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d9f0a636-cc4d-4421-ab7f-296ad5fb8066/-/preview/-/format/jpg/","https://ucarecdn.com/269ab2c5-2562-41ec-852f-0068aa2a8194/-/preview/-/format/jpg/","https://ucarecdn.com/0ffcff0f-7202-4027-9802-f6d71198a2d2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"43c79151-771d-44db-90f8-44da5ac37089\"}"},{"__ref":"Education:{\"uuid\":\"dfb1c3d0-c62e-41e6-86a5-e31d1d430c8a\"}"}],"hiredAt":"2025-07-02T17:16:08.470Z","topics":["Writing","Spanish","College Essay Writing","Executive Function","Creative Writing","Video / Photography","Public Speaking"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lucia-dahn\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2bf44f9c-3731-4d5a-9325-439e5492682d\"}"}}},"_sentryTraceData":"95182f98d5b045e495f051b873dbb613-998a1eeccf313355-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=95182f98d5b045e495f051b873dbb613,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"lucia-dahn"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></h
