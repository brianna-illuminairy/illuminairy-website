xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fd68780c-145b-4d91-bbfa-a6de65ae08e0\"}":{"__typename":"DeepDives","uuid":"fd68780c-145b-4d91-bbfa-a6de65ae08e0","content":"\u003cp\u003eGrowing up, I used to dread classes like math and sciences because I would always get lost in the information. At that time, I was lucky enough to find a mentor to guide me through these courses and eventually find a passion for them. I want to be able to give that same opportunity to those who may have those same fears of numbers and equations. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"012ddd1a-f876-40ca-a935-95e3248f0029\"}":{"__typename":"DeepDives","uuid":"012ddd1a-f876-40ca-a935-95e3248f0029","content":"\u003cp\u003eGoing into college, I really had no idea what I wanted to do. In fact, the first three weeks of school I was convinced I was going to be a new major nearly every day - from history, to english, to computer science, and even mathematics. However, I knew I always had a natural affinity towards science and STEM, and through Stanford's engineering program found BioMechanical engineering: a perfect blend of working with equations, creating physical products, whilst having applications to humans and animals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c398468f-e042-4c1d-94d9-7fbae01b1472\"}":{"__typename":"DeepDives","uuid":"c398468f-e042-4c1d-94d9-7fbae01b1472","content":"\u003cp\u003eTo be unapologetically yourself! My middle school and high school self seem unrecognizable to me today, however the growth I went through in those times were extremely important for who I am today. Though it may seem like the entire world is in your childhood bedroom, I assure you it's not. However, it is the time for you to let your inner kid play while discovering what matters the most to you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"f547bc98-b07c-490d-9cf4-75c1bfb3dd46\"}":{"__typename":"School","uuid":"f547bc98-b07c-490d-9cf4-75c1bfb3dd46","name":"La Costa Canyon High School","city":"Carlsbad","type":"HIGH","state":"California","country":"United States","zip":"92009"},"Education:{\"uuid\":\"1054368c-b45d-4213-ba65-7e14226851fb\"}":{"__typename":"Education","uuid":"1054368c-b45d-4213-ba65-7e14226851fb","school":{"__ref":"School:{\"uuid\":\"f547bc98-b07c-490d-9cf4-75c1bfb3dd46\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"5b65c89d-0926-4d43-8eae-510cd203aac6\"}":{"__typename":"School","uuid":"5b65c89d-0926-4d43-8eae-510cd203aac6","name":"Stanford University School of Medicine","city":"Palo Alto","type":"COLLEGE","state":"California","country":"United States","zip":"94304"},"Education:{\"uuid\":\"c8be9e34-8d20-4a95-9cf0-5fd9c9890f0c\"}":{"__typename":"Education","uuid":"c8be9e34-8d20-4a95-9cf0-5fd9c9890f0c","school":{"__ref":"School:{\"uuid\":\"5b65c89d-0926-4d43-8eae-510cd203aac6\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"BioMechanical Engineering ","degree":"Bachelor's"},"MentorPublicProfile:{\"uuid\":\"80a4269f-4f6f-4167-b5e1-157dd11de131\"}":{"__typename":"MentorPublicProfile","uuid":"80a4269f-4f6f-4167-b5e1-157dd11de131","displayName":"Chloe Y.","slug":"chloe-yurie","biography":"Chloe is a sophomore at Stanford University planning on majoring in BioMechanical Engineering and minoring in Music (Piano). Academically, Chloe is super passionate about any STEM-related field (especially chemistry and math!), philosophy, music theory, and technology. At Stanford, she is part of FashionX, Stanford Women in Finance \u0026 Business, Stanford SENSA (Social Entrepreneurial Students Association) and a member of the Club Swimming team. Outside of class, you can find Chloe at the nearest thrift store looking for her next upcycling piece, at a beach hangin’ ten, or even at your nearest coffee shop indulging in a mid-afternoon pick-me-up. \nChloe was a research intern for one year at UCSD’s Sanford Burnham’s Prebys Institute where she raised and dissected fruit flies for cancer and atrial heart fibrillation research. She is also a current volunteer at the Lucile Packard Children’s Hospital at Stanford. Chloe graduated from La Costa Canyon High School in Carlsbad, California where she created a “Marine Biology Outreach Club” that taught a year-long curriculum of marine biology related topics to local elementary school students. Over the course of her four years, she created and perfected this curriculum, and managed to teach over 200 students at different elementary schools in her area with her club members. She was also an active member of her high school’s National Honor Society, Vice President of the “Helping the Homeless Club,” and a part-time piano teacher in her summers. In her free time, Chloe enjoys being out in the sun–hiking, running, swimming, surfing, etc.–cooking anything from ratatouille to oatmeal raisin cookies, and being a film fanatic. She can talk for hours about Timothee Chalamet and the cinematic masterpiece that is Little Women. Chloe is thrilled to share her excitement for all things STEM related, and wants to show her students the power that STEM can hold and the adventure that education can be!\n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn high school, I started the \"Marine Biology Outreach\" club. Though it started with a grand total of 1 member - myself - I persisted in my journey and managed to gather a group of 20 passionate members to teach marine biology at local elementary schools. As marine biology isn't normally offered in the elementary school curriculum, I watched as these students discovered the world beneath the surface, and develop a passion for the water and for sustainability as I once did. \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"BioMechanical Engineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fd68780c-145b-4d91-bbfa-a6de65ae08e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"012ddd1a-f876-40ca-a935-95e3248f0029\"}"},{"__ref":"DeepDives:{\"uuid\":\"c398468f-e042-4c1d-94d9-7fbae01b1472\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/78f8a055-6f53-4406-8221-8106f5dcb7b8/-/crop/692x693/0,180/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1054368c-b45d-4213-ba65-7e14226851fb\"}"},{"__ref":"Education:{\"uuid\":\"c8be9e34-8d20-4a95-9cf0-5fd9c9890f0c\"}"}],"hiredAt":"2022-10-25T22:15:22.000Z","topics":["Product Design","Game Design","Medicine / Health","Calculus","Writing","Reading","Cooking","Visual Arts / Graphic Design","Algebra I","Biology","Music","Film / Theater","Literature","Video / Photography","Algebra II","Sustainability","Fashion / Cosmetics","K-5 Grade Math","Statistics","Precalculus / Trigonometry","Spanish","Philosophy","STEM Project","Chemistry","Pre-Algebra","Economics","History Project"],"com
