xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"29de5ed1-3d92-4f18-bae3-ce5f653dd387\"}":{"__typename":"Favorites","uuid":"29de5ed1-3d92-4f18-bae3-ce5f653dd387","photoUrl":"https://ucarecdn.com/1c48c411-fbd1-4443-bcc8-4d093b7bbaf2/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"edeb5471-131d-4411-9ff0-c47350a05959\"}":{"__typename":"Favorites","uuid":"edeb5471-131d-4411-9ff0-c47350a05959","photoUrl":"https://ucarecdn.com/6224bf4e-c809-4a22-ad48-dd5b751b1581/","title":"Speak Now","type":"ALBUM"},"Favorites:{\"uuid\":\"18744f93-1569-4fc7-ba7c-fd9b9bc7001d\"}":{"__typename":"Favorites","uuid":"18744f93-1569-4fc7-ba7c-fd9b9bc7001d","photoUrl":"https://ucarecdn.com/5086315b-d9c7-4e2d-8235-13d659c75743/","title":"Harry Potter","type":"BOOK"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"34685e6c-8c1e-419b-84e4-193b990122eb\"}":{"__typename":"DeepDives","uuid":"34685e6c-8c1e-419b-84e4-193b990122eb","content":"\u003cp\u003eMy greatest mentor was my 9th grade biology teacher. He was so incredibly kind to me and always supported me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8a5a32c1-8102-4f29-8a8e-bf59081e17a9\"}":{"__typename":"DeepDives","uuid":"8a5a32c1-8102-4f29-8a8e-bf59081e17a9","content":"\u003cp\u003eI would love to be a psychiatrist at an early psychosis clinic!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"96c6e5ed-2aa8-4239-b650-f30087f2d7ca\"}":{"__typename":"DeepDives","uuid":"96c6e5ed-2aa8-4239-b650-f30087f2d7ca","content":"\u003cp\u003eI'm fascinated by the brain and how it works, both in psychology and neuroscience, so I chose the intersection of the two!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"be21dc0e-3141-423c-983d-1359a077e0b4\"}":{"__typename":"DeepDives","uuid":"be21dc0e-3141-423c-983d-1359a077e0b4","content":"\u003cp\u003eI want to help students who are in the position I once was, trying to reach their goals any way they can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"cb748b83-f121-4083-b6d5-c8e5be9a6cea\"}":{"__typename":"School","uuid":"cb748b83-f121-4083-b6d5-c8e5be9a6cea","name":"Lawrence County High School","city":"Moulton","type":"HIGH","state":"Alabama","country":"United States","zip":"35650"},"Education:{\"uuid\":\"4fb5e681-030b-4f09-a04c-b1b09cd7ec49\"}":{"__typename":"Education","uuid":"4fb5e681-030b-4f09-a04c-b1b09cd7ec49","school":{"__ref":"School:{\"uuid\":\"cb748b83-f121-4083-b6d5-c8e5be9a6cea\"}"},"startYear":"2021","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"ec56f44f-e711-4644-b399-0834d7dd82ad\"}":{"__typename":"Education","uuid":"ec56f44f-e711-4644-b399-0834d7dd82ad","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Psychology (Cognitive Neuroscience)","degree":null},"MentorPublicProfile:{\"uuid\":\"c5d83143-58eb-4c41-932b-6125bc82d778\"}":{"__typename":"MentorPublicProfile","uuid":"c5d83143-58eb-4c41-932b-6125bc82d778","displayName":"Kaesyn P.","slug":"kaesyn-price","biography":"\u003cp\u003eHi there! My name is Kaesyn and I'm currently a sophomore at Harvard studying \u003cstrong\u003ePsychology (Cognitive Neuroscience)\u003c/strong\u003e on the \u003cstrong\u003epre-med track\u003c/strong\u003e. My greatest passion lies in psychiatry, and I'm very involved in that area outside of school. I'm currently working on a \u003cstrong\u003eresearch project\u003c/strong\u003e \u003cstrong\u003ewith McLean Hospital\u003c/strong\u003e focusing on how early psychosis presents itself so we can better recognize and treat it in the future.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school and research, I spend my time \u003cstrong\u003evolunteering\u003c/strong\u003e at Mass General and Food for Free. I am also a crisis counselor for Crisis Text Line, as well as a peer counselor here at Harvard. I spend a lot of time working with people of all walks of life in these roles so I understand how \u003cstrong\u003eeveryone is different and requires different things to thrive\u003c/strong\u003e. I would be happy to \u003cstrong\u003ementor neurodivergent students\u003c/strong\u003e and meet them where they are at, both due to this experience, and also because I am \u003cstrong\u003eneurodivergent myself\u003c/strong\u003e.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I focused a lot on \u003cstrong\u003ehealthcare and research-related extracurriculars\u003c/strong\u003e. I was a member of HOSA and competed in the behavioral health category, advancing to the \u003cstrong\u003eInternational Leadership Conference\u003c/strong\u003e both times. As part of HOSA, my school offered certifications for various entry-level healthcare careers, so I obtained my \u003cstrong\u003ecertification as a Patient Care Technician and EKG Technician\u003c/strong\u003e. I also helped out in a \u003cstrong\u003egenetics-based lab\u003c/strong\u003e my senior year of high school to get hands-on experience in a lab.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI can mentor students who are \u003cstrong\u003elooking for some extra help\u003c/strong\u003e with their math, biology, chemistry, writing, or reading coursework, students who are in the middle of writing \u003cstrong\u003eamazing college essays\u003c/strong\u003e, or students who are interested in learning how to \u003cstrong\u003econduct interesting, engaging research in the natural and social sciences\u003c/strong\u003e. Throughout school I was responsible for helping other students with their school work so I've gained a lot of experience teaching over the years. I enjoy working through plans with people and \u003cstrong\u003emaking their goals come to life\u003c/strong\u003e.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA session with me might include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eClarifying what you know and what you haven’t yet learned\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDeveloping a plan to turn your interests and ideas into reality\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMaking realistic goals and milestones\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you're ready to jump into the next step of your school career, I'd love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"HCfRRdrL00awwW3tMai49LBZeEJwOWVQfGo4LhglRPwM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eEntirely cliche, but honestly, surviving life and never giving up. There have been so many times where the odds have been against me, and really they still are, but I refuse to throw away my shot (in the words of Alexander Hamilton). \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"29de5ed1-3d92-4f18-bae3-ce5f653dd387\"}"},{"__ref":"Favorites:{\"uuid\":\"edeb5471-131d-4411-9ff0-c47350a05959\"}"},{"__ref":"Favorites:{\"uuid\":\"18744f93-1569-4fc7-ba7c-fd9b9bc7001d\"}"}],"causesSupported":[],"major":"Psychology (Cognitive Neuroscience)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"34685e6c-8c1e-419b-84e4-193b990122eb\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a5a32c1-8102-4f29-8a8e-bf59081e17a9\"}"},{"__ref":"DeepDives:{\"uuid\":\"96c6e5ed-2aa8-4239-b650-f30087f2d7ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"be21dc0e-3141-423c-983d-1359a077e0b4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1d8d5091-f063-46ae-a60e-8f17a6ddabbb/-/preview/-/format/jpg/","https://ucarecdn.com/4cab41d7-e6b8-41ce-b82e-f07ca42e5b65/-/preview/-/format/jpg/","https://ucarecdn.com/6d0dac62-fca0-4077-9830-630591787970/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4fb5e681-030b-4f09-a04c-b1b09cd7ec49\"}"},{"__ref":"Education:{\"uuid\":\"ec56f44f-e711-4644-b399-0834d7dd82ad\"}"}],"hiredAt":"2026-01-19T18:33:17.481Z","topics":["Algebra I","Algebra II","K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Chemistry","Writing","Academic Coaching","College Essay Writing","Reading","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/adbf
