xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b942fa64-bf14-45ee-b250-ca5b01ca84e8\"}":{"__typename":"Favorites","uuid":"b942fa64-bf14-45ee-b250-ca5b01ca84e8","photoUrl":"https://ucarecdn.com/c6590cca-ace9-4db3-8be6-4d34a542b5b2/","title":"Songs in the Key of Life by Stevie Wonder ","type":"ALBUM"},"Favorites:{\"uuid\":\"dbeacc24-6d14-49ee-95b0-0b9ac6781ecb\"}":{"__typename":"Favorites","uuid":"dbeacc24-6d14-49ee-95b0-0b9ac6781ecb","photoUrl":"https://ucarecdn.com/a2127f41-114c-4e44-9519-4e8606643788/","title":"Ma Rainey's Black Bottom by August Wilson","type":"PLAY"},"Favorites:{\"uuid\":\"3b0df072-b578-4f36-9041-14a6efe98cbb\"}":{"__typename":"Favorites","uuid":"3b0df072-b578-4f36-9041-14a6efe98cbb","photoUrl":"https://ucarecdn.com/8d5b8cce-ba37-4bc0-a9d8-6bf564173a4d/","title":"New Orleans, Louisiana","type":"CITY"},"CausesSupported:{\"uuid\":\"90d4c8ff-fbf1-418d-b9fa-56c20c68bc01\"}":{"__typename":"CausesSupported","uuid":"90d4c8ff-fbf1-418d-b9fa-56c20c68bc01","name":"Akshaya Patra","description":"\u003cp\u003eAllows me to connect to my Indian roots while also reducing world hunger.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"9e30e07b-c56a-42ec-8228-45a98e1ba724\"}":{"__typename":"CausesSupported","uuid":"9e30e07b-c56a-42ec-8228-45a98e1ba724","name":"Immigrant Justice","description":"\u003cp\u003eEspecially now, it is crucial to support and uplift immigrants in America. \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"98f46097-16f8-4c8a-b4e2-4b8e1731a5fa\"}":{"__typename":"DeepDives","uuid":"98f46097-16f8-4c8a-b4e2-4b8e1731a5fa","content":"\u003cp\u003eMy family is from South India, the “Land of Coconuts” as many people call it. I spent most of my childhood in this area, playing ball with friends and drinking delicious coconut water, fresh from the tree. Perhaps one of my most formative experiences there, however, was learning from my grandfather, who was part of a local school board. I would accompany him on his trips to the school and observe how the teachers would interact with their students. We were in rural India, far from any modern civilization, but what stood out to me about the teachers at this school was their emphasis on morality and the greater good. There was a sense of collective responsibility among the students to uplift each other and their community. Teachers would encourage students to make community meals, clean up trash, and aid the elderly. This is something I always try to implement into my teaching style. Students are humans first, and social responsibility is something central to the human experience. No matter what a student is pursuing, I always encourage them to think about how it fits into something larger than themselves.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"fd73f764-65d8-49af-866d-76a5267919d4\"}":{"__typename":"DeepDives","uuid":"fd73f764-65d8-49af-866d-76a5267919d4","content":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI would tell my high school self to never stop asking questions. No matter how insignificant something may seem, curiosity can make all the difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"11b6356b-c05c-4ce4-87cd-32f9771a1e97\"}":{"__typename":"DeepDives","uuid":"11b6356b-c05c-4ce4-87cd-32f9771a1e97","content":"\u003cp\u003eSince I was a kid, it has always been my dream to have one of my original musicals premiere on Broadway. I want to tell untold stories and amplify unique experiences. I recently wrote a musical outlining the effects of a flood that my South Indian family had to deal with, placing the story in an American context. It was a way for me to bridge gaps in my identity, and it would mean the world to see it come to fruition on stage.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"eefe25ac-8d04-412f-8cf3-04a145f41d95\"}":{"__typename":"DeepDives","uuid":"eefe25ac-8d04-412f-8cf3-04a145f41d95","content":"\u003cp\u003eNothing motivates me more than thinking about my artistic idols. I think about people like Stevie Wonder, Nina Simone, Norman Rockwell, and Langston Hughes, to name a few. Many of these people, even through adversity, were able to reach a state of unapologetic self-expression. That is something I always strive for, and studying these figures is an incredible motivator. In fact, I have posters of many of them on the walls of my college dorm. I call it my “wall of gods.”\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"965b72c5-044e-4763-8211-b693d0cdb652\"}":{"__typename":"School","uuid":"965b72c5-044e-4763-8211-b693d0cdb652","name":"Newton North High School","city":"Newton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02460"},"Education:{\"uuid\":\"7ca45588-ec63-4e23-9196-326af629616f\"}":{"__typename":"Education","uuid":"7ca45588-ec63-4e23-9196-326af629616f","school":{"__ref":"School:{\"uuid\":\"965b72c5-044e-4763-8211-b693d0cdb652\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"306034e0-3af1-4e22-a891-f725bf864359\"}":{"__typename":"Education","uuid":"306034e0-3af1-4e22-a891-f725bf864359","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Education Studies and Music","degree":null},"MentorPublicProfile:{\"uuid\":\"35f5235b-0d40-4b47-9600-86873c360f1b\"}":{"__typename":"MentorPublicProfile","uuid":"35f5235b-0d40-4b47-9600-86873c360f1b","displayName":"Surya G.","slug":"surya-gopal-1","biography":"\u003cp\u003eHi! My name is Surya, and I am a sophomore at Brown University studying Education Studies and Music.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy passion for music began as early as I can remember. My father was a blues guitarist and singer, and he introduced music to me not as something to be studied, but as something to be \u003cem\u003efelt. \u003c/em\u003eThis very concept is what I want to emphasize to students. It's possible to find this sense of “feeling” in even the most unfamiliar topics, academic or otherwise.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGoing into college, I knew I wanted to pursue music, but I also wanted an actionable way to share that passion with others. That’s where Education Studies came in! Throughout high school, I taught piano, music theory, and singing to young children, and that passion was rekindled when I served as a head music teacher of a children’s music school last summer. I realized that education is one of the most meaningful ways to make change in today’s world, and if I could incorporate music into that pursuit, even better!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy artistic and academic endeavors have taken me to many different places, both nationally and internationally. In my last year of high school, I travelled to New Orleans to compete in a Jazz Festival with my Jazz Band, winning the Worldstrides “Maestro” award for excellence in musicianship, which came with an invitation to perform at Carnegie Hall in New York City.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI have also pursued educational opportunities through a foundation I started with my sister called the Saraswati Initiative. My grandparents’ town in South India has recently been ravaged by a flood, and this organization was a way to promote flood relief and environmental sustainability, beginning with schools. Our work in this initiative led to our feature in 2 state-wide newspapers in India.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUltimately, my background in the arts, in education, and in social activism has allowed me to connect with people in powerful and unique ways. My sessions with students will not be traditional in their methods, but will instead emphasize collaboration and conversation.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my studies, I enjoy cooking, hiking, and restaurant hopping. I am particularly proud of my mac n’ cheese recipe (the secret is Old Bay seasoning and hot sauce).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWorking with you would be my honor, and I know we can find creative ways to take your goals to the next level.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"00XfrtZNd1WUSs8f5VKllCMqBS5F4kW4etmkvlaSNBNU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt may seem corny, but I think my greatest achievement is the relationship I have fostered with my younger sister. She is my best friend, and together we have completed so many fulfilling goals. Whether that was through environmental activism, musical collaboration, or even our numerous inside jokes, my relationship with my sister is a representation of the best parts of me.\u0026nbsp;\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b942fa64-bf14-45ee-b250-ca5b01ca84e8\"}"},{"__ref":"Favorites:{\"uuid\":\"dbeacc24-6d14-49ee-95b0-0b9ac6781ecb\"}"},{"__ref":"Favorites:{\"uuid\":\"3b0df072-b578-4f36-9041-14a6efe98cbb\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"90d4c8ff-fbf1-418d-b9fa-56c20c68bc01\"}"},{"__ref":"CausesSupported:{\"uuid\":\"9e30e07b-c56a-42ec-8228-45a98e1ba724\"}"}],"major":"Education Studies and Music","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"98f46097-16f8-4c8a-b4e2-4b8e1731a5fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd73f764-65d8-49af-866d-76a5267919d4\"}"},{"__ref":"DeepDives:{\"uuid\":\"11b6356b-c05c-4ce4-87cd-32f9771a1e97\"}"},{"__ref":"DeepDives:{\"uuid\":\"eefe25ac-8d04-412f-8cf3-04a145f41d95\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cf165e0c-5821-478b-99bf-7d6e237b349a/-/preview/-/format/jpg/","https://ucarecdn.com/5e4c684c-8585-46f8-99dd-3bbf9f52f0be/-/preview/-/format/jpg/","https://ucarecdn.com/b3db61c2-d4fa-48fb-8080-f40fdda2fb04/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7ca45588-ec63-4e23-9196-326af629616f\"}"},{"__ref":"Education:{\
