xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"eadda785-b7bf-4c02-9e7a-8babf50f1c0b\"}":{"__typename":"Favorites","uuid":"eadda785-b7bf-4c02-9e7a-8babf50f1c0b","photoUrl":"https://ucarecdn.com/c7b3f66f-0f3b-4f86-a3f8-4a170935c701/","title":"Volleyball","type":"SPORT"},"Favorites:{\"uuid\":\"f4e58b71-2eaa-4fa8-b50c-720bead407fe\"}":{"__typename":"Favorites","uuid":"f4e58b71-2eaa-4fa8-b50c-720bead407fe","photoUrl":"https://ucarecdn.com/d42567f5-6155-4359-9024-1b551fe35a6d/","title":"Daniel Caesar","type":"ARTIST"},"Favorites:{\"uuid\":\"c24a13ad-ac80-4b18-a9e1-e8405d7cbdc1\"}":{"__typename":"Favorites","uuid":"c24a13ad-ac80-4b18-a9e1-e8405d7cbdc1","photoUrl":"https://ucarecdn.com/e3b9501d-ec08-4594-bbf6-dcf6e2b4877e/","title":"Tokyo","type":"CITY"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f4396a7e-ebd0-4124-859d-8ac2ce2e7ed9\"}":{"__typename":"DeepDives","uuid":"f4396a7e-ebd0-4124-859d-8ac2ce2e7ed9","content":"\u003cp\u003eI have always believed that society should have more of a childlike curiosity. Engineering is what fuels my inner child. I love the possibility of being able to create whatever I want, whenever I want. The applications of robotics, especially, have a limitless potential to change our world for the better. I would love to be part of the team making science fiction and the inventions we see in movies and books, real. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, I believe engineering is one of the hardest degrees a student can pursue. I believe learning is a lifelong process, and there's nothing like the feeling of successfully creating or debugging an invention you came up with! I love the success I feel after hours of hard work, and would love to share this passion with you, my mentee!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9d7dfb2b-06e9-4533-afbc-c54880508a1d\"}":{"__typename":"DeepDives","uuid":"9d7dfb2b-06e9-4533-afbc-c54880508a1d","content":"\u003cp\u003eThe biggest piece of advice I would give to my past self would be to have fun. I find that a lot of students, especially those with a more academic background, pursue activities or prestigious events they aren't fully passionate about. I believe this is the wrong way to go about life. Learning and education are meant to be fun and explorative. What's the point of doing something if you aren't having fun with it? \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere's a common misconception that one can't have fun and be successful at the same time. I'd argue that the truth is the complete opposite. The \"best\" and most successful people and role models are those who pursue what they love. By diving deep into subjects and activities that you truly love, you will have the best chance of excelling in these fields because you truly are having fun. You only have one life, so make the most of it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"f6b4aa4f-ba67-4ee8-986d-49c164c9a394\"}":{"__typename":"DeepDives","uuid":"f6b4aa4f-ba67-4ee8-986d-49c164c9a394","content":"\u003cp\u003eI have never had an official mentor, tutor, or counselor. Everything I've done throughout life was created from hours of hard work, independent research, and support from my family or friends. As I look back, I can see what a tremendous help it would have been if I had a mentor to guide me through both my academic career and life in general.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter hearing about Curious Cardinals and the tremendous impact that fellow mentors are having on their mentees, I instantly wanted to have a mentor-mentee relationship. There is no better feeling than seeing someone you mentor and care about succeed. I've felt this on numerous occasions with my younger brother and sister. I would love to be given the privilege of helping you, my mentee, succeed and cultivate a love for learning!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"ab17707d-5606-4960-af17-81a8c07796a9\"}":{"__typename":"DeepDives","uuid":"ab17707d-5606-4960-af17-81a8c07796a9","content":"\u003cp\u003eFirst off, I extremely value time with family and friends. I always prioritized family vacations, such as traveling abroad, as well as general hangouts and dinners with the people that I love. That said, I also made sure to continue my education, sports, and academic career. Summer break was a time to relax, but also a time when I had the freedom to explore whatever interested me! Whether it was academic research programs, club volleyball national tournaments, building mechanical keyboards, learning how to cook, or simply playing video games, I made sure to have fun and create core memories. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn particular, one memorable experience was my summer after high school graduation. I went to Japan as part of my senior week trip with my closest friends. I had so much fun exploring Japanese culture, but also just spending time with my friends one last time before we all left for college. The food there was also DELICIOUS! Yes, summer is a time for refreshment, exploration, and continued learning, but more importantly, summer is at time for making core memories.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"bc632131-4f99-4234-9dee-6868d25abf97\"}":{"__typename":"School","uuid":"bc632131-4f99-4234-9dee-6868d25abf97","name":"Crean Lutheran High School","city":"Irvine","type":"HIGH","state":"California","country":"United States","zip":"92618"},"Education:{\"uuid\":\"1c4a505f-55b0-43b0-ac05-17653bff4563\"}":{"__typename":"Education","uuid":"1c4a505f-55b0-43b0-ac05-17653bff4563","school":{"__ref":"School:{\"uuid\":\"bc632131-4f99-4234-9dee-6868d25abf97\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"2e90983e-d6e7-407e-af29-09b19052bb35\"}":{"__typename":"Education","uuid":"2e90983e-d6e7-407e-af29-09b19052bb35","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Electrical Engineering \u0026 Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"8a741cf1-d6f0-416f-8538-04e8127379bb\"}":{"__typename":"MentorPublicProfile","uuid":"8a741cf1-d6f0-416f-8538-04e8127379bb","displayName":"Ethan L.","slug":"ethan-lai","biography":"\u003cp\u003eHi!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Ethan, and I'm a current engineering student at Stanford University, passionate about the futuristic applications of robotics. Whether it's robotics in daily life, artificial intelligence, medicine, space exploration, or for simple entertainment, all of these sectors interest me!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a child, I LOVED watching movies like Big Hero 6, Meet the Robinsons, and Iron Man. These movies are actually what inspire me to pursue engineering! I would love to help make science fiction a reality. Imagine if Baymax, upside-down walking microbots, or Spider-Man's suit existed? How COOL would that be?!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, I am involved with Stanford Student Robotics on the SkyRunners team. We are building an autonomous food-delivery drone service with eVTOLS (think a mashup between a helicopter and airplane) so that we can satisfy students' late-night cravings! We are also in the middle of planning a Drone Hackathon for Spring 2026 - imagine an event where hundreds of students come together to build and fly drones competitively! Additionally, I am involved with research involving aircraft design, space robotics, and artificial intelligence training.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout high school, I was heavily involved with social entrepreneurship and medicine. I co-founded a TEDx program at my school, hosted numerous fundraisers to raise water filters for developing countries, and ran vaccination clinics internationally with Nigerian doctors! Although I have since transitioned away from the more medicinal route, I still have a tremendous passion for helping people physically and mentally. One avenue I am currently exploring is robotics in medical technology!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSome of my favorite hobbies include playing volleyball, going to the gym, building mechanical keyboards, playing board games with friends and family, and cooking! I have played club indoor volleyball for over 7 years and was on my High School's Varsity team for my entire career. I love staying active, so I am always excited to play any type of sport with friends. As an engineer, I love tinkering and fine-tuning mechanical devices. If you have not customized a mechanical keyboard before, I would love to help! I actually ran a small mechanical keyboard business in high school if that sounds interesting!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I promise to be that older brother with great advice and teaching capabilities, but also someone who you can laugh and feel comfortable with. I value close relationships, so you can expect sessions filled with fun and personalized insight. I'm excited to meet you and I can't wait to develop our active learning relationship!\u003c/p\u003e","teachingVideoPlaybackId":"P3ARbxj3qSVaSYv6tnGW5Kowq9VCyWroQ02l4b2HXSvI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"eadda785-b7bf-4c02-9e7a-8babf50f1c0b\"}"},{"__ref":"Favorites:{\"uuid\":\"f4e58b71-2eaa-4fa8-b50c-720bead407fe\"}"},{"__ref":"Favorites:{\"uuid\":\"c24a13ad-ac80-4b18-a9e1-e8405d7cbdc1\"}"}],"causesSupported":[],"major":"Electrical Engineering \u0026 Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f4396a7e-ebd0-4124-859d-8ac2ce2e7ed9\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d7dfb2b-06e9-4533-afbc-c54880508a1d\"}"},{"__ref":"DeepDives:{\"uuid\":\"f6b4aa4f-ba67-4ee8-986d-49c164c9a394\"}"},{"__ref":"DeepDives:{\"uuid\":\"ab17707d-5606-4960-af17-81a8c07796a9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d215cb24-bd02-4bc0-b4a3-ac07c1e0a20d/-/preview/-/format/jpg/","https://ucarecdn.com/ff7ec064-7b94-4397-a4c4-a5bf3f13d69e/-/preview/-/format/jpg/","https://ucarecdn.com/decf8b71-44d3-4579-932a-bed98b26ba57/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1c4a505f-55b0-43b0-ac05-17653bff4563\"}"},{"__ref":"Education:{\"uuid\":\"2e90983e-d6e7-407e-af29-09b19052bb35\"}"}],"hiredAt":"2025-11-20T19:23:49.842Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Physics","Writing","Academic Coaching","College Essay Writing","Computer Science","Economics","Executive Function","Reading","Business / Entrepreneurship","Finance / Investing","Aviation / Aerospace","Coding / Programming","Machine Learning / AI","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ethan-lai\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8a741cf1-d6f0-416f-8538-04e8127379bb\"}"}}},"_sentryTraceData":"89117faa68b142fdbbdccd775b9d10f4-a9fd00e48152afda-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=89117faa68b142fdbbdccd775b9d10f4,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ethan-lai"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj
