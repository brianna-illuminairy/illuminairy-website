xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"be02f0f0-6bd0-4c60-8b43-1a1b784615d0\"}":{"__typename":"Favorites","uuid":"be02f0f0-6bd0-4c60-8b43-1a1b784615d0","photoUrl":"https://ucarecdn.com/840fffad-59d2-4c4d-b21f-e7340ceb4382/","title":"The Perks of Being a Wallflower","type":"BOOK"},"Favorites:{\"uuid\":\"2bcf9cfe-c0ab-4ef9-b4cf-1facde64a2a3\"}":{"__typename":"Favorites","uuid":"2bcf9cfe-c0ab-4ef9-b4cf-1facde64a2a3","photoUrl":"https://ucarecdn.com/c93a8ae7-3e86-49f1-868a-8323142ba265/","title":"Safety, Fred Again../Brian Eno","type":"SONG"},"Favorites:{\"uuid\":\"ce924297-6160-4197-99db-c7deb806592e\"}":{"__typename":"Favorites","uuid":"ce924297-6160-4197-99db-c7deb806592e","photoUrl":"https://ucarecdn.com/8c37d894-9c15-411e-9c8f-87bcb3124f44/","title":"Nicholas Galanin","type":"ARTIST"},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"950ec9e2-0550-4510-91b6-967a2af9a110\"}":{"__typename":"DeepDives","uuid":"950ec9e2-0550-4510-91b6-967a2af9a110","content":"\u003cp\u003eAs a middle school student I was an avid reader! This was a dramatic shift from before 5th grade when my comfort reading barely extended beyond Dr. Seuss (which I'd essentially memorized anyway) and the terror of facing down a chapter book was comparable to a fire breathing dragon. I now realize I must have needed this intensive period of climbing trees and playing in the mud however; it seems to have been an essential prelude to the next three years of my life, which I spent almost entirely reading, averaging about 100 books a year.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"72d5871d-2ef2-419e-a773-dbfdc966563e\"}":{"__typename":"DeepDives","uuid":"72d5871d-2ef2-419e-a773-dbfdc966563e","content":"\u003cp\u003eHow could I possibly choose a career when I was fascinated by everything?! I struggled to find a direction in high school, finding my focus only when I changed the question I was asking myself—what are the ideas I can't live without? The majors I ended up studying were the subjects I seemingly couldn't help finding out more about, the ones I'd unconsciously be sneaking into any spare moment, the classes which made my heart race, and subjects above all where I felt the mentors I'd found truly understood what was important in life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"8a4fe18a-6592-4798-b9d7-3e25b635eb71\"}":{"__typename":"DeepDives","uuid":"8a4fe18a-6592-4798-b9d7-3e25b635eb71","content":"\u003cp\u003eAs a mixed race individual, my life has been one of reconciling two world views, two languages, choosing which parts of both I want to uphold and celebrate and which I feel I can leave behind. This bilingual thinking is at the center of academia for me, in which the ultimate test of learning is being able to simultaneously hold and understand differing truths, find compassion and empathy, and act with self-determination and discernment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, the values of language, community, and land stewardship within my indigenous identity were embodied for me in dance. After helping lead my college’s affinity organization for Native American students, dance continues to be central to my pursuit of these values: learning my native spoken language (Chickashanompa), connecting with my tribal community, and going deeper into sustainability in collaboration with local businesses and the Stockbridge-Munsee Band of the Mohicans on whose ancestral land I currently live. My teaching style entirely affirms these values, emphasizing embodied learning and learning tied to place and people, as well as the role of language as a world view which influences our actions.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9d478f5a-e73d-4345-849c-619648453ff7\"}":{"__typename":"DeepDives","uuid":"9d478f5a-e73d-4345-849c-619648453ff7","content":"\u003cp\u003eI love gardening! It feels like very durational choreography haha. I've lived in the North East for a long time, so I know all the flowers and the order they appear. I feel grounded in place and enjoy the work of it, listening to music and making the world a little more beautiful. Last September an indigenous friend at Yale shared heritage seeds with me for the three sisters (corn, beans, and squash) which I’m excited to plant this summer with the women in my family. A lovely older neighbor also recently gifted me a small seedling of her magnificent wisteria, and I gifted her snowdrops (the first flower to emerge in the spring, letting you know winter is over!), which feels like a beautiful way for our friendship to grow in each other's yards.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"004485d0-5bfe-413c-804e-6219d0348601\"}":{"__typename":"School","uuid":"004485d0-5bfe-413c-804e-6219d0348601","name":"Berkshire Waldorf High School","city":"Stockbridge","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01262"},"Education:{\"uuid\":\"60be1853-da70-4c00-a6a3-a8f433643786\"}":{"__typename":"Education","uuid":"60be1853-da70-4c00-a6a3-a8f433643786","school":{"__ref":"School:{\"uuid\":\"004485d0-5bfe-413c-804e-6219d0348601\"}"},"startYear":"2015","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"6bd96508-fc85-4500-9d33-d2118994ee81\"}":{"__typename":"Education","uuid":"6bd96508-fc85-4500-9d33-d2118994ee81","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Romance Languages and Literatures/Theater Dance and Media","degree":null},"MentorPublicProfile:{\"uuid\":\"bd137335-f37f-4fe7-a0e7-082876a819b5\"}":{"__typename":"MentorPublicProfile","uuid":"bd137335-f37f-4fe7-a0e7-082876a819b5","displayName":"Laura C.","slug":"laura-coe","biography":"\u003cp\u003eHello! My name is Laura Coe. I’m a Harvard graduate specializing in language arts and cultural studies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe learning matters because it can be shared! Learning Proportions for example is given a profoundly new meaning when it becomes less about a test score and more about talking to a three year old about the beauty of sunflowers. I'm here to help you find your voice, and listen: who are you interested in speaking to?\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn a testament to my work as a choreographer (a study of time, space, and energy which reaches far beyond dance), I’ve found a love of many subjects through learning grounded in experience, relationships, and connection. I attended a very Emersonian high school, in which the road to self-discovery was lined with camping trips to study tidepools in Maine, speaking about the power of rap with artists in Cuba, and baking a twenty-four layer cake for each of the levels in Dante’s \u003cem\u003eInferno \u003c/em\u003eto speak through the universal theme of food.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college I specialized in Cultural Studies and Performance Theory, a combination of philosophy, movement and theater studies, post-colonial studies, and gender studies, centering people and places. At a college which asks you to learn “a bit about everything, and something very well” I also spent three semesters with a wonderful calculus professor, considering self-understanding through the study of change, in history and music engineering seminars, creating worlds through words, and becoming friends with many old rare books (as well as some very wonderful people!). My dedication to academics, art, and community earned me the title of John Harvard Scholar (top 5% of my class), the Harvard Office for the Arts ‘Suzanne Farrell Dance Award’ for “outstanding artistry,\" and NCBA ‘Floor Angels Award’ for promoting “inclusion and empowerment.”\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince college I’ve continued to travel, teach, perform, and pursue my commitment to my indigenous culture through language revitalization and sustainability efforts in partnership with local tribes and organizations.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy understanding, creativity, and imagination are here to help guide your academic journey! I have had many wonderful mentors in my life and I want to make sure everyone finds that—not only a great amount of love and support and belief, but also a trusted source of critique and, perhaps most importantly, someone whose curiosity is contagious.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI can't wait to share learning with you:)\u003c/p\u003e\u003cp\u003eLaura\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"b3PptmI99uqxpAUGhAKXj5ivIfXktcV3TJGmNsvgxpk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI've been the recipient of two artistic grants, and toured a choreographic work to Europe, which won “Best Art / Music Installation” at NIME 2024, praised as, “a touching and moving performance, beautifully yet subtly composed and executed.\" Next stop: the Smithsonian Museum in Washington D.C.!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"be02f0f0-6bd0-4c60-8b43-1a1b784615d0\"}"},{"__ref":"Favorites:{\"uuid\":\"2bcf9cfe-c0ab-4ef9-b4cf-1facde64a2a3\"}"},{"__ref":"Favorites:{\"uuid\":\"ce924297-6160-4197-99db-c7deb806592e\"}"}],"causesSupported":[],"major":"Romance Languages and Literatures/Theater Dance and Media","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"950ec9e2-0550-4510-91b6-967a2af9a110\"}"},{"__ref":"DeepDives:{\"uuid\":\"72d5871d-2ef2-419e-a773-dbfdc966563e\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a4fe18a-6592-4798-b9d7-3e25b635eb71\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d478f5a-e73d-4345-849c-619648453ff7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/65be5188-1880-4367-9270-5987c1e3a053/-/preview/-/format/jpg/","https://ucarecdn.com/d8ae4fbc-057a-460f-aae7-75ed0d6a4440/-/preview/-/format/jpg/","https://ucarecdn.com/82b36572-cb63-4b74-81bc-acf8be4263ee/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"60be1853-da70-4c00-a6a3-a8f433643786\"}"},{"__ref":"Education:{\"uuid\":\"6bd96508-fc85-4500-9d33-d2118994ee81\"}"}],"hiredAt":"2025-04-11T09:15:57.378Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Music","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Web Design","Sustainability","Journalism"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"laura-coe\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bd137335-f37f-4fe7-a0e7-082876a819b5\"}"}}},"_sentryTraceData":"b6a4e082a7c84637b62d73815d44712b-8b101947fd85e862-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b6a4e082a7c84637b62d73815d44712b,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"laura-coe"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></nos
