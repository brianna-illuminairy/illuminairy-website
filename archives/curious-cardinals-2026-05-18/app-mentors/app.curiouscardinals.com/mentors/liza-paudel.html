xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"daf76db3-1d12-44df-b9ea-8b9e19f3e61d\"}":{"__typename":"Favorites","uuid":"daf76db3-1d12-44df-b9ea-8b9e19f3e61d","photoUrl":"https://ucarecdn.com/dc75da7f-76f9-426a-9874-220774ae6d34/","title":"Irrfan Khan ","type":"ACTOR"},"Favorites:{\"uuid\":\"3c8579e5-4681-4f78-938a-51bfe3659d72\"}":{"__typename":"Favorites","uuid":"3c8579e5-4681-4f78-938a-51bfe3659d72","photoUrl":"https://ucarecdn.com/89a8bc19-8eb5-476e-8cec-58429e45e25f/","title":"To The Lighthouse ","type":"BOOK"},"Favorites:{\"uuid\":\"f508cdac-52fe-4c86-b113-df4d9eb6de25\"}":{"__typename":"Favorites","uuid":"f508cdac-52fe-4c86-b113-df4d9eb6de25","photoUrl":"https://ucarecdn.com/9e092509-581c-49dd-a58f-a180700527a9/","title":"New York City ","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2b43ed0f-dc83-4ed4-a9b3-b02e77794de5\"}":{"__typename":"DeepDives","uuid":"2b43ed0f-dc83-4ed4-a9b3-b02e77794de5","content":"\u003cp\u003eOne advice I would give to my younger self is to get involved with anything that I find interesting! Whether an extra-curricular activity aligns with your career goals or not, it will nonetheless be incredibly meaningful in your personal development. That is a key component to finding success in the ways you define it! From my personal experience, I did theatre in high school, which helped me to build my public speaking skills and taught me how to navigate nervousness. So, get involved with any activity you find interesting! Whether that is music, arts, gaming, sewing, cooking, or anything else, it will provide meaning to your life in one way or another. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e5b4423c-5c5d-4395-8991-a2677b50d7a8\"}":{"__typename":"DeepDives","uuid":"e5b4423c-5c5d-4395-8991-a2677b50d7a8","content":"\u003cp\u003eI chose to major in psychology because of its deep versatility in any field. To understand psychology is to understand human nature, and consequently to understand yourself better. I find that psychology has been incredibly meaningful for me in terms of defining my own character, and understanding others with depth and empathy. These core skills, I believe, are applicable in any job field. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4118f757-22bd-4ca1-a08d-7b900255a533\"}":{"__typename":"DeepDives","uuid":"4118f757-22bd-4ca1-a08d-7b900255a533","content":"\u003cp\u003eIn my spare time, I love to engage my creativity in any way possible. I love to read books, paint, watch a good film, or write poetry. All of these ways of engaging with my creativity is valuable in creating a deep level of introspection for me about my own self, which helps me constantly build my character and strive to become my highest self. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"38da50a7-5e41-49d9-8928-618e8b9c7d51\"}":{"__typename":"DeepDives","uuid":"38da50a7-5e41-49d9-8928-618e8b9c7d51","content":"\u003cp\u003eMentorship matters to me because I myself had a wonderful mentor throughout my high school and college years. I credit everything I have been able to accomplish so far to that support that I received. It is incredible how much a support system can drive your motivation and help you build confidence. I am forever grateful for my mentor, and I hope to become that support for someone else. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"c44b0d29-076f-46f6-a2b0-c233f8975887\"}":{"__typename":"School","uuid":"c44b0d29-076f-46f6-a2b0-c233f8975887","name":"Susquehanna Township High School","city":"Harrisburg","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"17109"},"Education:{\"uuid\":\"19a0b05a-8d3d-41ba-840b-a10a94c2105a\"}":{"__typename":"Education","uuid":"19a0b05a-8d3d-41ba-840b-a10a94c2105a","school":{"__ref":"School:{\"uuid\":\"c44b0d29-076f-46f6-a2b0-c233f8975887\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"ca3b8112-7099-4427-9aed-6ae245168a24\"}":{"__typename":"Education","uuid":"ca3b8112-7099-4427-9aed-6ae245168a24","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"28ffc1fa-dcb5-4a17-9693-888548a0a969\"}":{"__typename":"MentorPublicProfile","uuid":"28ffc1fa-dcb5-4a17-9693-888548a0a969","displayName":"Liza P.","slug":"liza-paudel","biography":"\u003cp\u003eHi! I am Liza, a fourth-year student studying psychology at Columbia University. Throughout my college years, I have been involved in psychology research, where I have researched imagination in the brain with the Living Lab. In the lab, I engaged with high-level research and ran over 100 participants, strengthening both my research and interpersonal skills. I have created research posters and presented them at research symposiums. I am also a Laidlaw Scholar at Columbia, through which I received the opportunity to work as a design and development intern in Kathmandu, Nepal this past summer. As a design and development intern, I gathered all of my psychology knowledge and designed a trauma-informed curriculum for counselors and clients, creating meaningful changes in a non-profit organization that is focused on women and children. Furthermore, I have been a volunteer at the Crisis Text Line for the past four years, and have a Crisis Management Certification. Throughout all of my experiences, I have cultivated strong academic rigor, maintaining a 3.9 GPA throughout my years at Columbia. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have also been a Teaching Assistant for a psychology course at Columbia University, where I worked with college-aged students to create meaningful progress in their academic life. Furthermore, as an RA for Columbia's engineering program, SHAPE, I have accumulated the skills to work meaningfully with high-school students in order to help advance their personal projects and academic life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I have deep knowledge in the film world. Previously, I have been a Director of Photography for a short film, and a second camera assistant for another short film. I have also acted in a few short films in the past. I am currently acting in a Nepali Web Series as a series regular! A fun fact about me is that I am fluent in four languages: English, Nepali, Hindi and Urdu. I enjoy Urdu poetry, Russian literature, and watching films from all around the world. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have skills in psychology, research, and film. If your interests align with mine, I would be happy to connect and help provide academic mentorship in the humanities field or help you develop your passion projects in the fields of psychology, research, or film! \u003c/p\u003e","teachingVideoPlaybackId":"RnBq6401IYalx3vNGPJL4ICTWhJU5teApZwMA45sSZGk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"daf76db3-1d12-44df-b9ea-8b9e19f3e61d\"}"},{"__ref":"Favorites:{\"uuid\":\"3c8579e5-4681-4f78-938a-51bfe3659d72\"}"},{"__ref":"Favorites:{\"uuid\":\"f508cdac-52fe-4c86-b113-df4d9eb6de25\"}"}],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2b43ed0f-dc83-4ed4-a9b3-b02e77794de5\"}"},{"__ref":"DeepDives:{\"uuid\":\"e5b4423c-5c5d-4395-8991-a2677b50d7a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"4118f757-22bd-4ca1-a08d-7b900255a533\"}"},{"__ref":"DeepDives:{\"uuid\":\"38da50a7-5e41-49d9-8928-618e8b9c7d51\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/40863108-83fd-4b79-baf7-e28c768643bf/-/preview/-/format/jpg/","https://ucarecdn.com/05de4c8a-4c7e-47c1-abf5-0dd5a54d4738/-/preview/-/format/jpg/","https://ucarecdn.com/619ecf7c-830d-45ad-91f2-40b2f56e7328/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"19a0b05a-8d3d-41ba-840b-a10a94c2105a\"}"},{"__ref":"Education:{\"uuid\":\"ca3b8112-7099-4427-9aed-6ae245168a24\"}"}],"hiredAt":"2026-01-01T02:17:27.529Z","topics":["K-5 Grade Math","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Film / Theater","History Project","Video / Photography","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/
