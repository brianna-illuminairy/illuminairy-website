,"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7e893afb-ee35-45ef-8d71-dff129203e92\"}":{"__typename":"DeepDives","uuid":"7e893afb-ee35-45ef-8d71-dff129203e92","content":"\u003cp\u003eIn my spare time, I love immersing myself in a good book, often diving into philosophy, science fiction, or anything that challenges my thinking. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also enjoy biking, especially through scenic trails where I can take in the beauty of nature. There’s something incredibly refreshing about being outdoors, surrounded by the tranquility of the natural world. Whether it’s a quiet ride through a forest or along a coastline, it’s my way of recharging and finding balance amidst the demands of academic life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"81843ab2-f347-4acd-b105-67d5d90f62b2\"}":{"__typename":"DeepDives","uuid":"81843ab2-f347-4acd-b105-67d5d90f62b2","content":"\u003cp\u003eMy high school summers were diverse and aligned with my changing interests. The first summer, during the onset of COVID-19, I volunteered at a food shelter. The next summer, I engaged in research projects, tutored students, and took advanced chemistry and mathematics courses. In my final summer, I participated in a 6-week NIH-funded REU, shadowed an internal medicine doctor, and took additional courses in mathematics. Each experience was a deliberate choice, helping me explore and refine my academic and professional goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"0c392a4e-3115-4e65-9060-88330d116dcf\"}":{"__typename":"School","uuid":"0c392a4e-3115-4e65-9060-88330d116dcf","name":"FAU High School","city":"Boca Raton","type":"HIGH","state":"Florida","country":"United States","zip":"33431"},"Education:{\"uuid\":\"f2d14a92-8edb-4601-b98e-ea4dffee310d\"}":{"__typename":"Education","uuid":"f2d14a92-8edb-4601-b98e-ea4dffee310d","school":{"__ref":"School:{\"uuid\":\"0c392a4e-3115-4e65-9060-88330d116dcf\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"fa044334-523c-4539-98d4-f5dfa57bcffe\"}":{"__typename":"Education","uuid":"fa044334-523c-4539-98d4-f5dfa57bcffe","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mathematics, Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"bfb87098-7394-454b-8d65-1fc5b44ba4a0\"}":{"__typename":"MentorPublicProfile","uuid":"bfb87098-7394-454b-8d65-1fc5b44ba4a0","displayName":"Kia G.","slug":"kia-ghods","biography":"\u003cp\u003e“Just because we can’t find a solution, it doesn’t mean there isn’t one.”\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHi! My name is Kia Ghods, and I’m a student at Princeton University, where I’m pursuing studies in mathematics and computer science. My academic passion centers on the intersection of biological computation, artificial intelligence, and how we can harness brain-inspired ideas to solve complex problems in computer science. This fascination has driven me to explore the intricate connections between mathematical theory and computational models, applying these concepts to tackle challenges across various fields.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Princeton, I’m actively engaged in research at the Neuroscience of Cognitive Control Lab. My work focuses on the intersection of cognitive science and machine learning, with a particular interest in model interpretability and understanding the limitations of these models. I believe that by understanding how our brains process information, we can develop more robust and transparent AI systems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of research, I lead Princeton’s Sports Modeling Club, where we explore the application of statistical and machine learning techniques to sports analytics. I also contribute as a section editor for The Daily Princetonian, and I help host a reading group that delves into the latest breakthroughs in Natural Language Processing (NLP).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy journey in problem-solving began in high school, where I was involved in using mathematical models to study diseases such as HIV and COVID-19. I gained valuable experience working in a drug discovery lab at the UF Scripps Research Institute and was the only high school student selected for a NIH-funded REU on Biostatistics \u0026amp; Data Science.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I’m passionate about sports, particularly basketball and tennis, and I’m an avid reader, currently making my way through Nietzsche’s \u003cem\u003eBeyond Good and Evil\u003c/em\u003e. I’m also deeply interested in pedagogy, always striving to find the best analogies to explain complex concepts. As a mentor, I’m committed to providing top-notch educational experiences in biology, chemistry, neuroscience, mathematics, and computer science.\u003c/p\u003e","teachingVideoPlaybackId":"9cJaaGi56MkARL2ycJKTUUxV25v6uGFyi004JMvNBtBY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThis past summer, I was one of 10 interns selected to work on a cutting-edge project at the intersection of consumer social technology and artificial intelligence/machine learning. Collaborating with remarkable professors from Stanford and UC Berkeley, I had the unique opportunity to contribute to the development of innovative solutions that blend academic research with real-world applications. The experience not only deepened my understanding of AI and entrepreneurship but also reinforced my passion for pushing the boundaries of technology. I’m proud of the impact our work had and look forward to continuing this journey in the fall.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"1d9db6d1-c7d7-4d8c-8936-1bcd4fa14462\"}"},{"__ref":"Favorites:{\"uuid\":\"81644d34-10d8-4f24-b2d7-fec0b8c5bedb\"}"},{"__ref":"Favorites:{\"uuid\":\"aeeb9bea-438f-4a1c-9781-0e0c7204b076\"}"}],"causesSupported":[],"major":"Mathematics, Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6be3090b-172d-4ab5-a659-5ce2994e3ecb\"}"},{"__ref":"DeepDives:{\"uuid\":\"0055a620-3c07-4dab-b92f-f041f25b6dbf\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e893afb-ee35-45ef-8d71-dff129203e92\"}"},{"__ref":"DeepDives:{\"uuid\":\"81843ab2-f347-4acd-b105-67d5d90f62b2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2f07e6c6-1a56-4476-b251-0fe2087d2d04/-/preview/-/format/jpg/","https://ucarecdn.com/33c0778a-c3b1-434a-87de-d507516f8f68/-/preview/-/format/jpg/","https://ucarecdn.com/4590a11e-f0bd-494e-a3e5-a23c711c09fa/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f2d14a92-8edb-4601-b98e-ea4dffee310d\"}"},{"__ref":"Education:{\"uuid\":\"fa044334-523c-4539-98d4-f5dfa57bcffe\"}"}],"hiredAt":"2024-08-01T11:11:57.758Z","topics":["Coding / Programming","Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Biology","STEM Project"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/","https:/
