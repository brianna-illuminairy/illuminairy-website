xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e5251b93-c93e-4ceb-b7ff-da162ac2fcc1\"}":{"__typename":"Favorites","uuid":"e5251b93-c93e-4ceb-b7ff-da162ac2fcc1","photoUrl":"https://ucarecdn.com/22c3f6fe-7241-4919-b030-64cd76a975a4/","title":"Duke MBB (Blue Devils)","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"f767fea8-1b29-49eb-a65d-614ee579ec17\"}":{"__typename":"Favorites","uuid":"f767fea8-1b29-49eb-a65d-614ee579ec17","photoUrl":"https://ucarecdn.com/b5d7a7c9-e711-4ef3-984c-f9e2aa5c69bd/","title":"Houston, TX","type":"CITY"},"Favorites:{\"uuid\":\"dd097c36-5fa4-43e7-8f0f-81ec252376c4\"}":{"__typename":"Favorites","uuid":"dd097c36-5fa4-43e7-8f0f-81ec252376c4","photoUrl":"https://ucarecdn.com/b56ef70b-fca4-4443-97a3-85433c001cb0/","title":"Yesterday - The Beatles","type":"SONG"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"b3478f94-d293-46dd-bda2-1f0336062f25\"}":{"__typename":"DeepDives","uuid":"b3478f94-d293-46dd-bda2-1f0336062f25","content":"\u003cp\u003eFor me, singing has always been something I rely on to help me navigate challenging times. For instance, sitting at the piano and learning to sing a new song, music allows me to process emotions that are sometimes difficult to express with words or thoughts alone.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMotivated by its personal significance, I began to wonder if my love for singing could also uplift others in need of support. During my senior year of high school, I founded an organization called \"\u003cstrong\u003eSinging for Seniors\u003c/strong\u003e,\" a small community of students eager to use their talents to bring music to local senior and older-adult communities. Together, we toured our community, performing songs like \"L.O.V.E.\" by Nat King Cole and \"Hey Jude\" by The Beatles for groups of older adults.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis was an extremely fulfilling experience for me. With my interest in a medical career, I was driven to positively impact the well-being of those around me. However, being in high school, I sometimes felt I lacked the training to make a meaningful impact on others. Through Singing for Seniors, I realized that even without an expert knowledge of healthcare, I could find unique ways to use my existing passions to support others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, creating this organization was an encouraging experience that motivated me to expand my skill set and continue finding ways to support others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"407202ea-9fe2-4783-ba5d-116d3f080ec9\"}":{"__typename":"DeepDives","uuid":"407202ea-9fe2-4783-ba5d-116d3f080ec9","content":"\u003cp\u003eFor me, biology is the most satisfying field of study. It seeks to explain the most complex yet omnipresent phenomenon in our world: life. From when I was a small kid catching snails in the yard, to today as I look up to the trees growing in Duke Forest, I have always marveled at the diversity of life on Earth. Amazingly, within this heterogeneity are certain fundamental processes that unite seemingly unrelated things. Take Ohm’s Law. While traditionally understood as a simple physics formula, biologists have applied the equation to explain distinct processes in nature, such as the movement of water through trees to the propagation of electrical currents in neurons. In this way, studying biology can break down the most complex processes in nature - disease progression, behavior, and biodiversity to name a few - into its fundamental parts, ultimately satisfying my curiosity about understanding why life is the way it is.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"1e65fe1d-4811-476d-b73c-47a74d0048fc\"}":{"__typename":"School","uuid":"1e65fe1d-4811-476d-b73c-47a74d0048fc","name":"Clements High School","city":"Sugar Land","type":"HIGH","state":"Texas","country":"United States","zip":"77479"},"Education:{\"uuid\":\"c897d8f7-511d-445c-9c09-ff45aaada5dd\"}":{"__typename":"Education","uuid":"c897d8f7-511d-445c-9c09-ff45aaada5dd","school":{"__ref":"School:{\"uuid\":\"1e65fe1d-4811-476d-b73c-47a74d0048fc\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"71f18078-06a4-4ced-930a-fb1542dbcdc6\"}":{"__typename":"Education","uuid":"71f18078-06a4-4ced-930a-fb1542dbcdc6","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biology, Neurobiology Concentration","degree":null},"MentorPublicProfile:{\"uuid\":\"82391a93-b0b5-4836-b7cd-f36d585aa5c3\"}":{"__typename":"MentorPublicProfile","uuid":"82391a93-b0b5-4836-b7cd-f36d585aa5c3","displayName":"George R.","slug":"george-arthur","biography":"\u003cp\u003eHey y'all! Looking forward to meeting you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is George Romero, a recent graduate from Duke University. In May 2024, I completed a B.S. in Biology (Concentration in Neurobiology) with Minors in Chemistry and Neuroscience. Currently, as I work at a dermatology private practice in D.C., I am applying to medical schools for matriculation in Fall 2025.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo me, physicians are specialized teachers, using their training and knowledge to guide patients through health concerns. In this way, my passion for medicine is closely connected to my love for mentorship and teaching.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a student, I found that my favorite classes -- and the classes I succeeded the most in -- were those with teachers who I had a close relationship with. As a mentor, I hope to further those relationships, being someone that others can look to not only for academic support, but also for guidance on goals and interests outside of the classroom. Throughout college, I gained experience teaching as a TA for technology classes at a local senior community center, and mentorship skills through my roles as a dorm resident assistant (RA) and college tour guide.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of mentorship, I have a love for singing and music. Those passions grew during college, where some of my proudest accomplishments were soloing two songs released on Spotify with my a cappella group, and being a commissioned vocalist for jazz and rock bands in Durham, NC. Finally, research was a large part of my undergrad experience, co-writing an award-winning report on the increased risk of surgeries performed during the evening. I also completed a thesis comparing language development in deaf and hard-of-hearing children and children with hearing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUltimately, I hope to use my experiences to support, guide, and mentor others as they navigate their own future goals!\u003c/p\u003e","teachingVideoPlaybackId":"ZI
