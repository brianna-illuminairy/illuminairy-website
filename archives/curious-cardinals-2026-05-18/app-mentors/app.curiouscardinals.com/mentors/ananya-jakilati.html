xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"340fb8d4-8a1a-464f-83f5-b114849bfcc8\"}":{"__typename":"DeepDives","uuid":"340fb8d4-8a1a-464f-83f5-b114849bfcc8","content":"\u003cp\u003eI love working with students! Even before I started working with children through my club in high school, I used to help out around the classroom and help peers with topics they were struggling with. As a passionate learner myself, I absolute love spreading my love for learning! Finally understanding something that you've been stuck on for a bit or learning something new often leads to the spark of curiosity in another topic and is quite rewarding. I love the process of learning and fulfilling curiosity as a whole, and being a mentor gives me the platform to help others discover their inner passions!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"dfe66787-bfcf-4215-8c1a-fbc48e85745e\"}":{"__typename":"DeepDives","uuid":"dfe66787-bfcf-4215-8c1a-fbc48e85745e","content":"\u003cp\u003eIn my spare time, I love to spend time with my family, read, and dance! Furthermore, I love to travel and explore new places, go on little adventures with loved ones. I love talking to people around me, as I am often surprised by novel ideas and perspectives, stories and backgrounds!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"f489856c-5c56-4414-8833-6bce54a4a8b0\"}":{"__typename":"DeepDives","uuid":"f489856c-5c56-4414-8833-6bce54a4a8b0","content":"\u003cp\u003eAs a high school student, I was very hard-working and ambitious. I was passionate about my work and wanted to begin to create my impact in the world. During my time in high school, as a student and leader, I learned multiple important life skills, such as time-management and organization. I learned quite a bit, both academically and personally!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8c8a4e07-cb56-477d-9680-98bd493a2c95\"}":{"__typename":"DeepDives","uuid":"8c8a4e07-cb56-477d-9680-98bd493a2c95","content":"\u003cp\u003eFollow your heart. At this age, a lot of us don't know what we want to do, in terms of our major and career yet. In following your heart, you can listen to your interests and work accordingly. Taking new and unique classes can lead to new interests or develop existing ones. Being creative with your work and learning to listen to yourself is the best way to move forward!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"4a08a2b6-244c-4da2-ac2b-ec8b7e3c6796\"}":{"__typename":"School","uuid":"4a08a2b6-244c-4da2-ac2b-ec8b7e3c6796","name":"Dublin High School","city":"Dublin","type":"HIGH","state":"California","country":"United States","zip":"94568"},"Education:{\"uuid\":\"8221e26b-b821-4a11-b510-a2e0ab5cc5d7\"}":{"__typename":"Education","uuid":"8221e26b-b821-4a11-b510-a2e0ab5cc5d7","school":{"__ref":"School:{\"uuid\":\"4a08a2b6-244c-4da2-ac2b-ec8b7e3c6796\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"cd2b1d56-989e-4312-bee0-3cb2611e9768\"}":{"__typename":"School","uuid":"cd2b1d56-989e-4312-bee0-3cb2611e9768","name":"University of California, Santa Cruz","city":"Santa Cruz","type":"COLLEGE","state":"California","country":"United States","zip":"95064"},"Education:{\"uuid\":\"66ea5610-12fd-4127-a020-2c83fec6e578\"}":{"__typename":"Education","uuid":"66ea5610-12fd-4127-a020-2c83fec6e578","school":{"__ref":"School:{\"uuid\":\"cd2b1d56-989e-4312-bee0-3cb2611e9768\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"662e6d78-8d23-4a39-a93f-357b670d710b\"}":{"__typename":"MentorPublicProfile","uuid":"662e6d78-8d23-4a39-a93f-357b670d710b","displayName":"Ananya J.","slug":"ananya-jakilati","biography":"\u003cp\u003eAnanya is a freshman at the University of California, Santa Cruz, majoring in Computer Science. The most important things to her are family, having fun, and learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWith the focus on Computer Science, Ananya has received her Certiport Certification in the programming languages of Python and Java. Additionally, she has received her certification for Autodesk Inventor, a software for 3-D modeling.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFurthermore, she received one certificate in Google Data Analytics and one in Machine Learning in the past year. Ananya participated in a Big Data Bootcamp @ UC Berkeley. She has experience working on app development and Swift/SwiftUI.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring high school, Ananya began three organizations, the most prominent being the ABCD club (Any Body Can Dream). Through this organization, as President/Founder, was able to organize over 1000 hours of one-on-one sessions between students in high school and K-12 students. Through her experience with this club, Ananya gained important skills of leadership, time-management, organization, and effective communication! In this club, Ananya spent much time mentoring students, guiding them and helping them achieve their goals! \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAdditionally, through her participation as a tutor in this club and volunteer in her community, Ananya received the President's Volunteer Service Award in 2022. For her work in her community, she was recognized and nominated for Dublin Young Citizen of the Year. Ananya took part in a Youth Leadership Conference @ Stanford University.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the past, Ananya has started a Photography club. This club hosted biweekly meetings for learning tips/tricks/lessons in photography, covered a TEDx event in school, and participated in showcases and competitions! In her free time, Ananya loves to dance, read, and spend time with her loved ones!\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnanya loves working with mentees and students, learning about their novel ideas and perspectives, their interests and passions! She is excited and looking forward to getting to know you!\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"jFvED601oBoJT00I2tf02ek4WD267j0001IXt02i4pwPK9qkI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"340fb8d4-8a1a-464f-83f5-b114849bfcc8\"}"},{"__ref":"DeepDives:{\"uuid\":\"dfe66787-bfcf-4215-8c1a-fbc48e85745e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f489856c-5c56-4414-8833-6bce54a4a8b0\"}"},{"__ref":"D
