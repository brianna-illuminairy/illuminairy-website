xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"67c7222c-499f-4f38-b018-07ed01540af4\"}":{"__typename":"DeepDives","uuid":"67c7222c-499f-4f38-b018-07ed01540af4","content":"\u003cp\u003eMy dream job is to be coach of Arsenal Football club. I have supported Arsenal for a while and love the emotions and history behind the club. Coaching Arsenal would mean a lot of pressure on my shoulders, but I have plenty of tactical ideas that I think would succeed. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"0e03b037-b0cd-41a2-ac50-e1b3ac5da2c7\"}":{"__typename":"DeepDives","uuid":"0e03b037-b0cd-41a2-ac50-e1b3ac5da2c7","content":"\u003cp\u003eMy greatest mentor is my godfather. I did not grow up Christian, in fact, I grew up quite the opposite. I staunchly resisted organized religion in all forms. But, as I grew up, I began to learn more about Christianity and had a fair share of questions about it. My now godfather, then he was just my friend's dad, was willing to answer these questions fully and transparently. And while he answered all of my questions, he did not tell me what to believe or think. He did not tell me I was wrong about what I thought then. His trust and patience remain with me to this day and are the main reason I chose him as my godfather when I was baptized during my junior year of high school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"694a4544-6e02-4dda-8f22-1e0f1a198e12\"}":{"__typename":"DeepDives","uuid":"694a4544-6e02-4dda-8f22-1e0f1a198e12","content":"\u003cp\u003eI want to publish poetry collections and I am confident that I will accomplish this goal. So, something a little less realistic that I want to achieve is to win the T.S. Eliot prize in poetry. This goal is far loftier than simply publishing. This award is highly prestigious and is given out to the single best collection of poetry written every year, meaning that I would have to be the best of the best: that is my ambition. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"905b7079-f83f-400b-a782-b660b530056b\"}":{"__typename":"DeepDives","uuid":"905b7079-f83f-400b-a782-b660b530056b","content":"\u003cp\u003eMy favorite thing to do in my downtime is listen to music. I think that 'listening to music' as an answer can be seen as quite basic, but, for me, listening to music provides much needed space and rest from the thoughts that fly around my mind all day. It allows me to take a break from busy days and disconnect.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2f319bcf-259e-4dfe-96be-2bb0ab0b948f\"}":{"__typename":"School","uuid":"2f319bcf-259e-4dfe-96be-2bb0ab0b948f","name":"Colorado Academy","city":"Denver","type":"HIGH","state":"Colorado","country":"United States","zip":"80235"},"Education:{\"uuid\":\"817420d8-b5da-4143-b3ca-18bfb86061cb\"}":{"__typename":"Education","uuid":"817420d8-b5da-4143-b3ca-18bfb86061cb","school":{"__ref":"School:{\"uuid\":\"2f319bcf-259e-4dfe-96be-2bb0ab0b948f\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"2e927c12-d6ac-4567-9448-b2cc16e6cdde\"}":{"__typename":"Education","uuid":"2e927c12-d6ac-4567-9448-b2cc16e6cdde","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"English with Concentration in Poetry Writing","degree":null},"MentorPublicProfile:{\"uuid\":\"3a2496de-f4cf-45a5-9059-ac58e990dc17\"}":{"__typename":"MentorPublicProfile","uuid":"3a2496de-f4cf-45a5-9059-ac58e990dc17","displayName":"Baillie W.","slug":"baillie-weil-1","biography":"\u003cp\u003eHello, I'm Baillie, a college student with a passion for guiding and supporting others in academic and personal growth. I'm currently a Sophomore at Washington University in St. Louis, majoring in English with Concentration in Creative Writing. I have spent much of my time here in English classes, honing my craft of poetry. In the past few years I have written upwards of 200 poems and am 60,000 words into my first novel. Currently, I work personally and individually with a faculty member at WashU with the express goal of getting my poetry published so hopefully that's coming soon. Outside of the classroom, I spend much of my time thinking about and playing sports (my favorite teams are Arsenal, the Denver Nuggets, the Baltimore Ravens and a few more). However, beyond sports as a hobby, my Dad instilled a unique interest in Sports Analytics in me. I was always fascinated by the process of how sports teams evaluate and choose players. I started and led the Sports Analytics club at my high school and I love learning more about the hidden reasons that players and teams succeed. Beyond sports, I enjoy listening to music (really any kind, but especially Country). Throughout the course of my life I hope to publish poetry and fiction, but also coach soccer or basketball. I love writing, but more than that I feel passionately about coaching high school and middle school sports. Coaches played a pivotal role in my personal growth throughout my life and I want to pay it forward. \u003c/p\u003e","teachingVideoPlaybackId":"qfnRQ3K02Q3xObNW00BY5tzcb1BYCf201Fq9RZrwhMq02t8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English with Concentration in Poetry Writing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"67c7222c-499f-4f38-b018-07ed01540af4\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e03b037-b0cd-41a2-ac50-e1b3ac5da2c7\"}"},{"__ref":"DeepDives:{\"uuid\":\"694a4544-6e02-4dda-8f22-1e0f1a198e12\"}"},{"__ref":"DeepDives:{\"uuid\":\"905b7079-f83f-400b-a782-b660b530056b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e434d638-960a-42f5-90f0-8d2cb60d833d/-/preview/-/format/jpg/","https://ucarecdn.com/6a367c51-3c18-4ed9-be52-98b44545ae8e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"817420d8-b5da-4143-b3ca-18bfb86061cb\"}"},{"__ref":"Education:{\"uuid\":\"2e927c12-d6ac-4567-9448-b2cc16e6cdde\"}"}],"hiredAt":"2023-09-30T00:22:12.888Z","topics":["Calculus","Algebra II","Statistics","Sports Journalism","Sports Analytics","College Essay Writing","Creative Writing","Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typena
