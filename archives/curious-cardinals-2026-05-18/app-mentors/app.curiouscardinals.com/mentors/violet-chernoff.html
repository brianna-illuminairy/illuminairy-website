sees these subjects as incredibly entwined; there are literary evocations in Freudian theory and explorations of madness in \u003cem\u003eJane Eyre.\u0026nbsp;\u003c/em\u003e First and foremost, Violet is interested in understanding human emotions and the mind, so she studies philosophy and neuroscience as well.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eBacking up a bit: She grew up in Brooklyn and graduated from the Packer Collegiate Institute in 2021. Her mother is a writer, so she was raised among books and poems and \u003cem\u003eNew York Times \u003c/em\u003earticles. She became obsessed with Harry Potter—showing up to middle school with a wand in hand—and many other series and books over the years. Hence, the subsisting interest in literature and the English major.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOutside of school, Violet was a not-so-good two season athlete, literary magazine editor, volunteer at the Brooklyn Autism Center, and hostess at the fantastic Israeli restaurant Laser Wolf. She spent her gap semester in Cape Town, South Africa interning at a domestic violence shelter, and suspects she might move overseas in the imminent future.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAt Brown, Violet spends her time pumpkin carving with friends (a seasonal interest), writing for the \u003cem\u003eBrown Art Review, \u003c/em\u003eworking on the crew of a short film, and co-producing a psychiatry podcast called \u003cem\u003eDeveloping Meaning with Dirk Winter.\u003c/em\u003e She can be found napping on the library couch or reading (as all English majors do) on the Main Green.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"m2Gak4EPFsw4b6pEfYVErUtxpuTcchlW9SgavfkTmeQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4ee719aa-f5ce-45e5-b634-ee31d5fd7203\"}"},{"__ref":"DeepDives:{\"uuid\":\"1921177e-1b47
