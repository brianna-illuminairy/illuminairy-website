xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0c940de5-31e3-4677-986a-0a8b56b866a2\"}":{"__typename":"DeepDives","uuid":"0c940de5-31e3-4677-986a-0a8b56b866a2","content":"\u003cp\u003eHistory has fascinated me since I could talk, read, and write. My lifelong love for Harry Potter was perhaps the most formative factor in shaping my historical interests. As I child, I was entranced by the wizarding world's range of historical contexts and aesthetics. Hogwarts castle appeared medieval, the etymology of the spells Latin and Norse, the wizarding clothes Victorian, the Muggle world contemporary, the motifs of light and darkness biblical, and so forth. How did all of these influences interact? I became obsessed with deciphering them and locating their real-life historical inspirations. I'm not exaggerating when I say that Harry Potter was my gateway to reading about medieval English mythology, European fascism, Georgian literature, and so many other things that interest me as an adult. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"490ad56a-4c66-4882-9803-5415993c1ad4\"}":{"__typename":"DeepDives","uuid":"490ad56a-4c66-4882-9803-5415993c1ad4","content":"\u003cp\u003eMy greatest role model is my grandfather, Jakob. At 92 years old, he dances on tables, makes new friends (often much younger than him), plays new instruments, and continues to read and learn more about topics that inspire him. His mind has become more open to new possibilities, ideas, and people with age, and he remains as curious and enthusiastic about life as ever. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"8c09e509-f920-411a-82a9-43993c71e66e\"}":{"__typename":"DeepDives","uuid":"8c09e509-f920-411a-82a9-43993c71e66e","content":"\u003cp\u003eAs a student, I was the ultimate teacher's pet and A Type personality. I was highly competitive with myself and others, I would remind teachers to assign homework, I wrote optional essays just for the sake of doing more work, and I would study late into the night, usually at the expense of healthy sleeping. There were positive and negative dimensions to this lifestyle. On the one hand, I developed a disciplined attitude to work, which I like to think I still maintain today. The time I spent reading and engaging with my academics fostered many of the passions that are most important to me today and that are now shaping my professional path. But my highly-strung academic mentality in school also meant that much of my self-esteem and confidence was derived from academic performance. This meant that minor setbacks affected me much more profoundly than they should have. I've now developed a healthier attitude to work and have come to understand that my contributions to the world and the people around me extend beyond grades! I've also learned that the real joy of education is the capacity it gives us understand the world and the people around us with greater nuance, respect, and open-mindedness.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"aa1d99c3-e5df-46b3-ac7a-6465349448ba\"}":{"__typename":"DeepDives","uuid":"aa1d99c3-e5df-46b3-ac7a-6465349448ba","content":"\u003cp\u003eI'm constantly inspired by the intellect and enthusiasm of my friends, teachers, and mentors, and would love to pass on the same spirit to my mentees. I truly believe in the contagious and reciprocal power of curiosity and learning. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough my PhD research is fascinating and rewarding, it's quite an isolating process because I'm essentially on my own with my ideas. By contrast, CC mentoring is a collaborative and connective experience in which my mentees and I get to exchange knowledge, questions and ideas!\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"88dd1127-fcf7-4386-ac56-d6df10dffdc6\"}":{"__typename":"School","uuid":"88dd1127-fcf7-4386-ac56-d6df10dffdc6","name":"Godolphin and Latymer School","city":"London","type":"HIGH","state":"England","country":"United Kingdom","zip":"W6 0PG"},"Education:{\"uuid\":\"1769d2b2-d02e-4a29-853b-7cb8a6a99b69\"}":{"__typename":"Education","uuid":"1769d2b2-d02e-4a29-853b-7cb8a6a99b69","school":{"__ref":"School:{\"uuid\":\"88dd1127-fcf7-4386-ac56-d6df10dffdc6\"}"},"startYear":"2012","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518\"}":{"__typename":"School","uuid":"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518","name":"University of Oxford","city":"Oxford","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"OX1 2JD"},"Education:{\"uuid\":\"e448cf10-862f-4a19-9118-f1e74d04114d\"}":{"__typename":"Education","uuid":"e448cf10-862f-4a19-9118-f1e74d04114d","school":{"__ref":"School:{\"uuid\":\"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2025","major":"Middle Eastern Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"d8e11401-1e0c-42a1-aae4-66037f1ac734\"}":{"__typename":"MentorPublicProfile","uuid":"d8e11401-1e0c-42a1-aae4-66037f1ac734","displayName":"Natalia H.","slug":"natalia-hildebrand","biography":"\u003cp\u003eI'm Swiss-Pakistani-American and grew up between Zürich and London. I completed my undergraduate studies in History at the LSE in London (2022), where I specialised in modern Middle Eastern and eighteenth-century European history. I then undertook a Master's in Modern Middle Eastern Studies at Oxford University (2025), where I focused on modern Arab history and the Arabic language. I'm now working on my PhD in History at Oxford. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy PhD research examines networks between Middle Eastern, Latin American, and African revolutionary movements during the 1964-1982 period of the Cold War. I'm a life-long history nerd and would love to share this passion with my mentees — I'm determined to demonstrate that history is the most powerful contextual tool we have for forming meaningful judgements about current events.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI would love to mentor any students interested in history, politics, literature, philosophy, languages, or other humanities subjects. I am particularly interested in European, Arab, and Russian contexts. I am equally excited about working with multilingual mentees — I speak English, German, Italian, French, and Arabic, and am studying Russian on the side. I love using these languages in my PhD research to interpret memoirs, diplomatic documents, letters, radio segments, and other materials in their original form. I'm a strong believer in the power of learning languages as a tool to foster empathy, cooperation, and conflict resolution skills. I've found recent developments in AI to be transformative for refining my existing languages and tackling new ones and would love to instruct mentees to do the same. I have always loved learning dialects and accents and particularly enjoy using ChatGPT to decipher nuances between Iraqi and Levantine Arabic. I am also currently working on mastering a Finnish accent in German.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my academic work and language learning, I'm deeply passionate about nature. Having grown up in Switzerland, I've always loved climbing mountains, biking, hiking, and skiing. I'm also a huge Harry Potter fan, and believe that Harry Potter can be applied to basically anything in the humanities (Enlightenment philosophy, medieval British history, Latin, World War II, or modern feminism, to name a few examples!). I also love listening to music and singing, particularly classic rock and country. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"hYKp7uzqchFC2TMMB02ZUaqTc01VgvZaRmbzremaxL3OE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Middle Eastern Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0c940de5-31e3-4677-986a-0a8b56b866a2\"}"},{"__ref":"DeepDives:{\"uuid\":\"490ad56a-4c66-4882-9803-5415993c1ad4\"}"},{"__ref":"DeepDives:{\"uuid\":\"8c09e509-f920-411a-82a9-43993c71e66e\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa1d99c3-e5df-46b3-ac7a-6465349448ba\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/40c56804-b37a-4e26-b517-ccf16f450697/-/preview/-/format/jpg/","https://ucarecdn.com/3a3c59b6-bb1d-48d0-b58c-5cd141765259/-/preview/-/format/jpg/","https://ucarecdn.com/c3371760-23e3-44e7-9c40-13b0482ecb35/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1769d2b2-d02e-4a29-853b-7cb8a6a99b69\"}"},{"__ref":"Education:{\"uuid\":\"e448cf10-862f-4a19-9118-f1e74d04114d\"}"}],"hiredAt":"2025-07-18T17:33:07.063Z","topics":["Writing","German","Academic Coaching","College Essay Writing","History","Reading","Creative Writing","History Project","Debate","Journalism","Law / Government / Policy","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"natalia-hildebrand\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d8e11401-1e0c-42a1-aae4-66037f1ac734\"}"}}},"_sentryTraceData":"8edadf095264457aa8a41be144deb235-8e3bd3699eec29c3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8edadf095264457aa8a41be144deb235,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"natalia-hildebrand"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
