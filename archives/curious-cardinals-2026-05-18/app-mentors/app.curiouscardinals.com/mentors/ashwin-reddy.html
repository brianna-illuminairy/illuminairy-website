xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"39bd9bf1-2b30-4017-a766-6b701e4d0561\"}":{"__typename":"DeepDives","uuid":"39bd9bf1-2b30-4017-a766-6b701e4d0561","content":"\u003cp\u003eImprove the access to safe, quality, and timely surgical care in low and middle income countries!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"cc3f5c85-2e2a-4259-a8e0-da1a4fa0dad2\"}":{"__typename":"DeepDives","uuid":"cc3f5c85-2e2a-4259-a8e0-da1a4fa0dad2","content":"\u003cp\u003eBecome a head and neck cancer surgeon!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"eeb2a6c5-c72b-4a99-9867-c3fe37cb9523\"}":{"__typename":"DeepDives","uuid":"eeb2a6c5-c72b-4a99-9867-c3fe37cb9523","content":"\u003cp\u003eIn my heritage, learning and knowledge is considered sacred. Thus, I believe that teaching is a way for me to empower those younger than me! It also makes me intentional about making what I teach relevant to my learners\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"c382da2f-0511-4c70-8a52-8b5b82e9ff0e\"}":{"__typename":"Education","uuid":"c382da2f-0511-4c70-8a52-8b5b82e9ff0e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Human Biology","degree":null},"School:{\"uuid\":\"a8f6d8e6-fb9d-4191-9d18-c3c330698b49\"}":{"__typename":"School","uuid":"a8f6d8e6-fb9d-4191-9d18-c3c330698b49","name":"North Allegheny Senior High School","city":"Wexford","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"15090"},"Education:{\"uuid\":\"64e5ebfa-e4d9-414c-b314-2cc19a219056\"}":{"__typename":"Education","uuid":"64e5ebfa-e4d9-414c-b314-2cc19a219056","school":{"__ref":"School:{\"uuid\":\"a8f6d8e6-fb9d-4191-9d18-c3c330698b49\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"a38d63ac-4fb6-43c6-97e3-e5cc8a6227c7\"}":{"__typename":"MentorPublicProfile","uuid":"a38d63ac-4fb6-43c6-97e3-e5cc8a6227c7","displayName":"Ashwin R.","slug":"ashwin-reddy","biography":"\u003cp\u003eAshwin Reddy is a fourth-year \u003cstrong\u003emedical student\u0026nbsp; at Johns Hopkins University\u003c/strong\u003e (Class of 2026) and an \u003cstrong\u003easpiring otolaryngologist-head and neck surgeon \u003c/strong\u003ecommitted to advancing \u003cstrong\u003edomestic and global surgical equity\u003c/strong\u003e. He graduated from \u003cstrong\u003eStanford University\u003c/strong\u003e in 2020 with a \u003cstrong\u003eB.S. in Human Biology\u003c/strong\u003e and a \u003cstrong\u003eMinor in Modern Languages\u003c/strong\u003e (Spanish and Hindi). Upon graduating, Ashwin received the Lauren D. Weinstein award for being the \u003cstrong\u003ebest undergraduate teaching assistant in life sciences\u003c/strong\u003e and the Joshua H. Lederberg award for graduating with a 4.0 GPA. He was inducted into the Phi Kappa Beta honors society.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAshwin’s path in medicine is rooted in his lifelong dedication to education, communication, and community partnership\u003c/strong\u003e. At Stanford, he served as a Teaching Assistant for Human Behavioral Biology, a resident assistant for first-year students, and an ESL instructor for Latina custodial staff. As a founding team member and \u003cstrong\u003eformer Head of Education at Curious Cardinals\u003c/strong\u003e, he helped build this global mentorship platform that has now reached thousands of K–12 students, authoring curricula and leading educator training across different fields of study — an experience that cemented his belief that \u003cstrong\u003eteaching and medicine share a common goal: empowering others to thrive.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAshwin’s path in medicine reflects that same commitment to equity and service. As \u003cstrong\u003eCo-Chief of Community Service for the Latino Medical Student Association\u003c/strong\u003e, he organized bilingual health and wellness workshops for Latinx youth, partnered with Casa de Maryland to engage students on topics from stress to sleep hygiene, and helped the Hopkins chapter earn the \u003cstrong\u003eSOURCE Community Service Award\u003c/strong\u003e for most impactful graduate-level community initiative. His dedication to global health has included \u003cstrong\u003esurgical-supply initiatives for war-impacted hospitals in Ukraine\u003c/strong\u003e, where he helped coordinate the delivery of hundreds of pounds of unused surgical supplies, and the \u003cstrong\u003edevelopment of an online residency curriculum for head and neck surgeons in Haiti\u003c/strong\u003e to sustain training amid political instability and reduced case volumes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAshwin’s global surgery research portfolio spans studies on characterizing the \u003cstrong\u003eburden of face, head, and neck surgical problems in a refugee camp in Tanzania\u003c/strong\u003e, assessments of \u003cstrong\u003eoccupational hearing loss in Nepal\u003c/strong\u003e through a \u003cstrong\u003eFulbright–Fogarty Fellowship\u003c/strong\u003e, and multi-country policy analyses on the inclusion of ear and hearing care and head and neck cancer care in national health strategies. At Johns Hopkins, his research explores \u003cstrong\u003esentinel bleeds and carotid blowout syndrome\u003c/strong\u003e in head and neck cancer and \u003cstrong\u003ecommunication disparities in pediatric tonsillectomy\u003c/strong\u003e. His published research works can be found here: https://scholar.google.com/citations?user=-pMvxLEAAAAJ\u0026amp;hl=en\u0026amp;authuser=1\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eBeyond medicine, Ashwin finds joy in learning languages, watching international films and sitcoms, hiking, rock climbing, and cooking\u003c/strong\u003e. At the heart of his work is a commitment to compassionate communication, mentorship, and the \u003cstrong\u003epursuit of more just, patient-centered surgical systems worldwide\u003c/strong\u003e.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"39bd9bf1-2b30-4017-a766-6b701e4d0561\"}"},{"__ref":"DeepDives:{\"uuid\":\"cc3f5c85-2e2a-4259-a8e0-da1a4fa0dad2\"}"},{"__ref":"DeepDives:{\"uuid\":\"eeb2a6c5-c72b-4a99-9867-c3fe37cb9523\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/001c4838-997a-41d5-9123-197098f51563/-/preview/-/format/jpg/","https://ucarecdn.com/adaccb22-32a3-4eb0-b33a-3a3061db5aab/-/preview/-/format/jpg/","https://ucarecdn.com/0ab5bee7-20e4-49e5-8e9f-e66f768281f7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c382da2f-0511-4c70-8a52-8b5b82e9ff0e\"}"},{"__ref":"Education:{\"uuid\":\"64e5ebfa-e4d9-414c-b314-2cc19a219056\"}"}],"hiredAt":"2021-08-03T13:33:42.000Z","topics":["Chemistry","Biology","6-8 Grade Science","Spanish","College Essay Writing","Academic Coaching","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ashwin-reddy\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a38d63ac-4fb6-43c6-97e3-e5cc8a6227c7\"}"}}},"_sentryTraceData":"388de3b68fda4e38baaa17b076f50797-b50f3204bc9cf33d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=388de3b68fda4e38baaa17b076f50797,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ashwin-reddy"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
