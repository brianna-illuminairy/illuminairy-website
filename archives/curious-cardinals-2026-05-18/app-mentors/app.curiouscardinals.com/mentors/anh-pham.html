xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b5cdc0e2-73cf-43a4-ae43-6adb2d34ae00\"}":{"__typename":"Favorites","uuid":"b5cdc0e2-73cf-43a4-ae43-6adb2d34ae00","photoUrl":"https://ucarecdn.com/868e3794-b0d6-4b21-bae6-ecfa17f94745/","title":"Volleyball","type":"SPORT"},"Favorites:{\"uuid\":\"370388fb-5a8e-45c4-a2f8-9b31aa4bf00d\"}":{"__typename":"Favorites","uuid":"370388fb-5a8e-45c4-a2f8-9b31aa4bf00d","photoUrl":"https://ucarecdn.com/868e3794-b0d6-4b21-bae6-ecfa17f94745/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"a26c8acc-b18e-476e-8d86-dbde6d4a3068\"}":{"__typename":"Favorites","uuid":"a26c8acc-b18e-476e-8d86-dbde6d4a3068","photoUrl":"https://ucarecdn.com/868e3794-b0d6-4b21-bae6-ecfa17f94745/","title":"New York City","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"99549bb2-a725-465c-ae1e-de7aef65bfbb\"}":{"__typename":"DeepDives","uuid":"99549bb2-a725-465c-ae1e-de7aef65bfbb","content":"\u003cp\u003eTrust the process! I know it’s scary to think about the future but just know that whatever is meant for you will come to you in one way or another. I mean just think about all of the hard times you’ve been through and how you thought you wouldn’t be able to get past it yet look at you now!\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"dd409b13-bd95-46d6-97d8-0d1ba2c2e99b\"}":{"__typename":"DeepDives","uuid":"dd409b13-bd95-46d6-97d8-0d1ba2c2e99b","content":"\u003cp\u003eI was convinced that I was destined to be a YouTuber... Who knows, I might pick up a camera again some day!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"28e84a8e-5297-4c47-8fb9-e51c8ec72609\"}":{"__typename":"DeepDives","uuid":"28e84a8e-5297-4c47-8fb9-e51c8ec72609","content":"\u003cp\u003eAs a first-generation student, I grew up without much guidance from my parents and thus, had to figure a lot of things out on my own. I understand the pressure that comes from carrying your family’s future and legacy on your back so I am a huge advocate of education but also pursuing your passion and prioritizing your mental health. At the end of the day, you have to take care of yourself first before taking care of others. As such, I am always super mindful when it comes to my mentees and will adjust the lesson accordingly depending on their mental capacity and interest at the moment. I hope to be a friend that they can comfortably confide in and go to for academic, professional, and general advice. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"ccab8bf3-e36c-4b96-9a48-6d39d1e74853\"}":{"__typename":"DeepDives","uuid":"ccab8bf3-e36c-4b96-9a48-6d39d1e74853","content":"\u003cp\u003eI graduated Summa Cum Laude from Westminster High School where I was a Co-Founder and Co-President of Operation Be Kind Club focusing on local philanthropy, President of AP Club to help low-income students fundraise for their AP exams, and a Link Crew Commissioner. Outside of classes, I was on the varsity volleyball team and our school’s robotics team that competed in the UC Davis C-STEM RoboPlay Competition where we won first in the state among other awards.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"fcbe64c6-64a6-4e04-b1df-b89c3b2c1528\"}":{"__typename":"School","uuid":"fcbe64c6-64a6-4e04-b1df-b89c3b2c1528","name":"Westminster High School","city":"Westminster","type":"HIGH","state":"California","country":"United States","zip":"92683"},"Education:{\"uuid\":\"749e2164-e14a-49fa-82a8-974b6de91e67\"}":{"__typename":"Education","uuid":"749e2164-e14a-49fa-82a8-974b6de91e67","school":{"__ref":"School:{\"uuid\":\"fcbe64c6-64a6-4e04-b1df-b89c3b2c1528\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"6613271c-981e-491b-8926-c5a9fc480e3d\"}":{"__typename":"Education","uuid":"6613271c-981e-491b-8926-c5a9fc480e3d","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Electrical Engineering \u0026 Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"b9bb444c-f778-4547-b107-f0796c8b9bf9\"}":{"__typename":"MentorPublicProfile","uuid":"b9bb444c-f778-4547-b107-f0796c8b9bf9","displayName":"Anh P.","slug":"anh-pham","biography":"\u003cp\u003eHi there, I’m Anh! I’m a fourth year studying Electrical Engineering and Computer Science at UC Berkeley. I was born in Vietnam but grew up in Orange County, CA, right next to Disneyland, and I will be living in New York after graduation!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Berkeley, I’m involved with Codebase, a student organization that builds software projects for high-growth tech companies. Within the club, I was an Internal Vice President and a developer for two different teams where I got to work on a web application to streamline The UC Berkeley Green Initiative Fund’s voting forum and a financial entity search engine API for Addepar. I’m also the current President of Phi Sigma Rho, a sorority for women in engineering that promotes academic excellence and cultivates friendship and personal growth.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI worked at T-Mobile as an RF Engineering intern my freshman summer where I conducted a project to minimize drop calls and optimize user experience throughout Southern California freeways. As for my last two summers, I was working at Datadog as a Software Engineering intern and got to work on a variety of different things including a new experimentation feature to help businesses measure the impact of new feature rollouts and a project to regulate monitor parsing logic and updating over 1.2M monitors to improve efficiency and code maintainability.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love playing with my electric guitar and working out! I enjoy lifting, kickboxing, cycling, hiking, and playing volleyball. The nerdiest thing about me is my love for Legos, Minecraft, and Rubik’s Cube. Fun fact: I used to have a YouTube channel where I made skits, vlogged about my day, and recorded myself playing Minecraft and solving Rubik’s Cube (I was a bored kid).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m a huge foodie (yes I have a Beli account!) and a die-hard matcha and coffee girlie. I love going on road trips and visiting national parks (my favorite so far is Zion!), but when I’m back home in SoCal you can always find me at the beach eating my Blue Bowl acai.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI accidentally stumbled across programming in 7th grade when I invaded my math teacher’s coding workshop and ended up staying to learn how to translate block coding into Java. I love how I was able to explore this field before even knowing what it was because it showed me how my genuine curiosity and passion led me to pursue this career. I hope to spread the enthusiasm for learning and cultivate my mentee’s passion to help them pursue their own dreams.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSuper excited to meet you! I hope to see you soon:D\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b5cdc0e2-73cf-43a4-ae43-6adb2d34ae00\"}"},{"__ref":"Favorites:{\"uuid\":\"370388fb-5a8e-45c4-a2f8-9b31aa4bf00d\"}"},{"__ref":"Favorites:{\"uuid\":\"a26c8acc-b18e-476e-8d86-dbde6d4a3068\"}"}],"causesSupported":[],"major":"Electrical Engineering \u0026 Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"99549bb2-a725-465c-ae1e-de7aef65bfbb\"}"},{"__ref":"DeepDives:{\"uuid\":\"dd409b13-bd95-46d6-97d8-0d1ba2c2e99b\"}"},{"__ref":"DeepDives:{\"uuid\":\"28e84a8e-5297-4c47-8fb9-e51c8ec72609\"}"},{"__ref":"DeepDives:{\"uuid\":\"ccab8bf3-e36c-4b96-9a48-6d39d1e74853\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c9877391-e4c7-457f-be61-1bebd0046d8f/-/preview/-/format/jpg/","https://ucarecdn.com/9205c4de-474a-4153-b3e5-f37a2ef7c38c/-/preview/-/format/jpg/","https://ucarecdn.com/fbcd3011-b954-4c19-8deb-2681423fab5a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Educati
