xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"53a12165-9218-4fba-8b88-8ce4099d6487\"}":{"__typename":"DeepDives","uuid":"53a12165-9218-4fba-8b88-8ce4099d6487","content":"\u003cp\u003eOne thing I wished I knew earlier is to not be afraid of trying new things. More importantly, it is crucial that you give yourself grace when doing so. Two of my greatest passions – dancing and producing music were things that I’ve always wanted to try in high school but never had the courage to try due to the learning curve until years later. I’ve learned that the more things you try, the more likely you will find something that you truly love to do. So go out there, try as many new things as you can, be kind to yourself while you figure out which you like and which you don’t, and find your passion!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a20383fa-4c78-4eb9-a27e-82b4112dca9b\"}":{"__typename":"DeepDives","uuid":"a20383fa-4c78-4eb9-a27e-82b4112dca9b","content":"\u003cp\u003eFor me, mentorship is a two-way street. The mentor provides guidance and the resources necessary for the mentee to succeed. At the same time, the mentee provides new perspective and inspiration to the mentor. Through the years of tutoring, I am amazed again and again at how much I learn from my students while we work together towards their goals. Mentorship matters to me because I can help my students overcome barriers and to succeed in their education at the same time as they elevate me to become the best I can be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"7853008d-b98e-4610-b11a-5331749986ef\"}":{"__typename":"DeepDives","uuid":"7853008d-b98e-4610-b11a-5331749986ef","content":"\u003cp\u003eOne of my earliest dreams was, and still is, to become someone who can help heal others in suffering, to encourage others in their most vulnerable moments, and to empower them through their health. Becoming a doctor has always been a goal of mine and I have been lucky enough to study medicine at Johns Hopkins. With my interest in pediatrics, I hope to one day be able to help open up a lifetime of opportunities for my patients and to make sure that they are able to achieve their own dreams without being hindered by their health.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"d8526022-c1df-4e1a-a522-aeb96bce874a\"}":{"__typename":"DeepDives","uuid":"d8526022-c1df-4e1a-a522-aeb96bce874a","content":"\u003cp\u003eA long passion project of mine has been creating more accessible dance resources to youth in Baltimore. Having danced for 7 years throughout undergrad and medical school, I’ve discovered just how important dance can be in promoting self-expression, identity, health, and community; dance is a powerful life raft that can help empower others. Unfortunately, access to dance is not equal – many communities do not have the space or mentorship necessary for children to explore the world of dance. Through online resources, health fairs, and future partnerships, I hope to promote the wonderful benefits of dance and to provide access to previously inaccessible dance resources.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"e3a7e210-8e3e-498f-af74-57a9976df470\"}":{"__typename":"School","uuid":"e3a7e210-8e3e-498f-af74-57a9976df470","name":"Johns Hopkins University","city":"Baltimore","type":"COLLEGE","state":"Maryland","country":"United States","zip":"21218"},"Education:{\"uuid\":\"174b9510-4cf3-425e-838d-d1711d848af7\"}":{"__typename":"Education","uuid":"174b9510-4cf3-425e-838d-d1711d848af7","school":{"__ref":"School:{\"uuid\":\"e3a7e210-8e3e-498f-af74-57a9976df470\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Molecular \u0026 Cellular Biology ","degree":null},"School:{\"uuid\":\"fb22e4fa-6f93-4d39-84e8-b84fd7a61943\"}":{"__typename":"School","uuid":"fb22e4fa-6f93-4d39-84e8-b84fd7a61943","name":"Ridge High School ","city":"Basking Ridge ","type":"HIGH","state":"NJ","country":"United States of America ","zip":"07920"},"Education:{\"uuid\":\"ffcaae42-97f8-4d89-9a2c-6b7c3785ff11\"}":{"__typename":"Education","uuid":"ffcaae42-97f8-4d89-9a2c-6b7c3785ff11","school":{"__ref":"School:{\"uuid\":\"fb22e4fa-6f93-4d39-84e8-b84fd7a61943\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"951cbb52-c5b2-4c45-943b-6b17cc6d5f04\"}":{"__typename":"MentorPublicProfile","uuid":"951cbb52-c5b2-4c45-943b-6b17cc6d5f04","displayName":"William W.","slug":"william-wen","biography":"\u003cp\u003eWilliam is a third-year medical student studying at Johns Hopkins. In 2020, he graduated from Hopkins with a B.S. degree in Molecular \u0026amp; Cellular Biology as well as a minor in Psychology. During his gap year, William also conducted research at the NIH to investigate piRNA machinery using genomic sequencing techniques. While medicine is William’s ultimate career interest, he is also very passionate about the creative and performance arts; during college, William danced for all 4 years and was awarded the Louis E. Goodman award in 2019 to pursue his own passion project in dance/videography. He is also deeply interested in music production. Having played the piano for over 10 years, William uses his music theory knowledge to produce extensively in Ableton. Finally, William believes strongly in the importance of mentoring as a way to provide the tools necessary for students to actualize their dreams. Currently, William tutors ESL with the Arlington Heights Memorial Library and 8th grade math with the Commodore John Rodgers School. Now, he is excited to connect with you and to learn about your interests through Curious Cardinals!\u003c/p\u003e","teachingVideoPlaybackId":"vSwgHgdzVjX6ZGi7TD2hD6dfEDssWlYIHr8WJ5duRMU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular \u0026 Cellular Biology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"53a12165-9218-4fba-8b88-8ce4099d6487\"}"},{"__ref":"DeepDives:{\"uuid\":\"a20383fa-4c78-4eb9-a27e-82b4112dca9b\"}"},{"__ref":"DeepDives:{\"uuid\":\"7853008d-b98e-4610-b11a-5331749986ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"d8526022-c1df-4e1a-a522-aeb96bce874a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/70f62df9-2568-46bb-b0f5-0a5a8f52f580/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"174b9510-4cf3-425e-838d-d1711d848af7\"}"},{"__ref":"Education:{\"uuid\":\"ffcaae42-97f8-4d89-9a2c-6b7c3785ff11\"}"}],"hiredAt":"2022-01-03T20:24:10.000Z","topics":["Fi
