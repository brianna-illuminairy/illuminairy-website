xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"22f7c981-0c2b-4b9c-ada7-485344ffc6d3\"}":{"__typename":"DeepDives","uuid":"22f7c981-0c2b-4b9c-ada7-485344ffc6d3","content":"\u003cp\u003eI chose data science as my major after a long journey of exploration and self-discovery. When I first came into college, I thought I wanted to pursue a premed track. However, after spending time in hospitals working as an EMT during my gap year, I realized that healthcare wasn’t the path for me. I still loved science, so I came into Northwestern as a biomedical engineer, but still felt like it wasn’t the right fit.\u003c/p\u003e\u003cp\u003eWhat truly excited me was the variety of subjects I was drawn to, and I realized I wanted to keep as many doors open as possible, exploring different industries and fields. Data science stood out because of its universal applicability—data is at the heart of so many industries, from healthcare to finance to entertainment. It offers me the flexibility to pivot into a wide range of careers while developing a valuable skill set.\u003c/p\u003e\u003cp\u003eWhat I find especially compelling about data science is how actionable the insights can be. The outcomes of data analysis aren’t just theoretical—they have the power to influence real-world decisions and make a tangible impact. Whether it’s optimizing business operations, improving healthcare outcomes, or helping organizations make better decisions, data science allows me to work on solutions that can make a meaningful difference in people’s lives. Knowing that the work I do can lead to real-world change is incredibly rewarding, and I can’t wait to see all the ways I use data science post grad as I start my career in consulting at Bain!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"693c6856-a946-4a7a-976e-4e546044aa7a\"}":{"__typename":"DeepDives","uuid":"693c6856-a946-4a7a-976e-4e546044aa7a","content":"\u003cp\u003eMentorship matters to me because I’ve been fortunate to have incredible mentors who have truly shaped my life, both academically and in sports. Means so much to have someone you look up to believe in you and support you. Each new phase of life brings with it all kinds of new challenges and experiences you have never faces before, and there is no better resource than someone who has been there before—someone who knows what it feels like and can provide advice rooted in real experience. Whether it be a freshman just getting to college, an athlete joining a new team, or a working professional starting a new job, new environments stretch us and push us in new ways. I’ve been lucky enough to have so many amazing mentors, and mentorship to me is also about continuing that cycle and passing on my own knowledge and experiences like others did for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"ff8d11b8-a997-4b3c-9926-91eb25df6bcf\"}":{"__typename":"School","uuid":"ff8d11b8-a997-4b3c-9926-91eb25df6bcf","name":"Milton Academy","city":"Milton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02186"},"Education:{\"uuid\":\"c72d102b-0eb7-46b5-a6e5-867da5e78f7e\"}":{"__typename":"Education","uuid":"c72d102b-0eb7-46b5-a6e5-867da5e78f7e","school":{"__ref":"School:{\"uuid\":\"ff8d11b8-a997-4b3c-9926-91eb25df6bcf\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"20939ea4-fdc8-4f51-80e1-fea4c250b4ca\"}":{"__typename":"Education","uuid":"20939ea4-fdc8-4f51-80e1-fea4c250b4ca","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"034000b9-8274-4786-8922-c8e6c6d3d357\"}":{"__typename":"MentorPublicProfile","uuid":"034000b9-8274-4786-8922-c8e6c6d3d357","displayName":"Emma D.","slug":"emma-drisko","biography":"\u003cp\u003eHello! My name is Emma Drisko, and I’m a student at Northwestern University majoring in Data Science with a minor in Computer Science, along with the Kellogg Certificate in Managerial Analytics. I’ve always been fascinated by the intersection of data and people, and my interests span a wide range of both STEM and non-STEM subjects—it’s honestly tough to pick just one! While my major and minor are analytical, I’ve also always had a passion for writing and the arts. More than anything, I love tackling new challenges and collaborating with others, which led me to explore a career in management consulting. After graduation, I’ll be joining Bain \u0026amp; Company in Chicago!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve gained a lot of experience mentoring, both academically and beyond the classroom. Here at Northwestern, I serve as a peer mentor for the Intro to Computer Science class, where I have the opportunity to make a real impact early in students' careers in CS. Many students who want to explore computer science but didn’t have the chance to dive in during high school often feel overwhelmed or out of place in a class with peers who have prior coding experience. I especially enjoy offering these students some extra encouragement and support to help them feel confident and engaged. Back in high school, I also tutored peers in writing, chemistry, and various math courses, which further fueled my passion for helping others succeed.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not working or studying, I love to get outside! In highschool I was a two season varsity athlete, playing hockey in the Winter and Lacrosse in the spring. Being from Boston, I’m an avid Bruins fan. I love skiing, camping, running, kayaking, or any other way I can get outdoors when it's nice. Along with my love for the outdoors, I’m passionate about exploring the vibrant Chicago food scene. One of my favorite cuisines is Ethiopian food—if you’re ever in Chicago, you absolutely have to check out Demera; it’s a must-try!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy learning philosophy is not only teaching students how to solve a particular problem or learn one specific concept, but equipping them with self confidence and learning tools to tackle any problem! In our work together, I will prioritize creating an environment where mistakes are seen as a natural part of the learning process, and where students feel comfortable taking risks and asking questions. The more confident they become in their abilities, the more willing they’ll be to challenge themselves. A love of learning and foundational tools will carry them much further in life than knowing the formula for permutations (although I’m happy to cover that too). I aim to be someone who not only helps with homework and projects, but also listens, encourages, and guides my mentees through any type of challenge they might face.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"22f7c981-0c2b-4b9c-ada7-485344ffc6d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"693c6856-a946-4a7a-976e-4e546044aa7a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c85ed593-fb48-453a-9f04-69033f752d20/-/preview/-/format/jpg/","https://ucarecdn.com/a8980091-99a3-4897-9708-208a6e19de68/-/preview/-/format/jpg/","https://ucarecdn.com/10935da1-ac47-46ad-9cb0-d195de33d70d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c72d102b-0eb7-46b5-a6e5-867da5e78f7e\"}"},{"__ref":"Education:{\"uuid\":\"20939ea4-fdc8-4f51-80e1-fea4c250b4ca\"}"}],"hiredAt":"2025-02-12T14:02:36.098Z","topics":["Pre-Algebra","Algebra I","Algebra II","Calculus","Statistics","Biology","Physics","Chemistry","6-8 Grade Science","Writing","French","College Essay Writing","Reading","Economics","Computer Science","Executive Function","Academic Coaching","K-6 Storybook","Creative Writing","Sports Journalism","Film / Theater","Business / Entrepreneurship","Coding / Programming","STEM Project","Sustainability","Law / Government / Policy","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"emma-drisko\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"034000b9-8274-4786-8922-c8e6c6d3d357\"}"}}},"_sentryTraceData":"d91c21486e77424bb00cba06a4b4ca70-a884a2b3f811453b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d91c21486e77424bb00cba06a4b4ca70,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"emma-drisko"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isF
