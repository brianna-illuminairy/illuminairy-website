xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a92d8021-c36b-4920-a61e-661d7ce826e8\"}":{"__typename":"DeepDives","uuid":"a92d8021-c36b-4920-a61e-661d7ce826e8","content":"\u003cp\u003eI was fortunate to get involved in research during my junior and senior years of high school. I worked in a lab at UCSF studying how to use gene-editing technologies to engineer stem cells to do certain things, such as cure rare diseases or grow into functional tissues. Outside of that, I also spent my summers teaching kids how to swim.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"43fc79b6-2cc6-487f-b16b-1c4215229270\"}":{"__typename":"DeepDives","uuid":"43fc79b6-2cc6-487f-b16b-1c4215229270","content":"\u003cp\u003eAlthough I majored in Applied Physics in college, I originally applied as a Biology major and was absolutely \u003cem\u003eatrocious\u003c/em\u003e at physics when I first started college. I eventually grew to love it due to the mentorship and support of a teaching assistant that worked with me in my freshman-level physics class. He inspired me to not only study physics, but also mentor and teach others, too!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8846d1e1-abc8-4819-8a43-6813ce9d6e79\"}":{"__typename":"DeepDives","uuid":"8846d1e1-abc8-4819-8a43-6813ce9d6e79","content":"\u003cp\u003eI enjoy finding time to work on fun programming side projects in my spare time. Some of my projects include Clerkship Connections (clerkshipconnections.com), which is essentially a rip-off of the NYT Connections game but for medical students, and Pimping Rounds (pimpingrounds.com), which is a variant of Wordle with a medical twist.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also am trying to blog more (check out michaelsyao.com/substack) - writing has never been my strong suit, but I'm hoping to get better at it by writing more consistently.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"29772147-b8b8-41bc-9b54-0e1b7258148e\"}":{"__typename":"DeepDives","uuid":"29772147-b8b8-41bc-9b54-0e1b7258148e","content":"\u003cp\u003eI try to play fetch with my dog every day - she's a Shetland Sheepdog and her name is Cherry!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"1868ebde-9723-4a98-ac7f-b90c5d084063\"}":{"__typename":"School","uuid":"1868ebde-9723-4a98-ac7f-b90c5d084063","name":"California Institute of Technology","city":"Pasadena","type":"HIGH","state":"California","country":"United States","zip":"91106"},"Education:{\"uuid\":\"91a3da8c-0f1a-4cc1-a594-a0c67430a04a\"}":{"__typename":"Education","uuid":"91a3da8c-0f1a-4cc1-a594-a0c67430a04a","school":{"__ref":"School:{\"uuid\":\"1868ebde-9723-4a98-ac7f-b90c5d084063\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"e4824b73-176b-4063-83d1-6247ba9a91cd\"}":{"__typename":"Education","uuid":"e4824b73-176b-4063-83d1-6247ba9a91cd","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2027","major":"MD/PhD Candidate","degree":null},"MentorPublicProfile:{\"uuid\":\"6ec7e1d7-a8c3-4d23-8255-ba47e94a4d50\"}":{"__typename":"MentorPublicProfile","uuid":"6ec7e1d7-a8c3-4d23-8255-ba47e94a4d50","displayName":"Michael Y.","slug":"michael-yao","biography":"\u003cp\u003eHi! My name is Michael and I'm a final-year MD-PhD student at the University of Pennsylvania. I received my PhD in Bioengineering and Master's in Computer Science, and am currently finishing up medical school. Prior to Penn, I received my BS in Applied Physics at Caltech where I graduated as salutatorian on a full-tuition merit scholarship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am studying to be a \u003cem\u003ephysician-scientist\u003c/em\u003e, which means I get to see patients and also do research in the lab. My research focuses on how we can develop better AI models for healthcare. I'm specifically interested in how we can apply clinical insights to different patient populations that are historically underrepresented in medicine. This allows me to work at the intersection of healthcare, computer science, and statistics. During my PhD, I was fortunate to do research both at Penn and also in industry labs at Microsoft, Genentech, and Scale AI. My work is also funded by the NIH and OpenAI.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have almost a decade of teaching experience: I've done 1:1 tutoring and/or worked as a teaching assistant for both college- and graduate- level classes every semester since 2017. I primarily have experience working with students on STEM-based projects related to biology, computer science, physics, and/or medicine. (Fun fact: my first teaching job was as a swim instructor for kids!)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm very passionate about is helping students identify and deepen their interests. I think discovering what you might be interested in can be a very daunting task, and struggled with a lot of career indecision during high school, college, and even early on in medical school. I enjoy working with students and families to help them identify their interests and craft passion projects and experiences to explore those interests in a meaningful way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I try to spend as much time as I can with my wife, dog, and two cats at home. I also enjoy solving the daily NYT Games and occasionally blog about advancements in AI as they pertain to clinical medicine. I was a former competitive swimmer and swam for Caltech in college, and occasionally enjoy getting a few laps in every now and then.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYou can learn more about me on my website at michaelsyao.com\u003c/p\u003e","teachingVideoPlaybackId":"s73fahdLW3nNyRZV1GKZw3V5zkuoUskGggWqbs023OFg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"MD/PhD Candidate","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a92d8021-c36b-4920-a61e-661d7ce826e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"43fc79b6-2cc6-487f-b16b-1c4215229270\"}"},{"__ref":"DeepDives:{\"uuid\":\"8846d1e1-abc8-4819-8a43-6813ce9d6e79\"}"},{"__ref":"DeepDives:{\"uuid\":\"29772147-b8b8-41bc-9b54-0e1b7258148e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/37732e0e-3ff9-477a-9f67-ddf5fa3f29b5/-/p
