xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d3df55d8-de44-43e3-ad06-01b8b1354b67\"}":{"__typename":"Favorites","uuid":"d3df55d8-de44-43e3-ad06-01b8b1354b67","photoUrl":"https://ucarecdn.com/e3b09ca7-ad2f-437e-8672-0d945cd44294/","title":"The Neapolitan Novels by Elena Ferrante","type":"BOOK"},"Favorites:{\"uuid\":\"f379a95e-4cd6-4039-ba15-74c5d9c0e15c\"}":{"__typename":"Favorites","uuid":"f379a95e-4cd6-4039-ba15-74c5d9c0e15c","photoUrl":"https://ucarecdn.com/b2d95f16-1be3-4028-b272-4a08af5eed5a/","title":"Running","type":"SPORT"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"36ffa175-ef0f-4536-bad9-8fb47421c511\"}":{"__typename":"DeepDives","uuid":"36ffa175-ef0f-4536-bad9-8fb47421c511","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would be simple: be brave and trust yourself.\u003c/p\u003e\u003cp\u003eSo many opportunities feel intimidating when you’re young because they seem far away or meant for someone else. But in reality, no one's fully prepared.\u003c/p\u003e\u003cp\u003eIf something excites you but also scares you a little, whether it's applying for a program, starting a project, reaching out to someone you admire, you should go for it!\u003c/p\u003e\u003cp\u003eLooking back, many of the experiences that shaped me most started exactly this way: saying yes to something that felt slightly unrealistic at the time. Solo traveling, taking on a national commission, working with people from across the world...none of those paths were perfectly planned. They started with curiosity and a willingness to take the first step.\u003c/p\u003e\u003cp\u003eConfidence isn’t something you wait to feel before acting. It’s something you build by doing things that are unfamiliar and occasionally uncomfortable.\u003c/p\u003e\u003cp\u003eSo try the things that seem just out of reach!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1a0df3e4-3a4d-4bf0-9c5c-9d3ee5a65a25\"}":{"__typename":"DeepDives","uuid":"1a0df3e4-3a4d-4bf0-9c5c-9d3ee5a65a25","content":"\u003cp\u003eMentorship, to me, is about having a safe space to think out loud. It’s having someone you trust and understand where you’re coming from, and who is genuinely invested in helping you grow. A good mentor doesn’t need to have all the answers, but they’ve often been in a similar position before and are willing to share what they’ve learned along the way.\u003c/p\u003e\u003cp\u003eSome of the most meaningful guidance came from conversations with friends, colleagues, teachers, and people a few steps ahead of me who took the time to talk things through. I still remember the feeling of leaving those conversations feeling inspired, encouraged, or simply reassured that I was on the right path.\u003c/p\u003e\u003cp\u003eMentorship matters because it reminds you that you don’t have to figure everything out alone. Sometimes all it takes is one conversation to help you see a problem differently or feel more confident taking the next step.\u003c/p\u003e\u003cp\u003eThat’s also why mentorship is something I care deeply about giving back. The support and encouragement I received from mentors played a huge role in shaping who I am today. Being able to offer that same space for someone else, to listen, guide, and support them in finding their passion is something I find incredibly meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"12287af3-1f65-42a4-acd5-2993a652b9d2\"}":{"__typename":"DeepDives","uuid":"12287af3-1f65-42a4-acd5-2993a652b9d2","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to improve access to education for girls and young women in underserved communities.\u003c/p\u003e\u003cp\u003e While traveling in\u0026nbsp;\u003cstrong\u003eAfghanistan\u003c/strong\u003e, I met many girls who were deeply passionate\u0026nbsp;about learning. It was inspiring to see their determination and curiosity, but it was also difficult to witness how access to education, something many of us take for granted, could be restricted or taken away entirely.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat experience stayed with me. It made me realize how powerful education can be, especially for young women, and how unequal access to it still is in many parts of the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the long term, I hope to combine my interests in technology and visual storytelling to address this challenge.  Technology can help scale solutions, and storytelling can help people understand why those solutions matter. And whether that takes the form of a platform, product, or organization, my goal is to build something that helps expand educational access while also raising awareness about the barriers many girls still face. \u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"91f2a315-d469-4526-9d6e-9217fe1d34b2\"}":{"__typename":"DeepDives","uuid":"91f2a315-d469-4526-9d6e-9217fe1d34b2","content":"\u003cp\u003eI chose to major in Computer Science and Art \u0026amp; Humanities because I’ve always been passionate about art and exploring different ways of understanding humans and the world. Moving to San Francisco helped me discover a strong interest in data. Seeing how messy data can be analyzed, interpreted, and turned into meaningful insights was truly inspiring. I realized that technology isn’t just a set of tools; it’s a powerful way to address urgent issues we face today, from inequality to accessibility. By combining my passion for humanistic thinking and creativity with technical skills, I want to create work that has tangible, positive social impact, products that not only innovate but also empower communities and improve people’s lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3ad6b98c-ba49-427c-be53-b52e4c889832\"}":{"__typename":"School","uuid":"3ad6b98c-ba49-427c-be53-b52e4c889832","name":"Loughborough High School","city":"Loughborough","type":"HIGH","state":"England","country":"United Kingdom","zip":"LE11 2DU"},"Education:{\"uuid\":\"21ed305d-a7a4-40d7-aef4-e94efab18f91\"}":{"__typename":"Education","uuid":"21ed305d-a7a4-40d7-aef4-e94efab18f91","school":{"__ref":"School:{\"uuid\":\"3ad6b98c-ba49-427c-be53-b52e4c889832\"}"},"startYear":"2021","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}":{"__typename":"School","uuid":"0a298df6-dac8-4a1d-8e35-77e7b609185d","name":"Minerva University","city":"San Francisco","type":"COLLEGE","state":"California","country":"United States","zip":"94103"},"Education:{\"uuid\":\"416a6956-8157-4627-9ae9-f08c1415adc6\"}":{"__typename":"Education","uuid":"416a6956-8157-4627-9ae9-f08c1415adc6","school":{"__ref":"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":" Computational Sciences and Design","degree":null},"MentorPublicProfile:{\"uuid\":\"dd9d5f65-3882-43d1-9abe-51d5f6e061e5\"}":{"__typename":"MentorPublicProfile","uuid":"dd9d5f65-3882-43d1-9abe-51d5f6e061e5","displayName":"Yuxi H.","slug":"yuxi-hou","biography":"\u003cp\u003eHi! I'm Yuxi. I’m currently studying Computational Science and Art and Humanities at Minerva University on a full merit-based scholarship(the most innovative University in the US with a 2% admission rate). For my degree, we'll travel to\u0026nbsp;San Francisco,\u0026nbsp;Buenos Aires,\u0026nbsp;Berlin, and\u0026nbsp;Tokyo to\u0026nbsp;learn how to become global leaders! I’m particularly interested in the intersection of technology, art, and social impact: how data, storytelling, and creative thinking can help us better understand people and communities.\u003c/p\u003e\u003cp\u003eBefore university, I spent two years working as a documentary visual storyteller. My work focuses on communities and stories that are often overlooked, from spiritual communities in the UK to young women navigating life in Afghanistan and Kazakh communities in northwestern China. I was commissioned by English Heritage, where I created a project about the Arbor Low stone circle. The exhibition was displayed for seven months at the Stonehenge Visitor Centre, and my work has also been shown in galleries across the UK(The New Art Gallery Walsall, New Art Exchange etc.). I’ve also worked in documentary film as Director of Photography on a residency for the British Film Institute.\u003c/p\u003e\u003cp\u003eAlongside storytelling, I care deeply about the communities around me and how I can create a positive social impact. I’ve worked as Co-Production Creative Leader at the National Justice Museum, designing and directing yearly creative programs to engage with more diverse visitors.  I also co-founded an art charity in partnership with the Afghanistan \u0026amp; Central Asian Association, where we ran weekly art workshops for Afghan refugee youth. Today, I work with 180 Degree Consulting and the La Raza Community Resource Center, helping nonprofit partners think through strategy, research, and data systems.\u003c/p\u003e\u003cp\u003eOutside of school and work, I’m happiest exploring. I grew up in Beijing, moved to the UK at fifteen, and started solo backpacking across Europe and Asia when I was sixteen. In my free time you'll find me in mountains, camping and trekking, training for another marathon, making potteries or baking cakes!\u003c/p\u003e\u003cp\u003eAs a mentor, I care most about helping mentee develop curiosity, confidence, and the courage to explore their own passion. I can't wait to go on this exciting journey with you!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLove,\u003c/p\u003e\u003cp\u003eYuxi\u003c/p\u003e","teachingVideoPlaybackId":"y01z02to1rNCnVFoxSuno7rjnEmQwH9ZH02XMeefKmP9Ow","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d3df55d8-de44-43e3-ad06-01b8b1354b67\"}"},{"__ref":"Favorites:{\"uuid\":\"f379a95e-4cd6-4039-ba15-74c5d9c0e15c\"}"}],"causesSupported":[],"major":" Computational Sciences and Design","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"36ffa175-ef0f-4536-bad9-8fb47421c511\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a0df3e4-3a4d-4bf0-9c5c-9d3ee5a65a25\"}"},{"__ref":"DeepDives:{\"uuid\":\"12287af3-1f65-42a4-acd5-2993a652b9d2\"}"},{"__ref":"DeepDives:{\"uuid\":\"91f2a315-d469-4526-9d6e-9217fe1d34b2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/74af6fb5-d2d7-4f17-a05f-8d20bc3fdf7f/-/preview/-/format/jpg/","https://ucarecdn.com/8faf2855-3ea1-40dd-9a36-1c27b7995737/-/preview/-/format/jpg/","https://ucarecdn.com/f2b2d9ed-cd50-490a-a015-c8b9df180527/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[
