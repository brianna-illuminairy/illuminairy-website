xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"35df114f-9b75-41a5-b123-aa50ee33535d\"}":{"__typename":"Favorites","uuid":"35df114f-9b75-41a5-b123-aa50ee33535d","photoUrl":"https://ucarecdn.com/3f8fbf8b-284a-4358-a1f2-feec79d8ef86/","title":"Homegoing by Yah Gyasi","type":"BOOK"},"Favorites:{\"uuid\":\"28e6db23-43f5-4247-a292-d2aa4003f323\"}":{"__typename":"Favorites","uuid":"28e6db23-43f5-4247-a292-d2aa4003f323","photoUrl":"https://ucarecdn.com/0c685de7-56f6-4147-8efc-539056fe852f/","title":"Athens, Greece","type":"CITY"},"Favorites:{\"uuid\":\"a52157ce-7506-4422-892e-48de482d9495\"}":{"__typename":"Favorites","uuid":"a52157ce-7506-4422-892e-48de482d9495","photoUrl":"https://ucarecdn.com/86e29424-e180-446d-92c7-c02b94b980fe/","title":"The Yussef Dayes Experience","type":"ALBUM"},"CausesSupported:{\"uuid\":\"fff1edf1-759f-476e-aaef-9beae924e0d6\"}":{"__typename":"CausesSupported","uuid":"fff1edf1-759f-476e-aaef-9beae924e0d6","name":"Generations United","description":"\u003cp\u003eRemodeling the food and afterschool activity offerings for young children. \u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"adb0bbc0-15bd-4f1a-99b9-5e85d79089a5\"}":{"__typename":"CausesSupported","uuid":"adb0bbc0-15bd-4f1a-99b9-5e85d79089a5","name":"MISS CEO","description":"\u003cp\u003eLeadership for teenage and young adult women! \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e85eea63-5b8f-45b0-9110-2017ac5db28e\"}":{"__typename":"DeepDives","uuid":"e85eea63-5b8f-45b0-9110-2017ac5db28e","content":"\u003cp\u003eYou can learn so much from people who are older and younger than you! Go ask elders and young kids questions about their life experience and perspective! Play games with them, and play games in general! They help you learn. Don't be afraid to spend quality time with yourself too...\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0e0d4fad-83a6-4242-9a9d-35732054c4c4\"}":{"__typename":"DeepDives","uuid":"0e0d4fad-83a6-4242-9a9d-35732054c4c4","content":"\u003cp\u003eWhen curiosity runs wild, you cannot tame it! An interdisciplinary degree like Cognitive Science opened up the space for me to explore the Mind from so many different angles. The questions I was asking about the world and our human experience were so multimodal, only something encompassing like Cognitive Science could do them justice. Neuroscience, Psychology, Philosophy, Linguistics, Computer Science, and more...\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"85f5683d-9754-430b-9ee2-454f44467fe3\"}":{"__typename":"DeepDives","uuid":"85f5683d-9754-430b-9ee2-454f44467fe3","content":"\u003cp\u003eI was born and raised in Greece for the most part, so I spend some time teaching Greek now. There's something fascinating about teaching a language and it's the invitation to simplify everything! We sometimes forget how to explain things plainly, yet when we do, we make room for new understanding and perspective. I try to teach using very simple ideas. You'd be surprised how many of us need a few simple, to-the-point, questions to get us unstuck. You might have heard the phrase \"making a mountain out of a molehill,\" well in Greek you'd say \"drowning in a drop of water.\" I'd love to help with that.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1abdaa25-b2b1-40b3-bce0-ad38026c48d2\"}":{"__typename":"DeepDives","uuid":"1abdaa25-b2b1-40b3-bce0-ad38026c48d2","content":"\u003cp\u003eA podcast! I love singing, talking, laughing out loud, public speaking...frankly I love using my voice for expression! When I was younger, my sister, neighbor and I started a radio station for our neighborhood. We would report on the weather and play our favorite songs. People would always say they loved my voice and I loved that they did! A couple years ago, I started my own podcast as an adult, sharing personal stories, ideas I was curious about, and conversations with friends and professors.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"bcdcd76e-87ee-4743-a5ae-2a016d5a7815\"}":{"__typename":"School","uuid":"bcdcd76e-87ee-4743-a5ae-2a016d5a7815","name":"Design Tech High School","city":"Redwood City","type":"HIGH","state":"California","country":"United States","zip":"94065"},"Education:{\"uuid\":\"fd791fbc-c658-4d84-b65b-9d0212f81be6\"}":{"__typename":"Education","uuid":"fd791fbc-c658-4d84-b65b-9d0212f81be6","school":{"__ref":"School:{\"uuid\":\"bcdcd76e-87ee-4743-a5ae-2a016d5a7815\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"acf7779f-556a-4cc1-a993-67996ce63112\"}":{"__typename":"Education","uuid":"acf7779f-556a-4cc1-a993-67996ce63112","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2024","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"c9175939-7f17-476b-bb48-d1cf81e699fd\"}":{"__typename":"MentorPublicProfile","uuid":"c9175939-7f17-476b-bb48-d1cf81e699fd","displayName":"Tatiana F.","slug":"tatiana-fakoukaki","biography":"\u003cp\u003eMy journey in Cognitive Science started from my passion for Psychology—the pursuit of understanding people—and that curiosity has shaped everything I do. Over the years, I’ve gained experience in a variety of areas where this mindset is essential:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAs a \u003cstrong\u003emarketing lead\u003c/strong\u003e for a travel and hospitality startup, I helped launch local experiences in Greece, blending my love of culture with my strategic thinking.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI \u003cstrong\u003eco-founded a nonprofit\u003c/strong\u003e introducing design thinking to education, where I recruited professionals from the local community to teach students real-world skills, emphasizing creativity and practical problem-solving.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI host a personal stories podcast called \"\u003cstrong\u003eMostly Memoz\u003c/strong\u003e,\" where I share insights and experiences about the intersections of life, culture, and growth.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAt UC Berkeley, I served as \u003cstrong\u003eco-president of the Hellenic Student Association\u003c/strong\u003e, where I organized events and fostered a sense of community among Greek-American students.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI \u003cstrong\u003evolunteered\u003c/strong\u003e at Oakland International High School, assisting teachers in supporting Hispanic students (I speak Spanish fluently), which gave me a deeper understanding of the challenges and strengths that come with learning in a second language.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI’ve taught \u003cstrong\u003etwo-week courses on Product Innovation\u003c/strong\u003e at Design Tech High School, where I developed lesson plans that encouraged students to think creatively and push the boundaries of what's possible.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI also interned at a capital fund in Puerto Rico, where I proposed strategies for integrating the firm with local artists, carpenters, musicians, and businesses to create a more sustainable and connected community.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eOn the side, I teach \u003cstrong\u003eSpanish\u003c/strong\u003e and \u003cstrong\u003edance\u003c/strong\u003e, both of which fuel my passion for culture and expression. Whether it’s teaching dance to bring people together or helping individuals learn a new language, I love sharing the things I’ve learned along the way.\u003c/p\u003e\u003cp\u003eI’m passionate about helping others approach challenges with curiosity, creativity, and confidence. If you’re looking for guidance on navigating complex projects, building new skills, or finding your own voice in a world full of possibilities, I’d love to help you discover the tools and insights to succeed.\u003c/p\u003e","teachingVideoPlaybackId":"jiF8IQ3N02HSNpUQgfdhAzV3YoS7tVqaFALNj00RaTozA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eCo-founded an Educational Non-Profit in Puerto Rico that spreads Design Thinking, mentorship, and professional development in public schools.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"35df114f-9b75-41a5-b123-aa50ee33535d\"}"},{"__ref":"Favorites:{\"uuid\":\"28e6db23-43f5-4247-a292-d2aa4003f323\"}"},{"__ref":"Favorites:{\"uuid\":\"a52157ce-7506-4422-892e-48de482d9495\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"fff1edf1-759f-476e-aaef-9beae924e0d6\"}"},{"__ref":"CausesSupported:{\"uuid\":\"adb0bbc0-15bd-4f1a-99b9-5e85d79089a5\"}"}],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e85eea63-5b8f-45b0-9110-2017ac5db28e\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e0d4fad-83a6-4242-9a9d-35732054c4c4\"}"},{"__ref":"DeepDives:{\"uuid\":\"85f5683d-9754-430b-9ee2-454f44467fe3\"}"},{"__ref":"DeepDives:{\"uuid\":\"1abdaa25-b2b1-40b3-bce0-ad38026c48d2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b1514fd5-0dba-424d-a30a-5a1801ec9ed5/-/preview/-/format/jpg/","https://ucarecdn.com/8c176315-0f23-4b1f-a06e-791e300ae318/-/preview/-/format/jpg/","https://ucarecdn.com/31cefb10-1fc6-40e6-9a0d-9482ea4c4e97/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fd791fbc-c658-4d84-b65b-9d0212f81be6\"}"},{"__ref":"Education:{\"uuid\":\"acf7779f-556a-4cc1-a993-67996ce63112\"}"}],"hiredAt":"2024-10-07T02:44:02.857Z","topics":["Business / Entrepreneurship","STEM Project","Executive Function","Sustainability","Public Speaking","Spanish","College Essay Writing","Academic Coaching"],"communityBadges":["https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tatiana-fakoukaki\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c9175939-7f17-476b-bb48-d1cf81e699fd\"}"}}},"_sentryTraceData":"f8ceda0f672f4cfbae024c161a1d7657-941d4975d3aaf1e9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb
