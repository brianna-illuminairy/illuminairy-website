js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0458aaea-b3b1-4b4a-b455-8740f347748d\"}":{"__typename":"DeepDives","uuid":"0458aaea-b3b1-4b4a-b455-8740f347748d","content":"\u003cp\u003eThe advice I would give to my middle school self is to find a topic I am passionate about and push my interest beyond its surface-level appeal.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis advice is best illustrated through an example. In middle school, I was a huge baseball fan, particularly because of how statistics could be used to compare players and make evidence-based arguments about performance. At the time, however, my analysis rarely went beyond looking at one player’s stats and making a subjective comparison to another.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf I could give advice to my sixth-grade self, I would encourage myself to take that interest further by creating a more structured and analytical system for comparison. Rather than manually comparing players, I would suggest learning how to write basic code or build a simple model that could analyze multiple statistics at once and generate comparisons automatically.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe that taking a topic one is passionate about and expanding it beyond its “obvious” limits is the most valuable advice I could give my middle school self because pursuing interests in this way would have provided me with exposure to new disciplines that provide a foundation for more complex skills. In my case, exploring baseball through a more analytical lens could have introduced me to coding and quantitative reasoning much earlier, which were instead areas I eventually developed but only after feeling behind the learning curve.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"de74d62a-f317-4653-a7cf-8a6a7bd65322\"}":{"__typename":"DeepDives","uuid":"de74d62a-f317-4653-a7cf-8a6a7bd65322","content":"\u003cp\u003eMentorship is everything to me. Without it, I would not have been able to accomplish nearly anything that I have achieved.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy appreciation for mentorship begins with my parents, who showed me what success looks like through their dedication and hard work. In middle school, I struggled to express my thoughts clearly in writing. Rather than accepting my lackluster ability as my destiny, my mother spent hours reviewing my essays before each submission, where she not only revised sentences but also\u0026nbsp; explained why her changes improved clarity. Through her guidance, I learned not only how to write more effectively, but also how thoughtful mentorship can turn challenges into opportunities for growth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship has also played a critical role in my experiences outside my family. When I stepped into a leadership role in the Yale Entrepreneurial Society’s High School Fellowship, I was overwhelmed by the responsibility of helping manage a 150-student program across 25 nationalities. The previous director, despite stepping down from the role, continued to mentor me closely. She answered questions, offered advice, and helped me navigate the transition with confidence. Her support shaped my own approach to mentorship. She taught me the importance of being present, anticipating challenges, and maintaining a supportive yet structured environment.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese experiences have defined how I mentor others today: someone my peers can rely on for guidance, clarity, and encouragement, while also helping them build independence and confidence in their own abilities. To me, mentorship is not about providing answers, but about empowering others with the tools and mindset to succeed long after the guidance ends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0aa87a5e-1763-42cb-83ef-7ccd354d2b5b\"}":{"__typename":"DeepDives","uuid":"0aa87a5e-1763-42cb-83ef-7ccd354d2b5b","content":"\u003cp\u003eFor three of my four years of high school, I taught for Horizons at Brunswick, an organization that provides academic advancement opportunities for lower-income students who are working to keep pace with their peers. As an assistant teacher for seven-nine year olds, my key responsibilities were spending additional time with students that failed to understand certain concepts. This meant countless hours of teaching, listening, and returning to concepts covered over the program to identify these students weaknesses and transform them into strengths.\u003c/p\u003e\u003cp\u003eFor three of my four years in high school, I taught with Horizons at Brunswick, an organization that provides academic advancement opportunities for lower-income students working to keep pace with their peers. As an assistant teacher for seven-to-nine-year-olds, my primary responsibility was spending additional time with students who struggled to grasp certain concepts. This often meant revisiting material multiple times, listening closely to students’ questions, and identifying gaps in understanding in order to turn weaknesses into strengths. Through this experience, I learned the value of patience, adaptability, and individualized instruction.\u003c/p\u003e\u003cp\u003eAs a high school student, I saw it as my responsibility to be a positive role model to my campers. Whether it was playing soccer with students with a smile always on my face or being mindful of small behaviors like cleaning up after lunch, I aimed to build genuine relationships while reinforcing the importance of respect, manners, and accountability. These moments helped create trust and taught my students the more critical lesson of good-sportsmanship and respect than could be captured in any classroom.\u003c/p\u003e\u003cp\u003eDuring my final summer of high school, I worked as a research assistant at the Icahn School of Medicine at Mount Sinai in the Department of Pharmacological Sciences. This experience stood in stark contrast to my previous summers. Working full-time in a professional lab environment, I assisted with research tasks such as cell culturing and supporting ongoing projects. While I ultimately realized that biology was not the field I wanted to pursue, the experience taught me invaluable lessons about professionalism, responsibility, and workplace expectations. My office-based experience in high school was one of the most formative and valuable opportunities I had as I continue to carry these lessons with me today.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"47b887e9-b0aa-4944-baf7-c26adbbc86b7\"}":{"__typename":"DeepDives","uuid":"47b887e9-b0aa-4944-baf7-c26adbbc86b7","content":"\u003cp\u003eI love giving back through teaching. My experience began in high school where I taught with Horizons at Brunswick, an organization that provides academic advancement opportunities for lower-income students working to keep pace with their peers. That experience sparked a passion for education that has continued throughout my time at Yale, where I have consistently sought out roles that allow me to mentor and teach both peers and high school students as the Director of Education for a pre-professional finance club and as Director of the Yale Entrepreneurial Society’s High School Fellowship.\u003c/p\u003e\u003cp\u003eAs I pass these positions on to the next generation of Yale students, I am joining Curious Cardinals because I remain deeply invested in mentorship. I find myself drawn to teaching because of the especially rewarding moments when students finally understand material they once found challenging. In a results-driven world, teaching offers a refreshing shift in perspective: one that values the learning process as much as, if not more than, the final answer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5\"}":{"__typename":"School","uuid":"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5","name":"Brunswick School","city":"Greenwich","type":"HIGH","state":"Connecticut","country":"United States","zip":"06830"},"Education:{\"uuid\":\"d47d53f3-8b98-41b0-b615-bfce95d81e8c\"}":{"__typename":"Education","uuid":"d47d53f3-8b98-41b0-b615-bfce95d81e8c","school":{"__ref":"School:{\"uuid\":\"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"7a4ea483-9ffb-4bbc-ae0a-1f345eb85fc8\"}":{"__typename":"Education","uuid":"7a4ea483-9ffb-4bbc-ae0a-1f345eb85fc8","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"f09bb48e-8cb7-42a8-9c49-ee624e3a202d\"}":{"__typename":"MentorPublicProfile","uuid":"f09bb48e-8cb7-42a8-9c49-ee624e3a202d","displayName":"Charlie S.","slug":"charlie-stemerman","biography":"\u003cp\u003eHi all, I'm Charlie Stemerman and I am from Greenwich, CT. I am a Junior at Yale University and majoring in Economics! I have a strong academic foundation in both macroeconomics and microeconomics, as well as coursework in calculus and American and European history. These experiences have developed my analytical, quantitative, and writing skills, and I look forward to the opportunity to share these values with my students.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, I am an active member of the TAMID Group, a pre-professional finance club. I have led consulting projects for early-stage startups where I worked closely with founders on market analysis and strategy to provide support for their company’s growth. I also currently help teach first-year members an introduction to finance, which has strengthened my ability to explain complex concepts clearly and in an accessible way. In addition, I previously served as Director of the Yale Entrepreneurial Society’s High School Fellowship, an eight-week masterclass where students learned how to develop, refine, and pitch startup ideas. This role gave me experience mentoring younger students and guiding them through challenging but rewarding problem-solving processes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout high school, I taught for Horizons at Brunswick, an organization that provides academic advancement opportunities for lower-income students who are working to keep pace with their peers. This experience taught me the importance of understanding each student’s individual needs and dedicating time to ensuring genuine comprehension, rather than focusing solely on arriving at the correct answer. The first year I thought for Horizons was during the Covid-19 Pandemic, so this experience has especially prepared me well on how to remain engaging despite not physically being with my students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I enjoy running and recently completed the Newport Marathon, with plans to run more marathons in the future. I also love to cook and work at the Yale Student Kitchen. I am an avid sports fan and enjoy both playing and watching sports, especially as a supporter of the New York Jets and New York Mets.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a tutor, I focus on making difficult material approachable and engaging through working directly with the students. Rather than having a pre-determined curriculum, I aim to meet students where they are and to explain concepts step-by-step to emphasize an understanding of the material that will allow them to apply these concepts to questions beyond just what we discovered.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy background in entrepreneurship and economics has made me especially interested in working with high school students who have experience with, or an interest in, creating a startup or nonprofit before college. Additionally, my experience working with elementary school students has prepared me well for online instruction in reading, writing, and math.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI joined Curious Cardinals because I am passionate about giving back and helping younger students achieve their goals. I strive to make learning an enjoyable and motivating experience, while building meaningful connections and confidence along the way.\u003c/p\u003e","teachingVideoPlaybackId":"IBGGcLqqZnjmsr5RvT61sPDIXzr4MKr4VlQeGzbnpiU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy proudest accomplishment is completing the Newport Marathon. I have been a runner since high school, but once my final cross-country season ended, I found myself in a position familiar to many former student-athletes: wondering how to stay motivated without a team, a coach, or a clear goal to work toward.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my freshman year of college, I began to feel my dedication slip. I continued running, but I increasingly accepted excuses for skipping workouts, and what was once calming and enjoyable began to feel like an obligation that I dreaded. Running no longer gave me energy: it drained it. Right when my love for the sport seemed to be disappearing, one of my friends asked me if I wanted to run a marathon with him.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m not entirely sure why I said yes, but I accepted without hesitation and this decision changed everything. Having both a training partner and a concrete goal transformed my relationship with running. My runs shifted from something I felt forced to do into the highlight of my day, and I rediscovered the joy, discipline, and sense of purpose that running once gave me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCompleting the marathon is my proudest accomplishment not simply because I crossed the finish line, but because the experience helped me reclaim my love for running. It reminded me of the importance of setting goals, finding accountability, and embracing challenges as opportunities to rediscover what motivates us.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0458aaea-b3b1-4b4a-b455-8740f347748d\"}"},{"__ref":"DeepDives:{\"uuid\":\"de74d62a-f317-4653-a7cf-8a6a7bd65322\"}"},{"__ref":"Dee
