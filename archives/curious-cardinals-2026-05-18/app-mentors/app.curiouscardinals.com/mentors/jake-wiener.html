xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"416caba0-de3a-4e89-8572-8a1d52b81614\"}":{"__typename":"Favorites","uuid":"416caba0-de3a-4e89-8572-8a1d52b81614","photoUrl":"https://ucarecdn.com/f300f72c-d094-44e4-913c-d290158d98af/","title":"Borderline","type":"SONG"},"Favorites:{\"uuid\":\"5259ddea-35c0-43e6-8053-8dda37ac219d\"}":{"__typename":"Favorites","uuid":"5259ddea-35c0-43e6-8053-8dda37ac219d","photoUrl":"https://ucarecdn.com/398bd86a-0e80-4ba1-9adf-92e69624abbd/","title":"Tel Aviv","type":"CITY"},"Favorites:{\"uuid\":\"41ce2cfd-530b-4b33-87c0-36fd5ef9e5c2\"}":{"__typename":"Favorites","uuid":"41ce2cfd-530b-4b33-87c0-36fd5ef9e5c2","photoUrl":"https://ucarecdn.com/d358f5d0-097d-4822-b240-bb60bb90e9e9/","title":"Devonta Smith","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"73bb5bf0-2421-49fa-93b4-23a1712236b8\"}":{"__typename":"CausesSupported","uuid":"73bb5bf0-2421-49fa-93b4-23a1712236b8","name":"Friendship Circle","description":"\u003cp\u003eI support friendship circle because of the relationships you create with others.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"70bd9d6d-eaa7-426e-95f9-f89c3cb6875e\"}":{"__typename":"DeepDives","uuid":"70bd9d6d-eaa7-426e-95f9-f89c3cb6875e","content":"\u003cp\u003eOne thing that I would tell my middle school or high school self is that if you are not failing, you are not trying. In many aspects of your life, you will learn more from your mistakes and failures. And when you are in that moment of making a mistake, understand that things work themselves out in the end, even if overcoming that failure seems impossible in the moment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c0df88bb-3c72-4001-82f6-0aa186f3739a\"}":{"__typename":"DeepDives","uuid":"c0df88bb-3c72-4001-82f6-0aa186f3739a","content":"\u003cp\u003eMentorship matters to me because it is a mutually beneficial relationship. Just as much as younger students want to learn from more experienced ones, older students want to pass on the knowledge they have gained from their experience and help the younger generation. I value mentorship because if you are in a situation that you feel overwhelmed in there is a good chance that there is someone out there who has been in your shoes that can steer you in the right direction.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"f2a74d3f-2192-4742-8434-0d64c03585f1\"}":{"__typename":"DeepDives","uuid":"f2a74d3f-2192-4742-8434-0d64c03585f1","content":"\u003cp\u003eOne thing that I hope to accomplish in my life is to pursue a line of work that gets my excited to go to my job in the morning. I think this will help me find fulfillment and happiness in life as a majority of my days will be spent working. My mom has found this with her job as a reading specialist at an elementary school, as she genuinely enjoys her job every single day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b14c7eb7-f7a2-43c8-a360-b4713834b85d\"}":{"__typename":"DeepDives","uuid":"b14c7eb7-f7a2-43c8-a360-b4713834b85d","content":"\u003cp\u003eI chose my major in Information Systems because I think that learning the technological side of business will be the most beneficial to me throughout my career with the current state of the job market. This will open me up to a full array of job opportunities with skills that will be applicable in several different functions and industries.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6\"}":{"__typename":"School","uuid":"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6","name":"Parkland High School","city":"Allentown","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"18104"},"Education:{\"uuid\":\"fb979260-6938-4424-85e7-b6b6bca6e7d2\"}":{"__typename":"Education","uuid":"fb979260-6938-4424-85e7-b6b6bca6e7d2","school":{"__ref":"School:{\"uuid\":\"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2f41b623-6021-4481-934b-c9f2439459c8\"}":{"__typename":"School","uuid":"2f41b623-6021-4481-934b-c9f2439459c8","name":"University of Florida","city":"Gainesville","type":"COLLEGE","state":"Florida","country":"United States","zip":"32611"},"Education:{\"uuid\":\"dfc525ab-c1a6-468c-a169-53c14ec5d310\"}":{"__typename":"Education","uuid":"dfc525ab-c1a6-468c-a169-53c14ec5d310","school":{"__ref":"School:{\"uuid\":\"2f41b623-6021-4481-934b-c9f2439459c8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Information Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"3df2b06f-2358-41ff-807b-3f8046ad50c2\"}":{"__typename":"MentorPublicProfile","uuid":"3df2b06f-2358-41ff-807b-3f8046ad50c2","displayName":"Jake  W.","slug":"jake-wiener","biography":"\u003cp\u003e     My name is Jake Wiener, and I am a junior studying Information Systems at the University of Florida. I decided to pursue a degree in Information Systems because I believe that it will give me the most well-rounded skill set when entering the workforce next year. I think that the skills obtained with this degree are highly transferable and will serve me well in whichever industry I decide to pursue. I am very passionate about this opportunity with Curious Cardinals and cannot wait to meet my future mentees!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;I am originally from Allentown, Pennsylvania, growing up with my two parents as well as my older sister. My sister was a senior at Florida when I started my freshman year and made a significant impact on the start of my college career, making sure to introduce me to the right people and situations to make sure that I got off to a good start at UF. Sharing a college experience with my sister was one of the most unique and greatest experiences ever because it brought us closer as siblings. Sharing friends and memories made both of our college experiences more fulfilling. I have also had two impactful abroad experiences, one being a two month fellowship in Tel Aviv, Israel where I interned for a retail technology start-up, and the other being a semester long study abroad program in Madrid, Spain. Both experiences introduced me to hundreds of students from across the world, all sharing their diverse backgrounds and experiences. I was also able to learn a lot about living independently, including how to take care of yourself and your things, which is very important as I venture out into the post-graduate world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Outside of school and work, I like to spend time outside, whether it is activities such as skiing, running, or playing sports, or just going on a walk with my dog or through the park. I think that it is an essential part of my life wherever I am in the world. I also enjoy traveling because you are able to see all these locations around the world and learn about the vast number of different cultures and languages there are in the world. To see how many different ways of life there are in the world is very interesting and I think it is an experience that everyone should have as a student at least once in their life.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;I cannot wait to get started on my mentorship journey with curious cardinals and am excited to meet the wonderful families and students who want to further their education outside of the classroom!\u003c/p\u003e","teachingVideoPlaybackId":"AngiXrDFqYr9500cDGR1eoUgDLX1xusQnfYJSMqKvBbA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I have done that I am really proud of is completing my study abroad program in Madrid, Spain. I moved to Spain for almost 5 months not knowing many people going, but was able to adjust to the new culture and cultivate relationships with new people that will last a lifetime. I also was able to successfully budget my finances to be able to do the activities I set to do without having to worry about running out of funds. I picked up a second language and can now communicate with effectively with people across the world.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"416caba0-de3a-4e89-8572-8a1d52b81614\"}"},{"__ref":"Favorites:{\"uuid\":\"5259ddea-35c0-43e6-8053-8dda37ac219d\"}"},{"__ref":"Favorites:{\"uuid\":\"41ce2cfd-530b-4b33-87c0-36fd5ef9e5c2\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"73bb5bf0-2421-49fa-
