xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d0483e9d-e554-4fb5-af1b-209ffb15a9ea\"}":{"__typename":"DeepDives","uuid":"d0483e9d-e554-4fb5-af1b-209ffb15a9ea","content":"\u003cp\u003eI'd like to get published! I tend to write shorter form pieces (short story, poetry, flash fiction), so it's a bit different from the way you would publish a novel. Either through an anthology, or by submitting one of my pieces to an established journal, I hope to get what I've written out there to the world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}":{"__typename":"School","uuid":"375c6521-abfd-4666-859e-1190f187c648","name":"Collegiate School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10069"},"Education:{\"uuid\":\"e36d4228-60ad-4fd6-89ff-df8cc614231d\"}":{"__typename":"Education","uuid":"e36d4228-60ad-4fd6-89ff-df8cc614231d","school":{"__ref":"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}"},"startYear":"2008","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"7c1c91f0-af91-4c1f-b376-c602512d999f\"}":{"__typename":"Education","uuid":"7c1c91f0-af91-4c1f-b376-c602512d999f","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Statistics/English","degree":null},"MentorPublicProfile:{\"uuid\":\"a31f074a-51fb-4c51-93eb-3a598863a880\"}":{"__typename":"MentorPublicProfile","uuid":"a31f074a-51fb-4c51-93eb-3a598863a880","displayName":"William H.","slug":"william-hahn","biography":"\u003cp\u003eHi! I'm Will, a junior at Harvard studying Statistics with a minor in English.\u003cbr\u003e\u003cbr\u003eGrowing up in New York City, you meet a lot of outgoing, out there, and interesting people. Above and beyond all else, I've always enjoyed the stories of the city, both hearing and telling them. I am an avid writer, with a penchant for short stories and flash fiction. As a reporter for my school newspaper and a board member for The Wave, an Asian-American, student-run literary journal, I've come to learn that you can find stories in anything and anywhere.\u003cbr\u003e\u003cbr\u003eYou might be wondering, perhaps naturally, why I've chosen to study such a mathematical field, then. Where's the story in the stats? My answer is that my understanding of statistics is what lets me see the people behind these numbers and metrics. We live in a world with orders of magnitude more data available to us than ever before. I greatly value both statistics and the ability to think critically about writing and language because it lets me cut through the fluff and misinformation to see the stories and the people behind it all.\u003cbr\u003e\u003cbr\u003eIf I could choose any one thing, this is what I would like to pass along to my mentees: an enjoyment of stories and the ability to parse the vast amounts of information we are all exposed to every single day to find them.\u003cbr\u003e\u003cbr\u003eOutside of my studies, I like to keep myself active! A professor of mine once said that you can't be a good writer without being a good reader, so I try to read as often as I can, a mix of poems and books and articles and anthologies. I enjoy working out and rock climbing, though I won't shy away from a pick-up basketball game or two.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics/English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d0483e9d-e554-4fb5-af1b-209ffb15a9ea\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/81386e12-ebbc-41f1-ab1f-28ddbeb671bc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e36d4228-60ad-4fd6-89ff-df8cc614231d\"}"},{"__ref":"Education:{\"uuid\":\"7c1c91f0-af91-4c1f-b376-c602512d999f\"}"}],"hiredAt":"2023-09-09T16:37:04.729Z","topics":["Statistics","Writing","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","Geometry","Calculus","Algebra II","Algebra I","Reading","Creative Writing","Literature"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"william-hahn\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a31f074a-51fb-4c51-93eb-3a598863a880\"}"}}},"_sentryTraceData":"5e34a213285d4bb096492dedf21b9199-9ad7fbdefdeaf1ed-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5e34a213285d4bb096492dedf21b9199,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"william-hahn"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});
