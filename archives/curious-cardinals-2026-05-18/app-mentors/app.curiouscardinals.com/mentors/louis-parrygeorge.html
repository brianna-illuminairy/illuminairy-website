xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c7a5ab90-b5e7-46b0-b826-68eb8f5c0560\"}":{"__typename":"Favorites","uuid":"c7a5ab90-b5e7-46b0-b826-68eb8f5c0560","photoUrl":"https://ucarecdn.com/68b003de-a2da-4eaa-80c6-61734701dbb6/","title":"Lionel Messi","type":"ATHLETE"},"Favorites:{\"uuid\":\"f0b39eb3-7092-402a-83d8-77d8d3855118\"}":{"__typename":"Favorites","uuid":"f0b39eb3-7092-402a-83d8-77d8d3855118","photoUrl":"https://ucarecdn.com/784b70a2-f82d-4d7b-800d-e3972717940f/","title":"Christian Bale","type":"ACTOR"},"Favorites:{\"uuid\":\"5f94ffde-5ed2-4e7d-a3b7-5675acc27f13\"}":{"__typename":"Favorites","uuid":"5f94ffde-5ed2-4e7d-a3b7-5675acc27f13","photoUrl":"https://ucarecdn.com/2b89b20a-db2a-48d3-9efa-c41e63a5c7ca/","title":"AM","type":"ALBUM"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9e999b0a-e6c8-4f45-8402-1961febd3b4e\"}":{"__typename":"DeepDives","uuid":"9e999b0a-e6c8-4f45-8402-1961febd3b4e","content":"\u003cp\u003eWhen I was a junior in high school, I led a six-person team on a six-month research project that explored the integration of absorption refrigerators into fired power stations. As part of the Cambridge CREST Challenge, we produced an 80-page thesis detailing our findings. Throughout the project, I organized and led meetings, coordinated with our mentor, managed workloads, and helped resolve both academic and interpersonal challenges within the group.\u003c/p\u003e\u003cp\u003eOur teamwork, problem-solving, and persistence paid off, we completed our thesis a week ahead of schedule and were awarded the Gold Award for making an original contribution to the STEM field. I’m proud not only of the recognition we received, but also of the collaboration and leadership I developed while guiding my team through a complex, real-world chemical engineering challenge.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b8249b1b-8ab3-4a8d-826d-2180f8afa4a7\"}":{"__typename":"DeepDives","uuid":"b8249b1b-8ab3-4a8d-826d-2180f8afa4a7","content":"\u003cp\u003eDuring my junior year, I joined a program called Shaftesbury Enterprise, where I had the opportunity to teach and introduce chemistry to 4th and 5th graders through hands-on experiments. I knew the periodic table and mole calculations wouldn’t grab their attention, so we dove straight into the fun stuff: melting wax, caramelizing sugar cubes, inflating balloons with vinegar and baking soda, and even creating the famous Skittles color swirl. Each experiment sparked more excitement, but I was saving the best for last: elephant toothpaste.\u003c/p\u003e\u003cp\u003eAs we set up the final reaction, the room fell silent. I added the soap, then the hydrogen peroxide, and finally dropped in the yeast.\u003cbr\u003e\u003cstrong\u003eBoom!\u003c/strong\u003e\u003cbr\u003eFoam erupted from the flask, and the classroom exploded with laughter and shouts. Some kids jumped back; others leaned in, completely mesmerized. Watching their faces light up with that same mix of curiosity and wonder I once felt, I realized why mentorship matters to me. It’s not just about teaching, it’s about igniting that spark, the moment when learning transforms into excitement and curiosity truly takes root.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"58cb8d7d-9af7-4483-a2d1-cc58c5f7b247\"}":{"__typename":"DeepDives","uuid":"58cb8d7d-9af7-4483-a2d1-cc58c5f7b247","content":"\u003cp\u003eI spend most of my spare time outdoors and staying active. I play rugby here at BC, and we’re currently undefeated and looking to win the national title this year. I also love to ski. It has been a part of my life since I was three, and I even started racing at eight. Growing up, my family drove to the Alps every year, where I would explore the mountains, ski down new trails, and tackle my siblings into the snow. I even captained my high school ski team, an experience that taught me leadership and resilience.\u003c/p\u003e\u003cp\u003eI also love exploring new places, whether it’s stumbling upon a hidden café in the city, finding a scenic hiking route, or traveling somewhere completely new. When I’m not outside, I enjoy spending time with friends, discussing research with a professor, or just watching movies and TV shows.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"63c22c75-20da-4886-98ce-7d5ccdf3d138\"}":{"__typename":"DeepDives","uuid":"63c22c75-20da-4886-98ce-7d5ccdf3d138","content":null,"videoPlaybackId":"vLIVHzIf2RCkMgtZtEqxqhS4jtuGM00HDzR8hs8Eh502k","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"fa544240-09db-469d-8bb9-bab55e4941bb\"}":{"__typename":"School","uuid":"fa544240-09db-469d-8bb9-bab55e4941bb","name":"Harrow School","city":"Harrow","type":"HIGH","state":"England","country":"United Kingdom","zip":"HA1 3HP"},"Education:{\"uuid\":\"5b8758df-bf76-45a4-b4c2-90334f21b87f\"}":{"__typename":"Education","uuid":"5b8758df-bf76-45a4-b4c2-90334f21b87f","school":{"__ref":"School:{\"uuid\":\"fa544240-09db-469d-8bb9-bab55e4941bb\"}"},"startYear":"2018","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fb9cd652-9df1-4dec-b081-ad0eb4d67623\"}":{"__typename":"School","uuid":"fb9cd652-9df1-4dec-b081-ad0eb4d67623","name":"Boston College","city":"Chestnut Hill","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02467"},"Education:{\"uuid\":\"0b177637-6714-4b5f-a202-8b99eb74a64a\"}":{"__typename":"Education","uuid":"0b177637-6714-4b5f-a202-8b99eb74a64a","school":{"__ref":"School:{\"uuid\":\"fb9cd652-9df1-4dec-b081-ad0eb4d67623\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"5ed38d5a-32a3-4feb-9c29-24074459db00\"}":{"__typename":"MentorPublicProfile","uuid":"5ed38d5a-32a3-4feb-9c29-24074459db00","displayName":"Louis P.","slug":"louis-parrygeorge","biography":"\u003cp\u003eHi! I’m Louis, and I’m passionate about science, sports, and exploring new experiences. I’m currently studying chemistry at Boston College and also pursuing a business minor. My academic goal is to attend graduate school and work in medical devices or pharmaceuticals, combining my love for chemistry with practical applications that can improve people’s lives. I spend a lot of my time in the chemistry centre, conducting experiments, learning new techniques, and deepening my understanding of the subject. Beyond academics, I enjoy diving into new topics, tackling challenging problems, and helping others develop a strong foundation in STEM.\u003c/p\u003e\u003cp\u003eOutside the classroom, I’m heavily involved in athletics. I play rugby for Boston College, which takes up a significant part of my week with practices, weekend games, and traveling to competitions. I’ve been a two-year starter and have had the opportunity to captain the team during key moments, where I’ve developed leadership skills, composure under pressure, and the ability to inspire and coordinate teammates. Sports have shown me the importance of perseverance, discipline, and balancing multiple responsibilities—skills that translate directly into my academic and professional work.\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn addition to sports, I’m passionate about mentoring and tutoring students through Curious Cardinals. I teach physics, mathematics, and chemistry while also guiding students on independent passion projects and research initiatives. I love helping students discover their curiosity, develop confidence in STEM, and see the practical applications of what they’re learning. Mentoring has been an incredibly rewarding experience because it allows me to share my knowledge while learning how to communicate complex ideas in a clear and engaging way. It’s exciting to watch students grow and tackle challenges with creativity and determination, and I often learn from their unique perspectives and approaches to problem-solving.\u003c/p\u003e\u003cp\u003eOutside of academics and mentoring, I enjoy soccer, supporting Arsenal, spending time with friends, family, and traveling to explore new places and cultures. These hobbies give me a chance to relax, stay active, and find inspiration outside of work and school. Whether I’m on the field, in the lab, or helping a student solve a tricky chemistry problem, I approach everything with energy, curiosity, and dedication.\u003c/p\u003e\u003cp\u003eThrough my combined experiences in academics, athletics, and mentoring, I’ve learned how to balance multiple commitments while striving for excellence and helping others succeed. I’m excited to share my passion for STEM, teamwork, and problem-solving with students, and I hope to inspire them to pursue their own interests with confidence and curiosity. I also hope to show students that balancing academics, athletics, and personal passions is possible, and that dedication and curiosity can make learning both challenging and fun!\u003c/p\u003e","teachingVideoPlaybackId":"Pw7Si0026Bp016o6UHJg3rhbnn5WY00jOymnFT01Q00VPEAI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c7a5ab90-b5e7-46b0-b826-68eb8f5c0560\"}"},{"__ref":"Favorites:{\"uuid\":\"f0b39eb3-7092-402a-83d8-77d8d3855118\"}"},{"__ref":"Favorites:{\"uuid\":\"5f94ffde-5ed2-4e7d-a3b7-5675acc27f13\"}"}],"causesSupported":[],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9e999b0a-e6c8-4f45-8402-1961febd3b4e\"}"},{"__ref":"DeepDives:{\"uuid\":\"b8249b1b-8ab3-4a8d-826d-2180f8afa4a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"58cb8d7d-9af7-4483-a2d1-cc58c5f7b247\"}"},{"__ref":"DeepDives:{\"uuid\":\"63c22c75-20da-4886-98ce-7d5ccdf3d138\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ddd39490-89e5-42a6-aca6-68fb492a4205/-/preview/-/format/jpg/","https://ucarecdn.com/4149c2f3-f09e-4503-926b-43ad24557185/-/preview/-/format/jpg/","https://ucarecdn.com/77e7354e-c143-44fc-bc1b-282caf6a2483/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5b8758df-bf76-45a4-b4c2-90334f21b87f\"}"},{"__ref":"Education:{\"uuid\":\"0b177637-6714-4b5f-a202-8b99eb74a64a\"}"}],"hiredAt":"2025-10-01T14:30:27.693Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Statistics","Calculus","6-8 Grade Science","Chemistry","Physics"],"communityBadges":["https://ucarecdn.com/98153803-7084-46d6-8edc-6473c210cc7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"louis-parrygeorge\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5ed38d5a-32a3-4feb-9c
