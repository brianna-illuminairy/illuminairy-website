js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e2a557a5-1a97-4016-9816-937a53427d41\"}":{"__typename":"DeepDives","uuid":"e2a557a5-1a97-4016-9816-937a53427d41","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I would remind myself that mistakes are a natural and important part of the process. At the time, I often saw mistakes as setbacks, but I’ve come to realize they are opportunities to pause, reflect, and grow. I would tell myself to sit with those mistakes, really understand what went wrong, and use that understanding to correct and improve.\u003c/p\u003e\u003cp\u003eI would also encourage myself to approach every commitment — whether academic, extracurricular, or personal — with both hard work and joy. Working hard is essential to achieving goals, but it’s equally important to enjoy the journey, appreciate the small moments, and have fun along the way. Balancing dedication with enjoyment creates not only better results, but also a more fulfilling experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"acf58cb9-c175-4b6b-a39b-0eb117632fee\"}":{"__typename":"DeepDives","uuid":"acf58cb9-c175-4b6b-a39b-0eb117632fee","content":"\u003cp\u003eI chose to study Data Science and Statistics because it allows me to combine two sides of myself: my passion for working with data and numbers, and my sociable, extroverted personality. On one hand, I love diving into data, applying quantitative methods, and uncovering patterns that aren’t immediately obvious. On the other, I genuinely enjoy sharing insights, presenting findings, and connecting with people to make technical information meaningful and actionable.\u003c/p\u003e\u003cp\u003eFor me, data science is the perfect bridge between technical rigor and human connection. It’s not just about building models or running analyses — it’s about translating those results into clear stories that can influence decisions, drive innovation, and create impact. This is especially exciting in industries like healthcare, finance, and technology, where the ability to connect analytics with executive strategy can directly shape outcomes that matter to people’s lives.\u003c/p\u003e\u003cp\u003eUltimately, I chose this major because it gives me the opportunity to use my analytical skills while also engaging my communication strengths. It challenges me to think critically, collaborate across disciplines, and serve as a connector between the technical and business worlds, which is exactly where I see myself thriving.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"444ca127-0013-4995-aec6-cad1677cae82\"}":{"__typename":"DeepDives","uuid":"444ca127-0013-4995-aec6-cad1677cae82","content":"\u003cp\u003eMentorship matters to me because it creates a cycle of growth, learning, and support that benefits both the mentor and the mentee. Looking back, some of my most valuable experiences came from people who were willing to share their knowledge, guide me through challenges, and encourage me when I doubted myself. Those conversations not only helped me develop technical skills and professional direction, but also gave me confidence and perspective that I couldn’t have gained on my own.\u003c/p\u003e\u003cp\u003eI also believe mentorship is about more than advice — it’s about connection. A mentor can help translate their experiences into lessons that make difficult paths feel more approachable, while a mentee brings fresh perspectives that challenge the mentor to grow as well. To me, mentorship is a way of building community, passing forward what I’ve learned, and empowering others to reach their goals. It reflects the values of collaboration and support that I try to carry into everything I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"f591aa67-2684-4dd2-978c-0f1eafa8d25f\"}":{"__typename":"DeepDives","uuid":"f591aa67-2684-4dd2-978c-0f1eafa8d25f","content":"\u003cp\u003eMy greatest source of motivation is myself. I’ve always held myself to a high standard and strive for excellence in everything I take on. I don’t let myself settle for “good enough” — instead, I push to become the best version of myself in both the short and long term. That drive comes from an internal desire to continuously grow, improve, and prove to myself that I can overcome challenges and rise to higher expectations.\u003c/p\u003e\u003cp\u003eI see every commitment as an opportunity to put forth my best effort, whether it’s in academics, extracurriculars, or professional work. When I make a mistake or fall short, I use that as fuel to reflect, adjust, and keep moving forward. What keeps me going is the belief that I have the ability to shape my own path, and I refuse to let myself steer away from it. That constant self-motivation is what pushes me to work hard and never stop until I achieve my goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"81d3b22e-42a2-456a-940d-08343f8a56ac\"}":{"__typename":"School","uuid":"81d3b22e-42a2-456a-940d-08343f8a56ac","name":"Del Norte High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92127"},"Education:{\"uuid\":\"d4537a9b-f605-46f1-a4b8-f23cdb079104\"}":{"__typename":"Education","uuid":"d4537a9b-f605-46f1-a4b8-f23cdb079104","school":{"__ref":"School:{\"uuid\":\"81d3b22e-42a2-456a-940d-08343f8a56ac\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}":{"__typename":"School","uuid":"dff4a26a-20c2-4281-9c2a-b500907e0661","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"198ec17f-e432-42ab-a405-8a325d5c8ac5\"}":{"__typename":"Education","uuid":"198ec17f-e432-42ab-a405-8a325d5c8ac5","school":{"__ref":"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Data Science + Statistics","degree":null},"MentorPublicProfile:{\"uuid\":\"9548385c-26e1-4d38-8cae-b0793da8c60e\"}":{"__typename":"MentorPublicProfile","uuid":"9548385c-26e1-4d38-8cae-b0793da8c60e","displayName":"Pranav S.","slug":"pranav-sarathy","biography":"\u003cp\u003eMy name is Pranav Sarathy, and I am a third-year student at the University of California, Berkeley pursuing a double major in Data Science and Statistics with an emphasis in Business and Industrial Analytics. I care deeply about leveraging data to solve complex problems, and I am motivated by the impact data-driven insights can have across industries, communities, and everyday life. What drives me is the challenge of taking abstract numbers and transforming them into clear, actionable insights that create meaningful outcomes.\u003c/p\u003e\u003cp\u003eAcademically, I spend much of my time exploring the intersection of quantitative methods and business applications. My coursework focuses on statistical modeling, probability theory, machine learning, and data visualization, while emphasizing how these tools can be applied to real-world challenges. What excites me most is bridging theory with practice — developing predictive models that improve efficiency, analyzing data to uncover hidden patterns, and translating results into strategies that support better decision-making. I also enjoy working on interdisciplinary problems, as data often provides a unique lens to understand human behavior, technology, and markets in new and impactful ways. By blending rigorous analysis with creative problem-solving, I strive to use data not just to describe the world, but to help improve it.\u003c/p\u003e\u003cp\u003eBeyond the classroom, I am heavily involved in student organizations centered around consulting, finance, and sports analytics. These experiences have allowed me to lead project teams, mentor younger members, and deliver impactful work to both campus and external partners. For example, I managed a project comparing FIFA’s U.S. market to the NFL, which required both technical rigor and business acumen. I also supported a student-athlete wellness initiative, where my team translated survey responses into actionable insights for university staff. These roles have strengthened my leadership skills, sharpened my ability to communicate technical work to non-technical audiences, and reinforced the importance of collaboration in driving results.\u003c/p\u003e\u003cp\u003eProfessionally, I have completed internships across consumer banking, technology, and analytics. At Axos Bank, I optimized processes and automated workflows to streamline operations. At Solar Turbines, I worked on predictive analytics to support industrial technology systems and explored how data science can drive reliability and efficiency at scale. I have also contributed to AI-focused projects, such as building generative chatbot systems and developing tools to improve customer experience. Across these roles, I learned to adapt quickly, collaborate across functions, and ensure that my work delivered measurable value to stakeholders.\u003c/p\u003e\u003cp\u003eOne unique experience I am especially proud of is launching a nonprofit that raised $2,500 to provide resources for underprivileged youth through athletics. This initiative combined my leadership and organizational skills with my commitment to creating opportunities for others. Altogether, my academic, extracurricular, and professional experiences reflect my dedication to using data, problem-solving, and teamwork to drive impact and create meaningful value across different contexts.\u003c/p\u003e","teachingVideoPlaybackId":"gdaoPzeAD2Y7dsNTqKH9ZeS102O68Wt4YA00vxxfcPPzA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Data Science + Statistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e2a557a5-1a97-4016-9816-937a53427d41\"}"},{"__ref":"DeepDives:{\"uuid\":\"acf58cb9-c175-4b6b-a39b-0eb117632fee\"}"},{"__ref":"DeepDives:{\"uuid\":\"444ca127-0013-4995-aec6-cad1677cae82\"}"},{"__ref":"DeepDives:{\"uuid\":\"f591aa67-2684-4dd2-978c-0f1eafa8d25f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/31b9832c-709b-4b88-806a-17021cc63fda/-/preview/-/format/jpg/","https://ucarecdn.com/2615de57-fb61-490e-8df0-4009f9e5006d/-/preview/-/format/jpg/","https://ucarecdn.com/6503d423-8d02-456b-bc51-ef09e92ff138/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d4537a9b-f605-46f1-a4b8-f23cdb079104\"}"},{"__ref":"Education:{\"uuid\":\"198ec17f-e432-42ab-a405-8a325d5c8ac5\"}"}],"hiredAt":"202
