xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3e6f5a7f-f37c-48d5-bec1-595947e1a427\"}":{"__typename":"DeepDives","uuid":"3e6f5a7f-f37c-48d5-bec1-595947e1a427","content":"\u003cp\u003eI wanted to study both hard science and social science at an intersection I found fascinating. Stanford's Human Biology degree was the perfect solution because I was allowed to design my own concentration, focusing on food as a connection point between biology and culture.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"57378cdc-cc1b-4f8f-b69f-1b2f9865b9f5\"}":{"__typename":"DeepDives","uuid":"57378cdc-cc1b-4f8f-b69f-1b2f9865b9f5","content":"\u003cp\u003eI worked in a bakery kitchen/retail shop for several summers and designed marketing materials for a local biotech company. I also spent a lot of time hiking and cooking with my family and reading books I didn't have time for during the school year.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1d247fa1-3a26-402e-b3a7-477d54e67008\"}":{"__typename":"DeepDives","uuid":"1d247fa1-3a26-402e-b3a7-477d54e67008","content":"\u003cp\u003eI was fortunate to grow up surrounded by patient, supportive teachers who encouraged me to believe in myself and my ability to set and achieve ambitious goals. These teachers included my parents, my grandmother and aunt who teach for a living, and my academic mentors. I hope to pay this experience forward by helping other students develop curiosity and confidence in the areas that interest them most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"68bda807-0846-4ea7-a844-b9b3d1670c0c\"}":{"__typename":"School","uuid":"68bda807-0846-4ea7-a844-b9b3d1670c0c","name":"Episcopal Academy","city":"Newtown Square","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19073"},"Education:{\"uuid\":\"985acbfc-fb5b-40c7-ae1f-da188efff8c8\"}":{"__typename":"Education","uuid":"985acbfc-fb5b-40c7-ae1f-da188efff8c8","school":{"__ref":"School:{\"uuid\":\"68bda807-0846-4ea7-a844-b9b3d1670c0c\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"97cce809-1678-405b-a164-ce9b4c68f835\"}":{"__typename":"Education","uuid":"97cce809-1678-405b-a164-ce9b4c68f835","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"9c81d097-01f7-40b1-ac56-2eef0ed90be6\"}":{"__typename":"MentorPublicProfile","uuid":"9c81d097-01f7-40b1-ac56-2eef0ed90be6","displayName":"Hollis D.","slug":"hollis-a","biography":"\u003cp\u003eMy teaching style (and approach to life) is based on the belief that loving what you do is critical for motivation. I do my best to prioritize experiences that I find interesting and enjoyable, and will encourage your child to do the same. I will help your child find the topics, approaches, and perspectives that interest them most, preparing them to perform their best and enjoy the process of getting there.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOperating under this belief, I’ve always found the most fascinating topics (to study, discuss, and explore) to be the ones that lie at the intersection of existing fields: how environmental humidity shapes languages around the world, the economics and ethics of prenatal CRISPR, or the chemistry behind preserving historical objects. Although difficult and multifaceted, studying these intersections more accurately captures the complexity of the world than studying topics in isolation. This realization, and my interest in it, encouraged me to design a unique concentration for my Human Biology degree at Stanford, allowing me to study what I consider to be the most interesting interdisciplinary topic: how culture and biology interact to shape individual flavor preferences and food intake. I’ve designed my coursework around this concentration, taking everything from “Human Behavioral Biology” to “Chilis: Biology, History, Travels, Cuisine” to “The Cultural Politics of Food and Eating.” I’ve also explored classes in a variety of other disciplines, including economics, linguistics, computer science, and Classics, to broaden my thinking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs an extension of my major academic interest, I’ve spent the past two years working in the Sonnenburg Lab at Stanford’s Medical School. I work closely with several lab members to untangle the relationship between microbial community composition and metabolite production in sauerkraut. Ultimately, we hope to personalize ferments to improve individuals' health in a non-invasive, affordable way. I love my daily visits to the lab, where I get to share ideas with like-minded researchers, make sauerkraut, and analyze microbial/metabolite content to advance our understanding of the fermented food microbiome.\u0026nbsp;Next year I will be pursuing Oxford's MSc in Neuroscience to better understand the gut-brain connection.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the academic setting, I love to bake and cook, play tennis and piano, hike, and read dense nonfiction (some of my favorites include “Guns, Germs, and Steel” by Jared Diamond and “Behave” by Robert Sapolsky).\u0026nbsp;\u003c/p\u003e\u003cp\u003eI’m an extrovert, so I love stimulating conversations and learning about others’ interests, backgrounds, and experiences. I can’t wait to help your child discover what excites them most and achieve their goals, and learn from them in the process.\u003c/p\u003e","teachingVideoPlaybackId":"009LAJm6lwF01G1iu00EUaspDWL62HwM62MkFZT7SAWCKQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3e6f5a7f-f37c-48d5-bec1-595947e1a427\"}"},{"__ref":"DeepDives:{\"uuid\":\"57378cdc-cc1b-4f8f-b69f-1b2f9865b9f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d247fa1-3a26-402e-b3a7-477d54e67008\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cb1444cb-07d3-4323-8eb4-b9992305918c/-/preview/-/format/jpg/","https://ucarecdn.com/8e061793-83d2-4ab9-9724-550c23b72dd8/-/preview/-/format/jpg/","https://ucarecdn.com/99c31385-6a5f-4ae1-b81d-a00b6372e353/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"985acbfc-fb5b-40c7-ae1f-da188efff8c8\"}"},{"__ref":"Education:{\"uuid\":\"97cce809-1678-405b-a164-ce9b4c68f835\"}"}],"hiredAt":"2025-03-05T11:39:48.102Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Biology","Latin","Executive Function","History"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hollis-a\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9c81d097-01f7-40b1-ac56-2eef0ed90be6\"}"}}},"_sentryTraceData":"6b7de6d4597b416dace7cb2325ad6a71-88c4286c1432b508-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=6b7de6d4597b416dace7cb2325ad6a71,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"hollis-a"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
