xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8b52229c-8cc2-45b4-92b1-49b90dcfd0d1\"}":{"__typename":"DeepDives","uuid":"8b52229c-8cc2-45b4-92b1-49b90dcfd0d1","content":"\u003cp\u003eMentorship matters to me because I've had some great mentors throughout my life. I was fourteen when I first became a member of the US Women's Water Polo National Team. My fellow teammates mentored me into becoming the athlete and woman I am today, and I hope to do the same with my mentees at Curious Cardinals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"76100e25-3414-46a3-9efc-55453a45e51d\"}":{"__typename":"DeepDives","uuid":"76100e25-3414-46a3-9efc-55453a45e51d","content":"\u003cp\u003eI chose English Creative Writing because I was passionate about it. Even though it might be a harder major to make a career out of, I'm a firm believer in following your passions first and foremost and never giving up on your dreams! You have to invest and back yourself in order to be successful in life, and I knew that I wanted to be a writer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d2107c08-9ffd-4cc1-870c-5e436767c7f1\"}":{"__typename":"DeepDives","uuid":"d2107c08-9ffd-4cc1-870c-5e436767c7f1","content":"\u003cp\u003eI was extremely disciplined as a high school student. I went to school full time while training for the 2016 Rio Olympics, which consisted of eight hours a day of pool and strength workouts. I had to learn to be extremely efficient with my schoolwork, a skill I hope to pass on to fellow student athletes!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d0b31c8f-3362-45e5-9347-9d02fa3efa4c\"}":{"__typename":"DeepDives","uuid":"d0b31c8f-3362-45e5-9347-9d02fa3efa4c","content":"\u003cp\u003eI hope to write in a TV writer's room one day!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"01f0ba2f-19f3-4eed-bc7b-0823340e19f5\"}":{"__typename":"School","uuid":"01f0ba2f-19f3-4eed-bc7b-0823340e19f5","name":"Laguna Beach High School","city":"Laguna Beach","type":"HIGH","state":"California","country":"United States","zip":"92651"},"Education:{\"uuid\":\"ea35aabb-dc94-4256-aba8-d2a29dd784b1\"}":{"__typename":"Education","uuid":"ea35aabb-dc94-4256-aba8-d2a29dd784b1","school":{"__ref":"School:{\"uuid\":\"01f0ba2f-19f3-4eed-bc7b-0823340e19f5\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Educa
