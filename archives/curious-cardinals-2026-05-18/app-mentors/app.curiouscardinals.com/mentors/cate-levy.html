xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"90d3348b-8194-4e22-b906-6b578716ed04\"}":{"__typename":"Favorites","uuid":"90d3348b-8194-4e22-b906-6b578716ed04","photoUrl":"https://ucarecdn.com/3413ff17-7167-4951-a176-30a9168fa89c/","title":"Santiago de Chile","type":"CITY"},"Favorites:{\"uuid\":\"05445b92-cda0-43f7-8d88-b19a027af640\"}":{"__typename":"Favorites","uuid":"05445b92-cda0-43f7-8d88-b19a027af640","photoUrl":"https://ucarecdn.com/03a7ec8d-95d5-48d8-99ce-44c439c11ef0/","title":"Tennis","type":"SPORT"},"Favorites:{\"uuid\":\"77cdb007-1e1e-4758-b049-33c50a4bf6a1\"}":{"__typename":"Favorites","uuid":"77cdb007-1e1e-4758-b049-33c50a4bf6a1","photoUrl":"https://ucarecdn.com/0a334750-72b1-42e6-ba32-54dba7df8ebd/","title":"School of Rock","type":"MOVIE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"873f95c8-7482-4783-acbe-f524c5f1116e\"}":{"__typename":"DeepDives","uuid":"873f95c8-7482-4783-acbe-f524c5f1116e","content":"\u003cp\u003eMy dream job would be something people-centered—work that lets me listen, connect, and help others. I could see myself starting a nonprofit that provides healthcare with a reproductive justice focus, becoming an OB-GYN, or even working as a therapist. Honestly, I’d also love to just interview people for the rest of my life and hear their stories.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a12a1382-1a1f-4963-923c-18a7dc88b96c\"}":{"__typename":"DeepDives","uuid":"a12a1382-1a1f-4963-923c-18a7dc88b96c","content":"\u003cp\u003eI chose my major because I wanted an interdisciplinary field that gave me the freedom to explore whatever sparked my curiosity. Anthropology offered a lens to understand people, culture, and systems in a way that felt both creative and rigorous. Early on, I took a class with an incredible professor who encouraged us to ask big, sometimes uncomfortable questions about identity, power, and community—and that completely changed how I thought about learning.\u003c/p\u003e\u003cp\u003eWhat I love most about anthropology is that it’s about people: the ways we connect, create meaning, and build community. It combines research, storytelling, and empathy, and it’s taught me to think critically while staying open to new perspectives. My time studying abroad in Chile and later conducting fieldwork through my Watson Fellowship helped me see how anthropology isn’t just an academic pursuit—it’s a way of engaging with the world, listening deeply, and learning from others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"eb812b46-a218-4ad8-9439-a0d49be5a146\"}":{"__typename":"DeepDives","uuid":"eb812b46-a218-4ad8-9439-a0d49be5a146","content":"\u003cp\u003eI chose mentorship because I love helping people discover what they’re passionate about and truly enjoy. Feeling lost or uncertain is completely normal—I still feel that way often!—and having someone who can listen, guide, and walk beside you makes such a difference. I see mentorship as a shared journey, not a one-way street. I learn just as much from my students as they do from me.\u003c/p\u003e\u003cp\u003eI also genuinely love meeting new people and hearing their stories. Everyone has a unique path, and I find it so meaningful to help others explore theirs with curiosity and confidence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"dd83ee0d-3015-47a8-8d04-c1b0c9ae8aea\"}":{"__typename":"DeepDives","uuid":"dd83ee0d-3015-47a8-8d04-c1b0c9ae8aea","content":"\u003cp\u003eI’m extremely proud of completing my Watson Fellowship. It was a year of designing and carrying out an independent research project across multiple countries—organizing my own travel, finding places to live, meeting people, and building connections with community organizations. It was both exciting and challenging; there were moments when things didn’t go as planned, but learning to adapt, stay grounded, and keep moving forward taught me so much about myself. I’m proud that I saw it through, even when it was hard, and that I created something deeply meaningful out of it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"62d32046-56e4-4140-af7e-7d27a2016095\"}":{"__typename":"School","uuid":"62d32046-56e4-4140-af7e-7d27a2016095","name":"The Lawrenceville School","city":"Lawrence Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08648"},"Education:{\"uuid\":\"7fc6a82e-24a7-414d-b0ee-dfefb59008b1\"}":{"__typename":"Education","uuid":"7fc6a82e-24a7-414d-b0ee-dfefb59008b1","school":{"__ref":"School:{\"uuid\":\"62d32046-56e4-4140-af7e-7d27a2016095\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d0b1fa77-da0f-4488-b92b-4dcb04d0ec5e\"}":{"__typename":"School","uuid":"d0b1fa77-da0f-4488-b92b-4dcb04d0ec5e","name":"Wesleyan University","city":"Middletown","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06459"},"Education:{\"uuid\":\"11e0b946-bb6c-48e4-a771-99acfc44d916\"}":{"__typename":"Education","uuid":"11e0b946-bb6c-48e4-a771-99acfc44d916","school":{"__ref":"School:{\"uuid\":\"d0b1fa77-da0f-4488-b92b-4dcb04d0ec5e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Anthropology, Spanish","degree":null},"MentorPublicProfile:{\"uuid\":\"4dd8dca6-b732-4bf4-9907-eecfc5556107\"}":{"__typename":"MentorPublicProfile","uuid":"4dd8dca6-b732-4bf4-9907-eecfc5556107","displayName":"Cate L.","slug":"cate-levy","biography":"\u003cp\u003eHi! I’m Cate, and I’m passionate about women’s rights, sexual health and education, travel, and intercultural exchange. I grew up in Atlanta, Georgia, and attended boarding school in New Jersey before returning to Atlanta at the start of the COVID-19 pandemic. During that time, I worked on the finance team for Reverend Warnock's national Senate campaign, an experience that solidified my interest in how people come together to mobilize and make change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI studied Anthropology and Spanish at Wesleyan University, where I discovered my love for research and exploring culture in depth. I studied abroad in Santiago de Chile for six months, and then returned for three months to conduct my thesis fieldwork. My thesis focused on consumerism and sex education in the city. I was very fortunate to receive an anthropology department grant from my university to support this research, which allowed me to dive deep into the intersections of culture, social systems, and lived experiences. \u003cbr\u003e\u003cbr\u003eAfter college, I completed a Thomas J. Watson Fellowship, traveling through The Netherlands, Germany, the United Kingdom, Italy, Spain, Mexico, Peru, Uruguay, and Argentina to research how communities organize against patriarchal violence. My project, \u003cem\u003eVoices of Resistance: Community Action Against Patriarchal Violence\u003c/em\u003e, gave me the opportunity to see firsthand the creativity and resilience of grassroots organizations around the world. It was truly a lifechanging year!\u003c/p\u003e\u003cp\u003e\u003cbr\u003eCurrently, I work as a college success counselor in Mexico City, helping students across Latin America explore their academic paths and pursue personal projects. I love mentoring students who are curious and passionate about their interests, especially students who care deeply about making the world a better place. \u003cbr\u003e\u003cbr\u003eOutside of work, I’m an avid bachata and salsa dancer, rock climber, skateboarder, and I recently started training for a half marathon! I love cooking, exploring local markets, traveling, and immersing myself in new places and cultures.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eSome of my unique experiences include participating in the Merrill Scholars program in high school, where I researched in the archives at Princeton and wrote a paper on Zelda Fitzgerald. During that time, I also self-published a poetry book inspired by my research and experiences navigating womanhood in high school. In college, I also self-published a zine about Women and Queer Skaters (WAQ) in Atlanta, which allowed me to combine my love for storytelling, art, and community. Throughout childhood and high school, I was heavily involved in acting and the performing arts, a passion that continues to bring me joy and creativity today! I also love listening to comedy podcasts and stories from people around the world—it’s one of my favorite ways to learn and laugh day to day.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI’m excited to mentor curious students who want to explore the world, understand diverse perspectives, and discover their own passions. I believe in learning through curiosity, empathy, and real-world experience, and I love helping students find their voice along the way.\u003c/p\u003e","teachingVideoPlaybackId":"Vw0201Q024bwdYNfgYjCW8LI1rBRR0002a01gpepsQMPQ4cpo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"90d3348b-8194-4e22-b906-6b578716ed04\"}"},{"__ref":"Favorites:{\"uuid\":\"05445b92-cda0-43f7-8d88-b19a027af640\"}"},{"__ref":"Favorites:{\"uuid\":\"77cdb007-1e1e-4758-b049-33c50a4bf6a1\"}"}],"causesSupported":[],"major":"Anthropology, Spanish","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"873f95c8-7482-4783-acbe-f524c5f1116e\"}"},{"__ref":"DeepDives:{\"uuid\":\"a12a1382-1a1f-4963-923c-18a7dc88b96c\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb812b46-a218-4ad8-9439-a0d49be5a146\"}"},{"__ref":"DeepDives:{\"uuid\":\"dd83ee0d-3015-47a8-8d04-c1b0c9ae8aea\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f699c5c8-9f2f-4398-b90b-2ceb3763eb32/-/preview/-/format/jpg/","https://ucarecdn.com/61ea40c7-0adf-4357-a20b-375bc63d15f4/-/preview/-/format/jpg/","https://ucarecdn.com/92c8819d-36dc-4bd2-b0a5-28ab3a8ec593/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7fc6a82e-24a7-414d-b0ee-dfefb59008b1\"}"},{"__ref":"Education:{\"uuid\":\"11e0b946-bb6c-48e4-a771-99acfc44d916\"}"}],"hiredAt":"2025-09-16T14:14:00.874Z","topics":["K-5 Grade Math","Pre-Algebra","Writing","Spanish","Academic Coaching","College Essay Writing","Executive Function","Reading","History","Creative Writing","Film / Theater","History Project","Law / Government / Policy","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/","https://ucarecdn.com/977f8407-9a83-4749-acdb-4527ab9b7d71/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","ment
