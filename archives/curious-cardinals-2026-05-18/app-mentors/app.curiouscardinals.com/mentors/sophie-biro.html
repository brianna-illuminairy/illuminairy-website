xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"762396b8-8660-40bd-b560-1f7eb47d8dbd\"}":{"__typename":"DeepDives","uuid":"762396b8-8660-40bd-b560-1f7eb47d8dbd","content":"\u003cp\u003eI’ve always loved science—it was the subject that made me curious about how things work and how problems can be solved. I’m also naturally creative, so engineering felt like the perfect blend of what I enjoyed: using science to design real solutions.\u003c/p\u003e\u003cp\u003eWhat pushed me toward biomedical device engineering was my experience as a patient in high school. Spending so much time around medical technology showed me how meaningful good design can be, and I wanted to be part of creating devices that make care easier and better for patients like I once was.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"6b0209b0-5f1e-437a-8ff0-9ffa19e27ad9\"}":{"__typename":"DeepDives","uuid":"6b0209b0-5f1e-437a-8ff0-9ffa19e27ad9","content":"\u003cp\u003eA huge influence on my path into engineering was my high school physics teacher. I was the only girl in my senior-year physics class, and there were moments when I felt completely out of place. He was the person who pushed me to stay in science even when it felt intimidating. He took the time to mentor me, encouraged me to take the hardest math and science classes, and showed me what engineering actually looked like beyond the textbook. His support made me feel like I belonged in those rooms, and he’s a big reason why I not only chose engineering, but felt confident enough to stay in it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"058ef53f-3829-41f9-89fa-80389d4c7b10\"}":{"__typename":"DeepDives","uuid":"058ef53f-3829-41f9-89fa-80389d4c7b10","content":"\u003cp\u003eIn high school, I was extremely organized—honestly, that was my biggest strength. I learned early on that the only way to manage everything I cared about was to stay ahead, so I made it a habit to work at least two days before every deadline. That meant I was always prepared, never scrambling, and could handle unexpected things without stress.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI took a full load of advanced classes, which required a lot of focus, but I also spent hours every week swimming, working part-time as a lifeguard, leading multiple clubs, and volunteering at a hospital. With so many commitments, staying organized wasn’t just helpful—it was essential. That structure let me show up fully for all the things I was passionate about, and it taught me discipline and time management skills that still shape how I work today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b14f46f8-b0d8-4991-aed7-8c3467f0143f\"}":{"__typename":"DeepDives","uuid":"b14f46f8-b0d8-4991-aed7-8c3467f0143f","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to create a medical device or technology that genuinely improves care for patients in low-resource or underserved settings. After spending time in hospitals myself, and later working on projects in underserved communities in South Africa, I’ve realized how much of someone’s outcome can depend on whether the right tools are available at the right time. I want to be part of building something that makes high-quality care more accessible—something practical, affordable, and impactful enough that it changes the way care is delivered for people who currently don’t have many options. To me, creating a device like that would feel like a meaningful contribution that lasts beyond my own career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"8a598a98-f8af-48c9-82fd-8c32fc707fe9\"}":{"__typename":"School","uuid":"8a598a98-f8af-48c9-82fd-8c32fc707fe9","name":"Wellesley High School","city":"Wellesley","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02481"},"Education:{\"uuid\":\"9115297f-f0e7-4a9b-95b1-350e5dcbf38f\"}":{"__typename":"Education","uuid":"9115297f-f0e7-4a9b-95b1-350e5dcbf38f","school":{"__ref":"School:{\"uuid\":\"8a598a98-f8af-48c9-82fd-8c32fc707fe9\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"d9731567-e468-4e8e-94e5-766bbb8617f3\"}":{"__typename":"Education","uuid":"d9731567-e468-4e8e-94e5-766bbb8617f3","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"c30a79a0-7bd2-488f-bb02-74b17f191d13\"}":{"__typename":"MentorPublicProfile","uuid":"c30a79a0-7bd2-488f-bb02-74b17f191d13","displayName":"Sophie B.","slug":"sophie-biro","biography":"\u003cp\u003eHi! I’m Sophie Biro — I studied biomedical engineering at Northwestern University and now work as a Research and Development Engineer at Boston Scientific in their heart devices division. I’ve always loved problem-solving and finding creative ways to make healthcare more advanced, effective, and accessible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern, I dove into projects that showed me just how hands-on and impactful engineering can be. One of my favorite experiences was designing a portable neonatal incubator for hospitals in South Africa. My team and I interviewed doctors, designed and 3D printed prototypes in SolidWorks, and built electronic heating elements. We had the opportunity to present our work at the Global Healthcare Technology Conference in Cape Town. I also spent two years researching bioelectronic devices designed to study drug delivery. I worked in a cleanroom (that's why I'm in a hazmat suit in one of my pictures). That project taught me about the patience, teamwork, and precision it takes to turn an idea into something that actually works (and how satisfying it is when it finally does).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore starting full-time at Boston Scientific, I interned there and got to blend everything I’d learned in school — from mechanical testing to coding — into real-world medical device design. I built models to simulate tissue contact, wrote Python scripts to automate data analysis, and helped design tests that make sure devices meet safety and performance standards. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of engineering, something really close to my heart is my role as a guest speaker for Boston Children’s Hospital. I spent years there as a patient after a head injury back in high school, and now I get to go back to share my story with patients and families. It’s such a special experience — getting to encourage kids who are going through tough recoveries and showing them that healing can lead to strength and new beginnings.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not in the lab or at work, you can usually find me staying active or just having fun with my hobbies. I grew up as a swimmer and still love being in the pool, and lately I’ve gotten really into running — I've made some pretty awesome running playlists! I’m also a huge fantasy football fan (and a lifelong Patriots supporter), love a good reality TV binge, and like to read.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether I’m working on a medical device or helping someone learn something new, I’m happiest when I’m connecting with others and sharing what I’m passionate about. I hope to inspire students to follow their curiosity, take on challenges that excite them, and see how what they learn can make a real difference in the world.\u003c/p\u003e","teachingVideoPlaybackId":"NfekwK37O0015mF5lK1VJU4ECbksbTx6007yCeB4viXqY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"762396b8-8660-40bd-b560-1f7eb47d8dbd\"}"},{"__ref":"DeepDives:{\"uuid\":\"6b0209b0-5f1e-437a-8ff0-9ffa19e27ad9\"}"},{"__ref":"DeepDives:{\"uuid\":\"058ef53f-3829-41f9-89fa-80389d4c7b10\"}"},{"__ref":"DeepDives:{\"uuid\":\"b14f46f8-b0d8-4991-aed7-8c3467f0143f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a547cc3a-677b-449a-aa54-13d843020373/-/preview/-/format/jpg/","https://ucarecdn.com/772031c9-f634-469a-a7ba-e861dbe3c3fd/-/preview/-/format/jpg/","https://ucarecdn.com/6960fc8b-6fa4-46f9-9d1e-24c39f43bf08/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9115297f-f0e7-4a9b-95b1-350e5dcbf38f\"}"},{"__ref":"Education:{\"uuid\":\"d9731567-e468-4e8e-94e5-766bbb8617f3\"}"}],"hiredAt":"2025-10-21T20:54:19.037Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Chemistry","Biology","Physics","6-8 Grade Science","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Medicine / Health","Coding / Programming","Web Design","Robotics / Electronics / CAD","STEM Project","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sophie-biro\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c30a79a0-7bd2-488f-bb02-74b17f191d13\"}"}}},"_sentryTraceData":"30297c51cad34d8683c37b56072b0aee-a97d42dbd76de623-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=30297c51cad34d8683c37b56072b0aee,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sophie-biro"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></
