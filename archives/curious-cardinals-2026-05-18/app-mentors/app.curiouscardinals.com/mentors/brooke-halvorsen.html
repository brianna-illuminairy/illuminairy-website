xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"684272b7-8411-4b5b-bc95-06c0c3877653\"}":{"__typename":"Favorites","uuid":"684272b7-8411-4b5b-bc95-06c0c3877653","photoUrl":"https://ucarecdn.com/ad9218f5-310b-42a8-9578-fefa13434d87/","title":"Rowing","type":"SPORT"},"Favorites:{\"uuid\":\"e218aa1f-ff1f-44d0-ae97-ad6d34772a89\"}":{"__typename":"Favorites","uuid":"e218aa1f-ff1f-44d0-ae97-ad6d34772a89","photoUrl":"https://ucarecdn.com/d1a0709c-753e-4872-9560-acaee735ee70/","title":"La La Land","type":"MOVIE"},"Favorites:{\"uuid\":\"6355fb0f-44bc-438d-aa2e-a95ea96d8148\"}":{"__typename":"Favorites","uuid":"6355fb0f-44bc-438d-aa2e-a95ea96d8148","photoUrl":"https://ucarecdn.com/02286fcc-bfa4-4df3-accc-925edff1e29e/","title":"Charm - Clairo","type":"ALBUM"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1af8477c-1cdb-4954-8be4-8eecc9fd46e4\"}":{"__typename":"DeepDives","uuid":"1af8477c-1cdb-4954-8be4-8eecc9fd46e4","content":"\u003cp\u003eI hope to visit all seven continents in my lifetime. I’ve only made it to two so far, so I’ve got some work to do — but I love traveling and learning by being dropped into new places. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e4e55ca6-d434-4b49-b5de-7698d566e743\"}":{"__typename":"DeepDives","uuid":"e4e55ca6-d434-4b49-b5de-7698d566e743","content":"\u003cp\u003eI’m extremely proud of myself for taking a big leap and spending a month in Rome working on a bioarchaeology dig. It was my first time traveling alone, and I arrived knowing nothing about the country, the people I’d be working with, or what daily life would look like. It was a full immersion experience and I grew so much as a person during my time there. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"eb9c9337-2178-4ca9-9a5e-6e9f349360e4\"}":{"__typename":"DeepDives","uuid":"eb9c9337-2178-4ca9-9a5e-6e9f349360e4","content":"\u003cp\u003eMy greatest role model is my mom. She’s an incredibly hardworking woman and somehow manages to do it all with grace, humility, and composure. Watching her lead, problem-solve, and show up for the people around her has shaped how I think about success, and I definitely hope to be like her one day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"74c616fd-c65f-484e-a7f7-6d943d6189cd\"}":{"__typename":"DeepDives","uuid":"74c616fd-c65f-484e-a7f7-6d943d6189cd","content":"\u003cp\u003eSomething that isn’t obvious right away is that I have ADHD. It’s made me really good at finding creative ways to learn, stay organized, and keep myself engaged (because I’ve had to). That experience helps me connect especially well with neurodivergent students. I know what it’s like when traditional learning doesn’t quite click, and I love helping students figure out strategies that work for their brains.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"86e526bf-de73-4dcd-bf7c-8fb096e16c34\"}":{"__typename":"School","uuid":"86e526bf-de73-4dcd-bf7c-8fb096e16c34","name":"Bellevue High School","city":"Bellevue","type":"HIGH","state":"Washington","country":"United States","zip":"98004"},"Education:{\"uuid\":\"4f0da4e2-2780-4e40-bdb9-27673ad1070c\"}":{"__typename":"Education","uuid":"4f0da4e2-2780-4e40-bdb9-27673ad1070c","school":{"__ref":"School:{\"uuid\":\"86e526bf-de73-4dcd-bf7c-8fb096e16c34\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"5748cd1d-84ee-44fa-8b4c-c22393ad8142\"}":{"__typename":"Education","uuid":"5748cd1d-84ee-44fa-8b4c-c22393ad8142","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Health \u0026 Human Biology and Biological Anthropology","degree":null},"MentorPublicProfile:{\"uuid\":\"534f4da3-24f0-4dd7-ad81-43db643468ed\"}":{"__typename":"MentorPublicProfile","uuid":"534f4da3-24f0-4dd7-ad81-43db643468ed","displayName":"Brooke H.","slug":"brooke-halvorsen","biography":"\u003cp\u003eHi! I’m Brooke, a graduating senior at Brown University studying Health \u0026amp; Human Biology and Anthropology. \u003cstrong\u003eThis fall, I will be starting my Master's in Climate Change Management and Finance at Imperial College London\u003c/strong\u003e. I mentor students in both academic subjects and passion projects, especially in biology, environmental topics, and research-based work. I’m passionate about helping students turn curiosity into projects they’re proud of, both in or out of the classroom.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I was in high school, I knew I cared deeply about health, the environment, and making a difference, but I didn’t yet know how to connect those interests into a clear path. At Brown, I learned how to bring together science, social questions, and real-world impact through research and teaching:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConducted independent research on carbon emission mitigation in Rhode Island for my senior capstone project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterned with an environmental startup focused on innovative, eco-friendly burial practices, helping with public education, marketing, and outreach\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eParticipated in bioarchaeology field research in Rome, studying the biological profiles of individuals from 2 AD\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked on a long-term anthropology research project documenting historical preservation and environmental impact on protected sites in Providence, RI\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI specialize in guiding students through:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic mentorship\u003c/strong\u003e in life and social sciences\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003c/strong\u003e (starting a club, getting involved in advocacy, research projects or creative presentations)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch mentorship\u003c/strong\u003e (learning about the research process, designing and running projects, and presenting your findings with confidence)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStudy skills and confidence-building\u003c/strong\u003e for middle and high school students\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to help\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI’ve worked as a teaching assistant for three years, where I helped students break down complex ideas, practice science in hands-on lab environments, and build confidence in STEM subjects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming innovative project ideas and connecting them to real-world applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding out a week-by-week roadmap so you feel confident and supported\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGuiding you through application material preparation from essays and resumes to portfolios and presentation practice\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down a complex concept into easy, visual steps\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eOutside of academics\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside of school, I’m a Division I coxswain on Brown’s Women’s Rowing team, which means I spend a lot of time communicating clearly and inspiring people under pressure. I also enjoy being outdoors, learning new languages, listening to music, and going on walks with my two dogs.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re excited to explore your interests, ask bold questions, and grow your confidence, I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"kFEcFKa4Gg1cr003PfmETtmEWzgU5BO63GuC4dw00RBvc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"684272b7-8411-4b5b-bc95-06c0c3877653\"}"},{"__ref":"Favorites:{\"uuid\":\"e218aa1f-ff1f-44d0-ae97-ad6d34772a89\"}"},{"__ref":"Favorites:{\"uuid\":\"6355fb0f-44bc-438d-aa2e-a95ea96d8148\"}"}],"causesSupported":[],"major":"Health \u0026 Human Biology and Biological Anthropology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1af8477c-1cdb-4954-8be4-8eecc9fd46e4\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4e55ca6-d434-4b49-b5de-7698d566e743\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb9c9337-2178-4ca9-9a5e-6e9f349360e4\"}"},{"__ref":"DeepDives:{\"uuid\":\"74c616fd-c65f-484e-a7f7-6d943d6189cd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a29943ef-f232-482b-9e71-f6d56b00c508/-/preview/-/format/jpg/","https://ucarecdn.com/3118eee3-19aa-49ba-a7b0-7e7c6eab9f36/-/preview/-/format/jpg/","https://ucarecdn.com/0f76148d-168c-44d5-9b04-dc5316ebf02b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4f0da4e2-2780-4e40-bdb9-27673ad1070c\"}"},{"__ref":"Education:{\"uuid\":\"5748cd1d-84ee-44fa-8b4c-c22393ad8142\"}"}],"hiredAt":"2026-01-21T21:06:37.659Z","topics":["6-8 Grade Science","Biology","Writing","Academic Coaching","College Essay Writing","Executive Function","Business / Entrepreneurship","Medicine / Health","STEM Project","Law / Government / Policy","Sustainability"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"brooke-halvorsen\
