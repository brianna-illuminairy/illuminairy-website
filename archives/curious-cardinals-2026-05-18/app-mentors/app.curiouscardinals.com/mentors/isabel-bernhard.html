xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"23b3f288-58da-4a69-b06c-b423294f481b\"}":{"__typename":"DeepDives","uuid":"23b3f288-58da-4a69-b06c-b423294f481b","content":"\u003cp\u003eMy undergrad major at Harvard was Social Studies, a multidisciplinary degree that bridges coursework from poli sci, history, economics, sociology, and anthropology. I loved the chance to experiment with different ideas and methods as much as I loved our department head's homemade cookies in the student lounge. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9d7b1bf2-9bb3-4740-ae85-122c2d4c9e55\"}":{"__typename":"DeepDives","uuid":"9d7b1bf2-9bb3-4740-ae85-122c2d4c9e55","content":"\u003cp\u003eMentorship was such an important part of my student years, and I want to give others the same joys and opportunities I received. Whether it was my supervisor in the Foreign Service who nudged my interest in a particular subfield, or an upperclassman friend who saw my skills and suggested I broaden my career strategy, mentors around me have helped me build the future and navigate the speed bumps along the way. Binoculars and road-paving equipment in hand, I'm here to do the same for you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"c09f6592-02b0-40e5-a2f9-0961b3b26afc\"}":{"__typename":"DeepDives","uuid":"c09f6592-02b0-40e5-a2f9-0961b3b26afc","content":"\u003cp\u003eMiddle school me was a theater and debate kid to the core. In seventh grade, I loved acting in our school's true-crime rendition of Snow White and the Seven Dwarfs. In eighth grade, I taught myself how to rap in order to increase my spoken word speed for policy debate rounds. Although my acting and rapping career has seen better days, my passion for making ideas stick with people (and entertaining them in the process) is still who I am. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e847a49a-f5c0-46a0-9ab9-c575355493dc\"}":{"__typename":"DeepDives","uuid":"e847a49a-f5c0-46a0-9ab9-c575355493dc","content":null,"videoPlaybackId":"TN5dFikjh7W01EosFZD4bfQC7pedUDtMToTTJhud9zR8","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"52f855e9-a7b3-4fb7-80fe-e7cf052e2686\"}":{"__typename":"School","uuid":"52f855e9-a7b3-4fb7-80fe-e7cf052e2686","name":"Lexington High School","city":"Lexington","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02421"},"Education:{\"uuid\":\"0fb2a2ac-bbd7-4484-88ac-9991346df8ce\"}":{"__typename":"Education","uuid":"0fb2a2ac-bbd7-4484-88ac-9991346df8ce","school":{"__ref":"School:{\"uuid\":\"52f855e9-a7b3-4fb7-80fe-e7cf052e2686\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"27cea1f5-b69d-476c-beb8-f24b443a9f2f\"}":{"__typename":"Education","uuid":"27cea1f5-b69d-476c-beb8-f24b443a9f2f","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Social Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"fecd5fdb-72a7-4e5a-987f-ca4a982723ae\"}":{"__typename":"MentorPublicProfile","uuid":"fecd5fdb-72a7-4e5a-987f-ca4a982723ae","displayName":"Isabel B.","slug":"isabel-bernhard","biography":"\u003cp\u003eWelcome! I'm excited to foster your curiosity and hone your skills across the social sciences by drawing on my two interdisciplinary degrees and an international blend of work-life experiences.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI currently work in Dutch sustainable finance after transitioning from a Washington,DC-based career in foreign policy. During my pivot from diplomat-in-training to VC investor, I briefly joined a hybrid tea farm and hospitality startup in rural Japan. The experience gave me a valuable education in out-of-the-box thinking, as well as a lifelong matcha habit.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFluent in Spanish, Portuguese, and Mandarin Chinese, I've also been a volunteer interpreter for local government and coached bilingual youth debate teams in my home city, Boston.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy training in public service and my experiences across diverse cultures drive me to place people at the center of all that I do. Whatever your academic goals, extracurricular interests, or professional priorities may be, I look forward to learning your story and helping along your journey.\u003c/p\u003e","teachingVideoPlaybackId":"Z00X02Klf02hpYf02uVb9BTWws8p0041Rs32WUEs01024726wI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Social Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"23b3f288-58da-4a69-b06c-b423294f481b\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d7b1bf2-9bb3-4740-ae85-122c2d4c9e55\"}"},{"__ref":"DeepDives:{\"uuid\":\"c09f6592-02b0-40e5-a2f9-0961b3b26afc\"}"},{"__ref":"DeepDives:{\"uuid\":\"e847a49a-f5c0-46a0-9ab9-c575355493dc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/978e51e5-4fa1-4f00-9dd9-b104a669d43f/-/preview/-/format/jpg/","https://ucarecdn.com/e2d9b2aa-258b-4047-9eac-fc293d926e47/-/preview/-/format/jpg/","https://ucarecdn.com/b426146f-dfd4-40cf-90c0-88cc966e8ab2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0fb2a2ac-bbd7-4484-88ac-9991346df8ce\"}"},{"__ref":"Education:{\"uuid\":\"27cea1f5-b69d-476c-beb8-f24b443a9f2f\"}"}],"hiredAt":"2024-11-12T09:39:10.531Z","topics":["Writing","Spanish","Mandarin Chinese","Academic Coaching","College Essay Writing","Reading","History","Economics","History Project","Business / Entrepreneurship","Finance / Investing","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isabel-bernhard\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fecd5fdb-72a7-4e5a-987f-ca4a982723ae\"}"}}},"_sentryTraceData":"2e548108f28b4e01b73619f69eb17241-b1c6fc085b5be6bd-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2e548108f28b4e01b73619f69eb17241,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug
