xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f62ed5ff-186c-4150-b59c-5de447aaf6a8\"}":{"__typename":"Favorites","uuid":"f62ed5ff-186c-4150-b59c-5de447aaf6a8","photoUrl":"https://ucarecdn.com/235e0435-39f5-48ab-a5e6-2e897e3d0aa6/","title":"Denver Broncos","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"a2173064-8c86-4d69-b403-afcfab937335\"}":{"__typename":"Favorites","uuid":"a2173064-8c86-4d69-b403-afcfab937335","photoUrl":"https://ucarecdn.com/dae5c732-e464-4662-b8e5-1ee1af8030b3/","title":"Nikola Jokic","type":"ATHLETE"},"Favorites:{\"uuid\":\"a06a39b3-4bbf-40f0-989a-38a30f62fd46\"}":{"__typename":"Favorites","uuid":"a06a39b3-4bbf-40f0-989a-38a30f62fd46","photoUrl":"https://ucarecdn.com/41e8461c-a130-4ef7-827a-efb1992b2516/","title":"The Dark Knight","type":"MOVIE"},"CausesSupported:{\"uuid\":\"9ed5f590-e6bc-48b5-9b49-1ff045a1a8fc\"}":{"__typename":"CausesSupported","uuid":"9ed5f590-e6bc-48b5-9b49-1ff045a1a8fc","name":"The Kempe Center","description":"\u003cp\u003eFocuses on improving the health of children who have faced child abuse.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/3c81aa9f-a4ef-4dd6-8d2d-122f56ad0723/"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5e7d2c3e-1441-4141-886f-aa2ee2c9c29d\"}":{"__typename":"DeepDives","uuid":"5e7d2c3e-1441-4141-886f-aa2ee2c9c29d","content":"\u003cp\u003eThe greatest role model in my life is my grandmother. My grandmother demonstrated to me from a young age how important a work-life balance is and why happiness and love is the key to life. Although she worked incredibly hard, she always found a way to spend time with family and friends — saying that those very people allow you to be successful in your personal life and work life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"04f6062d-12b0-4486-b6ff-267d902acd8a\"}":{"__typename":"DeepDives","uuid":"04f6062d-12b0-4486-b6ff-267d902acd8a","content":"\u003cp\u003eBeing from Colorado, I love to be outside. Whether it is 100 degrees or -10 degrees, I can find just about anything to do. Specifically, I love playing sports, skiing, hiking, and fishing. When I am inside, I enjoy playing the piano and keeping up to date on the latest TV shows and movies. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"017f0e5b-0aeb-42d6-86c3-a1fd49db29ed\"}":{"__typename":"DeepDives","uuid":"017f0e5b-0aeb-42d6-86c3-a1fd49db29ed","content":"\u003cp\u003eDuring my high school summers, I found jobs that would keep me moving. Over the course of my four years, I worked at a construction site, a car wash, a moving company, and a tape-manufacturing warehouse. While the jobs may certainly seem random, I love working with my hands and I found a different skill to take away from each experience. Outside of work, I found as many opportunities as I could to spend time with friends, play tennis, swim, and travel. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"fdb88f2d-a7f1-48c4-a589-42b17a55f9e8\"}":{"__typename":"DeepDives","uuid":"fdb88f2d-a7f1-48c4-a589-42b17a55f9e8","content":"\u003cp\u003eI have always loved mentoring. Volunteering for a non-profit that assisted abused children, creating camps to allow kids of all backgrounds to play underrepresented sports, and teaching underprivileged students about financial concepts have allowed me to uncover this passion. Every child has so much to offer the world, and being able to assist a child in uncovering their potential is rewarding for everyone involved. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"15ab7f72-a190-4e1b-95d6-1e83b91063fb\"}":{"__typename":"School","uuid":"15ab7f72-a190-4e1b-95d6-1e83b91063fb","name":"Denver East High School","city":"Denver","type":"HIGH","state":"Colorado","country":"United States","zip":"80206"},"Education:{\"uuid\":\"8980327c-7fe3-4e3c-9d4d-e4a0413d0cd8\"}":{"__typename":"Education","uuid":"8980327c-7fe3-4e3c-9d4d-e4a0413d0cd8","school":{"__ref":"School:{\"uuid\":\"15ab7f72-a190-4e1b-95d6-1e83b91063fb\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"69a6b170-33a6-4f45-befe-525a93c487a8\"}":{"__typename":"Education","uuid":"69a6b170-33a6-4f45-befe-525a93c487a8","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"ff31d29f-0bea-4566-a7e7-31909e448c85\"}":{"__typename":"MentorPublicProfile","uuid":"ff31d29f-0bea-4566-a7e7-31909e448c85","displayName":"Alec B.","slug":"alec-biermann","biography":"\u003cp\u003eMy name is Alec and I am a junior at Vanderbilt University majoring in Economics and minoring in Business. I attended Denver East High School in Colorado where I explored my passion for business, competition, and collaboration through programs like DECA, lacrosse, tennis, and debate. I describe myself as a personable, curious, and passionate student. I translate these traits to the classroom by first connecting with the mentee and then proceeding to teach them as a mentor rather than as just a teacher. My priority as a mentor is to have the mentee engage and connect with the material because, in my experience, learning can be incredibly powerful when you can relate to the material.\u003c/p\u003e","teachingVideoPlaybackId":"cVVZVmxYapuVhwfKjAOd201aVBiBAmXDT00N900DK1ZMqo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDuring the Covid-19 pandemic, many children were eager to interact and play with other kids. Parents were also struggling to make ends meet while also providing entertainment for their children. Seeing this problem, I started a free summer camp where I taught lacrosse to local kids between 6 and 15 years old. This helped many local parents give their children a free, fun, and physical activity while also providing the kids with a space to run around and play with friends. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f62ed5ff-186c-4150-b59c-5de447aaf6a8\"}"},{"__ref":"Favorites:{\"uuid\":\"a2173064-8c86-4d69-b403-afcfab937335\"}"},{"__ref":"Favorites:{\"uuid\":\"a06a39b3-4bbf-40f0-989a-38a30f62fd46\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9ed5f590-e6bc-48b5-9b49-1ff045a1a8fc\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5e7d2c3e-1441-4141-886f-aa2ee2c9c29d\"}"},{"__ref":"Dee
