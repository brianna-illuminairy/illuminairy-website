ect employed. Most of her Philosophy courses focused on the philosophy of science and spanned a wide breath of topics all the way from epistemology to the ethics of the environment.\u003cbr\u003e\u003cbr\u003eOutside of the classroom Ilana enjoys photography, spending time with her friends and dogs, and testing out new recipes.\u003cbr\u003e\u003cbr\u003eShe is most passionate about helping students build their self-confidence and problem solving skills so they can not only achieve whatever their current goals may be, but also work towards those they have yet to imagine.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e82dd7ee-650a-4dee-bceb-2b5b89ebfd26\"}"},{"__ref":"DeepDives:{\"uuid\":\"b81411df-58b8-4f5c-a0cc-02acb74886f6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ade87039-d6a7-4596-a32a-d5696a18dd19/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4811d908-7530-4126-97e2-6b757688359f\"}"},{"__ref":"Education:{\"uuid\":\"8e1c3565-931d-4a46-ad7e-3131674ba35b\"}"}],"hiredAt":"2023-10-09T04:56:29.165Z","topics":["Medicine / Health","Biology","Chemistry","Physics","Calculus","Precalculus / Trigonometry","Algebra II","Algebra I","Pre-Algebra","Geometry","K-5 Grade Math","6-8 Grade Science","Writing","Video / Photography"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ilana-deykin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d3a18a22-e52e-492e-ade9-239b79abd35b\"}"}}},"_sentryTraceData":"a243b917a3394343b77b04882c658b10-931debeaa95cba30-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc58
