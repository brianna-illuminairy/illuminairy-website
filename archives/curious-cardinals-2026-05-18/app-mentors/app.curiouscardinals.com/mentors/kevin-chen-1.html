xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1539bdf1-99d2-4573-9d89-5c41193e0c06\"}":{"__typename":"Favorites","uuid":"1539bdf1-99d2-4573-9d89-5c41193e0c06","photoUrl":"https://ucarecdn.com/ceeb17a8-af61-4d00-936c-e3f24598e124/","title":"The Little Prince by Antoine de Saint-Exupéry","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0ada738d-8c46-42b1-b142-227ce5187632\"}":{"__typename":"DeepDives","uuid":"0ada738d-8c46-42b1-b142-227ce5187632","content":"\u003cp\u003eThe advice I would give my former self is: \u003cstrong\u003edon't stress too much. \u003c/strong\u003eI firmly believe that school and this period of one's life should be enjoyed. After all, everyone can only be a kid once. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want to help ease the burden that a student may be feeling by helping them with their studies. With less stressors in their life, I hope that my mentees are able to enjoy their youth to the fullest.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"d701f491-283e-421d-9ce9-01831bcab56f\"}":{"__typename":"DeepDives","uuid":"d701f491-283e-421d-9ce9-01831bcab56f","content":"\u003cp\u003eMy greatest source of motivation is, without a doubt, \u003cstrong\u003emy mother\u003c/strong\u003e. She came to the United States from China and essentially started from nothing, working her way to become a partner at her law firm. If it weren't for her hard work, I would never have been able to attend these great institutions like Harvard-Westlake and Harvard.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4a75f0aa-70c7-42ed-a9a8-22be6c42b3b8\"}":{"__typename":"DeepDives","uuid":"4a75f0aa-70c7-42ed-a9a8-22be6c42b3b8","content":"\u003cp\u003eTeaching others has always been enjoyable for me. From helping my fellow peers study for math exams in middle school to making sure that my students not only passed but also performed well in ECON 50 at Harvard, the act of imparting knowledge and wisdom to someone else gave me great happiness.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHaving just graduated this year, I am taking some time to reassess what it is I want to do. While I do that, mentorship struck me as something I could do in my spare time so that I could\u0026nbsp;\u003cstrong\u003egive back to the community\u0026nbsp;\u003c/strong\u003eand\u0026nbsp;\u003cstrong\u003eimpact someone's life for the better.\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"de845c88-46ef-401a-be18-5f6f5d61594f\"}":{"__typename":"DeepDives","uuid":"de845c88-46ef-401a-be18-5f6f5d61594f","content":"\u003cp\u003eWhen I have spare time, I like to \u003cstrong\u003ewrite\u003c/strong\u003e, \u003cstrong\u003espend time with friends and family\u003c/strong\u003e, and \u003cstrong\u003eexercise\u003c/strong\u003e. As for particular activities, I love watching horror movies and playing games. These games range from in-person games, like Spikeball, to video games where I can play with my friends on the other side of the continent.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo exercise, I like to lift weights in my makeshift home gym, rock climb, or go out for a swim. Also, I completely skip leg day. I don't think I've done a specific leg exercise in five years.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"632e808d-2c85-475f-abd7-ae71ef72197d\"}":{"__typename":"Education","uuid":"632e808d-2c85-475f-abd7-ae71ef72197d","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"25b13230-a7ee-4502-98d8-ea0c43bad050\"}":{"__typename":"Education","uuid":"25b13230-a7ee-4502-98d8-ea0c43bad050","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"b2353136-bb59-4ba3-85a0-2fecf4ea2ffc\"}":{"__typename":"MentorPublicProfile","uuid":"b2353136-bb59-4ba3-85a0-2fecf4ea2ffc","displayName":"Kevin C.","slug":"kevin-chen-1","biography":"\u003cp\u003eKevin Chen graduated from Harvard in 2024 with a degree in Economics and a citation in Chinese. Right now, he is focusing on studying for law school while trying to get a book published.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the past, he was the Head Prefect of his high school, Harvard-Westlake. Additionally, he was the captain of the football and wrestling teams during his senior year. During college, he participated in a few clubs, most notable amongst them the Global Research and Consulting Group, for which he was the Director of Marketing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBorn and raised in Los Angeles, Kevin understands what it's like to be the child of immigrant parents. Furthermore, having gone to a competitive middle school and high school, he can relate to the stress that students of such institutions may feel. Knowing both of these things, Kevin strives to make sure that any mentee of his would feel supported and understood, helping them excel academically while balancing their well-being.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eKevin believes that with the right guidance and encouragement, any student can achieve their goals. He is committed to fostering a positive learning environment where students not only improve their academic performance but also develop the skills to manage stress and the confidence to thrive.\u003c/p\u003e","teachingVideoPlaybackId":"iTQdKvNEQ6JqQ59022X5r01yDm01YJD02UnUTLTLekKSHDI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1539bdf1-99d2-4573-9d89-5c41193e0c06\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0ada738d-8c46-42b1-b142-227ce5187632\"}"},{"__ref":"DeepDives:{\"uuid\":\"d701f491-283e-421d-9ce9-01831bcab56f\"}"},{"__ref":"DeepDives:{\"uuid\":\"4a75f0aa-70c7-42ed-a9a8-22be6c42b3b8\"}"},{"__ref":"DeepDives:{\"uuid\":\"de845c88-46ef-401a-be18-5f6f5d61594f\"}"}],"active":true,"profilePhoto
