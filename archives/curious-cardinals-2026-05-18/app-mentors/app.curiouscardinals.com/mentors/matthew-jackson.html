xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c924a2a7-2392-4475-9ee8-51b0d1e6a436\"}":{"__typename":"Favorites","uuid":"c924a2a7-2392-4475-9ee8-51b0d1e6a436","photoUrl":"https://ucarecdn.com/8cc57155-a14a-43f3-9595-9297574be247/","title":"The Grid by Gretchen Bakke, Ph.D.","type":"BOOK"},"Favorites:{\"uuid\":\"a801e8e0-ccc9-4d6f-a743-26d3d87a36ea\"}":{"__typename":"Favorites","uuid":"a801e8e0-ccc9-4d6f-a743-26d3d87a36ea","photoUrl":"https://ucarecdn.com/9aeb7eb0-33f2-42d5-a933-9664abc413ca/","title":"Medellín, Colombia ","type":"CITY"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4fbda566-06c3-45a2-9569-01a882e42592\"}":{"__typename":"DeepDives","uuid":"4fbda566-06c3-45a2-9569-01a882e42592","content":"\u003cp\u003eMy dream job would be to own my own international energy project development consulting agency, helping countries design and implement sustainable energy systems. I love traveling, learning about new cultures, and understanding the unique environmental challenges different regions face.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m driven by complex multi-stakeholder problems. I enjoy using computer science and engineering principles along with integrative design to solve issues related to renewable energy, resilience, and climate adaptation. This career gives me the chance to learn from diverse cultural viewpoints while supporting communities’ climate and energy resilience strategies.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis position blends engineering, policy, entrepreneurship, and integrative design thinking and consulting. It gives me the space to excel in an interdisciplinary environment by bringing together my technical skills, cultural curiosity, and entrepreneurial spirit to catalyze positive change.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a2dd72d5-e79b-4b87-9a72-40b470de143b\"}":{"__typename":"DeepDives","uuid":"a2dd72d5-e79b-4b87-9a72-40b470de143b","content":"\u003cp\u003eMy passion projects all center on confronting structural problems that span technology, society, and the environment through interdisciplinary integrative design. I’ve built real-time grid-optimization tools that use open-source CA operator data to address renewable curtailment, along with a resilience-focused Puerto Rico grid model that simulates outages and optimal dispatch strategies.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also prototyping PinPals, an upcycled-fashion marketplace and user-tested minimum viable product exploring how upcycling and peer learning can reshape fast-fashion consumption behaviors. Beyond engineering and user design, I create journalistic essays complemented by street-travel photography to document environmental and cultural complexity on the ground.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTogether, these projects show how I validate ideas, design with users, and translate technical insights for diverse audiences. They also reflect the way I guide my mentees in building ambitious, human-centered, impact-driven work.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"036ef42c-9b66-44b1-b63f-e832db7f699f\"}":{"__typename":"DeepDives","uuid":"036ef42c-9b66-44b1-b63f-e832db7f699f","content":"\u003cp\u003eIf I could give my middle or high school self advice, I’d say: stay curious, because curiosity will carry you further than you realize. You don’t have to know everything right away; just have confidence and certainty in your next step. Stay humble, because learning can come from anyone and anywhere.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eKeep advocating for yourself and seeking out new opportunities, even when they might seem out of reach, because even small sparks of initiative can lead to big outcomes. And don’t limit yourself by saying “no” before you even try. Be grateful for every room you enter, but also remember that you’re not just lucky to be there; you bring value and are an asset to those spaces too.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTrust the process and trust what you’re capable of, because the places you’re headed are limitless.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a7735802-73bd-4e4b-b282-f5892cbffb72\"}":{"__typename":"DeepDives","uuid":"a7735802-73bd-4e4b-b282-f5892cbffb72","content":"\u003cp\u003eMy greatest source of motivation is the passion of others. It’s why I mentor and why I love Stanford. The Stanford \u0026amp; Silicon Valley eco-systems are places filled with people who care deeply about building a better future. In the Doerr School of Sustainability, I’m surrounded by teams tackling some of the world’s toughest sustainability problems. Their drive reminds me that while I can’t solve climate change alone, collective action and innovative collaboration truly can create real, measurable impact.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also motivated by the innovators and change-makers who came before me, including my own mentors and the historical figures who dedicated their lives to a more just and sustainable world. Knowing I’m part of a larger community working toward change pushes me to keep going, both for myself and for those working tirelessly alongside me and those who will carry this work forward long after me.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"b7ec652d-8ca1-45df-8321-f1e890f6844b\"}":{"__typename":"School","uuid":"b7ec652d-8ca1-45df-8321-f1e890f6844b","name":"San Gorgonio High School","city":"San Bernardino","type":"HIGH","state":"California","country":"United States","zip":"92404"},"Education:{\"uuid\":\"8c4998f1-f550-41ac-9bba-4353f67ec716\"}":{"__typename":"Education","uuid":"8c4998f1-f550-41ac-9bba-4353f67ec716","school":{"__ref":"School:{\"uuid\":\"b7ec652d-8ca1-45df-8321-f1e890f6844b\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"066b2c3b-d8d8-4ba4-a2a2-ff7f2ceed04d\"}":{"__typename":"Education","uuid":"066b2c3b-d8d8-4ba4-a2a2-ff7f2ceed04d","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2027","major":"B.S. Symbolic Systems, M.S. Energy Science \u0026 Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"8974f1b8-46cd-4e65-8f02-314bacefbfc5\"}":{"__typename":"MentorPublicProfile","uuid":"8974f1b8-46cd-4e65-8f02-314bacefbfc5","displayName":"Matthew J.","slug":"matthew-jackson","biography":"\u003ch3\u003e\u003cstrong\u003eHi! I’m Matthew Jackson — most call me MJ.\u003c/strong\u003e\u003cbr\u003e\u003c/h3\u003e\u003cp\u003eI was born and raised in San Bernardino, CA, and I’m a proud first-generation college student. I’m now a coterminal B.S./M.S. student at Stanford University, studying Symbolic Systems (the blend of cognitive science + computer science) and Energy Engineering. I’m also the first student from San Gorgonio High School in over a decade to attend Stanford, something I carry with a lot of pride.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy high school years were full of experimentation and discovery: I played saxophone in jazz band, competed in Academic Decathlon, swam and played water polo, and spent weekends volunteering at my local community center. At Stanford, I’m actively involved in the Markaz, the Islamic Cultural Center, Casa Zapata, the Chicano Cultural Center, the Stanford Energy Club, and the broader Doerr School of Sustainability community.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhat I’m passionate about:\u003c/strong\u003e\u003cbr\u003e\u003c/h3\u003e\u003cp\u003eMy interests bring together computer science, climate adaptation, and integrative system design. I love helping students think creatively about global challenges. Many of the most exciting ideas emerge where technology, sustainability, and human-centered design meet. I’m a big believer in innovation, entrepreneurship, and artivism (art + activism) as tools for climate and social impact. My goal for my mentees is to help them build projects that matter to them and help them understand how their ideas fit into meaningful, real-world impact.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eExamples of projects we can develop:\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI enjoy helping students turn big ideas into concrete actions. Whether it’s a technical build, a research project, a creative piece, or an early-stage entrepreneurial concept, I take pride in guiding students through need-finding and helping them define a problem they genuinely care about. From there, we work together to build solutions that create meaningful social and environmental change.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eBased on my expertise I’m qualified to guide students through projects such as:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e(1) Building data pipelines and optimization tools for real-time energy or system modeling. \u003c/p\u003e\u003cp\u003e(2) Developing a business hypothesis and creating a minimum viable product (MVP) to test it through real user feedback. \u003c/p\u003e\u003cp\u003e(3) Exploring journalism, videography, and digital media as tools for storytelling and activism\u003c/p\u003e\u003cp\u003e(4) Tackling global, systems-level problems through interdisciplinary thinking and design. \u003c/p\u003e\u003cp\u003e(5) Planning a long-term college strategy, including identifying academic interests, shaping extracurricular pathways, and structuring multi-year project growth.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eI’ve supported students across many academic and creative pathways. My experience in engineering, computing, media, and sustainability allows me to effectively guide those I mentor through ambitious purpose-drive projects. If you’re curious, motivated, and excited to create something meaningful, I’d love to guide you. Whether you’re brimming with ideas or just starting to explore what inspires you, we can work together to shape a project that reflects your passions, challenges you to grow, and makes a real impact in the world.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"xnEgX4mBPO901no3hKHh2thLr02PLMUklnxq5QRcFGXbE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c924a2a7-2392-4475-9ee8-51b0d1e6a436\"}"},{"__ref":"Favorites:{\"uuid\":\"a801e8e0-ccc9-4d6f-a743-26d3d87a36ea\"}"}],"causesSupported":[],"major":"B.S. Symbolic Systems, M.S. Energy Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4fbda566-06c3-45a2-9569-01a882e42592\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2dd72d5-e79b-4b87-9a72-40b470de143b\"}"},{"__ref":"DeepDives:{\"uuid\":\"036ef42c-9b66-44b1-b63f-e832db7f699f\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7735802-73bd-4e4b-b282-f5892cbffb72\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/291b0fb2-75ea-40eb-b3fa-b8b21af07a4e/-/preview/-/format/jpg/","https://ucarecdn.com/dd87fb72-0a80-425f-862d-a1f11d62bec3/-/preview/-/format/jpg/","https://ucarecdn.com/f038f32d-26fc-4139-a8e1-de39f5b0c023/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8c4998f1-f550-41ac-9bba-4353f67ec716\"}"},{"__ref":"Education:{\"uuid\":\"066b2c3b-d8d8-4ba4-a2a2-ff7f2ceed04d\"}"}],"hiredAt":"2025-10-31T16:59:10.155Z","topics":["Algebra I","Algebra II","Calculus","Statistics","Physics","Chemistry","Writing","Spanish","Academic Coaching","College Essay Writing","Computer Science","Creative Writing","Visual Arts / Graphic Design","Video / Photography","Business / Entrepreneurship","Coding / Programming","Web Design","Machine Learning / AI","Sustainability","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"sl
