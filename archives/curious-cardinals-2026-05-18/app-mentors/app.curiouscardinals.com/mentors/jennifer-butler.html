xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"250b6cbd-5006-4d3a-8ba1-b4164a68f4b3\"}":{"__typename":"Favorites","uuid":"250b6cbd-5006-4d3a-8ba1-b4164a68f4b3","photoUrl":"https://ucarecdn.com/9a7ddc82-19b7-433c-8947-9dd4e95c13f2/","title":"Red by Taylor Swift","type":"ALBUM"},"Favorites:{\"uuid\":\"12bf23bf-8638-404a-891c-dab12a4eeb71\"}":{"__typename":"Favorites","uuid":"12bf23bf-8638-404a-891c-dab12a4eeb71","photoUrl":"https://ucarecdn.com/4efe3a14-3728-4bc0-932c-2cd19d5ba537/","title":"The Goldfinch by Donna Tartt","type":"BOOK"},"Favorites:{\"uuid\":\"c0ebe80d-9af7-4315-bf6c-3cacddb5cb64\"}":{"__typename":"Favorites","uuid":"c0ebe80d-9af7-4315-bf6c-3cacddb5cb64","photoUrl":"https://ucarecdn.com/1f9f4d35-f832-4a8e-a545-af40350ed418/","title":"London","type":"CITY"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e551f50e-f469-4a7d-98be-4c8a274319bb\"}":{"__typename":"DeepDives","uuid":"e551f50e-f469-4a7d-98be-4c8a274319bb","content":"\u003cp\u003eI started college as an English major with plans to make a career writing. However, my plans changed when I was abruptly sent home from Cornell during my first year when the COVID-19 pandemic began. At the time, I was taking a class in social inequality, in which I felt like an observer of the inequalities I learned about until confronted with inequality in my community. Despite being raised in Philadelphia, I never fully understood the deep inequality present until living in an Ivy League community, and, more so as an educator. This experience ignited a passion—both personal and professional—for understanding educational inequality. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"be125ac9-8d1b-457b-82f8-c7531e45aea7\"}":{"__typename":"DeepDives","uuid":"be125ac9-8d1b-457b-82f8-c7531e45aea7","content":"\u003cp\u003eI would tell my middle and high school self to do more things you love! Growing up, I was so focused on my academics and doing the hobbies that I thought looked best on my resumé that I neglected the hobbies that made me feel happiest. Particularly, I always loved to dance, and because I was not actually very good at it, it was something I neglected. Now, i am slowly returning to things that bring me lots of joy, and I even take adult dance classes!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a6a0ce6d-f5be-46e0-9320-11962bcac35b\"}":{"__typename":"DeepDives","uuid":"a6a0ce6d-f5be-46e0-9320-11962bcac35b","content":"\u003cp\u003eMentorship matters to me because it has been a transformative force in my life. I have had mentors throughout my life that have helped me reach major milestones. Particularly, my middle school math teacher saw my potential early on and referred me to a college preparatory program, where I found another mentor who helped me apply to colleges. When I made it to college, I was lucky enough to have a graduate student mentor who helped me throughout the graduate school application process. Beyond this, all of these mentors cheered me on, helped me build confidence, and taught me that community is a powerful resource.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"4d3b5d92-0aab-434a-a298-c9bd54e4184c\"}":{"__typename":"School","uuid":"4d3b5d92-0aab-434a-a298-c9bd54e4184c","name":"Central High School","city":"Philadelphia","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19141"},"Education:{\"uuid\":\"e613a025-ccc5-42b2-bbfd-c5aa78224bef\"}":{"__typename":"Education","uuid":"e613a025-ccc5-42b2-bbfd-c5aa78224bef","school":{"__ref":"School:{\"uuid\":\"4d3b5d92-0aab-434a-a298-c9bd54e4184c\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"7a84e443-e983-44cf-88b3-87f421d6a529\"}":{"__typename":"Education","uuid":"7a84e443-e983-44cf-88b3-87f421d6a529","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"bb5d8986-5afa-49c1-8743-945b9c0bf5e1\"}":{"__typename":"MentorPublicProfile","uuid":"bb5d8986-5afa-49c1-8743-945b9c0bf5e1","displayName":"Jennifer B.","slug":"jennifer-butler","biography":"\u003cp\u003eHi! My name is Jennifer, and I have long been interested in teaching and mentoring. Currently, I am a doctoral student at Princeton University in the Sociology and Social Policy Joint Degree Program, where I focus on education, stratification and inequality, and globalization. \u003cbr\u003e\u003cbr\u003eMy love for teaching is what led me to study education. As an education researcher, my teaching pedagogy is research-based. I have experience working with students of all ages—from toddlers to adult learners—and I tailor my approach to meet each learner's needs and goals. My experience includes teaching language development and developing cognitive and socio-emotional skills as a daycare teaching assistant with toddlers. Additionally, I have served as an elementary classroom volunteer, supporting students in English and math. I have taught undergraduates as a teaching assistant for 4 semesters, on topics in sociology, education, and intergroup dialogue. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to my passion for teaching and learning, I am an avid traveler, visiting  15+ countries in the past 3 years, and I enjoy playing social deduction games and trying new recipes! \u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"x2RTPJxrbmSDn1CL0199OAb2bIPrl3Q302DhKdQUKkFxY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"250b6cbd-5006-4d3a-8ba1-b4164a68f4b3\"}"},{"__ref":"Favorites:{\"uuid\":\"12bf23bf-8638-404a-891c-dab12a4eeb71\"}"},{"__ref":"Favorites:{\"uuid\":\"c0ebe80d-9af7-4315-bf6c-3cacddb5cb64\"}"}],"causesSupported":[],"major":"Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e551f50e-f469-4a7d-98be-4c8a274319bb\"}"},{"__ref":"DeepDives:{\"uuid\":\"be125ac9-8d1b-457b-82f8-c7531e45aea7\"}"},{"__ref":"DeepDives:{\"uuid\":\"a6a0ce6d-f5be-46e0-9320-11962bcac35b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/197d895f-c493-477f-8017-a3301aa94a2f/-/preview/-/format/jpg/","https://ucarecdn.com/05821406-2645-4df4-8e36-206c7ca2ee49/-/preview/-/format/jpg/","https://ucarecdn.com/44592fb8-977d-4773-b5dd-b9738d4796bf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e613a025-ccc5-42b2-bbfd-c5aa78224bef\"}"},{"__ref":"Education:{\"uuid\":\"7a84e443-e983-44cf-88b3-87f421d6a529\"}"}],"hiredAt":"2025-05-06T11:16:11.628Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Statistics
