xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c9ba09f7-76df-4fa2-8cb6-f993ecf8aec5\"}":{"__typename":"DeepDives","uuid":"c9ba09f7-76df-4fa2-8cb6-f993ecf8aec5","content":"\u003cp\u003eMy favorite hobby is playing guitar. I started playing after taking a class called \"Meet the Beatles\" in high school and its slowly taken over my free time since. When I'm happy, I want to play so I can enjoy my favorite hobby, when I'm frustrated, I want to play so I can blow off steam, and when I'm overwhelmed and need a break from thinking, I want to play so I can get lost in the music for hours on end - sometimes unfortunately until 2 a.m. I'd be happy to teach guitar lessons in addition to any academic subject my mentee wants to learn.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"febebc09-bba4-43bd-a671-30702eac4bde\"}":{"__typename":"DeepDives","uuid":"febebc09-bba4-43bd-a671-30702eac4bde","content":"\u003cp\u003eI spent every summer from ages 9 to 19 at my summer camp in Ontario, Canada. There, I spent two months every summer away from my phone, surrounded by beautiful wilderness and lifelong friends. I learned independence, how to live with other people my age, and all of the essentials of canoeing Northern Ontario's major rivers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ae47ac34-2cb8-4be6-a079-74a19b5b2464\"}":{"__typename":"DeepDives","uuid":"ae47ac34-2cb8-4be6-a079-74a19b5b2464","content":"\u003cp\u003eAll of the successes I've had in my life can be attributed to the great mentors I had in my childhood. I've had camp counselors teach me how to live away from my parents for months, soccer coaches aid me in learning skills I never thought myself capable of, and academic tutors guide me to the grades that helped me get into Northwestern. I love nothing more than to give other people the same experience that helped me thrive growing up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f2109660-d4e1-4705-b23a-ca2ab7620eed\"}":{"__typename":"DeepDives","uuid":"f2109660-d4e1-4705-b23a-ca2ab7620eed","content":"\u003cp\u003eHistory explains why all of the social structures of our society came to be. It can tell you why capitalism become the dominant world economic system, or why there have been no wars between major world powers since 1945. Psychology tells us how people tick, and how the experiences of their lives shape the decisions they make. These two subjects together have given me a rich and fulfilling framework for understanding and navigating the world I live in, both interpersonally and professionally.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"03ea45c9-9e01-474d-a667-eee073c1b0ab\"}":{"__typename":"School","uuid":"03ea45c9-9e01-474d-a667-eee073c1b0ab","name":"Breck School","city":"Golden Valley","type":"HIGH","state":"Minnesota","country":"United States","zip":"55422"},"Education:{\"uuid\":\"bd5f8348-0d4b-4f5e-a3b7-4dd9ac5ccb4f\"}":{"__typename":"Education","uuid":"bd5f8348-0d4b-4f5e-a3b7-4dd9ac5ccb4f","school":{"__ref":"School:{\"uuid\":\"03ea45c9-9e01-474d-a667-eee073c1b0ab\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"5e2328ea-132c-4507-acbb-2f5dbc475ac2\"}":{"__typename":"Education","uuid":"5e2328ea-132c-4507-acbb-2f5dbc475ac2","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"History/Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"69c3db30-50aa-406b-ba14-2a1cd708aa5f\"}":{"__typename":"MentorPublicProfile","uuid":"69c3db30-50aa-406b-ba14-2a1cd708aa5f","displayName":"Ben D.","slug":"ben-drysdale","biography":"\u003cp\u003eWhat's up! My name is Ben and I'm a senior at Northwestern studying Psychology and History with a minor in Spanish. I love research, writing, and learning about people and how they operate, and I'll likely be going to law school a few years after graduation. I've spent the past two summers working at various psychology labs at Northwestern's Feinberg Medical School, helping run studies on exercise's impact on breast cancer recovery and how perfectionism impacts mental health. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I love playing guitar, working out, and exploring the unending music scene and nightlife that Chicago has to offer. If you keep an eye out for the more niche venues in Chicago you might catch me playing session guitar for a solo artist. Some of my best memories in college have been going to hidden gem blues bars and seeing other campus artists perform. I'm a big sports fan as well and I love rooting for Manchester City and the Vikings on weekend mornings. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I have a wide range of subjects I'd be happy to teach. My biggest strengths are writing, reading comprehension, and public speaking, and I've spoken at many large events at my high school, funerals, and weddings. Most importantly, I'm very patient and I understand that effective learning takes time, and that what may seem obvious to one person may not be to another. I will get frustrated with a mentee nor will I make them feel stupid for not getting something fast enough. I'm interested in students as a whole and I aim to foster a relationship with my mentees as I help them achieve their goals. I'd be especially happy to work with any students who struggle with self-confidence and/or are too hard on themselves when they can't understand something, as I've learned to deal with these issues myself growing up.\u003c/p\u003e","teachingVideoPlaybackId":"YHu3rfEVnUnUPDsq7R793DEBGNw79ucIgW8g5gn8EB8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History/Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c9ba09f7-76df-4fa2-8cb6-f993ecf8aec5\"}"},{"__ref":"DeepDives:{\"uuid\":\"febebc09-bba4-43bd-a671-30702eac4bde\"}"},{"__ref":"DeepDives:{\"uuid\":\"ae47ac34-2cb8-4be6-a079-74a19b5b2464\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2109660-d4e1-4705-b23a-ca2ab7620eed\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f24fa020-47e3-48fc-91df-4d5bca140ea4/-/preview/-/format/jpg/","https://ucarecdn.com/269bc93e-3abf-4523-84f1-4620425da83e/-/preview/-/format/jpg/","https://ucarecdn.com/789e4f68-1cae-41bc-ac9b-f8fe2a04e76f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"bd5f8348-0d4b-4f5e-a3b7-4dd9ac5ccb4f\"}"},{"__ref":"Education:{\"uuid\":\"5e2328ea-132c-4507-acbb-2f5dbc475ac2\"}"}],"hiredAt":"2024-08-19T13:18:22.630Z","topics":["History","Reading","Executive Function","Academic Coaching","College Essay Writing","Writing","History Project","Music"],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ben-drysdale\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"69c3db30-50aa-406b-ba14-2a1cd708aa5f\"}"}}},"_sentryTraceData":"e9b892812fa840e7b07c6ef354e32ccd-985ee22c57398e92-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e9b892812fa840e7b07c6ef354e32ccd,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ben-drysdale"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
