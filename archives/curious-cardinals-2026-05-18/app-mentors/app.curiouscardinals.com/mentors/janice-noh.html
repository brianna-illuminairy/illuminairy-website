xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ee0ca68b-45c3-492f-acb6-a31a66cbe6af\"}":{"__typename":"DeepDives","uuid":"ee0ca68b-45c3-492f-acb6-a31a66cbe6af","content":"\u003cp\u003eI run a small business with my colleague and we design and make home decor and lifestyle goods inspired by our Asian heritage.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8225e386-2648-4063-9e8a-f8eb76075503\"}":{"__typename":"DeepDives","uuid":"8225e386-2648-4063-9e8a-f8eb76075503","content":"\u003cp\u003eMy dream job is to have my own veterinary clinic that also features a cat and/or dog cafe on the side that serves as a shelter for adoptable pets.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5a308e26-0313-452b-b922-4e3c871a1c7d\"}":{"__typename":"DeepDives","uuid":"5a308e26-0313-452b-b922-4e3c871a1c7d","content":"\u003cp\u003eI wouldn't have gotten to where I am today without the mentorship I have received. A lot of my mentors entered my life in unexpected ways such as the veterinarian I met through my research position. I wasn't always confident with what I wanted to do as a career and the mentors I have met along the way have really helped me grow as a person while also introducing me to new areas in the world that I probably wouldn't have discovered otherwise.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9e4c7fc6-e48c-4f7e-8e1e-1c888487fda0\"}":{"__typename":"DeepDives","uuid":"9e4c7fc6-e48c-4f7e-8e1e-1c888487fda0","content":"\u003cp\u003eHave fun and enjoy the company you have. Go to that hangout and do silly things that are part of being a teen.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"5c2198bf-0447-4b3c-bdee-33a621ba8853\"}":{"__typename":"School","uuid":"5c2198bf-0447-4b3c-bdee-33a621ba8853","name":"Cherry Hill East High School","city":"Cherry Hill Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08003"},"Education:{\"uuid\":\"03545b72-149c-46e7-9908-d300dd5a5198\"}":{"__typename":"Education","uuid":"03545b72-149c-46e7-9908-d300dd5a5198","school":{"__ref":"School:{\"uuid\":\"5c2198bf-0447-4b3c-bdee-33a621ba8853\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"5f81cf5f-8bc0-4477-939c-c9bb35bd13ea\"}":{"__typename":"School","uuid":"5f81cf5f-8bc0-4477-939c-c9bb35bd13ea","name":"Boston University","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02215"},"Education:{\"uuid\":\"2dc5bb4a-51c4-462d-a93a-e61bfb3a158e\"}":{"__typename":"Education","uuid":"2dc5bb4a-51c4-462d-a93a-e61bfb3a158e","school":{"__ref":"School:{\"uuid\":\"5f81cf5f-8bc0-4477-939c-c9bb35bd13ea\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"eee912bf-0985-402e-bfe9-80ce5d676cd0\"}":{"__typename":"MentorPublicProfile","uuid":"eee912bf-0985-402e-bfe9-80ce5d676cd0","displayName":"Janice N.","slug":"janice-noh","biography":"\u003cp\u003eI studied biomedical engineering but made a career pivot after working in research for a few years after graduation. I had the privilege to work in one of the leading gene therapy research groups in the nation and had the opportunity to meet a laboratory animal veterinarian who maintained the well being of the animals under our care. I was never really exposed to veterinary medicine until I met her and her mentorship helped me discover my passion for the field. Through her guidance, along with several professors and managers who have given me invaluable knowledge as I navigated my career path, I am fortunate to be  starting veterinary school at the University of Pennsylvania in the fall of 2025! I always saw a future in healthcare, but the field of veterinary medicine stood out to me, not only because of all the cute animals I get to learn about and interact with, but also because of the potential for growth in the field and its circular impact on animals, humans, and the environment. A unique aspect of any field of medicine is that I can apply my interest in engineering and design to solve a societal problem or need. I hope to utilize my background in engineering to find or improve solutions in speciality areas such as orthopedics or diagnostics. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAside from academics, I began a passion project of starting a small business with my colleagues where we design and make lifestyle goods and home decor that are inspired by our Asian heritage. Having a creative outlet has helped me manage my stress levels while also giving me a platform to express myself. Our best selling item is our sumo orange shaped lamp (@lumpy_studios if you want to check it out :) ). This experience definitely showed me that I have an interest in entrepreneurship and the cultivating the value of connecting with the community. I hope to utilize the skills I learned through this to start my own clinic one day that will hopefully also feature a cat or dog cafe. I also enjoy spending my free time cozy gaming, cooking/baking, and going on adventures with my boyfriend and my dog, Mochi! A fun fact about myself is that I have a pet guinea pig that I rescued from a subway station in Philadelphia. This happened on my commute back home after my first day of work as a fresh grad so it was definitely an eventful day!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ee0ca68b-45c3-492f-acb6-a31a66cbe6af\"}"},{"__ref":"DeepDives:{\"uuid\":\"8225e386-2648-4063-9e8a-f8eb76075503\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a308e26-0313-452b-b922-4e3c871a1c7d\"}"},{"__ref":"DeepDives:{\"uuid\":\"9e4c7fc6-e48c-4f7e-8e1e-1c888487fda0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/08f4fa04-5e81-4af1-9649-09f7335ffcb1/-/preview/-/format/jpg/","https://ucarecdn.com/fc10f0db-0ec6-4c8d-a09e-941ebb06b482/-/preview/-/format/jpg/","https://ucarecdn.com/50986ef0-4461-44a6-91dc-c960d9adb179/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"03545b72-149c-46e7-9908-d300dd5a5198\"}"},{"__ref":"Education:{\"uuid\":\"2dc5bb4a-51c4-462d-a93a-e61bfb3a158e\"}"}],"hiredAt":"2025-06-20T06:04:26.786Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Spanish","College Essay Writing","Academic Coaching","Executive Function",
