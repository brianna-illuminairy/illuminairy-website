xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"ac6a54b4-edc0-49e0-ad28-ecfa8648f323\"}":{"__typename":"DeepDives","uuid":"ac6a54b4-edc0-49e0-ad28-ecfa8648f323","content":"\u003cp\u003eDuring my sophomore year of high school, I was in a wheelchair due to a medical condition that completely shifted my perspective on life and resilience. What felt like a major setback at the time became a turning point that taught me patience, discipline, and how to push through adversity. Just a few years later, during my freshman year of college, I ran a full marathon—something that once felt impossible. That journey from immobility to endurance shaped the way I approach everything.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ebec78d0-8253-4b74-af4e-16bbea5049a2\"}":{"__typename":"DeepDives","uuid":"ebec78d0-8253-4b74-af4e-16bbea5049a2","content":"\u003cp\u003eIn my spare time, I love hanging out with friends, writing songs, playing pickup basketball, and traveling whenever I get the chance. Whether I’m exploring a new city, shooting hoops at a local park, or just having a late-night jam session with friends, I’m always looking for moments that spark creativity and connection. These experiences outside of music keep me grounded, inspired, and constantly finding new stories to tell through my songs.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b642a312-0c57-4e49-b36e-3ae9e21decf6\"}":{"__typename":"DeepDives","uuid":"b642a312-0c57-4e49-b36e-3ae9e21decf6","content":"\u003cp\u003eI wouldn’t be where I am today without the mentorship I’ve received along the way—in everything from music to investment banking. Having people believe in me, challenge me, and guide me through the ups and downs has made all the difference. It’s shown me just how powerful support and shared knowledge can be. That’s why I’m passionate about paying it forward—whether it’s offering advice, encouragement, or simply showing up for others the way so many have shown up for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"44414a76-6240-4d8f-ba7a-361029b8dd58\"}":{"__typename":"DeepDives","uuid":"44414a76-6240-4d8f-ba7a-361029b8dd58","content":"\u003cp\u003eOne piece of advice I always come back to is this: challenges, emotions, and the phases of life are all temporary. Whether you're feeling stuck, overwhelmed, or unsure of your path, it won’t last forever. I've learned through personal highs and lows—from being in a wheelchair to running a marathon, from intense pressure in investment banking to finding creative freedom in music—that everything shifts with time. Holding onto that perspective has helped me stay grounded, keep moving forward, and trust the process even when it’s hard.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"07fb5f3c-ad33-4d20-afd0-6229f32f7cae\"}":{"__typename":"School","uuid":"07fb5f3c-ad33-4d20-afd0-6229f32f7cae","name":"Pine Crest School","city":"Fort Lauderdale","type":"HIGH","state":"Florida","country":"United States","zip":"33334"},"Education:{\"uuid\":\"6a1b7d7e-d989-490c-985a-e37687d9894b\"}":{"__typename":"Education","uuid":"6a1b7d7e-d989-490c-985a-e37687d9894b","school":{"__ref":"School:{\"uuid\":\"07fb5f3c-ad33-4d20-afd0-6229f32f7cae\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"0ea9ca2d-83f9-4333-9736-c7b6540afb20\"}":{"__typename":"Education","uuid":"0ea9ca2d-83f9-4333-9736-c7b6540afb20","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Human and Organizational Development","degree":null},"MentorPublicProfile:{\"uuid\":\"d128195d-b7aa-4740-8c9f-24125ec18fe2\"}":{"__typename":"MentorPublicProfile","uuid":"d128195d-b7aa-4740-8c9f-24125ec18fe2","displayName":"Justin K.","slug":"justin-koolik","biography":"\u003cp\u003eI’m Justin Koolik—a Nashville-based pop-folk singer-songwriter and entrepreneur. My path to music has been anything but conventional. After graduating a semester early from Vanderbilt University, where I studied Human and Organizational Development with minors in Business and Spanish, I made the decision to leave behind a career in tech investment banking to pursue music full-time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMusic has always been my anchor. I started with songwriting and eventually brought one of my most personal songs, \u003cem\u003eHome\u003c/em\u003e, to life—from the writing room to the studio and onto the stage. That project gave me a deeper love for the process and connected me to the Nashville music community through songwriter rounds, live performances, and collaborations with other local artists. I found my voice in the blend of pop and folk—honest lyrics, strong melodies, and emotional storytelling.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile at Vanderbilt, I explored the business world through internships in investment banking at TD Cowen and commercial real estate at Elmington Capital. I also founded a startup called Zol that connected college students with local businesses, and was selected as one of 60 fellows in the competitive Birthright Excel program in Tel Aviv, where I worked on AI product development for a tech startup.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond music and business, my journey has been shaped by personal challenges that taught me resilience and empathy. I overcame OCD and spent my sophomore year of high school in a wheelchair—experiences that changed how I see the world and deepened my desire to help others. They also made me incredibly organized, focused, and determined to use both my creativity and drive to create something meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow based in Nashville, I’m fully committed to building my career as an artist and storyteller. Whether I’m writing a song, building a team, or shaping the vision behind a project, I’m focused on making music that feels real—and on creating something that lasts.\u003c/p\u003e","teachingVideoPlaybackId":"DilCn008028HW1F6y3Ar01ZSc8Ggl502900UmfWNEKY5NOlE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human and Organizational Development","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ac6a54b4-edc0-49e0-ad28-ecfa8648f323\"}"},{"__ref":"DeepDives:{\"uuid\":\"ebec78d0-8253-4b74-af4e-16bbea5049a2\"}"},{"__ref":"DeepDives:{\"uuid\":\"b642a312-0c57-4e49-b36e-3ae9e21decf6\"}"},{"__ref":"DeepDives:{\"uuid\":\"44414a76-6240-4d8f-ba7a-361029b8dd58\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/61042070-763d-4a2b-9223-432345e61189/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6a1b7d7e-d989-490c-985a-e37687d9894b\"}"},{"__ref":"Education:{\"uuid\":\"0ea9ca2d-83f9-4333-9736-c7b6540afb20\"}"}],"hiredAt":"2025-04-16T23:32:17.531Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","History","Reading","Economics","K-6 Storybook","Creative Writing","Music","Business / Entrepreneurship","Finance / Investing","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"justin-koolik\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d128195d-b7aa-4740-8c9f-24125ec18fe2\"}"}}},"_sentryTraceData":"be74354d9de246778acc894deb911ced-8fdce63d545a4570-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=be74354d9de246778acc894deb911ced,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"justin-koolik"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Dat
