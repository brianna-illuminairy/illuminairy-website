xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"db3180af-5801-4ada-8da7-0ef061dfff84\"}":{"__typename":"Favorites","uuid":"db3180af-5801-4ada-8da7-0ef061dfff84","photoUrl":"https://ucarecdn.com/7082a961-b1e1-4f5e-b504-6f8e60a7ca75/","title":"Stephen Curry","type":"ATHLETE"},"Favorites:{\"uuid\":\"37d5b30e-d464-4b87-99e6-232f60de6886\"}":{"__typename":"Favorites","uuid":"37d5b30e-d464-4b87-99e6-232f60de6886","photoUrl":"https://ucarecdn.com/c7b5a90f-6747-4cb9-a220-f2e347588bbf/","title":"Basketball","type":"SPORT"},"Favorites:{\"uuid\":\"e5248fdf-333c-429c-a17f-c07fdbc6e1a3\"}":{"__typename":"Favorites","uuid":"e5248fdf-333c-429c-a17f-c07fdbc6e1a3","photoUrl":"https://ucarecdn.com/91727086-d019-4be5-8b40-7453ea159a4a/","title":"Counting Stars","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"264f40e6-b023-489a-bfe9-7da3f8f089bf\"}":{"__typename":"DeepDives","uuid":"264f40e6-b023-489a-bfe9-7da3f8f089bf","content":"\u003cp\u003eTo my high school self, I'd tell him to keep exploring what he finds interesting and to ignore the feeling of not doing enough. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"7bb57eda-48c3-49b0-a4b9-b7ead1b79884\"}":{"__typename":"DeepDives","uuid":"7bb57eda-48c3-49b0-a4b9-b7ead1b79884","content":"\u003cp\u003eI would love to be a software engineer in a position where my code has impact on users all over the globe.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"bc65d6ed-6f2e-421a-b046-1d835d21af53\"}":{"__typename":"DeepDives","uuid":"bc65d6ed-6f2e-421a-b046-1d835d21af53","content":"\u003cp\u003eI love playing guitar, watching basketball, playing chess, and indulging in horror movies/games.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"eb891403-b792-4578-bdbf-1b82607a4eb8\"}":{"__typename":"DeepDives","uuid":"eb891403-b792-4578-bdbf-1b82607a4eb8","content":"\u003cp\u003eIf I wasn't busy grinding Fortnite or finding new shows to watch, I'd sit down at my desk and try to get better at a topic I found interesting whether that be AI, chess, or money management.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"5822e5eb-6fdc-4bf6-b0a8-3ac911ca7b92\"}":{"__typename":"School","uuid":"5822e5eb-6fdc-4bf6-b0a8-3ac911ca7b92","name":"North Star Academy Charter School Of Newark","city":"Newark","type":"HIGH","state":"New Jersey","country":"United States","zip":"07102"},"Education:{\"uuid\":\"6146768e-e0c5-4a71-89b5-cf8f9badb665\"}":{"__typename":"Education","uuid":"6146768e-e0c5-4a71-89b5-cf8f9badb665","school":{"__ref":"School:{\"uuid\":\"5822e5eb-6fdc-4bf6-b0a8-3ac911ca7b92\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"57b937d0-e2d7-4bed-9bf0-51d534bd1808\"}":{"__typename":"Education","uuid":"57b937d0-e2d7-4bed-9bf0-51d534bd1808","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2d19dd93-8038-4ac4-9889-7bf6c7b640eb\"}":{"__typename":"MentorPublicProfile","uuid":"2d19dd93-8038-4ac4-9889-7bf6c7b640eb","displayName":"Adetomiwa A.","slug":"adetomiwa-adeyemi","biography":"\u003cp\u003eHi! I’m Tomiwa. I study Computer Science at Stanford University with a concentration on AI. I consider myself a life long learner, always keeping tabs of what new topic I want to learn more about. Whether its practicing guitar riffs for a new song, learning new openings for chess, or trying out a new deck in Clash Royale, I love turning curiosity into small daily reps. Those tiny, consistent reps are what I bring to mentoring too: we set a clear goal, break it into doable steps, and end with a win you can point to and say, “I built that” or “I finally get this.”\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMusic is a big part of who I am. I play gospel and R\u0026amp;B guitar with my campus band and at church. I’m the type to keep a guitar within arm’s reach. Music taught me patience, listening, and the value of feel which are all skills that transfer directly to learning anything new. Being dedicated to getting better at guitar gives me a mindset that pushes me when I struggle with a problem set, debugging my code, or any other problem I face in my life. If a student loves music, sports, or games, I try to meet them there and build from what already feels familiar.\u003c/p\u003e\u003cp\u003eI care about helping students turn “I’m not sure” into “I got this.” That often means slowing down just enough to make each step clear, celebrating small wins, and creating a calm space where questions are welcome. I’m big on making progress visible by checking off mini-milestones, keeping short notes from each session, and giving friendly accountability so skills stick. I’ve tutored peers in math/CS and worked with younger students who are brand-new to coding or rebuilding confidence in math. The common thread is curiosity and steady practice.\u003c/p\u003e\u003cp\u003eAcademically, I enjoy the mix of problem-solving and building useful things. Professionally, I’ve worked with CareerVillage (a nonprofit) where I improved onboarding by integrating the Google Places API for better school data and helped build a resume tool used by 100+ students. Those experiences reminded me that technology is most meaningful when it’s in service of people and that clear communication matters as much as clean code.\u003c/p\u003e\u003cp\u003eWhat does a session with me feel like? Approachable and hands-on. We’ll start with what you’re working on or what you’re curious about, make a plan for the hour, and leave with something concrete: a solved set of problems, a cleaner study routine, or a tiny project you can show your family. I can support math (through linear algebra and multivariable calculus), intro CS (Python/JavaScript), beginner AI concepts, and study skills. But more than any specific subject, I’m here to help students enjoy learning again. If you bring curiosity, I’ll bring structure, patience, and a little guitar-player optimism. Let’s turn small wins into big momentum.\u003c/p\u003e","teachingVideoPlaybackId":"cGYno4VIcuuLMkqmnXMdAkT7XCNp01Mu9ymAguEh7MN00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"db3180af-5801-4ada-8da7-0ef061dfff84\"}"},{"__ref":"Favorites:{\"uuid\":\"37d5b30e-d464-4
