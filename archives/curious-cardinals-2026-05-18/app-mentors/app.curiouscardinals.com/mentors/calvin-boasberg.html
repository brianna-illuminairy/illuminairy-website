xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"579e2ee8-390f-47c7-87a2-b210366f4598\"}":{"__typename":"Favorites","uuid":"579e2ee8-390f-47c7-87a2-b210366f4598","photoUrl":"https://ucarecdn.com/2e9d38fa-636d-49f7-95b3-0c3cdc4887dc/","title":"Smashing Pumpkings","type":"ARTIST"},"Favorites:{\"uuid\":\"058f1f18-c8c0-4b11-9d03-2ad17ae37e68\"}":{"__typename":"Favorites","uuid":"058f1f18-c8c0-4b11-9d03-2ad17ae37e68","photoUrl":"https://ucarecdn.com/e9a12964-b3ca-4fec-8287-6e29663c4719/","title":"Catch 22","type":"BOOK"},"Favorites:{\"uuid\":\"2b70a143-398b-44bf-a10a-9f0e13e13d16\"}":{"__typename":"Favorites","uuid":"2b70a143-398b-44bf-a10a-9f0e13e13d16","photoUrl":"https://ucarecdn.com/4f18664d-b2e0-433a-8114-31d34fa10607/","title":"Julian Edelman ","type":"ATHLETE"},"Favorites:{\"uuid\":\"85550811-afd1-4afe-a172-a593bd5ea961\"}":{"__typename":"Favorites","uuid":"85550811-afd1-4afe-a172-a593bd5ea961","photoUrl":"https://ucarecdn.com/4f18664d-b2e0-433a-8114-31d34fa10607/","title":"Julian Edelman ","type":"ATHLETE"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"db61fdae-6774-4c2d-b958-343ee0600034\"}":{"__typename":"DeepDives","uuid":"db61fdae-6774-4c2d-b958-343ee0600034","content":"\u003cp\u003eThere are a lot of adventures on my bucket list, but the top three are climb Mount Kilimanjaro, skydiving, and watch the Patriots win the Superbowl(the only one that wont happen soon)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2aeba6af-d614-4f3c-b87b-48e79e9059d6\"}":{"__typename":"DeepDives","uuid":"2aeba6af-d614-4f3c-b87b-48e79e9059d6","content":"\u003cp\u003eMy advice to myself is do not let your ADHD and dyslexia define you. When I was diagnosed in the seventh grade, I thought I was cursed. I am not saying it was easy, especially in foreign languages, but through years of tutoring and a lot of effort, I have come to manage it. And now, I see it as a gift because my brain operates differently than everyone around me, allowing me to come to different solutions and ideas. But the best part about having ADHD is that when someone is really boring, you can not listen and blame it on the ADHD. It was like 90% of the time.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"927b1fe9-ce25-48a9-affc-447355076dee\"}":{"__typename":"DeepDives","uuid":"927b1fe9-ce25-48a9-affc-447355076dee","content":"\u003cp\u003eHonestly, it is to use economics to help people. I can't think of a more fulfilling life than to use the field I love to have a tangible impact on people's lives. This goal allows me to have lots of dream jobs like being an analyst for the IMF, working for Singapore's Sovereign Wealth Fund, working for USAID, or doing research for the Harvard Growth Lab. Sadly, these all require me to have a PhD in economics, so hopefully, the world will not solve all of its problems in the next 10 years. That would be a real bummer for me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"5a23978b-2c7e-4279-a37d-a8de8f9ad95f\"}":{"__typename":"DeepDives","uuid":"5a23978b-2c7e-4279-a37d-a8de8f9ad95f","content":null,"videoPlaybackId":"XHGYWZ2YkM0101pJyMXVcUg6jS9waQIghJIt02ba6mgJYw","question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"101fe0d6-2516-4d89-94b0-67c175cece26\"}":{"__typename":"School","uuid":"101fe0d6-2516-4d89-94b0-67c175cece26","name":"Singapore American School","city":"Singapore","type":"HIGH","state":"Singapore","country":"Singapore","zip":"738547"},"Education:{\"uuid\":\"6793422e-b50d-4e50-ab3e-0a686a53f467\"}":{"__typename":"Education","uuid":"6793422e-b50d-4e50-ab3e-0a686a53f467","school":{"__ref":"School:{\"uuid\":\"101fe0d6-2516-4d89-94b0-67c175cece26\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fb9cd652-9df1-4dec-b081-ad0eb4d67623\"}":{"__typename":"School","uuid":"fb9cd652-9df1-4dec-b081-ad0eb4d67623","name":"Boston College","city":"Chestnut Hill","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02467"},"Education:{\"uuid\":\"f598dc3b-3415-4f0f-95a1-6c3727f01c79\"}":{"__typename":"Education","uuid":"f598dc3b-3415-4f0f-95a1-6c3727f01c79","school":{"__ref":"School:{\"uuid\":\"fb9cd652-9df1-4dec-b081-ad0eb4d67623\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics \u0026 Computer Science ","degree":null},"Testimonial:7e18074e-41c1-4572-8c1a-22391344592c":{"__typename":"Testimonial","id":"7e18074e-41c1-4572-8c1a-22391344592c","text":"Calvin has been an incredible mentor to our son, Mason. He helped Mason set the ambitious goal of turning his passion for writing scary stories into a published 10-story anthology. Throughout the year, Calvin guided him through key aspects of writing—character development, story structure, and grammar—while keeping him excited and engaged every step of the way.\n\nLast week, Mason published his anthology on Amazon. He has learned so much about the craft of writing, but more importantly, Calvin has shown him that he can achieve big goals when he sets his mind to them. This is the proudest Mason has ever been, and we have Calvin to thank for that.","date":"2025-05-27 16:14:33.931+00","rating":5,"endorser":{"__typename":"Endorser","name":"Amber Tennant","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"05aa1ba9-d998-4e53-90e5-cd02cd36b390\"}":{"__typename":"MentorPublicProfile","uuid":"05aa1ba9-d998-4e53-90e5-cd02cd36b390","displayName":"Calvin B.","slug":"calvin-boasberg","biography":"\u003cp\u003eHi, y'all. My name is Calvin Boasberg. I grew up in Boulder, Colorado, for the first 14 years of my life. Like a good Coloradan, I spent my summers camping and my winters skiing in the Rocky Mountains. However, when I was 14, my family and I moved to Singapore, where I would go to Singapore American School. Ever since I got off the plane, I have loved Singapore with its world-class street food, melting pot of cultures, and its role as a launch pad to travel to the rest of Southeast Asia. I grew up with ADHD, dyslexia, and dysgraphia, but that did not stop my love of learning. I am majoring in economics because I have wanted to understand the systems that govern the world since I was a kid, and economics is one explanation. When I published a student research paper on COVID-19's effect on the perception of automation in the food processing industry, I was able to apply economic principles and research to assist communities affected by the pandemic. Further, I won the Excellence Award (given to the top student in the class) in AP Economics and AP Research. My other two academic loves are Philosophy and Computer Science. I love philosophy and computer science because I love solving puzzles, no matter the size. My most impactful learning experience was interning for Colorado Senator Michael Bennet this summer. For my internship, I would answer constituent inquiries, give tours of the US Capitol, check in advocacy groups for meetings, write memos on Congressional hearings, and write a co-sponsor request for the Senator to sign. I don't only love learning and problem-solving, but I also love teaching either through my role as a tutor in the Social Studies Honor Society and English Honor Society or as a Senior Rugby Coach at Centaur's Sport Group. Outside of academics, my favorite pastime has been sports ever since I was a kid, especially rugby. I have been playing for the last five years and coaching for the last three years. I have loved every second of it because of the community I have made, the fun I have on the pitch, and my love of competition. My proudest accomplishment was being named the Forwards Captain and making the All-IASAS team my senior year. If you want to talk about sports, I'm here for your hottest take. I am a Patriot fan, if that is a deal breaker. If I am not playing rugby or in the classroom, I'm most likely watching a movie, with my favorites being \u003cem\u003eThere Will Be Blood,\u003c/em\u003e \u003cem\u003eThor: Ragnarok,\u003c/em\u003e and \u003cem\u003eKnives Out.\u003c/em\u003e My love of movies has carried over to my love of creative writing, leading to me publishing a short story called \u003cem\u003eChrysanthemum\u003c/em\u003e in an anthology during my senior year. I look forward to working with y'all.\u003c/p\u003e","teachingVideoPlaybackId":"DJ801U8F9eXJE6000200yOX6cLgUfDcoLJs3JGJM1qI6oVc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"579e2ee8-390f-47c7-87a2-b210366f4598\"}"},{"__ref":"Favorites:{\"uuid\":\"058f1f18-c8c0-4b11-9d03-2ad17ae37e68\"}"},{"__ref":"Favorites:{\"uuid\":\"2b70a143-398b-44bf-a10a-9f0e13e13d16\"}"},{"__ref":"Favorites:{\"uuid\":\"85550811
