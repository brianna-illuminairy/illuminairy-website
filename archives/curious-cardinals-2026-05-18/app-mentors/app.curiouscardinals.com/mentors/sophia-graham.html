xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ea2d52ed-7730-42c5-b349-2503cedc1fb0\"}":{"__typename":"Favorites","uuid":"ea2d52ed-7730-42c5-b349-2503cedc1fb0","photoUrl":"https://ucarecdn.com/bb6cbc9a-32d0-4ada-9d0a-17c5fa0596a7/","title":"Detroit Tigers","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"f9bd64f9-50ac-4d43-97d3-a10278cf5d8c\"}":{"__typename":"Favorites","uuid":"f9bd64f9-50ac-4d43-97d3-a10278cf5d8c","photoUrl":"https://ucarecdn.com/a1f45b09-b09e-4668-9abc-e262b5edbeb6/","title":"Lady Gaga","type":"ARTIST"},"Favorites:{\"uuid\":\"d70a9932-c4ac-44fc-a8e2-b701edafad3b\"}":{"__typename":"Favorites","uuid":"d70a9932-c4ac-44fc-a8e2-b701edafad3b","photoUrl":"https://ucarecdn.com/6baeeddb-c5d0-4418-bb44-dd1d7ea72e0e/","title":"One Hundred Years of Solitude","type":"BOOK"},"CausesSupported:{\"uuid\":\"667a63ff-20d3-40cd-9afe-1c7ef414b662\"}":{"__typename":"CausesSupported","uuid":"667a63ff-20d3-40cd-9afe-1c7ef414b662","name":"Motor City Mitten Mission","description":"\u003cp\u003eVolunteer w/ Detroit-based charity focused on  the city's homeless population\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"eaf0dcbd-5f9f-4ac6-b42c-ea370c1a9afb\"}":{"__typename":"CausesSupported","uuid":"eaf0dcbd-5f9f-4ac6-b42c-ea370c1a9afb","name":"FOCUS on New Haven ","description":"\u003cp\u003eYale org that introduces new students to volunteering and New Haven NGOs\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5f480f3b-b246-4ba4-9171-08f39427288f\"}":{"__typename":"DeepDives","uuid":"5f480f3b-b246-4ba4-9171-08f39427288f","content":"\u003cp\u003eNever be afraid to ask questions. Because you are a student, many older people with experience in the topics that interest you would LOVE to mentor you, chat with you, and teach you things! So much insight can be gleaned from simple conversations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"1fc9d790-e09b-4aaf-ba3e-4149a4983cdd\"}":{"__typename":"DeepDives","uuid":"1fc9d790-e09b-4aaf-ba3e-4149a4983cdd","content":"\u003cp\u003eWorking at a thrift store in my hometown, practicing oboe, and biking outdoors! My sophomore-senior years were impacted by COVID, but working a simple part-time job in an area that interested me (fashion) got me out of the house and out of my shell. Interacting with 100s of customers daily, running a cash register, and pricing items helped me become a more responsible human!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2a6ea25d-d9b4-4215-a6b4-cc2e07c82560\"}":{"__typename":"DeepDives","uuid":"2a6ea25d-d9b4-4215-a6b4-cc2e07c82560","content":"\u003cp\u003eGrowing up, I was always incredibly interested in U.S. politics and policymaking. However, when reading the news, I often felt hindered by my lack of knowledge of economic principles, financial markets, and public finance. Therefore, at Yale, I've focused on classes providing me with knowledge about macroeconomics, consumer sentiment, investing, financial history, and international relations. This knowledge has enable me to conduct economic research on fiscal policy through the Yale Budget Lab, as well as learn to invest through internships at large asset managers!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3477df44-f54a-4629-8a0a-9250a3428314\"}":{"__typename":"DeepDives","uuid":"3477df44-f54a-4629-8a0a-9250a3428314","content":"\u003cp\u003eI grew up in a single-parent household, and nobody in my family applied to college right out of high school, went out of state for school, or studied for the ACT beforehand! Therefore, I know what it's like to \"teach yourself everything\" about a process - and believe me, things become much easier when you have someone helping you out.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e Whether you're seeking college application help, academic guidance, financial literacy, or executive function skills, I'm happy to help!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"5f966429-d121-403b-a83a-6ba5d4458bbe\"}":{"__typename":"School","uuid":"5f966429-d121-403b-a83a-6ba5d4458bbe","name":"Grosse Pointe North High School","city":"Grosse Pointe Woods","type":"HIGH","state":"Michigan","country":"United States","zip":"48236"},"Education:{\"uuid\":\"e27cda44-1551-4ee3-85ae-fcd0b4194a2e\"}":{"__typename":"Education","uuid":"e27cda44-1551-4ee3-85ae-fcd0b4194a2e","school":{"__ref":"School:{\"uuid\":\"5f966429-d121-403b-a83a-6ba5d4458bbe\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"bc6c4e0a-26d1-43c3-9c29-93e6b77b48cc\"}":{"__typename":"Education","uuid":"bc6c4e0a-26d1-43c3-9c29-93e6b77b48cc","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"cdcf2dd8-9ac0-4bcf-b8f0-c50ff41bcfd6\"}":{"__typename":"MentorPublicProfile","uuid":"cdcf2dd8-9ac0-4bcf-b8f0-c50ff41bcfd6","displayName":"Sophia G.","slug":"sophia-graham","biography":"\u003cp\u003eHi!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Sophia, and I’m a senior at Yale studying economics. I was born and raised in the Detroit, Michigan area, which means I have very strong opinions on pizza, football, and what to call a carbonated fountain drink (it’s pop, not soda)! Growing up in a single-parent household, I often had to guide myself through many processes such as applying to college, studying for standardized tests, finding internships, and building a strong extracurricular resume. It wasn’t until college that I discovered the power of mentorship and learned to accept help – so I’m so excited to be the “person I wish I had when I was younger” for you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was heavily involved with dance, community service, music, and part-time retail work. I served as the captain of my school’s varsity dance team, which taught me discipline and leadership skills. I also was the vice president of our student association, where I coordinated several community outreach projects and won an “unsung hero” award at the Michigan state conference for my behind-the-scenes work. I played principal oboe in Michigan’s all-state orchestra, participated in the Detroit Symphony Youth Orchestra, and was actively involved in school bands, orchestras, and pit orchestras. I also worked part-time at a thrift store, which was immensely helpful in developing my people skills and my ability to yap. :)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUpon arriving at Yale, I chose to study economics because, quite simply, I wanted to understand \u003cem\u003eeverything \u003c/em\u003emore — from geopolitical events, to fiscal policy, to the study of inequality, development, trade, urban centers, and so many more facets of our world. As an active consumer of news, I often felt flummoxed by financial and economic jargon, and felt as if an understanding of these topics could lead me to become a more informed citizen. Additionally, I wanted to develop the personal finance skills necessary to succeed in my adult life! Now, my interest in macroeconomic ideas, developed through my coursework at Yale,\u0026nbsp; has led me to positions at macroeconomic policy research labs such as the Yale Budget Lab. Additionally, participating in the Girls who Invest Summer Program at the Wharton School has led me to various research positions at asset management firms such as JP Morgan Asset Management. My education has provided me with skills in writing, reading, history, economics, finance, self-discipline, business, and research, and I would absolutely love to share my knowledge with a younger student.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, I can be found playing principal oboe in the Yale Concert Band and teaching/choreographing tap dance pieces with Taps at Yale. Additionally, as the Chief Investment Officer of Yale’s all-female finance club, Smart Woman Securities, I’m also passionate about and teaching underclassmen portfolio management principles. I also love running, interior design, musical theater, keeping up with Trader Joe’s newest snack releases!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSo excited to work with you and help you discover your passions while building skills for success!\u003c/p\u003e","teachingVideoPlaybackId":"L9xDEy82Ea7GfOc7SWkqgw02zyYjkIl27jf302Xp4apRQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm proud of having served as the president of Taps, Yale's first and only tap dancing club! I am highly passionate about dance, but serving in a leadership role in which I was responsible for choreographing dances challenged me in ways I never thought possible. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eTeaching a large group forced me to reevaluate how I taught and shared information, making me a more effective interpersonal communicator in my day to day life.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ea2d52ed-7730-42c5-b349-2503cedc1fb0\"}"},{"__ref":"Favorites:{\"uuid\":\"f9bd64f9-50ac-4d43-97d3-a10278cf5d8c\"}"},{"__ref":"Favorites:{\"uuid\":\"d70a9932-c4ac-44fc-a8e2-b701edafad3b\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"667a63ff-20d3-40cd-9afe-1c7ef414b662\"}"},{"__ref":"CausesSupported:{\"uuid\":\"eaf0dcbd-5f9f-4ac6-b42c-ea370c1a9afb\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5f480f3b-b246-4ba4-9171-08f39427288f\"}"},{"__ref":"DeepDives:{\"uuid\":\"1fc9d790-e09b-4aaf-ba3e-4149a4983cdd\"}"},{"__ref":"DeepDives:{\"uuid\":\"2a6ea25d-d9b4-4215-a6b4-cc2e07c82560\"}"},{"__ref":"DeepDives:{\"uuid\":\"3477df44-f54a-4629-8a0a-9250a3428314\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c2043abb-ea1c-4a92-a454-3916972d4e32/-/preview/-/format/jpg/","https://ucarecdn.com/3db215ce-184c-4280-a7c0-53928da52466/-/preview/-/format/jpg/","https://ucarecdn.com/bd22afaf-81cd-45e7-817d-5c832a4a716d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e27cda44-1551-4ee3-85ae-fcd0b4194a2e\"}"},{"__ref":"Education:{\"uuid\":\"bc6c4e0a-26d1-43c3-9c29-93e6b77b48cc\"}"}],"hiredAt":"2026-01-21T15:47:50.173Z","topics":["Writing","H
