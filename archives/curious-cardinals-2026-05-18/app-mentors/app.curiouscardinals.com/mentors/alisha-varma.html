xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"56247c36-1fe8-4449-b7a1-fa3dd6638d6b\"}":{"__typename":"Favorites","uuid":"56247c36-1fe8-4449-b7a1-fa3dd6638d6b","photoUrl":"https://ucarecdn.com/2df4de42-2f2e-4568-af28-7efd3de5aad2/","title":"Catan","type":"GAME"},"Favorites:{\"uuid\":\"17296810-701f-4d73-9c9c-66c39ec4d504\"}":{"__typename":"Favorites","uuid":"17296810-701f-4d73-9c9c-66c39ec4d504","photoUrl":"https://ucarecdn.com/e9bc64f6-fe15-4e0d-ac27-052e6c2c32dc/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"e8b41136-f401-4073-b1a5-6aa85b7e59a3\"}":{"__typename":"Favorites","uuid":"e8b41136-f401-4073-b1a5-6aa85b7e59a3","photoUrl":"https://ucarecdn.com/f786fd48-da86-408d-b289-972078e2a0d8/","title":"Harry Potter series by J.K. Rowling","type":"BOOK"},"CausesSupported:{\"uuid\":\"d63bc141-6767-4077-b690-116bc8856df6\"}":{"__typename":"CausesSupported","uuid":"d63bc141-6767-4077-b690-116bc8856df6","name":"Education Access and Equity","description":"\u003cp\u003eI support mentoring and tutoring to help students access quality learning.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"51b48eee-b09b-4bf4-b62a-ac4badc0dbcd\"}":{"__typename":"CausesSupported","uuid":"51b48eee-b09b-4bf4-b62a-ac4badc0dbcd","name":"Females in Technology","description":"\u003cp\u003eI mentor and support young women to build confidence and skills in tech.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7f79e27b-3b0f-41f1-903e-2ea6b4a39430\"}":{"__typename":"DeepDives","uuid":"7f79e27b-3b0f-41f1-903e-2ea6b4a39430","content":"\u003cp\u003eI would tell my middle or high school self that it is okay not to have everything figured out yet. Feeling unsure does not mean you are behind or incapable. It simply means you are learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would remind myself that asking questions is a strength, not a weakness. Some of the biggest growth moments come from being curious, speaking up, and allowing yourself to not know the answer right away. Progress matters more than perfection.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would also say not to be afraid of challenges or mistakes. The moments that felt uncomfortable or difficult at the time ended up teaching me the most. Struggling does not mean you are failing. It means you are stretching yourself and building skills that will last far beyond any single class or grade.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I would encourage my younger self to trust their interests and passions, even if they feel different from others around them. Exploring what excites you, whether it is science, technology, creativity, or something else entirely, can open doors you never expected. Confidence grows when you stay curious, stay patient with yourself, and keep showing up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f8ac88e0-c4cc-4bf2-a570-35a025ab1635\"}":{"__typename":"DeepDives","uuid":"f8ac88e0-c4cc-4bf2-a570-35a025ab1635","content":"\u003cp\u003eMentorship matters to me because having the right guidance at the right time can change how someone sees themselves and their potential. A mentor does more than teach a subject. They listen, encourage, and help you believe that growth is possible, even when things feel challenging or uncertain.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my own journey, mentors have played a huge role in shaping my confidence, curiosity, and goals. They helped me navigate difficult classes, explore interests I was not sure about yet, and see opportunities I would not have recognized on my own. Having someone who believed in me made it easier to take risks, ask questions, and keep going when things felt overwhelming.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI care deeply about paying that forward. I love helping students feel supported and understood, especially during moments when they might doubt themselves. Mentorship creates a space where students can explore ideas without fear of judgment, build skills at their own pace, and develop confidence that carries into every part of their lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo me, mentorship is about partnership and trust. It is about meeting students where they are, celebrating progress, and reminding them that they are capable of more than they may realize. Being able to support someone in their learning and growth is incredibly meaningful to me, and it is something I value deeply.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"00744fd0-a46f-4bd1-846a-f87d9ebb5fa0\"}":{"__typename":"DeepDives","uuid":"00744fd0-a46f-4bd1-846a-f87d9ebb5fa0","content":"\u003cp\u003eMy greatest source of motivation comes from growth and impact. I am motivated by seeing progress over time, whether it is mastering a difficult concept, building something meaningful, or helping someone gain confidence in their abilities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI find a lot of motivation in challenges that push me to learn and improve. When something feels difficult at first, it often signals an opportunity to grow. I enjoy setting goals, working steadily toward them, and reflecting on how far I have come. That sense of progress keeps me curious and driven.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also deeply motivated by helping others succeed. Seeing a student understand something new, feel proud of their work, or gain confidence in themselves is incredibly rewarding. Knowing that my time and effort can positively impact someone else gives purpose to the work I do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I am motivated by the idea that learning and growth are ongoing processes. Each step forward, no matter how small, contributes to something bigger. That belief keeps me focused, energized, and excited about both personal development and mentorship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"685ec1d8-072e-4d25-a859-6b150c4cca08\"}":{"__typename":"DeepDives","uuid":"685ec1d8-072e-4d25-a859-6b150c4cca08","content":"\u003cp\u003eOne passion project I am especially proud of is a telemedicine monitoring system I worked on that focused on medication safety and accessibility. The goal of the project was to help individuals and their families track medication usage more reliably and prevent both overdose and underdose situations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe system uses small sensors placed inside a person’s medicine cabinet. These sensors measure weight changes as medication is removed, allowing the system to detect when doses are taken. That data is then sent to a mobile application that I built, where it is logged and monitored in real time. The app provides clear feedback on whether medication is being taken on schedule and flags potential issues when doses are missed or removed too frequently.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the most important parts of the project was its alert system. If medication was not removed on time or if an unsafe pattern was detected, the app could notify the user or a designated family member. This was designed to support individuals who manage complex medication schedules, as well as caregivers who want peace of mind without being intrusive.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat made this project especially meaningful to me was seeing how technology could directly improve safety and quality of life. It combined hardware, software, and human centered design, while solving a real problem faced by many families. Working on this project reinforced my interest in building technology that is not only technically interesting, but also genuinely helpful and impactful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"fbc6f212-9210-4d86-861a-c0024b95e01e\"}":{"__typename":"School","uuid":"fbc6f212-9210-4d86-861a-c0024b95e01e","name":"McNair Academic High School","city":"Jersey City","type":"HIGH","state":"New Jersey","country":"United States","zip":"07302"},"Education:{\"uuid\":\"89a49d46-adf0-4f9a-a498-1cc2a03985ca\"}":{"__typename":"Education","uuid":"89a49d46-adf0-4f9a-a498-1cc2a03985ca","school":{"__ref":"School:{\"uuid\":\"fbc6f212-9210-4d86-861a-c0024b95e01e\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"f3234b77-088a-4a7a-845a-bc4cdf229563\"}":{"__typename":"Education","uuid":"f3234b77-088a-4a7a-845a-bc4cdf229563","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"7757b1f6-0bc2-49c2-a28b-1cc0971f3fe5\"}":{"__typename":"MentorPublicProfile","uuid":"7757b1f6-0bc2-49c2-a28b-1cc0971f3fe5","displayName":"Alisha V.","slug":"alisha-varma","biography":"\u003cp\u003eHi! My name is Alisha, and I am a Computer Science student at Cornell University with a deep passion for learning, teaching, and helping students discover what excites them. I have always believed that curiosity, when supported by the right mentor, can turn into confidence, direction, and meaningful growth.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I study Computer Science with additional focus in artificial intelligence, data science, and information science. I am especially interested in how technology can be used to solve real world problems and create positive social impact. Through my coursework and projects, I have worked on topics ranging from machine learning and data analysis to software development and human centered design. I enjoy breaking down complex ideas into simple, understandable pieces, and I love helping others see that challenging subjects can be approachable and even fun.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I spend much of my time mentoring, building, and leading. I am actively involved in multiple student organizations where I take on leadership roles, mentor peers, and work on mission driven projects. I have helped lead teams that build technology for nonprofits, supported younger students interested in STEM, and organized initiatives that focus on access, equity, and education. Teaching and mentorship have been consistent parts of my life, whether through tutoring, teaching assistant roles, or community programs.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I have experience working in technology and engineering environments, which has given me insight into how academic skills translate into real world applications. I enjoy sharing not only subject knowledge, but also study strategies, problem solving approaches, and advice on setting goals and building confidence. I care deeply about helping students feel supported, heard, and capable of pursuing their interests, even if they are still figuring out what those interests are.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat I care about most is helping students feel empowered in their learning journey. I aim to be the kind of mentor I once needed, someone who listens, encourages curiosity, and helps students grow at their own pace. I believe learning is most meaningful when it is personal, engaging, and connected to a student’s interests. I am excited to work with students to explore ideas, build skills, and discover what they are capable of achieving.\u003c/p\u003e","teachingVideoPlaybackId":"OTWrasR21Km8GyLIILMW3LY1vWxGFH9YWrF01cOkSLuk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my greatest achievements is developing a telemedicine sensor system focused on improving medication safety. What started as an idea to solve a real world problem grew into a project that received recognition, testing, and continued development.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI built a system that uses sensors placed in a person’s medicine cabinet to detect weight changes as medication is removed. This data is sent to an application I developed, which tracks medication adherence and alerts users or family members when doses are missed or taken incorrectly. The goal was to help prevent both overdose and underdose situations, especially for individuals managing complex prescriptions or for families supporting loved ones remotely.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI presented this project at a Microsoft hackathon, where it won an award for its innovation and impact. That experience was incredibly validating and showed me that the idea had real potential beyond the classroom. After the hackathon, I tested the system to better understand how it could work in real life settings and refined both the hardware and software components.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat makes this achievement especially meaningful to me is that the work did not stop after the award. I am currently continuing to develop the project and working through the process of patenting the system. Knowing that something I built could one day be used to genuinely help people stay safe and supported is something I am very proud of, and it continues to motivate me to build technology with purpose.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"56247c36-1fe8-4449-b7a1-fa3dd6638d6b\"}"},{"__ref":"Favorites:{\"uuid\":\"17296810-701f-4d73-9c9c-66c39ec4d504\"}"},{"__ref":"Favorites:{\"uuid\":\"e8b41136-f401-4073-b1a5-6aa85b7e59a3\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"d63bc141-6767-4077-b690-116bc8856df6\"}"},{"__ref":"CausesSupported:{\"uuid\":\"51b48eee-b09b-4bf4-b62a-ac4badc0dbcd\"}"}],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7f79e27b-3b0f-41f1-903e-2ea6b4a39430\"}"},{"__ref":"DeepDives:{\"uuid\":\"f8ac88e0-c4cc-4bf2-a570-35a025ab1635\"}"},{"__ref":"DeepDives:{\"uuid\":\"00744fd0-a46f-4bd1-846a-f87d9ebb5fa0\"}"},{"__ref":"DeepDives:{\"uuid\":\"685ec1d8-072e-4d25-a859-6b150c4cca08\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/925cca7c-039a-469b-8068-653022634f0b/-/preview/-/format/jpg/","https://ucarecdn.com/3b691d5f-befe-4ae2-a1ff-4ec40188234e/-/preview/-/format/jpg/","https://ucarecdn.com/735b1bd0-3eb9-45ea-b628-a8fd46277426/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"89a49d46-adf0-4f9a-a498-1cc2a03985ca\"}"},{"__ref":"Education:{\"uuid\":\"f3234b77-088a-4a7a-845a-bc4cdf229563\"}"}],"hiredAt":"2026-01-06T03:56:17.609Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Writing","Academic Coaching","Executive Function","Reading","Computer Science","K-6 Storybook","Music","Fashion / Cosmetics","Visual Arts / Graphic Design","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Web Design","Game Design","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alisha-varma\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7757b1f6-0bc2-49c2-a28b-1cc0971f3fe5\"}"}}},"_sentryTraceData":"c840e279a3ae44efb785a585ed99cc6f-9d360d8f9c5ca9b0-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c840e279a3ae44efb785a585ed99cc6f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alisha-varma"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
