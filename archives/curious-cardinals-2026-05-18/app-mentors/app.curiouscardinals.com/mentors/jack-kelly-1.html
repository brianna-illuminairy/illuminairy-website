xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4f1a52aa-fd2e-4244-b1aa-b8cecee85b70\"}":{"__typename":"DeepDives","uuid":"4f1a52aa-fd2e-4244-b1aa-b8cecee85b70","content":"\u003cp\u003eI'll take this as an opportunity to add a full assortment of random life goals I have:\u003cbr\u003e1. Before I graduate from Harvard, it is a personal goal of mine to run the entirety of the Boston Marathon for charity!\u003cbr\u003e2. Someday I hope to have traveled to all 7 continents! I love to explore new places and it would be an incredible privilege to get the opportunity to travel to all 7 continents\u003cbr\u003e3. I currently speak 2 languages—English and Spanish—but I'd love to learn another language and become trilingual eventually!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"23d220ef-8f5f-4e79-a567-372ebe490d97\"}":{"__typename":"DeepDives","uuid":"23d220ef-8f5f-4e79-a567-372ebe490d97","content":"\u003cp\u003eIn high school, I spent my summers doing a combination of academic research and political campaigning! During the 2020 election, I volunteered for the Biden for President campaign and then in subsequent summers I worked on various other campaigns. When I wasn't campaigning, I tried to make small amounts of progress on my research about Congress and linguistic polarization!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"88a1a355-fcb2-4f91-bf59-0e507d1991e0\"}":{"__typename":"DeepDives","uuid":"88a1a355-fcb2-4f91-bf59-0e507d1991e0","content":"\u003cp\u003eI'm really interested in practicing civil rights law. The plan right now is to pursue a math PhD and a JD so I can focus on civil rights litigation, specifically with regards to how quantitive arguments can be made in protection of civil rights before the Supreme Court. But very generally I am interested in government, public policy, and the law, so I might change what exactly I want to focus on!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"5f99aad2-61c3-45cb-b85d-0c86b9402481\"}":{"__typename":"DeepDives","uuid":"5f99aad2-61c3-45cb-b85d-0c86b9402481","content":"\u003cp\u003eI am somebody who is personally very curious. I've been known to ask an abundance of questions wherever I am. It's this deep passion and respect that I have for teaching and transferring knowledge that makes me excited to mentor others and help others get their questions answered!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"52a1649a-7ff9-4e2c-83bf-2a69aff37c67\"}":{"__typename":"School","uuid":"52a1649a-7ff9-4e2c-83bf-2a69aff37c67","name":"Harrison High School","city":"Harrison","type":"HIGH","state":"New York","country":"United States","zip":"10528"},"Education:{\"uuid\":\"8be45807-a942-45c4-9125-e61ed806d4a8\"}":{"__typename":"Education","uuid":"8be45807-a942-45c4-9125-e61ed806d4a8","school":{"__ref":"School:{\"uuid\":\"52a1649a-7ff9-4e2c-83bf-2a69aff37c67\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"360b6fd6-a9e4-4627-a1e4-22986249a8bf\"}":{"__typename":"Education","uuid":"360b6fd6-a9e4-4627-a1e4-22986249a8bf","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Government and Math","degree":null},"MentorPublicProfile:{\"uuid\":\"2338e235-0e7c-4cdb-9f28-856df881590b\"}":{"__typename":"MentorPublicProfile","uuid":"2338e235-0e7c-4cdb-9f28-856df881590b","displayName":"Jack K.","slug":"jack-kelly-1","biography":"\u003cp\u003eJack is a sophomore at Harvard College studying government and math. He is originally from Westchester, New York, but during the school year he calls Pforzheimer House (Pfoho!) his home. This past summer, he spent his time working as a White House intern, and he's super excited to bring a combination of hands-on and academic experience to teaching all things related to government, law, and public policy. He's also somebody who really enjoys math and is excited to help others explore the intersection of mathematics and a variety of fields like political science, economics, and computer science. \u003cbr\u003e\u003cbr\u003eIn high school, Jack spent a number of years working on a research project using machine learning and data science to quantify linguistic polarization within the 116th Congress. This project allowed him to explore both of his passions together, government and math, and he even had the opportunity to present his research findings at the Regeneron International Science and Engineering Fair (ISEF). \u003cbr\u003e\u003cbr\u003eJack is somebody who is very curious and eager to learn, so while he particularly enjoys government and math, he's eager to help you all learn about a wide variety of topics. He's a deep appreciator of podcasts (you can frequently find him listening to The New York Times' The Daily podcast) and somebody who is often listening to music. In his free time, Jack loves to spend time with loved ones and go for walks around his neighborhood or along the Charles River. \u003c/p\u003e","teachingVideoPlaybackId":"twzYzJ7W44Zapoow4p2MRKFaGl02bVWke02GfytgcNKDM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Government and Math","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4f1a52aa-fd2e-4244-b1aa-b8cecee85b70\"}"},{"__ref":"DeepDives:{\"uuid\":\"23d220ef-8f5f-4e79-a567-372ebe490d97\"}"},{"__ref":"DeepDives:{\"uuid\":\"88a1a355-fcb2-4f91-bf59-0e507d1991e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"5f99aad2-61c3-45cb-b85d-0c86b9402481\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3339532d-eef8-4b26-9130-44da8781ddcf/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8be45807-a942-45c4-9125-e61ed806d4a8\"}"},{"__ref":"Education:{\"uuid\":\"360b6fd6-a9e4-4627-a1e4-22986249a8bf\"}"}],"hiredAt":"2023-07-31T22:30:32.058Z","topics":["World Cultures","Race \u0026 Ethnicity","Public Speaking","Journalism","Law / Government / Policy","Debate","Statistics","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","Geometry","Calculus","Algebra II","Algebra I","Writing"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility"
