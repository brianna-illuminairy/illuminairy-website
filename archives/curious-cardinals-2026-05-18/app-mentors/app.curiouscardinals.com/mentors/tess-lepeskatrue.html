xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2ed61366-bca1-40ba-80d7-f5539b511fc1\"}":{"__typename":"Favorites","uuid":"2ed61366-bca1-40ba-80d7-f5539b511fc1","photoUrl":"https://ucarecdn.com/ba7751bd-7243-4e71-b129-b35b4d4c6f53/","title":"Rewind - Charli xcx and Bladee","type":"SONG"},"Favorites:{\"uuid\":\"3036a604-5c47-4723-a74b-08636ab534f0\"}":{"__typename":"Favorites","uuid":"3036a604-5c47-4723-a74b-08636ab534f0","photoUrl":"https://ucarecdn.com/f6414254-c35c-47b2-b591-57a5764bff55/","title":"Balatro","type":"GAME"},"Favorites:{\"uuid\":\"32e8a8fd-2e85-437c-91a4-dea6f3745630\"}":{"__typename":"Favorites","uuid":"32e8a8fd-2e85-437c-91a4-dea6f3745630","photoUrl":"https://ucarecdn.com/4f5b0f05-1d3a-49a6-8538-f29d40845779/","title":"Vespertine - Bjork","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"944226fb-9908-4ee4-b017-127888b75b3b\"}":{"__typename":"DeepDives","uuid":"944226fb-9908-4ee4-b017-127888b75b3b","content":"\u003cp\u003eExplore! You don't need to know exactly what you want just yet, and the only way you will be able to figure it out is by embracing the things you love. In high school I was very focused on narrowing down and deciding what I wanted to pursue, but what I really did was keep myself from trying new things and discovering my passion. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ca86dda9-34a2-4a0c-95a1-f5d62acf9a8f\"}":{"__typename":"DeepDives","uuid":"ca86dda9-34a2-4a0c-95a1-f5d62acf9a8f","content":"\u003cp\u003eI truly would not be where I am today without the help of my older siblings, my TAs, and my friends. Life is hard and confusing and most things can only be learned through experience, but the next best thing is hearing someone else's experience and applying that to your own situation. Mentors make the future feel achievable and provide invaluable insight through real stories.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"36e85f67-d3cc-4190-83d3-850162493d4d\"}":{"__typename":"DeepDives","uuid":"36e85f67-d3cc-4190-83d3-850162493d4d","content":"\u003cp\u003eI love games! I'm a huge puzzle fan and I do the NYT Connections, Wordle, Spelling Bee, and Mini every day (I can only reliably complete the full crossword Monday - Wednesday...). I'm a big fan of video games too, especially Balatro, Minecraft, and Stardew Valley. Board games and party games are right there as well! I'm a huge fan of running charades, celebrities, One Night Werewolf, and Catan.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b386d5c6-f967-40d7-beac-fa2f174fb540\"}":{"__typename":"DeepDives","uuid":"b386d5c6-f967-40d7-beac-fa2f174fb540","content":"\u003cp\u003eI love to watch all kinds of movies (big fan of horror, psychological thrillers, dramas, comedies, indie films) and spend as much time as possible outside. I'm not the strongest swimmer but I absolutely love the water. Finally, I will take any and every opportunity to dance. Whether that be alone in my room, with my friends or at concerts, I always dance my heart out (my friends can attest).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3c823eb3-44d9-4706-abf0-1ae81403d6c4\"}":{"__typename":"School","uuid":"3c823eb3-44d9-4706-abf0-1ae81403d6c4","name":"Boston Latin School (BLS)","city":"Boston","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02115"},"Education:{\"uuid\":\"6b443f27-3656-4705-92de-bc64c57cdc5c\"}":{"__typename":"Education","uuid":"6b443f27-3656-4705-92de-bc64c57cdc5c","school":{"__ref":"School:{\"uuid\":\"3c823eb3-44d9-4706-abf0-1ae81403d6c4\"}"},"startYear":"2016","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d0b1fa77-da0f-4488-b92b-4dcb04d0ec5e\"}":{"__typename":"School","uuid":"d0b1fa77-da0f-4488-b92b-4dcb04d0ec5e","name":"Wesleyan University","city":"Middletown","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06459"},"Education:{\"uuid\":\"c825f635-e983-4473-b0cb-ebe7b55d3e11\"}":{"__typename":"Education","uuid":"c825f635-e983-4473-b0cb-ebe7b55d3e11","school":{"__ref":"School:{\"uuid\":\"d0b1fa77-da0f-4488-b92b-4dcb04d0ec5e\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"9f1f4172-b546-4788-935b-aa81af96c9ee\"}":{"__typename":"MentorPublicProfile","uuid":"9f1f4172-b546-4788-935b-aa81af96c9ee","displayName":"Tess L.","slug":"tess-lepeskatrue","biography":"\u003cp\u003eHi! I'm Tess Lepeska-True, and I'm a student at Wesleyan University pursuing a Bachelor's degree in Computer Science with a minor in Acoustic and Sound Engineering. I’m from Boston, MA and I love movies, music, ice cream, and dancing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always been an avid puzzler and problem solver, enjoying each and every one of my math and computer science classes throughout high school and college. Last summer I did research with one of my professors and implemented a mathematical model into a proof assistant, a type of programming language built to help mathematicians write proofs with sound logic. This semester, I have also been working with a different professor to build a neural network that can solve the Traveling Salesperson Problem, a common optimization problem, and comparing its problem solving abilities on different types of graphs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSimultaneously, being involved in school orchestras since 1st grade, I have always loved how music and sound can bring people together. At Wesleyan there is a very lively music scene, so in my Freshman year I decided I wanted to learn how to play the drums and have since gotten involved in 4 different bands. The band I’m currently playing with, Montana and the Scarf, has been together since September 2024 and we’ve played about twice a month since then, at venues on and off campus. I always look forward to practice, especially our songwriting sessions, because I can express myself and improvise through drumming. To me, drumming really feels like dancing along to and emphasizing rhythmic properties in the music. I also like playing around with Ableton, as you can see in my demo video, and creating funky electronic music.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think the combination of interests in music and technology is not uncommon, but it can be tricky to figure out the right way for you to bridge that gap. Acoustic engineering allows me to apply my mathematical skills to enhancing the quality of sound in fields like technology and entertainment. After graduation, I’m planning to enroll in an Acoustic Engineering graduate program to further build my knowledge on the intricacies of acoustics and audio signal processing.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"96Xo1Diuxzyd02VkqiRi01v01meZUzdl2ye4zfGuY6Yjcw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2ed61366-bca1-40ba-80d7-f5539b511fc1\"}"},{"__ref":"Favorites:{\"uuid\":\"3036a604-5c47-4723-a74b-08636ab534f0\"}"},{"__ref":"Favorites:{\"uuid\":\"32e8a8fd-2e85-437c-91a4-dea6f3745630\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"944226fb-9908-4ee4-b017-127888b75b3b\"}"},{"__ref":"DeepDives:{\"uuid\":\"ca86dda9-34a2-4a0c-95a1-f5d62acf9a8f\"}"},{"__ref":"DeepDives:{\"uuid\":\"36e85f67-d3cc-4190-83d3-850162493d4d\"}"},{"__ref":"DeepDives:{\"uuid\":\"b386d5c6-f967-40d7-beac-fa2f174fb540\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e9a2eae2-7579-4c70-976c-4458f7e81480/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6b443f27-3656-4705-92de-bc64c57cdc5c\"}"},{"__ref":"Education:{\"uuid\":\"c825f635-e983-4473-b0cb-ebe7b55d3e11\"}"}],"hiredAt":"2025-04-08T07:33:52.589Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","Computer Science","College Essay Writing"],"communityBadges":["https://ucarecdn.com/977f8407-9a83-4749-acdb-4527ab9b7d71/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tess-lepeskatrue\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9f1f4172-b546-4788-935b-aa81af96c9ee\"}"}}},"_sentryTraceData":"a3802e73b1414b63bc27b1664a150a09-815ee7333bf04eec-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6d
