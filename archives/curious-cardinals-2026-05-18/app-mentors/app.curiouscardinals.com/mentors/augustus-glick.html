xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0e6c65de-2469-4148-bf35-ae4099b6f5e9\"}":{"__typename":"Favorites","uuid":"0e6c65de-2469-4148-bf35-ae4099b6f5e9","photoUrl":"https://ucarecdn.com/d0c7dd57-3cdc-49e3-8b2e-bdefa451f7d4/","title":"Christian Bale","type":"ACTOR"},"Favorites:{\"uuid\":\"5595cc7c-80e2-4a75-874a-7797210675fb\"}":{"__typename":"Favorites","uuid":"5595cc7c-80e2-4a75-874a-7797210675fb","photoUrl":"https://ucarecdn.com/d0c7dd57-3cdc-49e3-8b2e-bdefa451f7d4/","title":"Frank Ocean","type":"ARTIST"},"Favorites:{\"uuid\":\"399004db-d8af-4e94-8bb8-410b5174d3a4\"}":{"__typename":"Favorites","uuid":"399004db-d8af-4e94-8bb8-410b5174d3a4","photoUrl":"https://ucarecdn.com/d0c7dd57-3cdc-49e3-8b2e-bdefa451f7d4/","title":"A Prayer for Owen Meany","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"caa2a9fa-cc27-4771-a99a-7429cef343fc\"}":{"__typename":"DeepDives","uuid":"caa2a9fa-cc27-4771-a99a-7429cef343fc","content":"\u003cp\u003eI knew that I wanted to study acting in college, and Northwestern's Theatre major allowed me to also explore my other creative interests. Here, there is a holistic approach to the development of an artist, and it was important to me to engage with writing, production, and other personal interests. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2beba842-87fd-47b5-a81a-3a01281cf14d\"}":{"__typename":"DeepDives","uuid":"2beba842-87fd-47b5-a81a-3a01281cf14d","content":"\u003cp\u003eI would advise my younger self not to confine myself to my age! I used to be nervous about working with older collaborators or taking ideas seriously simply becuase I was younger, and I wish I would have entertained all those opportunities. I have found that working with people of different identities from myself has been such a joy and I think it would have been helpful to open myself up to that earlier.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"32a5d757-e7be-480f-b558-791f8210b2b8\"}":{"__typename":"DeepDives","uuid":"32a5d757-e7be-480f-b558-791f8210b2b8","content":"\u003cp\u003eI just recently had an assignment to replicate a dream in a performance art class and it was a doozy! I was on a unrecognizable driveway with my dad and I cut us both equal amounts of salmon sushi. After a moment away, I returned to find that he had eaten both his and my sushi portions and then I looked up to see him putting a smaller car into the trunk of his car!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"dc9675ee-bab1-44b7-b3f4-4016fc140edf\"}":{"__typename":"DeepDives","uuid":"dc9675ee-bab1-44b7-b3f4-4016fc140edf","content":"\u003cp\u003eI just produced and starred in a production of Martin McDonough's \u003cem\u003eThe Pillowman\u003c/em\u003e in which we explored how to stage a difficult-to-stage script. We experimented with non-contact representations of violence, utilizing actors of varying identities for roles, and multi-media projections. It was a roaring success and one of my proudest accomplishments.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"54a0cd17-26ec-43cb-b012-b374bf4a9a18\"}":{"__typename":"School","uuid":"54a0cd17-26ec-43cb-b012-b374bf4a9a18","name":"Simsbury High School","city":"Simsbury","type":"HIGH","state":"Connecticut","country":"United States","zip":"06070"},"Education:{\"uuid\":\"710bd3cf-d8ae-4376-8d26-17012ff73c78\"}":{"__typename":"Education","uuid":"710bd3cf-d8ae-4376-8d26-17012ff73c78","school":{"__ref":"School:{\"uuid\":\"54a0cd17-26ec-43cb-b012-b374bf4a9a18\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"fe038569-6be7-41cf-8680-f101c55511f8\"}":{"__typename":"Education","uuid":"fe038569-6be7-41cf-8680-f101c55511f8","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Theatre and English","degree":null},"Testimonial:43fa9800-8a07-46fb-83e8-cab6c8cefcb5":{"__typename":"Testimonial","id":"43fa9800-8a07-46fb-83e8-cab6c8cefcb5","text":"Thank you so much for working with me throughout this year. I have had so much fun learning new math that I haven't done yet. Also its pretty cool that we have so many connections with where we lived and similar vacation spots like Chatham. We will continue working on functions, graphing and staying ahead on math throughout the summer.  - Colin","date":"2025-06-09 01:45:32.033+00","rating":5,"endorser":{"__typename":"Endorser","name":"Colin Lin","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"ef9e5253-c5c0-4276-b479-0c9206512e9b\"}":{"__typename":"MentorPublicProfile","uuid":"ef9e5253-c5c0-4276-b479-0c9206512e9b","displayName":"Augustus G.","slug":"augustus-glick","biography":"\u003cp\u003eHey future cardinal!\u003c/p\u003e\u003cp\u003eMy name is Augustus (Gus) Glick and I am a rising senior at Northwestern University studying Theatre and Creative Writing. I was born in Los Angeles (Go Lakers!) and grew up in Connecticut, which means I love to surf and I also experience spring allergies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about the telling of stories and creative production. Whether it be through acting on stage, writing sketch television, collating personal essays, or producing music events, I am always game for making a dream a reality.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI first started acting in the 3rd grade when there wasn't enough boys for a production of West Side Story, and ever since I've been hooked. Since then, I've been a part of over 20 productions, from school musicals to regional new-work readings. I'm looking forward to my upcoming role as Kreon in Antigone!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've been awarded numerous accolades for my work, including Best Actor honors throughout high school and opportunities to auditon all around the US. I am currently a head writer for a sketch television group on campus as well as an editorial writer for STITCH fashion magazine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also passionate about supporting and producing other peoples ideas, which has landed me in high-profile celebrity event production in LA to student DJ events in Chicago. \u003c/p\u003e\u003cp\u003eBesides all these things, I love cars, solitaire, biographies, horseback-riding, and playing the guitar. I can also make a mean chicken piccata.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to supporting you and all your hearts desires! Lets have some fun!\u003c/p\u003e","teachingVideoPlaybackId":"Cs2iAr3hRr00qR02iBU6bf57rLqeEoxI1t7ySmCK02W58o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0e6c65de-2469-4148-bf35-ae4099b6f5e9\"}"},{"__ref":"Favorites:{\"uuid\":\"5595cc7c-80e2-4a75-874a-7797210675fb\"}"},{"__ref":"Favorites:{\"uuid\":\"399004db-d8af-4e94-8bb8-410b5174d3a4\"}"}],"causesSupported":[],"major":"Theatre and English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"caa2a9fa-cc27-4771-a99a-7429cef343fc\"}"},{"__ref":"DeepDives:{\"uuid\":\"2beba842-87fd-47b5-a81a-3a01281cf14d\"}"},{"__ref":"DeepDives:{\"uuid\":\"32a5d757-e7be-480f-b558-791f8210b2b8\"}"},{"__ref":"DeepDives:{\"uuid\":\"dc9675ee-bab1-44b7-b3f4-4016fc140edf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/91900a30-e812-4bac-b7e7-8b8373b81a7f/-/preview/-/format/jpg/","https://ucarecdn.com/86cb5c01-2d73-4436-81c4-edcb186211de/-/preview/-/format/jpg/","https://ucarecdn.com/9a868b6b-0e4d-462c-b3fd-96f09264a03e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"710bd3cf-d8ae-4376-8d26-17012ff73c78\"}"},{"__ref":"Education:{\"uuid\":\"fe038569-6be7-41cf-8680-f101c55511f8\"}"}],"hiredAt":"2024-05-11T11:52:23.775Z","topics":["Creative Writing","Music","Fashion / Cosmetics","Film / Theater","Video / Photography","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:43fa9800-8a07-46fb-83e8-cab6c8cefcb5"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"i
