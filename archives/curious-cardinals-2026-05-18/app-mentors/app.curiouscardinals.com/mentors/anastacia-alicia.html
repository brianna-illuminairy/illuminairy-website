xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"29f54f0a-a3fc-413a-823f-a509d7b26d6c\"}":{"__typename":"DeepDives","uuid":"29f54f0a-a3fc-413a-823f-a509d7b26d6c","content":"\u003cp\u003eI chose bioengineering because every day I looked forward to my AP Biology class in high school. After each class, I would leave utterly fascinated and craving more. One of my assignments was to read the book \u003cem\u003eThe Immortal Life of Henrietta Lacks\u003c/em\u003e, which details the story of Henrietta Lacks, a poor Black woman in Baltimore whose cervical cancer cells were collected without her knowledge and used to create the first-ever immortal cell line, now known as HeLa cells. Lacks passed away without adequate healthcare, and her family wouldn't find out about her contribution to medicine for decades. This case study of unethical practices in science against women of color ignited my drive to study bioengineering and work to ensure that ethics is at the center of innovation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b0b6ad2f-dafa-46ea-ac23-d0503fe86d87\"}":{"__typename":"DeepDives","uuid":"b0b6ad2f-dafa-46ea-ac23-d0503fe86d87","content":"\u003cp\u003eI would remind my high school self that the way I spend my days shapes the life I live. I would emphasize that anything worth pursuing must have a clear purpose, and I should commit to it wholeheartedly.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f8e4a01c-8826-4552-b74b-eb0e80546cc9\"}":{"__typename":"DeepDives","uuid":"f8e4a01c-8826-4552-b74b-eb0e80546cc9","content":"\u003cp\u003eMy dream job merges biodesign with community outreach and education. I envision spending my days exploring how bioinnovation can enhance quality of life and promote environmental health. Additionally, I aspire to lead projects that focus on expanding access to biology education while fostering a culture of curiosity, creativity, and community engagement within the educational landscape.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"0efe608e-5771-4d43-ab76-78e60cc316f1\"}":{"__typename":"DeepDives","uuid":"0efe608e-5771-4d43-ab76-78e60cc316f1","content":"\u003cp\u003eMy biggest motivation comes from the challenges faced by the women in my family, who didn’t have access to education or job opportunities until my mom immigrated to the United States. As the first person in my family to attend university, I’m incredibly grateful for the chance to study at my dream school. Whenever I face obstacles, I think about the privilege I have compared to my grandmother and great-grandmother. They never had the freedom to make choices about their own lives, while I get to explore my passions and chase my dreams. It feels so unfair to me that I have this chance, which drives me to keep pushing forward and make the most of every opportunity I can create for myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"9890143b-b8af-456b-b53b-f1f4ad4cf2f1\"}":{"__typename":"School","uuid":"9890143b-b8af-456b-b53b-f1f4ad4cf2f1","name":"Warner Robins High School","city":"Warner Robins","type":"HIGH","state":"Georgia","country":"United States","zip":"31088"},"Education:{\"uuid\":\"4b561874-708e-439e-836d-b7c1dcfd4669\"}":{"__typename":"Education","uuid":"4b561874-708e-439e-836d-b7c1dcfd4669","school":{"__ref":"School:{\"uuid\":\"9890143b-b8af-456b-b53b-f1f4ad4cf2f1\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"2a6f8253-88bb-422c-abef-f5756ead2da3\"}":{"__typename":"Education","uuid":"2a6f8253-88bb-422c-abef-f5756ead2da3","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Bioengineering","degree":null},"MentorPublicProfile:{\"uuid\":\"25061f58-c2fa-4832-a729-14cf4addfb64\"}":{"__typename":"MentorPublicProfile","uuid":"25061f58-c2fa-4832-a729-14cf4addfb64","displayName":"Anastacia D.","slug":"anastacia-alicia","biography":"\u003cp\u003eI am a senior studying bioengineering with a passion for synthetic biology, education, and planetary health! It is my dream to pursue a PhD in bioengineering and leverage synthetic biology to tackle some of our toughest climate change challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my classes, I am a research assistant in a mycology lab, studying ectomycorrhizal fungi, and I actively participate in several campus organizations. Most notably, I serve as the co-president of BioJam Camp, a voluntary student organization that partners with the Monterey County Migrant Education Program. Through this role, I help engage teens in exploring their creativity and culture while learning about bioengineering and developing pathways to share their knowledge within their communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn weekends, you can find me cheering on Cardinal football as the Big Game Week Co-Coordinator for the Stanford Axe Committee. I cherish the opportunity to uphold some of Stanford's oldest and most treasured traditions—BEAT CAL!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a firm believer in the \"work hard, play hard\" philosophy, I enjoy camping trips with friends to beautiful locations like Tahoe, the Redwoods, and Yosemite. I also love attending comedy shows and seeing my favorite artists in concert. This year, I’ve picked up new hobbies such as watercolor painting, kayaking, and hosting weekly \u003cem\u003eSurvivor\u003c/em\u003e watch parties.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am deeply committed to mentorship and guiding others as they discover their paths in bioengineering and beyond. Through my work with BioJam Camp, I had the rewarding opportunity to lead a group of teens in developing a sustainable agriculture workshop that I presented at the Society for Social Studies of Science 2023 conference, earning an honorable mention. This experience reinforced my belief in the power of mentorship and education to inspire young minds. I’m excited to share my experiences and guide the next generation of innovators!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Bioengineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"29f54f0a-a3fc-413a-823f-a509d7b26d6c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b0b6ad2f-dafa-46ea-ac23-d0503fe86d87\"}"},{"__ref":"DeepDives:{\"uuid\":\"f8e4a01c-8826-4552-b74b-eb0e80546cc9\"}"},{"__ref":"DeepDives:{\"uuid\":\"0efe608e-5771-4d43-ab76-78e60cc316f1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b5b3592e-633e-45dd-ad0d-43e73402b11e/-/preview/-/format/jpg/","https://ucarecdn.com/07584b90-121a-4381-abf5-7ad2f9e639da/-/preview/-/format/jpg/","https://ucarecdn.com/3557c2de-c5d7-4de0-a8f0-dcea9a292bbf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4b561874-708e-439e-836d-b7c1dcfd4669\"}"},{"__ref":"Education:{\"uuid\":\"2a6f8253-88bb-422c-abef-f5756ead2da3\"}"}],"hiredAt":"2024-10-15T00:32:18.119Z","topics":["Biology","Chemistry","Physics","STEM Project"],"communityBadges":["https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anastacia-alicia\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"25061f58-c2fa-4832-a729-14cf4addfb64\"}"}}},"_sentryTraceData":"b20fc614099341c5a6b716a423df9636-a589ed621de2e6d8-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b20fc614099341c5a6b716a423df9636,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"anastacia-alicia"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l
