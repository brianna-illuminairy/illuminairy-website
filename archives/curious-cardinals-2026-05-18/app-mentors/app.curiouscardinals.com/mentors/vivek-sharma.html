xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9492f06e-739d-4a4c-992d-e75d493236af\"}":{"__typename":"Favorites","uuid":"9492f06e-739d-4a4c-992d-e75d493236af","photoUrl":"https://ucarecdn.com/2018f904-7379-4b48-825b-cd49ee851780/","title":"East of Eden","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"18456a68-2e5b-473a-a449-9e81d8d04679\"}":{"__typename":"DeepDives","uuid":"18456a68-2e5b-473a-a449-9e81d8d04679","content":"\u003cp\u003eI would tell my younger self to explore more broadly and not be afraid to try new things. In middle and high school, I often focused on excelling in the subjects I was already good at, but I now realize that some of the most rewarding opportunities in my career came from stepping into areas I knew little about at first. Building side projects, experimenting with new ideas, and diving into fields outside my comfort zone helped me discover what I truly enjoy. If I had started exploring and creating earlier, I might have found my passions sooner. My advice is to treat every new project as a chance to learn something about yourself, you never know which experience will spark a lifelong interest.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a40d8ff3-9f2e-42ea-b6dd-31f9ecda591c\"}":{"__typename":"DeepDives","uuid":"a40d8ff3-9f2e-42ea-b6dd-31f9ecda591c","content":"\u003cp\u003eMentorship has played a huge role in my life. Coming from a small village with limited resources, I only found my way forward because of teachers and mentors who believed in me, guided me, and sometimes simply encouraged me to keep going when things felt uncertain. Their advice opened doors I never knew existed and gave me the confidence to pursue opportunities that changed the course of my career.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eBecause of that, I see mentorship as a way of giving back. It is not just about explaining concepts or solving problems, but about helping someone see their own potential and supporting them as they take the next step. I enjoy creating an environment where students feel comfortable asking questions, trying new ideas, and even making mistakes, because those are often the moments where the most growth happens. To me, mentorship matters because it can be the difference between someone giving up on a dream and someone realizing what they are capable of achieving.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"edab610a-d073-45f0-88da-bd57a0b02413\"}":{"__typename":"DeepDives","uuid":"edab610a-d073-45f0-88da-bd57a0b02413","content":"\u003cp\u003eI chose mechanical engineering because I have always been curious about how things work and how we can use science to solve real problems. At first, I was drawn to the creativity of designing machines and understanding physical systems, from engines to structures. As I explored further, I realized that the same principles of mechanics could also be applied to living systems, like how cells move or how tissues respond to forces. That connection between engineering and biology excited me because it showed me that the tools of physics and math could be used to improve healthcare and people’s lives. Mechanical engineering gave me a strong foundation to think logically, model complex systems, and build new solutions, skills that I now apply every day in my research and projects.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"fb513d94-ce78-4d33-85bc-c746eab7623b\"}":{"__typename":"DeepDives","uuid":"fb513d94-ce78-4d33-85bc-c746eab7623b","content":"\u003cp\u003eI am proud that I have never limited myself to one narrow path, but instead stayed open to new opportunities, questioned my own pre-conceived notions, and pushed past barriers. This mindset has allowed me to move from working on jet engines, to developing medical devices, to studying biomechanics, and now to researching cancer biology with tools from physics, engineering, and artificial intelligence. Each step required me to step into unfamiliar territory, learn a new way of thinking, and bring different perspectives together. What makes me proud is not just the research itself, but the journey of constantly challenging myself to grow, embracing change, and creating connections across fields that might not seem connected at first. Today, I get to work at a truly exciting intersection of biology, mechanical engineering, and AI, and I would not be here without the willingness to stay curious and keep breaking down barriers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"aa178704-aad9-4bfa-9d5e-93831f759278\"}":{"__typename":"School","uuid":"aa178704-aad9-4bfa-9d5e-93831f759278","name":"St. Mary's Convent School","city":"Dausa","type":"HIGH","state":"Rajasthan","country":"India","zip":"303303"},"Education:{\"uuid\":\"0ae10289-3a0a-44d5-ab9a-177ad05a6cdf\"}":{"__typename":"Education","uuid":"0ae10289-3a0a-44d5-ab9a-177ad05a6cdf","school":{"__ref":"School:{\"uuid\":\"aa178704-aad9-4bfa-9d5e-93831f759278\"}"},"startYear":"2001","endYear":"2013","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"2447aed6-e757-4f7d-90de-150c72ca94df\"}":{"__typename":"Education","uuid":"2447aed6-e757-4f7d-90de-150c72ca94df","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Mechanical Engineering, Biophysics","degree":null},"MentorPublicProfile:{\"uuid\":\"6601b43b-db5d-4b24-bdc0-1a1ce05476db\"}":{"__typename":"MentorPublicProfile","uuid":"6601b43b-db5d-4b24-bdc0-1a1ce05476db","displayName":"Vivek S.","slug":"vivek-sharma","biography":"\u003cp\u003eHello, I’m Vivek! I am currently a PhD candidate in Mechanical Engineering at the University of Pennsylvania, where my work brings together engineering, physics, data science, and biology. At first glance, those fields might sound worlds apart, but I have always been motivated by one simple question: how can we use science and problem-solving to improve people’s lives?\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy journey began in a small rural village in India, where educational opportunities were limited. I left home at a young age to pursue higher studies and was fortunate to gain admission to some of the country’s most rigorous institutions in engineering. Along the way, I worked on jet engines at a national aeronautics laboratory, collaborated with doctors to develop low-cost medical devices, and studied the mechanics of biological tissues. Today, my doctoral research focuses on cancer cells, where I use physics-based models, partial differential equations, and machine learning to understand disease progression from an engineering point of view. I also build AI-driven pipelines that allow experimental collaborators to analyze complex biological images more efficiently.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eBeyond research, teaching and mentorship have been central to my academic journey. As a lead teaching assistant at Penn, I was honored with the Outstanding Teaching Assistant Award, one of the highest recognitions given to graduate instructors. In this role, I mentored students closely, guided them through challenging concepts, and incorporated active learning approaches that encouraged curiosity and collaboration. Teaching has shown me that knowledge is best shared when it inspires confidence and excitement in learners, and it remains one of my deepest passions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI also enjoy creating impact outside the classroom. As vice president of Penn’s Mechanical Engineering Graduate Association, I helped strengthen community life and worked on policies to improve the academic experience. Through the Penn Biotech Group, I collaborated with a team of consultants to support an early-stage biotech company, helping them think strategically about pricing, product launch, and market positioning. These experiences reinforced my belief that problem-solving, communication, and empathy are just as essential as technical skills.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eOutside academics, I find joy in pursuits that balance both mind and body. I am an avid runner and cyclist, and this year I completed a triathlon after training myself to swim from scratch. I also enjoy the quiet focus of playing chess, the creativity of playing the flute, and the inspiration of reading widely, from historical fiction to science writing. More recently, I have been fascinated by building apps and websites, especially using new AI tools, as a way to bring ideas to life quickly and creatively.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAs a mentor, I want students to see that their backgrounds or starting points do not define what they can achieve. My own path has been shaped by curiosity, persistence, and the support of great mentors, and I am passionate about paying that forward. Whether you are tackling equations, exploring science for the first time, or pursuing a passion project that combines product building with science and technology, I would be excited to guide, support, and learn alongside you.\u003c/p\u003e","teachingVideoPlaybackId":"jQ2RIZxTWQfTU8G01NJVhrqjEo8hW02Ggl00R8dDCbk1LQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eAcademically, I earned one of the top ranks in India’s national engineering entrance exams, placing in the top 0.1 percentile among hundreds of thousands of candidates. That achievement opened doors to the country’s top institutions and eventually led me to pursue my PhD at the University of Pennsylvania as an international student. Each step required me to adapt, learn quickly, and carry forward the determination to excel in new environments.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn a personal level, I am equally proud of testing my endurance and resilience. I completed a half marathon, and most recently, a triathlon—teaching myself to swim from scratch just last year so I could take part. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"9492f06e-739d-4a4c-992d-e75d493236af\"}"}],"causesSupported":[],"major":"Mechanical Engineering, Biophysics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"18456a68-2e5b-473a-a449-9e81d8d04679\"}"},{"__ref":"DeepDives:{\"uuid\":\"a40d8ff3-9f2e-42ea-b6dd-31f9ecda591c\"}"},{"__ref":"DeepDives:{\"uuid\":\"edab610a-d073-45f0-88da-bd57a0b02413\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb513d94-ce78-4d33-85bc-c746eab7623b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fd9a1cef-a685-476d-9c67-9dd38e7e0404/-/preview/-/format/jpg/","https://ucarecdn.com/42739a1c-eb0b-4f42-8e5b-b11a28221596/-/preview/-/format/jpg/","https://ucarecdn.com/ece093e3-e2d6-4efc-a686-e328e480bf58/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0ae10289-3a0a-44d5-ab9a-177ad05a6cdf\"}"},{"__ref":"Education:{\"uuid\":\"2447aed6-e757-4f7d-90de-150c72ca94df\"}"}],"hiredAt":"2025-09-11T02:52:24.858Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Physics","Biology","Computer Science","Academic Coaching"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"vivek-sharma\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6601b43b-db5d-4b24-bdc0-1a1ce05476db\"}"}}},"_sentryTraceData":"41f7376a741040969e38cbc624156956-a1ef80ca261edd0c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=41f7376a741040969e38cbc624156956,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"vivek-sharma"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/g
