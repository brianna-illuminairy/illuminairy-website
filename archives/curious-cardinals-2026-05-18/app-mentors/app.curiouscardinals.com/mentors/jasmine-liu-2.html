xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"777d07c9-f984-4f20-87c6-84f244c80720\"}":{"__typename":"Favorites","uuid":"777d07c9-f984-4f20-87c6-84f244c80720","photoUrl":"https://ucarecdn.com/82526fe5-5a4e-47a7-9286-f2b8af13c175/","title":"Tame Impala","type":"ARTIST"},"Favorites:{\"uuid\":\"81e8063d-1fe3-4b83-a50c-318c48ba30c1\"}":{"__typename":"Favorites","uuid":"81e8063d-1fe3-4b83-a50c-318c48ba30c1","photoUrl":"https://ucarecdn.com/7ba63e3c-1063-4b36-b559-120fb5446f74/","title":"The mysterious benedict society","type":"BOOK"},"Favorites:{\"uuid\":\"42e02b96-a213-4b96-b501-5ab8b4b122e2\"}":{"__typename":"Favorites","uuid":"42e02b96-a213-4b96-b501-5ab8b4b122e2","photoUrl":"https://ucarecdn.com/4b8edc54-f58c-433b-b1c1-c11453815dba/","title":"Overcooked","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"cc87108e-0e41-47f0-828b-b1fd0da2b9f1\"}":{"__typename":"DeepDives","uuid":"cc87108e-0e41-47f0-828b-b1fd0da2b9f1","content":"\u003cp\u003eI’d tell my middle or high school self to slow down and breathe a little. I felt like I was constantly racing against some invisible timeline, putting pressure on myself to have everything figured out way too early. In reality, I was so young, and that pressure only made me more afraid to explore. I’d remind myself that \u003cem\u003e\u003cu\u003etrying new things and changing your mind isn’t falling behind: it’s how you grow\u003c/u\u003e\u003c/em\u003e. The only thing actually holding me back was myself and the expectations I created in my own head. I didn’t need to rush or lock myself into one path to be successful. Growth comes from staying open, curious, and willing to try things before deciding who you’re “supposed” to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f22eadc2-c279-4cfc-a7cb-f3b08a3f7ee5\"}":{"__typename":"DeepDives","uuid":"f22eadc2-c279-4cfc-a7cb-f3b08a3f7ee5","content":"\u003cp\u003eIn high school, I treated summers as a time to explore anything I was genuinely curious about. I completed a CNA course and worked in a senior care home, which gave me early, hands-on exposure to healthcare and taught me how meaningful patient care really is. I also spent a summer doing research at Northwestern University under the guidance of an orthopedic surgeon, which helped me understand what medical research looks like beyond the classroom. Along the way, I volunteered at a Red Cross blood bank and at an animal shelter, simply because I wanted to contribute in different ways and see where my interests might take me. At the same time, I was growing my clothing business, expanding it across the country and even traveling to China to meet manufacturers and better understand the supply chain. Looking back, my summers weren’t driven by résumé-building or college applications, but by curiosity and a desire to explore interests I didn’t always have time to pursue during the school year.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"eb9a7580-612f-48cd-9b12-c4c8e0d4868d\"}":{"__typename":"DeepDives","uuid":"eb9a7580-612f-48cd-9b12-c4c8e0d4868d","content":"\u003cp\u003eOne passion project I’ve worked on throughout college is Project Alivio, where my team and I designed a pressure-alternating mattress to help prevent pressure ulcers in hospital patients. What made this project especially meaningful was that we traveled to Guatemala and worked directly with the hospitals and patients we were designing for. Being on the ground changed everything and pushed us to think less about building the most advanced solution and more about what would actually be useful, affordable, and durable in real hospital settings. Seeing the project connect to real people made the work feel personal in a way it never could have from a classroom. It reminded me why I love building things that actually make a difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2c1518a3-f705-4d0c-9568-cb2545fe940c\"}":{"__typename":"DeepDives","uuid":"2c1518a3-f705-4d0c-9568-cb2545fe940c","content":"\u003cp\u003eIn my free time, I love planning trips and vlogging my travels so I can capture and relive those memories later. I’m also a big fan of spending time in the kitchen with friends, experimenting with new recipes and seeing what flavor combinations actually work. I try to stay active through Pilates, weight lifting, and hiking, but one of my favorite workouts is bouldering at the climbing gym because it feels like solving a puzzle using your body. When I’m not doing something active, my friends and I are usually ordering takeout and binge-watching our favorite shows. You can almost always find us cycling between Criminal Minds, Survivor, MasterChef, and Grey’s Anatomy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"20c82a76-e38d-4665-bf2c-08dcbe7a3d98\"}":{"__typename":"School","uuid":"20c82a76-e38d-4665-bf2c-08dcbe7a3d98","name":"Illinois Mathematics and Science Academy","city":"Aurora","type":"HIGH","state":"Illinois","country":"United States","zip":"60506"},"Education:{\"uuid\":\"337d6bb2-3108-4fa6-9667-6df99a4fab30\"}":{"__typename":"Education","uuid":"337d6bb2-3108-4fa6-9667-6df99a4fab30","school":{"__ref":"School:{\"uuid\":\"20c82a76-e38d-4665-bf2c-08dcbe7a3d98\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}":{"__typename":"School","uuid":"9a91466f-187b-4e9b-8a98-c02cef7bf621","name":"University of Michigan","city":"Ann Arbor","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48109"},"Education:{\"uuid\":\"1c844802-7acb-4fab-b40d-f68581e229cd\"}":{"__typename":"Education","uuid":"1c844802-7acb-4fab-b40d-f68581e229cd","school":{"__ref":"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"6369464e-0932-45f3-9949-2b2a7d3f5a01\"}":{"__typename":"MentorPublicProfile","uuid":"6369464e-0932-45f3-9949-2b2a7d3f5a01","displayName":"Jasmine L.","slug":"jasmine-liu-2","biography":"\u003cp\u003eHi! I'm Jasmine and I love helping students get excited about learning agin.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe that curiosity doesn't magically disappear as we grow up but instead gets buried under pressure, grades, and expectations. As a mentor, my goal is to help students reconnect with that natural sense of exploration, build confidence in themselves, and develop the self-drive to pursue opportunities because they want to, not because they have to.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm a senior studying Neuroscience and Philosophy at the University of Michigan, but i've had a variety of interests beyond my studies. I've worked thousands of hours in hospitals as a medical assistant, performed medical research in multiple clinical and wet labs, \u003cstrong\u003e\u003cem\u003e\u003cu\u003epublished my research in renowned healthcare journals\u003c/u\u003e\u003c/em\u003e\u003c/strong\u003e, and spent 3 years in labs trying to answer questions that don't have any clear solutions. I've also taken the \u003cstrong\u003e\u003cem\u003e\u003cu\u003eMCAT\u003c/u\u003e\u003c/em\u003e\u003c/strong\u003e (and yes, survived it! \u003cstrong\u003e\u003cem\u003e\u003cu\u003escoring in the 99th percentile)\u003c/u\u003e\u003c/em\u003e\u003c/strong\u003e, which has taught me so much about discipline, mindset, and developing strong personal skills for success.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics, I love building things! I started my own clothing company in high-school and \u003cstrong\u003e\u003cem\u003e\u003cu\u003egrew it to over $1 million in revenue! \u003c/u\u003e\u003c/em\u003e\u003c/strong\u003eThen create one of my favorite projects, EutroPod, which began as a curiosity driven idea to improve water quality. Later, it turned into a patented solution with multiple competition wins and over \u003cstrong\u003e\u003cem\u003e\u003cu\u003e$50K in funding\u003c/u\u003e\u003c/em\u003e.\u003c/strong\u003e One of the most meaningful experiences I've had was building a global health project in Guatemala. My team partnered with clinicians and engineers to develop and implement a pressure-alternating mattress aimed at reducing pressure ulcers in under-developed hospitals. These experiences reinforced my belief that \u003cem\u003e\u003cu\u003elearning should extend beyond textbooks and into the real world.\u003c/u\u003e\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat ties it all together is how I mentor. I don't believe in one-size-fits-all paths. In our sessions, we might brainstorm passion project ideas, map out research plans, talk through motivation slumps, or break down intimidating goals into actionable steps that feel doable. I care just as much about helping students build confidence as I do about helping them achieve concrete outcomes.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI specialize in working with students of any age rage who want to:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eExplore science, medicine, or entrepreneurship beyond the classroom\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDevelop passion projects that feel meaningful and fun\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuild confidence, independence, and intrinsic motivation\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLearn how to think critically and creatively about their future\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of mentoring, you'll probably find me training for an Ironman, planning my next trip, cooking up new recipes, bouldering, making matcha, or watching Formula 1!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you're looking for a mentor who is encouraging, curious, and deeply invested in helping students grow into motivated, confident learners, \u003cem\u003e\u003cu\u003eI'd be so excited to work with you\u003c/u\u003e\u003c/em\u003e!\u003c/p\u003e","teachingVideoPlaybackId":"jOS00hlml1R2MDCDIzXYasuMk01Svb702Pd7E9Y5Z003CQk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"777d07c9-f984-4f20-87c6-84f244c80720\"}"},{"__ref":"Favorites:{\"uuid\":\"81e8063d-1fe3-4b83-a50c-318c48ba30c1\"}"},{"__ref":"Favorites:{\"uuid\":\"42e02b96-a213-4b96-b501-5ab8b
