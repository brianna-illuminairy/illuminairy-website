xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"20ddf82f-ff79-4685-8abb-e49b2a2ef16c\"}":{"__typename":"Favorites","uuid":"20ddf82f-ff79-4685-8abb-e49b2a2ef16c","photoUrl":"https://ucarecdn.com/ab5543cc-e41d-4585-b331-c3e8dee8c84a/","title":"TWENTIES ","type":"SONG"},"Favorites:{\"uuid\":\"e2649cde-27a9-4d43-a3c6-9814f2b800f2\"}":{"__typename":"Favorites","uuid":"e2649cde-27a9-4d43-a3c6-9814f2b800f2","photoUrl":"https://ucarecdn.com/d43eff01-d3df-433c-ae2c-0fe5affc42b1/","title":"Harry Potter and the Goblet of Fire ","type":"MOVIE"},"Favorites:{\"uuid\":\"45072f4c-3ee5-4c6a-9fe8-231783dd59f0\"}":{"__typename":"Favorites","uuid":"45072f4c-3ee5-4c6a-9fe8-231783dd59f0","photoUrl":"https://ucarecdn.com/d95f9074-e1d3-4e9e-91b2-28196f7ca368/","title":"Bad Bunny","type":"ARTIST"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"bc91022b-3afb-4249-83f7-1e3b23309d3a\"}":{"__typename":"DeepDives","uuid":"bc91022b-3afb-4249-83f7-1e3b23309d3a","content":"\u003cp\u003eI want students to know that while they may find whatever they are doing difficult, it is possible. It is easy to convince yourself that you are the only one struggling, but my job as a mentor is to reassure you that there is always somebody to support you, and that you are not alone. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"9982c0e6-36df-4305-a880-f09d343ae505\"}":{"__typename":"DeepDives","uuid":"9982c0e6-36df-4305-a880-f09d343ae505","content":"\u003cp\u003eI hope to be a Clinical Informaticist, where I leverage my computational skills and data to make clinically meaningful decisions that improve patient care, reduce disparities, and help healthcare systems better serve every community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"7549842f-ca81-4407-9a71-bc74c9b0cf8c\"}":{"__typename":"DeepDives","uuid":"7549842f-ca81-4407-9a71-bc74c9b0cf8c","content":"\u003cp\u003eI am Dominican from Washington Heights, also known as the “Little Dominican Republic”, where I grew up in a low-income school and community. Being surrounded by classmates with different challenges and learning styles taught me that everyone deserves support tailored to their needs. Not everyone thrives the same way, which is why I’ve learned to really listen to the students I teach and collaborate with them to find study approaches that fit how they learn best — and help them enjoy the process.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"440a0740-d3db-44ba-a9eb-0b0f2e7ee871\"}":{"__typename":"DeepDives","uuid":"440a0740-d3db-44ba-a9eb-0b0f2e7ee871","content":"\u003cp\u003eIn my spare time, I like to bake, play board games with my friends, watch tv shows (specifically anime), go to the gym, (and when I have a LOT of free time) travel! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f6df20e6-1cce-47bb-a920-c75019ed33bb\"}":{"__typename":"School","uuid":"f6df20e6-1cce-47bb-a920-c75019ed33bb","name":"Success Academy Charter School - High School of the Liberal Arts-Manhattan","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10016"},"Education:{\"uuid\":\"141119c6-1fb5-4b0e-bb56-01e4a78c4b9c\"}":{"__typename":"Education","uuid":"141119c6-1fb5-4b0e-bb56-01e4a78c4b9c","school":{"__ref":"School:{\"uuid\":\"f6df20e6-1cce-47bb-a920-c75019ed33bb\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"674f5496-8060-4209-ae8f-4013a98c44bc\"}":{"__typename":"Education","uuid":"674f5496-8060-4209-ae8f-4013a98c44bc","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computational Biology, and Health and Human Biology ","degree":null},"MentorPublicProfile:{\"uuid\":\"520045e8-90c9-4aab-be32-cc01c5f312e1\"}":{"__typename":"MentorPublicProfile","uuid":"520045e8-90c9-4aab-be32-cc01c5f312e1","displayName":"Alexa T.","slug":"alexa-torres","biography":"\u003cp\u003eHi! My name is Alexa, and I’m from Manhattan, New York. I am currently a senior at Brown University working at the intersection of computer science and biology — a path that reflects both my curiosity and my commitment to service. My passion for biology began in 5th grade, when my dream was to become a doctor and support people in underserved communities like the one I grew up in. As I got older, I realized that there are many ways to improve health outcomes beyond the clinical setting. When I took my first coding course during sophomore year, I immediately fell in love with the problem-solving and creativity involved in computer science. That discovery helped me find the perfect bridge between technology and medicine, leading me to pursue computational cancer research at the Brown Health Hospital. I love knowing the work I do behind a computer can one day help real patients.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile academics are an important part of my story, a defining theme of my life has been building community and lifting up those around me. At Brown, I serve as Co-President of the Latinx Student Union, where I’ve had the opportunity to strengthen a tight-knit home for 500+ Latinx students. I helped organize cultural celebrations, mentorship initiatives for first-year students, and support networks for those navigating life away from home. I am also part of the Data Science Department’s DUG, where I host workshops that show how data can be used to drive meaningful change in fields like economics, public health, and biology. These roles have taught me the importance of making spaces feel inclusive, empowering, and collaborative — especially for students who are still figuring out who they want to be.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship has become one of the most rewarding parts of my life. Over the past six years, I’ve worked with students from 5th to 12th grade, helping them develop study strategies, communication skills, and confidence in themselves. I understand what it feels like to not always know where you belong — and that’s why I’m passionate about helping others discover their strengths and feel proud of who they are. I’m patient, reliable, and genuinely excited to support others through both challenges and successes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I make sure to enjoy life beyond the work I do. I love baking because it gives me creative freedom. Experimenting with new recipes and sharing them with friends during movie nights or board games. I also love traveling and exploring different corners of the world, like the peaceful mountains of Monteverde in Costa Rica or the energy of Santo Domingo. These experiences remind me that joy, culture, and community exist everywhere.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, what drives me is the happiness of others. Seeing someone smile because I helped them — whether by teaching them something new, cheering them on, or simply being there — is truly the best part of my day. I hope to continue bringing that passion, empathy, and enthusiasm into my role as a mentor.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"syOP8TxE00phHfth00WGJsBs601q4pwxIl00rMAbu6pkNhM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"20ddf82f-ff79-4685-8abb-e49b2a2ef16c\"}"},{"__ref":"Favorites:{\"uuid\":\"e2649cde-27a9-4d43-a3c6-9814f2b800f2\"}"},{"__ref":"Favorites:{\"uuid\":\"45072f4c-3ee5-4c6a-9fe8-231783dd59f0\"}"}],"causesSupported":[],"major":"Computational Biology, and Health and Human Biology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bc91022b-3afb-4249-83f7-1e3b23309d3a\"}"},{"__ref":"DeepDives:{\"uuid\":\"9982c0e6-36df-4305-a880-f09d343ae505\"}"},{"__ref":"DeepDives:{\"uuid\":\"7549842f-ca81-4407-9a71-bc74c9b0cf8c\"}"},{"__ref":"DeepDives:{\"uuid\":\"440a0740-d3db-44ba-a9eb-0b0f2e7ee871\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/89c9847a-4692-499b-9d39-ce6a0b4ba3b2/-/preview/-/format/jpg/","https://ucarecdn.com/170df600-7698-4b53-bd22-620bae1ac8a5/-/preview/-/format/jpg/","https://ucarecdn.com/7253461e-7311-45a5-bad6-99c5f7fe4b7a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"141119c6-1fb5-4b0e-bb56-01e4a78c4b9c\"}"},{"__ref":"Education:{\"uuid\":\"674f5496-8060-4209-ae8f-4013a98c44bc\"}"}],"hiredAt":"20
