xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"74ff2e88-6d36-40c3-934a-e1efd19ac558\"}":{"__typename":"DeepDives","uuid":"74ff2e88-6d36-40c3-934a-e1efd19ac558","content":"\u003cp\u003eI would spend summers in upstate New York, and once in Philadelphia, on a farm, as part of a youth-led urban farming group combining activist/social justice work and sustainable growing/environmental practices.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"75eaf4a3-8441-420d-ad6a-8f0e861cf338\"}":{"__typename":"DeepDives","uuid":"75eaf4a3-8441-420d-ad6a-8f0e861cf338","content":"\u003cp\u003eI have always been fascinated by music. In college, the deeper I got the more I loved it – which seemed like sure sign to keep going. The amazing professors and wonderful community of the program played no small part as well!  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"9aad787d-4de2-4ff7-9bee-460c54cff61f\"}":{"__typename":"DeepDives","uuid":"9aad787d-4de2-4ff7-9bee-460c54cff61f","content":"\u003cp\u003eI really enjoy sharing what I've learned with others. I also learn so much from working with students, which is a cliché but also true! Through mentoring, we both get to make and re-make discoveries through fresh eyes, together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"306569d8-7c97-4638-883b-0d5601e7746f\"}":{"__typename":"DeepDives","uuid":"306569d8-7c97-4638-883b-0d5601e7746f","content":"\u003cp\u003eTo be open minded and not worry what others think, and to not be afraid to ask questions and seek help when you don't know something. Just to be as curious as possible and keep following the things you care about! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"ddebc148-8bab-4e23-9552-c72acf8954ba\"}":{"__typename":"School","uuid":"ddebc148-8bab-4e23-9552-c72acf8954ba","name":"Fiorello H. LaGuardia High School of Music \u0026 Art and Performing Arts","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10023"},"Education:{\"uuid\":\"d934821e-60a8-452c-a2ee-30abeaa4422f\"}":{"__typename":"Education","uuid":"d934821e-60a8-452c-a2ee-30abeaa4422f","school":{"__ref":"School:{\"uuid\":\"ddebc148-8bab-4e23-9552-c72acf8954ba\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"f15d8c46-2650-48e3-8c59-b6004780732f\"}":{"__typename":"Education","uuid":"f15d8c46-2650-48e3-8c59-b6004780732f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":"2022","expectedGradYear":"2021","major":"Music Composition and Symbolic Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"6d7c740b-ac6e-47ef-b0c1-0ca694f18de4\"}":{"__typename":"MentorPublicProfile","uuid":"6d7c740b-ac6e-47ef-b0c1-0ca694f18de4","displayName":"Noah B.","slug":"noah-berrie","biography":"Noah is a violinist, composer, and computer musician from New York. He graduated with a MA in Music, Science, and Technology, as well as a BA in Music and a BS in Symbolic Systems. \n\nNoah has deep knowledge in all things sound and music related. He has studied music theory, music history, composition, and orchestration. Music has also led to studies in a range of fields. Electronics, to build novel instruments; science and formal research, to study perceptual and cognitive responses to sound; computer science, to write music that takes advantage of algorithmic and data-based processes; literature, philosophy, and theory, to approach the creative process; and of course, the math and history that underpin everything.\n\nNoah has been tutoring since he was in high school and is great with kids. He has taught math, history, english, and test-prep through 12th grade level. He is excited to teach (and learn from) anyone with strong curiosity, from all backgrounds and ages! ","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Music Composition and Symbolic Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"74ff2e88-6d36-40c3-934a-e1efd19ac558\"}"},{"__ref":"DeepDives:{\"uuid\":\"75eaf4a3-8441-420d-ad6a-8f0e861cf338\"}"},{"__ref":"DeepDives:{\"uuid\":\"9aad787d-4de2-4ff7-9bee-460c54cff61f\"}"},{"__ref":"DeepDives:{\"uuid\":\"306569d8-7c97-4638-883b-0d5601e7746f\"}"}],"active":true,"profilePhotos":["https://
