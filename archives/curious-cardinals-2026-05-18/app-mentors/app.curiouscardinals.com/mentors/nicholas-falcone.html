xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b964825d-6cb4-4bcf-a4b0-0da7c2e864e7\"}":{"__typename":"Favorites","uuid":"b964825d-6cb4-4bcf-a4b0-0da7c2e864e7","photoUrl":"https://ucarecdn.com/6352af42-909c-4ba8-985b-b3e676eeea2d/","title":"Outliers by Malcolm Gladwell","type":"BOOK"},"Favorites:{\"uuid\":\"471c2d6b-d647-4e47-b1b6-bb99354d1966\"}":{"__typename":"Favorites","uuid":"471c2d6b-d647-4e47-b1b6-bb99354d1966","photoUrl":"https://ucarecdn.com/3d22da26-bbc2-47c1-b0ee-46d9d217fc7a/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"e90be9cb-dcaa-4b87-ab6e-ee46f749d308\"}":{"__typename":"Favorites","uuid":"e90be9cb-dcaa-4b87-ab6e-ee46f749d308","photoUrl":"https://ucarecdn.com/17496f27-5f29-4e87-b639-9c065c22e51c/","title":"Cooper Flagg","type":"ATHLETE"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"6970a67b-62df-4f27-b810-44a39ecd1042\"}":{"__typename":"DeepDives","uuid":"6970a67b-62df-4f27-b810-44a39ecd1042","content":"\u003cp\u003eIn high school, I mentored many elementary school students on the saxophone, and it was by far one of my favorite experiences. Getting to work with unique students who faced different struggles challenged me to be creative and innovative in my approach to mentoring. Seeing my students' progress week to week was incredible to watch and pushed me to continue to find new ways to improve their skills. This both greatly improved my skills as a teacher and inspired me to pursue other mentorship opportunities where I can put many of the other skills and knowledge I have learned to use!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2d7cdfb4-b91e-4a59-8f7f-0f52351e486d\"}":{"__typename":"DeepDives","uuid":"2d7cdfb4-b91e-4a59-8f7f-0f52351e486d","content":"\u003cp\u003eI would give the same advice to my middle or high school self that I continue to follow today, and that is to be open to every new opportunity or interest that comes your way. It is easy to shut yourself off to certain activities or paths and get caught in echo chambers focused on one thing. However, I have grown the most when I have put myself in uncomfortable positions and tried something new. Whether it is taking that class you think you know nothing about, trying that sport you always thought looked cool on TV, or even something as simple as reading a book about something completely unrelated to any of your interests, can be the most eye opening experience and help you realize what you actually care about. Passion comes from exploring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f4f57ca9-d8f2-40fb-8a02-3faebed9bf68\"}":{"__typename":"DeepDives","uuid":"f4f57ca9-d8f2-40fb-8a02-3faebed9bf68","content":"\u003cp\u003eI was actually very unsure about my major going into college because what many people don't know is that pre-meds can major in anything they want. I've talked to numerous  doctors who chose fields completely unrelated to science, such as economics or the classics, to major in during undergrad, and this left me with a wide range of opportunities. I was leaning towards a more science-based major because I prefer quantitative problem solving as opposed to more humanities-based majors, but I didn't decide on chemistry until I actually got in the lab and got my feet wet. Getting to experience the problem-solving, challenge, and creativity around PhD students with a wealth of knowledge fascinated me, and it was one of the best educational experiences I ever had. Now I can't wait to keep learning so I can contribute more in the lab and ask even bigger questions!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cbc8085a-0154-4d2e-b4d2-91662dc6a7d2\"}":{"__typename":"DeepDives","uuid":"cbc8085a-0154-4d2e-b4d2-91662dc6a7d2","content":"\u003cp\u003eFor fun, I spend a significant amount of time focusing on science-based strength training and enjoy tracking my growth and optimizing my routine. I am always reading up about research involving techniques, supplements, and recovery. Apart from the physical and mental benefits that come with exercise, I have found this hobby to be a great way to take advantage of everything I have learned about the scientific way of thinking and questioning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"931afa7c-f6f4-438c-8b87-0638f6b7cfde\"}":{"__typename":"School","uuid":"931afa7c-f6f4-438c-8b87-0638f6b7cfde","name":"Ridge High School","city":"Bernards","type":"HIGH","state":"New Jersey","country":"United States","zip":"07920"},"Education:{\"uuid\":\"5b6e17e8-a2e6-4c20-bad1-8afae84e179c\"}":{"__typename":"Education","uuid":"5b6e17e8-a2e6-4c20-bad1-8afae84e179c","school":{"__ref":"School:{\"uuid\":\"931afa7c-f6f4-438c-8b87-0638f6b7cfde\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"c49b3b6a-193e-489d-9692-cf813c00bade\"}":{"__typename":"Education","uuid":"c49b3b6a-193e-489d-9692-cf813c00bade","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"ff1c3149-7c18-43bc-94fe-829a0a6bab8e\"}":{"__typename":"MentorPublicProfile","uuid":"ff1c3149-7c18-43bc-94fe-829a0a6bab8e","displayName":"Nicholas F.","slug":"nicholas-falcone","biography":"\u003cp\u003eHi! My name is Nick Falcone, and I am a Sophomore at Duke University, majoring in Chemistry with a minor in Bioinformatics on the Pre-Med track. One super important thing to know about me is that I love science, and I love it because of the infinite number of questions to ask and information to learn. I want to push the boundaries of what I know and put myself in uncomfortable positions where I can explore the most! For me, this has meant working on theoretical chemistry research involving carbon nanotubes. Right now, I am working on synthesizing a target molecule using a pathway that I designed. My goal is to attach this target molecule to carbon nanotubes to take advantage of some advanced physics principles, like the Faraday Effect, for use in sensor technology! Additionally, I am currently involved in data science research that uses causal mapping and group modeling to help make better clinical decision support tools. These tools will assist vascular surgeons in detecting risk for surgical site infections so that they can employ preventitive methods that stop them from happening! These real-world experiences are what allow me to fully appreciate science learned in the classroom, and I can guarantee that my teaching will connect back to real world applications and opportunities because what your child is learning matters outside of their textbook.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, I also prioritize giving back to my community as an executive member and volunteer for Duke Adopt a Grandparent, where I build companionship with nursing home patients, and president of Duke Eye Serve, where I help to organize and provide glasses to underserved communities and coordinate vision-related research conferences!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was the Drum Major (conductor) of my school marching band, an experience that shaped my ability to lead and support diverse needs. Additionally, I organized and participated in a music mentorship program at my high school that brought free lessons to over 100 elementary schoolers. I continue my passion for music and saxophone (which I have been playing for 9 years now), by playing in pit orchestras for student-run musicals and by volunteering through Duke Harmonies for Health.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a college student with both mentorship and real-world experience, I have the knowledge and ability to help your child achieve their academic and project-based goals. I prioritize passion-based learning and will focus not just on improving your child skills, but also developing their interests and exploring where their curiosity takes them.\u003c/p\u003e","teachingVideoPlaybackId":"hXh5WA902wBqDXuScqXQ1QZkJVpZn23HNaaHGPTuS4DE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b964825d-6cb4-4bcf-a4b0-0da7c2e864e7\"}"},{"__ref":"Favorites:{\"uuid\":\"471c2d6b-d647-4e47-b1b6-bb99354d1966\"}"},{"__ref":"Favorites:{\"uuid\":\"e90be9cb-dcaa-4b87-ab6e-ee46f749d308\"}"}],"causesSupported":[],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6970a67b-62df-4f27-b810-44a39ecd1042\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d7cdfb4-b91e-4a59-8f7f-0f52351e486d\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4f57ca9-d8f2-40fb-8a02-3faebed9bf68\"}"},{"__ref":"DeepDives:{\"uuid\":\"cbc8085a-0154-4d2e-b4d2-91662dc6a7d2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/eb655d0f-feac-4dc8-bf4e-c281a3e0e0fd/-/preview/-/format/jpg/","https://ucarecdn.com/47b145d7-9741-40f9-a346-4476b14a7fe5/-/preview/-/format/jpg/","https://ucarecdn.com/6887d63e-867a-4c21-b152-0feb5a8405cd/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5b6e17e8-a2e6-4c20-bad1-8afae84e179c\"}"},{"__ref":"Education:{\"uuid\":\"c49b3b6a-193e-489d-9692-cf813c00bade\"}"}],"hiredAt":"2025-06-19T00:55:25.691Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nicholas-falcone\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ff1c3149-7c18-43bc-94fe-829a0a6bab8e\"}"}}},"_sentryTraceData":"36c7ac01b6c5443186c3b3aa36f436b8-abc1bd2c9e9ba9ab-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=36c7ac01b6c5443186c3b3aa36f436b8,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"nicholas-falcone"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_
