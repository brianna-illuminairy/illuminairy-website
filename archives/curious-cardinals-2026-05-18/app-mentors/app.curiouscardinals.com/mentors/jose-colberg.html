xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6294c5a8-274e-4f20-bcf6-58a435385ce9\"}":{"__typename":"Favorites","uuid":"6294c5a8-274e-4f20-bcf6-58a435385ce9","photoUrl":"https://ucarecdn.com/ee4937bc-5f92-49de-86f2-d1b2f4b9ce4e/","title":"Cleveland Cavaliers, enough said","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"2f295bc9-926c-4bcf-bc39-987a52b69f80\"}":{"__typename":"Favorites","uuid":"2f295bc9-926c-4bcf-bc39-987a52b69f80","photoUrl":"https://ucarecdn.com/6ed73071-0327-4878-9aaf-2a720030c236/","title":"Robert De Niro","type":"ACTOR"},"Favorites:{\"uuid\":\"68300faa-082c-455a-b420-cb99af6b574f\"}":{"__typename":"Favorites","uuid":"68300faa-082c-455a-b420-cb99af6b574f","photoUrl":"https://ucarecdn.com/3ca500c0-b53f-4983-8801-e597da50f76d/","title":"Lebron... until he left Cleveland","type":"ATHLETE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6d530d88-1826-4adb-9184-e6aeffa06a67\"}":{"__typename":"DeepDives","uuid":"6d530d88-1826-4adb-9184-e6aeffa06a67","content":"\u003cp\u003eIf I could give myself one piece of advice it would be to focus entirely on task at a time! Time management during the school year can be hard, with so many different commitments requiring your attention. However, it becomes a lot more manageable when you zero in on one thing at a time. If you're going to study, do it whole heartedly. If you're going to hang out, be completely present. If you're going to play sports, enjoy it as an outlet to release built-up tension. You are going to have so much more time to dedicate to the things you love if you dedicate all your attention to the task at hand. Additionally, you'll create a positive habit that will be of use for your entire life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f0ccdd25-735e-40b4-85e5-a737ff0e1d3f\"}":{"__typename":"DeepDives","uuid":"f0ccdd25-735e-40b4-85e5-a737ff0e1d3f","content":"\u003cp\u003eEducation is a continuous process of mentorship. If you think about it, all our lives have been changed for the better by people who dedicated their attention and knowledge towards our learning and improvement. I have always gravitated towards mentorship. I have played basketball all my life, and still do, and spent many summers working as a counselor at a basketball skills camp. Last summer, I gave swimming lessons to children and adults. And throughout middle and high school, I have been tutoring fellow classmates and younger students in a variety of subjects. Mentorship is a vital part of the human experience. I am indebted to all the wonderful mentors I have had growing up, so it is my duty to pay it forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d8070558-c09f-454d-b256-8f0944ceee01\"}":{"__typename":"DeepDives","uuid":"d8070558-c09f-454d-b256-8f0944ceee01","content":"\u003cp\u003eI chose Economics and Government because they were my natural interests. They reason for my interest in these fields probably has a lot to do with the situation of my home, Puerto Rico. For the last 20 years, we have suffered from a stagnant economy which has brought a myriad of social and political problems to the Island. Additionally, I have always been interested in politics and public policy as a means for social development. Education is a lifelong pursuit, so we'll see where life takes me. Until now, however, I believe I have made the right choice of study. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"7d741ee5-b44f-4dcd-856c-612be9b92076\"}":{"__typename":"DeepDives","uuid":"7d741ee5-b44f-4dcd-856c-612be9b92076","content":"\u003cp\u003eAs I high school student, I think I did a good job of balancing my education and social life. I tried to bring a positive energy everyday to school, have good laughs, and continue strengthening bonds with people at my school. I was very involved in the basketball and volleyball teams, as well as in student government and Model United Nations. It wasn't always easy to manage my time, but having many things to do teaches you a lot about time management and interpersonal skills. It also made me more intentional about my free time, which I would make sure to enjoy with my friends and family. I had a blast in high school, and I hope that you make best of your time at school too!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"59ccbe48-a6f7-4b7a-9f49-6a56f721571f\"}":{"__typename":"School","uuid":"59ccbe48-a6f7-4b7a-9f49-6a56f721571f","name":"Colegio San Ignacio de Loyola","city":"San Juan","type":"HIGH","state":"San Juan","country":"Puerto Rico","zip":"00927"},"Education:{\"uuid\":\"95b0fc7e-0aad-4a95-81dc-346c0c4269c9\"}":{"__typename":"Education","uuid":"95b0fc7e-0aad-4a95-81dc-346c0c4269c9","school":{"__ref":"School:{\"uuid\":\"59ccbe48-a6f7-4b7a-9f49-6a56f721571f\"}"},"startYear":"2018","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"00b9669f-5cdc-46d8-a7c1-5f2598c977b4\"}":{"__typename":"Education","uuid":"00b9669f-5cdc-46d8-a7c1-5f2598c977b4","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics, Government","degree":null},"Testimonial:c9213be3-5710-45fa-b117-0553f046d0d9":{"__typename":"Testimonial","id":"c9213be3-5710-45fa-b117-0553f046d0d9","text":"Jose is an amazing mentor! Jose immediately connected with our son, and his motivating, engaging, and positive approach offers exactly the inspiration and guidance that we were seeking! Jose is great at structuring the sessions and pinpointing specific goals and areas of focus. Our son always looks forward to his sessions with Jose, and he comes out of the sessions energized and upbeat!","date":"2025-05-30 00:46:38.443+00","rating":5,"endorser":{"__typename":"Endorser","name":"Kristy","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"a9bba147-a092-4d25-bf83-234f91808fce\"}":{"__typename":"MentorPublicProfile","uuid":"a9bba147-a092-4d25-bf83-234f91808fce","displayName":"Jose C.","slug":"jose-colberg","biography":"\u003cp\u003eHey! I'm Jose! Currently, I'm studying Economics and Government at Harvard University and I am from San Juan, Puerto Rico! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my life, I have always led an active lifestyle. Sports have been a constant for me. I like to play sports (especially basketball), watch the NBA, NFL, or college football, go to the beach (when I'm in Puerto Rico), and hang out with friends! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, my interests naturally lie in reading and writing. In high school, I was heavily involved in student government, Model United Nations, the admissions club, and The National Honor Society. My favorite classes were AP United States History, AP United States Government, British Literature, Introduction to Law, Calculus AB, and Puerto Rican history.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy experience with mentorship is vast and diverse. I started out giving basketball clinics in the summers primarily to elementary and middle schoolers. Around the same time, I began mentoring fellow classmates and younger students as well, and loved accompanying them and bearing witness to their positive transformation. I owe a lot to those who have mentored me, so it is only right that I pay it forward. Besides, I really enjoy it too!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would absolutely love to meet, learn together, and have fun along your academic journey!\u003c/p\u003e","teachingVideoPlaybackId":"pIpOnWRXEiYWOigjXOBFe3nbDIKr93GpnZRo6D2eBBM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6294c5a8-274e-4f20-bcf6-58a435385ce9\"}"},{"__ref":"Favorites:{\"uuid\":\"2f295bc9-926c-4bcf-bc39-987a52b69f80\"}"},{"__ref":"Favorites:{\"uuid\":\"68300faa-082c-455a-b420-cb99af6b574f\"}"}],"causesSupported":[],"major":"Economics, Government","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6d530d88-1826-4adb-9184-e6aeffa06a67\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0ccdd25-735e-40b4-85e5-a737ff0e1d3f\"}"},{"__ref":"DeepDives:{\"uuid\":\"d8070558-c09f-454d-b256-8f0944ceee01\"}"},{"__ref":"DeepDives:{\"uuid\":\"7d741ee5-b44f-4dcd-856c-612be9b92076\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fae087ff-28b7-4e98-ab4e-6d5da6337aee/-/preview/-/format/jpg/","https://ucarecdn.com/d2017374-87a9-4bf6-b69c-3808cb2833b4/-/preview/-/format/jpg/","https://ucarecdn.com/b6bf328a-66fd-47e6-ba80-2f99bb1ab2ae/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"95b0fc7e-0aad-4a95-81dc-346c0c4269c9\"}"},{"__ref":"Education:{\"uuid\":\"00b9669f-5cdc-46d8-a7c1-5f2598c977b4\"}"}],"hiredAt":"2024-09-11T13:38:50.889Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:c9213be3-5710-45fa-b117-0553f046d0d9"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jose-colberg\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a9bba147-a092-4d25-bf83-234f91808fce\"}"}}},"_sentryTraceData":"1333c84444c24d73a56cf9ef3f0f9f27-94e0a5d8193e2754-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1333c84444c24d73a56cf9ef3f0f9f27,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jose-colberg"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" h
