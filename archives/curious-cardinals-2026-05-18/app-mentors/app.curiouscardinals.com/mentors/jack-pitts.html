xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"daf675f5-86ce-4379-adac-f81b056fbc17\"}":{"__typename":"Favorites","uuid":"daf675f5-86ce-4379-adac-f81b056fbc17","photoUrl":"https://ucarecdn.com/a87b3ec7-6ec8-4603-8b01-c4ef614f13cc/","title":"Chicago!","type":"CITY"},"Favorites:{\"uuid\":\"71fb50f4-9691-4e1e-80ec-2105547d7fd6\"}":{"__typename":"Favorites","uuid":"71fb50f4-9691-4e1e-80ec-2105547d7fd6","photoUrl":"https://ucarecdn.com/caf83f66-ec06-4895-a7f5-8db696840dba/","title":"Steph Curry","type":"ATHLETE"},"Favorites:{\"uuid\":\"5001e3fa-31db-4469-b3c6-8c37eb5bf400\"}":{"__typename":"Favorites","uuid":"5001e3fa-31db-4469-b3c6-8c37eb5bf400","photoUrl":"https://ucarecdn.com/efcaf114-aace-4667-83fa-3a41f1b3fa37/","title":"Will Ferrell","type":"ACTOR"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7d945560-7ff6-4054-8a5d-8ac9247faccd\"}":{"__typename":"DeepDives","uuid":"7d945560-7ff6-4054-8a5d-8ac9247faccd","content":"\u003cp\u003eWhen I'm not studying, you'll usually find me out with friends exploring new places! I love traveling and experiencing different cultures, trying local foods, and hunting down the best sushi spots. I'm a huge golf enthusiast and try to hit the links whenever I can - there's nothing better than a round with friends! I also recently got into scuba diving, which has been an incredible way to push myself out of my comfort zone. Whether it's planning the next adventure, grabbing dinner with friends, or just hanging out, I'm always up for making new memories!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e00070f9-ef26-4cbd-bac0-f11e6e3fb2d7\"}":{"__typename":"DeepDives","uuid":"e00070f9-ef26-4cbd-bac0-f11e6e3fb2d7","content":"\u003cp\u003eMentoring is important to me since I personally know how much proper direction can turn your path entirely. Growing up, I made lots of mistakes trying to sort things out on my own and often felt unsure about my road forward. I now want to be the kind of mentor I wish I had, someone who can support students in overcoming obstacles and simultaneously be a friend and resource. Whether it's helping students on their path while having some fun along the way or addressing challenging homework assignments, talking about future goals, or just sharing life events excites me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"57736b1f-51c3-4741-a682-07fa4ea0f17a\"}":{"__typename":"DeepDives","uuid":"57736b1f-51c3-4741-a682-07fa4ea0f17a","content":"\u003cp\u003eAs a middle and high school student, I often was\u0026nbsp;unsure about my future path, constantly questioning what I wanted to do with my life and where I truly fit in. What really made a difference for me was surrounding myself with ambitious friends who encouraged me to grow and challenge myself. While I was not the top of my class, I learned the\u0026nbsp;lesson of surrounding myself with\u0026nbsp;people who could help me reach my full potential. Now, as a Vanderbilt senior studying Economics and Human and Organizational Development (and currently studying abroad in London!), I hope to be the supportive mentor I wished I had when I was young.\u0026nbsp;I've learned that personal growth often results from stepping outside of your comfort zone and having someone there to guide you through the process. I hope\u0026nbsp;to be the type of mentor who not only assists with academic challenges but also serves as a supportive guide for students on their own journeys of self-discovery and growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"cfd8c7dd-8051-46ed-ba6a-8bdce6946b44\"}":{"__typename":"DeepDives","uuid":"cfd8c7dd-8051-46ed-ba6a-8bdce6946b44","content":"\u003cp\u003eI started TrashTroopers during my junior year at Vanderbilt after noticing how much trash accumulated on campus after weekends. What began as just me and a few friends doing weekly cleanups has grown into something much larger than I could have imagined: we now have over 1,000 members spread across multiple universities! We've raised over $25,000 in funding and formed fantastic partnerships with university sustainability offices. But what really excites me isn't just the environmental impact (though picking up thousands of pounds of trash is pretty cool); it's seeing students realize they can make a genuine difference in their community. There's something really powerful about seeing someone go from saying \"someone should do something about this\" to actually taking action. Through TrashTroopers, I've learned that sometimes all a person needs is a little push and support to become their own leader. This is the same philosophy I bring to mentoring: helping others discover their potential to effect positive change while having fun along the way \u0026amp; pursuing their own journeys of self-discovery and growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"45515c3a-80a3-434f-99b0-263d2c42247c\"}":{"__typename":"School","uuid":"45515c3a-80a3-434f-99b0-263d2c42247c","name":"Riverside-Brookfield High School","city":"Riverside","type":"HIGH","state":"Illinois","country":"United States","zip":"60546"},"Education:{\"uuid\":\"8867a19f-4e69-4056-9d68-a1b2f824bf41\"}":{"__typename":"Education","uuid":"8867a19f-4e69-4056-9d68-a1b2f824bf41","school":{"__ref":"School:{\"uuid\":\"45515c3a-80a3-434f-99b0-263d2c42247c\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"5b00f3f9-06e1-436f-9cc7-e2886fdc50af\"}":{"__typename":"Education","uuid":"5b00f3f9-06e1-436f-9cc7-e2886fdc50af","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics \u0026 Human and Organizational Development  ","degree":null},"MentorPublicProfile:{\"uuid\":\"39980514-773a-46c5-aa34-cdc2c1e90b6a\"}":{"__typename":"MentorPublicProfile","uuid":"39980514-773a-46c5-aa34-cdc2c1e90b6a","displayName":"Jack P.","slug":"jack-pitts","biography":"\u003cp\u003eHi! I'm Jack, a Vanderbilt senior double majoring in Economics and Human \u0026amp; Organizational Development and currently studying/working abroad in London until December as an M\u0026amp;A Analyst. Originally from Chicago, I grew up and still to this day LOVE sports, particularly NFL, MLB, NBA, and soccer. \u003cbr\u003e\u003cbr\u003eI am most proud of founding TrashTroopers, a sustainability-focused nonprofit with over 1,000 members across two\u0026nbsp;universities (Vanderbilt and University of Tennessee).  Growing up, I wished I had mentors who could help me navigate academic challenges and life decisions. That experience fuels my passion for mentoring today; I want to be the mentor I needed when I was younger. \u003cbr\u003e\u003cbr\u003eThrough my leadership roles in and building TrashTroopers from the ground up, I have developed my ability to connect with others and break down complex topics into engaging, digestible pieces. I enjoy creating an environment in which students feel comfortable asking questions and exploring new ideas. When I'm not mentoring or working, you can find me on the golf course, watching sports, exploring Europe, or spending time with friends!\u0026nbsp;\u003cbr\u003e\u003cbr\u003eI can't wait to meet you!!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"daf675f5-86ce-4379-adac-f81b056fbc17\"}"},{"__ref":"Favorites:{\"uuid\":\"71fb50f4-9691-4e1e-80ec-2105547d7fd6\"}"},{"__ref":"Favorites:{\"uuid\":\"5001e3fa-31db-4469-b3c6-8c37eb5bf400\"}"}],"causesSupported":[],"major":"Economics \u0026 Human and Organizational Development  ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7d945560-7ff6-4054-8a5d-8ac9247faccd\"}"},{"__ref":"DeepDives:{\"uuid\":\"e00070f9-ef26-4cbd-bac0-f11e6e3fb2d7\"}"},{"__ref":"DeepDives:{\"uuid\":\"57736b1f-51c3-4741-a682-07fa4ea0f17a\"}"},{"__ref":"DeepDives:{\"uuid\":\"cfd8c7dd-8051-46ed-ba6a-8bdce6946b44\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7bb953df-5cb7-4bff-820c-4016941d5f41/-/preview/-/format/jpg/","https://ucarecdn.com/49b8ab6d-6756-4162-92e9-1abc80492b0f/-/preview/-/format/jpg/","https://ucarecdn.com/3a6b0f10-dea6-47ac-b462-31c7b27d4358/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8867a19f-4
