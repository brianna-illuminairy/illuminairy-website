xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1a1452ef-4adf-4534-96db-dcc1e4e01d2d\"}":{"__typename":"DeepDives","uuid":"1a1452ef-4adf-4534-96db-dcc1e4e01d2d","content":"\u003cp\u003eMentorship matters to me because mentors of my past have showed me possibilities I didn't know existed! And more importantly, they showed me that I could achieve them. I have loved being a mentor for others and connecting them to resources and opportunities that bring them joy \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"ed614cc1-9637-4c25-bc1a-927e8660b21a\"}":{"__typename":"DeepDives","uuid":"ed614cc1-9637-4c25-bc1a-927e8660b21a","content":"\u003cp\u003eIn high school, I actually was a STEM student and wanted to be pre-med! I learned that passions can change and it's okay to take big leaps-- like I did when I decided to switch to international relations. And it all works out in the end!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3c7e7647-a4d8-4582-bd1a-d4c6f7ae0bdf\"}":{"__typename":"DeepDives","uuid":"3c7e7647-a4d8-4582-bd1a-d4c6f7ae0bdf","content":"\u003cp\u003eIn my spare time, I love to read. It's my favorite way to learn. I love fiction books that make me appreciate being human, books about international politics and the way the world works, and classics!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1c4c61c5-5f5d-4294-8886-bf007318dac6\"}":{"__typename":"DeepDives","uuid":"1c4c61c5-5f5d-4294-8886-bf007318dac6","content":"\u003cp\u003eMy advice would be to be more confident, dream big, and lean on friends, family, and mentors!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"e5c4e1ca-49b0-4837-916b-5cd67b015121\"}":{"__typename":"School","uuid":"e5c4e1ca-49b0-4837-916b-5cd67b015121","name":"Central Magnet School","city":"Murfreesboro","type":"HIGH","state":"Tennessee","country":"United States","zip":"37130"},"Education:{\"uuid\":\"bd824cb6-4fa9-4794-97e9-2c91b7e1f7a3\"}":{"__typename":"Education","uuid":"bd824cb6-4fa9-4794-97e9-2c91b7e1f7a3","school":{"__ref":"School:{\"uuid\":\"e5c4e1ca-49b0-4837-916b-5cd67b015121\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"df0e2504-4060-4bca-a05d-f8b4bb7e433d\"}":{"__typename":"School","uuid":"df0e2504-4060-4bca-a05d-f8b4bb7e433d","name":"Georgetown University / Columbia University ","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"c912a557-6e34-4ee6-ade7-8c740082b6ef\"}":{"__typename":"Education","uuid":"c912a557-6e34-4ee6-ade7-8c740082b6ef","school":{"__ref":"School:{\"uuid\":\"df0e2504-4060-4bca-a05d-f8b4bb7e433d\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"International Politics ","degree":null},"MentorPublicProfile:{\"uuid\":\"7b109bba-6185-4339-80b8-3fe8369e4b98\"}":{"__typename":"MentorPublicProfile","uuid":"7b109bba-6185-4339-80b8-3fe8369e4b98","displayName":"Cimrun S.","slug":"cimrun-srivastava","biography":"\u003cp\u003eMy name is Cimrun Srivastava and I’m originally from Murfreesboro, Tennessee. I graduated from Georgetown University with a major in International Relations and a minor in Arabic. After graduating, I worked at a democracy NGO working with Members of Parliament from around the world. Now, I’m currently a master’s student (class of 2026) at Columbia University SIPA studying foreign policy and conflict resolution. After I graduate, I will work as a diplomat in the U.S. Foreign Service.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Georgetown, I was the Director of the Student Advocacy Office and a dance choreographer for a South Asian dance showcase. During my time at Georgetown, I worked at a peace-building NGO in Amman, Jordan and taught English to refugees living in Amman. I also interned at the State Department and the Senate Foreign Relations Committee on Capitol Hill. Lastly, I engaged in academic research at a graduate center for Middle Eastern studies.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Columbia, I’m the Vice President of the Conflict Resolution Collective, as well as a student scholar with the Institute for Global Politics. Outside of school, I love to explore New York City, read, paint, crochet, and learn about different cultures.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love to tutor! I value creating meaningful relationships with students and working with their learning styles to help them succeed. I have tutored many students in the college admissions process, helping them find and tell their stories. I also have experience with ACT/SAT tutoring, as well as general academic tutoring. I aim to instill confidence in my students, help them schedule and plan out goals, and use tools to reduce stress.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"5M01UrjQxSIh5ZHFR00XvPNPnLM01My02xlt3jgWYH5e3s00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"International Politics ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1a1452ef-4adf-4534-96db-dcc1e4e01d2d\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed614cc1-9637-4c25-bc1a-927e8660b21a\"}"},{"__ref":"DeepDives:{\"uuid\":\"3c7e7647-a4d8-4582-bd1a-d4c6f7ae0bdf\"}"},{"__ref":"DeepDives:{\"uuid\":\"1c4c61c5-5f5d-4294-8886-bf007318dac6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7757cf27-0072-41ff-8fcd-e7d107914b15/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"bd824cb6-4fa9-4794-97e9-2c91b7e1f7a3\"}"},{"__ref":"Education:{\"uuid\":\"c912a557-6e34-4ee6-ade7-8c740082b6ef\"}"}],"hiredAt":"2025-01-25T01:18:04.210Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Creative Writing","STEM Project","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"cimrun-srivastava\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7b109bba-6185-4339-80b8-3fe8369e4b98\"}"}}},"_sentryTraceData":"14ce2afc44b140fd93a148dfccc94ef6-994b584640492c38-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=
