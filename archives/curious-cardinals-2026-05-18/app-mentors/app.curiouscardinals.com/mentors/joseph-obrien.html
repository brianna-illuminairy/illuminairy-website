xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1d79fed5-9483-4d44-be16-67dab205fd38\"}":{"__typename":"DeepDives","uuid":"1d79fed5-9483-4d44-be16-67dab205fd38","content":"\u003cp\u003eIt's important to be well rounded \u003cstrong\u003eand\u003c/strong\u003e to be aware when a passion deserves more attention. Sometimes it feels like in order to be good at something we need to devote all of our time to it. At the same time, we need to diversify our interests to life a nice life. I would tell my younger  self to (1) continue working on the projects that you love (2) but avoid using those projects to rationalize why you \u003cstrong\u003eshouldn't\u003c/strong\u003e do something else. And most importantly, be a kind friend to everyone so that you can truly enjoy yourself and others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a24face9-79ac-44c5-a032-64ecdcb11090\"}":{"__typename":"DeepDives","uuid":"a24face9-79ac-44c5-a032-64ecdcb11090","content":"\u003cp\u003eIf you asked me when I was in middle school it was footballer Ray Lewis. Then, in high school, it was marathoner Eliude Kipchoge. Today, I still look up to those two but have begun to look up to Chilean biologist and philosopher Francisco Varela. Who is he? \u003c/p\u003e\u003cbr\u003e\u003cp\u003eVarela was one of the most important thinkers of the late 20th century. He was a leading biologist, cognitive scientist, and social commentator. I look up to him because he, with altruistic intentions, cross disciplines and digested fields of knowledge with curiosity and an open mind. So many academics can take defensive postures to ensure a secure career. While this makes sense, it doesn't help people collectively learn. Varela actually modeled and benefited from interdisciplinary thinking. For these reasons I look up to him!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a17a53a4-1f80-4586-b08c-e8de1a08c5af\"}":{"__typename":"DeepDives","uuid":"a17a53a4-1f80-4586-b08c-e8de1a08c5af","content":"\u003cp\u003eMentorship matters to me because there is so much to learn from one another. The only reason, as I see it, that I'm called the \"mentor\" is that I'm just a tiny bit older than my mentees. My primary intention is to listen to my mentees, learn from them, and ask questions, provide suggestions, and lead reflective exercise as necessary. I believe that every student has the potential to enjoy the learning and project process, so all I hope to do is assist sparking and tending to that flame. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"9a93e4f5-7658-45cf-a48f-29d795c92656\"}":{"__typename":"School","uuid":"9a93e4f5-7658-45cf-a48f-29d795c92656","name":"Horace Greeley High School","city":"Chappaqua","type":"HIGH","state":"New York","country":"United States","zip":"10514"},"Education:{\"uuid\":\"00c76d03-2883-45d1-ade7-1d62822b5245\"}":{"__typename":"Education","uuid":"00c76d03-2883-45d1-ade7-1d62822b5245","school":{"__ref":"School:{\"uuid\":\"9a93e4f5-7658-45cf-a48f-29d795c92656\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"b03147bf-7181-44c8-9aa8-627dc0f797ea\"}":{"__typename":"Education","uuid":"b03147bf-7181-44c8-9aa8-627dc0f797ea","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Environmental Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"17dc3c7a-cfba-4fbb-a0f9-b28e9770239c\"}":{"__typename":"MentorPublicProfile","uuid":"17dc3c7a-cfba-4fbb-a0f9-b28e9770239c","displayName":"Joseph O.","slug":"joseph-obrien","biography":"\u003cp\u003eHi!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Joseph (you can call me Joe or Joseph), and I'm a recent Brown University Environmental Studies graduate. I care about creating sustainable socio-ecological systems made to help people and our planet!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, I competed on a D1 cross country and track and field team, worked for an AI and Library innovation education group, organized a Climate Negotiations conference, and helped change Brown's business ethics policy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the second photo, I'm eating ice cream with my dear older brother Kevin and to the right I'm \"hugging\" a 2700 year old tree! I love running on trails, eating blueberries, napping on the couch, meditating, and making coffee-shop friends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm now out of college doing culinary work for a seed company in NY's Hudson Valley and (fun fact) I've convinced my uncle to take Harp lessons with me in NYC, which I'm quite excited about.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environmental Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1d79fed5-9483-4d44-be16-67dab205fd38\"}"},{"__ref":"DeepDives:{\"uuid\":\"a24face9-79ac-44c5-a032-64ecdcb11090\"}"},{"__ref":"DeepDives:{\"uuid\":\"a17a53a4-1f80-4586-b08c-e8de1a08c5af\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/800ecb7f-905b-4c51-8926-94ed3d599cad/-/preview/-/format/jpg/","https://ucarecdn.com/fc73e0e7-74ad-4f8e-ba2e-39c6ee61b606/-/preview/-/format/jpg/","https://ucarecdn.com/fdc66ff1-3f11-4a2a-8df2-855703aae704/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"00c76d03-2883-45d1-ade7-1d62822b5245\"}"},{"__ref":"Education:{\"uuid\":\"b03147bf-7181-44c8-9aa8-627dc0f797ea\"}"}],"hiredAt":"2024-09-04T09:28:23.665Z","topics":["History","Philosophy","Sustainability","Law / Government / Policy","Writing","6-8 Grade Science","Reading","Geography","Academic Coaching"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"joseph-obrien\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"17dc3c7a-cfba-4fbb-a0f9-b28e9770239c\"}"}}},"_sentryTraceData":"25549717e9b64bf09ab910fc3a838b54-bd053a742ea16397-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=25549717e9b64bf09ab910fc3a838b54,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=
