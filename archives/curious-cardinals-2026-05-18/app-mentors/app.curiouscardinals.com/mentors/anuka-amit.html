xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b23ab9fc-6cc5-4f02-bb2e-a7691ea9ea36\"}":{"__typename":"Favorites","uuid":"b23ab9fc-6cc5-4f02-bb2e-a7691ea9ea36","photoUrl":"https://ucarecdn.com/9b751fac-23ac-44c6-8e05-a72992d26699/","title":"Teen Dream- Beach House","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"11d205bf-e71d-452d-b110-de76864ca127\"}":{"__typename":"DeepDives","uuid":"11d205bf-e71d-452d-b110-de76864ca127","content":"\u003cp\u003eYou will not be good at every subject and that is okay! Understanding what clicks and what doesn't is an important step to finding your passion in life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"87493192-9a45-45dc-85c5-02fe3a59b29a\"}":{"__typename":"DeepDives","uuid":"87493192-9a45-45dc-85c5-02fe3a59b29a","content":"\u003cp\u003eMentorship is the reason I am where I am today. If it were not for my role models, professors and people that I look up to I would not have a roadmap of where to go. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"3999c010-d14b-44de-acca-dee8a340a22e\"}":{"__typename":"DeepDives","uuid":"3999c010-d14b-44de-acca-dee8a340a22e","content":"\u003cp\u003eI hope to make positive steps towards advancing global energy justice and equitable climate solutions for everyone. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"121d1a38-4503-451e-8d2b-17d209c13bc4\"}":{"__typename":"DeepDives","uuid":"121d1a38-4503-451e-8d2b-17d209c13bc4","content":"\u003cp\u003eI chose my major because I was really good at (and really loved) history, writing, AP Literature and Language and always had a systems-thinking approach. I liked international affairs because it sees the big picture in everything. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"58b62f40-c9f5-41f1-837b-be88e5cf2a6a\"}":{"__typename":"School","uuid":"58b62f40-c9f5-41f1-837b-be88e5cf2a6a","name":"BASIS Scottsdale","city":"Scottsdale","type":"HIGH","state":"Arizona","country":"United States","zip":"85259"},"Education:{\"uuid\":\"01a7cc23-214f-4d44-89de-b2e73e545e42\"}":{"__typename":"Education","uuid":"01a7cc23-214f-4d44-89de-b2e73e545e42","school":{"__ref":"School:{\"uuid\":\"58b62f40-c9f5-41f1-837b-be88e5cf2a6a\"}"},"startYear":"2011","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"42b19aeb-ad33-45fa-a162-db4fd978d7db\"}":{"__typename":"School","uuid":"42b19aeb-ad33-45fa-a162-db4fd978d7db","name":"The George Washington University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20052"},"Education:{\"uuid\":\"f6cd93c6-1c73-4329-a168-d3b3bc2376d5\"}":{"__typename":"Education","uuid":"f6cd93c6-1c73-4329-a168-d3b3bc2376d5","school":{"__ref":"School:{\"uuid\":\"42b19aeb-ad33-45fa-a162-db4fd978d7db\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"International Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"8230b818-32d2-449f-9a4d-a7832a6ea841\"}":{"__typename":"MentorPublicProfile","uuid":"8230b818-32d2-449f-9a4d-a7832a6ea841","displayName":"Anuka A.","slug":"anuka-amit","biography":"\u003cp\u003eAnuka Upadhye is a graduate of Columbia University and George Washington University, and focuses on international environmental law and policy. Anuka is a global thinker and doer, and is never afraid to think creatively, collaboratively, and expansively.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUpon graduating high school, Anuka studied International Affairs at George Washington University in the heart of the nation's capital, affording her several opportunities to be at the center of policymaking institutions. As a driven young policy professional, Anuka has worked at government agencies such as the House of Representatives Foreign Affairs Committee and the White House; for numerous congressional campaigns like Bernie Sanders and Cori Bush; and prestigious think tanks like the Woodrow Wilson Center for International Scholars and The Center for American Progress. Some highlights from her internships include meeting President Joe Biden, working on real-time foreign policy issues at HFAC through hearings and policy briefs, and publishing a report on policy recommendations for the Biden Administration on tribal conservation while getting to work with tribes on best practices. In 2020, Anuka and her friends started an initiative from scratch called The Polling Place, where voters can access accurate, nonpartisan information about candidates in local elections. Anuka received a Fulbright Scholarship to India where she studied the impacts of climate change on vulnerable local fishing communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past year, Anuka completed a master's at Columbia's Climate School, and is deeply interested in pursuing a career in international environmental law and policy to advocate for transformative, equitable laws that confront climate change. During her master’s at Columbia, she worked on creating climate action plans for municipalities in Chile, conducted research on forecasting information for smallholder farmers in Guatemala, and advised an India-based think tank on climate finance and circular economy solutions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you are looking for guidance with an advocacy-related passion project (or any self-led creative project), speech writing, public speaking, college essays, and more, Anuka has proven experience winning scholarships, getting into competitive educational programs and internships, and advancing opportunities through her ability to tell powerful, persuasive stories. She is good at breathing life into ideas and opportunities that seem impossible. She is also a proficient writer and researcher and has won awards for short story writing. One of her final essays in her master’s program was broadcasted as the best in the cohort.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, Anuka is road biking or swimming! Or probably hiking a mountain or scuba diving. She loves writing in her substack, reading books on the subway and exploring new countries. Anuka will be working at the US-ASEAN Business Council this upcoming year on international trade, climate, and energy policy.\u003c/p\u003e","teachingVideoPlaybackId":"X1KUnc68EzB9YUurV5i9mtZgh1crCGpkun6Nh5FAdLQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b23ab9fc-6cc5-4f02-bb2e-a7691ea9ea36\"}"}],"causesSupported":[],"major":"International Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"11d205bf-e71d-452d-b110-de76864ca127\"}"},{"__ref
