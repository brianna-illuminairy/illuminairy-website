xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0a4cbbbf-ff26-4b18-ace5-7f6e6735b2f4\"}":{"__typename":"DeepDives","uuid":"0a4cbbbf-ff26-4b18-ace5-7f6e6735b2f4","content":"\u003cp\u003eI owe my functional life to modern biomedical breakthroughs. After a sledding accident shattered my ankle and tore my PCL, Dr. Jorge Chahla used a ground breaking repair technique to stabilize my knee, and another surgeon applied bone grafting to rebuild my ankle. In physical therapy, I recovered with the help of anti‑gravity treadmills, blood‑flow‑restriction cuffs, and electronic muscle stimulators. Witnessing each device and procedure ignite healing sparked my curiosity about how engineering and medicine intersect. That curiosity led me to serve as a medical assistant at Loyola Hospital last summer. I observed physicians and students using ultrasounds, ophthalmoscopes, and other diagnostic tools, and I found myself constantly asking how each instrument worked, why it mattered, and how it could be improved. By the end of my experience, biomedical engineering had transformed from an interest into my calling. This past year at Dule, I participated in the First‑Year Design course where I collaborated on prototype development from day one, learning to solve real clinical problems with durable, realistic solutions. Biomedical engineering has allowed me to approach challenges from every angle. My experience in research programs showed me the power of hands‑on learning. By blending my passion and my resilience as a patient, I’m determined to push the boundaries of biomedical innovation and improve lives.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b47368d0-f29f-40d2-8ed4-1a53ce4e11b4\"}":{"__typename":"DeepDives","uuid":"b47368d0-f29f-40d2-8ed4-1a53ce4e11b4","content":"\u003cp\u003eIf I could tell my younger self one thing, it would be: don’t be afraid to try new things. Whether it’s joining my high school’s radio station, signing up for the math team, or taking the hardest classes offered, every new experience teaches you something. If you keep an open mind, you will learn about the world, your strengths, and what truly excites you. Stepping outside your comfort zone builds confidence, reveals unexpected passions, and often leads to opportunities you never imagined. So go ahead and explore, experiment, and embrace the unknown. You’ll grow in ways you can’t predict.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2d3dc672-3ea4-4e7e-b5ad-bb38c98e75f5\"}":{"__typename":"DeepDives","uuid":"2d3dc672-3ea4-4e7e-b5ad-bb38c98e75f5","content":"\u003cp\u003eMentorship has been instrumental in my life because it’s exposed me to experts in the field and bridged the gap between where I am and where I want to be. Mentors I’ve had include graduate research students in the lab, coaches in sports, and upperclassmen sharing their stories. They didn’t just share knowledge; they modeled resilience, curiosity, and compassion. These relationships taught me that learning isn’t a solo journey. A mentor spots the blind spots you can’t see, challenges you to think bigger, and celebrates your growth along the way. In turn, I’ve logged over 250 hours of tutoring and taken leadership roles in Best Buddies and Special Olympics because I want to pay that forward, helping someone else gain the confidence, insight, and support that made all the difference in my life. Mentorship creates a ripple effect: by lifting one person, we lift entire communities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cc9586eb-132b-4255-83d3-cb2c370599d4\"}":{"__typename":"DeepDives","uuid":"cc9586eb-132b-4255-83d3-cb2c370599d4","content":"\u003cp\u003eIn my spare time, I love staying active and engaged. I’m a huge sports fan and play on Duke’s Club Pickleball Team, and I’ve even camped out for front-row basketball tickets at Cameron Indoor Stadium. Outside of sports, I enjoy volunteering with Best Buddies and Special Olympics.\u003c/p\u003e\u003cp\u003eWhen I’m not on the court or at an event, you’ll probably find me at the gym, playing pickup basketball with friends, or grabbing Chick-fil-A. I’m also a big fan of binge-watching sitcoms, playing pinball machines, and managing my fantasy football team. I love exploring downtown areas and trying new things whenever I get the chance.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"8d26ad1d-71eb-47b5-8a82-12eff2ce24a6\"}":{"__typename":"School","uuid":"8d26ad1d-71eb-47b5-8a82-12eff2ce24a6","name":"Lyons Township High School North Campus","city":"La Grange","type":"HIGH","state":"Illinois","country":"United States","zip":"60525"},"Education:{\"uuid\":\"3ef8193a-082a-4628-9091-12d4254fb275\"}":{"__typename":"Education","uuid":"3ef8193a-082a-4628-9091-12d4254fb275","school":{"__ref":"School:{\"uuid\":\"8d26ad1d-71eb-47b5-8a82-12eff2ce24a6\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"734117fb-73e6-4fea-85a0-ec81152568d0\"}":{"__typename":"Education","uuid":"734117fb-73e6-4fea-85a0-ec81152568d0","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"55367692-9434-4e66-b75f-f1a6cd816aaf\"}":{"__typename":"MentorPublicProfile","uuid":"55367692-9434-4e66-b75f-f1a6cd816aaf","displayName":"Mark D.","slug":"mark-demonte","biography":"\u003cp\u003eHi everyone! I am Mark DeMonte, a rising sophomore at Duke University majoring in Biomedical Engineering on the pre‑med track. My path toward medicine started my freshman year of high school, when I was in a severe sledding accident and doctors didn’t know if I would be able to walk again. After two years, five surgeries, and hundreds of hours in physical therapy, I was able to return to a functional life. I was blessed to witness the heroics of doctors, nurses, physical therapists, and other great people who dedicate their lives to helping others, and they’ve inspired me to do the same.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a tissue recipient, I’m appreciative of the resources that made me a medical outlier. In my last year of high school, I wanted to give back to the program that allowed me to return to a functional life, and I created a program that educates thousands of community members on the importance of donorship. I partnered with the Illinois Secretary of State and the Head of the Organ and Tissue Registry. There are now over 40 schools across Illinois implementing my program. I was awarded an Illinois Certificate of Appreciation for “My service to others in saving and enhancing lives through dedication to organ/tissue donation.” Each donor can change up to 75 lives, so every person makes a difference. I am currently working at Segura Lab as a research assistant, researching regenerative medicine to find ways to restore function in damaged tissue.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was involved with two research projects in high school as well, a project through Argonne National Laboratory where I conducted research on PFAs (forever chemicals), and a project through the Illinois Math and Science Coalition, where I presented my research on the effects of chewing gum on studying at their 9th Annual Student Research Showcase in Chicago. Next year, I will be a team lead through Duke’s Bass Connections program on transitioning adults with mental differences to independent living.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, I serve as Special Olympics president, Best Buddies program manager, and executive board member of Club Pickleball. In each of these clubs, I am tasked with planning events, handling logistics, and mentoring new members. Beyond academics and extracurriculars, I’m an avid sports fan (I’ve camped out for front‑row basketball tickets in Duke’s legendary Cameron Stadium). Academically, I’m a National Merit Scholar, AP Scholar with Distinction, and Illinois State Scholar. I’ve won many awards including Social Service Student of the Year, Math Student of the Year, and Science Leadership Student of the Year among over 4,000 students for my work tutoring.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWith over 250 hours teaching STEM subjects from algebra, calculus, chemistry, biology, and more, I’m excited to collaborate and share my expertise.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"aHKgRJG96l00VLEKrkA02M2UlWH7VsQcz4yoGwYfJn1yo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0a4cbbbf-ff26-4b18-ace5-7f6e6735b2f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"b47368d0-f29f-40d2-8ed4-1a53ce4e11b4\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d3dc672-3ea4-4e7e-b5ad-bb38c98e75f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"cc9586eb-132b-4255-83d3-cb2c370599d4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7469805e-f931-4a90-94e3-b7d3fb87d79f/-/preview/-/format/jpg/","https://ucarecdn.com/4e0eecb0-f8f2-4f99-a295-8690b1fa9bf2/-/preview/-/format/jpg/","https://ucarecdn.com/76caf0f1-41e6-4c03-8780-cae88d4eca54/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"3ef8193a-082a-4628-9091-12d4254fb275\"}"},{"__ref":"Education:{\"uuid\":\"734117fb-73e6-4fea-85a0-ec81152568d0\"}"}],"hiredAt":"2025-04-30T11:01:05.335Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Biology","Chemistry","Physics","Writing","Academic Coaching","College Essay Writing","Executive Function","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mark-demonte\"}})":{"__ref":"MentorPublicProfile:{\
