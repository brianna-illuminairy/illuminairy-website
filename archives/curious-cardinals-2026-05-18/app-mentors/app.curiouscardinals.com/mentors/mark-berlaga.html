not most people's favorite, but it actually inspired me to start playing guitar.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"498680d7-38a1-4690-b8b1-78f006893537\"}":{"__typename":"DeepDives","uuid":"498680d7-38a1-4690-b8b1-78f006893537","content":"\u003cp\u003eIn addition to training four hours a day for gymnastics, I shadowed doctors and volunteered at hospitals during the summer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"439406a8-aeaf-4b56-bc28-3c89055a7234\"}":{"__typename":"DeepDives","uuid":"439406a8-aeaf-4b56-bc28-3c89055a7234","content":"\u003cp\u003eI was very social but also had big academic and athletic dreams. I had to realize that I needed to prioritize the things that were most important to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"f309c50f-b9a4-45eb-9811-bbf23d2a8d17\"}":{"__typename":"School","uuid":"f309c50f-b9a4-45eb-9811-bbf23d2a8d17","name":"Henry M Gunn High School","city":"Palo Alto","type":"HIGH","state":"California","country":"United States","zip":"94306"},"Education:{\"uuid\":\"5be93c4a-ace7-4c15-b0f3-c845156c6430\"}":{"__typename":"Education","uuid":"5be93c4a-ace7-4c15-b0f3-c845156c6430","school":{"__ref":"School:{\"uuid\":\"f309c50f-b9a4-45eb-9811-bbf23d2a8d17\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"11804900-e101-410d-a550-85110af5b2e0\"}":{"__typename":"Education","uuid":"11804900-e101-410d-a550-85110af5b2e0","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"54e48a21-6b49-46a8-b0f9-c125f7bd5310\"}":{"__typename":"MentorPublicProfile","uuid":"54e48a21-6b49-46a8-b0f9-c125f7bd5310","displayName":"Mark B.","slug":"mark-berlaga","biography":"\u003cp\u003eHi! My name is Mark Berlaga, and I’m a recent graduate of Stanford University, where I majored in Biology. I’m currently taking a gap year before starting medical school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, I was a member of the Division I Men’s Gymnastics Team, where I became an All-American and National Champion. I’ve loved every second out on the competition floor, not just because doing handstands and flips is awesome, but because I thrive in a team-centered environment and enjoy achieving shared goals built over years of hard work.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also deeply passionate about science and medicine and spent several years at Stanford researching HIV antibodies and their role in preventative vaccines. I’ve learned a lot about the scientific process, from framing a hypothesis to analyzing data, and I love teaching others how to design and carry out projects like this. I completed a fully developed honors thesis as the capstone to my research.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition, I’ve volunteered for hundreds of hours at the VA Hospitals in Palo Alto and Menlo Park, where I assisted nurses prepare patients for surgery and performed social visits with veterans in long-term care. These experiences taught me the importance of compassionate care and the understanding that each patient carries lived experiences not visible at first glance.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEarly on, I began shadowing physicians and quickly became captivated by the fast-paced, thoughtful decision-making I saw in the Emergency Department. That experience inspired me to earn my EMT certification, and I’m excited to begin working during my gap year.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOver time, I’ve developed a strong passion for teaching and mentorship. I began by tutoring elementary and middle school students in reading, writing, and math. As I watched them reach their academic goals, I expanded to peer tutoring at Stanford, where I helped fellow students break down complex topics into manageable parts. Coaching has also been a fundamental part of my journey; it’s incredibly fulfilling to help younger athletes reach their athletic goals. I also served as a mentor with Athletes in Medicine at Stanford, supporting younger student-athletes as they navigated the challenges of pre-med coursework and competing at a high level.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI understand that big goals can sometimes feel out of reach—but dreaming big is the first step. I’m here to help take the next one. Whether it’s helping a student tackle tough subjects or guiding them through a project that inspires them, I’m excited to be part of their journey as a Curious Cardinals mentor!\u003c/p\u003e","teachingVideoPlaybackId":"TEIUdTCQyQhFvS02KtkKNKDGDMX802GsKLB7mqKDObv8k","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOn the Stanford Men's Gymnastics team, I earned All-American status three times on rings, helping my team win five NCAA national championships in a row.\u00
