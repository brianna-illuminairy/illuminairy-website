xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e612905c-1d34-44f4-8c92-5573b0126bfa\"}":{"__typename":"Favorites","uuid":"e612905c-1d34-44f4-8c92-5573b0126bfa","photoUrl":"https://ucarecdn.com/0399ccc3-e88e-494e-beb6-2a9c81136f65/","title":"Gymnastics","type":"SPORT"},"Favorites:{\"uuid\":\"ca85710a-8847-4a67-b687-3c51a7470912\"}":{"__typename":"Favorites","uuid":"ca85710a-8847-4a67-b687-3c51a7470912","photoUrl":"https://ucarecdn.com/05c1e329-c0e3-4b78-bf67-1c87d3685119/","title":"Simone Biles","type":"ATHLETE"},"Favorites:{\"uuid\":\"97ee84a2-3db6-45d4-ab25-ad19d5d28a2e\"}":{"__typename":"Favorites","uuid":"97ee84a2-3db6-45d4-ab25-ad19d5d28a2e","photoUrl":"https://ucarecdn.com/0faf0012-b13f-4260-be55-63157307cc4d/","title":"Chicago","type":"CITY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f1db4a7b-7823-4f34-8bcc-7a2792f8f09f\"}":{"__typename":"DeepDives","uuid":"f1db4a7b-7823-4f34-8bcc-7a2792f8f09f","content":"\u003cp\u003eI have been doing gymnastics since I was 3 years old! Every summer I did competitive gymnastics camp from 9am-4pm 6 days a week until I was 18! However, during COVID-19, my training schedule changed significantly, and I started to dedicate my summers to running a project aimed at translating homeless youth resources into Spanish for hispanic children all over the country who made need it. Ask me about it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"4e703f3a-51d7-468b-b1b4-01479e05b2da\"}":{"__typename":"DeepDives","uuid":"4e703f3a-51d7-468b-b1b4-01479e05b2da","content":"\u003cp\u003eWhat I’m most proud of is founding \u003cem\u003eClaro Que Sí\u003c/em\u003e, Yale’s first Latine magazine. I saw a gap in representation on campus and turned it into a platform that now uplifts dozens of voices, circulates hundreds of copies, and celebrates the depth and diversity of Latine experiences. Building it from scratch by leading the team, fundraising, editing, and designing the first 4 editions, taught me the power of storytelling as a form of activism and community. It’s been one of the most meaningful projects of my life. I am proud that my Latina heritage has made a lasting impact on Yale's campus.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"90e9dbba-a2f3-440b-a225-172dfbe20392\"}":{"__typename":"DeepDives","uuid":"90e9dbba-a2f3-440b-a225-172dfbe20392","content":"\u003cp\u003eMentorship matters to me because I’ve seen firsthand how powerful it is when a young person feels seen, supported, and believed in. As a gymnastics coach—especially working with girls in a Special Olympics gym—I witnessed how much more meaningful it was to guide them beyond just physical skills. The real magic was in helping them find confidence, resilience, and joy in themselves. Whether it’s on the mat or in the classroom, I mentor to help kids light up—not just because they’ve learned something, but because they’ve \u003cem\u003ebecome\u003c/em\u003e something in the process.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"6e531bba-aaf3-4e8e-8bbd-c95f8aa6cf38\"}":{"__typename":"School","uuid":"6e531bba-aaf3-4e8e-8bbd-c95f8aa6cf38","name":"Coral Reef High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33157"},"Education:{\"uuid\":\"2c7af154-d224-4925-b89b-4449b1d64d59\"}":{"__typename":"Education","uuid":"2c7af154-d224-4925-b89b-4449b1d64d59","school":{"__ref":"School:{\"uuid\":\"6e531bba-aaf3-4e8e-8bbd-c95f8aa6cf38\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"5a28cda5-8b5a-4fe5-af2e-37b9202ebde6\"}":{"__typename":"Education","uuid":"5a28cda5-8b5a-4fe5-af2e-37b9202ebde6","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Political Science and Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"353cfadf-bc6e-4abd-a2e5-bad667a25201\"}":{"__typename":"MentorPublicProfile","uuid":"353cfadf-bc6e-4abd-a2e5-bad667a25201","displayName":"Paloma V.","slug":"paloma-vigil","biography":"\u003cp\u003eHi! I’m Paloma, a Miami native, Yale graduate, and teacher since the age of 6 (that is when I taught my brother to read). I grew up in a big Cuban-American family of 6 where curiosity, storytelling, and caring deeply were part of daily life. I’ve always been someone who loves learning across subjects, from solving tricky math problems to analyzing a character’s arc in a play to writing my own stories. That love for learning—and helping others love it too—is at the heart of why I mentor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I studied Psychology and Political Science (with distinction in both!) and dove into everything from economics to journalism to child development. I’ve interned at the White House, conducted research on how kids think, founded Yale’s first Latine magazine, and led teams of over 200 people for social impact projects. But what brings me the most joy is working one-on-one with students and helping them find clarity, confidence, and excitement in whatever they’re studying.\u003c/p\u003e\u003cp\u003eI mentor in K-5 Math, Journalism, Algebra, Geometry, Biology, Spanish, Writing, Public Speaking, Debate, History, Creative Storytelling, College Essays, Academic Coaching, Passion Projects, and more. Whether I’m breaking down a tough concept or helping a student brainstorm an epic storyline, I bring energy, empathy, and structure. Sessions with me are collaborative and engaging—part strategy, part creative jam session, and always a confidence boost.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of mentoring, I coach gymnastics, geek out in art museums, and help my three younger siblings with cooking, book recs, and life in general. My friends would describe me as driven, Type A, warm, and fiercely loyal—with a knack for making people feel heard.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe every student has brilliance inside of them. My job is to help them tap into it, whether they’re aiming to ace a class, tell their story, or simply fall in love with learning again.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI make learning joyful, purposeful, personal, and natural.\u003c/p\u003e","teachingVideoPlaybackId":"HYCDaOTfJaHB601mIupQM01b00XuUkNTmDuXj2XkUbJGmQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e612905c-1d34-44f4-8c92-5573b0126bfa\"}"},{"__ref":"Favorites:{\"uuid\":\"ca85710a-8847-4a67-b687-3c51a7470912\"}"},{"__ref":"Favorites:{\"uuid\":\"97ee84a2-3db6-45d4-ab25-ad19d5d28a2e\"}"}],"causesSupported":[],"major":"Political Science and Psychology","deepDives":[
