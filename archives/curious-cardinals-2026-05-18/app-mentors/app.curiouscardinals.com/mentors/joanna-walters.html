hool:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2282cc10-7600-462d-8b72-f2f60c714a41\"}":{"__typename":"MentorPublicProfile","uuid":"2282cc10-7600-462d-8b72-f2f60c714a41","displayName":"Joanna W.","slug":"joanna-walters","biography":"\u003cp\u003eHi! My name is Joanna and I am a senior at Harvard College, studying Computer Science and Economics with a citation in Spanish. My passions, however, extend far beyond coding. As the daughter of two Hispanic immigrants, I have always understood the power of hard work, resilience, and carving out your own path-even when it does not fit traditional expectations. While I have spent my four years of college navigating the worlds of technology and business, my true passion lies in fashion and entertainment.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs the Fashion Director for a student-led fashion show on campus, I have had the opportunity to bring bold creative visions to life-curating looks, securing and maintaining brand partnerships, and ensuring that every detail aligns with the theme and message of our show. My background deeply influences my approach to fashion, allowing me to blend personal identity with artistic expression.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond fashion, I have been actively involved in women’s communities at Harvard, including Women in Computer Science and Women in Business. These experiences have reinforced my passion for mentorship, leadership, and creating space for unrepresented voices. One of my most impactful leadership roles was serving as Co-Chair of the Intercollegiate Business Convention (IBC)-one of the largest student run conferences in the US. IBC attracts around 1,000 registrants from around the world, featuring inspiring keynote speakers and industry leaders. Overseeing the committee and executing this conference taught me invaluable skills in organization, teamwork, and strategic planning, insights I’d love to share with students on Curious Cardinals!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship has been a core part of my journey. During all four years of high school, I served as a mentor for Big Brother Big Sister, working closely with students from grades K-6. While I helped shape the foundation of their personal and academic growth, they also taught me the importance of patience, compassion, and humor-skills I continue to apply in every mentorship role I take on,\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I love sewing, crocheting, reading, and keeping up with the latest fashion trends. Whether you are passionate about fashion, curious about business, or looking to break into tech, I would love to help you navigate your path with confidence. My goal is to empower students to embrace their unique talents, take on challenges fearlessly, and carve out their own spaces in the world. If you are searching for a mentor who will champion your growth while making learning engaging and exciting, I’d love to work with you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f0ab502f-455d-4cce-81a1-d4b9fc3363f6\"}"},{"__ref":"Favorites:{\"uuid\":\"4bf13f31-6a79-4a70-bd70-3e34435d2656\"}"},{"__ref":"Favorites:{\"uuid\":\"d51980a7-a755-47f4-b483-ae8f9027478f\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/966b3146-e1b6-473d-9590-b075071c8ed1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"70759277-927e-406d-b48e-7cc9f73ed260\"}"},{"__ref":"Education:{\"uuid\":\"4
