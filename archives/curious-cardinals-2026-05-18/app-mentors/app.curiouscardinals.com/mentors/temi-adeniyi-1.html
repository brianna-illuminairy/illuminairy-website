xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"89afebf0-6fdc-4ca1-be8a-bd896d8386c2\"}":{"__typename":"Favorites","uuid":"89afebf0-6fdc-4ca1-be8a-bd896d8386c2","photoUrl":"https://ucarecdn.com/df769c8e-b7a0-44da-bd37-a21de3c6b818/","title":"Mariah Carey","type":"ARTIST"},"Favorites:{\"uuid\":\"6df61fdf-b9db-472b-b718-fc4a532997e1\"}":{"__typename":"Favorites","uuid":"6df61fdf-b9db-472b-b718-fc4a532997e1","photoUrl":"https://ucarecdn.com/df769c8e-b7a0-44da-bd37-a21de3c6b818/","title":"Minecraft","type":"GAME"},"Favorites:{\"uuid\":\"a0db2ce5-a8d0-4ec8-9d78-53490e92d22f\"}":{"__typename":"Favorites","uuid":"a0db2ce5-a8d0-4ec8-9d78-53490e92d22f","photoUrl":"https://ucarecdn.com/df769c8e-b7a0-44da-bd37-a21de3c6b818/","title":"Beauty and the Beast","type":"MOVIE"},"CausesSupported:{\"uuid\":\"43c91d31-0406-46ef-9e80-bdcd678c6887\"}":{"__typename":"CausesSupported","uuid":"43c91d31-0406-46ef-9e80-bdcd678c6887","name":"Service for Sight","description":"\u003cp\u003eVolunteering at the Blind Children's Center and philanthropic events.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/10c57cd1-4dc8-49f0-9beb-d6085a59875b/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a687fb64-80f7-4e40-a72e-f917f868788e\"}":{"__typename":"DeepDives","uuid":"a687fb64-80f7-4e40-a72e-f917f868788e","content":"\u003cp\u003eI would advise my middle school and high school self to slow down and stop to smell the roses. While I mean that figuratively, I think savoring both the high school experience would’ve helped me foster deeper relationships and take in every experience at hand. These times only happen once and while it felt like forever, these phases of my life helped me be a better friend, daughter and sister, student, and most importantly, person; I can only imagine that in taking just a little more time, how my experience would’ve expounded for the better.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4a189ea7-baa7-4c8e-a6b0-1ebd4eaa008d\"}":{"__typename":"DeepDives","uuid":"4a189ea7-baa7-4c8e-a6b0-1ebd4eaa008d","content":"\u003cp\u003eComputer Science is a field that is often approached through a technical and theoretical lens and while that is important, It’s equally important to understand the ethical, moral, sustainable, and human-interactive practices that go into making programs. As someone who wants to go into the fields of software development and game development/design, It is imperative to learn how these aspects blend into implementing programs and building games so that they can be in alignment with moral practices and be more immersive/interactive. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"6c58de3a-2509-4772-8929-0494064a0402\"}":{"__typename":"DeepDives","uuid":"6c58de3a-2509-4772-8929-0494064a0402","content":"\u003cp\u003eIt might sound cliche, but my greatest role model would be my sister. She has always been my other half, helping and inspiring me to be the best version of myself since we were little. She has always been there for me, comforting me in the bad times and making me smile, laugh, and grow my confidence in the good times. Being an older sister isn’t an easy feat yet she does it with so much grace; she’s shown me what it means to be a trailblazer- her kindness, tenacity, drive, and passion have led her to accomplish so many daring feats that I only hope to eventually achieve in my own right.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"a5aa8ec5-77ad-422b-b533-9a07f8028fff\"}":{"__typename":"School","uuid":"a5aa8ec5-77ad-422b-b533-9a07f8028fff","name":"Albuquerque Academy","city":"Albuquerque","type":"HIGH","state":"New Mexico","country":"United States","zip":"87109"},"Education:{\"uuid\":\"e3c38b85-d7cb-45c4-83c8-c03819ac705c\"}":{"__typename":"Education","uuid":"e3c38b85-d7cb-45c4-83c8-c03819ac705c","school":{"__ref":"School:{\"uuid\":\"a5aa8ec5-77ad-422b-b533-9a07f8028fff\"}"},"startYear":"2015","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"9d2ec7b3-db99-402a-ac68-b3c277ca60c9\"}":{"__typename":"Education","uuid":"9d2ec7b3-db99-402a-ac68-b3c277ca60c9","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2026","major":"Cognitive Science, minor in Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2466ac29-97b3-4a89-9571-7dfdbf215db1\"}":{"__typename":"MentorPublicProfile","uuid":"2466ac29-97b3-4a89-9571-7dfdbf215db1","displayName":"Temi A.","slug":"temi-adeniyi-1","biography":"\u003cp\u003eI am a student at the University of Southern California (USC), pursuing cognitive science with a minor in computer science. I am deeply passionate about exploring the intersection of technology, sustainability, and ethics, in which cognitive science integrates as its main purpose. My academic journey reflects my commitment to understanding how we can harness technology for positive societal impact, particularly within education, music, software development, and game development. Beyond the classroom, I am actively involved in ShiftSC, where I contribute to the VR Initiative team where we use virtual reality technology for greater innovative solutions.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy dedication to mentorship stems from my experiences guiding non-native English speakers in refining their language skills for academic and professional success. Witnessing their passion, growth, and their fast progress in refining their English was one of the most rewarding things for me as a mentor.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my academic and professional pursuits, I find solace and inspiration in the arts. Whether it's through digital art, dance, or my deep love for music, creativity fuels my spirit. As a member of 840 West Records, a student-run record label at USC, I channel my passion for music into my role on the PR \u0026amp; Marketing team, gaining invaluable experience as I aspire to simultaneously pursue a creative career as a recording artist.\u003c/p\u003e\u003cp\u003eIn my downtime, I immerse myself in exploring new cultural recipes in the kitchen, honing my skills in crochet, watching all kinds of TV shows and anime, and staying active through sports like tennis and basketball. Family holds a special place in my heart, and one of our most cherished traditions is gathering to enjoy Nigerian movies together.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWith a multifaceted array of interests and a commitment to making a positive impact, I am driven to continuously learn, grow, and contribute to the world around me. Whether through technology, mentorship, or the arts, my overarching goal remains the same: to inspire and uplift others while pursuing my own passions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"DS3lT025ZtpiJwWeztxwx00wC7r3wXcENDLD6ilPRzHkg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"89afebf0-6fdc-4ca1-be8a-bd896d8386c2\"}"},{"__ref":"Favorites:{\"uuid\":\"6df61fdf-b9db-472b-b718-fc4a532997e1\"}"},{"__ref":"Favorites:{\"uuid\":\"a0db2ce5-a8d0-4ec8-9d78-53490e92d22f\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"43c91d31-0406-46ef-9e80-bdcd678c6887\"}"}],"major":"Cognitive Science, minor in Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a687fb64-80f7-4e40-a72e-f917f868788e\"}"},{"__ref":"DeepDives:{\"uuid\":\"4a189ea7-baa7-4c8e-a6b0-1ebd4eaa008d\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c58de3a-2509-4772-8929-0494064a0402\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/50a694d0-5c29-4c24-a446-5561f8bf5a25/-/preview/-/format/jpg/","https://ucarecdn.com/8b28a5ea-dff1-48a4-8e36-fdbd5965aa99/-/preview/-/format/jpg/","https://ucarecdn.com/8c0695f9-3b17-4b8e-85d3-068491b0ce9e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e3c38b85-d7cb-45c4-83c8-c03819ac705c\"}"},{"__ref":"Education:{\"uuid\":\"9d2ec7b3-db99-402a-ac68-b3c277ca60c9\"}"}],"hiredAt":"2024-02-05T15:33:11.693Z","topics":[],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/b98f175c-f982-4497-bb8d-4a9c11113cd8/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"temi-adeniyi-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2466ac29-97b3-4a89-95
