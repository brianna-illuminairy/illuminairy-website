xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9447ebdd-63ac-4766-a1c7-8b032916c9e1\"}":{"__typename":"DeepDives","uuid":"9447ebdd-63ac-4766-a1c7-8b032916c9e1","content":"\u003cp\u003eIt was really difficult for me to choose my major because my academic interests varied so much. I decided on English because I felt the most supported by the department's faculty. In college your major doesn't have to encapsulate everything about you. What is most important is that you see potential for growth and transferrable knowledge in the classes you take!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7fd657c9-52a1-449c-b4ec-4caada6e8b00\"}":{"__typename":"DeepDives","uuid":"7fd657c9-52a1-449c-b4ec-4caada6e8b00","content":"\u003cp\u003eIn high school it is easy to get caught up in a competitive mindset. I would tell my past self that collaboration is one of the most valuable tools for learning, and that asking for help is okay. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"d054e23d-a569-44ef-acff-4056b48ca8a9\"}":{"__typename":"School","uuid":"d054e23d-a569-44ef-acff-4056b48ca8a9","name":"Gainesville High School","city":"Gainesville","type":"HIGH","state":"Florida","country":"United States","zip":"32609"},"Education:{\"uuid\":\"b60bc079-fe71-45b0-94c9-eff1c2c009a8\"}":{"__typename":"Education","uuid":"b60bc079-fe71-45b0-94c9-eff1c2c009a8","school":{"__ref":"School:{\"uuid\":\"d054e23d-a569-44ef-acff-4056b48ca8a9\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"fe804816-26ba-49f0-bb85-ec311868954c\"}":{"__typename":"Education","uuid":"fe804816-26ba-49f0-bb85-ec311868954c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"e1a6f9a3-f303-4e03-adec-8ccc0f241729\"}":{"__typename":"MentorPublicProfile","uuid":"e1a6f9a3-f303-4e03-adec-8ccc0f241729","displayName":"Julia P.","slug":"julia-pak","biography":"\u003cp\u003eHello, my name is Julia! I am a rising senior at Yale University pursuing a major in English. Since the fall of my first year, I have been continuously surprised and excited by the opportunities a liberal arts education like Yale’s offers. I have taken classes that range from the math of set theory to the history of art and myth in Greek antiquity. I am passionate about learning across disciplines, and I hope to continue to do this after I graduate when I plan on pursuing a degree in law!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI fell in love with teaching in high school, where I volunteered to help younger students with math through our engineering club. As a teacher, you learn how to think about problems and subjects from a completely different angle, and talking through this process with a student often results in both of us learning something new about ourselves.\u003c/p\u003e\u003cp\u003eSince attending Yale, I have been fortunate enough to work with YEP, or the Young Entrepreneurs Program. This club is an afterschool incubator for high school students around the New Haven area. Working with emerging entrepreneurs has been incredibly rewarding, and I have learned that every idea has the potential to become a reality with the right steps.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile a lot of my time is spent in the library, I always find time to do things like cooking, watching movies, and working out. I think that learning to lead a balanced life has been one of the most challenging but rewarding parts of college. As your child’s mentor, I will always be there to support them in their academic pursuits but also want to be a system of support for their passions beyond school.\u003c/p\u003e","teachingVideoPlaybackId":"01hg5P7Dz00OWwFrUvYijZ1j3j921ipILiNTep82H2XZ00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9447ebdd-63ac-4766-a1c7-8b032916c9e1\"}"},{"__ref":"DeepDives:{\"uuid\":\"7fd657c9-52a1-449c-b4ec-4caada6e8b00\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e4cdf719-523a-4516-9666-43c1a8bdc57f/-/preview/-/format/jpg/","https://ucarecdn.com/3cf4369d-bce8-4315-81f8-b64d20dc0851/-/preview/-/format/jpg/","https://ucarecdn.com/3a13e548-519d-449d-ab35-8e37e13c2e60/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b60bc079-fe71-45b0-94c9-eff1c2c009a8\"}"},{"__ref":"Education:{\"uuid\":\"fe804816-26ba-49f0-bb85-ec311868954c\"}"}],"hiredAt":"2024-06-13T19:12:37.045Z","topics":["History Project","Literature","K-5 Grade Math","Pre-Algebra","Geometry","Calculus","Precalculus / Trigonometry","Writing","Italian","Algebra I","Algebra II"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials"
