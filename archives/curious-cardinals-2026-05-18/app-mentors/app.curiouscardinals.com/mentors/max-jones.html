xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d98e7e9a-d5de-4a7a-82ba-22e16307ee62\"}":{"__typename":"DeepDives","uuid":"d98e7e9a-d5de-4a7a-82ba-22e16307ee62","content":"\u003cp\u003eMentorship matters to me because I know, as someone who has had teachers that forced me to behave or learn a certain way to meet a particular outcome, how important hearing out your student is. When working with your student and not against them, you can push each other to see things from new perspectives and enhance learning in a way that transcends even beyond academic success. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"9a16f96c-b798-4ed3-9e8e-f6a3c337dbc2\"}":{"__typename":"DeepDives","uuid":"9a16f96c-b798-4ed3-9e8e-f6a3c337dbc2","content":"\u003cp\u003eAs a high school student, I was set in one way of thinking—perform well in school to obtain success. It was only through obtaining the success I'd dreamed of and feeling empty after it that I realized education was about so much more. I hope to help my students realize this, on top of helping them excel in their academics. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"b423bf3a-aad8-4c7f-a8ce-a0d39fdd3e0c\"}":{"__typename":"DeepDives","uuid":"b423bf3a-aad8-4c7f-a8ce-a0d39fdd3e0c","content":"\u003cp\u003eA passion project I'm currently working on is a short film called \u003cem\u003eRipples\u003c/em\u003e about a man traveling through time to save his brother from dying—only to be linked to a therapist along the way. The film is a love letter to those who have suffered from grief, and a culmination of all I've learned facing loss in my real life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"b0f45f0f-91a6-4410-8619-df7fceaf88f4\"}":{"__typename":"DeepDives","uuid":"b0f45f0f-91a6-4410-8619-df7fceaf88f4","content":"\u003cp\u003eMy greatest source of motivation is delivering truth to readers through my writing. Whether that be in the form of justice or disillusionment in my journalism, or catharsis and emotional transcendence in my fictional work, I hope I can help people realize something authentic in everything I write. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"2dea79ea-d07a-4073-9220-720878d9e326\"}":{"__typename":"School","uuid":"2dea79ea-d07a-4073-9220-720878d9e326","name":"Sonora High School","city":"La Habra","type":"HIGH","state":"California","country":"United States","zip":"90631"},"Education:{\"uuid\":\"2c94d9f3-c890-4f00-9380-a0fa1a62b942\"}":{"__typename":"Education","uuid":"2c94d9f3-c890-4f00-9380-a0fa1a62b942","school":{"__ref":"School:{\"uuid\":\"2dea79ea-d07a-4073-9220-720878d9e326\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"67bbbc51-0e07-4a1a-8c12-522e5b8e389f\"}":{"__typename":"School","uuid":"67bbbc51-0e07-4a1a-8c12-522e5b8e389f","name":"University of Southern California Year","city":"Los Angeles ","type":"COLLEGE","state":"CA","country":"United States","zip":"90007"},"Education:{\"uuid\":\"866270ba-c702-42e7-91d7-95634ab1c96b\"}":{"__typename":"Education","uuid":"866270ba-c702-42e7-91d7-95634ab1c96b","school":{"__ref":"School:{\"uuid\":\"67bbbc51-0e07-4a1a-8c12-522e5b8e389f\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2023","major":"Communications","degree":null},"MentorPublicProfile:{\"uuid\":\"b372a53c-fe45-47d6-a574-750f44d3a58c\"}":{"__typename":"MentorPublicProfile","uuid":"b372a53c-fe45-47d6-a574-750f44d3a58c","displayName":"Max J.","slug":"max-jones","biography":"\u003cp\u003eI am a staff writer and web show host for digital news publication ScheerPost. I graduated Summa Cum Laude from the University of Southern California (USC) in May 2023, and have been an aspiring screenwriter/filmmaker for about four years.\u003cbr\u003e\u003cbr\u003eI work in education because I find the process of fostering new skills in students extremely fulfilling and effective when improving people's writing. While I have always had a proclivity for literature and prose, I became a great writer through teachers that pushed me beyond my limits, and forced me to see my own work through a critical lens. \u003cbr\u003e\u003cbr\u003eI do the same with my students, and focus helping them understand how actual great writing is written, and using that knowledge to observe and revise their work in a critical way, free from the constraints of ego. \u003cbr\u003e\u003cbr\u003eWhile I studied communications and screenwriting at USC, my other profession is journalism. I spend hours every day researching foreign policy and issues involving the national security state, as well as domestic policy covering subjects such as labor and the economy. Researching issues of national security requires days of investigation, especially for the op-ed columns I write which are published at ScheerPost. As I mentioned, I also host a web show called \"Journalists for Sale\" (https://www.youtube.com/watch?v=0mH4FLwAArs\u0026amp;list=PLBZGZNBR3DCPdaz1wBP4L-0wqhGt2OvOD\u0026amp;ab_channel=ScheerPost) in which I interview different journalists and political figures about the latest stories of our time, ranging from the war in Ukraine to the 2024 election cycle. \u003cbr\u003e\u003cbr\u003eI am also in the process of writing my fifth feature-length screenplay and in pre-production for my short film that I raised $11,000 for, which will be shot in the fall. My process for filmmaking and storytelling is similar to that of my persuasive writing. The only difference is that I have acquired my narrative chops through teachers that enabled me to see my favorite \u003cem\u003emovies\u003c/em\u003e in a critical lens, as opposed to only my own work. Understanding exactly how the narrative devices in my favorite books and films were used to compel audiences, invoke catharsis in them, and create real, human, characters gave me the tools necessary to bring my own work to life — and teach others how to do so, as I have in my educational screenwriting YouTube videos, which have wracked up thousands of views (ie https://www.youtube.com/watch?v=3pYVG6u4rX0\u0026amp;ab_channel=ANTIJonesProductions). With my experience in fictional storytelling, I can also tutor students on their creative writing and storytelling to help them build a story that is emotionally compelling and engaging. \u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"I5C02uOgcJFVGx00TEn55FKlYQv00w01r1AETq011M4f5kLQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Communications","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d98e7e9a-d5de-4a7a-82ba-22e16307ee62\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a16f96c-b798-4ed3-9e8e-f6a3c337dbc2\"}"},{"__ref":"DeepDives:{\"uuid\":\"b423bf3a-aad8-4c7f-a8ce-a0d39fdd3e0c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b0f45f0f-91a6-4410-8619-df7fceaf88f4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/be3e03f1-1102-4ab7-827e-1a71e89df91c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2c94d9f3-c890-4f00-9380-a0fa1a62b942\"}"},{"__ref":"Education:{\"uuid\":\"866270ba-c702-42e7-91d7-95634ab1c96b\"}"}],"hiredAt":"2023-08-24T18:21:59.228Z","topics":["Journalism","Law / Government / Policy","Debate","Public Speaking","Film / Theater","Video / Photography","Literature","Creative Writing","Writing"],"communityBadges":["https://ucarecdn.com/7f8f1ed3-79b5-41c5-b8fd-a444de85708b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"max-jones\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b372a53c-fe45-47d6-a574-750f44d3a58c\"}"}}},"_sentryTraceData":"1ec8c8b1931746e780774b53e9221e70-b312c9bd16758d39-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1ec8c8b1931746e780774b53e9221e70,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"max-jones"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://w
