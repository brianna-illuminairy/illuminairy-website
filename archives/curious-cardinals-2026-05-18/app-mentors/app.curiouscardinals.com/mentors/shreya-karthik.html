xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d12ae03b-e4f3-45cb-a8ac-2a025e222ef6\"}":{"__typename":"Favorites","uuid":"d12ae03b-e4f3-45cb-a8ac-2a025e222ef6","photoUrl":"https://ucarecdn.com/dd9b3052-dab6-4a5a-a63a-0057effeef72/","title":"The Kite Runner","type":"BOOK"},"Favorites:{\"uuid\":\"413205c7-b5c1-4528-907d-a8aeac8511f6\"}":{"__typename":"Favorites","uuid":"413205c7-b5c1-4528-907d-a8aeac8511f6","photoUrl":"https://ucarecdn.com/26e9155d-1ba7-4d77-8755-13ba02a35a3f/","title":"Seattle","type":"CITY"},"Favorites:{\"uuid\":\"16d6a10b-bba3-4959-bcb5-ef54f84c1414\"}":{"__typename":"Favorites","uuid":"16d6a10b-bba3-4959-bcb5-ef54f84c1414","photoUrl":"https://ucarecdn.com/d53a6bcf-b6af-4043-baae-54ace4f54ff6/","title":"Taekwondo","type":"SPORT"},"CausesSupported:{\"uuid\":\"e26214c5-7a44-4d83-8c09-4529476fa8ad\"}":{"__typename":"CausesSupported","uuid":"e26214c5-7a44-4d83-8c09-4529476fa8ad","name":"The Inner Light Initiative","description":"\u003cp\u003eFounder of initiative dedicated to promoting youth mental health and mindfulness\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"6d3c8899-1a69-4f45-ba28-79cd3e5e3b65\"}":{"__typename":"DeepDives","uuid":"6d3c8899-1a69-4f45-ba28-79cd3e5e3b65","content":"\u003cp\u003eNot many people know that I have a black belt in taekwondo and have been doing martial arts from a very young age! It has taught me to be a disciplined and resilient student, and I enjoy sharing these values as an instructor for younger belts.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"57215460-ab4a-41f8-86c2-7c5c5ae21932\"}":{"__typename":"DeepDives","uuid":"57215460-ab4a-41f8-86c2-7c5c5ae21932","content":"\u003cp\u003e\"Try Everything!\"\u003c/p\u003e\u003cp\u003eIt has become my motto recently because it truly encapsulates what life should be about-- it should be about putting yourself out there and discovering who you are without fear. Being able to truly give every opportunity a chance and discover which ones resonate with me the most allowed me to be sure that I have opened every possible door and chosen the path where I feel the happiest. This journey of failure and success has helped me develop a sense of maturity and understanding of what makes me, me and I truly wish I had known the importance of embracing the unknown from a younger age. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d5427118-de3c-486e-8fd0-b18ac0276028\"}":{"__typename":"DeepDives","uuid":"d5427118-de3c-486e-8fd0-b18ac0276028","content":"\u003cp\u003eThroughout my academic journey, it was the people who believed in me that made all the difference in the world. Whether it was my family, teachers, peers, lab PI, or friends, they all mentored and uplifted me in some form, ensuring that I had the love, resources, and motivation to keep moving forward. I was blessed with a robust support system, and I want to be a part of this support network for as many other people as possible. Through curious cardinals, I want to make sure every student has a voice that will help guide their ambitions to soaring success.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c43b371d-2e58-4bf0-9184-134b185d1b56\"}":{"__typename":"DeepDives","uuid":"c43b371d-2e58-4bf0-9184-134b185d1b56","content":"\u003cp\u003eI would love to write a medical memoir encapsulating my journey from high school to doctorhood. To me, medicine is not only a science but a story. Writing would allow me to bring together my scientific mind, which is fascinated by the elegance and resilience of the human body, and my creative mind, which searches for meaning in human experience. A memoir would be where science becomes human, healing becomes personal, and medicine is remembered not only through charts and prescriptions, but through the stories that give it heart.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"13f8712e-13f8-4c0c-9a72-746c5229fc86\"}":{"__typename":"School","uuid":"13f8712e-13f8-4c0c-9a72-746c5229fc86","name":"Henry M. Jackson High School","city":"Mill Creek","type":"HIGH","state":"Washington","country":"United States","zip":"98012"},"Education:{\"uuid\":\"e51ef341-1395-494e-91c2-0400ae3e68b2\"}":{"__typename":"Education","uuid":"e51ef341-1395-494e-91c2-0400ae3e68b2","school":{"__ref":"School:{\"uuid\":\"13f8712e-13f8-4c0c-9a72-746c5229fc86\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"970a0a23-81c5-4080-b232-4a2e38a43f05\"}":{"__typename":"Education","uuid":"970a0a23-81c5-4080-b232-4a2e38a43f05","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Cognitive Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"2c393fe0-926a-4e6c-9955-bd73be0e00d2\"}":{"__typename":"MentorPublicProfile","uuid":"2c393fe0-926a-4e6c-9955-bd73be0e00d2","displayName":"Shreya K.","slug":"shreya-karthik","biography":"\u003cp\u003eHello parents and students! My name is Shreya, and I am a student at Brown University in the Program in Liberal Medical Education (PLME), planning to concentrate in cognitive neuroscience and pursue a certificate in Intercultural Competence- Spanish.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am passionate about pursuing a career as a physician-scientist and am especially captivated by neurology. Much of my research and volunteer work involves working with neurodivergent youth to bring more awareness to the diversity of this community. On weekends, you can often find me working as a patient engagement volunteer at my local hospital or running data analysis on my computer, hoping to find the next big breakthrough. Service, compassion, and curiosity are at the heart of my identity, and I bring that to every one of my endeavors.\u003c/p\u003e\u003cp\u003eI am also a huge advocate for mental health, self-improvement, and mindfulness practice. Aside from conducting research on the subject, I also founded the Inner Light Initiative to directly work with youth in summer camps, launch a social media campaign, host webinars, and lobby legislators for policy change. This journey has taught me to be a resilient advocate for what I believe in, and I value sharing the management skills I have gained to help others soar with their own passion projects. Public speaking is one of the many skills I have developed over time, boosting my confidence and enthusiasm in various scenarios, including interviews, impromptu speaking, debates, and inspirational speeches.\u003c/p\u003e\u003cp\u003eIn addition to all of this, my creative side shines through my writing. I have written, illustrated, and self-published four children's books, and I dabble in poetry with a few online and print publications. I also enjoy visual art with a focus on environmental protection, so you can often find me hiking with a camera slung around my neck or sketchbook in hand, resulting in multiple scholastic arts and writing awards. But most of all, I value sharing creative work with others and thrive when teaching and learning from other students.\u003c/p\u003e\u003cp\u003eI’m truly excited to be a Curious Cardinals mentor and can’t wait to support students as they explore their interests, build confidence, and discover their full potential!\u003c/p\u003e","teachingVideoPlaybackId":"16opt5VWnjbdaIIwjn02w02uj01qtVAhkha019sU6wEcBGs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn high school, I founded the Inner Light Initiative. It began with my personal mindfulness journey; I began practicing it as a method to simply deal with the everyday stress of life, and I found it to be really helpful. Consequently, I wanted to share it with others and proposed a regular mindfulness club at my school. Unfortunately, there was limited support from the student body, and I almost gave up. However, with a final strand of hope, I applied to the CADCA Voices for Youth Coalition, and I was actually 1 of the 10 students nationally to be accepted. It was fantastic because as I connected with mentors and like-minded youth from around the country, my hope was reignited, and I began with social media advocacy, building up to community webinars and radio PSAs that promoted mindfulness as a regular practice to care for mental health. Just like that the inner light initative was born. With my success, I presented at multiple national conferences, youth summer camps, and lobbied to elected officials on Capitol Hill in DC. With this national recognition and work, I was finally able to come back to my school and start a mindfulness club. There is still a lot of work to be done but it is really cool to look back and see how far we have come, and that makes me really proud because I learned that as long as I was confident in and believed strongly in something, I would be able to achive it.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d12ae03b-e4f3-45cb-a8ac-2a025e222ef6\"}"},{"__ref":"Favorites:{\"uuid\":\"413205c7-b5c1-4528-907d-a8aeac8511f6\"}"},{"__ref":"Favorites:{\"uuid\":\"16d6a10b-bba3-4959-bcb5-ef54f84c1414\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"e26214c5-7a44-4d83-8c09-4529476fa8ad\"}"}],"major":"Cognitive Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6d3c8899-1a69-4f45-ba28-79cd3e5e3b65\"}"},{"__ref":"DeepDives:{\"uuid\":\"57215460-ab4a-41f8-86c2-7c5c5ae21932\"}"},{"__ref":"DeepDives:{\"uuid\":\"d5427118-de3c-486e-8fd0-b18ac0276028\"}"},{"__ref":"DeepDives:{\"uuid\":\"c43b371d-2e58-4bf0-9184-134b185d1b56\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9a1b3be6-022b-48ba-ad16-937a9cec5ba2/-/preview/-/format/jpg/","https://ucarecdn.com/ba2c1a46-f568-48e8-a74a-1a1bcf9241fe/-/preview/-/format/jpg/","https://ucarecdn.com/cafc24ce-f336-49aa-a6ad-99bf353608ac/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e51ef341-1395-494e-91c2-0400ae3e68b2\"}"},{"__ref":"Education:{\"uuid\":\"970a0a23-81c5-4080-b232-4a2e38a43f05\"}"}],"hiredAt":"2026-01-10T03:56:29.840Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","College Essay Writing","Reading","Executive Function","K-6 Storybook","Creative Writing","Medicine / Health","STEM Project","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"shreya-karthik\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2c393fe0-926a-4e6c-9955-bd73be0e00d2\"}"}}},"_sentryTraceData":"3ba8bc418f8f482982c74f440227bbaf-b1548b77006b5658-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3ba8bc418f8f482982c74f440227bbaf,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"shreya-karthik"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
