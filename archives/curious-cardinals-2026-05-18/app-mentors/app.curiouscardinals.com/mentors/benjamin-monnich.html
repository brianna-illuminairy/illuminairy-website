xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"26f5fa78-7f2a-4488-aa58-fbd46231b73f\"}":{"__typename":"Favorites","uuid":"26f5fa78-7f2a-4488-aa58-fbd46231b73f","photoUrl":"https://ucarecdn.com/c66aafa1-490b-421c-846e-3dc683a158f1/","title":"The Detroit Lions","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"0a497ea4-b505-48cb-b230-dd6056dedfcf\"}":{"__typename":"DeepDives","uuid":"0a497ea4-b505-48cb-b230-dd6056dedfcf","content":"\u003cp\u003eMy greatest role model is, always has been, and always will be my dad. To me, my dad exemplifies the values which I deem to be most important: leadership, responsibility, kindness, and hard work. In all aspects of my life, I try to exhibit these same values to uphold the standard of behavior which I have always looked up to in my dad. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"89ae0f05-1a25-4424-9f40-b2b0db6fadad\"}":{"__typename":"DeepDives","uuid":"89ae0f05-1a25-4424-9f40-b2b0db6fadad","content":"\u003cp\u003eThe one key piece of advice I would give to my middle/high school self would be: don't be afraid to be yourself. I chronically suffered from insecurity, social anxiety, and low self esteem, and all of this served to put limits on myself. I know that this is a common experience for all kids at that age, and I know that this insecurity puts limits on what kids allow themselves to believe is possible or allow themselves to try to achieve. As I go forward as a CC mentor, a key goal of mine is to inspire the next generation to dream big, be true to themselves, and build up the self confidence needed to be curious, successful, and happy. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f77b38da-9549-4f97-86e4-a8172425baea\"}":{"__typename":"DeepDives","uuid":"f77b38da-9549-4f97-86e4-a8172425baea","content":"\u003cp\u003eI chose my major for two main reasons: 1) my interest in history/political science/international politics, and 2) my love for Spanish and hispanic culture around the globe. International politics and history has always been a passion of mine, so for that reason my major was a perfect fit. However, more importantly, Spanish and hispanic culture have always been a huge part of my life. I was fortunate enough to spend a few summers living with family friends in Spain during middle school, and from there my passion for Spanish grew exponentially. I attended Middlebury College because of the strength of their language programs, and I always knew I was going to spend my full junior year of college in Spain. My major, then, made perfect sense because it allowed me to explore and strengthen both my intellectual and personal passions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"2ece0614-e283-4d1e-a769-183a50728e8c\"}":{"__typename":"DeepDives","uuid":"2ece0614-e283-4d1e-a769-183a50728e8c","content":"\u003cp\u003eI am extremely proud of having run two marathons (and hopefully a third soon!). I ran these marathons during college, so what I am most proud of about this accomplishment is the personal discipline and work it took to realize it while I was taking full-time classes and living an immersive social experience at school. I stayed disciplined and ran consistently for months before each marathon, even during the frigid winter of Vermont. So, I am most proud of my marathons because of the work I put in to realize them -- work I put in on my own time, for nobody else but myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"ff8d11b8-a997-4b3c-9926-91eb25df6bcf\"}":{"__typename":"School","uuid":"ff8d11b8-a997-4b3c-9926-91eb25df6bcf","name":"Milton Academy","city":"Milton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02186"},"Education:{\"uuid\":\"6fe87a38-a80e-41cd-b148-a3a6b803ff03\"}":{"__typename":"Education","uuid":"6fe87a38-a80e-41cd-b148-a3a6b803ff03","school":{"__ref":"School:{\"uuid\":\"ff8d11b8-a997-4b3c-9926-91eb25df6bcf\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"274f76b5-d171-4071-af7b-babe99019c94\"}":{"__typename":"School","uuid":"274f76b5-d171-4071-af7b-babe99019c94","name":"Middlebury College","city":"Middlebury","type":"COLLEGE","state":"Vermont","country":"United States","zip":"05753"},"Education:{\"uuid\":\"cb33204d-40db-45bf-99fb-57abcd482801\"}":{"__typename":"Education","uuid":"cb33204d-40db-45bf-99fb-57abcd482801","school":{"__ref":"School:{\"uuid\":\"274f76b5-d171-4071-af7b-babe99019c94\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"International and Global Studies; European History and Spanish","degree":null},"MentorPublicProfile:{\"uuid\":\"9441a98c-8f6d-483f-b528-253b06e6fe46\"}":{"__typename":"MentorPublicProfile","uuid":"9441a98c-8f6d-483f-b528-253b06e6fe46","displayName":"Benjamin M.","slug":"benjamin-monnich","biography":"\u003cp\u003eHi! My name is Ben Monnich, and I cannot wait to meet you! I graduated Magna Cum Laude from Middlebury College in 2024 with a BA in International and Global Studies and concentrations in European History and Spanish. Currently, I work as an upper elementary school ELA teacher at a charter school in Harlem through Teach For America. Important skills/abilities I have cultivated include: a C1 Spanish level (second only to native fluency), which I achieved after living for two years in Spain; an MA in elementary education at Hunter College; and strong communication and organization skills. I spend the majority of my free time outdoors. I love to run, hike, fish, ski, play basketball and soccer. When not doing one of those things, you can find me reading a good book or spending time with family and friends. As I go forward as a teacher in NYC, I am excited for the opportunity to enrich my professional skills by designing interesting, unique exploratory learning projects for my Curious Cardinals mentees. My ideal mentor-mentee relationship looks like a working friendship, in which both mentor and mentee have equal roles in shaping learning, learning experience, and overall learning environment. I am committed to giving mentees the experience THEY want. I can't wait to get started with you!\u003c/p\u003e","teachingVideoPlaybackId":"o1Sbg8tOgV39VaOKeG2rWBtiyWBCV3jdiM9KMGzQlRU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"26f5fa78-7f2a-4488-aa58-fbd46231b73f\"}"}],"causesSupported":[],"major":"International and Global Studies; European History and Spanish","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0a497ea4-b505-48cb-b230-dd6056dedfcf\"}"},{"__ref":"DeepDives:{\"uuid\":\"89ae0f05-1a25-4424-9
