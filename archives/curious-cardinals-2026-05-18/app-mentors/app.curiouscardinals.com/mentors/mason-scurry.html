xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"dc2a93f3-d2ec-4172-85b5-3a3f89f96cea\"}":{"__typename":"Favorites","uuid":"dc2a93f3-d2ec-4172-85b5-3a3f89f96cea","photoUrl":"https://ucarecdn.com/d28200da-7e5f-4c34-a1d2-0ed6d788ac24/","title":"noah kahan","type":"ARTIST"},"Favorites:{\"uuid\":\"6f224e28-ae9f-457f-ba41-e6d877fe9278\"}":{"__typename":"Favorites","uuid":"6f224e28-ae9f-457f-ba41-e6d877fe9278","photoUrl":"https://ucarecdn.com/8f1e59cd-d6bb-4324-9403-cf9b91d6b080/","title":"harry potter (order of the pheonix)","type":"BOOK"},"Favorites:{\"uuid\":\"39eae421-5053-426c-a152-b379e4ff009a\"}":{"__typename":"Favorites","uuid":"39eae421-5053-426c-a152-b379e4ff009a","photoUrl":"https://ucarecdn.com/1f888fdd-cb80-4ef3-8002-d25c64896cf8/","title":"wingspan!!!!","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9b6e9f6c-3b97-472b-956b-61f6343c9794\"}":{"__typename":"DeepDives","uuid":"9b6e9f6c-3b97-472b-956b-61f6343c9794","content":"\u003cp\u003eMason, I get it. \u003cbr\u003e\u003cbr\u003eThe future is looming and completely unknown.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eYou feel like you’re not doing enough. You’re not social enough, you’re not successful enough, you’re not busy enough, you’re not working hard enough.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTrust me, buddy, I know you. And I’ve been through it. \u003cbr\u003e\u003cbr\u003eThe good news is everything turns out better than you could imagine. \u003cbr\u003e\u003cbr\u003eThe bad news is the road to get there is bumpy. \u003cbr\u003e\u003cbr\u003eBut here are 5 pieces of advice to help you manage the potholes.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStay in touch with old friends\u003c/strong\u003e. There’s something different about being loved by people who have known you since before you could walk. You’re fortunate to have many such people in your life—hold onto them, dearly. New friends don’t have to replace old ones.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSpend more time alone\u003c/strong\u003e. I mean real time alone. Go out to dinner by yourself and without your phone. Go on more walks. Take Gooch Hill home and sing your heart out. Let yourself exist, every once and awhile, with no judgements, expectations, or desires.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSleep, eat and exercise\u003c/strong\u003e. Trust me on this one. Humans cannot thrive without these three things. You, however, feel like you’re about to collapse if you don’t have all three. If you’re feeling crappy, it’s probably because you’re lacking one of them.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBefore you try to change yourself, figure out who you actually are\u003c/strong\u003e. Experiment often. Fall in and out of love. Lose epically. Win graciously. Spin out. Brush yourself off. Show yourself what you’re capable of, and it becomes a lot more difficult to wish you were any different.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLife is too short not to let yourself do everything your heart desires the moment it desires it\u003c/strong\u003e. Enough said.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"7e6f535e-dadd-4fb8-87ec-bc247c042b87\"}":{"__typename":"DeepDives","uuid":"7e6f535e-dadd-4fb8-87ec-bc247c042b87","content":"\u003cp\u003eI had a professor in college who loved to talk about \u003cem\u003eikigai\u003c/em\u003e.\u003c/p\u003e\u003cp\u003e\u003cem\u003eIkigai\u003c/em\u003e is a Japanese concept that literally means “life + worth.” It’s the idea that a meaningful life comes from the intersection of four things: what you love, what you’re good at, what the world needs, and what you can be paid fairly for. That overlap is your purpose.\u003c/p\u003e\u003cp\u003eI was drawn to the concept immediately, but for years I circled around it. I did work I was good at, work I enjoyed, even work that did some good in the world. But it never fully clicked. My ikigai always seemed just out of reach.\u003c/p\u003e\u003cp\u003eAt the same time, there were patterns I couldn’t ignore. Summers as a camp counselor lit me up. Running a youth entrepreneurship program had me volunteering 30 hours a week, and I didn’t mind; I loved it. Coaching young founders one-on-one, teaching workshops at Brown, stepping into classrooms as a teacher—all of it felt different. I loved it. I was good at it. It made an impact. And, in some roles, I was even paid fairly for it.\u003c/p\u003e\u003cp\u003eEventually, the truth became undeniable: mentorship was my ikigai. It always had been.\u003c/p\u003e\u003cp\u003eToday, it sits at the center of everything I do, as a consultant, a coach, and a tutor. Every opportunity to mentor is a chance to live my purpose more fully.\u003c/p\u003e\u003cp\u003eMentorship is my ikigai. And I can’t wait to help you find yours.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8f7fc7d5-908c-470e-b616-ed47e92d30cd\"}":{"__typename":"DeepDives","uuid":"8f7fc7d5-908c-470e-b616-ed47e92d30cd","content":"\u003cp\u003eI’ll answer a different question, because if I ever end up working a traditional job, I’d be in a nightmare, not a dream.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSo here are 10 aspects of my dream \u003cem\u003elife\u003c/em\u003e. \u003cbr\u003e\u003cbr\u003eThat feels like a more worthy thing to dream about, anyway.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003e1. I mentor people daily. \u003c/strong\u003eI’m a professor, coach and consultant. I also do regular volunteering at schools and other local community organizations.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e2. I make $382,000 a year. \u003c/strong\u003eWeirdly specific, I know, but I calculated what the best life I can imagine would cost, and that’s the number. This would go up when I have kids.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e3. I have three kids.\u003c/strong\u003e I grew up with a little sister. I always wished there was just one more of us.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e4. I work in the mornings.\u003c/strong\u003e Never on afternoons, evenings, or weekends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e5. I live in the mountains.\u003c/strong\u003e I grew up in the mountains. Guess it’s in my blood.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e6. I’m a best-selling author\u003c/strong\u003e. I love writing—poems, essays, and non-fiction. I know I’ll keep writing for the rest of my life, even if nobody reads it. But it would be nice if millions of people did…\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e7. I hike in the afternoons. \u003c/strong\u003eEvery day. Around 2 o’clock.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e8. I live in a Victorian house with a wrap-around porch.\u003c/strong\u003e It’s blue. And full of plants, antique furniture, and landscape paintings.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e9. I travel the world for speaking events.\u003c/strong\u003e I’ve never said no to an opportunity to speak and I doubt I ever will.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e10. I perform in local plays. \u003c/strong\u003eTheater is something I lost touch with in college. Mark my words—I’m changing that.\u0026nbsp;\u003c/p\u003e\u003ch1\u003e\u003c/h1\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4ee17935-aaf6-4148-b883-2fcd2386eff6\"}":{"__typename":"DeepDives","uuid":"4ee17935-aaf6-4148-b883-2fcd2386eff6","content":"\u003cp\u003e\u003cstrong\u003eRun\u003c/strong\u003e. This is a relatively new thing for me, but I’ve found I feel 3x worse on days that I don’t run first thing in the morning. It’s doing wonders for me.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSunbathe\u003c/strong\u003e. I think I’m a reptile.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eRead nonfiction.\u003c/strong\u003e These days, I read a new book every week. It’s one of the primary reasons I’ve achieved what I have.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCook really complex meals.\u003c/strong\u003e If a meal takes under 30 minutes to prepare, it’s not worth it to me. If it takes over 2 hours, I’m in.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eDrive, drive, drive.\u003c/strong\u003e I \u003cem\u003elove\u003c/em\u003e to drive, and I \u003cem\u003ealways\u003c/em\u003e take the scenic route. I drove by myself from Bozeman, Montana to Athens, Georgia this summer. I didn’t get on an interstate once.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWrite\u003c/strong\u003e. When I haven’t written in a while, I get constipated (figuratively) and moody (literally).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eEntrepreneurate. \u003c/strong\u003eI turned entrepreneur into a verb because I needed a way to describe all the unnecessary work I do on my businesses, just because I love doing it.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eGo see the bears. \u003c/strong\u003eI live next to a free zoo, and they’ve got two beautiful black bears. Naturally, I go all the time.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eDrink iced coffee. \u003c/strong\u003eSometimes when I get a cut, I expect coffee to pour out.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eMusic\u003c/strong\u003e. I listen to tons of music. Ask me for my top artists/songs, I love to share music.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHike. \u003c/strong\u003eGoing to harder to do this in the same way, now that I’ve left Montana and moved to Georgia.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"a0878670-760c-41df-8110-b295b2295624\"}":{"__typename":"School","uuid":"a0878670-760c-41df-8110-b295b2295624","name":"Bozeman High School","city":"Bozeman","type":"HIGH","state":"Montana","country":"United States","zip":"59715"},"Education:{\"uuid\":\"59982889-4cad-43e1-ab5c-e09a3b89998f\"}":{"__typename":"Education","uuid":"59982889-4cad-43e1-ab5c-e09a3b89998f","school":{"__ref":"School:{\"uuid\":\"a0878670-760c-41df-8110-b295b2295624\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"b94634ed-9413-46c1-96b9-94ae8d3f2496\"}":{"__typename":"Education","uuid":"b94634ed-9413-46c1-96b9-94ae8d3f2496","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Sociology/Entrepreneurship","degree":null},"MentorPublicProfile:{\"uuid\":\"94e54a4f-5a83-49b0-bca2-322b1ea66b54\"}":{"__typename":"MentorPublicProfile","uuid":"94e54a4f-5a83-49b0-bca2-322b1ea66b54","displayName":"Mason S.","slug":"mason-scurry","biography":"\u003cp\u003e\u003cstrong\u003eHello, hello, hello!! I’m Mason :)\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHere’s a brief timeline of my time on planet Earth (so far) as an entrepreneur, educator, and creative:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAugust 2002\u003c/strong\u003e — Born in Bozeman, Montana at 11:23 AM (I’m a Leo, if you’re curious)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eJune 2008\u003c/strong\u003e — “Hired” my neighbors and launched a roadside lemonade empire\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eJune 2009\u003c/strong\u003e — Charged my family admission to watch my magic shows (a dime at first, then bumped it up to a quarter)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSeptember 2011\u003c/strong\u003e — Published for the first time (a poem about Martin Luther King Jr.)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSeptember 2014\u003c/strong\u003e — Cast in \u003cem\u003eA Christmas Carol\u003c/em\u003e (played Young Scrooge and Boy with Turkey)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFebruary 2018\u003c/strong\u003e — Won my first debate tournament (undefeated for two years—loved it)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMay 2019\u003c/strong\u003e — Starred in \u003cem\u003eCurious Incident of the Dog in the Nighttime\u003c/em\u003e (first big role; so intense I was sick for two weeks after)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eJune 2019\u003c/strong\u003e — Moved away from home to work as a camp counselor (best summer ever, wish I could go back)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAugust 2020\u003c/strong\u003e — Inherited my mom’s Smart Car convertible (my pride and joy for 4+ years)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSeptember 2020\u003c/strong\u003e — Became the top-ranked debater in Montana (still counts!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMay 2021\u003c/strong\u003e — Won three awards and graduated from Bozeman High at the top of my class (outdoor ceremony thanks to Covid)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMay 2022\u003c/strong\u003e — Started my first company, Declutter USA (a thrift store on wheels—accidental but awesome)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAugust 2022\u003c/strong\u003e — Survived a serious car crash (hydroplaned in a Prius outside of Banff)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eJuly 2023\u003c/strong\u003e — Became Program Director of the Young Entrepreneurs Program (nonprofit teaching business to high schoolers)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSeptember 2023\u003c/strong\u003e — Sold Declutter USA and launched a clothing line with a friend (he’s a brilliant artist/designer)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eJune 2024\u003c/strong\u003e — Self-published my second book (essays, poetry, and letters—very proud of it)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDecember 2024\u003c/strong\u003e — Launched Scurry Consulting (what I now do full-time)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eApril 2025\u003c/strong\u003e — Became the only undergrad to ever receive Brown’s Hazeltine Prize in Entrepreneurial Mentorship (named for Hazeltine, a professor who has taught there for 65+ years!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMay 2025\u003c/strong\u003e — Graduated from Brown (degree in sociology, but took 3x as many business courses...Brown is quirky like that)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eJune 2025\u003c/strong\u003e — Traveled to Iceland (hands-down the coolest place I’ve ever been)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eJuly 2025\u003c/strong\u003e — Hiked my first 14,000+ ft mountain (the outdoors have always been a big part of my life)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAugust 2025\u003c/strong\u003e — Appointed to Brown’s faculty as a Public Speaking Coach for mid-career professionals (not typical for a 23-year-old without a Master’s, but hey, anything’s possible)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSeptember 2025\u003c/strong\u003e — Moved into a beautiful blue house in Athens, Georgia (where I live now)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003eI’ve worked 32 jobs, launched 4 businesses, been in 12 plays, and written over 2,000 pieces of writing.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMost importantly, I've also mentored, coached, or counseled 500+ people. And that's what I love more than anything else I do.\u003cbr\u003e\u003cbr\u003eI coach toward two things: \u003cstrong\u003ePassions\u003c/strong\u003e and \u003cstrong\u003eStrengths\u003c/strong\u003e. I focus on what you love and what you're already good at, and bring more of both into your life. \u003cbr\u003e\u003cbr\u003eWhatever it is you've always wanted to do, whether it's publishing a book, starting a jewelry business, or hiking your first 14,000ft mountain, I can help you do it. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want you to spend your life doing what you love. And if you don't know what that is yet, I'm here to help you figure it out. \u003cbr\u003e\u003cbr\u003eAnd my approach? I don't believe that anybody should be 'taught' anything, not in the traditional sense anyway. I'm about activities, games, and workshops, not lectures.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re looking to discover your passion, start a business, sharpen your communication skills, or just become a stronger version of yourself, \u003cstrong\u003eI’d absolutely love to work with you\u003c/strong\u003e.\u003c/p\u003e","teachingVideoPlaybackId":"6Yom9mfNleJuDoFK6GgTxa02Md5QO00CVEH1Z3g2STLac","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was \u003cstrong\u003e\u003cu\u003eCERTAINLY\u003c/u\u003e\u003c/strong\u003e winning Brown U's Hazeltine Prize in Entrepreneurial Mentorship. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eHere's why:\u003cbr\u003e\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eThere's nothing I love more than mentorship\u003c/u\u003e\u003c/strong\u003e. After so many years of pouring myself into it, it was incredible to be recognized :)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI was \u003cstrong\u003e\u003cu\u003ethe first undergrad to win the award\u003c/u\u003e\u003c/strong\u003e. Traditionally, it's reserved for faculty and alumni!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eThe award is named for Professor Hazeltine, who is a\u003cstrong\u003e\u003cu\u003e LEGENDARY\u003c/u\u003e\u003c/strong\u003e professor at Brown. He's taught there for 65 years, and \u003cstrong\u003eis still teaching (even though he's 94)\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIt proved that what I wanted to do for the rest of my life (coach, mentor, and teach) was something I could (and probably should) do. It was so validating!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIt led to my current position as Adjunct Lecturer at Brown (which is my \u003cstrong\u003e\u003cu\u003esecond\u003c/u\u003e\u003c/strong\u003e greatest achievement)\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"dc2a93f3-d2ec-4172-85b5-3a3f89f96cea\"}"},{"__ref":"Favorites:{\"uuid\":\"6f224e28-ae9f-457f-ba41-e6d877fe9278\"}"},{"__ref":"Favorites:{\"uuid\":\"39eae421-5053-426c-a152-b379e4ff009a\"}"}],"causesSupported":[],"major":"Sociology/Entrepreneurship","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9b6e9f6c-3b97-472b-956b-61f6343c9794\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e6f535e-dadd-4fb8-87ec-bc247c042b87\"}"},{"__ref":"DeepDives:{\"uuid\":\"8f7fc7d5-908c-470e-b616-ed47e92d30c
