xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"7b975ec9-88fa-4da0-881f-3a309a54a54f\"}":{"__typename":"DeepDives","uuid":"7b975ec9-88fa-4da0-881f-3a309a54a54f","content":"\u003cp\u003eSomething about me that often surprises people when I bring it up is that I’ve spent several years on-and-off working on small dairy farms in rural areas. During the COVID pandemic, I took a gap year off from Stanford and worked on a small cow dairy in the redwood-covered hills of rural Northern California. It was a transformative experience, and I wanted more. I later worked on a goat dairy in Washington in the hills near Mt. Ranier National Park. Having spent much of my life pursuing more intellectual forms of labor, learning to work with my hands, and with animals, has given me a different way of looking at the world. \u0026nbsp;\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"2d28fd8c-d9a4-4183-847e-05e636ed1e38\"}":{"__typename":"DeepDives","uuid":"2d28fd8c-d9a4-4183-847e-05e636ed1e38","content":"\u003cp\u003eI hope to become a good writer, and maybe publish something someday. I’d really like to work on my writing as a craft and as an art. The more I’ve learned about writing, the more I appreciate all that goes into it, and the more I realize I still have much more to learn.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b50483c7-5047-48db-be31-3761effb1410\"}":{"__typename":"DeepDives","uuid":"b50483c7-5047-48db-be31-3761effb1410","content":"\u003cp\u003eIn many ways I am a Platonist, and I believe in the power of dialogue. As Plato points out, truth is dialogic: it really can’t be discovered by a single individual. It takes two people, in a honest, open exchange, to get to what’s true and real. Ideally, mentorship is a dialogue of this kind. As much as I mentor and teach my students, I also learn from them, and we learn new things—things we’d struggle to discover on our own—together. At a deep level, I’m passionate about helping young people grow through reflection. I aspire to be a mentor that helps guide my students in examining their lives and choosing their values. As Socrates famously said, “the unexamined life is not worth living”—that’s something I really hold to.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"0409e8d8-88a3-44e8-a2b9-b1c1c8ef17d0\"}":{"__typename":"DeepDives","uuid":"0409e8d8-88a3-44e8-a2b9-b1c1c8ef17d0","content":"\u003cp\u003eI’ve spent several years now working on a larger academic project in my spare time. It’s a study of the ‘last man’ novel genre. The premise of these post-apocalyptic science fiction novels is that the main character is the last man or woman left alive on earth. Beginning in Victorian England with the publication of Mary Shelley’s “The Last Man”, the genre continued developing, mostly through English writers, until the turn of the century. I analyze the genre and its themes in the context of the philosophical work of Immanuel Kant, especially his notion of the noumenal world. I still have a ton of work to do, but it’s something I hope to publish someday. \u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"6b8d5077-abd4-465e-a0d5-90f23cfcc6ba\"}":{"__typename":"Education","uuid":"6b8d5077-abd4-465e-a0d5-90f23cfcc6ba","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":"2022","expectedGradYear":"2022","major":"Religious Studies","degree":"BA"},"School:{\"uuid\":\"fc51edc4-91cc-4420-b9c5-d82cd9363070\"}":{"__typename":"School","uuid":"fc51edc4-91cc-4420-b9c5-d82cd9363070","name":"Rancho Mirage High School","city":"Rancho Mirage","type":"HIGH","state":"California","country":"United States","zip":"92270"},"Education:{\"uuid\":\"7bb15681-4f65-4019-a165-a1880e6cdaf1\"}":{"__typename":"Education","uuid":"7bb15681-4f65-4019-a165-a1880e6cdaf1","school":{"__ref":"School:{\"uuid\":\"fc51edc4-91cc-4420-b9c5-d82cd9363070\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"aca739bb-55e0-40da-8196-78aa1a9e34ec\"}":{"__typename":"MentorPublicProfile","uuid":"aca739bb-55e0-40da-8196-78aa1a9e34ec","displayName":"Palmer M.","slug":"palmer-manes","biography":"\u003cp\u003eHi! My name is Palmer, and I’m a graduate of Stanford University, where I earned a BA with Honors in Religious Studies. The honors thesis I wrote at Stanford won the Bender Family Jewish Studies Undergraduate Award. I have over two years of college counseling experience, with a particular emphasis on helping students with college admissions essays and essay-writing competitions (such as the John Locke Institute Essay Competition and the Concord History Review). \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy own experience of applying to college and writing the personal statement was a bit frustrating, and I’ve become dedicated to providing the resources and guidance I wish I’d had. I strongly believe in demystifying the admissions process and helping students present a unique story about themselves through their admissions materials. My method is personalized and dialogic. Through active conversation with the students, I push them to identify and crystallize a narrative about themselves that represents a strong case for admission.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eRather than a one-size-fits-all approach, I seek to really engage with the student and acknowledge their perspective. What are they passionate about? What’s important to them? What values do they believe in, and how do they want to actualize them in the world? An effective approach to college admissions is built on a core of authentic reflection on the part of the student, and I view my role as facilitating that. This ensures high-quality personal essays and also helps the student decide what they want to get out of their education.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m passionate about teaching writing, philosophy, literature, and the humanities in general. But I have a wide variety of tutoring experience—I've helped students with a variety of AP courses, SAT and high school entrance exam text prep, college application strategy, and more.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my time spent tutoring, I am very interested in farming and animal husbandry and have spent two years off-and-on working on goat and cow dairy farms. I also enjoy reading philosophy, hiking, biking, and practicing martial arts.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI look forward to meeting you!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"02nKe02TI4BIjLtfPIK02cPEsgzEz6V6tu9Yt500pHVezrs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Religious Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7b975ec9-88fa-4da0-881f-3a309a54a54f\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d28fd8c-d9a4-4183-847e-05e636ed1e38\"}"},{"__ref":"DeepDives:{\"uuid\":\"b50483c7-5047-48db-be31-3761effb1410\"}"},{"__ref":"DeepDives:{\"uuid\":\"0409e8d8-88a3-44e8-a2b9-b1c1c8ef17d0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/325f29de-93c7-409e-b0b4-44ba6d1f0f21/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6b8d5077-abd4-465e-a0d5-90f23cfcc6ba\"}"},{"__ref":"Education:{\"uuid\":\"7bb15681-4f65-4019-a165-a1880e6cdaf1\"}"}],"hiredAt":"2024-08-30T08:36:42.938Z","topics":["Sports Journalism","Philosophy","Literature","History Project","Creative Writing","Women \u0026 Gender Studies","Debate","Public Speaking","Journalism","Law / Government / Policy","Reading","History","Economics","College Essay Writing","Writing","Business / Entrepreneurship","Finance / Investing"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"palmer-manes\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"aca739bb-55e0-40da-8196-78aa1a9e34ec\"}"}}},"_sentryTraceData":"28af718d4c9a46dba13d9c5155430b80-a964d3688c16c4a7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0e
