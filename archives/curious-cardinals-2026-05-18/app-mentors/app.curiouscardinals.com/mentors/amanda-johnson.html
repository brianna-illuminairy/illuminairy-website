xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"82977e80-7372-47d8-a6e6-bf94ef7765d5\"}":{"__typename":"DeepDives","uuid":"82977e80-7372-47d8-a6e6-bf94ef7765d5","content":"\u003cp\u003eThis may be an overstated answer, but my greatest role model is my mom. She is a 1st-grade teacher and since before I can remember, has consistently instilled the value of education in me. I've always searched for opportunities to teach myself, having picked up a hobby as a TeachersPayTeachers content creator during COVID-19, and remotely teaching children in Paraguay English in order to obtain citizenship. Ever since my second semester at Cornell, I've been a teaching assistant, and have continued onto that work during my summers, and now through pursuing an Education minor, simultaneously working as a course assistant for economics and a tutor in SSAT prep for Patterson Tutoring. Teaching holds me accountable, provides fulfillment, and allows me to make connections I had never thought possible!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"5bc68e28-bd2e-4b45-a6ad-7594d2147872\"}":{"__typename":"School","uuid":"5bc68e28-bd2e-4b45-a6ad-7594d2147872","name":"Spackenkill High School","city":"Poughkeepsie","type":"HIGH","state":"New York","country":"United States","zip":"12603"},"Education:{\"uuid\":\"b9caf2a5-4df4-4bfe-8df4-81b53cd1cb91\"}":{"__typename":"Education","uuid":"b9caf2a5-4df4-4bfe-8df4-81b53cd1cb91","school":{"__ref":"School:{\"uuid\":\"5bc68e28-bd2e-4b45-a6ad-7594d2147872\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"34ae0fca-5b3f-4c30-bb72-b6cbefbd3dc2\"}":{"__typename":"Education","uuid":"34ae0fca-5b3f-4c30-bb72-b6cbefbd3dc2","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"97c2e713-8338-46b2-9dd3-1bde66a7dc0a\"}":{"__typename":"MentorPublicProfile","uuid":"97c2e713-8338-46b2-9dd3-1bde66a7dc0a","displayName":"Amanda J.","slug":"amanda-johnson","biography":"\u003cp\u003eHi, I'm Amanda! I'm a student-athlete at Cornell University, where I row competitively and channel my energy into a wide range of passions, from singing and coding to exploring the ever-evolving world of business and technology. Balancing the demands of Division I athletics with a rigorous academic schedule has been one of my greatest challenges, but it's also shaped me into someone with a strong command of time management and a resilient approach to stress.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not in the classroom or on the water, I love tuning into self-help podcasts, where I pick up practical tips on nutrition, wellness, and personal growth. I've also recently taken up baking (banana bread is my specialty) and I'm always happy to swap recipes if you're interested!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I study data science with a deep professional interest in technology, AI research, and policy. I'm fascinated by the ways data can transform industries, particularly in health, education, and sports. I'm currently pursuing an accelerated master's degree in data science, and my thesis centers on researching and developing a financial literacy tool for low-income adolescents, a project that sits at the intersection of everything I care about.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've had the privilege of serving as a tutor and teaching assistant at Cornell for five semesters across a variety of subjects, including economics, statistics, data science, and networks. I genuinely love helping others learn, and switching up the courses I support keeps things fresh and intellectually stimulating.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy path to Cornell was shaped significantly by my experiences before college. Growing up, I spent much of my time working in the service industry and volunteering, which gave me a deep appreciation for community and a strong desire to use my skills in service of others. These experiences fuel my belief that data science and AI are powerful tools for advancing equity and improving the lives of underserved communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I want to leverage my knowledge to innovate at the intersection of technology and social impact, because the possibilities of data are truly endless, and I intend to use them meaningfully. I am super excited for the possibility of getting to know you and can't wait to connect!\u003c/p\u003e","teachingVideoPlaybackId":"eUld52ycp002W1BNSdC00lH8DGSHgFTP6K00ObbJy00Mxl00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"82977e80-7372-47d8-a6e6-bf94ef7765d5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f0a31d89-8804-47c2-a810-776cbbaaf6e6/-/preview/-/format/jpg/","https://ucarecdn.com/d1433c40-f433-477e-b324-76fd513c95bf/-/preview/-/format/jpg/","https://ucarecdn.com/5f48e3f7-2d5f-4ca1-83db-4a7adc2e7e00/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"
