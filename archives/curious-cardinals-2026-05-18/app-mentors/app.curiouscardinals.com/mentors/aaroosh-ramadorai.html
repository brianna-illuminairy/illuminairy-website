xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3146c683-138e-4234-aaf8-16d466ecc668\"}":{"__typename":"DeepDives","uuid":"3146c683-138e-4234-aaf8-16d466ecc668","content":"\u003cp\u003eEver since I was a kid I've really loved astronomy and math, and as I got older that transitioned into a love for physics. When I got to college, I chose to major in applied physics because I sought opportunities to use physics to solve real-world technical challenges. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f28fa492-97cc-418b-ba19-2eb229a3cbf2\"}":{"__typename":"DeepDives","uuid":"f28fa492-97cc-418b-ba19-2eb229a3cbf2","content":"\u003cp\u003eMentorship matters to me because everyone needs it. No one is born knowing everything, and learning doesn't happen in a vacuum. Just as I have had mentors who have helped me get to where I am today, I want to return the favor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"253b6a97-664e-487d-ae0d-b699d708d2c8\"}":{"__typename":"DeepDives","uuid":"253b6a97-664e-487d-ae0d-b699d708d2c8","content":"\u003cp\u003eI like biking, hiking, reading, astronomy, watching soccer, and exploring the city!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a2371a01-6018-453e-8383-87bfa13c0b76\"}":{"__typename":"DeepDives","uuid":"a2371a01-6018-453e-8383-87bfa13c0b76","content":"\u003cp\u003eTake more initiative! Opportunities often don't come to you unless you seek them out first and ask for help!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"52f855e9-a7b3-4fb7-80fe-e7cf052e2686\"}":{"__typename":"School","uuid":"52f855e9-a7b3-4fb7-80fe-e7cf052e2686","name":"Lexington High School","city":"Lexington","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02421"},"Education:{\"uuid\":\"31b3b567-b296-4b3c-a242-492c1b3596dc\"}":{"__typename":"Education","uuid":"31b3b567-b296-4b3c-a242-492c1b3596dc","school":{"__ref":"School:{\"uuid\":\"52f855e9-a7b3-4fb7-80fe-e7cf052e2686\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"10a5ad9a-cbaa-4a29-b816-ead2e067fc4a\"}":{"__typename":"Education","uuid":"10a5ad9a-cbaa-4a29-b816-ead2e067fc4a","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Applied Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"664856c2-a1db-427d-a85f-895832dbbb37\"}":{"__typename":"MentorPublicProfile","uuid":"664856c2-a1db-427d-a85f-895832dbbb37","displayName":"Aaroosh R.","slug":"aaroosh-ramadorai","biography":"\u003cp\u003eHey! I'm Aaroosh, and I'm currently a senior at Columbia University majoring in Applied Physics. I have developed a strong interest in clean energy, particularly nuclear energy, and I hope to pursue a long-term career in this field. Throughout undergrad, I have become especially fascinated by how advances in science and engineering can address large-scale societal challenges such as climate change and reliable energy access. I enjoy learning not just the theory behind physical systems, but also how those ideas translate into real-world technologies that can improve people’s lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEducation and mentorship have been a meaningful part of my life. I previously tutored students through the RSM Foundation, where I helped younger learners build confidence in math and science and encouraged them to approach difficult problems with curiosity. I have also worked with my high school Science Olympiad team, supporting students as they prepared for competitions and guiding them with lesson plans. Through these experiences, I discovered that mentoring is not only about explaining material clearly but also about listening carefully, adapting to different learning styles, and helping students develop independence. I find it very rewarding to watch students gradually become more comfortable asking questions and taking risks.\u003c/p\u003e\u003cbr\u003e\u003cblockquote\u003e\u003cp\u003eAt Columbia, I was part of Columbia's Engineers Without Borders chapter, a club where we partner with disadvantaged communities on sustainable engineering projects. I worked as an Education \u0026amp; Training Chair, helping organize workshops and guiding students through technical concepts. I also organized speaker events to inspire students to go into sustainable engineering. Leading group learning sessions has strengthened my ability to adjust explanations, encourage questions, and create an environment where students feel comfortable participating.\u003c/p\u003e\u003c/blockquote\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I enjoy reading both fiction and nonfiction, playing music, and exploring the city! I also love skiing, biking, and amateur astronomy. These hobbies keep me curious and remind me that science is connected to everyday experiences, not just classrooms and textbooks.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, I am excited about the opportunity to mentor students in physics and math at Curious Cardinals and to cultivate a supportive learning environment. I hope to help learners build confidence, strengthen their understanding, and develop a lasting curiosity about the world around them.\u003c/p\u003e","teachingVideoPlaybackId":"H8rJfcdB3QgTb01J3g9XVPLBYWUHtF028xkxCwi00yESLY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3146c683-138e-4234-aaf8-16d466ecc668\"}"},{"__ref":"DeepDives:{\"uuid\":\"f28fa492-97cc-418b-ba19-2eb229a3cbf2\"}"},{"__ref":"DeepDives:{\"uuid\":\"253b6a97-664e-487d-ae0d-b699d708d2c8\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2371a01-6018-453e-8383-87bfa13c0b76\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dd1f7de5-72ae-46dc-b74d-d1dd1c04cfb2/-/preview/-/format/jpg/","https://ucarecdn.com/cf38e902-84ba-4403-9fbd-48dec610ca65/-/preview/-/format/jpg/","https://ucarecdn.com/61c58641-0bfc-48e2-a110-cfaf5036b8d7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"31b3b567-b296-4b3c-a242-492c1b3596dc\"}"},{"__ref":"Education:{\"uuid\":\"10a5ad9a-cbaa-4a29-b816-ead2e067fc4a\"}"}],"hiredAt":"2026-02-11T19:04:08.615Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade M
