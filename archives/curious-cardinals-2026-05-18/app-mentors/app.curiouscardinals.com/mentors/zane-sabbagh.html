xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"1c12fa03-c8f4-459d-a1d1-d081caf0e538\"}":{"__typename":"DeepDives","uuid":"1c12fa03-c8f4-459d-a1d1-d081caf0e538","content":"\u003cp\u003eSal Khan. He quit his job in finance to do what he truly loved: teach. And then he grew to such his following by tenaciously pursuing it, improving its quality, and focusing on the people he was reaching instead of just trying to grow.\u003cbr\u003e\u003cbr\u003eIn a recent survey of college kids, a near majority said Khan Academy was pivotal in getting them into college. Khan Academy runs on a budget of $50 million a year. That is the epitome of capital efficiency.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWatching him speak at Stanford last year was a dream come true. I've never seen an audience as captivated in my life. If I could make a fraction of the impact he's made, I'd feel permanently fulfilled.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"71855b49-9beb-438e-844f-58a63f006007\"}":{"__typename":"DeepDives","uuid":"71855b49-9beb-438e-844f-58a63f006007","content":"\u003cp\u003eI'm the proud grandson of two public elementary and high school teachers. \u003cbr\u003e\u003cbr\u003eWhen my grandparents walk around their hometown of Nazareth, even 50 years later, they're stopped by their former students who say hello and thank them.\u003cbr\u003e\u003cbr\u003eMy grandparents were famous for taking in the \"troubled\", \"stupid\" or \"lazy\" kids and invigorating a love for teaching. Those kids became some of the best doctors and lawyers in the nation. It's taught me that being a teacher is being someone's supporter and helping them give themselves a chance to excel.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"05d15fcb-bafc-4f8f-82fd-bbbbb0bacce1\"}":{"__typename":"DeepDives","uuid":"05d15fcb-bafc-4f8f-82fd-bbbbb0bacce1","content":"\u003cp\u003eI chose Symbolic Systems because you get to enjoy the equivalent of a liberal arts major while still getting an engineering degree. Well, almost, because you have to take lots of computer science along the way too.\u003cbr\u003e\u003cbr\u003eJokes aside, I love SymSys because I love learning about lots of different things, and it lets me take classes in biology, psychology, economics, philosophy and linguistics while still counting towards my major\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"fd311eda-7422-42c9-8c29-2d5887556e04\"}":{"__typename":"DeepDives","uuid":"fd311eda-7422-42c9-8c29-2d5887556e04","content":"\u003cp\u003eI started competitive swimming very late, in my freshman year of high school. My coach told me I'd never make it pro. Most of my teammates were basically recruited by the end of sophomore year.\u003cbr\u003e\u003cbr\u003eI spent 24 hours a week in the pool to prove to myself that I could still make it. 5 years later, I competed internationally at the Asian Open Water Swimming Championships and came 9th.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"25fdeb66-2753-4715-9489-56419e7d3499\"}":{"__typename":"School","uuid":"25fdeb66-2753-4715-9489-56419e7d3499","name":"UWC Thailand","city":"Tambon Thep Krasatti","type":"HIGH","state":"Chang Wat Phuket","country":"Thailand","zip":"83110"},"Education:{\"uuid\":\"efc0ced6-0ca3-4fb8-99f3-8bbcd42371ac\"}":{"__typename":"Education","uuid":"efc0ced6-0ca3-4fb8-99f3-8bbcd42371ac","school":{"__ref":"School:{\"uuid\":\"25fdeb66-2753-4715-9489-56419e7d3499\"}"},"startYear":"2014","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"bf9218c0-614c-4ac0-be87-486c4aa8e0c5\"}":{"__typename":"Education","uuid":"bf9218c0-614c-4ac0-be87-486c4aa8e0c5","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Symbolic Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"f8f28554-9d81-4822-92ee-9bdb42a3becb\"}":{"__typename":"MentorPublicProfile","uuid":"f8f28554-9d81-4822-92ee-9bdb42a3becb","displayName":"Zane S.","slug":"zane-sabbagh","biography":"\u003cp\u003eI grew up in Uzbekistan, where there were more donkey carts on the highways than cars. \u003cbr\u003e\u003cbr\u003eWhen I came to Stanford, I'd never seen a line of code. My first computer science teaching assistant made me fall in love with coding because of how patient and supportive she was. I want to do the same with the coders of the future!\u003cbr\u003e\u003cbr\u003eI spent 2 years teaching introductory computer science at Stanford. My students have gone on to work in Silicon Valley's best startups, even really technical ones, like Docker.\u003cbr\u003e\u003cbr\u003eIn my junior year, I raised $500,000 and left Stanford for a year and a half to build my own consumer AI startup. We grew to thousands of users and I wrote 200,000+ lines of code.\u003cbr\u003e\u003cbr\u003eI spend most of my time working on, at or with startups. I've been part of StartX (like Curious Cardinals!), a Z Fellow, a PEAK Fellow, and was nominated for (but haven't yet won) the Forbes 30U30.\u003cbr\u003e\u003cbr\u003eIn my free time, I enjoy backpacking in East Asia (Taiwan is my favorite!), swimming a lot (I competed at the Asian Open Water Swimming Championships and came 9th), and reading (fav. book: The Giving Tree).\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"n3hvr44vec1qjUHXSJhUl1p9krjZd7MCB9R4oIAD6f8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1c12fa03-c8f4-459d-a1d1-d081caf0e538\"}"},{"__ref":"DeepDives:{\"uuid\":\"71855b49-9beb-438e-844f-58a63f006007\"}"},{"__ref":"DeepDives:{\"uuid\":\"05d15fcb-bafc-4f8f-82fd-bbbbb0bacce1\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd311eda-7422-42c9-8c29-2d5887556e04\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a3ddf2ac-3ae7-4493-9351-a5a96bc71690/-/preview/-/format/jpg/","https://ucarecdn.com/cec19d0d-57e2-419c-95a2-f2b711d3758b/-/preview/-/format/jpg/","https://ucarecdn.com/789d030e-a6d4-490b-b393-25cfd40db821/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"efc0ced6-0ca3-4fb8-99f3-8bbcd42371ac\"}"},{"__ref":"Education:{\"uuid\":\"bf9218c0-614c-4ac0-be87-486c4aa8e0c5\"}"}],"hiredAt":"2024-09-04T10:19:30.631Z","topics":["Bu
