xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"51b249a7-5861-4528-bb0d-6d6cdda10019\"}":{"__typename":"Favorites","uuid":"51b249a7-5861-4528-bb0d-6d6cdda10019","photoUrl":"https://ucarecdn.com/17846104-c83c-4822-8ad8-9e425a8f968c/","title":"A Good Girl's Guide To Murder by Holly Jackson","type":"BOOK"},"Favorites:{\"uuid\":\"e86258fd-b881-488f-8a96-143e0a3e9458\"}":{"__typename":"Favorites","uuid":"e86258fd-b881-488f-8a96-143e0a3e9458","photoUrl":"https://ucarecdn.com/4d20bc56-fec8-44a5-8838-14a05cf69026/","title":"ENHYPEN","type":"ARTIST"},"Favorites:{\"uuid\":\"fb89eed3-28ab-4072-8572-bc520b6a1e65\"}":{"__typename":"Favorites","uuid":"fb89eed3-28ab-4072-8572-bc520b6a1e65","photoUrl":"https://ucarecdn.com/ef2e27dc-2fe3-40db-a590-a1c3de61f1d0/","title":"Dark Blood","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"426ac485-5f72-4d1d-992c-691ef5ff4d30\"}":{"__typename":"DeepDives","uuid":"426ac485-5f72-4d1d-992c-691ef5ff4d30","content":"\u003cp\u003eI would tell my middle and high school self that, yes, the future is important, but don’t forget to \u003cem\u003elive\u003c/em\u003e right now! I spent so much time stressing and planning for the future that I sometimes missed out on the fun moments happening all around me. Working hard toward the future? Absolutely. It is essential to chase your goals, even when it gets tough and stressful. But it is just as important to go grab your favorite ice cream, laugh with your friends until it hurts, and dance your heart out \u003cem\u003enow\u003c/em\u003e. Following your dreams is not something to wait for — it is ongoing, something to live every day. I spent too much time ticking boxes and preparing for what’s next, but life is also about living and enjoying the crazy, beautiful chaos of the present.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4542fa78-fa58-4a49-834a-68e47d3d1c43\"}":{"__typename":"DeepDives","uuid":"4542fa78-fa58-4a49-834a-68e47d3d1c43","content":"\u003cp\u003eReading books is my absolute favorite thing to do, especially fantasy and mystery. (I’m a huge Potterhead!) I love that magical feeling of getting lost in stories where anything can happen and worlds stretch far beyond our own. That love inspired me to start writing myself. In high school, I published a picture book called \u003cem\u003eSamosas with Saanvi\u003c/em\u003e, sharing my journey of embracing my cultural identity. Now, I want to take the next step and write a novel—continuing to share my story through words and creating that same sense of wonder and magic for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d1de8580-48d0-4baa-9905-d8f77ff37689\"}":{"__typename":"DeepDives","uuid":"d1de8580-48d0-4baa-9905-d8f77ff37689","content":"\u003cp\u003eCan you guess what the first Youtube channel I subscribed to was? 3... 2... 1... Amoeba Sisters! Even before I was in high school, I used to watch these two sisters teach biology through the most enjoyable animations and stories. I never knew too much about science at the time, but this channel made learning so fun that I used to watch these videos like a TV show. As I started to actually take biology classes, I was able to discover the relevance of the different topics and found the subject as a whole beyond fascinating. I specifically am focusing on Molecular Biology because of how connected I feel to the subject. My absolute favorite topics are CRISPR-Cas9 (#1, I wholeheartedly love!!), eukaryotic gene regulation, cancer biology, and of course, everyone's favorite from the Amoeba Sisters... mitosis. If you ever want to talk biology, come find me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f3557df0-9bc4-4972-bc59-8a1f7dd360b4\"}":{"__typename":"DeepDives","uuid":"f3557df0-9bc4-4972-bc59-8a1f7dd360b4","content":"\u003cp\u003eIf you haven't tried the pizza near the Leaning Tower of Pisa, I 100% recommend you do because there is \u003cem\u003enothing\u003c/em\u003e better than amazing food with a beautiful view. In addition to traveling to Italy, I have spent my summers in high school traveling across the world from Indonesia to Mexico to Switzerland. Now, in my first year in college, I am in Amazonas, Brazil! I have traveled for cultural and historical fun with my family, a relaxing day at the pool with a glass of passion fruit juice in hand, or for educational enrichment such as learning about healthcare and research in a different part of the world. Sometimes, the journey may be shorter like when I went across Wisconsin to stay in another city for a month. That summer, I had my Bharatanatyam Arangetram, a traditional solo dance performance after years of training. I traveled to practice with my teacher in the area everyday and got to experience a new part of my state!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"b821eb21-01e9-4141-8181-076924e2bc05\"}":{"__typename":"School","uuid":"b821eb21-01e9-4141-8181-076924e2bc05","name":"Kimberly High School","city":"Kimberly","type":"HIGH","state":"Wisconsin","country":"United States","zip":"54136"},"Education:{\"uuid\":\"883edd25-aebd-46c0-9170-3125c72859fd\"}":{"__typename":"Education","uuid":"883edd25-aebd-46c0-9170-3125c72859fd","school":{"__ref":"School:{\"uuid\":\"b821eb21-01e9-4141-8181-076924e2bc05\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"4c3fcb96-e754-43fe-b32c-60cf3fa94ca8\"}":{"__typename":"Education","uuid":"4c3fcb96-e754-43fe-b32c-60cf3fa94ca8","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Molecular Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"dd90e9e6-ba26-4499-84fa-8e175c1fd99c\"}":{"__typename":"MentorPublicProfile","uuid":"dd90e9e6-ba26-4499-84fa-8e175c1fd99c","displayName":"Aanya K.","slug":"aanya-kasera","biography":"\u003cp\u003eHi everyone!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy name is Aanya, and I am so excited to be a part of the Curious Cardinals family. I am a sophomore on the premed track at Princeton University planning to major in Molecular Biology with minors in Neuroscience and Creative Writing. I absolutely love all things science as well as reading and writing. At school, you’ll find me deep in chemistry and biology, but also enjoying classes on Shakespeare and fairytales! In the future, I hope to pursue pediatric medicine and scientific research, with a special interest in neurology and oncology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Princeton, I love exploring both the scientific world and my creative side. I contribute to \u003cem\u003eThe Daily Princetonian\u003c/em\u003e as part of the Podcast and STEM Research Journalism teams, where I’ve interviewed professors and published content on topics like computational neuropsychiatry, cognitive science, and artificial intelligence. I’ve also written news articles on research in breast cancer, chemical biology, and astrophysics. This is one of my favorite activities at Princeton because it also helps me explore so many different fields and my interest in research, and it is also a great experience to learn more about writing for specific audiences and explore audio journalism.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also serve on Princeton's Undergraduate Student Government’s Mental Health and Diversity, Equity, and Inclusion Committees. I have learned more about administrative matters, academic policy, and civic engagement in two areas that I am dedicated to improving along with collaborating with the rest of my team. I have also learned more about leadership as a member the Council on Science \u0026amp; Technology Student Advisory Board, where our goal is to increase science engagement and appreciation in our community. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy interest for scientific and medical research led me to collaborate with the IMDEA Materials Institute, where I explored biomaterials and regenerative medicine. I gained experience conducting literature review, research, and scientific writing for an in-progress paper headed towards publication. I also am spending my first summer in college interning with Fundação Oswaldo Cruz in Brazil, where I am learning about virology and immunology lab techniques and research.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA commitment that I have pursue since high school since culture has always been deeply important to me, is developing a cultural education and appreciation initiative in my community to encourage children to develop their global literacy and spark their love for diversity. I published a children’s book, Samosas with Saanvi, to share how I grew to love my cultural identity, capture the joys of cultural diversity, and portray the emotional journey behind acceptance. The mission of my project was to bridge the cultural literacy gap I noticed in my community, allow children to discover their own cultural identities, and foster meaningful community connections.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am so happy to be part of this amazing community and can’t wait to learn and grow with all of you 🤗\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWarmly,\u003c/p\u003e\u003cp\u003eAanya\u003c/p\u003e","teachingVideoPlaybackId":"Q7JpO7vex00URFp9vKkWLOjq01jK00A02ceeIkMhkGw4OPk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn high school, one of my biggest involvements was with HOSA Future Health Professionals. HOSA is an organization that I joined to learn more about the healthcare, meet other students interested in exploring this field, and build my leadership skills. When I first started HOSA I went to the International Leadership Conference, and a fun tradition we have is that each chapter designs its own pin to trade with members in another chapter as a fun way to meet new people. I was absolutely terrified to go up to people because I was scared I might mess up the conversation or seem \"weird.\" Throughout my four years in high school, I slowly started to gain confidence and leadership skills. I got involved with leadership roles at my school and state, and served as Wisconsin HOSA State President my last year of high school. My team and I planned for the State Leadership Conference, where over 3000 people attended. I was still scared to speak on stage in front of this many people, but my past experiences in HOSA helped me feel more comfortable to take this risk outside of my comfort zone. After speaking on stage various times, talking and laughing with other members, and making amazing friends with the rest of my team, I left the conference feeling incredibly proud of the growth I experienced throughout my years in HOSA. It felt incredible to feel more confident in myself and be able to make such deep connections with so many people. I learned more about myself and my leadership abilities, and I take these experiences to guide me through future opportunities for growth.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"51b249a7-5861-4528-bb0d-6d6cdda10019\"}"},{"__ref":"Favorites:{\"uuid\":\"e86258fd-b881-488f-8a96-143e0a3e9458\"}"},{"__ref":"Favorites:{\"uuid\":\"fb89eed3-28ab-4072-8572-bc520b6a1e65\"}"}],"causesSupported":[],"major":"Molecular Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"426ac485-5f72-4d1d-992c-691ef5ff4d30\"}"},{"__ref":"DeepDives:{\"uuid\":\"4542fa78-fa58-4a49-834a-68e47d3d1c43\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1de8580-48d0-4baa-9905-d8f77ff37689\"}"},{"__ref":"DeepDives:{\"uuid\":\"f3557df0-9bc4-4972-bc59-8a1f7dd360b4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/31492a40-ca74-40d9-874d-ce797549a8f2/-/preview/-/format/jpg/","https://ucarecdn.com/b660f062-0ce4-48df-8887-2a3ecb4b2fb6/-/preview/-/format/jpg/","https://ucarecdn.com/62bff404-0511-4202-b034-9d5c7f2c4b93/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"883edd25-aebd-46c0-9170-3125c72859fd\"}"},{"__ref":"Education:{\"uuid\":\"4c3fcb96-e754-43fe-b32c-60cf3fa94ca8\"}"}],"hiredAt":"2025-07-02T20:42:43.919Z","topics":["Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Chemistry","Writing","French","Academic Coaching","College Essay Writing","Executive Function","Reading","Creative Writing","K-6 Storyboo
