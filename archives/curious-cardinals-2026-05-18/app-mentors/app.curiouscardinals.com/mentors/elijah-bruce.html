xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7544de02-f10b-4beb-b5ff-aa8cf6651d1b\"}":{"__typename":"Favorites","uuid":"7544de02-f10b-4beb-b5ff-aa8cf6651d1b","photoUrl":"https://ucarecdn.com/7f909711-251c-477a-be13-aa39b61c43da/","title":"GTA 5","type":"GAME"},"Favorites:{\"uuid\":\"a0863d05-276c-40a9-a894-3777a4b7738b\"}":{"__typename":"Favorites","uuid":"a0863d05-276c-40a9-a894-3777a4b7738b","photoUrl":"https://ucarecdn.com/7f909711-251c-477a-be13-aa39b61c43da/","title":"Football ","type":"SPORT"},"Favorites:{\"uuid\":\"a1e31a7a-a233-4af0-b68a-d424a4080750\"}":{"__typename":"Favorites","uuid":"a1e31a7a-a233-4af0-b68a-d424a4080750","photoUrl":"https://ucarecdn.com/7f909711-251c-477a-be13-aa39b61c43da/","title":"Avatar ","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c91dd8db-cfef-467c-b32c-be233ef7036f\"}":{"__typename":"DeepDives","uuid":"c91dd8db-cfef-467c-b32c-be233ef7036f","content":"\u003cp\u003eLooking back at my middle and high school years, there's a piece of advice I'd definitely emphasize to my younger self: the importance of building a strong support network. As a passionate, ambitious, and at the time, somewhat shy student deeply involved in various clubs, having a network of supportive individuals would have been incredibly valuable. I should have built a bigger network of mentors, teachers, and peers who understood my aspirations and the unique challenges I faced.\u003c/p\u003e\u003cp\u003eI would tell myself to not hesitate in reaching out and connecting with people who inspire me or whom I admire. Whether it was a teacher whose class I enjoyed, a senior student who had navigated similar paths, or a community member engaged in work I found fascinating, these connections could have enriched my journey significantly. Building a support network isn't just about receiving help; it's also about forming meaningful relationships and learning from others' perspectives. This network would have become a source of encouragement, advice, and inspiration, helping me navigate my academic and extracurricular commitments more effectively and with greater confidence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ddca87f7-0d28-414b-af7c-9da893ec3853\"}":{"__typename":"DeepDives","uuid":"ddca87f7-0d28-414b-af7c-9da893ec3853","content":"\u003cp\u003eIn my free time, I find immense joy and relaxation in baking. Each session in the kitchen is like an adventure, where I either experiment with new recipes or work on perfecting old favorites. My kitchen transforms into a creative sanctuary, enveloped in the warm, comforting aroma of freshly baked goods. I love the process of meticulously gathering ingredients, measuring and mixing everything with a practiced hand. Whether it's kneading dough for bread, intricately decorating cupcakes, or tackling a challenging new dessert, baking is my way of unwinding and expressing my creativity. The ultimate satisfaction comes from seeing the smiles on the faces of my loved ones as they enjoy my creations. It's more than just a hobby; it's a part of who I am.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"882df662-f367-4fd8-83ac-c636f9cb8b95\"}":{"__typename":"DeepDives","uuid":"882df662-f367-4fd8-83ac-c636f9cb8b95","content":"\u003cp\u003eMy dream job is to become a United States Senator, a role where I can actively work to implement reform, change unproductive systems, and make the American dream more tangible. I am deeply committed to public service and to the betterment of society. As a Senator, I would have the unique opportunity to shape policies and influence decisions that could positively impact millions of lives. My focus on creating tangible, meaningful changes comes from a desire to see real, measurable improvements in the lives of people across the nation. I know that embracing this path requires unwavering dedication, resilience, and a comprehensive understanding of the complex issues our country faces. With my passion and determination, I believe I can make a significant impact and contribute positively to our society.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"85d7135a-7896-49cb-b003-e531f1eb2692\"}":{"__typename":"DeepDives","uuid":"85d7135a-7896-49cb-b003-e531f1eb2692","content":"\u003cp\u003eMy greatest role model and mentor is undoubtedly my mom. Her strength and resilience have shaped who I am in profound ways. Supporting three children on a low-paying job, she was the pillar of our family, always managing to shield us from the reality of living paycheck to paycheck. Her ability to handle such challenges with grace and positivity was nothing short of inspiring. She constantly encouraged me to believe that I could achieve anything in the world if I put my mind to it. This unwavering belief she had in my potential fueled my ambitions and dreams. Above all, her unconditional love has been the bedrock of my life. Her sacrifices, her optimism in the face of adversity, and her undying love and support have made her not just a mother, but my lifelong mentor and hero.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"e2df9623-d82e-43ed-ac0e-b95ff0870568\"}":{"__typename":"School","uuid":"e2df9623-d82e-43ed-ac0e-b95ff0870568","name":"Manchester High School","city":"Midlothian","type":"HIGH","state":"Virginia","country":"United States","zip":"23112"},"Education:{\"uuid\":\"bca6d792-1019-4ba8-81d4-31ae3dfa403f\"}":{"__typename":"Education","uuid":"bca6d792-1019-4ba8-81d4-31ae3dfa403f","school":{"__ref":"School:{\"uuid\":\"e2df9623-d82e-43ed-ac0e-b95ff0870568\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"da02c38c-928b-4775-99ea-ccd059e8eaa7\"}":{"__typename":"Education","uuid":"da02c38c-928b-4775-99ea-ccd059e8eaa7","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Political Science ","degree":null},"MentorPublicProfile:{\"uuid\":\"bcf8d5bb-a2be-4145-88b7-6db729258906\"}":{"__typename":"MentorPublicProfile","uuid":"bcf8d5bb-a2be-4145-88b7-6db729258906","displayName":"Elijah B.","slug":"elijah-bruce","biography":"\u003cp\u003eHello! My name is Elijah Williams, and I am deeply passionate about guiding and inspiring students in their academic and extracurricular pursuits. As a student myself, I have always been fascinated by the rich tapestry of history and the nuanced art of the English language. These subjects do more than just tell us where we've been or how we communicate; they open doors to understanding diverse cultures, perspectives, and the very essence of human experience.\u003c/p\u003e\u003cp\u003eMy journey as a mentor began as a personal quest to delve deeper into these subjects. However, it quickly transformed into a mission to help others find their own paths in the vast world of academia. I believe that every student has a unique set of talents and interests, and my goal is to help them unlock their potential, not just in history and English, but in all areas of their educational journey.\u003c/p\u003e\u003cp\u003eOne of my most rewarding experiences has been aiding students in developing and pursuing their extracurricular passions. Whether it's building a nonprofit organization from the ground up or securing a dream internship, I strive to provide the support and guidance needed to turn these ambitious dreams into reality. The process of nurturing an idea, overcoming challenges, and seeing tangible results is incredibly fulfilling, both for me and the students I mentor.\u003c/p\u003e\u003cp\u003eMy approach to tutoring is student-centered and flexible, adapting to the individual learning styles and needs of each student. I firmly believe that learning should be an engaging, interactive process. In my history and English sessions, I often incorporate discussions, multimedia resources, and creative assignments to make learning more dynamic and enjoyable.\u003c/p\u003e\u003cp\u003eBeyond academics, I focus on developing essential life skills such as critical thinking, effective communication, and leadership. These skills are crucial not just for academic success, but for thriving in today's fast-paced, interconnected world. I encourage students to think critically about the world around them, articulate their thoughts and opinions eloquently, and lead initiatives that make a positive impact.\u003c/p\u003e\u003cp\u003eIn summary, my role as a mentor goes beyond helping students excel academically. It is about inspiring them to explore their interests, develop new skills, and make meaningful contributions in their communities. I am excited to continue this journey and look forward to helping more students realize their potential and achieve their dreams.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my proudest moments revolves around a Christmas gift I got for my sister, who I consider the best sister ever. Leading up to her birthday, she had hinted at wanting a teal record player, a gift that both her friends and partner considered but ultimately didn't get for her. Seeing her slight disappointment, I tucked this information away, knowing her birthday wasn't the only opportunity to make her wish come true.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen Christmas rolled around, I knew exactly what I wanted to do. I searched high and low until I found the perfect teal record player, one that matched not only her taste but also the aesthetic she loves. Keeping it a secret was tough, but seeing her reaction on Christmas made it all worth it.\u003c/p\u003e\u003cp\u003eAs she unwrapped the gift, her expression shifted from surprise to sheer joy. When she realized what it was, she burst into tears, and in that moment, I felt an overwhelming sense of pride and happiness. It wasn't just about the gift itself, but about showing her how much she means to me. The fact that I could give her something she truly wanted, especially after others hadn't, made it all the more special. Her reaction was the best reward I could have asked for, far surpassing any award or recognition. That Christmas, I not only gave my sister a record player but also a memory that both of us will cherish forever.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7544de02-f10b-4beb-b5ff-aa8cf6651d1b\"}"},{"__ref":"Favorites:{\"uuid\":\"a0863d05-276c-40a9-a894-3777a4b7738b\"}"},{"__ref":"Favorites:{\"uuid\":\"a1e31a7a-a233-4af0-b68a-d424a4080750\"}"}],"causesSupported":[],"major":"Political Science ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c91dd8db-cfef-467c-b32c-be233ef7036f\"}"},{"__ref":"DeepDives:{\"uuid\":\"ddca87f7-0d28-414b-af7c-9da893ec3853\"}"},{"__ref":"DeepDives:{\"uuid\":\"882df662-f367-4fd8-83ac-c636f9cb8b95\"}"},{"__ref":"DeepDives:{\"uuid\":\"85d7135a-7896-49cb-b003-e531f1eb2692\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bb7df64d-c7a2-4ed8-9850-d3d283d76fb3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"bca6d792-1019-4ba8-81d4-31ae3dfa403f\"}"},{"__ref":"Education:{\"uuid\":\"da02c38c-928b-4775-99ea-ccd059e8eaa7\"}"}],"hiredAt":"2023-11-15T22:27:51.958Z","topics":["History Project","Literature","Philosophy","Law / Government / Policy","Debate","Race \u0026 Ethnicity","Public Speaking","History","Reading","Executive Function","Academic Coaching","Writing","Journalism"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elijah-bruce\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bcf8d5bb-a2be-4145-88b7-6db729258906\"}"}}},"_sentryTraceData":"c8e71e63dc644c7aa16cc9c83cd17096-b9cf09f18cc0854c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c8e71e63dc644c7aa16cc9c83cd17096,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"elijah-bruce"},"
