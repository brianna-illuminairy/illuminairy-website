xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3f5accb7-9616-4e5f-bdeb-9071ae75c71e\"}":{"__typename":"Favorites","uuid":"3f5accb7-9616-4e5f-bdeb-9071ae75c71e","photoUrl":"https://ucarecdn.com/c0709077-03c8-400e-8bcc-f494e156095e/","title":"Edgar Degas","type":"ARTIST"},"Favorites:{\"uuid\":\"463dedc0-d0c2-4e19-b080-dd46054fa4d2\"}":{"__typename":"Favorites","uuid":"463dedc0-d0c2-4e19-b080-dd46054fa4d2","photoUrl":"https://ucarecdn.com/73456c47-661a-4092-a20a-49cccacdbf7a/","title":"On Earth We’re Briefly Gorgeous by Ocean Vuong ","type":"BOOK"},"Favorites:{\"uuid\":\"4b005b8f-1926-4fc5-8e93-380c5c102f61\"}":{"__typename":"Favorites","uuid":"4b005b8f-1926-4fc5-8e93-380c5c102f61","photoUrl":"https://ucarecdn.com/22e47112-f0d5-4aa9-ab81-3e8ea566df38/","title":"Serena Williams","type":"ATHLETE"},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"ca028103-5dac-42f5-8318-64b33ec0172d\"}":{"__typename":"DeepDives","uuid":"ca028103-5dac-42f5-8318-64b33ec0172d","content":null,"videoPlaybackId":"Y86BHVX8oNbNzBuvH5BVzHm2YEQ3C7J01D6mPDQYkZ6I","question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e2737317-04af-4b54-b611-070988a23c44\"}":{"__typename":"DeepDives","uuid":"e2737317-04af-4b54-b611-070988a23c44","content":"\u003cp\u003eDuring my summers in high school you could find me in the same place every day at 6:00 pm. For three months I would dedicate my evenings to “fun runs” in anticipation of the fall cross country season. Training to run as fast as I could – and the community I built of like-minded friends – was a truly meaningful part of my high school career. The summers were filled with endless miles, but also with laughs, encouragement, and rounds of any game we could imagine to take our minds off the pavement.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"62866d59-6501-4fa0-a578-c49b852e060d\"}":{"__typename":"DeepDives","uuid":"62866d59-6501-4fa0-a578-c49b852e060d","content":"\u003cp\u003eMy ongoing passion project is launching the Yale Undergraduate Law Journal! During the fall of my second year, I wrote a term paper about constitutional law and business ethics that I was really proud of. When I looked to get it published in a student journal at Yale, I came up short – there didn’t seem to be any venue to publish undergraduate legal scholarship. I broadened my search and found that students at many of Yale’s peer institutions had communities built around reading, writing, and learning more about the law. I decided to foster a similar space at Yale. Over the past several months, I’ve organized a pitch to the Yale Dean’s Office for approval to create a new student group while garnering student enthusiasm and building the scaffolding I will need to get the group off the ground. Heading into the fall semester of 2023, I am so excited to continue chasing my passion for the law while sharing it with my peers.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d9397911-4b8b-48c0-852a-47d186fcc260\"}":{"__typename":"DeepDives","uuid":"d9397911-4b8b-48c0-852a-47d186fcc260","content":"\u003cp\u003eMy favorite way to explore is on a bike. Whenever I have spare time in a city, I rent some version of public bicycles (my favorite, of course, being Citi Bikes) and join the mass of morning commuters. I’ve come to really appreciate cities that invest in protected bike lanes, as I spend far too much time looking around to really be paying attention to the traffic.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1caab017-8167-46b3-8de2-ec1ade647447\"}":{"__typename":"Education","uuid":"1caab017-8167-46b3-8de2-ec1ade647447","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"History and Political Science","degree":null},"School:{\"uuid\":\"15fa0dbe-6bc9-45b3-b116-c3fb82fe9c0f\"}":{"__typename":"School","uuid":"15fa0dbe-6bc9-45b3-b116-c3fb82fe9c0f","name":"Haddam-Killingworth High School","city":"Higganum","type":"HIGH","state":"Connecticut","country":"United States","zip":"06441"},"Education:{\"uuid\":\"12e7eda6-d9c8-46f4-8c0f-853f97cd53ca\"}":{"__typename":"Education","uuid":"12e7eda6-d9c8-46f4-8c0f-853f97cd53ca","school":{"__ref":"School:{\"uuid\":\"15fa0dbe-6bc9-45b3-b116-c3fb82fe9c0f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"9ac89628-dafa-49c2-a06f-26a0c3540680\"}":{"__typename":"MentorPublicProfile","uuid":"9ac89628-dafa-49c2-a06f-26a0c3540680","displayName":"Matthew J.","slug":"matthew-jennings","biography":"\u003cp\u003eMatthew is an undergraduate student at Yale University, where he studies History and Political Science. A Connecticut native, Matthew appreciates the opportunity to expand his connection to New Haven through academia and extracurriculars.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eIn high school, he took a variety of A.P. courses, including U.S. History, Human Geography, and Language \u0026amp; Composition, as well as dual-enrolled courses through the University of Connecticut. Outside of class, Matthew sat on his school district’s Board of Education and the Connecticut Association of Schools’ Student Equity Advisory Board, both of which provided him with unique exposure to education administration.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAt Yale, Matthew has appreciated the opportunity to meet and collaborate with peers from around the world and explore new experiences outside of his comfort zone. He has been most engaged with coursework on history and the U.S. legal system, taking classes on topics such as constitutional law, bioethics, intellectual property law, and economics. Independently, he enjoys reading Supreme Court slip opinions and is passionate about expanding LGBTQ+ rights through systems of law. Matthew also works as a Recruitment Coordinator at the Yale Office of Undergraduate Admissions and is the Co-Editor-in-Chief of the Yale Undergraduate Law Journal.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eDuring the summer of 2022, he studied international political economy and foreign policy at the London School of Economics. This summer, he is working in LGBTQ+ rights at a public interest law office in New York City. In his free time, Matthew enjoys listening to podcasts about social sciences, exploring new restaurants with friends, and jogging to Y2K hits. He has greatly appreciated getting to work with students throughout his life, and he is excited to help cultivate academic curiosity with others.\u003c/p\u003e","teachingVideoPlaybackId":"tnVejMLdYyJV658z7Mu01mgUvQvzvmmUWI7NCflTzElo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3f5accb7-9616-4e5f-bdeb-9071ae75c71e\"}"},{"__ref":"Favorites:{\"uuid\":\"463dedc0-d0c2-4e19-b080-dd46054fa4d2\"}"},{"__ref":"Favorites:{\"uuid\":\"4b005b8f-1926-4fc5-8e93-380c5c102f61\"}"}],"causesSupported":[],"major":"History and Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ca028103-5dac-42f5-8318-64b33ec0172d\"}"},{"__ref":"DeepDives:{\"uuid\":\"e2737317-04af-4b54-b611-070988a23c44\"}"},{"__ref":"DeepDives:{\"uuid\":\"62866d59-6501-4fa0-a578-c49b852e060d\"}"},{"__ref":"DeepDives:{\"uuid\":\"d9397911-4b8b-48c0-852a-47d186fcc260\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d2f66847-fc95-47b0-98ca-3502ef2d3b56/-/crop/492x493/56,64/-/preview/-/format/jpg/","https://ucarecdn.com/b2420215-faef-49c1-8b5b-29232be72067/-/preview/-/format/jpg/","https://ucarecdn.com/9083b7b4-6d13-437b-9ebf-f09587122b4b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1caab017-8167-46b3-8de2-ec1ade647447\"}"},{"__ref":"Education:{\"uuid\":\"12e7eda6-d9c8-46f4-8c0f-853f97cd53ca\"}"}],"hiredAt":"2022-05-23T16:54:58.000Z","topics":["Writing","History Project","History","Journalism","Spanish","STEM Project","Law / Government / Policy","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"matthew-jennings\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9ac89628-dafa-49c2-a06f-26a0c3540680\"}"}}},"_sentry
