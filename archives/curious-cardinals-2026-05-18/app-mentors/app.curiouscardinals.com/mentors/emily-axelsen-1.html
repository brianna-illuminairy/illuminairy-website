xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c36c1e03-04be-405e-80e5-71581e10c794\"}":{"__typename":"Favorites","uuid":"c36c1e03-04be-405e-80e5-71581e10c794","photoUrl":"https://ucarecdn.com/397b1848-2811-49c5-929d-823bc8e7e54a/","title":"Granada, Spain (for the Alhhambra!)","type":"CITY"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4746dd5d-8ad2-4365-a8a1-0bd64621a0c7\"}":{"__typename":"DeepDives","uuid":"4746dd5d-8ad2-4365-a8a1-0bd64621a0c7","content":"\u003cp\u003eMy dream job is curator at the Metropolitan Museum of Art in NYC!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ca143abf-3552-4ffb-b87d-c8d3bbfe9716\"}":{"__typename":"DeepDives","uuid":"ca143abf-3552-4ffb-b87d-c8d3bbfe9716","content":"\u003cp\u003eI chose History because it gave me the freedom to explore anything I was curious about. I could take data courses to understand how statistics shape narratives, continue with Spanish, or sit in on Harvard Kennedy School seminars when policy questions caught my attention!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a8ef90b1-6594-4dca-afbe-f18332d38083\"}":{"__typename":"DeepDives","uuid":"a8ef90b1-6594-4dca-afbe-f18332d38083","content":"\u003cp\u003eMy summers in high school were spent working at a local pizza shop and leading tours at the New-York Historical Society!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"d032765a-22d1-4b41-bd54-512207b4b484\"}":{"__typename":"School","uuid":"d032765a-22d1-4b41-bd54-512207b4b484","name":"Gill St. Bernard's School","city":"Chester Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"07934"},"Education:{\"uuid\":\"22a38090-7efb-4cc2-8663-62e6d45f8e10\"}":{"__typename":"Education","uuid":"22a38090-7efb-4cc2-8663-62e6d45f8e10","school":{"__ref":"School:{\"uuid\":\"d032765a-22d1-4b41-bd54-512207b4b484\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"6d998d34-6b1e-4125-940e-5ce41c8d1ec3\"}":{"__typename":"Education","uuid":"6d998d34-6b1e-4125-940e-5ce41c8d1ec3","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"History, Economics, and Spanish","degree":null},"MentorPublicProfile:{\"uuid\":\"4c54dac3-702b-44f5-9779-be86f1f7ae61\"}":{"__typename":"MentorPublicProfile","uuid":"4c54dac3-702b-44f5-9779-be86f1f7ae61","displayName":"Emily A.","slug":"emily-axelsen-1","biography":"\u003cp\u003eEmily Axelsen is an art historian passionate about bringing overlooked voices, particularly women artists, into public view. With nine years of museum experience beginning as a teenager, Emily has worked at the Harvard Art Museums, the Museum at Dumbarton Oaks, and the New-York Historical Society, developing expertise in curatorial research, archival work, and inclusive public programming.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEmily graduated summa cum laude from Harvard University with a BA in History, a secondary field in Economics, a Spanish citation, and highest honors for her thesis \"Acquisition Activism: Women's Art Protests and the Feminist Movement in the 1970s.\" Her interdisciplinary approach combines rigorous historical analysis with a deep commitment to making art accessible and meaningful to diverse audiences. At Harvard, she served on the Student Board of the Harvard Museum of Science and Culture, was selected as one of three Chinese Art Curatorial Assistants, and worked as a Ho Family Student Tour Guide and Research Intern.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEmily's interest in narrative-building stems from her conviction that art reflects our world while also allowing us to create new ones. Through her undergraduate research, she pulled sources beyond traditional archives to make the case that women artists contributed significantly to the second-wave feminist movement. This work revealed how museums frame stories, what archives preserve and exclude, and how careful research can challenge conventional art historical canons.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHer professional journey has been intentionally varied. After graduating from Harvard, Emily worked as an Associate Consultant at Boston Consulting Group, where she honed her analytical and problem-solving skills. She then moved to NoGood, a growth marketing startup in NYC, as a GTM Lead, learning to navigate complex projects and market entry strategies. Currently, she focuses on accelerating growth for the Answer Engine Optimization (AEO) product, bringing her interdisciplinary perspective to the intersection of technology and storytelling. These experiences outside academia have enriched her understanding of how narratives are constructed across different contexts and industries.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEmily believes that community is a mosaic of small interactions and established connections. As a Tour Guide at the Harvard Art Museums, she learned to watch where visitors' gazes lingered and adapt questions to their interests, turning tours into dialogues instead of scripts. She has taught US citizenship courses at the Harvard Art Museums, led accessible \"touch tours\" for visitors with visual impairments at the Harvard Museum of the Ancient Near East, and presented her senior thesis research to 75 faculty and students. Whether leading museum tours, chatting with visitors about what draws their eye, or exploring thrift stores to understand how context shapes meaning, she sees every interaction as an opportunity for exchange and mutual learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWalking around US museums reveals a historiography of collecting focused on male artists. Although there were indeed fewer women artists, their scarcity makes them all the more important to learn from. Emily is committed to advancing the visibility of women artists through teaching, research, and museum programs, preparing for a career as an art historian dedicated to bringing women artists into the canon and public consciousness.\u003c/p\u003e","teachingVideoPlaybackId":"j0101SvnFXlAIfhSr2j02b2Vl4AGm1yHGv00PC5srThYlAQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c36c1e03-04be-405e-80e5-71581e10c794\"}"}],"causesSupported":[],"major":"History, Economics, and Spanish","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4746dd5d-8ad2-4365-a8a1-0bd64621a0c7\"}"},{"__ref":"DeepDives:{\"uuid\":\"ca143abf-3552-4ffb-b87d-c8d3bbfe9716\"}"},{"__ref":"DeepDives:{\"uuid\":\"a8ef90b1-6594
