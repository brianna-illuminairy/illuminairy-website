xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8aa32688-3fc7-42b0-8c03-4d05e91e7c1b\"}":{"__typename":"DeepDives","uuid":"8aa32688-3fc7-42b0-8c03-4d05e91e7c1b","content":"\u003cp\u003eI (unfortunately) have a variety of food allergies that make it very difficult for me to eat out. Because of this, I spent a significant amount of time in high school learning how to bake and cook for myself. Eventually, I realized that other people around me were having the same issue and started a birthday cake business. I made allergy friendly birthday cakes for local families who were struggling to find options for their kids. I loved getting to share in these family celebrations, and learning how to bake with limited ingredients turned every cake into a fascinating science experiment!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"eb895bc9-f057-4c87-b6e2-396bf981316c\"}":{"__typename":"DeepDives","uuid":"eb895bc9-f057-4c87-b6e2-396bf981316c","content":"\u003cp\u003eI grew up in a rural town in western Massachusetts. Throughout my elementary, middle and high school career, I received unconditional support and love from my teachers, classmates, and family. When I got into Yale (as one of the first people from my high school to do so) I knew that it would have been impossible to do so without the incredible support I received from my community. Whenever school gets tough or I really feel lost in my research, I think about all of the people who are cheering for me at home!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"89ff387e-2d6e-4f73-b4fb-ecfc260946ce\"}":{"__typename":"DeepDives","uuid":"89ff387e-2d6e-4f73-b4fb-ecfc260946ce","content":"\u003cp\u003eIn high school, I spent my summers working as a camp counselor! I worked my way up from a counselor in training to running the whole camp by my senior year. It was a really interesting experience that gave me confidence in my organization, leadership skills, and conflict resolution\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"dea883ba-07c7-4592-806d-cbf8a14d5d82\"}":{"__typename":"DeepDives","uuid":"dea883ba-07c7-4592-806d-cbf8a14d5d82","content":"\u003cp\u003eIn my spare time, I love to run! I've run five half marathons, and am currently training for a full marathon. I love that running provides a totally different way to push myself and see myself grow. I also love getting to spend time outdoors with friends every single day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"76ac2080-66c5-49c5-adcb-19f081a90da5\"}":{"__typename":"School","uuid":"76ac2080-66c5-49c5-adcb-19f081a90da5","name":"Lenox Memorial Middle \u0026 High School","city":"Lenox","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01240"},"Education:{\"uuid\":\"46b6f582-a4df-4cab-a0cd-d129b17274ba\"}":{"__typename":"Education","uuid":"46b6f582-a4df-4cab-a0cd-d129b17274ba","school":{"__ref":"School:{\"uuid\":\"76ac2080-66c5-49c5-adcb-19f081a90da5\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"ef3b084c-5d89-49dd-9b16-02e736bb4836\"}":{"__typename":"Education","uuid":"ef3b084c-5d89-49dd-9b16-02e736bb4836","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"77e40397-a576-428d-94d4-c2a451e5111e\"}":{"__typename":"MentorPublicProfile","uuid":"77e40397-a576-428d-94d4-c2a451e5111e","displayName":"Julianne H.","slug":"julianne-harwood","biography":"\u003cp\u003eHi! I'm Julianne. I'm a senior at Yale majoring in Economics with a certificate in Global Health Studies. I love learning about a broad range of subjects, from calculus to statistics to chemistry. I’ve used the skills I’ve learned in my academic classes to pursue my interest in the impact of our built and natural environments on human health and wellbeing. On campus, I work as a research assistant for a professor studying the economic impacts of government policies from universal pre-school to public housing projects.\u0026nbsp; I’m passionate about evidence-based policy-making and hope to pursue a PhD in economics after I graduate!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentoring high school students has been a cornerstone of my college career. I’ve worked as a middle and high school track coach, helped students write their college applications, and worked as a camp counselor. I’ve volunteered at an after school program serving public school students in New Haven, and worked as an orientation leader for first year students at my college. Most importantly, I’m also a big sister to my high school-age brother, and spend a significant amount of time helping him prepare for standardized testing, reviewing essays, and generally commiserating about the pains of being a high school junior! I’m passionate about helping kids reach their goals, whether in academics, athletics, or extracurriculars.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my summers, I’ve had the opportunity to apply my academic interests, working with incredible local, national, and even international organizations. This past summer, as an analyst with the World Bank, I contributed to their climate resilient healthcare infrastructure team, helping countries analyze the security of their national healthcare systems in a changing climate. Additionally, my role as an intern with a Congressional Representative has allowed me to interact with the domestic issues I find most fascinating, from housing to climate change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love to bake, knit, run, do pottery, and spend time outdoors. I love learning new hobbies, and sharing my own hobbies with friends and family. I pride myself on balancing my academics, extracurriculars, and social life, and am excited to work with students who are learning to do the same!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"R6rymuid7ktdVknqY8f49EDdVDCYyxG02287LnA19bCA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8aa32688-3fc7-42b0-8c03-4d05e91e7c1b\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb895bc9-f057-4c87-b6e2-396bf981316c\"}"},{"__ref"
