96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"89b8f526-8818-4224-83f8-a3240dd046b2\"}":{"__typename":"MentorPublicProfile","uuid":"89b8f526-8818-4224-83f8-a3240dd046b2","displayName":"Princess A.","slug":"princess-awambu","biography":"\u003cp\u003eHi! I’m Princess Awambu, and I’m the kind of person who will choreograph a dance routine one moment, debate public policy the next, and still find time to give you my best book recommendations. I’ve always been driven by a love for learning and a belief that curiosity is contagious—and I’m happiest when I can share that energy with others.\u003c/p\u003e\u003cp\u003eRight now, I’m a Human Biology major on the pre-med track at Stanford University, with a focus on psychiatry and youth health equity. That means I spend a lot of time exploring how the mind works, how our environment shapes us, and how science can be used to make the world a more compassionate and fair place. My academic journey has taught me the value of both precision and creativity: one moment I’m memorizing intricate biological pathways, and the next I’m finding a playful analogy to explain them. Over the years, I’ve developed study habits that actually work—ones that balance discipline with flexibility—and I love passing those on to anyone who’s ready to take their learning to the next level.\u003c/p\u003e\u003cp\u003eOutside of the classroom, my life is just as full and vibrant. I serve as a leader in Stanford in Government, where I help map out schedules, organize events, and connect students to opportunities that let them see policy in action. This role has sharpened my organizational skills, my ability to communicate across different groups, and my understanding of how to inspire people to engage with big ideas.\u003c/p\u003e\u003cp\u003eI’m also a choreographer for Common Origins, Stanford’s largest student-run dance group. Dance has been part of my life for as long as I can remember, and I see it as more than just movement—it’s storytelling. Whether I’m leading a rehearsal or breaking down tricky choreography for beginners, I get to merge patience with passion, teaching with teamwork. I believe this creative side makes me a better teacher overall, because I know that learning is most powerful when it’s active, fun, and emotionally engaging.\u003c/p\u003e\u003cp\u003eAnd then there’s the MCAT prep. While it’s not quite as glamorous as a dance stage, it’s been an important reminder of what it feels like to be in the thick of challenging material. I’ve learned how to break down overwhelming topics into bite-sized, manageable steps; how to use practice tests not just for score improvement but for self-reflection; and how to keep going even on days when motivation feels out of reach. Those lessons are exactly what I bring to my tutoring—because I know firsthand how much mindset matters in academic success.\u003c/p\u003e\u003cp\u003eAt the heart of all my passions—whether it’s science, dance, policy, or mentorship—is the same driving force: I love helping people connect with ideas in a way that feels personal and exciting. I believe in meeting students where they are, listening to their goals, and then building a learning plan that not only improves their skills but also sparks their confidence.\u003c/p\u003e\u003cp\u003eThat’s why Curious Cardinals feels like such a perfect fit for me. It’s a space where learning isn’t just about acing tests or ticking off boxes—it’s about exploring the world through the lens of your own curiosity. I’m the kind of tutor who will cheer you on through the tough moments, celebrate your wins (big and small), and maybe even teach you a dance step or two along the way.\u003c/p\u003e\u003cp\u003eIf there’s one thing I’ve learned from my own journey, it’s that passion and persistence are unstoppable when paired together. Whether you’re tackling complex science topics, trying to develop better study habits, or just looking for a mentor who will inspire you to think bigger, I’m here to make that process not only productive but genuinely enjoyable.\u003c/p\u003e\u003cp\u003eSo, that’s me: a dancer, a scientist-in-training, a policy enthusiast, a book lover, and—most importantly—someone who believes that learning can change lives. I can’t wait to help students discover just how exciting their own curiosity can be.\u003c/p\u003e","teachingVideoPlaybackId":"01X0119LIqPezhiy69b8HWMlWyJEATn02Xwz402PJvjSMio","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"03fc6346-7af2-4202-a590-ceb0246985ed\"}"}],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3778da32-d9f9-44cd-be16-6a827665204d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fd08e3cb-7e3f-4c17-b5e3-701510d20c04/-/preview/-/format/jpg/","https://ucarecdn.com/a6e477d1-c636-49c3-a81a-deeec0c57a75/-/preview/-/format/jpg/","https://ucarecdn.com/abc68017-0cce-424a-b564-181072307ba9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7e218873-49d4-4127-a3a4-d7707bbe89b9\"}"},{"__ref":"Education:{\"uuid\":\"b5d08d78-b3f6-49a5-a5b4-aed3816cf569\"}"}],"hiredAt":"2025-06-01T22:15:30.449Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Chemistry","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Fashion / Cosmetics","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"princess-awambu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"89b8f526-8818-4224-83f8-a3240dd046b2\"}"}}},"_sentryTraceData":"e279cf0ac7a6433c9cd5177063a99b53-83e7aeea342a544f-0","_sentryBaggage":"sentry-env
