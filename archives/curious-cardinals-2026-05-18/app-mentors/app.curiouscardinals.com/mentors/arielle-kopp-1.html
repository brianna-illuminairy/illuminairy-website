xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e8e5655d-bd81-439e-bd77-e0dc0ec8dd58\"}":{"__typename":"Favorites","uuid":"e8e5655d-bd81-439e-bd77-e0dc0ec8dd58","photoUrl":"https://ucarecdn.com/a28ba743-9a73-4373-b2d4-22a2071f1759/","title":"Queenstown","type":"CITY"},"Favorites:{\"uuid\":\"2bc12b1c-e169-4784-bfe2-e33ee15122a2\"}":{"__typename":"Favorites","uuid":"2bc12b1c-e169-4784-bfe2-e33ee15122a2","photoUrl":"https://ucarecdn.com/74153311-6e89-40d5-9175-1d6e79c5833e/","title":"Hamilton","type":"PLAY"},"Favorites:{\"uuid\":\"dee00b1d-9bcb-4558-ada0-4e80e426f0f9\"}":{"__typename":"Favorites","uuid":"dee00b1d-9bcb-4558-ada0-4e80e426f0f9","photoUrl":"https://ucarecdn.com/8a1c3c68-60b6-4ad2-ae24-558ae042c725/","title":"Notting Hill","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d21d31dd-589e-4d45-be52-e76c40dfb2fb\"}":{"__typename":"DeepDives","uuid":"d21d31dd-589e-4d45-be52-e76c40dfb2fb","content":"\u003cp\u003eI would tell myself to embrace the unknown! In high school I was very stressed about figuring out who I wanted to be and what I wanted to do. I was sometimes nervous to explore new interests or start new projects in case I ended up not liking something or being bad at it. However, trying new things is really the best way to learn and get a better understanding of your interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c272414c-17c9-439f-9598-814ef6d1f857\"}":{"__typename":"DeepDives","uuid":"c272414c-17c9-439f-9598-814ef6d1f857","content":"\u003cp\u003eChoosing my major was quite a struggle for me! I attended a vocational high school that focused on pre-medicine and health studies, so I initially thought I had to pursue a career in science. However, I took \u003cem\u003emany\u003c/em\u003e different (and unrelated) courses during my first few semesters at college. I realized that although I loved science, my passion was in politics, business and entrepreneurship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b41a9233-e618-40c3-a96e-3a7a5e4e20b4\"}":{"__typename":"DeepDives","uuid":"b41a9233-e618-40c3-a96e-3a7a5e4e20b4","content":"\u003cp\u003eI enjoy thrifting, going to the beach, spending time with my friends and family, and going on long walks. I also love anything in fashion, scrolling on Pinterest, baking, and adrenaline sports (I really want to go sky diving again). \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"a1443fee-cf4e-4782-a636-09735ab919ee\"}":{"__typename":"School","uuid":"a1443fee-cf4e-4782-a636-09735ab919ee","name":"Monmouth County Academy of Allied Health \u0026 Science","city":"Neptune City","type":"HIGH","state":"New Jersey","country":"United States","zip":"07753"},"Education:{\"uuid\":\"84ae1711-4665-4995-82d6-16ad17db3f1e\"}":{"__typename":"Education","uuid":"84ae1711-4665-4995-82d6-16ad17db3f1e","school":{"__ref":"School:{\"uuid\":\"a1443fee-cf4e-4782-a636-09735ab919ee\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"3ca3cdbd-faf2-4589-8a01-ad022f41ba79\"}":{"__typename":"Education","uuid":"3ca3cdbd-faf2-4589-8a01-ad022f41ba79","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Public Policy, Minors in Business and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"47d67363-4043-46e7-9ced-d0cc623c7e75\"}":{"__typename":"MentorPublicProfile","uuid":"47d67363-4043-46e7-9ced-d0cc623c7e75","displayName":"Arielle K.","slug":"arielle-kopp-1","biography":"\u003cp\u003eHi! My name is Arielle Kopp and I am a Senior at Vanderbilt University. I am originally from New Jersey, but am moving to New York City after graduation! For high school, I attended the Academy of Allied Health and Science. This was a magnet vocational school in my district that focused on pre-med and health studies. As part of my curriculum I was able to work in the hospital and get my EMT certification! I also worked under the guidance of Professor Tomie at Rutgers University where we studied the impact of social emotional learning on drug addiction. Additionally, I was a member of the New Jersey Governor Stem Scholar’s Program. As such, I have a strong background in the sciences and am familiar with the medical field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Vanderbilt, I study Public Policy with minors in Business and Economics. Although this is definitely different from my focus in high school, I have found that Vanderbilt has allowed me to explore all of my interests. I have always had an entrepreneurial spirit which I have been able to hone through my minors in Business and Economics. In high school, I ran an upcyling business where I would thrift, fix, and resell clothes. At Vanderbilt, I have explored this interest by serving as the VP of Education for TAMID. In this role, I was responsible for teaching the new members the fundamentals of consulting, investment banking, and business. I also serve as the Teaching Assistant for Negotiation, a Business minor course at Vanderbilt.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough my interests seem somewhat varied, I have found many ways to combine them! For example, this past summer I interned as a Public Finance Investment Banking Analyst. The summer before that I worked for Sky Harbour, an aviation real estate company. I was able to visit different airports throughout the country and attend an airport conference in Phoenix! This was an amazing opportunity and completely out of my comfort zone. However, I now know quite a bit about planes and airports.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time I love going to the beach, going to new workout classes and hanging out with my friends. I am a major foodie and I love exploring and finding new restaurants. I am also obsessed with coffee and am always looking for fun new coffee shops. My favorite movies include \u003cem\u003eNotting Hill, When Harry Met Sally, Mission Impossible, and Legally Blonde\u003c/em\u003e. I am also a major fan of \u003cem\u003eGilmore Girls, Gossip Girl, \u003c/em\u003eand\u003cem\u003e How I Met Your Mother\u003c/em\u003e!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am so excited to be a mentor for Curious Cardinals. I have highly valued all of the mentors that I had over the past few years and attribute a lot of my success to their advice. My experience tutoring for JEI as well as private tutoring has enabled me to form strong relationships with students and encourage them to succeed in both their academic and personal lives. I hope to bring a sense of enthusiasm and excitement for all of the meetings with my future mentees!\u003c/p\u003e","teachingVideoPlaybackId":"UqAePsU6Lgjclqk00dp213FcP201PJvIhFwpUC8t00CdJU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWon JUMP into STEM, a national competition hosted by the Department of Energy. The competition involved designing a sustainable solution to embodied carbon in buildings. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e8e5655d-bd81-439e-bd77-e0dc0ec8dd58\"}"},{"__ref":"Favorites:{\"uuid\":\"2bc12b1c-e169-4784-bfe2-e33ee15122a2\"}"},{"__ref":"Favorites:{\"uuid\":\"dee00b1d-9bcb-4558-ada0-4e80e426f0f9\"}"}],"causesSupported":[],"major":"Public Policy, Minors in Business and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d21d31dd-589e-4d45-be52-e76c40dfb2fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"c272414c-17c9-439f-9598-814ef6d1f857\"}"},{"__ref":"DeepDives:{\"uuid\":\"b41a9233-e618-40c3-a96e-3a7a5e4e20b4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6111f3c9-50aa-4800-a583-57808a4c057a/-/preview/-/format/jpg/","https://ucarecdn.com/63d452a1-ed88-46a9-b6ea-c294bb0c57e1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"84ae1711-4665-4995-82d6-16ad17db3f1e\"}"},{"__ref":"Education:{\"uuid\":\"3ca3cdbd-faf2-4589-8a01-ad022f41ba79\"}"}],"hiredAt":"2024-09-26T13:49:00.613Z","topics":["Negotiation","Finance / Investing","Business / Entrepreneurship","Law / Government / Policy","Sustainability","Public Speaking","Fashion / Cosmetics","Economics","Journalism"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"arielle-kopp-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"47d67363-4043-46e7-9ced-d0cc623c7e75\"}"}}},"_sentryTraceData":"d155529369dc47c9b7e0cfd0c25
