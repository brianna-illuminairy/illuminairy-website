xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7cd0aae9-a948-4ddf-933a-2e109e958e2d\"}":{"__typename":"Favorites","uuid":"7cd0aae9-a948-4ddf-933a-2e109e958e2d","photoUrl":"https://ucarecdn.com/45ff27bc-d857-4966-bfed-2663cdb07bbd/","title":"Jalen Brunson","type":"ATHLETE"},"Favorites:{\"uuid\":\"0e4aef50-9509-4c7e-8530-cd24afedd585\"}":{"__typename":"Favorites","uuid":"0e4aef50-9509-4c7e-8530-cd24afedd585","photoUrl":"https://ucarecdn.com/9f4f8194-3db5-41c5-b9e8-9fbe42be6d73/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"9e50925c-195e-45d1-a805-0efb9e7b6ed0\"}":{"__typename":"Favorites","uuid":"9e50925c-195e-45d1-a805-0efb9e7b6ed0","photoUrl":"https://ucarecdn.com/48cfbd98-5f62-43a7-8443-6041fb22b978/","title":"Exodus","type":"ALBUM"},"CausesSupported:{\"uuid\":\"1a482fe3-d3f9-4061-a454-e7ca27b30a74\"}":{"__typename":"CausesSupported","uuid":"1a482fe3-d3f9-4061-a454-e7ca27b30a74","name":"Interfaith Food Pantry of the Oranges","description":"\u003cp\u003eI support the IFOP because I love to volunteer, and feed the community\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7d3b10b3-1e9e-46a4-8718-9c642ac0a149\"}":{"__typename":"DeepDives","uuid":"7d3b10b3-1e9e-46a4-8718-9c642ac0a149","content":"\u003cp\u003eIn my spare time I like to stay active and for me that usually looks like going to the gym or for a long run. When I can rally my friends together we play pick up soccer or basketball, but that's more rare. I also love puzzles and games with my favorites being chess and poker, so I play those often as well. In the summertime, I thoroughly enjoy getting out on the golf course, and going to the beach or pool with friends. I also try to stay on top of my work even when I don't have too much because I like to get ahead and try to lighten whatever load I'm working on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5239d7b0-8875-485f-ad82-7300995c60ac\"}":{"__typename":"DeepDives","uuid":"5239d7b0-8875-485f-ad82-7300995c60ac","content":"\u003cp\u003eI chose to major in economics because it brings together the things I care most about: problem-solving, strategic thinking, and understanding how the world works beneath the surface. My earliest exposure to economics didn’t come from a classroom, it came from trading players in FIFA Ultimate Team. I didn’t realize it at the time, but I was learning how markets operate: spotting undervalued players, timing sales based on supply and demand, and making long-term investment decisions. What started as a video game hobby slowly evolved into a deeper interest in economic systems and market behavior.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I began connecting those instincts to formal concepts through IB Economics, where ideas like diminishing marginal utility and behavioral nudges helped me make sense of patterns I’d already been seeing. I wrote both my extended essay and internal assessment on trade policy, and I realized how much I enjoyed thinking about decision-making, whether in households, companies, or governments.\u003cbr\u003e\u003cbr\u003eAt Princeton, the economics department stood out to me because of its balance between rigorous quantitative analysis and real-world application. Beyond the academic side, economics has given me a framework to approach nearly everything I do—from analyzing equities at Tiger Capital Management to thinking about how nonprofits allocate resources in my consulting work. It’s a major that allows me to stay curious, think critically, and pursue both analytical and people-centered paths. That versatility is something I really value, and it’s what ultimately made economics the right fit for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b1ab94f8-950e-47fd-866c-8a8329fb824e\"}":{"__typename":"DeepDives","uuid":"b1ab94f8-950e-47fd-866c-8a8329fb824e","content":"\u003cp\u003eMy dream job is to be a sports agent, specifically representing professional soccer players. I’ve always loved sports, not just as a player and fan, but as someone who’s fascinated by the strategy behind the scenes. Soccer has been a huge part of my life: I played varsity for four years and captained my high school team during our most successful season in a decade. But beyond the game itself, what draws me to being an agent is the intersection of \u003cstrong\u003efinance, negotiation, and long-term relationship building\u003c/strong\u003e.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA sports agent isn’t just someone who brokers contracts, they’re someone a player trusts to help guide the trajectory of their career and life. That mix of strategic thinking and personal connection really excites me. I love understanding markets, analyzing value, and advocating for people I believe in, which is why I’ve gravitated toward finance and economics academically.\u003cbr\u003e\u003cbr\u003eAt Princeton, I study economics and serve as a senior analyst in Tiger Capital Management, where I research companies and learn to think critically about value and opportunity. Those same skills—evaluating trends, navigating risk, and thinking long term—translate directly to player representation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eOn the personal side, I’ve always been drawn to relationship-driven work. Whether it was leading the Black Student Union in high school, working in community-oriented consulting, or mentoring younger teammates, I’ve learned how important trust and communication are when you're helping someone navigate big decisions. A great agent is part financial advisor, part career strategist, and part support system, and I think that blend is what makes it my ideal role.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAt the end of the day, I want to work in a field where I’m close to the game I love, using my skills to make a real impact in athletes’ lives. Being a sports agent combines all of that, and that’s what makes it my dream job.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"b2606ee7-312f-47a4-8ccc-8dbae2f9052c\"}":{"__typename":"DeepDives","uuid":"b2606ee7-312f-47a4-8ccc-8dbae2f9052c","content":"\u003cp\u003eI think my greatest source of motivation is thinking about the sacrifice that my family and ancestors as a whole have made for me to be provided with the opportunities I have today. My mother is a direct descendant of slaves, and my father immigrated to the United States when he was 6. Each one of them and their families worked for everything they have now and consistently pay it forward to me and my sister providing us with almost everything we have asked for. Now that I have the opportunity to further my education at a prestigious university and really use my skills to create positive change. I'm consistently motivated by that sacrifice and am excited to pay it forward to those who come after me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"098a6438-35eb-40f5-9060-5c8924c3e11b\"}":{"__typename":"School","uuid":"098a6438-35eb-40f5-9060-5c8924c3e11b","name":"Newark Academy","city":"Livingston","type":"HIGH","state":"New Jersey","country":"United States","zip":"07039"},"Education:{\"uuid\":\"bf34273d-da64-4f30-aba8-f09880d61221\"}":{"__typename":"Education","uuid":"bf34273d-da64-4f30-aba8-f09880d61221","school":{"__ref":"School:{\"uuid\":\"098a6438-35eb-40f5-9060-5c8924c3e11b\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"922d7cfa-9326-49e8-85b3-e4623e8ea71a\"}":{"__typename":"Education","uuid":"922d7cfa-9326-49e8-85b3-e4623e8ea71a","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"6ce37154-8a26-4c58-aec4-918b31a503ce\"}":{"__typename":"MentorPublicProfile","uuid":"6ce37154-8a26-4c58-aec4-918b31a503ce","displayName":"James M.","slug":"james-morris","biography":"\u003cp\u003eHi! I’m James Morris, a freshman at Princeton University studying economics. I’m originally from Montclair, New Jersey, and I’ve always been someone who loves solving problems—whether that means tackling a challenging math problem, diving into a case study on a company, or just figuring out how to explain something in a way that finally makes it click for someone else. That last part is why I care so deeply about tutoring.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo me, tutoring isn’t just about helping someone pass a class or ace a test, though that’s always part of the goal. It’s about helping students build confidence, curiosity, and real understanding. I’ve seen firsthand how overwhelming certain subjects can feel, especially when they’re taught in a one-size-fits-all way. That’s why I take pride in meeting students where they are, breaking down concepts into digestible steps, and creating a space where they feel comfortable asking questions, making mistakes, and growing at their own pace.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy own academic journey has blended the analytical and the human. I’m a Senior Analyst at Tiger Capital Management, Princeton’s student-run investment fund, where I spend time researching companies and analyzing industries. But I’ve also spent years leading and mentoring in other spaces, whether it was as President of my high school’s Black Student Union, soccer captain, or a peer leader working on community projects. In all of those experiences, I’ve learned how important listening, empathy, and encouragement are in any learning environment.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAs a tutor, I specialize in subjects like math, economics, and writing, but more importantly, I bring a mindset that’s focused on building relationships and long-term growth. I love learning, and I love sharing that with others. Whether a student needs help building foundational skills, preparing for standardized tests, or pushing themselves in advanced coursework, I work hard to adapt my approach to their learning style and goals. My sessions are structured but flexible, challenging but low-pressure, and always tailored to help each student feel seen and supported.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eIf I’ve learned anything through tutoring, it’s that students thrive not just when they’re taught well, but when someone genuinely believes in their potential. That’s the kind of tutor I strive to be.\u003c/p\u003e","teachingVideoPlaybackId":"wv01mfhRfBuVQPOOw2sUn95IPQWYS166IdKbXfhZ2Vng","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my greatest achievements was leading my high school soccer team to their first division win in a decade. It was really special ending my career with my best season yet, and high school soccer was very difficult for me, so being able to cap it off how we did was awesome.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7cd0aae9-a948-4ddf-933a-2e109e958e2d\"}"},{"__ref":"Favorites:{\"uuid\":\"0e4aef50-9509-4c7e-8530-cd24afedd585\"}"},{"__ref":"Favorites:{\"uuid\":\"9e50925c-195e-45d1-a805-0efb9e7b6ed0\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"1a482fe3-d3f9-4061-a454-e7ca27b30a74\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7d3b10b3-1e9e-46a4-8718-9c642ac0a149\"}"},{"__ref":"DeepDives:{\"uuid\":\"5239d7b0-8875-485f-ad82-7300995c60ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"b1ab94f8-950e-47fd-866c-8a8329fb824e\"}"},{"__ref":"DeepDives:{\"uuid\":\"b2606ee7-312f-47a4-8ccc-8dbae2f9052c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ee5b05e9-a149-4a6e-8de1-34527db31ecf/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"bf34273d-da64-4f30-aba8-f09880d61221\"}"},{"__ref":"Education:{\"uuid\":\"922d7cfa-9326-49e8-85b3-e4623e8ea71a\"}"}],"hiredAt":"2025-06-06T18:31:10.114Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Physics","Writing","Spanish","College Essay Writing","Economics","History","Reading"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ja
