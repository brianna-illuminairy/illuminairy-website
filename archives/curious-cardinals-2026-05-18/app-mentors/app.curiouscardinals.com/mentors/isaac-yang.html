xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"69c18210-2b62-4d29-9c78-624e7eb629f5\"}":{"__typename":"DeepDives","uuid":"69c18210-2b62-4d29-9c78-624e7eb629f5","content":"\u003cp\u003eI chose biology because it's so fascinating how there's an entirely different world at the cellular level. Here, mechanisms and processes are running elegantly in order to keep life functioning. Naturally, I wanted to learn as much as I could about life at the microscopic level! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ba95f914-8983-4026-820c-0faa02a38976\"}":{"__typename":"DeepDives","uuid":"ba95f914-8983-4026-820c-0faa02a38976","content":"\u003cp\u003eMentorship matters to me because I want to give back to others. I've been fortunate enough to have met mentors in my life who have guided me through seasons of my life and given me invaluable advice. Being able to connect with someone who has much more experience than you do is an amazing privilege, and I'd love to be able to provide that for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"cded4743-3258-4469-be1c-443ec233ddc0\"}":{"__typename":"DeepDives","uuid":"cded4743-3258-4469-be1c-443ec233ddc0","content":"\u003cp\u003eWhile I obviously don't know him personally, I look up to the kind of person Kobe Bryant was. I believe his work ethic and his ability to impact others is something to strive for, and I hope to learn some things from his approach to life.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e2d1752b-5c35-4e5e-8249-4c3fe9b323de\"}":{"__typename":"DeepDives","uuid":"e2d1752b-5c35-4e5e-8249-4c3fe9b323de","content":"\u003cp\u003eI would tell myself to truly start exploring what you're passionate about. I know it can get easy to focus on one path, but there are countless opportunities out there and you really don't know what you love until you try it out.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"602830c9-6dd3-43da-8d9d-70fdb176e2ad\"}":{"__typename":"School","uuid":"602830c9-6dd3-43da-8d9d-70fdb176e2ad","name":"Troy High School","city":"Fullerton","type":"HIGH","state":"California","country":"United States","zip":"92831"},"Education:{\"uuid\":\"a4e9a71f-dfd2-4a67-977c-ab31f34273f5\"}":{"__typename":"Education","uuid":"a4e9a71f-dfd2-4a67-977c-ab31f34273f5","school":{"__ref":"School:{\"uuid\":\"602830c9-6dd3-43da-8d9d-70fdb176e2ad\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"3d1be69d-235f-4ef1-bb6f-88c0b1c0e50c\"}":{"__typename":"Education","uuid":"3d1be69d-235f-4ef1-bb6f-88c0b1c0e50c","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"7652beba-c48a-48b8-b9b1-5ba20279d057\"}":{"__typename":"MentorPublicProfile","uuid":"7652beba-c48a-48b8-b9b1-5ba20279d057","displayName":"Isaac Y.","slug":"isaac-yang","biography":"\u003cp\u003eHi! I'm Isaac, and I'm a current senior at Duke University majoring in Biology, with minors in Chemistry and Korean. I grew up my entire life in Orange County, California. While it's been great studying the past four years in North Carolina, I'll always have a heart for SoCal. In high school, I was involved with the IB program, NJROTC, and the Oracle, my high school newspaper. \u003cbr\u003e\u003cbr\u003eI'm passionate about all of the sciences, but particularly in biology. I find it so cool how our entire world functions on intricate and complex processes that the visible eye can't even see. Even with all the research we do, we haven't even tapped the surface of some fields in biology! At Duke, I'm involved with a research lab that studies infectious fungi and their genetics. I'm also passionate about Korean culture and history, which is why I decided to add on a Korean minor! \u003cbr\u003e\u003cbr\u003eAs a mentor, I can guarantee that I'll do my best to meet where my mentees are at and serve them well. I've been involved with mentorship across all stages of life--organizations that mentor underserved students, nursing homes where I befriend residents, and campus fellowships where I've led small groups. I even have a brother 8 years younger than I am, and my relationship with him has taught me invaluable lessons about mentorship! All these experiences have taught me how to become not just an effective mentor but also a compassionate and reliable friend to others. When it comes to a 1-on-1 setting, I strive to offer a comfortable space for students so that they can engage with learning effectively. I try to tie in their personal interests to also bring out more engagement!\u003cbr\u003e\u003cbr\u003eOutside of classes, you can find me volunteering at nursing homes or the Duke hospital, playing basketball, watching K-dramas or Lakers games, or at events for Intervarsity (the campus fellowship I'm actively involved in).\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"69c18210-2b62-4d29-9c78-624e7eb629f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"ba95f914-8983-4026-820c-0faa02a38976\"}"},{"__ref":"DeepDives:{\"uuid\":\"cded4743-3258-4469-be1c-443ec233ddc0\"}"},{"__ref":"DeepDives:{\"uuid\":\"e2d1752b-5c35-4e5e-8249-4c3fe9b323de\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f2527717-1d67-47dd-a908-2411786d179f/-/preview/-/format/jpg/","https://ucarecdn.com/3942b215-cf9c-4751-a692-a06f9eb1556b/-/preview/-/format/jpg/","https://ucarecdn.com/0c2b5fff-1797-4c78-ab65-1fdf3a107073/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a4e9a71f-dfd2-4a67-977c-ab31f34273f5\"}"},{"__ref":"Education:{\"uuid\":\"3d1be69d-235f-4ef1-bb6f-88c0b1c0e50c\"}"}],"hiredAt":"2023-12-15T22:52:07.293Z","topics":["Biology","Physics","Chemistry","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isaac-yang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7652beba-c48a-48b8-b9b1-5ba20279d057\"}"}}},"_sentryTraceData":"3fd14f0cff814a128de1ca5980ca4e45-9acbedc1dab42534-0","_sentryBaggage":"sentry-enviro
