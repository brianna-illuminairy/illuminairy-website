xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c7f8887c-e30a-4a36-9afd-2d47a0e2477d\"}":{"__typename":"Favorites","uuid":"c7f8887c-e30a-4a36-9afd-2d47a0e2477d","photoUrl":"https://ucarecdn.com/d5ed4089-f08b-4be4-bef4-60cd0e2fc048/","title":"A Long Petal of the Sea","type":"BOOK"},"Favorites:{\"uuid\":\"6c7e25cf-8f61-4cae-939b-c1d9e395a489\"}":{"__typename":"Favorites","uuid":"6c7e25cf-8f61-4cae-939b-c1d9e395a489","photoUrl":"https://ucarecdn.com/2a76b60d-4674-4db7-a064-9e0791b90558/","title":"Madrid!","type":"CITY"},"Favorites:{\"uuid\":\"6f8a19ed-323b-4de9-8ace-122628fc8efe\"}":{"__typename":"Favorites","uuid":"6f8a19ed-323b-4de9-8ace-122628fc8efe","photoUrl":"https://ucarecdn.com/f97ab7ca-7187-43b0-8062-d9f397450ab2/","title":"Basketball, Volleyball, and Softball","type":"SPORT"},"CausesSupported:{\"uuid\":\"863e22bc-dbd2-44c5-9bd5-a15cc4197c81\"}":{"__typename":"CausesSupported","uuid":"863e22bc-dbd2-44c5-9bd5-a15cc4197c81","name":"Saving Mothers","description":"\u003cp\u003eSaving Mothers is a nonprofit dedicated to improving maternal health worldwide.\u0026nbsp;\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"918b9adf-b500-4497-9f8e-7d3910fc3f6e\"}":{"__typename":"DeepDives","uuid":"918b9adf-b500-4497-9f8e-7d3910fc3f6e","content":"\u003cp\u003eI've been lucky to have amazing mentors throughout my journey, and I want to pay that forward. Mentorship isn’t just about academics; it’s also about navigating personal and professional hurdles. I’m excited to help others discover their potential and continue this tradition of support and growth!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"bcf89903-72b1-4d4a-88e0-80e899d7d785\"}":{"__typename":"DeepDives","uuid":"bcf89903-72b1-4d4a-88e0-80e899d7d785","content":"\u003cp\u003eIn high school, I worked as a research assistant at the Pediatric Nephrology Clinic at Levine Children's Hospital in Charlotte, NC. This experience gave me valuable exposure to healthcare and clinical research, motivating me to pursue more opportunities and eventually medical school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also had a great time hanging out with friends, traveling with my family, and going on service trips around the country.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"51e49783-adfd-41b9-9a91-7163fd334d3f\"}":{"__typename":"DeepDives","uuid":"51e49783-adfd-41b9-9a91-7163fd334d3f","content":"\u003cp\u003eI love traveling, hiking, exploring NYC (especially finding good eats), and reading in my free time!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"57210b71-3a07-458a-9f3c-4c7ac2d9f907\"}":{"__typename":"School","uuid":"57210b71-3a07-458a-9f3c-4c7ac2d9f907","name":"Charlotte Country Day School","city":"Charlotte","type":"HIGH","state":"North Carolina","country":"United States","zip":"28226"},"Education:{\"uuid\":\"6293aea1-0968-445f-9b42-2e9ef49f2b3b\"}":{"__typename":"Education","uuid":"6293aea1-0968-445f-9b42-2e9ef49f2b3b","school":{"__ref":"School:{\"uuid\":\"57210b71-3a07-458a-9f3c-4c7ac2d9f907\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"412768a6-165f-4038-b679-3ba9ed7135a2\"}":{"__typename":"Education","uuid":"412768a6-165f-4038-b679-3ba9ed7135a2","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Biology and Spanish","degree":null},"MentorPublicProfile:{\"uuid\":\"bafe75d3-5c14-4fac-8fae-1ba7e1ec997c\"}":{"__typename":"MentorPublicProfile","uuid":"bafe75d3-5c14-4fac-8fae-1ba7e1ec997c","displayName":"Katie B.","slug":"katie-batten","biography":"\u003cp\u003eHi everyone! My name is Katie, and I’m in my second year at NYU Grossman School of Medicine. I am originally from Charlotte, NC and then went to WashU in St. Louis for undergrad where I majored in Biology and Spanish.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion for medicine was sparked when I was in the hospital with a staph infection in 7th grade and was totally enthralled by it. This curiosity led me to pursue clinical, research, and service opportunities throughout high school and college to confirm this is the career for me. I’m particularly drawn to Pediatrics, as my love for children has been a constant theme in my life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to many research and clinical experiences, I was very involved in the club sports community at WashU. I played on and led the club basketball, volleyball, and softball teams. Sports have always been a huge part of my life and were instrumental in developing my teamwork and leadership skills. I also served as a tour guide, a teaching assistant for a neuroscience class, and a tutor for both MCAT test-takers and elementary school students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore medical school, I took a gap year to teach English in an elementary school in Madrid, Spain. Working daily with young students was incredibly energizing and reinforced my desire to continue teaching in some capacity, which is why I’m excited to be part of Curious Cardinals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNext year as a research year in the middle of medical school, I will be working with Saving Mothers, a nonprofit dedicated to improving maternal health worldwide. I will be helping to implement a gestational diabetes screening program in Lake Atitlán, Guatemala! I am excited for the opportunity to master medical Spanish and learn more about indigenous approaches to birth.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love traveling, hiking, exploring NYC, and reading. I am excited to connect with students of all ages to inspire them to embrace their curiosity, unlock their potential, and develop a lifelong love for learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love mentoring students that are interested in STEM, especially medicine. I am happy to help your student conduct original research, find internships, volunteer opportunities, as well as more classic academic support in science and Spanish classes.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"z9YMQkV6z3s5GqTO1OdE01sq3RT8lgYDISPTVhi66T00A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c7f8887c-e30a-4a36-9afd-2d47a0e2477d\"}"},{"__ref":"Favorites:{\"uuid\":\"6c7e25cf-8f61-4cae-939b-c1d9e395a489\"}"},{"__ref":"Favorites:{\"uuid\":\"6f8a19ed-323b-4de9-8ace-122628fc8efe\"}"}],"causesSu
