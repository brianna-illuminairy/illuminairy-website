xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ba828f5f-7c4a-477e-be32-71a58f79bd3f\"}":{"__typename":"Favorites","uuid":"ba828f5f-7c4a-477e-be32-71a58f79bd3f","photoUrl":"https://ucarecdn.com/59ffb0fb-d1dc-4ad2-8c58-0d498a98b4ae/","title":"Antonio Rügider","type":"ATHLETE"},"Favorites:{\"uuid\":\"09934622-f006-402a-bb63-58e6a0556b5b\"}":{"__typename":"Favorites","uuid":"09934622-f006-402a-bb63-58e6a0556b5b","photoUrl":"https://ucarecdn.com/661f09a1-305b-4ac7-8efc-221829933deb/","title":"Anuschka van Lent","type":"ACTOR"},"Favorites:{\"uuid\":\"c74bf98e-74aa-451e-967d-49567b81019f\"}":{"__typename":"Favorites","uuid":"c74bf98e-74aa-451e-967d-49567b81019f","photoUrl":"https://ucarecdn.com/89346be9-2163-47aa-9c4f-6fc38a55540d/","title":"lilsimsie","type":"ARTIST"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4f12bdda-e0ba-40ed-8c6a-e134482199b3\"}":{"__typename":"DeepDives","uuid":"4f12bdda-e0ba-40ed-8c6a-e134482199b3","content":"\u003cp\u003eOne of my favorite passion projects is something I helped start called the Demeter Collective. It’s a community where science, health, and creativity come together — especially around topics that affect women and people with wombs. We ask questions like: What can menstrual stem cells teach us? What might the future of fertility look like? How can we make complex science feel more personal and useful in everyday life?\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWe’ve hosted conversations with scientists, artists, and doctors, built a website, and created events where people can learn from each other. I’ve given talks, written educational content, and helped make sure the science is accurate but also welcoming and clear.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo me, Demeter Collective is about learning together and exploring big questions in a way that feels human. I love that I get to combine my background in biology with my love for teaching and curiosity. It also reminds me that you don’t have to wait for someone else to give you permission — you can start your own project, follow your ideas, and build something meaningful from the ground up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"79054a00-25b0-41be-84ec-1974ffef960f\"}":{"__typename":"DeepDives","uuid":"79054a00-25b0-41be-84ec-1974ffef960f","content":"\u003cp\u003eAstronaut, duh.\u003c/p\u003e\u003cp\u003eI mean, floating in space and seeing Earth from orbit or even further away? I can not think of a more humbling experience that will inspire and create wonder. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"fa7ad7d1-9df9-4f57-b4a3-745900dd6053\"}":{"__typename":"DeepDives","uuid":"fa7ad7d1-9df9-4f57-b4a3-745900dd6053","content":"\u003cp\u003eDon’t stress so much about having it all figured out. It’s okay not to know exactly what you want yet — just follow your curiosity and try things out. Some of the most meaningful paths in life aren’t planned, they’re discovered. Also, ask more questions! Not knowing something doesn’t make you less smart — it just means you’re about to learn. And finally: take care of yourself. Sleep, movement, time with friends — those matter just as much as studying. You’re doing better than you think, and you don’t have to do it all alone. Keep going, one step at a time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"dea0b6b4-6fd8-4676-aa1c-72ac930ef749\"}":{"__typename":"DeepDives","uuid":"dea0b6b4-6fd8-4676-aa1c-72ac930ef749","content":"\u003cp\u003eI chose my major because I wanted to understand how life works — not just in broad strokes, but at the tiniest scales. Biochemistry gave me the tools to explore the invisible processes that power our cells, while neuroscience helped me ask deeper questions about the mind, behavior, and what it means to be human. The combination felt like a perfect fit: one taught me how molecules interact, the other how those interactions might shape thoughts, emotions, and learning.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat really pulled me in was the sense of wonder. The idea that a single protein can make the difference between health and disease, or that electrical signals between neurons are what allow us to dream, remember, and connect — that’s just fascinating to me.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also wanted to study something with real-world impact. These fields sit at the intersection of health, technology, and discovery, and they’re constantly evolving. Whether it’s understanding a disease mechanism or designing a new experiment, there’s always more to learn.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the end, I chose this path not just for the answers, but for the process of asking better questions. And I love sharing that curiosity with others — especially students who are just beginning to explore how the world works.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"af2ea798-00b9-447a-b1bd-c83883c2f782\"}":{"__typename":"School","uuid":"af2ea798-00b9-447a-b1bd-c83883c2f782","name":"Independent High School Diploma","city":"Lübeck","type":"HIGH","state":"Germany","country":"Germany","zip":"00000"},"Education:{\"uuid\":\"c285f1af-6a16-4684-9b67-04306aa0e86d\"}":{"__typename":"Education","uuid":"c285f1af-6a16-4684-9b67-04306aa0e86d","school":{"__ref":"School:{\"uuid\":\"af2ea798-00b9-447a-b1bd-c83883c2f782\"}"},"startYear":"2017","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}":{"__typename":"School","uuid":"0a298df6-dac8-4a1d-8e35-77e7b609185d","name":"Minerva University","city":"San Francisco","type":"COLLEGE","state":"California","country":"United States","zip":"94103"},"Education:{\"uuid\":\"72a67f62-b671-4a06-bca5-a5a411038d0d\"}":{"__typename":"Education","uuid":"72a67f62-b671-4a06-bca5-a5a411038d0d","school":{"__ref":"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2025","major":"Molecular Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"78f8a4f2-9722-4ce9-8774-1de9cb5cb866\"}":{"__typename":"MentorPublicProfile","uuid":"78f8a4f2-9722-4ce9-8774-1de9cb5cb866","displayName":"Pia B.","slug":"pia-brker","biography":"\u003cp\u003eHi, I’m Pia — a scientist, educator, and lifelong learner who believes that curiosity is the best starting point for any big idea.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI recently graduated from Minerva University with a degree in molecular biology and neuroscience. It’s a program that takes you around the world (San Francisco, Berlin, Seoul, Buenos Aires, and more) while challenging you to think critically, ask great questions, and apply what you learn in real-world ways. That global, interdisciplinary experience shapes how I teach — grounded in science, but always connected to the human side of learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOriginally from Germany, I grew up in a small village where I often felt like I had to forge my own academic path because of lack of access and opportunities. That experience taught me how to be resourceful, ask questions no one else was asking, and look for answers in unexpected places. It also sparked my passion for helping other students discover what excites them — especially those who might feel like they don’t quite fit the traditional mold.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic work has explored everything from gene regulation and brain plasticity to environmental biotechnology and science communication. I’ve researched how microalgae capture carbon from the atmosphere, designed tools to help researchers connect with families online, and written about how the brain adapts during learning and stress. I care deeply about making science accessible — not just accurate, but exciting, empowering, and personal.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor and tutor, I work with students from elementary school through university. My sessions are interactive and student-led: we ask questions, break down complex ideas, and build projects that the student is proud of — whether that’s a slide deck explaining how memory works, a blog post about neurodiversity, or a creative explainer on CRISPR. I often bring in tools like ChatGPT to help students brainstorm, summarize, and create faster, while also teaching them to think critically about the information they’re using.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of teaching, I’m usually reading, making videos, or going on long runs while turning over new ideas. I’m especially interested in how science is communicated, how we learn best, and how we can build more inclusive spaces in education. I also love building things — whether it’s an app, a curriculum, or a new community around a shared curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re excited about biology, chemistry, brain science, or just want to understand how the world works a little better, I’d be honored to be your mentor and guide you on that journey.\u003c/p\u003e","teachingVideoPlaybackId":"n6usM02l754y027gGK2asZ01FMZ2eRUtKQNHVr5OflPRNk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ba828f5f-7c4a-477e-be32-71a58f79bd3f\"}"},{"__ref":"Favorites:{\"uuid\":\"09934622-f006-402a-bb63-58e6a0556b5b\"}"},{"__ref":"Favorites:{\"uuid\":\"c74bf98e-74aa-451e-967d-49567b81019f\"}"}],"causesSupported":[],"major":"Molecular Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4f12bdda-e0ba-40ed-8c6a-e134482199b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"79054a00-25b0-41be-84ec-1974ffef960f\"}"},{"__ref":"DeepDives:{\"uuid\":\"fa7ad7d1-9df9-4f57-b4a3-745900dd6053\"}"},{"__ref":"DeepDives:{\"uuid\":\"dea0b6b4-6fd8-4676-aa1c-72ac930ef749\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/965d6734-dbc9-46f9-ad9d-eb386c2a127b/-/preview/-/format/jpg/","https://ucarecdn.com/539d841e-339e-4eff-ada0-3ee9fb82498b/-/preview/-/format/jpg/","https://ucarecdn.com/bddb2454-0530-4154-b4b9-9961f773c0df/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c285f1af-6a16-4684-9b67-04306aa0e86d\"}"},{"__ref":"Education:{\"uuid\":\"72a67f62-b671-4a06-bca5-a5a411038d0d\"}"}],"hiredAt":"2025-09-06T15:29:05.713Z","topics":["Business / Entrepreneurship","Medicine / Health","STEM Project","Aviation / Aerospace","Sustainability"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f5ae8359-9f55-41d8-a96b-8f3dc3ad05db/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mento
