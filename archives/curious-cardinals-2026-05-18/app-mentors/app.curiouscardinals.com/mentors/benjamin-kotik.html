xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"28c5e3b0-ed4a-47c9-98e6-ce2a91937a46\"}":{"__typename":"DeepDives","uuid":"28c5e3b0-ed4a-47c9-98e6-ce2a91937a46","content":"\u003cp\u003eStay consistent in your music creation, don't listen to everyone's opinions in the outside world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ca12b298-aa0d-4094-964b-e3fef9b6ff5f\"}":{"__typename":"DeepDives","uuid":"ca12b298-aa0d-4094-964b-e3fef9b6ff5f","content":"\u003cp\u003eMentorship has helped me understand concepts I had previously encountered on my own in a deeper and clearer way. I believe it can do the same for my future mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d1933ac9-f5ed-44f0-9422-4a0f8b2a096f\"}":{"__typename":"DeepDives","uuid":"d1933ac9-f5ed-44f0-9422-4a0f8b2a096f","content":"\u003cp\u003eOne accomplishment I hope to achieve is having my compositional approach acknowledged in academic circles.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"643974ac-927c-4d45-b799-4fb8a9c9bcbb\"}":{"__typename":"DeepDives","uuid":"643974ac-927c-4d45-b799-4fb8a9c9bcbb","content":"\u003cp\u003eI felt that it was the necessary step in my role as a music creator.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"e10baa30-4972-4981-a228-7040376699ff\"}":{"__typename":"School","uuid":"e10baa30-4972-4981-a228-7040376699ff","name":"LaGuardia High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10023"},"Education:{\"uuid\":\"888f353b-8be0-4c41-a29f-989ef745f089\"}":{"__typename":"Education","uuid":"888f353b-8be0-4c41-a29f-989ef745f089","school":{"__ref":"School:{\"uuid\":\"e10baa30-4972-4981-a228-7040376699ff\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b58ea082-daf7-4557-9325-0a9917b173cf\"}":{"__typename":"School","uuid":"b58ea082-daf7-4557-9325-0a9917b173cf","name":"Brooklyn College","city":"Brooklyn","type":"COLLEGE","state":"New York","country":"United States","zip":"11210"},"Education:{\"uuid\":\"720c57e4-3568-4970-8b3f-902906571c91\"}":{"__typename":"Education","uuid":"720c57e4-3568-4970-8b3f-902906571c91","school":{"__ref":"School:{\"uuid\":\"b58ea082-daf7-4557-9325-0a9917b173cf\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Music Composition","degree":null},"MentorPublicProfile:{\"uuid\":\"a37a8e84-09d6-48d1-bccb-7531ff659a67\"}":{"__typename":"MentorPublicProfile","uuid":"a37a8e84-09d6-48d1-bccb-7531ff659a67","displayName":"Benjamin K.","slug":"benjamin-kotik","biography":"\u003cp\u003eI am a composer, musician (violin and bass guitar), recording artist, producer, and audio engineer. I have been specializing in music composition and sound production—mainly working in Logic Pro X—since high school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy love for music developed later than when I first picked up the violin at the age of four. At first, music felt more like a chore than an interactive form of art. Around the age of sixteen, I realized how much my skills from practicing the violin had influenced my ability to create new textures and how to fully immerse myself in the creative process. My guilty pleasure is spending excessive time perfecting my music and learning new techniques along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic discipline did not end with earning my Bachelor of Music degree at Brooklyn College; rather, it has flourished through my continued studies at the prestigious Academy of Performing Arts in Prague. I am currently in my third year of the bachelor’s program (the same degree as at Brooklyn College), where the expectations for undergraduates in music composition are much more rigorous. Working alongside students from my department—including master’s and doctoral candidates—we showcase our compositions by managing our own concerts and collaborating with other schools in Prague, such as UMPRUM and the Charles University Faculty of Humanities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy work comes from two distinct worlds: electronic music production—primarily hip hop, rap, and pop—and classical composition, focusing on modern and atonal music for solo instruments, string quartets, and ensembles. This year, I began collaborating with film and animation directors from the Film Academy in Prague, as well as students from the Multimedia Department at VŠE, building new connections across Europe beyond the musical world. I have also had the pleasure of attending the Composer’s Summit in Prague, where I spoke with Carl Sagan and Tinar Ponak, composers in the film music industry (Disney/Pixar).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I actively work as a producer and sound engineer for singers, songwriters, and rappers. I have my own recording studio in Ostrava, Czech Republic, where I routinely travel on weekends to record clients. I also teach violin and bass guitar privately, drawing from my own experiences with teachers to develop better teaching methods and keep my students engaged and excited throughout the school year.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLike many composers and musicians, I aspire to one day make a living entirely from music. I believe I am well on that journey, and I am more than delighted to pass my knowledge on to students—not just through instrument performance. At Curious Cardinals, I see myself teaching students harmony and counterpoint, music theory, music production on Logic Pro X, as well as the basics of audio engineering. My attitude with learning these skills has inevitably shaped my composition style and my relationship to music.\u003c/p\u003e","teachingVideoPlaybackId":"WI02PDCXSv7w01D01CufiGQ2qqv1QDUzVj7xHazW8icPlc","teachingVideoDescription":null,"greatestAchievement":"\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWrote music to a Azamat Kanatbekhov's film (Ne)Normální [Translation (Ab)Normal], which received first place by the jury at the Multimedia festival curated by the Prague University of Economics and Business in June, 2025\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMentioned in music blogs about my composition \u003cem\u003eMikronos, \u003c/em\u003ewhich blends classical composition with rap performance (hisVoice, Opera PLUS). First performance: March, 2023\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eRecieved a grant from The Music Academy of Performing Arts in Prague for the creation of three music videos based on my music (January 2025: due month of completion, December 2025)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","favorites":[],"causesSupported":[],"major":"Music Composition","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"28c5e3b0-ed4a-47c9-98e6-ce2a91937a46\"}"},{"__ref":"DeepDives:{\"uuid\":\"ca12b298-aa0d-4094-964b-e3fef9b6ff5f\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1933ac9-f5ed-44f0-9422-4a0f8b2a096f\"}"},{"__ref":"DeepDives:{\"uuid\":\"643974ac-927c-4d45-b799-4fb8a9c9bcbb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a0798296-665b-4ef5-9bab-477ef7954c40/-/preview/-/format/jpg/","https://ucarecdn.com/1c7edd68-6bc9-429d-ad55-a46efa920314/-/preview/-/format/jpg/","https://ucarecdn.com/77281b1f-71fe-43d7-bdcb-51e2ec5705b4/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"888f353b-8be0-4c41-a29f-989ef745f089\"}"},{"__ref":"Education:{\"uuid\":\"720c57e4-3568-4970-8b3f-902906571c91\"}"}],"hiredAt":"2025-09-24T03:19:03.245Z","topics":["Music","Business / Entrepreneurship"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"benjamin-kotik\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a37a8e84-09d6-48d1-bccb-7531ff659a67\"}"}}},"_sentryTraceData":"ab132642914a4bfa9d903a8ce3f1e06d-81935e690a32897b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ab132642914a4bfa9d903a8ce3f1e06d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"benjamin-kotik"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'g
