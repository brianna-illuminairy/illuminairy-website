xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"13edac8d-3d4e-475b-ab5d-273473a34d41\"}":{"__typename":"DeepDives","uuid":"13edac8d-3d4e-475b-ab5d-273473a34d41","content":"\u003cp\u003eDon’t be afraid to ask questions and challenge yourself. The hardest things to learn are often the most valuable. Stop worrying about being ‘behind’—focus on mastering the fundamentals, and everything else will follow. Also, sleep more. You’ll regret it if you don’t\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e58c7769-faed-49e0-9452-99bc16d46471\"}":{"__typename":"DeepDives","uuid":"e58c7769-faed-49e0-9452-99bc16d46471","content":"\u003cp\u003eMentorship matters to me because I’ve seen firsthand how guidance can shape growth. During COVID, I mentored young violin students remotely, helping them stay motivated despite isolation. Seeing their progress showed me that the right support can build confidence, discipline, and passion—whether in music, academics, or life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"91c0f484-2450-4ceb-ad74-5e89418f4d8f\"}":{"__typename":"DeepDives","uuid":"91c0f484-2450-4ceb-ad74-5e89418f4d8f","content":"\u003cp\u003eI want to create something lasting—whether it’s building a fund that supports young musicians, pioneering a new approach to economic research, or mentoring students who go on to surpass me. Impact matters more than recognition.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"bcca2cd3-9603-42a5-95ed-55e61c790ff8\"}":{"__typename":"DeepDives","uuid":"bcca2cd3-9603-42a5-95ed-55e61c790ff8","content":"\u003cp\u003eJascha Heifetz—his precision, control, and pursuit of perfection set a standard not just for violin but for discipline in any field. His playing wasn’t just technical mastery; it was unapologetic excellence. That mindset applies far beyond music.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"ac41e37f-e73c-4f00-962b-b5ac11d369a8\"}":{"__typename":"Education","uuid":"ac41e37f-e73c-4f00-962b-b5ac11d369a8","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":null},"School:{\"uuid\":\"507f17d3-bc05-4b5c-abd6-9ad110075be1\"}":{"__typename":"School","uuid":"507f17d3-bc05-4b5c-abd6-9ad110075be1","name":"Clovis North High School","city":"Fresno","type":"HIGH","state":"California","country":"United States","zip":"93730"},"Education:{\"uuid\":\"9a70c741-d6eb-4180-96ae-030eaa25d481\"}":{"__typename":"Education","uuid":"9a70c741-d6eb-4180-96ae-030eaa25d481","school":{"__ref":"School:{\"uuid\":\"507f17d3-bc05-4b5c-abd6-9ad110075be1\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"d10b6ebe-488e-4c6e-b116-e5619a194eeb\"}":{"__typename":"MentorPublicProfile","uuid":"d10b6ebe-488e-4c6e-b116-e5619a194eeb","displayName":"Alexander H.","slug":"alexander-han","biography":"\u003cp\u003eHi! My name is Alexander Han, and I’m passionate about mentoring students and helping them succeed academically. I’m currently a junior at UCLA, majoring in Economics with a Minor in Mathematics. With a strong foundation in problem-solving and analytical thinking, I strive to make learning both accessible and engaging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI specialize in tutoring math (K-12, Pre-Algebra, Algebra I \u0026amp; II, SAT Prep), geography, astronomy, academic writing, and college essay writing. My goal is not just to help students master concepts but to develop critical thinking skills and academic confidence. I tailor my teaching approach to each student by ensuring they feel supported and empowered in their learning journey.\u003c/p\u003e\u003cp\u003eBeyond academics, I have an extensive background in classical music as a competitive violinist. I have won international and national violin competitions, including 3rd place in the Stradivarius Cremona International String Competition (Italy) and the “Best Caprice” award in the same competition. I was a semifinalist in the Leonid Kogan International Violin Competition and a finalist in the Mary Smart Concerto Competition at the Summit Music Festival. Additionally, I served as concertmaster of the California All-State Orchestra, leading my section and refining my leadership and collaboration skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve worked as an Investment Banking Analyst Intern at Excalibur, where I performed financial modeling and market research, and as a Macroeconomic Research Assistant at UCLA, analyzing exchange rate fluctuations and global economic trends. These experiences have strengthened my ability to break down complex topics into simple, digestible concepts—something I bring into my tutoring sessions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLearning should be challenging and rewarding, and I approach mentorship with patience, encouragement, and enthusiasm. Whether helping a student tackle a difficult algebra problem, understand principles, or crafting a compelling essay, my goal is to make learning meaningful and engaging.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eI look forward to working with students and helping them achieve their academic and personal goals!\u003c/p\u003e","teachingVideoPlaybackId":"97Ck00GV8zlRxlxDngfoyc2r8yjMdpu5v8s1owkWe2r4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003ePlacing as a semifinalist in the Leonid Kogan International Violin Competition was a defining moment for me. Competing against top violinists worldwide pushed me to refine my technique, interpret music at a deeper level, and perform under pressure. It wasn’t just about the result—it proved to me that discipline and persistence pay off.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"13edac8d-3d4e-475b-ab5d-273473a34d41\"}"},{"__ref":"DeepDives:{\"uuid\":\"e58c7769-faed-49e0-9452-99bc16d46471\"}"},{"__ref":"DeepDives:{\"uuid\":\"91c0f484-2450-4ceb-ad74-5e89418f4d8f\"}"},{"__ref":"DeepDives:{\"uuid\":\"bcca2cd3-9603-42a5-95ed-55e61c790ff8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4e7d9926-5054-41a9-b562-4b4a28a7c424/-/preview/-/format/jpg/","https://ucarecdn.com/6398c974-49a3-4b06-8d26-219f796ca236/-/preview/-/forma
