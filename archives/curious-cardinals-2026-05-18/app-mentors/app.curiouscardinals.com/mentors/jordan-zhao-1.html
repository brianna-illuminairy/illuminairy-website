xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a9020bd2-7cbb-4859-92e3-463d0fe8c915\"}":{"__typename":"Favorites","uuid":"a9020bd2-7cbb-4859-92e3-463d0fe8c915","photoUrl":"https://ucarecdn.com/00b1280f-9937-4889-8a15-91c918770da8/","title":"EA FC 26","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5f3fca32-fd1c-405f-9fae-95a2f3ef44a5\"}":{"__typename":"DeepDives","uuid":"5f3fca32-fd1c-405f-9fae-95a2f3ef44a5","content":"\u003cp\u003eI was a very shy kid in middle school and high school, often afraid to try new things or put myself out there. If I could give my younger self advice, it would be this: what others think about you isn’t what truly matters—what matters is what \u003cem\u003eyou\u003c/em\u003e think about yourself. I’d remind myself to have more confidence, to believe that I was capable of more than I realized, and not to count myself out before even trying. With the right mindset, you discover that you’re stronger than you think, and that giving your best effort is always worth it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b5ba4e6d-6e3f-4b23-a999-baa51fc391df\"}":{"__typename":"DeepDives","uuid":"b5ba4e6d-6e3f-4b23-a999-baa51fc391df","content":"\u003cp\u003eMentorship matters to me because the world can often feel overwhelming, with so many directions to take and pressures about what you “should” be doing. Having someone who has gone through similar experiences provides both guidance and reassurance. A mentor can share hard-earned lessons, help you navigate uncertainty, and remind you that you don’t have to figure everything out on your own. For me, mentorship is not only about learning from someone else’s journey, but also about having a source of support and perspective that makes the path forward feel less daunting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c494427c-8961-48cd-a4e5-206deed53c1b\"}":{"__typename":"DeepDives","uuid":"c494427c-8961-48cd-a4e5-206deed53c1b","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is creating a meaningful impact on others. I want to look back and know that I helped people reach their goals, made their lives a little easier, or inspired them to believe in themselves. For me, success isn’t just about personal achievements, but about building something that lasts beyond myself. Whether that’s through contributing to innovations in research, supporting future students as a mentor, or giving back to communities in need, I want my work and actions to create ripples that outlast me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c9db5c7e-9086-4893-b6ae-67e61f732824\"}":{"__typename":"DeepDives","uuid":"c9db5c7e-9086-4893-b6ae-67e61f732824","content":"\u003cp\u003eI viewed my high school summers as opportunities to learn and grow in a more relaxed environment. The summer after my freshman year, I decided to try something completely new—I signed up for a fencing class. What started as a summer experiment quickly became a passion, and fencing is now a big part of my life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also used summers to explore academic interests beyond the standard high school curriculum. I attended programs where I could dive into subjects like game theory and data science, which challenged me to think in new ways and confirmed my love of problem-solving.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, I saw summer as a chance to prepare for the upcoming school year. I often did light previews of my classes so I could enter the fall with confidence and curiosity. For me, summers were the perfect mix of exploration, preparation, and discovery.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"48a4b02e-6066-4465-a432-e45d54f76380\"}":{"__typename":"School","uuid":"48a4b02e-6066-4465-a432-e45d54f76380","name":"Rye Country Day School","city":"Rye","type":"HIGH","state":"New York","country":"United States","zip":"10580"},"Education:{\"uuid\":\"7115caba-428e-48db-a04d-33daf038d58f\"}":{"__typename":"Education","uuid":"7115caba-428e-48db-a04d-33daf038d58f","school":{"__ref":"School:{\"uuid\":\"48a4b02e-6066-4465-a432-e45d54f76380\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"ef22e7d5-0031-4470-aee1-5a10b62b4540\"}":{"__typename":"Education","uuid":"ef22e7d5-0031-4470-aee1-5a10b62b4540","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"7be7676e-7b35-416f-9717-841ef246d9ee\"}":{"__typename":"MentorPublicProfile","uuid":"7be7676e-7b35-416f-9717-841ef246d9ee","displayName":"Jordan Z.","slug":"jordan-zhao-1","biography":"\u003cp\u003eHi! My name is Jordan, and I’m an Economics and Mathematics student at Columbia University, originally from New York. I’ve always loved learning math and building models, which is what led me to study Economics and Math. For me, math has always been a language that helps explain the patterns and systems around us. From solving puzzles as a kid to building economic models in college, I’ve been drawn to the challenge of breaking problems into smaller pieces and finding the logic behind them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAll throughout middle and high school, I threw myself into a wide range of activities—from pottery and cello to the competitive math team, varsity soccer, fencing, and track. I served as captain of the varsity fencing team and now fence with Columbia’s club team. Academically, I was proud to qualify for the American Invitational Mathematics Exam, which further fueled my passion for problem-solving. During high school, I also fell in love with learning how the world works through math. Subjects like physics and economics really captured my interest, and ever since taking those classes, I knew I wanted to study either Economics or Physics. Choosing Economics and Math at Columbia gave me the perfect combination of real-world application and quantitative rigor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Columbia, I’ve been exploring the world of finance and business, a path I’m excited to pursue as a career. Through classes and clubs, I’ve been able to see how the theories I’ve studied can translate into strategy, decision-making, and problem-solving in real organizations. I’ve also become interested in doing research, especially projects that help us better understand human behavior and the ever-changing world around us.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I enjoy staying active and learning new sports, so I’ve joined several clubs and teams to keep challenging myself physically. Whether it’s picking up a new sport or continuing to practice fencing, I’ve found that exercise pushes me to stay disciplined, manage my time, and constantly look for ways to improve.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond school and sports, I’m passionate about self-improvement and personal growth. In my free time, you’ll often find me diving down random rabbit holes—I love researching whatever catches my curiosity that week. One week I might be learning about architecture, another week about behavioral economics, and the next about fitness science. I enjoy the process of discovery, and I think that curiosity is one of my biggest strengths. I’m always looking for ways to challenge myself, grow, and better understand the world.\u003c/p\u003e","teachingVideoPlaybackId":"zJDc00MTbMXcjMGIwBjn7EDqmj02o00e1BE3GWHVZlz4xs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was becoming the Varsity Fencing Team Captain. While it technically is not the most difficult achievement, I'm proud of it because, relative to most fencers, I started realllly late. To catch up, I spent countless hours before and after practice and at home doing drills and trying to become as good as possible. This all paid off when I was elected to be the captain of the team and won the MVP award my senior year. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a9020bd2-7cbb-4859-92e3-463d0fe8c915\"}"}],"causesSupported":[],"major":"Economics Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5f3fca32-fd1c-405f-9fae-95a2f3ef44a5\"}"},{"__ref":"DeepDives:{\"uuid\":\"b5ba4e6d-6e3f-4b23-a999-baa51fc391df\"}"},{"__ref":"DeepDives:{\"uuid\":\"c494427c-8961-48cd-a4e5-206deed53c1b\"}"},{"__ref":"DeepDives:{\"uuid\":\"c9db5c7e-9086-4893-b6ae-67e61f732824\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/70b91fb4-a092-418c-bb25-c5d75d599602/-/preview/-/format/jpg/","https://ucarecdn.com/31ad47f5-f317-4828-ae94-826d4742cc87/-/preview/-/format/jpg/","https://ucarecdn.com/9332910c-6e78-4659-b1fa-109e5ca747cd/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7115caba-428e-48db-a04d-33daf038d58f\"}"},{"__ref":"Education:{\"uuid\":\"ef22e7d5-0031-4470-aee1-5a10b62b4540\"}"}],"hiredAt":"2025-09-21T22:51:01.954Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Chemistry","Latin","Academic Coaching","Executive Function","College Essay Writing","Economics","Computer Science"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jordan-zhao-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7be7676e-7b35-416f-9717-841ef246d9ee\"}"}}},"_sentryTraceData":"2197fb6a12c04bb1818f3a2e5b0aad8c-95382911efd0baaf-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2197fb6a12c04bb1818f3a2e5b0aad8c,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jordan-zhao-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-man
