xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"273f3ce1-d706-4ad3-81b5-1321de611f94\"}":{"__typename":"DeepDives","uuid":"273f3ce1-d706-4ad3-81b5-1321de611f94","content":"\u003cp\u003eMentorship matters deeply to me because I understand firsthand how transformative the right guidance can be. As the first person in my family to pursue higher education, I often had to navigate academic systems, application processes, and long-term planning on my own. While I was fortunate to have a strong personal support system, I learned that even motivated and capable students can benefit enormously from having someone who understands the “behind-the-scenes” logistics of academic success.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe mentorship provides more than just academic support — it offers structure, perspective, and encouragement at critical moments. Having someone to help break big goals into manageable steps, ask the right questions, and provide honest feedback can change not only outcomes, but confidence. This is the kind of support I strive to offer my students: practical guidance paired with genuine encouragement, so they feel empowered to take ownership of their learning and future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"c5e97b04-0282-4e98-a703-583f50a6ab72\"}":{"__typename":"School","uuid":"c5e97b04-0282-4e98-a703-583f50a6ab72","name":"Catalina Foothills High School","city":"Tucson","type":"HIGH","state":"Arizona","country":"United States","zip":"85718"},"Education:{\"uuid\":\"429ab1ac-e246-4d93-b058-abe446f4514b\"}":{"__typename":"Education","uuid":"429ab1ac-e246-4d93-b058-abe446f4514b","school":{"__ref":"School:{\"uuid\":\"c5e97b04-0282-4e98-a703-583f50a6ab72\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"d6cb8cd2-3100-4517-ba0a-4893b0ec3ae2\"}":{"__typename":"Education","uuid":"d6cb8cd2-3100-4517-ba0a-4893b0ec3ae2","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"English \u0026 Creative Writing and Theatre","degree":null},"MentorPublicProfile:{\"uuid\":\"14a9c4e8-e2ad-4f45-8921-b609bec63745\"}":{"__typename":"MentorPublicProfile","uuid":"14a9c4e8-e2ad-4f45-8921-b609bec63745","displayName":"Danielle M.","slug":"danielle-muller","biography":"\u003cp\u003eHello! I’m \u003cstrong\u003eDanielle\u003c/strong\u003e, and I am currently an \u003cstrong\u003eMPhil student at the University of Cambridge\u003c/strong\u003e with a strong passion for education, mentorship, and helping students reach their academic potential. I previously graduated from \u003cstrong\u003eDartmouth College\u003c/strong\u003e with a concentration in \u003cstrong\u003eEnglish \u0026amp; Creative Writing and Theatre\u003c/strong\u003e, where I developed a deep appreciation for interdisciplinary learning and education. I am currently working towards my own goal of working in higher education, and a big part of that for me is my love of teaching. Over the past several years, I’ve gained extensive experience helping students build strong academic foundations — from mastering \u003cstrong\u003emath, earth science, physics, and standardized test preparation\u003c/strong\u003e to developing high-quality \u003cstrong\u003ewriting and research projects\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve been passionate about learning across disciplines for as long as I can remember, and recently I’ve had the opportunity to pursue this passion at the highest academic level. Over the past few years, I have:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePresented \u003cstrong\u003einternational research on medieval literature \u003c/strong\u003eat leading institutions including the \u003cstrong\u003eUniversity of Cambridge, Sorbonne University, and the University of Bergen\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePublished \u003c/strong\u003emy writing in several magazines and newspapers\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEarned top academic honors at Dartmouth College, including recognition as a \u003cstrong\u003eRufus Choate Scholar (top 5% of students)\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked as a \u003cstrong\u003eDartmouth Learning Fellow and peer tutor\u003c/strong\u003e, supporting students in \u003cstrong\u003epre-calculus, calculus, multivariable calculus, problem solving, and academic writing\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI understand what it feels like to juggle demanding coursework, ambitious goals, extracurricular commitments, and limited time. My goal as a mentor is to help students turn confusion into confidence and passion into measurable progress.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eProjects We Can Do\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI mentor students who want support with:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic Writing \u0026amp; Research Projects\u003c/strong\u003e (school essays, passion projects, independent research in the humanities, and long-term assignments)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStudy Skills Development\u003c/strong\u003e (time management, organization systems, test-taking strategies, and goal-setting)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSubject-Specific Support\u003c/strong\u003e (humanities subjects such as literature, languages, history, and writing)\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eMy Mentorship Style\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve taught students ranging from \u003cstrong\u003eelementary school learners to college undergraduates\u003c/strong\u003e, and I focus on making each session clear, structured, and motivating. I tailor lessons to each student’s learning style and academic goals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session might include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking down challenging concepts step-by-step\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing test strategies and problem-solving techniques with real examples\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding personalized study plans and weekly academic goals\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eAnd a Few Fun Facts About Me\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not studying or teaching, you’ll usually find me involved in \u003cstrong\u003etheatre productions\u003c/strong\u003e, \u003cstrong\u003ecreative writing projects\u003c/strong\u003e, \u003cstrong\u003eplaying rugby\u003c/strong\u003e, or learning new languages. I currently speak \u003cstrong\u003eSpanish and Icelandic\u003c/strong\u003e and I study \u003cstrong\u003eOld Norse, Old English, and Latin\u003c/strong\u003e! I am also a big fan of \u003cstrong\u003estorytelling, journalism, and creative projects\u003c/strong\u003e, and I love helping students connect their personal interests to their academic work.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’d love to help you reach your next academic milestone and enjoy the learning process along the way!\u003c/p\u003e","teachingVideoPlaybackId":"6agemrhvzA5nKoAAV6jQadXczQmYo002cbsxhROtCVsA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English \u0026 Creative Writing and Theatre","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"273f3ce1-d706-4ad3-81b5-1321de611f94\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cca9df0a-40c4-4082-a57a-f2a3e0988b01/-/preview/-/format/jpg/","https://ucarecdn.com/e0164294-a9e5-4985-993f-b75ad86b5c82/-/preview/-/format/jpg/","https://ucarecdn.com/7b78c009-d55f-4b03-8f5e-87675cfb90ce/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"429ab1ac-e246-4d93-b058-abe446f4514b\"}"},{"__ref":"Education:{\"uuid\":\"d6cb8cd2-3100-4517-ba0a-4893b0ec3ae2\"}"}],"hiredAt":"2026-01-21T16:11:25.206Z","topics":["Writing","Academic Coaching","College Essay Writing","Executive Function","History","Reading","Creative Writing","Film / Theater","History Project","K-6 Storybook","Debate","Journalism","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/ceacbeeb-af28-4003-96cf-d977276b04ef/","https://ucarecdn.com/dbb85a97-5baf-4c25-858e-d5d38d0a7f9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mento
