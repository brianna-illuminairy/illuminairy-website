xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"058eb11a-e5e2-4dec-823d-99781a7e79d9\"}":{"__typename":"Favorites","uuid":"058eb11a-e5e2-4dec-823d-99781a7e79d9","photoUrl":"https://ucarecdn.com/9072c8c2-c975-4a97-949b-91ef458af26f/","title":"Basketball","type":"SPORT"},"Favorites:{\"uuid\":\"7f0dbe60-dd64-4366-a0ee-ad40dff8f053\"}":{"__typename":"Favorites","uuid":"7f0dbe60-dd64-4366-a0ee-ad40dff8f053","photoUrl":"https://ucarecdn.com/1fe9276a-bbf8-41d8-9619-dd83614ca098/","title":"New York City!","type":"CITY"},"Favorites:{\"uuid\":\"b27eb4fc-1e4c-47e8-a473-b2a48d3216bc\"}":{"__typename":"Favorites","uuid":"b27eb4fc-1e4c-47e8-a473-b2a48d3216bc","photoUrl":"https://ucarecdn.com/710cefca-5e4e-4e1f-9e81-19ca9637c406/","title":"Speak Now by Taylor Swift","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3026016b-7915-4910-bb72-5c4b8896fb14\"}":{"__typename":"DeepDives","uuid":"3026016b-7915-4910-bb72-5c4b8896fb14","content":"\u003cp\u003eI would tell my middle or high school self that it’s always okay to ask for help, and to never struggle quietly. Whether it’s understanding something in class or balancing a busy schedule, getting support doesn’t mean you’re behind, it simply means you’re taking your growth seriously and setting yourself up to improve.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I’d remind myself to stay curious and take chances on new opportunities, even if they feel intimidating at first. Some of the most meaningful growth happens when you step outside your comfort zone and realize you’re capable of more than you think!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f38aa909-23ae-463f-84d9-dad728cf2e55\"}":{"__typename":"DeepDives","uuid":"f38aa909-23ae-463f-84d9-dad728cf2e55","content":"\u003cp\u003eI chose Biomedical Engineering because I’ve always loved both math and science, and I wanted a major that would let me use them together in a meaningful, real-world way. I’ve always been interested in how the human body works, but I’m also drawn to designing solutions. Biomedical engineering felt like the perfect combination of both!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat really excited me about the field is that it connects what you learn in the classroom to things that can directly improve people’s lives, whether that’s through medical devices, diagnostics, or new therapies. I like that it's creative and hands-on, but still deeply rooted in science, and it’s a major that constantly pushes you to think critically, adapt, and keep learning!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"8a7dd77a-5cc2-473e-9561-19f5fe69e71a\"}":{"__typename":"DeepDives","uuid":"8a7dd77a-5cc2-473e-9561-19f5fe69e71a","content":"\u003cp\u003eMy greatest role model is my mom! She immigrated from China as a young adult and built an entirely new life for herself in the United States. While raising me and my brother, she also pushed herself through law school and worked to build a career as a patent attorney—all in a language that wasn’t her first.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWatching her navigate such major challenges with resilience, discipline, and determination has shaped the way I approach my own goals. She inspires me every day to work hard, stay humble, and keep going even when something feels difficult or unfamiliar. More than anything, she’s taught me that growth comes from persistence, and that your background should never limit how far you’re able to go.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"60dd0c7c-2659-43c4-b79a-ea705d945577\"}":{"__typename":"DeepDives","uuid":"60dd0c7c-2659-43c4-b79a-ea705d945577","content":"\u003cp\u003eOut of all the things I could be doing, I choose mentorship because I’m naturally a curious person who loves learning, and I want to help other students feel that same excitement and confidence in their education. I’ve always believed that the right support can completely change how a student sees themselves, and mentorship gives me the opportunity to be that support. I want to be the kind of mentor who not only helps students improve academically, but also helps them build the mindset and confidence to keep learning long after our sessions end.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"fa993c2e-16a5-4a01-a944-fcdd62e42ec6\"}":{"__typename":"School","uuid":"fa993c2e-16a5-4a01-a944-fcdd62e42ec6","name":"Carmel High School","city":"Carmel","type":"HIGH","state":"Indiana","country":"United States","zip":"46032"},"Education:{\"uuid\":\"b6c1178d-3c75-4a1a-af3d-06a7d0b07403\"}":{"__typename":"Education","uuid":"b6c1178d-3c75-4a1a-af3d-06a7d0b07403","school":{"__ref":"School:{\"uuid\":\"fa993c2e-16a5-4a01-a944-fcdd62e42ec6\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}":{"__typename":"School","uuid":"891dad70-4e24-4602-8353-1e8140b8eb0c","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60201"},"Education:{\"uuid\":\"ee3fcea8-bb5c-464b-8768-c14b829274bc\"}":{"__typename":"Education","uuid":"ee3fcea8-bb5c-464b-8768-c14b829274bc","school":{"__ref":"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"dd5bc98d-6eee-4241-8d93-d0bb3066e0c9\"}":{"__typename":"MentorPublicProfile","uuid":"dd5bc98d-6eee-4241-8d93-d0bb3066e0c9","displayName":"Katelyn M.","slug":"katelyn-ma","biography":"\u003cp\u003eHi parents and students! My name is Katelyn Ma, and I’m a senior at Northwestern University studying Biomedical Engineering. I'm passionate about helping students feel more confident in STEM by making challenging topics feel clear, approachable, and even fun. I know school can sometimes feel overwhelming, so as a mentor, my goal is to create a supportive space where students feel comfortable asking questions, building skills step-by-step, and celebrating real progress along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to work with students across all levels of math, biology, and chemistry, as well as related STEM subjects. I enjoy finding the explanation that “clicks” for each learner, and I focus on helping students not only understand the material, but also strengthen their overall study habits. Whether it’s preparing for a test, keeping up with coursework, or building better organization and time-management skills, I love helping students feel more capable and independent in the way they learn.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough my academic and professional experiences in STEM, I’ve developed strong problem-solving skills that translate directly into tutoring and mentorship. Outside of the classroom, I work on bioelectronic engineering projects that require careful attention to detail, flexibility when something doesn’t work as expected, and clear communication when explaining results to a team. I’ve also worked as an intern in the pharmaceutical industry, where I supported experiments that contribute to real biotechnology development. These experiences strengthened my passion for math and science and gave me a deeper appreciation for how STEM concepts can make a real impact. Most importantly, they’ve taught me how to stay patient when a concept feels difficult, figure out what’s causing confusion, and guide students toward understanding in an encouraging way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also volunteer teaching tennis lessons to kids on the autistic spectrum, which has made me even more adaptable and attentive to different learning styles. Because of this, I feel confident working with students of many ages and backgrounds, including students with special needs, while always prioritizing a positive and motivating learning environment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I love reading historical fiction, and I’m a big fan of going to the movie theater as a fun way to reset and gain perspective! I also have a small but proud hobby of making latte art, which I learned while working as a barista in high school. If you’re looking for a mentor who is structured, patient, and genuinely excited to help students succeed, I’d love to support your student’s learning journey!\u003c/p\u003e","teachingVideoPlaybackId":"Z016ofvjDwvrmbRMnDBY3urbjL38V10001HRDnCJr5BJp8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"058eb11a-e5e2-4dec-823d-99781a7e79d9\"}"},{"__ref":"Fa
