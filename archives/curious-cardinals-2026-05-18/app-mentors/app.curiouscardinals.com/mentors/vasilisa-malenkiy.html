xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"78af463f-5a18-4a24-a332-5488387af135\"}":{"__typename":"Favorites","uuid":"78af463f-5a18-4a24-a332-5488387af135","photoUrl":"https://ucarecdn.com/a26d6b0a-c1a7-436b-95a5-352524b5d467/","title":"Stick Season","type":"ALBUM"},"Favorites:{\"uuid\":\"16a0cf27-6042-46d8-b5d6-52669c837444\"}":{"__typename":"Favorites","uuid":"16a0cf27-6042-46d8-b5d6-52669c837444","photoUrl":"https://ucarecdn.com/7e1b223e-0ff2-4ff6-8237-da1cfe5d27f2/","title":"Boulder","type":"CITY"},"Favorites:{\"uuid\":\"03dc57a2-452d-43b0-a487-fdb4ee145ff7\"}":{"__typename":"Favorites","uuid":"03dc57a2-452d-43b0-a487-fdb4ee145ff7","photoUrl":"https://ucarecdn.com/9dbc9ffc-1594-4306-a72f-644f25c96798/","title":"Dancing, skiing, \u0026 surfing","type":"SPORT"},"CausesSupported:{\"uuid\":\"0f018f6e-841e-4230-9604-32351b608798\"}":{"__typename":"CausesSupported","uuid":"0f018f6e-841e-4230-9604-32351b608798","name":"Women in Physics","description":"","photoUrl":"https://ucarecdn.com/71a3501a-a46f-484e-912f-b311cc6b55a7/"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"aee40b0e-71f9-40c0-bc7f-178840c732b0\"}":{"__typename":"DeepDives","uuid":"aee40b0e-71f9-40c0-bc7f-178840c732b0","content":"\u003cp\u003eGetting deployed to Antarctica for neutrino or astrophysics research!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"38ad8c19-24be-4642-aa44-4d9683fb4e74\"}":{"__typename":"DeepDives","uuid":"38ad8c19-24be-4642-aa44-4d9683fb4e74","content":"\u003cp\u003eOne day, I decided that if I couldn't go see the aurora borealis in Iceland, the aurora borealis would have to come to me. I constructed an apparatus consisting of a vacuum chamber, magnets, and a high voltage power supply to simulate the northern lights. Standing there, watching in amazement as pink and purple light filled the chamber, I realized that physics let me shine a light into and explore the deepest corners of the universe.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"b88ec2ff-c7f7-4376-beec-eb235d4182ab\"}":{"__typename":"DeepDives","uuid":"b88ec2ff-c7f7-4376-beec-eb235d4182ab","content":"\u003cp\u003eOnce I dreamt I was skiing down the side of Mt. Everest and then halfway through the mountain morphed into a massive Nazaré wave that I started surfing... very bizzare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"40254813-1799-492a-935c-34f6c9da861d\"}":{"__typename":"DeepDives","uuid":"40254813-1799-492a-935c-34f6c9da861d","content":"\u003cp\u003eI've had many fabulous mentors in the last few years who supported my crazy dreams \u0026amp; encouraged me to persevere through countless difficulties. It's time to pass that on. What good is knowledge and experience if we don't share it with others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}":{"__typename":"School","uuid":"843cb79b-75a7-4415-89cc-0166c307ba4b","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"CT","country":"USA","zip":"06511"},"Education:{\"uuid\":\"93855019-8bf0-41ae-8dd0-924acf4725c0\"}":{"__typename":"Education","uuid":"93855019-8bf0-41ae-8dd0-924acf4725c0","school":{"__ref":"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}"},"startYear":"2023","endYear":"2027","expectedGradYear":"2027","major":"Physics","degree":null},"School:{\"uuid\":\"15fe1402-5052-443e-9a39-5a1aec44bdc3\"}":{"__typename":"School","uuid":"15fe1402-5052-443e-9a39-5a1aec44bdc3","name":"Peak to Peak Charter School","city":"Lafayette","type":"HIGH","state":"Colorado","country":"United States","zip":"80026"},"Education:{\"uuid\":\"dfd582a3-d79e-4c40-8deb-7f1e2adca807\"}":{"__typename":"Education","uuid":"dfd582a3-d79e-4c40-8deb-7f1e2adca807","school":{"__ref":"School:{\"uuid\":\"15fe1402-5052-443e-9a39-5a1aec44bdc3\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":"2023","major":"Physics","degree":null},"Testimonial:5244a3a3-e156-45b3-9f0b-fbc7203c0806":{"__typename":"Testimonial","id":"5244a3a3-e156-45b3-9f0b-fbc7203c0806","text":"Vas is so smart and such an incredible mentor.  She teaches in a relatable manner so you learn and feel confident at the end of each session.","date":"2025-06-03 01:17:36.078+00","rating":5,"endorser":{"__typename":"Endorser","name":"Rachel","tagline":"","avatar":null}},"Testimonial:82d7e4f7-b55e-4892-bde9-e39c266a8b35":{"__typename":"Testimonial","id":"82d7e4f7-b55e-4892-bde9-e39c266a8b35","text":"Vas was a fantastic mentor!  She was energized and helped us prepare for assessments and labs.  We appreciate her!","date":"2025-06-03 01:11:02.603+00","rating":5,"endorser":{"__typename":"Endorser","name":"Rachel","tagline":"","avatar":null}},"Testimonial:0823f364-e438-4c9a-9694-8482022d7e8b":{"__typename":"Testimonial","id":"0823f364-e438-4c9a-9694-8482022d7e8b","text":"Vas has been an awesome mentor to my daughter. She was able to help my daughter deepen her learning of the various physics concepts, thus helping her become a more confident learner in taking the AP exam. I can't thank Vas enough!","date":"2025-05-25 00:01:34.965+00","rating":5,"endorser":{"__typename":"Endorser","name":"Nani Sarosa","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"68e19147-d8b6-4b88-8253-40a3b273be3c\"}":{"__typename":"MentorPublicProfile","uuid":"68e19147-d8b6-4b88-8253-40a3b273be3c","displayName":"Vasilisa M.","slug":"vasilisa-malenkiy","biography":"\u003cp\u003eVasilisa is a junior at Yale University, where she is pursuing a Bachelor of Science in Physics. An aspiring physicist aiming to obtain a PhD in the field, she finds great joy in the pursuit of discovery and is committed to sharing that excitement with her students. Whether her students need help reinforcing what they’ve learned in school or are eager to go beyond the classroom and explore future careers in physics, Vasilisa is dedicated to sharing her knowledge and passion for understanding how the universe works.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHowever, she teaches more than just physics and math. Vasilisa aims to impart far more important lessons about perseverance and resilience, encouraging her students to persist through even the most daunting challenges. For her, fostering self-confidence and the ability to tackle any problem from first principles is far more important than mastering or memorizing formulas.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, Vasilisa is actively engaged in nuclear physics research, developing instrumentation for experimental dark matter searches, and has previously conducted astrophysics research, searching for supermassive black holes observed with the James Webb Space Telescope. This summer she is continuing a mix of nuclear physics \u0026amp; electrical engineering research at Stanford University’s SLAC National Accelerator Laboratory. She has also contributed to research improving secure X-band radio communications at The National Institute of Standards and Technology, and tracked near-earth asteroids at the Yale Summer Program in Astrophysics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn her free time, Vasilisa loves dancing, skiing, surfing, running, traveling, hiking, volunteering on farms, and spending time with friends and family.\u003c/p\u003e","teachingVideoPlaybackId":"1xIyn7lnU01X6mF4f02AqEpd1FiSPeOOdfhBuUFgoAneI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement has been studying physics in undergrad. Ever since I self-studied intro physics sophomore year of high school, my biggest dream has been continuing that exploration of the natural world as a career. Now that I'm actually studying physics in undergrad, I realize it was never that simple and there are so many more decisions ahead - astro, nuclear, quantum, AMO, particle, etc.? Now I'm working towards the great achievement of self-discovery and choosing a specialty. Through it all, I have to remember that it's already exciting enough that I get to spend these couple years studying our universe \u0026amp; passing those lessons on to whoever will listen.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"78af463f-5a18-4a24-a332-5488387af135\"}"},{"__ref":"Favorites:{\"uuid\":\"16a0cf27-6042-46d8-b5d6-52669c837444\"}"},{"__ref":"Favorites:{\"uuid\":\"03dc57a2-452d-43b0-a487-fdb4ee145ff7\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0f018f6e-841e-4230-9604-32351b608798\"}"}],"major":"Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"aee40b0e-71f9-40c0-bc7f-178840c732b0\"}"},{"__ref":"DeepDives:{\"uuid\":\"38ad8c19-24be-4642-aa44-4d9683fb4e74\"}"},{"__ref":"DeepDives:{\"uuid\":\"b88ec2ff-c7f7-4376-be
