hat inspired me. That developed my love of science and history and writing. They made me feel safe and empowered me.\u003cbr\u003e\u003cbr\u003e I want to pay it forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9d260b8f-f37e-4138-bde5-68f5c2fb2697\"}":{"__typename":"DeepDives","uuid":"9d260b8f-f37e-4138-bde5-68f5c2fb2697","content":"\u003cp\u003eOn the Stanford application there was a list of majors. I scrolled for about two minutes until I found the most interesting-sounding one. I picked it: and then I submitted my application.\u003cbr\u003e\u003cbr\u003eOf course, over the years I've had many opportunities to change my major but I never felt the need to. I've loved everything I've learned and have felt that, funnily enough, picking the coolest-sounding major actually worked out for me. \u003cbr\u003e\u003cbr\u003eI'm glad I made that decision -  underneath it, there's a piece of advice. Do what is interesting to \u003cem\u003eyou\u003c/em\u003e.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"5c069a3b-f12b-4a1b-a223-3d646ee777df\"}":{"__typename":"Education","uuid":"5c069a3b-f12b-4a1b-a223-3d646ee777df","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Bioengineering and Computer Science","degree":"B.S."},"School:{\"uuid\":\"9122ea07-2b15-4355-b55d-a31e67c43ef9\"}":{"__typename":"School","uuid":"9122ea07-2b15-4355-b55d-a31e67c43ef9","name":"Panther Creek High School","city":"Cary","type":"HIGH","state":"NC","country":"United States","zip":"27519"},"Education:{\"uuid\":\"809cb375-3e91-42a6-8a2b-564f9caeff42\"}":{"__typename":"Education","uuid":"809cb375-3e91-42a6-8a2b-564f9caeff42","school":{"__ref":"School:{\"uuid\":\"9122ea07-2b15-4355-b55d-a31e67c43ef9\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"Testimonial:74038390-e228-40f8-85df-0e814d4880d2":{"__typename":"Testimonial","id":"74038390-e228-40f8-85df-0e814d4880d2","text":"Suleman has been a gift to Mark. \nHe has guided him, shared his expertise and, at the same time followed and expanded his interests. \nMark looks forward to their sessions where he is super engaged and quite calm when the session is done.\nThey have taken an interesting journey together and Suleman is a wonderful life role model","date":"2025-05-29 22:30:41.582+00","rating":5,"endorser":{"__typename":"Endorser","name":"Margaret","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"6caf6105-885f-4421-9022-2517303a3fcc\"}":{"__typename":"MentorPublicProfile","uuid":"6caf6105-885f-4421-9022-2517303a3fcc","displayName":"Suleman Q.","slug":"suleman-qamar","biography":"\u003cp\u003eSuleman is a Bioengineering student at Stanford planning on going to Medical School in the near future. His passions revolve around the brain - figuring out how it works and how to improve it. In fact, Suleman has a brain himself that he continuously wrangles with. \u003cbr\u003e\u003cbr\u003eHe works at the cutting-edge of science at Stanford, even developing his own patent (currently pending) during his time there. At the moment he's creating a cure for Lactose Intolerance (feel free to ask him about it!).\u003cbr\u003e\u003cbr\u003eSuleman has worked with all different types of students, including those with ADHD/ADD, Autism, and Down's Syndrome. He teaches anything STEM-related (and has experience teaching all ages). He has also taught fundamental skills such as reading, basic math, and sensorimotor dexterity. \u003cbr\u003e\u003cbr\u003eSuleman loves to read and write, and thus also enjoys teaching writing and history.\u003cbr\u003e\u003cbr\u003eIn his free time Suleman likes to play video games, do Mixed Martial-Arts, play soccer, and listen to Hip-Hop - usually not simultaneously.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eStarting my own company to pay for college!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"6f5212cc-7471-4bff-ae54-ba30bb7585f7\"}"},{"__ref":"Favorites:{\"uuid\":\"87a4ce52-ba5f-464c-a9d0-3adacd6090a2\"}"},{"__ref":"Favorites:{\"uuid\":\"86b33003-c2a5-47b4-8e03-bdde0e4f114f\"}"}],"causesSupported":[],"major":"Bioengineering and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4967ccaa-5343-488f-8a39-6bf793a7cb16\"}"},{"__ref":"DeepDives:{\"uuid\":\"4dd971c2-fc38-40b2-ba39-cecd18818886\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d260b8f-f37e-4138-bde5-68f5c2fb2697\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a89303af-20f5-42e6-b063-3335ab53c6bb/-/preview/-/format/jpg/","https://ucarecdn.com/b8bb7410-c594-4bf2-981c-c11ef7b481a2/-/preview/-/format/jpg/","https://ucarecdn.com/9b385648-2bb6-4d92-8ba2-c0fda46abb5c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5c069a3b-f12b-4a1b-a223-3d646ee777df\"}"},{"__ref":"Education:{\"uuid\":\"809cb375-3e91-42a6-8a2b-564f9caeff42\"}"}],"hiredAt":"2023-01-23T07:43:44.000Z","topics":["Chemistry","Physics","STEM Project","Biology","Medicine / Health","Statistics","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Geometry","6-8 Grade Science","Writing","Algebra II","Calculus","Algebra I"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedP
