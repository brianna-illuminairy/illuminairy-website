xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e55896bb-2be4-4fe0-a6d9-c01a0bbc449b\"}":{"__typename":"DeepDives","uuid":"e55896bb-2be4-4fe0-a6d9-c01a0bbc449b","content":"\u003cp\u003eMentorship matters to me because it can completely shape how a student sees their own potential. I believe having someone who encourages you, challenges you, and genuinely believes in you can make a huge difference.\u003c/p\u003e\u003cp\u003eTo me, mentorship is about more than just learning content. It is about building confidence, curiosity, and helping students feel proud of what they can achieve. I want to be the kind of mentor who helps students grow in both skill and self-belief.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"9d731d22-46bf-4434-ae30-7a35e9184710\"}":{"__typename":"School","uuid":"9d731d22-46bf-4434-ae30-7a35e9184710","name":"Krobo Girls Presbyterian Senior High School","city":"Krobo Odumasi","type":"HIGH","state":"Eastern Region","country":"Ghana","zip":"+233"},"Education:{\"uuid\":\"ef4fd688-0d1d-4b75-918f-27363bc0d165\"}":{"__typename":"Education","uuid":"ef4fd688-0d1d-4b75-918f-27363bc0d165","school":{"__ref":"School:{\"uuid\":\"9d731d22-46bf-4434-ae30-7a35e9184710\"}"},"startYear":"2012","endYear":"2015","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ac3b1132-41ad-4d93-8d6d-56c94caf18f7\"}":{"__typename":"School","uuid":"ac3b1132-41ad-4d93-8d6d-56c94caf18f7","name":"Rensselaer Polytechnic Institute","city":"Troy","type":"COLLEGE","state":"New York","country":"United States","zip":"12180"},"Education:{\"uuid\":\"01763da8-0adb-4f57-9d11-2d4b730f44ab\"}":{"__typename":"Education","uuid":"01763da8-0adb-4f57-9d11-2d4b730f44ab","school":{"__ref":"School:{\"uuid\":\"ac3b1132-41ad-4d93-8d6d-56c94caf18f7\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2025","major":"Aerospace Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"badd300f-faed-441a-a924-ee90cb6387da\"}":{"__typename":"MentorPublicProfile","uuid":"badd300f-faed-441a-a924-ee90cb6387da","displayName":"Elizabeth A.","slug":"elizabeth-ameke","biography":"\u003cp\u003eHi! I’m passionate about \u003cstrong\u003eaerospace, mechanical engineering, mathematics, and expanding access to STEM through mentorship\u003c/strong\u003e. I’ve always loved taking big ideas and turning them into something real, whether that means solving a technical problem, designing a system, building a project, or helping someone else realize what they’re capable of. That mix of creativity and problem-solving is what first drew me to engineering, and it’s also what I love bringing into my work with students.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy background is in \u003cstrong\u003eaerospace and mechanical engineering\u003c/strong\u003e, and I especially enjoy mentoring students in \u003cstrong\u003emathematics, physics, aerospace, mechanical engineering, and STEM project development\u003c/strong\u003e. I also love supporting \u003cstrong\u003epassion projects\u003c/strong\u003e involving \u003cstrong\u003eentrepreneurship, content creation, and portfolio-building\u003c/strong\u003e. Whether a student wants to launch an idea, create something original, or build a body of work they are proud of, I enjoy helping them turn that interest into a clear plan and a meaningful outcome.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve been honored to receive recognition for both my academic work and broader impact in STEM. I was featured in the \u003cstrong\u003eSociety of Women Engineers magazine’s “Women Engineers You Should Know,”\u003c/strong\u003e selected as a \u003cstrong\u003eUnited Nations General Assembly Delegate and Young Leader\u003c/strong\u003e through \u003cstrong\u003eThe Queen Elizabeth II Commonwealth Trust Fund\u003c/strong\u003e, and received a \u003cstrong\u003eGraduate Student Service Excellence Award Honorary Mention\u003c/strong\u003e from the \u003cstrong\u003eRPI Office of Graduate Education\u003c/strong\u003e. I was also recognized by \u003cstrong\u003eShe Leads Africa, UrbanGeekz, SWIS Africa,\u003c/strong\u003e and \u003cstrong\u003eLeading Ladies of Aerospace and Defense\u003c/strong\u003e, and received academic scholarships from \u003cstrong\u003eWomen in Engineering Ghana\u003c/strong\u003e and the \u003cstrong\u003eAkua Kuenyehia Foundation\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eAs a mentor, I care about helping students feel both \u003cstrong\u003echallenged and supported\u003c/strong\u003e. I want sessions to feel thoughtful, engaging, and encouraging — a space where students can ask big questions, try ambitious ideas, and build confidence as they go. I know great mentorship is not just about being knowledgeable; it’s also about building real connection, making learning exciting, and helping students feel proud of what they create.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of STEM, I enjoy \u003cstrong\u003ebaking banana bread\u003c/strong\u003e, and I fully support the idea that engineering and baking have a lot in common: precision, creativity, and occasional unexpected results.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAbove all, I want students to feel inspired, capable, and excited about their own potential.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"OQ94G02L1w00AI9uw9cvzrXfVOK02MoN202uKR4MOgOcwKY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is being internationally recognized not just for my work in STEM, but also for the impact I’ve tried to make through it. Being featured in the \u003cstrong\u003eSociety of Women Engineers magazine’s “Women Engineers You Should Know”\u003c/strong\u003e and being selected as a \u003cstrong\u003eUnited Nations General Assembly Delegate and Young Leader\u003c/strong\u003e were both really meaningful moments for me.\u003c/p\u003e\u003cp\u003eWhat I’m proudest of, though, is what those experiences represent. For me, engineering has never just been about personal achievement — it’s also been about opening doors, creating opportunities, and showing other young people what’s possible. That’s something I care deeply about, and it means a lot to me that my work has been recognized in that way.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Aerospace Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e55896bb-2be4-4fe0-a6d9-c01a0bbc449b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cbc1468e-bb6e-426b-8a3b-f5b16deecc17/-/preview/-/format/jpg/","https://ucarecdn.com/69cf8fb2-e843-4d67-843b-bceb72fe4aa3/-/preview/-/format/jpg/","https://ucarecdn.com/85207d41-e83f-4560-9f44-03ad606aca0d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ef4fd688-0d1d-4b75-918f-27363bc0d165\"}"},{"__ref":"Education:{\"uuid\":\"01763da8-0adb-4f57-9d11-2d4b730f44ab\"}"}],"hiredAt":"2026-04-05T17:46:22.358Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Physics","Academic Coaching","Executive Function","K-6 Storybook","Creative Writing","Video / Photography","Visual Arts / Graphic Design","Business / Entrepreneurship","Web Design","STEM Project","Aviation / Aerospace","Public Speaking","Debate"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/f95d5f7c-bbc0-48b5-a094-ea5e231907d2/"],"restrictedProfileVisibility":fal
