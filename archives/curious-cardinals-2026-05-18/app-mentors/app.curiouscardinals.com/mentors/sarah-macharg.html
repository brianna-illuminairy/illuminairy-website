xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6d934a1a-fd2d-4247-8a61-2fdb2820cda1\"}":{"__typename":"DeepDives","uuid":"6d934a1a-fd2d-4247-8a61-2fdb2820cda1","content":"\u003cp\u003eWhenever I tell people I study both Political Science and Physics, they ask: “...Why?”\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFirst, pure interest. I’ve always liked math, and I had a great physics teacher in high school. I wanted to learn more about these fields while I still could, and I realized physics would allow me to continue my math education while contextualizing it with real-world, mind-boggling phenomena.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSecond, I believe that education is about developing different modes of thinking and problem-solving. Having always been an “enthusiastic generalist,” I would have been remiss not to use this opportunity for self-betterment to cultivate both quantitative and humanistic skills, widening the scope of problems I will be able to understand and help solve in the future. I didn’t want to find myself backing away from problems that seemed too technical or complicated.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThird, in our modern reality, science and technology are ubiquitous. Some of our greatest need for global cooperation lies in climate change, renewable energy, nuclear weapons management, and Al; each of these are deeply tied to math/physics, and require technical know-how to discuss critically. I didn’t necessarily want to become an expert in any one of these issues, but I wanted to prepare myself to learn quickly, think clearly, and speak productively with subject-matter experts. I hope my background will allow me to bridge fields and cultures to solve the problems that matter most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"b42d30a5-5018-43cb-9f9a-3470c6c4d995\"}":{"__typename":"School","uuid":"b42d30a5-5018-43cb-9f9a-3470c6c4d995","name":"The Davidson Academy","city":"Reno","type":"HIGH","state":"Nevada","country":"United States","zip":"89503"},"Education:{\"uuid\":\"e8564a71-e528-4a8e-9933-7963868f7964\"}":{"__typename":"Education","uuid":"e8564a71-e528-4a8e-9933-7963868f7964","school":{"__ref":"School:{\"uuid\":\"b42d30a5-5018-43cb-9f9a-3470c6c4d995\"}"},"startYear":"2009","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"3a4ee8d3-8cb8-43bc-a5f7-167967432382\"}":{"__typename":"Education","uuid":"3a4ee8d3-8cb8-43bc-a5f7-167967432382","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Physics, Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"c06140e6-ca2e-458a-90cc-da35987e7c1e\"}":{"__typename":"MentorPublicProfile","uuid":"c06140e6-ca2e-458a-90cc-da35987e7c1e","displayName":"Sarah M.","slug":"sarah-macharg","biography":"\u003cp\u003eHello! My name is Sarah MacHarg. I'm from Reno, Nevada (the biggest little city in the world!), but I'm currently at the University of Chicago, where I'm working toward my Master's in Public Policy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the classroom, I'm interested in political science, international relations, foreign languages, physics, and math. Outside of the classroom, I'm interested in pretty much everything! Recently, I've been spending a lot of my time singing a cappella, dancing, swimming, and knitting.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePrior to coming to the University of Chicago, I attended Stanford University, where I received a B.S. in Physics and a B.A. in Political Science. During my time as an undergraduate, I completed internships at CERN (the European Organization for Nuclear Research), the East Asia Institute, Alariss Global, and the National Institutes of Health. I also was involved in research on authoritarianism and border conflicts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore I went to Stanford, I spent a year living in Beijing, where I studied Mandarin through the U.S. State Department's National Security Language Initiative for Youth (NSLI-Y) scholarship. I'm proficient in Mandarin and Spanish, and I'm passionate about helping students find opportunities to get out and explore the world!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy junior year of college, I successfully composed a 5-minute string quartet, which I got to hear a live performance of later in the year. This was one of the most difficult and most satisfying things I did in college. When I first began, I wasn't even sure if I would be able to finish, as I had never written something that large in scope, and I'm not even a strings player...I'm a pianist! Thanks to my professor's encouragement, though, I was able to build confidence over the course of the quarter and create a finished product that I was really proud of!\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Physics, Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6d934a1a-fd2d-4247-8a61-2fdb2820cda1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/572db9fc-9300-440e-81b3-7e5c9e84c54a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e8564a71-e528-4a8e-9933-7963868f7964\"}"},{"__ref":"Education:{\"uuid\":\"3a4ee8d3-8cb8-43bc-a5f7-167967432382\"}"}],"hiredAt":"2024-10-09T11:24:06.490Z","topics":["Music","Law / Government / Policy","World Cultures","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Journalism","Algebra I","Algebra II","Physics","Spanish","Mandarin Chinese","Writing","6-8 Grade Science"],"communityBadges":["https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/","https://ucarecdn.com/fe18a7d8-d65b-4523-ab43-2a809d9f45e6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sarah-macharg\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c06140e6-ca2e-458a-90cc-da35987e7c1e\"}"}}},"_sentryTraceData":"97d519591818427b8b9923fc977feb04-a0c40540ea9ecd34-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=97d519591818427b8b9923fc977feb04,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sarah-macharg"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'scr
