xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ffca640a-c4bb-4d32-9cef-b8d86efad2c1\"}":{"__typename":"Favorites","uuid":"ffca640a-c4bb-4d32-9cef-b8d86efad2c1","photoUrl":"https://ucarecdn.com/f108051a-8a4a-4aee-9a96-a7002f812afc/","title":"Football","type":"SPORT"},"Favorites:{\"uuid\":\"caa4d484-2063-4c21-85c7-71aa51e0b206\"}":{"__typename":"Favorites","uuid":"caa4d484-2063-4c21-85c7-71aa51e0b206","photoUrl":"https://ucarecdn.com/dae1cb74-9321-4623-ad7d-c9f2eb531c4a/","title":"San Fransico 49ers ","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"2d3851a7-3b46-416a-ae74-3af4544bba1e\"}":{"__typename":"Favorites","uuid":"2d3851a7-3b46-416a-ae74-3af4544bba1e","photoUrl":"https://ucarecdn.com/60ee20c3-d0b4-4cb3-91c1-e92c4f1747e5/","title":"Shohei Ohtani","type":"ATHLETE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e1406836-782b-401f-93fc-d36e3947fd35\"}":{"__typename":"DeepDives","uuid":"e1406836-782b-401f-93fc-d36e3947fd35","content":"\u003cp\u003eBecause one good mentor can change how you see yourself. I’ve seen how having someone take your ideas seriously can unlock confidence and direction. Mentorship matters to me because it’s how curiosity turns into clarity and potential turns into momentum.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"2b42f0ad-1a1a-49a6-a18f-de6db839f601\"}":{"__typename":"DeepDives","uuid":"2b42f0ad-1a1a-49a6-a18f-de6db839f601","content":"\u003cp\u003eI’m most proud of helping students publish or complete work they once doubted they were capable of. Watching someone move from “I’m not sure this is good” to “I made this” is the most rewarding part of teaching. Seeing that impact multiplied through nonprofits and campaigns I’ve helped build makes the work feel even more meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0464b155-5772-477e-98e2-643da2346f03\"}":{"__typename":"DeepDives","uuid":"0464b155-5772-477e-98e2-643da2346f03","content":"\u003cp\u003eI’d say don’t wait for permission to take your interests seriously. You don’t need to have everything figured out yet but learning how to write clearly, ask good questions, and follow your curiosity will carry you further than checking the “right” boxes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d616f2a0-ff02-4345-babb-877ea5b6979c\"}":{"__typename":"DeepDives","uuid":"d616f2a0-ff02-4345-babb-877ea5b6979c","content":"\u003cp\u003eBecause mentorship multiplies impact. You can do meaningful work on your own, but helping students learn how to think, write, and lead for themselves creates change that lasts far beyond any single project. I choose mentorship because it’s where growth compounds.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"53c4ebce-5310-4d9b-ae1e-ea00d1c5e485\"}":{"__typename":"School","uuid":"53c4ebce-5310-4d9b-ae1e-ea00d1c5e485","name":"North Salinas High School","city":"Salinas","type":"HIGH","state":"California","country":"United States","zip":"93906"},"Education:{\"uuid\":\"0c12779d-4ac6-4173-b187-727b06aa9049\"}":{"__typename":"Education","uuid":"0c12779d-4ac6-4173-b187-727b06aa9049","school":{"__ref":"School:{\"uuid\":\"53c4ebce-5310-4d9b-ae1e-ea00d1c5e485\"}"},"startYear":"2019","endYear":"2021","expectedGradYear":"2021","major":"history \u0026 political science","degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"f3e6ea57-fad1-4c87-94bf-09210a66a99a\"}":{"__typename":"Education","uuid":"f3e6ea57-fad1-4c87-94bf-09210a66a99a","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":"2026","expectedGradYear":"2026","major":"history \u0026 political science","degree":null},"MentorPublicProfile:{\"uuid\":\"85617118-96cb-43d7-a1f2-97085b082c13\"}":{"__typename":"MentorPublicProfile","uuid":"85617118-96cb-43d7-a1f2-97085b082c13","displayName":"Michael N.","slug":"michael-ndubisi","biography":"\u003cp\u003eHi! I’m Michael, a senior at Yale College double majoring in History and Political Science. I’m a journalist, community organizer, and mentor with over eight years of experience helping students develop strong voices through writing, leadership, and real-world projects they’re proud to share.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m passionate about helping students turn their interests, whether in writing, history, civic engagement, or social impact, into clear, confident work that opens doors and opportunities both academically and personally.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA BIT ABOUT ME\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I was in middle and high school, I loved writing, debating, and learning about politics but didn’t always know how to turn those interests into something concrete or meaningful beyond the classroom. Over time, I learned that the key wasn’t choosing \u003cem\u003eone\u003c/em\u003e path, but learning how to connect skills across disciplines. At Yale and beyond, I learned to do that by:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eServing as an editor and columnist at the \u003cstrong\u003eYale Daily News\u003c/strong\u003e, mentoring young writers and helping students publish impactful work\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWriting speeches and policy memos for \u003cstrong\u003eelected officials\u003c/strong\u003e and public leaders\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding and leading \u003cstrong\u003esocial impact organizations \u003c/strong\u003eand\u003cstrong\u003e political campaigns\u003c/strong\u003e, including winning an election in my hometown to serve as a delegate to the California Democratic Party\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelping grow a \u003cstrong\u003ebilingual nonprofit newsroom\u003c/strong\u003e that trains young people in journalism and civic engagement\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI love showing students that strong writing, clear thinking, and leadership skills can take them far. Whether they’re interested in higher education, journalism, law, public service, or entrepreneurship, those skills are transferable and powerful in \u003cstrong\u003eevery\u003c/strong\u003e path they choose.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHOW I CAN HELP YOU\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI specialize in working with middle school, high school, and college-prep students on:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege-readiness \u0026amp; application support\u003c/strong\u003e\u003cbr\u003e(personal statements, supplemental essays, resumes, interviews)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWriting \u0026amp; communication\u003c/strong\u003e\u003cbr\u003e(essays, journalism, creative nonfiction, speeches, op-eds)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePersonal passion \u0026amp; social impact projects\u003c/strong\u003e\u003cbr\u003e(starting a club or nonprofit, launching a student newspaper or podcast, designing a community initiative)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCivics, history, and government\u003c/strong\u003e\u003cbr\u003e(course support, research projects, and conceptual mastery)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLeadership \u0026amp; public speaking\u003c/strong\u003e\u003cbr\u003e(debate, presentations, confidence-building)\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eMy goal is always to help students \u003cem\u003eproduce something real and tangible \u003c/em\u003ethey can proudly point to and attribute to their success.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWHY I’M QUALIFIED TO HELP\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI bring both academic \u003cstrong\u003erigor\u003c/strong\u003e and r\u003cstrong\u003eeal-world experience\u003c/strong\u003e to my mentoring.\u003c/p\u003e\u003cp\u003eWith a background that includes eight years of teaching and mentoring, leadership roles in journalism and civic organizations, and hands-on experience writing and organizing at a professional level, I know how to guide students from early ideas to finished work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYou can trust that our sessions will be structured, purposeful, and supportive — and students can trust that I’m invested in their growth, not just their grades.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA TYPICAL SESSION MIGHT INCLUDE\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBrainstorming\u003c/strong\u003e ideas and narrowing them into a clear, achievable project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down writing or research into manageable, \u003cstrong\u003econfidence-building \u003c/strong\u003esteps\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorkshopping drafts together with \u003cstrong\u003eactionable\u003c/strong\u003e feedback\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConnecting schoolwork to \u003cstrong\u003ereal-world\u003c/strong\u003e applications and goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a short-term roadmap so students always know what comes \u003cstrong\u003enext\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eOUTSIDE OF MENTORING\u003c/strong\u003e\u003c/h2\u003e\u003cbr\u003e\u003cp\u003eOutside of sessions, I’m usually editing writing, thinking about how institutions shape our lives, or helping young writers publish their first piece. I genuinely love the moment when a student realizes, \u003cem\u003e“Wait—I can actually do this.” \u003c/em\u003eAnd the weeks of work that go into turning that idea into reality.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re excited to build strong skills, work on meaningful projects, and grow your confidence as a writer and leader, I’d \u003cstrong\u003elove\u003c/strong\u003e to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"mf02vXQAHzaBkfkhfCARCdDx74GDoi2mean101ynHBYms","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ffca640a-c4bb-4d32-9cef-b8d86efad2c1\"}"},{"__ref":"Favorites:{\"uuid\":\"caa4d484-2063-4c21-85c7-71aa51e0b206\"}"},{"__ref":"Favorites:{\"uuid\":\"2d3851a7-3b46-416a-ae74-3af4544bba1e\"}"}],"causesSupported":[],"major":"history \u0026 political science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e1406836-782b-401f-93fc-d36e3947fd35\"}"},{"__ref":"DeepDives:{\"uuid\":\"2b42f0ad-1a1a-49a6-a18f-de6db839f601\"}"},{"__ref":"DeepDives:{\"uuid\":\"0464b155-5772-477e-98e2-643da2346f03\"}"},{"__ref":"DeepDives:{\"uuid\":\"d616f2a0-ff02-4345-babb-877ea5b6979c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d02ef976-6bbc-41ab-b548-4db591a9b9df/-/preview/-/format/jpg/","https://ucarecdn.com/99ea04aa-59df-44bb-aa2a-df25b0cc65c4/-/preview/-/format/jpg/","https://ucarecdn.com/9452c13f-736a-428a-b7b6-5d6fbe6ea6ca/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0c12779d-4ac6-4173-b187-727b06aa9049\"}"},{"__ref":"Education:{\"uuid\":\"f3e6ea57-fad1-4c87-94bf-09210a66a99a\"}"}],"hiredAt":"2026-01-28T16:29:21.329Z","topics":["K-5 Grade Math","Pre-Algebra","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","History Project","Sports Journalism","Law / Government / Policy","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/","https://ucarecdn.com/8447c46d-a4b5-464d-8b8c-1daae5a90ac6/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":
