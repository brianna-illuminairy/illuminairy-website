xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ca52306d-8cf4-4ada-a322-267fcd11009b\"}":{"__typename":"Favorites","uuid":"ca52306d-8cf4-4ada-a322-267fcd11009b","photoUrl":"https://ucarecdn.com/29634053-f02a-4a39-a209-835ec2c20967/","title":"Tokyo","type":"CITY"},"Favorites:{\"uuid\":\"4e650d75-bdb8-4ede-83aa-c8ebc3d0f54d\"}":{"__typename":"Favorites","uuid":"4e650d75-bdb8-4ede-83aa-c8ebc3d0f54d","photoUrl":"https://ucarecdn.com/29634053-f02a-4a39-a209-835ec2c20967/","title":"Interstellar","type":"MOVIE"},"Favorites:{\"uuid\":\"d5764f32-a3e2-4dde-8d1f-7e34e212a235\"}":{"__typename":"Favorites","uuid":"d5764f32-a3e2-4dde-8d1f-7e34e212a235","photoUrl":"https://ucarecdn.com/29634053-f02a-4a39-a209-835ec2c20967/","title":"Tom Brady","type":"ATHLETE"},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"511f4cb1-e504-48bd-8cf4-1a3837940936\"}":{"__typename":"DeepDives","uuid":"511f4cb1-e504-48bd-8cf4-1a3837940936","content":"\u003cp\u003eOne random night I went to bed knowing that I had to get up the next morning and send my mom to the train station at 9:30 so she could go to work. \u003cbr\u003e\u003cbr\u003eBefore waking up I had the most vivid dream, I woke up, brushed my teeth, got my jacket and keys, met my mom by the car, drove the car, took all the necessary turns, and arrived at the train station at 9:30. \u003cbr\u003e\u003cbr\u003eThen I woke up and did the exact same thing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2594bf40-579f-49aa-a09a-2eae30a17f64\"}":{"__typename":"DeepDives","uuid":"2594bf40-579f-49aa-a09a-2eae30a17f64","content":"\u003cp\u003eSince I became the marketing lead at TEDxBrownU, we've begun creating conference trailers each year. They are a mix of animation and live-action footage combining the talents of animators, videographers, graphic designers, voice-over artists, and sound designers in hopes of creating something special. It is a treat to lead a project that is truly the culmination of a year's worth of design and marketing decisions.\u003cbr\u003e\u003cbr\u003eAs I'm typing, we have a deadline of 5 days to finish our current conference trailer for our 2024 conference, Mirage. I'm scrambling to finish the animation and stitch together the voiceover with the video, but I love every second of it. Getting the chance to watch it at the beginning of the conference is a treat and something that fulfills me greatly. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"69d9b0ec-6579-4b8b-974c-cd2e72022ea1\"}":{"__typename":"DeepDives","uuid":"69d9b0ec-6579-4b8b-974c-cd2e72022ea1","content":"\u003cp\u003eMy greatest source of motivation is not just a singular thing, but I suppose it condenses down to these ideas.\u003cbr\u003e\u003cbr\u003eFirst, I live by setting goals for myself, milestones that I try my best to achieve that are challenging, and flexible. I want to be able to sculpt my own reality by working towards goals that align with my values. If my goals aren't met, that's okay, I pivot and adapt.\u003cbr\u003e\u003cbr\u003eAnother source of motivation for myself is intentionally spending my time. This in some ways is perhaps contradictory slightly to the first goal, but beyond doing things that work towards my goals, I want to be able to say that a certain chunk of time was well spent and well worth it. Beyond everything we have (goals, values, plans, etc.) all we have is time, I want to spend it happily and intentionally. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"c3ca8fd9-3e66-4fe4-85e7-34c0231176cf\"}":{"__typename":"DeepDives","uuid":"c3ca8fd9-3e66-4fe4-85e7-34c0231176cf","content":"\u003cp\u003eAs a high school student, I would say I was driven, focused, carefree at times, and narrow-minded. I always cared about my academics as it was something my parents instilled in me from a young age. I worked hard in my classes and tried harder in my extracurriculars. What I value however is that my parents allowed me to enjoy my life as a teenager; I frequently spent time with my friends and my life outside of school was fun which I think helped me academically as well. I was a bit narrow-minded however, as I happened to find things I enjoyed doing extracurricularly in school but I wished that I was more driven by some of my earlier passions and interests. The pressure of college admissions is difficult to navigate at that age, but I believe a passion focused approach with less thinking of \"what can I do to get into college\" is super beneficial for students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"8e28867a-9f1a-4604-8bc5-7a23989de4ae\"}":{"__typename":"School","uuid":"8e28867a-9f1a-4604-8bc5-7a23989de4ae","name":"Sharon High School","city":"Sharon","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02067"},"Education:{\"uuid\":\"22729800-8abf-45dd-8374-08d63aa0c55d\"}":{"__typename":"Education","uuid":"22729800-8abf-45dd-8374-08d63aa0c55d","school":{"__ref":"School:{\"uuid\":\"8e28867a-9f1a-4604-8bc5-7a23989de4ae\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"75dc83f4-00f2-41f8-8c0e-cb1d766aa809\"}":{"__typename":"Education","uuid":"75dc83f4-00f2-41f8-8c0e-cb1d766aa809","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience, Computer Science","degree":null},"Testimonial:c2fcdb87-8f44-4e42-b88b-7e0f111c20e8":{"__typename":"Testimonial","id":"c2fcdb87-8f44-4e42-b88b-7e0f111c20e8","text":"Hi Steven, thanks for tutoring me for all this time I think that I have gotten a lot better throughout this process as you have helped me recognize and reinforce concepts that would later help me do good on my tests.\n\n- Jacob","date":"2025-05-30 02:35:28.002+00","rating":5,"endorser":{"__typename":"Endorser","name":"Jacob Domingo","tagline":"","avatar":null}},"Testimonial:bb1a8b2a-f3ce-4c9c-b19c-db7b610b7008":{"__typename":"Testimonial","id":"bb1a8b2a-f3ce-4c9c-b19c-db7b610b7008","text":"My son, Dylan, has really enjoyed working with Steven this year. Seeing how excited he is in taking on and creating new projects and the enormous growth he's had in a short period of time has been wonderful. Dylan looks forward to every session with Steven!","date":"2025-05-28 22:37:53.872+00","rating":5,"endorser":{"__typename":"Endorser","name":"Dorothy","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"d73c8531-e2e9-45fa-8a82-5312a936ba76\"}":{"__typename":"MentorPublicProfile","uuid":"d73c8531-e2e9-45fa-8a82-5312a936ba76","displayName":"Steven L.","slug":"steven-liao","biography":"\u003cp\u003eHi there! My name is Steven Liao - I'm a Senior at Brown University studying Neuroscience and Computer Science! In my free time you would probably find me searching for new places to eat, playing tennis or basketball with my friends, and learning! Above all else I find value in spending my time finding and creating experiences with people that will have a lasting impression on me in the future. \u003cbr\u003e\u003cbr\u003eWhen I was younger, I was captain of my High School Debate and Mock Trial teams and was the class Vice President. As I continued into college, I became the marketing lead at TEDxBrownU, a role combining much of the skills I had learned prior, and began to conduct research in a few labs on campus. At each of these stages, I had amazing mentors to guide me and assist my learning in a way where I wasn't afraid to be myself. \u003cbr\u003e\u003cbr\u003eNow, I'm eager to pay it forward by creating learning environments where curiosity and creativity are celebrated. I believe in fostering spaces where uncertainty is embraced as a natural part of the learning journey. My goal is to help students unlock their full potential and equip them with effective learning strategies, critical thinking skills, and problem-solving techniques.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLet's embark on this journey together, where learning is engaging, enjoyable, and empowering!\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"N43iWOgPTEL101aNoAMOlDbrM5DyIySn01r7F5yQ7c014g","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ca52306d-8cf4-4ada-a322-267fcd11009b\"}"},{"__ref":"Favorites:{\"uuid\":\"4e650d75-
