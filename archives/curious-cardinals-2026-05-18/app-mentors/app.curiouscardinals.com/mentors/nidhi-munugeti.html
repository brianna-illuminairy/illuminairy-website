xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1d7af35b-ec18-4de3-8cca-8a1a12d3d916\"}":{"__typename":"DeepDives","uuid":"1d7af35b-ec18-4de3-8cca-8a1a12d3d916","content":"\u003cp\u003eThe biggest piece of advice I would give my middle and high school self is to enjoy the moment! Time passes much faster than you expect, and as someone who often stressed herself out, I’ve learned that finding balance and making time for the things you enjoy is just as important as working hard. I would also remind myself not to procrastinate, something that I learned later on, and that getting a head start makes a huge difference. Since time can slip by before you realize it, I’d tell myself not to delay opportunities or experiences I was considering, because you never know what the future might hold!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b92d8270-b5b5-4dbe-80db-6d1bce6845f4\"}":{"__typename":"DeepDives","uuid":"b92d8270-b5b5-4dbe-80db-6d1bce6845f4","content":"\u003cp\u003eIn my spare time, I love exploring new places with friends and spending time outdoors! Growing up in Washington, hiking has always been one of my favorite activities, and it combines perfectly with another passion of mine: photography. I especially enjoy capturing nature through my lens during hikes, usually with my dog, Nemo, who keeps me motivated even on the toughest trails. Beyond the outdoors, I also love baking and am always experimenting with new recipes,\u0026nbsp; from cinnamon rolls to scones, and love the process as well as sharing my creations with others!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"faefeff3-94b7-4777-a505-5bd3f32234d2\"}":{"__typename":"DeepDives","uuid":"faefeff3-94b7-4777-a505-5bd3f32234d2","content":"\u003cp\u003eMentorship matters to me because I have personally experienced how impactful it can be. Having someone to turn to for guidance, questions, or uncertainties provides invaluable support, especially when navigating challenging subjects or big academic decisions. Throughout my life, I’ve been fortunate to have both formal and informal mentors who encouraged, challenged, and inspired me grow. Their influence showed me that mentorship is not only about advice, but also about having someone who believes in your potential! That is why I chose to be a mentor at Curious Cardinals, to provide students with the same encouragement and guidance that helped me pursue my passions and reach my goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"25aa2092-467a-4534-9b02-67b5c1251562\"}":{"__typename":"DeepDives","uuid":"25aa2092-467a-4534-9b02-67b5c1251562","content":"\u003cp\u003eMy dream job is to become a pediatrician with my own clinic! I’ve always been passionate about medicine, and growing up I was inspired by my pediatricians who not only cared for me, but also reassured my family during stressful times. I want to provide that same comfort and support to kids and their families while applying my medical knowledge and training. My goal is to create a clinic where I can build lasting relationships with patients and be the kind of doctor they feel comfortable and excited to visit!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"1cfaef56-bf47-4dae-868f-8b9751261cae\"}":{"__typename":"School","uuid":"1cfaef56-bf47-4dae-868f-8b9751261cae","name":"Interlake High School","city":"Bellevue","type":"HIGH","state":"Washington","country":"United States","zip":"98008"},"Education:{\"uuid\":\"e57e2847-042a-4133-9617-1678e8dacf6d\"}":{"__typename":"Education","uuid":"e57e2847-042a-4133-9617-1678e8dacf6d","school":{"__ref":"School:{\"uuid\":\"1cfaef56-bf47-4dae-868f-8b9751261cae\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"1d3a1c69-fa2c-4a2a-8505-572cdef45857\"}":{"__typename":"Education","uuid":"1d3a1c69-fa2c-4a2a-8505-572cdef45857","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Psychobiology","degree":null},"MentorPublicProfile:{\"uuid\":\"519d3049-0863-406e-8099-77d7c17a02ac\"}":{"__typename":"MentorPublicProfile","uuid":"519d3049-0863-406e-8099-77d7c17a02ac","displayName":"Nidhi M.","slug":"nidhi-munugeti","biography":"\u003cp\u003eHi! My name is Nidhi, and I am a second-year student at UCLA majoring in Psychobiology. I have always been fascinated by the way our minds work and the “why” behind biological processes, and my major allows me to study exactly that: the intersection of biology, psychology, and behavior. I am currently on the pre-medical track, taking a variety of science courses that challenge me to think critically while also deepening my passion for medicine and mental health. Originally from Washington, I have enjoyed coming to Los Angeles, both for the academic opportunities UCLA provides and for the chance to explore a new city.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I am passionate about learning and applying knowledge in ways that connect to real-world experiences. My courses in psychology, biology, and chemistry have given me a strong foundation in the sciences, but I also care deeply about mentorship and supporting others in their learning. I know from personal experience how valuable it is to have someone to guide you, and I strive to be that person for others, whether it’s helping to clarify confusing subjects, providing encouragement, or being a sounding board for ideas.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of class, I have sought out experiences that allow me to engage with medicine and healthcare firsthand. I have volunteered and worked in a range of clinical environments, from hospitals to pediatric clinics, which has given me a broader perspective on patient care and the healthcare system. In addition, I am involved in clubs at UCLA that allow me to give back to the community through volunteering at shelters, food donation sites, and hospitals in the LA area. One of my favorite experiences has been working with local high school students, introducing them to the field of medicine and helping them find pathways to pursue their healthcare goals. Mentorship has always been an important part of my life and as someone who has greatly benefited from mentors, I know how impactful it can be to have support while navigating academic and personal challenges.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA unique experience I had in high school was organizing a blood drive with my friends. This taught me the importance of planning, communication, and teamwork, but it also showed me how rewarding it is to contribute to something that directly impacts others. Experiences like these continue to motivate me to take on leadership roles and pursue opportunities to make a difference.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics and volunteering, I love spending time with friends, exploring new places, and hiking, especially with my dog, Nemo! I also enjoy baking and photography, both of which give me creative outlets and balance to my busy schedule. Overall, I am passionate about pursuing a career in healthcare, supporting others through mentorship, and building meaningful connections with the people around me!\u003c/p\u003e","teachingVideoPlaybackId":"He2Vy00VPz02kGI1NrqB4U01JeG86nUD3K7oHy0102SAIeno","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychobiology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1d7af35b-ec18-4de3-8cca-8a1a12d3d916\"}"},{"__ref":"DeepDives:{\"uuid\":\"b92d8270-b5b5-4dbe-80db-6d1bce6845f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"faefeff3-94b7-4777-a505-5bd3f32234d2\"}"},{"__ref":"DeepDives:{\"uuid\":\"25aa2092-467a-4534-9b02-67b5c1251562\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a16ef0a4-a1c9-456d-ad02-eb6c690e34c9/-/preview/-/format/jpg/","https://ucarecdn.com/c46e6329-380a-424b-b0a2-53f09785ea0d/-/preview/-/format/jpg/","https://ucarecdn.com/07c5300b-0551-4493-860c-da817f84f655/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e57e2847-042a-4133-9617-1678e8dacf6d\"}"},{"__ref":"Education:{\"uuid\":\"1d3a1c69-fa2c-4a2a-8505-572cdef45857\"}"}],"hiredAt":"2025-08-19T00:36:48.474Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Statistics","Biology","6-8 Grade Science","Writing","College Essay Writing","Academic Coaching","Executive Function","Reading","K-6 Storybook","Creative Writing","Video / Photography","History Project","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nidhi-munugeti\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"519d3049-0863-406e-8099-77d7c17a02ac\"}"}}},"_sentryTraceData":"d2edbc8a4b1c40cf959e532a0763c557-86bcfb88349fca09-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d2edbc8a4b1c40cf959e532a0763c557,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"nidhi-munugeti"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
