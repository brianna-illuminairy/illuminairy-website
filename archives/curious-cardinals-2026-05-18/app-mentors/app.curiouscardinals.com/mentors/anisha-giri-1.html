xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"72337a76-ede9-46b4-908c-656bc33dfb92\"}":{"__typename":"DeepDives","uuid":"72337a76-ede9-46b4-908c-656bc33dfb92","content":"\u003cp\u003eMy greatest role model and mentor is my mother. She is an incredible, strong woman who has shaped me into who I am today. Her unwavering belief in me has taught me to believe in myself, no matter the challenges I face. She’s not only shown me the importance of resilience, but also instilled values of kindness, hard work, and perseverance. Everything I know today, from life lessons to how to handle adversity, comes from her. Her example inspires me every day to push forward with confidence, and I am forever grateful for her guidance, love, and the wisdom she’s shared with me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"64dae414-90d4-4ee3-86bb-09ade3e49608\"}":{"__typename":"DeepDives","uuid":"64dae414-90d4-4ee3-86bb-09ade3e49608","content":"\u003cp\u003eIf I could give one piece of advice to my middle school self, it would be to go confidently and always remember your value. Back then I often second-guessed myself, worried too much about what others thought, and held back from opportunities because I didn’t think I was ready or good enough. But looking back I realize that the moments when I believed in myself, when I took chances, spoke up, or stepped outside my comfort zone, were the moments that shaped me the most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c67b4056-3610-4c03-b434-9ad3bd5588d5\"}":{"__typename":"DeepDives","uuid":"c67b4056-3610-4c03-b434-9ad3bd5588d5","content":"\u003cp\u003eI’m passionate about mentoring because I truly believe in the transformative power of education and its ability to create equal opportunities for everyone. I understand that access to education can change lives, helping individuals break through barriers, unlock their potential, and achieve their dreams. Through mentoring, I have the chance to make a real impact by guiding others and ensuring they have the resources and support they need to succeed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8a8a1078-5409-42a7-b0a2-04402ef6ce6d\"}":{"__typename":"DeepDives","uuid":"8a8a1078-5409-42a7-b0a2-04402ef6ce6d","content":"\u003cp\u003eOne thing I wish to accomplish in my lifetime is to travel to all the continents. I believe that traveling opens up your eyes to new experiences and perspectives in ways that you can’t replicate in your everyday life. Each place has its own unique culture, history, and way of life, and immersing yourself in these environments can teach you so much about the world and about yourself. Traveling pushes you out of your comfort zone and exposes you to challenges and joys you would never encounter by staying in one place.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"edddb376-efa0-4c9a-8ae3-0f32c477cd01\"}":{"__typename":"School","uuid":"edddb376-efa0-4c9a-8ae3-0f32c477cd01","name":"South Lakes High School","city":"Reston","type":"HIGH","state":"Virginia","country":"United States","zip":"20191"},"Education:{\"uuid\":\"268ff665-f7c6-4d30-b5be-86fa3a5b559a\"}":{"__typename":"Education","uuid":"268ff665-f7c6-4d30-b5be-86fa3a5b559a","school":{"__ref":"School:{\"uuid\":\"edddb376-efa0-4c9a-8ae3-0f32c477cd01\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c1091c79-5f09-4976-aaca-b523511c4954\"}":{"__typename":"School","uuid":"c1091c79-5f09-4976-aaca-b523511c4954","name":"Virginia Tech","city":"Blacksburg","type":"COLLEGE","state":"Virginia","country":"United States","zip":"24061"},"Education:{\"uuid\":\"ad74e461-ffa1-46ab-b142-b6d45bc15138\"}":{"__typename":"Education","uuid":"ad74e461-ffa1-46ab-b142-b6d45bc15138","school":{"__ref":"School:{\"uuid\":\"c1091c79-5f09-4976-aaca-b523511c4954\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Business Information Technology Decision Support Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"43f83540-195b-43d0-b503-4fcbe6d6e1eb\"}":{"__typename":"MentorPublicProfile","uuid":"43f83540-195b-43d0-b503-4fcbe6d6e1eb","displayName":"Anisha G.","slug":"anisha-giri-1","biography":"\u003cp\u003eMy name is Anisha Giri, and I’m a student at Virginia Tech, double majoring in Business Information Technology and Cybersecurity Management. Beyond academics, I love reading, listening to music, and finding new ways to connect with people and my community. One of my favorite experiences has been working as an Explainer at the Smithsonian National Air and Space Museum, where I engage with so many different visitors a month, making science topics fun and accessible. I’m also passionate about giving back. Through Alpha Chi Omega, I’ve helped raise over $45,000 for Domestic Violence Awareness as co-chair of the Mock Rock Dance competition. For my Girl Scout Gold Award, I created a year-long reading challenge for K-2 students to inspire a love for books. Whether I’m diving into a new novel, curating the perfect playlist, or working on a project that helps others, I’m always looking for ways to learn, grow, and make a difference. \u003c/p\u003e","teachingVideoPlaybackId":"kRhM9BGgUJhA9oq4LNOXx8nPjuP6kqYsxMQFABdYQhg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business Information Technology Decision Support Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"72337a76-ede9-46b4-908c-656bc33dfb92\"}"},{"__ref":"DeepDives:{\"uuid\":\"64dae414-90d4-4ee3-86bb-09ade3e49608\"}"},{"__ref":"DeepDives:{\"uuid\":\"c67b4056-3610-4c03-b434-9ad3bd5588d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a8a1078-5409-42a7-b0a2-04402ef6ce6d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/edc85f04-13b9-423b-a7bd-cff7d43771f4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"268ff665-f7c6-4d30-b5be-86fa3a5b559a\"}"},{"__ref":"Education:{\"uuid\":\"ad74e461-ffa1-46ab-b142-b6d45bc15138\"}"}],"hiredAt":"2025-03-26T09:45:33.009Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Biology","Writing","Reading","History","Economics","Executive Function"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anisha-giri-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"43f83540-195b-43d0-b503-4fcbe6d6e1eb\"}"}}},"_sentryTraceData":"7ec7a86d72984e2581acb2869b8081bb-9dc307fcad13f8e2-0","_sentryBag
