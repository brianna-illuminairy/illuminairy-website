xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e7bfdb9d-c966-43ef-a914-09cce6d5c50f\"}":{"__typename":"DeepDives","uuid":"e7bfdb9d-c966-43ef-a914-09cce6d5c50f","content":"\u003cp\u003eMy dream job is to write for a living, whether as a speechwriter, policy analyst, academic, or something else entirely. I deeply enjoy the creativity and intentionality involved in writing and see it as a collaborative endeavor. Even though it can seem isolating staring at a blank page, I always find comfort and reward in thinking about the audience for and impact of my writing. I have benefitted hugely from the editors, professors, and other thought collaborators around me in my writing journey, and hope to fulfill that role for others as much as possible moving forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"f75aaf17-a540-4622-aa0f-06e84901172c\"}":{"__typename":"DeepDives","uuid":"f75aaf17-a540-4622-aa0f-06e84901172c","content":"\u003cp\u003eMy older brother is one of my biggest heroes. He is infectiously hard-working and generous. He takes himself seriously and thinks deeply about the world around him, but never too seriously. His soft and fun side keeps him balanced and ensures he never loses sight of what matters most in life –– the people around him. I'm lucky to have him around and like to think at least a few of his best qualities were passed down to the younger sibling!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"b40fbf47-6a96-4a32-8bee-9e8daa61d513\"}":{"__typename":"DeepDives","uuid":"b40fbf47-6a96-4a32-8bee-9e8daa61d513","content":"\u003cp\u003eLast year, as a sophomore at Northwestern, I founded the first student-run political consulting organization on campus. The organization was founded with the dual mission of providing free services to under-resourced local Chicagoland campaigns while creating formative experiences in political consulting for students. After growing our organizational infrastructure, we completed successful partnerships with multiple campaigns during the 2023 municipal elections. \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eI'm particularly proud of this project because I was able to bring together a community of students on campus who, like me, were passionate about politics but didn't have an outlet to get involved. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"85573413-e4a5-4306-a27c-17f1ae669673\"}":{"__typename":"School","uuid":"85573413-e4a5-4306-a27c-17f1ae669673","name":"Montgomery Blair High School","city":"Silver Spring","type":"HIGH","state":"Maryland","country":"United States","zip":"20901"},"Education:{\"uuid\":\"244f43e5-fa42-4ee6-b213-a1c70dfd8703\"}":{"__typename":"Education","uuid":"244f43e5-fa42-4ee6-b213-a1c70dfd8703","school":{"__ref":"School:{\"uuid\":\"85573413-e4a5-4306-a27c-17f1ae669673\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"2f4cd5f0-551d-489a-a351-678c94abdd3d\"}":{"__typename":"Education","uuid":"2f4cd5f0-551d-489a-a351-678c94abdd3d","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"History and Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"15b28181-4b36-4f8a-a5e3-d358141293d0\"}":{"__typename":"MentorPublicProfile","uuid":"15b28181-4b36-4f8a-a5e3-d358141293d0","displayName":"Oliver G.","slug":"oliver-goldman","biography":"\u003cp\u003eI'm a junior at Northwestern University in Evanston, IL originally from the Washington, DC area. Growing up steps from the nation's capitol, I developed an authentic interest in politics at a young age. When I was 12, I started a blog about the intersection of politics, culture, and sports –– surprise, I'm also a big sports fan (go Celtics!) –– writing for an audience of my mom, dad, and the occasional other generous family member.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I further pursued my interests in politics and writing by working as an intern on a congressional campaign and becoming editor-in-chief of my high school's award-winning newspaper. In college, I have tripled-down on these passions, founding the first student-run political consulting organization on campus, completing independent historical research, and completing other internship and work opportunities in politics. \u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I strive to nurture the same authentic passions and interests in others that I was fortunate to identify for myself years ago. My philosophy is to be a trusted friend to my mentees. In that spirit, I make a concerted effort to develop lasting connections by being present to talk about politics, sports, culture, or whatever is on their minds!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History and Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e7bfdb9d-c966-43ef-a914-09cce6d5c50f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f75aaf17-a540-4622-aa0f-06e84901172c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b40fbf47-6a96-4a32-8bee-9e8daa61d513\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0f73b470-cc00-4f13-9fb3-2668d7cf1f21/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"244f43e5-fa42-4ee6-b213-a1c70dfd8703\"}"},{"__ref":"Education:{\"uuid\":\"2f4cd5f0-551d-489a-a351-678c94abdd3d\"}"}],"hiredAt":"2024-02-04T23:38:34.836Z","topics":["Music","History Project","Literature","Philosophy","Film / Theater","Law / Government / Policy","Debate","Public Speaking","Geometry","K-5 Grade Math","Journalism","Pre-Algebra","Precalculus / Trigonometry","Statistics","Writing","Algebra I","Algebra II","College Essay Writing","Academic Coaching","Executive Function","History","Reading"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"oliver-goldman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"15b28181-4b36-4f8a-a5e3-d358141293d0\"}"}}},"_sentryTraceData":"f3a34857458141b69bf060aa2a9d8399-9fe43234648b7ed6-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f3a34857458141b69bf060aa2a9d8399,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/
