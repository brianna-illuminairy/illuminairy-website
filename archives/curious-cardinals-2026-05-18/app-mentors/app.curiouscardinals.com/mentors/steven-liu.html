xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6a75ab3b-c75c-49d0-b7ec-88b7a375913c\"}":{"__typename":"Favorites","uuid":"6a75ab3b-c75c-49d0-b7ec-88b7a375913c","photoUrl":"https://ucarecdn.com/116614f2-5776-40cf-a45b-f546dbbcb1af/","title":"Modern Vampires of the City","type":"ALBUM"},"Favorites:{\"uuid\":\"4d2b8138-0e3c-42dd-b52a-870cf899d6df\"}":{"__typename":"Favorites","uuid":"4d2b8138-0e3c-42dd-b52a-870cf899d6df","photoUrl":"https://ucarecdn.com/da325328-bbaf-40cb-a85b-501fc9050aba/","title":"Golden State Warriors","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"d744b628-b1d0-4e25-b602-40a607fe6f5b\"}":{"__typename":"Favorites","uuid":"d744b628-b1d0-4e25-b602-40a607fe6f5b","photoUrl":"https://ucarecdn.com/8e7866c2-5a0c-458f-bcdc-bad4a1b0a37d/","title":"Counter Strike","type":"GAME"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"023c1f69-8e01-46b4-bd2c-743634caa1b4\"}":{"__typename":"DeepDives","uuid":"023c1f69-8e01-46b4-bd2c-743634caa1b4","content":"\u003cp\u003eI chose to major in economics because I really enjoyed the economics classes and opportunities that I got to explore in high school. I really enjoyed both micro and macroeconomics that my high school offered, and through that, I began exploring the world of business by frequently reading news articles. I found those really interesting, and I hope that I can share some of my passion for economics with you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"1f1e0161-17a2-494a-ad52-5cd34e05d488\"}":{"__typename":"DeepDives","uuid":"1f1e0161-17a2-494a-ad52-5cd34e05d488","content":"\u003cp\u003eDuring my high school summers, I mainly explored opportunities outside of school, specifically with finding marketing and finance internships. I also visited my relatives in China during the summers after my junior and senior year. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8e81ef11-6a47-4c3b-bf6f-d88384130164\"}":{"__typename":"DeepDives","uuid":"8e81ef11-6a47-4c3b-bf6f-d88384130164","content":"\u003cp\u003eMy dream job would be something that I genuinely want to put time into and feel satisfied at the end of the day. Right now, my dream job would probably be a strategic director at a major company, as I enjoy finding trends within businesses. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f066bc7e-66fe-49a4-b096-a54990435be4\"}":{"__typename":"DeepDives","uuid":"f066bc7e-66fe-49a4-b096-a54990435be4","content":"\u003cp\u003eI enjoy listening to music (right now my favorite artists are Vampire Weekend and Gorillaz), playing whatever game I'm currently addicted to, and generally talking with friends about whatever.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2822ff7c-8097-4087-8436-99dc9c155aad\"}":{"__typename":"School","uuid":"2822ff7c-8097-4087-8436-99dc9c155aad","name":"The Nueva School | San Mateo","city":"San Mateo","type":"HIGH","state":"California","country":"United States","zip":"94403"},"Education:{\"uuid\":\"785f88c3-e9f7-496b-b2b5-7d4a66fc3827\"}":{"__typename":"Education","uuid":"785f88c3-e9f7-496b-b2b5-7d4a66fc3827","school":{"__ref":"School:{\"uuid\":\"2822ff7c-8097-4087-8436-99dc9c155aad\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"75844343-bbed-4b21-90c4-f05e5e89572b\"}":{"__typename":"Education","uuid":"75844343-bbed-4b21-90c4-f05e5e89572b","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"4e38a9e4-065f-49b1-a8c4-c5d1e834f537\"}":{"__typename":"MentorPublicProfile","uuid":"4e38a9e4-065f-49b1-a8c4-c5d1e834f537","displayName":"Steven L.","slug":"steven-liu","biography":"\u003cp\u003eHello! My name is Steven Liu, and I'm from the Bay Area! Right now, I'm a freshman at Princeton University planning to major in economics and minor in something history related. I am super excited to work with Curious Cardinals and help unlock my mentee's passion for learning!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHere's some background on me and my relationship with mentorship: I realize that I have been blessed with the resources given to me throughout my life as a first-generation student, through both my schooling and outside opportunities that I was able to receive throughout middle school and high school. I was able to go to school and feel like I wanted to learn new things without the fear of failure. I hope that through Curious Cardinals, I am able to do the same with whoever I am mentoring: allowing them to explore what they are actually interested in that can make a true difference in the world. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome of the things that I am interested in and spend my free time learning about are random history and geography facts about our world—which in turn boosts my love for travel. A few areas of history that I am currently learning more about are Roman and Ancient Chinese history (not sure why, I just think it's interesting to learn). I also enjoy reading news about economics and business, which allows me to discover trends within the world of what we consume. What allowed me to become interested in these fields have all been teachers and friends I've had in the past that continuously challenged my interest in these topics while also making these topics easy to understand for someone just getting to know what it is. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope that through my experience at Curious Cardinals, I will be able to explain concepts in a clear and succinct way that any student will be able to understand. I think this opportunity will be extremely valuable both to my mentee, but also so that I can understand myself better.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"HxAn2vnVoBZF7eaqQfxrp02efEnJc023HYHymz1Xs500gM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm really proud of myself whenever I help out a total stranger. I think my actions towards people I don't know at all really show the person that I am. It's easy to be nice to your friends, but harder to be nice to people you don't know, or even dislike.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"6a75ab3b-c75c-49d0-b7ec-88b7a375913c\"}"},{"__ref":"Favorites:{\"uuid\":\"4d2b8138-0e3c-42dd-b52a-870cf899d6df\"}"
