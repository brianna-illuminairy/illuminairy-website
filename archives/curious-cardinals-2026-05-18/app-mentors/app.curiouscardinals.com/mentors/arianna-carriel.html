xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1b5523ef-de84-481e-b04a-9d3a5e4b828e\"}":{"__typename":"Favorites","uuid":"1b5523ef-de84-481e-b04a-9d3a5e4b828e","photoUrl":"https://ucarecdn.com/9a418451-f3ff-4e2e-adaf-768fd3057be0/","title":"POR SI ALGUIEN NOS ESCUCHA by Kapo","type":"ALBUM"},"Favorites:{\"uuid\":\"19e056a5-a661-47b8-806e-c97518668eec\"}":{"__typename":"Favorites","uuid":"19e056a5-a661-47b8-806e-c97518668eec","photoUrl":"https://ucarecdn.com/6ead6c78-8f1b-4997-8ac0-775d6277d48d/","title":"Cuenca, Ecuador","type":"CITY"},"Favorites:{\"uuid\":\"2a63274b-696d-4dcf-996d-49abcfc30c20\"}":{"__typename":"Favorites","uuid":"2a63274b-696d-4dcf-996d-49abcfc30c20","photoUrl":"https://ucarecdn.com/b4d892d2-870b-4bb6-bee5-33e66d12da55/","title":"Back to the Future","type":"PLAY"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"5f77b31a-fd43-4426-9ec9-211c7aa294ea\"}":{"__typename":"DeepDives","uuid":"5f77b31a-fd43-4426-9ec9-211c7aa294ea","content":"\u003cp\u003eI truly believe that mentorship is about something bigger than the individual—it’s about those who come before us and those who come after us. I’ve been incredibly fortunate to have access to opportunities, guidance, and support throughout my education, and mentorship feels like a meaningful way to give back.\u003c/p\u003e\u003cp\u003eDuring my time at Barnard College, I served as a peer mentor and am still close with my mentee today. That experience showed me how powerful mentorship can be, not just academically but personally. I also believe mentorship is reciprocal. While I support students in building confidence and direction, I’m constantly learning from them as well. As a young professional navigating a transitional phase of life, I value that mutual exchange and the human connection that mentorship creates.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3f26d727-216d-4f6f-a99c-a6a369644248\"}":{"__typename":"DeepDives","uuid":"3f26d727-216d-4f6f-a99c-a6a369644248","content":"\u003cp\u003eOne passion project I’m currently working on is creating bilingual digital educational products for students learning English and Spanish. I design materials such as coloring books and early language-learning resources that make language acquisition feel playful, accessible, and engaging. I currently have two live digital coloring books and continue to expand the collection through my online shop.\u003c/p\u003e\u003cp\u003eThis project combines my love for bilingual education, curriculum design, and creative learning, and it’s been exciting to see how small, thoughtful resources can support students and families in meaningful ways.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"454ca499-d09c-47b3-8901-114add050da6\"}":{"__typename":"DeepDives","uuid":"454ca499-d09c-47b3-8901-114add050da6","content":"\u003cp\u003eAs a first-generation college student from an Ecuadorian family, my identity deeply shapes how I teach and mentor. I don’t believe identity should be separated from the classroom; there is space for students’ backgrounds, cultures, and lived experiences in learning environments.\u003c/p\u003e\u003cp\u003eHaving studied and worked both in the U.S. and in Ecuador, I’m especially mindful of access, language, and representation. I lead with empathy and gratitude, understanding that students come to learning with different resources, responsibilities, and strengths. My goal is always to create a supportive space where students feel seen, valued, and confident, allowing them to bring their full selves into the learning process.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"15d3612f-27ab-47b8-a02d-b7e766aff718\"}":{"__typename":"DeepDives","uuid":"15d3612f-27ab-47b8-a02d-b7e766aff718","content":"\u003cp\u003eI would tell my middle or high school self to try new things and stay open-minded, even when you feel very certain about what you want. It’s okay to have goals and work toward them, but it’s just as important to leave room for curiosity and unexpected opportunities. The things you think you want at 14 or 16 may look completely different five or ten years later, and that’s not a failure, that’s growth!\u003c/p\u003e\u003cp\u003eI’d also remind myself to trust the process. Not everything needs to make sense right away. Some experiences only show their value later, and often the moments that feel uncertain or uncomfortable end up shaping you the most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"3123b288-cf5a-4a0a-a2f4-56e9622b883b\"}":{"__typename":"School","uuid":"3123b288-cf5a-4a0a-a2f4-56e9622b883b","name":"High School for Arts and Business","city":"Corona","type":"HIGH","state":"NY","country":"United States","zip":"11368"},"Education:{\"uuid\":\"249bc0b6-b6e6-4283-82fb-3987e0e0b5fe\"}":{"__typename":"Education","uuid":"249bc0b6-b6e6-4283-82fb-3987e0e0b5fe","school":{"__ref":"School:{\"uuid\":\"3123b288-cf5a-4a0a-a2f4-56e9622b883b\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}":{"__typename":"School","uuid":"67d96877-4245-4f9b-a557-94f9ecabd290","name":"Barnard College","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"2e6b4913-43d4-4094-ae3b-8d03313ce4e7\"}":{"__typename":"Education","uuid":"2e6b4913-43d4-4094-ae3b-8d03313ce4e7","school":{"__ref":"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Education Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"769cf672-555b-45f5-8517-32e432960906\"}":{"__typename":"MentorPublicProfile","uuid":"769cf672-555b-45f5-8517-32e432960906","displayName":"Arianna C.","slug":"arianna-carriel","biography":"\u003cp\u003eHi! My name is Arianna, and I’m an educator, mentor, and curriculum designer who is passionate about helping students build confidence, curiosity, and a strong sense of ownership over their learning.\u003c/p\u003e\u003cp\u003eI studied Education at Barnard College of Columbia University, where I developed a deep interest in how students learn best when they feel supported, understood, and challenged in meaningful ways. During my time at Barnard, I also served as a peer mentor for first-year students and was honored to receive the Mentor of the Year Award in 2022. That experience confirmed something I had always felt: mentorship is a reciprocal relationship. Students grow, but mentors grow too, by listening, adapting, and learning alongside them.\u003c/p\u003e\u003cp\u003eOver the past several years, I’ve worked with students across a wide range of ages and learning levels, from early elementary learners to high school students and adults. I’ve taught and tutored reading, writing, math, and language skills, and I currently work in bilingual education, teaching both English and Spanish. I’ve had the privilege of supporting students both in the U.S. and internationally, including through a Fulbright teaching experience in Ecuador and virtual programs serving learners around the world.\u003c/p\u003e\u003cp\u003eIn addition to teaching, I’ve worked in student services and program coordination at Columbia University’s Pre-College Program, where I supported thousands of students and families. This role strengthened my ability to communicate clearly, stay organized, and understand the bigger picture of a student’s academic journey, not just their assignments, but their confidence, motivation, and long-term goals.\u003c/p\u003e\u003cp\u003eWhat I care about most is helping students feel capable and proud of themselves. I love working with students on passion projects, creative problem-solving, and goal-setting because these experiences help students see learning as something they own, not something that simply happens to them. I believe learning should feel engaging, encouraging, and relevant to who students are.\u003c/p\u003e\u003cp\u003eOutside of my professional work, I love traveling, spending time in nature, going on long walks, watching movies, and meeting new people. These experiences keep me curious and grounded, and they often inspire how I connect with students and families from different backgrounds.\u003c/p\u003e\u003cp\u003eIf you’re a student or family looking for someone who is thoughtful, encouraging, and genuinely invested in growth, I would love to work together. My goal is always to help students feel supported, confident, and excited about learning, and about who they’re becoming.\u003c/p\u003e","teachingVideoPlaybackId":"50053pl4DcyRCbDayRSeuw3CGZV00APH7Fo3pS6qf01Jfg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m particularly proud of is creating educational resources that extend beyond the classroom. From being a Fulbright English Teaching Assistant to creating my own bilingual digital learning products, I’ve consistently taken initiative to design engaging, student-centered materials that support learning in meaningful, accessible ways.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"1b5523ef-de84-481e-b04a-9d3a5e4b828e\"}"},{"__ref":"Favorites:{\"uuid\":\"19e056a5-a661-47b8-806e-c97518668eec\"}"},{"__ref":"Favorites:{\"uuid\":\"2a63274b-696d-4dcf-996d-49abcfc30c20\"}"}],"causesSupported":[],"major":"Education Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5f77b31a-fd43-4426-9ec9-211c7aa294ea\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f26d727-216d-4f6f-a99c-a6a369644248\"}"},{"__ref":"DeepDives:{\"uuid\":\"454ca499-d09c-47b3-8901-114add050da6\"}"},{"__ref":"DeepDives:{\"uuid\":\"15d3612f-27ab-47b8-a02d-b7e766aff718\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5964426e-bbc4-4f3c-bf84-0e7e7b1a624b/-/preview/-/format/jpg/","https://ucarecdn.com/87ea368e-65fe-4d31-8433-04291a337869/-/preview/-/format/jpg/","https://ucarecdn.com/fffd750b-4add-4938-97c2-f63517d5d3c7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"249bc0b6-b6e6-4283-82fb-3987e0e0b5fe\"}"},{"__ref":"Education:{\"uuid\":\"2e6b4913-43d4-4094-ae3b-8d03313ce4e7\"}"}],"hiredAt":"2025-12-22T20:09:33.869Z","topics":["K-5 Grade Math","Pre-Algebra","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Creative Writing","Public Speaking"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibil
