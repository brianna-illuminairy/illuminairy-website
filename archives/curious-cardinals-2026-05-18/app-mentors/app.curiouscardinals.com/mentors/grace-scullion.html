xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ff2cbf0e-82a6-4f0d-a4de-5657d263de0d\"}":{"__typename":"Favorites","uuid":"ff2cbf0e-82a6-4f0d-a4de-5657d263de0d","photoUrl":"https://ucarecdn.com/e8f7a506-0404-4bf7-922d-da701371e78c/","title":"Demon Copperhead by Barbara Kingsolver","type":"BOOK"},"Favorites:{\"uuid\":\"1ebb0b92-445d-4032-adbb-bc845533452f\"}":{"__typename":"Favorites","uuid":"1ebb0b92-445d-4032-adbb-bc845533452f","photoUrl":"https://ucarecdn.com/963cec7e-5c15-4d43-9047-afc83b3853b9/","title":"Bananagrams","type":"GAME"},"Favorites:{\"uuid\":\"383391c9-0c44-4d95-b065-b23a252d933c\"}":{"__typename":"Favorites","uuid":"383391c9-0c44-4d95-b065-b23a252d933c","photoUrl":"https://ucarecdn.com/1146137a-c168-467e-89b4-d9d88402aa83/","title":"Lady Gaga","type":"ARTIST"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d6d3734f-4946-44e1-bc02-ca3dbf72aee0\"}":{"__typename":"DeepDives","uuid":"d6d3734f-4946-44e1-bc02-ca3dbf72aee0","content":"\u003cp\u003eIt's hard to know what's possible—or how much to believe in yourself—alone. Especially for kids and teens. Two special English teachers and my dance instructor gave me encouragement and wholehearted investment during my formative years. Their faith in me then continues to give me the confidence I need to take risks, dream big, and trust that my ideas are worth sharing with the world. I want to pass this feeling on to my mentees, embedding the enduring confidence that arises when one feels understood and worthy.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6930a6bf-8705-4fd3-b7d6-b249692fc52c\"}":{"__typename":"DeepDives","uuid":"6930a6bf-8705-4fd3-b7d6-b249692fc52c","content":"\u003cp\u003eAmerican Studies is a combination of English, History, Political Science, and Communications classes that culminate in a grand cultural study of the American context. I chose it in part because it allowed me to take the wide range of humanities and social science classes that I wanted to take—think \"Media, Culture, and Politics of the 1980s\" as well as \"Constitutional Originalism.\" I also picked it because it allowed me to get at the question of what it means to be American and what exactly is the American story through dozens of lenses. Yes, I learned about American history and literature, but I also learned how to think critically about the context I find myself in—how it was shaped and who/what did the shaping. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3e12632f-737e-4194-b5ed-56dd4b840b12\"}":{"__typename":"DeepDives","uuid":"3e12632f-737e-4194-b5ed-56dd4b840b12","content":"\u003cp\u003eBefore I start at law school in the fall, I'm leading operations at a start-up tea bar in NYC. Building a small, community-based, brick-and-mortar business is a side project I've longed to pursue for a while. The competitive market demands clear, high-level strategy amidst the chaos of keeping the floors mopped and inventory stocked. I've only just begun, and I've already learned a \u003cem\u003eton\u003c/em\u003e—a testament to the benefits of stepping outside my traditional lane of work and study. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"dda53510-0a78-4188-8ca2-906cabcc19f1\"}":{"__typename":"DeepDives","uuid":"dda53510-0a78-4188-8ca2-906cabcc19f1","content":"\u003cp\u003eI spent my high school summers developing my craft as a dancer and actress. I attended various theater and dance camps, performed in local theater productions, and even toured with a professional contemporary dance company by my senior year. Being able to sink this much time into my artistic pursuits was always a treat, and it was the time I made the most strides in improving my skills. Summer also always reminds me to hit the library and supercharge through my reading list. There are few pastimes more delightful than a book at the beach. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"62ebf57a-cf85-44e3-b64e-4f11d45a271c\"}":{"__typename":"School","uuid":"62ebf57a-cf85-44e3-b64e-4f11d45a271c","name":"North Shore Country Day","city":"Winnetka","type":"HIGH","state":"Illinois","country":"United States","zip":"60093"},"Education:{\"uuid\":\"9d71aa7f-90d2-4cd9-afa7-f0afe51e821c\"}":{"__typename":"Education","uuid":"9d71aa7f-90d2-4cd9-afa7-f0afe51e821c","school":{"__ref":"School:{\"uuid\":\"62ebf57a-cf85-44e3-b64e-4f11d45a271c\"}"},"startYear":"2016","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"ef851788-92d6-462f-b1d5-54deea5aaa46\"}":{"__typename":"Education","uuid":"ef851788-92d6-462f-b1d5-54deea5aaa46","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"American Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"c4b37477-5996-41d7-9e39-74a60c181eff\"}":{"__typename":"MentorPublicProfile","uuid":"c4b37477-5996-41d7-9e39-74a60c181eff","displayName":"Grace S.","slug":"grace-scullion","biography":"\u003cp\u003e\u003cstrong\u003eHello! I’m Grace.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in the lovely suburbs of Chicago, where I spent nearly all my non-school hours dancing, reading, and writing op-eds. At 18, I headed west to Stanford, where I studied American Studies (with a minor in Data Science) and finally understood the hype of California living. My sunny, nature-filled years in the Bay Area were followed by a craving for more concrete. Today, you’ll find me in New York City, where I’ve worked in journalism, government, and speechwriting ever since.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFrom reporting in the halls of Congress to working at NYC’s Emergency Management department, I love the thrill of chaos—and the challenge of translating it into clear, essential communication for the public. Whether your student is looking to read, write, or speak more effectively, I’m all in. At Stanford, I tutored both undergraduate and graduate students in public speaking and presentation skills, helping with everything from thesis development to conquering the fear of the podium.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor the past year, I’ve worked as a speechwriter, drafting op-eds and speeches for some of the biggest names in business, philanthropy, and government. Being a speechwriter-for-hire means a lot of mentoring: when we meet with clients, we help them shape their ideas, refine their arguments, draft their remarks, and polish their delivery. If your student has a seedling of an idea, I’m here to help it blossom.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m passionate about social issues, politics, American history, and the news—which is why I’ll be starting law school in the fall of 2025! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love learning, and I want your student to love it too. I’m known for my warmth and positivity. Whether it’s helping students build confidence through extra practice, channeling their creativity into writing or performance, or nerding out on a new favorite subject, I’m excited to be a partner in helping them use their minds to build a fulfilling life.\u003c/p\u003e","teachingVideoPlaybackId":"02Cer7V02DAp00QoxpEZvRuZQ4rglFQI6S1gebG003NnVtY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ff2cbf0e-82a6-4f0d-a4de-5657d263de0d\"}"},{"__ref":"Favorites:{\"uuid\":\"1ebb0b92-445d-4032-adbb-bc845533452f\"}"},{"__ref":"Favorites:{\"uuid\":\"383391c9-0c44-4d95-b065-b23a252d933c\"}"}],"causesSupported":[],"major":"American Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d6d3734f-4946-44e1-bc02-ca3dbf72aee0\"}"},{"__ref":"DeepDives:{\"uuid\":\"6930a6bf-8705-4fd3-b7d6-b249692fc52c\"}"},{"__ref":"DeepDives:{\"uuid\":\"3e12632f-737e-4194-b5ed-56dd4b840b12\"}"},{"__ref":"DeepDives:{\"uuid\":\"dda53510-0a78-4188-8ca2-906cabcc19f1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8dec0558-097d-43bf-822a-e2a4631bdf47/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9d71aa7f-90d2-4cd9-afa7-f0afe51e821c\"}"},{"__ref":"Education:{\"uuid\":\"ef851788-92d6-462f-b1d5-54deea5aaa46\"}"}],"hiredAt":"2025-06-11T02:33:32.532Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Creative Writing","K-6 Storybook","History Project","Law / Government / Policy","Journa
