xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"284929df-da10-48d9-8bf5-16d36d27ef02\"}":{"__typename":"Favorites","uuid":"284929df-da10-48d9-8bf5-16d36d27ef02","photoUrl":"https://ucarecdn.com/0516db9f-484b-4697-976a-bff4adb23d8d/","title":"Pride and Prejudice","type":"BOOK"},"Favorites:{\"uuid\":\"5aeda030-7b51-441f-89e0-bee859cab1a0\"}":{"__typename":"Favorites","uuid":"5aeda030-7b51-441f-89e0-bee859cab1a0","photoUrl":"https://ucarecdn.com/61dc8e18-8ae1-443d-a69a-79776be445d7/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"30058aac-df0d-40ca-a765-0e61d161942e\"}":{"__typename":"Favorites","uuid":"30058aac-df0d-40ca-a765-0e61d161942e","photoUrl":"https://ucarecdn.com/5b4007ad-34b4-4cc8-b05b-84a624e757ab/","title":"Alysa Liu","type":"ATHLETE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bd46f4f4-3df8-490e-9f6e-59818508ed34\"}":{"__typename":"DeepDives","uuid":"bd46f4f4-3df8-490e-9f6e-59818508ed34","content":"\u003cp\u003eI would tell myself that it’s okay not to have everything figured out so early. I spent a lot of time worrying about doing everything “right,” instead of just exploring what I was genuinely interested in. I’d remind myself to be more patient, to focus on learning and growing step by step, and not to be afraid of making mistakes. Most things don’t need to be perfect; they just need to start.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"69815598-7ad5-4b82-a76f-61d201db6191\"}":{"__typename":"DeepDives","uuid":"69815598-7ad5-4b82-a76f-61d201db6191","content":"\u003cp\u003eMentorship matters to me because I know how much of a difference it makes to have someone who listens, supports you, and helps you figure things out. A lot of learning can feel overwhelming, especially when you’re on your own, and having someone guide you through it can change how you see yourself and what you’re capable of. I enjoy being that person who helps them build confidence, stay curious, and realize they’re able to do more than they think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"41ce200e-41a2-495d-b0ce-311f2bd9e376\"}":{"__typename":"DeepDives","uuid":"41ce200e-41a2-495d-b0ce-311f2bd9e376","content":"\u003cp\u003eI hope to make a real difference in people’s lives through medicine, not just by treating illness, but by helping people feel understood and cared for. I want to use what I learn to support others in a meaningful way, and know that the work I do has a positive impact beyond myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fbd04bfa-11c5-4a8e-a455-7540f104d938\"}":{"__typename":"DeepDives","uuid":"fbd04bfa-11c5-4a8e-a455-7540f104d938","content":"\u003cp\u003eI chose psychology because I’ve always been interested in understanding how people think, feel, and behave. As a pre-med student, I realized that medicine isn’t just about treating the body—it’s also about understanding the person behind the patient. Psychology helps me see how mental and emotional factors influence health, decision-making, and recovery. I think it makes me a more empathetic and thoughtful future physician, because it teaches me to listen better and understand patients more holistically, not just focus on their symptoms.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"de4043c3-3811-469d-95c7-f8184ba38929\"}":{"__typename":"School","uuid":"de4043c3-3811-469d-95c7-f8184ba38929","name":"The Emery/Weiner School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77025"},"Education:{\"uuid\":\"57fe94f1-be51-4f60-95b8-983d7a4f369c\"}":{"__typename":"Education","uuid":"57fe94f1-be51-4f60-95b8-983d7a4f369c","school":{"__ref":"School:{\"uuid\":\"de4043c3-3811-469d-95c7-f8184ba38929\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"aea6f881-4852-438c-a7e2-8586a6d53551\"}":{"__typename":"Education","uuid":"aea6f881-4852-438c-a7e2-8586a6d53551","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"02db4c31-e17e-45c0-8c51-07a0a92792e1\"}":{"__typename":"MentorPublicProfile","uuid":"02db4c31-e17e-45c0-8c51-07a0a92792e1","displayName":"Annie L.","slug":"annie-liu","biography":"\u003cp\u003eHi there! I’m Annie, a pre-med student at Columbia University who is passionate about science, learning, and working closely with students. I’ve always been drawn to both analytical thinking and creative expression, and that’s reflected in the wide range of subjects I enjoy mentoring—from math and science to writing, language, and creative projects.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I focus on biology and chemistry, and I’ve been deeply involved in biomedical research related to cancer and human health. Through this work, I’ve contributed to research projects that have led to publications and presented my work at scientific conferences. These experiences have given me a strong foundation in scientific thinking—how to analyze data, evaluate evidence, and communicate complex ideas clearly. More importantly, they’ve taught me how to approach challenging material with curiosity and persistence, which is something I bring directly into my mentoring.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI really enjoy helping students engage with science at a deeper level, especially in subjects like biology and chemistry, where concepts can feel abstract or overwhelming. I focus on helping students not just understand the material, but also grasp underlying theory.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnother strength of mine is guiding students through projects and helping them turn their interests into something tangible. Whether it’s exploring a research topic, structuring a piece of writing, or building a project step by step, I enjoy helping students move from uncertainty to clarity and confidence. My own experience working on long-term research projects has shown me how valuable it is to stay organized, manage time effectively, and follow through on ideas, and I aim to help students develop those same habits.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also place a strong emphasis on how students learn. I often support students with executive functioning skills like organization, time management, and building consistent study routines. These are skills I’ve developed through balancing rigorous coursework and research, and I know how impactful they can be.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy working with students on writing, creative projects, and Mandarin Chinese, and I aim to create a space where students feel comfortable expressing their ideas and thinking independently.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAt the end of the day, my goal is not just to help students improve academically, but to help them become more confident, curious, and capable learners. I want them to feel ownership over their learning and to see it as something meaningful, not just something they have to do.\u003c/p\u003e","teachingVideoPlaybackId":"1FIZHuIz2CfCEfFoThIMwpIGHcn5BK7aWflsPm9UYdA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"284929df-da10-48d9-8bf5-16d36d27ef02\"}"},{"__ref":"Favorites:{\"uuid\":\"5aeda030-7b51-441f-89e0-bee859cab1a0\"}"},{"__ref":"Favorites:{\"uuid\":\"30058aac-df0d-40ca-a765-0e61d161942e\"}"}],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bd46f4f4-3df8-490e-9f6e-59818508ed34\"}"},{"__ref":"DeepDives:{\"uuid\":\"69815598-7ad5-4b82-a76f-61d201db6191\"}"},{"__ref":"DeepDives:{\"uuid\":\"41ce200e-41a2-495d-b0ce-311f2bd9e376\"}"},{"__ref":"DeepDives:{\"uuid\":\"fbd04bfa-11c5-4a8e-a455-7540f104d938\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f06933cd-bb8b-43ef-b712-b5c78ea818cd/-/preview/-/format/jpg/","https://ucarecdn.com/f2afdfbd-98d9-48a0-ad84-52d3e3c93f15/-/preview/-/format/jpg/","https://ucarecdn.com/28d0fcc7-117d-41c0-a294-f780e6e31b25/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"57fe94f1-be51-4f60-95b8-983d7a4f369c\"}"},{"__ref":"Education:{\"uuid\":\"aea6f881-48
