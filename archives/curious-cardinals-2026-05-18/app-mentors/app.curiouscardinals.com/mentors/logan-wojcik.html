xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bb1b8d71-09f3-415f-a375-57db2203bc27\"}":{"__typename":"Favorites","uuid":"bb1b8d71-09f3-415f-a375-57db2203bc27","photoUrl":"https://ucarecdn.com/5949e63f-a541-458e-a357-7b2110aef1f1/","title":"Stick Season","type":"ALBUM"},"Favorites:{\"uuid\":\"ebfb3c59-d439-47cd-bc11-e0c640e5a6a5\"}":{"__typename":"Favorites","uuid":"ebfb3c59-d439-47cd-bc11-e0c640e5a6a5","photoUrl":"https://ucarecdn.com/40a97e39-c5fb-4c2f-9eba-122ac75d033b/","title":"Alex de Minaur","type":"ATHLETE"},"Favorites:{\"uuid\":\"ed5383ad-ec4f-49c7-bb7b-fe0dd01387bf\"}":{"__typename":"Favorites","uuid":"ed5383ad-ec4f-49c7-bb7b-fe0dd01387bf","photoUrl":"https://ucarecdn.com/d2350ee3-aba9-43e6-9bde-c7f5038ec092/","title":"Copenhagen","type":"CITY"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"cdb313fe-aeb7-4f15-bdea-3b29c90dee75\"}":{"__typename":"DeepDives","uuid":"cdb313fe-aeb7-4f15-bdea-3b29c90dee75","content":"\u003cp\u003eCreating meaningful connections is so important in fostering inspiration. I've been lucky to have some amazing peer mentors over the years, like my freshman year peer advisor at Brown and the former president of a club I am a part of. Building relationships with these people kept me motivated to pursue my passions and work hard at what I loved, not to mention the great friendships that formed. I hope to be able to give back and be a mentor for someone who might share my interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6968c512-f52e-4a02-b016-101667d57832\"}":{"__typename":"DeepDives","uuid":"6968c512-f52e-4a02-b016-101667d57832","content":"\u003cp\u003eI spent my summers in high school coaching tennis at my local tennis club. I taught both kids and adults, and played a lot of pickleball on the side! I learned a lot about effective communication and building a fun environment for kids.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c8a17fe4-a555-4abe-a0d2-ecf54b7995de\"}":{"__typename":"DeepDives","uuid":"c8a17fe4-a555-4abe-a0d2-ecf54b7995de","content":"\u003cp\u003eI always loved history and politics in high school, so knew that political science might be a good fit for me in college. After having some great professors, I decided I would major in it. I added my economics major because I missed doing math, and the two complement each other well with lots of fascinating overlap of topics.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0b889b49-f757-4f52-94f3-30b613f969f1\"}":{"__typename":"DeepDives","uuid":"0b889b49-f757-4f52-94f3-30b613f969f1","content":"\u003cp\u003eIf I could go back in time I would tell myself to enjoy the little moments and try to stay more present. Working towards big goals can be daunting, so spending time relaxing, staying in the moment, and doing the things you love, is super important.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"792976d2-75e5-4d09-8907-8c1f2b90a90b\"}":{"__typename":"School","uuid":"792976d2-75e5-4d09-8907-8c1f2b90a90b","name":"St. Margaret's Episcopal School","city":"San Juan Capistrano","type":"HIGH","state":"California","country":"United States","zip":"92675"},"Education:{\"uuid\":\"190c413e-3bed-47a9-ba66-1aaa47c87a09\"}":{"__typename":"Education","uuid":"190c413e-3bed-47a9-ba66-1aaa47c87a09","school":{"__ref":"School:{\"uuid\":\"792976d2-75e5-4d09-8907-8c1f2b90a90b\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"1cc3e0f5-a9b6-42f5-afc4-2ec9bd7488e7\"}":{"__typename":"Education","uuid":"1cc3e0f5-a9b6-42f5-afc4-2ec9bd7488e7","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Political Science + Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"7434b525-64bb-4df9-818c-8daae9dd7bdb\"}":{"__typename":"MentorPublicProfile","uuid":"7434b525-64bb-4df9-818c-8daae9dd7bdb","displayName":"Logan W.","slug":"logan-wojcik","biography":"\u003cp\u003eLogan is from originally from San Juan Capistrano, California, and is currently a Master of Public Affairs candidate at The Watson School for International and Public Affairs at Brown University, specializing in data and policy analysis. Logan recently graduated in 2025 from Brown with a dual degree in political science and economics, and his passion for education and love for Rhode Island runs deep. Logan is most passionate about community engagement and public service, and hopes to one day work at the intersection of advocacy and climate policy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLogan has been a mentor with Curious Cardinals for the past year, where he has worked with students of all ages. Whether supporting a student in mastering a familiar subject or helping them explore a new passion pathway, Logan approaches each mentorship with curiosity, patience, and enthusiasm. Logan strives to make learning both engaging and empowering, encouraging students to think critically, ask questions, and take ownership of their intellectual development.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCommitted to addressing the climate crisis and advancing sustainability, Logan focuses much of his personal academic work on the intersection of policy and economics. His academic interests extend across disciplines, as he has taken coursework in environmental science and English, enriching his understanding of complex global issues. Logan is extremely passionate about helping students grasp a subject, even if it is one that is new to them. He has been a peer advisor for first-year students at Brown through the Meiklejohn program, as well as for sophomores in a matched advising program, where he enjoys guiding peers and sharing his enthusiasm for learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, Logan channels his interests into writing and advocacy. He contributes to the Brown Political Review and serves as a newsletter writer and outreach coordinator for Scientists for a Sustainable World (SSW), a student group that builds sustainability-focused projects like solar-powered charging stations and plastic shredders for recycling. Logan is also president of the Brown Club Tennis team, a role that lets him combine leadership with his love for tennis.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA recent semester abroad in Copenhagen in 2024 further fueled Logan’s passion for sustainability, as he drew inspiration from Denmark’s environmental initiatives and the country’s leadership in sustainable innovation. Outside of academics and extracurriculars, Logan enjoys exploring Providence’s restaurant scene, surfing, running, and spending as much time outdoors as possible.\u003c/p\u003e","teachingVideoPlaybackId":"ABJgtT4NgQsVrmGXxywUDWFcnhfXGLxl46IZJXVbvKs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bb1b8d71-09f3-415f-a375-57db2203bc27\"}"},{"__ref":"Favorites:{\"uuid\":\"ebfb3c59-d439-47cd-bc11-e0c640e5a6a5\"}"},{"__ref":"Favorites:{\"uuid\":\"ed5383ad-ec4f-49c7-bb7b-fe0dd01387bf\"}"}],"causesSupported":[],"major":"Political Science + Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cdb313fe-aeb7-4f15-bdea-3b29c90dee75\"}"},{"__ref":"DeepDives:{\"uuid\":\"6968c512-f52e-4a02-b016-101667d57832\"}"},{"__ref":"DeepDives:{\"uuid\":\"c8a17fe4-a555-4abe-a0d2-ecf54b7995de\"}"},{"__ref":"DeepDives:{\"uuid\":\"0b889b49-f757-4f52-94f3-30b613f969f1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bf8f4a1a-5b94-4544-b306-3a5194f2c176/-/preview/-/format/jpg/","https://ucarecdn.com/9255d5ff-1c41-4ec4-863b-fe2e0e4c1c32/-/preview/-/format/jpg/","https://ucarecdn.com/5457db3a-0a61-4f2f-afa7-ed5d57be6e27/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"190c413e-3bed-47a9-ba66-1aaa47c87a09\"}"},{"__ref":"Education:{\"uuid\":\"1cc3e0f5-a9b6-42f5-afc4-2ec9bd7488e7\"}"}],"hiredAt":"2025-05-06T10:21:01.121Z","topics":["K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Writing","Academic Coaching","College Essay Writing","Economics","Executive Function","History","Reading","Creative Writing","History Project","K-6 Storybook","Sports Journalism","Business / Entrepreneurship","Sports Analytics","Debate","Journalism","Law / Government / Policy","Public Sp
