c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eEntrepreneurship is at the core of Eden's passions. At Northwestern, she founded an events company called Indigo Social,\u0026nbsp;served as a student ambassador for the Farley Center of Entrepreneurship, and participated in 4 different accelerator programs through the school's innovation incubator, where she currently serves as an alumni mentor to female student founders.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e-\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eAt Northwestern, Eden\u0026nbsp;was also the president of Spoon University, head of operations for Women in Business, and a tour guide for Northwestern Admissions, where she now conducts alumni interviews.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e-\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003ePassionate about social justice, Eden has provided crisis hotline support at the National Runaway Safeline and gained valuable experience as a Legal Intern assisting survivors of domestic violence with Order of Protections processes.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e","teachingVideoPlaybackId":"abORQ5ZbMPEUtzKwCIvf99VVnG3TvOJg1zvhRRvQr01k","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eCoordinating the 2018 National Walkout for Gun Control at my high school and raising $13,000 through t-shirt sales!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"da285a18-180a-4606-abc2-050aae13979f\"}"},{"__ref":"Favorites:{\"uuid\":\"425a540a-d3ee-41d8-a77c-983e4076359a\"}"},{"__ref":"Favorites:{\"uuid\":\"490b29e1-d71e-49ba-be8d-de66bc222b32\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"aa8d384b-e347-48f7-8de6-2337e3813c9c\"}"}],"major":"Entrepren
