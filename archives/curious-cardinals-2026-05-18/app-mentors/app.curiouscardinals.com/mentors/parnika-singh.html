xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0b11f361-d69a-43a3-9fe3-e93bbab838f5\"}":{"__typename":"Favorites","uuid":"0b11f361-d69a-43a3-9fe3-e93bbab838f5","photoUrl":"https://ucarecdn.com/e11ece15-cc44-4923-8021-e4278c20b1d8/","title":"The Secret History by Donna Tartt","type":"BOOK"},"Favorites:{\"uuid\":\"50092a0e-2dd9-458b-842d-b74e8411a60b\"}":{"__typename":"Favorites","uuid":"50092a0e-2dd9-458b-842d-b74e8411a60b","photoUrl":"https://ucarecdn.com/fd73079b-4c8b-49a1-bf8c-017fbba45e86/","title":"Wasteland Baby! by Hozier","type":"ALBUM"},"Favorites:{\"uuid\":\"5c3d0837-f67a-486d-a5ed-1c836486e8f4\"}":{"__typename":"Favorites","uuid":"5c3d0837-f67a-486d-a5ed-1c836486e8f4","photoUrl":"https://ucarecdn.com/ed9c8c91-7c84-4b85-a6fd-a3c8c0a87c3b/","title":"Seattle (my home town!)","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"62aedd08-28f6-4a45-abcf-093d4283eb8e\"}":{"__typename":"DeepDives","uuid":"62aedd08-28f6-4a45-abcf-093d4283eb8e","content":"\u003cp\u003eMentorship matters to me because I’ve personally seen how life-changing it can be. I’ve been lucky to have mentors who guided me at key moments, and they were a huge contributor to the progress and opportunities I’ve had. In today’s world there are so many possible paths, and success doesn’t look the same for everyone, so having someone in your corner truly helps you figure out what actually fits you rather than trying to follow a one-size-fits-all blueprint. Good mentors also broaden your perspective by showing you options you might not even know exist, whether that’s a program to apply to or a discipline you didn't know existed! I also genuinely love watching students grow over time and discover what they care about and what they’re capable of.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c31e1406-16d8-44d2-b518-1a08661b7853\"}":{"__typename":"DeepDives","uuid":"c31e1406-16d8-44d2-b518-1a08661b7853","content":"\u003cp\u003eMy dream job is to work on a space mission to another solar system. I’d want to be involved in the overall systems engineering and design, where you’re thinking about how every piece of the mission fits together and making the trade-offs that turn ambitious ideas into something real. I also know I’d want my life outside work to matter too, so even while doing that kind of high-impact engineering, I’d still want to spend my spare time volunteering and building projects that give back to the community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"31391e5d-23ff-4dbc-9f75-886ee72ba382\"}":{"__typename":"DeepDives","uuid":"31391e5d-23ff-4dbc-9f75-886ee72ba382","content":"\u003cp\u003eAs a woman of color, I’m very aware that many students don’t always see themselves represented in STEM, and that can quietly affect their sense of confidence and belonging. In my sessions, I’m intentional about creating a space where questions are welcome, mistakes are normal, and you never have to “prove” you deserve to be there before you start learning. My culture has also shaped how I teach through values of discipline and responsibility, but also community and care for the people around you. That shows up in the way I mentor by balancing high standards with strong supportive, and treating learning as something you do with purpose rather than just for grades. I want students to leave sessions not only with better skills, but with more self-trust and a clearer sense that they can build things that matter.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"acfd3c8c-37c7-43fc-ba05-4d7af0b2179d\"}":{"__typename":"DeepDives","uuid":"acfd3c8c-37c7-43fc-ba05-4d7af0b2179d","content":"\u003cp\u003eI chose mechanical engineering because I’ve always loved taking things apart to understand how they work, and then using that understanding to design something better. I like thinking in systems, where you’re not just solving one small problem, but figuring out how different pieces fit together and making design choices that turn an idea into a real, usable product. I’m also minoring in aerospace because I’ve been fascinated by space for as long as I can remember. There’s so much we still don’t know about what’s out there, especially the biggest questions, like where we came from and whether we’re alone. I want to be part of the work that helps humanity answer those questions, and studying aerospace gives me the tools to contribute in a meaningful way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"1cfaef56-bf47-4dae-868f-8b9751261cae\"}":{"__typename":"School","uuid":"1cfaef56-bf47-4dae-868f-8b9751261cae","name":"Interlake High School","city":"Bellevue","type":"HIGH","state":"Washington","country":"United States","zip":"98008"},"Education:{\"uuid\":\"49bdfccf-2801-4f58-a419-55fa06bd6197\"}":{"__typename":"Education","uuid":"49bdfccf-2801-4f58-a419-55fa06bd6197","school":{"__ref":"School:{\"uuid\":\"1cfaef56-bf47-4dae-868f-8b9751261cae\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}":{"__typename":"School","uuid":"11470c0e-6098-4972-92d0-60616358bd13","name":"California Institute of Technology","city":"Pasadena","type":"COLLEGE","state":"California","country":"United States","zip":"91125"},"Education:{\"uuid\":\"870e945e-fc40-4108-b01d-93e3dd2fbb5e\"}":{"__typename":"Education","uuid":"870e945e-fc40-4108-b01d-93e3dd2fbb5e","school":{"__ref":"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Mechanical Engineering and Aerospace","degree":null},"MentorPublicProfile:{\"uuid\":\"d0d0d447-067d-461d-8b70-4cd73c7784be\"}":{"__typename":"MentorPublicProfile","uuid":"d0d0d447-067d-461d-8b70-4cd73c7784be","displayName":"Parnika S.","slug":"parnika-singh","biography":"\u003cp\u003eHi! My name is Parnika Singh, and I'm a first-year at Caltech studying Mechanical Engineering with a focus on Aerospace. I work with students in grades 6–12, and I love helping students take a big interest like “engineering” or “science” and turn it into real projects with impressive outcomes. This might be a research paper you’re proud to share, an innovative build you can present at a science fair, or a community project that reaches people and makes a genuine impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cu\u003ePassion projects and independent research in engineering and STEM: \u003c/u\u003eWhether you already have a topic or you’re starting from scratch, I can help you narrow your interests into a project that is both doable and interesting. We’ll shape a strong guiding question, find credible sources, and build a simple plan so you always know what to do next. I can also help you turn your work into a polished final product like a paper, presentation, poster, or portfolio.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cu\u003eEngineering builds and design-focused projects:\u003c/u\u003e I have tons of experience with the engineering-design process so if you want to build something, I’ll help you go from idea to execution without getting overwhelmed. We’ll break your project into steps, think through constraints like time and materials, and plan iterations so you can improve your design through testing. This can include mechanical designs, prototyping, hands-on experiments, or trade studies (engineering comparisons) where you evaluate options and justify your decisions.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cu\u003eCommunity service and outreach projects:\u003c/u\u003e I love giving back to my community, so if you want your project to help others, I can help you create something realistic and well-run. This might look like designing a workshop for younger students, building a small curriculum, launching a science education social media campaign, or planning an outreach event. We’ll focus on impact and communication so your project actually reaches the audience you care about.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cu\u003ePortfolio building:\u003c/u\u003e If you’re building your portfolio for college, I can help you curate it so it tells a clear story. That includes choosing your strongest pieces, organizing them logically, and making sure everything is presented professionally. If relevant to your goals, this can also include curating recordings and performance videos so your portfolio feels intentional.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cu\u003eSTEM subject guidance:\u003c/u\u003e Having tutored students in high school, I also support students who want structured help in core STEM subjects, especially math, physics, or computer science. This can look like targeted concept help, problem-solving practice, building study plans, and learning how to approach harder questions with confidence and strategy.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to mentor\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI have a very strong academic foundation. I completed the full IB Diploma in 11th grade, and I scored in the top 2% worldwide on IB exams. I also took 15 AP exams and earned a 5 on every single one. I had a 4.0 unweighted GPA in high school, and I currently have a 4.0 at Caltech, which has definitely taught me how to be highly efficient and strategic with learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond classes, I’ve pursued hands-on engineering and research experiences. I’ve interned at Boeing, done research at the University of Washington on sustainable propulsion technologies, and collaborated with Blue Origin scientists on R\u0026amp;D-style projects. One of the experiences I’m proudest of is that I’ve written and published a research paper on deep-space exploration, so I understand what it takes to create a finished, shareable piece of work with real substance.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also active in aerospace leadership. I’m a council member for Caltech’s chapter of AIAA, and I’m currently working on a CubeSat mission, helping design a modular CubeSat concept. I also served as president of my high school rocketry team, and we finished 12th in the country out of 1000+ teams, which taught me a lot about team leadership, iteration, and staying calm when things don’t go perfectly the first time.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat sessions with me look like\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’m big on planning and organization, and I’ll bring that structure to your project without making it feel rigid or stressful. Early on, we’ll create a roadmap with milestones so you always know what you’re working toward. I’ll also help you build the habits that make projects succeed, especially time management, communication, and how to explain your work clearly to an audience.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBetween sessions, I’ll give you resources and optional homework so you can keep momentum. I’m flexible about workload and I’ll match it to what’s realistic for your schedule, whether you want something light each week or you’re aiming for a bigger goal and want to move faster.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA few fun facts!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eEven outside of engineering, I love making things! I love pottery and embroidery, and I’m currently teaching myself how to sew, (which has been humbling in the best way). I’m also a huge reader. I read 106 books last year, and I’m always happy to swap recommendations during a session if you’re a fantasy or mystery person too. My favorites are The Secret History by Donna Tartt and Six of Crows. I also love exploring cities and spending time in museums and markets. Seriously, I've spent entire days in a single museum. Coming from the Pacific Northwest, I'll never say no to a hike! I also have a pet rabbit who is basically the quiet manager of my life.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you want a mentor who will take your ideas seriously and stick with you until you have something finished and impressive, I’d love to work with you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"xewCOIrfn6fmlrH00txkIYmhgifnsLJh22R88SSyiQmY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0b11f361-d69a-43a3-9fe3-e93bbab838f5\"}"},{"__ref":"Favorites:{\"uuid\":\"50092a0e-2dd9-458b-842d-b74e8411a60b\"}"},{"__ref":"Favorites:{\"uuid\":\"5c3d0837-f67a-486d-a5ed-1c836486e8f4\"}"}],"causesSupported":[],"major":"Mechanical Engineering and Aerospace","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"62aedd08-28f6-4a45-abcf-093d4283eb8e\"}"},{"__ref":"DeepDives:{\"uuid\":\"c31e1406-16d8-44d2-b518-1a08661b7853\"}"},{"__ref":"DeepDives:{\"uuid\":\"31391e5d-23ff-4dbc-9f75-886ee72ba382\"}"},{"__ref":"DeepDives:{\"uuid\":\"acfd3c8c-37c7-43fc-ba05-4d7af0b2179d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bc87a79b-9bd7-4679-a8a9-03c6c0b5be1f/-/preview/-/format/jpg/","https://ucarecdn.com/ceba183e-4c81-456b-8240-d592dccb2c12/-/preview/-/format/jpg/","https://ucarecdn.com/82f7ff64-33ad-49db-8fb8-09840bdc7a69/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"49bdfccf-2801-4f58-a419-55fa06bd6197\"}"},{"__ref":"Education:{\"uuid\":\"870e945e-fc40-4108-b01d-93e3dd2fbb5e\"}"}],"hiredAt":"2026-02-18T18:26:24.466Z","topics":["Algebra I","Geometry","Algebra II","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Physics","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Computer Science","Creative Writing","Business / Entrepreneurship","Coding / Programming","Robotics / Electronics / CAD","STEM Project","Aviation / Aerospace","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/1e4a2735-1bb6-4525-bb3b-365dd5531407/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"in
