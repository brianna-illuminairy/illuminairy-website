xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0366b023-affa-4f58-8f20-e92e918ad340\"}":{"__typename":"Favorites","uuid":"0366b023-affa-4f58-8f20-e92e918ad340","photoUrl":"https://ucarecdn.com/ab9612db-3acf-4b81-8e5c-5de3ac36bfbe/","title":"A Thousand Splendid Suns","type":"BOOK"},"Favorites:{\"uuid\":\"ed377cc8-5001-4623-8dc2-f2216bd4249f\"}":{"__typename":"Favorites","uuid":"ed377cc8-5001-4623-8dc2-f2216bd4249f","photoUrl":"https://ucarecdn.com/6281dff4-c7bc-441d-8deb-4ecc137d27e3/","title":"Volleyball","type":"SPORT"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"b4de3b94-90fd-4060-a8d8-ebf56681e134\"}":{"__typename":"DeepDives","uuid":"b4de3b94-90fd-4060-a8d8-ebf56681e134","content":"\u003cp\u003eThroughout high school, and now even in college, mentorship has played a large role for me, as both a mentor and mentee. I find so much value in asking for advice from those who have already walked the path that I am taking, and hope to encourage others the way that I have been by my experiences. Mentorship is just incredibly rewarding!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"dc0216c1-decc-423a-a357-42e794542b35\"}":{"__typename":"DeepDives","uuid":"dc0216c1-decc-423a-a357-42e794542b35","content":"\u003cp\u003eMy advice for my middle \u003cem\u003eand\u003c/em\u003e high school self would be to continue to step out of my comfort zone and put myself out there! Some of the best experiences I have had, both academically and personally, seemed uncomfortable and scary at first but turned out to be great! Also, remember to build meaningful relationships with your professors and peers. It will help you feel supported and might even offer you another mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4fdc3452-9040-4961-8d5b-9e3275c57fe3\"}":{"__typename":"DeepDives","uuid":"4fdc3452-9040-4961-8d5b-9e3275c57fe3","content":"\u003cp\u003eMost books, interviews, and documentaries (that feature known figures) usually discuss a mentor who helped the main character out. It is really tricky to navigate your way through a process, especially when it is your first time, without help, so that's where mentorship comes into play!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis really applies to me because of the incredible experiences I have had with my mentors. The most notable would by my high school guidance counselor. Her and I worked together for three years, so she learned about my interests and values and continuously supported me. She also connected me with other resources that could help me in my journey to college, and introduced me to some amazing clubs that I later joined. I still reach out to her even after graduating.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"170ded67-3e30-413c-9028-94605fdf3dcd\"}":{"__typename":"DeepDives","uuid":"170ded67-3e30-413c-9028-94605fdf3dcd","content":"\u003cp\u003eI'm kind of a health-nut! I love going on walks and runs, and getting smoothies after. Of course, I am not perfect and do not always do this, but I have found taking care of my health to dramatically improve my ability to focus and work in school. Keep in mind that health is not limited to just nutrition and physical activity, but also sufficient sleep and the relationships that we have!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"2a45a7b9-0e8d-4ba9-9079-a603becdde47\"}":{"__typename":"School","uuid":"2a45a7b9-0e8d-4ba9-9079-a603becdde47","name":"Harry S Truman High School","city":"Levittown","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19057"},"Education:{\"uuid\":\"cc1ad8bb-3c2c-43e4-b9b5-277e9b27375f\"}":{"__typename":"Education","uuid":"cc1ad8bb-3c2c-43e4-b9b5-277e9b27375f","school":{"__ref":"School:{\"uuid\":\"2a45a7b9-0e8d-4ba9-9079-a603becdde47\"}"},"startYear":"2021","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"627715e5-f5d3-42dc-a3fb-48c53c3ac838\"}":{"__typename":"Education","uuid":"627715e5-f5d3-42dc-a3fb-48c53c3ac838","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Molecular Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"203c6c5d-3be4-49ea-93c7-9338fa377db8\"}":{"__typename":"MentorPublicProfile","uuid":"203c6c5d-3be4-49ea-93c7-9338fa377db8","displayName":"Alicia M.","slug":"alicia-mohli","biography":"\u003cp\u003eHello! My name is Alicia (pronounced ali-cee-yuh) and I am a rising sophomore at Princeton University on the premedical track. Although I was originally pursuing Molecular Biology, I discovered a new interest of mine: reading and writing. As someone who is now planning to follow a nontraditional premedical path, I understand how to balance diverse interests and, in turn, create compelling stories. I am committed to guiding students to their “right” path, focusing on time management, leadership, and other important skills (especially for college applications).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have been a mentor to kids aged 5-8 in art, dance, dodgeball, and soccer classes, as well as a tutor for Biology, math, and English, while maintaining exceptional grades throughout high school and being named salutatorian, so I have experience working with a variety of students. Now, as an undergraduate student, I work as a Writing Center Fellow, mentoring students on ways to improve their writing. I also love to work with local communities, and am the community chair for both Princeton’s Acts of Kindness (AOK) and Médecins Sans Frontières (MSF).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs an Algerian-American student, another passion of mine involves integrating my personal interests and culture into my studies, such as working to improve healthcare access for marginalized communities. My background, and the fact that I speak French and Kabyle, in addition to English, has allowed me to understand the challenges that might arise as a minority student. I would love to help tackle those difficulties, as well as offer tips for learning new languages.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlong with mentorship, and on the subject of tutoring, I have won awards for Chemistry and Spanish, so I can effectively teach these concepts, as well as others, to students\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school, I love baking (which is actually helpful to do if you are interested in Chemistry!), playing volleyball, reading, and watching TV shows. With a strong work-ethic and passion for community, I am devoted to be an inspiring mentor who can have a lasting impact on my mentees.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBest,\u003c/p\u003e\u003cp\u003eAlicia\u003c/p\u003e","teachingVideoPlaybackId":"Zg5PBTj1fvAnm9WefndjeEzeF9NXqm00Qr9BRfZvwKh00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was one of the few recipients for Princeton's Mary W. George Research Conference award. After months of hard work and learning how to build a compelling/convincing research paper, I felt relieved to have been recognized for it. Creating a poster for my research subject was another valuable experience, especially because of the presentation(s) I gave with it.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0366b023-affa-4f58-8f20-e92e918ad340\"}"},{"__ref":"Favorites:{\"uuid\":\"ed377cc8-5001-4623-8dc2-f2216bd4249f\"}"}],"causesSupported":[],"major":"Molecular Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b4de3b94-90fd-4060-a8d8-ebf56681e134\"}"},{"__ref":"DeepDives:{\"uuid\":\"dc0216c1-decc-423a-a357-42e794542b35\"}"},{"__ref":"DeepDives:{\"uuid\":\"4fdc3452-9040-4961-8d5b-9e3275c57fe3\"}"},{"__ref":"DeepDives:{\"uuid\":\"170ded67-3e30-413c-9028-94605fdf3dcd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b5886b25-e094-41ad-a2c0-1387f62c428e/-/preview/-/format/jpg/","https://ucarecdn.com/ed8f9fee-641b-412d-af6c-8411857003cf/-/preview/-/format/jpg/","https://ucarecdn.com/fc4040bd-04ca-4cbb-80b1-e712b8a80a7b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cc1ad8bb-3c2c-43e4-b9b5-277e9b27375f\"}"},{"__ref":"Education:{\"uuid\":\"627715e5-f5d3-42dc-a3fb-48c53c3ac838\"}"}],"hiredAt":"2025-05-26T09:45:36.967Z","topics":["K-5 Grade Math","Calculus","Precalculus / Trigonometry","Algebra II","Biology","Chemistry","Writing","French","Academic Coaching","Reading"],"communityBadges":["https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alicia-mohli\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"203c6c5d-3be4-49ea-93c7-9338fa377db8\"}"}}},"_sentryTraceData":"e8f70062d715400ea231e832b653c73a-9ec95be8a65de6e1-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e8f70062d715400ea231e832b653c73a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alicia-mohli"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
