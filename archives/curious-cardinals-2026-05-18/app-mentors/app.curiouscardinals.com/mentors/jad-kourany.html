xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d20d7497-90ff-4aca-96ea-19fd3ec56590\"}":{"__typename":"Favorites","uuid":"d20d7497-90ff-4aca-96ea-19fd3ec56590","photoUrl":"https://ucarecdn.com/64f17e77-5669-4a86-96d7-61292aa650f1/","title":"AC Milan","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"60b053bd-0745-47b6-846d-bd6c883693a3\"}":{"__typename":"Favorites","uuid":"60b053bd-0745-47b6-846d-bd6c883693a3","photoUrl":"https://ucarecdn.com/fd203844-b71e-4aa8-b86c-a998e079b4de/","title":"Jayson Tatum","type":"ATHLETE"},"Favorites:{\"uuid\":\"b63d3a86-cb9e-4809-be1c-148c9ca84877\"}":{"__typename":"Favorites","uuid":"b63d3a86-cb9e-4809-be1c-148c9ca84877","photoUrl":"https://ucarecdn.com/0648b1fb-69c9-44eb-a6f6-11d5e443b393/","title":"Headlines - Drake","type":"SONG"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"efc5bd06-ac5e-49a1-bf63-c37b68e3bb1e\"}":{"__typename":"DeepDives","uuid":"efc5bd06-ac5e-49a1-bf63-c37b68e3bb1e","content":"\u003cp\u003eI’ve always been fascinated by how the body works—not just at the surface level, but all the way down to the chemical and molecular interactions that drive everything from muscle movement to memory formation. Studying both chemistry and biology with a concentration in pharmacology lets me explore that intersection in depth. I’m especially interested in how we can manipulate biological systems through medicine to improve people’s lives. This path gives me the scientific foundation to better understand disease, treatment, and the development of new therapeutics, while still leaving room to ask big, curious questions about how and why the body responds the way it does.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d182585b-026e-4ecf-91bd-084dec6039d2\"}":{"__typename":"DeepDives","uuid":"d182585b-026e-4ecf-91bd-084dec6039d2","content":"\u003cp\u003eMy dream job is to become an oncologist. Cancer has had a profound impact on my life—my grandfather passed away from it, and watching him go through treatment opened my eyes to the emotional and physical toll that this disease takes on patients and their families. That experience made me realize how powerful it is to have a physician who can not only deliver expert care, but also show empathy, patience, and support through some of life’s hardest moments. I’m drawn to oncology because it represents the intersection of cutting-edge science and deep human connection. Whether it’s discussing treatment options, celebrating remission, or offering comfort in end-of-life care, oncologists are trusted guides in uncertain times. I hope to be that kind of doctor—one who uses both knowledge and compassion to help patients navigate their journeys with dignity and hope.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"b7ed47a2-33f5-4add-8d0b-7090f21e7045\"}":{"__typename":"DeepDives","uuid":"b7ed47a2-33f5-4add-8d0b-7090f21e7045","content":"\u003cp\u003eAs the eldest child, I’ve had to figure out a lot on my own—academics, extracurriculars, college applications, and just navigating life in general. It wasn’t always easy, but along the way, I was extremely lucky to have a handful of older friends who took the time to guide me. They answered my questions, gave me perspective, and helped me avoid mistakes they had made. That kind of support made a huge difference—it gave me confidence, direction, and the belief that I belonged in the spaces I was reaching for. Now, I want to pay that forward. Mentorship, to me, is about being that steady, encouraging voice for someone else. It’s about helping students see their potential, feel understood, and realize they don’t have to figure it all out alone, because I know firsthand how powerful that kind of guidance can be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"10efca30-a08d-4b4c-b256-3c579a44ce3c\"}":{"__typename":"DeepDives","uuid":"10efca30-a08d-4b4c-b256-3c579a44ce3c","content":"\u003cp\u003eIn my free time, I like to keep things balanced between relaxing and staying active. I’ve been playing guitar for a while, and it’s something I always come back to—whether I’m learning new songs or just playing for fun, it helps me decompress. I also enjoy listening to music, especially when I’m driving or working. I try to stay active by playing sports like basketball or soccer with friends whenever I can. I’m into video games too—it’s a fun way to unwind and stay connected with friends. Most of all, I really value spending time with the people close to me, whether that’s family dinners, late-night talks, or just hanging out.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"c0091d89-bc7a-4e85-8802-6b8d24f424c6\"}":{"__typename":"School","uuid":"c0091d89-bc7a-4e85-8802-6b8d24f424c6","name":"Green Level High School","city":"Cary","type":"HIGH","state":"North Carolina","country":"United States","zip":"27519"},"Education:{\"uuid\":\"bcdc16c1-9a29-4eb1-8260-3b02edb17d8a\"}":{"__typename":"Education","uuid":"bcdc16c1-9a29-4eb1-8260-3b02edb17d8a","school":{"__ref":"School:{\"uuid\":\"c0091d89-bc7a-4e85-8802-6b8d24f424c6\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"3a55f9f5-e1b5-418f-b462-6ca6dfc441b1\"}":{"__typename":"Education","uuid":"3a55f9f5-e1b5-418f-b462-6ca6dfc441b1","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Chemistry, Biology - Pharmacology Concentration","degree":null},"MentorPublicProfile:{\"uuid\":\"ab94623e-4fcf-4c9e-9849-b70adeedf315\"}":{"__typename":"MentorPublicProfile","uuid":"ab94623e-4fcf-4c9e-9849-b70adeedf315","displayName":"Jad K.","slug":"jad-kourany","biography":"\u003cp\u003eJad Kourany is a rising sophomore at Duke University studying Chemistry and Biology with a concentration in Pharmacology. He currently works at a neurology lab, where he researches how various medications can mitigate epilepsy-related symptoms in mice. His work spans everything from managing the lab’s mouse colony to bench work to analyzing neural activity. Outside the lab, Jad spent over a year as a mathematics instructor at Mathnasium, where he worked with students across a wide age range—from those learning basic addition to those in AP Calculus BC. He enjoyed helping students build not only strong mathematical foundations, but also confidence in their problem-solving abilities, always tailoring his approach to meet the needs of the learner. He’s also a mentor for a high school First Robotics Competition team—Valence Robotics—which recently made it all the way to the First Robotics World Championship in Houston! From designing mechanical systems to troubleshooting late-night code bugs, he loves helping students build not just robots, but leadership and teamwork skills, as well. Additionally, Jad serves as the Rivalry Game Chair for Special Olympics at Duke, where he organizes the annual Duke vs. UNC Special Olympics basketball game held at Cameron Indoor Stadium—a high-energy event that celebrates inclusivity and community. Jad also volunteers at the Durham VA Medical Center, where his love for helping others carries over into a clinical setting. There, he supports patients in the Pain and Anesthesiology clinics through music and aromatherapy, assists with preparing intravenous tubing, and shadows perioperative care visits. He also helps distribute resources about veteran health services to patients awaiting preoperative care. Whether in the lab, classroom, or community, Jad is deeply driven by curiosity and connection. He’s excited to help Curious Cardinals students not only master material, but also build confidence in themselves as thinkers and problem solvers, all while diving deeper into their interests along the way!\u003c/p\u003e","teachingVideoPlaybackId":"anOv01H3YCikbgiBcEwFT01B2bjgGIZYltS6qED7KpgvQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d20d7497-90ff-4aca-96ea-19fd3ec56590\"}"},{"__ref":"Favorites:{\"uuid\":\"60b053bd-0745-47b6-846d-bd6c883693a3\"}"},{"__ref":"Favorites:{\"uuid\":\"b63d3a86-cb9e-4809-be1c-148c9ca84877\"}"}],"causesSupported":[],"major":"Chemistry, Biology - Pharmacology Concentration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"efc5bd06-ac5e-49a1-bf63-c37b68e3bb1e\"}"},{"__ref":"DeepDives:{\"uuid\":\"d182585b-026e-4ecf-91bd-084dec6039d2\"}"},{"__ref":"DeepDives:{\"uuid\":\
