xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"f225a043-417b-47a1-9166-aaf7fd6ec3c3\"}":{"__typename":"DeepDives","uuid":"f225a043-417b-47a1-9166-aaf7fd6ec3c3","content":"\u003cp\u003eMy brother has always been my mentor and biggest role model. When I was about 14 years old, my mother was diagnosed with Alzheimers, so for much of my life, I grew up without her. There was a lot of empty space when she left us, and I often felt really lonely knowing that everyone around me had their mom's there when I didn't.\u003cbr\u003e\u003cbr\u003eMy brother really filled the empty space that was left when she left us, motivating me to do my best throughout high school, whether it be in school or in my relationships with friends and family. Even when we fought and argued over little things, we always found a way to overcome our differences and be there for each other when my mom couldn't be. \u003cbr\u003e\u003cbr\u003eHe's incredibly inspiring, and now we're both at Stanford, and have an incredibly close relationship that we would've never had without the hardships we went through together. He is an amazing teacher, and is where I derive tons of inspiration from!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"26bde324-a5fc-4f18-ae7c-3df1accfd24f\"}":{"__typename":"Education","uuid":"26bde324-a5fc-4f18-ae7c-3df1accfd24f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Computation","degree":"Bachelor of Science"},"School:{\"uuid\":\"a373e08a-7d7a-4e0f-aac7-a5703c506252\"}":{"__typename":"School","uuid":"a373e08a-7d7a-4e0f-aac7-a5703c506252","name":"San Marcos High School","city":"San Marcos","type":"HIGH","state":"Texas","country":"United States","zip":"78666"},"Education:{\"uuid\":\"1a9c4abc-7808-49b9-bea3-e9171184f8b1\"}":{"__typename":"Education","uuid":"1a9c4abc-7808-49b9-bea3-e9171184f8b1","school":{"__ref":"School:{\"uuid\":\"a373e08a-7d7a-4e0f-aac7-a5703c506252\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"0b6147fe-4266-46ae-b049-6a93c2136601\"}":{"__typename":"MentorPublicProfile","uuid":"0b6147fe-4266-46ae-b049-6a93c2136601","displayName":"Isabella R.","slug":"isabella-russo","biography":"\u003cp\u003eBella is a sophomore student at Stanford University pursuing a degree in biomedical computation, with the ultimate goal of attending medical school. She grew up in Austin, Texas, where she would frequently compete in jumping and dressage horseback riding around the state! Now, she rides on the dressage team at Stanford and plays polo!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHer interest in mentoring first came about when she realized how underserved her own school was, and realized that many students didn’t know the proper steps that needed to be taken in order to succeed after high school. That led her to creating a 501(c)(3) non-profit organization called Pathways Mentoring. Her non-profit allows older students to mentor younger students, helping them every step of the way to college, from finding out what clubs to be in, to ACT/SAT prep, and finally when writing their college applications. Her ultimate goal in founding Pathways was to give students who never thought they would have a chance at a prestigious school an opportunity to reach their full potential.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford now, Bella is still involved in mentorship, as she recently became a mentor to high school students who are hoping to become doctors one day. Now, she spends time working in labs studying stroke therapies, and working in the ER clinic on weekends.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe finds medicine extremely exciting, and spent all of last summer working in the lab to develop a soon-to-be-published project that explores how various microRNAs can play a role in increasing survival rates after stroke injuries.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, Bella loves animals and the outdoors. She even occasionally babysits professors' dogs in her dorm room, and recently adopted a cat named Milo, who now lives in her dorm as well. She loves to talk about polo, animals, and playing tennis!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"kpnSInNOKq3JfU7YpMIm00aER6o4uKfQ6HqdnjaRJUS8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Computation","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f225a043-417b-47a1-9166-aaf7fd6ec3c3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/785f51b4-bd52-468d-9bbe-63571b306c8d/-/preview/-/format/jpg/","https://ucarecdn.com/082951a1-f9b0-47a2-a41a-c95c5d5cec2f/-/preview/-/format/jpg/","https://ucarecdn.com/8d104198-108d-43bf-bbb7-991bc9801ea1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"26bde324-a5fc-4f18-ae7c-3df1accfd24f\"}"},{"__ref":"Education:{\"uuid\":\"1a9c4abc
