xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d3c76619-962e-43e6-b380-fd496e4bb6ba\"}":{"__typename":"DeepDives","uuid":"d3c76619-962e-43e6-b380-fd496e4bb6ba","content":"\u003cp\u003eI have always had a diverse range of interests and made sure to explore that while taking college courses. I ended up deciding to study biology because I wanted to have the science background, including laboratory research experience, that would prepare for me for graduate school and a variety of careers in the science field.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"d42366a5-9329-4e6b-b335-6ffa04c18900\"}":{"__typename":"DeepDives","uuid":"d42366a5-9329-4e6b-b335-6ffa04c18900","content":"\u003cp\u003eMy greatest role model and mentor has always been my dad. Not only has he always been supportive of my many interests, no matter where they might take me, but he has always made the time to share his interests with me. Growing up, he made sure to show me places and projects that he was excited about which taught me the importance of sharing and pursuing passion projects. He is the reason I am confident about my ability to contribute to the world, through both my academic interests and beyond. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8d3c399c-6136-46f2-acc1-840dde7c6a55\"}":{"__typename":"DeepDives","uuid":"8d3c399c-6136-46f2-acc1-840dde7c6a55","content":"\u003cp\u003eMy dream job would apply science innovation to the fight against climate change. I hope to work in the biotechnology space, applying biological tools to tackle the most pressing issues in climate change related to food, agriculture, ecosystem restoration, biodiversity, oceans and more. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"ec56b143-7fec-415b-9db2-18225c02fa3d\"}":{"__typename":"DeepDives","uuid":"ec56b143-7fec-415b-9db2-18225c02fa3d","content":"\u003cp\u003eI come from a culturally mixed family and grew up in a multilingual household. My father is from Puerto Rico, while my mother is from Germany. Not only has that taught me about the value of learning about perspectives and experiences from various backgrounds, but it has also shown me how valuable language and cultural education can be. I would be excited to mentor students in German and Spanish language and culture, which I have experience teaching and tutoring in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"13829731-8084-4dae-be56-8a35b22f3ad3\"}":{"__typename":"School","uuid":"13829731-8084-4dae-be56-8a35b22f3ad3","name":"Lick Wilmerding High School","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94112"},"E
