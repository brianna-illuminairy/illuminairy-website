-22f7-49e6-ba6d-c9657c7b5ff9\"}":{"__typename":"DeepDives","uuid":"69195394-22f7-49e6-ba6d-c9657c7b5ff9","content":null,"videoPlaybackId":"wWRvXterkOEGX2tM02LgvWnhGGHeRnfIuhlCXO3E2now","question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c0eb41ea-e27d-429d-8999-1c1cbf8f01fd\"}":{"__typename":"DeepDives","uuid":"c0eb41ea-e27d-429d-8999-1c1cbf8f01fd","content":null,"videoPlaybackId":"24v2lF65UE900o6avK2N00cuYfw01avA102HnYqcr98QXeQ","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"9e94c858-2f6f-4ac8-887f-cd9b4e8322df\"}":{"__typename":"School","uuid":"9e94c858-2f6f-4ac8-887f-cd9b4e8322df","name":"Roosevelt High School","city":"Seattle","type":"HIGH","state":"Washington","country":"United States","zip":"98115"},"Education:{\"uuid\":\"7f860c52-0fdd-4b80-96f6-3114d1977ffc\"}":{"__typename":"Education","uuid":"7f860c52-0fdd-4b80-96f6-3114d1977ffc","school":{"__ref":"School:{\"uuid\":\"9e94c858-2f6f-4ac8-887f-cd9b4e8322df\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}":{"__typename":"School","uuid":"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5","name":"New York University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10012"},"Education:{\"uuid\":\"d07c3910-2df4-41a7-84fd-ccd1a556662d\"}":{"__typename":"Education","uuid":"d07c3910-2df4-41a7-84fd-ccd1a556662d","school":{"__ref":"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Drama","degree":null},"MentorPublicProfile:{\"uuid\":\"d03ce93b-4918-4ebb-a923-2784e1759ce0\"}":{"__typename":"MentorPublicProfile","uuid":"d03ce93b-4918-4ebb-a923-2784e1759ce0","displayName":"Bito B.","slug":"bito-boucher","biography":"\u003cp\u003e\u003cstrong\u003eBito Boucher\u003c/strong\u003e is a New York based Mexican Canadian actor, director, playwright, and teaching artist who makes performance that thinks with the imaginative body and asks students to do the same. Trained internationally across \u003cstrong\u003eNew York, Berlin, Amsterdam, London, and Vermont\u003c/strong\u003e, Bito is a graduate of \u003cstrong\u003eNYU Tisch Drama\u003c/strong\u003e, where they studied with the \u003cstrong\u003eAtlantic Acting School\u003c/strong\u003e, \u003cstrong\u003eExperimental Theatre Wing\u003c/strong\u003e, the \u003cstrong\u003eInternational Theatre Workshop in Amsterdam\u003c/strong\u003e, and the \u003cstrong\u003eStanislavski, Brecht, and Beyond\u003c/strong\u003e program in Berlin. Their work is grounded in classical technique while actively questioning form, power, and the function of performance in contemporary society.\u003c/p\u003e\u003cp\u003eWith over \u003cstrong\u003e11 years of dance training\u003c/strong\u003e in Ballet, Modern, Tap, Hip Hop, and Contemporary styles, Bito centers embodiment as the foundation of artistic practice. Their teaching integrates physical acting, gesture, rhythm, spatial awareness, and vocal freedom, drawing from \u003cstrong\u003eMichael Chekhov technique\u003c/strong\u003e, \u003cstrong\u003eGrotowski-based physical work\u003c/strong\u003e, \u003cstrong\u003eSuzuki and Viewpoints\u003c/strong\u003e, and extensive voice training in \u003cstrong\u003eFitzmaurice, Linklater, and Roy Hart\u003c/strong\u003e methods. In the classroom, Bito emphasizes process over product, encouraging students to take creative risks, develop disciplined physical presence, and understand technique as a living, adaptive system rather than a fixed methodology.\u003c/p\u003e\u003cp\u003eBito has worked extensively across classical and contemporary theatre, devised performance, film, and television. Select credits include \u003cem\u003eThe Bacchae\u003c/em\u003e (dir. Kevin Kuhlke), \u003cem\u003eAnxiety Is the Dizziness of Freedom\u003c/em\u003e (dir. Mei Ann Teo), \u003cem\u003eA Midsummer Night’s Dream\u003c/em\u003e, \u003cem\u003eBilly Elliot the Musical\u003c/em\u003e, \u003cem\u003eThe Book Signing\u003c/em\u003e (dir. Bob Giraldi), and appearances on productions for AMC and ITV America. Their work often lives at the intersection of text and movement, prioritizing ensemble collaboration and form-driven storytelling.\u003c/p\u003e\u003cp\u003eAs a director and playwright, Bito is drawn to \u003cstrong\u003etransformative and postdramatic creation\u003c/strong\u003e, using experimentation of form, aesthetic, and \u003cstrong\u003eBrechtian gestus\u003c/strong\u003e as tools for inquiry, disruption, and social reflection. Original and devised works include \u003cem\u003eThe Seagullmachine\u003c/em\u003e, \u003cem\u003eThe Rite of Spring\u003c/em\u003e, developed through workshops, festivals, and community-based performance settings. Their artistic and pedagogical influences include \u003cstrong\u003eHeiner Müller, Bertolt Brecht, Robert Wilson, Anton Chekhov\u003c/strong\u003e, and contemporary European theatre-makers.\u003c/p\u003e\u003cp\u003eAbove all, Bito is committed to fostering \u003cstrong\u003ebrave performance\u003c/strong\u003e that value rigor, curiosity, generosity, and embodied intelligence. Their teaching practice prioritizes accessibility, collaboration, and critical thinking, supporting students in developing sustainable, daring, and thoughtful artistic practices that extend beyond the studio and into the world.\u003c/p\u003e\u003cp\u003eInstagram: \u003cstrong\u003e@bitoboucher\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"RPgw3YO8FxK1sAyMa6ZYjtiFlAPsdZveQHw64SKQFUA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eApart from my performance studio classes and performances with NYU Tisch Mainstage, my academic courses at NYU have been focused\u003c/p\u003e\u003cp\u003eon studying Postdramatictheatre while also understanding the classical European theatre and its history. \u003cem\u003eContemporary European Drama\u003c/em\u003e and\u003c/p\u003e\u003cp\u003e\u003cem\u003eMajor Playwrights: Chekhov\u003c/em\u003e both taught by Professor Alisa Zhulina, taught me the history of European theatre with a focus on Anton\u003c/p\u003e\u003cp\u003eChekhov’s body of work. Studying, \u003cem\u003eKey Issues and Intersectional Approaches in German Theater of the 20th Century\u003c/em\u003e with Professor\u003c/p\u003e\u003cp\u003eChristine Korte in Berlin taught me the foundations of German theatre from Schiller, Max Reinhardt, to Piscator’s Documentary Theatre,\u003c/p\u003e\u003cp\u003eHandke, and Brecht. As well as contemporizes like Frank Castorf, Thomas Ostermeier, and Florentina Holzinger. Then continuing with \u003cem\u003eThe\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eGerman Intellectual Tradition\u003c/em\u003e with Professor Avital Ronell, studying the psychoanalytical traditions of Germany and its influence on theatre,\u003c/p\u003e\u003cp\u003eculminating in a final thesis essay and performance of Heiner Müllers \u003cem\u003eHamletmachine. \u003c/em\u003eSupported by classes that disrupt conventional\u003c/p\u003e\u003cp\u003eknowledge of art: \u003cem\u003eThe Avant-Garde\u003c/em\u003e with Professor Noah Ortega, \u003cem\u003eThe Art Of Now\u003c/em\u003e with Professor Alhena Katsof, \u003cem\u003eGreen World\u003c/em\u003e with Professor\u003c/p\u003e\u003cp\u003eDeville Cohen and \u003cem\u003eFilm: A Transformative Process\u003c/em\u003e with Professor Chitra Neogy with a focus on Andrei Tarkovsky’s transformative films.\u003c/p\u003e\u003cp\u003eConcluding with an independently produced senior thesis project, \u003cem\u003eThe Seagullmachine, \u003c/em\u003edeconstructing Chekhov’s \u003cem\u003eThe Seagull\u003c/em\u003e with the form\u003c/p\u003e\u003cp\u003eand gesture of Müllers \u003cem\u003eHamletmachine.\u003c/em\u003e\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e69709c3-0237-49d2-934c-e476ba55757d\"}"},{"__ref":"Favorites:{\"uuid\":\"742ccbde-8990-42b4-83de-876aafbd2798\"}"}],"causesSupported":[],"major":"Drama","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bcaadc72-c231-4357-91d4-ad87d435fcaf\"}"},{"__ref":"DeepDives:{\"uuid\":\"a749c5bb-6a84-4671-8401-bee7940a67ed\"}"},{"__ref":"DeepDives:{\"uuid\":\"69195394-22f7-49e6-ba6d-c9657c7b5ff9\"}"},{"__ref":"DeepDives:{\"uuid\":\"c0eb41ea-e27d-429d-8999-1c1cbf8f01fd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5ccc7595-670d-4ead-b705-7fc76695c719/-/preview/-/format/jpg/","https://ucarecdn.com/54dc3ca0-4ac8-47c7-88a2-45bd3d3a40f7/-/preview/-/format/jpg/","https://ucarecdn.com/557fa8e5-889c-41cb-9389-912eeb4d6774/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7f860c52-0fdd-4b80-96f6-3114d1977ffc\"}"},{"__ref":"Education:{\"uuid\":\"d07c3910-2df4-41a7-84fd-ccd1a556662d\"}"}],"hiredAt":"2026-01-28T02:06:54.933Z","topics":["Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","Creative Writing","Film / Theater","History Project","K-6 Storybook","Video / Photography","Business / Entrepreneurship","Journalism","Law / Government / Policy","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/9fa2d8bf-132f-4356-a39d-e6f0aecb3e5b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"bito-boucher\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d03ce93b-4918-4ebb-a923-2784e1759ce0\"}"}}},"_sentryTraceData":"a57023fa057044de8d6006d5d3e8f5be-84990f82aea24946-0","_sentryBaggage":"sentry-environment=verc
