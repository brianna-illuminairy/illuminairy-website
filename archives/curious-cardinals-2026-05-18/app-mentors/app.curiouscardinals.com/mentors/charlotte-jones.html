:{\"uuid\":\"1e51133e-9c37-4996-bf08-9cbaf7f8c571\"}":{"__typename":"DeepDives","uuid":"1e51133e-9c37-4996-bf08-9cbaf7f8c571","content":"\u003cp\u003eI got lucky that I was able to pursue both my passion for Computer Science--which I see as an intersection of math, puzzle, logic, and art-- as well as Dance which has been a field I was so grateful to explore academically as well as technically! If I had more time I would have majored in 5 more disciplines such as English Literature, FIlm, Journalism, Data Science, and Theatre-- the list is endless I'm a forever learner!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8c8f7c58-fcfe-4ac5-888a-c0fcb86807ef\"}":{"__typename":"DeepDives","uuid":"8c8f7c58-fcfe-4ac5-888a-c0fcb86807ef","content":"\u003cp\u003eMeryl Streep.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"d43289c0-d1fc-4bec-8fb9-172905a38c87\"}":{"__typename":"DeepDives","uuid":"d43289c0-d1fc-4bec-8fb9-172905a38c87","content":"\u003cp\u003eGame Design and Development! I love watching the way games evolve, grow, and are shaped by the developers/mentees I have had!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"9cab270c-f68e-4861-9583-22b3a2a9b5bc\"}":{"__typename":"Education","uuid":"9cab270c-f68e-4861-9583-22b3a2a9b5bc","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2022","major":"Computer Science and Dance","degree":null},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"0aec9305-9fda-4e4e-94cd-615b9499d2d1\"}":{"__typename":"Education","uuid":"0aec9305-9fda-4e4e-94cd-615b9499d2d1","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"859eaa43-c40d-40d2-9f62-ed0d59328a46\"}":{"__typename":"MentorPublicProfile","uuid":"859eaa43-c40d-40d2-9f62-ed0d59328a46","displayName":"Charlotte J.","slug":"charlotte-jones","biography":"\u003cp\u003eCharlotte recently graduated from Northwestern University, where she double majored in Computer Science and Dance with a minor in English Literature and received her master's in Computer Science with a concentration in Human Computer Interaction (HCI). Charlotte led the Peer Tutoring Program at Riverdale Country School and was  a Teacher's Assistant \u0026amp; Peer Mentor for the Computer Science Department during her time at Northwestern where she held office hours, taught weekly tutorial sessions and mentored her amazing students! She also received the Peter and Adrienne Barris Service Award for excellence in teaching! Specifically interested in Human Computer Interaction, Artificial Intelligence, and App Development, she is a proud member of WiC (Women in Computing) where she promotes her fellow Women in STEM. She sees CS as an intersection of logic and creativity —a fusion of math, puzzles, and art. Fluent in Spanish, Char also studied ethics, international policy, Arabic, and Mandarin in D.C. at the School for Ethics and Global Leadership. She has continued her studies with the school as a guest speaker in Shakespeare as well as a mentee of Carl Wilkens in Rwanda. Her biggest passion project is founding Mission S.P.A. (Sanitary Product Awareness), a non-profit that collects and donates sanitary products to local NYC shelters along with schools in Nepal. When Charlotte is not computing, dancing, or advocating for gender equity worldwide, she is training for triathlons, watching House, and cooking vegan pasta. Her eclectic academic interests match her enthusiastic, warm, and individualized approach to teaching, mentoring, tutoring, and learning.\u003c/p\u003e","teachingVideoPlaybackId":"ii5nYnGJDatWyWWPZwtdauEoMu4CCaL9yvkfvBiut88","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was so honored to have received the Adrianne and Barris Award for excellence in teaching as a TA at Northwestern in the Computer Science Department! The moment a topic clicks for students  is pure JOY!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ce566101-9327-4988-b8e0-7a195f2da18b\"}"},{"__ref":"Favorites:{\"uuid\":\"adf0a5cb-3fc8-411e-a45e-c5ca1905b539\"}"},{"__ref":"Favorites:{\"uuid\":\"873c512d-774d-4b4a-af9d-f50efee43eb3\"}"}],"causesSupported":[],"major":"Computer Science and Dance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"070ab3e1-1aa8-41fa-b103-3f06a0b4d28a\"}"},{"__ref":"DeepDives:{\"uuid\":\"1e51133e-9c37-4996-bf08-9cbaf7f8c571\"}"},{"__ref":"DeepDives:{\"uuid\":\"8c8f7c58-fcfe-4ac5-888a-c0fcb86807ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"d43289c0-d1fc-4bec-8fb9-172905a38c87\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3f4f061b-0dc1-468f-beb5-40c802874ef7/-/preview/-/format/jpg/","https://ucarecdn.com/a1482e2
