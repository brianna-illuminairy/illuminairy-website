xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"97b25708-793c-46ba-aa8c-32e2f79687c0\"}":{"__typename":"Favorites","uuid":"97b25708-793c-46ba-aa8c-32e2f79687c0","photoUrl":"https://ucarecdn.com/8cfaadc8-891a-4079-b1b3-795e2451c204/","title":"The Devil Wears Prada","type":"MOVIE"},"Favorites:{\"uuid\":\"ccbf2f72-ef4c-46f2-9448-3f38dc9304c5\"}":{"__typename":"Favorites","uuid":"ccbf2f72-ef4c-46f2-9448-3f38dc9304c5","photoUrl":"https://ucarecdn.com/f07c7ec4-1226-4666-8d90-3b1ccf229031/","title":"The Nightingale by Kristin Hannah","type":"BOOK"},"Favorites:{\"uuid\":\"ffa09294-7c86-4b59-9f9b-bb109cd3ac42\"}":{"__typename":"Favorites","uuid":"ffa09294-7c86-4b59-9f9b-bb109cd3ac42","photoUrl":"https://ucarecdn.com/142d898c-3167-4187-84aa-59fb9a33490c/","title":"Jonathan Bailey","type":"ACTOR"},"CausesSupported:{\"uuid\":\"eaa1fc70-8a50-468e-b685-e25ef5a16387\"}":{"__typename":"CausesSupported","uuid":"eaa1fc70-8a50-468e-b685-e25ef5a16387","name":"SPCA","description":"\u003cp\u003eI volunteered at the Maryland SPCA during college! The best people and animals🩷\u003c/p\u003e","photoUrl":"https://ucarecdn.com/2aae343f-53ee-4f3f-8dcd-00dcbc590919/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"53ef5059-9dd0-4678-a3c6-9935ce99b980\"}":{"__typename":"DeepDives","uuid":"53ef5059-9dd0-4678-a3c6-9935ce99b980","content":"\u003cp\u003eI chose to major in Molecular \u0026amp; Cellular Biology because I am interested in understanding disease at its most fundamental levels. In high school, I was drawn to lectures in AP Biology on genetics and basic molecular signaling pathways because they offered a structured framework to explain the complexity of human health and development. Once I began college, I found that molecular biology gave me the tools to think critically about disease mechanisms and drug targets, while emphasizing experimental design. Through my coursework and lab experiences, I explored how cells respond to certain signals and mutations that disrupt physiological systems, and how basic research can translate into targeted medical therapies. The major also gave me a strong foundation to ask more specific questions in research settings. When I joined labs studying genetics and tissue modeling, I could connect what I saw at the bench to what I had learned in class. I appreciated how molecular biology demanded both technical accuracy and conceptual precision. That combination continues to appeal to me, especially as I move toward a career where research and clinical care are closely linked.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"4ee6f3b0-dd4a-416b-8281-7273b4c9f400\"}":{"__typename":"DeepDives","uuid":"4ee6f3b0-dd4a-416b-8281-7273b4c9f400","content":"\u003cp\u003eThe greatest inspiration in my life has been my mom. Despite the challenges of being a low-income family, my parents worked tirelessly to provide my brother and me with opportunities, including sending us to a prestigious private school. More than anything, she prioritized my happiness, and passions, always encouraging me to explore my interests fearlessly. She instilled in me the values of perseverance and resilience, qualities that have been instrumental in shaping my academic and personal journey. Her encouragement to embrace new experiences fostered a deep love of learning that has guided me throughout my life. From an early age, I was drawn to the thrill of discovery and mastering new techniques, from experiments and literature to new singing or painting skills. This mindset not only fueled my academic ambitions, but also shaped my desire to pursue an MD-PhD program. The intersection of medicine and research represents the ultimate opportunity to continue learning and push the boundaries of knowledge to improve patient care. My mother’s influence taught me that learning is a lifelong pursuit, and I hope to spend my life contributing meaningfully to both science and medicine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"5ffc5ccf-6dbc-4d3a-b693-fd3c123348a7\"}":{"__typename":"DeepDives","uuid":"5ffc5ccf-6dbc-4d3a-b693-fd3c123348a7","content":"\u003cp\u003eI grew up as an immigrant Korean in Oklahoma. My parents and I were the first in our family to leave Korea, my parents worked hard to send us to the best school in the state, a private school where everyone already knew each other and I was the only Asian in my grade. I stood out racially, culturally, linguistically, and socioeconomically, and for a while, that made me feel like I was always a step behind. Over time, being in the minority pushed me to build independence and resilience. I didn’t have older siblings or family friends to guide me, so I learned to speak up for myself and ask questions even when they felt awkward, reaching out to teachers and potential mentors for opportunities without hesitation. That early experience of standing alone has shaped how I move through the world, becoming fearless about seeking out help and comfortable forging my own path when there isn’t one. I know this will serve me well in life, where the ability to think independently and advocate for your ideas, often even in the face of adversity, is essential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f035e3f7-8ffd-4227-b887-c0eafbb46759\"}":{"__typename":"DeepDives","uuid":"f035e3f7-8ffd-4227-b887-c0eafbb46759","content":"\u003cp\u003eAs a student, we have to balance a myriad of commitments and our own physical and mental health. It gets overwhelming sometimes, and the best way I've found works for myself is to be organized with my time. One of the most important steps I take to manage stress is protecting time to decompress. For me, that includes hobbies like spending time with animals, visiting cafes, and walking outside. I often combine these with work to create a more comfortable environment, coding with my foster cat sleeping by me or outlining essays at a new cafe. These habits help reset my focus and improve my ability to work under pressure.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f1d2224b-585b-442c-91c5-a204fdb86315\"}":{"__typename":"School","uuid":"f1d2224b-585b-442c-91c5-a204fdb86315","name":"Casady School","city":"Oklahoma City","type":"HIGH","state":"Oklahoma","country":"United States","zip":"73120"},"Education:{\"uuid\":\"51380edd-f99d-48e0-aea8-59faf4b132a0\"}":{"__typename":"Education","uuid":"51380edd-f99d-48e0-aea8-59faf4b132a0","school":{"__ref":"School:{\"uuid\":\"f1d2224b-585b-442c-91c5-a204fdb86315\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e3a7e210-8e3e-498f-af74-57a9976df470\"}":{"__typename":"School","uuid":"e3a7e210-8e3e-498f-af74-57a9976df470","name":"Johns Hopkins University","city":"Baltimore","type":"COLLEGE","state":"Maryland","country":"United States","zip":"21218"},"Education:{\"uuid\":\"876b6bb5-373f-41c6-8288-853dc76c32ff\"}":{"__typename":"Education","uuid":"876b6bb5-373f-41c6-8288-853dc76c32ff","school":{"__ref":"School:{\"uuid\":\"e3a7e210-8e3e-498f-af74-57a9976df470\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Molecular \u0026 Cellular Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"b8dcd235-30bc-4e4a-b596-823f2093c42d\"}":{"__typename":"MentorPublicProfile","uuid":"b8dcd235-30bc-4e4a-b596-823f2093c42d","displayName":"Kyuna L.","slug":"kyuna-lee","biography":"\u003cp\u003eHi! My name is Kyuna (pronounced like the letter Q then \"na\"), and I am so excited to meet you! I just graduated from Johns Hopkins with a major in Molecular \u0026amp; Cellular Biology and a minor in Classics. I am currently working as a dialysis tech for a year while I apply to MD-PhD programs. As a future half-PhD student, I was especially immersed in research for all three years of my undergrad in a variety of research types (e.g., translational/wet, clinical, computational, and classics research), so if you have questions about getting started or progressing in a research lab, I can hopefully help with that!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am super passionate about mentorship and helping you as much as I possibly can, so I am incredibly eager for the chance to be a part of your journey. Having had a variety of mentors, I know what it’s like to have a bad one. My first research experience was senior year of high school, and my mentor was unfortunately, disinterested and impatient. I left the experience with a skewed perception of what a research mentorship looks like. Although I learned a lot, I had a difficult time maintaining my passion for research. I entered college, unsure of my future as a young investigator. Despite my poor experience, I decided to give research another chance and join a lab, where I met my current mentor, who also became one of my good friends. She has eternally changed my perspective on mentorship, showing me what it looks like to be patient, thorough, and have a genuine passion for science and helping patients, and I look up to her immensely. After my first year in the lab, I decided to found a student organization at Hopkins that would give an opportunity to underclassmen to connect with experienced upperclassmen to always be able to ask for advice and to give myself a chance to exhibit the same qualities my mentor taught me. My philosophy with this association has been to foster the strong peer mentorships I never had the chance to have. Since then, I’ve had 40+ mentees, and it gives me immense joy to be able to answer their questions and help them in their own journeys as much as I can.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOther than academics, I like to spend most of my free time with animals (I absolutely love volunteering at the animal shelter and fostering dogs and cats!), singing/practicing music (including trying to learn every type of instrument I can), and drawing/painting! I also adore sitcoms (Friends, Brooklyn 99, Modern Family, New Girl, you name it)!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI hope to meet you soon, and please don't hesitate to reach out with any questions! :)\u003c/p\u003e","teachingVideoPlaybackId":"8uYz00lrMVJqeCF5yCNnL5eLowjtBW1shMYYG1ocr34E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"97b25708-793c-46ba-aa8c-32e2f79687c0\"}"},{"__ref":"Favorites:{\"uuid\":\"ccbf2f72-ef4c-46f2-9448-3f38dc9304c5\"}"},{"__ref":"Favorites:{\"uuid\":\"ffa09294-7c86-4b59-9f9b-bb109cd3ac42\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"eaa1fc70-8a50-468e-b685-e25ef5a16387\"}"}],"major":"Molecular \u0026 Cellular Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"53ef5059-9dd0-4678-a3c6-9935ce99b980\"}"},{"__ref":"DeepDives:{\"uuid\":\"4ee6f3b0-dd4a-416b-8281-7273b4c9f400\"}"},{"__ref":"DeepDives:{\"uuid\":\"5ffc5ccf-6dbc-4d3a-b693-fd3c123348a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"f035e3f7-8ffd-4227-b887-c0eafbb46759\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ff886a63-6e64-4c32-ac8c-7c54288c9cea/-/preview/-/format/jpg/","https://ucarecdn.com/09867bf9-1a5e-457c-81ec-84c7dca4e63d/-/preview/-/format/jpg/","https://ucarecdn.com/9f40b333-fd21-49d0-b4db-dfaaf3cfd194/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"51380edd-f99d-48e0-aea8-59faf4b132a0\"}"},{"__ref":"Education:{\"uuid\":\"876b6bb5-373f-41c6-8288-853dc76c32ff\"}"}],"hiredAt":"2025-08-20T15:45:13.325Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","6-8 Grade Science","Chemistry","Biology","Academic Coaching","Executive Function","College Essay Writing","K-6 Storybook","Creative Writing","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/4d492211-7b83-4aa5-a016-8991edde1bb6/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kyuna-lee\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b8dcd235-30bc-4e4a-b596-823f2093c42d\"}"}}},"_sentryTraceData":"b53c1dc99ee44b9c97f963e04acf6c21-9f6983d6e43473af-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b53c1dc99ee44b9c97f963e04acf6c21,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"kyuna-lee"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"
