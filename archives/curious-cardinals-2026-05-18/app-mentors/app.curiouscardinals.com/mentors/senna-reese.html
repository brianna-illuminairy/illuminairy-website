xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"884bf846-c6f4-48b3-b1cd-8640a6bbcf90\"}":{"__typename":"DeepDives","uuid":"884bf846-c6f4-48b3-b1cd-8640a6bbcf90","content":"\u003cp\u003eI chose to be an applied math major because I am fascinated by how math touches all aspects of our lives from personal decisions to public policy. I am also drawn to mathematics because of how it bypasses language barriers. It is a universal language! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"eb96301c-5102-4c67-a2b0-30cb535efaf7\"}":{"__typename":"DeepDives","uuid":"eb96301c-5102-4c67-a2b0-30cb535efaf7","content":"\u003cp\u003eI have known first-hand the benefits of one-on-one mentorship! In my junior year of high school, my math teacher agreed to meet with me outside of school hours to review additional topics not covered in class. He nurtured my interest and confidence in mathematics, which directly led me to pursue my major in college! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"598b8229-af6c-4871-b8f0-1fc7a0655b33\"}":{"__typename":"DeepDives","uuid":"598b8229-af6c-4871-b8f0-1fc7a0655b33","content":"\u003cp\u003eThere is no harm in trying! Going into high school, I thought that I was not going to be smart enough to take linear algebra. Rather than getting discouraged, I signed up for the class and I am so grateful that I did. I was able to gain more confidence in mathematics and brought this confidence to my college courses!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7f95fd5f-f08b-40ca-a000-a5a0ef439f4a\"}":{"__typename":"DeepDives","uuid":"7f95fd5f-f08b-40ca-a000-a5a0ef439f4a","content":"\u003cp\u003eIt really depends on the day! Some days, I can be found going on a walk with friends, playing soccer or doing yoga classes. Other days, I am watching my favorite show, \u003cem\u003eSurvivor, \u003c/em\u003edoing jigsaw puzzles, or catching up on the many podcasts that I listen to. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122\"}":{"__typename":"School","uuid":"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122","name":"Spence School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"9fa5206a-71a3-45d3-96a4-ccb77ef15241\"}":{"__typename":"Education","uuid":"9fa5206a-71a3-45d3-96a4-ccb77ef15241","school":{"__ref":"School:{\"uuid\":\"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122\"}"},"startYear":"2010","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"d66abea8-30ce-4579-a1fe-e52dc320026e\"}":{"__typename":"Education","uuid":"d66abea8-30ce-4579-a1fe-e52dc320026e","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Applied Mathematics and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"3eee36e4-1b5c-4f40-aee8-04c3a90ad95a\"}":{"__typename":"MentorPublicProfile","uuid":"3eee36e4-1b5c-4f40-aee8-04c3a90ad95a","displayName":"Senna R.","slug":"senna-reese","biography":"\u003cp\u003eSenna is a sophomore studying applied mathematics and economics at Northwestern University. She is in her second year of a selective program at Northwestern called Mathematical Methods in the Social Sciences (MMSS). With less than 25 students in her cohort in MMSS, Senna has learned the importance of having a tight-knit community to rely on.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSenna is passionate about making higher-level mathematics more accessible and approachable for students, especially women. She attended an all-girls school in New York City, The Spence School, from kindergarten to 12th grade. There, she was empowered to pursue her passions in mathematics. In her senior year, she took linear algebra and created an Instagram account to inspire her younger peers to sign up for the class. Senna looks forward to bringing this same enthusiasm and encouragement to Curious Cardinals!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of class, Senna is involved in Northwestern’s Minority Business Association and the Women in Business Club, where she is a part of the finance and consulting groups. She also works part-time as a paralegal where she has applied her analytical skills on calculating the sales, pricing, and costs of marketing and production on consumer products.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe shared her love of playing varsity soccer in high school with her college friends and started an intramural team at Northwestern. She also loves jigsaw puzzles and playing NYT word games every morning!\u003c/p\u003e","teachingVideoPlaybackId":"b7rmhabfDu3Lc8a3EW8SwAcJ2RR7EOCfEedIRBIQDA4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Mathematics and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"884bf846-c6f4-48b3-b1cd-8640a6bbcf90\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb96301c-5102-4c67-a2b0-30cb535efaf7\"}"},{"__ref":"DeepDives:{\"uuid\":\"598b8229-af6c-4871-b8f0-1fc7a0655b33\"}"},{"__ref":"DeepDives:{\"uuid\":\"7f95fd5f-f08b-40ca-a000-a5a0ef439f4a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7f5e3696-09e0-4ce9-ac84-3c003a042dc6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9fa5206a-71a3-45d3-96a4-ccb77ef15241\"}"},{"__ref":"Education:{\"uuid\":\"d66abea8-30ce-4579-a1fe-e52dc320026e\"}"}],"hiredAt":"2024-10-07T02:56:27.561Z","topics":["Finance / Investing","Business / Entrepreneurship","Algebra I","Economics","Algebra II","Calculus","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"senna-reese\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3eee36e4-1b5c-4f40-aee8-04c3a90ad95a\"}"}}},"_sentryTraceData":"65fe38a3d06847aba655e627bb29cc68-9178ffc90a7a7a90-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128
