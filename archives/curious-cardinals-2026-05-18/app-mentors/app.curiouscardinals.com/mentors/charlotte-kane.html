xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b954caa4-4ee8-4248-a7d8-04e3e100d003\"}":{"__typename":"Favorites","uuid":"b954caa4-4ee8-4248-a7d8-04e3e100d003","photoUrl":"https://ucarecdn.com/e154c3c7-18a3-4a29-937c-b35141855ecd/","title":"Cat's Cradle","type":"BOOK"},"Favorites:{\"uuid\":\"199e9db8-b1ce-44a1-be75-082e03224f1d\"}":{"__typename":"Favorites","uuid":"199e9db8-b1ce-44a1-be75-082e03224f1d","photoUrl":"https://ucarecdn.com/4c664f29-c3c1-46df-b8fd-15766a2506b1/","title":"San Francisco","type":"CITY"},"Favorites:{\"uuid\":\"48d208a0-0e51-4c3b-b334-734b5bc7943b\"}":{"__typename":"Favorites","uuid":"48d208a0-0e51-4c3b-b334-734b5bc7943b","photoUrl":"https://ucarecdn.com/c8bf52a2-dab7-4037-98e4-15bb79b1cac0/","title":"yankee hotel foxtrot ","type":"ALBUM"},"CausesSupported:{\"uuid\":\"4530a985-47f0-4f6d-af62-895e9611cb99\"}":{"__typename":"CausesSupported","uuid":"4530a985-47f0-4f6d-af62-895e9611cb99","name":"Holy Family Day Home","description":"","photoUrl":""},"CausesSupported:{\"uuid\":\"00d2c578-ef2a-4793-9f55-73b5f514a8d6\"}":{"__typename":"CausesSupported","uuid":"00d2c578-ef2a-4793-9f55-73b5f514a8d6","name":"Compass Family Services","description":"\u003cbr\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"82b2f436-beea-4142-a597-c7eddf5a06da\"}":{"__typename":"DeepDives","uuid":"82b2f436-beea-4142-a597-c7eddf5a06da","content":"\u003cp\u003eSome advice I would give to my high school self is to really trust your own intuition on what feels right to you and to try everything. There is so much value in the “Do” of DIY (Do it Yourself). I find I’ve learned so much from just having an idea and going for it, making it a reality. I always loved music, but I never would have thought that I would have been able to play, let alone write my own stuff.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d0d9a19d-51e1-43c1-b687-95268293cce1\"}":{"__typename":"DeepDives","uuid":"d0d9a19d-51e1-43c1-b687-95268293cce1","content":"\u003cp\u003eI would love to be able to hike the Pacific Crest Trail. That land is quite important to me, and I think we all have a lot to learn from extended periods of time on the trail.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3e54faa1-5376-437b-9967-60b668ccd04a\"}":{"__typename":"DeepDives","uuid":"3e54faa1-5376-437b-9967-60b668ccd04a","content":"\u003cp\u003eI began at Duke taking Psych 101, Econ 101, Writing 101 and Comp Sci 101. I had no idea what I wanted to study, what it was that excited me. Until began to take courses in Literature, meet the professors, meet the students, I found that I really looked up to everyone there. Within the preprofessional world of Duke, there's a lot of pressure against studying the humanities, or things that don't lead to something known. However, I think that the amount my worldview has changed and expanded, the amount of inspiration I have felt, I know that I am going to lead a life that will be within my definition of success and authenticity, even if the path isn't as direct. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b9bc5eb5-14fd-47d9-a0f6-07ad032e424b\"}":{"__typename":"DeepDives","uuid":"b9bc5eb5-14fd-47d9-a0f6-07ad032e424b","content":"\u003cp\u003eMy free time is always filled by whatever project has peaked my interest at the moment, right now it is ceramics! I've been making lots of pots. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"13829731-8084-4dae-be56-8a35b22f3ad3\"}":{"__typename":"School","uuid":"13829731-8084-4dae-be56-8a35b22f3ad3","name":"Lick Wilmerding High School","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94112"},"Education:{\"uuid\":\"c5a4ac22-ad5a-4122-838e-00283f4d3517\"}":{"__typename":"Education","uuid":"c5a4ac22-ad5a-4122-838e-00283f4d3517","school":{"__ref":"School:{\"uuid\":\"13829731-8084-4dae-be56-8a35b22f3ad3\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"52d92351-e319-404d-b254-b2b40bf1c343\"}":{"__typename":"Education","uuid":"52d92351-e319-404d-b254-b2b40bf1c343","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Literature","degree":null},"MentorPublicProfile:{\"uuid\":\"46e5150f-c27e-4271-819b-ea796558273a\"}":{"__typename":"MentorPublicProfile","uuid":"46e5150f-c27e-4271-819b-ea796558273a","displayName":"Charlotte K.","slug":"charlotte-kane","biography":"\u003cp\u003eHi! My name is Charlotte, and I am a senior studying Global Cultural Studies with minors in Creative Writing and Visual Media Studies. Academically, I am very interested in Simone de Beauvoir and existentialism, as well as film and media theory. I am the ambassador for the major here at Duke, and I’m always encouraging others to take classes in literature.\u003c/p\u003e\u003cp\u003eI’ve also loved developing my writing beyond journalistic and academic styles by writing prose poems, songs, and micro-stories. I work as the booking manager of Coffeehouse, where I help book local and touring musical acts, do live sound, and work as a barista. I oversee a 30-person staff and the budget of the space, and it has been one of the most rewarding experiences of college.\u003c/p\u003e\u003cp\u003eI am also a DJ at WXDU, where I have a weekly show. I love playing indie pop and local music, and I organize DJ events as well. I’ve worked at small news outlets and was the editor of my school paper in high school, and I’ve always loved writing creatively.\u003c/p\u003e\u003cp\u003eI also love film and video editing and recently learned how to shoot and develop my own 16mm film. In middle school, I founded a film festival that is still around today. I’ve worked as a video editor for the Stanford School of Public Policy as well. Giving back to communities through arts and culture is important to me, and that value is present in much of what I do. I worked at an independent record label last summer, and I hope to continue keeping music as a central part of my life.\u003c/p\u003e\u003cp\u003eI grew up in San Francisco, which has taught me about the importance of time in nature. I grew up playing soccer, field hockey, track and softball, and I enjoy spending time outdoors today — running and riding my bike. I’ve gone on month-long backpacking trips and find that I feel most at home surrounded by the natural world. Music is also very important to me, and I play in a band with my friends. Recently, I’ve enjoyed screen-printing shirts and lino-printing tapes with my band. There are so many ways we can express ourselves in the world and encourage others to do the same. I’m looking forward to working with you!\u003c/p\u003e","teachingVideoPlaybackId":"NxtuEuQhJPHlg02t8hoRKiTliKu02za8sZMQV7yypFQPE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting into Duke felt like a big moment for me, as well as getting my summer job at Matador Records, a label I've looked up to my whole life. Felt supper surreal, I couldn't stop smiling.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b954caa4-4ee8-4248-a7d8-04e3e100d003\"}"},{"__ref":"Favorites:{\"uuid\":\"199e9db8-b1ce-44a1-be75-082e03224f1d\"}"},{"__ref":"Favorites:{\"uuid\":\"48d208a0-0e51-4c3b-b334-734b5bc7943b\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"4530a985-47f0-4f6d-af62-895e9611cb99\"}"},{"__ref":"CausesSupported:{\"uuid\":\"00d2c578-ef2a-4793-9f55-73b5f514a8d6\"}"}],"major":"Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"82b2f436-beea-4142-a597-c7eddf5a06da\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0d9a19d-51e1-43c1-b687-95268293cce1\"}"},{"__ref":"DeepDives:{\"uuid\":\"3e54faa1-5376-437b-9967-60b668ccd04a\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9bc5eb5-14fd-47d9-a0f6-07ad032e424b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d4abece8-f486-4d7d-a3c9-30afd955fa42/-/preview/-/format/jpg/","https://ucarecdn.com/5bcb6169-71a8-475e-b971-ac4b8f3a5c7b/-/preview/-/format/jpg/","https://ucarecdn.com/3cd70c07-6e2f-479c-a4d9-088eb828c7a7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c5a4ac22-ad5a-4122-838e-00283f4d3517\"}"},{"__ref":"Education:{\"uuid\":\"52d92351-e319-404d-b254-b2b40bf1c343\"}"}],"hiredAt":"2026-04-07T20:07:42.410Z","topics":[
