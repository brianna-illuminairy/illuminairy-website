xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"badfdd67-8c06-4711-8a73-0b3a1dc8e58b\"}":{"__typename":"DeepDives","uuid":"badfdd67-8c06-4711-8a73-0b3a1dc8e58b","content":"\u003cp\u003eIt's never too late to start something new! I always felt like I was too old to try out a new interest, whether it was a sport, instrument, or language, but as I'm getting older, I've realized that that's a total myth! In the past few years, I've pushed myself to try the things I've always wanted to do but thought I couldn't, and you'd be surprised how quickly something that seems so alien can become second nature! Most recently, I taught myself how to crochet and now I have a brand new basket of scarves! Let's try something new!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5b147512-f625-4c79-8e49-4a6023c01cb7\"}":{"__typename":"DeepDives","uuid":"5b147512-f625-4c79-8e49-4a6023c01cb7","content":"\u003cp\u003eIn the summers of high school, I had some really great opportunities to study acting in a much more concentrated and intensive way than I ever had before. I attended the New York State Summer School for the Arts (NYSSSA) School of Theater ('18) as well as the Rutgers Mason Gross Summer Acting Conservatory ('19) which both prepared me for college auditions and college theater. I was also a waitress at a local restaurant! And I spent a lot of time reading plays and books, taking long walks, and dreaming!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b7ae6fd9-0114-418f-ad4f-f0573273fc98\"}":{"__typename":"DeepDives","uuid":"b7ae6fd9-0114-418f-ad4f-f0573273fc98","content":"\u003cp\u003eMy mentors are why I've followed and taken my dreams seriously. Sometimes, it's hard to believe in yourself, you have doubts about what you want to be doing versus what you \"should\" be doing, but I believe that you should be doing what your heart tells you to be doing. It has been so critical to my growth to have mentors who believe in me and expect a lot from me because they have pushed me to have the same standards and respect for myself. There are so many unknowns in building a career and a path for yourself, having people to help you out who have already done it is hugely helpful!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"167ee430-bc41-4f39-93d7-d5f724e9414d\"}":{"__typename":"DeepDives","uuid":"167ee430-bc41-4f39-93d7-d5f724e9414d","content":"\u003cp\u003eI was busy, energetic, stressed, social, and seeking. I always had stuff going on, new passions, and new obsessions. It was a crazy time of figuring out who I was, what I wanted to do, and how I was going to make that happen! Also a major theater kid and dork generally (I mean that with all of the empowerment in the world)!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"2cb07e5f-db04-46dc-823f-daad1ab663fd\"}":{"__typename":"School","uuid":"2cb07e5f-db04-46dc-823f-daad1ab663fd","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208 "},"Education:{\"uuid\":\"0a4d9f0c-03a6-4fee-b0ae-d28dae01797d\"}":{"__typename":"Education","uuid":"0a4d9f0c-03a6-4fee-b0ae-d28dae01797d","school":{"__ref":"School:{\"uuid\":\"2cb07e5f-db04-46dc-823f-daad1ab663fd\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Theatre","degree":"Bachelor of Arts "},"School:{\"uuid\":\"0072eaca-f18e-4553-96e4-9145769f0bd7\"}":{"__typename":"School","uuid":"0072eaca-f18e-4553-96e4-9145769f0bd7","name":"Nyack High School","city":"Nyack","type":"HIGH","state":"New York","country":"United States","zip":"10960"},"Education:{\"uuid\":\"40740963-189a-4f33-960f-644e9d596315\"}":{"__typename":"Education","uuid":"40740963-189a-4f33-960f-644e9d596315","school":{"__ref":"School:{\"uuid\":\"0072eaca-f18e-4553-96e4-9145769f0bd7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ac6ea20b-761d-4b4d-bc3a-97e1c6bdd372\"}":{"__typename":"MentorPublicProfile","uuid":"ac6ea20b-761d-4b4d-bc3a-97e1c6bdd372","displayName":"Ella S.","slug":"ella-stevens","biography":"\u003cp\u003eHi! I'm Ella Stevens, nice to meet you! Right now, I'm finishing up my fourth and final year at Northwestern University where I majored in Theatre, minored in World Literature, and completed a module in Acting for the Screen. Over the past four years, I dove into every corner of theatre: acting in 10+ productions, from mainstage plays to new play readings, producing a full-length student-written play, acting in films, both shorts and feature-length, directing a short film, doing dramaturgy student productions, and writing screenplays and plays in classes! I have managed to balance all of my theater work with my academic endeavors, receiving the Departmental Award for  Excellence in Theatre 2 years in a row! When I'm not on stage, you'll probably find me reading, running, or baking brownies! I am super excited to work with students with big dreams to help make them into a reality! I love working with kids and having fun, I want our sessions to be exciting, inspiring, and motivating! \u003c/p\u003e","teachingVideoPlaybackId":"IEed1bWxC9PvrNiv4o9dCm48ufZ3LmZ2s00aR1aQyA4o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Theatre","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"badfdd67-8c06-4711-8a73-0b3a1dc8e58b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b147512-f625-4c79-8e49-4a6023c01cb7\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7ae6fd9-0114-418f-ad4f-f0573273fc98\"}"},{"__ref":"DeepDives:{\"uuid\":\"167ee430-bc41-4f39-93d7-d5f724e9414d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6ae69bb3-e96f-4c50-a824-03907c2f801b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0a4d9f0c-03a6-4fee-b0ae-d28dae01797d\"}"},{"__ref":"Education:{\"uuid\":\"40740963-189a-4f33-960f-644e9d596315\"}"}],"hiredAt":"2023-06-28T18:19:44.782Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Film / Theater","Video / Photography","History Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ella-stevens\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ac6ea20b-761d-4b4d-bc3a-97e1c6bdd372\"}"}}},"_sentryTraceData":"c074f7b9963f4b95855898ab948bc11f-94ca8fc182c8842e-0","_sentryBa
