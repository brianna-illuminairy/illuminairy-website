xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1d10424b-4f10-442a-96b0-3ee31282d39a\"}":{"__typename":"DeepDives","uuid":"1d10424b-4f10-442a-96b0-3ee31282d39a","content":"\u003cp\u003eWell firstly, all knowledge we have in the world is a result of cumulative effort! \u003cem\u003eEvery \u003c/em\u003einvention, discovery, or accomplishment anyone has ever achieved was a progression based off of a starting point established by the knowledge and adventures of the people before them. That's how society progresses, and I think it's our responsibility to pass the buck forward.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd while some people are lucky enough to have people around them who've been where they want to be, and can mentor them on the steps that got them there, many others don't. I want to help those who, like me, didn't always have that, and show them it's possible to get to where they want to go.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1276044c-368b-43fd-bc30-4b6379204e79\"}":{"__typename":"DeepDives","uuid":"1276044c-368b-43fd-bc30-4b6379204e79","content":"\u003cp\u003eI want to start a company! Once I get deeper into my work, I plan to start a business based off of some element of the special knowledge base that I've built.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"662fae89-9a60-4b1a-8cc2-693b9aaee81d\"}":{"__typename":"DeepDives","uuid":"662fae89-9a60-4b1a-8cc2-693b9aaee81d","content":"\u003cp\u003eSpace has always been amazing to me, and when I took physics in high school, it quickly became my favorite subject. I think what sealed it, though, was watching Hidden Figures in 2017. After seeing what could be done with the science, the frontiers we could cross, and seeing people \u003cem\u003elike me\u003c/em\u003e be the ones to do it, I was hooked. And 8 years later here I am, working Orbital Mechanics Trajectory Design, and Attitude Dynamics, and loving it all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"09c15cbb-b4ac-4f03-9257-0b7cd59d1501\"}":{"__typename":"DeepDives","uuid":"09c15cbb-b4ac-4f03-9257-0b7cd59d1501","content":"\u003cp\u003eMy family. I have a little sister who looks up to me, and I want to show her that anything is possible for us. And I have a mother whose done everything she can to help me get where I am now. When I don't believe in myself, I know that they still do, and that's enough. I'll also be the first ever PhD student in my family, something I'm always aware of.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"e6deef00-561b-4615-a3a2-cd30a9091b82\"}":{"__typename":"School","uuid":"e6deef00-561b-4615-a3a2-cd30a9091b82","name":"MICDS (Mary Institute and Saint Louis Country Day School)","city":"St. Louis","type":"HIGH","state":"Missouri","country":"United States","zip":"63124"},"Education:{\"uuid\":\"84ff5983-2f68-46ca-99b1-bfddbcfe1cf0\"}":{"__typename":"Education","uuid":"84ff5983-2f68-46ca-99b1-bfddbcfe1cf0","school":{"__ref":"School:{\"uuid\":\"e6deef00-561b-4615-a3a2-cd30a9091b82\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"9c3c0579-319a-49d1-9bfd-ca34823791d6\"}":{"__typename":"Education","uuid":"9c3c0579-319a-49d1-9bfd-ca34823791d6","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Engineering Physics (Aerospace Concentration)","degree":null},"MentorPublicProfile:{\"uuid\":\"219e36cd-6ced-4e6d-bd1c-48b13aa37766\"}":{"__typename":"MentorPublicProfile","uuid":"219e36cd-6ced-4e6d-bd1c-48b13aa37766","displayName":"Hasani S.","slug":"hasani-spann","biography":"\u003cp\u003eHello! My name is Hasani, and I'm a Senior QuestBridge Scholar at Stanford University, majoring in Engineering Physics with a concentration in Aerospace. I'm also a SMEAD Fellow at the University of Colorado Boulder, where I’ll be pursuing a PhD in Aerospace starting next fall. I'm an avid learner and researcher, and have published work as a first author and presented it onstage at the AIAA Aviation Forum. I’ve also been involved with the Stanford Space Initiative (SSI) for several years, working both on technical projects and as Financial Officer for the Rockets and Biology teams.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAcademically, I have a strong foundation across various domains of math (Trigonometry, Vector \u0026amp; Multivariable Calculus, Linear Algebra, Differential Equations, etc.), physics (Mechanics, E\u0026amp;M, Dynamics, Thermo, etc.), and programming (Python, C++, Matlab, and some Java). I love helping others build intuition and confidence in these subjects, and I’m always excited to pass that knowledge forward!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI also have experience with persuasive, informative, and creative writing at the college level and beyond. I've written many essays for scholarships, positions, and fellowships, reports and research papers to be presented at high levels, and even some poetry, literary critiques, and personal narratives for college work. Even in STEM, it's important to be able to write and communicate, and I would be happy to support students in developing their writing skills or offering constructive feedback on their work.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThanks to my work in aerospace and SSI, I also have solid experience in engineering design and collaborative problem solving—so whether you're curious about rocketry, robotics, or just want to tackle a cool STEM project, I'd love to assist!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e(P.S. I love to read, play basketball, and play video games, too, and I \u003cem\u003edefinitely\u003c/em\u003e understand the need for work-life balance! As far as basketball goes, I was recruited by some D2 and D3 programs [including MIT and CalTech] before obtaining the Questbridge Scholarship to Stanford, and I play as a Practice Player for the Women's Basketball team at Stanford to this day. So if you're curious about balancing sports and academics, navigating college recruitment, or just staying grounded in a busy schedule, I’d love to engage and share what I've learned!)\u003c/p\u003e","teachingVideoPlaybackId":"I88XHBtlN1Dx3g8vLHftw01rhGQ5j7ESvwPwUw006nOeo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Engineering Physics (Aerospace Concentration)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1d10424b-4f10-442a-96b0-3ee31282d39a\"}"},{"__ref":"DeepDives:{\"uuid\":\"1276044c-368b-43fd-bc30-4b6379204e79\"}"},{"__ref":"DeepDives:{\"uuid\":\"662fae89-9a60-4b1a-8cc2-693b9aaee81d\"}"},{"__ref":"DeepDives:{\"uuid\":\"09c15cbb-b4ac-4f03-9257-0b7cd59d1501\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f2a26bac-b0da-47b3-956b-f47745bc200f/-/preview/-/format/jpg/","https://ucarecdn.com/a322d052-0986-4e05-9a9e-c7dac0a59932/-/preview/-/format/jpg/","https://ucarecdn.com/fbf77271-8f85-4246-ad3c-15a21ccc8937/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"84ff5983-2f68-46ca-99b1-bfddbcfe1cf0\"}"},{"__ref":"Education:{\"uuid\":\"9c3c0579-319a-49d1-9bfd-ca34823791d6\"}"}],"hiredAt":"2025-04-01T18:35:27.014Z","topics":["Coding / Programming","Aviation / Aerospace","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Physics","Algebra I","Algebra II","STEM Project","6-8 Grade Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hasani-spann\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"219e36cd-6ced-4e6d-bd1c-48b13aa37766\"}"}}},"_sentryTraceData":"33c16b8af0864b95a19b4748754a4f5a-8bf3f402aeb0c5c5-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=33c16b8af0864b95a19b4748754a4f5a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"hasani-spann"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[
