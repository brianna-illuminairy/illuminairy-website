xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9ffe66f1-1b74-43b1-864b-7f7df4ad81bd\"}":{"__typename":"Favorites","uuid":"9ffe66f1-1b74-43b1-864b-7f7df4ad81bd","photoUrl":"https://ucarecdn.com/07a9b83c-c935-4fc5-a922-48d1f1e844a3/","title":"The Metamorphosis by Franz Kafka","type":"BOOK"},"Favorites:{\"uuid\":\"25570e8f-8aae-45b5-8122-f778ce35471f\"}":{"__typename":"Favorites","uuid":"25570e8f-8aae-45b5-8122-f778ce35471f","photoUrl":"https://ucarecdn.com/ddd789f6-4ef8-48d7-b8c0-e917737f0866/","title":"Parasite","type":"MOVIE"},"Favorites:{\"uuid\":\"5880e9b4-bb66-4003-b8e0-baf712cacf53\"}":{"__typename":"Favorites","uuid":"5880e9b4-bb66-4003-b8e0-baf712cacf53","photoUrl":"https://ucarecdn.com/75d73bc6-7d8b-4b18-999e-31f790c54440/","title":"Gabby Douglas","type":"ATHLETE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"afea730d-cf90-4186-a2ab-db11e41a6d65\"}":{"__typename":"DeepDives","uuid":"afea730d-cf90-4186-a2ab-db11e41a6d65","content":"\u003cp\u003eI chose my major because I felt it best combined my interests. A lot of what we are doing when trying to choose a major, or choose a passion project topic for that matter, is understand ourselves and how we relate to the world. For me, I know that I am interested in logic, helping others, and understanding how we as individual humans and as a collective human society operate. Many different disciplines pursue this sort of topic. However, what has drawn me to philosophy is the way in which philosophy focuses more on grappling with these questions via conceptual methods rather than empirical ones. So, in understanding what I want and then gaining an understanding of what different disciplines emphasize, I have matched myself to philosophy. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"20dbd28a-1692-4369-b920-e29b9f521c87\"}":{"__typename":"DeepDives","uuid":"20dbd28a-1692-4369-b920-e29b9f521c87","content":"\u003cp\u003eSomething I've been doing in my free time since being at Columbia University is exploring New York City! I am lucky to be in a place with so many unique cultural, artistic, and intellectual enclaves. Sometimes, this exploration looks like trying a new restaurant with friends, while other times we peruse museums and stores. Some of the most fun I've had though has been on days when we just explore neighborhoods with no real destination: taking photos of what we see and getting to experience different ways of life.   \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"67c1e522-1a89-4701-9d88-267cab9404f8\"}":{"__typename":"DeepDives","uuid":"67c1e522-1a89-4701-9d88-267cab9404f8","content":"\u003cp\u003eA passion project I created in the past was founding a peer tutoring program for ENL students at my High School. As a Spanish speaker, I had the privilege to help my community. I worked with ENL students who had recently immigrated from Latino countries, some who had indigenous languages rather than Spanish as their mother tongue. I supported them to get successfully through their courses and state exams by creating novel lesson plans, explaining concepts, guiding through homework, and evaluating their progress. On top of this, I also served as a cultural mediator. So, I was fortunate enough to be able to not only support them academically but also assist in their adjustment to their new environment. This was an amazing experience for me because I not only got the opportunity to play a significant supporting role in many kids' lives and teach topics that I enjoy, but I also in turn had the invaluable experience of learning about the experiences of others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"cdefb1cc-adc7-47aa-8da3-32c7eb95b328\"}":{"__typename":"DeepDives","uuid":"cdefb1cc-adc7-47aa-8da3-32c7eb95b328","content":"\u003cp\u003eAlthough I deeply enjoy humanities classes, as is reflected in my philosophy major, I also have a deep appreciation for STEM! What I enjoy about my humanities classes is how they enable me to meaningfully engage with the world and the human existence. However, I see this in mathematics for example as well. Although many people see mathematics as not pertaining to the real world or as not having anything to contribute to conversations on the human experience, I do not see mathematics that way. To explain, a lot of the time in math we are using equations that are the best of their kind that we know of. But, almost none of these are proven to be perfectly certain. However, we use them and create them anyway, as we need to get an answer. In this I see the indomitable human spirit. Thus, I see mathematics also as a monument to the perseverance and creativity of humankind.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"b1159662-f180-44c2-aa2c-2280016cda19\"}":{"__typename":"School","uuid":"b1159662-f180-44c2-aa2c-2280016cda19","name":"Port Jefferson High School","city":"Port Jefferson","type":"HIGH","state":"New York","country":"United States","zip":"11777"},"Education:{\"uuid\":\"5f3b99c2-eb76-4218-8836-a7f50ed3ca07\"}":{"__typename":"Education","uuid":"5f3b99c2-eb76-4218-8836-a7f50ed3ca07","school":{"__ref":"School:{\"uuid\":\"b1159662-f180-44c2-aa2c-2280016cda19\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"38693bd1-4922-49de-9a61-df00b164b252\"}":{"__typename":"Education","uuid":"38693bd1-4922-49de-9a61-df00b164b252","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Philosophy","degree":null},"MentorPublicProfile:{\"uuid\":\"22507869-f74c-4501-b131-aa0735be7cdc\"}":{"__typename":"MentorPublicProfile","uuid":"22507869-f74c-4501-b131-aa0735be7cdc","displayName":"Sofia F.","slug":"sofia-freitas","biography":"\u003cp\u003e\u003cstrong\u003eHi! My name is Sofia.\u003c/strong\u003e I am a first-year philosophy major at Columbia University, and I help students transform their interests into actionable projects!\u003c/p\u003e\u003cp\u003eI’ve loved thinking thoughtfully about the world for as long as I can remember.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my first year of university, I have:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEarned\u003c/strong\u003e a spot on the Dean’s List\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBecome\u003c/strong\u003e an editor for \u003cem\u003eThe Columbia Review\u003c/em\u003e, the oldest collegiate literary magazine\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eServed\u003c/strong\u003e as a staff writer for the \u003cem\u003eColumbia Hispanic Pre-Law Review\u003c/em\u003e, where my articles on contemporary legal issues have been published\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBeen accepted\u003c/strong\u003e as a NYSCAS (New York State Small Claims Advisory Service) volunteer, where I provide clients with legal information on the Small Claims Court process\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWorked\u003c/strong\u003e as a grader for PCIS (Pre-College Independent Study Program at Rikers Island), where I virtually provide feedback to students at Rikers Island\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences, coupled with my work in high school, have taught me how to turn even the most disparate interests into impactful activities. Moreover, my philosophy experience has allowed me to develop sharp critical thinking skills- thereby helping me see the connections between different ideas and projects more clearly.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhat I Specialize In\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI mentor students who want to explore:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCreative Writing:\u003c/strong\u003e Literature, poetry, publishing, and editing\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCommunity Impact:\u003c/strong\u003e Providing support to underserved communities in various ways\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLegal \u0026amp; Governmental Action:\u003c/strong\u003e Founding youth councils, working with local government, and advocacy\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch:\u003c/strong\u003e Conducting research and writing policy pieces\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also help with logistics, such as finding collaborators, sponsors, and researchers. Having navigated these hurdles myself, I understand how difficult it can be to gather initial support!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eMy Mentorship Style\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eIn high school, I founded a peer tutoring and mentoring program for ENL students, supporting them through language, cultural and academic obstacles. Today, my work providing legal information at NYSCAS and grading student work via PCIS continues that mission. I believe the key to success is connecting a student’s project to what is truly meaningful to them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might involve:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConnecting a current interest to an actionable goal\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a detailed roadmap for your project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDrafting outreach emails to potential collaborators\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eAnd a few fun facts\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside of class, you’ll find me taking photos of NYC architecture, visiting my twin sister, or cafe hopping with friends!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’d love to help you make your next project meaningful!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"t5pzVAEz8IYyttQWyq3YcnKOw900vcRUJdlWYrWSuMFk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9ffe66f1-1b74-43b1-864b-7f7df4ad81bd\"}"},{"__ref":"Favorites:{\"uuid\":\"25570e8f-8aae-45b5-8122-f778ce35471f\"}"},{"__ref":"Favorites:{\"uuid\":\"5880e9b4-bb66-4003-b8e0-baf712cacf53\"}"}],"causesSupported":[],"major":"Philosophy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"afea730d-cf90-4186-a2ab-db11e41a6d65\"}"},{"__ref":"DeepDives:{\"uuid\":\"20dbd28a-1692-4369-b920-e29b9f521c87\"}"},{"__ref":"DeepDives:{\"uuid\":\"67c1e522-1a89-4701-9d88-267cab9404f8\"}"},{"__ref":"DeepDives:{\"uuid\":\"cdefb1cc-adc7-47aa-8da3-32c7eb95b328\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c8f8dfdf-7025-4962-b384-fafb9d5f43cd/-/preview/-/format/jpg/","https://ucarecdn.com/b7a36b94-bf64-44c6-bf44-73776bff94b7/-/preview/-/format/jpg/","https://ucarecdn.com/86edd98d-2beb-4e08-85a1-784d229f2b95/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5f3b99c2-eb76-4218-8836-a7f50ed3ca07\"}"},{"__ref":"Education:{\"uuid\":\"38693bd1-4922-49de-9a61-df00b164b252\"}"}],"hiredAt":"2026-03-28T01:10:57.298Z","topics":["Creative Writing","Fashion / Cosmetics","History Project","K-6 Storybook","Law / Government / Policy","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sofia-freitas\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"22507869-f74c-4501-b131-aa0735be7cdc\"}"}}},"_sentryTraceData":"92cd3d7f0e4744888e1e487
