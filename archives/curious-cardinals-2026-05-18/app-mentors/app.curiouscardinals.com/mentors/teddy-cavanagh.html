xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"85d5cb4d-217e-420c-9bd5-d37c000a7449\"}":{"__typename":"DeepDives","uuid":"85d5cb4d-217e-420c-9bd5-d37c000a7449","content":"\u003cp\u003eI choose my major because I was fascinated in psychology, economics, computer science, and philosophy, but I couldn't choose between them all. I discovered that the cognitive science major would allow me to take courses in each subject that would all contribute to my major. I also loved that the major allows me to establish a concentration that I get to explore through the courses I take at Yale and then through experimentation and my senior thesis.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"0ad4160b-bfeb-4e1d-b98a-efe9cfffa19a\"}":{"__typename":"School","uuid":"0ad4160b-bfeb-4e1d-b98a-efe9cfffa19a","name":"Penn Charter","city":"Philadelphia","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19144"},"Education:{\"uuid\":\"e92cfcc3-8a15-4727-a22f-2c3b8905688a\"}":{"__typename":"Education","uuid":"e92cfcc3-8a15-4727-a22f-2c3b8905688a","school":{"__ref":"School:{\"uuid\":\"0ad4160b-bfeb-4e1d-b98a-efe9cfffa19a\"}"},"startYear":"2015","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"bbfceb5a-db46-44ae-bb31-8ed6583431b5\"}":{"__typename":"Education","uuid":"bbfceb5a-db46-44ae-bb31-8ed6583431b5","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"0bdffa13-78d0-460c-8513-719c0f27bb11\"}":{"__typename":"MentorPublicProfile","uuid":"0bdffa13-78d0-460c-8513-719c0f27bb11","displayName":"Teddy C.","slug":"teddy-cavanagh","biography":"\u003cp\u003eTeddy is a Yale graduate, who majored in Cognitive Science with a concentration in Behavioral Economics and Decision-making, stemming from his strong interest in consumer behavior and consciously and subconsciously draws them to certain products, companies, etc.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHe also has strong interests in Art History and Spanish. He attended a high school in Philadelphia, where he tutored people in high school math, science, and writing. He also led the Art \u0026amp; Photography Club and served as president of the community service council. Some of the courses I have taken in high school were AP Spanish Literature, AP Spanish Language, AP BC Calculus, AP Physics: Mechanics, AP Physics: E\u0026amp;M, AP Art History, AP Statistics, and AP Literature.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eWith a diverse background in across the STEM and humanities fields, he offers a range of tutoring services tailored to each student's unique needs and learning style. \u003c/p\u003e\u003cp\u003e\u003cbr\u003eAt Yale, he has been involved with several psychology labs, where he has learned to conduct experiments with participants and consolidate lab data for ongoing research. He has also been published in a research paper on belief inflexibility and contributed to a PhD manuscript. He wrote his senior thesis on emotional regulation around the election.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eOutside of academics, he loves to pursue both film and digital photography and has taken photos for the Yale Daily News and their social media. He was also member of the Club Squash team and loves playing tennis, pickleball, and skiing in his free time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo those that do not know him, he would describe himself as creative, energetic, outgoing, passionate, and funny (hopefully). He has a lot of patience for people who are struggling in certain areas and loves to find innovative ways to overcome obstacles. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eHe is also very open about his struggles with ADHD. Throughout his time in high school and Yale, he developed many strategies around executive functioning and organization to stay on top of his work. This surrounded test-taking strategies, study habits, finding barriers to social media, and dieting.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eCurrently, he is working in NYC at an advertising agency as an investment associate on a pharmaceutical account. He has recently joined a pickleball league and loves spending time with his friends.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"01gEnSFRFO7fsmMLBWhxekISPOIQuCadMS8qbS74zXSE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"85d5cb4d-217e-420c-9bd5-d37c000a7449\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f38c992d-5c6b-4276-adbc-2994d3434f82/-/preview/-/format/jpg/","https://ucarecdn.com/ec52af44-c467-48f0-a7cc-a259b35a1690/-/preview/-/format/jpg/","https://ucarecdn.com/b5c10e58-7750-4223-855b-a15cfd77b16e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e92cfcc3-8a15-4727-a22f-2c3b8905688a\"}"},{"__ref":"Education:{\"uuid\":\"bbfceb5a-db46-44ae-bb31-8ed6583431b5\"}"}],"hiredAt":"2024-02-27T15:54:12.942Z","topics":["Algebra I","Algebra II","K-5 Grade Math","Pre-Algebra","6-8 Gr
