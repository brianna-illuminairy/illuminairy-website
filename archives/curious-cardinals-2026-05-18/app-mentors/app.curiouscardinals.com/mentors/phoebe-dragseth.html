3","school":{"__ref":"School:{\"uuid\":\"2edfd18b-3b61-4261-b887-7e705cfebda0\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"Testimonial:a2ab30d4-d61c-47ba-b45b-96e2ab314a2f":{"__typename":"Testimonial","id":"a2ab30d4-d61c-47ba-b45b-96e2ab314a2f","text":"Phoebe has been such a wonderful, patient, and inspiring mentor to my daughter! My daughter's face beams with pride and confidence whenever the two of them hit a milestone. She looks forward to her weekly sessions with Phoebe and we love watching her growth thanks to Phoebe's mentorship!","date":"2025-06-05 17:07:51.107+00","rating":5,"endorser":{"__typename":"Endorser","name":"Stephanie Shum","tagline":"","avatar":null}},"Testimonial:bb4e8664-5ae4-4fc4-9440-78789c82b043":{"__typename":"Testimonial","id":"bb4e8664-5ae4-4fc4-9440-78789c82b043","text":"Phoebe has been constantly demonstrating great care in Ondine s progression. She has been a great support but also she has been able to approach Ondine and earn her trust. Ondine has been increasing her work load and her motivation has grown stronger month after month. \nWe would like to continue this journey next school year, and with the same tutor, Phoebe !","date":"2025-06-02 14:42:46.087+00","rating":5,"endorser":{"__typename":"Endorser","name":"Claire Sondhi","tagline":"","avatar":null}},"Testimonial:5c97e4e5-cec0-401a-b096-fb8a881124d7":{"__typename":"Testimonial","id":"5c97e4e5-cec0-401a-b096-fb8a881124d7","text":"Phoebe has been a tremendous asset to Ashna’s academic growth, particularly in math. She has a remarkable ability to break down complex concepts into approachable, confidence-building steps. Since working with Phoebe, Ashna has not only strengthened her foundational skills but has also developed a newfound enthusiasm for math. What stands out most is the trusting and joyful relationship they’ve built — Ashna genuinely looks forward to their time together and sees Phoebe as both a mentor and a cheerleader. The progress we’ve seen, both academically and emotionally, has been incredible.","date":"2025-06-01 12:23:58.913+00","rating":5,"endorser":{"__typename":"Endorser","name":"Ambika","tagline":"","avatar":null}},"Testimonial:89fed8ef-328c-40a6-8f6f-00522029cf2e":{"__typename":"Testimonial","id":"89fed8ef-328c-40a6-8f6f-00522029cf2e","text":"Phenomenal Phoebe!  That is what we have come to call her in our home. Her smarts were clear from the start and her ability to connect with and calmly work with Natalia shown through quite quickly.  What continues to wow us is her care and dedication to helping Natalia - yes with specifics - but even more with general attitude and confidence.  Her impact cannot possibly be captured in words.  \n\nPhoebe is professional, responsive, reliable, smart and most of all warm.  \n\nAn inspiration.","date":"2025-05-31 17:01:19.893+00","rating":5,"endorser":{"__typename":"Endorser","name":"Michaela Clary","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"8f322017-d7c3-4f85-a5c2-4aa345d69a07\"}":{"__typename":"MentorPublicProfile","uuid":"8f322017-d7c3-4f85-a5c2-4aa345d69a07","displayName":"Phoebe D.","slug":"phoebe-dragseth","biography":"\u003cp\u003ePhoebe is pursuing a Master's in International Fashion and Luxury Management at l'Institut Français de la Mode. After graduation, she will work in Perfume Development for Gucci Fragrances. \u003cbr\u003e\u003cbr\u003eBefore moving to Paris, she graduated from Brown University with degrees in Mathematics and Political Science. Choosing to pursue math was not an easy decision for Phoebe. While she has always had a love for the field, she never really felt at home amongst other mathematicians, fearing that she was not “good enough” or that a woman like herself could not succeed in such a male-dominated discipline. She also always had a strong passion for design and fashion and feared if she chose to study math she would close a door on that creativity. However, as she continued her studies in calculus and geometry, Phoebe began to see that math and fashion can be very interrelated. She saw the curves of a dress's bodice as a replica of mathematical equations and sat in awe as she learned of flat diagrams of multidimensional topological spaces which so clearly resembled flat patterns used to construct garments. The two worlds of fashion and math were so connected. After presenting these findings to her professors, Phoebe received much support and love from the department and felt confident declaring her second concentration in math. She has since completed a research project connecting topology and fashion that culminated in a spring runway show.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePhoebe understands the struggle of feeling like one does not belong or is not “good at math”, and is inspired to change this narrative and make the world of math a welcoming and safe space. She  spent three years working as a teaching fellow for Brown’s math department to restructure the department and focus on making all students feel welcomed and supported. Inspiring others to pursue their creativity and succeed in math is one of Phoebe’s great passions, and she hopes to build up confidence in her mentees and support them to follow their dreams.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of her academic studies, Phoebe was a coxswain for Brown Women's Crew and was also the Director of Fashion at Brown's Design Team. She has worked one on one with designers in New York and Berlin, styling musical groups and constructing garments for Marvel shows, and is excited to share the beauty and craziness of the fashion industry with passionate mentees.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn February 2024 I was invited to show my \"Topologi\" fashion collection at New York Fashion Week. This collection was a passion project that combined my degree in mathematics with my love for fashion design. Having received no formal fashion design training, this opportunity was a dream come true and showed me the power of pursuing one's passions.  \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"70db32c5-438f-4356-9eb0-6c702da92b10\"}"},{"__ref":"Favorites:{\"uuid\":\"f3b77d43-08f9-4dfa-af45-751dbc2d782d\"}"},{"__ref":"Favorites:{\"uuid\":\"c0913962-e5e8-4eda-b265-eda961ccf8a9\"}"}],"causesSupported":[],"major":"Political Science and Math ","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/08f96ed3-792b-4bbb-8995-a0f61f514151/-/crop/797x797/0,3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1b4127f3-0c00-4183-b319-93027eca485c\"}"},{"__ref":"Education:{\"uuid\":\"633bcbc2-a6e9-49c7-b8ce-d274c6070ff3\"}"}],"hiredAt":"2023-01-12T18:12:07.000Z","topics":["Algebra I","Geometry","Precalculus / Trigonometry","Calculus","Fashion / Cosmetics","Business / Entrepreneurship","Finance / Investing","Web Design","Law / Government / Policy","Sustainability"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:a2ab30d4-d61c-47ba-b45b-96e2ab314a2f"},{"__ref":"Testimonial:bb4e8664-5ae4-4fc4-9440-78789c82b043"},{"__ref":"Testimonial:5c97e4e5-cec0-401a-b096-fb8a881124d7"},{"__ref":"Testimonial:89fed8ef-328c-40a6-8f6f-00522029cf2e"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"phoebe-dragseth\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8f322017-d7c3-4f85-a5c2-4aa345d69a07\"}"}}},"_sentryTraceData":"f7a46bf19bd3469596fb462f1642088d-8ba986bcc0be635e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace
