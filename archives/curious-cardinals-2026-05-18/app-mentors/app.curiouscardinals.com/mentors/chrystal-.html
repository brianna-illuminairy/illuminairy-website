xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"fae16ee2-ca43-43cb-81b5-a3011f826faa\"}":{"__typename":"DeepDives","uuid":"fae16ee2-ca43-43cb-81b5-a3011f826faa","content":"\u003cp\u003eI would like to start my own wellness and education nonprofit for low income students to improve college matriculation rates. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4ccf355f-dc43-4060-9558-716b32b35cb7\"}":{"__typename":"DeepDives","uuid":"4ccf355f-dc43-4060-9558-716b32b35cb7","content":"\u003cp\u003eA doctor and public health advocate!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4af7dbc2-506f-4188-8c0f-7c25fcb86bb7\"}":{"__typename":"DeepDives","uuid":"4af7dbc2-506f-4188-8c0f-7c25fcb86bb7","content":"\u003cp\u003eIt's okay to be unsure! Having multiple interests is totally normal and makes you well rounded. Focus right now on what you enjoy, and motivation will inevitable follow to build an impactful project.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"74e73828-148d-499e-ac3a-2f0a751de9d1\"}":{"__typename":"DeepDives","uuid":"74e73828-148d-499e-ac3a-2f0a751de9d1","content":"\u003cp\u003eMalala Yousafzai\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"774a1bff-cb99-4452-9f88-3bd488126cd8\"}":{"__typename":"School","uuid":"774a1bff-cb99-4452-9f88-3bd488126cd8","name":"Valencia High School","city":"Placentia","type":"HIGH","state":"California","country":"United States","zip":"92870"},"Education:{\"uuid\":\"a35d8084-a479-47ad-ab62-c11dde95ff8e\"}":{"__typename":"Education","uuid":"a35d8084-a479-47ad-ab62-c11dde95ff8e","school":{"__ref":"School:{\"uuid\":\"774a1bff-cb99-4452-9f88-3bd488126cd8\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"7e783bdb-99b7-4381-96fc-b59f615a01b5\"}":{"__typename":"Education","uuid":"7e783bdb-99b7-4381-96fc-b59f615a01b5","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"History and Science","degree":null},"MentorPublicProfile:{\"uuid\":\"70da7d28-055f-4faa-b4a6-8da2a8a56dbb\"}":{"__typename":"MentorPublicProfile","uuid":"70da7d28-055f-4faa-b4a6-8da2a8a56dbb","displayName":"Chrystal A.","slug":"chrystal-","biography":"\u003cp\u003eI’m so excited about the possibility of being your mentor! My goal is to help students grow into confident speakers, curious researchers, and strong critical thinkers. Most of all, I want learning to feel exciting—not stressful—and to help students discover what truly sparks their curiosity and passion. \u003c/p\u003e\u003cp\u003eI am an incoming medical student at USC Keck School of Medicine. I fully realized my aspirations to become a physician in college, at Harvard University. I studied History and Science with a secondary focus in Global Health and Health Policy. During college, I was involved in several hands-on research projects, including studying early-stage lung cancer at Boston Children’s Hospital, where I co-authored a published research paper. I currently work as a clinical research coordinator in dermatology, where I’ve also helped publish research focused on improving health outcomes for patients with advanced skin conditions. \u003c/p\u003e\u003cp\u003eMy long-term goal is to use research and advocacy to improve health outcomes for everyone, and especially under-researched and low-income communities. Through my work in public health, I received the Mindich Service Fellowship, which supports students working in public health during the summer. As a fellow, I led a team at the Boston Health Care for the Homeless Program in the foot care clinic and conducted research on improving healthcare access for patients with limited access to physicians.\u003c/p\u003e\u003cp\u003eOutside of medicine and research, I’m passionate about exercise and fitness. I was recruited to run Division I track and field at Harvard, specializing in the 100m and 200m sprints. I received the Schichk Sprint Award, which recognizes hard work, courage, sportsmanship, teamwork, and dedication to supporting teammates. Being a premedical student-athlete taught me powerful lessons about time management, teamwork, resilience, and being brave enough to explore new interests even when they’re challenging.\u003c/p\u003e\u003cp\u003eI also learned how important it is to learn from mistakes and turn passions into meaningful projects. I plan to bring this mindset to every student I mentor. My goal is to support and guide you as you try new things, build confidence, and grow into your passions.\u003c/p\u003e\u003cp\u003eWhen I’m not working or studying, I love reading, journalism, spending time with friends, and cooking. I’m excited to learn more about you and what you’re passionate about!\u003c/p\u003e","teachingVideoPlaybackId":"hncIR01GA13UVlbWQOzppt4oj3TS00Sjhw5PLFt5bjk3U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History and Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fae16ee2-ca43-43cb-81b5-a3011f826faa\"}"},{"__ref":"DeepDives:{\"uuid\":\"4ccf355f-dc43-4060-9558-716b32b35cb7\"}"},{"__ref":"DeepDives:{\"uuid\":\"4af7dbc2-506f-4188-8c0f-7c25fcb86bb7\"}"},{"__ref":"DeepDives:{\"uuid\":\"74e73828-148d-499e-ac3a-2f0a751de9d1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/447a3cb0-9ae9-4d63-9cff-c104c5473fea/-/preview/-/format/jpg/","https://ucarecdn.com/3c1764b0-28bd-47c8-98e8-581af8aef660/-/preview/-/format/jpg/","https://ucarecdn.com/bc5af9f4-a261-42c0-b22b-fc9b96c61446/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a35d8084-a479-47ad-ab62-c11dde95ff8e\"}"},{"__ref":"Education:{\"uuid\":\"7e783bdb-99b7-4381-96fc-b59f615a01b5\"}"}],"hiredAt":"2026-01-28T18:39:43.508Z","topics":["Algebra I","Algebra II","6-8 Grade Science","Biology","Chemistry","Writing","Medicine / Health","Sports Analytics","STEM Project","Journalism","Law / Government / Policy"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"chrystal-\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"70da7d28-055f-4faa-b4a6-8da2a8a56dbb\"}"}}},"_sentryTraceData":"47d0ab7ac7fb44c3b49e6c303491257e-b30
