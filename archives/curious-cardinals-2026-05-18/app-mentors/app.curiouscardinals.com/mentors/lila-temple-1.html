48b1-ad9c-6b079ef8f97f","name":"Cleveland High School ","city":"Portland","type":"HIGH","state":"OR","country":"United States","zip":"97202"},"Education:{\"uuid\":\"4f3950bb-ab25-47ef-a227-ee98cbc5d7b8\"}":{"__typename":"Education","uuid":"4f3950bb-ab25-47ef-a227-ee98cbc5d7b8","school":{"__ref":"School:{\"uuid\":\"f5729bc8-072d-48b1-ad9c-6b079ef8f97f\"}"},"startYear":"2019 ","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"50731ed4-e130-4ed5-95ae-6c3cf23c91de\"}":{"__typename":"Education","uuid":"50731ed4-e130-4ed5-95ae-6c3cf23c91de","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Human Biology ","degree":null},"MentorPublicProfile:{\"uuid\":\"70a48ada-9f69-41a4-a32b-22779131c90d\"}":{"__typename":"MentorPublicProfile","uuid":"70a48ada-9f69-41a4-a32b-22779131c90d","displayName":"Lila T.","slug":"lila-temple-1","biography":"\u003cp\u003eThere are many things that inspire me to succeed both academically and personally. I am a Human Biology major and a Creative Writing minor on the Pre-Med track, that may sound like a lot but each of those titles holds dimension. I am a Human Biology major because I find the human body and health systems fascinating. I love to write creatively as it provides an escape from the infinite STEM classes I take as a Pre-Med student. I was a competitive gymnast growing up which fueled my passion for medicine. Growing up in this field, I was constantly interacting with physicians and other medical professionals. I believe medical care for athletes should be safe, comfortable, and personalized and creating this environment is my life goal.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs mentioned above, I see great importance in maintaining creativity in the midst of a STEM career. In addition to creative writing, I am very interested in fashion and design which I explore through my role as a Business team lead at Stanford FashionX, where I help with outreach and event planning. I have also designed for two of FashionX’s runway shows, which has been my favorite creative escapade yet. I am a Depop seller and intern and am very passionate about upcycling and vintage clothing.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe most beautiful thing to me about all of these involvements is the people who I get to interact with on a daily basis. The communities I have found through these niche passions continue to support me, and have become some of my best friends. I cherish spending time with them both inside and outside academic pursuits. In my spare time, I love to do yoga, hike, and be outside in general. If anyone were to ask me what my favorite thing is, my 6-year-old, current self, and every version in between would answer: “the beach.” Hopefully all of that provides a snapshot into who I am, I can’t wait to mentor and learn about you!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"qzfF00Gjz16hFGiv1004Ebf01rdG1V3Gxs2Vn01SoCsYnoY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Biology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"48c2ddd4-b5c1-438a-9dd9-48e23db4ff9e\"}"},{"__ref":"DeepDives:{\"uuid\":\"85861803-f336-4323-81c8-b78225ac5d58\"}"},{"__ref":"DeepDives:{\"uuid\":\"f054946c-9c64-493b-837c-9dc5c237c5bb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6176ee6b-c57f-441c-bf6a-b479d83fc463/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4f3950bb-ab25-47ef-a227-ee98cbc5d7b8\"}"},{"__ref":"Education:{\"uuid\":\"50731ed4-e130-4ed5-95ae-6c3cf23c91de\"}"}],"hiredAt":"2025-01-18T17:14:00
