es","zip":"10468"},"Education:{\"uuid\":\"1245ae6d-cdab-4a13-8a78-d61f84acd5d3\"}":{"__typename":"Education","uuid":"1245ae6d-cdab-4a13-8a78-d61f84acd5d3","school":{"__ref":"School:{\"uuid\":\"c82d12f3-ac36-4e16-a33f-da924be49ad8\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"337d5e24-2f52-417d-b818-b44237c42412\"}":{"__typename":"Education","uuid":"337d5e24-2f52-417d-b818-b44237c42412","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Information Science \u0026 Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"9a7d5316-8bdd-4260-a554-70a07bf8e98b\"}":{"__typename":"MentorPublicProfile","uuid":"9a7d5316-8bdd-4260-a554-70a07bf8e98b","displayName":"Marian C.","slug":"marian-caballo","biography":"\u003cp\u003eHi! I’m Marian. \u003cstrong\u003eI’m a senior at Cornell University studying Information Science and Cognitive Science, and I’m passionate about helping students turn their curiosity into something real! \u003c/strong\u003eI'm originally from NYC and love exploring, figure skating (a new hobby of mine!), crocheting, and filmmaking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI am a technologist at heart. Professionally,\u003cstrong\u003e I’m heading into a full-time role as a Technical Program Manager at Microsoft after interning last summer! \u003c/strong\u003eI’ve also served as a software engineering intern working on rockets at Blue Origin 🚀, a product management intern at Intel 💻, and contributed to projects at Cornell Tech and early-stage startups.\u003cbr\u003e\u003cbr\u003eI also love digital media. \u003cstrong\u003eAt Cornell, I serve as a Senior Editor at The Cornell Daily Sun, where I lead the video, data, and multimedia teams\u003c/strong\u003e. I oversee breaking news coverage, guide reporters through complex stories, and mentor students in clear, accurate, and responsible communication. I’ve conducted interviews ranging from Bill Nye to the producers of \u003cem\u003eSuccession\u003c/em\u003e, and my work has been cited in national outlets and reaches more than 3 million readers and viewers each month.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI’m also one of 25 students selected for \u003cstrong\u003eCornell’s Milstein Program in Technology \u0026amp; Humanity\u003c/strong\u003e, an interdisciplinary cohort focused on building projects at the intersection of \u003cstrong\u003etechnology and community impact! \u003c/strong\u003eI was also admitted as a Pauline and Tanners Dean’s Scholar and received likely letters upon acceptance, which helped shape the academic path I’m on today.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eA few years ago, I was a high schooler in New York City who loved science, technology, and creating, \u003cstrong\u003ebut didn’t always know where to direct it. So I experimented relentlessly: \u003c/strong\u003eworking at the New York Hall of Science, producing a documentary that screened at the Museum of the Moving Image, running a STEM newsletter with 1,000 readers, creating science explainers under a PBS/SciShow host, and working in a neuroscience research lab studying opioid addiction. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eThose early experiences shaped the technologist, journalist, and mentor I’ve become today.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI work best with students who are curious, creative, ambitious, or simply need someone to help them shape their ideas into something real.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003ePassion Projects (my specialty!)\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e• Blending science + technology + communication into impactful projects\u003c/p\u003e\u003cp\u003e• Turning “I like neuroscience / social justice / design / gaming” into real outcomes\u003c/p\u003e\u003cp\u003e• Designing interdisciplinary projects (tech + writing + research + storytelling)\u003c/p\u003e\u003cp\u003e• Building college-ready portfolios\u003c/p\u003e\u003cp\u003e• Creating step-by-step roadmaps with milestones and deliverables\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eContent Creation \u0026amp; Storytelling\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e• Video production (short-form, interview-based, documentary-style)\u003c/p\u003e\u003cp\u003e• Scriptwriting \u0026amp; narrative structure\u003c/p\u003e\u003cp\u003e• Data storytelling \u0026amp; visual communication\u003c/p\u003e\u003cp\u003e• Editing workflows, on-camera confidence, creative decision-making\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAcademic Mentorship\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI can support students in:\u003c/p\u003e\u003cp\u003e• English \u0026amp; writing classes — clarity, structure, storytelling, analytical writing\u003c/p\u003e\u003cp\u003e• Technology classes — digital literacy, data, ethical tech, design thinking\u003c/p\u003e\u003cp\u003e• Intro CS \u0026amp; computational thinking — logic, systems thinking, foundational coding concepts\u003c/p\u003e\u003cp\u003e• Research design \u0026amp; early research skills\u003c/p\u003e\u003cp\u003e• Cognitive science fundamentals\u003c/p\u003e\u003cp\u003e• AI literacy, tech ethics, \u0026amp; responsible innovation\u003c/p\u003e\u003cp\u003e• Critical thinking \u0026amp; analytical skills\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePlus broader skills students actually need: \u003c/strong\u003econfidence, managing perfectionism, time management, idea generation, and communicating clearly.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to mentor\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve been mentoring since high school: from math tutoring, to teaching younger kids at a science museum, interning at an educational nonprofit for young women, to guiding peers in research, writing, filmmaking, and design. At Cornell, I mentor new videographers, journalists, and editors as they build their first projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy sessions are:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHands-on — \u003c/strong\u003ewe build, draft, film, edit, or outline together\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eStructured but flexible — \u003c/strong\u003eeach week ends with a concrete milestone\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eRooted in cognitive science —\u003c/strong\u003e I teach students how to think, not just what to do\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eConfidence-building — \u003c/strong\u003eespecially for bright, perfectionistic, or quiet students\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA typical session includes:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eShaping a vague interest into a clear project with a hook\u003c/p\u003e\u003cp\u003eBuilding a mini prototype (a short video, research question, draft, or storyboard)\u003c/p\u003e\u003cp\u003ePracticing communication and storytelling techniques\u003c/p\u003e\u003cp\u003eUsing real tools (Notion, Figma, editing software, research methods) to execute ideas\u003c/p\u003e\u003cp\u003e\u003cbr\u003eUltimately, everything I do comes back to the same mission: helping people turn raw curiosity into something real. I love working with students who have big ideas (or half-formed ones) and giving them the tools, structure, and confidence to build projects they’re genuinely proud of.\u003c/p\u003e","teachingVideoPlaybackId":"L4sEZ1bxE9sSNnUsB02ALg3502800cJY64zUjMij73ihpI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I’m most proud of is watching my documentary screen at the Museum of the Moving Image, the same museum I grew up visiting on school trips and long weekends. Seeing my work projected on the movie theater screen I used to stare up at as a kid felt surreal. I stood in the back of the theater and watched a real audience react and stay fully with the story.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a15cfdfa-5a4b-4cac-b6b4-d608bd11d913\"}"},{"__ref":"Favorites:{\"uuid\":\"eeb6f29d-a2db-44a9-be5e-98fa25d079d4\"}"},{"__ref":"Favorites:{\"uuid\":\"b88b6fc7-50aa-411c-a477-9d4835fd47f8\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"671a909d-cdba-41cc-94be-56d487b291ec\"}"},{"__ref":"CausesSupported:{\"uuid\":\"895738f2-7aeb-46f5-a21d-a9289b844b61\"}"}],"major":"Information Science \u0026 Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ada5a2e2-8f39-49bb-a237-79dbf7216e4d\"}"},{"__ref":"DeepDives:{\"uuid\":\"b15431c9-165c-4ded-973f-003fbbdd5617\"}"},{"__ref":"DeepDives:{\"uuid\":\"24cc9c16-b4cc-48c6-9370-dc5c0f68fdf3\"}"},{"__ref":"DeepDives:{\"uuid\":\"d314d2b6-6dab-4af6-b3a0-8f020db61365\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4751fa63-2c73-414a-a6ca-44fb508e774b/-/preview/-/format/jpg/","https://ucarecdn.com/447309a6-123a-4bcb-8ccb-093b26d431e7/-/preview/-/format/jpg/","https://ucarecdn.com/4e076c40-15f9-4156-b0af-71213a8c0967/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1245ae6d-cdab-4a13-8a78-d61f84acd5d3\"}"},{"__ref":"Education:{\"uuid\":\"337d5e24-2f52-417d-b818-b44237c42412\"}"}],"hiredAt":"2025-11-29T02:03:12.534Z","topics":["Sports Journalism","Video / Photography","K-6 Storybook","History Project","F
