xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"738164e7-31db-4893-bf84-f8a2ee75d96c\"}":{"__typename":"Favorites","uuid":"738164e7-31db-4893-bf84-f8a2ee75d96c","photoUrl":"https://ucarecdn.com/65c86167-7183-4cfc-8e14-d76d63f9db59/","title":"Our Town by Thornton Wilder","type":"PLAY"},"Favorites:{\"uuid\":\"c4dfa397-68c2-49fa-bfe1-cd25ccca9258\"}":{"__typename":"Favorites","uuid":"c4dfa397-68c2-49fa-bfe1-cd25ccca9258","photoUrl":"https://ucarecdn.com/8ac8cc06-e5fb-4b6a-a66e-510f6d9ef4df/","title":"Meryl Streep","type":"ACTOR"},"Favorites:{\"uuid\":\"deb73dc9-7d1f-4b40-a174-7ae93b8b9fa3\"}":{"__typename":"Favorites","uuid":"deb73dc9-7d1f-4b40-a174-7ae93b8b9fa3","photoUrl":"https://ucarecdn.com/35b8eeca-7c04-4520-875d-944a1a31c895/","title":"Tuesdays with Morrie by Mitch Albom","type":"BOOK"},"CausesSupported:{\"uuid\":\"1af1df9c-aca3-47c8-b5d1-d0e3057d4a49\"}":{"__typename":"CausesSupported","uuid":"1af1df9c-aca3-47c8-b5d1-d0e3057d4a49","name":"Sanctuary for Families","description":"\u003cp\u003eSFFNY is dedicated to aiding victims of domestic violence and their children.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/899c8f43-fa5f-45b1-8a7d-90ef728e7138/"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"39b9a2b8-7c20-4043-9a0c-043b97891742\"}":{"__typename":"DeepDives","uuid":"39b9a2b8-7c20-4043-9a0c-043b97891742","content":"\u003cp\u003eSimply put, if it weren’t a fun and flexible job, I’d still be doing it for free! I genuinely love working with students and have felt drawn to education ever since graduating college. I’m always eager to lend a hand or offer guidance to younger students. At NYU, I was heavily involved in leadership, serving as student chair of my program. I loved the responsibility that came with problem-solving, planning events, and brainstorming new ideas—experiences that have shaped the way I support and guide students today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9c0cfcb1-49ec-48cb-8012-e3970e6fe8f0\"}":{"__typename":"DeepDives","uuid":"9c0cfcb1-49ec-48cb-8012-e3970e6fe8f0","content":"\u003cp\u003eGrowing up, I struggled with anxiety and often had trouble speaking. Everything changed when I first picked up a script—I discovered it was easier to talk when the words were right in front of me. Theatre quickly became a way for me to develop my own voice. As I continued, my passion for performing grew stronger, and with it, my confidence. By my freshman year of high school, I had signed with my manager, and I’ve been pursuing acting professionally ever since!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"969a9be0-dca3-4a22-8a9a-c5e92808c26b\"}":{"__typename":"DeepDives","uuid":"969a9be0-dca3-4a22-8a9a-c5e92808c26b","content":"\u003cp\u003eI’m currently working on my “play with no words,” a dance and movement piece inspired by a real childhood experience. The work explores the strange and confusing world of grief—an experience that can be difficult to put into words. The piece premiered just before I graduated from NYU and has since been selected for further performance and development across New York City!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d16d8ba5-b2fc-42c5-9b1e-c7665b96dc9a\"}":{"__typename":"DeepDives","uuid":"d16d8ba5-b2fc-42c5-9b1e-c7665b96dc9a","content":"\u003cp\u003eIn high school, I served as secretary of my school’s theatre group and led our fundraising and outreach division. I was also a student ambassador and heavily involved in class leadership. And, oddly enough, I was really good at Latin! I worked hard academically, but I always made sure to prioritize having fun and spending time with friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"a670ec83-670d-428e-9c95-61d4578f0248\"}":{"__typename":"School","uuid":"a670ec83-670d-428e-9c95-61d4578f0248","name":"Staples High School","city":"Westport","type":"HIGH","state":"CT","country":"United States","zip":"06880"},"Education:{\"uuid\":\"7d40b814-f05a-4564-8a32-c788b95e35cd\"}":{"__typename":"Education","uuid":"7d40b814-f05a-4564-8a32-c788b95e35cd","school":{"__ref":"School:{\"uuid\":\"a670ec83-670d-428e-9c95-61d4578f0248\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}":{"__typename":"School","uuid":"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5","name":"New York University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10012"},"Education:{\"uuid\":\"ecf4e8e7-3437-4191-b123-dc6722bc3a7c\"}":{"__typename":"Education","uuid":"ecf4e8e7-3437-4191-b123-dc6722bc3a7c","school":{"__ref":"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Drama","degree":null},"MentorPublicProfile:{\"uuid\":\"eb9636d2-b611-4704-b376-1283d0460988\"}":{"__typename":"MentorPublicProfile","uuid":"eb9636d2-b611-4704-b376-1283d0460988","displayName":"Sophie R.","slug":"sophie-rossman","biography":"\u003cp\u003eHey! I’m Sophie Rossman, an actress, playwright, and producer based in New York City. I recently graduated \u003cstrong\u003eMagna Cum Laude\u003c/strong\u003e from NYU Tisch with a BFA in Drama and a minor in Producing for theatre and film/TV, receiving the \u003cstrong\u003eFounders Day Award\u003c/strong\u003e for academic excellence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs an actor, I have worked in both film and theatre, appearing at festivals such as \u003cstrong\u003eSouth by Southwest\u003c/strong\u003e and the \u003cstrong\u003ePalm Springs International Film Festival\u003c/strong\u003e, and on stages including \u003cstrong\u003eLa MaMa Experimental Theatre Club\u003c/strong\u003e, \u003cstrong\u003eClubbed Thumb\u003c/strong\u003e, and the \u003cstrong\u003eAmerican Theatre for Actors\u003c/strong\u003e, among others. These experiences have not only shaped me as a performer but also deepened my appreciation for storytelling and expression—skills that translate directly into my work as an educator and mentor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a self-starter, I \u003cstrong\u003efounded my own theatre festival\u003c/strong\u003e and now produce shows across New York City—an experience that has taught me the value of organization, clear communication, and creative problem solving. It’s important to me that students and young professionals in the entertainment industry have opportunities to experiment, take risks, fail, and try again. My festival is fully self-sustaining, free to participate in, and keeps tickets as affordable as possible to make theatre accessible to everyone. I love building community, and much of my artistic practice centers on combining the arts and health to create work that feels collective rather than individual.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eI have experience working with middle and high-school students, and I currently serve as an artist-in-residence at PS3 Elementary School\u003c/strong\u003e, where I teach science and history through movement and acting. This role has reinforced my belief that \u003cstrong\u003elearning works best when it’s both educational and fun\u003c/strong\u003e. I’m passionate about a \u003cstrong\u003ehands-on approach\u003c/strong\u003e and have experience supporting a wide range of learning styles. I know from my own education that lecturing alone is rarely effective—school should be engaging and enjoyable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my industry, strong collaboration and people skills are essential. Alongside experience in \u003cstrong\u003ebusiness development, marketing, grant writing, and social media management\u003c/strong\u003e, I’m also equipped to help students with \u003cstrong\u003einterview prep, organization and scheduling, public speaking, creative writing, and other arts-related work\u003c/strong\u003e. At the same time, I enjoy returning to academic fundamentals and specialize in teaching \u003cstrong\u003eEnglish\u003c/strong\u003e and \u003cstrong\u003ehistory\u003c/strong\u003e—I’ll always choose writing an essay over taking a math test!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not working, I love reading plays, practicing yoga, seeing theatre, and (of course) having dance parties in my living room.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe in discussing our approach before diving in and \u003cstrong\u003ecreating a comfortable, personal dialogue with parents and students\u003c/strong\u003e. Together, we’ll take things step by step to find the right plan for each individual learner, building both skills and confidence along the way. I can't wait to get started!\u003c/p\u003e","teachingVideoPlaybackId":"EihR8RQ3tPTDDMgCsYUqlFSz4QaxDToZSuswZXfMNoA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne experience I’m particularly proud of was being invited by NYU to participate as a special guest at a Tisch Arts \u0026amp; Health division dinner with colleagues and industry professionals. The evening centered around brainstorming new ways to advance the intersection of arts and health, and I was deeply honored to contribute insights as a recent graduate. Being included in that conversation reaffirmed how much I value collaboration, creative innovation, and the power of the arts to support well-being.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"738164e7-31db-4893-bf84-f8a2ee75d96c\"}"},{"__ref":"Favorites:{\"uuid\":\"c4dfa397-68c2-49fa-bfe1-cd25ccca9258\"}"},{"__ref":"Favorites:{\"uuid\":\"deb73dc9-7d1f-4b40-a174-7ae93b8b9fa3\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"1af1df9c-aca3-47c8-b5d1-d0e3057d4a49\"}"}],"major":"Drama","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"39b9a2b8-7c20-4043-9a0c-043b97891742\"}"},{"__ref":"DeepDives:{\"uuid\":\"9c0cfcb1-49ec-48cb-8012-e3970e6fe8f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"969a9be0-dca3-4a22-8a9a-c5e92808c26b\"}"},{"__ref":"DeepDives:{\"uuid\":\"d16d8ba5-b2fc-42c5-9b1e-c7665b96dc9a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3fb27f61-79a8-4eaa-909c-9f8c883ca3cd/-/preview/-/format/jpg/","https://ucarecdn.com/7013e83e-34b1-4597-b5cd-ac39782b123b/-/preview/-/format/jpg/","https://ucarecdn.com/74243204-ceb1-49ab-91be-9aeffc3c2f62/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7d40b814-f05a-4564-8a32-c788b95e35cd\"}"},{"__ref":"Education:{\"uuid\":\"ecf4e8e7-3437-4191-b123-dc6722bc3a7c\"}"}],"hiredAt":"2025-10-03T15:11:21.387Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Creative Writing","Film / Theater","Video / Photography","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/9fa2d8bf-132f-4356-a39d-e6f0aecb3e5b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sophie-rossman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"eb9636d2-b611-4704-b376-1283d0460988\"}"}}},"_sentryTraceData":"eccf9833202a40279279ab0f2c7faa4a-adb2c7184a7420d9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=eccf9833202a40279279ab0f2c7faa4a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sophie-rossman"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
