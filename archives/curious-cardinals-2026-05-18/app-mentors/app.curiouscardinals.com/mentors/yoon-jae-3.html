xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d7d0907b-f7ae-4565-aa15-d86424cad781\"}":{"__typename":"DeepDives","uuid":"d7d0907b-f7ae-4565-aa15-d86424cad781","content":"\u003cp\u003eI want to understand. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am a strong practitioner of the Socratic Method in questioning. I am uneasy when a question is answered too easily and when I'm told, \"that's just how it is.\" Taking a harder coursework in high school led me to keep asking the question of why? And eventually this led me to Applied Physics, which keeps my curiosity fueled. I aim to foster this sense of curiosity to all that I help!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5b9717f8-02dc-4068-9c37-915218c77928\"}":{"__typename":"DeepDives","uuid":"5b9717f8-02dc-4068-9c37-915218c77928","content":"\u003cp\u003eMentorship matters because how it's impacted me throughout my life. I am a strong believer in the the idea that behind every successful person, there exists a framework that helped them reach the level of success they are now. Personally, in both high school and college, I found myself seeking advice and help from upperclassmen, which often proved to be extremely formative and changed how I approached academics, extracurriculars, etc. I am deeply thankful of those people who have acted as a mentor to me and hope to reciprocate that action in return.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5c01925f-8aef-43af-863b-77c3a2bf2320\"}":{"__typename":"DeepDives","uuid":"5c01925f-8aef-43af-863b-77c3a2bf2320","content":"\u003cp\u003e\"Chase the understanding and not the grade.\" In high school and middle school, I believed that the source of academic success was trying to score as highly as possible in the class. However, overtime I have come to realize that grades are only meant to reflect your understanding of the course material, and that understanding is ultimately the purpose. When you prioritize understanding, you build a mental framework and perspective that allows more information to stick with you ultimately benefitting you more down the line.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"9c811c34-a2da-414a-861a-314bb9f8b66f\"}":{"__typename":"DeepDives","uuid":"9c811c34-a2da-414a-861a-314bb9f8b66f","content":"\u003cp\u003eMy dream job is to be a researcher advancing the frontier of science in the field of physics. When I was in high school, I was introduced to a quote by famous physicist Issac Newton, \"If I have seen further, it is by standing on the shoulders of giants.\" This details a fact so core to scientific knowledge in general. I know all that I know in these fascinating subjects because of all the scientists before me, and I hope to keep this reinforcing cycle going for the next generation of scientists.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"b4519943-7747-4939-b581-33c208b7493e\"}":{"__typename":"School","uuid":"b4519943-7747-4939-b581-33c208b7493e","name":"Marquette High School","city":"Chesterfield","type":"HIGH","state":"Missouri","country":"United States","zip":"63017"},"Education:{\"uuid\":\"e470d83b-3405-421f-abc1-20b04ca33696\"}":{"__typename":"Education","uuid":"e470d83b-3405-421f-abc1-20b04ca33696","school":{"__ref":"School:{\"uuid\":\"b4519943-7747-4939-b581-33c208b7493e\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"490ea03e-d8d8-4980-b4d7-b04ddfd83dd3\"}":{"__typename":"Education","uuid":"490ea03e-d8d8-4980-b4d7-b04ddfd83dd3","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Applied Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"e53a4515-ada6-4be8-a5d8-6fbcd735fe8f\"}":{"__typename":"MentorPublicProfile","uuid":"e53a4515-ada6-4be8-a5d8-6fbcd735fe8f","displayName":"Yoon Jae C.","slug":"yoon-jae-3","biography":"\u003cp\u003eHello everyone! My name is Yoon Jae Chang, and I am a student at Columbia University in the City of New York. I am an Applied Physics Major, minoring in Computer Science and Statistics. I'm extremely happy to be working with Curious Cardinals and to be able to serve as a mentor to everyone here!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEver since I can remember, I have been deeply interested in science and math. I was fortunate enough to go to Marquette High School in St. Louis, Missouri, where many different AP classes were offered with excellent teachers. Through this, I was able to further develop my passion for scientific and mathematical understanding with a focus on physics. I have pursued this in college by majoring in Applied Physics and getting involved with its community at Columbia. I hope to one day become a physics researcher. Outside of school, I have various different interests and passions. I love going to all the different places New York has to offer. Apart from that you can often find me running, reading, playing tennis, and hiking. I know what it's like maintaining a busy schedule while also trying to foster different passions and interests.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI know it may be easy to see a student like me and just assume that these subjects are easy for them. However, it was quite the opposite for me. Learning can be fun; learning can be easy; learning can be so hard you want to bury your head in the ground. I have gone through every stage, which provides me with the empathy that's so vital in a mentorship, allowing me to connect and communicate better to the students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy approach to mentorship is rooted in the belief that any concept or subject can become accessible when met with persistence, a good mindset, and the right support. I aim to help and mentor students navigate their own academic challenges with confidence. I am confident in creating a space where questions are celebrated, and \"hitting a wall\" is seen as a stepping stone rather than a place to stop. I look forward to growing and discovering alongside everyone on this platform!\u003c/p\u003e","teachingVideoPlaybackId":"H9uti8B01uEXteYhhF5BgsEeHBcv7gIEbq302ZUvRG01NQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d7d0907b-f7ae-4565-aa15-d86424cad781\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b9717f8-02dc-4068-9c37-915218c77928\"}"},{"__ref":"DeepDives:{\"uuid\":\"5c01925f-8aef-43af-863b-77c3a2bf2320\"}"},{"__ref":"DeepDives:{\"uuid\":\"9c811c34-a2da-414a-861a-314bb9f8b66f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4c4a409d-ad09-4c90-ba22-bdfcc0137caa/-/preview/-/format/jpg/","https://ucarecdn.com/f6ca83e6-7825-4a55-9506-e3eaad3f9e78/-/preview/-/format/jpg/","https://ucarecdn.com/ee33213a-dc67-48f0-82f5-34f3cecece69/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e470d83b-3405-421f-abc1-20b04ca33696\"}"},{"__ref":"Education:{\"uuid\":\"490ea03e-d8d8-4980-b4d7-b04ddfd83dd3\"}"}],"hiredAt":"2026-01-19T19:03:30.716Z","topics":["Calculus","Precalculus / Trigonometry","Statistics","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","Physics","Chemistry","Writing","College Essay Writing","Computer Science","Academic Coaching"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"yoon-jae-3\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e53a4515-ada6-4be8-a5d8-6fbcd735fe8f\"}"}}},"_sentryTraceData":"7a05301422314ebf853dfb6558fff251-982835f112d4f9e4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7a05301422314ebf853dfb6558fff251,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"yoon-jae-3"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var
