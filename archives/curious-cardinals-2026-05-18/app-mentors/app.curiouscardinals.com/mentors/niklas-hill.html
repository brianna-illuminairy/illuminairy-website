xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c71dd725-540e-4f51-93ce-ba9f157b3222\"}":{"__typename":"Favorites","uuid":"c71dd725-540e-4f51-93ce-ba9f157b3222","photoUrl":"https://ucarecdn.com/89c6729c-dd05-4e46-a309-06e4f205f450/","title":"Caleb Williams","type":"ATHLETE"},"Favorites:{\"uuid\":\"aa534e3f-1738-4306-9c56-3c74c38dba9b\"}":{"__typename":"Favorites","uuid":"aa534e3f-1738-4306-9c56-3c74c38dba9b","photoUrl":"https://ucarecdn.com/22e2bde4-2969-4b6d-b6b0-4b173592ab76/","title":"Chicago","type":"CITY"},"Favorites:{\"uuid\":\"f7db3c5a-04ef-4cac-9e95-caecdb474c20\"}":{"__typename":"Favorites","uuid":"f7db3c5a-04ef-4cac-9e95-caecdb474c20","photoUrl":"https://ucarecdn.com/7999ba18-2477-496b-a0fe-08c45944a0cf/","title":"Les Miserables","type":"PLAY"},"CausesSupported:{\"uuid\":\"de49fae1-11f3-4093-8170-0221cbce6f90\"}":{"__typename":"CausesSupported","uuid":"de49fae1-11f3-4093-8170-0221cbce6f90","name":"YMCA","description":"\u003cp\u003eVolunteered in South Africa preparing and distributing food for 2 months.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"356eb541-0084-41b3-8c56-c8c1d5462c90\"}":{"__typename":"DeepDives","uuid":"356eb541-0084-41b3-8c56-c8c1d5462c90","content":"\u003cp\u003eI’d tell my younger self to push my limits more and not be afraid of being uncomfortable. In reality, you don’t really remember the easy, comfortable parts of life, you remember the times you took a risk or did something that challenged you. Those are the moments that will actually shape you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"32870b90-fc56-4a69-9ef9-b8139c6e3aa1\"}":{"__typename":"DeepDives","uuid":"32870b90-fc56-4a69-9ef9-b8139c6e3aa1","content":"\u003cp\u003eMentorship matters to me because I’ve experienced firsthand how impactful it can be. I have ADHD, and in high school I really struggled to stay engaged and care about my schoolwork. However, my mentor helped me find something I truly enjoyed working with, and motivated me to work just that much more. I hope to impact future generations in the same way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"23d5b93a-370c-41e4-8333-b2bb54947a16\"}":{"__typename":"DeepDives","uuid":"23d5b93a-370c-41e4-8333-b2bb54947a16","content":"\u003cp\u003eWhen I was in high school, one of my passion projects was focused on sustainability and reducing waste at my school. I helped implement a more thorough recycling system and encouraged the school to start a composting program to minimize food waste. As a current Environment and Sustainability major, I can say that this project truly represented my passion.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"39303ced-f9b8-459f-9f0b-20dc82f0a4b8\"}":{"__typename":"DeepDives","uuid":"39303ced-f9b8-459f-9f0b-20dc82f0a4b8","content":"\u003cp\u003eOne of my biggest goals in life is to travel the world and experience the unique cultures it has to offer. I’m not talking about what you see on social media, but the real, everyday lives of people in different places. I want to immerse myself in these communities, learn from them, and see the world from perspectives that are different from my own. I believe the purpose of life is to explore the amazing nature and people this world has to offer. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"53f12d14-ddaa-4420-90f8-98f9b415c258\"}":{"__typename":"School","uuid":"53f12d14-ddaa-4420-90f8-98f9b415c258","name":"Wheaton Warrenville South High School","city":"Wheaton","type":"HIGH","state":"Illinois","country":"United States","zip":"60189"},"Education:{\"uuid\":\"a3872ae1-9a31-4790-bac2-76a041c038cb\"}":{"__typename":"Education","uuid":"a3872ae1-9a31-4790-bac2-76a041c038cb","school":{"__ref":"School:{\"uuid\":\"53f12d14-ddaa-4420-90f8-98f9b415c258\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"8ee99a73-6f35-471f-bcbe-54d5d8479020\"}":{"__typename":"Education","uuid":"8ee99a73-6f35-471f-bcbe-54d5d8479020","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Environment and Sustainability","degree":null},"MentorPublicProfile:{\"uuid\":\"059f7e2c-6b3f-4f98-827d-bd9b8acae752\"}":{"__typename":"MentorPublicProfile","uuid":"059f7e2c-6b3f-4f98-827d-bd9b8acae752","displayName":"Niklas H.","slug":"niklas-hill","biography":"\u003cp\u003eHello! My name is Niklas, and I am an Environment and Sustainability major at Cornell University, with an intended concentration in economics and a minor in philosophy. Alongside my academics, I am involved in Cornell’s trading club, sports analytics club, and an Environment \u0026amp; Sustainability project team. My team and I are currently working on initiatives that can be taken to further minimize food waste on campus. The average college student wastes roughly 120 pounds of food a year, and we are trying to minimize these numbers at Cornell!\u003c/p\u003e\u003cp\u003eWith that in mind, my goal in life is more than just building a successful career, I want to do work that genuinely makes a difference. I’m especially interested in addressing climate change, not only because of its impact on the environment, but because of how deeply it affects people and communities around the world. To me, protecting the environment isn’t just important, it’s a responsibility our generation has to those who come after us.\u003c/p\u003e\u003cp\u003eAfter high school, I took a gap year to explore my passions. I spent the year living in Norway, where I became involved in several community-based projects. For starters, I worked with a Ukrainian refugee camp, helping refugees learn the Norwegian language and adjust to a new culture. I also spent time with the Sámi, the Indigenous people of northern Norway. Through collaborating with the Sámi, they taught me about sustainable practices they have used for generations, and we worked together to see how those ideas could be applied in modern communities. Lastly, during this time, I also spent 2 months in South Africa, backpacking along the southern coast while volunteering with local organizations, including the YMCA. There, I helped prepare and distribute food to communities in need. \u003c/p\u003e\u003cp\u003eOverall, these experiences over the course of my gap year shaped my passions, and how I live life. My gap year made me value curiosity, adaptability, and understanding different perspectives on a completely new level. As a tutor, I hope to bring that same mindset to my students by helping them build confidence, stay engaged, and find approaches that work best for them.\u003c/p\u003e","teachingVideoPlaybackId":"b3sPyt00u02hNpgohBnr8jvQb3XUQLHusfQHll1iX02hq4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c71dd725-540e-4f51-93ce-ba9f157b3222\"}"},{"__ref":"Favorites:{\"uuid\":\"aa534e3f-1738-4306-9c56-3c74c38dba9b\"}"},{"__ref":"Favorites:{\"uuid\":\"f7db3c5a-04ef-4cac-9e95-caecdb474c20\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"de49fae1-11f3-4093-8170-0221cbce6f90\"}"}],"major":"Environment and Sustainability","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"356eb541-0084-41b3-8c56-c8c1d5462c90\"}"},{"__ref":"DeepDives:{\"uuid\":\"32870b90-fc56-4a69-9ef9-b8139c6e3aa1\"}"},{"__ref":"DeepDives:{\"uuid\":\"23d5b93a-370c-41e4-8333-b2bb54947a16\"}"},{"__ref":"DeepDives:{\"uuid\":\"39303ced-f9b8-459f-9f0b-20dc82f0a4b8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/17c08747-44a7-4c45-a2e9-bc9ee4acaa55/-/preview/-/format/jpg/","https://ucarecdn.com/5ca86e86-e5b0-4681-92c5-2772ace93c5a/-/preview/-/format/jpg/","https://ucarecdn.com/2653ac30-e36a-435e-a239-04677ea9d7ec/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a3872ae1-9a31-4790-bac2-76a041c038cb\"}"},{"__ref":"Education:{\"uuid\":\"8ee99a73-6f35-471f-bcbe-54d5d8479020\"}"}],"hiredAt":"2026-03-24T02:07:36.142Z","topics":["K-5 Grade Math","Geometry","Precalculus / Trigonometry","Algebra I","Algebra II","Pre-Algebra","Biology","6-8 Grade Science","Writing","Academic Coaching","College Essay Writing","K-6 Storybook","Creative Writing","Sports Journalism","Finance / Investing","Sports Analytics","Sustainability","Debat
