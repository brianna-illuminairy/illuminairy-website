xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"10595f99-32b3-41ef-ad04-7df962291cec\"}":{"__typename":"Favorites","uuid":"10595f99-32b3-41ef-ad04-7df962291cec","photoUrl":"https://ucarecdn.com/44d9f0bd-b2c1-4273-a5eb-cac0b02fcb85/","title":"New York Knicks ","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"2c023c90-c172-42bc-9e46-cd2c77d16012\"}":{"__typename":"Favorites","uuid":"2c023c90-c172-42bc-9e46-cd2c77d16012","photoUrl":"https://ucarecdn.com/44d9f0bd-b2c1-4273-a5eb-cac0b02fcb85/","title":"Barcelona","type":"CITY"},"Favorites:{\"uuid\":\"14dcbf11-1f82-4311-ac0a-f1de073b9718\"}":{"__typename":"Favorites","uuid":"14dcbf11-1f82-4311-ac0a-f1de073b9718","photoUrl":"https://ucarecdn.com/44d9f0bd-b2c1-4273-a5eb-cac0b02fcb85/","title":"the Catcher in the Rye ","type":"BOOK"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"def6a4af-f3a4-4d36-a6ea-ce4373f24323\"}":{"__typename":"DeepDives","uuid":"def6a4af-f3a4-4d36-a6ea-ce4373f24323","content":"\u003cp\u003eMy greatest role model is my mom. She is the coolest and strongest person I know. My mother has taught me Everything. For example, she showed me the importance of time management and highlighted the big things like knowing my self-worth. I love my mom and she will forever be my role model.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f64cc006-a146-46a9-82c8-06d2d1afcf7c\"}":{"__typename":"DeepDives","uuid":"f64cc006-a146-46a9-82c8-06d2d1afcf7c","content":"\u003cp\u003eI chose my major because I want to pass down my knowledge. Understanding the nuances of the business world and being financially literate is not a common topic of discussion for most; however, it should be. When you are young you understand that getting a job means making money. Nevertheless, making money is not all one needs to do, being able to grow your money is also necessary. From my experience and education, I want to help explain to younger generations the importance of money management and overall finances. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6f5ec7e4-7d74-4980-862f-677462b2d8d0\"}":{"__typename":"DeepDives","uuid":"6f5ec7e4-7d74-4980-862f-677462b2d8d0","content":"\u003cp\u003eMy dream job is to work in the sports industry. As a young girl, I was always a part of a sports team. In High School, I ran cross country and track and during the winter season, I played basketball. Sports provide a sense of camaraderie and community that lifts one's spirit no matter what. As professional sports have shown us, you can be a part of the team whether you are playing or watching. In conclusion, I would love to work for a professional team in their finance department overseeing their risk. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}":{"__typename":"School","uuid":"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5","name":"The Chapin School","city":"New York","type":"HIGH","state":"NY","country":"USA","zip":"10028"},"Education:{\"uuid\":\"cd651c2e-6f5f-461f-8e4d-7fa591bd8e86\"}":{"__typename":"Education","uuid":"cd651c2e-6f5f-461f-8e4d-7fa591bd8e86","school":{"__ref":"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}"},"startYear":"2007","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"1be881ce-f9ea-4362-add2-75b096e9fec4\"}":{"__typename":"Education","uuid":"1be881ce-f9ea-4362-add2-75b096e9fec4","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Business Administration","degree":null},"MentorPublicProfile:{\"uuid\":\"6a5862f1-a5ec-4de9-819f-95d93a82a8db\"}":{"__typename":"MentorPublicProfile","uuid":"6a5862f1-a5ec-4de9-819f-95d93a82a8db","displayName":"Kosi L.","slug":"kosi-lewis","biography":"\u003cp\u003eKosi is studying at the Marshall School of Business at the University of Southern California (USC) and slated to graduate in December 2024. After serving as a fellow at J.P. Morgan, Kosi was invited to intern in their Risk Management division this summer within the Corporate Investment Bank.\u0026nbsp; As a native New Yorker, Kosi attended The Chapin School from kindergarten to 12th grade. At Chapin, she founded the school's first affinity group for middle and upper school Black students.\u0026nbsp; Kosi believes that having a space where individuals feel accepted and welcomed is crucial, especially when you are a minority. Kosi is currently a member of USC’s\u0026nbsp; Kó Society, a black women student organization that focuses on community service and mentorship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince high school, Kosi has taken babysitting jobs for all ages from infants to high school age.\u0026nbsp; Kosi has experience in middle school math, calculus, and finance. She is also able to tutor in reading, writing, and time management skills.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs an individual with dyslexia, Kosi understands that learning comes in all shapes and sizes. She is eager to meet her mentees where they are and excited to watch them excel.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eKosi starts every morning by walking her dog and listening to a podcast. For fun, she enjoys going to museums, hiking, trying new restaurants, and running.\u0026nbsp; When she is home from school, she is commonly found laughing with her sister or hanging out with her friends from Chapin.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"RJKd007MkAqH01Mpx8zUImo79e1UI002ORiIaQqBL801K68","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"10595f99-32b3-41ef-ad04-7df962291cec\"}"},{"__ref":"Favorites:{\"uuid\":\"2c023c90-c172-42bc-9e46-cd2c77d16012\"}"},{"__ref":"Favorites:{\"uuid\":\"14dcbf11-1f82-4311-ac0a-f1de073b9718\"}"}],"causesSupported":[],"major":"Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"def6a4af-f3a4-4d36-a6ea-ce4373f24323\"}"},{"__ref":"DeepDives:{\"uuid\":\"f64cc006-a146-46a9-82c8-06d2d1afcf7c\"}"},{"__ref":"DeepDives:{\"uuid\":\"6f5ec7e4-7d74-4980-862f-677462b2d8d0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c721263a-d525-4163-90ee-fb11ddd92a61/-/preview/-/format/jpg/","https://ucarecdn.com/cd78511a-8b07-48e1-892d-9a61e877a60b/-/preview/-/format/jpg/","https://ucarecdn.com/866a67b0-3831-4dcf-bf0e-6b86ccb76f28/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"cd651c2e-6f5f-461f-8e4d-7fa591bd8e86\"}"},{"__ref":"Education:{\"uuid\":\"1be881ce-f9ea-4362-add2-75b096e9fec4\"}"}],"hiredAt":"2024-02-04T23:23:54.371Z","topics":["
