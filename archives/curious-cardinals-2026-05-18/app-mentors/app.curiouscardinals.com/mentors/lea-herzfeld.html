xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"403d66d0-cb48-450d-8c48-7a6605c8b1ef\"}":{"__typename":"Favorites","uuid":"403d66d0-cb48-450d-8c48-7a6605c8b1ef","photoUrl":"https://ucarecdn.com/0e24e705-b9f6-466a-af92-904674985fba/","title":"Caitlin Clark","type":"ATHLETE"},"Favorites:{\"uuid\":\"1dc9edec-f05f-4891-81d3-32048a85333c\"}":{"__typename":"Favorites","uuid":"1dc9edec-f05f-4891-81d3-32048a85333c","photoUrl":"https://ucarecdn.com/ccf59e39-c485-486c-b8fc-2790017b2db3/","title":"The Shawshank Redemption","type":"MOVIE"},"Favorites:{\"uuid\":\"529da19a-5033-438e-b7c7-fe9f0651fd4c\"}":{"__typename":"Favorites","uuid":"529da19a-5033-438e-b7c7-fe9f0651fd4c","photoUrl":"https://ucarecdn.com/884784a4-cda0-4709-b187-ad9f4bb1e999/","title":"Taylor Swift","type":"ARTIST"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"20e39bc6-3a5c-4db4-a8d3-66c2839cc160\"}":{"__typename":"DeepDives","uuid":"20e39bc6-3a5c-4db4-a8d3-66c2839cc160","content":"\u003cp\u003eStarting in the 6th grade and all throughout high school, I was constantly pushing myself to achieve success in every class, club or opportunity that came my way. While that work ethic was admirable and got me far, I would tell myself to take some more time to have fun. Hobbies and interests are so important and provide an outlet to find one's authentic identity amidst the pressures of school and growing up. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"dc77904a-efe7-4cd5-94ec-df6ab2f5c083\"}":{"__typename":"DeepDives","uuid":"dc77904a-efe7-4cd5-94ec-df6ab2f5c083","content":"\u003cp\u003eI hope to travel to every continent in the world some day. I have been to 16 countries but only 3/7 continents so far. I love exploring cultures, meeting people, trying cuisines and seeing beautiful sites around the world. My favorite place I've been so far is Iceland where I was lucky enough to witness the Aurora  Borealis (Northern Lights)!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"81544b30-1405-4edc-be86-56edaa4ef97c\"}":{"__typename":"DeepDives","uuid":"81544b30-1405-4edc-be86-56edaa4ef97c","content":"\u003cp\u003eEconomics piqued my interest as more than a finance major. When I first took AP economics in high school, it was as a self-taught independent study because my school didn't offer it. I loved the way it explained how so much of our society functions; how people make decisions, what happiness and utility mean, the way that countries interact with one another. As I took classes in college such as Behavioral Economics and The Logic and Limits of Economic Justice, I was captivated by the universal application of economic concepts. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"e666a9cd-2325-4ed7-9e72-1c49d3121769\"}":{"__typename":"DeepDives","uuid":"e666a9cd-2325-4ed7-9e72-1c49d3121769","content":"\u003cp\u003eMy greatest role model is my mother, as cliche as it sounds. She works full time as a top neurologist in the city while raising seven children. She has always pushed me to work hard and demonstrated to me that I can succeed and be the best at what I do. She is one of the most generous people I know and constantly supports family, friends and community members in need. The most important lesson she has taught me is to advocate for what I believe in, no matter the consequences. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"9370660f-5969-4071-8f1a-5da04222d017\"}":{"__typename":"School","uuid":"9370660f-5969-4071-8f1a-5da04222d017","name":"Melvin J. Berman Hebrew Academy","city":"Rockville","type":"HIGH","state":"Maryland","country":"United States","zip":"20853"},"Education:{\"uuid\":\"18535baa-979d-4279-846e-3592d73e4a76\"}":{"__typename":"Education","uuid":"18535baa-979d-4279-846e-3592d73e4a76","school":{"__ref":"School:{\"uuid\":\"9370660f-5969-4071-8f1a-5da04222d017\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}":{"__typename":"School","uuid":"67d96877-4245-4f9b-a557-94f9ecabd290","name":"Barnard College","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"150dbd77-c480-4334-b628-6eabebadb68a\"}":{"__typename":"Education","uuid":"150dbd77-c480-4334-b628-6eabebadb68a","school":{"__ref":"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"979cf4d8-5fd8-4d08-ad92-4b6a9c6c0da0\"}":{"__typename":"MentorPublicProfile","uuid":"979cf4d8-5fd8-4d08-ad92-4b6a9c6c0da0","displayName":"Lea H.","slug":"lea-herzfeld","biography":"\u003cp\u003eHello! My name is Lea and I am pursuing a J.D./MBA at Columbia Law School and Columbia Business School.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI graduated from Barnard College of Columbia University in 2022 where I majored in Economics and minored in history and psychology. At Barnard, I was a speaking fellow. In this position I coached and mentored students preparing for class presentations, seminar discussions and interviews. I am passionate about helping students find their voice and developing the tools to communicate effectively. Also at Barnard, I co-founded the Athena Mock Trial club. This organization allowed students to simulate court experiences without the pressure of an intensive competition.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFollowing Barnard, I worked as an investment banking analyst at Solomon Partners where I developed my quantitative financial modeling skills and entrepreneurial passions. This experience taught me how to work hard and balance a high-pressure job with doing the things I love.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eComing from a big family with 6 younger siblings, I have always been passionate about mentorship and teaching. I love spending time with my brothers and sister - playing football, testing each other on Harry Potter trivia or cooking Shabbat dinner. I am excited to get to know my mentees through Curious Cardinals and help them succeed!\u003c/p\u003e","teachingVideoPlaybackId":"5LZ8Q5MwO68Lw9MuItA65yLLRpiVrAInK37Ceb01o1v00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"403d66d0-cb48-450d-8c48-7a6605c8b1ef\"}"},{"__ref":"Favorites:{\"uuid\":\"1dc9edec-f05f-4891-81d3-32048a85333c\"}"},{"__ref":"Favorites:{\"uuid\":\"529da19a-5033-438e-b7c7-fe9f0651fd4c\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref"
