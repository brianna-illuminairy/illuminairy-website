xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3bf1d673-2e83-43de-8d4c-daae19ff7f73\"}":{"__typename":"Favorites","uuid":"3bf1d673-2e83-43de-8d4c-daae19ff7f73","photoUrl":"https://ucarecdn.com/e4b094e9-9b0f-4c8c-b96f-28ef5bd732ad/","title":"Cillian Murphy","type":"ACTOR"},"Favorites:{\"uuid\":\"2ceab01f-afe6-4b48-86f9-bd52f22153a9\"}":{"__typename":"Favorites","uuid":"2ceab01f-afe6-4b48-86f9-bd52f22153a9","photoUrl":"https://ucarecdn.com/648f2d6b-a46a-41a8-9125-bb520756ce17/","title":"Nine Track Mind - Charlie Puth","type":"ALBUM"},"Favorites:{\"uuid\":\"01c2a192-5c65-4064-b3b8-5fc849d29e02\"}":{"__typename":"Favorites","uuid":"01c2a192-5c65-4064-b3b8-5fc849d29e02","photoUrl":"https://ucarecdn.com/09a527a8-b5f0-4474-84aa-6a0916bcead6/","title":"I don’t have just one: my favorites span different genres. For pop I love Charlie Puth and Jung Kook, for R\u0026B it’s RINI, Christian Kuria, \u0026 Ne-Yo, for alternative it’s Tame Impala, and for classics of pop and soul I always go back to Justin Timberlake, Bruno Mars, and Justin Bieber.","type":"ARTIST"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"f666152a-b12e-4644-956d-1c86a4e64da5\"}":{"__typename":"DeepDives","uuid":"f666152a-b12e-4644-956d-1c86a4e64da5","content":"\u003cp\u003eMy greatest mentor has been Dr. Aline Oliveira, who has guided me since I was an eighteen-year-old freshman just starting in research. From the beginning, she treated me as an equal and encouraged me to pursue my curiosity with confidence, even when I felt out of my depth. She has shown me that mentorship is built on trust, honesty, and care, and she exemplifies the kind of mentor I aspire to be for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b830919b-d728-46d9-8f29-c97eea8e46d5\"}":{"__typename":"DeepDives","uuid":"b830919b-d728-46d9-8f29-c97eea8e46d5","content":"\u003cp\u003eDon’t be afraid to ask for help and take up space. The people around you want to see you grow, and the sooner you trust that, the more opportunities you’ll be able to embrace.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a137906c-d9a0-4813-b2c5-5eae3a30821d\"}":{"__typename":"DeepDives","uuid":"a137906c-d9a0-4813-b2c5-5eae3a30821d","content":"\u003cp\u003eBecoming a physician-scientist, where I can both care for patients and lead research that uncovers how the brain and body interact in health and disease.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"5beed68c-02c5-46c1-80f8-294c3b45874a\"}":{"__typename":"DeepDives","uuid":"5beed68c-02c5-46c1-80f8-294c3b45874a","content":"\u003cp\u003eOut of all the things I could be doing, I choose mentorship because it has been the single most transformative part of my own journey. When I first stepped into research, I was full of questions but unsure of myself. Having a mentor who treated me as an equal, believed in my potential, and guided me with patience and honesty changed everything. It gave me the confidence to ask bigger questions and the resilience to keep going when things got hard. Mentorship showed me that growth doesn’t come from knowing all the answers, but from having someone who helps you ask the right ones. Now, I want to provide that same kind of support for others—to be the person who helps them see possibilities in themselves they might not yet see. For me, mentorship isn’t just about guidance, it’s about building trust, cultivating confidence, and opening doors that can alter the course of someone’s life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"55aff62f-bcf5-4362-9ac2-9e261fcfc889\"}":{"__typename":"School","uuid":"55aff62f-bcf5-4362-9ac2-9e261fcfc889","name":"Suncoast Community High School","city":"Riviera Beach","type":"HIGH","state":"Florida","country":"United States","zip":"33404"},"Education:{\"uuid\":\"e7ced138-ff59-4627-8ad5-63116305033a\"}":{"__typename":"Education","uuid":"e7ced138-ff59-4627-8ad5-63116305033a","school":{"__ref":"School:{\"uuid\":\"55aff62f-bcf5-4362-9ac2-9e261fcfc889\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2f41b623-6021-4481-934b-c9f2439459c8\"}":{"__typename":"School","uuid":"2f41b623-6021-4481-934b-c9f2439459c8","name":"University of Florida","city":"Gainesville","type":"COLLEGE","state":"Florida","country":"United States","zip":"32611"},"Education:{\"uuid\":\"bf7f3f52-0ca6-4917-b2de-07cc97299420\"}":{"__typename":"Education","uuid":"bf7f3f52-0ca6-4917-b2de-07cc97299420","school":{"__ref":"School:{\"uuid\":\"2f41b623-6021-4481-934b-c9f2439459c8\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"62c03104-0ed2-46b7-8b9b-3dc67156b37a\"}":{"__typename":"MentorPublicProfile","uuid":"62c03104-0ed2-46b7-8b9b-3dc67156b37a","displayName":"Sultan K.","slug":"sultan-khanfar","biography":"\u003cp\u003eHi! My name is Sultan Khanfar, and I’m a third-year undergraduate student at the University of Florida, where I study Chemistry with a focus on neuroscience and neuroimmunology. At the heart of my work is a big question: how do tiny cells in the brain, like microglia, shape the way we think, learn, and experience disease? I care deeply about making science not just understandable, but exciting, because I believe the best ideas are the ones we can share clearly with others.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy path into science began with my family. When I was younger, my brother experienced unexplained seizures, and watching him go through that experience made me curious about the brain. That curiosity grew into a passion that has guided my academic journey. In high school, I joined a university epilepsy lab, where I studied how natural compounds might reduce seizure activity. Since then, I’ve worked in multiple labs: studying how immune cells in the brain remodel synapses at the University of Florida, investigating how neurodegeneration spreads through tiny tubes connecting neurons at Scripps, and exploring how viruses interact with human neurons at Stanford. Across these experiences, one thing has stuck: for me, the most meaningful science is the kind that connects the smallest details in the lab to the lives of people and families.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the lab, I dedicate much of my time to mentoring refugee students, both locally and internationally. I work with a team to provide academic support and professional guidance to students who often have limited access to consistent resources. Our goal is to help them succeed in school, build confidence, and explore future careers. Through this work, I’ve seen how mentorship can change lives — not only by helping students grasp difficult concepts, but also by opening doors to possibilities they might not have imagined for themselves.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I’ve been honored to receive national recognition such as the Barry Goldwater Scholarship, the nation’s premier undergraduate award in STEM. I have also earned research fellowships at leading institutions and presented my work at national conferences across the country. But what excites me most is sharing discoveries with others, sparking curiosity, and helping the next generation feel the same excitement I do about science and its possibilities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not in the lab or teaching, you can usually find me playing basketball, swimming, or out on the soccer field. I also love traveling to new places and, honestly, eating lots and lots of good food. I believe learning should be joyful, collaborative, and creative, and that is exactly the kind of environment I aim to build with every student I work with.\u003c/p\u003e","teachingVideoPlaybackId":"oGGiiFMebGrVqchbBV02WPbsDF7eByhYyfxs7cPVpXOY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I’m proudest of grew out of what first felt like a failure. I had spent months preparing experiments for the American Physiology Summit, only to realize—because of a miscommunication with another lab—that the mice I needed arrived too late. I couldn’t finish in time, and I had to step back from a conference I’d presented at the year before. It was devastating to feel that an entire semester’s work had unraveled.\u003c/p\u003e\u003cp\u003eInstead of giving up, I decided to rebuild. I designed new questions, developed new staining combinations, and refined my analysis from the ground up. Over the next nine months, I troubleshot protocols, swapped out markers, and worked with imaging specialists to push the limits of the technology, even demoing a 60X objective to get the resolution needed for my research. By the end of the semester, I had finally established a workflow that worked, and I made the choice to stay in Gainesville three weeks past my lease—sleeping on a friend’s floor and walking an hour each day to the lab—because I knew I was on the edge of something worth finishing.\u003c/p\u003e\u003cp\u003eJust before leaving, I got the results I had been chasing for months. With that data, I submitted an abstract to Neuroscience 2025, was invited to deliver an oral presentation in a prestigious nanosymposium, and received the Trainee Professional Development Award along with multiple travel grants that fully funded my participation. What I’m most proud of isn’t just the recognition, but that I turned what felt like a complete setback into one of the most meaningful growth experiences of my undergraduate career.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"3bf1d673-2e83-43de-8d4c-daae19ff7f73\"}"},{"__ref":"Favorites:{\"uuid\":\"2ceab01f-afe6-4b48-86f9-bd52f22153a9\"}"},{"__ref":"Favorites:{\"uuid\":\"01c2a192-5c65-4064-b3b8-5fc849d29e02\"}"}],"causesSupported":[],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f666152a-b12e-4644-956d-1c86a4e64da5\"}"},{"__ref":"DeepDives:{\"uuid\":\"b830919b-d728-46d9-8f29-c97eea8e46d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"a137906c-d9a0-4813-b2c5-5eae3a30821d\"}"},{"__ref":"DeepDives:{\"uuid\":\"5beed68c-02c5-46c1-80f8-294c3b45874a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9049da07-c40e-4f83-a8ae-5b3c45df5e7e/-/preview/-/format/jpg/","https://ucarecdn.com/56307862-2ff8-44e0-91ed-ac428d0a9b81/-/preview/-/format/jpg/","https://ucarecdn.com/550933d5-9e8b-4aa5-9504-481c22531d2e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e7ced138-ff59-4627-8ad5-63116305033a\"}"},{"__ref":"Education:{\"uuid\":\"bf7f3f52-0ca6-4917-b2de-07cc97299
