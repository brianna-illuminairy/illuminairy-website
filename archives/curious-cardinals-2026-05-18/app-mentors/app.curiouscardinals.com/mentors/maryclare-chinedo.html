xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"015cac96-4ef2-4b97-8f34-a497663b1972\"}":{"__typename":"Favorites","uuid":"015cac96-4ef2-4b97-8f34-a497663b1972","photoUrl":"https://ucarecdn.com/3d79c7ed-c2b1-4311-a75d-e4415e15d857/","title":"Dallas, Texas","type":"CITY"},"Favorites:{\"uuid\":\"bcfe89dd-b956-416a-bc3f-830d14459259\"}":{"__typename":"Favorites","uuid":"bcfe89dd-b956-416a-bc3f-830d14459259","photoUrl":"https://ucarecdn.com/68fcee8a-f681-4f4f-a17e-b8ffe3e6f84f/","title":"Hamilton","type":"ALBUM"},"Favorites:{\"uuid\":\"66ff52ea-a0de-4cee-84c8-233d2e8cd1ba\"}":{"__typename":"Favorites","uuid":"66ff52ea-a0de-4cee-84c8-233d2e8cd1ba","photoUrl":"https://ucarecdn.com/145d7082-8e18-49df-aea6-8d60b3515494/","title":"Mario Kart Wii","type":"GAME"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"53af44ae-c129-4e79-981c-3475d3015e66\"}":{"__typename":"DeepDives","uuid":"53af44ae-c129-4e79-981c-3475d3015e66","content":"\u003cp\u003eUnder my media platform \u003cem\u003eConvos with Chichi\u003c/em\u003e, I created \u003cem\u003eIgbo Nwere Mmadu\u003c/em\u003e as a way to preserve Igbo history through the voices of the people who lived it. Elders, cultural icons, musicians, and leaders whose wisdom shaped communities, yet whose stories were at risk of being reduced to memories or footnotes.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo do this work properly, I knew it couldn’t be remote. I travel to Nigeria to sit with people in their own spaces, listen deeply, and document their stories with care. I handle every part of the process myself, from research and outreach, to interview design, filming, editing, and storytelling, because trust and authenticity matter in this kind of work.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne of the most meaningful moments came when I interviewed members of the \u003cstrong\u003eOriental Brothers International Band\u003c/strong\u003e. Their music has shaped generations of Igbo culture, yet many people had not seen or heard from them publicly in years. Sitting with them, hearing their laughter, reflections, and memories firsthand felt like reconnecting the past with the present. It was powerful to watch audiences rediscover living legends who were still here, still sharp, and still full of wisdom.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat experience reminded me why this project matters. Stories disappear not because they lack value, but because no one takes the time to preserve them while the storytellers are still here to speak.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe impact of \u003cem\u003eIgbo Nwere Mmadu\u003c/em\u003e grew beyond what I initially imagined. I shared the work on AfiaTV in Enugu, Nigeria, speaking about storytelling as a tool for cultural preservation and global connection. Eventually, the project led to my being honored as Social Impact Storyteller of the Year by the EACH Awards in Nigeria, recognition that affirmed the importance of documenting culture with intention and care.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt its heart, \u003cem\u003eIgbo Nwere Mmadu\u003c/em\u003e is more than a media series. It is a living example of how a personal idea can become meaningful impact through consistency, curiosity, and respect. I often share this journey with students to show them that passion projects do not have to be perfect or flashy. They simply need to be purposeful, thoughtful, and finished.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat belief continues to guide how I mentor, create, and pass stories forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ebb78ced-bf1e-437a-afed-6e2227b09e4c\"}":{"__typename":"DeepDives","uuid":"ebb78ced-bf1e-437a-afed-6e2227b09e4c","content":"\u003cp\u003eMy greatest role model and mentor is my mother, not because her story fits neatly into an “immigrant success” narrative, but because I witnessed the cost of building a life from scratch up close. She immigrated from Nigeria to the United States with no family here, no built-in support system, and no roadmap for navigating a new country. What she did have was determination, faith, and a deep sense of responsibility for the life she was trying to build.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs I grew up, I watched her raise four children while learning systems she had never been taught, navigating spaces where she was often unseen or underestimated, and still showing up every day with discipline and grace. Through years of sacrifice and consistency, she put three of her children through Ivy League schools, not by chance, but through relentless belief in education, structure, and long-term planning. She made decisions rooted in stability rather than comfort, often choosing the harder path so her children could access opportunities she never had.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat shaped me most was how she carried responsibility. She did not romanticize struggle, but she never avoided it either. From her, I learned that consistency matters more than motivation, that preparation opens doors, and that confidence is built through action, not waiting. Those lessons became my blueprint for how I approach school, leadership, and entrepreneurship.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOver time, I came to understand what leadership really looks like. My mother led quietly, without titles or applause, through values, discipline, and an insistence on excellence even when no one was watching. She taught me that success is not just personal achievement, but stewardship. What you build should create room for others to stand taller.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat understanding is the foundation of how I mentor today. I know what it means to navigate unfamiliar systems without a guide, to carry expectations while figuring things out in real time. My mother’s journey reminds me that access changes outcomes, and that mentorship is not about handing out answers, but about helping someone trust their ability to find them.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHer influence lives in everything I do, and it is truly an honor to carry forward her legacy through mentorship, leadership, and service.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"8bdb1dd7-6610-4270-9d9f-e9d20ab82104\"}":{"__typename":"DeepDives","uuid":"8bdb1dd7-6610-4270-9d9f-e9d20ab82104","content":"\u003cp\u003eSomething that isn’t obvious right away is that I’m terrified of heights, which is ironic considering I’m 6 feet tall. You’d think I’d be fearless, but I will absolutely avoid balconies, roller coasters, or anything that requires “just stepping up a little higher.” Elevators are fine. Escalators, sometimes. Open staircases? Absolutely not.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt’s a funny reminder that confidence doesn’t mean being fearless. It means knowing yourself, laughing at your quirks, and still showing up anyway. I bring that same energy into mentorship, helping students embrace who they are, even the unexpected parts.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c4e5d326-5361-4eaa-91ee-d1bae01c3236\"}":{"__typename":"DeepDives","uuid":"c4e5d326-5361-4eaa-91ee-d1bae01c3236","content":"\u003cp\u003eIn my spare time, I love to sleep.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI know that’s not the answer most people expect on a platform like this, but it’s the truth. Between juggling work, mentorship, creative projects, and travel, rest is something I genuinely value and protect. Sleep is how I reset, think clearly, and show up fully for the people and projects I care about.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat said, my version of “rest” usually includes journaling, quiet reflection, and letting my mind wander without an agenda. I’ve learned that rest is not a lack of ambition, it’s part of sustaining it. Taking care of myself allows me to lead, mentor, and create with intention rather than burnout.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSo yes, sleep. Unapologetically haha\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"c1e6eca3-69ea-442c-bc44-6d6effe8a9ea\"}":{"__typename":"School","uuid":"c1e6eca3-69ea-442c-bc44-6d6effe8a9ea","name":"Pharos Academy Charter School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10459"},"Education:{\"uuid\":\"272271cb-1d68-42bc-94d3-562c445426d3\"}":{"__typename":"Education","uuid":"272271cb-1d68-42bc-94d3-562c445426d3","school":{"__ref":"School:{\"uuid\":\"c1e6eca3-69ea-442c-bc44-6d6effe8a9ea\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"a75affa8-f291-49b6-99e4-050fbd2720a6\"}":{"__typename":"Education","uuid":"a75affa8-f291-49b6-99e4-050fbd2720a6","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Health and Human Biology ","degree":null},"MentorPublicProfile:{\"uuid\":\"2958cc5c-096f-4c6b-93b7-c90438bd66cd\"}":{"__typename":"MentorPublicProfile","uuid":"2958cc5c-096f-4c6b-93b7-c90438bd66cd","displayName":"Maryclare C.","slug":"maryclare-chinedo","biography":"\u003cp\u003e\u003cstrong\u003eHi there! I’m Maryclare 👋🏾\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eI’m one of the mentors in this program, with an academic and professional background that blends science, storytelling, and leadership. I earned my undergraduate degree in \u003cstrong\u003eBiology from Brown University\u003c/strong\u003e and later pursued \u003cstrong\u003eJournalism at Harvard\u003c/strong\u003e, combining analytical thinking with communication and narrative skills. Professionally, I’ve worked across tech, media, global organizations, and advocacy spaces, always with a focus on education, mentorship, and youth development. I'm currently working at the \u003cstrong\u003eUnited Nations as a Digital Communications Specialist.\u003c/strong\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003e\u003cbr\u003eWhat I specialize in\u003c/u\u003e\u003c/strong\u003e\u003cbr\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003eI support \u003cstrong\u003eAcademic Mentorship and Passion Projects\u003c/strong\u003e, working primarily with \u003cstrong\u003eK–12, middle school, high school, and college students\u003c/strong\u003e, especially first-generation students and high achievers seeking structure and confidence.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I can support students in:\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMath\u003c/strong\u003e: K–5 Math, Pre-Algebra, Algebra I \u0026amp; II, Geometry, Precalculus, Trigonometry, Statistics, and Calculus\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScience\u003c/strong\u003e: 6–8 Grade Science, Biology, Chemistry, and Physics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHumanities\u003c/strong\u003e: Writing, Reading, History, Debate, and Journalism\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eFor students interested in creative or applied learning, I also mentor:\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege essay writing and academic coaching\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eExecutive function and organization skills\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCreative writing and K–6 storybook projects\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSTEM projects and research\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBusiness and entrepreneurship\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMedicine and health-related pathways\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePublic speaking, video, photography, and web design\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003eBeyond subject matter, I specialize in helping students build \u003cstrong\u003econfidence, critical thinking, time management, executive functioning, and self-advocacy\u003c/strong\u003e, skills that matter far beyond the classroom.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eExperience and qualifications\u003c/u\u003e\u003c/strong\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003e\u003cbr\u003e\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI bring both lived experience and results. I was featured by \u003cstrong\u003e\u003cem\u003eThe New York Times\u003c/em\u003e as one of 18 young women globally in the \u003cem\u003eThis Is 18\u003c/em\u003e series\u003c/strong\u003e, appeared on \u003cstrong\u003e\u003cem\u003eNews12 Bronx\u003c/em\u003e for Ivy League admissions and mentorship work\u003c/strong\u003e, and was\u003cstrong\u003e invited to the \u003cem\u003eForbes 30 Under 30 Summit\u003c/em\u003e \u003c/strong\u003efor contributions to education advocacy and cultural preservation. I’ve delivered\u003cstrong\u003e keynote talks to students in the Bronx\u003c/strong\u003e, \u003cstrong\u003espoken on panels at \u003cem\u003ePhotoville NYC\u003c/em\u003e,\u003c/strong\u003e \u003cstrong\u003eperformed with \u003cem\u003ePoetic Theater Productions’ Generation Now\u003c/em\u003e\u003c/strong\u003e, and received national recognition through the \u003cstrong\u003e\u003cem\u003eScholastic Art \u0026amp; Writing Awards\u003c/em\u003e, with work published by The Met.\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eBeyond media and speaking, I’m a \u003cstrong\u003eserial entrepreneur\u003c/strong\u003e. Over the past two years, I’ve launched \u003cstrong\u003etwo nonprofit initiatives, two companies\u003c/strong\u003e, and\u003cstrong\u003e two podcasts \u003c/strong\u003efocused on education, storytelling, and opportunity creation. These initiatives give me real-world experience mentoring students who are interested in building ideas from concept to execution.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cbr\u003e\u003c/h3\u003e\u003ch3\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eFun facts\u003cbr\u003e\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI’m a writer at heart, a storyteller by instinct, and a lifelong learner. I love journaling, meaningful conversations, and any movie or book that explores identity, culture, or coming of age. \u003cbr\u003e\u003cbr\u003eI’m also a \u003cstrong\u003eprofessional dancer\u003c/strong\u003e, a proud \u003cstrong\u003ehistory lover\u003c/strong\u003e, and someone who genuinely enjoys traveling and learning from different places and people.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnother fun fact that always surprises people: I’m \u003cstrong\u003e6 feet tall\u003c/strong\u003e, but somehow still the shortest of my siblings.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt the core of everything I do, I believe mentorship should feel \u003cstrong\u003esupportive, honest, and empowering\u003c/strong\u003e, never intimidating. Learning works best when students feel safe asking questions, exploring ideas, and growing into who they are becoming.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAs a mentor in this program, my goal is to help students feel seen, capable, and equipped to take their next steps with clarity and confidence. I’m excited to support your child’s growth and journey 🤍\u003c/p\u003e","teachingVideoPlaybackId":"hpsetfbUCsA1S6pCNmIHxGOKNEbj00iRjTlA200PmIpLM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"015cac96-4ef2-4b97-8f34-a497663b1972\"}"},{"__ref":"Favorites:{\"uuid\":\"bcfe89dd-b956-416a-bc3f-830d14459259\"}"},{"__ref":"Favorites:{\"uuid\":\"66ff52ea-a0de-4cee-84c8-233d2e8cd1ba\"}"}],"causesSupported":[],"major":"Health and Human Biology ","dee
