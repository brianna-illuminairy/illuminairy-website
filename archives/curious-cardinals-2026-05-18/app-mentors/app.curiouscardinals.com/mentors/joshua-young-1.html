xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1f76ab22-8c5d-409b-b6b5-25babde2ee16\"}":{"__typename":"Favorites","uuid":"1f76ab22-8c5d-409b-b6b5-25babde2ee16","photoUrl":"https://ucarecdn.com/864d3445-3e99-4ad3-add9-076796ce256a/","title":"Lauryn Hill MTV Unplugged No. 2.0","type":"ALBUM"},"Favorites:{\"uuid\":\"39af2d9b-3860-45aa-8974-32c46e94b4ec\"}":{"__typename":"Favorites","uuid":"39af2d9b-3860-45aa-8974-32c46e94b4ec","photoUrl":"https://ucarecdn.com/02f8d19f-032c-4393-a843-e13ad0ec2394/","title":"Denzel Washington","type":"ACTOR"},"Favorites:{\"uuid\":\"40e20cb6-6a45-4355-b51c-823f9f07f1bf\"}":{"__typename":"Favorites","uuid":"40e20cb6-6a45-4355-b51c-823f9f07f1bf","photoUrl":"https://ucarecdn.com/38c3facd-571b-454b-9509-652de29e57eb/","title":"Catan","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4667343d-43ac-4e0a-8660-3d4054d4e4d3\"}":{"__typename":"DeepDives","uuid":"4667343d-43ac-4e0a-8660-3d4054d4e4d3","content":"\u003cp\u003eThat it's okay to fail. I held myself back, particularly in high school, because I thought things had to be perfect. But perfection is paralysis. The most valuable lessons come from attempts that don't work out.\u003c/p\u003e\u003cp\u003eEvery meaningful breakthrough in my life came after I stopped waiting for guaranteed outcomes. Whether stepping onto the Division 1 wrestling mat, launching the world's first Bitcoin mortgage, or applying to Harvard from a widowed household, growth only happened when I chose courage over certainty.\u003c/p\u003e\u003cp\u003eI spent too much time polishing my comfort zone instead of expanding it. The regret you carry isn't from things you tried and botched, but from chances you never took because you were waiting to be ready. You're never ready. You just start.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"621f922d-76d0-4270-9dc2-6ec916e29c32\"}":{"__typename":"DeepDives","uuid":"621f922d-76d0-4270-9dc2-6ec916e29c32","content":"\u003cp\u003eMentorship matters because I've lived its impact as the oldest of three boys. When my father passed, my mom told me something that shaped everything: my brothers would learn how to be men from what I did, not what I said.\u003c/p\u003e\u003cp\u003eThat responsibility became my North Star. Every decision, from pushing through Division 1 athletics to my career choices, was made knowing two younger brothers were watching and calibrating their own possibilities against my example. Mentorship isn't about being perfect; it's about being steady enough that others can use you as a reference point while charting their own course.\u003c/p\u003e\u003cp\u003eWatching my brothers reach Harvard and Columbia taught me that true mentorship creates space for others to surpass you. Now, whether teaching at Harvard or working with community organizations, I carry that same truth my mom gave me: someone is always watching, and what we model matters more than what we say.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"3d1540e1-4714-4c20-8cb2-e5ea8a62fec7\"}":{"__typename":"DeepDives","uuid":"3d1540e1-4714-4c20-8cb2-e5ea8a62fec7","content":"\u003cp\u003eMy greatest role model is my mom. After my father passed, she became a social worker who deliberately worked night shifts so she could be both a full-time provider and a full-time mother. While others slept, she worked. While we were awake, she was present. She never missed a single game, game, or school event for any of her three boys.\u003c/p\u003e\u003cp\u003eWatching her transform grief into purpose, exhaustion into presence, and sacrifice into love shaped everything I believe about leadership and service. She proved that the most powerful thing you can do for someone isn't just to tell them they matter, but to structure your entire life around making sure they know it. That's the standard I try to live up to in everything I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e202e542-ea1d-4174-b6eb-3c4b549e021c\"}":{"__typename":"DeepDives","uuid":"e202e542-ea1d-4174-b6eb-3c4b549e021c","content":"\u003cp\u003eI love pickup sports and board games because they feed my competitive spirit, but honestly, I just love to play. Whether I'm winning or losing, there's something pure about being fully present in a game, where the only thing that matters is the next move, the next play, the next laugh with friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"35e85fa8-2d71-4826-8949-c82dce24b06f\"}":{"__typename":"School","uuid":"35e85fa8-2d71-4826-8949-c82dce24b06f","name":"Freedom High School","city":"Bethlehem","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"18020"},"Education:{\"uuid\":\"416a0c4f-4abb-419e-b5e6-0b0b77535892\"}":{"__typename":"Education","uuid":"416a0c4f-4abb-419e-b5e6-0b0b77535892","school":{"__ref":"School:{\"uuid\":\"35e85fa8-2d71-4826-8949-c82dce24b06f\"}"},"startYear":"2009","endYear":"2013","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"485f77fd-4e87-47d6-b1c4-97b7104df658\"}":{"__typename":"Education","uuid":"485f77fd-4e87-47d6-b1c4-97b7104df658","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2013","endYear":null,"expectedGradYear":"2017","major":"Business \u0026 Philosophy","degree":null},"MentorPublicProfile:{\"uuid\":\"76fdd467-6e8c-413f-bded-0a4e040d2dbb\"}":{"__typename":"MentorPublicProfile","uuid":"76fdd467-6e8c-413f-bded-0a4e040d2dbb","displayName":"Joshua Y.","slug":"joshua-young-1","biography":"\u003cp\u003eHi, I'm a former athlete turned social entrepreneur who bridges the worlds of impact investing, affordable housing innovation, and ethical leadership. I'm currently pursuing my Master's in Public Policy at Harvard Kennedy School. I combine academic rigor with real-world experience to tackle society's most pressing challenges.\u003c/p\u003e\u003cp\u003eMy path to public service began unexpectedly on the wrestling mat and football field at Franklin \u0026amp; Marshall College, where I competed as a multi-sport Division 1 athlete while double-majoring in Business, Organizations, and Strategies and Philosophy. As a three-year wrestling starter and two-year football starter, I learned that excellence requires both individual discipline and team collaboration. Lessons that earned me the Male Student-Athletic Leadership Award and shaped my approach to leadership. My academic achievements, including the John B. Noss Award for excellence in philosophy, demonstrate my ability to balance intense athletic commitments with intellectual pursuits.\u003c/p\u003e\u003cp\u003eAfter graduation, my career trajectory reflects a consistent commitment to systems-level change. At Locust Walk, I rose from analyst to business development manager, where he didn't just manage talent and operations, I initiated the company's first pro-bono project for the Travis Roy Foundation.\u003c/p\u003e\u003cp\u003eI then realized my career purpose during my three years as Chief of Staff at New Story Charity, where I helped pioneer revolutionary approaches to affordable housing. The organization was named one of Fast Company's most innovative nonprofits for three consecutive years. I didn't just think outside the box; I helped build entirely new boxes by investing in the world's first 3D-printed homes for vulnerable families and launching the world's first Bitcoin mortgage product for unbanked families in El Salvador. My ability to secure a $3 million partnership with Coinbase and prevent homelessness for over 250 families in Latin America demonstrates my rare combination of visionary thinking and practical execution.\u003c/p\u003e\u003cp\u003eAt Harvard, I continue to push boundaries as a Bloomberg Center for Cities Fellow, working on affordable housing solutions for my hometown of Bethlehem, Pennsylvania. That was a full-circle moment for me that reflects my commitment to community roots. As a Teaching Fellow for Michael Sandel's renowned Justice course and a Safra Center for Ethics Fellow, I explore the intersection of moral philosophy and practical policy. And my work with Cornell Brooks and the NAACP of Alabama on voting rights and criminal justice reform shows my dedication to translating academic insights into real-world advocacy.\u003c/p\u003e\u003cp\u003eWhether leading diligence for the Harbus Foundation's nonprofit investments or developing social innovations with Harvard's EdRedesign, I consistently seek opportunities to align capital with conscience.\u003c/p\u003e\u003cp\u003eFrom the wrestling mat and football field to Harvard, from Silicon Valley venture funds to Salvadoran communities, my journey reflects a fundamental belief: that true leadership means using every tool available to expand opportunity and dignity for all. My story isn't just about personal achievement; it's about building systems and solutions that lift entire communities.\u003c/p\u003e","teachingVideoPlaybackId":"zxs5yXoPZtM2pED4n3HfdKTj7PeQAFOKeZX1LFSEA4w","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhat I'm most proud of isn't something I've achieved for myself. It's watching my two younger brothers walk through the gates of Harvard and Columbia. As the oldest of three boys raised by our widowed mother, I understood early that my role extended beyond typical big brother duties. I was their example, their proof of what was possible.\u003c/p\u003e\u003cp\u003eEvery choice I made was with the awareness that two sets of eyes were watching and learning. When I pushed through 60-hour weeks balancing Division 1 athletics and academics, when I chose philosophy alongside business, when I turned down easier paths for ones that required integrity, I was teaching them through action. Our mother held our family together through unimaginable loss, but my brothers needed to see someone they could challenge over dinner, someone who could translate her sacrifices into tangible achievement.\u003c/p\u003e\u003cp\u003eWatching them not just reach but thrive at Harvard and Columbia, knowing I played a part in expanding their sense of what they deserved, gives me a pride that dwarfs any professional accomplishment. Every wrestling match, every late study session, every career decision carried the weight of being their example. Now, seeing them forge their own extraordinary paths, that weight has transformed into wings. This is what I'm most proud of: not that I led, but that I led well enough that they could surpass me.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"1f76ab22-8c5d-409b-b6b5-25babde2ee16\"}"},{"__ref":"Favorites:{\"uuid\":\"39af2d9b-3860-45aa-8974-32c46e94b4ec\"}"},{"__ref":"Favorites:{\"uuid\":\"40e20cb6-6a45-4355-b51c-823f9f07f1bf\"}"}],"causesSupported":[],"major":"Business \u0026 Philosophy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4667343d-43ac-4e0a-8660-3d4054d4e4d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"621f922d-76d0-4270-9dc2-6ec916e29c32\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d1540e1-4714-4c20-8cb2-e5ea8a62fec7\"}"},{"__ref":"DeepDives:{\"uuid\":\"e202e542-ea1d-4174-b6eb-3c4b549e021c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f83dad9c-266a-4ef2-9a2e-93c0502ba50a/-/preview/-/format/jpg/","https://ucarecdn.com/ef0b8f93-39bb-45f4-a46c-a88a89629ca3/-/preview/-/format/jpg/","https://ucarecdn.com/637e5063-b901-4afb-ba99-03b0ee4bf9f2/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"416a0c4f-4abb-419e-b5e6-0b0b77535892\"}"},{"__ref":"Education:{\"uuid\":\"485f77fd-4e87-47d6-b1c4-97b7104df658\"}"}],"hiredAt":"2025-10-10T21:21:22.128Z","topics":["Pre-Algebra","K-5 Grade Math","Algebra I","Algebra II","Statistics","Geometry","6-8 Grade Science","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Sports Journalism","Video / Photography","Creative Writing","Business / Entrepreneurship","Finance / Investing","Sports Analytics","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"joshua-young-1\"}})":{"__ref":"MentorPu
