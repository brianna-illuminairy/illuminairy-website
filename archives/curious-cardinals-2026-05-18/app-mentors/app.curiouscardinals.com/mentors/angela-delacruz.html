xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"754ba1b7-066a-40a8-9abf-669d7bd4e0f0\"}":{"__typename":"Favorites","uuid":"754ba1b7-066a-40a8-9abf-669d7bd4e0f0","photoUrl":"https://ucarecdn.com/f6bfd416-451c-44fd-89dd-92bdfe4f6af7/","title":"Hozier","type":"ARTIST"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"36cca6c3-310a-4549-8162-30e3adec0273\"}":{"__typename":"DeepDives","uuid":"36cca6c3-310a-4549-8162-30e3adec0273","content":"\u003cp\u003eSomething I am extremely proud of is having extensive knowledge on really niche topics! One notable example is my interest in ichthyology, or the study of fish. After taking a course on Fishes in college, I have become really passionate and curious about the field–when I have some down time, I enjoy watching documentaries reading scientific papers/publications on recent ichthyology-related discoveries, and visiting aquariums. I am particularly knowledgeable about sharks, so please don't hesitate to ask me about them if you are curious as well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"d207d5b2-ae4e-4255-9230-85e1cccde8fe\"}":{"__typename":"DeepDives","uuid":"d207d5b2-ae4e-4255-9230-85e1cccde8fe","content":"\u003cp\u003eA large part of my academic career and teaching style is influenced by my ADHD. While I was only diagnosed in my sophomore year of college, I recall having the symptoms as early as the third grade. On one hand, the disorder made memorizing facts, focusing on tasks, and sitting still extremely difficult. On the other hand, I learned faster than most of my peers, and excelled in presentations and lessons that required visual or hands-on learning. Because of this, my teaching style includes visual diagrams and representations to relay information to my students. Furthermore, I always include physical objects or props to help clarify difficult concepts or keep students engaged. Most importantly, having ADHD has taught me to be flexible with my teaching style, and it makes me passionate about helping students find a learning style that is most effective for them!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"af4bcf2c-f1e3-4f64-b95e-186e35c5cb94\"}":{"__typename":"DeepDives","uuid":"af4bcf2c-f1e3-4f64-b95e-186e35c5cb94","content":"\u003cp\u003eIn my spare time, I enjoy activities that are completely unrelated to my work/academics. Music, in particular, is something I am greatly passionate about. Whether it be listening to newly released albums or strumming a few chords on my guitar, I try to incorporate it into my daily schedule as best as I can. Aside from being a temporary escape, music has given me a space in which I am able to express myself and strengthen bonds with some of my closest friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0a4ae622-0614-49ed-9e78-b9eb7fa4542f\"}":{"__typename":"DeepDives","uuid":"0a4ae622-0614-49ed-9e78-b9eb7fa4542f","content":"\u003cp\u003eI have always been curious and perplexed by human behavior. We are an unbelievably interesting species, one with which I will never grow tired of observing. It is through Psychology that I have been able to extensively explore the human psyche and determine what exactly makes us tick. One of my favorite aspects of Psychology is that it is intertwined with many different fields and specialties. For example, human behavior greatly influences the field of Economics, notably through rational and irrational business decision making. Psychology, and its phenomena, can be found everywhere–as long as you look hard enough.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"f12f4bd6-dca0-4a8b-aa08-ccdf75fa9017\"}":{"__typename":"School","uuid":"f12f4bd6-dca0-4a8b-aa08-ccdf75fa9017","name":"Bay Shore High School","city":"Bay Shore","type":"HIGH","state":"New York","country":"United States","zip":"11706"},"Education:{\"uuid\":\"4d273aa3-b622-406a-9b91-1510b2e2168f\"}":{"__typename":"Education","uuid":"4d273aa3-b622-406a-9b91-1510b2e2168f","school":{"__ref":"School:{\"uuid\":\"f12f4bd6-dca0-4a8b-aa08-ccdf75fa9017\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"342586a8-32d2-4681-838b-f17b655d1aa2\"}":{"__typename":"Education","uuid":"342586a8-32d2-4681-838b-f17b655d1aa2","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"1bd2c43a-0d69-4514-a7b8-478a07b39b0f\"}":{"__typename":"MentorPublicProfile","uuid":"1bd2c43a-0d69-4514-a7b8-478a07b39b0f","displayName":"Angela D.","slug":"angela-delacruz","biography":"\u003cp\u003eAngela recently graduated from Harvard University, and received her Bachelor’s in Psychology in May 2024. Although she initially intended to pursue a medical career, she decided after her Sophomore year of college to pursue business in lieu of medicine. She now works as a Management Consultant at a top firm in Boston, the city she is proud to call home.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eRelevant to her identity is her commitment to international relations–she joined her school’s Model United Nations club in 2017 and competed on a local and national level for three years. In college, she continued her Model UN career as a staffer, starting as an Assistant Director and eventually becoming Secretary-General of two conferences based in Boston and Sydney, Australia, respectively. Angela attributes her acceptance to Harvard to the organization–she believes that her time as a delegate allowed her to foster her professional skills, learn the importance of collaboration and action, and interact with others from different cultures and backgrounds. Despite the long hours of planning and preparation, she truly believes it all paid off as the conferences provided delegates of today the opportunities she was given herself!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAside from Model United Nations, she was involved in a variety of organizations during her time at college. She was an Analyst and Associate for Harvard Undergraduate Consulting on Business and the Environment for three years, where she spent her first two years working with clients to assist with their business concerns. She served as a Mentor for her final year, in which she led workshops and held case practice sessions to prepare undergraduates undergoing the recruitment cycle. Through her mentorship services at CBE, she felt fulfilled in helping her peers navigate a competitive, overwhelming hiring process. More importantly, she was happy to give back to the community that gave her the space to grow professionally and personally.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen she is not in the classroom or knee deep in extracurricular work, Angela enjoys the outdoors and the arts. She once took a class on Fish at Harvard, which led her to have a greater appreciation for marine animals and the environment in which she lives. She also became more interested in wildlife photography, and loves frequenting aquariums and museums in her free time. She also enjoys curating Spotify playlists to meet her specific mood needs, and her music taste ranges from classic 70’s rock to French R\u0026amp;B, and even Japanese city pop. Her interests in music led her to become a DJ at WHRB 95.3FM, a radio station run by Harvard students. Furthermore, she learned to play the guitar after being a big Hozier fan, although she has a long way to go before being able to play his songs fluently!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was graduating from Harvard University. As a Filipino immigrant, my family and I did not know much about the Ivy Leagues until I entered high school. Even then, I wasn't convinced that my application would stand a chance until my junior year of high school, when my guidance counselor suggested I give it a try anyway. I am grateful I had faith in both her and myself, as my decision to apply landed me an acceptance to one of the best universities in the world! I take immense pride in knowing that the little girl from Quezon City made it big in the States, and to say that Harvard has changed my life for the better is a huge understatement.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"754ba1b7-066a-40a8-9abf-669d7bd4e0f0\"}"}],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"36cca6c3-310a-4549-8162-30e3adec0273\"}"},{"__ref":"DeepDives:{\"uuid\":\"d207d5b2-ae4e-4255-9230-85e1cccde8fe\"}"},{"__ref":"DeepDives:{\"uuid\":\"af4bcf2c-f1e3-4f64-b95e-186e35c5cb94\"}"},{"__ref":"DeepDives:{\"uuid\":\"0a4ae622-0614-49ed-9e78-b9eb7fa4542f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6f863c10-aad1-4801-9795-7653efc7c83f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4d273aa3-b622-406a-9b91-1510b2e2168f\"}"},{"__ref":"Education:{\"uuid\":\"342586a8-32d2-4681-838b-f17b655d1aa2\"}"}],"hiredAt":"2025-03-20T21:17:41.416Z","topics":["History Project","Music","Law / Government / Policy","World Cultures","Debate","Public Speaking","Executive Function","Business / Entrepreneurship","Video / Photography","Economics"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"angela-delacruz\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1bd2c43a-0d69-4514-a7b8-478a07b39b0f\"}"}}},"_sentryTraceData":"37c0dbdb315c472d8bd5b3da7a6012de-a961127479efb5d7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=37c0dbdb315c472d8bd5b3da7a6012de,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"angela-delacruz"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-mana
