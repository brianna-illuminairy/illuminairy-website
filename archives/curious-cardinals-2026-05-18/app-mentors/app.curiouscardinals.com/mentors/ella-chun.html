xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"50ba41be-1330-4a97-b322-bff74db86562\"}":{"__typename":"DeepDives","uuid":"50ba41be-1330-4a97-b322-bff74db86562","content":"\u003cp\u003eIf I could go back in time and meet my middle or high school self, I would tell them to not worry so much about having everything figured out. The classes, activities, and setbacks that felt huge at the time were all part of helping me discover what I genuinely cared about and where my interests were. I'd also remind myself to ask more questions and take more intellectual risks, as I've come to learn that growth comes from curiosity, not perfection. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b824771a-c58a-47fa-b79e-9c66c217572f\"}":{"__typename":"DeepDives","uuid":"b824771a-c58a-47fa-b79e-9c66c217572f","content":"\u003cp\u003eMentorship is important to me because I know how much guidance and encouragement can shape someones opportunities and confidence. Some of my most meaningful experiences have come from learning alongside supportive mentors, and I want to create that same environment for students--one where they feel comfortable asking questions, exploring their interests, and growing both academically and personally. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"e371bdf3-4aa1-4657-8e72-85b689da1008\"}":{"__typename":"DeepDives","uuid":"e371bdf3-4aa1-4657-8e72-85b689da1008","content":"\u003cp\u003eOne thing that isn't obvious right away is my enjoyment for connecting different interests together. While my academic interests lay around medicine and global health, I also love to play music, travel, and learn about different cultures and perspectives. Playing  instruments has taught me the importance of patience and creativity that also shapes how I approach my academics, making subjects far more engaging!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"abc24fe8-62de-48a4-8097-41fcddb444d9\"}":{"__typename":"DeepDives","uuid":"abc24fe8-62de-48a4-8097-41fcddb444d9","content":"\u003cp\u003eIn my spare time, I enjoy doing a mix of creative, academic, and relaxing activities. I often spend time playing the guitar which helps me focus and express myself, as well as being outside and going for hikes. Outside of that, I love to learn more about topics in medicine and global health, especially related to how healthcare systems can be improved. Finally, I also love spending time with friends and family, trying new foods, and listening to music!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}":{"__typename":"School","uuid":"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5","name":"Choate Rosemary Hall","city":"Wallingford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06492"},"Education:{\"uuid\":\"01abffd7-5de1-433f-8fca-028ae7063529\"}":{"__typename":"Education","uuid":"01abffd7-5de1-433f-8fca-028ae7063529","school":{"__ref":"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b69b4535-e725-4a55-b3e3-b8a873ab5259\"}":{"__typename":"Education","uuid":"b69b4535-e725-4a55-b3e3-b8a873ab5259","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"History of Science, Medicine, and Public Health","degree":null},"MentorPublicProfile:{\"uuid\":\"30e34a98-5514-4cdf-952c-3cd15860946a\"}":{"__typename":"MentorPublicProfile","uuid":"30e34a98-5514-4cdf-952c-3cd15860946a","displayName":"Ella C.","slug":"ella-chun","biography":"\u003cp\u003eHi! I'm a student and a mentor who is passionate about education, global health, and helping others grow. I'm especially interested in medicine and public health, and I hope to pursue a career in healthcare where I can make a meaningful impact on underserved communities. My curiosity about the world has shaped both my studies and my extracurricular pursuits, pushing me to explore more complex topics like healthcare equity within my local community.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I have invested significant time in mentoring and teaching a range of subjects, from basic English to physics, working one-on-one with students from diverse backgrounds. These experiences have taught me the importance of patience, adaptability, and meeting students where they are. I strive to create a supportive and encouraging environment where students feel comfortable asking questions, making mistakes, and building confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also bring experience navigating competitive academic opportunities. I completed an internship at Harvard Medical School focused on public health and Spanish-speaking communities, where I gained insight into language barriers in healthcare and the importance of culturally responsive care. Through this among other experiences, I have developed a stronger understanding of how to navigate internship and application processes, and I enjoy helping students find opportunities, prepare strong applications, and present their interests with confidence.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to academics, I have a strong background in the arts. I have studied violin and piano for over ten years, which has taught me a lot about the importance of consistency. Music has shown me that improvement takes time, and I bring that mindset into mentoring; breaking things down step-by-step and celebrating progress along the way.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love helping students explore their interests through passion projects, improving their study habits, or just staying organized. Whether it's preparing for school, building confidence, or creating a new project, my goal is to make sessions both productive and enjoyable. I also focus on building strong relationships with my students so they feel supported throughout their learning journeys.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOverall, I'm someone who cares about my mentees and wants them to succeed not just academically, but personally too. I aim to be a supportive mentor and someone who can help make learning feel a little less stressful and a lot more rewarding.\u003c/p\u003e","teachingVideoPlaybackId":"TOyPQZNYkT01k00Xcz007IBUYu3ADEJTwqrNzRLyzEEaXc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History of Science, Medicine, and Public Health","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"50ba41be-1330-4a97-b322-bff74db86562\"}"},{"__ref":"DeepDives:{\"uuid\":\"b824771a-c58a-47fa-b79e-9c66c217572f\"}"},{"__ref":"DeepDives:{\"uuid\":\"e371bdf3-4aa1-4657-8e72-85b689da1008\"}"},{"__ref":"DeepDives:{\"uuid\":\"abc24fe8-62de-48a4-8097-41fcddb444d9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1960573a-ac1e-42df-a092-c141209858d9/-/preview/-/format/jpg/","https://ucarecdn.com/b1630c29-63c4-4aa8-bf85-22c12dfd05e3/-/preview/-/format/jpg/","https://ucarecdn.com/4c5c3fb6-1f7e-4c09-85d7-fbedac962606/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"01abffd7-5de1-433f-8fca-028ae7063529\"}"},{"__ref":"Education:{\"uuid\":\"b69b4535-e725-4a55-b3e3-b8a873ab5259\"}"}],"hiredAt":"2026-05-01T18:56:10.748Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ella-chun\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"30e34a98-5514-4cdf-952c-3cd15860946a\"}"}}},"_sentryTraceData":"6b815abaf1de49afa1e6d9b5af7b7d53-a58f85717fd15cb0-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=6b815abaf1de49afa1e6d9b5af7b7d53,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ella-chun"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHT
