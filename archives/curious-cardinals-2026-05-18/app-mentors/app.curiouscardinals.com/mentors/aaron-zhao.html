xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"949a32c8-fd27-43df-b1b7-32c623ae40dd\"}":{"__typename":"DeepDives","uuid":"949a32c8-fd27-43df-b1b7-32c623ae40dd","content":"\u003cp\u003eI was a good, maybe even great student. I had good grades, did interesting extracurriculars and had friends. But ultimately, I had no passion for what I was doing and I felt stuck in the rat race of college admissions. Everything seemed like a means to an end and days seemed to drag on for years as I lived under the crushing weight that was college apps. \u003c/p\u003e\u003cp\u003eTruthfully, I was miserable, aimless and did what I had to do because I was told to. This doesn't need to be the case. Knowing what I know now, I would push myself to explore, to search, and to find what exactly it is that I am passionate in. This may be difficult to believe based on my bio, but I didn't stumble onto computer science until late in my senior year! And unlike many of my peers who were burnt out by the subject on the academic track, I was lucky and fortunate enough to be able to nurture my interest through passion projects and independent research, which ultimately proved fortuitous as I was named Regeneron Science Talent Search Semifinalist for that passion project.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"eb13042c-5369-471d-9251-9f28e2cd3f2d\"}":{"__typename":"Education","uuid":"eb13042c-5369-471d-9251-9f28e2cd3f2d","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}":{"__typename":"School","uuid":"11470c0e-6098-4972-92d0-60616358bd13","name":"California Institute of Technology","city":"Pasadena","type":"COLLEGE","state":"California","country":"United States","zip":"91125"},"Education:{\"uuid\":\"a339e98e-1e03-48bf-bb77-d8ef753ea655\"}":{"__typename":"Education","uuid":"a339e98e-1e03-48bf-bb77-d8ef753ea655","school":{"__ref":"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science and Business","degree":null},"MentorPublicProfile:{\"uuid\":\"380fe98c-6b53-45b7-9f69-b205aa205465\"}":{"__typename":"MentorPublicProfile","uuid":"380fe98c-6b53-45b7-9f69-b205aa205465","displayName":"Aaron Z.","slug":"aaron-zhao","biography":"\u003cp\u003e\"Six months is a generation in AI.\"\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHello! I'm Aaron, an AI enthusiast and entrepreneur currently pursuing Computer Science and Business at Caltech. My time at this frontier of technology and entrepreneurship has been nothing short of exhilarating, and I'm excited to share this passion with you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo be frank, my initial impressions of AI were that of skepticism, and similar to a lot of other trends in tech I believed it was pure hype - a typical oversell and underdeliver situation. I still remember writing off GPT-2 on its initial release as it outputted nonsensical garbage; and yet, just a year later I found myself leveraging GPT-3 in a groundbreaking computer vision project, collaborating with the UK National Grid to optimize solar panel deployment. While the experience was imperfect, the rapid growth in its capabilities opened my eyes to the immense potential of AI in solving real-world problems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSeizing this momentum, I founded my first startup, Viriya, while still an undergraduate. We focus on energy monitoring and capturing the $46 billion/year of wasted energy for commercial buildings using AI, and are fortunate to have already secured most of the major UCs as design partners and raised tens of thousands of dollars in non-equity funding. This venture taught me invaluable lessons about turning innovative ideas into viable products and navigating the challenges of a tech startup.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy entrepreneurial journey extends beyond my own company. I've collaborated with billion dollar asset managers, helping them integrate AI solutions into their products and setting the foundation for their AI strategy. I've also had the privilege of working on groundbreaking computer vision projects at NASA's Jet Propulsion Laboratory (JPL), where I built sea-level rise models for the United Nations. Finally, I've invested in companies with AI in their DNA in both the public and private markets. These experiences have honed my ability to identify AI applications with real-world impact and market potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I bring this blend of technical expertise and entrepreneurial acumen to every session. My teaching style is hands-on and project-based, with a focus on not just understanding AI, but also recognizing its business applications. We might brainstorm AI-driven startup ideas, develop a minimum viable product (MVP), or analyze how leading tech companies are leveraging AI. If you're a high school student dreaming of launching the next big tech company, or a parent looking to nurture your child's entrepreneurial and tech passions, I'm here to help.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePerhaps you were born too late to explore the world, and born too early to explore the stars. But you're here at the perfect moment to pioneer the AI frontier. Don't just witness this boom—be part of it. Let's innovate, build, and shape the future together. Are you ready to start your journey?\u003c/p\u003e","teachingVideoPlaybackId":"ng46cq2veOBDyQg4weKmhJrIaLmDvbjOcaRrKnk500kA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science and Business","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"949a32c8-fd27-43df-b1b7-32c623ae40dd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5b78278a-150d-4b12-aec8-526815f1f150/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"eb13042c-5369-471d-9251-9f28e2cd3f2d\"}"},{"__ref":"Education:{\"uuid\":\"a339e98e-1e03-48bf-bb77-d8ef753ea655\"}"}],"hiredAt":"2024-09-11T01:16:03.322Z","topics":["Coding / Programming","Machine Learning / AI","Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/1e4a2735-1bb6-4525-bb3b-365dd5531407/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"aaron-zhao\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"380fe98c-6b53-45b7-9f69-b205aa205465\"}"}}},"_sentryTraceData":"8fce2fa4703244a7ad1b4b67cd55376d-879184550eeff2aa-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8fce2fa4703244a7ad1b4b67cd55376d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"a
