xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"aea5c822-330b-44b7-9e16-159c3ca67d46\"}":{"__typename":"Favorites","uuid":"aea5c822-330b-44b7-9e16-159c3ca67d46","photoUrl":"https://ucarecdn.com/e21ad69a-3a0a-45b2-8221-8b87ce0e2b39/","title":"Venice, Italy","type":"CITY"},"Favorites:{\"uuid\":\"68d39919-750d-49ba-8443-5222c63db276\"}":{"__typename":"Favorites","uuid":"68d39919-750d-49ba-8443-5222c63db276","photoUrl":"https://ucarecdn.com/0ccc8c73-3b68-4aeb-b7f7-e84cf69ab836/","title":"TPAB","type":"ALBUM"},"Favorites:{\"uuid\":\"8a37d890-4e12-46e2-b39a-b81e0e9b3b90\"}":{"__typename":"Favorites","uuid":"8a37d890-4e12-46e2-b39a-b81e0e9b3b90","photoUrl":"https://ucarecdn.com/b64be73a-354e-4e07-8af4-92fa17978e74/","title":"Basquiat","type":"ARTIST"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f5094db4-e263-412e-9337-c359bc6e7364\"}":{"__typename":"DeepDives","uuid":"f5094db4-e263-412e-9337-c359bc6e7364","content":"\u003cp\u003eMy dream job is to work at the intersection of \u003cstrong\u003eAnthropology and AI Ethics\u003c/strong\u003e, specifically focusing on the psychological impact of masterfully linguistic chatbots on human users. While many focus on the machine's code, I want to research the human response—ensuring that these 'strangely compelling machines' don't amplify isolation or create dangerous echo chambers for vulnerable populations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"32f95c77-5896-49a9-9876-7c974fb0f691\"}":{"__typename":"School","uuid":"32f95c77-5896-49a9-9876-7c974fb0f691","name":"North Gaston High School","city":"Dallas","type":"HIGH","state":"North Carolina","country":"United States","zip":"28034"},"Education:{\"uuid\":\"33a95ed7-0688-4581-b9e6-3e59116136f0\"}":{"__typename":"Education","uuid":"33a95ed7-0688-4581-b9e6-3e59116136f0","school":{"__ref":"School:{\"uuid\":\"32f95c77-5896-49a9-9876-7c974fb0f691\"}"},"startYear":"1988","endYear":"1991","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"dfdbc6d9-17db-46f3-ae25-7eb83eeb686c\"}":{"__typename":"Education","uuid":"dfdbc6d9-17db-46f3-ae25-7eb83eeb686c","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Anthropology","degree":null},"MentorPublicProfile:{\"uuid\":\"22315a94-2d45-4c69-867f-e7b1372a095c\"}":{"__typename":"MentorPublicProfile","uuid":"22315a94-2d45-4c69-867f-e7b1372a095c","displayName":"Alona W.","slug":"alona-williams","biography":"\u003cp\u003e\u003cstrong\u003eAbout Me: Alona Williams\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThe Intersection of Human Systems and Digital Worlds\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI am a researcher and student at \u003cstrong\u003eColumbia University\u003c/strong\u003e, majoring in \u003cstrong\u003eAnthropology\u003c/strong\u003e with a concentration in \u003cstrong\u003ePsychology\u003c/strong\u003e. My academic focus is driven by a deep interest in \"the self,\" consciousness, and how human identity evolves in digital spaces. Before returning to the Ivy League, I spent several years managing complex operations at a private wealth management company and before that I was a professional studio and stage performer and vocalist. This professional background allows me to bring a unique \"project manager\" rigor to the world of academic mentorship while also operating from a creative space. I don’t just help students understand a subject; I help them build the organizational systems and \"social scaffolding\" necessary to turn their natural curiosity into high-level, tangible results.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAcademic Accolades \u0026amp; Research\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMy commitment to rigorous inquiry has been recognized throughout my time at Columbia. I am a consistent Dean’s List honoree and a member of the GS Honor Society. My research capabilities are further evidenced by being an Ella Deloria Research Grant awardee and a recipient of the Bertha Baer Scholarship. These honors reflect my ability to execute original research and manage complex academic projects—skills that I am passionate about passing on to my mentees. I am particularly interested in how we can use anthropological methods to study modern environments, from the ethics of Artificial Intelligence to the social structures found within platforms like Second Life or Minecraft.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Mentorship Philosophy: Scaffolding for Success\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI specialize in working with students who have \"big ideas\" but may struggle with the Executive Functioning required to bring them to life. Whether a student is navigating a Twice-Exceptional (2e) learning profile or simply needs a more structured approach to creative work, I provide the tools to bridge that gap.\u003c/p\u003e\u003cp\u003eI help students transform their interests into \u003cstrong\u003ePassion Projects\u003c/strong\u003e by treating their favorite hobbies as \"field sites\" for discovery. We might use a favorite game to study Material\u003cstrong\u003e \u003c/strong\u003eCulture, analyze the Psychology of Identity through digital avatars, or explore Metacognition, the science of learning how you learn best. My goal is to ensure that the mentorship process is as joyful as it is meaningful, leaving the student with a portfolio of work that reflects their unique intellectual voice.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eBeyond the Classroom\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I am not in the class or working with other students on group projects, I am often exploring the application of anthropology in modern digital contexts. I enjoy the \"participant observation\" of New York City's diverse social landscapes and am constantly experimenting with applying anthropological themes to \u003cstrong\u003eAI tools\u003c/strong\u003e to better understand the impact recursive tools may have on our civilization, and I am often my own subject in these investigations. I believe that the most effective learning happens at the intersection of our lived experiences and our academic interests, and I look forward to helping my students find that balance.\u003c/p\u003e","teachingVideoPlaybackId":"S1lcXBolDGarihAZ5sZUQH02ai00wOJPUHuw1j6oJQKp8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"aea5c822-330b-44b7-9e16-159c3ca67d46\"}"},{"__ref":"Favorites:{\"uuid\":\"68d39919-750d-49ba-8443-5222c63db276\"}"},{"__ref":"Favorites:{\"uuid\":\"8a37d890-4e12-46e2-b39a-b81e0e9b3b90\"}"}],"causesSupported":[],"major":"Anthropology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f5094db4-e263-412e-9337-c359bc6e7364\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4613e060-54b1-4fa6-9872-26a969d71a0e/-/preview/-/format/jpg/","https://ucarecdn.com/ae3cc5b3-c422-4fa7-821e-57c2c32a5536/-/preview/-/format/jpg/","https://ucarecdn.com/ad314d27-7f9d-4fa9-8c1f-10e9c873074a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"33a95ed7-0688-4581-b9e6-3e59116136f0\"}"},{"__ref":"Education:{\"uuid\":\"dfdbc6d9-17db-46f3-ae25-7
