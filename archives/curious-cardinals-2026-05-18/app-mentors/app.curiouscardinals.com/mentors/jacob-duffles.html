xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b2495eb5-15eb-4aff-bc1f-0c878633d893\"}":{"__typename":"DeepDives","uuid":"b2495eb5-15eb-4aff-bc1f-0c878633d893","content":"\u003cp\u003eFor my high school self, the advice I would give is to stay true to yourself, that way, you find your people faster.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eSo often did you try to please and surround yourself with those perceived as the \"popular kids.\" The very people you tried so hard to impress ended up treating you worse than some of your other friendships. Prioritize the people in your life who show that they care... and in return, show them that you care by giving them the time, admiration, and friendship they deserve.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAlso, cut yourself some slack. It's easy to dream big when you are a teenager. However, these moments in your life only happen once and ought to be cherished. Take your time finding your some of your interests, because there will still be plenty of time to explore in the future, so why rush now? If you did more of this, you probably wouldn't have had to apply to 17 different colleges and universities as part of a young adult identity crisis. Haha.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"fddcdb7b-0940-4592-b7e1-93c17e81f204\"}":{"__typename":"School","uuid":"fddcdb7b-0940-4592-b7e1-93c17e81f204","name":"School Without Walls","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20037"},"Education:{\"uuid\":\"c0a94bb4-be39-477a-b6b9-80129960f24d\"}":{"__typename":"Education","uuid":"c0a94bb4-be39-477a-b6b9-80129960f24d","school":{"__ref":"School:{\"uuid\":\"fddcdb7b-0940-4592-b7e1-93c17e81f204\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"87477ecf-0518-4380-ad48-d9da796bc5c2\"}":{"__typename":"Education","uuid":"87477ecf-0518-4380-ad48-d9da796bc5c2","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Environmental Science and Sustainability","degree":null},"MentorPublicProfile:{\"uuid\":\"d5ce9669-fcde-41a8-b175-e86667bad000\"}":{"__typename":"MentorPublicProfile","uuid":"d5ce9669-fcde-41a8-b175-e86667bad000","displayName":"Jacob D.","slug":"jacob-duffles","biography":"\u003cp\u003eHello, hola, oi, and bonjour!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy name is Jacob Duffles. I am a Brazilian-American born in Washington, D.C. I  graduated from Cornell University with a Bachelor of Science majoring in Environmental Science and Sustainability and minoring in Latin American Studies. \u003cbr\u003e\u003cbr\u003eI figure skate, play the viola, perform in community theater, and love learning languages.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am elated to join the Curious Cardinals team. My golden mantra when it comes to teaching is borrowed from the late, great Michaelangelo, who said \"I am still learning.\" In the past, I have taught people how to figure skate, speak a second language (Spanish and Portuguese), play musical instruments, and help them discover their passions. Throughout these teaching situations, I found myself learning \u003cem\u003ein tandem \u003c/em\u003ewith the student, be it learning which methods worked with their learning process, or shifting my perspectives when reflecting on different questions students would ask. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy experiences living in Brazil helped inspire my passion for environmental conservation and international affairs. By living between two cities, Washington D.C. and Belo Horizonte, I was able to perceive how people incorporated nature and biodiversity into their daily lives through a biculutural and bilingual lens. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs your mentor, I hope to strengthen our ability to learn, expand our minds, and overcome any obstacles that come our way.\u003c/p\u003e","teachingVideoPlaybackId":"oQ8TInL43wIcghIsk01zNfoExTaA1HORjBNdbKsZ1G0000","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest academic achievement was in the Summer of 2022. I was on a 6-week exchange program outside of Quito, Ecuador at a cacao farm performing sustainable research. Without much direction, I created a Virtual AR map of the cacao-farm that simultaneously communicated important agro-ecological information about the farm. The map was published on Mashpi Shungo Chocolatera's website to have people tour the reserve without travelling to it.\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Environmental Science and Sustainability","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b2495eb5-15eb-4aff-bc1f-0c878633d893\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/59376d05-0250-4cc0-9004-aeeed5f57126/-/preview/-/format/jpg/","https://ucarecdn.com/1a188c86-afec-46fb-b221-e65aca22667d/-/preview/-/format/jpg/","https://ucarecdn.com/a4613a72-8885-4731-86ab-c47c86a4f791/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c0a94bb4-be39-477a-b6b9-80129960f24d\"}"},{"__ref":"Education:{\"uuid\":\"87477ecf-0518-4380-ad48-d9da796bc5c2\"}"}],"hiredAt":"2023-06-21T18:49:19.478Z","topics":["STEM Project","World Cultures","Sustainability","Spanish","Reading","Executive Function","College Essay Writing","Academic Coaching","Writing","Film / Theater"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jacob-duffles\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d5ce9669-fcde-41a8-b175-e86667bad000\"}"}}},"_sentryTraceData":"de2240f1dc08451abacd903f9a2038e6-b031134cfd9674be-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=de2240f1dc08451abacd903f9a2038e6,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jacob-duffles"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
