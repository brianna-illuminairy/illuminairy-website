xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"eff1b81d-e7d6-4c2c-b0f1-67eff1179ad5\"}":{"__typename":"Favorites","uuid":"eff1b81d-e7d6-4c2c-b0f1-67eff1179ad5","photoUrl":"https://ucarecdn.com/9494ea17-7e0e-4636-89ec-af3ce5050461/","title":"Current read: Atmosphere","type":"BOOK"},"Favorites:{\"uuid\":\"20277a66-d1a2-41bb-bfd4-e8cd3efb37e8\"}":{"__typename":"Favorites","uuid":"20277a66-d1a2-41bb-bfd4-e8cd3efb37e8","photoUrl":"https://ucarecdn.com/101786c6-05e3-479f-b69c-baad254cca07/","title":"Stockholm, Sweden","type":"CITY"},"Favorites:{\"uuid\":\"99fec4c8-d54d-4678-a5a7-2bc5e5f3d061\"}":{"__typename":"Favorites","uuid":"99fec4c8-d54d-4678-a5a7-2bc5e5f3d061","photoUrl":"https://ucarecdn.com/c9c772a9-9a7c-4362-9722-547170e32cf8/","title":"Dance (is a sport too!)","type":"SPORT"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fdc92590-deb6-4577-ac96-2dec0281eb38\"}":{"__typename":"DeepDives","uuid":"fdc92590-deb6-4577-ac96-2dec0281eb38","content":"\u003cp\u003eTo me, mentors are guides, not educators. The best mentors I’ve had didn’t give me answers, but they asked the questions I needed to confront in order to make my next move. Rather than directing me, they helped me see how to use the tools and passions I already possessed. They built my confidence not by leading the way, but by encouraging me to follow through on my own plans and goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"94bfe5c1-3057-4290-ba4e-41b95425077e\"}":{"__typename":"DeepDives","uuid":"94bfe5c1-3057-4290-ba4e-41b95425077e","content":"\u003cp\u003eMy dream job is to apply the carbon management work I do in the lab to real industrial projects. I want to see research turn into something tangible and impactful. It would be exciting to be part of a carbon capture plant from start to finish and to help make it work in the real world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"29da6ba1-29fb-4779-a1b0-6d4f2f010a6a\"}":{"__typename":"School","uuid":"29da6ba1-29fb-4779-a1b0-6d4f2f010a6a","name":"Lehigh Valley Charter High School for the Arts","city":"Bethlehem","type":"HIGH","state":"PA","country":"United States","zip":"18015"},"Education:{\"uuid\":\"f71afc4b-b6fd-4412-8c04-3ff5a300f4bc\"}":{"__typename":"Education","uuid":"f71afc4b-b6fd-4412-8c04-3ff5a300f4bc","school":{"__ref":"School:{\"uuid\":\"29da6ba1-29fb-4779-a1b0-6d4f2f010a6a\"}"},"startYear":"2018","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e9ecd579-3f5f-4655-8c9a-08645dc1702a\"}":{"__typename":"School","uuid":"e9ecd579-3f5f-4655-8c9a-08645dc1702a","name":"Skidmore College","city":"Saratoga Springs","type":"COLLEGE","state":"New York","country":"United States","zip":"12866"},"Education:{\"uuid\":\"400d15d2-87d7-4b75-b908-cb3278546851\"}":{"__typename":"Education","uuid":"400d15d2-87d7-4b75-b908-cb3278546851","school":{"__ref":"School:{\"uuid\":\"e9ecd579-3f5f-4655-8c9a-08645dc1702a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Environmental Science","degree":null},"MentorPublicProfile:{\"uuid\":\"1c040937-0c19-46e2-8154-b0c7933af163\"}":{"__typename":"MentorPublicProfile","uuid":"1c040937-0c19-46e2-8154-b0c7933af163","displayName":"Kara W.","slug":"kara-white-1","biography":"\u003cp\u003eDo you care about the planet but aren’t sure what you can actually do about climate change? Do you love science, nature, or solving real-world problems? Are you still trying to figure out what you really care about? If you can relate to any of these, I'm here to help.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi! I’m Kara, and I’m currently a Master’s student in Earth \u0026amp; Environmental Engineering at Columbia University, focusing on Sustainable Energy and Carbon Management. In simple terms, I study how we can power the world without damaging it, and how we can clean up the carbon pollution already in the atmosphere.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also a student researcher in a Direct Air Capture (DAC) lab, where we design and test materials that literally pull carbon dioxide out of the air. It’s like engineering a high-tech sponge for carbon! My work combines chemistry, climate science, and innovation, and I love being part of research that could help shape the future of clean energy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore Columbia, I studied Environmental Science at Skidmore College, graduating cum laude with Departmental Honors. I’ve worked hands-on in water and soil chemistry labs, studied renewable energy systems, and explored how environmental policy shapes real-world change. For my honors thesis, my team and I created a new method using spent brewer’s yeast (yes, like from making beer!) to remove trace lead from contaminated drinking water. I’m especially interested in solutions that are creative, affordable, and scalable.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I’ve interned at NYSERDA (New York State Energy Research \u0026amp; Development Authority), where I worked on clean transportation initiatives like electric vehicles and charging infrastructure. I’ve also contributed to a National Renewable Energy Laboratory (NREL) wind energy study and volunteered on solar energy projects through WWOOF. These experiences showed me how science, engineering, and policy come together to create real change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a high schooler, I went to a specialized performing arts school. While I didn't become a professional dancer, the intense curriculum there taught me discipline, resilience and creativity, all of which I am grateful for and have contributed to the person and student I am today. I even started exploring my passion for the environment through the choreography of my senior year modern dance pieces, which included themes inspired by California's forest fires and climate advocacy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI like to give my high school example to show that:\u003c/p\u003e\u003cbr\u003e\u003cp\u003e1. I don't expect my mentees to have everything figured out and,\u003c/p\u003e\u003cp\u003e2. passion projects can be unique, creative and multidisciplinary! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I want to help you turn your curiosity into action. Whether you’re exploring a future in sustainability, working on a passion project, preparing for college applications, or just trying to figure out where to start, I’m here to support you. We can break down complex topics, brainstorm project ideas, build research skills, or map out academic paths in environmental science and engineering. Together, we can tailor your academic success or passion project to your unique skills and interests. If you’re ready to learn, explore, and make an impact, I’d love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"pMbKh3L1wAJwEEOug4HXD7fdmsLHQcM01ARBOLrkgoXM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"eff1b81d-e7d6-4c2c-b0f1-67eff1179ad5\"}"},{"__ref":"Favorites:{\"uuid\":\"20277a66-d1a2-41bb-bfd4-e8cd3efb37e8\"}"},{"__ref":"Favorites:{\"uuid\":\"99fec4c8-d54d-4678-a5a7-2bc5e5f3d061\"}"}],"causesSupported":[],"major":"Environmental Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fdc92590-deb6-4577-ac96-2dec0281eb38\"}"},{"__ref":"DeepDives:{\"uuid\":\"94bfe5c1-3057-4290-ba4e-41b95425077e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/24215ffb-13f8-42e2-9b7d-18a7e4935ce0/-/preview/-/format/jpg/","https://ucarecdn.com/a700c58b-9fc2-40a6-a022-d1d1717c215b/-/preview/-/format/jpg/","https://ucarecdn.com/a407c39c-8880-433e-bbc1-cf00d6392448/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f71afc4b-b6fd-4412-8c04-3ff5a300f4bc\"}"},{"__ref":"Education:{\"uuid\":\"400d15d2-87d7-4b75-b908-cb3278546851\"}"}],"hiredAt":"2026-02-11T19:10:59.321Z","topics":["Algebra I","Algebra II","Pre-Algebra","6-8 Grade Science","Biology","Chemistry","Physics","Academic Coaching","College Essay Writing","Executive Function","STEM Project","Sustainability"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kara-white-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1c040937-0c19-46e2-8154-b0c7933af163\"}"}}},"_sentryTraceData":"32adc512bd3b4619955d4cf76fb1d9c2-ba6e19df99e3c00e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=32adc512bd3b4619955d4cf76fb1d9c2,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"kara-white-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gt
