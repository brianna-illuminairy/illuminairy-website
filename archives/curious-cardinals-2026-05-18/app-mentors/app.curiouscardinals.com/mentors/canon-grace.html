xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ffd441fb-be6e-4d58-bc86-de8d6c7b38ca\"}":{"__typename":"DeepDives","uuid":"ffd441fb-be6e-4d58-bc86-de8d6c7b38ca","content":"\u003cp\u003eExperiences can teach us and help us grow a great deal, and it's up to us to share them and use that knowledge to empower others! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4f3cf26e-1b95-4d39-969c-130b1ac6fb4d\"}":{"__typename":"DeepDives","uuid":"4f3cf26e-1b95-4d39-969c-130b1ac6fb4d","content":"\u003cp\u003eI hope to learn Vietnamese and Korean flutently\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"731ab28b-17d6-4539-90f8-8f93b21c0161\"}":{"__typename":"DeepDives","uuid":"731ab28b-17d6-4539-90f8-8f93b21c0161","content":"\u003cp\u003eKnowing my family and friends are in my corner\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"7527027f-a614-4fd2-858a-c7a69606c051\"}":{"__typename":"DeepDives","uuid":"7527027f-a614-4fd2-858a-c7a69606c051","content":"\u003cp\u003eI was very happy and enjoyed spending time with my friends and getting to meet others in IB (International Baccalaureate) program at my high school - I didn't know what I wanted to do as a career even after I graduated, though!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"46a1987d-2bb5-450b-8f23-674e9394d662\"}":{"__typename":"School","uuid":"46a1987d-2bb5-450b-8f23-674e9394d662","name":"Glen A. Wilson High School","city":"Hacienda Heights","type":"HIGH","state":"California","country":"United States","zip":"91745"},"Education:{\"uuid\":\"063bd00c-57dd-4abf-b319-ae391951ca63\"}":{"__typename":"Education","uuid":"063bd00c-57dd-4abf-b319-ae391951ca63","school":{"__ref":"School:{\"uuid\":\"46a1987d-2bb5-450b-8f23-674e9394d662\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"1da33e13-3d49-484a-8ed2-1f251e0e3a0d\"}":{"__typename":"Education","uuid":"1da33e13-3d49-484a-8ed2-1f251e0e3a0d","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"95484740-8353-4e30-89fc-9f4d9ac832bc\"}":{"__typename":"MentorPublicProfile","uuid":"95484740-8353-4e30-89fc-9f4d9ac832bc","displayName":"Canon P.","slug":"canon-grace","biography":"\u003cp\u003eHello, students and parents, and welcome to Curious Cardinals! My name is Canon, and I'm a Junior at Stanford University studying Data Science and Biology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not enjoying the latest gluten-free Trader Joe's snack or cracking another statistical inference problem, you'll find me around campus practicing with my dance group Common Origins, holding peer advising hours at the Haas Center for Public Service, or in the lab with iGEM, my competitive synthetic biology and bioengineering team! I also love to try new restaurants with my friends and share all of my adventures with my family back home in Southern California.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm very excited to be a mentor on the Passion Projects track to work with students on content creation, advocacy, and everything in between! I have a strong interest in helping students let their voices be heard, which comes from my own personal experience with advocacy and creating an online platform.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt birth, I was diagnosed with Turner Syndrome, which is a condition of a partially or completely missing X chromosome that has led to the requirement of several heart procedures throughout my lifetime. After beginning to work with the Turner Syndrome Foundation in high school and meet others in the Turner Syndrome community, I decided I wanted to help spread awareness through an online platform to connect girls and women with affected by TS.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough my experiences working to advocate with others in the rare disease community, I beame inspired and realized that creating engaging content and community are powerful ways to make an impact. I'm now working on making this project into a podcast called The Rare Perspective: Rare Disease Stories - there are a couple of episodes ready to go and lots more to come! My involvement with the rare disease community is also why I'm studying Data Science with a secondary major in biology: I am very interested in the blend between these two fields and working to make discoveries from genetic or rare-disease-related data to pioneer ways forward for treatment and proper diagnosis. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAll to say, I'm very excited to be working with you here at Curious Cardinals! No matter where you are in your passion project journey, there will be so much to explore and learn. We'll brainstorm, excecute and spread the word so that you can get your message across and serve your community. \u003c/p\u003e","teachingVideoPlaybackId":"02wuVDlP8t3bssNT1DRFtYa3b4TXINYUzULrLVBTKu500","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ffd441fb-be6e-4d58-bc86-de8d6c7b38ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"4f3cf26e-1b95-4d39-969c-130b1ac6fb4d\"}"},{"__ref":"DeepDives:{\"uuid\":\"731ab28b-17d6-4539-90f8-8f93b21c0161\"}"},{"__ref":"DeepDives:{\"uuid\":\"7527027f-a614-4fd2-858a-c7a69606c051\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2aa2ac17-65a6-4448-95a9-d5671132eff0/-/preview/-/format/jpg/","https://ucarecdn.com/9d3d71be-351d-4c0a-beb6-9fc97769eda6/-/preview/-/format/jpg/","https://ucarecdn.com/c80af747-48b3-4c24-816e-ca1664c2cdf4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"063bd00c-57dd-4abf-b319-ae391951ca63\"}"},{"__ref":"Education:{\"uuid\":\"1da33e13-3d49-484a-8ed2-1f251e0e3a0d\"}"}],"hiredAt":"2025-12-02T17:48:36.706Z","topics":["History Project","Video / Photography","Visual Arts / Graphic Design","Creative Writing","K-6 Storybook","Film / Theater","Business / Entrepreneurship","Coding / Programming","Medicine / Health","Web Design","Sports Analytics","STEM Project","Machine Learning / AI","Game Design","Journalism","Public Speaking","Sustainability"],"communityBadges":[],"restricte
