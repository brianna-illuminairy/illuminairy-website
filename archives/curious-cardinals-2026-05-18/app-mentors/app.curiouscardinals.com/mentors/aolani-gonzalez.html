xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9efced6d-2fba-49d4-a4b9-f5c2db81faaf\"}":{"__typename":"DeepDives","uuid":"9efced6d-2fba-49d4-a4b9-f5c2db81faaf","content":"\u003cp\u003eI would tell my middle school self to keep working hard and not overthink everything. Things eventually start to make sense, even if they don’t right away. Just stay focused and remember that you are doing better than you think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fd9adf99-e9dc-477e-9c2b-cb436d473552\"}":{"__typename":"DeepDives","uuid":"fd9adf99-e9dc-477e-9c2b-cb436d473552","content":"\u003cp\u003eMentorship matters to me because I know how hard it is to figure things out alone. As a first-generation student, I did not have that guidance, so I want to support other students and motivate them to continue pursuing their education.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a7c36f3d-0ebe-47ef-8f34-748ab6f5cc69\"}":{"__typename":"DeepDives","uuid":"a7c36f3d-0ebe-47ef-8f34-748ab6f5cc69","content":"\u003cp\u003eI chose mechanical engineering because I have always been curious about how things work. It is a major that lets me explore many areas like math, physics, design, and problem solving. I like that it keeps me learning and thinking in new ways every day!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"f390496e-169b-4766-8d8f-e7dde1af6440\"}":{"__typename":"DeepDives","uuid":"f390496e-169b-4766-8d8f-e7dde1af6440","content":"\u003cp\u003eMy greatest source of motivation is curiosity and the drive to keep learning new things. I love the idea that education can open doors and create real change in the world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"2888a21f-ba9c-4618-894f-a0da8291ed8a\"}":{"__typename":"School","uuid":"2888a21f-ba9c-4618-894f-a0da8291ed8a","name":"Newport Harbor High School","city":"Newport Beach","type":"HIGH","state":"California","country":"United States","zip":"92663"},"Education:{\"uuid\":\"7c66e6ed-ab4f-474d-b432-0db209a16fee\"}":{"__typename":"Education","uuid":"7c66e6ed-ab4f-474d-b432-0db209a16fee","school":{"__ref":"School:{\"uuid\":\"2888a21f-ba9c-4618-894f-a0da8291ed8a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"4bb1d9ea-598c-446f-b7d4-513e4de52389\"}":{"__typename":"Education","uuid":"4bb1d9ea-598c-446f-b7d4-513e4de52389","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"c475f6b5-a155-432f-92bd-24a263b46ecb\"}":{"__typename":"MentorPublicProfile","uuid":"c475f6b5-a155-432f-92bd-24a263b46ecb","displayName":"Aolani G.","slug":"aolani-gonzalez","biography":"\u003cp\u003eHello all students and parents! I am a second-year transfer student studying mechanical engineering at Yale. I am so excited to meet you and support you on your academic journey. I know how exciting and challenging school can feel, and I hope to make the path a little clearer and more encouraging for you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was a varsity cheerleader with a part-time job and an eagerness to go to college. My favorite classes were AP Calculus and Physics, though they were also the most challenging. Still, it was rewarding to work through difficult problems, learn from my mistakes, and reach a deeper understanding of the material. Those experiences inspired me to choose mechanical engineering as my major and shaped how I approach learning today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI attended the University of California, Irvine for a year while juggling two part-time jobs. I realized I was not fully resonating with the path I was on and wanted to make a change for myself. So, I crafted a handful of college applications once more. This was a difficult decision because my future felt uncertain again, but I trusted that following my instincts and pursuing a school that felt right for me was the best choice.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough my time at Yale is just beginning, I have been able to become involved in many exciting projects. I am working with a professor doing electrospray and mass spectrometry research and a graduate student on nanofabrication research. I am also leading a research paper exploring the technical and political feasibility of space elevators. Additionally, I am on the suspension team for Yale’s race car team, Bulldogs Racing, and the science mission systems team for Yale’s Exploration Rover. These experiences have already taught me a lot about collaboration, problem solving, and balancing multiple responsibilities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I enjoy learning languages. I took three years of American Sign Language in high school and continue to study it in college. I also learn French on Duolingo, maintaining a 1075-day streak, and Spanish is spoken at home. I love traveling and exploring new places, always curious about how the world works. Pursuing mechanical engineering helps me make sense of it all.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope to support you in discovering your passions, exploring your interests, and honing your goals for the future. School can be challenging, but it can also be exciting and rewarding when you have support, guidance, and the curiosity to keep learning. I look forward to helping you find your way and cheering you on every step of the journey.\u003c/p\u003e","teachingVideoPlaybackId":"OnFDH02tZUjMO9NsaekzO5Je6HYjVjnzfuFQMhg5bR4I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9efced6d-2fba-49d4-a4b9-f5c2db81faaf\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd9adf99-e9dc-477e-9c2b-cb436d473552\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7c36f3d-0ebe-47ef-8f34-748ab6f5cc69\"}"},{"__ref":"DeepDives:{\"uuid\":\"f390496e-169b-4766-8d8f-e7dde1af6440\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0baa456b-f2ae-4bf9-9e78-36608d9206f6/-/preview/-/format/jpg/","https://ucarecdn.com/626511ec-e567-449e-a884-5ea9b23ff6d3/-/preview/-/format/jpg/","https://ucarecdn.com/9282b9be-3d12-4357-a89d-d9acc8a074c6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER",
