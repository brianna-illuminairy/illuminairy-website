xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"84fd1ec4-ed86-47d8-9766-e94859889cca\"}":{"__typename":"DeepDives","uuid":"84fd1ec4-ed86-47d8-9766-e94859889cca","content":"\u003cp\u003eMentorship matters to me because I am a big sister. I have always felt called to help those younger than me tell their story, find their passions, and make a difference in their own way. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"18682808-c645-44ce-9862-2f99e9968976\"}":{"__typename":"DeepDives","uuid":"18682808-c645-44ce-9862-2f99e9968976","content":"\u003cp\u003eWhen I was younger, I used to have a reoccurring dream that I was shrinking and would navigate a random adventure mouse-sized. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c413dc4f-d9be-4dd5-834c-767cbf9fe479\"}":{"__typename":"DeepDives","uuid":"c413dc4f-d9be-4dd5-834c-767cbf9fe479","content":"\u003cp\u003eI chose my major because Chemistry is highly specific yet impacts everything. From the environment to human health, and our technology Chemistry is the foundation of how we understand the world and can move forward. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"df13fccd-6fe0-4577-8018-ac01320c0fdb\"}":{"__typename":"DeepDives","uuid":"df13fccd-6fe0-4577-8018-ac01320c0fdb","content":"\u003cp\u003eA surgeon!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"33f499fc-7052-43ff-893c-2cf9480b09b0\"}":{"__typename":"School","uuid":"33f499fc-7052-43ff-893c-2cf9480b09b0","name":"Boulder High School","city":"Boulder","type":"HIGH","state":"Colorado","country":"United States","zip":"80302"},"Education:{\"uuid\":\"e468ad22-e509-438b-bd56-7dba0344ab32\"}":{"__typename":"Education","uuid":"e468ad22-e509-438b-bd56-7dba0344ab32","school":{"__ref":"School:{\"uuid\":\"33f499fc-7052-43ff-893c-2cf9480b09b0\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"251d314c-d662-4ec6-a843-797296c5bdbb\"}":{"__typename":"School","uuid":"251d314c-d662-4ec6-a843-797296c5bdbb","name":"Emory University","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30322"},"Education:{\"uuid\":\"50de5d2d-fce7-4a71-a29a-c2e61fe50d4c\"}":{"__typename":"Education","uuid":"50de5d2d-fce7-4a71-a29a-c2e61fe50d4c","school":{"__ref":"School:{\"uuid\":\"251d314c-d662-4ec6-a843-797296c5bdbb\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":"2022","major":"Chemistry","degree":"Bachelor of Science"},"MentorPublicProfile:{\"uuid\":\"21d45999-3cc6-4a02-93cd-cb8ee521e9c2\"}":{"__typename":"MentorPublicProfile","uuid":"21d45999-3cc6-4a02-93cd-cb8ee521e9c2","displayName":"Emma G.","slug":"emma-","biography":"\u003cp\u003eA scientist? A concert planner? A bike-packer/rock climber/trail runner? Why not do it all!\u0026nbsp;\u003c/p\u003e\u003cp\u003eHello! My name is Emma, and I graduated summa cum laude from Emory University with a Bachelor of Science in Chemistry and a minor in Spanish. I spent last year as a Fulbright Scholar in Barcelona, directing a clinical trial for a novel immunotherapy working across six hospitals in Spain. I am specifically interested in Dermatologic Oncology (skin cancer) and have approached this passion from multiple angles. I spent my undergrad doing basic science immunology research, understanding the mechanisms of chronic illnesses like cancer. During the summers, I worked for Estée Lauder as a cosmetic chemist, preventing skin cancer with sunscreen formulations and using my creative juices to make new lipsticks. I am currently working as a medical assistant before starting as a life science consultant, preparing for an MD/MBA program.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI grew up in Boulder, Colorado, and love everything outside. This year, I've run three half marathons, bike-packed\u0026nbsp;100 miles in Utah, and scaled mountains at home and abroad. I love a good adventure and recently picked up fly fishing. Ski season is one of my favorite times of the year.\u0026nbsp;\u003c/p\u003e\u003cp\u003eDuring my undergrad, I was highly involved in the Emory community, managing a $750,000 budget to plan concerts for artists like Jack Harlow, AJR, Bryce Vine, and Dominic Fike. I also lead the First-Year Orientation program. I am passionate about building strong communities and was heavily involved in the diversity, equity, and inclusion efforts of all the student organizations I was involved in after the pandemic.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am bubbly and excited about helping students find their passions and tell their stories. I am organized and excited to motivate students to create an independent project, start a club, and impact their community. I like to edit student writing as well as tutor science and Spanish. I love creating long-term relationships and supporting growth over time. I can't wait to meet you!!!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"84fd1ec4-ed86-47d8-9766-e94859889cca\"}"},{"__ref":"DeepDives:{\"uuid\":\"18682808-c645-44ce-9862-2f99e9968976\"}"},{"__ref":"DeepDives:{\"uuid\":\"c413dc4f-d9be-4dd5-834c-767cbf9fe479\"}"},{"__ref":"DeepDives:{\"uuid\":\"df13fccd-6fe0-4577-8018-ac01320c0fdb\"}"}],"active":true,"profilePhotos":["https://api.dicebear.com/7.x/initials/svg?seed=EG","https://ucarecdn.com/4ea282b3-22d7-42be-9132-054e5aeca3d0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e468ad22-e509-438b-bd56-7dba0344ab32\"}"},{"__ref":"Education:{\"uuid\":\"50de5d2d-fce7-4a71-a29a-c2e61fe50d4c\"}"}],"hiredAt":"2023-09-07T09:36:54.885Z","topics":["Creative Writing","Fashion / Cosmetics","History Project","Medicine / Health","STEM Project","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"emma-\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"21d45999-3cc6-4a02-93cd-cb8ee521e9c2\"}"}}},"_sentryTraceData":"2ef5e1af07174f8094a37065466f2897-8387ab087a75cbb0-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2ef5e1af07174f8094a37065466f2897,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"emma-"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"
