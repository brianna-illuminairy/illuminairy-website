xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b07326c7-1a6b-4cda-8b06-637dd73efb17\"}":{"__typename":"Favorites","uuid":"b07326c7-1a6b-4cda-8b06-637dd73efb17","photoUrl":"https://ucarecdn.com/3fd7950e-42b9-461d-9dd2-e9e0571ec07a/","title":"Ahmed Ezz","type":"ACTOR"},"Favorites:{\"uuid\":\"802bf094-72cb-46f1-ab00-94b743362480\"}":{"__typename":"Favorites","uuid":"802bf094-72cb-46f1-ab00-94b743362480","photoUrl":"https://ucarecdn.com/de3677b9-f981-418d-b703-e5c6818eb0be/","title":"Liverpool","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"beb03baf-aa19-4599-b634-1f528e7e45d9\"}":{"__typename":"Favorites","uuid":"beb03baf-aa19-4599-b634-1f528e7e45d9","photoUrl":"https://ucarecdn.com/effd9336-c53b-45d3-bfcc-722356362e5b/","title":"Amr Diab","type":"ARTIST"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"aac9dc55-a7aa-42bb-8e78-c1bd8d58e959\"}":{"__typename":"DeepDives","uuid":"aac9dc55-a7aa-42bb-8e78-c1bd8d58e959","content":"\u003cp\u003eMentorship matters to me because I know how transformative it can be to have someone in your corner who not only understands the path you’re trying to navigate, but is willing to help you through it. As a first-generation law student and the child of immigrants, many aspects of academia and the legal profession felt unfamiliar and, at times, inaccessible. Having mentors who took the time to answer my questions, share their experiences, and offer honest guidance made a meaningful difference in how I approached opportunities and challenges.\u003c/p\u003e\u003cp\u003eThat experience shaped how I view mentorship—not just as giving advice, but as creating access, building confidence, and helping someone see possibilities they may not have considered for themselves. I think mentorship is especially important in spaces like law, where unwritten rules and expectations can be just as important as formal knowledge.\u003c/p\u003e\u003cp\u003eFor me, mentorship is also about reciprocity and responsibility. I’ve benefited from people who invested in me, and I feel a strong obligation to do the same for others. Whether it’s helping a student think through their goals, refine their writing, or navigate academic or professional decisions, I aim to be someone who is approachable, thoughtful, and honest.\u003c/p\u003e\u003cp\u003eUltimately, mentorship matters because it has the power to change how someone sees themselves and their future—and I want to be part of that process.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"fba18c81-06bc-401d-94d5-b082c69c6e10\"}":{"__typename":"DeepDives","uuid":"fba18c81-06bc-401d-94d5-b082c69c6e10","content":"\u003cp\u003eMy dream job is to be an attorney working at the intersection of immigration and criminal law, where I can directly advocate for individuals whose rights are most at risk. I am especially interested in representing immigrants facing detention or removal, as well as those navigating the consequences of criminal charges within the immigration system. In the long term, I hope to combine direct representation with impact litigation and policy work, addressing the systemic issues that create barriers to justice in the first place.\u003c/p\u003e\u003cp\u003eMore broadly, I want a career that allows me to be both an advocate and a problem-solver—someone who not only fights for individual clients but also contributes to shaping a more just and equitable legal system. Whether through public defense, nonprofit work, or strategic litigation, my goal is to use the law as a tool to protect vulnerable communities and expand access to justice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ec803480-667c-4dc8-bf52-7172cf0b1cea\"}":{"__typename":"DeepDives","uuid":"ec803480-667c-4dc8-bf52-7172cf0b1cea","content":"\u003cp\u003eI chose to pursue law because I saw early on how deeply the legal system shapes people’s lives—especially for immigrants and marginalized communities. Growing up as the child of immigrants, I witnessed how confusing and, at times, intimidating legal and bureaucratic systems can be, even for people who are doing everything right. That experience made me want to better understand the law, not just academically, but as a tool I could use to advocate for others.\u003c/p\u003e\u003cp\u003eIn college and beyond, I was drawn to courses and experiences that focused on justice, rights, and inequality, which ultimately led me to law school. I was especially interested in how criminal law and immigration law intersect, and how that overlap can have life-altering consequences for individuals and families.\u003c/p\u003e\u003cp\u003eChoosing this path felt both personal and purposeful. I wanted a career where I could make a tangible impact—helping people navigate systems that often feel inaccessible, and working toward a more fair and equitable legal system overall.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"277dd787-2807-4646-97cb-025697b5b0d4\"}":{"__typename":"DeepDives","uuid":"277dd787-2807-4646-97cb-025697b5b0d4","content":"\u003cp\u003eIn my spare time, I enjoy staying active and connected to my community. I coach soccer, which is something I find especially rewarding—not just because I love the sport, but because it allows me to mentor younger players, build teamwork, and create a positive environment where they can grow both on and off the field.\u003c/p\u003e\u003cp\u003eOutside of coaching, I enjoy traveling, trying new restaurants, powerlifting, and watching Arabic films with friends. These activities help me unwind, stay balanced, and stay connected to both my cultural background and the people around me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f4ef9a13-dbb8-4a08-8b3a-e32145b092bf\"}":{"__typename":"School","uuid":"f4ef9a13-dbb8-4a08-8b3a-e32145b092bf","name":"Al-Noor Academy (Grades Pre-k - 5 campus)","city":"Sharon","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02067"},"Education:{\"uuid\":\"05266191-247d-4733-931e-eed6b759463b\"}":{"__typename":"Education","uuid":"05266191-247d-4733-931e-eed6b759463b","school":{"__ref":"School:{\"uuid\":\"f4ef9a13-dbb8-4a08-8b3a-e32145b092bf\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}":{"__typename":"School","uuid":"0505e371-93af-4291-ab60-2728b5ad4443","name":"Northeastern University","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02115"},"Education:{\"uuid\":\"96bc56a9-9c3a-44fb-a2f4-a6be09295f90\"}":{"__typename":"Education","uuid":"96bc56a9-9c3a-44fb-a2f4-a6be09295f90","school":{"__ref":"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Law Degree","degree":null},"MentorPublicProfile:{\"uuid\":\"73bd28b1-1868-4fc8-b0cb-91cd5a838c1f\"}":{"__typename":"MentorPublicProfile","uuid":"73bd28b1-1868-4fc8-b0cb-91cd5a838c1f","displayName":"Mariam H.","slug":"mariam-hassan","biography":"\u003cp\u003eI am a law student and aspiring attorney passionate about expanding access to justice, particularly for immigrant communities and individuals navigating the intersection of criminal and immigration law. As the child of immigrants and a dual Egyptian-American, my personal experiences have deeply shaped my commitment to advocacy and protecting the rights of those who are often overlooked, marginalized, or unfairly targeted by legal systems.\u003c/p\u003e\u003cp\u003eMy academic and professional work centers on immigration and public interest law. Through my participation in an Immigration Clinic, I work directly with clients on complex asylum cases involving domestic violence, gender-based harm, and gang persecution. This experience has strengthened my ability to conduct detailed client interviews, develop legal theories, and gather supporting documentation, including country conditions research. I have also contributed to a Prisoners’ Rights Clinic, where I engaged with issues of incarceration and constitutional rights, further deepening my understanding of systemic inequities. In addition, my pro bono work assisting Haitian asylum seekers has allowed me to support vulnerable populations by helping prepare filings and researching conditions that substantiate claims for protection.\u003c/p\u003e\u003cp\u003eBeyond my legal work, I am committed to broader forms of advocacy and community impact. I co-founded a clothing brand that donates all proceeds to humanitarian relief efforts in Gaza, reflecting my dedication to global justice and solidarity. I am also deeply interested in international affairs, particularly the ways in which culture and sports intersect with identity and diplomacy. I have written about how soccer can function as a universal language, shaping national identity and fostering connection across borders.\u003c/p\u003e\u003cp\u003eOutside of my academic and professional commitments, I enjoy traveling, exploring new restaurants, powerlifting, and watching Arabic films with friends. These interests help me stay grounded and connected to both my cultural background and the communities around me.\u003c/p\u003e\u003cp\u003eAs a mentor, I strive to create a supportive, approachable, and engaging environment where students feel comfortable asking questions and challenging themselves. I value clear communication, critical thinking, and adaptability, and I aim to help students not only achieve their academic goals but also build confidence in their abilities and perspectives. My goal is to meet students where they are, provide practical guidance, and empower them to succeed in whatever path they choose.\u003c/p\u003e","teachingVideoPlaybackId":"3nSeGOyrQ7DzqyyfHx1kqxqJ02xjFsQwDbQXBF1xL00tY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I’m most proud of is my work with asylum seekers through my Immigration Clinic and pro bono efforts. I’ve had the opportunity to work closely with clients who have experienced domestic violence, gang persecution, and other forms of serious harm, and helping them navigate the asylum process has been incredibly meaningful.\u003c/p\u003e\u003cp\u003eIn these cases, I’ve conducted detailed client interviews, helped draft affidavits, and worked on country conditions research to support their claims. What makes this work especially impactful to me is the level of trust involved—clients are often sharing some of the most difficult experiences of their lives, and being able to support them through that process is both a responsibility and a privilege.\u003c/p\u003e\u003cp\u003eI’m particularly proud of being able to contribute to building strong, thoughtful applications that give clients a real chance at safety and stability. Even small steps—like helping clarify someone’s story or finding the right documentation—can make a significant difference in the outcome of a case.\u003c/p\u003e\u003cp\u003eThis experience has reinforced why I chose this path in the first place. It’s shown me the tangible impact legal advocacy can have on someone’s life, and it’s motivated me to continue doing this work with care, empathy, and dedication.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b07326c7-1a6b-4cda-8b06-637dd73efb17\"}"},{"__ref":"Favorites:{\"uuid\":\"802bf094-72cb-46f1-ab00-94b743362480\"}"},{"__ref":"Favorites:{\"uuid\":\"beb03baf-aa19-4599-b634-1f528e7e45d9\"}"}],"causesSupported":[],"major":"Law Degree","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"aac9dc55-a7aa-42bb-8e78-c1bd8d58e959\"}"},{"__ref":"DeepDives:{\"uuid\":\"fba18c81-06bc-401d-94d5-b082c69c6e10\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec803480-667c-4dc8-bf52-7172cf0b1cea\"}"},{"__ref":"DeepDives:{\"uuid\":\"277dd787-2807-4646-97cb-025697b5b0d4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3ca8fc47-c205-417d-a97f-013dddbcdd7d/-/preview/-/format/jpg/","https://ucarecdn.com/006b35bf-6ddb-4c85-bab3-ca0049dd787f/-/preview/-/format/jpg/","https://ucarecdn.com/afb0cf65-ebd4-49a7-815d-8b1bda9ae4e1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"05266191-247d-4733-931e-eed6b759463b\"}"},{"__ref":"Education:{\"uuid\":\"96bc56a9-9c3a-44fb-a2f4-a6be09295f90\"}"}],"hiredAt":"2026-04-10T17:34:30.991Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mariam-hassan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"73bd28b1-1868-4fc8-b0cb-91cd5a838c1f\"}"}}},"_sentryTraceData":"00b4bcaefc0440f4820f2f4e55156c34-9fe306a2a8bf73d9
