uuid":"2e9d0368-ba61-4853-b654-395dd8026cb6","content":"\u003cp\u003eI want to teach a cooking class. I love reviewing and trying new foods and I want to make my friends and family amazing dishes that they can review with me\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"636f2626-722f-45f1-aa87-9d37a99e3ed4\"}":{"__typename":"DeepDives","uuid":"636f2626-722f-45f1-aa87-9d37a99e3ed4","content":"\u003cp\u003eBe proactive, but no paranoid. Sometimes you feel like you're falling behind and that you're not that smart. But if you reflect on the work you've been putting in, you'll realize that you're doing a great job. Being proactive and getting to that point is what makes you a strong, smart student.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"59a8f3ef-b95e-4c4d-8bbb-101a3ec2f35c\"}":{"__typename":"DeepDives","uuid":"59a8f3ef-b95e-4c4d-8bbb-101a3ec2f35c","content":"\u003cp\u003eMy parents. They've always supported me and kept a roof over my head, even when facing obstacles like a recession. They deserve a long, well-deserved break when I'm able to support them and that thought always keeps me motivated.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"9622dd81-5797-4a88-ba43-46fca6829905\"}":{"__typename":"School","uuid":"9622dd81-5797-4a88-ba43-46fca6829905","name":"Sobrato High School","ci
