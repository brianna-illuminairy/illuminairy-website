xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5914e550-7290-4ea1-9522-25c572db529f\"}":{"__typename":"DeepDives","uuid":"5914e550-7290-4ea1-9522-25c572db529f","content":"\u003cp\u003eIn my spare time I enjoy practicing photography for my schools new paper, going on runs, hiking, and studying films.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4670c78e-9222-4c88-8cfe-9e7fc1f2ef23\"}":{"__typename":"DeepDives","uuid":"4670c78e-9222-4c88-8cfe-9e7fc1f2ef23","content":"\u003cp\u003eI chose cognitive science as my major because it encompasses a lot of disciplines, such as computer science, neuroscience, economics, and philosophy. It combines numerous subjects that I am passionate in and allows me to mold my own studies into a possible career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6e242af1-c155-4218-8734-c6adc09f4526\"}":{"__typename":"DeepDives","uuid":"6e242af1-c155-4218-8734-c6adc09f4526","content":"\u003cp\u003eMentorship matters to me because I want to help kids pave their own path earlier on in their academic career, possibly furthering their preconceived goals. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"7ad124db-0af6-411f-8c27-2f501e08b8c7\"}":{"__typename":"DeepDives","uuid":"7ad124db-0af6-411f-8c27-2f501e08b8c7","content":"\u003cp\u003eI think that my greatest mentor was my high school track coach. He taught me the importance of mental toughness and self compassion which helped me gain enough discipline to work towards my goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"3f7b925f-352a-48ad-a7d2-a2bc9665cb57\"}":{"__typename":"School","uuid":"3f7b925f-352a-48ad-a7d2-a2bc9665cb57","name":"Chandler High School","city":"Chandler","type":"HIGH","state":"Arizona","country":"United States","zip":"85225"},"Education:{\"uuid\":\"4fa80105-10e2-4c10-b167-13052c21c43a\"}":{"__typename":"Education","uuid":"4fa80105-10e2-4c10-b167-13052c21c43a","school":{"__ref":"School:{\"uuid\":\"3f7b925f-352a-48ad-a7d2-a2bc9665cb57\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"d095e8d3-734a-4735-aea8-dad13b8a10ea\"}":{"__typename":"Education","uuid":"d095e8d3-734a-4735-aea8-dad13b8a10ea","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"919eeea5-f02d-4275-9f6d-35081b83149a\"}":{"__typename":"MentorPublicProfile","uuid":"919eeea5-f02d-4275-9f6d-35081b83149a","displayName":"Otis K.","slug":"otis-knapper-1","biography":"\u003cp\u003eHi my name is Otis Knapper, I’m originally from Chandler, Arizona, where I attended a public high school which deeply shaped both my work ethic and my perspective on education. Growing up in a public school system allowed me to see firsthand how access to academic resources can differ significantly from one community to another. That awareness has stayed with me and continues to influence how I think about opportunity, mentorship, and the importance of building confidence in students from all backgrounds.\u003c/p\u003e\u003cp\u003eToday, I am a student-athlete at Yale University studying Cognitive Science, a field that reflects my curiosity about how people think, learn, and make decisions. Cognitive science allows me to learn about numerous disciplines like computer science, neuroscience, and economics. Having a major with such a wide range of possibilities gives me more room to apply my knowledge in different spaces. Balancing the demands of collegiate athletics with rigorous academics has strengthened my discipline, time management, and resilience. At the same time, cognitive science challenges me to think creatively and analytically about complex problems, especially those at the intersection of human behavior and technology.\u003c/p\u003e\u003cp\u003eI am particularly interested in the intersection of science, business, and technology in the mental health space. In the future, I hope to help develop innovative tools and platforms that make mental health resources more accessible, personalized, and effective. I believe technology can be a powerful force for good when designed thoughtfully and ethically.\u003c/p\u003e\u003cp\u003eMentorship is especially important to me. I am passionate about helping students build confidence in their abilities by giving them the tools to expand their knowledge and think independently. I want young learners to feel empowered to ask questions, explore new ideas, and approach challenges with curiosity rather than being overly intimidated by the possibility of failure.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy film, photography, and outdoor activities such as hiking and ATV riding. I studied French abroad this past summer, immersing myself in a new culture, and previously spent a summer in Washington, D.C., studying civics and leadership. These experiences have broadened my perspective and reinforced my belief that curiosity, discipline, and confidence are the foundations for meaningful growth.\u003c/p\u003e","teachingVideoPlaybackId":"4NnWmNQe8xiCPl801nLzzpNx8rwOiQ5ic6Vqs9VVxvAY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5914e550-7290-4ea1-9522-25c572db529f\"}"},{"__ref":"DeepDives:{\"uuid\":\"4670c78e-9222-4c88-8cfe-9e7fc1f2ef23\"}"},{"__ref":"DeepDives:{\"uuid\":\"6e242af1-c155-4218-8734-c6adc09f4526\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ad124db-0af6-411f-8c27-2f501e08b8c7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/54ad3df0-72c1-44e2-9801-def3996b0fdb/-/preview/-/format/jpg/","https://ucarecdn.com/6da581a5-69cb-4153-b097-36a3d968af1e/-/preview/-/format/jpg/","https://ucarecdn.com/277030e1-ad6d-4b01-9b79-f23024af154d/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4fa80105-10e2-4c10-b167-13052c21c43a\"}"},{"__ref":"Education:{\"uuid\":\"d095e8d3-734a-4735-aea8-dad13b8a10ea\"}"}],"hiredAt":"2026-02-20T13:57:50.472Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Biology","Writing","French","Academic Coaching","Executive Function","Reading","Film / Theater","Video /
