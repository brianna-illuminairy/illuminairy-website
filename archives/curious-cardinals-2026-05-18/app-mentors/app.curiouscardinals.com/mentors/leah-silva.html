xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c25b0e89-f37b-4bf2-b03d-6978b4e8f240\"}":{"__typename":"DeepDives","uuid":"c25b0e89-f37b-4bf2-b03d-6978b4e8f240","content":"\u003cp\u003eMentorship matters to me because it’s one of the most powerful forms of guidance we can give—and receive. I wouldn’t be where I am today without the mentors who saw potential in me before I fully saw it in myself. Whether it was a teacher who encouraged me to speak up in class, or an older student who showed me that my background was a strength, those moments of support changed the way I saw myself.\u003c/p\u003e\u003cp\u003eMentorship is also about more than just academic help—it’s about having someone in your corner who listens, understands, and believes in your goals, even when they feel far off. As someone who’s navigated new cultures, school systems, and career paths, I know how valuable it is to have someone say, “I’ve been there, and you’ve got this.”\u003c/p\u003e\u003cp\u003eThat’s what I want to offer as a mentor: not just knowledge, but encouragement. I care deeply about helping students feel confident in their voice, proud of their perspective, and excited about their future. Mentorship is a way to pass on what I’ve learned, while empowering students to define success on their own terms.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"0ed141bc-4dd9-4149-a4f7-9c5f9d592514\"}":{"__typename":"DeepDives","uuid":"0ed141bc-4dd9-4149-a4f7-9c5f9d592514","content":"\u003cp\u003eIn high school, I was definitely the type to have a color-coded planner and way too many tabs open—both on my laptop and in life. I loved being involved in a little bit of everything: mock trial, student government, dance team, tutoring, volunteering—you name it, I probably signed up for it. I was curious and motivated, but also figuring it out as I went, like most high schoolers.\u003c/p\u003e\u003cp\u003eWhat really mattered to me was finding purpose in what I did. I didn’t just join clubs to fill a résumé—I wanted to connect with people, try new things, and explore what I cared about. That’s what led me to leadership roles, service work, and eventually to discovering my love for law and international relations.\u003c/p\u003e\u003cp\u003eAt the same time, I had to learn how to balance a lot, manage stress, and sometimes admit when I needed a break (or help). I didn’t always get it right, but I grew a lot by navigating those ups and downs. Looking back, I think I was someone who worked hard, cared deeply, and wanted to make a difference—even if I didn’t always know how yet.\u003c/p\u003e\u003cp\u003eThat’s why I love mentoring students now—I know how much it helps to have someone who’s been through it, who gets the pressure and the questions, and who can be there not just for the academics, but for the real-life stuff in between.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"78590cc7-c464-4804-a107-3a884bbde953\"}":{"__typename":"DeepDives","uuid":"78590cc7-c464-4804-a107-3a884bbde953","content":"\u003cp\u003eMy heritage shapes my teaching style in ways that are both intentional and instinctive. Growing up in a multicultural, multilingual household taught me to see learning as something deeply personal—never one-size-fits-all. I approach every student with curiosity and cultural awareness, knowing that the way we understand and express ourselves is often tied to where we come from.\u003c/p\u003e\u003cp\u003eI’m especially attuned to students who are navigating multiple identities or learning in a language that isn't their first. I’ve been there—I know what it feels like to translate not just words, but thoughts, between worlds. Because of that, I focus on building confidence, not just competence. I strive to create a space where students feel safe making mistakes, asking big questions, and connecting their background to what they’re learning. I also believe that identity shapes how we connect to what we learn. Whether I’m helping a student write an essay or explore global issues, I try to tie lessons back to their lived experience—because learning feels more meaningful when it’s personal. My background has shown me the power of diverse voices, and I want my students to feel proud of who they are and where they come from, just as I’ve learned to be.\u003c/p\u003e\u003cp\u003eUltimately, I see mentorship as an exchange. I bring my own lived experience, but I’m also here to learn from my students—their stories, interests, and perspectives. That mutual respect, I think, is where the most meaningful growth happens.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"ce1d4dc3-c93c-433a-b491-2e7e462e17c5\"}":{"__typename":"School","uuid":"ce1d4dc3-c93c-433a-b491-2e7e462e17c5","name":"Mater Academy Charter Middle/High School","city":"Hialeah Gardens","type":"HIGH","state":"Florida","country":"United States","zip":"33016"},"Education:{\"uuid\":\"8d4820b5-3efa-4632-af52-538f13c2f0d8\"}":{"__typename":"Education","uuid":"8d4820b5-3efa-4632-af52-538f13c2f0d8","school":{"__ref":"School:{\"uuid\":\"ce1d4dc3-c93c-433a-b491-2e7e462e17c5\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"f4976565-1faa-4e2d-977d-9db6b6f5d542\"}":{"__typename":"Education","uuid":"f4976565-1faa-4e2d-977d-9db6b6f5d542","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"International Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"c4ae5050-ced5-4f37-9008-9401e545dafa\"}":{"__typename":"MentorPublicProfile","uuid":"c4ae5050-ced5-4f37-9008-9401e545dafa","displayName":"Leah S.","slug":"leah-silva","biography":"\u003cp\u003eHi! I’m Leah, a rising junior at the University of Pennsylvania studying International Relations on a pre-law track. I was born in Havana, raised in Spain, and now call both Miami and Philadelphia home. Growing up between cultures, I’ve always been fascinated by the way language connects us—and I’ve made it a personal mission to learn as many as I can! I’m currently trilingual and always on the hunt for my next linguistic adventure.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion for language is closely tied to my love for storytelling and history. If I’m not watching a highly fictionalized historical drama, you’ll probably find me nose-deep in a classic novel—Tolstoy’s \u003cem\u003eWar and Peace\u003c/em\u003e is my current read (yes, it’s as long as they say!). \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’ve been a dancer for 14 years. Dance taught me discipline, resilience, and the power of self-expression—lessons I carry into every other part of my life. Whether I’m working on a new ballet sequence or prepping for a law internship, I show up with energy, curiosity, and a deep respect for the process of growth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've worked at tutoring centers, interned at law and venture capital firms, and explored everything from business to philosophy along the way. My dream? To become a mergers \u0026amp; acquisitions lawyer in New York City, helping shape the companies of the future.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is to be the guide I once needed: someone who listens, challenges, and inspires. I’ve been lucky to have mentors who believed in me before I believed in myself—and I want to pay that forward. Whether we’re diving into essay writing, exploring current events, practicing a new language, or figuring out what makes \u003cem\u003eyou\u003c/em\u003e tick, I’ll bring thoughtfulness, enthusiasm, and tailored support to each session.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI connect especially well with students who are curious, ambitious, and maybe a little unsure of where to start. If you’re passionate about something (or want to figure out what that “something” is), I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c25b0e89-f37b-4bf2-b03d-6978b4e8f240\"}"},{"__ref":"DeepDives:{\"uuid\":\"0ed141bc-4dd9-4149-a4f7-9c5f9d592514\"}"},{"__ref":"DeepDives:{\"uuid\":\"78590cc7-c464-4804-a107-3a884bbde953\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/242a8867-ef78-468e-9c07-d19fcba5a018/-/preview/-/format/jpg/","https://ucarecdn.com/2f2417a2-c27a-46a2-a1a3-a3da62c96623/-/preview/-/format/jpg/","https://ucarecdn.com/ffbd4269-5c29-44f5-a808-9abc1c5e8286/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8d4820b5-3efa-4632-af52-538f13c2f0d8\"}"},{"__ref":"Education:{\"uuid\":\"f4976565-1faa-4e2d-977d-9db6b6f5d542\"}"}],"hiredAt":"2025-04-15T13:01:36.099Z","topics":["K-5 Grade Math","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","History"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"leah-silva\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c4ae5050-ced5-4f37-9008-9401e545dafa\"}"}}},"_sentryTraceData":"e892fbec6a8142fc9999918bd801bd52-ad59b425ff9f88d7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e892fbec6a8142fc9999918bd801bd52,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"leah-silva"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
