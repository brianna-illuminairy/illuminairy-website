xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"b129115d-e5e1-477b-99f5-5ceb9cdf79e2\"}":{"__typename":"DeepDives","uuid":"b129115d-e5e1-477b-99f5-5ceb9cdf79e2","content":"\u003cp\u003eMentorship is not just a choice; it's a calling, a responsibility, and an investment in our shared future. Paying it forward through mentorship is about passing on knowledge, sharing experiences, and inspiring the next generation. When we mentor, we don't just shape individual lives; we influence the course of our communities and our nation. I've seen the transformative impact of mentorship in countless lives, and I know that our future depends on nurturing and empowering the leaders of tomorrow. By being a mentor, we can break down barriers, level the playing field, and ensure that everyone has the chance to reach their full potential. It's a way to give back, pay it forward, and create a brighter, more inclusive, and more just world. So, why mentorship? Because it's not just about what I could be doing; it's about what we should be doing to build a better tomorrow for all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}":{"__typename":"School","uuid":"375c6521-abfd-4666-859e-1190f187c648","name":"Collegiate School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10069"},"Education:{\"uuid\":\"2c1bd4ef-8313-4efd-b8db-94b1ec21dd1f\"}":{"__typename":"Education","uuid":"2c1bd4ef-8313-4efd-b8db-94b1ec21dd1f","school":{"__ref":"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}"},"startYear":"2013","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"c55572cd-1de6-41bf-8ac6-ce0eb08fb922\"}":{"__typename":"Education","uuid":"c55572cd-1de6-41bf-8ac6-ce0eb08fb922","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"b98fbf81-bd7b-4c1e-9ca5-c8041aa3f9ed\"}":{"__typename":"MentorPublicProfile","uuid":"b98fbf81-bd7b-4c1e-9ca5-c8041aa3f9ed","displayName":"Zachary B.","slug":"zachary-bernagene","biography":"\u003cp\u003eZach graduated from Washington University in 2022 with a dual major in English and African and African-American Studies. He grew up in Brooklyn, New York, attending The Collegiate School for Boys after matriculating from the prestigious Prep for Prep program. Zach loves being creative, curating events and creating experiences in his time with The New York Lab. His creative endeavors eventually led him to sign a record deal with UnitedMasters. In his teenage years, Zach discovered his love for aiding others through his experience as the IGSS Services, which allowed him to help immigrants find their citizenship. Through that experience, he was able to strengthen his Haitian Creole and French as well as learn Spanish. Now, he is currently working for the Anna V. Waters Scholarship where he does Social Media and Journalism. Personally, he enjoys playing soccer where he says “it’s the only place that he is constantly switching languages.”\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eHe is joining Curious Cardinals to continue his work of being a mentor. In his personal life, Zach has tutored his younger family members in a plethora of subjects, focusing on English, Writing, Math and History. This also coincides with his experience in Read4Kids, where he spent time reading and speaking about different books. Personally, his favorite book is “To Kill A Mockingbird” as it is one of the few books that has a flawless character. Still an avid reader today, he has transitioned to re-reading classic books in the Spanish Language.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b129115d-e5e1-477b-99f5-5ceb9cdf79e2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7716ec3e-1e46-4f07-9d65-f07800e299f5/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2c1bd4ef-8313-4efd-b8db-94b1ec21dd1f\"}"},{"__ref":"Education:{\"uuid\":\"c55572cd-1de6-41bf-8ac6-ce0eb08fb922\"}"}],"hiredAt":"2023-10-21T11:01:22.517Z","topics":["Music","History Project","French","Latin","Writing","History"],"communityBadges":["https://ucarecdn.com/09da5bb5-3efa-4fae-89ff-19db3c27efba/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"zachary-bernagene\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b98fbf81-bd7b-4c1e-9ca5-c8041aa3f9ed\"}"}}},"_sentryTraceData":"3d010f83cef94aea92749f4040aecde5-9033488975ac8ff5-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3d010f83cef94aea92749f4040aecde5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/m
