xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c25350d6-dbdf-413f-8e33-2f57df1db12c\"}":{"__typename":"Favorites","uuid":"c25350d6-dbdf-413f-8e33-2f57df1db12c","photoUrl":"https://ucarecdn.com/a4edc1b6-02a5-4991-94b7-6c9f56b3add2/","title":"Normal People","type":"BOOK"},"Favorites:{\"uuid\":\"4cfa9c6c-1c52-4cc3-8225-a161d8b3cf9f\"}":{"__typename":"Favorites","uuid":"4cfa9c6c-1c52-4cc3-8225-a161d8b3cf9f","photoUrl":"https://ucarecdn.com/f4eed0f8-f19b-4a1e-bc91-5011aee44fef/","title":"Everywhere, Fleetwood Mac","type":"SONG"},"Favorites:{\"uuid\":\"8eac5834-e5ae-4abe-934b-4c00f8e710d8\"}":{"__typename":"Favorites","uuid":"8eac5834-e5ae-4abe-934b-4c00f8e710d8","photoUrl":"https://ucarecdn.com/a582dfe2-a937-4012-ac80-278a383a065a/","title":"New York City","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3875d721-2081-41a3-95cd-f28df379ef03\"}":{"__typename":"DeepDives","uuid":"3875d721-2081-41a3-95cd-f28df379ef03","content":"\u003cp\u003eIf I could give my middle or high school self advice, I would remind myself to stop being so hard on myself. I’ve always been diligent and goal-oriented, but I wish I had realized sooner that I didn’t need to have everything figured out right away. It’s okay to explore different interests, change my mind, and take time to figure out what I truly enjoy. I spent so much time overanalyzing situations, stressing about school, and fixating on things that, in hindsight, weren’t as important as they felt in the moment. I would tell myself to take a step back and enjoy the present more—whether that meant making more time for fun, appreciating little moments with friends, or simply letting go of unnecessary stress.\u003c/p\u003e\u003cp\u003eI’d also tell myself that confidence comes from within. It’s easy to get caught up in worrying about how others perceive you, but at the end of the day, what really matters is how you feel about yourself. The people who truly matter will appreciate you for who you are, and you don’t need external validation to feel secure. Along with that, I’d emphasize the importance of prioritizing mental and physical health. Sleep, nutrition, and balance are just as important as academic success. Pushing myself too hard doesn’t make me more accomplished—it just makes me exhausted.\u003c/p\u003e\u003cp\u003eMost importantly, I would remind myself that the best is yet to come. The things I stressed about in high school feel so small now, and I wish I had trusted the process more instead of constantly seeking reassurance. Life unfolds in ways we can’t always predict, and sometimes the unexpected turns lead to the best experiences. Everything works out the way it’s meant to, even if it doesn’t happen exactly as planned.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c52b44db-7261-4986-ae61-beac1f40eba1\"}":{"__typename":"DeepDives","uuid":"c52b44db-7261-4986-ae61-beac1f40eba1","content":"\u003cp\u003eMentorship has played a huge role in my life, both as a mentee and as a mentor. Looking back, I can think of so many moments where someone’s guidance gave me the confidence to take a chance on myself—whether it was applying for an opportunity I thought was out of reach, navigating a difficult decision, or simply realizing that I wasn’t alone in what I was going through. The advice and encouragement I’ve received from mentors have shaped not only my personal and professional growth but also the way I see myself. Knowing that someone believed in me, even when I doubted myself, made all the difference.\u003c/p\u003e\u003cp\u003eThat’s why being a mentor has been so meaningful to me. I love being that person for someone else—helping them feel capable, supported, and understood. Sometimes, it’s about offering advice or answering questions, but other times, it’s just about listening and reminding them that their feelings and experiences are valid. Seeing my mentee grow, become more confident, and push themselves because they feel supported is one of the most rewarding experiences I’ve had.\u003c/p\u003e\u003cp\u003eTo me, mentorship isn’t just about guidance—it’s about connection. It’s about creating a space where someone feels seen and encouraged to step into their full potential. No one succeeds alone, and having people who truly want to see you thrive makes all the difference. That’s why mentorship matters to me, and why I hope to continue paying it forward in every way I can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"319958d4-76e6-484d-b7b6-bfcfbee570ef\"}":{"__typename":"DeepDives","uuid":"319958d4-76e6-484d-b7b6-bfcfbee570ef","content":"\u003cp\u003eOne of the passion projects I’m most proud of is my capstone research on investment managers and the use of technology/robot platforms in their work. It’s something I actively sought out, reaching out to multiple professors until I found an opportunity that aligned with my interests. What made this project so exciting for me wasn’t just the subject matter—it was the process of taking initiative, advocating for myself, and securing a meaningful role in research that I truly cared about.\u003c/p\u003e\u003cp\u003eIn this capstone, I get to work closely with Professor Megan Lawrence, assisting with research by ensuring students complete their work, summarizing responses into Excel sheets, and conducting literature reviews. The project combines my interest in business, finance, and technology with hands-on research experience, and I love that I’m contributing to something impactful.\u003c/p\u003e\u003cp\u003eBeyond just the research, this project reinforced my belief in persistence and taking ownership of my opportunities. It reminded me that if you want something, you have to go after it—even if that means sending follow-up emails, facing rejections, or stepping outside your comfort zone. I’m excited to see where this research leads and how I can apply the skills I’ve gained to my future career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d6bd2a46-a202-4738-91ec-df5079872fef\"}":{"__typename":"DeepDives","uuid":"d6bd2a46-a202-4738-91ec-df5079872fef","content":"\u003cp\u003eIn my spare time, I love spending time with friends, exploring new coffee shops, and staying active. Whether it’s trying a new restaurant, going on a walk, or just having a long conversation over coffee, I really value quality time with the people in my life. I also enjoy reading, especially psychological thrillers or books that make me think—The Silent Patient and Normal People are some of my favorites.\u003c/p\u003e\u003cp\u003eAnother big part of my free time is mentorship. I volunteer at a local Nashville school, and our weekly meetings are always a highlight of my week. It’s so rewarding to watch my mentees grow and be part of their journey, and I love that we’ve built such strong bonds over the years.\u003c/p\u003e\u003cp\u003eI also like to stay active, whether it’s going on long walks, working out, or just finding little ways to move throughout the day. It helps me clear my mind and feel my best. When I want to relax, I’m usually watching a good TV show, listening to a podcast, or planning my next trip—I love traveling and visiting new places when I can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65\"}":{"__typename":"School","uuid":"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65","name":"Tenafly High School","city":"Tenafly","type":"HIGH","state":"New Jersey","country":"United States","zip":"07670"},"Education:{\"uuid\":\"1baab06e-21b9-45e2-ac1d-6625dec8052d\"}":{"__typename":"Education","uuid":"1baab06e-21b9-45e2-ac1d-6625dec8052d","school":{"__ref":"School:{\"uuid\":\"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"67db02f6-2a07-475b-bc68-3d791b856780\"}":{"__typename":"Education","uuid":"67db02f6-2a07-475b-bc68-3d791b856780","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Human and Organizational Development","degree":null},"MentorPublicProfile:{\"uuid\":\"6c1862d3-a2aa-4b8e-875e-c0c6b4357901\"}":{"__typename":"MentorPublicProfile","uuid":"6c1862d3-a2aa-4b8e-875e-c0c6b4357901","displayName":"Lauren S.","slug":"lauren-smilen","biography":"\u003cp\u003eHi! I’m Lauren, a senior at Vanderbilt University majoring in Human and Organizational Development with a minor in Business. My studies focus on how people and organizations operate effectively, with an emphasis on leadership, communication, and problem-solving. I am currently assisting with academic research on how investment managers use technology in their work, conducting literature reviews and data analysis.\u003c/p\u003e\u003cp\u003eBeyond academics, I am passionate about mentorship and education. For over a year, I have volunteered as a mentor, working one-on-one with an elementary school student to support her academic and personal growth. Additionally, I have experience tutoring students in various subjects, helping them develop strong study habits and build confidence in their abilities. My leadership experience also extends to Vanderbilt Women in Business and consulting projects through Rem and Company, where I worked collaboratively to provide strategic recommendations to real-world clients.\u003c/p\u003e\u003cp\u003eAs a mentor, I love making learning engaging and accessible by tailoring my approach to each student’s needs. I believe that with the right support and encouragement, every student can find success in their academic journey, and I’m excited to help them reach their goals!\u003c/p\u003e","teachingVideoPlaybackId":"bSOWpqfHiGYg7PhwwnpxJurjL9iQZBIJDMRcfA16K3k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c25350d6-dbdf-413f-8e33-2f57df1db12c\"}"},{"__ref":"Favorites:{\"uuid\":\"4cfa9c6c-1c52-4cc3-8225-a161d8b3cf9f\"}"},{"__ref":"Favorites:{\"uuid\":\"8eac5834-e5ae-4abe-934b-4c00f8e710d8\"}"}],"causesSupported":[],"major":"Human and Organizational Development","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3875d721-2081-41a3-95cd-f28df379ef03\"}"},{"__ref":"DeepDives:{\"uuid\":\"c52b44db-7261-4986-ae61-beac1f40eba1\"}"},{"__ref":"DeepDives:{\"uuid\":\"319958d4-76e6-484d-b7b6-bfcfbee570ef\"}"},{"__ref":
