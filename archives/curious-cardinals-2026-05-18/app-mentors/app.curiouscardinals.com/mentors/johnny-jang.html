building character, and I hope to provide the same guidance that I received, helping others uncover their strengths and achieve their goals. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"f750827c-b888-478c-b30a-fbd5446035da\"}":{"__typename":"DeepDives","uuid":"f750827c-b888-478c-b30a-fbd5446035da","content":"\u003cp\u003eI once dreamt that I was Spiderman, but everybody knew who I was. Instead of being celebrated as a hero, I became the world’s most overbooked handyman. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"770faabd-0f0a-4408-bbcc-60aca5bf0860\"}":{"__typename":"School","uuid":"770faabd-0f0a-4408-bbcc-60aca5bf0860","name":"Northwood High School","city":"Irvine","type":"HIGH","state":"California","country":"United States","zip":"92620"},"Education:{\"uuid\":\"1d1de593-ecd7-4704-b244-bc6f7d93d9ee\"}":{"__typename":"Education","uuid":"1d1de593-ecd7-4704-b244-bc6f7d93d9ee","school":{"__ref":"School:{\"uuid\":\"770faabd-0f0a-4408-bbcc-60aca5bf0860\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"053e39d7-fa70-4ea1-8324-3f548be4becf\"}":{"__typename":"Education","uuid":"053e39d7-fa70-4ea1-8324-3f548be4becf","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"e824b214-ac5a-4306-a921-951cad20b950\"}":{"__typename":"MentorPublicProfile","uuid":"e824b214-ac5a-4306-a921-951cad20b950","displayName":"Johnny J.","slug":"johnny-jang","biography":"\u003cp\u003eHello! My name is Johnny Jang, and I’m currently a second-year Biology student at UCLA. I was born in Seoul, South Korea, and moved to California when I was ten, enriching my perspective on differing cultural experiences. I'm passionate about the outdoors and love exploring nature, whether it's hiking through mountain trails or sledding down sand dunes. My love for animals, especially dogs, inspires my dream of becoming a veterinarian one day. Along with my outdoor adventures and love for animals, I enjoy staying active by playing basketball, lifting weights, and unwinding with video games.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic journey reflects my passion for understanding life sciences, with coursework spanning Cell and Molecular Biology, Genetics, and Physiology.\u003c/p\u003e\u003cp\u003eMy experiences extend beyond the classroom. I’ve had the privilege of volunteering over 250 hours at Alton Main Animal Hospital, assisting in preoperative procedures and gaining firsthand insights into veterinary care. I’ve also been a research assistant at Chapman University, studying the fascinating properties of hagfish slime, and currently, I contribute to coyote behavioral research at CSULB, analyzing their interactions with skunk coat patterns.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond science, I enjoy engaging with my community. At America on Track, a nonprofit organization focused on creating brighter futures for underprivileged students, I mentored students from low-income neighborhoods, teaching violin and hosting STEM-focused labs. \u003cbr\u003e\u003cbr\u003eI am excited about the opportunity to share my passion and experiences through Curious Cardinals. As someone who has been deeply inspired by the guidance and resilience of those around me, I understand the tremendous transformative power of support and encouragement. I would love to create an engaging and hands-on learning environment that encourages curiousity and furthers students' education with real-world knowledge and skills.  \u003cbr\u003e\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"PSs2gTdFJSga8dsXMNkZsrKMsb1RJ6AOvYcujei1YLc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"05de21df-1d3d-43ce-af52-62a5385b6a0b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5d484664-1dc4-4c9b-935c-43a281f430c8\"}"},{"__ref":"DeepDives:{\"uuid\":\"3e9ea93b-dd4d-40d0-b05d-bad5939e9995\"}"},{"__ref":"DeepDives:{\"uuid\":\"f750827c-b888-478c-b30a-fbd5446035da\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f8fa5564-d60b-462b-b958-b1642e5292fc/-/preview/-/format/jpg/","https://ucarecdn.com/c8985fe5-9c23-4837-8fb4-94180177c372/-/preview/-/format/jpg/","https://ucarecdn.com/9a6d1c42-c2a9-4098-b03b-6d47ebb7463e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1d1de593-ecd7-4704-b244-bc6f7d93d9ee\"}"},{"__ref":"Education:{\"uuid\":\"053e39d7-fa70-4ea1-8324-3f548be4becf\"}"}],"hiredAt":"2024-12-11T07:56:49.822Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Writing","College Essay Writing","Academic Coaching","Reading","History","Creative Writing","History Project","Medicine / Health","STEM Project","Sustainability","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"johnny-jang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e824b214-ac5a-4306-a921-951cad20b950\"}"}}},"_sentryTraceData":"e69c
