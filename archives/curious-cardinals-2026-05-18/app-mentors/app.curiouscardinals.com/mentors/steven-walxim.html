xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1ebb6620-2a4e-4453-ae98-0d3fa3f8c2e7\"}":{"__typename":"DeepDives","uuid":"1ebb6620-2a4e-4453-ae98-0d3fa3f8c2e7","content":"\u003cp\u003eMentorship is a two‑way street: every time I guide a younger peer I also discover fresh perspectives that reshape my own thinking. While serving as a project mentor for Wharton’s Leadership in the Business World program, I was struck by how effortless it was for high‑school entrepreneurs to question assumptions most adults treat as fixed. Their curiosity keeps my own research agile, and their trust reminds me of the mentors who once opened doors for me. Passing that energy forward—and absorbing it in return—makes mentorship an indispensable part of my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ed345ccf-c850-4773-a679-fb21a4f7dcb2\"}":{"__typename":"DeepDives","uuid":"ed345ccf-c850-4773-a679-fb21a4f7dcb2","content":"\u003cp\u003eI want to bring conversational‑AI devices out of the lab and into homes and clinics where they can meaningfully ease loneliness and detect early signs of neuro‑degenerative disease. My long‑term goal is to see an affordable, privacy‑preserving companion device become as common as a blood‑pressure cuff—quietly improving millions of lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"c732a45d-a05e-45b6-a682-14ba4a8b14fa\"}":{"__typename":"DeepDives","uuid":"c732a45d-a05e-45b6-a682-14ba4a8b14fa","content":"\u003cp\u003eI’m driven by the moment when an idea leaves a whiteboard and enters the real world, changing someone’s daily routine for the better. Building a prototype that helps an elderly user feel heard, or watching a student’s concept evolve into a launch‑ready venture, fuels me far more than accolades ever could.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"74bdb8e5-372e-4279-b933-0ff4b561774e\"}":{"__typename":"DeepDives","uuid":"74bdb8e5-372e-4279-b933-0ff4b561774e","content":"\u003cp\u003eResearch and entrepreneurship give me the tools to innovate, but mentorship ensures those tools stay human‑centered. Guiding students forces me to translate complex ideas into plain language, spot unseen obstacles, and remain accountable to the people my work is meant to serve. It is the feedback loop that keeps my ambition grounded in empathy—and that, ultimately, makes every other pursuit more impactful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"55994b60-48a9-4132-bf86-11332c5e7d46\"}":{"__typename":"School","uuid":"55994b60-48a9-4132-bf86-11332c5e7d46","name":"Tabor Academy","city":"Marion","type":"HIGH","state":"Massachusetts","country":"美国","zip":"02738"},"Education:{\"uuid\":\"fe435c9e-107d-49d3-bf70-d3e361c5b7c7\"}":{"__typename":"Education","uuid":"fe435c9e-107d-49d3-bf70-d3e361c5b7c7","school":{"__ref":"School:{\"uuid\":\"55994b60-48a9-4132-bf86-11332c5e7d46\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"f96f8318-b3b9-4040-b8fe-2e00745f3209\"}":{"__typename":"Education","uuid":"f96f8318-b3b9-4040-b8fe-2e00745f3209","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Computer Science with a Minor in Consumer Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"0033aa8b-0656-490f-aa41-786583077c8c\"}":{"__typename":"MentorPublicProfile","uuid":"0033aa8b-0656-490f-aa41-786583077c8c","displayName":"Steven W.","slug":"steven-walxim","biography":"\u003cp\u003eI’m thrilled to be starting my PhD at Peking University this September, building on a journey that began at Tabor Academy and the University of Pennsylvania. My academic path has always been interdisciplinary—stretching from mathematics and engineering to consumer psychology and entrepreneurship—and it naturally led me to co‑found ventures that range from AI‑driven healthcare devices to innovative consumer products. Those startups taught me the value of resilience, creative problem‑solving, and, above all, teamwork.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship is where I channel that experience. At Wharton’s \u003cstrong\u003eLeadership in the Business World (LBW)\u003c/strong\u003e program, I served as a teaching assistant, guiding high‑school entrepreneurs as they turned passion‑project ideas into market‑ready ventures. I’ve helped students craft pitch decks, refine product concepts, and strategize growth, and I’ve watched many of them earn admission to Stanford, UChicago, Wharton, and Yale. Whether I’m untangling a recursive Python function, walking someone through the elegance of a calculus proof, or challenging them to pitch a venture that solves a real‑world problem, I thrive on helping future leaders use \u003cstrong\u003ecode, math, and entrepreneurial thinking\u003c/strong\u003e to create meaningful change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom and lab, sport and music keep me balanced. I have wrestled since middle school and rowed crew throughout high school—experiences that ingrained discipline and the ability to trust a team when every stroke or takedown counts. As a \u003cstrong\u003etenor in the All‑State Honor Choir\u003c/strong\u003e, I discovered how collective harmony emerges only when each voice listens as intently as it projects—a lesson that transfers seamlessly to collaborative research and startup culture.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePhotography is my creative outlet; capturing candid moments on city streets sharpens my attention to subtle patterns—skills that translate surprisingly well to machine‑learning research. These passions remind me that innovation flourishes when technical rigor meets human creativity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I embark on doctoral research in conversational AI and human‑centered computing, I’m convinced that breakthroughs happen when diverse perspectives converge—be it in a startup garage, a choir rehearsal, or a rowing shell slicing through water at dawn. As a mentor, my aim is not merely to pass along knowledge but to ignite curiosity, foster resilience, and help students transform a spark of interest into something extraordinary.\u003c/p\u003e","teachingVideoPlaybackId":"SQVRbp00bWIK5wGgTrRVXE5D7INU02bp02wgML5Xyl7029w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science with a Minor in Consumer Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1ebb6620-2a4e-4453-ae98-0d3fa3f8c2e7\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed345ccf-c850-4773-a679-fb21a4f7dcb2\"}"},{"__ref":"DeepDives:{\"uuid\":\"c732a45d-a05e-45b6-a682-14ba4a8b14fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"74bdb8e5-372e-4279-b933-0ff4b561774e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/db325abf-e5bd-4d8d-9cbc-76882c2e9911/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"fe435c9e-107d-49d3-bf70-d3e361c5b7c7\"}"},{"__ref":"Education:{\"uuid\":\"f96f8318-b3b9-4040-b8fe-2e00745f3209\"}"}],"hiredAt":"2025-04-15T13:28:42.130Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Physics","Writing","Mandarin Chinese","Reading","History","Economics","Computer Science","College Essay Writing","Academic Coaching","Executive Function","Video / Photography","History Project","Film / Theater","Creative Writing","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Robotics / Electronics / CAD","STEM Project","Machine Learning / AI","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"steven-walxim\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0033aa8b-0656-490f-aa41-786583077c8c\"}"}}},"_sentryTraceData":"b6430699e55949358ea1db9d7535808e-a05facaaecdc0695-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b6430699e55949358ea1db9d7535808e,s
