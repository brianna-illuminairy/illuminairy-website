\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c5eef6e2-c37f-4ba0-b868-1bcfa4e1945a\"}":{"__typename":"DeepDives","uuid":"c5eef6e2-c37f-4ba0-b868-1bcfa4e1945a","content":"\u003cp\u003eI want to be a professional Wordle Solver. My secret talent is being able to solve any Wordle in under 30 seconds (unless it's an INSANELY unheard of word)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"7e26d30c-418e-4087-b35d-418a97b2fbc7\"}":{"__typename":"DeepDives","uuid":"7e26d30c-418e-4087-b35d-418a97b2fbc7","content":"\u003cp\u003eI'm extremely proud of getting into college on a full scholarship! I love mentoring and teaching underclassmen how to finesse scholarships and professional opportunities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"97b00840-ce25-448b-96c5-2ffee7e0dd6c\"}":{"__typename":"DeepDives","uuid":"97b00840-ce25-448b-96c5-2ffee7e0dd6c","content":"\u003cp\u003eMy older sister teaches me everything, from fractions to overall being a better person. I'm the youngest child, so I've always yearned to be a mentor to others as well!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"51beb6df-c53c-4446-a69f-7e0b3eeba424\"}":{"__typename":"School","uuid":"51beb6df-c53c-4446-a69f-7e0b3eeba424","name":"Alhambra High School","city":"Alhambra","type":"HIGH","state":"California","country":"United States","zip":"91801"},"Education:{\"uuid\":\"5b88843f-2515-4177-85b9-1b51e43ec051\"}":{"__typename":"Education","uuid":"5b88843f-2515-4177-85b9-1b51e43ec051","school":{"__ref":"School:{\"uuid\":\"51beb6df-c53c-4446-a69f-7e0b3eeba424\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4b3ca3bf-b9ff-4406-a211-4b16723ab750\"}":{"__typename":"Education","uuid":"4b3ca3bf-b9ff-4406-a211-4b16723ab750","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Chemical Engineering and Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"407f3c1a-e373-427d-9d8e-58b6cdb07810\"}":{"__typename":"MentorPublicProfile","uuid":"407f3c1a-e373-427d-9d8e-58b6cdb07810","displayName":"James H.","slug":"jameshan-gt","biography":"\u003cp\u003eHi there! I’m James Han. I’m originally from Alhambra, California, which is a small suburb right outside of East Los Angeles. My hometown has the best (indisputably) Chinese, Vietnamese, and Mexican food, so if you’re ever nearby ask me for food or boba recommendations! I love talking about food!!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m currently a sophomore at Stanford studying chemical engineering and mathematics, but my passions cover a wide breadth of topics. I’ve previously conducted research in ocean capture and sustainability, so I’m super passionate about tackling climate change (both on a scientific and policy level) and any other way that we can preserve the environment!! I’m conducting research on pharmaceuticals as well, so I am also familiar with the biotech side of chemical engineering as well! Lastly, I have also just started some computational research in chemical engineering. In case you can not tell, I love talking about how wide range chemical engineering is: I can work in sustainability, healthcare, computational work, materials, and so much more!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAside from academics, I’m super involved on campus. One club that I am in is Cardinal Free Clinics, where I help volunteer at a clinic and provide quality free healthcare to local Bay Area residents. I’m also involved in the High School Support Initiative, where I tutor and mentor underserved high school students in the local area. Lastly, I work at Stanford’s FLIP (first-generation and/or low-income partnership. I’m ultimately super passionate about dissolving barriers wherever I go, whether that be in healthcare or education.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis is why I’m so excited to join Curious Cardinals! I want to join you guys on your journey and help you uncover your passions and dive deep into what you love! That feeling when you are learning and there is a rush in your brain, truly nothing can beat that. I hope I can help you find what makes you feel (academically) alive!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school and everything, I love drinking boba, playing video games (Valorant and brawl stars!), and trying new things! I just started trying out rock climbing and volleyball, but I’m super down to hear about your hobbies as well! Please reach out and I’m excited to meet you all!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"aVv01nJP4w6vFh6X0001LUnHYX01sISQO82S02026EohXkmLc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI earned the Gates Scholarship, allowing me to attend university on a full ride!!! (with extra money to spend on boba too)\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"21163f60-6fd6-4a0a-b1ee-ff172e103936\"}"},{"__ref":"Favorites:{\"uuid\":\"876c7c75-a245-42a8-ae30-665bdfc6d7cc\"}"},{"__ref":"Favorites:{\"uuid\":\"8b4986fc-7cda-48e4-a756-c06be3ffb72e\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"509992c2-11cf-4dd4-abce-892b8bdba8de\"}"}],"major":"Chemical Engineering and Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"de2c523e-2578-4750-a7a1-8ef24f2203d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"c5eef6e2-c37f-4ba0-b868-1bcfa4e1945a\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e26d30c-418e-4087-b35d-418a97b2fbc7\"}"},{"__ref":"DeepDives:{\"uuid\":\"97b00840-ce25-448b-96c5-2ffee7e0dd6c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/308a078a-ae38-495b-9c99-5a955e9cf407/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5b88843f-2515-4177-85b9-1b51e43ec051\"}"},{"__ref":"Education:{\"uuid\":\"4b3ca3bf-b9ff-4406-a211-4b16723ab750\"}"}],"hiredAt":"2025-01-04T22:48:47.369Z","topics":["K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Chemistry","Physics","Algebra I","Algebra II"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jameshan-gt\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"407f3c1a-e373-427d-9d8e-58b6cdb07810\"}"}}},"_sentryTraceData":"8006d5fdef17489cb02f4f7d395ceb03-ba7ed71e9d46d75a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5
