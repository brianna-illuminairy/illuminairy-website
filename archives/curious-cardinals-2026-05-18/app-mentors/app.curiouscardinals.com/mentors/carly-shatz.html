xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8c5d3e77-8db5-451e-88ae-f82e2c66727c\"}":{"__typename":"Favorites","uuid":"8c5d3e77-8db5-451e-88ae-f82e2c66727c","photoUrl":"https://ucarecdn.com/65185b0b-d175-4d85-a2ed-1af6a3a5365d/","title":"New York Rangers ","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"f9da44cc-3ef4-4757-be6f-68d703d908b6\"}":{"__typename":"Favorites","uuid":"f9da44cc-3ef4-4757-be6f-68d703d908b6","photoUrl":"https://ucarecdn.com/7dadbf1e-d9f0-460c-a10a-45663b9b8a40/","title":"Soccer","type":"SPORT"},"Favorites:{\"uuid\":\"9f91418f-f3f7-46fd-ac7a-5db9a72a85a6\"}":{"__typename":"Favorites","uuid":"9f91418f-f3f7-46fd-ac7a-5db9a72a85a6","photoUrl":"https://ucarecdn.com/bbadd629-40cc-49bd-bc6c-f7bac17b75f3/","title":"ROLE MODEL","type":"ARTIST"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"7d03b7ac-f67a-493b-8127-fad6c46e8c09\"}":{"__typename":"DeepDives","uuid":"7d03b7ac-f67a-493b-8127-fad6c46e8c09","content":"\u003cp\u003eSomething I am extremely proud of is founding the NYC Women in Business Coalition alongside 11 other girls from public high schools across New York City. Together, we built an incredible community focused on empowering young women interested in business and leadership. We organized impactful events featuring impressive speakers and leaders, creating opportunities for learning, networking, and inspiration.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe experience taught me so much about collaboration, leadership, and the power of community. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI realized this is something very fulfilling and meaningful to me, so I’ve continued doing similar work in college. I am now an active member of Duke Business Oriented Women and Girls Who Invest which have similar missions to the NYC Coalition. It’s been amazing to see how these efforts can bring people together and make a meaningful impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"b191eb62-84f3-4e0b-b6de-da3d4b8641e6\"}":{"__typename":"DeepDives","uuid":"b191eb62-84f3-4e0b-b6de-da3d4b8641e6","content":"\u003cp\u003eAs a middle school and high school student, I was driven and eager to succeed. I loved being involved and embraced every opportunity to participate, whether in academics, sports, or extracurriculars. At Beacon High School, I founded several clubs and was the captain of the Girls Varsity Soccer Team. These experiences taught me leadership and teamwork while letting me pursue my passions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, I was incredibly social and talkative. My enthusiasm for conversation occasionally got me into some trouble for chatting during class when I shouldn’t have, but that same energy helped me connect with others, bring people together, and contribute meaningfully to the school community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8fe18c51-eba6-4698-a92b-9f98d305705d\"}":{"__typename":"DeepDives","uuid":"8fe18c51-eba6-4698-a92b-9f98d305705d","content":"\u003cp\u003eIn high school, my summers were a perfect mix of fun and growth. Early on, I spent them at a 7-week sleep-away camp in the Berkshires with my friends, a tradition that lasted for eight amazing summers. Those days were filled with laughter, adventures, and unforgettable memories that I’ll treasure forever.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I got older, my summers took on a new focus. In the later years of high school, I started pursuing internships and jobs, which allowed me to explore different interests, gain valuable experience, and embrace responsibility. One of my favorite summer jobs was working at the sustainable clothing store Reformation, where I was able to combine my love for fashion with a commitment to sustainability. Those summers offered a great balance of personal growth and meaningful opportunities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"236da41e-69f7-432b-95f5-15455101d7b2\"}":{"__typename":"School","uuid":"236da41e-69f7-432b-95f5-15455101d7b2","name":"Beacon High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10036"},"Education:{\"uuid\":\"e3e60723-dd7d-4739-bcf2-377b2a6d70a6\"}":{"__typename":"Education","uuid":"e3e60723-dd7d-4739-bcf2-377b2a6d70a6","school":{"__ref":"School:{\"uuid\":\"236da41e-69f7-432b-95f5-15455101d7b2\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"130c7fed-a4ec-4871-bd8e-d7c8fae820b7\"}":{"__typename":"Education","uuid":"130c7fed-a4ec-4871-bd8e-d7c8fae820b7","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"B.S. Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"57f60841-51a6-4e80-b28b-45e0de97e387\"}":{"__typename":"MentorPublicProfile","uuid":"57f60841-51a6-4e80-b28b-45e0de97e387","displayName":"Carly S.","slug":"carly-shatz","biography":"\u003cp\u003eHi! I’m Carly, a Senior at Duke University majoring in Economics and pursuing a certificate in Innovation \u0026amp; Entrepreneurship. My passion for business and creativity has been a driving force throughout my life, from founding women-in-business clubs in high school to launching my own clothing brand. These early ventures ignited my entrepreneurial mindset and taught me invaluable lessons in leadership, problem-solving, and resilience. At Duke, I’ve had the opportunity to further explore these interests through my coursework and involvement in organizations like Duke Business Oriented Women and Girls Who Invest, which foster curiosity, innovation, and empowerment. I’ll be starting my career in Investment Banking upon graduation—a challenge and transformational opportunity I am really looking forward to.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was born and raised in New York City, attending public schools on the Upper West Side throughout my childhood. Growing up in such a fast-paced, diverse environment shaped my appreciation for culture, adaptability, perspective, and creative thinking. After graduation, I plan to return to NYC to live with friends and launch my career. This past fall, I had the incredible opportunity to study abroad in Madrid for the semester. Living in Spain was a life-changing experience—I immersed myself in a new culture, furthered my Spanish skills, broadened my worldview, and ate A LOT of amazing food! It fueled my love for travel and stepping outside of my comfort zone.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics and career aspirations, I’m passionate about staying active and being in nature. I grew up playing travel soccer and still enjoy kicking the ball around at Duke. Running is another passion of mine, and I hope to train for a half marathon before I graduate college. In my free time, I also love vintage shopping, cooking, listening to music, and drawing.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI thrive in environments surrounded by curious, driven individuals and find deep fulfillment in sharing my knowledge and experiences to inspire others. Joining the Curious Cardinals team is an exciting opportunity to mentor students, support their growth, and help them uncover their passions. Reflecting on my own journey, I remember several mentors who pushed me to explore new ideas and encouraged my passions both inside and outside the classroom. Their guidance had a lasting impact on me, and I’m eager to give back by offering the same inspiration and support to your children. I hope to empower your student to embrace their potential, approach challenges with confidence, and foster a lifelong curiosity for learning.\u003c/p\u003e","teachingVideoPlaybackId":"LndRUKew49w52t00PGAjE7fTQ52oWEOibKY5YTm95byE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8c5d3e77-8db5-451e-88ae-f82e2c66727c\"}"},{"__ref":"Favorites:{\"uuid\":\"f9da44cc-3ef4-4757-be6f-68d703d908b6\"}"},{"__ref":"Favorites:{\"uuid\":\"9f91418f-f3f7-46fd-ac7a-5db9a72a85a6\"}"}],"causesSupported":[],"major":"B.S. Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7d03b7ac-f67a-493b-8127-fad6c46e8c09\"}"},{"__ref":"DeepDives:{\"uuid\":\"b191eb62-84f3-4e0b-b6de-da3d4b8641e6\"}"},{"__ref":"DeepDives:{\"uuid\":\"8fe18c51-eba6-4698-a92b-9f98d305705d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6330dc5b-b9c1-44fc-9b17-9e3fa227ba8b/-/preview/-/format/jpg/","https://ucarecdn.com/6a0ac067-0b0e-4308-966a-553c3d78a8c7/-/preview/-/format/jpg/","https://ucarecdn.c
