em advice on the college application process, which is a very pivotal moment in every student's academic career. Alexis hopes to continue making an impact in his community as he inspires those around him to pursue their true passions.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0c22667f-bf58-416f-a2dc-67ac04b37c69\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/53dad698-02c9-490c-847a-0da845a8a4e8/-/crop/646x646/2,25/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d756307e-1bc3-4334-9b70-556445e68b82\"}"},{"__ref":"Education:{\"uuid\":\"e3c6419e-acb6-4246-997e-aab7ce90d45c\"}"}],"hiredAt":"2022-12-15T21:30:40.000Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Writing","French","Spanish","Executive Function","Academic Coaching","College Essay Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexis-valle\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9312b528-5bc6-4bb3-b000-33afc8ea37d4\"}"}}},"_sentryTraceData":"19c06bc0d48a4fc59e45439852615bd8-88014b379faf138d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=19c06bc0d48a4fc59e45439852615bd8,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alexis-valle"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nn
