xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"639d943a-2f5e-4a2e-8125-0b95c77dba61\"}":{"__typename":"Favorites","uuid":"639d943a-2f5e-4a2e-8125-0b95c77dba61","photoUrl":"https://ucarecdn.com/92c0e720-7a41-4ba0-baff-f96e284208aa/","title":"In Rainbows","type":"ALBUM"},"Favorites:{\"uuid\":\"1ab9b7f1-d499-4b60-b588-43cd9a4c7a9a\"}":{"__typename":"Favorites","uuid":"1ab9b7f1-d499-4b60-b588-43cd9a4c7a9a","photoUrl":"https://ucarecdn.com/92c0e720-7a41-4ba0-baff-f96e284208aa/","title":"Before Sunrise","type":"MOVIE"},"Favorites:{\"uuid\":\"8094a321-3997-4aea-aafd-fd17dfcff843\"}":{"__typename":"Favorites","uuid":"8094a321-3997-4aea-aafd-fd17dfcff843","photoUrl":"https://ucarecdn.com/92c0e720-7a41-4ba0-baff-f96e284208aa/","title":"Chicago Bulls","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"61fa52aa-2527-406d-be49-cd71d813751c\"}":{"__typename":"DeepDives","uuid":"61fa52aa-2527-406d-be49-cd71d813751c","content":"\u003cp\u003e\u003cstrong\u003eEnjoy. Your. Time.\u003c/strong\u003e\u003cbr\u003e\u003cstrong\u003e\u003cbr\u003e\u003c/strong\u003eIt's so easy to fall to the pressure of school. But it's worth taking the time to smell the flowers. \u003cbr\u003e\u003cbr\u003eAnd as an effect, when you have fun, you'll achieve so much more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e77b0a87-854b-4733-aba4-0b687143ba8f\"}":{"__typename":"DeepDives","uuid":"e77b0a87-854b-4733-aba4-0b687143ba8f","content":"\u003cp\u003eI chose Social Studies because it offered the greatest academic flexibility and a thorough foundation for anyone interested in the humanities. In Social Studies, there is no fixed course plan, and students design their focuses themselves, tailoring a plan to their interests. Additionally, it really emphasizes a strong learning experience, with small class sizes and even one-to-one mentoring for a capstone senior thesis. \u003cbr\u003e\u003cbr\u003eI was passionate about the humanities and wanted to pursue a PhD track in history, more specifically,\u003cstrong\u003e intellectual history and the history of ideas.\u003c/strong\u003e I loved the rigorous classes in political theory, I loved the super interactive seminars where I had a voice. I loved taking a year to research on my own on French religion, even traveling to Paris for a summer to do interviews.\u003cbr\u003e\u003cbr\u003eEven though I’m no longer on the PhD track, I’m extremely blessed to have had my experience in Social Studies and remember it very fondly.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5a89fbe5-d0c3-474c-b36a-7a55c00a2427\"}":{"__typename":"DeepDives","uuid":"5a89fbe5-d0c3-474c-b36a-7a55c00a2427","content":"\u003cp\u003eMentorship is very important to me because I wouldn’t be where I am without the help I’ve had.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAfter four years of preparation for graduate school, I realized that the path wasn’t right for me. At the time, it was tremendously scary. I had spent all my summers as a Research Assistant, had no professional intern experience, and graduation was soon approaching. I had no idea what I was going to do after college.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eLuckily, I met a mentor in the entertainment industry who gave me a chance and showed me the kinds of things he did. He taught me the ins-and-outs, the possible pathways, and ultimately something to look forward to during a time when I had no idea what the future held. \u003cbr\u003e\u003cbr\u003eNow, I’m on the journey of turning my passion of film and filmmaking into a profession, which wouldn’t have been possible without my mentor’s guidance.\u0026nbsp;Understanding its importance, I'm so excited to give back to others who may be in my shoes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"5f4bc2ed-2d67-4ab4-b92e-30048a083408\"}":{"__typename":"DeepDives","uuid":"5f4bc2ed-2d67-4ab4-b92e-30048a083408","content":"\u003cp\u003eAs a first-generation immigrant, I know learning can be tough at times. I remember coming to my Mom bawling in elementary school because I just couldn’t communicate with my peers. I didn’t know english so I couldn’t make any friends.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eBut with time, and with practice, it got better. For example, my parents deliberately made me order whenever we went to a restaurant.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eSo, as a teacher, I learned to design opportunities for real-life practice. English is hard? Start conversations, even if you’ll trip up a bit. Those equations are tough? Try a couple more on paper.\u0026nbsp; From my experience, learning happens through challenge. And challenges are hard. The way you get through them is with practice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"4644a285-22bf-4856-91b2-4f682df7518a\"}":{"__typename":"School","uuid":"4644a285-22bf-4856-91b2-4f682df7518a","name":"Stevenson High School","city":"Lincolnshire","type":"HIGH","state":"Illinois","country":"United States","zip":"60069"},"Education:{\"uuid\":\"5a0dfef3-fe68-4bf7-90da-d57d425a0716\"}":{"__typename":"Education","uuid":"5a0dfef3-fe68-4bf7-90da-d57d425a0716","school":{"__ref":"School:{\"uuid\":\"4644a285-22bf-4856-91b2-4f682df7518a\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"359494de-d7de-4392-98b0-8c476dd66d6d\"}":{"__typename":"Education","uuid":"359494de-d7de-4392-98b0-8c476dd66d6d","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Social Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"cc7ec0c2-1485-4a62-a2e9-dfa3543565d7\"}":{"__typename":"MentorPublicProfile","uuid":"cc7ec0c2-1485-4a62-a2e9-dfa3543565d7","displayName":"Taehwan K.","slug":"taehwan-kim","biography":"\u003cp\u003eHi, I'm Taehwan (or Tae), and I am a recent graduate of Harvard College and now work in TV writing in Los Angeles. I'm eager to share my story and hopefully establish a fruiftul mentor/mentee relationship with you!\u003cbr\u003e\u003cbr\u003eOriginally from Seoul, Korea, I moved to the US when I was six years old. Completely new to this side of the Earth, I had a bit of trouble adjusting (learning the language, learning the norms, etc.) However, once I did, I learned to have a lot of fun!\u003cbr\u003e\u003cbr\u003eIn high school, while I had a great time in all of my classes, I particularly enjoyed courses in the \u003cstrong\u003ehumanities\u003c/strong\u003e––history, English, and other languages. Maybe as a result, documentaries, reading literature, and sharing what I learned with my parents and friends!\u003cbr\u003e\u003cbr\u003eOutside of school, I participated in a variety of extracurriculars. I spent four years both on the \u003cstrong\u003eSwimming and Track teams\u003c/strong\u003e (where I made some of my most favorite memories). Additionally, as an upperclassman, I was a\u003cstrong\u003e Freshman Mentor\u003c/strong\u003e, helping first-year students adjust to the daunting high school environment. \u003cbr\u003e\u003cbr\u003eIn college, I took my interest in the humanities to the next step and studied Social Studies (an interdisciplinary major that blends history, philosophy, and other social sciences). Designing my own field of study, I focused on \u003cstrong\u003eReligion and Politics in Modern European Philosophy\u003c/strong\u003e. Beyond my major, I loved taking language courses (French and German) in my lifelong goal of becoming a polyglot. I also participated in club activities such as the Korean Association, Club Swim, and as a teacher in several volunteer groups!\u003cbr\u003e\u003cbr\u003eAt Harvard, I initially prepared for graduate school, working on many research projects and writing a senior thesis on French Secularism. By my final semester, I had a change of heart. I decided to pursue my dreams of becoming a \u003cstrong\u003escreenwriter\u003c/strong\u003e and pivoted to a career in the entertainment industry.\u003cbr\u003e\u003cbr\u003eOutside of my job in TV productions, I spend my free time jamming out on my guitar, playing video games, and practicing chess!\u003cbr\u003e\u003cbr\u003eFrom my experience, I'm so excited to connect with you. Whether it's about high school life, college guidance, academia, literature, writing, film, or anything else, I'd be thrilled to chat!\u003c/p\u003e","teachingVideoPlaybackId":"nDgG01QY4h8KuIl3nDAn9DM2M4aIjXQbtMP8oZoSj1Os","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"639d943a-2f5e-4a2e-8125-0b95c77dba61\"}"},{"__ref":"Favorites:{\"uuid\":\"1ab9b7f1-d499-4b60-b588-43cd9a4c7a9a\"}"},{"__ref":"Favorites:{\"uuid\":\"8094a321-3997-4aea-aafd-fd17dfcff843\"}"}],"causesSupported":[],"major":"Social Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"61fa52aa-2527-406d-be49-cd71d813751c\"}"},{"__ref":"DeepDives:{\"uuid\":\"e77b0a87-854b-4733-aba4-0b687143ba8f\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a89fbe5-d0c3-474c-b36a-7a55c00a2427\"}"},{"__ref":"DeepDives:{\"uuid\":\"5f4bc2ed-2d67-4ab4-b92e-30048a083408\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dbf293dd-887b-46ab-98c6-7c056a48038c/-/preview/-/format/jpg/","https://ucarecdn.com/099e2421-4a68-4bb7-9841-5310a7334dae/-/preview/-/format/jpg/","https://ucarecdn.com/e07714a8-1d59-4f28-8379-d6495ca5eb64/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5a0dfef3-fe68-4bf7-90da-d57d425a0716\"}"},{"__ref":"Education:{\"uuid\":\"359494de-d7de-4392-98b0-8c476dd66d6d\"}"}],"hiredAt":"2023-09-09T16:31:25.407Z","topics":["6-8 Grade Science","World Cultures","Film / Theater","Philosophy","History","Geography","Algebra I","Algebra II","Calculus","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Geometry","Writing","Law / Government / Policy","Literature","History Project","Journalism"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"taehwan-kim\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"cc7ec0c2-1485-4a62-a2e9-dfa3
