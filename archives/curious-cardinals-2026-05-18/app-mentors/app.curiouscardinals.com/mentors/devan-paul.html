xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c4280537-18f2-404b-bd06-9a748e874883\"}":{"__typename":"Favorites","uuid":"c4280537-18f2-404b-bd06-9a748e874883","photoUrl":"https://ucarecdn.com/08d009cb-41a8-49ff-a3eb-36d58f88ee7c/","title":"The Phantom Tollbooth","type":"BOOK"},"Favorites:{\"uuid\":\"db557164-c895-4b12-961b-2b4645cd30a6\"}":{"__typename":"Favorites","uuid":"db557164-c895-4b12-961b-2b4645cd30a6","photoUrl":"https://ucarecdn.com/4f41b3b2-35c6-4561-8c16-65773f7497ae/","title":"Fragments of Freedom","type":"ALBUM"},"Favorites:{\"uuid\":\"0471b638-c18f-4faf-8486-8d0728cead2d\"}":{"__typename":"Favorites","uuid":"0471b638-c18f-4faf-8486-8d0728cead2d","photoUrl":"https://ucarecdn.com/6ec8e18c-3f06-4c7d-8ffd-b68a92b27c3f/","title":"Cindy Sherman","type":"ARTIST"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7bbcf833-954e-452d-86a3-c26029a8f6bc\"}":{"__typename":"DeepDives","uuid":"7bbcf833-954e-452d-86a3-c26029a8f6bc","content":"\u003cp\u003eI would say follow your interests and do new things. In middle and high school, I tried on a bunch of different types of things and learned what I did and didn't like. I played basketball for four years in middle school and loathed it, but I still learned a lot! In college, I took a random class about ecology on a whim and it ended up changing the trajectory of my academic career. You never know.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"416726cd-2248-44c8-aa96-77f0fd4de4a4\"}":{"__typename":"DeepDives","uuid":"416726cd-2248-44c8-aa96-77f0fd4de4a4","content":"\u003cp\u003eI was super involved in extracurriculars and loved my classes. I taught health class, mentored underclassmen, ran Model UN, led a sustainability committee, captained track and field, and did lots of photography, among other things! Towards the end of high school, I was also stressed about college, of course, so I can relate to you if you feel that way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"faaeb287-2fb2-4c16-a8b5-6f5f8bafb1d3\"}":{"__typename":"DeepDives","uuid":"faaeb287-2fb2-4c16-a8b5-6f5f8bafb1d3","content":"\u003cp\u003eI've always loved checking out museums, taking day trips to random places, and hiking. I'm currently attempting to teach myself piano, also.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"84fac34c-f309-47e1-96da-65704844d7ab\"}":{"__typename":"DeepDives","uuid":"84fac34c-f309-47e1-96da-65704844d7ab","content":"\u003cp\u003eI always knew I wanted to study cities, so urban studies was a no-brainer. I'm fascinated by urban planning and infrastructure. The trickier one was health \u0026amp; human biology, which emerged from an interest in public health, biology, and environmental studies. The major ended up being a great distillation of all those things.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"885cd74a-eb63-45e4-8da1-7de8144a91ad\"}":{"__typename":"School","uuid":"885cd74a-eb63-45e4-8da1-7de8144a91ad","name":"San Francisco University High School","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94115"},"Education:{\"uuid\":\"78d0406c-c98f-4e05-bac3-a9d95a31a0ed\"}":{"__typename":"Education","uuid":"78d0406c-c98f-4e05-bac3-a9d95a31a0ed","school":{"__ref":"School:{\"uuid\":\"885cd74a-eb63-45e4-8da1-7de8144a91ad\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"f83e373b-b5d3-4716-bfea-c2a6b0360ce5\"}":{"__typename":"Education","uuid":"f83e373b-b5d3-4716-bfea-c2a6b0360ce5","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Urban Studies, Health \u0026 Human Biology (Environmental Health)","degree":null},"MentorPublicProfile:{\"uuid\":\"9572eddc-1f0c-4254-879b-9ad2b475d4a8\"}":{"__typename":"MentorPublicProfile","uuid":"9572eddc-1f0c-4254-879b-9ad2b475d4a8","displayName":"Devan P.","slug":"devan-paul","biography":"\u003cp\u003eHi all!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Devan, and I recently graduated from Brown University, where I double majored in Urban Studies and Health \u0026amp; Human Biology (Environmental Health).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up in San Francisco and developed a deep love for cities, which ended up being a key part of my academic and professional journeys. I’ve worked for multiple organizations doing urban policy work. My senior year, I researched and wrote a thesis about campus plans. I’m also extremely passionate about civic engagement, especially among youth. In high school, I ran voter registration drives; in college, I led Brown’s civic engagement initiative. This fall, I worked for a political campaign in Philadelphia.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I want to empower my mentees to take learning into their own hands. Something I’ve learned from my favorite teachers is that school is most effective when it’s fun and interesting! Think: fewer lectures, more participation. I also love when students take initiative to engage in their work. I aim for my mentees to emerge with excellent academic skills and a competitive profile.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI teach most subjects but am especially passionate about history, math, English, and science. I’m also excited to talk to students about professional aspirations and exploring academic interests. My coursework straddled STEM, social sciences, and the humanities. I changed my second major three times before settling on it, so I have personal experience navigating a winding academic path! Additionally, I edited college essays for over a year, so I’m happy to talk about the college process as well.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore I wrap up, here are a few things I love: maps, college basketball, catching a good movie, baking elaborate desserts, and, of course, teaching and learning. In school, I edited for \u003cem\u003eThe Brown Daily Herald\u003c/em\u003e, led backpacking trips and volunteered for a farmers’ co-op.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to getting to know you and working with you on an academic plan!\u003c/p\u003e","teachingVideoPlaybackId":"DHvUSBYdwcTufhV3VdOWG5GVCRQUbEHKpue01rtrkZhU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c4280537-18f2-404b-bd06-9a748e874883\"}"},{"__ref":"Favorites:{\"uuid\":\"db557164-c895-4b12-961b-2b4645cd30a6\"}"},{"__ref":"Favorites:{\"uuid\":\"0471b638-c18f-4faf-8486-8d0728cead2d\"}"}],"causesSupported":[],"major":"Urban Studies, Health \u0026 Human Biology (Environmental Health)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7bbcf833-954e-452d-86a3-c26029a8f6bc\"}"},{"__ref":"DeepDives:{\"uuid\":\"416726cd-2248-44c8-aa96-77f0fd4de4a4\"}"},{"__ref":"DeepDives:{\"uuid\":\"faaeb287-2fb2-4c16-a8b5-6f5f8bafb1d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"84fac34c-f309-47e1-96da-65704844d7ab\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/002210ad-6d47-4e2b-9001-c81dd878fdb2/-/preview/-/format/jpg/","https://ucarecdn.com/63e8b93e-ae42-44a5-b06b-54a530e363ec/-/preview/-/format/jpg/","https://ucarecdn.com/d7d004f4-7e16-417a-aa05-cd93b43c71a2/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"78d0406c-c98f-4e05-bac3-a9d95a31a0ed\"}"},{"__ref":"Education:{\"uuid\":\"f83e373b-b5d3-4716-bfea-c2a6b0360ce5\"}"}],"hiredAt":"2025-02-12T23:48:41.998Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Chemistry","Biology","Physics","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","History"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c278d819-50e0-435a-a1b0-1b3a8793462f/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"devan-paul\"}}
