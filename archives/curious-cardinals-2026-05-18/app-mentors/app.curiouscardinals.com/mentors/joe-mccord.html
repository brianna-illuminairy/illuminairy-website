playName":"Joe M.","slug":"joe-mccord","biography":"\u003cp\u003eI am a sophomore at Yale University, majoring in Economics, and a member of the Yale football team. Growing up in Knoxville, Tennessee, I spent much of my childhood outdoors, surrounded by animals, especially horses and dogs. Growing up, I tried a bunch of different sports and ended up sticking with baseball and football. In my free time, I would also spend much of my time outdoors. To this day, I have an appreciation for the outdoors and try to get outside when I can. Sports have always been a big part of my life, especially football and baseball. Baseball was the sport I played the longest, but ultimately, I chose to pursue football. Both sports have shaped me in countless ways, teaching me lesson after lesson. They have also opened doors to experiences and opportunities I will always be grateful for. Like any journey, it has not always been easy.\u0026nbsp; Moments of doubt, including times when coaches told me I couldn’t make it have helped shape who I am today. Overcoming those challenges has made the good moments even sweeter. Overall, sports are a blessing and I look forward to seeing where they take me. Academically, I have chosen to study economics, though my learning has not been limited to that alone. I have enjoyed exploring a wide range of topics both inside and outside the classroom. While business and finance have been my main focuses beyond class, American and European history have also been a significant part of my independent studies. I try to select the classes I take here at Yale on topics that I enjoy but that also have real-world relevance. I believe all learning is has its place, but with that being said, it is important to take with you knowledge that truly matters. Enjoying what you’re learning truly matters. In school, I was always the kid who thrived in the classes that interested me and struggled to turn in homework on time when the subject felt boring. I’ve learned there is a balance between enjoyment and meaningful education. School doesn’t have to be dull. My experiences showed me that the environment plays a huge role in how well you learn. The subjects I connect with most today were taught by my best teachers. Those classes were collaborative, thought-provoking, made sense, and, most importantly, were more than just lectures. To leave it off, your past experiences are responsible for your future’s direction, stay curiousask quesitons.\u003c/p\u003e","teachingVideoPlaybackId":"tZJ0001aGIv9sa8CmLKsTgLhmvHokPek4C1fhegveeqIQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am proud to be a Yale football player. Getting to play at the Division 1 level has been a dream come true. I absolutely love it and enjoy being a part of the team every single day.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f887b5b3-0673-4b1d-98a6-53032da57a54\"}"},{"__ref":"Favorites:{\"uuid\":\"a0f3e7aa-bdf7-431a-92b8-3537e59f0734\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"49cb4a47-27b8-4a21-99c4-dbf69a76ae65\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7c76a33-4111-41a8-963f-33de06ff34d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"b42965ed-b2d0-4ce7-a8b6-88dcc53399dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ea99d44-5f21-4684-8d50-3cc920d912bc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7494f280-735a-43eb-8671-bef5ebe24730/-/preview/-/format/jpg/","https://ucarecdn.com/9876dbdb-9dfd-4a61-b1c1-987b4a30fe21/-/preview/-/format/jpg/","https://ucarecdn.com/f0185538-80b7-45ea-8fc7-8820899aaa5a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d9ebdbe2-a87c-4964-a369-c2e4e303f581\"}"},{"__ref":"Education:{\"uuid\":\"282315c1-2c30-4225-aa50-e58b40725ef6\"}"}],"hiredAt":"2025-07-30T16:13:22.965Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Biology","S
