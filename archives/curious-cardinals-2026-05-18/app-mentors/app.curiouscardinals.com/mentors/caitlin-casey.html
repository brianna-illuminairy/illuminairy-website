xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fdca67d5-db20-44aa-8c2b-05bc67b31904\"}":{"__typename":"DeepDives","uuid":"fdca67d5-db20-44aa-8c2b-05bc67b31904","content":"\u003cp\u003eMentorship matters deeply to me because of the amazing mentors I have had growing up. Everyone from my teachers, older students, coaches, classmates, teammates, big brothers and sisters of my friends all taught me to dream bigger than I ever would have known to dream on my own. I owe everything to them! I want to give that back to kids looking for guidance like myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"9021131e-5e1b-451c-a6a2-9ec9cd26f69b\"}":{"__typename":"DeepDives","uuid":"9021131e-5e1b-451c-a6a2-9ec9cd26f69b","content":"\u003cp\u003eMy dream job is to work in sports management. Sports have been the central passion of my life and I've seen how they build joy and community for billions. When you love what you do you never work a day in your life and I can't imagine a job I would love more than surrounding myself in my passion and using it to bring joy to others. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"ca4763e6-e7f5-4566-aad3-8741bf762e9f\"}":{"__typename":"DeepDives","uuid":"ca4763e6-e7f5-4566-aad3-8741bf762e9f","content":"\u003cp\u003eI have ADHD! Those of us with ADHD all present differently, but my whole life changed when I received my diagnosis. I got access to so many resources, mentors, and support networks that have helped me adapt to the way my own mind works instead of trying to make myself work like everyone else. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0f97fa9c-ec97-4bf7-8359-44aebf7c7243\"}":{"__typename":"DeepDives","uuid":"0f97fa9c-ec97-4bf7-8359-44aebf7c7243","content":"\u003cp\u003eYou're not behind! There can be a lot of pressure to know exactly what you want to do with your life, but the true joy is in exploration. The world is filled with unfathomable opportunity. You don't need to limit yourself to finding your 'perfect path' at 16 years old. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"6159d62a-2638-490c-bae2-5237e09c66a6\"}":{"__typename":"School","uuid":"6159d62a-2638-490c-bae2-5237e09c66a6","name":"Saint Joseph High School","city":"South Bend","type":"HIGH","state":"Indiana","country":"United States","zip":"46617"},"Education:{\"uuid\":\"3708ef84-c533-4988-9caf-6e6de1e5f769\"}":{"__typename":"Education","uuid":"3708ef84-c533-4988-9caf-6e6de1e5f769","school":{"__ref":"School:{\"uuid\":\"6159d62a-2638-490c-bae2-5237e09c66a6\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a18240e1-5e1f-41c3-b5d2-67a64477f2b5\"}":{"__typename":"Education","uuid":"a18240e1-5e1f-41c3-b5d2-67a64477f2b5","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2024","major":"Public Policy and Management Science and Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"1d1b451e-b5d8-4389-aa7f-0458b4b61998\"}":{"__typename":"MentorPublicProfile","uuid":"1d1b451e-b5d8-4389-aa7f-0458b4b61998","displayName":"Caitlin C.","slug":"caitlin-casey","biography":"\u003cp\u003eMy name is Caitlin Casey and I am a 23 year old Stanford student. I grew up in South Bend, Indiana and attended private Catholic schools until college. I am a student athlete, tour guide, passionate friend, twin sister, ADHD haver, high school soccer coach, and cat caretaker. In high school I was a National Merit Scholar, two sport varsity captain, and Runner-Up in the National Economics Challenge. In college I have been a varsity field hockey player, club soccer player, and an officer of StanfordVotes. In the future, I want to have a career in sports management. I am most passionate about all things sports, policy development, public speaking, and learning new things every day. Friends describe me as funny (I swear they actually do) and excitable about absolutely everything.  In my free time I love being wherever my friends are, listening to podcasts, and watching any type of sporting event. My main goal as a mentor is to help students develop study and life skills that will help them follow their future dreams and take advantage of opportunities. I want to pay forward all of the love and support so many people have given me to get me to where I am today. \u003c/p\u003e","teachingVideoPlaybackId":"trJHbK2ZTnD82gxoqbxi8xOlvBODkX2PCuidWKJzG3w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Public Policy and Management Science and Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fdca67d5-db20-44aa-8c2b-05bc67b31904\"}"},{"__ref":"DeepDives:{\"uuid\":\"9021131e-5e1b-451c-a6a2-9ec9cd26f69b\"}"},{"__ref":"DeepDives:{\"uuid\":\"ca4763e6-e7f5-4566-aad3-8741bf762e9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"0f97fa9c-ec97-4bf7-8359-44aebf7c7243\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4defd860-616d-4576-8971-f39e9f3fbed4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3708ef84-c533-4988-9caf-6e6de1e5f769\"}"},{"__ref":"Education:{\"uuid\":\"a18240e1-5e1f-41c3-b5d2-67a64477f2b5\"}"}],"hiredAt":"2023-06-03T20:58:18.247Z","topics":["Business / Entrepreneurship","History Project","Journalism","Public Speaking","Law / Government / Policy","Global Health","Debate","Women \u0026 Gender Studies","Sustainability","Reading","History","Executive Function","Economics","College Essay Writing","Academic Coaching","Writing"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"caitlin-casey\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1d1b451e-b5d8-4389-aa7f-0458b4b61998\"}"}}},"_sentryTraceData":"37f25bb9605e417d8ff68c03d109d151-99ae16afcde95e71-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=37f25bb9605e417d8ff68c03d109d151,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","qu
