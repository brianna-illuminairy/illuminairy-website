xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d10d6235-ece7-488f-95e7-cd7163de3205\"}":{"__typename":"Favorites","uuid":"d10d6235-ece7-488f-95e7-cd7163de3205","photoUrl":"https://ucarecdn.com/91d69799-0ddd-4836-b42c-9b06ed6d8b5c/","title":"Laufey ","type":"ARTIST"},"Favorites:{\"uuid\":\"0b8c164e-ad8d-486e-b216-13d60dfcc789\"}":{"__typename":"Favorites","uuid":"0b8c164e-ad8d-486e-b216-13d60dfcc789","photoUrl":"https://ucarecdn.com/91d69799-0ddd-4836-b42c-9b06ed6d8b5c/","title":"Formula of Love: O+T=\u003c3","type":"ALBUM"},"Favorites:{\"uuid\":\"9530c878-6ced-46bf-b20a-b0b22848b83a\"}":{"__typename":"Favorites","uuid":"9530c878-6ced-46bf-b20a-b0b22848b83a","photoUrl":"https://ucarecdn.com/91d69799-0ddd-4836-b42c-9b06ed6d8b5c/","title":"Everything Everywhere All at Once","type":"MOVIE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"79cc44a2-d991-40d3-b74b-8e911afb133d\"}":{"__typename":"DeepDives","uuid":"79cc44a2-d991-40d3-b74b-8e911afb133d","content":"\u003cp\u003eI chose my major because every since middle school, I was fascinated what causes us to think certain ways. I wanted to understand the underlying mechanisms that make us sad, happy, and mad. This was later amplified when I did research on quantifying the efficacy of an antipsychotic. I found it so fun and interesting to understand how this drug worked and how it translates to animal models. Finally, in senior year, I had an amazing AP Psychology teacher who made me really want to pursue psychology as a major. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"bc283aac-b927-4c71-a285-182009f008d1\"}":{"__typename":"DeepDives","uuid":"bc283aac-b927-4c71-a285-182009f008d1","content":"\u003cp\u003eIn my spare time, you will normally find me crocheting, knitting, or drawing. I will spend hours and days just crocheting or knitting. Once I've decided on creating a certain project for crochet or knit, I will spend all my free time on it. Besides knitting and crocheting, I also spend my free time hanging out with friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e36dddb3-1cfb-4225-b9d4-5fe3ec7de084\"}":{"__typename":"DeepDives","uuid":"e36dddb3-1cfb-4225-b9d4-5fe3ec7de084","content":"\u003cp\u003eIn senior year of high school, I created an art account to document my peers emotions and feelings towards anything in their life. What I aimed to do with this account was created abstract representations of these concepts and minimize stigma against these ideas and feelings. It was very fun experience for myself as I got to really understand my peers and push my creativity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"0a0cf849-9159-4957-abde-be319d1c98d8\"}":{"__typename":"School","uuid":"0a0cf849-9159-4957-abde-be319d1c98d8","name":"Irvington High School","city":"Fremont","type":"HIGH","state":"California","country":"United States","zip":"94538"},"Education:{\"uuid\":\"cab05c4a-dc77-4c63-ada9-76bf430e6df7\"}":{"__typename":"Education","uuid":"cab05c4a-dc77-4c63-ada9-76bf430e6df7","school":{"__ref":"School:{\"uuid\":\"0a0cf849-9159-4957-abde-be319d1c98d8\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"c8dbdbad-e754-414f-b59b-707401126768\"}":{"__typename":"Education","uuid":"c8dbdbad-e754-414f-b59b-707401126768","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Psychobiology","degree":null},"MentorPublicProfile:{\"uuid\":\"4fd0b6fb-c048-4294-83f2-d9f20b1c59e8\"}":{"__typename":"MentorPublicProfile","uuid":"4fd0b6fb-c048-4294-83f2-d9f20b1c59e8","displayName":"Cameron T.","slug":"cameron-tran","biography":"\u003cp\u003eHi, my name is Cameron Tran and I am a freshman at UCLA pursuing a major in Psychobiology. I grew up in the Bay Area, spending most of my time painting and playing music. \u003cbr\u003e\u003cbr\u003eI've always had a great passion for teaching and mentoring. In high school, I was a section leader for the saxophones in marching band. Every week for the first quarter of the year, I would spend hours during and afterschool teaching the underclassmen in my section how to marching and play the music well. Over the lock down, I would tutor elementary kids about how to play the saxophone. Additionally, I spent a summer as a teaching assistant to a local art school. I would help young children finish their art projects and also provide demonstrations for them. \u003cbr\u003e\u003cbr\u003eI also have a huge passion towards research and science. Throughout high school, he participated in an afterschool research program and over the summer, interned at a lab in Stanford. Both of these projects dealt with quantifying drug efficacy on animal models. Currently, I work at a research lab affiliated with UCLA Health which focuses on vision research. We use animal models to find the underlying science behind vision. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince 5th grade, I participated in a science competition called Science Olympiad. This competition help expand my understanding of the world and introduce new fields of science to me. Even though I can't participate in these competitions anymore, I still make an effort to volunteer at these events so I can give back to the community that help shape my love for science. \u003cbr\u003e\u003cbr\u003eAt Curious Cardinals, I hope to inspire his students to think big and continue to pursue their passions. I really want to get to know my students and give them engaging projects or questions. Throughout my lessons, I will keep my students engaged through activities and leave them something to think about or work on for the next session.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d10d6235-ece7-488f-95e7-cd7163de3205\"}"},{"__ref":"Favorites:{\"uuid\":\"0b8c164e-ad8d-486e-b216-13d60dfcc789\"}"},{"__ref":"Favorites:{\"uuid\":\"9530c878-6ced-46bf-b20a-b0b22848b83a\"}"}],"causesSupported":[],"major":"Psychobiology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"79cc44a2-d991-40d3-b74b-8e911afb133d\"}"},{"__ref":"DeepDives:{\"uuid\":\"bc283aac-b927-4c71-a285-182009f008d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"e36dddb3-1cfb-4225-b9d4-5fe3ec7de084\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1ac47c2f-89a6-47d6-ae01-52b4595d7aad/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cab05c4a-dc77-4c63-ada9-76bf430e6df7\"}"},{"__ref":"Education:{\"uuid\":\"c8dbdbad-e754-414f-b59b-70740
