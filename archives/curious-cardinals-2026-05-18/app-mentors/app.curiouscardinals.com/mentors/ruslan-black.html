xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6febe57e-4220-4c9b-8188-04d44fbf2c55\"}":{"__typename":"Favorites","uuid":"6febe57e-4220-4c9b-8188-04d44fbf2c55","photoUrl":"https://ucarecdn.com/abf1837a-8bc0-4c42-b7c7-77ccbe060f26/","title":"Lil Uzi Vert","type":"ARTIST"},"Favorites:{\"uuid\":\"7e63e7e1-3295-4073-aec3-8ecfaf26893f\"}":{"__typename":"Favorites","uuid":"7e63e7e1-3295-4073-aec3-8ecfaf26893f","photoUrl":"https://ucarecdn.com/1779cde4-4dec-44e5-8f5e-556f662ed387/","title":"NYC","type":"CITY"},"Favorites:{\"uuid\":\"fecc553c-9820-4366-9f77-b5b4597255a1\"}":{"__typename":"Favorites","uuid":"fecc553c-9820-4366-9f77-b5b4597255a1","photoUrl":"https://ucarecdn.com/227ea32d-b750-4e8f-8d96-7d927c6f56d2/","title":"Harold \u0026 Kumar Go to White Castle","type":"MOVIE"},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"91839e65-8f9a-462e-8612-63e06e2e4b32\"}":{"__typename":"DeepDives","uuid":"91839e65-8f9a-462e-8612-63e06e2e4b32","content":"\u003cp\u003eOne time I had a dream I was swimming in a very large pool and somehow breathing underwater.  It was very peaceful and I remember prancing along the floor of the pool. Randomly, I started  to sink and began struggling for air. I woke up right as it was getting too difficult to hold my breath. It turns out that in the night I had shifted from sleeping on my back to sleeping on my stomach, face down into the pillow. I must've moved my head into the pillow while I was \"swimming\" robbing me of my underwater breathing abilities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a4e079c4-1749-4928-af73-64f7d3a9af3f\"}":{"__typename":"DeepDives","uuid":"a4e079c4-1749-4928-af73-64f7d3a9af3f","content":"\u003cp\u003eStarting from a young age working on small projects with my dad and helping out on the software side of my family's business, I have always been interested in Computer Science. For me the act of coding feels like working on a fun puzzle so it's never really been a chore either. As I've moved up in the curriculum though I've had to adapt to the fact that my classes focus less on the actual programming and more on the theory. I was worried that I would fall out of love with my major from this change but I've realized that the real problem solving I've always enjoyed has more to do with the CS mindset and way of thinking as opposed programming itself. It's also a field that's always changing so I'm excited to see how the industry shifts in my next two years with the major.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c72ca8f0-e307-4fb2-8c2a-de1f1427ff2b\"}":{"__typename":"DeepDives","uuid":"c72ca8f0-e307-4fb2-8c2a-de1f1427ff2b","content":"\u003cp\u003eI worked as a camp counselor! Well actually...\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFreshman year: Camper\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSophomore year: Counselor in training\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eJunior year: Counselor\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSenior year: Counselor\u003c/p\u003e\u003cp\u003eAnyway, it was a super enriching experience where I was able to discover a lot about myself and learn to take on responsibility. Camp counseling is actually one of the main reasons why I decided to work with Curious Cardinals since I very much enjoyed leading my little battalion of 9-10 year-olds. Going forward and into my mentorship sessions I hope to emulate the vibes of a chill but dependable camp counselor.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"e686ffde-1e4b-4aff-b59a-31697cc484a0\"}":{"__typename":"DeepDives","uuid":"e686ffde-1e4b-4aff-b59a-31697cc484a0","content":"\u003cp\u003eI have a black belt in karate! Starting from four years old I trained at the Manhattan branch of World Seido Karate. Fun fact, my specific dojo is called \u003cem\u003eHonbu\u003c/em\u003e, \"headquarters\" in English, which is why every week my dojo welcomes international students coming to train with our founder. I always enjoyed training but it wasn't until I took a hiatus and returned to karate after covid that I really began to get addicted. At my peak I would attend about 7 classes a week with 2 of those being the specialized \u003cem\u003ekumite\u003c/em\u003e, sparring, classes. I even won a tournament beating out all the other black belts in my age range to become one of Seido's national \u003cem\u003ekumite\u003c/em\u003e champions. Karate's been a very important part of my life not just for the physical improvements but the community that forms around that training.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"cabdcaf1-fd93-439f-8c49-48abac9cf439\"}":{"__typename":"School","uuid":"cabdcaf1-fd93-439f-8c49-48abac9cf439","name":"N.Y.C. Lab School for Collaborative Studies","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10011"},"Education:{\"uuid\":\"7046b141-b8f8-482c-a653-350a8d1e6741\"}":{"__typename":"Education","uuid":"7046b141-b8f8-482c-a653-350a8d1e6741","school":{"__ref":"School:{\"uuid\":\"cabdcaf1-fd93-439f-8c49-48abac9cf439\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"e4ecf5fd-c997-4081-9867-a59e8b101ed6\"}":{"__typename":"Education","uuid":"e4ecf5fd-c997-4081-9867-a59e8b101ed6","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"77e50b85-8b7f-4abe-bea7-b2c8d29e7d9c\"}":{"__typename":"MentorPublicProfile","uuid":"77e50b85-8b7f-4abe-bea7-b2c8d29e7d9c","displayName":"Ruslan B.","slug":"ruslan-black","biography":"\u003cp\u003eHi! I’m \u003cstrong\u003eRuslan\u003c/strong\u003e, a second-year computer science student at Cornell University, and I help well rounded students combine their passions: from STEM to the arts!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eSo, What Have I Done?\u003c/u\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eComing into college I was torn between pursuing video production and computer science. Since then I've been able to work on both and more!\u003c/p\u003e\u003cp\u003e\u003cbr\u003eSome of my favorite projects include when I:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilt my own social media algorithm\u003c/strong\u003e from scratch to highlight posts from my 5k+ follower account.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eShot, edited, and directed \u003cstrong\u003ean engineering showcase video\u003c/strong\u003e for a Cornell crowdfunding campaign that raised $15,000+.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterned at \u003cstrong\u003ea startup backed by YouTube's founder\u003c/strong\u003e, designing AI analytics tools and creative UGC marketing initiatives.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eDoing this, I learned how to apply an engineering mindset to creative tasks and how creative thinking can solve engineering problems. I hope through guiding students on their own hands-on work they can learn the same thing too!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eBut What Would You Do?\u003c/u\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI mentor students interested in:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking into \u003cstrong\u003econtent creation\u003c/strong\u003e and highlighting their passions (STEM tutorials, mini-documentaries, travel vlogs.)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGrowing their \u003cstrong\u003etechnical toolkit\u003c/strong\u003e with side projects (personal website, research paper, 3D design \u0026amp; modeling.)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFostering their own \u003cstrong\u003ecommunity of builders/creatives\u003c/strong\u003e (organizing a hackathon, directing a play, founding a startup.)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile students dream up these projects based on their goals and passions they’ll also learn valuable organization and communication skills like event planning, cold outreach and even public speaking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eHow Are We Going To Do It?\u003c/u\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a former counselor I prefer guiding over assigning ensuring mentees are excited and have ownership over their work. Currently leading the marketing team for Combat Robotics @ Cornell I know how to plan projects that keep its members engaged (stop by Ithaca, NY this April for an epic Battle Bot tournament btw.)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTesting out different technical programs for your new project.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStoryboarding a highlight video for your blog.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePreparing a comprehensive logistics document for your upcoming event.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eWhat Else?\u003c/u\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of CS \u0026amp; content creation I enjoy, practicing Russian language, performing with my dance team Cornell Big Red Raas, and making people laugh alongside the other members of the Whistling Shrimp improv comedy troupe. In my free time I find myself waiting for Lil Uzi Vert to drop (or listening to other rap music in the mean time) and watching anime so if you’re a fan of either of those we’ve got to talk!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eReady to go in on your interests, and make the project of a lifetime? I'd love to be your mentor!\u003c/p\u003e","teachingVideoPlaybackId":"hIHa3D5tC5l87eGLYT9LoqOzfcYM902asFIliCeuFXTY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6febe57e-4220-4c9b-8188-04d44fbf2c55\"}"},{"__ref":"Favorites:{\"uuid\":\"7e63e7e1-3295-4073-aec3-8ecfaf26893f\"}"},{"__ref":"Favorites:{\"uuid\":\"fecc553c-9820-4366-9f77-b5b4597255a1\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"91839e65-8f9a-462e-8612-63e06e2e4b32\"}"},{"__ref":"DeepDives:{\"uuid\":\"a4e079c4-1749-4928-af73-64f7d3a9af3f\"}"},{"__ref":"DeepDives:{\"uuid\":\"c72ca8f0-e307-4fb2-8c2a-de1f1427ff2b\"}"},{"__ref":"DeepDives:{\"uuid\":\"e686ffde-1e4b-4aff-b59a-31697cc484a0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3a99aea6-cb68-43de-8cea-8048158273ca/-/preview/-/format/jpg/","https://ucarecdn.com/747433e4-9ba6-4ee8-9446-858a94e0dab2/-/preview/-/format/jpg/","https://ucarecdn.com/b8ac96aa-f8e3-4a55-9a12-6ced1cb56996/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7046b141-b8f8-482c-a653-350a8d1e6741\"}"},{"__ref":"Education:{\"uuid\":\"e4ecf5fd-c997-4081-9867-a59e8b101ed6\"}"}],"hiredAt":"2026-03-12T02:41:25.823Z","topics":["Statistics","Calculus","Precalculus / Trigonometry","Algebra I","Algebra II","Geometry","Pre-Algebra","K-5 Grade Math","Writing","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Reading","Visual Arts / Graphic Design","Video / Photography","Film / Theater","Coding / Programming","Web Design","Machine Learning / AI","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ruslan-black\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"77e50b85-8b7f-4abe-bea7-b2c8d29e7d9c\"}"}}},"_sentryTraceData":"110cd45238e24f0a82767f993dcb4d84-87ae87579cf3562d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea1
