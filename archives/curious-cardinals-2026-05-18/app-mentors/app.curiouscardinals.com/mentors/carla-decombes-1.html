xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2b1a31b2-46b4-47b8-bc3a-8652be02efa7\"}":{"__typename":"DeepDives","uuid":"2b1a31b2-46b4-47b8-bc3a-8652be02efa7","content":"\u003cp\u003eGrowing up in Paris in a family of artists, I have spent most of the weekends of my life visiting museums. I knew that, going to college, I wanted to continue to learn about art and its surrounding histories. On the other hand, Cognitive Science was a college discovery. After taking a few psychology and philosophy classes, I developed a passion for the interdisciplinary study of the mind. I loved how I could curate my major to my interest, taking classes in the management school and the anthropology or neuroscience departments.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2d3f8e4b-93c2-43de-b96f-b221f041e1d9\"}":{"__typename":"DeepDives","uuid":"2d3f8e4b-93c2-43de-b96f-b221f041e1d9","content":"\u003cp\u003eI am currently engaged in a new passion project aimed at making contemporary art more accessible. Far too often, I've encountered statements like \"oh, I could have done that\" or \"this is contemporary art and I don't understand it.\" Admittedly, contemporary art can often feel unapproachable. As a response, I am in the process of creating a website that brings together the narratives of contemporary artworks and the personal reflections or unfiltered reactions of individuals who have encountered them. While I have authored some of these narratives myself, I am now reaching out to others - friends, teachers, family - to actively participate in this endeavor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"382ef131-7db9-4762-b7c8-f4a4c8334fc9\"}":{"__typename":"DeepDives","uuid":"382ef131-7db9-4762-b7c8-f4a4c8334fc9","content":"\u003cp\u003eMy native language is French. Even though I went to a bilingual school for most of my life, going to college in the US initially posed some small challenges. Because I lacked confidence, I did not always feel like I could perform to the best of my abilities. Consequently, I immensely benefited from mentorship and tutoring provided by fellow students, which ultimately enabled me to achieve my objectives. This experience has deeply influenced my teaching style, shaped by my time as a mentee and the inspiration I drew from those who guided me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"25c64b05-f03f-4594-a4f4-ff0f857371a9\"}":{"__typename":"DeepDives","uuid":"25c64b05-f03f-4594-a4f4-ff0f857371a9","content":"\u003cp\u003eOne of my many dreams is to establish a unique hotel that goes beyond the conventional. This dream resonates with me as the one most achievable. I envision a space where people don't just stay but connect, exchanging innovative ideas.My affinity for hosting gatherings and bringing diverse people together has fueled this aspiration. I want to translate this passion into a professional venture by creating a hotel that encourages meaningful interactions and collaboration.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"ba823ce7-13c9-429f-b671-e6ccd31dfb75\"}":{"__typename":"School","uuid":"ba823ce7-13c9-429f-b671-e6ccd31dfb75","name":"Ecole Jeannine Manuel ","city":"Paris","type":"HIGH","state":"Paris","country":"France","zip":"75015"},"Education:{\"uuid\":\"c81accbd-6c7a-4b34-9933-1a5ca2ca958e\"}":{"__typename":"Education","uuid":"c81accbd-6c7a-4b34-9933-1a5ca2ca958e","school":{"__ref":"School:{\"uuid\":\"ba823ce7-13c9-429f-b671-e6ccd31dfb75\"}"},"startYear":"2005","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}":{"__typename":"School","uuid":"843cb79b-75a7-4415-89cc-0166c307ba4b","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"CT","country":"USA","zip":"06511"},"Education:{\"uuid\":\"0c1d5232-9201-4c45-9d47-c6a5e3590a9b\"}":{"__typename":"Education","uuid":"0c1d5232-9201-4c45-9d47-c6a5e3590a9b","school":{"__ref":"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"History of Art and Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"4513c21a-b031-4de0-82b7-10601c6a6ab9\"}":{"__typename":"MentorPublicProfile","uuid":"4513c21a-b031-4de0-82b7-10601c6a6ab9","displayName":"Carla D.","slug":"carla-decombes-1","biography":"\u003cp\u003eHi everyone, my name is Carla and I recently graduated from college. My academic journey began at Yale University, where I pursued a dual major in Art History and Cognitive Science, driven by a curiosity about the human mind's profound connection to artistic expression.\u003cbr\u003e\u003cbr\u003eMy love affair with art ignited during my early years, as I immersed myself in the world's artistic traditions that the Paris museums offered. At Yale, I delved into the intricacies of art history. This academic pursuit allowed me to decipher the hidden narratives woven into the tapestry of human culture and provided me with a deep appreciation for the visual arts.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs I honed my understanding of the human mind through cognitive science, I began to explore the profound ways in which art and creativity are intertwined with our neural processes. My studies uncovered the intricate dance between perception, emotion, and artistic creation, enriching my perspective on the power of visual expression.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy academic journey led me to work at Sotheby's, where I currently thrive in an environment that celebrates art's history, and significance. Daily, I get to immerse myself in the art world where I engage with extraordinary works of art, connect with fellow art enthusiasts, and help bring the world's most exquisite pieces to the forefront.\u003cbr\u003e\u003cbr\u003eBeyond my professional pursuits, I am also a passionate jewelry designer. My creations are a manifestation of my fascination with aesthetics, and they allow me to channel my creativity into wearable art. Each piece I design tells a unique story, fusing my artistic sensibilities with my profound respect for craftsmanship.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMoreover, I am an avid writer. My love for storytelling has led me to craft articles and stories. These narratives serve as a platform to share my insights, discoveries, and reflections with a broader audience, bridging the gap between academia and the everyday art lover.\u003cbr\u003e\u003cbr\u003eIn every endeavor, whether it's unlocking the secrets of a Renaissance masterpiece, crafting a one-of-a-kind piece of jewelry, or weaving words into compelling narratives, I find myself endlessly inspired by the boundless creativity of the human mind and the limitless beauty of the artistic world.\u003c/p\u003e","teachingVideoPlaybackId":"aCSp00JCS1dGxUXUmBBEVr4PH29N0101opY9HMMN00ucnMQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History of Art and Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2b1a31b2-46b4-47b8-bc3a-8652be02efa7\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d3f8e4b-93c2-43de-b96f-b221f041e1d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"382ef131-7db9-4762-b7c8-f4a4c8334fc9\"}"},{"__ref":"DeepDives:{\"uuid\":\"25c64b05-f03f-4594-a4f4-ff0f857371a9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/19a40e28-a7ba-4dfc-b312-cb4379d1e012/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c81accbd-6c7a-4b34-9933-1a5ca2ca958e\"}"},{"__ref":"Education:{\"uuid\":\"0c1d5232-9201-4c45-9d47-c6a5e3590a9b\"}"}],"hiredAt":"2023-08-11T04:58:29.253Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"carla-decombes-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4513c21a-b031-4de0-82b7-10601c6a6ab9\"}"}}},"_sentryTraceData":"04e5c3777654436fae6d548f04b15433-a6a87f37197fad66-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=04e5c3777654436fae6d548f04b15433,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"carla-decombes-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive
