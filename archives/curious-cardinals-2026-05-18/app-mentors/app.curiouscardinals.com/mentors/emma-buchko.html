xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cfe7ceb2-0360-4ed8-969c-b4b12e0c329f\"}":{"__typename":"Favorites","uuid":"cfe7ceb2-0360-4ed8-969c-b4b12e0c329f","photoUrl":"https://ucarecdn.com/7e88c2a3-a833-4f85-aaf1-72ea556eb73d/","title":"Vienna","type":"SONG"},"Favorites:{\"uuid\":\"2f13814d-7c43-4e5e-8e18-b12522e423b2\"}":{"__typename":"Favorites","uuid":"2f13814d-7c43-4e5e-8e18-b12522e423b2","photoUrl":"https://ucarecdn.com/3e4417a6-89ef-421b-9d8e-de56e4da2071/","title":"When We Were Friends","type":"ALBUM"},"Favorites:{\"uuid\":\"6c043651-8a98-40c6-8ecc-2e266cfefbbc\"}":{"__typename":"Favorites","uuid":"6c043651-8a98-40c6-8ecc-2e266cfefbbc","photoUrl":"https://ucarecdn.com/bb4bd13e-3ec8-4784-b30a-d96a2567e123/","title":"The Lion King","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5d047386-e1dc-4078-9cee-28cab3f49c46\"}":{"__typename":"DeepDives","uuid":"5d047386-e1dc-4078-9cee-28cab3f49c46","content":"\u003cp\u003eFrolic - \u003cem\u003everb\u003c/em\u003e - to play and move about cheerfully, excitedly, or energetically.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo put it simply, my absolute favorite thing to do in my spare time is to frolic. In my opinion, frolicking is up for interpretation and can be easily substituted with gallivanting (to go around from one place or another in the pursuit of entertainment). For me, frolicking includes getting ice cream, taking a 30 minute study break for dinner that turns into 3 hours of laughs and conversations, playing guitar, taking a walk outside, rock climbing, dancing (badly), or doing anything that brings me joy and relaxation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"b6485677-5be9-4d85-8fc6-59210949aad4\"}":{"__typename":"DeepDives","uuid":"b6485677-5be9-4d85-8fc6-59210949aad4","content":"\u003cp\u003eSomething about myself that might not be obvious (5 ft. 1” by the way) is that I am a second degree black belt in karate. From ages 8-16 I did karate as my main sport and greatly accredit it to who I am today. From the physical benefits of working out three times a week, to the social benefits of making lifelong friends, to the cool party tricks I’ve acquired, karate was an amazing addition to my life. Not only did I take classes, but I was also a part of our Demo Team which was able to perform at different events such as parades, fairs, and even Philadelphia Flyer’s Hockey games!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne of the first lessons I learned at karate was to be respectful. And the second was to be LOUD. In order to achieve your first belt you had to be able to lead the class in the “Action Karate Creed” as loud as you could. The values of our studio were also printed in big bold letters on the wall: perseverance, focus, teamwork, respect, humility. While it may not be obvious that I’m a black belt, I feel the lessons I learned show every single day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"5fa345f2-70b3-4498-bdee-1b20327f3436\"}":{"__typename":"DeepDives","uuid":"5fa345f2-70b3-4498-bdee-1b20327f3436","content":"\u003cp\u003eA passion project that I have had the pleasure to work on for the last two years is a PCNL Training Device! For a tiny bit of context, PCNL is a minimally invasive kidney stone removal surgery that has traditionally used flouroscopy (X-ray) to guide the procedure, but is newly using Ultrasound. The actual purpose of our device is to ease the learning curve of navigating through a 3D plane with 2D ultrasound imaging, practicing needle tracking, and hitting targets (ie: the papilla of a kidney).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was assigned this project in my first semester at Duke and worked on a team of 5 in a class called EGR 101. This is a required class for first-year engineering students and one I was extremely excited to take. It was crazy to me that a group of five 17 and 18 year olds were actually going to create a device that does not exist! It felt so far away and impossible. The class took us through the iterative desi\u003c/p\u003e\u003cp\u003egn process, low-fidelity to medium/high fidelity prototyping, and ended with professional poster presentations. It was an amazing experience to see how much we could actually do. After this class, my team and I decided to keep working on our project instead of letting it close with the end of the semester.\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy team and I have come a long way and have a “Target Practice” device that is made of gelatin and has ecoflex (a type of silicone) targets suspended throughout. The device is designed to be used with an ultrasound and is also able to be reheated and reused time and time again. We are currently working and testing with urologists at Duke Hospital and have a publication in the works!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"3e2d0d57-afa6-47b5-89b6-290c4b3af8a7\"}":{"__typename":"School","uuid":"3e2d0d57-afa6-47b5-89b6-290c4b3af8a7","name":"Conwell Egan Catholic High School","city":"Fairless Hills","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19030"},"Education:{\"uuid\":\"004fc735-4654-4bee-b518-4ac80a3bc727\"}":{"__typename":"Education","uuid":"004fc735-4654-4bee-b518-4ac80a3bc727","school":{"__ref":"School:{\"uuid\":\"3e2d0d57-afa6-47b5-89b6-290c4b3af8a7\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"2cbb34a9-fc27-4ac5-8b85-954c23a16945\"}":{"__typename":"Education","uuid":"2cbb34a9-fc27-4ac5-8b85-954c23a16945","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"207d823f-3b8a-4cfd-ab60-d787d093c9ce\"}":{"__typename":"MentorPublicProfile","uuid":"207d823f-3b8a-4cfd-ab60-d787d093c9ce","displayName":"Emma B.","slug":"emma-buchko","biography":"\u003cp\u003e      Hi! My name is Emma Buchko and I am a Mechanical Engineering student at Duke University. I am originally from Bucks County, PA - just outside of Philadelphia - and will be living in Minneapolis this summer as an R\u0026amp;D intern at Boston Scientific! I am super passionate about learning and creating! Coming into Duke I was originally majoring in Biomedical Engineering, but quickly realized that while I do have an interest in medical devices I really just want to make things that don’t exist yet!\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e      Even when I was little I had some urge inside me to constantly learn new things. I remember in kindergarten I could not wait to read the first grade books, in 5th grade I wanted to do the 6th grade math, and in high school I dual enrolled at a local college. I had (and still have) an almost insatiable desire to keep learning, and this hunger carries on outside of the classroom. I was a kid who could never sit still and was constantly hobby jumping. Over the years I’ve collected juggling, making balloon animals, solving Rubik’s cubes, playing guitar, and I can craft the best paper airplane you ever did see. Recently, I’ve upgraded to circuity, coding, computer-aided design, and laser cutting! I think the easiest way to learn anything is to be excited about what you are learning and frequently look back on how far you’ve come.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e      Some things that I am involved in at Duke are Society of Women Engineers (SWE), being a teaching assistant, and Duke University Climbing Kids (DUCK). I am the VP of Alumni Relations for Duke’s SWE chapter which means I get to talk to a bunch of super cool people and organize different fun events for things like networking, career path finding, or even just relaxing with a yummy snack. SWE has helped me meet so many upperclassmen that have given me amazing advice (like what professors to NOT take) while also helping me build my professional side as well. Being a teaching assistant at Duke has been insanely fulfilling for me thus far. Last semester I TA’d for EGR 101, our first year design class, and this semester I am TA’ing EGR 121. EGR 121 is a class for mechanical engineers where students are assigned a new project every two weeks. Projects entail things like: a mouse trap powered car that travels through sand, a 3 ft tall Rube Goldberg machine, and creating a McDonalds Happy Meal Toy. This was my absolute favorite class and I love being able to help students learn from the projects I had so much fun working on.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e      I care about doing what you WANT to do and always finding the fun in things even when it’s time to be professional and academic.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow before I leave you, the most important thing you should know about me is: I \u003cem\u003ealways\u003c/em\u003e want to get ice cream.\u003c/p\u003e","teachingVideoPlaybackId":"NIPKScunSCncFl9qxWP3jM02k6kiLkV01W5006yGWF01U01s","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"cfe7ceb2-0360-4ed8-969c-b4b12e0c329f\"}"},{"__ref":"Favorites:{\"uuid\":\"2f13814d-7c43-4e5e-8e18-b12522e423b2\"}"},{"__ref":"Favorites:{\"uuid\":\"6c043651-8a98-40c6-8ecc-2e266cfefbbc\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5d047386-e1dc-4078-9cee-28cab3f49c46\"}"},{"__ref":"DeepDives:{\"uuid\":\"b6485677-5be9-4d85-8fc6-59210949aad4\"}"},{"__ref":"DeepDives:{\"uuid\":\"5fa345f2-70b3-4498-bdee-1b20327f3436\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a2536150-804a-4a76-b9d0-010935cdb95d/-/preview/-/format/jpg/","https://ucarecdn.com/bbdb9b74-414f-4345-83fb-68843a462cd9/-/preview/-/format/jpg/","https://ucarecdn.com/119d654d-4787-427d-8802-c4a5cb122461/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"004fc735-4654-4bee-b518-4ac80a3bc727\"}"},{"__ref":"Education:{\"uuid\":\"2cbb34a9-fc27-4ac5-8b85-954c23a16945\"}"}],"hiredAt":"2025-04-11T11:09:57.026Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","College Essay Writing","Reading","Academic Coaching","Executive Function","Music","Creative Writing","Rob
