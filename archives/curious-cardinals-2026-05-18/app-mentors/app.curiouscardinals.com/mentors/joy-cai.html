xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d56dd18d-af23-4071-bf0f-9a7f213ee935\"}":{"__typename":"Favorites","uuid":"d56dd18d-af23-4071-bf0f-9a7f213ee935","photoUrl":"https://ucarecdn.com/b7a6edaf-3902-4d6b-b2b4-df1af06c94a6/","title":"1989 by Taylor Swift","type":"ALBUM"},"Favorites:{\"uuid\":\"c54877e4-caaa-428c-8ee3-9f6274ecc563\"}":{"__typename":"Favorites","uuid":"c54877e4-caaa-428c-8ee3-9f6274ecc563","photoUrl":"https://ucarecdn.com/e903d95d-7668-495b-aa67-c23588452373/","title":"Carlos Alcaraz","type":"ATHLETE"},"Favorites:{\"uuid\":\"ad21d1a4-faf0-41f8-96f8-66b36c4bd4ee\"}":{"__typename":"Favorites","uuid":"ad21d1a4-faf0-41f8-96f8-66b36c4bd4ee","photoUrl":"https://ucarecdn.com/3b215a49-40b5-47e7-a4d1-c5d02254d72a/","title":"Les Miserables ","type":"PLAY"},"CausesSupported:{\"uuid\":\"f9652899-9ca5-43f1-8cc4-6260393e4c7f\"}":{"__typename":"CausesSupported","uuid":"f9652899-9ca5-43f1-8cc4-6260393e4c7f","name":"Inland Valley Humane Society","description":"\u003cp\u003eI adopted my Border Collie from the Humane Society. All animals deserve care. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/670c25ac-b64d-48bb-a5e9-dffb1289b43a/"},"CausesSupported:{\"uuid\":\"2d24f661-4c7d-4a45-9568-1263f01599f6\"}":{"__typename":"CausesSupported","uuid":"2d24f661-4c7d-4a45-9568-1263f01599f6","name":"American Cancer Society","description":"\u003cp\u003eCancer has personally affected my family, so I support the ACS and it's mission.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/071f27de-3396-45c0-bf36-02fcaea9e24d/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f7d935ad-8a99-4a73-9069-6dfd6ac97088\"}":{"__typename":"DeepDives","uuid":"f7d935ad-8a99-4a73-9069-6dfd6ac97088","content":"\u003cp\u003eI chose economics because it combines two subjects I’ve always enjoyed: math and social studies. I like how economics uses data and analytical thinking to understand human behavior, decision-making, and broader societal trends. It challenges me to think critically and helps me understand the real-world impact of policies and markets.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6cd39be1-259c-42b9-ab7e-7c28518ccd04\"}":{"__typename":"DeepDives","uuid":"6cd39be1-259c-42b9-ab7e-7c28518ccd04","content":"\u003cp\u003eMentorship matters to me because it’s a powerful way to support the next generation as they explore their curiosities and passions. Guiding someone through that process can help them discover purpose, confidence, and fulfillment. I was lucky to have a great mentor in high school who helped me embrace my interests and learn how to be productive while living with ADHD. That experience had a huge impact on me, and I want to pay it forward by being that kind of support for someone else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"55cfeca8-75e0-4968-9b8e-c9a8a4363b76\"}":{"__typename":"DeepDives","uuid":"55cfeca8-75e0-4968-9b8e-c9a8a4363b76","content":"\u003cp\u003eIt’s going to feel like a rollercoaster sometimes—but try to enjoy the ride, both the highs and the lows. This is such a valuable time to explore anything and everything that sparks your curiosity. Don’t be afraid to try new things, make mistakes, and learn more about who you are and what you love.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7da554f6-0f93-499f-84c4-8dee51b328a0\"}":{"__typename":"DeepDives","uuid":"7da554f6-0f93-499f-84c4-8dee51b328a0","content":"\u003cp\u003eIn the summer of 2015, I attended the Girl Up WiSci STEAM (Science, Technology, Engineering, Arts, and Mathematics) Camp in Gashora, Rwanda. During the program, I collaborated on initiatives aimed at supporting girls in STEAM fields and worked on engineering and entrepreneurship projects that we later presented to the former U.S. Ambassador to Rwanda, Erica Barks-Ruggles, and the First Lady of Rwanda, Jeannette Kagame.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"96757409-3fd1-41b8-b8fa-58626472f037\"}":{"__typename":"School","uuid":"96757409-3fd1-41b8-b8fa-58626472f037","name":"Walnut High School","city":"Walnut","type":"HIGH","state":"California","country":"United States","zip":"91789"},"Education:{\"uuid\":\"69f06e2b-0c28-4fa1-8a56-526adb070747\"}":{"__typename":"Education","uuid":"69f06e2b-0c28-4fa1-8a56-526adb070747","school":{"__ref":"School:{\"uuid\":\"96757409-3fd1-41b8-b8fa-58626472f037\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"d2831698-7827-4079-b290-abf2c4566885\"}":{"__typename":"Education","uuid":"d2831698-7827-4079-b290-abf2c4566885","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"08488ba7-e2fa-4abb-83f4-d93f557c0e5f\"}":{"__typename":"MentorPublicProfile","uuid":"08488ba7-e2fa-4abb-83f4-d93f557c0e5f","displayName":"Joy C.","slug":"joy-cai","biography":"\u003ch2\u003e\u003cstrong\u003eJoy — Entrepreneurship, Innovation \u0026amp; Passion Projects\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi! I’m Joy Cai, and I help students turn their creative ideas and passions into real-world projects, startups, and advocacy initiatives they’re proud of.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI hold a \u003cstrong\u003eBachelor of Arts in Economics \u003c/strong\u003efrom the \u003cstrong\u003eUniversity of Pennsylvania (Class of 2020)\u003c/strong\u003e, and I currently work at the intersection of health technology and early-stage innovation—as both an operator and an angel investor in the startup space.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003e\u0026nbsp;A Bit About Me\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eIn high school, I found purpose in advocacy and the arts—from promoting girls' education through the United Nations Foundation’s Girl Up Campaign, to studying ballet, jazz, and modern dance for over a decade.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Penn, I immersed myself in the university’s entrepreneurial ecosystem, gaining hands-on experience launching and supporting early-stage ventures through:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWeiss Tech House (student-run venture accelerator)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eVenture Initiation Program (Penn’s startup incubator)\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eNow, I love helping younger students \u003cstrong\u003eturn their passions—no matter how niche—into something tangible\u003c/strong\u003e: a nonprofit, a mini startup, or a creative showcase.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eWhat I Can Help You With\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI specialize in mentoring students who want to explore:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEntrepreneurship \u0026amp; Innovation\u003cbr\u003e\u003c/strong\u003e Turning your idea into a real organization or initiative—yes, even if you're still in middle or high school!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCreative Passion Projects\u003cbr\u003e\u003c/strong\u003e Love dance, design, or storytelling? Let’s build something beautiful and meaningful out of it.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSocial Advocacy Projects\u003cbr\u003e\u003c/strong\u003e I’ll help you take a stand for what you care about—and make it actionable.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI offer a mix of \u003cstrong\u003egentle coaching\u003c/strong\u003e and \u003cstrong\u003efirm accountability\u003c/strong\u003e, creating a space that’s both encouraging and productive.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eA Note on Neurodiversity\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eAs someone with \u003cstrong\u003eADHD\u003c/strong\u003e, I understand the importance of finding sustainable, personalized approaches to learning, productivity, and self-expression.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve turned my ADHD into a superpower—and I love helping students \u003cstrong\u003echannel their energy and creativity into focused, impactful work\u003c/strong\u003e that feels fun and rewarding.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eWhat It’s Like to Work with Me\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOur sessions might include:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming how to spin your passion (dance, coding, journaling, social justice—you name it) into a project or startup\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eMapping out a step-by-step action plan with achievable goals\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBuilding confidence in your ability to lead, share, and grow your idea\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExploring productivity strategies that work with your brain, not against it\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you’re just starting with a vague interest or already have a big idea, I’ll help you bring it to life.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eOutside of Work\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eWhen I’m not building or investing in startups, you can find me:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eHiking in nature with my border collie, Luke \u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTaking drop-in dance classes at San Francisco Ballet\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWatching world-class performances from American Ballet Theatre and Millennium Dance Complex\u003cstrong\u003e\u003cbr\u003e\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003e\u0026nbsp;Let’s Build Something Together\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIf you’re bursting with ideas—or just feel like your curiosity doesn’t quite fit into a box—I’d love to help you \u003cstrong\u003eturn your passions into something powerful, creative, and real.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLet’s make it happen.\u003c/p\u003e","teachingVideoPlaybackId":"F2nuYnnvcNoUDNrEOOoOPAdcL55pww3R12mQuLS9IN8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I’m really proud of is completing the Philadelphia Half-Marathon. It was especially challenging because it took place in February, so the weather was cold to begin with, and about halfway through the race, it started raining. That combination made the run even tougher—mentally and physically—but I pushed through and finished. Crossing the finish line despite the discomfort and the urge to stop early was a really meaningful moment for me. It reminded me that I can stick with difficult things and persevere when conditions aren’t ideal.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d56dd18d-af23-4071-bf0f-9a7f213ee935\"}"},{"__ref":"Favorites:{\"uuid\":\"c54877e4-caaa-428c-8ee3-9f6274ecc563\"}"},{"__ref":"Favorites:{\"uuid\":\"ad21d1a4-faf0-41f8-96f8-66b36c4bd4ee\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"f9652899-9ca5-43f1-8cc4-6260393e4c7f\"}"},{"__ref":"CausesSupported:{\"uuid\":\"2d24f661-4c7d-4a45-9568-1263f01599f6\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f7d935ad-8a99-4a73-9069-6dfd6ac97088\"}"},{"__ref":"DeepDives:{\"uuid\":\"6cd39be1-259c-42b9-ab7e-7c28518ccd04\"}"},{"__ref":"DeepDives:{\"uuid\":\"55cfeca8-75e0-4968-9b8e-c9a8a4363b76\"}"},{"__ref":"DeepDives:{\"uuid\":\"7da554f6-0f93-499f-84c4-8dee51b328a0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c569e79d-108f-4685-a4da-3026be7073e0/-/preview/-/format/jpg/","https://ucarecdn.com/05f6f196-d689-437a-af85-72f8af3b0456/-/preview/-/format/jpg/","https://ucarecdn.com/04c2d697-6708-4ab8-aac9-1324dd7b7c58/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"69f06e2b-0c28-4fa1-8a56-526adb070747\"}"},{"__ref":"Education:{\"uuid\":\"d2831698-7827-4079-b290-abf2c4566885\"}"}],"hiredAt":"2025-09-11T02:44:21.725Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Statistics","Calculus","Precalculus / Trigonometry","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Business / Entrepreneurship","Public Speaking","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":tr
