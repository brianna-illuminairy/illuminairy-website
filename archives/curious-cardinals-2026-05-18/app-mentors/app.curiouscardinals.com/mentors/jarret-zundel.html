xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ab8701af-0475-4f57-8947-179e0b8dee0f\"}":{"__typename":"Favorites","uuid":"ab8701af-0475-4f57-8947-179e0b8dee0f","photoUrl":"https://ucarecdn.com/906193e1-0477-4e30-913c-5e614184c57d/","title":"You Have More Influence Than You Think","type":"BOOK"},"Favorites:{\"uuid\":\"d05aa58e-f892-4b20-b0a0-22766ef73e90\"}":{"__typename":"Favorites","uuid":"d05aa58e-f892-4b20-b0a0-22766ef73e90","photoUrl":"https://ucarecdn.com/a890da93-b4d8-44d9-91c2-ad3c641bfd94/","title":"Octane","type":"ALBUM"},"Favorites:{\"uuid\":\"6ceefbf9-4439-4a7e-ac5e-60dd5dcdbc3f\"}":{"__typename":"Favorites","uuid":"6ceefbf9-4439-4a7e-ac5e-60dd5dcdbc3f","photoUrl":"https://ucarecdn.com/edcac9d5-f54e-45ac-adc5-95247f70cc01/","title":"NYC - Hoping to work here soon!","type":"CITY"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d5d8cbb9-93a6-4e71-928e-4ec476a622aa\"}":{"__typename":"DeepDives","uuid":"d5d8cbb9-93a6-4e71-928e-4ec476a622aa","content":"\u003cp\u003eThe Dyson School at Cornell is an incredibly competitive environment, and I genuinely love it. To me, studying business is really about studying how to be effective and successful in the real world. We learn how to manage and invest money, think strategically, communicate clearly, and make rational, economically sound decisions. Those skills don’t stay in the classroom; they show up in everyday life. I constantly catch myself applying finance concepts to personal decisions, whether it’s thinking in terms of trade-offs or recognizing a sunk cost. That mindset becomes second nature. Being surrounded by people who think this way, and who are deeply motivated about their careers, raises your standard. When you’re around people trying to maximize their potential, that mindset spills over into how they approach everything else, from hobbies to personal goals. In a word, I love what we learn, I love the people around me, and I love the grind.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e69c66c9-f155-4d51-bc76-5ee714200ce9\"}":{"__typename":"DeepDives","uuid":"e69c66c9-f155-4d51-bc76-5ee714200ce9","content":"\u003cp\u003eDon’t shy away from opportunities just because you think you’re not talented or smart enough. In middle and high school, almost everyone is still at a beginner level. Very few people are true “naturals,” and most are just a little further along because they started earlier or practiced more. If something interests you, give yourself permission to try.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDon’t commit to extracurricular activities that demand a lot of time but offer little return on investment (unless you’re truly interested in them). Looking back, I invested too much time in track and field when I wasn’t a top performer and wasn’t genuinely motivated by the competitive side of it. That doesn’t mean you should abandon something you truly enjoy just because you’re not the best at it. But if you’re participating in an activity mainly to strengthen your college applications, be honest with yourself about whether it will actually make a meaningful impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThink more deliberately about your career when choosing classes and colleges. In high school, I had a vague sense that I might want to do finance, but I didn’t really understand what the field involved. Once I got to college, I met people who already knew the industry inside and out, and that gap matters more now because recruiting timelines keep moving earlier. At many top universities, preprofessional clubs recruit heavily during freshman year, and for “high finance” paths, recruiting can start as early as sophomore year. The takeaway isn’t that you need your whole life figured out at 16, but that it helps to start exploring careers early so you can build relevant skills and experiences sooner. And when picking a college, prioritize how strong it is for your target career path, not just its overall U.S. News ranking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d9cd4ad7-ba2f-4f73-8466-f29ef8437f62\"}":{"__typename":"DeepDives","uuid":"d9cd4ad7-ba2f-4f73-8466-f29ef8437f62","content":"\u003cp\u003eI’ve always taken on mentorship roles. I’ve taught English as a second language, worked as a special education tutor, and, of course, I’ve been a mentor to my own sister.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve also benefited tremendously from having older friends mentor me throughout high school. They kept me informed about opportunities I wouldn’t have found on my own, gave me honest advice about how to use my time, helped revise my college essays, and offered steady emotional support when I needed it most. Having people who genuinely want you to succeed is incredibly powerful. It gives you better information, stronger accountability, and a real source of motivation when things get tough.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"542de49b-9918-491f-a219-2e0dff405182\"}":{"__typename":"DeepDives","uuid":"542de49b-9918-491f-a219-2e0dff405182","content":"\u003cp\u003eTravel to every country U.S. citizens can travel to\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"bda13760-2722-4ea8-95b9-d38398836cf6\"}":{"__typename":"School","uuid":"bda13760-2722-4ea8-95b9-d38398836cf6","name":"Miramonte High School","city":"Orinda","type":"HIGH","state":"California","country":"United States","zip":"94563"},"Education:{\"uuid\":\"e9718b14-e374-4883-b4b2-d9f5ff885c97\"}":{"__typename":"Education","uuid":"e9718b14-e374-4883-b4b2-d9f5ff885c97","school":{"__ref":"School:{\"uuid\":\"bda13760-2722-4ea8-95b9-d38398836cf6\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"347aac6c-6bb2-4ce2-aaff-512fa6553967\"}":{"__typename":"Education","uuid":"347aac6c-6bb2-4ce2-aaff-512fa6553967","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Applied Economics and Management","degree":null},"MentorPublicProfile:{\"uuid\":\"834b9ab9-62f0-4a4d-96e5-700d4f4f1227\"}":{"__typename":"MentorPublicProfile","uuid":"834b9ab9-62f0-4a4d-96e5-700d4f4f1227","displayName":"Jarret Z.","slug":"jarret-zundel","biography":"\u003cp\u003eMy name is Jarret Zundel, and I'm a sophomore at Cornell University's Dyson School of Applied Economics and Management, one of the top undergraduate business programs in the country. I'm concentrating in Finance and Business Analytics, with a strong interest in how quantitative thinking and market analysis drive real business decisions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn the finance side, I currently serve as the Consumer and Retail Sector Lead for Cornell Equity Research, the university's premier finance publication, where I analyze publicly traded companies and publish investment reports read by professionals across the industry. This work has sharpened my ability to synthesize complex financial data into clear, compelling arguments, a skill I'm excited to help students develop in their own way. I've also worked in startup consulting, helping early-stage businesses think through strategy, positioning, and growth, which sits right at the intersection of entrepreneurship and finance. Beyond that, my background spans real estate valuation, sales development, and policy research, giving me a broad view of how business principles apply across industries.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStrong math skills are the foundation of everything in business and finance, and I love helping students channel academic strengths into real-world thinking. Whether that means understanding how markets price assets, building a basic financial model, stress-testing a business idea, or learning to present an argument persuasively, I tailor my approach to where each student is and where they want to go.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm originally from the Bay Area and graduated from Miramonte High School in Orinda, CA in 2024. In high school, I was involved in newspaper, track and field, and studied abroad in Taiwan through the competitive NSLI-Y program. I also interned at the California State Senate and produced award-winning documentary films about Asian-owned small businesses, which were recognized by the California State Treasurer and screened at film festivals across San Francisco. Those experiences taught me a lot about storytelling, advocacy, and the human side of business.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I love trying new restaurants (Beli is my favorite app for discovering the best spots), reading, and running. I completed the LA Half Marathon last year and play basketball recreationally. I'm genuinely excited to work with motivated students who are curious about the world and ready to start connecting their interests to something bigger. Feel free to reach me anytime at jtz8@cornell.edu.\u003c/p\u003e","teachingVideoPlaybackId":"wx4MEyraUDYKjGLr5nfKQb7XwIkwXqiqSZHg6HDhhfs","teachingVideoDescription":null,"greatestAchievement":"\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePlaced in top 3% in \u003cem\u003eManagement Consulted\u003c/em\u003e Case Competition\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eScored Advanced-Mid on Mandarin ACTFL OPI\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ab8701af-0475-4f57-8947-179e0b8dee0f\"}"},{"__ref":"Favorites:{\"uuid\":\"d05aa58e-f892-4b20-b0a0-22766ef73e90\"}"},{"__ref":"Favorites:{\"uuid\":\"6ceefbf9-4439-4a7e-ac5e-60dd5dcdbc3f\"}"}],"causesSupported":[],"major":"Applied Economics and Management","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d5d8cbb9-93a6-4e71-928e-4ec476a622aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"e69c66c9-f155-4d51-bc76-5ee714200ce9\"}"},{"__ref":"DeepDives:{\"uuid\":\"d9cd4ad7-ba2f-4f73-8466-f29ef8437f62\"}"},{"__ref":"DeepDives:{\"uuid\":\"542de49b-9918-491f-a219-2e0dff405182\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cf36f61f-914d-4e6f-9c82-043a5ac9c504/-/preview/-/format/jpg/","https://ucarecdn.com/7dab0821-e854-41af-9a06-4a3a920390c8/-/preview/-/format/jpg/","https://ucarecdn.com/7e47fca1-0a4f-4706-aa0a-5694eeb9a154/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"M
