xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"5b2f49d4-11ad-4af2-824f-1ff5dcb51de3\"}":{"__typename":"CausesSupported","uuid":"5b2f49d4-11ad-4af2-824f-1ff5dcb51de3","name":"Red Cross","description":"\u003cp\u003eJust one blood donation can save up to three lives!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"943b674a-5cd4-4182-a42b-f32b28c0952e\"}":{"__typename":"DeepDives","uuid":"943b674a-5cd4-4182-a42b-f32b28c0952e","content":"\u003cp\u003eMy greatest role model is my mom, who was actually a teacher herself! I love tutoring and mentorship because I was raised by such a patient, kind, and smart role model who showed me the most effective and helpful ways of working with people and teaching new concepts. When I teach, I feel like her, and am grateful I had such an incredible teacher in my life to show me what a good mentor should look like. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"afbde3ba-c084-48ce-bd54-9e4b12950708\"}":{"__typename":"DeepDives","uuid":"afbde3ba-c084-48ce-bd54-9e4b12950708","content":"\u003cp\u003eI hope to make a positive change in the world and in people's lives, and to do so with kindness and compassion. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"22c631c8-98bc-46c8-bc93-05f2389d3a8d\"}":{"__typename":"DeepDives","uuid":"22c631c8-98bc-46c8-bc93-05f2389d3a8d","content":"\u003cp\u003eI loved school! I was involved in many different clubs, loved playing volleyball, and performed in all of the school musicals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7068b402-c611-4813-b985-e04fc064c1f2\"}":{"__typename":"DeepDives","uuid":"7068b402-c611-4813-b985-e04fc064c1f2","content":"\u003cp\u003eDon't be afraid to try new things! There are so many opportunities at school to get involved in a new hobby or passion. You are learning so much about yourself, so now is the time to step out of your comfort zone and do something you've always thought of trying, like a new school club or program!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"de4043c3-3811-469d-95c7-f8184ba38929\"}":{"__typename":"School","uuid":"de4043c3-3811-469d-95c7-f8184ba38929","name":"The Emery/Weiner School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77025"},"Education:{\"uuid\":\"cffd833c-68cb-4a41-90c7-6ec6c93efa94\"}":{"__typename":"Education","uuid":"cffd833c-68cb-4a41-90c7-6ec6c93efa94","school":{"__ref":"School:{\"uuid\":\"de4043c3-3811-469d-95c7-f8184ba38929\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"2a4ee0a1-63df-411f-803c-3e761ef22252\"}":{"__typename":"Education","uuid":"2a4ee0a1-63df-411f-803c-3e761ef22252","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Cognitive Neuroscience \u0026 Evolutionary Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"5dd0ffcb-7de5-43b4-884b-6d8c32421791\"}":{"__typename":"MentorPublicProfile","uuid":"5dd0ffcb-7de5-43b4-884b-6d8c32421791","displayName":"Carly T.","slug":"carly-tiras","biography":"\u003cp\u003eCarly graduated from Harvard in 2023 with high honors, majoring in Cognitive Neuroscience and Evolutionary Psychology on the Pre-medical track. At Harvard, she was the President of an award-winning a cappella group, and on the executive board of Harvard Society for Mind, Brain, \u0026amp; Behavior, fostering community through professional panels and academic events for students in STEM. She also worked in a lab at Boston Children's Hospital as a student researcher and experimenter under Dr. Charles Nelson that studied brain and behavioral development in children. Growing up in Houston, TX, Carly was salutatorian at The Emery/Weiner School and studied AP U.S. History, AP English, AP Physics, and more. \u003cbr\u003e\u003cbr\u003eCarly worked at the biotechnology company developing an Alzheimer's therapy from 2020-2021 during the pandemic. She also lead student service trips through Harvard's public service organization, and tutored middle and high school students online throughout college. \u003cbr\u003e\u003cbr\u003eCarly invests in her love of singing  through performing with her band and singing with her a cappella group in college. She also loves cooking for her family and friends in her free time. Carly has a passion for teaching, tutoring and mentoring kids of all ages and abilities since high school. She looks forward to amazing mentorship experiences with Curious Cardinals!\u003c/p\u003e","teachingVideoPlaybackId":"GZfEddI6KhGZiG9VN3aueT01wvxqicvLai8aZBctKPsQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am proud of completing my honors thesis my senior year of college, and receiving a \"Women in Excellence\" research conference award, as well as High Honors for my thesis research! It was one of the most difficult projects I have ever taken on, so these acknowledgements meant the world!\u003c/p\u003e","favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5b2f49d4-11ad-4af2-824f-1ff5dcb51de3\"}"}],"major":"Cognitive Neuroscience \u0026 Evolutionary Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"943b674a-5cd4-4182-a42b-f32b28c0952e\"}"},{"__ref":"DeepDives:{\"uuid\":\"afbde3ba-c084-48ce-bd54-9e4b12950708\"}"},{"__ref":"DeepDives:{\"uuid\":\"22c631c8-98bc-46c8-bc93-05f2389d3a8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"7068b402-c611-4813-b985-e04fc064c1f2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7b032a25-5c6b-4ca9-8842-06fc145c19b9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cffd833c-68cb-4a41-90c7-6ec6c93efa94\"}"},{"__ref":"Education:{\"uuid\":\"2a4ee0a1-63df-411f-803c-3e761ef22252\"}"}],"hiredAt":"2023-09-26T14:22:17.591Z","topics":["STEM Project","Pre-Algebra","K-5 Grade Math","Geometry","Precalculus / Trigonometry","Writing","College Essay Writing","6-8 Grade Science","Chemistry","Biology","Medicine / Health","Global Health"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"carly-tiras\"}})":{"__
