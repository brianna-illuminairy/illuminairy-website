xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2ba134e8-2c14-4db3-b98b-1bfb6621b68d\"}":{"__typename":"DeepDives","uuid":"2ba134e8-2c14-4db3-b98b-1bfb6621b68d","content":"\u003cp\u003eI think my general advice is to follow your passions and explore your curiosities. Something my parents and my teachers always taught me in middle school and high school was that this is the time where you can explore any obsession you have without any worries. I found this to be so impactful, especially in my college years, as my obsessions in middle school and high school about space influenced me to pursue rocketry and eventually statistics. Similarly, my interest in reading Shakespeare allowed me to pursue comedy and eventually fiction writing as a deep passion of mine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a31ab833-09e0-46eb-ab21-3bf991e7e9d9\"}":{"__typename":"DeepDives","uuid":"a31ab833-09e0-46eb-ab21-3bf991e7e9d9","content":"\u003cp\u003eOne of my obsessions is writing comedies, especially action comedies and romantic comedies. One thing I hope to accomplish in my lifetime is to sell a script to a movie studio. This would be such a full circle moment for me because it was watching plays and adaptations of Shakespeare, such as the Leonardo DiCaprio modernized version of Romeo and Juliet, that inspired me to pursue writing fiction as a hobby. The opportunity to contribute to that ecosystem is something I'd love to do. I'm really excited about the chance to potentially inspire future generations about the joy of storytelling.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4316748a-25c3-4414-80fc-fb48c72a7181\"}":{"__typename":"DeepDives","uuid":"4316748a-25c3-4414-80fc-fb48c72a7181","content":"\u003cp\u003eEven though I know that there's a lot more life to live and a lot more things I want to accomplish in my life, I'm proud of the person that I am today, especially looking at the battles that I overcame and the obstacles that I went through. This happened because of my teachers and parents who mentored me and provided guidance when it came to trying to pursue my interests and what it meant to follow a path that wasn't really strictly set out.\u003c/p\u003e\u003cp\u003eI didn't really see people that were trying to do what I was wanting to do, so in college I reached out to so many alumni of my University, and they provided lots of guidance about the lessons they learned and how I should respond to my own challenges. Actively pursuing mentorship myself has impacted my life, and I want to give that same opportunity to other people. There were people that believed in me and gave me opportunities, and I want to be that person for other people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9e096c5a-2367-4326-8a2a-761ad9682c5f\"}":{"__typename":"DeepDives","uuid":"9e096c5a-2367-4326-8a2a-761ad9682c5f","content":"\u003cp\u003eIn high school, especially in the summers, I would go back to India. I spent three summers in India, and there was a blind school right next to my uncle's house where I would spend my summers volunteering and trying to help in any way that I could. This looked like cooking for them as well as trying to teach mathematics, English, and my native language of Telugu.\u003c/p\u003e\u003cp\u003eI really enjoyed these summers for several reasons. The first was it was an opportunity to absorb myself into the culture. I am Indian, but I haven't really spent extended time in India. I know lots of Indians in America, but I don't know a lot of Indian people my age in India, so this was a really good opportunity for me to talk to, hang out with, and make friends with other people like myself.\u003c/p\u003e\u003cp\u003eIn middle school, I would spend lots of time volunteering in senior living facilities, and one of the key lessons that really informed me ever since I started volunteering in middle school is the notion that people are very different but they're a lot more similar than you actually think. This gave me a North Star goal: the goal being that I want to actively try to find what I have in common with other people and try to connect with people, especially those who seem to be a lot different than me, who live different lives than me. This time in the blind school in India during my summers in high school was a great chance for me to better understand life in India as well as try to communicate with people, especially considering the fact that while being blind may provide one constraint when it comes to communicating with another person.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"ce771550-46c4-48b7-8465-3e086ee83ece\"}":{"__typename":"School","uuid":"ce771550-46c4-48b7-8465-3e086ee83ece","name":"Harmony Science Academy Houston","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77099"},"Education:{\"uuid\":\"9ae7372d-59d4-4c68-abb5-4a408c5877db\"}":{"__typename":"Education","uuid":"9ae7372d-59d4-4c68-abb5-4a408c5877db","school":{"__ref":"School:{\"uuid\":\"ce771550-46c4-48b7-8465-3e086ee83ece\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"2b965923-a6db-4598-bcf5-b00c7651f5d3\"}":{"__typename":"Education","uuid":"2b965923-a6db-4598-bcf5-b00c7651f5d3","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Statistical Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"3640745e-d9d8-478a-8e78-5cad0fa8445e\"}":{"__typename":"MentorPublicProfile","uuid":"3640745e-d9d8-478a-8e78-5cad0fa8445e","displayName":"Kartik C.","slug":"kartik-chamarti","biography":"\u003cp\u003eMy name is Kartik Chamarti. I care deeply about health disparities, applying statistics to the real world, and writing fiction. I studied statistics and took many classes related to Global Health, sociology, and economics, which are all topics I'm super passionate about. I really appreciate how statistics applies to so many different disciplines, which is why it's a topic I'm deeply interested in.\u003c/p\u003e\u003cp\u003eDuring my time in college, I spent a lot of time working at different startups and trying to build businesses myself, along with volunteering for different health clinics to help people in the greater college community with access to healthcare. I also did lots of stand-up comedy, which really helped me connect with people and think creatively. As someone who studied statistics and took many quantitative classes, I'm passionate about the importance of creative thinking for STEM students, so please reach out if you're interested in exploring creativity in STEM fields.\u003c/p\u003e\u003cp\u003eFor my work-study, I tutored and served as a teaching assistant for several classes, which I really enjoyed, especially sharing my passion of statistics. I also worked at a high school to educate computer science students about ethics in technology. I worked extensively with that curriculum and introduced it to the high school.\u003c/p\u003e\u003cp\u003eRight now professionally, I am working as a data scientist and building businesses on the side.\u003c/p\u003e\u003cp\u003eSome unique experiences I've had include being involved with the publication of a couple of papers. In high school, I competed in computer science and rocketry at a pretty high level as my school reached the national level and competed for two years.\u003c/p\u003e","teachingVideoPlaybackId":"V5ENrp66Dg85S00OEyalapRE004BxlmDTK9Brzm6CA00xo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistical Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2ba134e8-2c14-4db3-b98b-1bfb6621b68d\"}"},{"__ref":"DeepDives:{\"uuid\":\"a31ab833-09e0-46eb-ab21-3bf991e7e9d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"4316748a-25c3-4414-80fc-fb48c72a7181\"}"},{"__ref":"DeepDives:{\"uuid\":\"9e096c5a-2367-4326-8a2a-761ad9682c5f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a95e79f2-4c41-43d9-8a2a-ba230158db81/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"9ae7372d-59d4-4c68-abb5-4a408c5877db\"}"},{"__ref":"Education:{\"uuid\":\"2b965923-a6db-4598-bcf5-b00c7651f5d3\"}"}],"hiredAt":"2025-04-22T10:
