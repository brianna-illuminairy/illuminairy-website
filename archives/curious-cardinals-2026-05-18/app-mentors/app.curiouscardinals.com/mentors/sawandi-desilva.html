xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1c89c642-82d5-4c40-a76b-11402becacd7\"}":{"__typename":"Favorites","uuid":"1c89c642-82d5-4c40-a76b-11402becacd7","photoUrl":"https://ucarecdn.com/02e04d63-2dd7-4222-82f4-f574ded01af6/","title":"Parasite","type":"MOVIE"},"Favorites:{\"uuid\":\"96b98f8b-f9b6-44aa-b855-f66952963e59\"}":{"__typename":"Favorites","uuid":"96b98f8b-f9b6-44aa-b855-f66952963e59","photoUrl":"https://ucarecdn.com/559c6e4e-275d-4368-b92d-eeaa5b616cb2/","title":"The Weeknd","type":"ARTIST"},"Favorites:{\"uuid\":\"f73840d5-1379-4273-93de-7502262e7f35\"}":{"__typename":"Favorites","uuid":"f73840d5-1379-4273-93de-7502262e7f35","photoUrl":"https://ucarecdn.com/767c24ef-72d5-49a7-81e4-77a03ec1233c/","title":"Florence Pugh","type":"ACTOR"},"CausesSupported:{\"uuid\":\"0c412f3a-6db5-40b4-9414-dc339341e7aa\"}":{"__typename":"CausesSupported","uuid":"0c412f3a-6db5-40b4-9414-dc339341e7aa","name":"American Cancer Society","description":"\u003cbr\u003e","photoUrl":"https://ucarecdn.com/f16bfcaa-a450-475d-9132-591c8ddc14d5/"},"CausesSupported:{\"uuid\":\"7745270a-be12-47c2-9651-7ddd3a3e2c60\"}":{"__typename":"CausesSupported","uuid":"7745270a-be12-47c2-9651-7ddd3a3e2c60","name":"Global Medical Brigades","description":"","photoUrl":"https://ucarecdn.com/501aebec-950e-452f-817c-4cd3003ee81e/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1f29d8df-1c6a-4438-b3be-8c9f27877e6b\"}":{"__typename":"DeepDives","uuid":"1f29d8df-1c6a-4438-b3be-8c9f27877e6b","content":"\u003cp\u003eMentorship is important to me because I feel like having someone in your life to be inspired by and someone to support you makes a big difference in our outcomes. For me, mentorship goes beyond academics. Having two older brothers has ensured that I have two people to take after, but I \u003c/p\u003e\u003cp\u003eacknowledge that everyone does not have the same experience. Some of the most meaningful growth happens when a student starts to believe in their own abilities, and I see mentorship as a way to help build that confidence step by step.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eKnowing this, I have heavily prioritized being able to adapt and learning to meet someone where they are in order to successfully create an impact. I also care deeply about access to education and making sure students feel supported regardless of their starting point and what matters the most is not only their grades but their success as a whole person.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6473308c-1cc5-4d70-bd69-a5933823d7d8\"}":{"__typename":"DeepDives","uuid":"6473308c-1cc5-4d70-bd69-a5933823d7d8","content":"\u003cp\u003eMy dream job is to one day work in the healthcare field and ultimately become a doctor. I have always been drawn to the idea of combining science with meaningful, human-centered work, and medicine allows me to do exactly that. What excites me most about becoming a physician is the opportunity to make a direct and lasting impact on people’s lives. Whether it’s helping a patient navigate a difficult diagnosis, providing reassurance during uncertain times, or simply being someone they can trust, I want to play a role in improving both physical health and overall well-being. I value the ability to build relationships with patients and be a source of support during some of their most vulnerable moments.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a19d50cd-c436-4e7e-852a-0aee238dadcc\"}":{"__typename":"DeepDives","uuid":"a19d50cd-c436-4e7e-852a-0aee238dadcc","content":"\u003cp\u003eIn my spare time, I enjoy soaking up the sun and exploring nature. Going to school in Ithaca has been such a great outlet for me to embrace being outside and find new hobbies. When it is warmer out, my friends and I especially enjoy having picnics and swimming at local waterfalls.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn my own, I enjoy reading and watching psychological thrillers. Something I have been getting into recently is DJ'ing. While it is niche, it has been incredibly enjoyable to navigate and experiment with. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"82b1de6c-a46d-4b6d-a674-891861f5ba71\"}":{"__typename":"DeepDives","uuid":"82b1de6c-a46d-4b6d-a674-891861f5ba71","content":"\u003cp\u003eI would tell my middle and high school self to stop comparing myself to other people. For the longest time, I judged my success off of what I knew other people were doing and getting done. It’s so easy to look around and feel like everyone else is doing better, achieving more, or figuring things out faster but that mindset only takes away from your own growth.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eConstantly comparing yourself can hold you back from taking risks. When you’re too focused on how you measure up to others, you might avoid trying new things or putting yourself out there because you’re afraid of not being “good enough.” In reality, those are the exact moments that help you grow the most. Individuality is a strength and that is something I wish I could tell myself then.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"df416fa2-9c64-4656-8a90-5494ff414c5d\"}":{"__typename":"School","uuid":"df416fa2-9c64-4656-8a90-5494ff414c5d","name":"Susan E. Wagner High School","city":"Staten Island","type":"HIGH","state":"New York","country":"United States","zip":"10306"},"Education:{\"uuid\":\"c5ff68a8-a97c-46f6-be09-948122a6db8f\"}":{"__typename":"Education","uuid":"c5ff68a8-a97c-46f6-be09-948122a6db8f","school":{"__ref":"School:{\"uuid\":\"df416fa2-9c64-4656-8a90-5494ff414c5d\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"ee2e7b10-b958-4491-aefd-606c94850fac\"}":{"__typename":"Education","uuid":"ee2e7b10-b958-4491-aefd-606c94850fac","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"8721288f-67a2-488f-9761-6b2f6ccf65ce\"}":{"__typename":"MentorPublicProfile","uuid":"8721288f-67a2-488f-9761-6b2f6ccf65ce","displayName":"Sawandi D.","slug":"sawandi-desilva","biography":"\u003cp\u003e\u003cstrong\u003eHello everyone!\u003c/strong\u003e My name is Sawandi and I am currently completing my third year at Cornell University, pursuing a Bachelor of Science in Biological Sciences along with a minor in Moral Psychology. I am deeply passionate about both science as well as understanding how people think and make decisions, which are topics that strongly shape my approach to mentoring. I was born and raised in Staten Island NY, and graduated from Susan E. Wagner High School as Student Government President in addition to serving as captain of multiple extracurricular organizations. During this time, I took part in a passion project of my own, as I worked closely with the Superintendent of my District. As I reflected on ways to improve my high school community, I recognized a major gap in how student achievements were being shared and celebrated.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDespite incredible accomplishments such as the school band becoming finalists in the Essentially Ellington competition and performing alongside renowned jazz director Wynton Marsalis, or my Sri Lankan club earning the opportunity to perform at City Hall for an inaugural address, there was no central platform to highlight these successes. To address this, I worked closely with district leadership to design a blueprint for a school TV studio that would showcase student achievements and amplify student voices.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Cornell, I take part in academic and service-oriented roles such as being a study group leader for courses I have taken in the past, in addition to volunteering in various healthcare settings where I can support patients. Moreover, I have been fortunate enough to spend summers working as a lab technician in a diagnostic laboratory, gaining valuable hands-on experience and strengthening my analytical and problem-solving skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy involvement with students over the past four years has strengthened my ability to create authentic connections and collaborate on personalized learning plans tailored to each student’s needs. I believe that every student learns differently, and I prioritize adapting my teaching style to ensure that concepts are not only understood, but retained with confidence. With my creative mind, I also look forward to being a part of the thought process that will go into passion projects, unlocking each student’s capabilities by turning their interests into impressive accomplishments.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy love for community outreach health education such as leading HIV/AIDS workshops, working towards mentoring underserved students, truly reflects my commitment to making a meaningful difference. As a mentor, I strive to create a supportive and engaging environment where students feel comfortable asking questions and reaching their full potential.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"RCQRyq6i02HKP00IatyyK1d009G02v3lHpyjyVIkl2aN02GY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy biggest achievement so far in life has been getting into Cornell. For me, getting into Cornell wasn’t just about the outcome, it was living proof of the years of consistency, hard work, and pushing myself even when I wasn’t sure where it would lead. Throughout high school, I balanced academics and extracurriculars even in times where it felt overwhelming.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat makes this achievement especially meaningful to me is that it wasn’t a perfect journey. There were setbacks, moments of self-doubt, and a lot of comparison to others along the way. But instead of letting that stop me, I learned how to stay focused on my own path and keep showing up consistently. That mindset shift made all the difference.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I found out I got into Cornell, it felt like a full-circle moment, not just because of the school itself, but because it validated the effort, growth, and resilience that went into getting there. It was also a really special moment for my family, who have always supported me and pushed me to aim high.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"1c89c642-82d5-4c40-a76b-11402becacd7\"}"},{"__ref":"Favorites:{\"uuid\":\"96b98f8b-f9b6-44aa-b855-f66952963e59\"}"},{"__ref":"Favorites:{\"uuid\":\"f73840d5-1379-4273-93de-7502262e7f35\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0c412f3a-6db5-40b4-9414-dc339341e7aa\"}"},{"__ref":"CausesSupported:{\"uuid\":\"7745270a-be12-47c2-9651-7ddd3a3e2c60\"}"}],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1f29d8df-1c6a-4438-b3be-8c9f27877e6b\"}"},{"__ref":"DeepDives:{\"uuid\":\"6473308c-1cc5-4d70-bd69-a5933823d7d8\"}"},{"__ref":"DeepDives:{\"uuid\":\"a19d50cd-c436-4e7e-852a-0aee238dadcc\"}"},{"__ref":"DeepDives:{\"uuid\":\"82b1de6c-a46d-4b6d-a674-891861f5ba71\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0a599d2a-1022-4771-be67-748bb1596259/-/preview/-/format/jpg/","https://ucarecdn.com/3ec873bf-5d3c-47a2-a166-af0ab5c65f68/-/preview/-/format/jpg/","https://ucarecdn.com/782b566f-ed26-4474-9fea-d1028a4b197a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c5ff68a8-a97c-46f6-be09-948122a6db8f\"}"},{"__ref":"Education:{\"uuid\":\"ee2e7b10-b958-4491-aefd-606c94850fac\"}"}],"hiredAt":"2026-04-08T03:30:21.717Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Film / Theater","Sports Journalism","History Project","Video / Photography","Medicine / Health","STEM Project","Law / Government / Policy","Journalism","Sustainability","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"rest
