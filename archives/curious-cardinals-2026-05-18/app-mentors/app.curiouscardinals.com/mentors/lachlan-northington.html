xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a92279ab-7250-4268-a6e2-0380c9111d0c\"}":{"__typename":"Favorites","uuid":"a92279ab-7250-4268-a6e2-0380c9111d0c","photoUrl":"https://ucarecdn.com/8c40c86f-1649-4d9b-a78f-e33c1dd63903/","title":"Frances McDormand","type":"ACTOR"},"Favorites:{\"uuid\":\"528e9b8e-5e48-4847-bb69-3e03ca242a17\"}":{"__typename":"Favorites","uuid":"528e9b8e-5e48-4847-bb69-3e03ca242a17","photoUrl":"https://ucarecdn.com/07bd54d5-3300-4982-a668-68ad5e3d7ecd/","title":"The Miseducation of Lauryn Hill","type":"ALBUM"},"Favorites:{\"uuid\":\"1408f675-5220-4be5-b3a2-51c51fdbe29a\"}":{"__typename":"Favorites","uuid":"1408f675-5220-4be5-b3a2-51c51fdbe29a","photoUrl":"https://ucarecdn.com/1c5116d2-91a4-4c72-94c1-38751bc8f472/","title":"Cape Town","type":"CITY"},"CausesSupported:{\"uuid\":\"6bfc9b7c-d4af-42f0-a9d1-76712e66cf8c\"}":{"__typename":"CausesSupported","uuid":"6bfc9b7c-d4af-42f0-a9d1-76712e66cf8c","name":"St. Francis Inn","description":"\u003cp\u003eSupporting St. Francis Inn is a way to treat the homeless with dignity and love.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/2bc22b4a-b747-4734-bebd-cc07c9795d04/"},"CausesSupported:{\"uuid\":\"a129be9b-3427-491d-a6c5-047894b78911\"}":{"__typename":"CausesSupported","uuid":"a129be9b-3427-491d-a6c5-047894b78911","name":"American Foundation for Suicide Prevention","description":"\u003cp\u003eUntreated and unrecognized depression is rampant, especially in boys/young men. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/53b8fa96-7505-4540-a1fd-2426489a4652/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6f771535-250a-4315-ab61-98ac1c49168a\"}":{"__typename":"DeepDives","uuid":"6f771535-250a-4315-ab61-98ac1c49168a","content":"\u003cp\u003eFigure out what you love, what you truly love, and do it as much as you can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"cae795b4-b3eb-487a-9fb6-2c2fc8b20da3\"}":{"__typename":"DeepDives","uuid":"cae795b4-b3eb-487a-9fb6-2c2fc8b20da3","content":"\u003cp\u003eI am currently working on expanding a short story into a novella, or maybe if I'm lucky, a full-fledged novel. I have always loved writing stories, and have had many ideas for longer, more fleshed out pieces, yet found these ideas very difficult to realize in practice. However, recently I revisited a story I wrote some time ago, and found myself writing complementary sections so naturally that I think this thing has some latent promise I did not initially recognize (or care to). It's going well so far, but writing truly is a tricky endeavor. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"f4ec4dd8-b647-4291-ad6a-5a79be080a11\"}":{"__typename":"DeepDives","uuid":"f4ec4dd8-b647-4291-ad6a-5a79be080a11","content":"\u003cp\u003e\u003cbr\u003eI think young people today have an incredible amount of potential, maybe more than ever before. They are sharp, quick, and most importantly, compassionate. However, I also believe there are a tremendous amount of barriers, detriments and distractions about, almost certainly more than ever before. If in any way I can direct this overflow of talent through these barriers, past these detriments, and around these distractions, then I know I can help pave the way for a truly special generation, one the world may find itself needing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"bc820506-70f0-4bf9-9e28-61f12062c7de\"}":{"__typename":"DeepDives","uuid":"bc820506-70f0-4bf9-9e28-61f12062c7de","content":"\u003cp\u003eEnter Wikipedia wormholes, play pickup sports and hang out with my pets.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"0249d787-af37-406d-b783-47868dd5f960\"}":{"__typename":"School","uuid":"0249d787-af37-406d-b783-47868dd5f960","name":"Harriton High School","city":"Bryn Mawr","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19010"},"Education:{\"uuid\":\"633b29a8-2995-4e41-aee9-d610d0830664\"}":{"__typename":"Education","uuid":"633b29a8-2995-4e41-aee9-d610d0830664","school":{"__ref":"School:{\"uuid\":\"0249d787-af37-406d-b783-47868dd5f960\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"5898f7ed-0d0d-400b-acf0-ecc8f59ed201\"}":{"__typename":"Education","uuid":"5898f7ed-0d0d-400b-acf0-ecc8f59ed201","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Law, History and Society with a minor in Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"32ad7847-f394-41af-86bd-42645adffe79\"}":{"__typename":"MentorPublicProfile","uuid":"32ad7847-f394-41af-86bd-42645adffe79","displayName":"Lachlan  N.","slug":"lachlan-northington","biography":"\u003cp\u003eHey there! My name is Lachlan Northington. I was born in Philadelphia and raised in nearby Lower Merion, Pennsylvania, where I went to Harriton High School. I got my BA from Vanderbilt University, studying an array of disciplines including English composition, philosophy, history, film, and data science. Since graduating, I now work as a middle school social studies teacher in Bed-Stuy, Brooklyn (the best borough AND neighborhood in NYC).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have been a sports fanatic my entire life, though these days, I find myself caring the most about the NFL and European soccer (primarily the premier league, I've been a massive Liverpool fan since 5th grade.) Many kids love sports, and I feel as if teachers often miss out on an opportunity to capitalize on a passion that is often very translatable to academics. In my interview with Curious Cardinals, I actually did a demo lesson on literary theme which rested entirely on sports analogies!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also love music. My whole family sings, and my brother and I play instruments and write tunes together (none that are very good I'll admit). When I got my own Spotify towards the end of middle school, I got really into rap and hip hop. Artists like Anderson .Paak, Kendrick Lamar, Smino, etc. are still some of my favorites, but these days, all I really listen to are the Beatles. They're the greatest for a reason, but don't get me started, or I probably won't stop.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs you'll see all over my profile, stories are very important to me. George R.R. Martin and Stephen King have been very formative to me, and I find myself going back to their work quite frequently, with a few classics sprinkled in so I can maintain an air of snobbery. After being a TV guy most of my life (\u003cem\u003eThe Wire\u003c/em\u003e, \u003cem\u003eArrested Development\u003c/em\u003e, and \u003cem\u003eCommunity\u003c/em\u003e are easily my most revisited), these last few years I really only watch movies. A quick blurb won't do it justice, but I am \u003cem\u003eobsessed\u003c/em\u003e with the Coen brothers, Hayao Miyazaki, and Terry Gilliam.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile I am extremely passionate about politics and cultural criticism, a quick blurb \u003cem\u003edefinitely \u003c/em\u003ewon't accomplish much here. However, if this is the wheelhouse of any student, just know that it is for me too!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up with athletics, the arts, and academics all pushed and prioritized by my parents and family at large, for which I am very thankful. From church choir and piano, to football and ski racing, to Latin club and student government, I have been fortunate enough to lead the life of a well rounded student, and I hope to impress the importance of this diversity of focus on the next generation of thinkers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also grew up in a very big family. Having an older brother and two younger sisters is one thing, but I am also exceedingly close to my first, second and third cousins (even once or twice removed), aunts and uncles, great-aunts and great-uncles, and everything in between. Spending so much time with different families within one great one has affected me in ways I can't even begin to articulate, but most fundamentally, I believe that I have learned to see and love people for who they are, and what they can be, instead of comparing them to what they're not.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI chose to go into teaching and mentorship because I am passionate and excited, yet concerned for the future of this world, our generation and the ones that will follow. Technology has already long been inhibiting true, deep learning, and with the onset of the A.I. revolution, it now seems that more and more young people don't see the reason in \u003cem\u003eusing their own brain anymore\u003c/em\u003e. Books aren't being read, essays aren't being written; what used to be the easiest and most accessible forms of entertainment, movies and TV, are now being reduced to clips on social media, as attention spans shrink and splinter by the day.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThere is no easy solution to these issues. Who knows if there is even a hard one. However, talking (not lecturing) about these trends with young people, making sure we all recognize their gravity and danger, is undeniably a first step. One I don't see being taken as much as I think it needs to be.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe world is changing, and more and more seems possible by the day. How can we make sure this change is for the better?\u003c/p\u003e","teachingVideoPlaybackId":"a67XVqZufo029WM3005O00Fw601lWl1K3rsxOvcIG3MQCiM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm very proud of how I helped raise my sisters, and the young women that they have become. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a92279ab-7250-4268-a6e2-0380c9111d0c\"}"},{"__ref":"Favorites:{\"uuid\":\"528e9b8e-5e48-4847-bb69-3e03ca242a17\"}"},{"__ref":"Favorites:{\"uuid\":\"1408f675-5220-4be5-b3a2-51c51fdbe29a\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6bfc9b7c-d4af-42f0-a9d1-76712e66cf8c\"}"},{"__ref":"CausesSupported:{\"uuid\":\"a129be9b-3427-491d-a6c5-047894b78911\"}"}],"major":"Law, History and Society with a minor in Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6f771535-250a-4315-ab61-98ac1c49168a\"}"},{"__ref":"DeepDives:{\"uuid\":\"cae795b4-b3eb-487a-9fb6-2c2fc8b20da3\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4ec4dd8-b647-4291-ad6a-5a79be080a11\"}"},{"__ref":"DeepDives:{\"uuid\":\"bc820506-70f0-4bf9-9e28-61f12062c7de\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1d022719-b685-42eb-a04c-45737ea31b7f/-/preview/-/format/jpg/","https://ucarecdn.com/8c5ee4d8-0d14-43ef-975a-13e9b5ac3f0a/-/preview/-/format/jpg/","https://ucarecdn.com/9e3f9232-fd05-4eab-90dd-e58e074f1a48/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"633b29a8-2995-4e41-aee9-d610d0830664\"}"},{"__ref":"Education:{\"uuid\":\"5898f7ed-0d0d-400b-acf0-ecc8f59ed201\"}"}],"hiredAt":"2025-07-02T15:12:36.180Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Statistics","Algebra II","Geometry","6-8 Grade Science","Biology","Writing","College Essay Writing","Academic Coaching","Reading","History","Executive Function","Creative Writing","Music","Film / Theater","Sports Journalism","History Project","Video / Photography","Sports Analytics","Law / Government / Policy","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lachlan-northington\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"32ad7847-f394-41af-86bd-42645adffe79\"}"}}},"_sentryTraceData":"e8f9a0ebfb364786998c758d13023d82-bad0df079fa5bc41-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc
