xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"84a47a3b-7719-4c78-9eee-847be538c9c5\"}":{"__typename":"CausesSupported","uuid":"84a47a3b-7719-4c78-9eee-847be538c9c5","name":"Movember","description":"\u003cp\u003eEvery November, I attempt to grow a mustache for the men's mental health charity\u003c/p\u003e","photoUrl":"https://ucarecdn.com/6a22950c-c524-4660-86b8-3d9eaf48245c/"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"1e47546d-61eb-44d5-871f-f10d268254b9\"}":{"__typename":"DeepDives","uuid":"1e47546d-61eb-44d5-871f-f10d268254b9","content":"\u003cp\u003eI love the concept of mentorship - I found it massively helpful growing up myself. I frequently asked older students at school for advice on the Classes I took, and I continue to ask people today for advice on careers and jobs. Hence, when I saw the methodology of mentorship which Curious Cardinals employs, I was adamant that it was a perfect fit for me! The idea of being a role model for my mentees is super authentic, and closely aligns with my values and ideas towards teaching. I'm also excited about the idea of working for an American firm, as I believe my somewhat different British upbringing will help to promote fresh, well-rounded ideas to share with my mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b4a9e305-a836-4bea-8443-c69457cb9260\"}":{"__typename":"DeepDives","uuid":"b4a9e305-a836-4bea-8443-c69457cb9260","content":"\u003cp\u003eWhilst watching Wolf of Wall Street and the Big Short may have been my first introduction to the world of economics, I can't say they are the reason for my passion! I love learning about the rationale behind major macroeconomic decisions, and how such fine changes to policy can cause tremors felt throughout an economy. The blend of mathematical, analytical and linguistic skills also sit very closely to my personal skill-set, so the subject has always come really naturally for me (hopefully continuing throughout Uni!), which is another reason why I enjoy it so much.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"bcba3c43-7371-4ae5-83cc-25fc6887ad62\"}":{"__typename":"DeepDives","uuid":"bcba3c43-7371-4ae5-83cc-25fc6887ad62","content":"\u003cp\u003eAs I moved into high school, I started to become far more confident in sharing my ideas, and really having trust in my capabilities. This made a massive difference to my school life, whether that be in the classroom, or on the sports pitch. Through Curious Cardinals, I want to help as many people as possible feel confident in themselves, and fully utilize the talent they have.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c4d469b2-b5fa-48c4-88a9-107213856ce3\"}":{"__typename":"DeepDives","uuid":"c4d469b2-b5fa-48c4-88a9-107213856ce3","content":null,"videoPlaybackId":"KZyWqN8xqBri2cCygXksgUzShGbH44COc6MVZBxgGcs","question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"c0812755-de4e-4caa-8c57-e64d59634dc8\"}":{"__typename":"School","uuid":"c0812755-de4e-4caa-8c57-e64d59634dc8","name":"Wellington College","city":"Crowthorne","type":"HIGH","state":"Berkshire","country":"United Kingdom","zip":"RG45 6BJ"},"Education:{\"uuid\":\"9b184094-3e53-46f7-a468-9507df314362\"}":{"__typename":"Education","uuid":"9b184094-3e53-46f7-a468-9507df314362","school":{"__ref":"School:{\"uuid\":\"c0812755-de4e-4caa-8c57-e64d59634dc8\"}"},"startYear":"2018","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"789daf65-2263-4f88-a48d-5a9450ee32b5\"}":{"__typename":"School","uuid":"789daf65-2263-4f88-a48d-5a9450ee32b5","name":"University of Bath","city":"Bath","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"BA2 7AY"},"Education:{\"uuid\":\"95166208-db1b-44fe-bcab-d897b6e1327f\"}":{"__typename":"Education","uuid":"95166208-db1b-44fe-bcab-d897b6e1327f","school":{"__ref":"School:{\"uuid\":\"789daf65-2263-4f88-a48d-5a9450ee32b5\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"Testimonial:6cf73217-efdf-4069-8d8c-b3eb954253e2":{"__typename":"Testimonial","id":"6cf73217-efdf-4069-8d8c-b3eb954253e2","text":"We are incredibly grateful for the support and guidance Jacques Edwards has provided to our 12-year-old, Nico over the past  9 months.\nHis calm, encouraging, and flexible approach made a remarkable difference—not only in our child’s academic performance, but in his overall confidence and attitude toward learning.\n\nThanks to Jacques’ clear explanations, patience, and inspiring presence, we’ve seen noticeable improvements across multiple subjects. More importantly, our child now approaches school with a renewed sense of motivation and self-belief.\n\nJacques has a wonderful gift for meeting students where they are, adapting with care and insight, and bringing out their best. It’s been a joy to work with such a dedicated and impactful educator.","date":"2025-05-31 10:57:10.296+00","rating":5,"endorser":{"__typename":"Endorser","name":"Jutta Guiati","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"60aa0a7a-78bc-4d91-972f-a77014c04f3c\"}":{"__typename":"MentorPublicProfile","uuid":"60aa0a7a-78bc-4d91-972f-a77014c04f3c","displayName":"Jacques E.","slug":"jacques-edwards","biography":"\u003cp\u003eHi there! My name is Jacques Edwards, an Economics undergraduate student studying in England at the University of Bath.\u003c/p\u003e\u003cp\u003eI'm a keen sportsman - I'm currently playing performance tennis at my Uni, and I have played in numerous tournaments worldwide, some even as far as Dubai! I am also a super passionate footballer - however, I enjoy playing that at a more social level with my friends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy primary academic interest lies with Macroeconomics, specifically examining policies and their impact on the economic landscape of individual countries. Hence, I am heavily interested in politics, whether that be here in the UK, or over in the US. This interest has introduced me to pertinent issues which governing bodies are required to tackle on a day-to-day basis. With this in mind, I have volunteered in various areas of my local community, including food banks, senior homes, and even children's football camps.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom and sport fields, I have set up my own economics mentoring society, where I would help to inspire younger students to pursue economics at High School and beyond, introducing them to the exciting opportunities which an economics degree can offer. I found providing clarity and guiding undecided students super rewarding – and this inspired me to join Curious Cardinals, as I can expand my reach even further! Recently, I completed a summer internship at Société Générale, one of Europe’s largest banks, which gave me valuable real-world experience. This firsthand insight allows me to better guide students who are considering a career in finance.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo relax, I love to watch movies, especially ones directed by Scorsese (except his new one albeit), and listen to music on vinyl, as I begin to expand my physical catalogue.\u003c/p\u003e","teachingVideoPlaybackId":"02Qd6zp003mVwNiwoyAoogQp37ZKO51gLHwTR85S0197fU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"84a47a3b-7719-4c78-9eee-847be538c9c5\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1e47546d-61eb-44d5-871f-f10d268254b9\"}"},{"__ref":"DeepDives:{\"uuid\":\"b4a9e305-a836-4bea-8443-c69457cb9260\"}"},{"__ref":"DeepDives:{\"uuid\":\"bcba3c43-7371-4ae5-83cc-25fc6887ad62\"}"},{"__ref":"DeepDives:{\"uuid\":\"c4d469b2-b5fa-48c4-88a9-107213856ce3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/346d0b63-be59-45a4-812c-a0590b49447d/-/preview/-/format/jpg/","https://ucarecdn.com/8b946927-1ccf-443f-bcc9-fa4f7eb0b19a/-/preview/-/format/jpg/","https://ucarecdn.com/77162360-9840-4ed2-8a8c-1aca22bd79b7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"9b184094-3e53-46f7-a468-9507df314362\"}"},{"__ref":"Education:{\"uuid\":\"95166208-db1b-44fe-bcab-d897b6e1327f\"}"}],"hiredAt":"2024-09-18T10:22:19.004Z","topics":["K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Algebra I","Algebra II","Sports Journalism","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:6cf73217-efdf-4069-8d8c-b3eb954253e2"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfi
