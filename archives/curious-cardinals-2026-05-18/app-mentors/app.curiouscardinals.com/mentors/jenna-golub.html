xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0d4bbd82-407a-4ca6-9c6a-a9107ad75837\"}":{"__typename":"Favorites","uuid":"0d4bbd82-407a-4ca6-9c6a-a9107ad75837","photoUrl":"https://ucarecdn.com/27dbce6f-f729-4961-890c-e904468904d4/","title":"Folklore by Taylor Swift","type":"ALBUM"},"Favorites:{\"uuid\":\"a5e50c63-4c9b-4e4e-9ec6-2b89cd88662b\"}":{"__typename":"Favorites","uuid":"a5e50c63-4c9b-4e4e-9ec6-2b89cd88662b","photoUrl":"https://ucarecdn.com/90d3d22e-5b42-4adf-ab40-94a551e79600/","title":"London, England","type":"CITY"},"Favorites:{\"uuid\":\"045e297b-209c-405d-95b0-7f3acaba5d4f\"}":{"__typename":"Favorites","uuid":"045e297b-209c-405d-95b0-7f3acaba5d4f","photoUrl":"https://ucarecdn.com/f313518a-16d3-4811-8843-eacd028375c8/","title":"Hamilton","type":"PLAY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"71a74fa1-5438-482e-ac57-ee9aa2b1ca90\"}":{"__typename":"DeepDives","uuid":"71a74fa1-5438-482e-ac57-ee9aa2b1ca90","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I would tell her that it's okay to make mistakes, as long as you learn from them! I used to spend so much time worrying about being the perfect student, and feeling a sense of shame or inadequacy when I couldn't live up to that. Now, I know that perfection is an impossible standard for anyone to hold themselves to. What truly matters is that you learn, grow, and improve as you move through school and life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"ba894900-b674-4d9d-af50-1da65479ef2b\"}":{"__typename":"DeepDives","uuid":"ba894900-b674-4d9d-af50-1da65479ef2b","content":"\u003cp\u003eMy dream job is to be a physician! I have always loved science, from my first high school biology class all the way until now. While I know being a doctor is challenging and requires immense discipline, I can't imagine myself in any other role. I'm excited by the prospect of being able to help people every day, while also working in a fast-paced job setting that is both stimulating and fulfilling. And, because medical knowledge is always changing and advancing, I can continue to learn about the subjects that inspire me most, even when I'm years out of school!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ff15b3c3-c2a5-41bf-a3aa-00ae875032c5\"}":{"__typename":"DeepDives","uuid":"ff15b3c3-c2a5-41bf-a3aa-00ae875032c5","content":"\u003cp\u003eI absolutely love to cook! I began cooking in high school, but it only consisted of helping my parents out in the kitchen. Once I got to college, I started to cook for myself, and really got to explore the types of foods I love while also staying healthy. I find cooking to be relaxing after a long day of classes and activities, and I'm always excited to make and try new recipes. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"ef7c8842-c29a-461a-b782-f5af3a250692\"}":{"__typename":"DeepDives","uuid":"ef7c8842-c29a-461a-b782-f5af3a250692","content":"\u003cp\u003eAs a high school student, I was a bit of a perfectionist. I strived for perfect grades, and held myself to an incredibly high standard. My parents always motivated me to be a dedicated student, and I internalized this motivation and used it to drive my academic performance and make myself proud. While school was my top priority, I also found it super important to make time for my friends and family - something that is still extremely important to me. Due to the academic rigor of my high school classes and the demands of my extracurricular activities, it wasn't until college that I really got to explore my likes and dislikes, hobbies, and things that inspire me outside of school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"66814611-55e3-400d-836f-9583f2af0c8c\"}":{"__typename":"School","uuid":"66814611-55e3-400d-836f-9583f2af0c8c","name":"Pascack Hills High School","city":"Montvale","type":"HIGH","state":"New Jersey","country":"United States","zip":"07645"},"Education:{\"uuid\":\"ab7bb7c1-033e-4eaa-b4b3-f887929f6485\"}":{"__typename":"Education","uuid":"ab7bb7c1-033e-4eaa-b4b3-f887929f6485","school":{"__ref":"School:{\"uuid\":\"66814611-55e3-400d-836f-9583f2af0c8c\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"eab1b0ac-fb05-4402-832c-78b8af394e87\"}":{"__typename":"Education","uuid":"eab1b0ac-fb05-4402-832c-78b8af394e87","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"bd000749-9a87-457d-8c30-e752086d1f80\"}":{"__typename":"MentorPublicProfile","uuid":"bd000749-9a87-457d-8c30-e752086d1f80","displayName":"Jenna G.","slug":"jenna-golub","biography":"\u003cp\u003eHi! My name is Jenna, and I am so excited to be a part of the Curious Cardinals community!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m currently a Biology major on the pre-med track at the University of Pennsylvania, with minors in Chemistry and Medical Sociology. I have always loved science, but over the past few years at college, I've gained a new appreciation for each of the core scientific disciplines. While the sciences are by far my favorite thing to learn about and teach, I also love English and history! Reading is one of my favorite hobbies, and even though I haven’t taken many formal English classes in college, I continue to read in my spare time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not studying or in class, you can probably find me in my laboratory. For the past few years, I’ve had the opportunity to conduct research in a lab focused on uncovering and analyzing neural circuits in the brain. This year, I’m working on my own independent project, which has been a thrilling experience. I’m very excited to see where this research will lead and how it might contribute to our understanding of brain function.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAside from my academics, a large part of my college career has been dedicated to extracurricular activities that align with my interests as a pre-med student. I spend a lot of my time shadowing different physicians and volunteering at my local hospital. I’m also currently in the process of getting certified as an EMT, which has been the most fascinating and rewarding experience! I can’t wait to put my certification to use in real-world settings, where I can make a tangible difference.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI decided to join the Curious Cardinals community because I’ve always loved working with students as a mentor. It’s a role that I find challenging but incredibly rewarding. I truly enjoy getting to know my mentees, understanding their individual needs, and helping them achieve their goals. I believe that school can be both difficult and fun, and my goal as a mentor is to make learning engaging, enjoyable, and meaningful! Most of all, I want to help you grow as a student and discover what excites you about learning.\u003c/p\u003e","teachingVideoPlaybackId":"rjcSnFjAAvZsq9C78kMscARQXJgO201di02htrAGOBzHA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0d4bbd82-407a-4ca6-9c6a-a9107ad75837\"}"},{"__ref":"Favorites:{\"uuid\":\"a5e50c63-4c9b-4e4e-9ec6-2b89cd88662b\"}"},{"__ref":"Favorites:{\"uuid\":\"045e297b-209c-405d-95b0-7f3acaba5d4f\"}"}],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"71a74fa1-5438-482e-ac57-ee9aa2b1ca90\"}"},{"__ref":"DeepDives:{\"uuid\":\"ba894900-b674-4d9d-af50-1da65479ef2b\"}"},{"__ref":"DeepDives:{\"uuid\":\"ff15b3c3-c2a5-41bf-a3aa-00ae875032c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"ef7c8842-c29a-461a-b782-f5af3a250692\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1303aa0e-cab7-48c5-b7ee-7f8973797bb3/-/preview/-/format/jpg/","https://ucarecdn.com/e693d131-3dba-4a1f-993d-aa064caca67f/-/preview/-/format/jpg/","https://ucarecdn.com/5c97fd06-a92a-4a00-9aec-45cfc5fab7e2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ab7bb7c1-033e-4eaa-b4b3-f887929f6485\"}"},{"__ref":"Education:{\"uuid\":\"eab1b0ac-fb05-4402-832c-78b8af394e87\"}"}],"hiredAt":"2024-11-07T09:49:27.777Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Chemistry","Biology","Physics","Academic Co
