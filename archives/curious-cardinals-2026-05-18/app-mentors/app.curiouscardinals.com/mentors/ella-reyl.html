xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ae32f0e0-e062-402e-a61d-8fedd4588c44\"}":{"__typename":"DeepDives","uuid":"ae32f0e0-e062-402e-a61d-8fedd4588c44","content":"\u003cp\u003eIn my spare time, I love cooking with my mom. I'm usually her sous chef, prepping ingredients and learning her techniques. We've cooked together for as long as I can remember, and I've picked up so many of her recipes over the years.\u003c/p\u003e\u003cp\u003eI'm also the person who will plan my entire day around going to the movie theater with friends. There's nothing like seeing a film on the big screen, and I love the whole ritual of it—getting there early, debating what we just watched afterward, the whole experience.\u003c/p\u003e\u003cp\u003eI'm also always taking pictures of my friends and family. I love capturing little moments and then making albums to document everything. It's become my way of preserving memories and creating something tangible from all the time we spend together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f7ad1359-11e6-4242-a85e-2e52cdf9c757\"}":{"__typename":"DeepDives","uuid":"f7ad1359-11e6-4242-a85e-2e52cdf9c757","content":"\u003cp\u003eMy dream job would be to write, direct, and produce a tv show with my best friends!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"dcba3765-f563-46ea-891c-87f98100d517\"}":{"__typename":"DeepDives","uuid":"dcba3765-f563-46ea-891c-87f98100d517","content":"\u003cp\u003eI've always been interested in current events and politics, so Government felt like a natural choice. In high school, I did the International Baccalaureate program and studied Global Politics, which I absolutely loved. It confirmed that I wanted to keep studying how political systems work and how they shape people's lives.\u003c/p\u003e\u003cp\u003eFilm has been a passion since I was a kid, and studying it gave me a way to understand storytelling on a deeper level. The combination of Government and Film actually worked really well together. Both are about understanding narratives, whether it's how political stories are told or how filmmakers shape the way we see the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"70b0193a-534c-4c60-89ca-24b0bc528972\"}":{"__typename":"DeepDives","uuid":"70b0193a-534c-4c60-89ca-24b0bc528972","content":"\u003cp\u003eI'd tell myself not to stress so much about having a perfectly linear path. I put a lot of pressure on myself to have everything mapped out, but the reality is that your interests develop in ways you can't always predict. I'd also encourage myself to take more intellectual risks, to pursue opportunities that felt uncomfortable or uncertain. Some of my most formative experiences came from saying yes to things I wasn't sure I was ready for.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"78b1159e-a6a9-442e-a954-d7c84bd0cdfc\"}":{"__typename":"School","uuid":"78b1159e-a6a9-442e-a954-d7c84bd0cdfc","name":"The Clinton School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10003"},"Education:{\"uuid\":\"fc47d8f8-6380-4100-97fa-4561ec5aaddc\"}":{"__typename":"Education","uuid":"fc47d8f8-6380-4100-97fa-4561ec5aaddc","school":{"__ref":"School:{\"uuid\":\"78b1159e-a6a9-442e-a954-d7c84bd0cdfc\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc\"}":{"__typename":"School","uuid":"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc","name":"Claremont McKenna College","city":"Claremont","type":"COLLEGE","state":"California","country":"United States","zip":"91711"},"Education:{\"uuid\":\"3cc68075-86ad-4dd8-8075-b2facbaa18aa\"}":{"__typename":"Education","uuid":"3cc68075-86ad-4dd8-8075-b2facbaa18aa","school":{"__ref":"School:{\"uuid\":\"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Government, Film","degree":null},"MentorPublicProfile:{\"uuid\":\"cf561104-bc62-406e-ab75-92d59be32dcd\"}":{"__typename":"MentorPublicProfile","uuid":"cf561104-bc62-406e-ab75-92d59be32dcd","displayName":"Ella R.","slug":"ella-reyl","biography":"\u003cp\u003eElla is a recent graduate of Claremont McKenna College, where she studied Film Studies and Government. Growing up in New York City as a twin with two sisters, Ella was surrounded by women — her cousins, her relatives, her whole world was filled with strong female voices. She spent her childhood bouncing between the gymnastics gym and her parents' dinner parties, where she'd sit quietly at the table, soaking up the adults' conversations about current events and politics. From the time she was a little kid, she loved movies just as much, captivated by how stories could transport you somewhere completely different.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eElla is half French, and it's a core part of her identity. Her dad has always spoken to her and her sisters exclusively in French, and she grew up spending time with family in France and Switzerland. That early fluency in navigating different cultures and languages shaped how she approaches storytelling and her academics. At Claremont McKenna, she conducted research for government and history professors and wrote her senior thesis on international politics, drawing on her lifelong familiarity with different political systems and cultures to analyze how institutions shape societies differently across borders.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHiking and exploring were part of her life long before college, but moving to Southern California for Claremont McKenna took it to another level. Suddenly she had mountains and desert trails right by campus, and the West Coast adventure lifestyle became part of her routine. It was a culture shock in the best way, trading New York energy for a slower, sunnier pace. But film remained her anchor. She spent her summers working in documentary production, learning the craft from companies like Trilogy Films and Break Thru Films, and even contributing to a public affairs PBS show. And for four years, every Saturday, she tutored K–5th grade students in English, math, and social studies, including students with learning disabilities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, Ella joined The Late Show with Stephen Colbert as an intern, researching and pitching news stories. She now works as a Production Assistant, managing everything from rehearsal logistics to field shoots, making sure the chaos of live TV somehow comes together every night.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eElla is passionate about storytelling that matters, whether through documentaries, narrative film, or helping nonprofits find their voice. When she's not working, you can find her reading mystery novels, cooking, or planning her next international trip.\u003c/p\u003e","teachingVideoPlaybackId":"Hk2r9SzBQrwdFgkNqT8HcASJfWFHcolkUWq01HDrwi02Y","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Government, Film","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ae32f0e0-e062-402e-a61d-8fedd4588c44\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7ad1359-11e6-4242-a85e-2e52cdf9c757\"}"},{"__ref":"DeepDives:{\"uuid\":\"dcba3765-f563-46ea-891c-87f98100d517\"}"},{"__ref":"DeepDives:{\"uuid\":\"70b0193a-534c-4c60-89ca-24b0bc528972\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fe08ea0f-9957-4683-9ee6-12fe6cd02e8b/-/preview/-/format/jpg/","https://ucarecdn.com/2d95900a-60cd-4c98-acc7-fca9d956ffba/-/preview/-/format/jpg/","https://ucarecdn.com/cc4c0a87-b7e9-4326-bb22-9cfce478f8f0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fc47d8f8-6380-4100-97fa-4561ec5aaddc\"}"},{"__ref":"Education:{\"uuid\":\"3cc68075-86ad-4dd8-8075-b2facbaa18aa\"}"}],"hiredAt":"2026-02-18T18:36:38.346Z","topics":["K-5 Grade Math","Writing","French","Executive Function","College Essay Writing","Reading","History","Creative Writing","Film / Theater","K-6 Storybook","Sports Journalism","History Project","Video / Photography","Law / Government / Policy","Sustainability","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ella-reyl\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"cf561104-bc62-406e-ab75-92d59be32dcd\"}"}}},"_sentryTraceData":"c474a35eaac44322bfb73dcd050edded-9326429150bf11c6-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-p
