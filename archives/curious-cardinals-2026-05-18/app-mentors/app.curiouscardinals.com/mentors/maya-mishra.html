xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3166aab7-035e-4cf4-b30a-3422989646c2\"}":{"__typename":"Favorites","uuid":"3166aab7-035e-4cf4-b30a-3422989646c2","photoUrl":"https://ucarecdn.com/e704796d-36fb-40b2-bfeb-b4b1ec6a92f8/","title":"Rumours- Fleetwood Mac","type":"ALBUM"},"Favorites:{\"uuid\":\"56dcf250-c8e8-4336-b57b-49dc3ecbb70a\"}":{"__typename":"Favorites","uuid":"56dcf250-c8e8-4336-b57b-49dc3ecbb70a","photoUrl":"https://ucarecdn.com/e704796d-36fb-40b2-bfeb-b4b1ec6a92f8/","title":"Ratatouille","type":"MOVIE"},"Favorites:{\"uuid\":\"4e8f7a24-ed08-46de-a0ec-500ca94cbab1\"}":{"__typename":"Favorites","uuid":"4e8f7a24-ed08-46de-a0ec-500ca94cbab1","photoUrl":"https://ucarecdn.com/e704796d-36fb-40b2-bfeb-b4b1ec6a92f8/","title":"Never Let Me Go- Kazuo Ishiguro","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ac53ae6d-01e1-4daf-a2e6-db3582d5b576\"}":{"__typename":"DeepDives","uuid":"ac53ae6d-01e1-4daf-a2e6-db3582d5b576","content":"\u003cp\u003eI love that ecology \u0026amp; evolution emphasize the connections between all living things and the world we live in. It gives a humbling perspective on how the humans and Earth we know and love today came to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"adbe45c9-1170-4daa-bc46-778caa8ac069\"}":{"__typename":"DeepDives","uuid":"adbe45c9-1170-4daa-bc46-778caa8ac069","content":"\u003cp\u003eI want to be an astronaut! I hope to pursue aerospace medicine: I want to be the doctor aboard a mission to Mars.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7665b4b8-a3ec-4bfb-93b2-b00282bc2510\"}":{"__typename":"DeepDives","uuid":"7665b4b8-a3ec-4bfb-93b2-b00282bc2510","content":"\u003cp\u003eI love to run long distances, read great novels, and spend time with my friends and family. All of these things help keep me mentally and physically healthy so that I can achieve my goals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f1f17719-09d5-486a-9bca-da990c48a98e\"}":{"__typename":"DeepDives","uuid":"f1f17719-09d5-486a-9bca-da990c48a98e","content":"\u003cp\u003eTake care of yourself! Your body and mind will be with you throughout your life, and they deserve care and attention. If you are rested, well-fed, and pursue a variety of hobbies, you will be so much more equipped to succeed in everything else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"eea854c4-03d6-4317-9eb1-0b8b7494ffa1\"}":{"__typename":"School","uuid":"eea854c4-03d6-4317-9eb1-0b8b7494ffa1","name":"Park Tudor School","city":"Indianapolis","type":"HIGH","state":"Indiana","country":"United States","zip":"46240"},"Education:{\"uuid\":\"5bc7979f-6d3d-4b9e-b16f-552032efddfa\"}":{"__typename":"Education","uuid":"5bc7979f-6d3d-4b9e-b16f-552032efddfa","school":{"__ref":"School:{\"uuid\":\"eea854c4-03d6-4317-9eb1-0b8b7494ffa1\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"d9ab9441-79f0-49da-b918-b871ec26bf36\"}":{"__typename":"Education","uuid":"d9ab9441-79f0-49da-b918-b871ec26bf36","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Ecology \u0026 Evolutionary Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"00162e10-c250-4bf2-8c6d-934f681c5c6c\"}":{"__typename":"MentorPublicProfile","uuid":"00162e10-c250-4bf2-8c6d-934f681c5c6c","displayName":"Maya M.","slug":"maya-mishra","biography":"\u003cp\u003eHi! I'm Maya, and I graduated from Princeton University in 2022. I majored in Ecology \u0026amp; Evolutionary Biology, with minors in Global Health, Astrobiology, and Creative Writing. Outside of class, I participated in college theater and mentored students on service projects. After graduation, I spent a year in Sweden on a Fulbright Grant, ran a marathon, and discovered a passion for vegetarian cooking.\u003cbr\u003e\u003cbr\u003eIn college, I was awarded the Senior Book Prize for the best academic performance in my department, and won a thesis prize for my work in fiction. Before college, I achieved a perfect score of 36 on the ACT. As a pre-medical student, I have a genuine fascination with and passion for biology that I love passing on to others as a tutor.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI credit a lot of my academic success to collaborative learning: talking through concepts with my peers and professors to best understand the material. I bring this approach to tutoring: I tutored Molecular Biology for 3.5 years throughout college at Princeton's McGraw Center for Teaching \u0026amp; Learning, becoming the Head Tutor after a year. I additionally taught coding to 1st-5th graders in high school. \u003cbr\u003e\u003cbr\u003eMy approaches are tailored to each student, from problem-based learning to examples, illustrations, and beyond, and I always take the time to get to know them so I can best meet their needs. Additionally, my philosophy is not just to help with assignments or material, but to look at classes as a whole to help students develop study strategies and plans for success that work for them, so that they can grow as learners beyond tutoring sessions.\u003c/p\u003e\u003cp\u003eWhatever your needs are, I'll work with you to achieve your goals!\u003c/p\u003e","teachingVideoPlaybackId":"9014klLqz9w2jAHk02Qi01sRXDgfI6VCVeCXhF5s4Iw5GU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy thesis in Creative Writing! I wrote nine short stories about climate change and its effects on humans mentally. My thesis won a prize from the department.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"3166aab7-035e-4cf4-b30a-3422989646c2\"}"},{"__ref":"Favorites:{\"uuid\":\"56dcf250-c8e8-4336-b57b-49dc3ecbb70a\"}"},{"__ref":"Favorites:{\"uuid\":\"4e8f7a24-ed08-46de-a0ec-500ca94cbab1\"}"}],"causesSupported":[],"major":"Ecology \u0026 Evolutionary Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ac53ae6d-01e1-4daf-a2e6-db3582d5b576\"}"},{"__ref":"DeepDives:{\"uuid\":\"adbe45c9-1170-4daa-bc46-778caa8ac069\"}"},{"__ref":"DeepDives:{\"uuid\":\"7665b4b8-a3ec-4bfb-93b2-b00282bc2510\"}"},{"__ref":"DeepDives:{\"uuid\":\"f1f17719-09d5-486a-9bca-da990c48a98e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/48253269-46dc-4f0b-ad91-7c747a945ea3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"5bc7979f-6
