xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"aaa97888-e266-47e0-bf28-1d2d888e1fda\"}":{"__typename":"Favorites","uuid":"aaa97888-e266-47e0-bf28-1d2d888e1fda","photoUrl":"https://ucarecdn.com/0a6bb359-bc5f-4e8d-b326-df3723ed6f3e/","title":"Eagles","type":"ALBUM"},"Favorites:{\"uuid\":\"066edc90-4574-461c-8559-ebe3e2b52d3f\"}":{"__typename":"Favorites","uuid":"066edc90-4574-461c-8559-ebe3e2b52d3f","photoUrl":"https://ucarecdn.com/eae62e43-2a31-4212-849b-37d7612777d4/","title":"Project Hail Mary","type":"BOOK"},"Favorites:{\"uuid\":\"fdfa7d0f-469c-43e9-93e9-1d4b2f8b0bb6\"}":{"__typename":"Favorites","uuid":"fdfa7d0f-469c-43e9-93e9-1d4b2f8b0bb6","photoUrl":"https://ucarecdn.com/26cb26eb-9293-4037-870f-40d3e3610396/","title":"La La Land","type":"MOVIE"},"CausesSupported:{\"uuid\":\"5ba48c6b-7602-4e63-a92d-f2c80d3da7ad\"}":{"__typename":"CausesSupported","uuid":"5ba48c6b-7602-4e63-a92d-f2c80d3da7ad","name":"Texas 4000 for Cancer","description":"\u003cp\u003eI will be biking 4500 miles and raising $5000 in the fight against cancer.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/9b1d4b64-4971-4e09-9439-5754ca94bf63/"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"6fe8f5a6-6f14-4411-a176-27bb2a0c1a9e\"}":{"__typename":"DeepDives","uuid":"6fe8f5a6-6f14-4411-a176-27bb2a0c1a9e","content":"\u003cp\u003eMy greatest role model is my friend Katherine. We met in school, both majoring in Computer Science, and quickly became close friends, even traveling abroad to Spain together. Katherine has been an incredible source of encouragement and support, always pushing me to strive for better and to believe in my own capabilities. Her influence has extended beyond just personal encouragement; she has guided me through internships, teaching me to advocate for myself and to seek opportunities where I am truly valued, rather than settling out of fear.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eKatherine is hardworking, dedicated, and spontaneous, always eager to meet new people and explore new experiences. Being around her challenges me to step out of my comfort zone and motivates me to pursue a more exciting and fulfilling life. I've learned that who you surround yourself with can greatly influence your character and lifestyle. Katherine’s friendship has taught me the importance of being with someone who inspires you to be the best version of yourself and encourages you to continually grow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"b7c44d13-cacf-4d87-8c02-8cf07b0ab268\"}":{"__typename":"DeepDives","uuid":"b7c44d13-cacf-4d87-8c02-8cf07b0ab268","content":"\u003cp\u003eOut of all the things I could be doing, I chose mentorship because it feels natural to me, having grown up around it. My mom has been a third grade teacher for thirty years, and I’ve spent countless hours sitting through her tutoring sessions, watching kids learn and grow. I hear stories about her students and their progress over the year, and it is inspiring to witness the impact she has on their lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI know how important it is to have someone you can turn to, someone who is there to help, guide, and support you in any way possible. For me, that constant came in the form of my older sisters, who not only helped me academically but also guided me through personal life choices, especially during middle and high school. Having experienced the value of that kind of support firsthand, I understand how vital it can be when someone is there to talk through both academic and personal challenges. Mentorship is about helping others find their own path, not following what others expect of them. I want to be that person for others—the one who supports them as they decide what they want for themselves. There's nothing more rewarding than helping someone realize their potential and make decisions that help them achieve their wildest dreams.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"563fbdcc-3df2-4145-b32f-1760f0c20565\"}":{"__typename":"School","uuid":"563fbdcc-3df2-4145-b32f-1760f0c20565","name":"Robert Vela High School","city":"Edinburg","type":"HIGH","state":"Texas","country":"United States","zip":"78539"},"Education:{\"uuid\":\"b5493667-9b6b-4aaf-9593-c3092fcf64aa\"}":{"__typename":"Education","uuid":"b5493667-9b6b-4aaf-9593-c3092fcf64aa","school":{"__ref":"School:{\"uuid\":\"563fbdcc-3df2-4145-b32f-1760f0c20565\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}":{"__typename":"School","uuid":"bc77f602-b393-4fa6-9e11-df16e522c65d","name":"The University of Texas at Austin","city":"Austin","type":"COLLEGE","state":"Texas","country":"United States","zip":"78712"},"Education:{\"uuid\":\"ef651aa1-2169-4849-b82a-b0c6c8615332\"}":{"__typename":"Education","uuid":"ef651aa1-2169-4849-b82a-b0c6c8615332","school":{"__ref":"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science \u0026 Astronomy","degree":null},"MentorPublicProfile:{\"uuid\":\"95bed085-dc6e-4864-96e2-35fa04a5da46\"}":{"__typename":"MentorPublicProfile","uuid":"95bed085-dc6e-4864-96e2-35fa04a5da46","displayName":"Denise R.","slug":"denise-ramos","biography":"\u003cp\u003eHi, I’m Denise !\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am currently a senior at the University of Texas at Austin, pursuing a Bachelor's in both Computer Science and Astronomy, with a minor in Business Administration. This blend reflects my passion for technology, space exploration, and understanding how these fields intersect in the real world.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eGrowing up with both my parents as educators, I developed an appreciation for learning and teaching early on. This foundation has shaped my approach to education and inspired me to help others achieve their goals. I enjoy tutoring in subjects like math, computer science, and physics—there's nothing like witnessing that “aha!” moment when a challenging concept finally clicks.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eProfessionally, I've been fortunate to gain a diverse range of internship experiences that have shaped my understanding of the tech industry. I have worked on projects in Software Engineering, Tech Consulting, IT Support, Technical Program Management, and even Astronomy research. These experiences have given me a broader understanding of different fields and the importance of interdisciplinary thinking. It’s not just about coding or understanding the science— it’s about finding connections and discovering a niche that aligns with your personal goals and aspirations.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside of academics, I’m an avid triathlete and outdoor enthusiast. Whether I’m surfing, hiking, reading, or traveling to new places, these activities keep me active and teach me important lessons about perseverance and goal setting. Currently, I’m channeling this energy into preparing for a 4,500-mile bike ride from Austin, Texas to Anchorage, Alaska in the summer of 2025 to raise money for cancer research—a challenge that combines my love for cycling with a cause close to my heart.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI’m excited about the opportunity to share my knowledge and experiences with others. My journey has taught me the importance of interdisciplinary thinking, perseverance, and following your passions. If you’re seeking a mentor who can provide insights into STEM fields, share real-world experiences, and offer guidance on balancing diverse interests, I’d love to connect!\u003c/p\u003e","teachingVideoPlaybackId":"5LIma700cmFXlWYdEY02wl4m3xf1SRHL252AXD4pEegzo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"aaa97888-e266-47e0-bf28-1d2d888e1fda\"}"},{"__ref":"Favorites:{\"uuid\":\"066edc90-4574-461c-8559-ebe3e2b52d3f\"}"},{"__ref":"Favorites:{\"uuid\":\"fdfa7d0f-469c-43e9-93e9-1d4b2f8b0bb6\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5ba48c6b-7602-4e63-a92d-f2c80d3da7ad\"}"}],"major":"Computer Science \u0026 Astronomy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6fe8f5a6-6f14-4411-a176-27bb2a0c1a9e\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7c44d13-cacf-4d87-8c02-8cf07b0ab268\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/04c467c4-af35-449e-a008-f27213d205ed/-/preview/-/format/jpg/","https://ucarecdn.com/f1fafb48-0908-4d1f-aaa0-807682d4d865/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b5493667-9b6b-4aaf-9593-c3092fcf64aa\"}"},{"__ref":"Education:{\"uuid\":\"ef651aa1-2169-4849-b82a-b0c6c8615332\"}"}],"hiredAt":"2024-09-11T14:54:06.124Z","topics":["Coding / Programming","Machine Learning / AI","Product Design","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Algebra I","Algebra II","Statistics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename
