xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c4f8e270-aca8-4a2a-9293-b4830a3c7eb5\"}":{"__typename":"Favorites","uuid":"c4f8e270-aca8-4a2a-9293-b4830a3c7eb5","photoUrl":"https://ucarecdn.com/e24810aa-8c3b-4620-a895-fad205680063/","title":"Soccer, Tennis, Basketball, Beach Volleyball","type":"SPORT"},"Favorites:{\"uuid\":\"ed3e457b-7a8a-47e7-9011-0fc7d8843f61\"}":{"__typename":"Favorites","uuid":"ed3e457b-7a8a-47e7-9011-0fc7d8843f61","photoUrl":"https://ucarecdn.com/c2565ba8-c3c8-418b-acf5-840b4a2e5efe/","title":"Catch Me If You Can ","type":"MOVIE"},"Favorites:{\"uuid\":\"f84cd538-d875-4714-9c30-b044b2fba555\"}":{"__typename":"Favorites","uuid":"f84cd538-d875-4714-9c30-b044b2fba555","photoUrl":"https://ucarecdn.com/81a2147d-6165-4a22-8e74-c4b0d061f30d/","title":"Usain Bolt ","type":"ATHLETE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b445a2d4-4c64-4516-853a-569f56fc13a0\"}":{"__typename":"DeepDives","uuid":"b445a2d4-4c64-4516-853a-569f56fc13a0","content":"\u003cp\u003eTry everything that sparks your curiosity before deciding what to commit to. Don’t rush to have it all figured out — clarity comes from experimenting, not overthinking. But while you explore, start building small daily habits around the things that make you better. Those quiet repetitions add up in ways you won’t notice until years later, building a strong foundation for a successful future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c22e0aff-5f42-457c-a5b3-20882c7f4f99\"}":{"__typename":"DeepDives","uuid":"c22e0aff-5f42-457c-a5b3-20882c7f4f99","content":"\u003cp\u003eMentorship is important to me because it helps you skip a lot of the guesswork. I’ve realized how much faster you grow when you can learn from someone who’s already been through what you’re figuring out. It’s not about copying their path — it’s about hearing their story and taking pieces that apply to yours. I’ve been lucky to have mentors who’ve helped me make better decisions and opened my eyes to opportunities I didn’t even know existed. Now, I like being on the other side of that — sharing what I’ve learned and hopefully helping someone else avoid the same roadblocks.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a9bb21c9-4666-4fc7-af05-75b874dc213b\"}":{"__typename":"DeepDives","uuid":"a9bb21c9-4666-4fc7-af05-75b874dc213b","content":"\u003cp\u003eMajor related: Built a Python-based dashboard that takes continuous glucose monitor (CGM) data, visualizes trends in real-time, and uses simple machine learning to predict hypoglycemic events before they happen — giving users a 30 minute warning window.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003ePersonal: I enjoy woodworking projects and recently built a garden planter from scratch with an embedded irrigation system.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5a0ace36-f84e-4b88-9922-44ebe1842012\"}":{"__typename":"DeepDives","uuid":"5a0ace36-f84e-4b88-9922-44ebe1842012","content":"\u003cp\u003eI want to build and launch a startup that takes a MedTech idea from prototype to product in users’ hands—and know that my work made someone’s life measurably better. After gaining industry experience, I plan to lead the entire process—design, testing, iteration, and launch—so I can see the direct impact of my efforts. There are countless gaps in healthcare waiting for solutions, and I want to aid in building them\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"426d1cbe-ef9e-4cb5-aef5-3d90ddbb0775\"}":{"__typename":"School","uuid":"426d1cbe-ef9e-4cb5-aef5-3d90ddbb0775","name":"Rancho Bernardo High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92128"},"Education:{\"uuid\":\"1f110a0e-b955-4225-8e07-f6bfe4577f70\"}":{"__typename":"Education","uuid":"1f110a0e-b955-4225-8e07-f6bfe4577f70","school":{"__ref":"School:{\"uuid\":\"426d1cbe-ef9e-4cb5-aef5-3d90ddbb0775\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"146b2979-7c20-4c2c-821c-b894d083f11b\"}":{"__typename":"Education","uuid":"146b2979-7c20-4c2c-821c-b894d083f11b","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Bioengineering ","degree":null},"MentorPublicProfile:{\"uuid\":\"5e300825-6b16-4f84-a0c1-bacaf7f1a77a\"}":{"__typename":"MentorPublicProfile","uuid":"5e300825-6b16-4f84-a0c1-bacaf7f1a77a","displayName":"Ibrahim S.","slug":"ibrahim-saiger","biography":"\u003cp\u003eHi! My name is Ibrahim, and I just graduated from UC Berkeley with a degree in bioengineering, specializing in medical devices. I'm originally from San Diego and moved back home to work full-time in the MedTech industry. Right now, I'm exploring whether grad school is the right next step, and I want to gain industry experience first to make a more informed decision.\u003c/p\u003e\u003cp\u003eDuring my time at Berkeley, I got to explore all kinds of career paths—from joining startups to conducting research at both Berkeley and UCSF. One experience that really shaped my passion for MedTech and neurotech was working in a deep brain stimulation lab at UCSF, where we helped Parkinson's patients through innovative closed-loop device technology. I worked directly with a neurosurgeon and a neurologist, helping to refine algorithms that could change patients' lives by reducing the time it took to correct tremors and other symptoms. That experience showed me the incredible intersection of medicine, engineering, and real human impact. I'm fascinated by this technology and its abundant applications, and for now, I've chosen to continue developing closed-loop systems because I believe they're the future of MedTech. That's why I took my first full-time role at a company building closed-loop devices for type 1 diabetes.\u003c/p\u003e\u003cp\u003eI'm someone who understands firsthand how important the right mentor can be—I was tutored throughout middle school, and those experiences made a huge difference for me. That's why I'm passionate about tutoring and mentoring students now, especially in STEM subjects and personal growth, because these skills will serve you far beyond college. I love helping students build strong foundations early so they can level up faster and reach their goals. With the industry evolving so rapidly, speed and staying informed are key—that's why I make it a priority to keep up with the latest tech and startups. I also have a younger brother, and mentoring him has taught me so much about meeting students where they are and making complex topics feel approachable.\u003c/p\u003e\u003cp\u003eOutside of work and tutoring, one of my favorite things is spending time at the beach. I work close to the water, so my colleagues and I often play beach volleyball or go surfing during lunch breaks. I grew up playing soccer and tennis, and I still play casually with friends. On weekends, I referee soccer games—something I've been doing for the last eight years. I even coached a soccer team a few seasons back, and it's definitely something I'll do again.\u003c/p\u003e\u003cp\u003eWhether you're curious about neurotech, medical devices, bioengineering, startups, personal growth, or just figuring out your path in STEM, we'd have tons to talk about!\u003c/p\u003e","teachingVideoPlaybackId":"SNhyBBqO752FIdZnYFwrn7MZePoOEbTszpnhpmM7lNA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c4f8e270-aca8-4a2a-9293-b4830a3c7eb5\"}"},{"__ref":"Favorites:{\"uuid\":\"ed3e457b-7a8a-47e7-9011-0fc7d8843f61\"}"},{"__ref":"Favorites:{\"uuid\":\"f84cd538-d875-4714-9c30-b044b2fba555\"}"}],"causesSupported":[],"major":"Bioengineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b445a2d4-4c64-4516-853a-569f56fc13a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"c22e0aff-5f42-457c-a5b3-20882c7f4f99\"}"},{"__ref":"DeepDives:{\"uuid\":\"a9bb21c9-4666-4fc7-af05-75b874dc213b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a0ace36-f84e-4b88-9922-44ebe1842012\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/87146bbb-f9ae-4543-9bf1-053b317382e2/-/preview/-/format/jpg/","https://ucarecdn.com/97daa5a1-edd1-4eaf-bcaa-50f5a01d006a/-/preview/-/format/jpg/","https://ucarecdn.com/0dfd2fd4-39ba-400b-8052-57102591207e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1f110a0e-b955-4225-8e07-f6bfe4577f70\"}"},{"__ref":"Education:{\"uuid\":\"146b2979-7c20-4c2c-821c-b894d083f11b\"}"}],"hiredAt":"2025-10-10T21:25:57.964Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Biology","Physics","Academic Coaching","Computer Science","Executive Function","History","Reading","History Project","K-6 Storybook","Business / Entrepreneurship","Finance / Investing","Machine Learning / AI","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Web Design"],"communityBadges":["https://ucarecdn.com/9a4c114f-3114-4d6c-908a-b4d35953934d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ibrahim-saiger\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5e300825-6b16-4f84-a0c1-bacaf7f1a77a\"}"}}},"_sentryTraceData":"be1efd866c9d4416bad1276574bace51-afb44f9586fd5673-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=be1efd866c9d4416bad1276574bace51,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ibrahim-saiger"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'scr
