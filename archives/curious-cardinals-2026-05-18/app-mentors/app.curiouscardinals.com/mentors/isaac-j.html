xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"708df004-4177-44ed-ac25-dd7bff43543c\"}":{"__typename":"Favorites","uuid":"708df004-4177-44ed-ac25-dd7bff43543c","photoUrl":"https://ucarecdn.com/edb09fb1-98be-4a92-8c6d-6c5aa769294a/","title":"星の消えた夜に","type":"ALBUM"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"6f4ce21c-861b-4926-836a-d27a16d34635\"}":{"__typename":"DeepDives","uuid":"6f4ce21c-861b-4926-836a-d27a16d34635","content":"\u003cp\u003eI hope to be the principal investigator of economics research that 1) revolutionizes our current understanding of a macroeconomic topic, 2) lends to practical applications that are actually welfare increasing for global citizens, 3) promotes the idea of \"putting the team first.\"\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"627978a7-6d87-4184-8910-e5812f4f29d0\"}":{"__typename":"DeepDives","uuid":"627978a7-6d87-4184-8910-e5812f4f29d0","content":"\u003cp\u003eI entered university wanting to end up on the other side as someone who could contribute to the American body politic, and at the time I was interested in pursuing legal studies post graduation. Economics is often recommended for pre-law students, and I enjoyed its blend of social science and mathematics in high school, so I figured I would make it my major.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs my studies went on, and the era of information was heralded in by advancing technology, I found that within economics was as good of a balance as could be found of participating in current political discourse while simultaneously arguing for \"truth\" based on the methods of scientific research.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"da7fe275-29ac-41aa-8344-73c7afc9f4ba\"}":{"__typename":"DeepDives","uuid":"da7fe275-29ac-41aa-8344-73c7afc9f4ba","content":"\u003cp\u003eMentors in my life, be they parents, my high school teachers, celebrities in media I've felt inspired by, or professors whos work I have read or contributed to, are who have led me to always dream bigger than the immediate horizons and who are directly responsible for all the opportunities I have been blessed to receive. If I can be like that for someone else--that would mean the world to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a740f990-3a46-4a74-ae82-3faa7aaced4b\"}":{"__typename":"DeepDives","uuid":"a740f990-3a46-4a74-ae82-3faa7aaced4b","content":"\u003cp\u003eI have fallen in love with reading again. I'll pick up trending novels in Japan to practice my language comprehension while keeping pace with the times and have been slowly but surely trying to read more literature in English. I most recently finished \"One Hundred Years of Solitude\" by Gabriel García Márquez and \"Chinmoku\" (Silence) by Endō Shūsaku.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e6d7ee87-1a85-4c78-acc7-8e5ae6244355\"}":{"__typename":"School","uuid":"e6d7ee87-1a85-4c78-acc7-8e5ae6244355","name":"ウッド・リバー高等学校","city":"Hailey","type":"HIGH","state":"Idaho","country":"アメリカ合衆国","zip":"83333"},"Education:{\"uuid\":\"776b4c45-61bc-49d5-9046-0ee92aebab78\"}":{"__typename":"Education","uuid":"776b4c45-61bc-49d5-9046-0ee92aebab78","school":{"__ref":"School:{\"uuid\":\"e6d7ee87-1a85-4c78-acc7-8e5ae6244355\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0b81206e-9e98-4d13-b28a-4cebd6ef85c8\"}":{"__typename":"School","uuid":"0b81206e-9e98-4d13-b28a-4cebd6ef85c8","name":"コロンビア大学","city":"New York","type":"COLLEGE","state":"New York","country":"アメリカ合衆国","zip":"10027"},"Education:{\"uuid\":\"ce3e7a28-6d5c-4801-9e5c-2dc5073b5e54\"}":{"__typename":"Education","uuid":"ce3e7a28-6d5c-4801-9e5c-2dc5073b5e54","school":{"__ref":"School:{\"uuid\":\"0b81206e-9e98-4d13-b28a-4cebd6ef85c8\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Economics-Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"484030e9-3d7d-4db5-bfec-ace35319c6ff\"}":{"__typename":"MentorPublicProfile","uuid":"484030e9-3d7d-4db5-bfec-ace35319c6ff","displayName":"Isaac L.","slug":"isaac-j","biography":"\u003cp\u003eHello! I'm Isaac Loomis. I was born and raised in Idaho, which I am very happy to call home. And yet, through a love of language learning and unsatiable desire to seek out the \"more,\" my studies have led to life experience in both New York, where I attended undergrad, and Tokyo, where I once studied abroad and where I will soon begin my masters. I'm a math teacher's son, so I grew up in an environment dedicated to education, and by consequence I've been working to become a professor so that I can continue giving back to my communities as my mother does. This journey to professorship has brought me to my most recent post as Fulbright Fellow in economics research at the University of Tokyo.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEarly on into my undergraduate education I fell in love with what I consider to be my two main disciplines: economics and Japanese language and cultural studies. Moreover, as the world of data analytics surges on at incredible speeds, the world of economics continues to become more and more STEM intensive, demanding statistical rigor and mathematical prowess from its researchers and students. As such, I am hopeful that--for any student out there that is looking to expand their skillset in economics, mathematics, and statistics, or for any student that wants to take their first steps into the wonderful and endless world of studying Japanese--I can assist them along with teaching that is comprised of equal parts of academic rigor and passion for learning.\u003c/p\u003e","teachingVideoPlaybackId":"wadVxrn7Z1lG5tMY3Sq37EqXhR2fG6KQ00k61MFVC7GY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"708df004-4177-44ed-ac25-dd7bff43543c\"}"}],"causesSupported":[],"major":"Economics-Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6f4ce21c-861b-4926-836a-d27a16d34635\"}"},{"__ref":"DeepDives:{\"uuid\":\"627978a7-6d87-4184-8910-e5812f4f29d0\"}"},{"__ref":"DeepDives:{\"uuid\":\"da7fe275-29ac-41aa-8344-73c7afc9f4ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"a740f990-3a46-4a74-ae82-3faa7aaced4b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b67733ac-ee84-4c88-9ca4-7c7ec289f2e9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"776b4c45-61bc-49d5-9046-0ee92aebab78\"}"},{"__ref":"Education:{\"uuid\":\"ce3e7a28-6d5c-4801-9e5c-2dc5073b5e54\"}"}],"hiredAt":"2025-05-13T11:53:56.592Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Statist
