xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2c40d879-57b1-4f17-8f50-e2d71d10ad03\"}":{"__typename":"Favorites","uuid":"2c40d879-57b1-4f17-8f50-e2d71d10ad03","photoUrl":"https://ucarecdn.com/f734ce6c-ca66-4e19-b16b-73d2481f0933/","title":"Beloved by Toni Morrison","type":"BOOK"},"Favorites:{\"uuid\":\"39037ad1-28af-41b3-a6a0-0c7e4d6e2acd\"}":{"__typename":"Favorites","uuid":"39037ad1-28af-41b3-a6a0-0c7e4d6e2acd","photoUrl":"https://ucarecdn.com/fc2aaa8c-59db-4214-b46d-c6e35a8fdefb/","title":"SAN JOSE FOREVER \u003c3","type":"CITY"},"Favorites:{\"uuid\":\"8704bd54-e97b-4c4d-9c26-56f0d9990959\"}":{"__typename":"Favorites","uuid":"8704bd54-e97b-4c4d-9c26-56f0d9990959","photoUrl":"https://ucarecdn.com/e5ae57c0-e12b-4325-abb9-7223d6c82a4b/","title":"Skyim \u0026 TLOU2","type":"GAME"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"5272874c-6c58-4ac2-9838-98c9314638b6\"}":{"__typename":"DeepDives","uuid":"5272874c-6c58-4ac2-9838-98c9314638b6","content":"\u003cp\u003eMy family motivates me to succeed every day. With every test I take, every study session I attend, every 20-minute hike to class I endure--they're at the forefront of my mind. They're my greatest joy in life and have given me everything willingly. It's my dream to give all of that care and dedication back to them and create a future of comfort and stability for the people I love. College has laid down the first stepping stone, and I'm driven to keep moving forward in a positive direction to realize these dreams. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d416f662-2ba3-4ae8-b3e0-778af7a1b906\"}":{"__typename":"DeepDives","uuid":"d416f662-2ba3-4ae8-b3e0-778af7a1b906","content":"\u003cp\u003eMy dream job is to work in Data Analytics and AI to support endangered species! I feel deeply connected to animals and would love to leverage the predictive power of data science to restore habitats and ecosystems :) \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"97f71246-1126-42e3-8822-0367cd18fc95\"}":{"__typename":"DeepDives","uuid":"97f71246-1126-42e3-8822-0367cd18fc95","content":"\u003cp\u003eI didn't have a clear idea of what I wanted to do until college. I had passions and interests in high school, but I felt so uncertain about the trajectory of my future. I remember thinking to myself, \"How is a 17-year-old supposed to decide what they want to do with their entire life?\" When applying to colleges, this dilemma stared me in the face for months. I knew that I liked computers, but I really had no experience coding beyond a few basic lines. I enrolled in Berkeley for CS anyway, and after taking a stab at some of the classes, I realized that it wasn't quite for me. The dread really started to set in, and my head swarmed with thoughts like \"how could I have wasted precious college semesters on 'trying to figure it out?'\" Not long after, though, I learned that that's the point of college. I was introduced to the world of data science, a field that suited me so much better and brought me joy. It took some time, sure, but I'm infinitely grateful that I took the leap and allowed myself time to figure out what I wanted from life professionally. And having gone through it myself, I'd be more than happy to help others discover what feels right for them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"b148d1bd-1c7d-477e-9ef4-887b26ecef75\"}":{"__typename":"DeepDives","uuid":"b148d1bd-1c7d-477e-9ef4-887b26ecef75","content":"\u003cp\u003eWinning Super Smash Bros against my little brother\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"ebd7cb86-6dc5-4179-9fa2-811a1bb97553\"}":{"__typename":"School","uuid":"ebd7cb86-6dc5-4179-9fa2-811a1bb97553","name":"Abraham Lincoln High School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95126"},"Education:{\"uuid\":\"5011f812-15be-4a96-8e25-b66ca8e0421c\"}":{"__typename":"Education","uuid":"5011f812-15be-4a96-8e25-b66ca8e0421c","school":{"__ref":"School:{\"uuid\":\"ebd7cb86-6dc5-4179-9fa2-811a1bb97553\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}":{"__typename":"School","uuid":"dff4a26a-20c2-4281-9c2a-b500907e0661","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"ce859f62-54c5-4ac3-8455-d73945cf4bae\"}":{"__typename":"Education","uuid":"ce859f62-54c5-4ac3-8455-d73945cf4bae","school":{"__ref":"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Data Science ","degree":null},"MentorPublicProfile:{\"uuid\":\"fb02676b-f6b9-4c12-b649-fc4894a27dea\"}":{"__typename":"MentorPublicProfile","uuid":"fb02676b-f6b9-4c12-b649-fc4894a27dea","displayName":"Kylie P.","slug":"kylie-noa","biography":"\u003cp\u003eHi all! My name is Kylie Pele, and I'm proud to be a rising senior studying Data Science and Economics at UC Berkeley. I truly love what I study, and have taught computer science to kids across the Bay Area with Silicon Valley Education Foundation (SVEF). I love helping others discover and pursue their passions, as well as strengthening their existing skills.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA bit more about me personally! I grew up in San Jose and am 1/2 Finnish, 1/4 Vietnamese, and 1/4 Samoan. I played a wide array of instruments when I was younger, but fell in love with the violin. I was fortunate to travel to Europe and play in 4 different countries with my symphony -- truly a highlight of my life. I adore coffee \u003cem\u003ealmost\u003c/em\u003e as much as I love my cats and my siblings, and will frequently combine the three on evening walks.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm excited to meet my next mentee and help them achieve anything they set their mind to. I promise you that no mountain is too high for us 😎. I'm looking forward to growing academically, professionally, socially, and emotionally with you this year!\u003c/p\u003e","teachingVideoPlaybackId":"F6zsJb00agnjQb00u6UGiqmKT97UP00VkQG5jFRd69WFH8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2c40d879-57b1-4f17-8f50-e2d71d10ad03\"}"},{"__ref":"Favorites:{\"uuid\":\"39037ad1-28af-41b3-a6a0-0c7e4d6e2acd\"}"},{"__ref":"Favorites:{\"uuid\":\"8704bd54-e97b-4c4d-9c26-56f0d9990959\"}"}],"causesSupported":[],"major":"Data Science ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5272874c-6c58-4ac2-9838-98c9314638b6
