xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7635acd3-deee-4716-93a7-cdbd380a7b6a\"}":{"__typename":"Favorites","uuid":"7635acd3-deee-4716-93a7-cdbd380a7b6a","photoUrl":"https://ucarecdn.com/faeb91a6-a362-4bb7-bf4a-a73ace218778/","title":"Hit Me Hard And Soft - Billie Eilish","type":"ALBUM"},"Favorites:{\"uuid\":\"9cff07c8-5f32-45ba-ad8c-9a3207afe1ed\"}":{"__typename":"Favorites","uuid":"9cff07c8-5f32-45ba-ad8c-9a3207afe1ed","photoUrl":"https://ucarecdn.com/66607305-3349-4ea2-b277-6a658e918518/","title":"Titanic","type":"MOVIE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"78b1dc50-e161-4f2c-9b3e-fd8787880fe1\"}":{"__typename":"DeepDives","uuid":"78b1dc50-e161-4f2c-9b3e-fd8787880fe1","content":"\u003cp\u003eMy dream job is to be a practicing civil rights lawyer who represents those who otherwise would not have proper legal counsel. In the United States, we have seen a large increase in false-imprisonment and wrongful incarceration which I hope to decrease through my career. Furthermore, I plan to advocate for redistribution of government funds away from the Prison Industrial Complex--back into our most in-need communities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"6704a0c4-f5f3-45ca-92cb-3bd0248d908c\"}":{"__typename":"DeepDives","uuid":"6704a0c4-f5f3-45ca-92cb-3bd0248d908c","content":"\u003cp\u003eI am proud of my ability to empathize with others. I live by the quote \"When given the choice between being right or being kind, choose kind,\" from the movie Wonder. This belief has guided me throughout my educational journey and is a pillar of my identity. I truly believe that empathy and understanding are key to a more diverse, inclusive and understanding world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"900e0db5-aac4-4c6f-9f58-c8dcbd1c6880\"}":{"__typename":"DeepDives","uuid":"900e0db5-aac4-4c6f-9f58-c8dcbd1c6880","content":"\u003cp\u003eIn my spare time, I enjoy working out and lifting at the gym. I find the gym to be a place in which I can not only better myself physically, but also address my mental and emotional health. This space allows me to decompress and understand my emotions and feelings, leaving with a more clear mind and positive outlook on the day ahead!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4872dcd8-1223-40e7-9d50-af4f465fe89b\"}":{"__typename":"DeepDives","uuid":"4872dcd8-1223-40e7-9d50-af4f465fe89b","content":"\u003cp\u003eMentorship is important to me because it allows for a space in which growth and learning is catalyzed and fostered. Creating a positive and engaging mentoring experience is instrumental in the impact a student can have on the world. I have had the privilege of learning with many great mentors throughout my life and I am thrilled to be able share a similar symbiotic relationship with your student to reach their goals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"a2b0237f-95c7-4cda-b847-01cf4f7e6569\"}":{"__typename":"School","uuid":"a2b0237f-95c7-4cda-b847-01cf4f7e6569","name":"Rogers High School","city":"Spokane","type":"HIGH","state":"Washington","country":"United States","zip":"99207"},"Education:{\"uuid\":\"28aa8253-353b-499c-af2b-157bcd4cb839\"}":{"__typename":"Education","uuid":"28aa8253-353b-499c-af2b-157bcd4cb839","school":{"__ref":"School:{\"uuid\":\"a2b0237f-95c7-4cda-b847-01cf4f7e6569\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"e8becb92-05b2-4d0c-bbc2-66415ad149a6\"}":{"__typename":"Education","uuid":"e8becb92-05b2-4d0c-bbc2-66415ad149a6","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Social Studies and African American Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"a022f771-9d18-4d2a-83dd-a36681814bb3\"}":{"__typename":"MentorPublicProfile","uuid":"a022f771-9d18-4d2a-83dd-a36681814bb3","displayName":"Andre R.","slug":"andre-ramsey-1","biography":"\u003cp\u003eHi! My name is Andre Ramsey. I am a Junior at Harvard College studying Social Studies and African American Studies with a focus on the intersections of race, gender and socio-economic status in correlation to mass incarceration in America. Outside of the classroom, I serve as the President of Harvard Model Congress San Francisco and Chief of Staff for Harvard Model Congress Boston which focus on cultivating civic engagement and public speaking for high school students around the world. In addition, I serve as a Peer Advising Fellow to first-year students at Harvard college–advising them through their college experience. Lastly, I am a leadership and communications tutor to students around the world, having taught 27 5-day programs in schools on 6 continents. This work has allowed me to visit 30+ countries over the last two years, gaining a wealth of knowledge in global affairs and various cultures. When I am not working on these things, you can catch me at the gym, grabbing coffee with friends or watching a good horror movie!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSome of my interests and areas of study include: leadership, business, communication \u0026amp; public speaking, debate, poetry, advocacy, grassroots organizing, college essay writing, scholarship essay writing, history of punishment, civil rights history, civil rights law, human rights law and African American studies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am honored to have also received the Bill and Melinda Gates Foundation scholarship, Coca-Cola Foundation scholarship and United States Senate Youth Program scholarship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy philosophy around mentorship is rooted in kindness, respect and common-understanding that allows each of us to work in tandem to achieve your child's goals and aspirations! I am thrilled to work with your student over the coming months to allow their unique ideas and curiosity to come to life :)\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7635acd3-deee-4716-93a7-cdbd380a7b6a\"}"},{"__ref":"Favorites:{\"uuid\":\"9cff07c8-5f32-45ba-ad8c-9a3207afe1ed\"}"}],"causesSupported":[],"major":"Social Studies and African American Studies","deepDives":[{"__ref":"DeepDives:{\
