xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5141f38c-51a3-4585-9ad8-bcb45fe8484a\"}":{"__typename":"Favorites","uuid":"5141f38c-51a3-4585-9ad8-bcb45fe8484a","photoUrl":"https://ucarecdn.com/68512cdc-f112-48df-8ea6-d03b004ab8d0/","title":"Ellie Kildunne","type":"ATHLETE"},"Favorites:{\"uuid\":\"5469d783-abe9-429e-a40c-3caf1d04bc88\"}":{"__typename":"Favorites","uuid":"5469d783-abe9-429e-a40c-3caf1d04bc88","photoUrl":"https://ucarecdn.com/849147f5-b7f5-40a2-933e-3b6fa074dc23/","title":"Monopoly Deal","type":"GAME"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"23a14fc0-d9fc-450d-be4d-ab60e646fb5f\"}":{"__typename":"DeepDives","uuid":"23a14fc0-d9fc-450d-be4d-ab60e646fb5f","content":"\u003cp\u003eI’m currently developing TrueForm, a gender-neutral athletic apparel company designed to bridge the gap between performance and identity. Through this venture, I’m conducting customer research with athletes, testing product designs, and thinking deeply about branding, positioning, and market fit. The goal is to create high-quality performance clothing that is intentionally designed from the outset to fit a range of bodies — not simply adapted from traditional men’s or women’s lines. Building TrueForm has strengthened my skills in problem-solving, iteration, and execution, and it’s given me firsthand experience in what it takes to move an idea from concept to tangible product.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"282608f5-95ee-4a75-8490-a65bcde92421\"}":{"__typename":"School","uuid":"282608f5-95ee-4a75-8490-a65bcde92421","name":"Monarch High School","city":"Louisville","type":"HIGH","state":"Colorado","country":"United States","zip":"80027"},"Education:{\"uuid\":\"0b33a6a1-7a56-4aef-9cb1-1ecabf5c3395\"}":{"__typename":"Education","uuid":"0b33a6a1-7a56-4aef-9cb1-1ecabf5c3395","school":{"__ref":"School:{\"uuid\":\"282608f5-95ee-4a75-8490-a65bcde92421\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"655bd153-dfde-4104-b1a2-f8d085eeacf8\"}":{"__typename":"Education","uuid":"655bd153-dfde-4104-b1a2-f8d085eeacf8","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"International and Public Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"36764867-9813-47ba-ac87-5067c8b43363\"}":{"__typename":"MentorPublicProfile","uuid":"36764867-9813-47ba-ac87-5067c8b43363","displayName":"Kate M.","slug":"kate-muldoon","biography":"\u003cp\u003eHi! I’m Kate, a senior at Brown University studying International \u0026amp; Public Affairs and Entrepreneurship. I help students learn and grow within their passions. \u003cbr\u003e\u003cbr\u003eJust a few years ago, I was a high school student with lots of interests and a drive to learn, but I struggled to find my path in exploring my passions outside of the classroom. Since then, I’ve worked for a product development agency, published articles for a healthcare publication, started a club for female athletes to find community, and won four national championships with my rugby teams.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Brown, my favorite classes have been about marketing, building your own business, and leadership. I’m captain of Brown’s DI rugby team and serve as Brown’s Ivy League representative to the Student Athlete Advisory Committee.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWorking with me:\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEntrepreneurship has been a central focus of my time at Brown. I’ve taken courses on building and testing business ideas, marketing, and leadership, and I’m currently developing my own venture. Through that process, I’ve learned how to turn a broad idea into something actionable — conducting research, refining concepts, responding to feedback, and actually executing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLeadership has shaped me just as much. As captain of Brown’s Division I rugby team, I mentor younger teammates in balancing academics, athletics, and personal goals. I’ve also helped create spaces for female athletes to build community and confidence. These roles have taught me how to listen, ask thoughtful questions, and help others clarify what they want — then build a plan to get there.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing a student-athlete has strengthened my time management, resilience, and ability to perform under pressure. I’ve learned how to translate the discipline and teamwork developed through sports into success in the classroom and professional settings, and I love helping students recognize and leverage those same skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether a student wants to start a business, launch a passion project, grow as a leader, or better balance their commitments, I bring both entrepreneurial experience and real-world leadership perspective to support them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy sessions are centered on the student’s interests. I don’t believe in a one-size-fits-all approach, because growth is most achieveable when it’s rooted in genuine curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWe start with what excites you and build from there. If you’re interested in entrepreneurship, we’ll turn your idea into a structured project with clear next steps. If you’re passionate about sports, we can explore how the skills you’re developing translate into leadership and academics. If you’re still figuring it out, we’ll experiment and refine together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSessions are structured and goal-oriented, but they’re also meant to be energizing. My role is to provide clarity, accountability, and encouragement—while making sure the process feels productive and enjoyable. I want students to leave feeling not only more capable, bit also confident about what they’re building.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA little more about my background:\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in Arlington, VA and Boulder, CO. In high school I was editor in chief of my school’s newsmagazine. My part time jobs included being a hostess at a restaurant, a children’s gymnastics coach, and an assistant horse trainer at my local stable. I also played rugby throughout high school. In my free time now, I love to cook and bake. I also love reading, playing cards with my roommates, and spending time outside.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"4EXksqJJ9oApoI4NKHx01enzoSN8XCttYNblQ6FM3BtQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5141f38c-51a3-4585-9ad8-bcb45fe8484a\"}"},{"__ref":"Favorites:{\"uuid\":\"5469d783-abe9-429e-a40c-3caf1d04bc88\"}"}],"causesSupported":[],"major":"International and Public Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"23a14fc0-d9fc-450d-be4d-ab60e646fb5f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/78f2f3b2-b534-48d2-ad68-7f6a28cefc2e/-/preview/-/format/jpg/","https://ucarecdn.com/4852b8ef-107b-4657-8452-cec8b171fa4d/-/preview/-/format/jpg/","https://ucarecdn.com/102369d4-6ac8-4203-9890-4e77d4537cfd/-/preview/-/format/jpg/"],"p
