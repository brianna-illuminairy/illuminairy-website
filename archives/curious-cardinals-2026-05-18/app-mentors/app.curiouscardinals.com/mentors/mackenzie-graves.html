xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"bce65fdc-0399-47d4-94ce-bee1f3d33b2a\"}":{"__typename":"DeepDives","uuid":"bce65fdc-0399-47d4-94ce-bee1f3d33b2a","content":"\u003cp\u003eI believe every student has the potential to achieve greatness when they have the right guidance and support. Mentoring is exciting to me because it’s an opportunity to help students see their own strengths, realize their potential, and pursue their dreams with confidence.  I’m passionate about being a source of encouragement and helping them overcome obstacles, dream bigger, and create a path to success, as my own mentors have done for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"56043d7f-3fdf-4ec4-9e85-2f2067a026c6\"}":{"__typename":"DeepDives","uuid":"56043d7f-3fdf-4ec4-9e85-2f2067a026c6","content":"\u003cp\u003eYou don’t have to chase perfection! I used to put immense pressure on myself to take the hardest classes, maintain perfect grades, and participate in every extracurricular. Looking back, I wish I’d told myself that mistakes aren’t the end-all, be-all, and that it’s more important to pursue what you love rather than what you think you \u003cem\u003eshould\u003c/em\u003e be doing. That’s a lesson I hope to share with my mentees: perfectionism isn’t the key to achieving your goals. Mistakes will happen, but they won’t cost you your dreams.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"47cd80d9-2d58-4866-b68b-d729bc1cf797\"}":{"__typename":"DeepDives","uuid":"47cd80d9-2d58-4866-b68b-d729bc1cf797","content":"\u003cp\u003eI am currently working on launching a Substack, which is an online newsletter platform where writers can share ideas and insights directly with readers. The goal of my Substack is to explore how historical events have shaped the world we live in today, presenting this information in a way that’s both engaging and easy to understand. Helping this generation gain a solid grasp of history and its impact on current events is a long-time passion of mine and something I feel is missing in the world of journalism. Once it’s up and running, I’ll be sure to share it with my mentees to spark some meaningful conversations! 😉\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"2d1c29c1-d5f3-4a7f-a207-9f57d8873681\"}":{"__typename":"DeepDives","uuid":"2d1c29c1-d5f3-4a7f-a207-9f57d8873681","content":"\u003cp\u003eI hope to be part of a meaningful shift in how we view therapy and mental health. I strongly believe that therapy should be accessible to all and introduced to students early on in school curriculums. Additionally, I want to see change in how inaccessible therapy currently is—no one who could benefit from mental health support should be denied this opportunity due to inequalities in our healthcare system.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"c671e38e-2964-49c9-8399-6a4c112fe72e\"}":{"__typename":"School","uuid":"c671e38e-2964-49c9-8399-6a4c112fe72e","name":"The King's Academy","city":"Palm Beach","type":"HIGH","state":"Florida","country":"United States","zip":"33414"},"Education:{\"uuid\":\"69219373-96fb-4709-9c06-9cd6d15fdf2f\"}":{"__typename":"Education","uuid":"69219373-96fb-4709-9c06-9cd6d15fdf2f","school":{"__ref":"School:{\"uuid\":\"c671e38e-2964-49c9-8399-6a4c112fe72e\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"6b8b30e6-8ea2-4008-aca5-b93595cf5c49\"}":{"__typename":"Education","uuid":"6b8b30e6-8ea2-4008-aca5-b93595cf5c49","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"816a28a1-783e-45ff-9e9c-3bc34327623b\"}":{"__typename":"MentorPublicProfile","uuid":"816a28a1-783e-45ff-9e9c-3bc34327623b","displayName":"Mackenzie G.","slug":"mackenzie-graves","biography":"\u003cp\u003eHi, I’m Mackenzie! I’ve taken a unique path in my academic and professional journey, combining psychology, entrepreneurship, and creative writing. When I began college, I joined a start-up and quickly grew into a co-founder role, leading me to step away from school to focus on the business full-time. After the company was sold, I returned to school at Columbia to finish my degree.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy interest in psychology grew out of my work with people in a fast-paced start-up environment, where I saw firsthand how understanding human behavior impacts a team. I’m committed to advancing my studies in psychology with the goal of clinical practice and teaching in the future.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have a deep love for creative writing, especially nonfiction. I’ve helped students craft college essays and have been the ghost-writer of a memoir for a mentor of mine. Writing, for me, is about helping people express their experiences in authentic and compelling ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentoring and tutoring students has been a passion of mine for years—whether I’m guiding them through entrepreneurship, teaching personal finance skills, or helping them find topics that genuinely inspire them in their essays. My psychology background allows me to connect with students and understand their motivations, making our work together meaningful and impactful.\u003c/p\u003e","teachingVideoPlaybackId":"00gKNeLxDBgYa00QrqlvvO2Efy3NYbYQFZ4I4WKbST900c","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bce65fdc-0399-47d4-94ce-bee1f3d33b2a\"}"},{"__ref":"DeepDives:{\"uuid\":\"56043d7f-3fdf-4ec4-9e85-2f2067a026c6\"}"},{"__ref":"DeepDives:{\"uuid\":\"47cd80d9-2d58-4866-b68b-d729bc1cf797\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d1c29c1-d5f3-4a7f-a207-9f57d8873681\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c8d14a02-3cea-44ac-8fab-48b9b64ca75a/-/preview/-/format/jpg/","https://ucarecdn.com/6bfac048-5e5c-48f5-8034-52307ba5a433/-/preview/-/format/jpg/","https://ucarecdn.com/314afdaf-a18e-48c9-b582-d0bab60a6a4a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"69219373-96fb-4709-9c06-9cd6d15fdf2f\"}"},{"__ref":"Education:{\"uuid\":\"6b8b30e6-8ea2-4008-
