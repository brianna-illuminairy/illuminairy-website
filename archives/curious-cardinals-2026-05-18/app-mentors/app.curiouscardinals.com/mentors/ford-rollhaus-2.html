xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5abcf1b5-6b32-4684-8b0f-a0274c8ad276\"}":{"__typename":"Favorites","uuid":"5abcf1b5-6b32-4684-8b0f-a0274c8ad276","photoUrl":"https://ucarecdn.com/6f6dcad1-e270-4e7a-aa65-2c97687e6b39/","title":"Broncos","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"792695b9-2583-410d-8072-a7871c08357b\"}":{"__typename":"Favorites","uuid":"792695b9-2583-410d-8072-a7871c08357b","photoUrl":"https://ucarecdn.com/5dd4dee9-c943-443b-a148-c406b7090c2f/","title":"Satisfactory","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"cb46eacf-3fba-4cd0-940a-4349e1d58915\"}":{"__typename":"DeepDives","uuid":"cb46eacf-3fba-4cd0-940a-4349e1d58915","content":"\u003cp\u003eI sometimes look back at middle and high school, amazed at how fast everything went by. I know it’s cliche, but it is true that one day you’re walking into middle school, scared out of your mind with braces and all, and the next thing you know you’re living in a city alone thousands of miles away from home. Looking back, I wish I had lived in the moment much more than I did instead of caring so much about the past or the future. These days, it is so easy to fall into the trap of social media (doom scrolling on TikTok anyone?) or grade hyperfixation (despite what I thought, a 95 instead of a 98 is not the end of the world) that you lose track of what really matters. I would tell myself to take a step back, self reflect, and figure out what, to me, really matters.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"b2d34b24-7fb0-410c-acab-45a36aa13364\"}":{"__typename":"DeepDives","uuid":"b2d34b24-7fb0-410c-acab-45a36aa13364","content":"\u003cp\u003eEvery summer, I try to have a project going. Two years ago it was a laser cutter, last year a 3D printer, but this year I’m taking it to the next level and trying to create something completely new - not just an improvement on something that already exists. It’s still in the early design stage, but I’m hoping to create a modular system of “dumb” (no processor) tiles where one central computer knows the shape of the whole system, potentially allowing for some sort of display/game of some kind. This would involve using the signal processing, communication systems, and PCB design experience I’ve gotten this year at school in a real project, an exciting step in my engineering career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"25af7e79-bfad-4bd3-8327-2c63b7df80de\"}":{"__typename":"DeepDives","uuid":"25af7e79-bfad-4bd3-8327-2c63b7df80de","content":"\u003cp\u003eWhen I was a kid, I used to have a recurring dream where I would float through the hallways of my house, almost swimming through the air. I have yet to figure out what the real meaning behind this dream was, but I like to imagine it subconsciously inspired me to never give up and solidify the belief that “anything is possible.” This is the kind of mantra that I live my life through: something may be very hard, maybe historically so, but if you put the work in you’ll be able to get it done. As Thomas Edison once said, “I have not failed. I've just found 10,000 ways that won't work.”\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a9dbb704-5391-4a00-8721-899cb7684c93\"}":{"__typename":"DeepDives","uuid":"a9dbb704-5391-4a00-8721-899cb7684c93","content":"\u003cp\u003eGrowing up in Colorado, I absolutely love to do all the stereotypical mountain things. In the summer you’ll often find me out hiking in the forest somewhere, and in the winter I’ll stay warm by skiing during a blizzard (there ain’t no friends on a powder day!). Now that I’m in New York City, I have also found a new love for going on strolls through the park, finding great restaurants, and exploring the city as a whole.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2f319bcf-259e-4dfe-96be-2bb0ab0b948f\"}":{"__typename":"School","uuid":"2f319bcf-259e-4dfe-96be-2bb0ab0b948f","name":"Colorado Academy","city":"Denver","type":"HIGH","state":"Colorado","country":"United States","zip":"80235"},"Education:{\"uuid\":\"cd02bd60-21bb-4896-9382-0ecdc399d572\"}":{"__typename":"Education","uuid":"cd02bd60-21bb-4896-9382-0ecdc399d572","school":{"__ref":"School:{\"uuid\":\"2f319bcf-259e-4dfe-96be-2bb0ab0b948f\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"298c2736-8943-4db8-8346-832cb84bff72\"}":{"__typename":"Education","uuid":"298c2736-8943-4db8-8346-832cb84bff72","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"4082cf55-bb1c-4a42-bd2f-0b82909c4df7\"}":{"__typename":"MentorPublicProfile","uuid":"4082cf55-bb1c-4a42-bd2f-0b82909c4df7","displayName":"Ford R.","slug":"ford-rollhaus-2","biography":"\u003cp\u003eHello! I’m Ford, a sophomore studying Electrical Engineering at Columbia University, and I am so excited to help you turn all your engineering ideas into a real thing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAbout me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy whole life, I have loved building things: whether it was legos back in lower school or a 3D printer from scratch last summer. However, it wasn’t until college that I really specialized in electrical engineering, inspired by a wonderful professor during my first year. I hope to take this inspiration and pass it forward to future mentees.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I can help you with\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile an electrical engineer by major, I also have plenty of experience in all types of engineering, such as mechanical or computer science. Thus, for any sort of engineering-based learning I can provide valuable mentorship. These include, but are not limited to:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDeveloping a physical prototype of an idea from start to finish\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a maker portfolio for colleges that effectively showcase past projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLessons on design software, from 3D modeling in CAD (like Fusion or Solidworks) to PCB creation in EDA (like KiCad or Altium)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I teach\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt is a fundamental truth to me that the best, if not only, way to learn and understand engineering is through real, hands-on experience. Thus, I will focus on guiding a mentee through the trial and error process of turning any idea, from crazy mechanical creations to intricate electronic devices, into a physical prototype you can show the world.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA literal “crash course” may be the best way to explain it - small failures are inevitable, but in the end the knowledge and experience gained along the way is well worth it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to Curious Cardinals, I have spent the last four summers as a summer camp counselor, teaching everything from archery to coding with about every age group you can imagine. Through this, I have learned how to strike the balance between learning and fun and ensuring that, no matter how experienced or inexperienced someone is, there’s always an intriguing goal and a path to achieve that goal.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHowever, despite how much fun shooting a bow and arrow is, my passion is still engineering and so I spend most of my time doing engineering things. I am currently the Charging System Lead for Columbia’s Formula Racing team, where we build an electric racecar from scratch, and in my free time I’m always working on some personal projects.\u003c/p\u003e","teachingVideoPlaybackId":"HebjQcBgTjC5Fa5WN012bkSjoU9501U4ArEvdGFAswZLc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5abcf1b5-6b32-4684-8b0f-a0274c8ad276\"}"},{"__ref":"Favorites:{\"uuid\":\"792695b9-2583-410d-8072-a7871c08357b\"}"}],"causesSupported":[],"major":"Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cb46eacf-3fba-4cd0-940a-4349e1d58915\"}"},{"__ref":"DeepDives:{\"uuid\":\"b2d34b24-7fb0-410c-acab-45a36aa13364\"}"},{"__ref":"DeepDives:{\"uuid\":\"25af7e79-bfad-4bd3-8327-2c63b7df80de\"}"},{"__ref":"DeepDives:{\"uuid\":\"a9dbb704-5391-4a00-8721-899cb7684c93\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fc7eac98-2aef-45cc-bda7-3fc3be9729df/-/preview/-/format/jpg/","https://ucarecdn.com/859d3797-6473-45e2-a1ca-815173f1f6c0/-/preview/-/format/jpg/","https://ucarecdn.com/61c3ef1d-e612-4bc8-976e-ff883a64e331/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cd02bd60-21bb-4896-9382-0ecdc399d572\"}"},{"__ref":"Education:{\"uuid\":\"298c2736-8943-4db8-8346-832cb84bff72\"}"}],"hiredAt":"2026-02-10T00:02:18.439Z","topics":["Aviation / Aerospace","Coding / Programming","Robotics / Electronics / CAD","Sports Analytics","STEM Project"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ford-rollhaus-2\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4082cf55-bb1c-4a42-bd2f-0b82909c4df7\"}"}}},"_sentryTraceData":"bae10b48c7a14571b4272868a18b429b-b04445ddeee67326-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=bae10b48c7a14571b4272868a18b429b,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled
