t me when they see my outfit, I design and make clothes, I model, and I was even the president of my university's biggest fashion club. \u003cbr\u003e\u003cbr\u003eThat dream -- silly as it may be -- is the reason why I am who I am today. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"c201c4e1-31c8-4ec2-9293-1aef40a93011\"}":{"__typename":"School","uuid":"c201c4e1-31c8-4ec2-9293-1aef40a93011","name":"British International School of Chicago, South Loop","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60605"},"Education:{\"uuid\":\"cc42e00a-8e4d-477a-93d4-c3369bf6b876\"}":{"__typename":"Education","uuid":"cc42e00a-8e4d-477a-93d4-c3369bf6b876","school":{"__ref":"School:{\"uuid\":\"c201c4e1-31c8-4ec2-9293-1aef40a93011\"}"},"startYear":"2013","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef\"}":{"__typename":"School","uuid":"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90089"},"Education:{\"uuid\":\"478433e5-a077-4a05-a074-27e9fdadfc7d\"}":{"__typename":"Education","uuid":"478433e5-a077-4a05-a074-27e9fdadfc7d","school":{"__ref":"School:{\"uuid\":\"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2022","major":"Business Administration","degree":"Bachelor's"},"MentorPublicProfile:{\"uuid\":\"259ddb8b-3ba8-43e6-b2d7-ec502434eaa0\"}":{"__typename":"MentorPublicProfile","uuid":"259ddb8b-3ba8-43e6-b2d7-ec502434eaa0","displayName":"Oluwatobi O.","slug":"oluwatobi-ogunyankin","biography":"Tobi is a Business Administration major minoring in Multimedia, Design, and Entertainment at the University of Southern California, while also being president of the biggest fashion organization on campus. He loves pl
