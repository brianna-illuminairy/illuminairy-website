xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c595ebf3-edcd-4ecb-a4c7-cd6be5f009e3\"}":{"__typename":"Favorites","uuid":"c595ebf3-edcd-4ecb-a4c7-cd6be5f009e3","photoUrl":"https://ucarecdn.com/56ee1511-6d2a-431b-a73c-3edbd76370e3/","title":"The Structure of Scientific Revolutions","type":"BOOK"},"Favorites:{\"uuid\":\"a32b5bdf-ff47-4a22-b3a1-2221444f1555\"}":{"__typename":"Favorites","uuid":"a32b5bdf-ff47-4a22-b3a1-2221444f1555","photoUrl":"https://ucarecdn.com/b13b0252-a754-4e70-9c0b-c08a83f0d67a/","title":"Settlers of Catan","type":"GAME"},"Favorites:{\"uuid\":\"e1bfeee6-3e47-404a-b7c9-d66ef43775a7\"}":{"__typename":"Favorites","uuid":"e1bfeee6-3e47-404a-b7c9-d66ef43775a7","photoUrl":"https://ucarecdn.com/f1f28152-9c6c-488c-84aa-150caf8b3d8e/","title":"San Francisco","type":"CITY"},"CausesSupported:{\"uuid\":\"9279a52d-6ae5-41bc-8273-575361f27b02\"}":{"__typename":"CausesSupported","uuid":"9279a52d-6ae5-41bc-8273-575361f27b02","name":"Women in Stem Engineering","description":"\u003cp\u003eMentoring two STEM undergrads to grow confident, capable, and curious women. \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"ad233905-ae6a-4c5b-ba1e-db62dbf11b2e\"}":{"__typename":"DeepDives","uuid":"ad233905-ae6a-4c5b-ba1e-db62dbf11b2e","content":"\u003cp\u003eAs a middle and high school student, I was curious about everything—I enjoyed all my classes but struggled to find \u003cem\u003ethe one\u003c/em\u003e subject that truly sparked my passion. I often felt a little lost trying to decide what direction to take, and I didn’t always feel confident asking questions or trying something new, especially in male-dominated STEM spaces. Looking back, I realize how much I would have benefited from a mentor—someone who could have helped me explore different interests without the pressure of being perfect or the fear of messing up.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat’s why I’m so passionate about being that person for younger students now. I want to create a space where students can discover what excites them, take risks, and grow without fear of failure. Whether it’s diving into science experiments, asking big questions, or just talking through their goals, I’m here to help them feel confident and supported as they find their own unique path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"a4f02b8b-16f8-4748-a312-ee606de93669\"}":{"__typename":"School","uuid":"a4f02b8b-16f8-4748-a312-ee606de93669","name":"Rowland Hall","city":"Salt Lake City","type":"HIGH","state":"Utah","country":"United States","zip":"84108"},"Education:{\"uuid\":\"e739f1fc-1f00-4c22-acf7-1da567835d73\"}":{"__typename":"Education","uuid":"e739f1fc-1f00-4c22-acf7-1da567835d73","school":{"__ref":"School:{\"uuid\":\"a4f02b8b-16f8-4748-a312-ee606de93669\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f24c429-8e5e-414e-b088-7054f9b308cd\"}":{"__typename":"School","uuid":"6f24c429-8e5e-414e-b088-7054f9b308cd","name":"The University of Chicago","city":"Chicago","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60637"},"Education:{\"uuid\":\"8884ea4b-cc5e-4281-8f9b-340932042882\"}":{"__typename":"Education","uuid":"8884ea4b-cc5e-4281-8f9b-340932042882","school":{"__ref":"School:{\"uuid\":\"6f24c429-8e5e-414e-b088-7054f9b308cd\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Quantum Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"06d76611-785d-4c27-87bd-305abdb341f2\"}":{"__typename":"MentorPublicProfile","uuid":"06d76611-785d-4c27-87bd-305abdb341f2","displayName":"Cody G.","slug":"cody-googin-1","biography":"\u003cp\u003eCody Googin is a Ph.D. student in Materials Science at UC Santa Barbara. She holds a B.S. in Molecular Engineering (Specializing in Quantum Engineering) from the University of Chicago. Her academic journey has taken her through the worlds of quantum physics, materials science, and data-driven problem solving. Cody’s current research focuses on next-generation batteries for grid-scale energy storage—tackling some of the biggest challenges in sustainable energy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCody brings a unique mix of experience in research, coding, startups, and finance. She’s worked with national labs, helped launch tech initiatives, and enjoys breaking down complex topics into something anyone can understand. Whether she’s mentoring students, debugging a circuit, or exploring the science of how things move and connect, Cody is passionate about inspiring curiosity and confidence in young learners.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn her free time, Cody enjoys spending time outdoors surfing, skiing, biking, or backpacking with friends. \u003c/p\u003e","teachingVideoPlaybackId":"qFx3Bhy02RYzjRm1DvFsymOY00nHM2NAFUBqnZcSK57C00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m proud that I found the courage to switch fields—from quantum engineering to materials science with a focus on sustainability. It wasn’t an easy decision. I was nervous to step away from something I had invested so much time in, and it’s still challenging to navigate unfamiliar territory. But deep down, I knew I was more passionate about solving real-world problems like energy storage and climate resilience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eChoosing this path has helped me feel more aligned with the kind of impact I want to make. Even when it’s hard, I’m reminded that growth often comes from stepping outside your comfort zone—and that following what excites you is always worth it.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c595ebf3-edcd-4ecb-a4c7-cd6be5f009e3\"}"},{"__ref":"Favorites:{\"uuid\":\"a32b5bdf-ff47-4a22-b3a1-2221444f1555\"}"},{"__ref":"Favorites:{\"uuid\":\"e1bfeee6-3e47-404a-b7c9-d66ef43775a7\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9279a52d-6ae5-41bc-8273-575361f27b02\"}"}],"major":"Quantum Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ad233905-ae6a-4c5b-ba1e-db62dbf11b2e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/07679179-c20b-4894-8681-0f17716301c4/-/preview/-/format/jpg/","https://ucarecdn.com/8a48333c-22e0-4952-8939-30e21ff91c36/-/preview/-/format/jpg/","https://ucarecdn.com/94f3ea4e-c3b6-42c2-a675-ab61ee86fcf9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e739f1fc-1f00-4c22-acf7-1da567835d73\"}"},{"__ref":"Education:{\"uuid\":\"8884ea4b-cc5e-4281-8f9b-340932042882\"}"}],"hiredAt":"2025-04-22T10:55:27.153Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Physics","Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","Creative Writing","Fashion / Cosmetics","Film / Theater","History Project","K-6 Storybook","Music","Sports Journalism","Business / Entrepreneurship","Finance / Investing","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/fe18a7d8-d65b-4523-ab43-2a809d9f45e6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"cody-googin-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"06d76611-785d-4c27-87bd-305abdb341f2\"}"}}},"_sentryTraceData":"73c9b490f91b459cbf86cbac25cb68ce-b31a3ab9adbd58c
