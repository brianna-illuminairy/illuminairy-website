xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4f62fd96-c2b5-4990-b448-6816ad5929d0\"}":{"__typename":"DeepDives","uuid":"4f62fd96-c2b5-4990-b448-6816ad5929d0","content":"\u003cp\u003eTo create a space dedicated to restoring the human mind. I imagine it as a place inspired by ancient philosophies, including Hindu thought, but rooted in something universal: the need for reflection, stillness, and inner balance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis space would honor the shared human experience; how we move through uncertainty, stress, joy, and meaning. It would be a place where anyone, regardless of background or belief, could pause, breathe, and feel grounded.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis goal comes from a deep desire to serve others and help people feel at peace with themselves. In a world that moves quickly and demands constant output, I hope to help create a space that reminds us how to slow down, reflect, and reconnect with what matters.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f09fa7ab-06cf-4a15-9ba6-c878624a83ce\"}":{"__typename":"DeepDives","uuid":"f09fa7ab-06cf-4a15-9ba6-c878624a83ce","content":"\u003cp\u003eMentorship matters to me because I would not be where I am without people who took the time to challenge me, guide me, and believe in me before I fully believed in myself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe most impact mentors in my life didn't just teach me knowledge; they shaped how I think, how I approach uncertainty, and how I navigate failure.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI care deeply about passing that forward. To me, mentorship is about building confidence in how someone think, not just what they achieve.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c5389df0-fdf8-450b-9901-9287e9601dfb\"}":{"__typename":"DeepDives","uuid":"c5389df0-fdf8-450b-9901-9287e9601dfb","content":"\u003cp\u003eI want to build intelligent systems that help us better understand how the human mind works, and use that understanding to improve mental well-being.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want to design tools that can analyze patterns in how we think and make decisions, and translate those patterns into insight that help people learn, adapt, and feel supported.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want my work to make people feel more understood, more capable, and more confident in how they navigate their own minds.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"27d28c49-867b-44ce-aae6-d3ced8ec9028\"}":{"__typename":"DeepDives","uuid":"27d28c49-867b-44ce-aae6-d3ced8ec9028","content":"\u003cp\u003eI spend a lot of time thinking about uncertainty. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am not drawn to perfect performance. I am drawn to the moments where someone pauses, rethinks, and grows.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI care less about being the smartest person in the room and more about creating environments where curiosity feels safe. I genuinely believe that how someone handles uncertainty says more about their future than any single achievement.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"8d47addb-d02e-4d63-98f5-1b04f11fde1c\"}":{"__typename":"School","uuid":"8d47addb-d02e-4d63-98f5-1b04f11fde1c","name":"The Early College at Guilford","city":"Greensboro","type":"HIGH","state":"North Carolina","country":"United States","zip":"27410"},"Education:{\"uuid\":\"c29e279d-d5d6-425a-a0ce-0a1d890c47b6\"}":{"__typename":"Education","uuid":"c29e279d-d5d6-425a-a0ce-0a1d890c47b6","school":{"__ref":"School:{\"uuid\":\"8d47addb-d02e-4d63-98f5-1b04f11fde1c\"}"},"startYear":"2008","endYear":"2012","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"e80e9f28-050f-4160-b5a8-cdef5db11859\"}":{"__typename":"Education","uuid":"e80e9f28-050f-4160-b5a8-cdef5db11859","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2027","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"103ef1b4-d066-462a-a2fd-3cf3113efe7b\"}":{"__typename":"MentorPublicProfile","uuid":"103ef1b4-d066-462a-a2fd-3cf3113efe7b","displayName":"Praveen S.","slug":"praveen-suthaharan-1","biography":"\u003cp\u003eI deeply care about helping others find their passion, confidence, and sense of purpose. It took me time to find mine, and I truly believe that journey is not something to rush. Through years of learning, questioning, and exploring, I've come to realize that curiosity itself is a strength. Today, I feel grounded, fulfilled, and genuinely excited to share what I have learned with the next generation of thinkers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMuch of my life has been dedicated to understanding how the mind works. I study this through an unconventional but incredibly engaging approach: games. Psychological games allow us to explore how people think, learn, adapt, and evolve; without pressure, labels, or judgement. These games are not about winning or losing; they are about learning how we think and why we think the way we do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am especially inspired by the idea that learning about the mind doesn't have to feel intimidating or clinical. Imagine a world where we don't need wires, tests, or stressful environments to understand ourselves. Instead, from the comfort of our homes, we can explore our own thinking patterns through interactive games that quietly build self-awareness, resilience and confidence. This approach empowers students to better understand themselves while having fun and staying curious.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside psychology, I am deeply fascinated by where artificial intelligence is heading and how it can be used responsible and creatively to support learning and personal growth. These new tools can help us recognize patterns, encourage reflection, and personalize learning in ways that were never possible before. I am particularly motivated to introduce these ideas to the young minds; not as something abstract or intimidating, but as tools that can be used ethically to improve how we learn, think, and care for ourselves and others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen working with students, my goal is to create a space that feels safe, encouraging, and intellectually exciting. I value asking good questions over memorizing answers, and I believe mistakes are not failures but signals that learning is happening. I want students to feel comfortable being curious, unsure, and ambitious all at once.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I hope to help students not only grow academically, but also develop confidence in how they think, communicate, and explore the world. If a student walks away feeling more curious about their own mind and more confident in their ability to learn, then I consider that a success.\u003c/p\u003e","teachingVideoPlaybackId":"iJoVtu6XQiGNsJpYGp00kixM00nwBjHtZNo5pdkIJgLZ00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4f62fd96-c2b5-4990-b448-6816ad5929d0\"}"},{"__ref":"DeepDives:{\"uuid\":\"f09fa7ab-06cf-4a15-9ba6-c878624a83ce\"}"},{"__ref":"DeepDives:{\"uuid\":\"c5389df0-fdf8-450b-9901-9287e9601dfb\"}"},{"__ref":"DeepDives:{\"uuid\":\"27d28c49-867b-44ce-aae6-d3ced8ec9028\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c2f323af-4684-4fc1-8798-89760198b578/-/preview/-/format/jpg/","https://ucarecdn.com/84e559c6-7df8-44df-a6cf-65dc6e47ec3a/-/preview/-/format/jpg/","https://ucarecdn.com/f12c01e3-80e1-468d-a860-4e6d77be72a6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c29e279d-d5d6-425a-a0ce-0a1d890c47b6\"}"},{"__ref":"Education:{\"uuid\":\"e80e9f28-050f-4160-b5a8-cdef5db11859\"}"}],"hiredAt":"2026-01-19T18:40:28.566Z","topics":["Writing","Academic Coaching","Coding / Programming","Machine Learning / AI","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"praveen-suthaharan-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"103ef1b4-d066-462a-a2fd-3cf3113efe7b\"}"}}
