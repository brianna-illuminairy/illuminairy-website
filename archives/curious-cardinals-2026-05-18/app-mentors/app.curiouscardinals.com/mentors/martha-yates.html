xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a2366cdd-b23e-401d-9d0b-96615a84b418\"}":{"__typename":"Favorites","uuid":"a2366cdd-b23e-401d-9d0b-96615a84b418","photoUrl":"https://ucarecdn.com/305a159f-1353-4390-bd38-8b5631daba81/","title":"All the Light We Cannot See","type":"BOOK"},"Favorites:{\"uuid\":\"e5b458d4-4ba5-4d8a-842a-e9f48624e4b1\"}":{"__typename":"Favorites","uuid":"e5b458d4-4ba5-4d8a-842a-e9f48624e4b1","photoUrl":"https://ucarecdn.com/81f618e2-b26a-4163-854d-ca39256c852b/","title":"London","type":"CITY"},"Favorites:{\"uuid\":\"f75a8f9f-3a00-4316-a102-48584f338db6\"}":{"__typename":"Favorites","uuid":"f75a8f9f-3a00-4316-a102-48584f338db6","photoUrl":"https://ucarecdn.com/cff6f8c7-dd90-4d46-84c3-5be524e3127b/","title":"Scrabble","type":"GAME"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ce1d2352-8eb4-4f18-884f-415aebfd6113\"}":{"__typename":"DeepDives","uuid":"ce1d2352-8eb4-4f18-884f-415aebfd6113","content":"\u003cp\u003eMentorship to be is an opportunity to empower students to think big and have lofty goals for themselves. In high school, I was always passionate about math and science, and just loved learning in general, but often felt limited by the traditional array of classes open to me. It was hard to figure out exactly what I liked, what I could do with this new knowledge, and what it could be long term. In college I realized people around me had big ambitions for themselves, but as someone whose parents didn't go to American universities, I didn't know what was realistic for me and how to even start towards building a goal. Luckily, I was surrounded by amazing professors, teachers, and teammates who encouraged me to think big for myself and mentored me in how to move towards realizing my ambitions. I decided to major in Human Biology my sophomore year in college, partly because of how flexible it was in terms of future career paths. By senior year I felt confident that I wanted to pursue a career in science, but felt intimidated by my lack of hands-on research experience. With the help of my friends and professors, I was able to land a position at Massachusetts General Hospital, where I research the mechanisms behind ALS in the hope of discovering novel therapeutics. This job has been an absolute dream and has built my confidence immensely. The mentorship here has allowed me to fee confident enough to apply to PhD programs this fall in the hopes of going to graduate school next year, a step I never dreamed of myself previously. I am so lucky that I had mentors who believed in me, encouraged me, and guided me in this path towards big goals and passions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a509800a-cf35-4ed7-917c-31c6aea390fb\"}":{"__typename":"DeepDives","uuid":"a509800a-cf35-4ed7-917c-31c6aea390fb","content":"\u003cp\u003eI entered Stanford my freshman year with a lot of interests, but unsure on my passions. I considered majoring in history, math, international relations, but eventually landed on Human Biology. A few teammates had gone through the program and had great things to say about the variety of classes open to us, the flexibility to design your concentration to fit your interests, and most importantly, the amazing professors. I knew the importance of passionate and kind teachers in my high school experience, and being intimidated by the big pond that is Stanford, I knew the support of those mentors would be essential for me. Human Biology was the perfect fit for me, allowing me to create my concentration of Genes \u0026amp; Environment on Behavior, which focused on the neuroscience behind human behavior and how much we have control over. It also allowed me to take classes focused on human rights and ethics within healthcare, which I found incredibly impactful and guide many of my decisions in research. The well-rounded nature of the major as well as the incredible support system for students made my Stanford experience so incredible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a1337c21-cdd6-40de-8c92-a8e7fc82b29e\"}":{"__typename":"DeepDives","uuid":"a1337c21-cdd6-40de-8c92-a8e7fc82b29e","content":"\u003cp\u003eIn college, I was lucky enough to be introduced to Mary Cooper through my team. Mary is a military kid and moved around a lot, just as I had. Funnily enough, I knew about Mary before coming to Stanford, because I had moved away from Los Angeles the year before she moved there, so we had some overlapping connections. Mary is kind and bubbly, and can make anyone feel impressive and exciting. She is incredibly generous and I am so lucky to be her friend. Mary is also passionate about space and disability advocacy, as an amputee herself. Throughout college she challenged herself constantly; she walked on to a DI team, majored in Aeronautics \u0026amp; Astronautics, a notoriously difficult major, walked the second most miles of any Stanford tour guide, all while pursuing her dream of going into space. Our senior year, she was part of AstroAccess's first zero-gravity flight to experiment with how to make accommodations for disabled people going into space. Despite all the articles and social media posts about her impressive accomplishments, Mary remained humble and kind, still making time to cheer on those around her. Being around Mary allowed me to doubt myself less and aim for bigger goals, to keep working at things when they don't work out the first time, and most importantly, to lift other people up as I go.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4c9f57ae-4011-478f-80e8-ed6664a65734\"}":{"__typename":"Education","uuid":"4c9f57ae-4011-478f-80e8-ed6664a65734","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":"2022","major":"Human Biology","degree":"BS"},"School:{\"uuid\":\"ac524a28-d515-40bb-994b-8f6d80a02891\"}":{"__typename":"School","uuid":"ac524a28-d515-40bb-994b-8f6d80a02891","name":"Acalanes High School","city":"Lafayette","type":"HIGH","state":"CA","country":"USA","zip":"94595"},"Education:{\"uuid\":\"136a497e-ecdf-4838-8068-1f2cdc3fc07d\"}":{"__typename":"Education","uuid":"136a497e-ecdf-4838-8068-1f2cdc3fc07d","school":{"__ref":"School:{\"uuid\":\"ac524a28-d515-40bb-994b-8f6d80a02891\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"3ca39482-7e70-4193-8bcf-7955a8cf92fb\"}":{"__typename":"MentorPublicProfile","uuid":"3ca39482-7e70-4193-8bcf-7955a8cf92fb","displayName":"Martha Y.","slug":"martha-yates","biography":"Martha graduated from Stanford in June 2022 with a BS in Human Biology (focusing on why we behave the way we do and how our genes are involved) and a minor in East Asian Studies (Chinese). While at Stanford she discovered her passion for cooking, pottery, and doing work outside. She also rowed all 4 years at Stanford, winning multiple national championships and serving as team captain. She also tutored middle and high school students throughout college in a variety of subjects, but now hopes to work with students more on what they're passionate about. She now works in the Wainger Lab at Massachusetts General Hospital researching ALS, which involves lots of bacteria, neurons, and pipetting! Her goals in tutoring are to help students discover and advocate for what interests them so that they don't avoid things they're passionate about because they're intimidating. Her favorite movie is Ratatouille, and she tries to bring Gusteau's motto of \"Anyone can cook\" to subjects outside of cooking. ","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a2366cdd-b23e-401d-9d0b-96615a84b418\"}"},{"__ref":"Favorites:{\"uuid\":\"e5b458d4-4ba5-4d8a-842a-e9f48624e4b1\"}"},{"__ref":"Favorites:{\"uuid\":\"f75a8f9f-3a00-4316-a102-48584f338db6\"}"}],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ce1d2352-8eb4-4f18-884f-415aebfd6113\"}"},{"__ref":"DeepDives:{\"uuid\":\"a509800a-cf35-4ed7-917c-31c6aea390fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1337c21-cdd6-40de-8c92-a8e7fc82b29e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8a5e5258-ffe0-46b0-9bab-fd6d225cb97d/-/crop/621x621/229,0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4c9f57ae-4011-478f-80e8-ed6664a65734\"}"},{"__ref":"Education:{\"uuid\":\"136a497e-ecdf-4838-8068-1f2cdc3fc07d\"}"}],"hiredAt":"2022-09-27T14:14:16.000Z","topics":["Physics","Calculus","K-5 Grade Math","History","Precalculus / Trigonometry","Medicine / Health","Geometry","STEM Project","History Project","6-8 Grade Science","Biology","Algebra I","Law / Government / Policy","Global Health","Algebra II","Chemistry","Pre-Algebra"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"martha-yates\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3ca39482-7e70-4193-8bcf-7955a8cf92fb\"}"}}},"_sentryTraceData":"5a55649da4d1470995e666fd20dd725b-95f49009afdda699-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5a55649da4d1470995e666fd20dd725b,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"martha-yates"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
