xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"91a43044-4187-4fc0-bf3b-d49cfa644264\"}":{"__typename":"DeepDives","uuid":"91a43044-4187-4fc0-bf3b-d49cfa644264","content":"\u003cp\u003eDream bigger and start acting on those dreams sooner. I was always a dreamer—Olympic-level wrestling, starting something meaningful in business, making an impact—but I sometimes played it too safe early on. Tell that younger me: Don't wait for \"permission\" or the \"perfect\" time to chase what lights you up. Whether it's diving into crypto and finance (which led to co-founding Normal Finance), experimenting with beach wrestling (where I got to make history as the first U.S. man to win Beach World Series gold in Acapulco 2024, then silver in Monterrey 2025, and more), or just believing you can compete at Northwestern on a full-ride—start taking those small, bold steps now. The fear of failing shrinks when you realize most \"failures\" are just data points on the way to something great.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9190ce99-4a05-4ecc-89d5-7ae8c7c5e597\"}":{"__typename":"DeepDives","uuid":"9190ce99-4a05-4ecc-89d5-7ae8c7c5e597","content":"\u003cp\u003eMentorship matters to me deeply because it's the single biggest accelerator of growth I've ever experienced—and now, I want to pay that forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d7861a30-2e95-45e1-9f9b-12921e86d75e\"}":{"__typename":"DeepDives","uuid":"d7861a30-2e95-45e1-9f9b-12921e86d75e","content":"\u003cp\u003eTo live a life that honors Jesus Christ so fully that, when my time on earth ends, I hear those words from Him: \"Well done, good and faithful servant\" (Matthew 25:21). More than any medal, championship, business milestone, or personal achievement, my deepest longing is to make it to heaven—not because of my own goodness or accomplishments, but because of His grace, and to have faithfully followed Him along the way, loving God with all my heart and loving others as myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2758266a-7567-4da5-9c66-a47284dd6d83\"}":{"__typename":"DeepDives","uuid":"2758266a-7567-4da5-9c66-a47284dd6d83","content":"\u003cp\u003eI chose my major—Learning and Organizational Change (LOC) in Northwestern's School of Education and Social Policy—because it perfectly aligned with the kind of impact I wanted to make in the world.\u003cbr\u003e\u003cbr\u003eI picked it because it trained me to understand and elevate people and organizations. And looking back, it's been one of the best decisions I ever made.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"846b1265-d311-4a92-9216-11cb1b1f74ee\"}":{"__typename":"School","uuid":"846b1265-d311-4a92-9216-11cb1b1f74ee","name":"Saint Charles East High School","city":"St. Charles","type":"HIGH","state":"Illinois","country":"United States","zip":"60174"},"Education:{\"uuid\":\"672f4d36-d349-44d3-ba27-6ffae4cd0258\"}":{"__typename":"Education","uuid":"672f4d36-d349-44d3-ba27-6ffae4cd0258","school":{"__ref":"School:{\"uuid\":\"846b1265-d311-4a92-9216-11cb1b1f74ee\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"e5825d97-79df-416b-8ab4-6b4796249762\"}":{"__typename":"Education","uuid":"e5825d97-79df-416b-8ab4-6b4796249762","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Learning and Organizational Change","degree":null},"MentorPublicProfile:{\"uuid\":\"b28fcecf-9d32-473a-b83d-1db6e6d4380e\"}":{"__typename":"MentorPublicProfile","uuid":"b28fcecf-9d32-473a-b83d-1db6e6d4380e","displayName":"Justin B.","slug":"justin-benjamin","biography":"\u003cp\u003e\u003cstrong\u003eHello!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI'm Justin Benjamin, a proud Team USA wrestler, CEO of Normal Finance (normalfinance.io), and a lifelong dreamer and believer in Christ passionate about turning big visions into reality. Hailing from the suburbs of Chicago—specifically St. Charles, Illinois—I grew up with an unshakeable belief that discipline, faith, and bold ambition can open any door. That mindset carried me from high school mats to the ivy-covered halls of Northwestern University, and now into the worlds of elite athletics, innovative fintech, and soon, fatherhood.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI graduated from Northwestern University in 2023 with a degree in Learning and Organizational Change, complemented by studies in Economics and Cognitive Science. Balancing rigorous academics with Division I wrestling as a Wildcat was no small feat—I earned a full-ride athletic scholarship after capturing an Illinois state wrestling championship at St. Charles East High School. Those years taught me the true meaning of resilience: pushing through grueling training sessions, late-night study marathons, and the highs and lows of competition.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn 2024, I further honed my entrepreneurial edge at Draper University, sharpening the skills I now apply daily as co-founder of Normal Finance, a mission-driven platform making cryptocurrency accessible, user-friendly, and truly \"normal\" for everyday people.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy athletic journey didn't end with college. I've proudly represented Team USA in beach wrestling—a dynamic, fast-growing discipline that blends traditional grappling with the unique challenges of sand. Highlights include becoming the first U.S. man to win a Senior Beach World Series gold medal (70kg, Acapulco 2024), earning silver at the 2025 Monterrey Beach World Series, claiming the 2024 Senior Carolina Beach Nationals title, and securing All-American honors at national championships. These experiences fuel my drive to inspire others: proving that with grit, strategy, and heart, you can achieve historic firsts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I'm not building Normal, training for the next international competition, or chasing Olympic dreams in wrestling, I treasure every moment with my wonderful wife and our soon-to-arrive baby boy. Family keeps me grounded. Outside of that, you'll find me embracing the outdoors—surfing ocean waves, carving skatepark lines, skiing fresh powder, tending my garden, or nurturing fruit trees. These pursuits recharge my creativity and remind me of life's simple, profound joys.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm genuinely thrilled at the opportunity to join Curious Cardinals. With my blend of high-performance athletics, entrepreneurial success, academic insight, and genuine love for mentoring, I'd be honored to help your students dream bigger, work smarter, and build brighter futures. Together, let's make the extraordinary feel achievable!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDream BIG,\u003cbr\u003eJustin Benjamin\u003c/p\u003e","teachingVideoPlaybackId":"n9lLf00xdeBoklys4ArrqVprSN00TMbwq2CNISFbWsseA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Learning and Organizational Change","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"91a43044-4187-4fc0-bf3b-d49cfa644264\"}"},{"__ref":"DeepDives:{\"uuid\":\"9190ce99-4a05-4ecc-89d5-7ae8c7c5e597\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7861a30-2e95-45e1-9f9b-12921e86d75e\"}"},{"__ref":"DeepDives:{\"uuid\":\"2758266a-7567-4da5-9c66-a47284dd6d83\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b8268e41-fa2b-488b-94c3-f714ad303a3b/-/preview/-/format/jpg/","https://ucarecdn.com/1b54613f-b394-4f95-8d28-93f657c47307/-/preview/-/format/jpg/","https://ucarecdn.com/94c18aff-4867-43e6-a9c7-0ee42dc8b0da/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"672f4d36-d349-44d3-ba27-6ffae4cd0258\"}"},{"__ref":"Education:{\"uuid\":\"e5825d97-79df-416b-8ab4-6b4796249762\"}"}],"hiredAt":"2026-02-16T18:37:03.864Z","topics":["Statistics","Calculus","Precalculus / Trigonometry","Algebra II","Geometry","Algebra I","Pre-Algebra","K-5 Grade Math","Physics","Biology","Chemistry","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading"
