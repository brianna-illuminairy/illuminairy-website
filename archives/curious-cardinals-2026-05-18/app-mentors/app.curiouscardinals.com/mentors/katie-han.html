xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b6d59daf-7b16-487c-8133-c31bff4493c1\"}":{"__typename":"DeepDives","uuid":"b6d59daf-7b16-487c-8133-c31bff4493c1","content":"\u003cp\u003eI would tell my younger self to stay attuned to what makes you genuinely curious, and to not be afraid of carving your own path based on these interests :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"72510ed4-4d33-4271-8026-72396b18161a\"}":{"__typename":"DeepDives","uuid":"72510ed4-4d33-4271-8026-72396b18161a","content":"\u003cp\u003eI hope to start my own design studio, bridging my interests in product design, art, health, and human behavior!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d6e9babf-da90-4332-92ad-d5b10c97276b\"}":{"__typename":"DeepDives","uuid":"d6e9babf-da90-4332-92ad-d5b10c97276b","content":"\u003cp\u003eOne of my favorite summers in high school was spent at The School of The New York Times, where I took a course called “Photojournalism as Art.” Through this, I created a photo essay about the culture of food in two Chinatowns in New York. This fueled my interest in using photography as a tool for human inquiry and storytelling.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e621d358-2982-4091-9873-58b05bebdec9\"}":{"__typename":"DeepDives","uuid":"e621d358-2982-4091-9873-58b05bebdec9","content":"\u003cp\u003eI always love learning new ways of creating; currently, I am trying to learn music production ♫\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9d4ffa7a-8870-45c3-ba80-60287d844893\"}":{"__typename":"School","uuid":"9d4ffa7a-8870-45c3-ba80-60287d844893","name":"Falmouth High School","city":"Falmouth","type":"HIGH","state":"Maine","country":"United States","zip":"04105"},"Education:{\"uuid\":\"5d1607cc-d7ed-4625-82a5-05b92318a02f\"}":{"__typename":"Education","uuid":"5d1607cc-d7ed-4625-82a5-05b92318a02f","school":{"__ref":"School:{\"uuid\":\"9d4ffa7a-8870-45c3-ba80-60287d844893\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"9e5ebd1f-f1e5-4f63-ae10-8b2934fec845\"}":{"__typename":"Education","uuid":"9e5ebd1f-f1e5-4f63-ae10-8b2934fec845","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Design","degree":null},"MentorPublicProfile:{\"uuid\":\"bbf93a04-9495-4eaa-bd6b-207ecb8d3f19\"}":{"__typename":"MentorPublicProfile","uuid":"bbf93a04-9495-4eaa-bd6b-207ecb8d3f19","displayName":"Katie H.","slug":"katie-han","biography":"\u003cp\u003eHi! My name is Katie :)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated from Stanford University in 2024 with a B.S. in Design, a minor in Architecture, and Honors in the Arts. I charted an interdisciplinary path, melding interests in product design, art, psychology, health, and urban studies. I am excited to encourage students’ creative confidence, and support the bridging of disciplines and passions.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile a student at Stanford, I worked as a photographer for the university and ran my own photography business. I also served as Editor-in-Chief of MINT Magazine, Stanford’s fashion and culture publication.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough my professional experiences and personal projects, I have leveraged design and art as tools to improve well-being. Last summer, I worked at Kounkuey Design Initiative, an equity-focused urban design and community development nonprofit, to co-design public spaces in LA. Currently, I work as a part-time art instructor in NYC and work on physical design projects in my spare time. I love making of all sorts—you can also find me creating jewelry, watercolor painting, cooking for my friends, and songwriting!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am so grateful for the mentorship and education I have received throughout my life, and am excited to give back by cultivating a warm and creative class atmosphere.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYou can check out some of my art and design work at katie-han.com 🌷\u003c/p\u003e","teachingVideoPlaybackId":"6MV2ifPdd02auQQNoy1tZ01BD02bYcC2Ghd4b7RJFbeoo00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major"
