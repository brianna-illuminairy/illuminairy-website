xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e1f5365d-126b-4e64-ac24-cae3c634b62c\"}":{"__typename":"DeepDives","uuid":"e1f5365d-126b-4e64-ac24-cae3c634b62c","content":"\u003cp\u003eI would tell my middle or high school self to embrace opportunities with an open mind. Looking back, I often shied away from taking risks, but I’ve come to realize that growth comes from stepping outside your comfort zone. Taking risks is an essential part of the learning process. That doesn’t mean being reckless—making thoughtful, informed decisions is important—but if an opportunity excites you, lean in and explore it. You never know what you might discover about yourself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8bfd17df-d21d-4364-8878-1de28a1266b1\"}":{"__typename":"DeepDives","uuid":"8bfd17df-d21d-4364-8878-1de28a1266b1","content":"\u003cp\u003eMy dream job is to work in an educational setting, whether in higher education or K-12 schools, where I can make a meaningful impact on students' learning and development. Teaching has been one of the most fulfilling experiences of my life—I love engaging with students, helping them grow academically and personally, and witnessing those moments when concepts truly click. The ability to inspire curiosity, foster critical thinking, and support students in reaching their full potential is what drives my passion for education. No matter the specific role, I want to be in an environment where I can contribute to shaping the next generation of learners and leaders.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"a7890dea-afd6-4e1f-9a74-e40bec8b2846\"}":{"__typename":"DeepDives","uuid":"a7890dea-afd6-4e1f-9a74-e40bec8b2846","content":"\u003cp\u003eMentorship is deeply meaningful to me because I’ve been fortunate to learn from incredible mentors who have shaped my growth and opportunities. Their guidance made a lasting impact on my journey, and I feel a strong responsibility to pay that forward. Sharing my knowledge and experiences with others isn’t just about giving back—it’s about creating a cycle of learning and empowerment. I also believe that mentorship is a two-way street; every interaction with a student challenges me to see things from new perspectives, deepens my understanding, and helps me grow alongside them. The opportunity to both teach and learn makes mentorship not just something I do, but something I genuinely love.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3cf230d3-48de-4d82-8750-ab7298cfe593\"}":{"__typename":"DeepDives","uuid":"3cf230d3-48de-4d82-8750-ab7298cfe593","content":"\u003cp\u003eI love spending my free time watching sports and exploring NYC with friends. I’m a big fan of basketball, football, and the Premier League, and I enjoy following the games and the energy they bring. Beyond sports, I’m always on the lookout for new restaurants to try, constantly discovering the diverse and exciting food scene that NYC has to offer. Whether it’s catching a game or finding a hidden gem in the city, I enjoy experiences that bring people together and create great memories.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2df7b676-6ddd-45a2-afe3-56b23bf6ae04\"}":{"__typename":"School","uuid":"2df7b676-6ddd-45a2-afe3-56b23bf6ae04","name":"Centerville High School","city":"Centerville","type":"HIGH","state":"Ohio","country":"United States","zip":"45459"},"Education:{\"uuid\":\"f8e1aa4b-4646-415a-8cfd-61f6cd3f0c58\"}":{"__typename":"Education","uuid":"f8e1aa4b-4646-415a-8cfd-61f6cd3f0c58","school":{"__ref":"School:{\"uuid\":\"2df7b676-6ddd-45a2-afe3-56b23bf6ae04\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"325cf336-66f1-4387-9a1d-bc17b5f61a74\"}":{"__typename":"Education","uuid":"325cf336-66f1-4387-9a1d-bc17b5f61a74","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Human and Organizational Development and Medicine, Health, and Society","degree":null},"MentorPublicProfile:{\"uuid\":\"f5bfa92b-5235-47d1-9f18-69a5e556e57f\"}":{"__typename":"MentorPublicProfile","uuid":"f5bfa92b-5235-47d1-9f18-69a5e556e57f","displayName":"Sung Jun J.","slug":"sungjun-jeon","biography":"\u003cp\u003eHello! My name is Sung. I was born in Ohio, but when I was three, my family moved to Korea, where I lived for seven years before returning to Ohio. Eventually, I moved to Nashville for college, and I recently graduated from Vanderbilt University with a Bachelor of Science in Human and Organizational Development, as well as Medicine, Health, and Society. I now live in New York City and will be starting a new job as a consultant next year.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAn important part of my journey was when I lived with a host family for a year in sixth-grade due to a family visa situation. During that time, I had to take on many adult responsibilities, like paying bills and writing checks, which pushed me to seek mentors and guidance beyond my family as they were all the way across the globe. I could not rely on them for every problem or challenge I faced due to the 14-hour time difference as well. This experience sparked my interest in problem-solving and ultimately led me to pursue a career in business, where I could apply these skills on a larger scale.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLiving with a host family for a year and joining my high school debate team ignited my deep passion for mentorship and have profoundly shaped my approach to guiding and supporting others. In my sophomore year, I founded the middle school debate team in my district. Since then, I’ve continued mentoring, teaching, and coaching students of all ages.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring the pandemic, I worked as an online debate coach for Charlotte Country Day School. I also participated in a teaching fellowship with Teach For America, where I taught math virtually to students in Texas. In my senior year of college, I had the opportunity to be a classroom teacher, guiding middle school students in debate at the University School of Nashville (USN) for an entire year.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDebate has taught me invaluable skills in research, critical thinking, and communication—skills I now specialize in sharing with students. At Curious Cardinal, my focus is to help students find research and internship opportunities and guiding them through the recruitment process. Whether it’s preparing for interviews or writing compelling cover letters, I can support them throughout the entire journey.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to the passion projects, I also have worked with students on academic mentorship. I have provided guidance in Math, English, Economics, History, standardized test preparation, and the college application process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe that having a mentor has been one of the greatest gifts in my life, and I want to be that support for someone else through Curious Cardinal. Hope to see you at a session!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"giH3C00a6gODMJ1EhT00ODA14AiqhikAhhPNhTz01d00eJI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human and Organizational Development and Medicine, Health, and Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e1f5365d-126b-4e64-ac24-cae3c634b62c\"}"},{"__ref":"DeepDives:{\"uuid\":\"8bfd17df-d21d-4364-8878-1de28a1266b1\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7890dea-afd6-4e1f-9a74-e40bec8b2846\"}"},{"__ref":"DeepDives:{\"uuid\":\"3cf230d3-48de-4d82-8750-ab7298cfe593\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8388b891-2d0c-4f58-a2e4-5da79f32cdf0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f8e1aa4b-4646-415a-8cfd-61f6cd3f0c58\"}"},{"__ref":"Education:{\"uuid\":\"325cf336-66f1-4387-9a1d-bc17b5f61a74\"}"}],"hiredAt":"2024-09-05T21:58:54.409Z","topics":[],"communityBadges":["https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sungjun-jeon\"}})":{"__ref":
