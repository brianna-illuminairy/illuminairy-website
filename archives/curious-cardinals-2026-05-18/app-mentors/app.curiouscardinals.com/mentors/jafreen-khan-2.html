xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f687e552-1c25-4cf0-84b5-1fdd94095248\"}":{"__typename":"Favorites","uuid":"f687e552-1c25-4cf0-84b5-1fdd94095248","photoUrl":"https://ucarecdn.com/0789f6aa-4c8a-4977-a98a-683137c70521/","title":"Timothee Chalamet","type":"ACTOR"},"CausesSupported:{\"uuid\":\"76e27a86-bd53-4ba3-beab-24bf8347cb02\"}":{"__typename":"CausesSupported","uuid":"76e27a86-bd53-4ba3-beab-24bf8347cb02","name":"Leukemia \u0026 Lymphoma Society","description":"\u003cp\u003eStudent of the Year program - team raised over $50,000 in seven weeks\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f8c540b1-2091-41d7-82ac-adaa14a2672c\"}":{"__typename":"DeepDives","uuid":"f8c540b1-2091-41d7-82ac-adaa14a2672c","content":"\u003cp\u003eMentorship has allowed me to bring my authentic self into high education, coming from a background where my parents did not finish high school. Mentorship has allowed me to break into and represent all women of color in the finance industry. Mentorship is the reason why I am here today, capable to give back to others who will soon be in my shoes, if not better. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"092150fb-75c8-443a-9c59-4706416b8c0d\"}":{"__typename":"DeepDives","uuid":"092150fb-75c8-443a-9c59-4706416b8c0d","content":"\u003cp\u003eMy mother is my greatest motivator, constantly reminding me why I push myself every day. She inspires me to use my education and career success to ensure that no one can ever diminish my voice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"be0b8bc5-de51-4d8a-8c55-018340417dc2\"}":{"__typename":"DeepDives","uuid":"be0b8bc5-de51-4d8a-8c55-018340417dc2","content":"\u003cp\u003eI love staying active and regularly go to the gym for weightlifting and running. Keeping active and following a high-protein diet helps me feel disciplined and healthy, both physically and mentally. I also run a food account on Instagram where I share recipes and review new restaurants I've tried.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"99ebfd61-92c2-4756-8d3b-99fa6dd68a45\"}":{"__typename":"DeepDives","uuid":"99ebfd61-92c2-4756-8d3b-99fa6dd68a45","content":"\u003cp\u003eI was a highly motivated and driven student, passionate about exploring advanced studies in higher math and philosophy. However, what mattered most to me was making a lasting impact on my friends, particularly by advocating for mental health education in high-stress environments like the competitive NYC public school system.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"0402e14d-ecbf-481d-a580-7ce24c0994ac\"}":{"__typename":"School","uuid":"0402e14d-ecbf-481d-a580-7ce24c0994ac","name":"Bard High School Early College Queens","city":"Queens","type":"HIGH","state":"New York","country":"United States","zip":"11101"},"Education:{\"uuid\":\"44933c6e-a1f3-4e3c-a281-aac1b442bff9\"}":{"__typename":"Education","uuid":"44933c6e-a1f3-4e3c-a281-aac1b442bff9","school":{"__ref":"School:{\"uuid\":\"0402e14d-ecbf-481d-a580-7ce24c0994ac\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"391c2dd9-e23c-4f56-8d29-52def5327418\"}":{"__typename":"Education","uuid":"391c2dd9-e23c-4f56-8d29-52def5327418","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Applied Economics ","degree":null},"MentorPublicProfile:{\"uuid\":\"0e27bed2-1090-415e-a798-a24456dfd394\"}":{"__typename":"MentorPublicProfile","uuid":"0e27bed2-1090-415e-a798-a24456dfd394","displayName":"Jafreen K.","slug":"jafreen-khan-2","biography":"\u003cp\u003eHello everyone! My name is Jafreen, and I’m from Queens, NYC. I’m currently a junior at Cornell University, majoring in Applied Economics with concentrations in Finance and Entrepreneurship. I've always had a strong passion for math, philosophy, and finance. I attended an early college public high school where I earned my high school diploma by 10th grade and my Associate degree by the time I graduated. During high school, I focused on advanced philosophy thesis writing and calculus-based mathematics, including Multivariable Calculus. I also volunteered with the Leukemia and Lymphoma Society’s Student of the Year program, where my team raised over $50,000 in seven weeks, finishing as first runner-up citywide. During university, I interned at Morgan Stanley and will be interning at Bank of America next summer as an Investment Banking Analyst. In my free time, I enjoy weightlifting, mid-distance running and sprints, cooking, and exploring different cafes.\u003c/p\u003e","teachingVideoPlaybackId":"9022j00rMYfM02mrLG01TawkQ01J8VuWabArP1A5wLYfGNqU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm  proud of my role as the Chief Operating Officer (COO) of the Diversity Accelerator Program (DAP), an initiative designed to provide underrepresented students with the resources, mentorship, and skills needed to succeed in competitive industries like finance . The program focuses on enhancing diversity, equity, and inclusion by equipping participants with essential tools to navigate early recruitment processes and career challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my role as COO, I secured sponsorships from Fidelity Investments and Security Capital Brokerage, raising $2,000 in funding, which significantly expanded our program's capabilities. I led the restructuring of DAP to incorporate a tailored technical curriculum that included case studies, mock interviews, and alumni mentor pairings, ensuring participants received practical, hands-on experience. Additionally, I conducted meetings with various global investment firms to integrate the program into their DE\u0026amp;I partnership portfolios, broadening our reach and strengthening our impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHelping develop comprehensive internship applications through resume workshops, career blueprints, and bi-weekly meetings greatly improved students' confidence and preparation for competitive internship opportunities in investment banking, asset management, consulting, and more. Seeing the growth and success of the participants reaffirmed the value of our efforts, making this experience one of my most rewarding accomplishments.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f687e552-1c25-4cf0-84b5-1fdd94095248\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"76e27a86-bd53-4ba3-beab-24bf8347cb02\"}"}],"major":"Applied Economics ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f8c540b1-2091-41d7-82ac-adaa14a2672c\"}"},{"__ref":"DeepDives:{\"uuid\":\"092150fb-75c8-443a-9c59-4706416b8c0d\"}"},{"__ref":"DeepDives:{\"uuid\":\"be0b8bc5-de51-4d8a-8c55-018340417dc2\"}"},{"__ref":"DeepDives:{\"uuid\":\"99ebfd61-92c2-4756-8d3b-99fa6dd68a45\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0574b311-c699-4098-9348-023338b939fd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"44933c6e-a1f3-4e3c-a281-aac1b442bff9\"}"},{"__ref":"Education:{\"uuid\":\"391c2dd9-e23c-4f56-8d29-52def5327418\"}"}],"hiredAt":"2024-09-12T22:40:14.053Z","topics":["Business / Entrepreneurship","Finance / Investing","Algebra II","Algebra I","Calculus","Economics"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jafreen-khan-2\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0e27bed2-1090-415e-a798-a24456dfd394\"}"}}},"_sentryTraceData":"f8f8b3eec0c74809846221da25fd22f2-bbc0b7aae75d1264-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f8f8b3eec0c74809846221da25fd22f2,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jafreen-khan-2"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInner
