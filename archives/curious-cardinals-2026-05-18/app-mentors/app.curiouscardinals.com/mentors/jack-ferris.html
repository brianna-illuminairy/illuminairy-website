xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1e5c35bd-5f8c-445b-bc3f-e241e66efc0c\"}":{"__typename":"Favorites","uuid":"1e5c35bd-5f8c-445b-bc3f-e241e66efc0c","photoUrl":"https://ucarecdn.com/39986726-c282-43da-9689-a5aa2e98b723/","title":"FC Barcelona","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"23167d9c-37e2-4835-bec9-14d160a3d7ba\"}":{"__typename":"Favorites","uuid":"23167d9c-37e2-4835-bec9-14d160a3d7ba","photoUrl":"https://ucarecdn.com/939c8d17-6728-4da1-8384-6ee7f8ade900/","title":"Amsterdam","type":"CITY"},"Favorites:{\"uuid\":\"926e7a12-7217-43fc-98a1-354e1ebfb955\"}":{"__typename":"Favorites","uuid":"926e7a12-7217-43fc-98a1-354e1ebfb955","photoUrl":"https://ucarecdn.com/cf8c4406-f738-4549-aa08-165e4dde9332/","title":"Call Me By Your Name","type":"MOVIE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0d630a1d-3ac5-42ea-8ef1-0fad0d9e56cc\"}":{"__typename":"DeepDives","uuid":"0d630a1d-3ac5-42ea-8ef1-0fad0d9e56cc","content":"\u003cp\u003eMentorship matters to me because it is so important to have role models in all facets of your life. Whether that is for academics, athletics, relationships, or  navigating identity/sexuality topics. When I think of some of my most formative experiences or conversations, they often involve a role model or someone who I look up to and can learn from. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"15be1ecf-2386-497f-97d7-26470e5a254d\"}":{"__typename":"DeepDives","uuid":"15be1ecf-2386-497f-97d7-26470e5a254d","content":"\u003cp\u003eMy greatest role model is my older sister, Cara. Being eight years younger than her I have always looked up to her and tried to follow in her footsteps from a young age. One of the most valuable things I have learned from her is how to be a good friend. Something I admire about her is she has always had a large group of really close friends. As I get older and grow into my own person I find myself prioritizing surrounding myself with people I love and making time for them. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"47e6d969-2b3d-4d75-8405-00d914c3f0b6\"}":{"__typename":"DeepDives","uuid":"47e6d969-2b3d-4d75-8405-00d914c3f0b6","content":"\u003cp\u003eI chose my major because during my senior year of high school I took AP Calculus BC and I became obsessed with solving math problems (thanks to the teacher, really). The satisfaction that came along with solving equations and addressing problems in such a formulaic nature led me to pursue mathematics at an undergraduate level. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d710c81c-dff8-459a-8c67-d674d2eb714b\"}":{"__typename":"DeepDives","uuid":"d710c81c-dff8-459a-8c67-d674d2eb714b","content":"\u003cp\u003eSomething I hope to accomplish in my life is to have an incredibly positive impact on an abundance of people, whether that be in a professional environment, helping those less privileged, inspiring others, or through social relationships.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"e62d7378-70dd-45ee-b77e-362069aa1870\"}":{"__typename":"School","uuid":"e62d7378-70dd-45ee-b77e-362069aa1870","name":"Berkeley High School - BIHS","city":"Berkeley","type":"HIGH","state":"CA","country":"United States","zip":"94704"},"Education:{\"uuid\":\"73c8c44b-6f95-4ceb-aad2-64a268cd4ae5\"}":{"__typename":"Education","uuid":"73c8c44b-6f95-4ceb-aad2-64a268cd4ae5","school":{"__ref":"School:{\"uuid\":\"e62d7378-70dd-45ee-b77e-362069aa1870\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"1cd4da93-1c89-4bf0-9d35-050afb72a52c\"}":{"__typename":"Education","uuid":"1cd4da93-1c89-4bf0-9d35-050afb72a52c","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Mathematics and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"fb672eaf-735a-4f04-9eeb-56c0a9bc3582\"}":{"__typename":"MentorPublicProfile","uuid":"fb672eaf-735a-4f04-9eeb-56c0a9bc3582","displayName":"Jack F.","slug":"jack-ferris","biography":"\u003cp\u003eHello! My name is Jack Ferris and I grew up in Berkeley, CA. I went to Berkeley High School, taking classes in the International Baccalaureate program. I went on to study Mathematics and Computer Science at Washington University in St. Louis, graduating in the Spring of 2023. I have also played competitive soccer my whole life, continuing my athletic career at WashU. Mentoring students through the athletic recruiting process in addition to academic support is something I feel passionate about as it is crucial to find a healthy balance between the two and this can help narrow the scope of the college search. I also love to draw, mostly doodles, but I am interested in combining my coding experience with my love for art in more website design applications. \u003cbr\u003eOne thing that brings me the most joy is spending quality time with friends. I have a really tight-knit community of friends from high school and we love to travel and go on adventures together. Some notable experiences have been backpacking in Stanislaus National Forest, snowboarding in Tahoe, and traveling around Europe together. \u003cbr\u003eMy technical background in Mathematics and Computer Science combined with my athletic career and social endeavors has led to a wide variety of topics I can mentor as well as a diverse range of people I can connect with. I look forward to working with you!\u003c/p\u003e","teachingVideoPlaybackId":"f3asJZpp9OR4OwBYCRXrPF2nWYaAqhX0102ZEj021kRrD4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1e5c35bd-5f8c-445b-bc3f-e241e66efc0c\"}"},{"__ref":"Favorites:{\"uuid\":\"23167d9c-37e2-4835-bec9-14d160a3d7ba\"}"},{"__ref":"Favorites:{\"uuid\":\"926e7a12-7217-43fc-98a1-354e1ebfb955\"}"}],"causesSupported":[],"major":"Mathematics and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0d630a1d-3ac5-42ea-8ef1-0fad0d9e56cc\"}"},{"__ref":"DeepDives:{\"uuid\":\"15be1ecf-2386-497f-97d7-26470e5a254d\"}"},{"__ref":"DeepDives:{\"uuid\":\"47e6d969-2b3d-4d75-8405-00d914c3f0b6\"}"},{"__ref":"DeepDives:{\"uuid\":\"d710c81c-dff8-459a-8c67-d674d2eb714b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6d0a0410-d1c3-497e-925e-eba9b9bbfd28/-/preview/-/format/jpg/","https://ucarecdn.com/f0721400-8a39-46c5-b986-cd664
