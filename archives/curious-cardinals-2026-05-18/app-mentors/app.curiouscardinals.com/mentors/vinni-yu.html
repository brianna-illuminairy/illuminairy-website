xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8c8f5ed0-19f6-45bb-8942-d5ad722d535c\"}":{"__typename":"Favorites","uuid":"8c8f5ed0-19f6-45bb-8942-d5ad722d535c","photoUrl":"https://ucarecdn.com/9a9b45be-34d6-45f8-bac9-b9e3ff8338e2/","title":"Matt Damon","type":"ACTOR"},"Favorites:{\"uuid\":\"3b4ce0e7-fa24-4d07-bc6f-7719f71094ea\"}":{"__typename":"Favorites","uuid":"3b4ce0e7-fa24-4d07-bc6f-7719f71094ea","photoUrl":"https://ucarecdn.com/18686dba-e762-4dee-bb00-5164e5adb661/","title":"Apricot Princess","type":"ALBUM"},"Favorites:{\"uuid\":\"81b2ddac-e03a-4ff3-8e68-1ac4a94cc817\"}":{"__typename":"Favorites","uuid":"81b2ddac-e03a-4ff3-8e68-1ac4a94cc817","photoUrl":"https://ucarecdn.com/4314a274-1b0c-497b-8757-d452f4cb9863/","title":"Busan","type":"CITY"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4abd3a17-e809-47de-b912-1c784ecd1b82\"}":{"__typename":"DeepDives","uuid":"4abd3a17-e809-47de-b912-1c784ecd1b82","content":"\u003cp\u003eI want to work as a researcher for a big animation studio in the film industry. Whenever I see captivating visual effects in a show or a movie, I always watch it over and over again, wondering how the animators made it. In fact, I'm so in awe that I want to learn how to make those effects by myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"1ea07754-9f7a-40a8-b981-8daeb6653d2f\"}":{"__typename":"DeepDives","uuid":"1ea07754-9f7a-40a8-b981-8daeb6653d2f","content":"\u003cp\u003eMy greatest role model is my father. He immigrated to the United States from South Korea when he was in high school knowing zero English and with no financial support, yet through sheer willpower and hard work, he was able to attend college and become a pharmacist. Even now, he works tirelessly to provide younger generation immigrants with a support system in the states. Everything he does inspires me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"516723e9-64b0-4793-b798-5f9d82199687\"}":{"__typename":"DeepDives","uuid":"516723e9-64b0-4793-b798-5f9d82199687","content":"\u003cp\u003eI want to create a movie, whether its a feature film or full-length, and inspire others in the same way that my favorites movies have inspired me. There are so many amazing stories and experiences out in the world, and it would be a dream come true if I could capture one of them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"adb6c4f2-8fd4-40eb-b38c-e17bb310c8f3\"}":{"__typename":"DeepDives","uuid":"adb6c4f2-8fd4-40eb-b38c-e17bb310c8f3","content":"\u003cp\u003eA program like Curious Cardinals was exactly what I was looking for when I was a high school student. I had no clue what sort of future I wanted nor did I know what sorts of opportunities even existed. If I could provide the sort of mentorship that I didn't even know I needed back then, I would feel extremely accomplished.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"7184ea76-583f-4b64-8d37-753af301721c\"}":{"__typename":"School","uuid":"7184ea76-583f-4b64-8d37-753af301721c","name":"Northern Valley Regional High School at Old Tappan","city":"Old Tappan","type":"HIGH","state":"New Jersey","country":"United States","zip":"07675"},"Education:{\"uuid\":\"542b0b4b-0c7e-4bd2-a32a-3bd5ac8a9fda\"}":{"__typename":"Education","uuid":"542b0b4b-0c7e-4bd2-a32a-3bd5ac8a9fda","school":{"__ref":"School:{\"uuid\":\"7184ea76-583f-4b64-8d37-753af301721c\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"c54c0e41-2971-40a3-a353-cdb784b4037c\"}":{"__typename":"Education","uuid":"c54c0e41-2971-40a3-a353-cdb784b4037c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science and Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"46bd13cb-b249-4dba-adc0-917a327267cf\"}":{"__typename":"MentorPublicProfile","uuid":"46bd13cb-b249-4dba-adc0-917a327267cf","displayName":"Vinni Y.","slug":"vinni-yu","biography":"\u003cp\u003eHi all! It's great to connect with all of you!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm currently a junior at Yale University pursuing a double major in Computer Science and Electrical Engineering. One thing you should know about me is that I was recruited to Yale as part of the varsity fencing team — a sport that's been a passion of mine for 11 years now. If you ever want to talk about your athletic activities, let me know!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAside from that, I specialize in Computer Graphics, where I believe technology and art beautifully intersect. I spend most of my time studying computational techniques that bring classic animated films and visual effects to life. If you've ever watched a Pixar or Dreamworks film and thought \"that looks really cool\" — that's exactly what I'm studying!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI personally love studying in spaces where creativity gets to meet technical precision. My coursework involves a lot of physics simulations, geometric thinking, programming, and visual design principles. If any of these interest you, always feel free to ask more!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"lp86y8XxL1p2BrwQXim02PhFyElXDx5CqjobUYl01l00JY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8c8f5ed0-19f6-45bb-8942-d5ad722d535c\"}"},{"__ref":"Favorites:{\"uuid\":\"3b4ce0e7-fa24-4d07-bc6f-7719f71094ea\"}"},{"__ref":"Favorites:{\"uuid\":\"81b2ddac-e03a-4ff3-8e68-1ac4a94cc817\"}"}],"causesSupported":[],"major":"Computer Science and Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4abd3a17-e809-47de-b912-1c784ecd1b82\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ea07754-9f7a-40a8-b981-8daeb6653d2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"516723e9-64b0-4793-b798-5f9d82199687\"}"},{"__ref":"DeepDives:{\"uuid\":\"adb6c4f2-8fd4-40eb-b38c-e17bb310c8f3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5c675b0d-6b9b-4590-93d1-7f861ba55462/-/preview/-/format/jpg/","https://ucarecdn.com/93e7682a-f1fb-407e-851e-e47c96fc0a27/-/preview/-/format/jpg/","https://ucarecdn.com/9e32b24e-583a-4f46-b3a1-cb5510f18bb8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"542b0b4b-0c7e-4bd2-a32a-3bd5ac8a9fda\"}"},{"__ref":"Education:{\"uuid\":\"c54c0e41-2971-40a3-a353-cdb784b4037c
