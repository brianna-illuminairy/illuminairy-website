n","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7926997c-61f8-4e42-a8d2-7c9caaee6096\"}":{"__typename":"DeepDives","uuid":"7926997c-61f8-4e42-a8d2-7c9caaee6096","content":"\u003cp\u003eAs someone without many academic mentors growing up, I find it inspiring now at Stanford to emulate the behavior of those a few years ahead of me in my academic/career journey. I love serving as that type of person who is worth emulating for those a few years behind me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4c4297a9-8205-4456-b1ba-6bd7c436f432\"}":{"__typename":"DeepDives","uuid":"4c4297a9-8205-4456-b1ba-6bd7c436f432","content":"\u003cp\u003eI would love to build my own healthcare company!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b2435a98-1435-44cd-b0bc-6de85f1a8f81\"}":{"__typename":"DeepDives","uuid":"b2435a98-1435-44cd-b0bc-6de85f1a8f81","content":"\u003cp\u003eEconomics is practical but also provides a great perspective on how the world ought to work, why it doesn't work that way, and what you can do to fix it. Creating solutions to solve inefficiencies in the market is exciting!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e0c59cbe-af6c-453d-a573-af49182a5721\"}":{"__typename":"Education","uuid":"e0c59cbe-af6c-453d-a573-af49182a5721","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Economics","degree":null},"School:{\"uuid\":\"937acaac-1d80-400c-8187-093dd2fb7381\"}":{"__typename":"School","uuid":"937acaac-1d80-400c-8187-093dd2fb7381","name":"John Bapst Memorial High School","city":"Bangor","type":"HIGH","state":"Maine","country":"United States","zip":"04401"},"Education:{\"uuid\":\"09aee633-22ac-4fcb-876e-524b226c5372\"}":{"__typename":"Education","uuid":"09aee633-22ac-4fcb-876e-524b226c5372","school":{"__ref":"School:{\"uuid\":\"937acaac-1d80-400c-8187-093dd2fb7381\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"d473c11f-b744-40d7-92cb-e99a9723d73b\"}":{"__typename":"MentorPublicProfile","uuid":"d473c11f-b744-40d7-92cb-e99a9723d73b","displayName":"Brandon A.","slug":"brandon-aponte","biography":"\u003cp\u003eBrandon is a senior at Stanford University, graduating in June with an honors degree in economics and a double minor in biology and music. He serves as the President of the Stanford Scholars of Finance Chapter, an organization dedicated to inspiring integrity in future finance leaders. Brandon has a diverse background, with experience in financial organizations, venture capital, health tech (including founding a startup), policy, biomedical research (co-authoring a paper on the dual-use implications of AI in biomedicine to be published by Nature Machine Intelligence), and asset management.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a sophomore, Brandon worked as a research assistant for Dr. Jay Bhattacharya, analyzing the relationship between COVID-19 vaccination and mortality rates for those aged 65 and older. He then joined Acumen LLC, a health policy research firm, where he trained in using SAS to analyze the geographical distribution of Medicare suppliers and beneficiaries. Brandon also assisted Dr. Jennifer Burns of The Hoover Institution in finalizing her intellectual biography on Milton Friedman. Last summer, he worked at Strive Asset Management, a firm specializing in ETF creation. For his honors thesis, Brandon is collaborating with Prof. Ilya Strebulaev at Stanford's Graduate School of Business to study mergers and acquisitions in the technology sector.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor for Curious Cardinals, Brandon aims to create an engaging and rewarding learning environment for students passionate about economics, science, and math. He is particularly enthusiastic about entrepreneurship and health tech and has guided students in developing their own startup ideas and understanding the stock market. Brandon enjoys working with motivated students who are eager to explore new concepts in a fun and thoughtful manner.\u003c/p\u003e","teachingVideoPlaybackId":"02DdrQhUJuoTDMrpqUba64UhCdt66gOGRkRV6fqwzg7E","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003ePlaying in Carnegie Hall in 2018 with the National Youth Orchestra of the USA!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"74d4de24-82a3-47f9-a891-08662ed3990d\"}"},{"__ref":"Favorites:{\"uuid\":\"dce99eee-8dd6-454e-8088-a27f3b3f4efd\"}"},{"__ref":"Favorites:{\"uuid\":\"2c319ab3-977f-4b2e-94ab-3f572738b6f4\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"462a11e5-f6e3-44a8-82de-5b9308a8ee02\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d8b18617-ca2a-4b27-a21c-c73469ff0f34\"}"},{"__ref":"DeepDives:{\"uuid\":\"7926997c-61f8-4e42-a8d2-7c9caaee6096\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c4297a9-8205-4456-b1ba-6bd7c436f432\"}"},{"__ref":"DeepDives:{\"uuid\":\"b2435a98-14
