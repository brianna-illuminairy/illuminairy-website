xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b7da555f-5089-4bf1-b126-bd726946fa5a\"}":{"__typename":"DeepDives","uuid":"b7da555f-5089-4bf1-b126-bd726946fa5a","content":"\u003cp\u003eSince I was little I've always wanted to be a dolphin trainer and I still think it would be really cool.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1cf8e35a-4800-4b69-b770-94fcb053f216\"}":{"__typename":"DeepDives","uuid":"1cf8e35a-4800-4b69-b770-94fcb053f216","content":"\u003cp\u003eBe unapologetic about being yourself!! It is COOL to care about things - don't let anyone ever tell you differently.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"a25facf1-494d-489b-9d25-f2bf1ffbd541\"}":{"__typename":"DeepDives","uuid":"a25facf1-494d-489b-9d25-f2bf1ffbd541","content":"\u003cp\u003eI speak Portuguese and am half Brasilian! This does not mean I do not burn in the sun - a lesson I re-learn every year.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"42a4e258-b0eb-4b7f-abdf-16835122a50a\"}":{"__typename":"DeepDives","uuid":"42a4e258-b0eb-4b7f-abdf-16835122a50a","content":"\u003cp\u003eDuring my time on my Fulbright grant, I developed a curriculum to use theatre to help children with autism combat bullying!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"7cbe110b-8177-45e3-9ca7-9684627549db\"}":{"__typename":"School","uuid":"7cbe110b-8177-45e3-9ca7-9684627549db","name":"Howell High School","city":"Farmingdale","type":"HIGH","state":"New Jersey","country":"United States","zip":"07727"},"Education:{\"uuid\":\"8752941d-6225-44c4-9076-9fb114ac22d7\"}":{"__typename":"Education","uuid":"8752941d-6225-44c4-9076-9fb114ac22d7","school":{"__ref":"School:{\"uuid\":\"7cbe110b-8177-45e3-9ca7-9684627549db\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"ef98ae01-318f-4617-bc59-21417e064bd6\"}":{"__typename":"Education","uuid":"ef98ae01-318f-4617-bc59-21417e064bd6","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Theatre \u0026 Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"9a5ccb56-49b0-4f58-a14b-7db8c14b9361\"}":{"__typename":"MentorPublicProfile","uuid":"9a5ccb56-49b0-4f58-a14b-7db8c14b9361","displayName":"Zoe M.","slug":"zoe-maroko","biography":"\u003cp\u003eHi! Good to meet you!  My name is Zoe and I grew up in New Jersey where I attended a performing arts magnet high school. I then went on to attend Northwestern University, and graduated with degrees in Theatre and Neuroscience - weird right? Some people ask me why, I say why not. Let's talk about it!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e I love finding the intersection between science and arts, specifically in how that can be used to create a better world! I am super passionate about accessibility and the disability justice movement, specifically autism acceptance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e I recently completed a Fulbright grant in Brasil, where I developed a curriculum to use theatre to help children with autism combat bullying. It was an extremely amazing experience that I love to talk about, so feel free to ask any questions! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college I worked in a neurobiology lab studying thermosensation in fruit flies, and also in a psychology lab studying human motivation and relationships, meaning I am super duper fun at parties! Fun fact - male fruit flies \"box\" each other. Aren't you glad you know that now?\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore I left for my Fulbright grant, I worked as a college prep tutor, essay editor, and mentor. I love helping young(er) people achieve their goals! I covered many subjects from biology and physiology to English/grammar to statistics and many things in between. My favorite part was when students would come in saying \"I can't WAIT to tell you what happened this week!\" I loved forming connections with my students, supporting them, and seeing them succeed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e I am also a lover of language learning, and am working on becoming truly trilingual. I am fluent in English and Portuguese, and am working to improve my Spanish. Once I do that, I plan on moving on to French. I find learning languages helps me connect with some really amazing people.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my spare time, I love volunteering, reading, singing, dancing, theology, and trying to get my cats to like me. I achieve varying levels of success. I am an avid lover of fashion, and love experimenting with new styles, even if my closet space loves it less. I love thrifting and vintage fashion. Village Discount off the Argyle stop in Chicago is a TREASURE trove, I highly recommend. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I am working as a professional actor in NJ/NYC - a far cry from my fruit fly scientist days. I love performing and being on stage, as well as directing!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to helping you achieve your dreams!\u003c/p\u003e","teachingVideoPlaybackId":"sVmC4HfH1Dmf7EkoCVeN9TTL00k00KFBrFQUVh2BCbX9E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Theatre \u0026 Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b7da555f-5089-4bf1-b126-bd726946fa5a\"}"},{"__ref":"DeepDives:{\"uuid\":\"1cf8e35a-4800-4b69-b770-94fcb053f216\"}"},{"__ref":"DeepDives:{\"uuid\":\"a25facf1-494d-489b-9d25-f2bf1ffbd541\"}"},{"__ref":"DeepDives:{\"uuid\":\"42a4e258-b0eb-4b7f-abdf-16835122a50a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e61ae04c-5c51-461c-8032-9c14d689a50a/-/preview/-/format/jpg/","https://ucarecdn.com/af9df6a0-7e52-4c57-85d7-afe996721206/-/preview/-/format/jpg/","https://ucarecdn.com/c923c8d2-6776-40a3-b9ac-79ae57de269a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8752941d-6225-44c4-9076-9fb114ac22d7\"}"},{"__ref":"Education:{\"uuid\":\"ef98ae01-318f-4617-bc59-21417e064bd6\"}"}],"hiredAt":"2025-10-30T20:11:57.379Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Biology","Writing","Academic Coaching","College Essay Writing","Executive Functio
