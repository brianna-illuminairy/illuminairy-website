xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d783351c-3bb7-4826-b091-b9aecff9d86d\"}":{"__typename":"Favorites","uuid":"d783351c-3bb7-4826-b091-b9aecff9d86d","photoUrl":"https://ucarecdn.com/2862b8b2-4b1e-43f8-b95d-6fcb9d863131/","title":"Different Seasons","type":"BOOK"},"Favorites:{\"uuid\":\"78ec9a82-6119-4257-820b-789cfff66bb9\"}":{"__typename":"Favorites","uuid":"78ec9a82-6119-4257-820b-789cfff66bb9","photoUrl":"https://ucarecdn.com/b224798c-b5d1-4f4d-bba2-a20f248edb29/","title":"Let it Be","type":"SONG"},"Favorites:{\"uuid\":\"374f6dff-0ac2-4150-bf57-8adefd1fbc5a\"}":{"__typename":"Favorites","uuid":"374f6dff-0ac2-4150-bf57-8adefd1fbc5a","photoUrl":"https://ucarecdn.com/3bd2050b-3175-467c-a994-522b8c463bb0/","title":"Seven","type":"MOVIE"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"d3fef7c3-fde1-438a-8b45-672fc68492ee\"}":{"__typename":"DeepDives","uuid":"d3fef7c3-fde1-438a-8b45-672fc68492ee","content":"\u003cp\u003eGrowing up in a public school system as a Latina in an immigrant community, I saw how differences in resources and guidance can shape a student’s experience. That perspective has made me intentional about how I teach. I focus on making material clear and approachable, and I try to create an environment where students feel comfortable asking questions and confident in their ability to learn.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy work in immigration spaces reinforced this approach. Through my time with an immigration law organization and teaching citizenship classes independently, I worked with people from a wide range of educational backgrounds. That taught me to adapt my explanations, meet students where they are, and make sure concepts are fully understood rather than rushed through.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy background in political science and statistics also shapes how I teach. I like to connect what students are learning to real-world issues so it feels relevant and meaningful rather than abstract.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, these experiences have made me a patient, flexible, and thoughtful mentor. I aim to create a space where students feel supported, capable, and confident in themselves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"490b8783-901e-4edc-baa1-7e8f9d36bced\"}":{"__typename":"DeepDives","uuid":"490b8783-901e-4edc-baa1-7e8f9d36bced","content":"\u003cp\u003eIn my spare time, I love to read. Right now, I’m really diving into the Stephen King universe, trying to understand how all the stories connect and exploring the bigger world he’s built across his books. I also enjoy listening to music, collecting vinyl records, and building my Penguin clothbound classics collection. I like hobbies that let me be curious, explore stories, and get creative.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"29e45046-5ea7-440a-8304-64a47fb45bfb\"}":{"__typename":"DeepDives","uuid":"29e45046-5ea7-440a-8304-64a47fb45bfb","content":"\u003cp\u003eMentorship matters to me because I know how much of a difference it can make when someone believes in you. I had one teacher who really saw my potential and encouraged me to push myself, and that support shaped the way I approach learning and challenges. Experiencing that guidance firsthand showed me how valuable it is to have someone who listens, encourages, and helps you grow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want to offer that same support to other students. I hope to help them feel confident in their abilities, navigate challenges with more ease, and see what they are capable of achieving. Mentorship is about more than just teaching content. It is about creating a space where students feel heard and inspired to reach their goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"a073f082-77f1-4720-9b0a-555fdb812bc0\"}":{"__typename":"DeepDives","uuid":"a073f082-77f1-4720-9b0a-555fdb812bc0","content":"\u003cp\u003eAs a high school student, I was very focused on preparing for college while staying active and involved in sports. I played varsity tennis and ran on the varsity track team. I also loved going to the gym and staying physically active. Athletics were a big part of my life, and balancing sports with academics helped me build focus and persistence that I still carry with me today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"70731bad-8ec9-4855-9f1c-c796ba329f0c\"}":{"__typename":"School","uuid":"70731bad-8ec9-4855-9f1c-c796ba329f0c","name":"Pacheco High School","city":"Los Banos","type":"HIGH","state":"California","country":"United States","zip":"93635"},"Education:{\"uuid\":\"ab6bb674-4de8-408e-823c-c211fb3c4f9b\"}":{"__typename":"Education","uuid":"ab6bb674-4de8-408e-823c-c211fb3c4f9b","school":{"__ref":"School:{\"uuid\":\"70731bad-8ec9-4855-9f1c-c796ba329f0c\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"f385b421-b0e3-419d-ba17-6ff80b78edd5\"}":{"__typename":"Education","uuid":"f385b421-b0e3-419d-ba17-6ff80b78edd5","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Political Science - Statistics","degree":null},"MentorPublicProfile:{\"uuid\":\"be539af9-1f3b-4c42-b2b1-ce061d88450f\"}":{"__typename":"MentorPublicProfile","uuid":"be539af9-1f3b-4c42-b2b1-ce061d88450f","displayName":"Sienna G.","slug":"sienna-granillo","biography":"\u003cp\u003eHi! I’m a FGLI student at Columbia University majoring in Political Science – Statistics. My interest in statistics began in high school when a teacher showed me how numbers and data could be applied to real-world problems. That experience completely changed the way I think about data and analysis, and I have been applying those skills ever since. I’m also a QuestBridge Scholar and preparing for a future in law, which has strengthened my focus on policy, critical thinking, and clear communication. Understanding both qualitative and quantitative information has become central to how I approach problems and evaluate decisions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have a strong connection to my local community and enjoy using my skills to help others. I was an intern with CVIIC, an immigration law organization, where I supported clients and shadowed lawyers, learning how law can directly impact people’s lives. I have also taught citizenship classes independently, guiding participants through English and U.S. history and helping them prepare for the naturalization process. Beyond formal teaching, I have tutored students throughout high school and enjoy helping others build confidence and mastery over challenging subjects. These experiences have shaped my approach to mentoring and public service, teaching me the importance of patience, empathy, and clear communication. I find it especially rewarding to see students grow in understanding and confidence, and I look forward to bringing that enthusiasm into every mentorship opportunity.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Columbia, I work as a Research Assistant on a project studying poverty and economic mobility in New York City. I conduct interviews with residents to understand their experiences and carefully track responses over time. Organizing and analyzing the data allows me to identify meaningful patterns, and contributing to research reports helps translate complex findings into clear insights. This work has strengthened my ability to think critically, pay attention to detail, and communicate results effectively, and it has deepened my understanding of how data and policy intersect to affect communities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics and community work, I enjoy creative projects like making comedic graphics for the Federalist (Columbia's satirical newspaper), which allows me to combine humor with thoughtful communication. I am an avid reader and music enthusiast, currently working on collecting the full Penguin clothbound classics collection and building a vinyl record collection. I am excited to help students explore their interests, develop new skills, and achieve their goals while sharing the experiences and insights I have gained through research, tutoring, and community engagement.\u003c/p\u003e","teac
