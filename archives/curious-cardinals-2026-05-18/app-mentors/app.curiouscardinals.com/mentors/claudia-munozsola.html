xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"16ec50ee-85e3-4a2a-8c54-d8f6bc84aac8\"}":{"__typename":"Favorites","uuid":"16ec50ee-85e3-4a2a-8c54-d8f6bc84aac8","photoUrl":"https://ucarecdn.com/02b8a375-4fa7-4a9b-95bb-a4fd53d17c2b/","title":"Revolver by The Beatles","type":"ALBUM"},"Favorites:{\"uuid\":\"f8d1bd01-78be-41df-96ce-e89689190818\"}":{"__typename":"Favorites","uuid":"f8d1bd01-78be-41df-96ce-e89689190818","photoUrl":"https://ucarecdn.com/fdd4adae-834a-42da-9be6-6d0617d0191b/","title":"One Hundred Years of Solitude by Gabriel García Márquez","type":"BOOK"},"Favorites:{\"uuid\":\"db849de1-afb5-47a0-9329-1e5b6c1000b2\"}":{"__typename":"Favorites","uuid":"db849de1-afb5-47a0-9329-1e5b6c1000b2","photoUrl":"https://ucarecdn.com/6296faae-47d2-4876-8b6b-ca4b6a189ac5/","title":"FC Barcelona","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"6bc61aab-fba6-48dc-a5e0-8f0955fc8b95\"}":{"__typename":"CausesSupported","uuid":"6bc61aab-fba6-48dc-a5e0-8f0955fc8b95","name":"Golitos Foundation","description":"\u003cp\u003eI volunteer as a coach to offer multioccupational therapy through soccer to kids\u003c/p\u003e","photoUrl":"https://ucarecdn.com/da0d4e56-5098-4947-9ba9-72aaeed05ad9/"},"CausesSupported:{\"uuid\":\"9f476bb7-05df-4e39-995b-45d446a8ef9e\"}":{"__typename":"CausesSupported","uuid":"9f476bb7-05df-4e39-995b-45d446a8ef9e","name":"Yale Community Kitchen","description":"\u003cp\u003eI work as a coordinator for YCK to serve meals to food insecure people across NH\u003c/p\u003e","photoUrl":"https://ucarecdn.com/12ee85e2-9834-4658-9182-24c918557734/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"81215941-3cfd-4f25-aa77-0dbabe42dca5\"}":{"__typename":"DeepDives","uuid":"81215941-3cfd-4f25-aa77-0dbabe42dca5","content":"\u003cp\u003eTake it easy! Prioritize. It's better to dedicate yourself to a few endeavors than to try to do everything at once. Yes, try new things. Yes, explore. But be intentional with how you spend your time. Your effort, commitment, and time are valuable, so use them toward things that fulfill you. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6ed0fa1a-1d2f-443b-af54-3183d8b61664\"}":{"__typename":"DeepDives","uuid":"6ed0fa1a-1d2f-443b-af54-3183d8b61664","content":"\u003cp\u003eI love to spend time in the outdoors—hikes when I’m on campus or rivers and beaches when I’m at home. I’m big on exploring new music, and I like to discover songs whether on walks, runs, or when I’m at the gym. I also enjoy playing sports, photography, reading novels, and writing my own short stories.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"8f555648-f3a6-4232-94fa-77ef89263929\"}":{"__typename":"DeepDives","uuid":"8f555648-f3a6-4232-94fa-77ef89263929","content":"\u003cp\u003eLife can be challenging and confusing—it would be great if we could have a handbook on how to thrive. However, everyone is different and there is no “one size fits all” path toward success. As a mentor, I prioritize each students individual interests, skills, and goals to help them forge their path, offering guidance and clarity in the process. Mentors in my life don’t impose their experiences but share the lessons they took from them and practices that brought them to where they are. I try to do the same with my mentees, using my experience to help them chase their unique version of success.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"887266e7-583e-469f-8e7b-295990600544\"}":{"__typename":"DeepDives","uuid":"887266e7-583e-469f-8e7b-295990600544","content":"\u003cp\u003eMy dream career is one centered on making people connect and making a positive impact on my community. I hope to explore my interests through different jobs focused on improving public education systems, addressing food insecurity, promoting AI safety, and writing. Through each endeavor, I hope to develop my management skills to start my own non-profit in Puerto Rico that addresses one of the causes I'm passionate about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"97d1560d-c872-46a6-9d9d-2a227662e244\"}":{"__typename":"School","uuid":"97d1560d-c872-46a6-9d9d-2a227662e244","name":"Colegio Puertorriqueño de Niñas","city":"Guaynabo","type":"HIGH","state":"Guaynabo","country":"Puerto Rico","zip":"00968"},"Education:{\"uuid\":\"94d98715-88f3-4adb-b0b9-a1a37b72de46\"}":{"__typename":"Education","uuid":"94d98715-88f3-4adb-b0b9-a1a37b72de46","school":{"__ref":"School:{\"uuid\":\"97d1560d-c872-46a6-9d9d-2a227662e244\"}"},"startYear":"2018","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1f337218-8ea1-45d7-9ac1-79e7453b95df\"}":{"__typename":"Education","uuid":"1f337218-8ea1-45d7-9ac1-79e7453b95df","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Applied Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"37921c4c-9c81-4297-8b4b-65207bea8ee2\"}":{"__typename":"MentorPublicProfile","uuid":"37921c4c-9c81-4297-8b4b-65207bea8ee2","displayName":"Claudia M.","slug":"claudia-munozsola","biography":"\u003cp\u003eHello, I’m Clau! I grew up in San Juan, Puerto Rico, surrounded by music, nature, and a lively culture. I have always played sports—soccer, volleyball, gymnastics—and like to stay active, especially with hiking trips. In high school, I enjoyed math, writing, and language classes. I was very involved in Model UN, the Environmental Club, Book Club, Forensics, and Math Olympiads. I am very passionate about public service. Since middle school, I have volunteered, carried out fundraisers, and organized donations for different communities. My most significant community service project lasted three years, for which I sold homemade cookies at my school weekly to raise funds for a local foundation that offers multi-occupational therapy through soccer to children with autism. I was also a volunteer coach for the foundation on the weekends. I hope to follow a career path in public service whether through private companies or the non-profit sector. To explore this path, I have done internships locally in non-profits and abroad in the Sustainability department of a large corporation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am now studying at Yale University in Connecticut. I am majoring in Applied Mathematics with a certificate in French, and will possibly double major in History. An interesting course I have taken here is Revolutionary Change and Cold War in Latin America; it also explores U.S. intervention in Latin America during that period. I also have a background in Calculus, Linear Algebra, and Statistics. The student groups I am most involved in are the Yale Community Kitchen, for which I am coordinator; FOOT (First-year Outdoor Orientation Trips), for which I'm a leader; and the Yale Club Ski Team. I have also taken on new personal projects since Freshman year including: starting an alumni mentorship program for my high school, automizing the assigning of groups for FOOT, writing my own short novel (which I am planning to publish in the next few months!), and patenting a product (kitchen tool). I am also now preparing to do my own History research in Panama over the summer and research on partial differential equations next semester.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether through academic/professional endeavors or my personal and social life, I value connecting with people and building meaningful relationships. I hope to form bonds with my mentees and be an encouraging and helpful resource in their lives. In the past, I have worked with long-term private tutoring for middle and high school students, continuous assistance with college application essays, and volunteer online tutoring during covid. I am now working as a math grader and a language tutor at the University. I would be happy to meet you and offer guidance!\u003c/p\u003e","teachingVideoPlaybackId":"aJpHs01882hHuMkf6AmsYWSaskItv02RQJY1UKLrNJsrU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"16ec50ee-85e3-4a2a-8c54-d8f6bc84aac8\"}"},{"__ref":"Favorites:{\"uuid\":\"f8d1bd01-78be-41df-96ce-e89689190818\"}"},{"__ref":"Favorites:{\"uuid\":\"db849de1-afb5-47a0-9329-1e5b6c1000b2\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6bc61aab-f
