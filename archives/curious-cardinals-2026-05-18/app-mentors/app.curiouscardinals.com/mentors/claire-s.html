HIGH","state":"Maryland","country":"United States","zip":"21044"},"Education:{\"uuid\":\"6a091186-aa5e-45b4-beb5-205e9984c3c3\"}":{"__typename":"Education","uuid":"6a091186-aa5e-45b4-beb5-205e9984c3c3","school":{"__ref":"School:{\"uuid\":\"c95afde7-699b-4799-82d7-c8adb2706009\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ebd01ec2-24f6-4aca-b128-56cb6ce5d32e\"}":{"__typename":"MentorPublicProfile","uuid":"ebd01ec2-24f6-4aca-b128-56cb6ce5d32e","displayName":"Claire S.","slug":"claire-s","biography":"\u003cp\u003eClaire Silberman is a graduate of Princeton University, where she majored in the School of Public and International Affairs, with a minor in History and the Practice of Diplomacy.\u003c/p\u003e\u003cp\u003eWith seven years of tutoring experience, she has spent 550+ hours teaching 75+ students in a variety of subjects, including math, English, history, entrepreneurship, social entrepreneurship, and speech and debate. She has helped students create advocacy organizations, fundraisers, film festivals, and independent research projects. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her extracurriculars, Claire spent her time on campus singing in a cappella group, acting and producing student theatre on campus, and editing articles for Princeton's newspaper, The Daily Princetonian. She is also involved in community service organizations. In high school, she was heavily involved as captain of the debate team, editor-in-chief of the school newspaper, the founder of a civic advocacy group, and the student director of a community theatre, where she ran weekly workshops for elementary and middle school children. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eClaire brings a variety of professional experiences to share with students who are exploring career interests. She has interned with the US Congress, for an international NGO, and with Deloitte Consulting. She won the Deloitte Social Impact Case
