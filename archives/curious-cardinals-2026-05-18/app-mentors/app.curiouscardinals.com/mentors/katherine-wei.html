xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9e9ba6eb-00da-4c4e-94f9-5660b236ae47\"}":{"__typename":"Favorites","uuid":"9e9ba6eb-00da-4c4e-94f9-5660b236ae47","photoUrl":"https://ucarecdn.com/edbbea0b-cafc-4120-becb-2f1d339dba72/","title":"Lover","type":"ALBUM"},"Favorites:{\"uuid\":\"2a36de82-8217-4447-a550-3643d6acb85d\"}":{"__typename":"Favorites","uuid":"2a36de82-8217-4447-a550-3643d6acb85d","photoUrl":"https://ucarecdn.com/1b36ea23-0a45-4966-91bb-48c9d5cbf88a/","title":"Hamilton","type":"PLAY"},"Favorites:{\"uuid\":\"d8ba0a55-10df-4f50-9e0e-626141c78a5f\"}":{"__typename":"Favorites","uuid":"d8ba0a55-10df-4f50-9e0e-626141c78a5f","photoUrl":"https://ucarecdn.com/be6ffcb8-3fe1-423a-8e0f-a632fc391c96/","title":"Everything Everywhere All At Once","type":"MOVIE"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"809c59ee-2e19-484b-bccd-896f01f133ad\"}":{"__typename":"DeepDives","uuid":"809c59ee-2e19-484b-bccd-896f01f133ad","content":"\u003cp\u003eFrom creative writing to scientific research, all of my favorite things to dedicate my time to have been done with a mentor. Learning and navigating something new is undoubtedly daunting, but with the mentors in my life, I've been able to overcome that initial obstacle of fear and get to where I am now. My mentors have been my inspiration, motivation, and everything in between. They've been the people who've guided me on the right path, showing me that it's okay to fail and more importantly how to get up to succeed. I want to provide the same experience of mentorship that I had to others, helping to bring to life student's goals and dreams. Mentorship truly has been a centerpience to my growth and development, and I'm excited that through Curious Cardinals I can bring the magic to others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"480104a8-720b-44d1-87a9-d88683147bae\"}":{"__typename":"Education","uuid":"480104a8-720b-44d1-87a9-d88683147bae","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Neuroscience","degree":"B.A."},"School:{\"uuid\":\"dd11b422-c0a4-41c5-a658-ec42f1451082\"}":{"__typename":"School","uuid":"dd11b422-c0a4-41c5-a658-ec42f1451082","name":"BASIS Chandler","city":"Chandler","type":"HIGH","state":"Arizona","country":"USA","zip":"85248"},"Education:{\"uuid\":\"6b056ce6-17df-4fbe-a2b5-08e96b79347b\"}":{"__typename":"Education","uuid":"6b056ce6-17df-4fbe-a2b5-08e96b79347b","school":{"__ref":"School:{\"uuid\":\"dd11b422-c0a4-41c5-a658-ec42f1451082\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"46f14575-d850-4635-863a-3494e5243582\"}":{"__typename":"MentorPublicProfile","uuid":"46f14575-d850-4635-863a-3494e5243582","displayName":"Katherine W.","slug":"katherine-wei","biography":"\u003cp\u003eKatherine is currently pursuing a double major in Biochemistry and Economics with a minor in Healthcare Management at the University of Pennsylvania. Throughout high school, she was heavily involved in conducting scientific research. During her senior year, she studied the effect of mechanosensory stimulation on olfaction in honeybees by dissecting their brains and using silicon-based multichannel probes to collect neuronal responses. Her work is published in Frontiers in Physiology, a high impact academic journal. She also has experience in bioinformatics, particularly in using techniques to analyze differentially expressed genes between Alzheimer's and cardiovascular disease. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAt Penn, she's currently working two research positions, one with the Children's Hospital of Philadelphia and the other with Penn Med. Due to her past experience with cardiomyopathy, she hopes to learn more about the pathology and find better treatments and pharmaceuticals for the cardiovascular disease, so both her current projects revolve around cardiology.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eBeyond her science side, she also loves to write poetry and paint, both of which she's received a Scholastic National Silver Medal in. Her writing has also been recognized by other prestigious organizations such as the YoungArts Foundation, Princeton University, and Foyle Young Poets of the Year. For Katherine, creative writing is a form of catharsis and her favorite avenue of expression because of how thoroughly words through poetry can convey a feeling that simply can't be captured in any other way. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAt UPenn, Katherine is currently involved in the Penn Social Entrepreneurship Movement, Wharton Asia Investments, Consult for America, Penn Undergraduate Biotech Society, Penn Neuroscience Society, and more.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e In her free time, she enjoys playing volleyball, longboarding, and hanging out with her friends. Katherine's also loves the MCU, Broadway, K-dramas, and of course, boba.\u003c/p\u003e","teachingVideoPlaybackId":"XBud00bcnzJfGmk48de5DnJHy9GKYUtMj2Su5bftiuqA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\"
