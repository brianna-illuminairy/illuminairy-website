xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"17bcb485-9e73-4d44-920e-9b77248f8dbd\"}":{"__typename":"Favorites","uuid":"17bcb485-9e73-4d44-920e-9b77248f8dbd","photoUrl":"https://ucarecdn.com/96915115-d603-45e6-9cd8-ec655c2e5889/","title":"Lebron James","type":"ATHLETE"},"Favorites:{\"uuid\":\"d123edc4-87b3-4d60-93c6-bf5bf8d017ec\"}":{"__typename":"Favorites","uuid":"d123edc4-87b3-4d60-93c6-bf5bf8d017ec","photoUrl":"https://ucarecdn.com/8501379c-f4b0-4256-ac6d-1dff27178fe5/","title":"San Francisco","type":"CITY"},"Favorites:{\"uuid\":\"cdd8e8bf-fae9-4eb0-903e-8591608f3f81\"}":{"__typename":"Favorites","uuid":"cdd8e8bf-fae9-4eb0-903e-8591608f3f81","photoUrl":"https://ucarecdn.com/8501379c-f4b0-4256-ac6d-1dff27178fe5/","title":"Harry Potter","type":"BOOK"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"357ac6c1-c500-4a2f-a9cd-24b8508120b5\"}":{"__typename":"DeepDives","uuid":"357ac6c1-c500-4a2f-a9cd-24b8508120b5","content":"\u003cp\u003eDirector at a tech company\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a50e6d03-3ab5-4575-a0c8-925b710f1584\"}":{"__typename":"DeepDives","uuid":"a50e6d03-3ab5-4575-a0c8-925b710f1584","content":"\u003cp\u003eMy biggest advice to my younger self would be to stop worrying so much about the future and instead use that time to spend time with family and friends. Live life. A huge reason why I was a bit nervous about college process was because I did not have anyone from my family who had applied to top schools in America and had taken the ACT/SAT.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"526f107e-b9d2-416f-8a1f-6e260d45debd\"}":{"__typename":"DeepDives","uuid":"526f107e-b9d2-416f-8a1f-6e260d45debd","content":"\u003cp\u003eI want to build an orphanage overseas, and I want to be involved in the lives of these children, from kindergarten to life after high school. I really value life experiences and close bonds that we have, and being there as a mentor for orphan children would really help build an enjoyable childhood for them and allow them to pursue their dreams.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"11e874e1-9c6e-4985-b8c0-ef9a43fb42aa\"}":{"__typename":"DeepDives","uuid":"11e874e1-9c6e-4985-b8c0-ef9a43fb42aa","content":"\u003cp\u003eI am proud that I used my platform to mentor other marginalized students find their ways in the tech and business corporate world. Hearing classmates say that they got the offer from their dream internship means the world for me, especially because these classmates are paving the way for their community members and helping their families financially. I am passionate about helping others reach their dreams!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"f3485548-02ed-4311-828f-b6b233b0b293\"}":{"__typename":"School","uuid":"f3485548-02ed-4311-828f-b6b233b0b293","name":"Fort Zumwalt East High School","city":"St. Peters","type":"HIGH","state":"Missouri","country":"United States","zip":"63376"},"Education:{\"uuid\":\"275febbf-59db-43c9-8203-4758c38de6c2\"}":{"__typename":"Education","uuid":"275febbf-59db-43c9-8203-4758c38de6c2","school":{"__ref":"School:{\"uuid\":\"f3485548-02ed-4311-828f-b6b233b0b293\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"1c15366d-f898-468a-9f82-812d639b1622\"}":{"__typename":"Education","uuid":"1c15366d-f898-468a-9f82-812d639b1622","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"June 2021","endYear":null,"expectedGradYear":"May 2025","major":"Business and Computer Science Joint Degree","degree":null},"MentorPublicProfile:{\"uuid\":\"d3466c99-cc87-444f-b13e-f50a72e132e9\"}":{"__typename":"MentorPublicProfile","uuid":"d3466c99-cc87-444f-b13e-f50a72e132e9","displayName":"Mohammed A.","slug":"mohammed-ali","biography":"\u003cp\u003eHi there, I am Mohammed, a junior at Washington University in St. Louis, pursuing Computer Science and Business Joint Degree. Growing up, I was taught by parents the importance of education and how one can apply the knowledge to serve their community members.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, livelihood and wellness of my community members really matters. If you see from my favorite players, you will see Lebron James, who I am inspired by because the kid from Akron, who was raised by a single mother, soon became a star in NBA but never forgot where he came from. Lebron created a foundation that supports the marginalized students in his community. And this is something I want to do as I continue on my career as a software engineer at big tech. I want to stay connected to the youth and to help them achieve their potential, no matter what others think -- and a way to do this is a Curious Cardinal Mentor. As a mentor, my goal is to teach the mentees where they can apply that knowledge in a way that will get them more excited about the topic. Learning happens inside and outside of the classroom :)  \u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy experiences:\u003c/p\u003e\u003cp\u003e\u003cbr\u003eThis summer, I will be working at LinkedIn as a software engineering.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSummer 2023: Software Engineering Intern at Uber\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSummer 2022: Software Engineering Intern at UnitedHealth Group\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting into Washington University in St. Louis as a first-generation student has been my proudest moment! I can still remember the day when I opened the decision letter with my parents and siblings: everyone celebrated, and I knew that I wanted to use this blessing to better my family's lives and to advocate for marginalized community members. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"17bcb485-9e73-4d44-920e-9b77248f8dbd\"}"},{"__ref":"Favorites:{\"uuid\":\"d123edc4-87b3-4d60-93c6-bf5bf8d017ec\"}"},{"__ref":"Favorites:{\"uuid\":\"cdd8e8bf-fae9-4eb0-903e-8591608f3f81\"}"}],"causesSupported":[],"major":"Business and Computer Science Joint Degree","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"357ac6c1-c500-4a2f-a9cd-24b8508120b5\"}"},{"__ref":"DeepDives:{\"uuid\":\"a50e6d03-3ab5-4575-a0c8-925b710f1584\"}"},{"__ref":"DeepDives:{\"uuid\":\"526f107e-b9d2-416f-8a1f-6e
