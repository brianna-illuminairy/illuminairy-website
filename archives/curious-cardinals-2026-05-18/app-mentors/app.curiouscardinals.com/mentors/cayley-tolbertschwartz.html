xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9e9fe1b1-86ac-414d-bc86-b70ab51799e7\"}":{"__typename":"DeepDives","uuid":"9e9fe1b1-86ac-414d-bc86-b70ab51799e7","content":"\u003cp\u003eI would tell myself, \"just do the thing.\" I'm not sure what \"the thing is,\" and I think that's the point. I played everything extremely safe in middle school. Opportunities would pass me by because I was too afraid to take them. As I grew, I started learning that it was a good thing to pursue my interests, and that fighting for opportunities gave me space to grow, rather than hurt me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"6cfd6c1c-9579-457b-8456-8553ac292a7c\"}":{"__typename":"DeepDives","uuid":"6cfd6c1c-9579-457b-8456-8553ac292a7c","content":"\u003cp\u003eI want to make a difference in some way, shape or form. I was raised hiking and interacting with nature, so finding some way to help either staunch or entirely stop the climate crisis is one of my goals. I have done research in environmental engineering fields, as well as research on more efficient batteries. I hope someday to continue some of these projects on a large enough scale to really make a difference to global warming.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9654409e-9b5a-4260-a197-86217a6ac634\"}":{"__typename":"DeepDives","uuid":"9654409e-9b5a-4260-a197-86217a6ac634","content":"\u003cp\u003eI chose my majors because I think that balance is important, and I wanted to embrace all the different sides of myself. I have always loved chemistry; it is how i view the world around me. But when I was in high school I discovered performance as a way to express myself and gain confidence. It gave me the voice I have today, and for that I choose to embrace and honor its impact on my life by allowing myself to explore it. I also often find that the joy I get from pursing theater is a wonderful balance on days when chemistry feels hard.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"406a034c-59e3-4450-ae6e-8ac08e83a586\"}":{"__typename":"DeepDives","uuid":"406a034c-59e3-4450-ae6e-8ac08e83a586","content":"\u003cp\u003eOne thing about me is that isn't immediately obvious is that I love to make things. I love working with my hands in almost any way. I can sew, cook, blacksmith, weld, and am taking a machining class that is teaching me how to use a bunch of other very cool tools to cut metal and wood. I love working on something and having a finished project that feels tangible. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"e151def4-28ed-4887-a6ae-dc61bada04e9\"}":{"__typename":"Education","uuid":"e151def4-28ed-4887-a6ae-dc61bada04e9","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"126ce055-e785-4e22-9876-27435b75487a\"}":{"__typename":"Education","uuid":"126ce055-e785-4e22-9876-27435b75487a","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Chemistry and Theater, Dance and Performance Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"c61e4409-8589-4d1b-803c-d9f335233786\"}":{"__typename":"MentorPublicProfile","uuid":"c61e4409-8589-4d1b-803c-d9f335233786","displayName":"Cayley T.","slug":"cayley-tolbertschwartz","biography":"\u003cp\u003eHi! My name is Cayley, and I am currently a student at Yale University studying Chemistry and Theater. I grew up in Los Angeles, but am currently based in New Haven, Connecticut. While I love both STEM and interdisciplinary projects, I mostly love teaching students who are passionate about learning! As a teacher, my goal is to build confidence in STEM fields and show students that they can do math and science, even if they don't think they can. I have five summers worth of experience teaching STEM to elementary and middle schoolers in LA, through a program called PS Science. PS Science runs both after school programs and summer camps, teaching science to kids whose schools do have science programs of their own. As well as teaching younger kids, I have extensive experience teaching higher level subjects in both formal and informal settings. I love an opportunity to dive deeply into complex math or science problems. On a personal level, I want to make science feel cool for students. I think science is fun, and my goal as a mentor is to help other people find the joy in it too!\u003c/p\u003e\u003cp\u003eI spend a lot of my free time doing music and theater, but most of my academic time is spent pursuing chemistry and related subjects, such as linear algebra and physics. I would love to work on projects ranging from more traditional STEM tutoring to passion projects in the preforming arts, and many things in between. I have experience songwriting and putting on musicals, so I understand and am happy to work in either the more immediate academic side of things or the longer-term arts based projects. I love collaborating to either anything amazing or just to see students grow.\u003c/p\u003e\u003cp\u003eOne thing that I love is teaching via humor. Telling stories, playing games, or anything else I can do to draw people in makes the experience of learning so much more fun! I love bad puns and will interrupt any lesson to make one. When I teach in person, I tend to use a lot of interactive demos, but I have lots of ideas for how students can prepare interactive demos for at home (parents, I’m a little sorry for your kitchens, but the interactive part makes learning so much more engaging)! I can’t wait to get to know all the wonderful students enrolled in the curious cardinals’ program! See you there!\u003c/p\u003e","teachingVideoPlaybackId":"nvrVzbBXBhAYslsMwkA01CD4Q501eEQfPCSpoy00AVgDnE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Chemistry and Theater, Dance and Performance Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9e9fe1b1-86ac-414d-bc86-b70ab51799e7\"}"},{"__ref":"DeepDives:{\"uuid\":\"6cfd6c1c-9579-457b-8456-8553ac292a7c\"}"},{"__ref":"DeepDives:{\"uuid\":\"9654409e-9b5a-4260-a197-86217a6ac634\"}"},{"__ref":"DeepDives:{\"uuid\":\"406a034c-59e3-4450-ae6e-8ac08e83a586\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c102d24d-2d1e-4634-b113-deacd3cb51f1/-/preview/-/format/jpg/","https://ucarecdn.com/95707907-89aa-47a4-99db-810ae9371ec6/-/preview/-/format/jpg/","https://ucarecdn.com/f2958b31-2eb9-4d16-83db-aece6d0e9a27/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e151def4-28ed-4887-a6ae-dc61bada04e9\"}"},{"__ref":"Education:{\"uuid\":\"126ce055-e785-4e22-9876-27435b75487a\"}"}],"hiredAt":"2025-10-31T17:16:38.023Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Pre-Algebra","6-8 Grade Science","Chemistry","Biology","Physics","Academic Coaching","Executive Function","College Essay Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"cayley-tolbertschwartz\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c61e4409-8589-4d1b-803c-d9f335233786\"}"}}},"_sentryTraceData":"5f86c8e5a79f4aa4acf02539710979b8-a2fae6f3643409d3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5f86c8e5a79f4aa4acf02539710979b8,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"cayley-tolbertschwartz"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nn
