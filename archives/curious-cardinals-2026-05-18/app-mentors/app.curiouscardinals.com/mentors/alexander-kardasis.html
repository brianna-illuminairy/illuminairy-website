xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"eaa0ecdd-a5af-48a3-896f-2829ca179ddf\"}":{"__typename":"DeepDives","uuid":"eaa0ecdd-a5af-48a3-896f-2829ca179ddf","content":"\u003cp\u003eMy dream job would be a producer/director at the intersection of film, music, and storytelling, where I can craft immersive narratives that inspire and challenge audiences. I imagine leading a multimedia production studio that pushes artistic boundaries—creating films, digital experiences, and thought-provoking content. I’d love to collaborate with visionaries across different industries. Ultimately, I want to help people see the world differently and feel deeply connected to the stories I create.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ed112e9e-b5b2-45bb-aca8-b3db6556e8e2\"}":{"__typename":"DeepDives","uuid":"ed112e9e-b5b2-45bb-aca8-b3db6556e8e2","content":"\u003cp\u003eIn my spare time, I enjoy fiction writing, playing guitar and piano, and designing clothes. Creativity fuels my interests, whether it's crafting compelling narratives, composing music, or experimenting with fashion design. I also love staying active through lifting and running, which help me clear my mind and stay energized. When I want to unwind, I immerse myself in movies, always looking for new stories and artistic inspirations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"812886bd-5ea9-41fb-a008-d1948b1e7d6c\"}":{"__typename":"DeepDives","uuid":"812886bd-5ea9-41fb-a008-d1948b1e7d6c","content":"\u003cp\u003eI once had a dream that I was at a school dance and I wandered away from my date to a waterslide where kids were daring each other to go down. But suddenly, something was wrong and that water slide led directly into a full tank of water inside of a giant clock that I couldn't get out of. So I guess don't fall for peer pressure is the moral of that story...!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"fd8fdcf5-8f84-43ef-9ca5-9e769981acb6\"}":{"__typename":"DeepDives","uuid":"fd8fdcf5-8f84-43ef-9ca5-9e769981acb6","content":"\u003cp\u003eAs a middle school/high school student I was starting to branch out and discover the movies and music I liked. I was watching Netflix in nearly all of my free time, anticipating the newest Marvel Studios release, and making short films and funny videos with my friends. I also was practing guitar every day after school! I was and still am a big fan of all things nerdy...that is Harry Potter, Lord of the Rings, Marvel/DC, Star Wars, Game of Thrones, Stranger Things, and a whole lot of bingeable shows and artsy movies.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"b72f2d5d-c2b8-4bb8-9596-33553de198e2\"}":{"__typename":"School","uuid":"b72f2d5d-c2b8-4bb8-9596-33553de198e2","name":"Glenbrook North High School","city":"Northbrook","type":"HIGH","state":"Illinois","country":"United States","zip":"60062"},"Education:{\"uuid\":\"93e0540d-7d15-4e92-819a-a68bb53f550c\"}":{"__typename":"Education","uuid":"93e0540d-7d15-4e92-819a-a68bb53f550c","school":{"__ref":"School:{\"uuid\":\"b72f2d5d-c2b8-4bb8-9596-33553de198e2\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"c5230971-ef73-4d89-9269-2de690d99b81\"}":{"__typename":"Education","uuid":"c5230971-ef73-4d89-9269-2de690d99b81","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"374ac31c-b449-4d76-b258-7dd2e55157e6\"}":{"__typename":"MentorPublicProfile","uuid":"374ac31c-b449-4d76-b258-7dd2e55157e6","displayName":"Alexander K.","slug":"alexander-kardasis","biography":"\u003cp\u003eHi, I’m Alex! I’m a creative filmmaker and economics major at Northwestern University, passionate about combining art and analysis to tell compelling stories and solve meaningful problems. My academic journey merges behavioral economics with visual storytelling, exploring how creativity and critical thinking intersect.\u003c/p\u003e\u003cp\u003eOutside of my studies, I dive into creative projects across various mediums. I produce content for YouTube, crafting stories and visuals that resonate with diverse audiences. From concept development to editing, I enjoy every aspect of the process, which has deepened my understanding of digital storytelling.\u003c/p\u003e\u003cp\u003eI’m also passionate about music, drawing, acting, and visual art. Composing music and sketching allow me to express ideas in unique ways, while acting has taught me to step into different perspectives—a skill that enhances both my creative work and academic collaborations.\u003c/p\u003e\u003cp\u003eI love helping others bring their ideas to life. As a mentor and teaching assistant, I’ve guided students in refining their artistic visions, tackling academic challenges, and exploring innovative ideas. Supporting others in finding their voice and unlocking their potential is one of my favorite aspects of collaboration.\u003c/p\u003e\u003cp\u003eIf you’re looking for someone to guide you through a creative process, help with a passion project, or support your academic journey, I’d love to work with you. Let’s unleash your creativity and bring your vision to life!\u003c/p\u003e","teachingVideoPlaybackId":"RUW1LltRQoUpOmYqXqK7PaiOPys18izFgSJUmOFXU3c","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"eaa0ecdd-a5af-48a3-896f-2829ca179ddf\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed112e9e-b5b2-45bb-aca8-b3db6556e8e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"812886bd-5ea9-41fb-a008-d1948b1e7d6c\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd8fdcf5-8f84-43ef-9ca5-9e769981acb6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/604c4fee-f88f-41be-8c2a-d55616158978/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"93e0540d-7d15-4e92-819a-a68bb53f550c\"}"},{"__ref":"Education:{\"uuid\":\"c5230971-ef73-4d89-9269-2de690d99b81\"}"}],"hiredAt":"2025-01-26T16:15:33.561Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History",
