xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8487b08b-7fca-407b-b6a7-b87d89f61e42\"}":{"__typename":"Favorites","uuid":"8487b08b-7fca-407b-b6a7-b87d89f61e42","photoUrl":"https://ucarecdn.com/88fb0d10-2faa-424b-9fba-20f7889457fa/","title":"Copenhagen, Denmark","type":"CITY"},"Favorites:{\"uuid\":\"649446e3-a64e-4960-b44d-3fd3477c79b4\"}":{"__typename":"Favorites","uuid":"649446e3-a64e-4960-b44d-3fd3477c79b4","photoUrl":"https://ucarecdn.com/380ae9c3-b4d5-4c31-b0d3-c47e0c051cda/","title":"You Have More Influence Than You Think","type":"BOOK"},"Favorites:{\"uuid\":\"6872ea7a-a900-4c2a-8837-0c952bc67175\"}":{"__typename":"Favorites","uuid":"6872ea7a-a900-4c2a-8837-0c952bc67175","photoUrl":"https://ucarecdn.com/4dbf2b9b-197f-4c2e-9451-063b47694be4/","title":"Golden Hour by Surfaces","type":"SONG"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"63c33847-f05f-46bb-8115-a90fd37123fe\"}":{"__typename":"DeepDives","uuid":"63c33847-f05f-46bb-8115-a90fd37123fe","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eI found myself applying to CC as a mentor in the summer before my first year of college, this was a daunting time, to say the least. I was entering this new chapter of my life where I’d have the opportunity to explore academics through an educational experience unlike any other. My instinct in this time of uncertainty was to seek mentorship – to consult with the Cornell students I’d known – and ask them about their learning experiences thus far. The advice and insight I gained were pivotal for me, I found a new clarity I previously had not carried with me before. Mentorship to me means offering someone your knowledge in exchange for gratitude, sharing your thoughts and insights in an educational or informative context, and being met with an extension of those thoughts through the lens of another person.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4cfa1c6f-d40e-44a1-b91b-c3538f9ef2e9\"}":{"__typename":"DeepDives","uuid":"4cfa1c6f-d40e-44a1-b91b-c3538f9ef2e9","content":"\u003cp\u003eIndustrial and Labor Relations (ILR) might be one of the most niche majors out there – this intrigued me. Above the very nature of the major, I had no clue what the name meant career-wise. I read a description of the major on the ILR School website and felt like I was reading a description of myself. ILR is a major designed for students interested in areas such as law, business, human resources, consulting, and so on. It was described as one major with\u0026nbsp;\u003cem\u003eendless possibilities.\u003c/em\u003e\u0026nbsp;As I continue my educational journey as a pre-law student I will benefit from the opportunity to take classes such as Labor Law, or other coursework at Cornell Law School like International Human Rights Law.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"dfee2b64-d40a-4aba-9134-e65f10dc5bf1\"}":{"__typename":"DeepDives","uuid":"dfee2b64-d40a-4aba-9134-e65f10dc5bf1","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eIn the past I’ve taught students on the broad umbrella term of sustainability, but have focused on things such as reforming the agricultural system of the U.S., nutritional education, and coffee and ceramics. Currently, I’m mentoring two students on 6-week passion projects such as the effects of pesticides on honey bees and solar energy. I’d like to explore new avenues of teaching and delve into categories such as culinology, journalism, and intellectual property law.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"School:{\"uuid\":\"6e08c71e-6a4b-488b-9a0b-007302fffcde\"}":{"__typename":"School","uuid":"6e08c71e-6a4b-488b-9a0b-007302fffcde","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14853"},"Education:{\"uuid\":\"1ff43d54-aa2f-40fa-90c9-518d700bf76e\"}":{"__typename":"Education","uuid":"1ff43d54-aa2f-40fa-90c9-518d700bf76e","school":{"__ref":"School:{\"uuid\":\"6e08c71e-6a4b-488b-9a0b-007302fffcde\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Industrial \u0026 Labor Relations","degree":"Bachelor of Science"},"School:{\"uuid\":\"1fdcf198-e23c-4aff-bbe1-c39c8b889b95\"}":{"__typename":"School","uuid":"1fdcf198-e23c-4aff-bbe1-c39c8b889b95","name":"Bergen County Technical High School","city":"Teterboro","type":"HIGH","state":"NJ","country":"United States","zip":"07608"},"Education:{\"uuid\":\"1a3667e7-a6d8-44fc-9b51-923441eb4b88\"}":{"__typename":"Education","uuid":"1a3667e7-a6d8-44fc-9b51-923441eb4b88","school":{"__ref":"School:{\"uuid\":\"1fdcf198-e23c-4aff-bbe1-c39c8b889b95\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"4982bad0-b89f-46de-b19a-53711703eb81\"}":{"__typename":"MentorPublicProfile","uuid":"4982bad0-b89f-46de-b19a-53711703eb81","displayName":"Adam S.","slug":"adam-senzon-1","biography":"\u003cp\u003e\u003cstrong\u003eAdam Senzon is a Senior at Cornell University’s School of Industrial and Labor Relations (ILR), where he focuses on the intersections of law, journalism, and sustainability.\u003c/strong\u003e \u003cbr\u003e\u003cbr\u003eAdam’s academic journey is strongly defined by a commitment to service, leadership, and mentorship within the Cornell community and beyond. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver his past three years within ILR, Adam has taken on numerous roles that demonstrate his unwavering dedication to helping his peers succeed. He has previously served as a peer mentor for the ILR Student Government Organization, currently acts as an ILR Admissions Ambassador, and is an active brother and Vice President of Programming for Phi Alpha Delta, Cornell’s premier pre-law fraternity. Adam has also previously managed a club known as the Cornell Wardrobe as Vice President of Internal Relations, where he expanded access to professional attire for students. He has also completed the Cornell Law School Diversity Matters Outreach Program, which was key to gave him exposure to legal education and issues of equity and inclusion.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdam has an extensive background in writing as a former columnist for the Cornell Daily Sun, where he published “My Two-Sents,” a column for the opinion section blending commentary and analysis of student life and broader societal issues. Currently, he serves as Chief of Human Resources for Crossroads, a nonprofit organization that supports mentorship and leadership development for young professionals. He also continues to serve as a Cornell ILR Admissions Office Admissions Ambassador, where he shares his experiences with prospective students and their families.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond his campus leadership, Adam has gained professional experience in the field of Trusts \u0026amp; Estates law. He spent his past two summers working at a New York City law firm, observing depositions, acting as a witness in legal signings with clients, and executing estate-planning documents. These experiences were crucial to strengthening his preferred area of legal practice, Trusts \u0026amp; Estates Planning, and confirmed that he would like to practice in the legal field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor with Curious, Adam’s teaching style is receptive, organized, and thought-provoking. He aims to help mentees develop a passion for learning by encouraging active participation, discussion, and critical thinking. He prefers to teach with active learning techniques, conversation building, and knowledge refinement to promote intellectual growth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, Adam enjoys running marathons, hosting dinner parties for friends, and exploring his personal style through fashion. His combination of professional ambition, creativity, and community engagement makes him a dynamic mentor who has a passion for learning.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"mP4jcP003CZomeUyCFyqVwzf1SYcftsTimMuR01aXXBCo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8487b08b-7fca-407b-b6a7-b87d89f61e42\"}"},{"__ref":"Favorites:{\"uuid\":\"649446e3-a64e-4960-b44d-3fd3477c79b4\"}"},{"__ref":"Favorites:{\"uuid\":\"6872ea7a-a900-4c2a-8837-0c952bc67175\"}"}],"causesSupported":[],"major":"Industrial \u0026 Labor Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"63c33847-f05f-46bb-8115-a90fd37123fe\"}"},{"__ref":"DeepDives:{\"uuid\":\"4cfa1c6f-d40e-44a1-b91b-c3538f9ef2e9\"}"},{"__ref":"DeepDives:{\"uuid\":\"dfee2b64-d40a-4aba-9134-e65f10dc5bf1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/57ab5b23-8395-4d59-8620-663dafc1007f/-/preview/-/format/jpg/","https://ucarecdn.com/3384f
