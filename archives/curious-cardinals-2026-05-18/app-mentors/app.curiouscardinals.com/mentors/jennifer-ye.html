xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"af3cee05-e908-475b-94fe-9982fc2c4aed\"}":{"__typename":"DeepDives","uuid":"af3cee05-e908-475b-94fe-9982fc2c4aed","content":"\u003cp\u003eMy family is Chinese and I was raised to believe that education is one of the most important parts of life. Three of my four grandparents worked as educators (of math, kinetics, and English). Growing up, my paternal grandmother spent many hours patiently teaching me math and Chinese during elementary school summers. She is my model for what a good teacher is and I hope to share that with you all!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"c1e8290f-e9d9-4471-8756-35d87cb1b3ec\"}":{"__typename":"School","uuid":"c1e8290f-e9d9-4471-8756-35d87cb1b3ec","name":"North Carolina School of Science and Mathematics","city":"Durham","type":"HIGH","state":"NC","country":"USA","zip":"27705"},"Education:{\"uuid\":\"64cc81fd-0cd7-4134-b053-bd1ee2417d2b\"}":{"__typename":"Education","uuid":"64cc81fd-0cd7-4134-b053-bd1ee2417d2b","school":{"__ref":"School:{\"uuid\":\"c1e8290f-e9d9-4471-8756-35d87cb1b3ec\"}"},"startYear":"2019","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"9ffefdb8-3a44-4b7d-85c4-787c9b9cec6f\"}":{"__typename":"Education","uuid":"9ffefdb8-3a44-4b7d-85c4-787c9b9cec6f","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"de00b311-342a-4a7a-967b-4dae751abd99\"}":{"__typename":"MentorPublicProfile","uuid":"de00b311-342a-4a7a-967b-4dae751abd99","displayName":"Jennifer Y.","slug":"jennifer-ye","biography":"\u003cp\u003eHello! I'm Jennifer!\u003cbr\u003eIt's so great to meet you :) I'm from Raleigh, NC and I am now a junior at Yale University. I'm passionate about \u003cbr\u003ewomen's health, biotechnology, healthcare, and making my friends and younger sister (that's her in the photo!) smile :)\u003cbr\u003eIn summer of 2023, I worked at a women's healthcare technology startup in Denmark and had a great time learning how to live alone and bike through the streets of Copenhagen!\u003cbr\u003eAside from classes, I dance on the bhangra team at Yale and work in the Dean's Office on interpersonal dynamics and consent education. For years, I have been researching in various labs at Duke and Yale and would love to chat about my silly failed experiments and my enriching times learning more about materials science. \u003cbr\u003eIn high school, I loved debating (shout out virtual TOC 2020 - I was a congressional debater), serving on my school's student government, and leading a collaboration between my high school and a local middle school to teach more young girls about STEM. I also submitted business proposals to entrepreneurship challenges such as the Diamond Challenge and Conrad Challenge - wins were serious highlights of my time in high school! Fun facts: I used to have silk worms and I spend too much time on Spotify (favs right now are Niki, Amine, and Dominic Fike). \u003cbr\u003eI would absolutely love to speak with any of you about any of the above and more :
