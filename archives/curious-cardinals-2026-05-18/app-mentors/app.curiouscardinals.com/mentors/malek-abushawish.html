xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"286d184d-060f-4299-88df-0273ab69c309\"}":{"__typename":"Favorites","uuid":"286d184d-060f-4299-88df-0273ab69c309","photoUrl":"https://ucarecdn.com/e77415f6-8ab6-468d-93fd-16857d11abea/","title":"Keanu Reeves","type":"ACTOR"},"Favorites:{\"uuid\":\"1e60f166-d2cc-404e-ac75-9d581d19555e\"}":{"__typename":"Favorites","uuid":"1e60f166-d2cc-404e-ac75-9d581d19555e","photoUrl":"https://ucarecdn.com/f6e6b953-87ba-4a41-aae8-8d64a7748973/","title":"Lebron James","type":"ATHLETE"},"Favorites:{\"uuid\":\"8f80c7c9-0e5e-4c6a-9798-e8ff2865b309\"}":{"__typename":"Favorites","uuid":"8f80c7c9-0e5e-4c6a-9798-e8ff2865b309","photoUrl":"https://ucarecdn.com/224e4fa6-4fe7-4ebf-acc9-be8e3b0bcbbd/","title":"Deftones","type":"ARTIST"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2658a7a5-9dd3-49f0-bf74-8e94908e39a9\"}":{"__typename":"DeepDives","uuid":"2658a7a5-9dd3-49f0-bf74-8e94908e39a9","content":"\u003cp\u003eMy dream job is to be an astronaut, and I think it always has been. Many people may think it's a childish endeavor or one of those simple answers an innocent kid may give when asked what they want to be, but I believe the single greatest experience of my life would be going to space one day. And ever since coming to Stanford and studying Aeronautics \u0026amp; Astronautics, that dream is becoming ever more real. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"0adc7582-7162-4403-b6ce-fb9a12187829\"}":{"__typename":"DeepDives","uuid":"0adc7582-7162-4403-b6ce-fb9a12187829","content":"\u003cp\u003eMy parents--1000 percent. They are my greatest inspirations and embody the kind of person I want to be. They are hardworking, driven, and--most importantly--kind. Kindness is becoming more of a rarity as I reach the competitive peaks of college life, but fortunately I have attracted what I have always put out--kindness, and it is all thanks to my parents. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d06a2863-96a3-4371-b20d-6e42fed8322a\"}":{"__typename":"DeepDives","uuid":"d06a2863-96a3-4371-b20d-6e42fed8322a","content":"\u003cp\u003eIn my spare time, I love to boulder and top-rope at Stanford's wonderful climbing gym with my good friend Jason. I also like to swim at the pool as often as I can. I recently have gotten into boxing as well, since the student club was recently created. I also play video games with my friends from back home as a way of keeping in touch. We play League of Legends mostly, but sometimes will get on Counter Strike, or Overwatch 2 if we have the chance. Though, I do recommend staying far away from all three of these games if you do not have a good group to play with. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"6068cc7e-4c98-4419-a94f-62677639bbed\"}":{"__typename":"DeepDives","uuid":"6068cc7e-4c98-4419-a94f-62677639bbed","content":"\u003cp\u003eI was quite arrogant--much to my own deficit. I would annoy quite a lot of people for being so loud about my intelligence. It was really off-putting and I regret acting that way, but I was a clueless teenager and changed for the better around my junior year. I dedicated myself to forming long-term connections with my closest friends at the time, as I knew we would be going our separate ways eventually after we graduated. It paid off, because I still keep in touch with a lot of those people. I also relaxed more as I tried to move away from the competitive nature of academics. Yes, I was on track to going to Stanford, so I could not let up entirely, but I allowed myself to have fun and do things like club volleyball during my senior year, as well as go out more often with friends. High school was a tumultuous experience, but I really would not have it any other way. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"87120e68-25ea-4a9c-b153-2e66843fa2a8\"}":{"__typename":"School","uuid":"87120e68-25ea-4a9c-b153-2e66843fa2a8","name":"Ronald Reagan College Prep Highschool","city":"Milwaukee","type":"HIGH","state":"Wisconsin","country":"United States","zip":"53221"},"Education:{\"uuid\":\"9a6e9742-a08e-4c4a-88fa-70a64043da42\"}":{"__typename":"Education","uuid":"9a6e9742-a08e-4c4a-88fa-70a64043da42","school":{"__ref":"School:{\"uuid\":\"87120e68-25ea-4a9c-b153-2e66843fa2a8\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"16c90a98-990a-443b-bc31-770238371049\"}":{"__typename":"Education","uuid":"16c90a98-990a-443b-bc31-770238371049","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Aeronautics \u0026 Astronautics","degree":null},"Testimonial:6f1f8ffa-3a2f-44b8-a2b1-5944f5eac235":{"__typename":"Testimonial","id":"6f1f8ffa-3a2f-44b8-a2b1-5944f5eac235","text":"Malik was super professional and inspiring. Aaditya mentioned Malik was always well-prepared and explained very well difficult to understand concepts. Aaditya really enjoyed his sessions and got more curious about the topics they discussed.","date":"2025-05-30 05:53:07.152+00","rating":5,"endorser":{"__typename":"Endorser","name":"Priya Baveja","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"65cd892a-f5a7-45cc-8888-884ccca78866\"}":{"__typename":"MentorPublicProfile","uuid":"65cd892a-f5a7-45cc-8888-884ccca78866","displayName":"Malek A.","slug":"malek-abushawish","biography":"\u003cp\u003eI am a Junior (3rd year) studying Aeronautics \u0026amp; Astronautics at Stanford University, which coined the \"FLI\" (first-generation, low-income) title for students like me. My mother and father are both immigrants, having come from Laos and Jordan respectively. Ethnically, I am Palestinian-Laotian. I was born and raised in Milwaukee, having lived on the south side of the city most of my life. The summer following my high school graduation, my family moved into our first house in Caledonia--a Milwaukee suburb--after having rented all of my life. It was a big achievement for us, and I am driven by my parents' determination as successful immigrants.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I played tenor saxophone in the band and dabble a bit in guitar, ukulele, and piano when I can. I also played football, swam competitively, competed in tennis, and participated in club volleyball.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy favorite music artists at the moment are probably beabadoobee, keshi, and the Deftones--though I am getting into shoegaze as a genre a bit more. A big Wisconsin sports fan, my favorite teams are, of course, the Milwaukee Bucks, the Green Bay Packers, and the Milwaukee Brewers. I have a soft-spot for UW-Madison's teams as my girlfriend as well as many of my friends attend, but I prefer to support the Stanford Cardinal--Fear the Tree! In my free time, I like to climb at Stanford's awesome gym, swim, or just play some video games with my friends from back home.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love aviation and space flight, so feel free to ask me about anything related to those. I participate in Stanford's Flight Club as the Workspace Manager as well.\u003c/p\u003e","teachingVideoPlaybackId":"9uBbzEOAqg4a9qySWd02r6D502AR4v00tYTzm4Xx59TAqE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI believe my greatest achievement was getting accepted to Stanford through QuestBridge. I had never considered doing the National College Match, but the Undergraduate Dean of Admissions, Rick Shaw, personally emailed me and said to try QuestBridge's Early Decision Application. I found out on December 1, 2021 that I was Stanford-bound. It was in the middle of my IB-HL Mathematics class that I received my match status, and I remember just standing up in disbelief, hands on my head. My friends who were present cheered for me, and I called my parents right away after being dismissed from school--they were ecstatic. It felt amazing to make them so proud. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"286d184d-060f-4299-88df-0273ab69c309\"}"},{"__ref":"Favorites:{\"uuid\":\"1e60f166-d2cc-404e-ac75-9d581d19555e\"}"},{"__ref":"Favorites:{\"uuid\":\"8f80c7c9-0e5e-4c6a-9798-e8ff2865b309\"}"}],"causesSupported":[],"major":"Aeronautics \u0026 Astronautics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2658a7a5-9
