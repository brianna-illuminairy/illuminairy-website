xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f99d322b-d4d0-4bd2-81b5-2081b7d16279\"}":{"__typename":"DeepDives","uuid":"f99d322b-d4d0-4bd2-81b5-2081b7d16279","content":"\u003cp\u003eGrowth entails the willingness to be remade. Allow yourself to fail and to lose. You can only accept or create new things if your hands aren't already full.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d43528b5-ce92-4d03-971f-edda176209ba\"}":{"__typename":"DeepDives","uuid":"d43528b5-ce92-4d03-971f-edda176209ba","content":"\u003cp\u003eA mentor expands your field of vision—not so you know more, but so you recognize how much you don't know. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThey offer truthful perspectives on morally complicated dilemmas, keeping you humble and grounded. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eGood mentorship reminds me constantly how little I know, which is necessary for growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"01ed6885-2156-4a87-a5b4-e83b4e967202\"}":{"__typename":"DeepDives","uuid":"01ed6885-2156-4a87-a5b4-e83b4e967202","content":"\u003cp\u003eI want my work to have been a form of love.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c65ba95a-01a9-435f-bbf1-26e0ec52cf50\"}":{"__typename":"DeepDives","uuid":"c65ba95a-01a9-435f-bbf1-26e0ec52cf50","content":"\u003cp\u003eI chose environmental studies because it's a stunning thing to learn how nature works. You start to see patterns within and around you. There is a marvellous depth to the way the waves roll or how a mountain erodes. And you remember just how beautiful this world is.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"0fce2751-46e5-4b3b-805a-06f808f57b54\"}":{"__typename":"School","uuid":"0fce2751-46e5-4b3b-805a-06f808f57b54","name":"Our Lady of Lourdes Academy","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33143"},"Education:{\"uuid\":\"f9afce2b-6e3a-44dc-99a5-af5e6a63763a\"}":{"__typename":"Education","uuid":"f9afce2b-6e3a-44dc-99a5-af5e6a63763a","school":{"__ref":"School:{\"uuid\":\"0fce2751-46e5-4b3b-805a-06f808f57b54\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"5f2ef772-6f92-4216-97eb-9cdaefbb9445\"}":{"__typename":"Education","uuid":"5f2ef772-6f92-4216-97eb-9cdaefbb9445","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Environmental Studies concentrating in International Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"a6f498a6-3c1d-482d-9d72-784dabf96310\"}":{"__typename":"MentorPublicProfile","uuid":"a6f498a6-3c1d-482d-9d72-784dabf96310","displayName":"Camila Y.","slug":"camila-young","biography":"\u003cp\u003eI'm spearheading what I call the \"Climate Renaissance\": a flourishing of creativity in response to our collective environmental challenge. I see the life we live as the greatest art, and my work with communities and creatives seeks to illuminate the beauty of interconnection.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've cloistered with trappist monks in Spain, interviewed a sangha in the rural mountainsides of Japan, walked 450 km on a religious pilgrimage, lived in a human rights artist residency, and organized community art exhibitions across New Haven, New York, and Miami. If we aim to make the world a creative, innovative, and culturally cognizant place, I believe we must become such people.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs Editor and Correspondent for The Yale Globalist, I've published international climate journalism, translating academic and policy research into accessible public-facing writing. In high school, I co-authored a peer-reviewed publication in Environmental Research: Climate on local narratives in emerging climate governance—demonstrating early on that young people can contribute to serious scholarly conversations about our environmental future.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI founded my first nonprofit, Relief After Disaster, as a high school junior after Hurricane Maria devastated my family's homeland of Puerto Rico. What started as 7 friends grew to 170+ members across three chapters, organizing 300-person coastal cleanups, building school gardens, and proving that young people can catalyze meaningful community engagement.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I continued pursuing community projects on behalf of the environment. Through my initiative Palette to Purpose, I partnered with the World Wildlife Fund, United Nations Millennium Fellowship, and Foundation Fighting Blindness to bring together 150+ people in accessible hope-centered climate dialogues through art exhibitions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've worked at the intersection of art and climate diplomacy. I served as Youth Ambassador for an international climate NGO in Geneva, led Yale's delegation to COP30 (the United Nations climate conference and the world's largest diplomatic space for climate policy), and co-founded a multinational alliance between creatives, lawyers, and researchers to reimagine climate action.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter graduation, I'm headed to the Royal College of Art in London for my Masters in Fine Art. There, I'll be pursuing visual art and design as a form of cutural diplomacy. I have an approach in which I respond to hardship and struggle through finding the beautify in it. I want to continue to be a creator, a builder.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI feel so grateful to have had the opportunity to respond to climate anxiety through art. I'm still learning what it means to be an artist. And to be honest, it scares me to pursue a career that doesn't have a clear path. But there is a certain beauty to carving your own way. The world is constantly transforming, and I hope to transform with it (and for it!).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe opportunity to mentor others who want to do the same is a blessing, and I'm immensely grateful to Curious Cardinals for creating a platform to allow that.\u003c/p\u003e","teachingVideoPlaybackId":"e8TYOXnxpZrO4aDdABBnYfKFXFYQbWZnSCZsK502mMNM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI worked up the courage to pursue art in a world that tells us art is superfluous. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eArt isn't just decoration. It's a way of interacting with the world. It's seeing the beauty in movement and acting on the desire to create.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCreativity is a force of nature. And I'm proud of myself for remembering that.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Environmental Studies concentrating in International Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f99d322b-d4d0-4bd2-81b5-2081b7d16279\"}"},{"__ref":"DeepDives:{\"uuid\":\"d43528b5-ce92-4d03-971f-edda176209ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"01ed6885-2156-4a87-a5b4-e83b4e967202\"}"},{"__ref":"DeepDives:{\"uuid\":\"c65ba95a-01a9-435f-bbf1-26e0ec52cf50\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8cfda047-1444-44cc-b826-4f79927e949e/-/preview/-/format/jpg/","https://ucarecdn.com/12c9a354-596a-420f-ac22-45870c715140/-/preview/-/format/jpg/","https://ucarecdn.com/deca582a-7fb3-4e12-a90a-f0693995b2a3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f9afce2b-6e3a-44dc-99a5-af5e6a63763a\"}"},{"__ref":"Education:{\"uuid\":\"5f2ef772-6f92-4216-97eb-9cdaefbb9445\"}"}],"hiredAt":"2026-02-24T20:57:43.407Z","topics":["Creative Writing","Visual Arts / Graphic Design","Business / Entrepreneurship","Law / Government / Policy","Sustainability","Public Speaking","Journalism"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"camila-young\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a6f498a6-3c1d-482d-9d72-784dabf96310\"}"}}},"_
