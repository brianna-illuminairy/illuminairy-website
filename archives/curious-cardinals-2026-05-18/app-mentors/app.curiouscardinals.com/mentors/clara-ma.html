xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2be66f9f-1b39-4c00-8fee-8e3b2667613f\"}":{"__typename":"Favorites","uuid":"2be66f9f-1b39-4c00-8fee-8e3b2667613f","photoUrl":"https://ucarecdn.com/44ea3655-e6e4-4c12-a6d1-d9f450b76430/","title":"\"CHIHIRO\" by Billie Eilish","type":"SONG"},"Favorites:{\"uuid\":\"66bad708-fdc5-4108-9908-d895f6354583\"}":{"__typename":"Favorites","uuid":"66bad708-fdc5-4108-9908-d895f6354583","photoUrl":"https://ucarecdn.com/ee6c534f-d27c-4728-9a82-8e847bc70d1b/","title":"London","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a1e9c301-d8ea-4de4-8b56-2a2718c4a13e\"}":{"__typename":"DeepDives","uuid":"a1e9c301-d8ea-4de4-8b56-2a2718c4a13e","content":"\u003cp\u003eMy older sister has always been my closest and most influential mentor. She taught me lessons I still use today, from practical skills like tying my shoelaces to moral lessons in friendship. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith her mentorship, I feel like I can mold my life with more clarity and solace because I have the guidance of someone else who has been in similar shoes. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"382f91b2-6d95-43f6-bf09-d724b34de156\"}":{"__typename":"DeepDives","uuid":"382f91b2-6d95-43f6-bf09-d724b34de156","content":"\u003cp\u003eCognitive Science studies the mind from multiple angles, including neuroscience, computer science, philosophy, and math. I love that the study of the mind teaches us how to make the best decisions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"24aacc46-398e-4af3-ac28-503a41d34723\"}":{"__typename":"DeepDives","uuid":"24aacc46-398e-4af3-ac28-503a41d34723","content":"\u003cp\u003eIn high school, I put a lot of my time and energy into flute and orchestra. In applying for college, I felt stuck with finding the \"perfect link\" between music and my academic interests. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eEventually, I learned that I needed to take control in making my involvement more practical: by leading my music-based community service club or writing about the philosophy behind music. This helped me discover the \"bigger picture\" for my interests. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a2551a53-acd7-4a57-8384-00ad253f2765\"}":{"__typename":"DeepDives","uuid":"a2551a53-acd7-4a57-8384-00ad253f2765","content":"\u003cp\u003eThere are two main projects: \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe first project was a philosophy blog I created in high school, where I wrote about the application of philosophy and daily life. I wanted to have an outlet for exploring a subject that interested me, but wasn't heavily taught in school. Example blog posts include the ethics of the music industry or the philosophy of New Year's resolutions. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe second project was a research paper I worked on for a year, which focused on a political movement challenging healthcare disparities in the US.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"28dc9414-39f2-4281-9471-f58ee71688b7\"}":{"__typename":"School","uuid":"28dc9414-39f2-4281-9471-f58ee71688b7","name":"The Hotchkiss School","city":"Lakeville","type":"HIGH","state":"Connecticut ","country":"USA","zip":"06039"},"Education:{\"uuid\":\"72f289e9-c2df-4d67-8875-2a49533f6200\"}":{"__typename":"Education","uuid":"72f289e9-c2df-4d67-8875-2a49533f6200","school":{"__ref":"School:{\"uuid\":\"28dc9414-39f2-4281-9471-f58ee71688b7\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"2a50390d-dc49-49f9-8b55-b6a022eff872\"}":{"__typename":"Education","uuid":"2a50390d-dc49-49f9-8b55-b6a022eff872","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Cognitive Science \u0026 Philosophy","degree":null},"MentorPublicProfile:{\"uuid\":\"0663b13e-cf17-47be-b887-c600d4f4d506\"}":{"__typename":"MentorPublicProfile","uuid":"0663b13e-cf17-47be-b887-c600d4f4d506","displayName":"Clara M.","slug":"clara-ma","biography":"\u003cp\u003e\u003cstrong\u003eHi! I’m Clara,\u003c/strong\u003e a third-year undergraduate student at the University of Pennsylvania pursuing a double major in Cognitive Science and Philosophy. I love helping students find unconventional links between their interests and turn those ideas into something tangible and meaningful.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch2\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eGrowing up with interests spanning from neuroscience, philosophy, and music, I learned that having a diverse set of passions is an asset — not a disadvantage. \u003cstrong\u003eI've explored my interests in several ways:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMentored 10+ high school and college students\u003c/strong\u003e as a Project Leader with Wharton Asia Exchange, Penn's largest pre-professional club. I helped students through long-term presentations that we gave to real businesses, including a company on the S\u0026amp;P 500.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFounded a multi-media philosophy\u003c/strong\u003e \u003cstrong\u003eblog\u003c/strong\u003e that explores the ways that philosophy shows up in daily life.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearched healthcare and machine learning\u003c/strong\u003e through my own research paper on healthcare outcomes and doing research with Penn Medicine.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e\u003ch2\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI specialize in helping K–12 students through:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch mentorship:\u003c/strong\u003e Identifying a research question, developing a plan, and bringing an idea to life through writing or data analysis.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePortfolio building: \u003c/strong\u003eFinding your niche and turning your interests into a blog, podcast, website, or other creative platform\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCommunity outreach projects:\u003c/strong\u003e Designing initiatives that create real impact, drawing on my experience organizing community concerts and supporting local businesses\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSTEM and humanities subject guidance: \u003c/strong\u003eHelping students in psychology, statistics, data analytics, computer programming, as well as English and the humanities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e\u003ch2\u003e\u003cstrong\u003eA typical session with me might involve:\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWorking toward a tangible product\u003c/strong\u003e, such as a presentation, blog post, or research paper\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCurating online resources\u003c/strong\u003e tailored specifically to your interests and goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSharing strategies\u003c/strong\u003e for navigating times for when you feel stuck\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy goal is for you to leave each session with both clarity and something you’re proud of.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch2\u003e\u003cstrong\u003eOutside of class\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, you can usually find me playing flute in the Penn Symphony Orchestra, passing a volleyball on the grass with friends, or hunting for the best carrot cake in town.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re excited to find your unique voice, connect your interests in unexpected ways, and build something that truly reflects who you are, I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"BkxT01UeqrT1JTfL69YqNrWpeEpeWwT4dd9PPB00iQZBw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2be66f9f-1b39-4c00-8fee-8e3b2667613f\"}"},{"__ref":"Favorites:{\"uuid\":\"66bad708-fdc5-4108-9908-d895f6354583\"}"}],"causesSupported":[],"major":"Cognitive Science \u0026 Philosophy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a1e9c301-d8ea-4de4-8b56-2a2718c4a13e\"}"},{"__ref":"DeepDives:{\"uuid\":\"382f91b2-6d95-43f6-bf09-d724b34de156\"}"},{"__ref":"DeepDives:{\"uuid\":\"24aacc46-398e-4af3-ac28-503a41d34723\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2551a53-acd7-4a57-8384-00ad253f2765\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1ba408a0-3021-442d-a86c-44feb2eaac9a/-/preview/-/format/jpg/","https://ucarecdn.com/db51206f-f5ec-47f1-8e61-53c246663478/-/preview/-/format/jpg/","https://ucarecdn.com/0a63148f-3ce8-4425-8592-4dec04c23882/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"72f289e9-c2df-4d67-8875-2a49533f6200\"}"},{"__ref":"Education:{\"uuid\":\"2a50390d-dc49-49f9-8b55-b6a022eff872\"}"}],"hiredAt":"2026-01-27T17:49:56.638Z","topics":["Statistics","Biology","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Music","History Project","K-6 Storybook"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"clara-ma\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0663b13e-cf17-47be-b887-c600d4f4d506\"}"}}},"_sentryTraceData":"5779feb5f94c46d18d2040f5006a1a10-bf3fc84645a8077f-1"
