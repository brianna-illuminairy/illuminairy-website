xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2d466f31-2536-4d59-9b98-4273fef2dfa9\"}":{"__typename":"Favorites","uuid":"2d466f31-2536-4d59-9b98-4273fef2dfa9","photoUrl":"https://ucarecdn.com/1ced57cf-0117-4ed9-9603-3bf769c79553/","title":"The Miseducation of Lauryn Hill","type":"ALBUM"},"Favorites:{\"uuid\":\"c0cd01f0-84f1-4930-ab03-f7b0ff0cd978\"}":{"__typename":"Favorites","uuid":"c0cd01f0-84f1-4930-ab03-f7b0ff0cd978","photoUrl":"https://ucarecdn.com/b7a0596b-4833-40b0-83ca-10ef1727c999/","title":"Ma Rainey's Black Bottom","type":"PLAY"},"Favorites:{\"uuid\":\"0f19d738-7831-493c-bff9-1899162747f5\"}":{"__typename":"Favorites","uuid":"0f19d738-7831-493c-bff9-1899162747f5","photoUrl":"https://ucarecdn.com/347f13a7-5cb0-47b0-87aa-d95b2e393003/","title":"The Bean Trees by Barbara Kingsolver","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"920a06e4-a85c-4ea4-b3cb-60ca8053f2bf\"}":{"__typename":"DeepDives","uuid":"920a06e4-a85c-4ea4-b3cb-60ca8053f2bf","content":"\u003cp\u003eMentorship is crucial, it is something I wish I had more of. As my mom worked hard to provide me opportunity, I remember searching for an extra hour at the end of her work day that didn't exist. Even applying for college left me wishing I had someone who knew just a little more and had a little time for my questions. Every bright student deserves this focused attention that not everyone has the privilege to provide. The few people that I can call mentors over the years have held permanent places in my heart, providing me space to be sad and shine. That is an incredible role! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4b3f8691-fbff-431a-bf12-48ca326f4d49\"}":{"__typename":"DeepDives","uuid":"4b3f8691-fbff-431a-bf12-48ca326f4d49","content":"\u003cp\u003eI hope to accomplish comfortability in three languages! Broadening the way I can connect with people will only make me a advocate, creative, and person all-around!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"65d65a29-134f-474a-b334-83804c3670ea\"}":{"__typename":"DeepDives","uuid":"65d65a29-134f-474a-b334-83804c3670ea","content":"\u003cp\u003eAs Black girl who felt she often had to quiet her personality, I feel its crucial to know who I'm teaching. Beyond your study habits or learning patterns, I love to know your personality and what makes you, you. That way we both learn way more about topic, and ourselves on a connected level. Learning and professionalism do not need to be soulless to be successful. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bee1cdb1-4c87-4edd-917e-213b8ad14c74\"}":{"__typename":"DeepDives","uuid":"bee1cdb1-4c87-4edd-917e-213b8ad14c74","content":"\u003cp\u003eDo it! Find someone to help you and then do that thing, especially that thing outside of the classroom. Even if you aren't able to complete it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"12e8592a-2cec-4b3c-8336-18eb9cb2fc7b\"}":{"__typename":"School","uuid":"12e8592a-2cec-4b3c-8336-18eb9cb2fc7b","name":"Loomis Chaffee School","city":"Windsor","type":"HIGH","state":"Connecticut","country":"United States","zip":"06095"},"Education:{\"uuid\":\"24b6c948-4d2e-4045-bee1-c436a5c98926\"}":{"__typename":"Education","uuid":"24b6c948-4d2e-4045-bee1-c436a5c98926","school":{"__ref":"School:{\"uuid\":\"12e8592a-2cec-4b3c-8336-18eb9cb2fc7b\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"dad6968f-9df2-4173-ae32-4e7b2f45a0e9\"}":{"__typename":"Education","uuid":"dad6968f-9df2-4173-ae32-4e7b2f45a0e9","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"International Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"fb2e193d-c595-4d16-9e02-bff6f14616e9\"}":{"__typename":"MentorPublicProfile","uuid":"fb2e193d-c595-4d16-9e02-bff6f14616e9","displayName":"Inari Jade B.","slug":"inari-jade","biography":"\u003cp\u003eHi! My name is Inari Jade :)\u003c/p\u003e\u003cp\u003eI care about connecting with and advocating for people through language and music. I am a double-major in International Relations on the Governance and Policy track and Middle Eastern Studies at Brown University. This means you will likely find me on campus reading one of the many books assigned by my humanities-heavy course load, squeezing my Arabic flashcards in between theories. If I’m ahead of my work (I really try to be) I’m dancing with my modern African dance team, recording a song or music video, or teaching. I am often running from swim lessons to djembe drum lessons. If I’m feeling inspired, I write new songs or choreograph. On an uninspired day I am probably drafting a newsletter for the Middle Eastern Studies department, getting a gym session in, or scrapbooking. My high school career was full of sports and passion projects on health equity, police violence, and music mindfulness. Balancing travel teams and zoom meetings left no time for the little interests so in college, I’m conducting these projects within classes that ground my passions academically. Outside the classroom, I’m exploring everything that interests me from bracelet-making to traveling. Last semester I spent four months in Jordan. This language-immersion experience is already informing my work in governance, advocacy, and teaching. It confirmed my position as a young Black woman interested in exploring global intersectionalities, impacts of colonialism and cultural coping mechanisms. Growing up ambitious and curious, I remember being warned not to pull myself in too many directions. I am eager to share with other young minds that there are threads between your passions, and you should explore every one! Even if those threads are unclear, only after exploring them will you be able to articulate their connections. Understanding cultural pillars like language and music is essential to advocating for universal human rights and proper global governance. Projects that teach djembe drum or support victims of medical malpractice all point towards the same mission of humanizing and uplifting those who suffer under poorly-designed systems and policies. Uplifting a young voice to success whether through time management skills, project development, or tutoring is a beautiful way to work towards this mission!\u003c/p\u003e","teachingVideoPlaybackId":"D6Og5T0227uM3qzLb6pLKzi8tnjbuqg2gEqJHs8NymJg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2d466f31-2536-4d59-9b98-4273fef2dfa9\"}"},{"__ref":"Favorites:{\"uuid\":\"c0cd01f0-84f1-4930-ab03-f7b0ff0cd978\"}"},{"__ref":"Favorites:{\"uuid\":\"0f19d738-7831-493c-bff9-1899162747f5\"}"}],"causesSupported":[],"major":"International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"920a06e4-a85c-4ea4-b3cb-60ca8053f2bf\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b3f8691-fbff-431a-bf12-48ca326f4d49\"}"},{"__ref":"DeepDives:{\"uuid\":\"65d65a29-134f-474a-b334-83804c3670ea\"}"},{"__ref":"DeepDives:{\"uuid\":\"bee1cdb1-4c87-4edd-917e-213b8ad14c74\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8cf94f5b-45ab-4aba-bd27-eb10514943fe/-/preview/-/format/jpg/","https://ucarecdn.com/03c6a421-3a50-4dc3-acf1-482f77d9aedc/-/preview/-/format/jpg/","https://ucarecdn.com/026f8c02-f100-4d54-a514-99c024139948/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"24b6c948-4d2e-4045-bee1-c436a5c98926\"}"},{"__ref":"Education:{\"uuid\":\"dad6968f-9df2-4173-ae32-4e7b2f45a0e9\"}"}],"hiredAt":"2025-12-23T09:43:08.078Z","topics":["K-5 Grade Math","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Creative Writing","Public Speaking","Law / Government / Policy"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"inari-jade\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fb2e193d-c595-4d16-9e02-bff6f14616e9\"}"}}},"_sentryTraceData":"ff68b8f98ee74efd9e73e0397427c55d-b4805c213bb0b03b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-
