xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"0f5605ec-539d-4176-bfce-4637daa0289f\"}":{"__typename":"DeepDives","uuid":"0f5605ec-539d-4176-bfce-4637daa0289f","content":"\u003cp\u003eAstronaut\u003cbr\u003eCEO of a Space Robotics Company\u003cbr\u003eScience Communicator\u003cbr\u003ePilot\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"281dc077-d721-44db-84e7-f1b69d3dcdac\"}":{"__typename":"DeepDives","uuid":"281dc077-d721-44db-84e7-f1b69d3dcdac","content":"\u003cp\u003eIt was my first visit to NASA at the age of 7 when my dad said, “Rockets are the hardest thing man has ever built, and it is even harder to fly in one.” That day sparked an idea I never lost track of - an idea that strengthened the purpose of my life.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI enjoy being on the final frontier (Unintentional homage to Captain Kirk), of the unknown, disproving theories developed on Earth, and applying innovations to curate solutions to tomorrow’s problems. I aspire to land on Mars and be the bridge for the next generation of explorers to extend our species farther than imagined.\u003c/p\u003e\u003cp\u003eEach milestone we push through and planet we discover brings elevated capabilities and positive innovations for mankind here on earth. This process of constantly learning and discovering to curate solutions to tomorrow’s problems in a universe left to explore is what excites me to make an impact through aerospace engineering.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"df5cea31-f04b-448b-b0d0-ae52e242992a\"}":{"__typename":"DeepDives","uuid":"df5cea31-f04b-448b-b0d0-ae52e242992a","content":"\u003cp\u003eDon’t worry if I walk around on the first day wearing a blue astronaut jumpsuit and freak people out, or if you hear the most obnoxious laugh to not-so-funny jokes. Don’t worry if you hear a huge explosion in the corner of the dorm room, I was probably trying to measure the temperature at which a thermometer explodes. Don’t worry if I don’t show up to the dorm room by bedtime - I am probably sleep-welding at the Product Realization Lab or admiring my 20/20 vision looking at letters under a microscope. Don’t worry if the room is engulfed in post-it notes with random notes and tasks- none of which I end up looking at. Don’t worry if my attempt to make fried rice sets the pan on fire, I am still learning to cook and the building has fire insurance (I hope). I’m an avid rock climber, king-da-ka rider, and extreme sport adrenaline junkie; my biggest phobia is Pop-Tarts. If you are bored, I am down to choreograph dance moves to any song or jump out of planes on a windy day to feel the authenticity of aerodynamic forces (don’t worry, I make homemade parachutes in my spare time). Pro tip I invented during my Air Force cadet field training: Tape your shoelaces to the inside of your shoes so you never have to tie them again… you’re welcome! I look forward to learning about your favorite type of museum!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"59ec19f1-407b-4817-b8e3-1f1681e44135\"}":{"__typename":"School","uuid":"59ec19f1-407b-4817-b8e3-1f1681e44135","name":"John P. Stevens High School","city":"Edison","type":"HIGH","state":"New Jersey","country":"United States","zip":"08820"},"Education:{\"uuid\":\"e70a3ffc-e44c-4fee-9e32-b6b610c973f7\"}":{"__typename":"Education","uuid":"e70a3ffc-e44c-4fee-9e32-b6b610c973f7","school":{"__ref":"School:{\"uuid\":\"59ec19f1-407b-4817-b8e3-1f1681e44135\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"a4316dfc-abff-416c-9e33-f018d712a852\"}":{"__typename":"Education","uuid":"a4316dfc-abff-416c-9e33-f018d712a852","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Master's Aerospace Engineering ","degree":null},"MentorPublicProfile:{\"uuid\":\"8ae801fc-3b4c-4723-8757-90af7c191ed7\"}":{"__typename":"MentorPublicProfile","uuid":"8ae801fc-3b4c-4723-8757-90af7c191ed7","displayName":"Priya A.","slug":"priya-abiram","biography":"\u003cp\u003ePriya Abiram is an \u003cstrong\u003easpiring astronaut\u003c/strong\u003e and entrepreneur pursuing Aerospace Engineering at Cornell University. She hopes to land on Mars and develop spin-offs from space technology to improve the human condition on Earth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePriya is a \u003cstrong\u003epilot, analog astronaut, Congressional Award Gold Medalist, and science communicator\u003c/strong\u003e. She has\u003cstrong\u003e interned in Design and System engineering\u003c/strong\u003e roles at Blue Origin, Boeing, NASA Kennedy Space Center, and Inversion Space. Priya is a passionate STEM advocate and international speaker, giving keynote talks at universities and conventions internationally.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Cornell University, she is the \u003cstrong\u003eresponsible engineer for the guided parachute system\u003c/strong\u003e in the rocketry team and an integration \u0026amp; testing engineer in the Alpha CubeSat team building a satellite planned to launch to the International Space Station. She is working on her high power rocketry certification. She also leads the Women in Aviation and Aerospace chapter providing resources and organizing events to promote women entering the space field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePriya is a Citizen Science Astronaut Trainee at the International Institute of Astronautical Sciences trained in operating \u003cstrong\u003epayloads in microgravity, spacesuit evaluation, and acrobatic flying\u003c/strong\u003e. Priya trained as an analog astronaut simulating Mars conditions in isolation on top of a Hawaiian Volcano. As the Chief Scientist of the analog missions, Priya is responsible for conducting a series of scientific experiments, and research improvements to spacesuit technology. She led multiple extravehicular activities, leading the crew into lava flows to explore the volcanic terrain.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eShe is the \u003cstrong\u003einnovator of internationally awarded technologies\u003c/strong\u003e ‘Visualeyes’- an assistive technology to improve navigation for the visually impaired, ‘Vacation Station’ - portable charger powered by renewable energy, development of eco-friendly plastic fuel utilizing Pyrolysis and Catalytic cracking, improve toddler car seat through incorporation of astronaut life support systems, design lunar dust vacuum system. As a \u003cstrong\u003epublished researcher\u003c/strong\u003e, she was internationally awarded for her research on Harvesting Geothermal Energy on Mars for Future Settlement at the International Astronautical Conference in Paris, France. She also designed numerous experiments to operate in microgravity parabolic flights studying distortion and vection in astronauts.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePriya served as a \u003cstrong\u003eCadet Lieutenant Colonel\u003c/strong\u003e in the Civil Air Patrol, Auxiliary of the US Air Force, as the Cadet Commander leading 100+ cadets in leadership, STEM, military traditions, and emergency services. She enjoys pulling 6.5Gs as a private pilot. \u003cstrong\u003ePriya enjoys inspiring young girls about their passions and sharing her perspective of our planet!\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"01C01HnB00h9byY63C5rm21Z3jMws01c4HDpOUZ2oX6Wjp00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Master's Aerospace Engineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0f5605ec-539d-4176-bfce-4637daa0289f\"}"},{"__ref":"DeepDives:{\"uuid\":\"281dc077-d721-44db-84e7-f1b69d3dcdac\"}"},{"__ref":"DeepDives:{\"uuid\":\"df5cea31-f04b-448b-b0d0-ae52e242992a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b62281ad-a738-4208-9862-780fc88400e4/-/preview/-/format/jpg/","https://ucarecdn.com/6014c950-0ad7-46fe-8ea4-d728658196d2/-/preview/-/format/jpg/","https://ucarecdn.com/292f5b53-a5fe-48e4-ba89-2c293f191c89/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e70a3ffc-e44c-4fee-9e32-b6b610c973f7\"}"},{"__ref":"Education:{\"uuid\":\"a4316dfc-abff-416c-9e33-f018d712a852\"}"}],"hiredAt":"2025-12-24T17:15:26.020Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","K-5 Grade Math","Chemistry","Physics","6-8 Grade Science","French","College Essay Writing","Academic Coaching","Executive Function","Robotics / Electronics / CAD","STEM Projec
