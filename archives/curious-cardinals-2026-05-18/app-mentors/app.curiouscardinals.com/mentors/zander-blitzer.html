xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c218d74b-e6a9-4604-98f0-24c9136a0ac2\"}":{"__typename":"DeepDives","uuid":"c218d74b-e6a9-4604-98f0-24c9136a0ac2","content":"\u003cp\u003eWhen applying to college, I knew I wanted to stay in the English / History realm, but assumed I would choose something like Political Science or Creative Writing -- the things that aren't traditionally offered in high school because I thought they'd be more interesting or exciting. But when I sat down in my first class at Brown, a lecture course called History of Capitalism, I knew I wanted to keep taking as many history courses as possible. I love how no matter how much history you've taken, there's always more to explore, and I love how much the study of history encourages the use of critical thinking skills. Though many people associate history with the rote memorization of facts, I would say history requires so much more than that -- and that's what makes it endlessly fascinating.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"dd10811e-00bd-4717-98ef-192952eb3435\"}":{"__typename":"DeepDives","uuid":"dd10811e-00bd-4717-98ef-192952eb3435","content":"\u003cp\u003eOne passion project I am currently working on is documenting my 9 months living in India! I am doing this through a variety of methods, including an instagram page (with a post dedicated to each day of my year), a google map (with pins of the places I've enjoyed), and taking lots of pictures! I'm very excited to scrapbook and reflect on all of my memories when I return home.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"00e2c65d-06b5-4d31-8385-a267550d0c36\"}":{"__typename":"DeepDives","uuid":"00e2c65d-06b5-4d31-8385-a267550d0c36","content":"\u003cp\u003eI think mentorship is extremely important because looking up to role models can help us feel inspired and seen. Mentorship can help us figure out who we are and who we want to be -- and I am so grateful for my experiences both as a mentor and as a mentee throughout my life. I think both the mentor and mentee learn so much throughout the relationship and I am so excited to step back into a mentor role here at Curious Cardinals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"9c1ba63f-21d1-4a64-9db3-0515a3907985\"}":{"__typename":"DeepDives","uuid":"9c1ba63f-21d1-4a64-9db3-0515a3907985","content":"\u003cp\u003eI am extremely proud of my senior capstone in Early Modern World, for which I directed a full length production of \u003cem\u003eTwelfth Night\u003c/em\u003e. Never having directed before, I was worried about how the process would go, but I am so proud of how the production turned out. Even more than that, I am proud of how I was able to foster a sense of camaraderie and community among the cast and crew, and will forever be grateful for having led a production that was heavily focused on creating an enjoyable creative process and well as a strong performance product.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"53bed011-e9b2-40d2-aac4-9b4dd275aa59\"}":{"__typename":"School","uuid":"53bed011-e9b2-40d2-aac4-9b4dd275aa59","name":"Hopkins School","city":"New Haven","type":"HIGH","state":"Connecticut","country":"United States","zip":"06515"},"Education:{\"uuid\":\"0bf63a3c-c13f-432a-9579-b7f27edc6327\"}":{"__typename":"Education","uuid":"0bf63a3c-c13f-432a-9579-b7f27edc6327","school":{"__ref":"School:{\"uuid\":\"53bed011-e9b2-40d2-aac4-9b4dd275aa59\"}"},"startYear":"2013","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"383f35c8-71cf-47c6-be04-61963b99743d\"}":{"__typename":"Education","uuid":"383f35c8-71cf-47c6-be04-61963b99743d","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022.5","major":"History, Early Modern World","degree":null},"Testimonial:d5f59281-99ef-41da-b672-49bda5084f87":{"__typename":"Testimonial","id":"d5f59281-99ef-41da-b672-49bda5084f87","text":"My 13-year old daughter had to create a 4-5 minute speech and 14 public thank yous. While she is creative, has a good blend of storytelling and knowing her audience, and isn’t scared of tackling large projects, timeline management, understanding speech through lines, ensuring all the words in the speech ladder to the main points, and public speaking prep aren’t things she has a lot of experience with yet. So, she needed a mentor who could help her harness all of her strengths while teaching her how to fill in my daughter’s knowledge gaps. Zander was the perfect mentor to do this! Zander helped my daughter understand what makes an impactful speech, helped her create an outline and creative timeline, was actively a scribe - letting my daughter “speak the speech out” v being worried about the word choice in the moment, and ultimately helped her with the presentation prep. She did all this with a positive, knowledgeable, respectful, and approachable attitude. Zander had the hard and soft skills to make an impression on my daughter and to set her up for future success. I highly recommend Zander!","date":"2025-06-04 04:27:36.711+00","rating":5,"endorser":{"__typename":"Endorser","name":"Aimee Johnson","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"6759b610-a21b-4290-9758-f7c346ffa00c\"}":{"__typename":"MentorPublicProfile","uuid":"6759b610-a21b-4290-9758-f7c346ffa00c","displayName":"Zander B.","slug":"zander-blitzer","biography":"\u003cp\u003eHi there! Great to virtually meet you. My name is Zander Blitzer and I am an incoming 1L at Yale Law School, as well as a recent graduate of Brown University with a degree in History (with a focus on Labor \u0026amp; Economic History) and Early Modern World (with a focus on Renaissance Literature). I am a researcher, writer, policymaker, and creative who is so excited about helping you find and grow your passion, whatever that turns out to be.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince graduation, I’ve interned at the White House Gender Policy Council, embarked on a Fulbright Research Grant in Bangalore, India, and worked in New York City as a Coro Fellow. My Fulbright research project focused on evaluating the implementation and enforcement of India’s workplace sexual harassment law. I am passionate about policy, law, gender studies, labor, and other related issues and look forward to building a career focused on gender policy. This coming fall, I will be a first year at Yale Law School.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Brown, I nurtured my dual passions for policy / history / political science and theater / writing / creative pursuits inside and outside the classroom. I served as the Editor-in-Chief of the Brown Political Review, Brown’s premier non-partisan political publication -- an organization I am proud to support even in an alumni capacity. I also served on the board of Shakespeare on the Green, one of Brown’s theater organizations. I worked as a Meiklejohn Peer Advisor, guiding 3 cohorts of students through the trials and tribulations of their first years of college, led and mentored students in outdoor spaces with Brown Outdoor Leadership Training, led the Brown Undergraduate Group for History, read screenplays for Ivy Film Festival, and contributed to gender studies research. Many of these activities drew on passions I cultivated in high school, such as my participation in high school theater, the school newspaper, Model UN, tour guiding, and more.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of all of this, I love to ski (I used to race competitively), read (on track for at least 50 books this year), travel (I’ve lived in Europe and Asia), hike (I went to sleepaway camp in Maine), sing (I was in a children’s choir for 9 years), and craft (I’m very passionate about my bullet journal). I am so excited to work with you on anything related to politics, writing, the arts, organizational skills, and more -- can’t wait to meet you and get started!\u003c/p\u003e","teachingVideoPlaybackId":"RxujLA7RRpTaiGsRuK026itLcouUN2wJ7gsCidI00s9Lc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History, Early Modern World","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c218d74b-e6a9-4604-98f0-24c9136a0ac2\"}"},{"__ref":"DeepDives:{\"uuid\":\"dd10811e-00bd-4717-98ef-192952eb3435\"}"},{"__ref":"DeepDives:{\"uuid\":\"00e2c65d-06b5-4d31-8385-a267550d0c36\"}"},{"__ref":"DeepDives:{\"uuid\":\"9c1ba63f-21d1-4a64-9db3-0515a3907985\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f63aac82-6895-4c7d-8218-6f83f99c535c/-/preview/-/format/jpg/","https://ucarecdn.com/99730e6b-32b4-472e-b3cd-5417a8b49ea7/-/preview/-/format/jpg/","https://ucarecdn.com/826bffb8-b548-4a18-bb08-98922accd0b3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0bf63a3c-c13f-432a-9579-b7f27edc6327\"}"},{"__ref":"Education:{\"uuid\":\"383f35c8-71cf-47c6-be04-61963b99743d\"}"}],"hiredAt":"2024-05-20T21:22:39.503Z","topics":["6-8 Grade Science","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Film / Theater","History Project","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[{"__ref":"Testimonial:d5f59281-99ef-41da-b672-49bda5084f87"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"zander-blitzer\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6759b610-a21b-4290-9758-f7c346ffa00c\"}"}}},"_sentryTraceData":"3fcb5594c63f4c7fb9f3d28580ea9d48-a5f018f80ebbad0b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3fcb5594c63f4c7fb9f3d28580ea9d48,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"zander-blitzer"},"buildId":"ZAcrs1hPe6x
