xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7ad6171a-dd8b-447a-9791-9cd5d4b528fb\"}":{"__typename":"Favorites","uuid":"7ad6171a-dd8b-447a-9791-9cd5d4b528fb","photoUrl":"https://ucarecdn.com/d1c9154c-f145-4304-8c4e-1a06147c329d/","title":"So Close to What","type":"ALBUM"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3026cccd-fda1-44ac-a716-64cc654d3bfc\"}":{"__typename":"DeepDives","uuid":"3026cccd-fda1-44ac-a716-64cc654d3bfc","content":"\u003cp\u003eIn my spare time, I love listening to music and cooking or baking! Some of my favorites include Brown Butter Chocolate Chip Cookies or Spicy 'Vodka Sauce' Pasta!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2d954d3f-3297-485f-9242-280a76db280a\"}":{"__typename":"DeepDives","uuid":"2d954d3f-3297-485f-9242-280a76db280a","content":"\u003cp\u003eIndustrial Labor Relations at Cornell is the perfect interdisciplinary major for me. I knew I wanted to study something in the realm of law, but I also have interests in elements of business like marketing and entrepreneurship. While I'm also pursuing a minor in Business, ILR allows me to study all of these interests seamlessly together, in classes that combine each of them. Plus, its the number one school for Labor Relations in the world, which makes it one of the most amazing places to hone soft skills in advocacy, something I've been passionate about in various ways since I was young. ILR has the most amazing, tight-knit community and connected alumni network at a large school like Cornell!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"32924801-83ae-462c-b61a-2bd363af393b\"}":{"__typename":"DeepDives","uuid":"32924801-83ae-462c-b61a-2bd363af393b","content":"\u003cp\u003eMyself! My inner drive to learn, experience, and share things I love is what's fueled all of my ventures in life. When I couldn't find the drive myself, outside inspiration, like what my mentors sometimes provided, allowed me to accomplish things I never dreamed of.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"72d3fe52-5335-4573-b7ba-85c2d76bc42e\"}":{"__typename":"DeepDives","uuid":"72d3fe52-5335-4573-b7ba-85c2d76bc42e","content":"\u003cp\u003eI've always been ambitious and self-motivated to succeed in school, but it was almost impossible for me to get anything done without a schedule that I was accountable to. Weekly meetings with my mentor kept me on track to complete passion projects that had no firm deadline. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"d8324e62-5001-485a-9554-d2e3aaf1e514\"}":{"__typename":"Education","uuid":"d8324e62-5001-485a-9554-d2e3aaf1e514","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2018","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"868091a1-85dd-4923-8423-1d416e409f2b\"}":{"__typename":"Education","uuid":"868091a1-85dd-4923-8423-1d416e409f2b","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Industrial Labor Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"45ad11ee-0069-4b39-9555-55bae57b72eb\"}":{"__typename":"MentorPublicProfile","uuid":"45ad11ee-0069-4b39-9555-55bae57b72eb","displayName":"Laila L.","slug":"laila-larkin-1","biography":"\u003cp\u003eLaila is a first-year student studying the intersection of law, business, advocacy, and psychology at Cornell’s School of Industrial and Labor Relations. Drawn from an early age to reading and writing, public speaking, analysis, and evidence-based reasoning, she is pursuing a path toward a legal career. As a member of Cornell’s prestigious Mock Trial Association, Laila is developing her skills in litigation, witness examination, and strategic argumentation, deepening her understanding of how legal theory translates into persuasive advocacy.\u003c/p\u003e\u003cp\u003eHer academic interests are grounded in hands-on legal experience. Laila has interned with the New York State Supreme Court, where she gained exposure to courtroom procedure, judicial decision-making, and the mechanics of litigation. She also interned with Mobilization for Justice, working alongside public interest attorneys to support individuals facing housing insecurity and economic hardship. These experiences reinforced her belief in the law as a tool for access, accountability, and systemic change, and shaped her interest in advocacy that balances rigor with empathy.\u003c/p\u003e\u003cp\u003eOutside the classroom, dance and the performing arts have been a central throughline in Laila’s life. She trained for twelve years in Alvin Ailey American Dance Theater’s pre-professional program and continues dancing in college. She also has a longstanding love of musical theater, performing in her high school’s productions of \u003cem\u003eChicago\u003c/em\u003e and \u003cem\u003eMean Girls\u003c/em\u003e. Through performance, she developed discipline, collaboration, and the ability to tell compelling stories across mediums.\u003c/p\u003e\u003cp\u003eAs a Curious Cardinals student in high school, Laila worked closely with her mentor to develop Arts on Pointe, a nonprofit initiative providing free dance engagement programs sponsored by the Yonkers City Council. Having trained and taught techniques including Horton, West African, and Graham, she approaches dance as more than performance, but as pedagogy: a means of connection, discipline-building, and self-exploration.\u003c/p\u003e\u003cp\u003eLaila has consistently taken on leadership roles, serving as Co-President of her school’s Black Student Alliance, Mock Trial team, and Dance Team. She also co-led annual service-learning trips to New Orleans and Alabama and worked as a Peer Assistance mentor to incoming freshmen. She has always extended herself to younger students as a resource and source of encouragement. As a former Curious Cardinals student, Laila hopes to give back by fostering curiosity, shared exploration, and the transformative power of mentorship.\u003c/p\u003e","teachingVideoPlaybackId":"zz02c01lOLstpxr01RX6WY800Hk02ej01PQBN7IEpoOYQiJV4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7ad6171a-dd8b-447a-9791-9cd5d4b528fb\"}"}],"causesSupported":[],"major":"Industrial Labor Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3026cccd-fda1-44ac-a716-64cc654d3bfc\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d954d3f-3297-485f-9242-280a76db280a\"}"},{"__ref":"DeepDives:{\"uuid\":\"32924801-83ae-462c-b61a-2bd363af393b\"}"},{"__ref":"DeepDives:{\"uuid\":\"72d3fe52-5335-4573-b7ba-85c2d76bc42e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f0fee84c-cb65-44c1-80e1-9d694813f317/-/preview/-/format/jpg/","https://ucarecdn.com/c9259601-e7e3-4ede-a691-c2170195315b/-/preview/-/format/jpg/","https://ucarecdn.com/9925d5ba-9eab-4e04-a968-ed2d33ee599d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d8324e62-5001-485a-9554-d2e3aaf1e514\"}"},{"__ref":"Education:{\"uuid\":\"868091a1-85dd-4923-8423-1d416e409f2b\"}"}],"hiredAt":"2026-01-09T01:46:51.552Z","topics":["Creative Writing","History Project","Film / Theater","Business / Entrepreneurship","Law / Government / Policy","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"laila-larkin-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"45ad11ee-0069-4b39-9555-55bae57b72eb\"}"}}},"_sentryTraceData":"7f20bc2f089940a6abfd4f2b987a2e05-83be988ae4690434-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7f20bc2f089940a6abfd4f2b987a2e05,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"laila-larkin-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp"
