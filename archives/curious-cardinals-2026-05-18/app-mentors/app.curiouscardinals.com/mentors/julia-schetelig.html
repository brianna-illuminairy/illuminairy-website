xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6f71f44e-c9c6-4118-a8a6-bc673cf8703d\"}":{"__typename":"DeepDives","uuid":"6f71f44e-c9c6-4118-a8a6-bc673cf8703d","content":"\u003cp\u003eMy job at Curious Cardinals, of course ;) I love supporting mentors and students in their learning journeys!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"7e848684-7df6-4479-ba60-56455346ad34\"}":{"__typename":"School","uuid":"7e848684-7df6-4479-ba60-56455346ad34","name":"United World College of South East Asia","city":"Singapore","type":"HIGH","state":"Singapore","country":"Singapore","zip":"528704"},"Education:{\"uuid\":\"05e64a6d-4014-4af0-be14-910fccfc8059\"}":{"__typename":"Education","uuid":"05e64a6d-4014-4af0-be14-910fccfc8059","school":{"__ref":"School:{\"uuid\":\"7e848684-7df6-4479-ba60-56455346ad34\"}"},"startYear":"2016","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"37fbcfcf-5470-4deb-bbab-06f85c9f8cb7\"}":{"__typename":"School","uuid":"37fbcfcf-5470-4deb-bbab-06f85c9f8cb7","name":"Earlham College","city":"Richmond","type":"COLLEGE","state":"Indiana","country":"United States","zip":"47374"},"Education:{\"uuid\":\"8b63432c-3088-4599-9ede-8e06cf9d12f0\"}":{"__typename":"Education","uuid":"8b63432c-3088-4599-9ede-8e06cf9d12f0","school":{"__ref":"School:{\"uuid\":\"37fbcfcf-5470-4deb-bbab-06f85c9f8cb7\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2021","major":"Business / Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"33ad90df-8e59-4c8c-9acc-cc905f507e2e\"}":{"__typename":"MentorPublicProfile","uuid":"33ad90df-8e59-4c8c-9acc-cc905f507e2e","displayName":"Julia S.","slug":"julia-schetelig","biography":"\u003cp\u003eHi there! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m Julia. In my day-to-day life, I’m the \u003cstrong\u003eOperations Manager at Curious Cardinals\u003c/strong\u003e, where I build the systems, services, and products that help our students and mentors grow. My path here hasn’t been a straight line; it’s been a \"Swiss Army Knife\" journey shaped by living across three continents—born and raised in \u003cstrong\u003eEurope\u003c/strong\u003e, attending high school in \u003cstrong\u003eSingapore\u003c/strong\u003e, and going to college in the \u003cstrong\u003eUS\u003c/strong\u003e.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eMy own \"Passion Project\" Years\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eLong before I was managing operations, I was a student just like you, trying to turn my curiosities into something real. Before I turned 21, I jumped into a bit of everything:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWriting:\u003c/strong\u003e At 16, I wrote and self-published a fantasy novel (it’s still on Amazon in Germany!).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSocial Impact:\u003c/strong\u003e During the refugee crisis in Berlin, I spent my time volunteering on the ground. Later, I moved to Singapore and shot a short-film documentary about the lives of migrant workers.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLeadership:\u003c/strong\u003e I funded, organized, and facilitated youth leadership conferences in \u003cstrong\u003eThailand and Cambodia\u003c/strong\u003e—an experience that eventually led to me giving a \u003cstrong\u003eTEDxTalk\u003c/strong\u003e about the power of youth-led initiatives.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eThe \"Influencer\" Era:\u003c/strong\u003e When I founded \u003cstrong\u003eGeneration Impact\u003c/strong\u003e to support young changemakers, I even had a brief stint as a TikTok creator to help our resources reach over \u003cstrong\u003e5,000 users\u003c/strong\u003e.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eMy Professional Journey\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eThose early projects taught me that \"learning by doing\" is the only way to grow. I carried that energy into my professional life:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch:\u003c/strong\u003e I worked as a Research Assistant at the Peace \u0026amp; Conflict Neuroscience Lab at the \u003cstrong\u003eUniversity of Pennsylvania\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCorporate Strategy:\u003c/strong\u003e I designed a mental health program for \u003cstrong\u003e11,000 employees at KPMG Germany\u003c/strong\u003e.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStartups:\u003c/strong\u003e I spent 3.5 years at \u003cstrong\u003eGridware\u003c/strong\u003e, a climate-tech startup, helping them scale from a prototype to a \u003cstrong\u003e$26.4M Series A\u003c/strong\u003e (led by Sequoia), designing the pitch deck and building their first financial models before stepping into Product Management.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eMy Approach to Mentorship\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI am a \u003cstrong\u003eCertified Executive Coach through Brown University\u003c/strong\u003e, which deeply shapes how I lead at Curious Cardinals and how I mentor. I don't just want to help you finish a project; I want to help you develop the executive functioning and communication skills to lead it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI very rarely work with students directly (sadly) but my favorite projects to support are social impact projects that require students to learn a broad range of skills: marketing, product management, leadership... A bit of everything ;) \u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eBeyond the Resume\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eWhen I’m not at my desk in the SF Bay Area, I’m usually finding balance through:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBallroom Dancing:\u003c/strong\u003e I practice about three times a week—it’s the ultimate challenge for mind-body connection.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNon-fiction \u0026amp; Tea:\u003c/strong\u003e I’m a nerd for books on human behavior like \u003cem\u003eThe Culture Code\u003c/em\u003e. You’ll usually find me with a \u003cstrong\u003eMatcha or Boba\u003c/strong\u003e in hand.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHuman Stories:\u003c/strong\u003e I love story-driven insights from podcasts like \u003cem\u003eInvisibilia\u003c/em\u003e or \u003cem\u003eHidden Brain\u003c/em\u003e.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"Lwh5oI00YbH01lzcdKvlA01tiKeTbtLKnTLscKufEssFlI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business / Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6f71f44e-c9c6-4118-a8a6-bc673cf8703d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/75c15b13-1619-483b-9d3e-4765cab1b8b6/-/preview/-/format/jpg/","https://ucarecdn.com/670a0633-81e4-43b1-b712-bb2bebdeeae7/-/preview/-/format/jpg/","https://ucarecdn.com/440e3fd9-2ed7-4d85-9ecf-a2f77a4cb199/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"05e64a6d-4014-4af0-be14-910fccfc8059\"}"},{"__ref":"Education:{\"uuid\":\"8b63432c-3088-4599-9ede-8e06cf9d12f0\"}"}],"hiredAt":"2025-07-08T16:08:46.375Z","topics":["Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"julia-schetelig\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"33ad90df-8e59-4c8c-9acc-cc905f507e2e\"}"}}},"_sentryTraceData":"bf300c8278b24bc5b630889bdab1b6ce-95d2565de206eebd-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=bf300c8278b24bc5b630889bdab1b6ce,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"julia-schetelig"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
