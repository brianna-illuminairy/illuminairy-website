xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"392caae5-3281-4d99-ab9f-76eea5ae45c9\"}":{"__typename":"Favorites","uuid":"392caae5-3281-4d99-ab9f-76eea5ae45c9","photoUrl":"https://ucarecdn.com/e8641d0e-9da2-49c9-bf46-e87d18456507/","title":"Interstellar","type":"MOVIE"},"Favorites:{\"uuid\":\"75d226a4-ee97-4535-a4ec-d6b3241bf7be\"}":{"__typename":"Favorites","uuid":"75d226a4-ee97-4535-a4ec-d6b3241bf7be","photoUrl":"https://ucarecdn.com/28a1af8b-30f3-41e1-9e16-6db5d10b913e/","title":"Good Kid, Maad City","type":"ALBUM"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"63161666-8f56-49c8-81c0-52f25c617e2e\"}":{"__typename":"DeepDives","uuid":"63161666-8f56-49c8-81c0-52f25c617e2e","content":"\u003cp\u003eMy dream job is to work on SpaceX's starship program to help get humans to the Moon and Mars. Ever since I went to Space Camp as a kid, I've been fascinated with our universe and efforts to explore and understand it. I would love to one day use my own skills in engineering to develop the space travel technology of tomorrow!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"59cac6a8-1fd6-46f0-a56c-fda89ac02d78\"}":{"__typename":"DeepDives","uuid":"59cac6a8-1fd6-46f0-a56c-fda89ac02d78","content":"\u003cp\u003eDuring the fall semester of my sophomore year at Duke, I joined a small team to construct a remote-controlled flying kayak! We were tasked with developing a hydrofoil design that could provide enough lift to levitate a small kayak above the water. I was able to leverage my skills in 3D printing and RC electronics to design the prototype from the ground up. It was a great learning experience as well for myself and my team, where we had a faculty advisor to refer to and ask questions about hydrodynamics and any necessary materials. At the end of the semester we tested the final design at a nearby lake, which was largely a success!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"4e5e5efb-abad-4a0e-b553-7d4bdff97e3a\"}":{"__typename":"School","uuid":"4e5e5efb-abad-4a0e-b553-7d4bdff97e3a","name":"St. Mary's Ryken High School","city":"Leonardtown","type":"HIGH","state":"Maryland","country":"United States","zip":"20650"},"Education:{\"uuid\":\"b7d2992c-d546-4f8b-8cbf-1dc89225939e\"}":{"__typename":"Education","uuid":"b7d2992c-d546-4f8b-8cbf-1dc89225939e","school":{"__ref":"School:{\"uuid\":\"4e5e5efb-abad-4a0e-b553-7d4bdff97e3a\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"4bdea174-acd6-45cd-90c8-55a653d848ef\"}":{"__typename":"Education","uuid":"4bdea174-acd6-45cd-90c8-55a653d848ef","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"6515d806-1707-4d20-a5e3-e829f1fc9a3a\"}":{"__typename":"MentorPublicProfile","uuid":"6515d806-1707-4d20-a5e3-e829f1fc9a3a","displayName":"Zachary M.","slug":"zachary-maldonado","biography":"\u003cp\u003eAs an engineering student at Duke, I love to learn and solve problems. I find the most fulfilment in applying my skills and the knowledge I gain in the classroom to team projects in the field of aerospace and mechanical engineering. I am also passionate about anything space-related, and I enjoy drawing in my free time! Outside of the classroom I spend time building robots to fight in competitions for the Duke Combat Robotics Team, or helping Duke Aero construct our yearly high-altitude rocket. These activities have also helped me develop or strengthen my hands-on skills in areas like 3D printing and machining. I also love to pass down my own experiences and advice to others. Having run track and swam for my high school, I’ve spent two seasons as head coach of a summer league swim team where I enjoy training young swimmers for competitions throughout the summer.\u0026nbsp;\u003c/p\u003e\u003cp\u003eFormative experiences in middle and especially high school were why engineering caught my eye. In high school I conducted research with the nearby Pax River Naval Air Station, where I was connected with an engineer working on naval aircraft. My high school also offered unique project-centered engineering classes, and between these two experiences I discovered my passion for aerospace engineering and rocketry. I am a firm believer in the importance of fostering these kinds of experiences–and the critical thinking that comes with them–before college, which is why I mentor for Curious Cardinals.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"oP5DsDTRlftzGSg84qDxlJE9jLAWvXax3s3VIPgwaY4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"392caae5-3281-4d99-ab9f-76eea5ae45c9\"}"},{"__ref":"Favorites:{\"uuid\":\"75d226a4-ee97-4535-a4ec-d6b3241bf7be\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepD
