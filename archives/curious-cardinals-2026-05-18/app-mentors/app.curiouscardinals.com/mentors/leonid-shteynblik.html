xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5312588f-6213-466e-b52d-8ad4c5d2a67e\"}":{"__typename":"Favorites","uuid":"5312588f-6213-466e-b52d-8ad4c5d2a67e","photoUrl":"https://ucarecdn.com/d3d8ff7b-3870-4eb5-8791-ea1ee7dae613/","title":"Sacha Baron Cohen","type":"ACTOR"},"Favorites:{\"uuid\":\"00850fb6-9dea-4b73-b11a-e856c2d82fde\"}":{"__typename":"Favorites","uuid":"00850fb6-9dea-4b73-b11a-e856c2d82fde","photoUrl":"https://ucarecdn.com/b2a6fd81-bb8f-4fef-9b60-03e7b9c5eb76/","title":"Cinema Paradiso","type":"MOVIE"},"Favorites:{\"uuid\":\"4aedd974-3077-41d7-8713-8fe9ca213a94\"}":{"__typename":"Favorites","uuid":"4aedd974-3077-41d7-8713-8fe9ca213a94","photoUrl":"https://ucarecdn.com/599b98eb-9b2c-40ef-906a-aa19f91d8f52/","title":"Sade","type":"ARTIST"},"CausesSupported:{\"uuid\":\"746b5b1d-d428-4b1f-8189-6f949d0a0570\"}":{"__typename":"CausesSupported","uuid":"746b5b1d-d428-4b1f-8189-6f949d0a0570","name":"Engineers Without Borders","description":"\u003cp\u003eI help lead fundraising for our water access project in the mountains of Bolivia\u003c/p\u003e","photoUrl":"https://ucarecdn.com/550332af-98c6-4210-ae0d-c3f5714fd2c1/"},"CausesSupported:{\"uuid\":\"042894d5-1b22-4852-8d23-27132386d5cb\"}":{"__typename":"CausesSupported","uuid":"042894d5-1b22-4852-8d23-27132386d5cb","name":"Art for All Students Puerto Rico","description":"\u003cp\u003eWe give high-quality art materials to underfunded public schools in Puerto Rico\u003c/p\u003e","photoUrl":"https://ucarecdn.com/250e8aee-f679-4b9c-98f6-8b4a3792cbef/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"553d9e45-38f3-4190-aaeb-c7915ae19fcd\"}":{"__typename":"DeepDives","uuid":"553d9e45-38f3-4190-aaeb-c7915ae19fcd","content":"\u003cp\u003eMentorship has been huge for me. I’ve always reached out to older friends, family, and peers for advice, and it’s saved me a ton of headaches. I’ve had real estate mentors in Atlanta guide me through my first deals, older students at Tech help me navigate classes and clubs, and my cousins lead me through everything from coding to manners. I’ve come to realize that having people around who have already walked the path makes the whole process a lot less intimidating. To me, mentorship is great because it’s just a way to get real-world info from someone who’s already been there, and I love building and growing those connections.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"f41157f1-5fbd-4d05-a9cb-31d9de7b968d\"}":{"__typename":"DeepDives","uuid":"f41157f1-5fbd-4d05-a9cb-31d9de7b968d","content":"\u003cp\u003eThe goal is to eventually live a life that’s more self-sufficient and centered around my people. I love to cook, so one of my dreams is to have a farm where I can grow my own ingredients and raise livestock, a peaceful spot where friends and family can always come through. I want to have a big family and keep growing my circle of friends so there’s always a reason to celebrate and good company to share it with.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"d0306919-b36b-4139-9c75-8d975b25ee69\"}":{"__typename":"DeepDives","uuid":"d0306919-b36b-4139-9c75-8d975b25ee69","content":"\u003cp\u003eI’ve split my life between the fast pace of the NYC area and the more laid-back energy of Puerto Rico, all while being raised by Russian immigrant parents. That mix gave me a pretty unique perspective on how to help people learn. I carry the high standards and work ethic my parents drilled into me, but I balance it with the calmness I picked up in PR. Instead of being pushy or stressing a student out, I focus on teaching through patterns and setting clear, feasable expectations. I lead by example, keep things polite, and stay supportive so students feel comfortable pushing their boundries and asking questions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1bddbfbc-0c31-4153-917b-df19e136ec59\"}":{"__typename":"DeepDives","uuid":"1bddbfbc-0c31-4153-917b-df19e136ec59","content":"\u003cp\u003eWhen I first applied to college, I had a hard time narrowing down my interests, so I actually applied to different schools with different majors, leaving my major up to fate. I got into Tech for Mechanical Engineering but switched to Civil before my first semester to get closer to the built environment. I’m also doing a concentration in Robotics and Automation to keep that mechanical side alive. After working in construction last winter and getting into real estate investing, I realized Civil is a hidden gem that people usually overlook. It gives me a solid engineering mindset and the creative freedom of a designer, all while staying connected to the business and real estate world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"c534d659-d1eb-4e15-adb7-f4fd29f26a0b\"}":{"__typename":"School","uuid":"c534d659-d1eb-4e15-adb7-f4fd29f26a0b","name":"Saint John's School","city":"San Juan","type":"HIGH","state":"San Juan","country":"Puerto Rico","zip":"00907"},"Education:{\"uuid\":\"1e84673c-6e76-4a61-b755-934b7b054285\"}":{"__typename":"Education","uuid":"1e84673c-6e76-4a61-b755-934b7b054285","school":{"__ref":"School:{\"uuid\":\"c534d659-d1eb-4e15-adb7-f4fd29f26a0b\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"449c0dbb-3985-4879-9e3b-20e74d02e67a\"}":{"__typename":"Education","uuid":"449c0dbb-3985-4879-9e3b-20e74d02e67a","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Civil and Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"9bd05c1a-bc8f-4ccb-a10a-04552d6ee840\"}":{"__typename":"MentorPublicProfile","uuid":"9bd05c1a-bc8f-4ccb-a10a-04552d6ee840","displayName":"Leonid S.","slug":"leonid-shteynblik","biography":"\u003cp\u003eHi! I’m Lenny, a first-year student at Georgia Tech studying Civil and Mechanical Engineering. I’m here to help students who don’t want to choose between being an engineer, an artist, or an entrepreneur, because you can definitely be all three.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve always been a builder. It started with a fascination for Brazilian architect Marcio Kogan’s houses (Google him up!) and grew into an obsession with how robotics and automation can change the spaces we live in. My path hasn't been a straight line, and I love that.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn past year I've:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilt a mid-six-figure investment fund\u003c/strong\u003e from scratch, investing in everything from stocks to affordable housing (I'm currently in the process of buying my first house!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLaunched two startups with my roommate.\u003c/strong\u003e One turned into a social media page with over a million interactions; the other is a robotics venture we’re currently prototyping.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTravelled (some of) the world:\u003c/strong\u003e I spent a semester abroad in 2025 and hit 20 countries in a single year.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI’m a big believer that your academic and creative interests are actually the same thing; they’re both just different ways of solving a puzzle.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love working with students who have \"too many\" interests and want to turn them into one big, cool project.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWe can work on:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStarting your Founder journey:\u003c/strong\u003e Got a business idea? Let’s build the pitch, the business model, and the actual product.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eInvesting 101:\u003c/strong\u003e Learning how to build a thesis, pick a stock, or understand how real estate actually works (it’s simpler than it looks!).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEngineering \u0026amp; Robotics:\u003c/strong\u003e Moving from \"cool idea\" to a physical prototype or a product design you can show off.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eA Juggler's Life:\u003c/strong\u003e How to balance things like high-level music (15+ years of playing Piano and Drums) or sports (I swam 3+ hours/day in high school) with an intense academic load without losing your mind.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eMy mentorship style\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI don’t find lecturing very efficient—I’m a firm believer that the best way to learn is by doing. Having been a student, a treasurer, a VP, a tutor, and a founder, I know that the hardest part of any big project is just knowing where to start. I’m here to help you take those big, intimidating goals and break them down into small, weekly wins so you can actually see your progress in real-time.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eMy interests\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI \u003cstrong\u003elove\u003c/strong\u003e the outdoors, and am big into skiing, hiking, and watersports. I'm also a huge foodie and love to cook and try to eat at a new resturant every week. When I’m back in Puerto Rico, you’ll usually find me making coffee with my dad or checking on the passionfruit plants I’ve been growing in my garden. Otherwise, I’m probably in my truck with my dogs and my friends, windows down and blasting the Dire Straits while we drive through the mountains.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhether you have a bajillion different interests or know exactly what you want, I can't wait to help you reach your goals!!!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"01pVRQcDSGU01PFXdQBxj27IPnfmz5kfAMdoj5aGIewHw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eHaving the longest living fish of all my friends.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5312588f-6213-466e-b52d-8ad4c5d2a67e\"}"},{"__ref":"Favorites:{\"uuid\":\"00850fb6-9dea-4b73-b11a-e856c2d82fde\"}"},{"__ref":"Favorites:{\"uuid\":\"4aedd974-3077-41d7-8713-8fe9ca213a94\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"746b5b1d-d428-4b1f-8189-6f949d0a0570\"}"},{"__ref":"CausesSupported:{\"uuid\":\"042894d5-1b22-4852-8d23-27132386d5cb\"}"}],"major":"Civil and Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"553d9e45-38f3-4190-aaeb-c7915ae19fcd\"}"},{"__ref":"DeepDives:{\"uuid\":\"f41157f1-5fbd-4d05-a9cb-31d9de7b968d\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0306919-b36b-4139-9c75-8d975b25ee69\"}"},{"__ref":"DeepDives:{\"uuid\":\"1bddbfbc-0c31-4153-917b-df19e136ec59\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4e9dc2a6-dbef-4f1b-afb1-0aa3d96e75d0/-/preview/-/format/jpg/","https://ucarecdn.com/d3c5eb06-0b92-4332-86dd-1847fd6a904b/-/preview/-/format/jpg/","https://ucarecdn.com/e2e3af9b-345a-4e01-8d13-7e2c80e3ed52/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1e84673c-6e76-4a61-b755-934b7b054285\"}"},{"__ref":"Education:{\"uuid\":\"449c0dbb-3985-4879-9e3b-20e74d02e67a\"}"}],"hiredAt":"2026-02-24T00:08:55.242Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","Writing","Spanish","French","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Computer Science","Music","Sports Journalism","Creative
