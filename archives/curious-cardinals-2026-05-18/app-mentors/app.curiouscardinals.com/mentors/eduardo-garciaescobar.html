xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2d72eac0-a181-4db4-a629-23e709a7c7de\"}":{"__typename":"Favorites","uuid":"2d72eac0-a181-4db4-a629-23e709a7c7de","photoUrl":"https://ucarecdn.com/ad5cea7b-aa93-474d-9772-6a7cf15454ca/","title":"Hong Kong SAR","type":"CITY"},"Favorites:{\"uuid\":\"04e01bf1-5125-46da-96a4-c5b1899c8a7d\"}":{"__typename":"Favorites","uuid":"04e01bf1-5125-46da-96a4-c5b1899c8a7d","photoUrl":"https://ucarecdn.com/dd4e16a7-2502-4b85-9225-f5bd80f954a5/","title":"Smite","type":"GAME"},"Favorites:{\"uuid\":\"86f1ec9c-5dfe-4c8c-8e7b-b4f22b2d6f53\"}":{"__typename":"Favorites","uuid":"86f1ec9c-5dfe-4c8c-8e7b-b4f22b2d6f53","photoUrl":"https://ucarecdn.com/f1850ce3-67bc-4711-a983-17f6d7b02fa8/","title":"The Infernal Devices","type":"BOOK"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"57ce9ef9-fdf8-4c1f-a734-b082757a7c4b\"}":{"__typename":"DeepDives","uuid":"57ce9ef9-fdf8-4c1f-a734-b082757a7c4b","content":"\u003cp\u003eI dedicate my spare time to two main passions: culinary experimentation and physical fitness. I enjoy finding unique ways to modify classic recipes, focusing on maintaining or enhancing the core flavor profile while making them my own. Similarly, I'm always challenging myself to develop new, progressive workout routines. You'll usually find me either in the kitchen or at the gym.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"645e8d01-f044-466f-a151-a2d6a42b75f7\"}":{"__typename":"DeepDives","uuid":"645e8d01-f044-466f-a151-a2d6a42b75f7","content":"\u003cp\u003eTo my middle school self: I would advise myself to take it easy and relax the pressure. I spent too much time feeling I needed to have every aspect of my future figured out. I wish I had understood that it is perfectly okay to be uncertain and to simply enjoy the present. To my high school self: I would encourage more exploration and unconventional thinking. I wish I had looked beyond the traditional structures and learned more about the world outside of the standard curriculum. That foundational curiosity would have served me well earlier on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"934093c1-2043-4b01-84d1-07964d081898\"}":{"__typename":"DeepDives","uuid":"934093c1-2043-4b01-84d1-07964d081898","content":"\u003cp\u003eMentorship matters profoundly to me because I have been fortunate enough to benefit from incredible guides who helped me sharpen my skills and advance my career. The most important lesson I learned from them is that success requires a village. I am passionate about paying that forward, helping others build their own strong support system, and creating opportunities for mutual growth that positively impact their lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"823151cf-a8c0-4262-ad42-269c91e6b95e\"}":{"__typename":"DeepDives","uuid":"823151cf-a8c0-4262-ad42-269c91e6b95e","content":"\u003cp\u003eMy motivation stems from a powerful combination of two factors. First is my commitment to paying it forward. I am driven to achieve my goals so that I can provide for and give back to the family and friends who supported me along the way. Second is an insatiable desire for continuous learning and growth. These two elements reinforce each other: as I learn and grow, I can better share that knowledge and success with my communities, ensuring we all move forward together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"c35cbf91-519e-4cbe-8311-567201e1917f\"}":{"__typename":"School","uuid":"c35cbf91-519e-4cbe-8311-567201e1917f","name":"DSST: Green Valley Ranch High School","city":"Denver","type":"HIGH","state":"Colorado","country":"United States","zip":"80249"},"Education:{\"uuid\":\"d5f0add0-119c-40d3-b761-edc550e3a25d\"}":{"__typename":"Education","uuid":"d5f0add0-119c-40d3-b761-edc550e3a25d","school":{"__ref":"School:{\"uuid\":\"c35cbf91-519e-4cbe-8311-567201e1917f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"9b8eba94-a3d3-4cc4-930d-fc0a6fafb3dc\"}":{"__typename":"Education","uuid":"9b8eba94-a3d3-4cc4-930d-fc0a6fafb3dc","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"25e31ab2-9bbb-4355-bdf8-10f37ff1eb51\"}":{"__typename":"MentorPublicProfile","uuid":"25e31ab2-9bbb-4355-bdf8-10f37ff1eb51","displayName":"Eduardo G.","slug":"eduardo-garciaescobar","biography":"\u003cp\u003e\u003cem\u003e\"Happiness is not a matter of intensity but of balance, order, rhythm, and harmony.\"\u003c/em\u003e\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic and professional journey is defined by the intentional pursuit of balance. I care deeply about achieving holistic success, combining the technical rigor required for deep analysis with the empathetic leadership needed for true collaboration and impact. My background proves that intense focus across multiple domains can lead to a richer, more powerful trajectory.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy foundational knowledge stems from a robust academic trajectory rooted in systems thinking. My Bachelor’s degree in Data Science equipped me with the skills to model, interpret, and leverage complex datasets using statistical inference and programming. This deep dive into quantitative analysis laid the groundwork for my subsequent Master’s in Management Science and Engineering (MS\u0026amp;E). The MS\u0026amp;E program provided the strategic framework, shifting the focus to optimization, decision analysis, and organizational strategy. This unique educational pairing allows me to seamlessly transition from thinking critically as a scientist to operating effectively as a leader, bridging the gap between technical execution and high-level strategic implementation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis analytical rigor was immediately applied and tested in the real world. My professional history is a testament to my capacity for resilience, notably through a period where I simultaneously managed four different jobs, alongside demanding academic work and research. This hustle instilled a superior work ethic and mastery of time management, skills that proved invaluable in my leadership roles. For instance, as a Resident Assistant (RA) and an active member of ethnic organizations, I fostered crucial emotional intelligence, mentorship, and advocacy skills, ensuring my technical knowledge was always grounded in human-centered service.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFurthermore, my roles in public service and as a tour guide polished my ability to communicate complex ideas, while my experiences in pre-business clubs successfully synthesized academic excellence with professional preparedness. This diverse range of professional and extracurricular commitment, including significant academic research, demonstrates a strong dedication to balancing deep technical work with visible community impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe experience of studying abroad was central to developing my adaptability and cross-cultural communication skills, reinforcing my belief in the power of going together to achieve long-term goals. I mentor students because I understand the challenge of building a cohesive path from such varied interests. I specialize in showing students how to achieve their own equilibrium, how to manage intense academic loads, pursue diverse extracurriculars, and turn their ambition into tangible results. I offer guidance on time management, strategic course selection, and integrating technical skills with leadership roles, empowering them to forge a powerful and harmonious path forward.\u003c/p\u003e","teachingVideoPlaybackId":"5ab6KUN00pxnOrb7q51exR01AU7I4Qpnxg4BSpLqzyZPg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2d72eac0-a181-4db4-a629-23e709a7c7de\"}"},{"__ref":"Favorites:{\"uuid\":\"04e01bf1-5125-46da-96a4-c5b1899c8a7d\"}"},{"__ref":"Favorites:{\"uuid\":\"86f1ec9c-5dfe-4c8c-8e7b-b4f22b2d6f53\"}"}],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"57ce9ef9-fdf8-4c1f-a734-b082757a7c4b\"}"},{"__ref":"DeepDives:{\"uuid\":\"645e8d01-f044-466f-a151-a2d6a42b75f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"934093c1-2043-4b01-8
