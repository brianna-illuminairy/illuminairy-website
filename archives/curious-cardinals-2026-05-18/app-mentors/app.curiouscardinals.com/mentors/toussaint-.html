21","endYear":null,"expectedGradYear":"2025","major":"neuroscience \u0026 music","degree":null},"MentorPublicProfile:{\"uuid\":\"3596ebd6-be3c-424f-a109-b87cb6c95f67\"}":{"__typename":"MentorPublicProfile","uuid":"3596ebd6-be3c-424f-a109-b87cb6c95f67","displayName":"Toussaint M.","slug":"toussaint-","biography":"\u003cp\u003eHi my name is Toussaint, and I am so excited to meet you! I am currently a senior at Harvard University studying neuroscience and music on the pre-med track. As a performer-composer, science researcher and curator, my work explores the intersection of art and medicine as a means of bridging the gap between scientific inquiry and representational justice.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a musician of both jazz and new music traditions, I have had the privilege of studying under and playing with musical revolutionaries including Claire Chase, Vijay Iyer, esperanza spalding, and Yosvany Terry among. In 2023, I was commissioned by the Harvard Office for the Arts to compose and perform \u003cem\u003eAll Sing for the Arts Prelude\u003c/em\u003e for President Claudine Gay’s inauguration. Since 2021, I’ve performed with the Harvard Jazz Orchestra and been a featured artist at the Harvard ArtsFIRST festival.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eRecently, I’ve expanded my work to include curation. I was commissioned by The Cleveland Orchestra to curate \u003cem\u003eThe Magic Lens: A Photographic Journey by Chuck Stewart\u003c/em\u003e for the 2024 Mandel Opera and Humanities Festival. This exhibit celebrates Chuck Stewart, one of America’s most prolific Black photographers, and  serves as a powerful example of the way in which art can be used as a means for justice through the honoring and empowering of its subjects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I am passionate about uplifting Black creativity. In 2022, I co-founded the Black Arts Collective - Harvard’s premier Black interdisciplinary arts space. Since its founding, we’ve organized over 50 community events and gained nearly 800 members and supporters, including collaborations with the Hutchins Center for African \u0026amp; African American Research and the Harvard Art Lab.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my artistic work, I have co-authored two research papers on the effects of music on cognitive function, and I am currently collaborating on a forthcoming oncological neuroscience paper at Dana Farber Cancer Research Institute. \u003c/p\u003e","teachingVideoPlaybackId":"hHobaTq3IeSpusKxexk1XpJT01pqIT8cStjc01dZthGzE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b242292f-7427-4698-b42d-64ef3c5ca63b\"}"},{"__ref":"Favorites:{\"uuid\":\"6e0e941f-ca33-4ad0-8e79-3612c6ab16e3\"}"},{"__ref":"Favorites:{\"uuid\":\"0bf7660a-c222-4fa4-9360-2667031c1033\"}"}],"causesSupported":[],"major":"neuroscience \u0026 music","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8c3aea5b-9e00-4b8d-84d6-3f276a598306\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd91347b-fe28-4598-b993-17aad0f71bae\"}"},{"__ref":"DeepDives:{\"uuid\":\"7f820f38-d77c-4814-8a42-2d5635963647\"}"},{"__ref":"DeepDives:{\"uuid\":\"4e95c442-65df-4a35-a12b-8a869be81a4f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7dd41a14-af94-4474-93a2-14f2ac6c8e86/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4f78d911-a2b0-4bbe-8443-b9da315d83f6\"}"},{"__ref":"Education:{\"uuid\":\"ffae0ea2-b218-41ba-9c92-40738bb89ae3\"}"}],"hiredAt":"2024-09-26T13:13:28.494Z","topics":["Physics","Chemistry","Biology","K-5 Grade Math","Geometry","Algebra II","Algebra I","Precalculus / Trigonometry","Pre-Algebra","Executive Function","Academic Coaching","Writing","French","Public Speaking","Race \u0026 Ethnicity","Music","History Project","STEM Project","6-8 Grade Science"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cd
