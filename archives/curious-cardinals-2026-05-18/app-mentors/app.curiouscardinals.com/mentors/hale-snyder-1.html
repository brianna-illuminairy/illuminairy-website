xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b95476c1-0753-49d8-92b1-d0e9fccc3efa\"}":{"__typename":"Favorites","uuid":"b95476c1-0753-49d8-92b1-d0e9fccc3efa","photoUrl":"https://ucarecdn.com/a362195e-848c-417b-9af1-24b4c6ed291b/","title":"Matt Damon","type":"ACTOR"},"Favorites:{\"uuid\":\"c54b2c89-b066-4d3f-887f-2f34043250d4\"}":{"__typename":"Favorites","uuid":"c54b2c89-b066-4d3f-887f-2f34043250d4","photoUrl":"https://ucarecdn.com/f9556b06-640b-48c7-83e1-d7466ea1622e/","title":"Words of Radiance","type":"BOOK"},"Favorites:{\"uuid\":\"1a3146bc-e6b4-40e9-b16d-7d42c08899ae\"}":{"__typename":"Favorites","uuid":"1a3146bc-e6b4-40e9-b16d-7d42c08899ae","photoUrl":"https://ucarecdn.com/50a09d2d-36ca-4c55-addc-f6090e081214/","title":"Christian Mccaffrey","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"fc8fd652-71e9-41ad-b938-3924a568cd6f\"}":{"__typename":"CausesSupported","uuid":"fc8fd652-71e9-41ad-b938-3924a568cd6f","name":"Duke Shave and Buzz","description":"\u003cp\u003ePresident of philanthropy raising $285,000 annually for AYA cancer patients\u003c/p\u003e","photoUrl":"https://ucarecdn.com/68b48cd3-a86d-43f2-a998-d52831f4adba/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"494b55e7-168f-43a7-8970-650763c7cae9\"}":{"__typename":"DeepDives","uuid":"494b55e7-168f-43a7-8970-650763c7cae9","content":"\u003cp\u003eMy dream job is working in climate-tech venture capital. To me, investing in climate solutions is both incredibly difficult and incredibly rewarding. It's a career that requires you to wear many different hats and understand the ins and outs of climate policy, economics, and technology all at once — which is exactly what draws me to it.\u003c/p\u003e\u003cp\u003eWhat makes climate-tech VC uniquely hard is that you're not just betting on whether a company can grow; you're betting on whether a technology can scale fast enough to matter, whether the policy environment will support it, and whether the economics will work in markets that often weren't built for clean alternatives. Getting any one of those right is difficult. Getting all three right is what separates the investors who actually move the needle from the ones who don't, and that's the bar I want to hold myself to.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a25585b5-1f9b-49d0-b6f6-c46b32893d21\"}":{"__typename":"DeepDives","uuid":"a25585b5-1f9b-49d0-b6f6-c46b32893d21","content":"\u003cp\u003eIn my spare time, I love anything related to sports, the outdoors, or science fiction. I played football and rowed in high school, and now I lift weights, run, and play lots of pickleball and golf. I also love watching movies and reading. Some of my favorite movies are Good Will Hunting, Interstellar, and The Departed, and my favorite book series ever is The Red Rising Series. I'm also an avid player of all of the New York Times' games, especially the crosswords. With my friends, I love playing poker, setting up a spikeball net in the Duke gardens, or tenting out to get tickets for Duke basketball games. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"bf7bce9f-3aaa-4fd8-9131-915be9e06279\"}":{"__typename":"DeepDives","uuid":"bf7bce9f-3aaa-4fd8-9131-915be9e06279","content":"\u003cp\u003eIn high school, I designed a research proposal to study sustainable urban planning in Stockholm and Oslo, focused on how those cities had achieved their levels of sustainability. I was awarded a $7,000 grant to travel to both cities and meet with politicians, civilians, and business owners about how they thought about the problem. The project involved figuring out the right list of people to talk to, cold-emailing to set up the meetings, and then synthesizing everything we learned into actionable insights, which we ended up presenting to an audience of over 350 people.\u003c/p\u003e\u003cp\u003eIt was the first time I'd ever done something like that — building a research project from scratch, running it in a foreign country, and presenting the findings — and it's a big part of what got me hooked on climate and the energy transition in the first place.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4b2d11c6-f832-42af-81ce-57dccbbcfbd5\"}":{"__typename":"DeepDives","uuid":"4b2d11c6-f832-42af-81ce-57dccbbcfbd5","content":"\u003cp\u003eMentorship matters to me because of how helpful it's been in my own life. Whether it's been my parents, my older sister, or older students at school, I've had a number of people who've shaped who I am today, both personally and professionally. They've taught me how to work hard, how to manage stress when things pile up, and ultimately how to think about what actually matters to me — instead of just chasing whatever the next obvious goal happens to be.\u003c/p\u003e\u003cp\u003eThe thing I've come to appreciate most about good mentors is that they don't just give you answers. They ask the right questions, share the mistakes they made at your age, and trust you to figure out what to do with the advice. I've had people in my life who I know I can text with a half-formed question and get something useful back, and that kind of reliable sounding board is genuinely rare and valuable.\u003c/p\u003e\u003cp\u003eThat's the kind of mentor I want to be for someone else. I don't think I have everything figured out — I'm still pretty early in my own journey — but I'm close enough in age to remember what high school actually feels like, and far enough along to have learned a few things worth passing on. Helping a student think through a tough class, a college decision, or a project they're trying to get off the ground is exactly the kind of thing I'd have wanted at their age, and I want to make sure they get it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"ed67b94f-d2d9-4bb7-b912-c666964809de\"}":{"__typename":"School","uuid":"ed67b94f-d2d9-4bb7-b912-c666964809de","name":"St. Albans School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20016"},"Education:{\"uuid\":\"4cab8e3a-4f7d-4bbe-857a-c8ccfcc36cfd\"}":{"__typename":"Education","uuid":"4cab8e3a-4f7d-4bbe-857a-c8ccfcc36cfd","school":{"__ref":"School:{\"uuid\":\"ed67b94f-d2d9-4bb7-b912-c666964809de\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"f168dd33-5dc3-4093-a294-f9bfac6ee4f0\"}":{"__typename":"Education","uuid":"f168dd33-5dc3-4093-a294-f9bfac6ee4f0","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics, Energy, and the Environment","degree":null},"MentorPublicProfile:{\"uuid\":\"eb3fa148-91a6-4d03-a125-23135d9d1b6d\"}":{"__typename":"MentorPublicProfile","uuid":"eb3fa148-91a6-4d03-a125-23135d9d1b6d","displayName":"Hale S.","slug":"hale-snyder-1","biography":"\u003cp\u003eI'm Hale, a Duke sophomore studying economics, energy, and the environment, originally from Washington, DC, where I attended St. Albans School. The thread running through most of what I do is a fascination with climate change — specifically, the question of how capital gets directed toward solving it. That interest started in high school through a research fellowship on sustainable urban planning in Stockholm and Oslo, and it has only sharpened since I got to Duke. I came in thinking I'd study climate policy, but I've ended up drawn instead to the intersection of climate and finance — figuring out how investment, not just regulation, can shift the trajectory of the energy transition.\u003c/p\u003e\u003cp\u003eThat same curiosity shapes how I learn and how I like to teach. I try to approach problems by asking why something works the way it does before getting into the mechanics, and I think the best learning happens when a student can connect what's on the page to something they actually care about in the world. I try to make that bridge explicit rather than leaving it for the student to find on their own.\u003c/p\u003e\u003cp\u003eAt Duke, I'm involved in three clubs that reflect different sides of this interest: the Duke Investment Club, a student-run investment fund; the Duke Impact Investing Group, the largest student-run impact fund in the country; and the Duke Energy and Climate Club, which pairs students with energy industry leaders on research projects. Last summer, I interned at Competitive Power Ventures, an owner of solar, wind, and natural gas assets, where I worked deep in the weeds of power markets and electricity generation. This summer, I'll be at Clearview Energy Partners, a small energy policy research firm advising financial institutions and corporates. Next summer, I'll be joining Centerview Partners as an investment banking summer analyst in their NYC office.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of all that, I lift most days of the week, play a lot of pickleball, and try to get outside whenever I can. I'm a huge sports fan — pro and college baseball, football, and basketball — and I read and watch a lot of science fiction.\u003c/p\u003e","teachingVideoPlaybackId":"Pm00zfGkbiZ00HpkjL1JvxH00QmbIp8UUotRaYE014awVMY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement is helping set a new fundraising record for Duke Shave and Buzz this year as part of the leadership team. We raised over $285,000 for teens and young adults battling cancer at Duke Hospital. The charity is a special one — a weeklong event on campus that culminates in over 100 students shaving their heads in solidarity with cancer patients. Planning it, securing sponsorships, and generating publicity took months of work that ultimately paid off.\u003c/p\u003e\u003cp\u003eThe most fun part, though, was my personal fundraising. I knew I had to go all out to lead by example, so I took on a bunch of challenges to drive donations — dyeing my hair purple, running an untrained marathon, and a few others I'd rather forget. It's the kind of thing that sounds ridiculous on paper, but it's also one of the most rewarding things I've done in college.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b95476c1-0753-49d8-92b1-d0e9fccc3efa\"}"},{"__ref":"Favorites:{\"uuid\":\"c54b2c89-b066-4d3f-887f-2f34043250d4\"}"},{"__ref":"Favorites:{\"uuid\":\"1a3146bc-e6b4-40e9-b16d-7d42c08899ae\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"fc8fd652-71e9-41ad-b938-3924a568cd6f\"}"}],"major":"Economics, Energy, and the Environment","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"494b55e7-168f-43a7-8970-650763c7cae9\"}"},{"__ref":"DeepDives:{\"uuid\":\"a25585b5-1f9b-49d0-b6f6-c46b32893d21\"}"},{"__ref":"DeepDives:{\"uuid\":\"bf7bce9f-3aaa-4fd8-9131-915be9e06279\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b2d11c6-f832-42af-81ce-57dccbbcfbd5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fb0f0cac-f8b1-43ac-bbe9-0b8427e05a94/-/preview/-/format/jpg/","https://ucarecdn.com/d5115d53-b137-4097-89b4-833f4043982f/-/preview/-/format/jpg/","https://ucarecdn.com/f3ed4525-439f-4ba6-b348-dc60d67f8081/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4cab8e3a-4f7d-4bbe-857a-c8ccfcc36cfd\"}"},{"__ref":"Education:{\"uuid\":\"f168dd33-5dc3-4093-a294-f9bfac6ee4f0\"}"}],"hiredAt":"2026-05-01T17:14:37.041Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hale-snyder-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"eb3fa148-91a6-4d03-a125-23135d9d1b6d\"}"}}},"_sentryTraceData":"93cf628ae5524a8683ce0961fca81805-9c1b8d6743362cce-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=93cf628ae5524a8683ce0961fca81805,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"hale-snyder-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getEle
