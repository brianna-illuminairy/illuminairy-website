xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"45dbf8df-5c15-40ba-b0ba-b9dfdfb3f6ec\"}":{"__typename":"Favorites","uuid":"45dbf8df-5c15-40ba-b0ba-b9dfdfb3f6ec","photoUrl":"https://ucarecdn.com/32962c7c-4846-4d42-8ca8-46aa96cccf0e/","title":"Sydney Mclaughlin","type":"ATHLETE"},"Favorites:{\"uuid\":\"08eddca7-f5a2-46e1-9631-0fec74805db6\"}":{"__typename":"Favorites","uuid":"08eddca7-f5a2-46e1-9631-0fec74805db6","photoUrl":"https://ucarecdn.com/7698fb29-377f-4852-8d61-cb9d9d1de394/","title":"Boston","type":"CITY"},"Favorites:{\"uuid\":\"0c26ecdf-6270-4bf2-b2c8-82479aa2d13a\"}":{"__typename":"Favorites","uuid":"0c26ecdf-6270-4bf2-b2c8-82479aa2d13a","photoUrl":"https://ucarecdn.com/7e11680d-02f0-4819-b52e-ae97b67d9600/","title":"Boston Celtics","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"640da17f-b370-43e6-b5d3-44167dd5b478\"}":{"__typename":"CausesSupported","uuid":"640da17f-b370-43e6-b5d3-44167dd5b478","name":"Girls on the Run","description":"","photoUrl":""},"CausesSupported:{\"uuid\":\"82c76c22-126e-48ed-b1dd-328233626431\"}":{"__typename":"CausesSupported","uuid":"82c76c22-126e-48ed-b1dd-328233626431","name":"Ellie Fund","description":"","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"171a0992-a251-4614-8373-4473980cc568\"}":{"__typename":"DeepDives","uuid":"171a0992-a251-4614-8373-4473980cc568","content":"\u003cp\u003eSome advice I would give to my middle school or high school self would be to prioritize sleep. In high school especially, I spent a lot of nights staying up late to study. This caused me to fail to get the amount of sleep I needed, and led to multiple points of burnout during the school year. At the end of the day, sometimes that extra hour of sleep goes a lot further than that extra hour of studying!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f80b9b0b-d164-4897-b1c5-49c62f21f12f\"}":{"__typename":"DeepDives","uuid":"f80b9b0b-d164-4897-b1c5-49c62f21f12f","content":"\u003cp\u003eIf I could work any job in the world, I would certainly be a taste tester for Ben \u0026amp; Jerry's ice cream. Ice cream is my favorite food, so being able to brainstorm new flavors and eat ice cream all day would be a dream come true!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f1c5d9f7-7adf-41a5-ae96-801f998b4496\"}":{"__typename":"DeepDives","uuid":"f1c5d9f7-7adf-41a5-ae96-801f998b4496","content":"\u003cp\u003eIn my spare time, you can find me running, trying new foods, or hanging out with my friends. I also love to read mystery novels and watch old romantic-comedy movies. Recently, I have made it a point to take up some new hobbies, including cooking and golf (except I'm not very good at either).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"46bfcaa4-aa04-41ec-b8f9-87a48c3e2c30\"}":{"__typename":"DeepDives","uuid":"46bfcaa4-aa04-41ec-b8f9-87a48c3e2c30","content":"\u003cp\u003eI choose mentorship because I wish I had a mentor for myself growing up. As the older sibling, I have always been in an environment where I am the mentor rather than the mentee. Most often the mentors in my life have my parents who are much older than me, and may have had to navigate different obstacles than the ones I navigate in today's generation. However, this is what motivates me with mentoring as I know that I will be able to help out students from my experiences when I was in their shoes only a few years ago. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"cdb6d7dd-ee2b-42be-82dc-b56271535482\"}":{"__typename":"School","uuid":"cdb6d7dd-ee2b-42be-82dc-b56271535482","name":"Walpole High School","city":"Walpole","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02081"},"Education:{\"uuid\":\"7d8fe820-57f2-4f95-99f9-1ba03ebe7686\"}":{"__typename":"Education","uuid":"7d8fe820-57f2-4f95-99f9-1ba03ebe7686","school":{"__ref":"School:{\"uuid\":\"cdb6d7dd-ee2b-42be-82dc-b56271535482\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"985eec17-7495-4550-a26a-12964c548fb3\"}":{"__typename":"Education","uuid":"985eec17-7495-4550-a26a-12964c548fb3","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"56634a83-2077-42cb-bad8-dcf19246a4b7\"}":{"__typename":"MentorPublicProfile","uuid":"56634a83-2077-42cb-bad8-dcf19246a4b7","displayName":"Mia C.","slug":"mia-costa","biography":"\u003cp\u003eHello! My name is Mia, and I am a senior at Northwestern University studying Neuroscience with a minor in Psychology. I am fascinated by how the human brain works and love sharing my passion for learning. I have over five years of experience mentoring and tutoring students, particularly in elementary reading, writing, and math, as well as high school subjects like biology, psychology, and algebra. I am committed to helping students do well in these areas, as well as offering guidance on time management. As one who has previously struggled with time management, over the years I have found tricks for balancing school, sleep, exercise, and social life. I am happy to share my tips and support students that struggle with time management and developing effective study habits!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside academics, I love to be active and am an avid runner. I actually just completed my first marathon in Chicago this October! Through the past few years, I have raised over $18,000 for charity through running. I enjoy using activities like running to give back to the community and would love to support students interested in passion projects or volunteer work. For students looking to get involved in their community, I can work with them to help brainstorm exciting events or projects that they can participate in. Additionally, I am involved with Spoon University, a food publication at Northwestern, where I combine my interests in photography, reading, and baking into a creative outlet. I am here to help students find ways they can combine their interests in new hobbies, just as I have done as a writer and photographer for Spoon.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBuilding on my experiences, my study abroad experience in Denmark sparked a love for international travel, and I now work in Northwestern’s study abroad office. As a Student Fellow, I help students learn how they can fit global experiences into their academic journey. I am happy to mentor students who are interested in engaging in international experiences as a part of their learning path.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m excited to help you through Curious Cardinals and look forward to supporting your learning!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eAs if I haven't already made it my entire personality trait, I just finished my first marathon this October! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eYears ago, I would have told you that I could never run 26.2 miles. Training and completing my first marathon reminded me of the amazing things that I can accomplish once I set my mind to it. As long as you believe it, the sky's the limit!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"45dbf8df-5c15-40ba-b0ba-b9dfdfb3f6ec\"}"},{"__ref":"Favorites:{\"uuid\":\"08eddca7-f5a2-46e1-9631-0fec74805db6\"}"},{"__ref":"Favorites:{\"uuid\":\"0c26ecdf-6270-4bf2-b2c8-82479aa2d13a\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"640da17f-b370-43e6-b5d3-44167dd5b478\"}"},{"__ref":"CausesSupported:{\"uuid\":\"82c76c22-126e-48ed-b1dd-328233626431\"}"}],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"171a0992-a251-4614-8373-4473980cc568\"}"},{"__ref":"DeepDives:{\"uuid\":\"f80b9b0b-d164-4897-b1c5-49c62f21f12f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f1c5d9f7-7adf-41a5-ae96-801f998b4496\"}"},{"__ref":"DeepDives:{\"uuid\":\"46bfcaa4-aa04-41ec-b8f9-87a48c3e2c30\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/64d56644-d946-4af2-b90c-4f8652ff3c0a/-/preview/-/format/jpg/","https://ucarecdn.com/41f7df30-7e48-4c21-a8af-1fda8d3a5705/-/preview/-/format/jpg/","https://ucarecdn.co
