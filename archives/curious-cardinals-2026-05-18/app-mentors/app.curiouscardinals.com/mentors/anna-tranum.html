xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"edc594ed-7689-4dee-b6d1-4ffdb294ed2f\"}":{"__typename":"DeepDives","uuid":"edc594ed-7689-4dee-b6d1-4ffdb294ed2f","content":"\u003cp\u003eWhen I was younger, my silly dream was to be the first woman to play in the NHL, or better yet, establish the WNHL, a Women's National Hockey League. Hockey was one of my first sports, and I still love to skate! That dream might have evolved, but the ambition behind it hasn't. I ended up choosing basketball, and competing at the D3 level has taught me how to successfully balance the things I'm passionate about — like academics and athletics — without sacrificing either one.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1c233fc6-3fd6-4f4e-b8e0-eb44ff5b0add\"}":{"__typename":"DeepDives","uuid":"1c233fc6-3fd6-4f4e-b8e0-eb44ff5b0add","content":"\u003cp\u003eIn my spare time, I enjoy baking, building LEGOs, and staying active outdoors through golf, watersports, and skiing. I am also incredibly passionate about traveling. I've had the opportunity to travel to over 15 countries, which has shaped how I approach learning and problem-solving.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"93c36910-6a70-40b0-a65c-b25c6ea129e6\"}":{"__typename":"School","uuid":"93c36910-6a70-40b0-a65c-b25c6ea129e6","name":"Mercyhurst Preparatory School","city":"Erie","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"16504"},"Education:{\"uuid\":\"d215f161-7495-43fa-b074-a8a7bdce23d8\"}":{"__typename":"Education","uuid":"d215f161-7495-43fa-b074-a8a7bdce23d8","school":{"__ref":"School:{\"uuid\":\"93c36910-6a70-40b0-a65c-b25c6ea129e6\"}"},"startYear":"2020","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"4d09ffed-cb50-4e82-9419-fd0241ee208c\"}":{"__typename":"School","uuid":"4d09ffed-cb50-4e82-9419-fd0241ee208c","name":"Amherst College","city":"Amherst","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"01002"},"Education:{\"uuid\":\"7cf864c4-9c48-48f4-92c4-53ef81b07c2a\"}":{"__typename":"Education","uuid":"7cf864c4-9c48-48f4-92c4-53ef81b07c2a","school":{"__ref":"School:{\"uuid\":\"4d09ffed-cb50-4e82-9419-fd0241ee208c\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"2f708c91-35c3-4bc4-bfe9-b919c7953e18\"}":{"__typename":"MentorPublicProfile","uuid":"2f708c91-35c3-4bc4-bfe9-b919c7953e18","displayName":"Anna T.","slug":"anna-tranum","biography":"\u003cp\u003eHi! I'm Anna, a senior Chemistry major at Amherst College with a pre-med focus. Outside the classroom, I compete as a varsity basketball athlete and have spent the past several years gaining experience in healthcare, research, and tutoring. I'm genuinely excited to work with motivated students who want to make the most of their high school years and achieve their goals for college and beyond.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI was a highly motivated high schooler and felt most at home in my STEM classes. I transferred high schools before my junior year, and from that experience I learned how to adapt quickly and build confidence in a new environment — going on to graduate as salutatorian. That experience is a big part of why I connect with students navigating transitions, whether that's a new school, a new challenge, or just figuring out what comes next.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've always been drawn to hands-on learning, and that thread runs through everything I've done since:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eChemistry Teaching Assistant at Amherst College:\u003c/strong\u003e I used hands-on models and teaching skills to run weekly help sessions in General Chemistry, Organic Chemistry I \u0026amp; II\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTutor at a local high school: \u003c/strong\u003eI mentored underrepresented high school students for three years, focused on college readiness and academic support\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEnvironmental Research Intern at Bowling Green University:\u003c/strong\u003e I spent hours outdoors collecting and testing water samples using scientific field methods\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eVarsity Basketball Athlete:\u003c/strong\u003e I have found success through a sport I love, earning All-NESCAC Academic Honors all four years and CSC Academic All-District recognition as a Division III student-athlete\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNursing Aid at a local hospital:\u003c/strong\u003e rotating through different floors, I learned how to implement empathy in a meaningful and impactful way\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI specialize in guiding K-12 students through:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScience subjects — \u003c/strong\u003eChemistry, biology, and research fundamentals from a student who has both studied and taught these courses\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege applications — \u003c/strong\u003eEssays, strategy, and telling your story, especially for student-athletes and pre-med hopefuls\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch \u0026amp; passion projects — \u003c/strong\u003eDesigning a meaningful project, interpreting data, and presenting findings with confidence\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStudent-athlete balance\u003c/strong\u003e — Managing academics and a varsity sport at a high level, something I navigate daily\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNavigating transitions —\u003c/strong\u003e Providing guidance through new challenges and figuring out what comes next\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eWhy I'm qualified to help\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn my experiences, I've supported students and patients through challenges and in high-stakes situations. Students and parents can feel confident that I bring both academic rigor and genuine mentorship experience to every session.\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBrainstorming project ideas and connecting them to real-world applications\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBreaking down complex concepts into clear, approachable steps\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWorkshopping college essay drafts or application strategy\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTalking through how to balance competing priorities without burning out\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eIf you're a motivated student ready to explore your potential, take on meaningful challenges, and build confidence along the way, I'd love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"r402Pk01tsO6Rn9sCp02AiU01L6yeghA7ls6sQDX8QWnLG4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"edc594ed-7689-4dee-b6d1-4ffdb294ed2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"1c233fc6-3fd6-4f4e-b8e0-eb44ff5b0add\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5fd4a89f-c8ab-4f8c-93c9-4ef752f70fe9/-/preview/-/format/jpg/","https://ucarecdn.com/1e0b1abe-a597-4b74-9ea3-bf0209a711cb/-/preview/-/format/jpg/","https://ucarecdn.com/2fa82dac-b6b3-4432-9314-5b961d83a628/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d215f161-7495-43fa-b074-a8a7bdce23d8\"}"},{"__ref":"Education:{\"uuid\":\"7cf864c4-9c48-48f4-92c4-53ef81b07c2a\"}"}],"hiredAt":"2026-04-28T20:39:32.928Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anna-tranum\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2f708c91-35c3-4bc4-bfe9-b919c7953e18\"}"}}},"_sentryTraceData":"b7782fb49e3d44409e15ce70513ed47f-9632052c90e9cb19-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-rel
