xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"14322673-b287-4d8b-8dfe-9e708a7c584d\"}":{"__typename":"Favorites","uuid":"14322673-b287-4d8b-8dfe-9e708a7c584d","photoUrl":"https://ucarecdn.com/b6094c1c-1158-4f80-8c57-82b3ee5fe56c/","title":"The Tribe of Fatherless Girls","type":"BOOK"},"Favorites:{\"uuid\":\"564359a7-1c3f-450a-9068-4c872ed24c4d\"}":{"__typename":"Favorites","uuid":"564359a7-1c3f-450a-9068-4c872ed24c4d","photoUrl":"https://ucarecdn.com/cf49454a-ba7c-434b-ad36-1d65dbe71e6e/","title":"Are you bored yet? - Clairo and the Wallows ","type":"SONG"},"Favorites:{\"uuid\":\"c7c829dc-0697-487b-b5e3-f137ee51fbe8\"}":{"__typename":"Favorites","uuid":"c7c829dc-0697-487b-b5e3-f137ee51fbe8","photoUrl":"https://ucarecdn.com/ff98fffa-75e6-45c7-911f-537fa95090e8/","title":"Malcolm Todd","type":"ARTIST"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"0d3f7ce0-dba9-4971-9c81-92a6e3199b4f\"}":{"__typename":"DeepDives","uuid":"0d3f7ce0-dba9-4971-9c81-92a6e3199b4f","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to help transform the way health education is delivered in schools — especially in low-income communities. As someone studying neuroscience, I’ve become increasingly aware of how powerful early education can be in shaping lifelong outcomes. I want to work at the intersection of science, public health, and education to create programming that makes preventative cancer education accessible, engaging, and culturally responsive.\u003c/p\u003e\u003cp\u003ePreventative health measures — like understanding risk factors, recognizing early warning signs, and knowing when to seek care — can save lives. Yet in many underserved communities, this information is not consistently taught in ways that feel relevant or empowering. I hope to design school-based educational programs that introduce students and families to preventative cancer knowledge early on, in ways that are age-appropriate, interactive, and grounded in community realities. Schools are one of the few places that consistently reach young people across backgrounds, which makes them a powerful space for long-term impact.\u003c/p\u003e\u003cp\u003eUltimately, my goal is not just to share information, but to build awareness and agency. I want students to grow up feeling informed about their bodies, confident asking questions, and equipped to advocate for their own health and their families’ health. By working directly within school systems, I hope to help close gaps in health literacy and contribute to reducing preventable disparities over time.\u003c/p\u003e\u003cp\u003eTo me, education is one of the strongest tools for equity — and I hope to use it to create healthier futures for communities that deserve greater access and opportunity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"40111fd0-b94c-4755-8193-c4be4e094038\"}":{"__typename":"DeepDives","uuid":"40111fd0-b94c-4755-8193-c4be4e094038","content":"\u003cp\u003eMy greatest source of motivation is my mom. She came to the United States at a young age, stepping into a completely new environment with limited resources but an incredible amount of determination. Watching her adapt, persevere, and ultimately excel despite those challenges has shaped the way I approach my own goals.\u003c/p\u003e\u003cp\u003eShe has always carried herself with quiet resilience. Adjusting to a new culture, navigating unfamiliar systems, and building stability from the ground up required courage and discipline that I deeply admire. Rather than allowing obstacles to define her, she treated them as opportunities to grow stronger. Seeing that firsthand taught me that success is rarely about ease — it’s about consistency, effort, and believing in your capacity to improve.\u003c/p\u003e\u003cp\u003eHer journey motivates me to work harder, especially in moments when things feel overwhelming. As a student at Yale studying neuroscience, I’m often in rigorous academic environments that push me outside my comfort zone. When that happens, I think about the risks she took and the sacrifices she made to create opportunities for me. It reminds me that hard work is a privilege, not a burden.\u003c/p\u003e\u003cp\u003eBeyond achievement, she has also modeled empathy and integrity. She values education deeply, not just as a means of personal advancement, but as a way to uplift others. That perspective influences my own goals — whether it’s mentoring younger students, engaging in advocacy work, or aspiring to improve health education in underserved communities.\u003c/p\u003e\u003cp\u003eHer story is a constant reminder that resilience and ambition can coexist with kindness. Everything I strive for is rooted in the foundation she built, and honoring her sacrifices by making the most of my opportunities is what drives me every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"fcc9c0c5-a373-46b1-bacd-2cd4cd79b393\"}":{"__typename":"DeepDives","uuid":"fcc9c0c5-a373-46b1-bacd-2cd4cd79b393","content":"\u003cp\u003eAs a high school student, I would describe myself as friendly, very talkative, and deeply involved. I was the kind of person who could strike up a conversation with almost anyone — whether it was someone new to the school or someone I’d known for years. I genuinely enjoyed connecting with people, which made collaboration and leadership feel natural to me.\u003c/p\u003e\u003cp\u003eI was also very focused on advocacy. I cared a lot about improving student experiences, whether that meant working on projects to redesign our school cafeteria environment, helping develop more effective school policies, or creating spaces for important conversations around mental health. I wasn’t afraid to speak up respectfully when something could be improved, and I learned how to communicate thoughtfully with both peers and administrators. That balance of confidence and collaboration shaped much of my high school experience.\u003c/p\u003e\u003cp\u003eAcademically, I took my work seriously and pushed myself in challenging courses, but I also believed school should be more than just grades. I tried to stay well-rounded by participating in extracurricular activities that allowed me to express myself and build community. I brought a lot of energy into the spaces I was part of — sometimes a little too much talking, but always with good intentions!\u003c/p\u003e\u003cp\u003eMost importantly, I was someone who valued relationships. I wanted people to feel included, heard, and supported. I think that combination — being communicative, engaged, and fun while still responsible — defined who I was in high school. Those qualities have stayed with me, and they continue to shape how I approach leadership, mentorship, and learning today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"471e6154-6dab-450b-a440-6df1faa563ae\"}":{"__typename":"DeepDives","uuid":"471e6154-6dab-450b-a440-6df1faa563ae","content":"\u003cp\u003eGrowing up in a Nigerian household and in a low-income community has deeply shaped the way I approach teaching and mentorship. In my home, education was never seen as optional — it was a responsibility, a privilege, and a pathway to opportunity. At the same time, I grew up understanding that access, resources, and support are not distributed equally. That dual perspective has made me both disciplined and deeply empathetic.\u003c/p\u003e\u003cp\u003eComing from a Nigerian background, I was raised with strong values around respect, hard work, and community. I learned early on that growth happens not just individually, but collectively. That influences my teaching style in that I don’t just focus on performance — I focus on character, confidence, and long-term development. I encourage students to take pride in their work, but I also make sure they feel supported rather than pressured.\u003c/p\u003e\u003cp\u003eGrowing up in a low-income community also gave me insight into how environment shapes opportunity. I understand that students bring more into a learning space than just their homework — they bring family expectations, cultural identities, responsibilities, and sometimes stressors that aren’t always visible. Because of that, I prioritize truly listening and trying to understand where a student is coming from before deciding how to guide them.\u003c/p\u003e\u003cp\u003eI also strongly believe in integrating cultural awareness into learning. When students see their identities reflected and respected, they engage more deeply. I try to personalize projects and conversations in ways that connect to their lived experiences and passions. Whether that’s tying a lesson to real-world community impact or encouraging them to explore topics that matter to them personally, I want learning to feel relevant and empowering.\u003c/p\u003e\u003cp\u003eUltimately, my background has taught me adaptability, cultural sensitivity, and the importance of meeting people where they are. It’s shaped me into a mentor who values both excellence and empathy — someone who pushes students to grow while honoring the perspectives and communities that have shaped them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"84cb0c8a-4261-43a5-8b4b-b4a86d4346fb\"}":{"__typename":"School","uuid":"84cb0c8a-4261-43a5-8b4b-b4a86d4346fb","name":"Bedford Academy High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11216"},"Education:{\"uuid\":\"b61b0395-7296-4dc0-8e3f-ac440ea03190\"}":{"__typename":"Education","uuid":"b61b0395-7296-4dc0-8e3f-ac440ea03190","school":{"__ref":"School:{\"uuid\":\"84cb0c8a-4261-43a5-8b4b-b4a86d4346fb\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"cada56a8-9340-40c5-a55f-8b2f5ce28852\"}":{"__typename":"Education","uuid":"cada56a8-9340-40c5-a55f-8b2f5ce28852","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Molecular, Cellular, and Developmental Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"8dddfb06-a4b2-4e9e-8c6b-beb4deda7a18\"}":{"__typename":"MentorPublicProfile","uuid":"8dddfb06-a4b2-4e9e-8c6b-beb4deda7a18","displayName":"Tiffany S.","slug":"tiffany-sadiq","biography":"\u003cp\u003e]My name is Tiffany, and I am a freshman at Yale College studying neuroscience, a field that has shaped not only my academic interests but also the way I understand people, learning, and growth. What matters most to me is helping young people feel confident in who they are and capable of far more than they initially believe. I’ve always felt that when kids feel supported, heard, and challenged in the right ways, they begin to thrive — not just academically, but emotionally and personally as well. Neuroscience has deepened this belief by giving me a clearer understanding of how children learn, how habits form, and how environment and support systems influence development. Studying the brain has made me more patient and intentional when teaching or mentoring; I know that everyone processes information differently, and I genuinely enjoy figuring out how to explain things in ways that “click” for each individual student.\u003c/p\u003e\u003cp\u003eAt Yale, I balance rigorous coursework with research opportunities, and taking initiative as a freshman has strengthened my organization, communication, and independence. Whether I’m preparing for a lab meeting or a mentoring session, I show up ready, thoughtful, and fully engaged. Outside of academics, much of my work has centered around advocacy and youth-focused initiatives. In high school, I worked on projects aimed at redesigning school cafeterias to create healthier, more welcoming spaces for students, and I collaborated with administrators to ensure student voices were included in meaningful decisions. These experiences taught me leadership, responsibility, and how to approach challenges with care and creativity.\u003c/p\u003e\u003cp\u003eOne of the most meaningful experiences I’ve had was moderating a mental health awareness event sponsored by JPMorgan Chase, focused on the Black community. Facilitating that discussion required empathy, sensitivity, and the ability to create a safe space where people felt comfortable sharing their experiences. It strengthened my belief in the importance of emotional support and open dialogue, especially for young people navigating complex identities and pressures. That experience continues to shape the way I mentor — with intention, compassion, and a commitment to making every student feel seen.\u003c/p\u003e\u003cp\u003eI am also involved in CityStep, where I use dance as a tool for empowerment and expression. Teaching and performing choreography has shown me how powerful encouragement can be in helping kids build confidence, teamwork skills, and a sense of joy in learning. Dance has taught me that growth often happens when students feel free to take risks, make mistakes, and express themselves without fear of judgment.\u003c/p\u003e\u003cp\u003eWhile I take academics seriously, I am warm, energetic, and approachable. I want kids to feel comfortable asking questions, exploring new ideas, and growing at their own pace. My goal as a mentor is not just to help with homework or academic skills, but to help children build confidence, resilience, and a genuine love for learning. I strive to make every session positive, engaging, and fun — a space where students feel supported, challenged, and excited about their own potential.\u003c/p\u003e","teachingVideoPlaybackId":"00PEbx01lkuECfRCNOVT7uz59VhE27MpI02t02swLvyHDU00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I’m most proud of is moderating a mental health awareness event in partnership with JPMorgan Chase. The event brought together students, young professionals, and corporate leaders to talk openly about stress, burnout, identity, and the emotional challenges that often stay hidden behind academic or professional achievement. My role was to guide the conversation in a way that felt structured, safe, and genuinely honest.\u003c/p\u003e\u003cp\u003eI prepared by learning about each speaker’s background, identifying themes that would resonate with the audience, and crafting questions that invited vulnerability without putting anyone on the spot. During the event, I balanced personal stories with practical insights, making sure the discussion stayed accessible and grounded. I paid close attention to the room—who was leaning in, who looked hesitant, when to slow down, and when to push a little deeper. Moderating wasn’t just about asking questions; it was about reading emotional cues, creating trust, and helping people articulate experiences they often keep private.\u003c/p\u003e\u003cp\u003eWhat made the experience meaningful was the impact it had on the audience. After the event, several attendees shared that it was the first time they had heard mental health discussed so openly in a professional context. Others said they finally felt seen in their struggles with pressure, perfectionism, or uncertainty about the future. Knowing that I helped create a space where people felt safe enough to be honest is something I carry with me.\u003c/p\u003e\u003cp\u003eThis experience strengthened my belief that young people need mentors who can talk about both achievement and the emotional realities behind it. It taught me how to facilitate difficult conversations with empathy, how to make complex topics approachable, and how to support people in moments when they’re unsure how to express what they’re feeling. These are the same skills I bring into mentoring: helping students feel understood, helping them articulate their goals and challenges, and guiding them through moments that require both clarity and compassion.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"14322673-b287-4d8b-8dfe-9e708a7c584d\"}"},{"__ref":"Favorites:{\"uuid\":\"564359a7-1c3f-450a-9068-4c872ed24c4d\"}"},{"__ref":"Favorites:{\"uuid\":\"c7c829dc-0697-487b-b5e3-f137ee51fbe8\"}"}],"causesSupported":[],"major":"Molecular, Cellular, and Developmental Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0d3f7ce0-dba9-4971-9c81-92a6e3199b4f\"}"},{"__ref":"DeepDives:{\"uuid\":\"40111fd0-b94c-4755-8193-c4be4e094038\"}"},{"__ref":"DeepDives:{\"uuid\":\"fcc9c0c5-a373-46b1-bacd-2cd4cd79b393\"}"},{"__ref":"DeepDives:{\"uuid\":\"471e6154-6dab-450b-a440-6df1faa563ae\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d395b6a2-524d-476e-9a81-eb2386de0e55/-/preview/-/format/jpg/","https://ucarecdn.com/a85d47c0-82ec-4489-9105-8b2ec5666549/-/preview/-/format/jpg/","https://ucarecdn.com/a3f73389-6d8a-4df1-9652-e53c0ee89f44/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b61b0395-7296-4dc0-8e3f-ac440ea03190\"}"},{"__ref":"Education:{\"uuid\":\"cada56a8-9340-40c5-a55f-8b2f5ce28852\"}"}],"hiredAt":"2026-02-25T00:22:11.465Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","Statistics","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","College Essay Writing","Reading","Executive Function","K-6 Storybook","Medicine / Health","STEM Project","Public Speaking","Debate"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tiffany-sadiq\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8dddfb06-a4b2-4e9e-8c6b-beb4deda7a18\"}"}}},"_sentryTraceData":"f1a9659cf0714bc9b870d72857742390-af1873e0c77ef3ff-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f1a9659cf0714bc9b870d72857742390,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"tiffany-sadiq"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
