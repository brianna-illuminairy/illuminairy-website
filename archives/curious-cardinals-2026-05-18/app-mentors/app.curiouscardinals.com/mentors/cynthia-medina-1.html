xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"385d1440-9848-4791-ae29-bec07e6d6150\"}":{"__typename":"Favorites","uuid":"385d1440-9848-4791-ae29-bec07e6d6150","photoUrl":"https://ucarecdn.com/67c3ffdf-29d1-4a0f-ae8a-1eec3c5d43db/","title":"San Francisco, CA","type":"CITY"},"Favorites:{\"uuid\":\"f2eb9bca-8bfd-40a9-bad7-097f86c2b1fd\"}":{"__typename":"Favorites","uuid":"f2eb9bca-8bfd-40a9-bad7-097f86c2b1fd","photoUrl":"https://ucarecdn.com/625b74db-78eb-4986-afb8-924ec69589ec/","title":"Minari by Emile Mosseri","type":"ALBUM"},"Favorites:{\"uuid\":\"eb2e3662-019f-44a0-8064-d8ea11042a86\"}":{"__typename":"Favorites","uuid":"eb2e3662-019f-44a0-8064-d8ea11042a86","photoUrl":"https://ucarecdn.com/b0f7358d-384a-4893-9832-d18e7ee272f1/","title":"Tuesdays with Morrie by Mitch Albom","type":"BOOK"},"CausesSupported:{\"uuid\":\"93a71758-fb81-40d4-8274-4e94ce853891\"}":{"__typename":"CausesSupported","uuid":"93a71758-fb81-40d4-8274-4e94ce853891","name":"UNICEF","description":"\u003cp\u003eI love UNICEF!! Most wonderful organization that supports our most vulnerable. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/2763338f-b0b5-425c-b4c2-a1af9dfa9982/"},"CausesSupported:{\"uuid\":\"cb34d935-9e3b-4db8-a0de-60dc9d271c98\"}":{"__typename":"CausesSupported","uuid":"cb34d935-9e3b-4db8-a0de-60dc9d271c98","name":"Girl Up ","description":"\u003cp\u003eA platform for girls and women all across the world! \u003c/p\u003e","photoUrl":"https://ucarecdn.com/7d098e77-691a-43d0-a2d7-05dcb1b76175/"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"dcac92a5-e3d0-4414-8e28-244e0c4572ac\"}":{"__typename":"DeepDives","uuid":"dcac92a5-e3d0-4414-8e28-244e0c4572ac","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is becoming a true pastry expert. I love baking, especially pastries and cakes, and I want to get good enough that my taste and judgment actually mean something.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSomeday, I’d love to be a judge on a baking competition. To me, that would be the sign that I’ve learned the craft deeply, tried enough styles and techniques, and can recognize what makes a dessert not just “good,” but exceptional.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"c22b5082-19de-4b29-b090-8026ec750a4f\"}":{"__typename":"DeepDives","uuid":"c22b5082-19de-4b29-b090-8026ec750a4f","content":"\u003cp\u003eWhen I was obsessed with \u003cem\u003eCoraline\u003c/em\u003e, I had this silly dream that I found a tiny door in my house and I actually opened it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI ended up in the Other World and I went straight to the garden, the one her dad made for her. It looked exactly like the movie, super bright and perfectly put together, like it was made for one person on purpose. I just walked around staring at it like, how is this even real.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd the funny part is I wasn’t even thinking about how creepy the whole situation is. I was just fully distracted by the garden, like “wait, this is kind of amazing.” I woke up and I was genuinely disappointed it wasn’t there.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"6aee3b51-6ebb-4d39-971f-5590fc97f342\"}":{"__typename":"DeepDives","uuid":"6aee3b51-6ebb-4d39-971f-5590fc97f342","content":"\u003cp\u003eI grew up in Florida, so when I got to Yale and it finally snowed enough, my roommate and I went all in. We built this actual, real snowman and somehow managed to carry it back to our dorm and set it up right outside our window. It felt like such a classic “college winter” moment, and we were weirdly invested in it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWe ended up treating it like our new roommate, checking on it every time we came back, taking pictures, and getting way too attached. It’s silly, but I’m proud of it because it was one of those moments where I was like, wow, I’m really here, I’m making a life in a totally new place, and I’m letting myself enjoy it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5beaecc7-275d-4f99-8765-9053a7cff1a8\"}":{"__typename":"DeepDives","uuid":"5beaecc7-275d-4f99-8765-9053a7cff1a8","content":"\u003cp\u003eIn my spare time, I’m usually doing one of three things.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love reading, especially philosophy. I’m the kind of person who’ll underline a line and then sit there thinking about it for way too long. I also listen to a lot of classical music, especially when I’m studying or walking around campus, it helps me focus and honestly just makes everything feel calmer.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd I work out a lot. Running is my favorite because it clears my head fast. If I’ve had a stressful day, a run is usually the one thing that makes me feel reset.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e49f6c61-3c30-4511-af1b-80f744d05663\"}":{"__typename":"School","uuid":"e49f6c61-3c30-4511-af1b-80f744d05663","name":"Braden River High School","city":"Bradenton","type":"HIGH","state":"Florida","country":"United States","zip":"34203"},"Education:{\"uuid\":\"ed54d617-6892-4d37-8c27-2a71b20a4acf\"}":{"__typename":"Education","uuid":"ed54d617-6892-4d37-8c27-2a71b20a4acf","school":{"__ref":"School:{\"uuid\":\"e49f6c61-3c30-4511-af1b-80f744d05663\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"275539fc-3b6d-4cd5-8726-a9176832a7d3\"}":{"__typename":"Education","uuid":"275539fc-3b6d-4cd5-8726-a9176832a7d3","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Ethics, Politics, and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"b5b88a85-b120-4aef-ab39-7d91f551d17a\"}":{"__typename":"MentorPublicProfile","uuid":"b5b88a85-b120-4aef-ab39-7d91f551d17a","displayName":"Cynthia M.","slug":"cynthia-medina-1","biography":"\u003cp\u003eCynthia Medina is an undergraduate at Yale University studying Ethics, Politics, and Economics. Her academic interests focus on how institutions shape real lives, especially in public interest law, immigration and citizenship, civic participation, and the ethics of policy decisions. She is especially drawn to questions about power and dignity, and the ways people navigate systems that were not designed with them in mind.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, Cynthia spends much of her time building community and helping students access opportunities that support growth. She has been involved in advocacy and student leadership at Yale, where she supports campus initiatives that connect global priorities to concrete action. She has also participated in the Yale AI Policy Initiative, engaging with questions about emerging technology, governance, and responsibility. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eCynthia is active in Jewish life at Yale and helps organize Sephardi-centered programming, drawing on her Sephardi heritage and her family’s ties to Mexico and the broader diaspora.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCynthia has long been drawn to work that combines strong writing, strategy, and relationships. She serves on the editorial side of student publishing, such as the Yale Undergraduate Law Journal, and has experience leading teams, coordinating projects, and collaborating with partners. Earlier in her life, she taught English to adult learners and worked on community-based initiatives focused on education access, civic engagement, and building trust across differences. These experiences shape the way she approaches mentorship, with patience, clarity, and a belief that learning is most powerful when it feels personal and practical.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHer interests outside of policy and advocacy are equally central to who she is. Cynthia loves the French language and enjoys using it as a way to connect culture, history, and everyday expression. She also has a deep love for classical music and played the cello for a little over six years, an experience that taught her discipline, listening, and the confidence that comes from consistent practice. She is an avid photographer and is especially drawn to film as a medium that captures mood, memory, and moral attention. She often thinks about how art trains us to notice what other people overlook.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, Cynthia is passionate about supporting students across creative and professional pathways, including creative writing, fashion and cosmetics, music, finance and investing, business and entrepreneurship, medicine and health, law, government, and policy, and sustainability. She aims to be both supportive and honest, helping students articulate what they value, build confidence in their voice, and turn big goals into small steps they can actually follow. She is especially excited to work with students who are navigating new environments, unfamiliar academic and professional systems, or multiple identities. Cynthia believes mentorship matters most when it helps someone feel less alone and more capable of taking up space.\u003c/p\u003e","teachingVideoPlaybackId":"E66vs1pMel5amBLoG1cjdvYODD2V02azOot1NxuQ54MQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"385d1440-9848-4791-ae29-bec07e6d6150\"}"},{"__ref":"Favorites:{\"uuid\":\"f2eb9bca-8bfd-40a9-bad7-097f86c2b1fd\"}"},{"__ref":"Favorites:{\"uuid\":\"eb2e3662-019f-44a0-8064-d8ea11042a86\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"93a71758-fb81-40d4-8274-4e94ce853891\"}"},{"__ref":"CausesSupported:{\"uuid\":\"cb34d935-9e3b-4db8-a0de-60dc9d271c98\"}"}],"major":"Ethics, Politics, and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dcac92a5-e3d0-4414-8e28-244e0c4572ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"c22b5082-19de-4b29-b090-8026ec750a4f\"}"},{"__ref":"DeepDives:{\"uuid\":\"6aee3b51-6ebb-4d39-971f-5590fc97f342\"}"},{"__ref":"DeepDives:{\"uuid\":\"5beaecc7-275d-4f99-8765-9053a7cff1a8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/54a35015-3770-413f-9dfc-15881758510b/-/preview/-/format/jpg/","https://ucarecdn.com/d9930684-54d7-45aa-81f2-1ab874c3f358/-/preview/-/format/jpg/","https://ucarecdn.com/9dc87b7e-a6f9-467e-b7f2-1c7d4489b830/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":
