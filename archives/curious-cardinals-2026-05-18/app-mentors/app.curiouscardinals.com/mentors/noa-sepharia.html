one day make a living off of my art and writing. In my wildest dreams I see myself traveling the world as an independent journalist. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"47a9bccb-5c53-440a-8471-bd74f8b56685\"}":{"__typename":"DeepDives","uuid":"47a9bccb-5c53-440a-8471-bd74f8b56685","content":"\u003cp\u003eGrowing up I was a student with a lot of varied interests and passions, but I had trouble channeling these interests into tangible goals. I wish I had a mentor who could've pointed me in the right direction. Mentorship matters to me because I want to help out students who are in a similar place. I hope to help all of my students feel empowered to accomplish any of the goals they dream of. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a606cf34-6e51-40d3-a308-7c2d3a8c23ce\"}":{"__typename":"DeepDives","uuid":"a606cf34-6e51-40d3-a308-7c2d3a8c23ce","content":"\u003cp\u003eI'm motivated by a ceaseless desire to understand the world. I try to live as a student of life guided by curiosity. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"35e631a0-7d6f-44f6-a9a7-7aad011684e8\"}":{"__typename":"School","uuid":"35e631a0-7d6f-44f6-a9a7-7aad011684e8","name":"Parkway West High School","city":"Ballwin","type":"HIGH","state":"Missouri","country":"United States","zip":"63011"},"Education:{\"uuid\":\"d85afe49-1b4f-4e4a-b530-cfcd4d11af1a\"}":{"__typename":"Education","uuid":"d85afe49-1b4f-4e4a-b530-cfcd4d11af1a","school":{"__ref":"School:{\"uuid\":\"35e631a0-7d6f-44f6-a9a7-7aad011684e8\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"3487350a-f0e1-4d4c-b0c2-025fa9455434\"}":{"__typename":"Education","uuid":"3487350a-f0e1-4d4c-b0c2-025fa9455434","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2024","major":"Religious Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"49650703-d1b2-4f92-9da2-6a20a9b8cfc2\"}":{"__typename":"MentorPublicProfile","uuid":"49650703-d1b2-4f92-9da2-6a20a9b8cfc2","displayName":"Noa S.","slug":"noa-sepharia","biography":"\u003cp\u003eHello, I’m Noa, and I’m originally from Mississippi. I grew up in St. Louis, Missouri, and after graduating from Harvard I returned to my midwestern roots by moving to Chicago. I’m an artist at heart whose primary mediums are music production, film, and writing. Though I don’t yet make a living off these interests, I’ve had the privilege of releasing a single with an independent music label, I’ve had one of my short films featured in a film festival, and I’ve had my writing published in a major European news publication. I would love to connect with students who are also interested in the world of music, film, or creative writing.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I graduated high school my initial plan was to one day become a lawyer, motivated by a desire to serve marginalized communities. While I still have a lot of respect for the legal field, I found that my authentic interests were instead pushing me more towards the helping professions. I decided to go to Divinity School with the intention of improving my interpersonal skills, and better understanding the role of ethical leadership in today’s era of compounding crises. This was one of the best decisions I’ve ever made, as it’s helped me become a better community organizer, artist, and human. Since then I’ve worked for various nonprofits and organizations dedicated to serving unhoused folks and people living with mental health conditions. I’m particularly motivated by a desire to improve conditions for trans and LGBTQ+ people who are facing housing insecurity.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve worked as a tutor since I was in high school. Throughout this time I’ve taught a wide variety of subjects, with English and communication arts being a particular area of strength. I hope to work with students who, like myself, are motivated by a strong sense of justice and a desire to give back to the world. I’m well suited to mentor students who are struggling to find their path or need help connecting their interests into practical goals, as I was once in those same shoes. I would also love the opportunity to work with students who have defined goals, but need help improving their executive functioning skills.\u003c/p\u003e","teachingVideoPlaybackId":"btBySavFondFVzYkbuRK02YZfQBbevLjbcJoFo6vfZw8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f8c8b4db-3c7b-4595-a849-202de94ac9d0\"}"},{"__ref":"Favorites:{\"uuid\":\"8e1f475a-e539-483a-abd8-0a8196ab7304\"}"},{"__ref":"Favorites:{\"uuid\":\"c4fbe6ac-078b-4759-967b-6e3442b459ff\"}"}],"causesSupported":[],"major":"Religious Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e4d92e19-6149-4922-881c-466c86b3a43f\"}"},{"__ref":"DeepDives:{\"uuid\":\"a5506065-dd13-4230-812c-a27b77e58d62\"}"},{"__ref":"DeepDives:{\"uuid\":\"47a9bccb-5
