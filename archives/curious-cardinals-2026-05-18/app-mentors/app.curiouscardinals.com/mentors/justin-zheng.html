xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"69db1a61-8514-43a9-9e46-af2c0f3e5ea4\"}":{"__typename":"DeepDives","uuid":"69db1a61-8514-43a9-9e46-af2c0f3e5ea4","content":"\u003cp\u003e\u003cstrong\u003eBuy Nvidia and Bitcoin !!! \u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eBut in all seriousness, I would tell myself to be more committed to doing what I love, like basketball. I often look back and wonder how far I could have gone in my basketball career if I had just tried a little harder and stayed more consistent. Therefore, the biggest advice I would give myself is to stay consistent and committed to what I love.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e64ab6c5-e31e-4318-b31a-99c55f350d03\"}":{"__typename":"DeepDives","uuid":"e64ab6c5-e31e-4318-b31a-99c55f350d03","content":"\u003cp\u003eCurrently, a big passion I'm working on is building and modifying my own car. Growing up, I always had a lot of friends who were super into cars. With the recent opening of my friend's motor shop, I've started to become more interested as well. For the car enthusiasts out there, I'm currently working on a 440i and also learning how to wrap cars. A past passion project of mine was a sneaker reselling business that I started with my friends. We focused on high-end luxury sneakers and the international sneaker market, eventually scaling it to a six-figure business.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fff4b4c6-1add-443e-9dce-4e0a88f4e320\"}":{"__typename":"DeepDives","uuid":"fff4b4c6-1add-443e-9dce-4e0a88f4e320","content":"\u003cp\u003eComing from a single-mother family raising two kids on her own, I took on a lot more responsibilities from an early age. This unique background helped me realize the importance of education and, more importantly, the value of having a mentor. A mentor is not just someone who provides guidance and support; they also offer wisdom and experience that can help navigate life's challenges and opportunities.\u003c/p\u003e\u003cp\u003eA mentor can inspire confidence, offer new perspectives, and help set and achieve goals. They can be a source of encouragement and motivation, especially during difficult times. For me, having a mentor meant having someone to look up to, someone who believed in my potential and pushed me to strive for excellence.\u003c/p\u003e\u003cp\u003eMy experiences have shown me how transformative a mentor can be. They have the power to shape lives, instill resilience, and cultivate a sense of purpose. This is why mentorship matters to me—it’s about building connections, fostering growth, and making a lasting impact on someone's life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"f3132bfb-9765-4343-ad24-5fd022b5058a\"}":{"__typename":"DeepDives","uuid":"f3132bfb-9765-4343-ad24-5fd022b5058a","content":"\u003cp\u003eOne of my greatest role models is Jimmy Butler. Growing up in poverty and facing significant hardships, Butler's journey to the NBA was anything but easy. He was kicked out of his home at a young age and often had to work multiple jobs while practicing basketball. Despite these challenges, he remained dedicated to his dream and worked tirelessly to improve his game.\u003c/p\u003e\u003cp\u003eI admire Jimmy Butler because he embodies the spirit of having a big dream and making the effort to pursue it. His resilience, work ethic, and determination to overcome adversity inspire me to strive for excellence in my own pursuits. Butler's story is a powerful reminder that with commitment and perseverance, it is possible to achieve great things, no matter where you start.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"602830c9-6dd3-43da-8d9d-70fdb176e2ad\"}":{"__typename":"School","uuid":"602830c9-6dd3-43da-8d9d-70fdb176e2ad","name":"Troy High School","city":"Fullerton","type":"HIGH","state":"California","country":"United States","zip":"92831"},"Education:{\"uuid\":\"38b0012c-4cda-4d6d-aa79-d50f7d235c5c\"}":{"__typename":"Education","uuid":"38b0012c-4cda-4d6d-aa79-d50f7d235c5c","school":{"__ref":"School:{\"uuid\":\"602830c9-6dd3-43da-8d9d-70fdb176e2ad\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"ed92c51f-2c41-42e8-814b-2b118fdf18c1\"}":{"__typename":"Education","uuid":"ed92c51f-2c41-42e8-814b-2b118fdf18c1","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Business Economics ","degree":null},"MentorPublicProfile:{\"uuid\":\"1348f409-1ad3-4b8e-8e97-91d30b9dbb8d\"}":{"__typename":"MentorPublicProfile","uuid":"1348f409-1ad3-4b8e-8e97-91d30b9dbb8d","displayName":"JUSTIN Z.","slug":"justin-zheng","biography":"\u003cp\u003eHello! My name is Justin Zheng, and I’m currently a 2nd-year student at UCLA, majoring in Economics with a minor in Data Science. My journey has taken me from New York to Shanghai and back to California, enriching my perspective on diverse cultures and experiences. I’ve been passionate about basketball throughout my life, playing varsity for four years in high school. A fun fact about me is that I can do a wind-mill dunk. I also competed nationally in E-sports, winning 1st place in League of Legends with my high school team. In addition to basketball and E-sports, I enjoy working out, building with LEGO, axe throwing, and exploring my growing interest in cars.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eProfessionally, I have a diverse background in business. I am currently interning as a hedge fund analyst in Orange County. My previous roles include serving as the Marketing/UI/UX lead for UCLA’s Creative Lab project, where we developed and tested an innovative app called Clothesline. I’ve also worked as a marketing analyst at a sports-tech company and have experience in consulting, finance/accounting, and entrepreneurship. One of my proudest achievements was launching a sneaker reselling business in high school that scaled to six-figure revenue.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAt UCLA, I am actively involved in organizations like Burin AI Research, the Bruin Sports Business Association, and AY Consulting. I also play intramural basketball and work as a part-time campus tour guide.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI am thrilled about the opportunity to join Curious Cardinals. Having come from a disadvantaged background myself, I understand the profound impact of mentorship and am eager to give back. My goal is to provide a hands-on learning experience that equips students with real-world skills and knowledge. If we work together, I am committed to helping your child succeed and achieve their goals through practical, engaging lessons.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"ahYLAefNVD6y2ASUr02FEqRGwnFUrKmKiL4W3ZVlCXW00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business Economics ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"69db1a61-8514-43a9-9e46-af2c0f3e5ea4\"}"},{"__ref":"DeepDives:{\"uuid\":\"e64ab6c5-e31e-4318-b31a-99c55f350d03\"}"},{"__ref":"DeepDives:{\"uuid\":\"fff4b4c6-1add-443e-9dce-4e0a88f4e320\"}"},{"__ref":"DeepDives:{\"uuid\":\"f3132bfb-9765-4343-ad24-5fd022b5058a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a0369d0a-94f9-450d-8b0b-555790e78965/-/preview/-/format/jpg/","https://ucarecdn.com/f3c6d9d2-03e1-49ed-9a6c-205a9a2e27b7/-/preview/-/format/jpg/","https://ucarecdn.com/d217e06a-cc96-494b-811d-6edd1fa1b711/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"38b0012c-4cda-4d6d-aa79-d50f7d235c5c\"}"},{"__ref":"Education:{\"uuid\":\"ed92c51f-2c41-42e8-814b-2b118fdf18c1\"}"}],"hiredAt":"2024-07-24T15:38:55.560Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Statistics","6-8 Grade Science","Writing","Mandarin Chinese","College Essay Writing","Academic Coaching","Reading","Economics","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Business / Entrepreneurship","Finance / Investing","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"justin-zheng\"}})":
