e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"03b7d593-249c-49bc-a8ef-7d280c054128\"}":{"__typename":"DeepDives","uuid":"03b7d593-249c-49bc-a8ef-7d280c054128","content":"\u003cp\u003eIce cream sampler. Traveling the world, one sampling wooden stick at a time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"fbad20af-d180-44ad-87a2-42ab51b6cd2f\"}":{"__typename":"School","uuid":"fbad20af-d180-44ad-87a2-42ab51b6cd2f","name":"Hilo High School","city":"Hilo","type":"HIGH","state":"Hawaii","country":"United States","zip":"96720"},"Education:{\"uuid\":\"4969ec5f-b3f8-4c4a-a8a8-af02eff0a65d\"}":{"__typename":"Education","uuid":"4969ec5f-b3f8-4c4a-a8a8-af02eff0a65d","school":{"__ref":"School:{\"uuid\":\"fbad20af-d180-44ad-87a2-42ab51b6cd2f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"ab74a451-160c-498d-8bf4-95c33a3722e7\"}":{"__typename":"Education","uuid":"ab74a451-160c-498d-8bf4-95c33a3722e7","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"4c4feda8-1859-46a8-b042-f4d20a01ec44\"}":{"__typename":"MentorPublicProfile","uuid":"4c4feda8-1859-46a8-b042-f4d20a01ec44","displayName":"Shwe W.","slug":"shwe-win","biography":"\u003cp\u003eHi! I’m Shwe — a Harvard graduate, educator, and nonprofit founder, and I help students turn curiosity into projects with real-world impact.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003e\u003cem\u003eA Bit About Me\u003c/em\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eOver the past few years, I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDesigned and taught curriculum to 400+ students as a \u003cstrong\u003eFulbright educator in Taiwan\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFounded a \u003cstrong\u003ecollege access nonprofit in Hawaii\u003c/strong\u003e that now supports 160+ public school students\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCompleted a \u003cstrong\u003esenior honors thesis in neuroscience\u003c/strong\u003e at Harvard, studying neural development using larval zebrafish models\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as a \u003cstrong\u003eTeaching Assistant in Chemistry and Life Sciences\u003c/strong\u003e at Harvard, coaching students through complex scientific concepts\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eAcross classrooms, labs, and community programs, I’ve learned how to take an idea — whether it’s a research question, health initiative, or service concept — and turn it into something structured, measurable, and aligned with long-term goals. \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003e\u003cem\u003eWhat I Specialize In\u003c/em\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI mentor students who want to explore:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePublic health \u0026amp; medicine passion projects\u003c/strong\u003e\u003cbr\u003e(health education campaigns, research proposals, community initiatives)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScience communication\u003c/strong\u003e\u003cbr\u003e(presentations, curriculum design, workshops, competitions)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSocial impact projects\u003c/strong\u003e\u003cbr\u003e(launching nonprofits, advocacy efforts, or service initiatives)\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI especially enjoy working with students who are:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCurious but overwhelmed by where to begin\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePassionate about improving their communities\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNew to scientific communication but eager to learn how to express complex ideas clearly\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003e\u003cem\u003eWhat Working with Me Looks Like\u003c/em\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI’m structured but flexible — I believe strong systems create room for creativity. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session might involve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurning a vague interest into a clear project idea or proposal\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a step-by-step timeline with clear milestones\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDesigning surveys, interviews, experiments, or curriculum materials\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing presentations and refining messaging for clarity and impact\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eBecause I’ve both \u003cstrong\u003etaught in classrooms\u003c/strong\u003e and \u003cstrong\u003ebuilt programs from scratch\u003c/strong\u003e, I understand how to guide students through the full arc of a project — from idea to execution to reflection.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also help students build transferable skills:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eproject management\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003epublic speaking\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eprofessional communication\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003econfidence in academic spaces\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy goal goes beyond completing a project — I want to help students build something they’re genuinely proud of and grow as a person.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003e\u003cem\u003eSome (Hopefully!) Fun Facts\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI grew up in Hawaii 🌺\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI love long-distance running (currently training for a half marathon!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI’m learning to play the ukulele\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI can happily talk about neuroscience or college essays for hours\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eIf you’re excited to build something meaningful — I’d love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"I6ZzN00zWWVRTdYXZK01U2CpjAZi01Viecc1bvAkSvDa8c","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"739c75c5-0132-4d20-b8a3-fa028e607fe9\"}"},{"__ref":"DeepDives:{\"uuid\":\"4fbf3117-a6b7-4806-8708-61b726f31ed6\"}"},{"__ref":"DeepDives:{\"uuid\":\"c13815b8-4897-4eef-a234-7324ce501975\"}"},{"__ref":"DeepDives:{\"uuid\":\"03b7d593-249c-49bc-a8ef-7d280c054128\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6032040d-9034-4890-9094-61e233e18c9f/-/preview/-/format/jpg/","https://ucarecdn.com/ab5d6c35-e224-4b4f-9545-9c14cb01441b/-/preview/-/format/jpg/
