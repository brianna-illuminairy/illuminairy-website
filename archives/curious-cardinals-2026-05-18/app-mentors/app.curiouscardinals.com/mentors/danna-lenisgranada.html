xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"48181393-49af-4858-9675-ee207d2ec8db\"}":{"__typename":"Favorites","uuid":"48181393-49af-4858-9675-ee207d2ec8db","photoUrl":"https://ucarecdn.com/f5f65be0-f939-41e7-b6b6-71b48f683d70/","title":"All About Love by Bell Hooks","type":"BOOK"},"Favorites:{\"uuid\":\"be833fcd-6b96-40c2-a358-82f28b8f6f7f\"}":{"__typename":"Favorites","uuid":"be833fcd-6b96-40c2-a358-82f28b8f6f7f","photoUrl":"https://ucarecdn.com/ecb43f00-9c1c-4b32-914a-3de08cf58f15/","title":"Madrid,San Francisco, Seattle","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a6b370d4-c9fa-4b92-8569-0967d25e6e8c\"}":{"__typename":"DeepDives","uuid":"a6b370d4-c9fa-4b92-8569-0967d25e6e8c","content":"\u003cp\u003eIf I could give my middle or high school self advice, I’d tell her to trust the journey and not worry about having everything figured out right away. It’s okay to take your time. Most importantly, focus on doing the things you love—that’s what will get you far and make you truly happy. Creativity isn’t just a side passion, it’s something that can shape your future in incredible ways, so embrace it fully. And remember to be kind to yourself; everyone’s path is different, and yours is special because it’s yours.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"f85f907f-eb21-42d5-8885-7fff5a0fd899\"}":{"__typename":"DeepDives","uuid":"f85f907f-eb21-42d5-8885-7fff5a0fd899","content":"\u003cp\u003eOne of the silliest dreams I’ve ever had was about being in a giant marshmallow candy house! I walked up these spiral candy cane stairs, and at the top, I saw my favorite celebrities at the time—Katy Perry and Stephen Curry—just casually hanging out. We sat in marshmallow chairs, chatted like old friends, and then, we frolicked in a meadow after our chat! When I woke up, I felt so excited and happy because it genuinely felt so real. Top 3 best dreams for sure!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c115ad52-a8af-4638-ab74-911232d02c4c\"}":{"__typename":"DeepDives","uuid":"c115ad52-a8af-4638-ab74-911232d02c4c","content":"\u003cp\u003eOut of all the things I could be doing, mentorship feels like a natural choice because of the meaningful connections it allows me to create. Throughout my journey, I’ve been lucky to have incredible mentors who believed in me and helped guide me when I needed it most. Their support was pivotal in shaping who I am today. I truly believe that everyone deserves that same kind of guidance and encouragement. Mentorship allows me to give back and make a real impact in someone’s life, whether it’s helping them discover a passion, overcome a challenge, or build confidence in their own abilities. Seeing students grow, achieve their goals, and realize their potential is something I find deeply fulfilling.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b3af3ba9-197d-40d7-a376-25a324ebb657\"}":{"__typename":"DeepDives","uuid":"b3af3ba9-197d-40d7-a376-25a324ebb657","content":"\u003cp\u003eI didn’t always know that I wanted to pursue Product Design—it wasn’t a straightforward path. But along the way, I realized that creativity was something I couldn’t live without. It’s what drives me and gives me a sense of purpose. My classes allowed me to explore different ways of thinking and problem-solving, and I fell in love with how design bridges both art and engineering. The ability to create something meaningful and functional from just an idea felt incredibly fulfilling. Over time, I discovered that Product Design was the perfect fit because it allowed me to combine creativity, curiosity, and hands-on work, all of which are important to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"6cef77e8-f409-4a95-bb86-c1869c341ec7\"}":{"__typename":"School","uuid":"6cef77e8-f409-4a95-bb86-c1869c341ec7","name":"Sacred Heart Cathedral Preparatory","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94109"},"Education:{\"uuid\":\"b478ec9c-5037-4167-a8cf-1c09bba685e5\"}":{"__typename":"Education","uuid":"b478ec9c-5037-4167-a8cf-1c09bba685e5","school":{"__ref":"School:{\"uuid\":\"6cef77e8-f409-4a95-bb86-c1869c341ec7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e2fd4ae8-b34a-45a1-b660-bb91258aeae4\"}":{"__typename":"Education","uuid":"e2fd4ae8-b34a-45a1-b660-bb91258aeae4","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Product Design","degree":null},"MentorPublicProfile:{\"uuid\":\"deef38db-3b26-41e3-874f-831ce9f74357\"}":{"__typename":"MentorPublicProfile","uuid":"deef38db-3b26-41e3-874f-831ce9f74357","displayName":"Danna L.","slug":"danna-lenisgranada","biography":"\u003cp\u003eI’m currently pursuing a major in Product Design at Stanford University, where I’m on the physical manufacturing track. My academic journey has allowed me to explore the intersection of creativity and engineering, which fuels my passion for designing products that not only function well but also inspire. At my core, I love making things—whether it’s a physical product, A CAD model, a piece of art, or a compelling graphic design. The process of bringing ideas to life is what excites me the most, and I’m dedicated to sharing that passion with my students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat I care about most are meaningful connections and helping people. Having been guided by incredible mentors throughout my life, I know firsthand how pivotal mentorship can be. The support and guidance I received have been instrumental in my growth, and I’m committed to giving back by helping someone else in the same way. I believe that mentorship is about more than just teaching—it’s about fostering a connection that inspires and empowers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, I spend my time working on various creative projects, from graphic design and block printing to video production. I also run my own business, where I get to channel my creative energy into something that’s uniquely mine. This experience has given me valuable insights into entrepreneurship, and I love helping students who are interested in starting their own projects or businesses. Whether it’s coming up with an idea, branding, or figuring out how to market a product, I’m here to guide them through the process.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs the full-time designer for the Stanford Concert Network, I’ve had the opportunity to create concert posters that have significantly boosted event attendance, showcasing the power of visual communication. My experience also includes marketing and social media management, where I’ve successfully grown an audience of over 2,500 students for a social media app.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy background as a first-generation Colombian student from San Francisco has deeply influenced my approach to teaching. I’m passionate about making learning accessible and engaging for students from all walks of life. I understand the challenges of navigating academic and creative pursuits, especially with ADHD and anxiety, and I’m committed to providing a supportive and encouraging environment for my students, as well as academic and life guidance in this realm.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether it’s helping a student design a product, create a piece of art, or develop a unique project, I’m here to inspire and guide them every step of the way. I believe in the power of curiosity and creativity, and I’m excited to help my students explore their interests and achieve their goals.\u003c/p\u003e","teachingVideoPlaybackId":"rRzFXYbj1VAD1jJKhsRI48JKq1ovMCo2mQ025f89W1zg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"48181393-49af-4858-9675-ee207d2ec8db\"}"},{"__ref":"Favorites:{\"uuid\":\"be833fcd-6b96-40c2-a358-82f28b8f6f7f\"}"}],"causesSupported":[],"major":"Product Design","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a6b370d4-c9fa-4b92-8569-0967d25e6e8c\"}"},{"__ref":"DeepDives:{\"uuid\":\"f85f907f-eb21-42d5-8885-7fff5a0fd899\"}"},{"__ref":"DeepDives:{\"uuid\":\"c115ad52-a8af-4638-ab74-911232d02c4c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b3af3ba9-197d-40d7-a376-25a324ebb657\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1cd04d5d-61fe-4271-ab57-eb0062611dc9/-/preview/-/format/jpg/","https://ucarecdn.com/51cea12f-e9b2-4663-b33c-ef82ea053a87/-/preview/-/format/jpg/","https://ucarecdn.com/2a7e0c10-c939-41ac-8b41-2fabe8d0fa06/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b478ec9c-5037-4167-a8cf-1c09bba685e5\"}"},{"__ref":"Education:{\"uuid\":\"e2fd4ae8-b34a-45a1-b660-bb91258aeae4\"}"}],"hiredAt":"2024-08-28T09:04:28.073Z","topics":["Product Design","STEM Project","Spanish","Visual Arts / Graphic Design","Film / Theater","Creative Writing","Academic Coaching","Video / Photography"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/c278d819-50e0-435a-a1b0-1b3a8793462f/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"danna-lenisgranada\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"deef38db-3b26-41e3-874f-831ce9f74357\"}"}}},"_sentryTraceData":"af4576734723483cb869b2af9fef1292-8cfbd8b51938f78d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=af4576734723483cb869b2af9fef1292,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"danna-lenisgranada"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew D
