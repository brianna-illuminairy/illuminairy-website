js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"27fefb0d-6ea9-4e0e-afd4-c400ec1a65e1\"}":{"__typename":"DeepDives","uuid":"27fefb0d-6ea9-4e0e-afd4-c400ec1a65e1","content":"\u003cp\u003eI chose mechanical engineering because I love building things and turning ideas into something real. One moment that really confirmed that for me was during an engineering summer program, where I designed a small automaton from scratch with no instructions.\u003c/p\u003e\u003cp\u003eI created two fencers that could move and “duel,” and I got really into figuring out how to make it work smoothly—testing materials, reducing friction, and improving the motion through trial and error. I remember completely losing track of time because I was so focused on solving each problem.\u003c/p\u003e\u003cp\u003eThat experience showed me that engineering isn’t just technical—it’s creative. And I still feel that now—I’m really enjoying my hands-on classes, especially manufacturing, where we’re actually building a Stirling engine by the end of the semester.\u003c/p\u003e\u003cp\u003eWhat I like most about mechanical engineering is how versatile it is—it gives me the tools to build, design, and make a difference in so many different areas. I’ve been especially interested in using engineering to create meaningful impact, like designing affordable medical devices and technologies that can help underserved communities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"26accec8-c98d-41df-8628-00a3bb3cca2e\"}":{"__typename":"DeepDives","uuid":"26accec8-c98d-41df-8628-00a3bb3cca2e","content":"\u003cp\u003eI’m motivated by using engineering to create solutions that empower communities like mine, where access may be limited but potential is limitless. As an immigrant and a woman of color in STEM, I’m drawn to human-centered design that combines functionality, creativity, and empathy. From building a self-operating automaton to developing assistive devices and tutoring underserved students, I’ve seen how thoughtful design can truly impact people’s lives.\u003c/p\u003e\u003cp\u003eA big part of my motivation also comes from my parents. They are the most hardworking and resilient people I know—building a life in a new country, working in a new language, and even pursuing graduate degrees in their 40s. Watching their perseverance pushes me to take every opportunity I’m given and to work toward a future where I can give back to them and support others along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"883738de-b0c8-44cb-a269-2661e58b2a96\"}":{"__typename":"DeepDives","uuid":"883738de-b0c8-44cb-a269-2661e58b2a96","content":"\u003cp\u003eMentorship matters to me because I’ve been both the tutor and the one being challenged to think deeper—sometimes by my own students.\u003c/p\u003e\u003cp\u003eI still remember tutoring a 5th grader named Olivia who kept asking, “Why?”—like, where does the Pythagorean theorem come from, and why do we even need it? At first, I was frustrated because I didn’t have great answers. But her curiosity pushed me to reflect and reconnect with what I loved about math in the first place—the “why” behind everything.\u003c/p\u003e\u003cp\u003eThat moment shifted how I approach mentorship. It’s not just about teaching content—it’s about helping students become curious, confident thinkers.\u003c/p\u003e\u003cp\u003eSince then, I’ve worked with students in many different settings—leading a nonprofit tutoring organization, teaching at Mathnasium, and mentoring underserved students. I focus on making learning meaningful by connecting concepts to real life and adapting to each student’s way of thinking.\u003c/p\u003e\u003cp\u003eWhat motivates me is seeing that shift—when a student goes from “Why do I have to learn this?” to actually being curious and engaged.\u003c/p\u003e\u003cp\u003eAt the end of the day, mentorship is how I turn my passion for problem-solving into something bigger—helping students build confidence, find their own “why,” and realize what they’re capable of.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a795ac3e-3a3f-4973-a491-d02c25ac049a\"}":{"__typename":"DeepDives","uuid":"a795ac3e-3a3f-4973-a491-d02c25ac049a","content":"\u003cp\u003eFrom filming a physics music video to painting my culture, I’ve always used art as a way to express myself—especially when I immigrated to the U.S. without knowing English. Art gave me a voice when words couldn’t.\u003c/p\u003e\u003cp\u003eBut as an LAUSD student, I saw that many students—especially from underserved communities—didn’t have access to the same creative opportunities. Even after California passed Proposition 28 to increase arts funding, I didn’t see real change in my school, which only offered two art classes. That pushed me to take action.\u003c/p\u003e\u003cp\u003eThrough the ACLU Youth Liberty Squad, I co-wrote an article advocating for equitable arts education for over 600,000 LAUSD students. My co-author and I shared our personal experiences—she wrote about not being able to pursue music, while I highlighted how many of my peers lacked access to basic art resources. We worked with attorneys and policy experts over months of revisions and research to strengthen our argument, and the article was eventually published on the MySchoolMyRights Youth Voices platform. Beyond writing, I spoke to the School Board, wrote letters to the Superintendent, and helped organize an Arts Justice Fest where hundreds of students could engage in creative activities.\u003c/p\u003e\u003cp\u003eThis advocacy opened my eyes to how meaningful change happens when creativity, leadership, and structured guidance come together—a lesson I carried into my work with Sunshine IA, a nonprofit tutoring organization I joined in 9th grade and later led as president. There, I guided over 100 volunteers to teach underrepresented students, organized educational camps, and ensured that every student could access quality learning opportunities. Like my arts advocacy, this project showed me that structured mentorship and creative problem-solving can empower communities and transform lives.\u003c/p\u003e\u003cp\u003eBoth experiences shaped how I see my future—not just as an engineer, but as someone who designs solutions that are creative, inclusive, and centered around real community needs.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"efaa1a6e-734a-4e7d-9ff6-3572d31e78fa\"}":{"__typename":"School","uuid":"efaa1a6e-734a-4e7d-9ff6-3572d31e78fa","name":"The Science Academy STEM Magnet Highly Gifted Highly Accelerated","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91601"},"Education:{\"uuid\":\"0005fbf6-b564-46cc-8e33-fc2a602f80a7\"}":{"__typename":"Education","uuid":"0005fbf6-b564-46cc-8e33-fc2a602f80a7","school":{"__ref":"School:{\"uuid\":\"efaa1a6e-734a-4e7d-9ff6-3572d31e78fa\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"d15b2bcc-226f-4e32-bb50-96053ae93eda\"}":{"__typename":"Education","uuid":"d15b2bcc-226f-4e32-bb50-96053ae93eda","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Mechanical Engineering and Applied Mechanics","degree":null},"MentorPublicProfile:{\"uuid\":\"a570da6c-d0eb-4cb0-8113-7e27f0700ae0\"}":{"__typename":"MentorPublicProfile","uuid":"a570da6c-d0eb-4cb0-8113-7e27f0700ae0","displayName":"Seoyoon L.","slug":"seoyoon-lee","biography":"\u003cp\u003eHi! My name is Seoyoon Lee, but you can call me Yoon. I’m currently a freshman studying mechanical engineering at the University of Pennsylvania, with a minor in engineering entrepreneurship. At my core, I’m someone who loves building things—not just physically, but also ideas, confidence, and opportunities for others.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eAbout me:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m passionate about using engineering to create meaningful, human-centered solutions. Growing up as an immigrant with English as my second language and a woman of color in STEM, I’ve always been aware that access to resources isn’t equal, but potential is. That perspective shapes both my work and my approach to mentorship: I aim to make learning feel empowering, approachable, and meaningful.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the past four years, I’ve:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConducted \u003cstrong\u003erobotics research at Penn’s GRASP Lab\u003c/strong\u003e, designing mechanisms for a soft vine robot with search-and-rescue applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilt \u003cstrong\u003eassistive devices for students with cerebral palsy\u003c/strong\u003e, focusing on affordable, real-world impact using CAD and prototyping tools\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLed a \u003cstrong\u003enonprofit tutoring organization\u003c/strong\u003e, managing 100+ volunteers and mentoring students one-on-one\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConducted \u003cstrong\u003ebiomedical research on Parkinson’s disease\u003c/strong\u003e, analyzing over 6,000 data points and presenting findings to a large audience\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAdvocated for \u003cstrong\u003e600,000+ students across LAUSD and California\u003c/strong\u003e, through \u003cstrong\u003epublishing an article\u003c/strong\u003e, speaking to board members, and writing letters\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese experiences taught me how to take an idea—from something small or uncertain—and turn it into something impactful and real.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eWhat I specialize in:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI mentor students in:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMath \u0026amp; STEM foundations\u003c/strong\u003e (middle school through high school)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEngineering \u0026amp; robotics projects\u003c/strong\u003e (CAD, prototyping, problem-solving)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003c/strong\u003e (research, nonprofits, or creative STEM ideas)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic confidence \u0026amp; mindset building\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI especially enjoy helping students who ask, \u003cem\u003e“When am I ever going to use this?”\u003c/em\u003e—and showing them how what they’re learning connects to the real world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eWhy I’m qualified to help you:\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship has been a huge part of my life. I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWorked as a \u003cstrong\u003emath instructor at Mathnasium for over two years\u003c/strong\u003e, teaching students of all levels (K-12 grades)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTaught a \u003cstrong\u003esummer program for incoming high school students\u003c/strong\u003e, helping them transition and build strong foundations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMentored \u003cstrong\u003ePhiladelphia high school students in math\u003c/strong\u003e, adapting to different learning styles and goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLed and \u003cstrong\u003ementored students in math for four years through a nonprofit organization\u003c/strong\u003e, while organizing and running educational camps for diverse learners.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcross these experiences, I’ve learned that every student learns differently. In our sessions, I focus on adapting to \u003cem\u003eyou\u003c/em\u003e—whether that means breaking concepts down step-by-step, connecting ideas to real-world applications, or building long-term projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking down difficult concepts in a clear, intuitive way\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConnecting what you’re learning to real-world applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming and planning a project based on your interests\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding confidence so you feel comfortable tackling challenges independently\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eOutside of engineering:\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI like playing tennis, exploring the city, trying new restaurants/cafes (I have over 100 reviews on Beli over the past year), and binging Korean dramas. Outside of academics, I enjoy expressing creativity through \u003cstrong\u003eart and design\u003c/strong\u003e, which has shaped how I approach problem-solving and innovation. Art was actually one of my first ways of communicating, and it continues to influence how I think about building things that are both functional and meaningful.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re curious, motivated, or even just trying to figure out what you enjoy, I’d love to help you explore your interests and build something you’re proud of.\u003c/p\u003e","teachingVideoPlaybackId":"get00hhcVkvBgytqPOOWjZF5y801qu2vSoYa02DlMSYtGo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering and Applied Mechanics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"27fefb0d-6ea9-4e0e-afd4-c400ec1a65e1\"}"},{"__ref":"DeepDives:{\"uuid\":\"26accec8-c98d-41df-8628-00a3bb3cca2e\"}"},{"__ref":"DeepDives:{\"uuid\":\"883738de-b0c8-44cb-a269-2661e58b2a96\"}"},{"__ref":"DeepDives:{\"uuid\":\"a795ac3e-3a3f-4973-a491-d02c25ac049a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7cc78e5a-3dfa-4ddc-b11d-778aad1f1451/-/preview/-/format/jpg/","https://ucarecdn.com/fea056d4-2f0e-4ffd-9ea8-d664b4598c4d/-/preview/-/format/jpg/","https://ucarecdn.com/1d30a8a2-3e49-47e1-9e5e-f9c12f9c7794/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0005fbf6-b564-46cc-8e33-fc2a602f80a7\"}"},{"__ref":"Education:{\"uuid\":\"d15b2bcc-226f-4e32-bb50-96053ae93eda\"}"}],"hiredAt":"2026-03-17T00:19:06.876Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Physics","Academic Coaching","College Essay Writing","History","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"seoyoon-lee\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a570da6c-d0eb-4cb0-8113-7e27f0700ae0\"}"}}},"_sentryTraceData":"576c8eaa0fb34383aa14039e6ecfb848-872846869828d9e0-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc
