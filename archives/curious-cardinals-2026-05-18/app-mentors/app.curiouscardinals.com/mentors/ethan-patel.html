xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2fc03a73-7f22-456c-aa36-8f62d0fe7fd1\"}":{"__typename":"DeepDives","uuid":"2fc03a73-7f22-456c-aa36-8f62d0fe7fd1","content":"\u003cp\u003eIf I could give advice to my younger self, it would be this: \u003cstrong\u003ebreathe.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI used to say yes to \u003cem\u003eevery \u003c/em\u003eopportunity that was handed to me—policy, engineering, architecture, you name it. I thought the more I did, the more successful I’d be. But in reality, I was spreading myself too thin and not going deep in the areas I actually cared about.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt wasn’t until my junior year that I learned how to \u003cstrong\u003ebe intentional\u003c/strong\u003e—to say yes only to opportunities that truly aligned with my interests and long-term goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat shift changed everything. I stopped chasing everything and started building things that actually mattered to me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd that’s exactly what I help students do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m here to help you figure out your \u003cstrong\u003e“why”\u003c/strong\u003e—what genuinely excites you—and then build a clear plan to go after it with focus and confidence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"257a230e-e6c6-4108-9452-1f0c61fc9b12\"}":{"__typename":"DeepDives","uuid":"257a230e-e6c6-4108-9452-1f0c61fc9b12","content":"\u003cp\u003eAs a first-generation college student, mentorship has meant everything to me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, I didn’t have a clear roadmap for things like building passion projects, navigating opportunities, or even understanding what was possible. \u003c/p\u003e\u003cp\u003eA lot of the time, I was figuring things out on my own—making mistakes, saying yes to the wrong things, and learning through trial and error.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat changed my trajectory was finding mentors who gave me \u003cstrong\u003eclarity, perspective, and direction\u003c/strong\u003e. They helped me think bigger, but also more strategically.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat’s why mentorship matters so much to me now.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI know what it feels like to have ambition but not always have guidance—and I want to be the person I wish I had earlier on. Someone who can help you cut through the noise, focus on what actually matters, and build something you’re genuinely proud of.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo me, mentorship isn’t just about advice—it’s about \u003cstrong\u003eunlocking opportunities, building confidence, and showing students what’s possible when they have the right support.\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"be27b0c1-ddf5-445f-bc39-fd7b48a9f67e\"}":{"__typename":"DeepDives","uuid":"be27b0c1-ddf5-445f-bc39-fd7b48a9f67e","content":"\u003cp\u003eFor me, it’s less about accomplishing a single “big goal” and more about how I feel looking back at my life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn my final days, I don’t want to be focused on titles, awards, or achievements. I want to feel like I actually created impact in this world—even if it was in the smallest form.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat could mean helping one student find direction when they felt lost, building one initiative that improved a community, or simply making someone believe their ideas mattered.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat matters most to me is knowing that I didn’t just exist—I \u003cstrong\u003econtributed\u003c/strong\u003e, I \u003cstrong\u003ebuilt\u003c/strong\u003e, and I left things a little better than I found them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a443539c-ba70-447b-8264-a55a0d3bf771\"}":{"__typename":"DeepDives","uuid":"a443539c-ba70-447b-8264-a55a0d3bf771","content":"\u003cp\u003eI chose Economics because I’m interested in how capital, incentives, and systems shape real-world outcomes—especially in impact investing, energy, and infrastructure.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough my humanitarian and social impact work in high school, I started to notice a consistent pattern: many of the problems communities face—whether in education access, healthcare, or economic opportunity—ultimately trace back to infrastructure gaps. Not just physical infrastructure, but also financial systems, institutional capacity, and long-term investment in communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat realization shifted how I think about change. I became less focused on short-term fixes and more interested in how capital can be deployed strategically to build sustainable systems that actually last.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStudying Economics, especially with a focus on impact investing, gives me the framework to understand how resources move, how decisions are made, and how markets can be leveraged to solve large-scale social problems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"0d7dc6fd-32bb-4333-87f0-c4f21d29436d\"}":{"__typename":"School","uuid":"0d7dc6fd-32bb-4333-87f0-c4f21d29436d","name":"North Bay Haven Charter Academy","city":"Panama City","type":"HIGH","state":"Florida","country":"United States","zip":"32404"},"Education:{\"uuid\":\"22fa68c1-91c0-4711-a154-3bd2253d435a\"}":{"__typename":"Education","uuid":"22fa68c1-91c0-4711-a154-3bd2253d435a","school":{"__ref":"School:{\"uuid\":\"0d7dc6fd-32bb-4333-87f0-c4f21d29436d\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"97eef91e-c177-4478-976c-a90dd1c87d73\"}":{"__typename":"Education","uuid":"97eef91e-c177-4478-976c-a90dd1c87d73","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"5a5b2d81-ae1a-4a4d-901f-1d29ba910271\"}":{"__typename":"MentorPublicProfile","uuid":"5a5b2d81-ae1a-4a4d-901f-1d29ba910271","displayName":"Ethan P.","slug":"ethan-patel","biography":"\u003cp\u003eHi! I’m Ethan, a student at the University of Pennsylvania studying Economics with a focus on impact investing, policy, and real-world problem solving. I work with students who want to turn big ideas into meaningful passion projects—especially in social impact, policy, business, and global development.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me:\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eNot too long ago, I was in your shoes—motivated, but unsure how to actually \u003cem\u003estart\u003c/em\u003e something meaningful.\u003c/p\u003e\u003cp\u003eSince then, I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFounded \u003cstrong\u003eRoots of Renewal\u003c/strong\u003e, a 501(c)(3) nonprofit operating in 7 countries, where I’ve led initiatives like:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFunding a deep water well in the West Nile Region of Uganda\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding education access programs in India\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLaunching mentorship programs for women in Brazil focused on financial literacy\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating community-based projects like Pakistan’s first all-female school library in Karachi\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eRaised \u003cstrong\u003e$10,000+ across multiple initiatives\u003c/strong\u003e, including disaster relief, clean water infrastructure, and education equity\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as \u003cstrong\u003eStudent Government President\u003c/strong\u003e, leading district-wide initiatives in voter registration, mental health, and disaster relief\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked with \u003cstrong\u003eU.S. congressional offices\u003c/strong\u003e through policy advocacy internships and national youth coalitions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDelivered a \u003cstrong\u003eTEDx Talk\u003c/strong\u003e on global political movements and polarization\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublished research in the \u003cstrong\u003eColumbia Journal of Science, Technology, Ethics, and Policy\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGraduated as \u003cstrong\u003eValedictorian\u003c/strong\u003e with a 4.826 GPA and \u003cstrong\u003e40+ AP/college-level courses\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese experiences weren’t just “resume builders”—they taught me how to take an idea, execute it, and scale it into something real.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI love helping students build projects that are both \u003cstrong\u003eimpactful and impressive\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSome areas I specialize in:\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e🌍 Social Impact \u0026amp; Nonprofits\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eStarting a nonprofit, initiative, or school club\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFundraising strategy + partnerships\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eScaling local ideas into global impact\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e📊 Policy, Advocacy \u0026amp; Research\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWriting research papers or policy briefs\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGetting published or entering competitions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTurning interests (like politics, law, or economics) into tangible projects\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e🚀 Passion Projects that Stand Out\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eProjects that combine storytelling + impact (blogs, campaigns, TED-style talks)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding initiatives that can lead to awards, recognition, or media features\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStructuring projects for college applications (without making them feel forced)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e🧭 Pathfinding \u0026amp; Direction\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFiguring out what you’re actually interested in\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConnecting your passions to real-world opportunities\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a cohesive “story” across your activities\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to mentor you\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI don’t just give advice—I’ve actually built the kinds of projects you’re trying to create.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve worked across nonprofits, policy, research, and leadership, and I know how overwhelming it can feel to go from \u003cem\u003eidea → execution\u003c/em\u003e. I’ve also mentored students through leadership programs, public speaking, and project development.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might look like:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurning a vague interest (“I care about inequality”) into a clear project idea\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMapping out a \u003cstrong\u003estep-by-step execution plan\u003c/strong\u003e with real milestones\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelping you \u003cstrong\u003ereach out to organizations, build partnerships, or get traction\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEditing essays, research, or presentations so they stand out\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGiving honest, strategic feedback (not just “this is great!”)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ll push you—but in a way that actually helps you grow.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch3\u003eOutside of all this…\u003c/h3\u003e\u003cp\u003eI’m big on \u003cstrong\u003efitness, running (former track athlete), and anything competitive\u003c/strong\u003e. I also love:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDebating random global issues\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWatching political documentaries and breaking them down\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTraveling and learning how different communities actually function\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAnd honestly… building things from scratch—that’s kind of my thing!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"6rKmYYyMako9sMxnxZPqzZtaq462MPtwfYuyqZgBlAY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2fc03a73-7f22-456c-aa36-8f62d0fe7fd1\"}"},{"__ref":"DeepDives:{\"uuid\":\"257a230e-e6c6-4108-9452-1f0c61fc9b12\"}"},{"__ref":"DeepDives:{\"uuid\":\"be27b0c1-ddf5-445f-bc39-f
