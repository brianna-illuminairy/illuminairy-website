xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ac587d84-d7bf-4c7d-8a75-0098d0448412\"}":{"__typename":"DeepDives","uuid":"ac587d84-d7bf-4c7d-8a75-0098d0448412","content":"\u003cbr\u003e\u003cp\u003eAfter the semester when I completed my first ever college computer science course, I wanted to see what I could do with what I learned. I knew I wanted to use Python to create some type of game, but I was unsure how I wanted to approach this problem and, more importantly, what game I wanted to create. One day I walked in on my little brother in our living room and asked him if he had a favorite game. He replied with “tic-tac-toe”, and I then knew I had to make it. Creating this game was a challenge, and I found myself going down a chain of stack overflow posts to fully understand how to implement this game. I was also able to utilize Python’s Turtle library, which I learned about during the semester, for this game. This was the first time I was able to apply computer science concepts I learned in the classroom to an actual project. While it was very difficult, it was fulfilling to complete. And I even still play it with my little brother to this day!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"565ab8a4-381b-4ce9-bcd0-6e962dee9b1a\"}":{"__typename":"DeepDives","uuid":"565ab8a4-381b-4ce9-bcd0-6e962dee9b1a","content":"\u003cbr\u003e\u003cp\u003eSomething that I am proud of is being a part of the high school 4x400 track \u0026amp; field relay team that broke the school record. While this happened long ago, it matters so much to me because of the adversities I faced before helping break this record. Coming into high school, my coaches had high expectations for me because of my middle school performance. Unfortunately, before the season started I had a season-ending injury during basketball season. I was disheartened because the doctors questioned if I would ever be able to compete on the track again. The recovery was very arduous, but after a year I was able to run again (exceeding even the doctor’s expectations). However, my return to the track was not what I expected. Being out of competition for a year was a difficult hurdle to overcome. I struggled my sophomore year and did not seem as if I would ever be able to perform as I was expected. During my junior year, however, things started to change. I became more comfortable and confident on the track, with the help of my teammates and coaches. We even went on to win a silver medal in the 4x400m at Texas Relays at UT Austin. I was running the best I ever had before, and it was a blessing I was able to be a part of that relay team. For me, it was a full circle moment of facing hardship, staying consistent with recovery, and believing in myself (despite what others may have thought). It is an experience I look back on whenever I feel disheartened when faced with a difficult task. But I now know to always bet on myself and put in the work to make my dreams come true!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c64d19e6-e5f8-4aa7-b5b5-901ab890747f\"}":{"__typename":"DeepDives","uuid":"c64d19e6-e5f8-4aa7-b5b5-901ab890747f","content":null,"videoPlaybackId":"564D3Uvqr43Z8cZVQJdEaDNjA2Wg00QZw8Y701o9H6PcU","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4a91c6e0-2a26-4e3f-83c8-f09e4ab1f41e\"}":{"__typename":"DeepDives","uuid":"4a91c6e0-2a26-4e3f-83c8-f09e4ab1f41e","content":null,"videoPlaybackId":"ldXe4JVMknLrxPUHgjtD2r7r5v9irXE6Qfmu02wfR9vU","question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"f3d06080-323b-4552-8c31-613fde8614b8\"}":{"__typename":"School","uuid":"f3d06080-323b-4552-8c31-613fde8614b8","name":"St. John's School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77019"},"Education:{\"uuid\":\"a22d10a7-5b6e-4738-baa1-51f5b03a6d35\"}":{"__typename":"Education","uuid":"a22d10a7-5b6e-4738-baa1-51f5b03a6d35","school":{"__ref":"School:{\"uuid\":\"f3d06080-323b-4552-8c31-613fde8614b8\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"aaa0c6f2-b756-49e5-abb7-ca05a9efea0d\"}":{"__typename":"Education","uuid":"aaa0c6f2-b756-49e5-abb7-ca05a9efea0d","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science \u0026 Neuroscience","degree":null},"Testimonial:863e4192-0b7e-473a-b3ae-0a66d7b0bfd0":{"__typename":"Testimonial","id":"863e4192-0b7e-473a-b3ae-0a66d7b0bfd0","text":"Aloye has been an incredible mentor for our son over the past several months!  We are very impressed and appreciative of how he combines teaching our son useful skills but also the way he communicates with him.  He really is excellent about subtly teaching him how to build a conversation, review ideas, formulate questions and we see that growth which is harder to see in a school environment.   We loved how Aloye is very intentional in how he communicates in the sessions-you can tell he is incredibly prepared with what he wants to cover, very organized, and creates the framework for our son to respond in like manner.  Aloye keeps the lessons interesting and engaging.  Our son really loves the sessions and is totally self motivated to do the work in between the sessions.  We can tell he really wants to show Aloye a strong work product which tells us he really cares what Aloye thinks.  That is a sign Aloye is doing a great job connecting and teaching.  We highly recommend Aloye!!","date":"2025-08-17 15:04:38.451+00","rating":5,"endorser":{"__typename":"Endorser","name":"JK","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"2a733234-93d2-4582-8eb0-12cfd67bca6d\"}":{"__typename":"MentorPublicProfile","uuid":"2a733234-93d2-4582-8eb0-12cfd67bca6d","displayName":"Aloye O.","slug":"aloye-oshotse-1","biography":"\u003cp\u003eMy name is Aloye Oshotse, and I recently graduated from Duke University with an interdepartmental major in Computer Science and Neuroscience. I’m excited to share my experiences and passions with you through Curious Cardinals as your mentor!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my time at Duke, I immersed myself in both fields that I love. In Computer Science, I honed my skills in coding, solving algorithms, and developing software. On the other side, my journey in Neuroscience was equally exciting. I had the opportunity to dive into fascinating research on how psychedelics affect the brain and behavior of zebrafish. This research not only expanded my knowledge of neurobiology but also allowed me to use my coding skills in a scientific setting, combining both of my academic interests uniquely.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I have a deep love for fashion, modeling, and music production. Fashion lets me experiment with style and express my identity, while modeling has given me confidence and a fresh perspective on the world. Music production is my creative outlet, where I blend technology with art to produce something that feels uniquely mine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs your mentor, I am committed to providing a holistic learning experience that goes beyond the classroom. I believe in the power of interdisciplinary learning and will encourage you to explore the intersections of your interests. Whether you’re passionate about coding, intrigued by the mysteries of the brain, or love the arts, I’m here to support you in discovering your path.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m looking forward to starting this mentorship journey with you and fostering your curiosity, creativity, and academic growth. Together, we can explore the exciting worlds of your interests. I’m eager to see what incredible things you will accomplish!\u003c/p\u003e","teachingVideoPlaybackId":"Ud69ilF3xqDZzMbWTi5CjTryh00qIN8U01JvivS00galao","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science \u0026 Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ac587d84-d7bf-4c7d-8a75-0098d0448412\"}"},{"__ref":"DeepDives:{\"uuid\":\"565ab8a4-381b-4ce9-bcd0-6e962dee9b1a\"}"},{"__ref":"DeepDives:{\"uuid\":\"c64d19e6-e5f8-4aa7-b5b5-901ab890747f\"}"},{"__ref":"DeepDives:{\"uuid\":\"4a91c6e0-2a26-4e3f-83c8-f09e4ab1f41e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5b5266b0-97a7-4c90-b402-4600d9ef396f/-/prev
