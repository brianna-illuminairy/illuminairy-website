ountry":"United States","zip":"94720"},"Education:{\"uuid\":\"0b6c6445-1dd3-4e98-83a2-e799a72c9807\"}":{"__typename":"Education","uuid":"0b6c6445-1dd3-4e98-83a2-e799a72c9807","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Bioengineering and Electrical Engineering and Computer Science (EECS)","degree":null},"Testimonial:d8fc91a6-1497-4207-b96c-584109a02735":{"__typename":"Testimonial","id":"d8fc91a6-1497-4207-b96c-584109a02735","text":"We are grateful to have Cael as Yash’s mentor. \nHis depth of knowledge, sincerity and genuine commitment to mentorship will have long lasting impact on Yash’s education al journey. \nI hope that he continues to guide Yash to bring passion project to completion.\nMany thanks Cael!","date":"2025-06-05 20:17:31.727+00","rating":5,"endorser":{"__typename":"Endorser","name":"Vaishali Ahire","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"7355e265-6c01-4afc-8765-27aaa7cb9e3c\"}":{"__typename":"MentorPublicProfile","uuid":"7355e265-6c01-4afc-8765-27aaa7cb9e3c","displayName":"Cael M.","slug":"cael-magner","biography":"\u003cp\u003eHi there! My name is Cael, and I’m a sophomore at UC Berkeley double-majoring in Bioengineering and Electrical Engineering \u0026amp; Computer Sciences (EECS). My academic interests revolve around the exciting intersection of artificial intelligence and clinical medicine, and I am passionate about leveraging technology to improve healthcare outcomes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I stay actively engaged with the academic and social community. I work in an artificial intelligence and robotics lab, where I gain hands-on experience in cutting-edge research. Additionally, I’m involved in my residential college’s student government, where I contribute to fostering a supportive and inclusive environment for students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not busy with academics or extracurricular activities, I enjoy staying active. Whether it’s lifting weights at the gym, going for a run, or swimming, I find exercise a great way to stay balanced and energized.\u003c/p\u003e\u003cp\u003eI’m excited about the opportunity to work with students on a variety of topics, from resume building to STEM subject tutoring. I believe in fostering curiosity and confidence in my students, tailoring my teaching approach to their individual needs and goals. Whether your child is seeking to improve their understanding of complex STEM concepts or looking for guidance in crafting a standout resume, I’m here to help. I look forward to working together and supporting your child’s growth and success!\u003c/p\u003e","teachingVideoPlaybackId":"c2Sg8G3BBvAooxFKLem3W01N00xl7sCZdfsaoZ3qm4qyc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"58f0847e-0821-45e8-8db4-e9601c1f6dcf\"}"},{"__ref":"Favorites:{\"uuid\":\"1d99b6c2-9887-4205-a69f-de7ab36344a1\"}"},{"__ref":"Favorites:{\"uuid\":\"ff0e12df-2c7f-4e5f-811a-f2424087ef9e\"}"},{"__ref":"Favorites:{\"uuid\":\"3e9555c6-5f02-4443-892c-569c065e3ebf\"}"}],"causesSupported":[],"major":"Bioengineering and Electrical Engineering and Computer Science (EECS)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"67c77996-34ad-42f5-a2ef-cd29c0b8ed01\"}"},{"__ref":"DeepDives:{\"uuid\":\"2fb0cb08-4371-4344-8e94-9e4b44733c21\"}"},{"__ref":"DeepDives:{\"uuid\":\"328da84c-1cb0-445a-a03a-7a84be02eb83\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/eaaf99db-3699-4723-a6d7-6fd820a88d71/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"16f5ff8f-a97c-49fa-a52a-f125891e556e\"}"},{"__ref":"Education:{\"uuid\":\"0b6c6445-1dd3-4e98-83a2-e799a72c9807\"}"}],"hiredAt":"2025-01-25T01:18:04.695Z","topics":[],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-f
