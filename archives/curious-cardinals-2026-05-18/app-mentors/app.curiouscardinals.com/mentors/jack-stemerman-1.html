xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"67047cc0-b0b6-4d9e-a739-c8b45815de97\"}":{"__typename":"CausesSupported","uuid":"67047cc0-b0b6-4d9e-a739-c8b45815de97","name":"Fist Generation Investors","description":"\u003cp\u003eTeach crucial financial literacy lessons to underprivileged high school seniors\u003c/p\u003e","photoUrl":"https://ucarecdn.com/fd53055b-23bb-4df8-8fe4-49895c0be874/"},"CausesSupported:{\"uuid\":\"313b74b3-51f6-4bff-93b3-e1fa0f59c49f\"}":{"__typename":"CausesSupported","uuid":"313b74b3-51f6-4bff-93b3-e1fa0f59c49f","name":"Building One Community","description":"\u003cp\u003eServed as an English as a Second Language Tutor and founded club in high school\u003c/p\u003e","photoUrl":"https://ucarecdn.com/af909750-2472-49dc-94bb-13b7f39fe62f/"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"82c157e3-2a16-48ad-bd68-5292d40b6813\"}":{"__typename":"DeepDives","uuid":"82c157e3-2a16-48ad-bd68-5292d40b6813","content":"\u003cp\u003eMy greatest source of motivation is my family. This is because my family roots for each other. To me, there is nothing I would like to see more than my family members succeed. Seeing them accomplish their goals, no matter how big or small, gives me so much joy, and I am motivated to pass on this joy to them by succeeding at all tasks I put in front of myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"1962c75a-5d72-45cb-8ac0-ab3a5f076bbe\"}":{"__typename":"DeepDives","uuid":"1962c75a-5d72-45cb-8ac0-ab3a5f076bbe","content":"\u003cp\u003eAs a middle school student, I cannot imagine there was a consensus description of me. To my parents, I'm sure I was a headache (but what middle school boy isn't!). They would say this because I could not stick to one thing. My schedule was always changing as I joined and dropped new scholastic groups, tried out new hobbies, and wanted to see my friends every day of the week. I'm sure middle school me was demanding, and I commend them for always saying yes! One of the best days of their parenthood was when I got my license.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo my teachers, I think I was driven but periodically unfocused. I was successful academically and always energetic in class, but my energy was occasionally misdirected. As I progressed in school, I learned how to focus my energy towards academics and open up appropriate outlets for relief.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo my coaches, they would say I was a good teammate. I was the player that loved playing defense, the player that passed before they shot, and the player that picked my teammates up when they were down.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo my friends, they'd say I was optimistic, which I think has not changed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"c693738f-97b3-490c-8d80-f64515c17f13\"}":{"__typename":"DeepDives","uuid":"c693738f-97b3-490c-8d80-f64515c17f13","content":"\u003cp\u003eI am extremely proud of the microscope I built during my summer at Rockefeller University. After my junior year of high school, I worked in a science lab in New York. I had a few projects, but the most interesting to me was building a laser-scanning microscope out of individual parts. There were a few reasons I was proud of this:\u003c/p\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003eIt is satisfying to see a tangible outcome as the result of your effort. This was my first ever internship and I commuted back and forth from New York every day. Seeing a function microscope as the fruits of my labor was incredible, and using it for the advancement of science made it that much more gratifying.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI worked with a team. Not just that, I was the most junior member of a team full of academics. Regardless, I felt valued, honored, and respected to be a member of their team.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIt worked! To this day, they are still using the microscope I helped build.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"5fea0be8-2562-4a44-8b56-b11ae874cc43\"}":{"__typename":"DeepDives","uuid":"5fea0be8-2562-4a44-8b56-b11ae874cc43","content":"\u003cp\u003eMy dream job is to be the General Manager of the New York Mets. My love for the Mets started at my great grandfather's house in Long Island. The highlight of every visit was sitting down in his Mets \"Fan Cave\" and watching a game with him. Since then, my love for the Mets has grown into a love for baseball holistically and a love of sports analytics.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5\"}":{"__typename":"School","uuid":"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5","name":"Brunswick School","city":"Greenwich","type":"HIGH","state":"Connecticut","country":"United States","zip":"06830"},"Education:{\"uuid\":\"d4567be4-733c-4675-aa84-10f8391cdc14\"}":{"__typename":"Education","uuid":"d4567be4-733c-4675-aa84-10f8391cdc14","school":{"__ref":"School:{\"uuid\":\"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"7c70a032-8be5-4266-be17-74fa94eff5af\"}":{"__typename":"Education","uuid":"7c70a032-8be5-4266-be17-74fa94eff5af","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"758169ab-3b0d-4447-820c-ba2efaa60783\"}":{"__typename":"MentorPublicProfile","uuid":"758169ab-3b0d-4447-820c-ba2efaa60783","displayName":"Jack S.","slug":"jack-stemerman-1","biography":"\u003cp\u003eHey! My name is Jack and I am a Junior at Yale majoring in Economics and I'd LOVE to be your mentor!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs the middle of five children, my life has been full of learning lessons and leading by example. There is nothing better in this world than older sisters, and I am lucky enough to have two of them! Throughout my life they have taught me crucial life lessons. I believe the most important takeaway has been how far kindness and patience can go (both of which I demanded a lot of :)). Luckily for my two younger brothers, I have tried my hardest to pass this down to them. I truly believe that through my family I have learned from the best and practice mentorship ever day.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore formally, though, I have been mentored throughout high school and college. In high school, I taught English as a Second Language at a local immigrant center in Stamford, CT. This presented unique challenges in the form of constructing curriculums and communication, but it was incredibly rewarding. Hearing the stories of immense hardships as well as overwhelming triumphs inspired me and is the main reason I seek to mentor today: I love building connections. In college, I teach crucial lessons in financial literacy to students at Achievement First High School in New Haven, CT. These students may not have the privilege of attending college like I do, so making sure they enter the workforce with an understanding of credit scores, basic investment advice, and more is integral to improving the New Haven Community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt school, when I am not studying, spending time with friends, or watching the New York Mets, I am on the rugby pitch. I have played sports throughout my life and it is one of my core beliefs that every person should be a member of a team. Whether it be athletics, academics, or extracurriculars, the bonds built through being a teammate are invaluable. I feel like mentorship is much more like being a teammate than being a coach and a player. Teammates work hard TOGETHER, and that's what makes the finished product so much more rewarding!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to academics, I pride myself on being leadership-oriented. In high school and college I founded service and academic clubs. I served as a member of student council and have held multiple roles within the Yale Men's Rugby Team.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe that my balance of school work, athletics, and extracurriculars, as well as an emphasis on cultivating relationships drives my excitement to be a mentor!\u003c/p\u003e","teachingVideoPlaybackId":"4O4CbZJUFbznyY007fiCziVyTSMUmk02ZTWp1O01twCLnE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"67047cc0-b0b6-4d9e-a739-c8b45815de97\"}"},{"__ref":"CausesSupported:{\"uuid\":\"313b74b3-51f6-4bff-93b3-e1fa0f59c49f\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"82c157e3-2a16-48ad-bd68-5292d40b6813\"}"},{"__ref":"DeepDives:{\"uuid\":\"1962c75a-5d72-45cb-8ac0-ab3a5f076bbe\"}"},{"__ref":"DeepDives:{\"uuid\":\"c693738f-97b3-490c-8d80-f64515c17f13\"}"},{"__ref":"DeepDives:{\"uuid\":\"5fea0be8-2562-4a44-8b56-b11ae874cc43\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/68c66ae2-5a5f-4a0e-89d3-333c4b0d2bdd/-/preview/-/format/jpg/","https://ucarecdn.com/d89f7500-7a14-434f-87f0-551e1d76bcfc/-/preview/-/format/jpg/","https://ucarecdn.com/2443cee6-50cf-4fb9-84ea-4417dbe8247e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d4567be4-733c-4675-aa84-10f8391cdc14\"}"},{"__ref":"Education:{\"uuid\":\"7c70a032-8be5-4266-be17-74fa94eff5af\"}"}],"hiredAt":"2024-09-10T09:30:07.782Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jack-stemerman-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"758169ab-3b0d-4447-820c-ba2efaa60783\"}"}}},"_sentryTraceData":"84dfddeaca44434b980972b327400702-ba36db5c4eb7fd94-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=84dfddeaca44434b980972b327400702,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jack-stemerman-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":f
