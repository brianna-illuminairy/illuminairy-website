xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"654356e4-cfd1-46b3-be08-a7f3d1a3593b\"}":{"__typename":"DeepDives","uuid":"654356e4-cfd1-46b3-be08-a7f3d1a3593b","content":"\u003cp\u003eFrom 2016 to 2020, I served as the Chief Executive Officer and Co-founder of 100words, a passion project that grew into a powerful force for positive change. With a deep commitment to making a difference in the lives of others, 100words became a platform that aimed to raise money for impoverished children internationally through the power of personal stories.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt 100words, we believe that every word has the power to inspire, connect, and impact lives. Our mission was to leverage the collective power of words to support those in need. As a federal 501(c)(3) non-profit, I obtained the official status necessary to carry out our vision without legal help.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUnited in our purpose, we brought together over 45 high school representatives from 22 different states. I led this effort with an amazing team. \u003cbr\u003e\u003cbr\u003eI would be very excited to help with your passion projects!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5a4f7eaf-e28f-4640-938a-35783f803ca3\"}":{"__typename":"DeepDives","uuid":"5a4f7eaf-e28f-4640-938a-35783f803ca3","content":"\u003cp\u003eChoosing the Biomedical Computation major was a transformative decision driven by a deep passion to address the pressing need for accessible medical care and a profound love for technology. Initially, I was drawn towards the premedical path, aspiring to become a doctor. The desire to make a positive impact in people's lives and improve healthcare accessibility fueled my journey.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs I delved deeper into the world of medicine, I began to recognize the pivotal role that technology plays in revolutionizing healthcare. I realized that by merging my passion for medicine with my love for tech, I could make a more significant and lasting impact on the healthcare landscape. This realization led me to discover the exciting and interdisciplinary field of Biomedical Computation.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough the Biomedical Computation major, I found the perfect blend of cutting-edge technology and its applications in the medical domain. This field offered a unique opportunity to explore the convergence of biology, medicine, and computer science. I was captivated by the potential of advanced statistics, computational biology, and artificial intelligence to drive groundbreaking research and innovative solutions in healthcare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"29c1e4ca-1f65-4ff0-81a1-b6466b82e2ac\"}":{"__typename":"School","uuid":"29c1e4ca-1f65-4ff0-81a1-b6466b82e2ac","name":"Dulles High School","city":"Sugar Land","type":"HIGH","state":"Texas","country":"United States","zip":"77478"},"Education:{\"uuid\":\"66a31e7e-e1af-4a14-a3ac-82fc2f529748\"}":{"__typename":"Education","uuid":"66a31e7e-e1af-4a14-a3ac-82fc2f529748","school":{"__ref":"School:{\"uuid\":\"29c1e4ca-1f65-4ff0-81a1-b6466b82e2ac\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7afe2e43-b66a-4cb1-8cab-52e20c6d9f3d\"}":{"__typename":"Education","uuid":"7afe2e43-b66a-4cb1-8cab-52e20c6d9f3d","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Biomedical Computation","degree":null},"MentorPublicProfile:{\"uuid\":\"8796e3fd-3cf1-499b-a8b7-f6d59e1aa412\"}":{"__typename":"MentorPublicProfile","uuid":"8796e3fd-3cf1-499b-a8b7-f6d59e1aa412","displayName":"Mariane M.","slug":"mariane-mousa","biography":"\u003cp\u003eGreetings! I'm Mariane, a Stanford alumni ('23) with an engineering degree in Biomedical Computation, which is the intersection of biology, medicine, and technology. I am an upcoming Software Engineer at Benchling: a biotechnology company based in Boston. My journey has been a fruitful mix of academic excellence, hands-on experience, and impactful leadership as I shifted from a pre-medicine path to biotechnology. I am first generation American as I am ethnically from the Middle East. \u003cbr\u003e\u003cbr\u003eFrom nonprofit work to navigating harder courses, I am experienced in leading others to success. I am prepared to help you reach your highest potential both academically and in your extracurriculars/hobbies. I have been tutoring for over 6 years, helping students achieve higher scores and deeper understanding in a wide range of subjects. In addition, I am an alto saxophone player, a former soccer referee of six years, a younger sister, and a proud owner of a Chihuahua named Lola. \u003cbr\u003e\u003cbr\u003eAcademically, I am available to teach math levels from elementary school to pre-calculus, all reading and writing levels, college test prep/applications, all levels of biology, and chemistry up to AP chemistry. In terms of passion projects, I am experienced in leading large organizations (100+ members!) that make an impact in minority communities and underrepresented groups. \u003cbr\u003e\u003cbr\u003eOne of my proudest achievements is leading 100words in high school. Please visit my deep dive to read more about it!\u003cbr\u003e\u003cbr\u003eAnother group I led is the Stanford chapter of QuestBridge, where I helped low-income, high achieving high schoolers apply to college and incoming college students with adjusting to college life. Through this club, I have helped students navigate the decision of what career path to pursue that matches their hobbies and goals. \u003cbr\u003e\u003cbr\u003eThank you for taking the time to read my profile. I am so excited to work as a mentor with you/your children!\u003c/p\u003e","teachingVideoPlaybackId":"qf7JcVA00PrdL00Elhw16ob028A1fMd3EsFdA00cDkpomHw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Computation","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"654356e4-cfd1-46b3-be08-a7f3d1a3593b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a4f7eaf-e28f-4640-938a-35783f803ca3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/80ee5225-85d1-408a-898e-1502892a2a60/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"66a31e7e-e1af-4a14-a3ac-82fc2f529748\"}"},{"__ref":"Education:{\"uuid\":\"7afe2e43-b66a-4cb1-8cab-52e20c6d9f3d\"}"}],"hiredAt":"2023-07-31T22:28:16.106Z","topics":["STEM Project","Computer Science","Biology","Chemistry","Statistics","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","Algebra II","Algebra I","Coding / Programming"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROO
