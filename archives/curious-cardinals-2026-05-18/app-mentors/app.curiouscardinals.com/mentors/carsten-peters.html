rship through this process and would love to pass it on via a project. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"bfe62aac-5c10-42f4-af00-7efd4f13c387\"}":{"__typename":"DeepDives","uuid":"bfe62aac-5c10-42f4-af00-7efd4f13c387","content":"\u003cp\u003eI believe mentorship is one of the most impactful ways you can make a difference in the world. It's the process of having the way paved for you as you find your way and then, in turn, paving the way for those behind you with your gained knowledge and experience. Not to mention, from my experience giving private lessons, it's so much fun to hear about something you taught working for them with a smile on their face!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"c76318a8-4724-4823-a1bc-943b07884040\"}":{"__typename":"School","uuid":"c76318a8-4724-4823-a1bc-943b07884040","name":"De La Salle High School","city":"Concord","type":"HIGH","state":"California","country":"United States","zip":"94518"},"Education:{\"uuid\":\"94305c02-3e2e-4c8a-8967-2962b9a0c820\"}":{"__typename":"Education","uuid":"94305c02-3e2e-4c8a-8967-2962b9a0c820","school":{"__ref":"School:{\"uuid\":\"c76318a8-4724-4823-a1bc-943b07884040\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"c405cbfc-bfc9-4283-a319-9b590913a3b8\"}":{"__typename":"Education"
