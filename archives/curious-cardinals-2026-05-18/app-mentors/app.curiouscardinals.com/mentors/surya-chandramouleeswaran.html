xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f737d99a-f917-4ed7-b7eb-8d3321afd92f\"}":{"__typename":"DeepDives","uuid":"f737d99a-f917-4ed7-b7eb-8d3321afd92f","content":"\u003cp\u003eMentorship is a great way to give back to a community that depends on incremental contributions of knowledge to ultimately improve the human condition. The problems we face as a society usually require solutions from a community of thinkers, fostered over multiple generations of accumulated thought and discovery. As a mentor, it's important to continue this fascination with the \"process of learning\" with the next generation so they can take our discoveries and implement them at an advanced level for more people to benefit. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ee1dcf40-509f-42d9-9fe7-7d536c587343\"}":{"__typename":"DeepDives","uuid":"ee1dcf40-509f-42d9-9fe7-7d536c587343","content":"\u003cp\u003eI love playing basketball in my free time! It helps that I'm tall, but it also is a great way to stay in shape and involves (in my opinion) a perfectly delicate balance of skill and athleticism. I've played at the HS varsity level, and most recently the club travel level in college, while also receiving offers to play at the D3 collegiate level. All the training associated with the sport (weights, cardio, shootarounds) are a great way for me to wind down after a long day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"67bab20b-089f-4232-83df-d9f45f49705c\"}":{"__typename":"DeepDives","uuid":"67bab20b-089f-4232-83df-d9f45f49705c","content":"\u003cp\u003eTowards my commitment to lifelong learning, my long-term goal is to teach at the university level as a professor. With this vision, I’ve worked as a teaching assistant (TA) since my freshman spring semester. My extensive time as a TA has solidified my love for teaching, and constitutes a significant part of my identity and personal goals. A place like Curious Cardinals emphasizes a commitment to advancing pedagogy, and if fortunate, I aspire to uphold this tradition of excellence in mentorship during my time there and beyond.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"a2789e60-e668-46fc-b7c5-1a0794a2f09f\"}":{"__typename":"DeepDives","uuid":"a2789e60-e668-46fc-b7c5-1a0794a2f09f","content":"\u003cp\u003eI still feel the same as I did back then. I would say people considered me mature beyond my years as a HS student. I believe that, in spite of changing environments, physically growing up, having to be on your own, etc. we're still governed by the same base instincts that define our identity. In HS, just as I am today, I was a diligent and detailed worker, both in the classroom and as an athlete. I had a rather quirky sense of humor which I made sure my friends (and sometimes unfortunately faculty) knew of, and I held myself to high standards in whatever tasks I undertook. I don't consider myself prodigious: I didn't participate in numerous clubs and athletic events and conferences like some other kids may have, but I prioritized building deep and meaningful experiences in the few extracurriculars I decided to pursue. And although things have definitely changed, I still find that mindset from HS is highly relevant to finding success in the present day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"dd11b422-c0a4-41c5-a658-ec42f1451082\"}":{"__typename":"School","uuid":"dd11b422-c0a4-41c5-a658-ec42f1451082","name":"BASIS Chandler","city":"Chandler","type":"HIGH","state":"Arizona","country":"USA","zip":"85248"},"Education:{\"uuid\":\"796640c7-db62-49bc-b8a3-024de392fbfc\"}":{"__typename":"Education","uuid":"796640c7-db62-49bc-b8a3-024de392fbfc","school":{"__ref":"School:{\"uuid\":\"dd11b422-c0a4-41c5-a658-ec42f1451082\"}"},"startYear":"2014","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"7ec4496f-cebc-423a-98e9-55659680dab1\"}":{"__typename":"Education","uuid":"7ec4496f-cebc-423a-98e9-55659680dab1","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"800b4346-9f0f-4ab0-ad6b-361f827321d7\"}":{"__typename":"MentorPublicProfile","uuid":"800b4346-9f0f-4ab0-ad6b-361f827321d7","displayName":"Surya C.","slug":"surya-chandramouleeswaran","biography":"\u003cp\u003eHey everyone! My name is Surya, and I'm studying Electrical and Computer Engineering at Carnegie Mellon. I plan to pursue my PhD starting in Fall 2025, and throughout my undergraduate years, I've been extensively involved in mentorship and tutoring opportunities. I'd love to help oversee the personal and professional development of students as they become the faces of our future society in topics ranging from the sciences to the humanities. In my free time, I enjoy playing basketball, rewatching classic TV shows, and eating pizza!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f737d99a-f917-4ed7-b7eb-8d3321afd92f\"}"},{"__ref":"DeepDives:{\"uuid\":\"ee1dcf40-509f-42d9-9fe7-7d536c587343\"}"},{"__ref":"DeepDives:{\"uuid\":\"67bab20b-089f-4232-83df-d9f45f49705c\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2789e60-e668-46fc-b7c5-1a0794a2f09f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1b27cc6e-aefd-48b5-be85-135d74b3a325/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"796640c7-db62-49bc-b8a3-024de392fbfc\"}"},{"__ref":"Education:{\"uuid\":\"7ec4496f-cebc-423a-98e9-55659680dab1\"}"}],"hiredAt":"2025-03-19T11:57:00.281Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Computer Science","Sports Journalism","Music","History Project","Finance / Investing","Coding / Programming","Sports Analytics","Web Design","STEM Project","Game Design","Machine Learning / AI","Law / Government / Policy"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"
