xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1ab3ad61-a5bd-46a6-9ee1-249efcf1077c\"}":{"__typename":"DeepDives","uuid":"1ab3ad61-a5bd-46a6-9ee1-249efcf1077c","content":"\u003cp\u003eGo for it. There’s nothing wrong with writing a cold email or just asking and seeing what happens, you never know after all. Honestly I could have done it more growing up but it has been so empowering now in college.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"177527c1-936c-49b3-9745-99858562122b\"}":{"__typename":"DeepDives","uuid":"177527c1-936c-49b3-9745-99858562122b","content":"\u003cp\u003eI am a very interdisciplinary person…so limiting myself to studying a single thing seemed impossible. In high school, I was in the honors tracks of math and science while taking the most advanced French and visual art seminars.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow at UChicago, in my humanistic studies, I have taken classes in departments ranging from Art History to Germanic Studies to Social Thought while also having space to minor in STEM/business and linguistic-based studies. As of now I am not 100% sure what my research will focus on but I am passionate about the relationship between image and text and studying the influence of the sublime on art, literature, and other cultural forms.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5b90b5ad-8dc3-4f7a-9ff8-fa156663f74b\"}":{"__typename":"DeepDives","uuid":"5b90b5ad-8dc3-4f7a-9ff8-fa156663f74b","content":"\u003cp\u003eMy greatest role models are my great grandfather Pa as his entrepreneurial pursuits utilized his academic passions and my grandmother Dit for managing her own business for forty years while raising three children and spending time with her family.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"5bfd1bc9-edbd-49b9-b47d-c1b36f799221\"}":{"__typename":"DeepDives","uuid":"5bfd1bc9-edbd-49b9-b47d-c1b36f799221","content":"\u003cp\u003eOne of the first passion projects I pursued in school was a semi-independent study in the last few weeks of my French Cinema seminar junior year. After analyzing the significance of film on French culture and recent history, I wrote my own screenplay in French, taking inspiration from La Nouvelle Vague.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, my biggest passion project is CLARA. It is a student organization I founded in the middle of my first year of college, where we host speakers working in creatively-oriented corporate careers. So far, we have hosted events with LVMH and the Chicago Fashion Coalition, and it has made me excited to see how much it has grown since it was just an idea in my head, and I cannot wait to see what will occur in the next two years! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"a0d0c3c1-bc28-4349-92e6-7fe3cf9ed573\"}":{"__typename":"School","uuid":"a0d0c3c1-bc28-4349-92e6-7fe3cf9ed573","name":"Grace Church School ","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10003"},"Education:{\"uuid\":\"5e1b756c-5d14-47cb-81c6-ff604d3b2038\"}":{"__typename":"Education","uuid":"5e1b756c-5d14-47cb-81c6-ff604d3b2038","school":{"__ref":"School:{\"uuid\":\"a0d0c3c1-bc28-4349-92e6-7fe3cf9ed573\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"33574907-38f6-4b00-9a09-937538bb84b1\"}":{"__typename":"School","uuid":"33574907-38f6-4b00-9a09-937538bb84b1","name":"University of Chicago","city":"Chicago","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60637"},"Education:{\"uuid\":\"fea87847-6cc0-42d4-a1bb-0c373159bcd2\"}":{"__typename":"Education","uuid":"fea87847-6cc0-42d4-a1bb-0c373159bcd2","school":{"__ref":"School:{\"uuid\":\"33574907-38f6-4b00-9a09-937538bb84b1\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Aesthetics and Criticism","degree":null},"MentorPublicProfile:{\"uuid\":\"35e2c743-5112-44c4-a6ec-daaff99d18b0\"}":{"__typename":"MentorPublicProfile","uuid":"35e2c743-5112-44c4-a6ec-daaff99d18b0","displayName":"Sophia F.","slug":"sophia-fodor-1","biography":"\u003cp\u003eSophia is a second year at the University of Chicago pursuing a self-designed degree in Aesthetics and Criticism with minors in Engineering Entrepreneurship and French and Italian.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOf Colombian and Hungarian heritage, she grew up in New York City, taking advantage of the city as her curriculum. Outside of an entirely advanced courseload, she interned at the Whitney Museum and New Museum, tutored with Publicolor, and took classes at the International Center of Photography, Penumbra Foundation, and Center of Book Arts, amongst others. Before graduating, Sophia helmed the art and literary magazine, ephemera, and published and presented research on the Cult(ure) of Art in the Third Reich.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt UChicago, she established and runs her own organization: CLARA, formally the Chicago Luxury and Retail Association, mentors middle school girls weekly with WYSE, and writes and edits for MODA, the fashion publication. Her writing has also been featured in Firebird Magazine and Post-X Zine and she currently holds positions at the Renaissance Society, Smart Museum, and Literary Publishing Lab. Last summer, she interned at Tiffany \u0026amp; Co. and was an RA for the Migration in Literature project at the Neubauer Collegium. She also runs her own weekly newsletter, sophstack, where she writes about culture and how it impacts her.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of these commitments, Sophia grew up playing bass guitar, loves to read, watch films and F1 (Forza Ferrari), and go to concerts. As an older sister, she enjoys seeing her siblings succeed in their passions and hopes for her mentees to discover theirs too. Her experiences as a tutor and mentor, along with her own journey of pursuing her own, has allowed her to understand the importance of support and patience.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Aesthetics and Criticism","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1ab3ad61-a5bd-46a6-9ee1-249efcf1077c\"}"},{"__ref":"DeepDives:{\"uuid\":\"177527c1-936c-49b3-9745-99858562122b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b90b5ad-8dc3-4f7a-9ff8-fa156663f74b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5bfd1bc9-edbd-49b9-b47d-c1b36f799221\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/148acaba-3dfb-42f2-bfe4-b442d2f65fea/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5e1b756c-5d14-47cb-81c6-ff604d3b2038\"}"},{"__ref":"Education:{\"uuid\":\"fea87847-6cc0-42d4-a1bb-0c373159bcd2\"}"}],"hiredAt":"2025-02-05T13:01:19.368Z","topics":["Algebra I","Pre-Algebra","K-5 Grade Math","Geometry","6-8 Grade Science","Biology","Writing","Spanish","French","College Essay Writing","Reading","Academic Coaching","History","Creative Writing","Film / Theater","Video / Photography","Fashion / Cosmetics","Visual Arts / Graphic Design","History Project","K-6 Storybook","Music","Business / Entrepreneurship","Journalism"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/fe18a7d8-d65b-4523-ab43-2a809d9f45e6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sophia-fodor-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"35e2c743-5112-44c4-a6ec-daaff99d18b0\"}"}}},"_sentryTraceData":"2cbcea2a1afd4648adb138101f63635f-be448ff6cec661c1-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2cbcea2a1afd4648adb138101f63635f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sophia-fodor-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.a
