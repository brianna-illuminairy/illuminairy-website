xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"8dc0cf43-f521-4359-91c1-17b6662b943a\"}":{"__typename":"CausesSupported","uuid":"8dc0cf43-f521-4359-91c1-17b6662b943a","name":"Boys and Girls Club, America","description":"","photoUrl":""},"CausesSupported:{\"uuid\":\"25e8fe03-18bd-4ac5-b908-08daa48fe705\"}":{"__typename":"CausesSupported","uuid":"25e8fe03-18bd-4ac5-b908-08daa48fe705","name":"Autism Allies","description":"","photoUrl":""},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f088c4f1-5a55-420b-a2c3-0c36bb169f0b\"}":{"__typename":"DeepDives","uuid":"f088c4f1-5a55-420b-a2c3-0c36bb169f0b","content":"\u003cp\u003eMy interest in economics and media studies ultimately stems from a deep desire to understand the complexities of human behavior and decision-making in the modern world. Economics provides insights into the factors that influence choices on both individual and societal levels, allowing me to explore the motivations behind financial and resource-based decisions. Meanwhile, media studies reveal how communication, culture, and the narratives we consume shape our perceptions and influence our actions. By combining these fields, I hope to gain a comprehensive understanding of how people think, what drives our choices, and how these decisions impact broader social and economic structures.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f9556d67-b4fd-4800-aaf3-9b92915eb460\"}":{"__typename":"DeepDives","uuid":"f9556d67-b4fd-4800-aaf3-9b92915eb460","content":"\u003cp\u003eI'd like to be a chief marketing officer or product manager at a large beauty, fashion, or luxury brand.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"347a6e2b-9bf6-43a2-adc0-deb36599f013\"}":{"__typename":"DeepDives","uuid":"347a6e2b-9bf6-43a2-adc0-deb36599f013","content":"\u003cp\u003eI believe that if I can make a meaningful impact on even one person, helping them see new possibilities for their future, I am playing a part in shaping a better world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"dcd1216a-2220-451f-918c-388394c30f1e\"}":{"__typename":"School","uuid":"dcd1216a-2220-451f-918c-388394c30f1e","name":"Shrewsbury High School","city":"Shrewsbury","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01545"},"Education:{\"uuid\":\"f8b76058-e167-40f0-bcf3-3ae51770d15c\"}":{"__typename":"Education","uuid":"f8b76058-e167-40f0-bcf3-3ae51770d15c","school":{"__ref":"School:{\"uuid\":\"dcd1216a-2220-451f-918c-388394c30f1e\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"a553eb5d-8133-4ba1-8450-ee5b38ac45f2\"}":{"__typename":"Education","uuid":"a553eb5d-8133-4ba1-8450-ee5b38ac45f2","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics \u0026 Media Studies, Minors in Educational Studies \u0026 Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"b1afaf40-9d08-4452-bd16-3962b518e335\"}":{"__typename":"MentorPublicProfile","uuid":"b1afaf40-9d08-4452-bd16-3962b518e335","displayName":"Shalini B.","slug":"shalini-biju","biography":"\u003cp\u003eShalini is a sophomore at UC Berkeley majoring in Economics \u0026amp; Media Studies with minors in Education and Engineering (with a concentration in digital studies, entrepreneurship, \u0026amp; technology). She loves anything creative – you can find her painting 10x12ft murals or dancing competitively. Shalini is a published poet; her critically-acclaimed debut anthology, \u003cem\u003eIris\u003c/em\u003e, is available in all major bookstores. She grew up in suburban Massachusetts, where she found passion in activism and public speaking. As a record-breaking 4-time state champion (across five different categories), and a two time national champion, she loves sharing awareness about issues that are important to her. During high school, she also interned as a Bank of America Student Leader, and is connected to a multitude of nonprofit organizations across the country, having worked at the Boys \u0026amp; Girls Club, Autism Allies, etc.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Berkeley, Shalini has continued to use her voice to amplify those who are underrepresented. As the vice president of The Women’s Network and a member of Berkeley Women in Business, she’s organized a multitude of events and used her marketing skills to further her mission. On campus, she’s also involved in finance, marketing, and consulting organizations. She loves design, fashion, and has continued to write and dance in her free time. She’s interned at The Massachusetts State Treasury as a Finance/Communications intern for two years and has worked at a consulting company. Shalini has even had the opportunity to travel to Europe for two months where she founded an AI-based startup (which was a finalist for a 25K scholarship)!\u0026nbsp; Through her education minor, she’s also taught students from kindergarten through high school! She’d love to help your student, and has experience working with students of all ages, backgrounds, learning styles, and abilities.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"GXZVP6S009OUtiJ6Fks201gQYAwjyKf00hANBeJYDOpHdA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8dc0cf43-f521-4359-91c1-17b6662b943a\"}"},{"__ref":"CausesSupported:{\"uuid\":\"25e8fe03-18bd-4ac5-b908-08daa48fe705\"}"}],"major":"Economics \u0026 Media Studies, Minors in Educational Studies \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f088c4f1-5a55-420b-a2c3-0c36bb169f0b\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9556d67-b4fd-4800-aaf3-9b92915eb460\"}"},{"__ref":"DeepDives:{\"uuid\":\"347a6e2b-9bf6-43a2-adc0-deb36599f013\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/90c602ce-5fe2-45a1-9371-0d98ed768bb5/-/preview/-/format/jpg/","https://ucarecdn.com/d7245c3c-b7e8-41da-83b5-dc82b67ec753/-/preview/-/format/jpg/","https://ucarecdn.com/b06b5d3e-c82b-43e7-b2f7-68d2ce11fc09/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f8b76058-e167-40f0-bcf3-3ae51770d15c\"}"},{"__ref":"Education:{\"uuid\":\"a553eb5d-8133-4ba1-8450-ee5b38ac45f2\"}"}],"hiredAt":"2024-09-29T12:06:10.286Z","topics":["Writing","Academic Coaching","College Essay Writing","Reading"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/9a4c114f-3114-4d6c-908a-b4d35953934d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":t
