fca3fcca-75cc-4cb0-bb04-4fc7ba27d616","content":"\u003cp\u003eI am proud of publishing a clinical communication to the editor, entitled \u003cem\u003eLost in Translation\u003c/em\u003e, in the American Journal of Medicine this year. I wrote a short case study about my healthcare experience in a foreign country, contributing to the ongoing conversation about intercultural communication challenges and patient centered care. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"de74f7ff-f77e-4391-8496-942d726396a9\"}":{"__typename":"DeepDives","uuid":"de74f7ff-f77e-4391-8496-942d726396a9","content":"\u003cp\u003eA passion project I am currently working on is the Personalized Playlist Project at Yale New Haven Hospital. I work administratively and volunteer to make personalized Spotify music playlists for patients in the geriatric ward of the hospital. I collaborate closely with resident physicians and nurses to enhance patient care and their hospital experience. I am currently drafting a manuscript with project leads publish the results of the pilot.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"bc674d0a-28f6-46fc-9633-f7f4bcf9dde6\"}":{"__typename":"DeepDives","uuid":"bc674d0a-28f6-46fc-9633-f7f4bcf9dde6","content":"\u003cp\u003eMy greatest role model is my grandma. She was born in a small city in Gorgan, Iran, and eventually became the first female doctor from her city. After immigrating to the United States, she became a practicing OBGYN physician in her second language and helped many of her families settle in America. I hope to emulate her drive and resilience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0049582f-367f-4548-99a4-c7d82da0317f\"}":{"__typename":"DeepDives","uuid":"0049582f-367f-4548-99a4-c7d82da0317f","content":"\u003cp\u003eMy spare time is very important to me - I love being social and trying new things/adventures. Food and music are my priorities; I love to both create and consume. I love outdoor activities on the water, such as stand up paddle boarding. I also love cats!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"4b07ef42-819f-461f-9ee3-364ff16a926a\"}":{"__typename":"School","uuid":"4b07ef42-819f-461f-9ee3-364ff16a926a","name":"Guilford High School","city":"Guilford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06437"},"Education:{\"uuid\":\"b13ec1af-9ed8-48a0-9aca-33f160708828\"}":{"__typename":"Education","uuid":"b13ec1af-9ed8-48a0-9aca-33f160708828","school":{"__ref":"School:{\"uuid\":\"4b07ef42-819f-461f-9ee3-364ff16a926a\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"381b5340-469a-4346-888d-e031a73c2394\"}":{"__typename":"Education","uuid":"381b5340-469a-4346-888d-e031a73c2394","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology and Society","degree":null},"MentorPublicProfile:{\"uuid\":\"9669d24f-2cc0-4279-b723-5c7a50eddd10\"}":{"__typename":"MentorPublicProfile","uuid":"9669d24f-2cc0-4279-b723-5c7a50eddd10","displayName":"Sophia R.","slug":"sophia-ruser","biography":"\u003cp\u003eHi! My name is Sophia Ruser, and I am a recent graduate of Cornell University, where I majored in Biology and Society. During college, I worked in the IvanekLab, a quantitative food safety and epidemiology lab, where I led a national survey study on raw milk consumption and consumer risk perception. I also contributed to the development of a digital library of reusable food safety models intended to improve access to validated tools for researchers and educators. Through this work, I gained experience in study design, data analysis, literature synthesis, and translating research findings for public health audiences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince graduating, I have continued to work across research, writing, and community engagement. I have co authored peer reviewed publications, presented research at academic conferences, and contributed to interdisciplinary projects at the intersection of health, behavior, and technology. My recent publications include a clinical communication to the editor in the American Journal of Medicine and a narrative medicine piece in the Journal of the American Geriatrics Society. The narrative focused on my work with the Personalized Playlist Project at Yale, where I supported hospitalized geriatric patients by creating individualized Spotify playlists to enhance patient experience and engagement during inpatient stays.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of research, I am involved in several community based initiatives. In Ithaca, I founded Restorative Rhythms, a volunteer music group that performs weekly at a local senior living facility. I have also helped develop ESL and culinary job training programs for refugee and immigrant communities in New Haven. During college, I served as president of the Persian Students Organization, where I organized cultural events, speaker panels, and fundraisers. For the past two years, I have mentored high school students nationwide as an Ignite Fellow with Teach for America, supporting academic enrichment and college readiness. I have also spent multiple summers working with Integrated Refugee and Immigrant Services as a music teacher, tutor, and school preparedness coach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy long term goal is to attend medical school, and I am very familiar with the pre medical pathway. This year, I will be working as a clinical research associate in the Department of Rheumatology at Yale New Haven Hospital, focusing on systemic sclerosis outcomes research. In parallel, I am involved with the Yale Neighborhood Health Project, where I assist with community based preventive health screenings. I am excited to meet everyone and look forward to learning from and contributing to this community.\u003c/p\u003e","teachingVideoPlaybackId":"UcYaFngp7q2U2WMvIsLrgyGH6tWfvcPbACnhs96XjhQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement is founding a club at Cornell University, called Restorative Rhythms, that plays music at a nursing home weekly. It represents an integral part of my college experience and the legacy I hope to leave at my university.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"36924ae5-2956-4c7c-8fce-9f78d38758e3\"}"},{"__ref":"Favorites:{\"uuid\":\"7ee35a1d-0854-4d68-8e0e-08b07d3e1157\"}"},{"__ref":"Favorites:{\"uuid\":\"3e0a881f-9401-4f2f-ac54-adca0f6bb924\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"27b8178d-2a97-4b3d-b6c3-4b08520c619f\"}"},{"__ref":"CausesSupported:{\"uuid\":\"881e3bfc-48d8-4f6e-8a5e-4ab9739912c4\"}"}],"major":"Biolo
