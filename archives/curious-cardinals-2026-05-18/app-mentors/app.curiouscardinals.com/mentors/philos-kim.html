xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"87a26dba-030c-41bb-9ba0-6fcfd4319ebf\"}":{"__typename":"DeepDives","uuid":"87a26dba-030c-41bb-9ba0-6fcfd4319ebf","content":"\u003cp\u003eDon't focus too much on taking AP classes or doing well on standardized tests! I think that high school is a great time to really start exploring what you're passionate about. It's a lot more rewarding to spend time growing as a person than it is to stress out over grades and test scores. That being said, colleges also love to see passionate and interesting applicants too!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a412cc7f-6487-4ae1-ae34-db924828169a\"}":{"__typename":"DeepDives","uuid":"a412cc7f-6487-4ae1-ae34-db924828169a","content":"\u003cp\u003eI recently finished my senior thesis in mathematics, titled \"The Monodromy Representation of 4-Manifold Surface Bundles with Several Fiberings\". Pursuing this project was an amazing opportunity to explore what research-level mathematics is all about!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"487b13d0-aaae-4573-9ac4-1339394a45c5\"}":{"__typename":"DeepDives","uuid":"487b13d0-aaae-4573-9ac4-1339394a45c5","content":"\u003cp\u003eMy dream is to become a research mathematician. The standard path is to achieve university tenure, but it could also include working in cutting edge research organizations in industry, such as OpenAI, Bell Labs, or the NSA.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5da4970e-10a0-4ac8-8c33-77fa0cd86cf0\"}":{"__typename":"DeepDives","uuid":"5da4970e-10a0-4ac8-8c33-77fa0cd86cf0","content":"\u003cp\u003eIn high school, I was actually just as interested in astrophysics as I was in mathematics. One summer, I participated in an astrophysics research program in New Mexico called the Summer Science Program. Before that, I did a research internship at the Harvard-Smithsonian Center for Astrophysics.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a\"}":{"__typename":"School","uuid":"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a","name":"Cambridge Rindge \u0026 Latin School","city":"Cambridge","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"7ddf22e0-3fc0-4676-bf01-4f920be27ad0\"}":{"__typename":"Education","uuid":"7ddf22e0-3fc0-4676-bf01-4f920be27ad0","school":{"__ref":"School:{\"uuid\":\"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"4ea4cfde-5419-4061-bd2c-fc7ffe834b52\"}":{"__typename":"Education","uuid":"4ea4cfde-5419-4061-bd2c-fc7ffe834b52","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"7922ce91-3c1b-4594-9caf-c4d8286621a9\"}":{"__typename":"MentorPublicProfile","uuid":"7922ce91-3c1b-4594-9caf-c4d8286621a9","displayName":"Philos K.","slug":"philos-kim","biography":"\u003cp\u003eHello! My name is Philos, and I'm a senior at Yale majoring in mathematics. My specializations are in geometric topology and differential geometry, which are the study of generalizations of curves and surfaces. At Yale, I have previously served as the treasurer and organization liaison of the Undergraduate Math Society, and I have also been a teaching assistant for multiple classes in math. After graduation, I plan to pursue a PhD in mathematics.\u003cbr\u003e\u003cbr\u003eAs a mentor, my first priority is to nurture genuine passion and interest for mathematics. I believe that the standard secondary curriculum de-emphasizes the beauty and intuition behind math in favor of memorizing formulas and rote practice. Advanced students will hence often find themselves bored with their classes. For these students, I am qualified to teach highly advanced subjects that will be a gateway to university-level pure and applied math. This includes advanced calculus, linear algebra, and machine learning. At the other end of the spectrum, I believe that students who are struggling in their coursework will equally benefit from learning math in a thought-provoking and engaging way. For these students, I will make sure to nurture a sense of confidence in math by supplementing their classes in school with problems that enhance intuition, rather than memorization. Through my own experience applying this method of learning in high school, I achieved perfect scores of 36 on the ACT math section, 800 on the SAT Math subject test, as well as a 5 on the AP Calculus BC exam.\u003c/p\u003e","teachingVideoPlaybackId":"VJdedXRivabj89YGabsQl02yyFtyMgPghwW9N5F5ZMys","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"87a26dba-030c-41bb-9ba0-6fcfd4319ebf\"}"},{"__ref":"DeepDives:{\"uuid\":\"a412cc7f-6487-4ae1-ae34-db924828169a\"}"},{"__ref":"DeepDives:{\"uuid\":\"487b13d0-aaae-4573-9ac4-1339394a45c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"5da4970e-10a0-4ac8-8c33-77fa0cd86cf0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/454af486-cce8-46e2-811f-7e615819ea4d/-/preview/-/format/jpg/","https://ucarecdn.com/c64aeb8a-92f9-4036-a829-739ef6517774/-/preview/-/format/jpg/","https://ucarecdn.com/f18d8cd3-5ebd-45bc-b3f0-4b3620384dc0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"7ddf22e0-3fc0-4676-bf01-4f920be27ad0\"}"},{"__ref":"Education:{\"uuid\":\"4ea4cfde-5419-4061-bd2c-fc7ffe834b52\"}"}],"hiredAt":"2024-01-17T14:35:03.800Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"philos-kim\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7922ce91-3c1b-4594-9caf-c4d8286621a9\"}"}}},"_sentryTraceData":"3702869958cc49b1ba5e3e8e878d1eee-b62e001e8a115d92-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3702869958cc49b1ba5e3e8e878d1eee,sentry
