xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b4ca6fff-d7bf-4635-b69b-51c8f773b061\"}":{"__typename":"DeepDives","uuid":"b4ca6fff-d7bf-4635-b69b-51c8f773b061","content":"\u003cp\u003eI spend my spare time creating as much as possible; I crochet, sketch, and paint in my room or at any free workshop on campus. Truth be told, though, I love a good book. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6f539d4e-e4c3-4c72-9312-9769e942beec\"}":{"__typename":"DeepDives","uuid":"6f539d4e-e4c3-4c72-9312-9769e942beec","content":"\u003cp\u003eIt will be harder before it is easier, but it will get easier. From training as an all-star cheerleader to getting involved in classwork, high school was daunting. After getting through the rough patches of my early education, I've learned to trust the process and know I'll be proud of my journey when I look back. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2618e237-132b-4a71-9c75-9dc507bcb889\"}":{"__typename":"DeepDives","uuid":"2618e237-132b-4a71-9c75-9dc507bcb889","content":"\u003cp\u003eI decided my major in 3rd grade, reading a children's solar system encyclopedia. My nine-year-old self was like, \"This is cool!\" and my parents bought me more books, took me to museums, and I eventually went to Space Camp. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"18870a7d-e4f9-438f-8dda-859828a19516\"}":{"__typename":"DeepDives","uuid":"18870a7d-e4f9-438f-8dda-859828a19516","content":"\u003cp\u003eI adore Sally Ride. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy professor has the privilege of having her as his TA in college. The stories of her passion and personality are one of my inspirations. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"a337af52-4633-4177-875e-37d93bd888ff\"}":{"__typename":"School","uuid":"a337af52-4633-4177-875e-37d93bd888ff","name":"University School of Jackson","city":"Jackson","type":"HIGH","state":"Tennessee","country":"United States","zip":"38305"},"Education:{\"uuid\":\"1935314c-e79a-45c1-9578-cab0b7ecd5a9\"}":{"__typename":"Education","uuid":"1935314c-e79a-45c1-9578-cab0b7ecd5a9","school":{"__ref":"School:{\"uuid\":\"a337af52-4633-4177-875e-37d93bd888ff\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"02c6dd7e-e39f-401a-b5b0-af9b0177424d\"}":{"__typename":"Education","uuid":"02c6dd7e-e39f-401a-b5b0-af9b0177424d","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering and Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"f86a6a08-9371-483f-b146-b3c5093c9b0a\"}":{"__typename":"MentorPublicProfile","uuid":"f86a6a08-9371-483f-b146-b3c5093c9b0a","displayName":"Cassidy B.","slug":"cassidy-bruno","biography":"\u003cp\u003eCassidy is a Duke University student double majoring in Mechanical Engineering and Physics. She grew up in rural Tennessee, where she developed a deep curiosity about how the universe works—especially through the lens of science, art, and design.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHer academic interests lie at the intersection of aerospace design and high-energy physics, and she’s passionate about bringing creativity into engineering. With a background in studio art, Cassidy is especially drawn to using visual problem-solving in her technical work. One of her favorite projects has been designing and building a hydrofoil kayak, where she led the development of the main wing system, integrated a propeller and custom aileron servo mechanism to help stabilize flight over water.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCassidy is equally passionate about STEM education and outreach. In high school, she founded an astronomy club that grew to over 140 members and has continued to stay involved as a guest instructor for campus outreach events at Duke. Her teaching experience includes working as a Math and English tutor, a K–8 art teacher with the Boys and Girls Club, a camp counselor at the U.S. Space and Rocket Center, and a STEM instructor for the Duke Innoworks program.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up in a rural area shaped her commitment to creating access to enriching, hands-on STEM experiences. She believes that curiosity, creativity, and opportunity should never be limited by where you grow up.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, Cassidy serves as Social Chair for Duke Club Rowing, where she helps build community and coordinate team events. She also enjoys hands-on building projects, being outdoors, and exploring her creative side through art classes.\u003c/p\u003e","teachingVideoPlaybackId":"y2uY35fqgGpDrreQiw2sT801KyhrwPKw64dRH101WeTgA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering and Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b4ca6fff-d7bf-4635-b69b-51c8f773b061\"}"},{"__ref":"DeepDives:{\"uuid\":\"6f539d4e-e4c3-4c72-9312-9769e942beec\"}"},{"__ref":"DeepDives:{\"uuid\":\"2618e237-132b-4a71-9c75-9dc507bcb889\"}"},{"__ref":"DeepDives:{\"uuid\":\"18870a7d-e4f9-438f-8dda-859828a19516\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a758bddd-1b85-46d8-b7d9-a1336432ae4c/-/preview/-/format/jpg/","https://ucarecdn.com/8933a7f0-0567-4f48-8a09-90850a6cbae8/-/preview/-/format/jpg/","https://ucarecdn.com/30e7acd9-fc60-47e2-81d9-8d855417392d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1935314c-e79a-45c1-9578-cab0b7ecd5a9\"}"},{"__ref":"Education:{\"uuid\":\"02c6dd7e-e39f-401a-b5b0-af9b0177424d\"}"}],"hiredAt":"2025-05-01T17:42:24.793Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","Physics","Biology","6-8 Grade Science","Writing","Spanish","College Essay Writing","Academic Coaching","Executive Function"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"cassidy-bruno\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f86a6a08-9371-483f-b146-b3c5093c9b0a\"}"}}},"_sentryTraceData":"1c3b07cad5494a0c8
