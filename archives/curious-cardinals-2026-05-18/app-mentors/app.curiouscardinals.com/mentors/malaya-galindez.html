xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2e626078-1a8d-4eb1-984f-88961691f433\"}":{"__typename":"Favorites","uuid":"2e626078-1a8d-4eb1-984f-88961691f433","photoUrl":"https://ucarecdn.com/d2cbabdb-fa8c-4d08-a94c-2fe9d26fdf8f/","title":"Mean Girls","type":"MOVIE"},"Favorites:{\"uuid\":\"d688e317-a91f-4b9e-bbec-673fedded6c6\"}":{"__typename":"Favorites","uuid":"d688e317-a91f-4b9e-bbec-673fedded6c6","photoUrl":"https://ucarecdn.com/e43a8ccf-58c1-43fb-9448-936f1df819b3/","title":"Paris, France","type":"CITY"},"Favorites:{\"uuid\":\"3add86da-94fc-4c59-8007-ef416c1afe70\"}":{"__typename":"Favorites","uuid":"3add86da-94fc-4c59-8007-ef416c1afe70","photoUrl":"https://ucarecdn.com/a74839c3-4f67-431c-98d4-b89820606002/","title":"A Storm of Swords by George R.R. Martin","type":"BOOK"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d224e617-1e25-4ba0-9f67-e61bf48d6951\"}":{"__typename":"DeepDives","uuid":"d224e617-1e25-4ba0-9f67-e61bf48d6951","content":"\u003cp\u003eAs a high schooler and college underclassman, my older classmates were so instrumental to my success and helped me find what activities and passions I wanted to pursue! I'm so excited to be a Curious Cardinals mentor because I want to \"pay it forward\" and now be that mentor figure for your student :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"54e25a3f-6096-4229-ab8b-dacb80db8cd9\"}":{"__typename":"DeepDives","uuid":"54e25a3f-6096-4229-ab8b-dacb80db8cd9","content":"\u003cp\u003eI love to unwind in my spare time by listening to music (fav artists include Japanese Breakfast, Phoebe Bridgers, and Taylor Swift), chilling at the beach with friends, and practicing juggling!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fb3337c2-9612-4f96-a708-0ccf2cde3a77\"}":{"__typename":"DeepDives","uuid":"fb3337c2-9612-4f96-a708-0ccf2cde3a77","content":"\u003cp\u003eI chose Health and Human Sciences as my major because my professional goal is to become a physician that understands the social determinants of health. My major covers all of the classic pre-med courses such as chemistry and biology, but also gives me the opportunity to take cool, more specialized classes like medical sociology.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c935eac5-f375-40ed-b898-a6c1ddf96e96\"}":{"__typename":"DeepDives","uuid":"c935eac5-f375-40ed-b898-a6c1ddf96e96","content":"\u003cp\u003eI would tell my younger self two main things: first, that it's totally OK to not know what I want to pursue professionally, and second, that I should prioritize extracurriculars and hobbies that I am genuinely passionate about. I feel that there exists a lot of pressure today for students to have a set plan of what they want to study in college and what field they want to eventually work in, but your direction will come to you over time and as you gather more experience with a wide variety of classes and activities that you enjoy. It's important to strike a balance between academic and extracurricular excellence with taking the time to enjoy each day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"0da2d945-475c-4b7f-be4e-ddf94df4d7c3\"}":{"__typename":"School","uuid":"0da2d945-475c-4b7f-be4e-ddf94df4d7c3","name":"Eastview High School","city":"Apple Valley","type":"HIGH","state":"Minnesota","country":"United States","zip":"55124"},"Education:{\"uuid\":\"5e016f08-c2ac-474f-8c32-1d158dd75d86\"}":{"__typename":"Education","uuid":"5e016f08-c2ac-474f-8c32-1d158dd75d86","school":{"__ref":"School:{\"uuid\":\"0da2d945-475c-4b7f-be4e-ddf94df4d7c3\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"9ca61c46-e6af-4e26-a5cd-3744e3afdc0a\"}":{"__typename":"Education","uuid":"9ca61c46-e6af-4e26-a5cd-3744e3afdc0a","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Health and Human Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"f97d8e47-baa4-41ac-be8c-f1249d66e224\"}":{"__typename":"MentorPublicProfile","uuid":"f97d8e47-baa4-41ac-be8c-f1249d66e224","displayName":"Malaya G.","slug":"malaya-galindez","biography":"\u003cp\u003eHi there! I’m Malaya, a junior at the University of Southern California who is majoring in Health and Human Sciences on the pre-medical track with a minor in Comedy Performance. I am a Presidential Scholar, and receive a half tuition scholarship to use for my studies. My ultimate professional goal is to become a physician who honors the humanistic nature of healthcare.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy interdisciplinary major and minor in comedy has enabled me to take a diverse range of classes including nutritional biochemistry, public health and international relations, and even my medical clowning. I apply what I learn about human-centered medicine through volunteering with Mobile Clinic at USC, a club that hosts free hypertension and diabetes screenings at homeless shelters located on Skid Row. I’m also a research assistant at the USC Keck School of Medicine, and I’m currently working on a project that analyzes events when hospitals provided poor care for patients experiencing psychiatric emergencies. I care deeply about fostering genuine connections with people from all walks of life, and I’m extremely interested in topics such as health equity and the social determinants of health.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough medicine is my career goal, another academic area that excites me is politics and government. I was captain of my high school's competitive debate team of over 90 people, and right now I'm interning with the National Civic League to contribute to a project identifying and mapping democratic organizations across the US. Politics and legislation greatly affects access to healthcare -- I try to bridge the gap between uninsured individuals and care by volunteering through Southern California Healthcare Outreach, a group at USC that hosts events at community centers to enroll people in healthcare plans such as MediCal and CHIP. Finally, as a contributor to my college newspaper's opinion podcast, I script and record episodes related to how current policies impact student life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut I equally love embracing my creative side! I spend my free time playing piano, writing jokes to include in stand-up comedy sets, and viewing 2000s era rom-coms.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Curious Cardinals mentor, I would be thrilled to help your student further their passion or guide them to discovering new topics that truly pique their interest. When I was in high school, I discovered my current interests through the seemingly unrelated activity of debate and extemporaneous speaking. Researching the facets of healthcare to prepare my speeches cemented my goal to pursue a career in medicine, and the joy of speaking to spread a message sparked my interest in comedy performance. A student’s interests can pop up in the most unexpected avenues, and I would be delighted to help guide them along the process of discovery and later developing their passion through projects or gaining knowledge.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"gQrgz4BFFpFQEFYhmpc6o01hFrIUMR4WITVuiR70200D9M","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2e626078-1a8d-4eb1-984f-88961691f433\"}"},{"__ref":"Favorites:{\"uuid\":\"d688e317-a91f-4b9e-bbec-673fedded6c6\"}"},{"__ref":"Favorites:{\"uuid\":\"3add86da-94fc-4c59-8007-ef416c1afe70\"}"}],"causesSupported":[],"major":"Health and Human Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d224e617-1e25-4ba0-9f67-e61bf48d6951\"}"},{"__ref":"DeepDives:{\"uuid\":\"54e25a3f-6096-4229-ab8b-dacb80db8cd9\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb3337c2-9612-4f96-a708-0ccf2cde3a77\"}"},{"__ref":"DeepDives:{\"uuid\":\"c935eac5-f375-40ed-b898-a6c1ddf96e96\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7cbc733e-13be-4066-8c8d-9b73ad9532d3/-/preview/-/format/jpg/","https://ucarecdn.com/25a111f1-ad62-4cd3-8495-f7c32ed0dd42/-/preview/-/format/jpg/","https://ucarecdn.com/39d778c4-8a35-4854-8ba0-3e8fc332d6b5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5e016f08-c2ac-474f-8c32-1d158dd75d86\"}"},{"__ref":"Education:{\"uuid\":\"9ca61c46-e6af-4e26-a5cd-3744e3afdc0a\"}"}],"hiredAt":"2025-02-18T10:25:38.639Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Writing","Spanish","Academic Coaching","College Essay Writing","History","Reading","Executive Function"],"communityBadges":["https://ucarecdn.com/b98f175c-f982-4497-bb8d-4a9c11113cd8/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"malaya-galindez\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f97d8e47-baa4-41ac-be8c-f1249d66e224\"}"}}},"_sentryTraceData":"cff050ff01c942b1872a356b1728c843-a17c88f2361bb999-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=cff050ff01c942b1872a356b1728c843,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"malaya-galindez"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
