xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"59f363e0-5cae-4fab-8b9a-d8fd586d5898\"}":{"__typename":"Favorites","uuid":"59f363e0-5cae-4fab-8b9a-d8fd586d5898","photoUrl":"https://ucarecdn.com/102f144e-995a-415d-b5df-5e9282e3ae74/","title":"Shah Rukh Khan","type":"ACTOR"},"Favorites:{\"uuid\":\"f338440a-b151-41a9-a09e-afff16310a92\"}":{"__typename":"Favorites","uuid":"f338440a-b151-41a9-a09e-afff16310a92","photoUrl":"https://ucarecdn.com/4ccce2bd-65e4-4d2d-8f24-49af7d8fabf9/","title":"Angel Di Maria","type":"ATHLETE"},"Favorites:{\"uuid\":\"25643856-6114-444e-9243-fb1f4355ef58\"}":{"__typename":"Favorites","uuid":"25643856-6114-444e-9243-fb1f4355ef58","photoUrl":"https://ucarecdn.com/8f01e5f6-2cab-4b1c-9858-02a98c6035ea/","title":"Future","type":"ARTIST"},"CausesSupported:{\"uuid\":\"6f38e2cf-9cda-4138-ba4f-3217affdd650\"}":{"__typename":"CausesSupported","uuid":"6f38e2cf-9cda-4138-ba4f-3217affdd650","name":"Jimmy V Foundation","description":"\u003cp\u003e\u003cstrong\u003eAs part of greek life at Georgia Tech, I help raise money for the V foundation!\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e","photoUrl":"https://ucarecdn.com/f5390efd-5ca2-49d9-9163-e1108c2e3ac1/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"63a35dfb-22d6-416b-abfd-ac138a164538\"}":{"__typename":"DeepDives","uuid":"63a35dfb-22d6-416b-abfd-ac138a164538","content":"\u003cp\u003eTry everything. Don’t be afraid to explore new interests, even if they feel outside your comfort zone. You’ll discover passions you never expected—and every experience will help you grow in ways that matter.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"0dd106e4-d21c-47b2-9671-dce843021b6b\"}":{"__typename":"DeepDives","uuid":"0dd106e4-d21c-47b2-9671-dce843021b6b","content":"\u003cp\u003eMy dream job blends architecture and computer science—designing systems or spaces that improve how we live, while using technology to make them more efficient, inclusive, and sustainable. I want to work at the intersection of design and impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"2d201d25-99c7-49bd-bd5d-e18f80227385\"}":{"__typename":"DeepDives","uuid":"2d201d25-99c7-49bd-bd5d-e18f80227385","content":"\u003cp\u003eWanting to help the world in a humane way. Even if the impact is small, I believe thoughtful contributions—through design, technology, or daily actions—can make life better for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"0f6419a4-7527-4d0d-9217-43bb89870e13\"}":{"__typename":"DeepDives","uuid":"0f6419a4-7527-4d0d-9217-43bb89870e13","content":"\u003cp\u003eMy grandfather. He had a unique way of thinking—curious, rational, and always grounded in empathy. His perspective taught me to look at the world with both care and creativity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"58503d82-0428-42b0-ae18-36f123da5879\"}":{"__typename":"School","uuid":"58503d82-0428-42b0-ae18-36f123da5879","name":"South River High School","city":"Edgewater","type":"HIGH","state":"MD","country":"Anne Arundel","zip":"21037"},"Education:{\"uuid\":\"afd15f0e-cc50-448d-ad21-0727ec22a232\"}":{"__typename":"Education","uuid":"afd15f0e-cc50-448d-ad21-0727ec22a232","school":{"__ref":"School:{\"uuid\":\"58503d82-0428-42b0-ae18-36f123da5879\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"db15c2d4-8613-4f74-b718-37f1e4327938\"}":{"__typename":"School","uuid":"db15c2d4-8613-4f74-b718-37f1e4327938","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30309"},"Education:{\"uuid\":\"b70ec621-e5a7-4ae6-a7a6-a2e6cb1dd5c5\"}":{"__typename":"Education","uuid":"b70ec621-e5a7-4ae6-a7a6-a2e6cb1dd5c5","school":{"__ref":"School:{\"uuid\":\"db15c2d4-8613-4f74-b718-37f1e4327938\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Architecture + Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"b96fa674-5c3a-483c-93c8-602f455ff8b4\"}":{"__typename":"MentorPublicProfile","uuid":"b96fa674-5c3a-483c-93c8-602f455ff8b4","displayName":"Armaan K.","slug":"armaan-kazi","biography":"\u003cp\u003e\u003cbr\u003eHi! I’m Armaan, an undergraduate student at Georgia Tech studying Architecture with a minor in Computing and Intelligence and a certificate in Sustainable Architecture. I’ve always been drawn to spaces where creativity, logic, and purpose intersect—which is why architecture felt like the perfect path. I’m fascinated by how the built environment and infrastructure shapes the way we live, and how emerging technologies like AI and machine learning can help us reimagine design in more sustainable and inclusive ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis curiosity carries into how I mentor. I believe learning is deeply personal—it’s not about memorizing formulas or grinding through assignments. It’s about understanding how you learn best, building confidence in your own voice, and having someone who’s willing to meet you where you are. That’s the kind of mentor I try to be: approachable, thoughtful, and invested in helping you grow—not just academically, but as a thinker and communicator.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my time at Georgia Tech, I’ve worked on a range of exciting projects. I’ve designed community-centered spaces in urban redevelopment studios, and collaborated on consulting teams tackling real-world forecasting challenges for global clients. These experiences have shaped how I think, plan, and communicate—but more importantly, they’ve taught me how to listen, adapt, and work well with people from all backgrounds.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond school, I’m someone who values creative expression in all its forms. Photography and film have been long-time passions of mine—they help me make sense of the world and explore ideas visually. I also enjoy art in general and like to sketch or experiment with visuals when I’m feeling inspired. And music is a constant in my life—whether I’m working, relaxing, or just walking to class, there’s usually a playlist playing in the background. These creative outlets help keep me curious, open-minded, and imaginative in everything I do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI stay active in my campus community in a few different ways. I serve on the executive board of the American Institute of Architecture Students (AIAS), where I help lead initiatives that foster design exploration, collaboration, and professional growth among students. I’m also a member of the Undergraduate Consulting Club, where I’ve worked on real-world client projects that combine strategy, data, and creative thinking. Outside of academics, I’m involved in Greek life at Georgia Tech and part of the club boxing team—both of which have taught me a lot about discipline, teamwork, and connecting with people from different walks of life. These experiences have shaped how I communicate, support others, and show up consistently—qualities I bring into every mentoring relationship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the heart of it, I just really enjoy helping others succeed. Whether we’re working through a tough concept, organizing a plan of attack for an assignment, or just trying to build stronger study habits, I’m here to support you. I want to help you feel more confident in your learning and more empowered in your goals. And I believe—with the right support, the right mindset, and maybe a little music along the way—anything is possible.\u003c/p\u003e","teachingVideoPlaybackId":"Tl8WGYXqmfjibaJKleTP9mgisHLUIpMHEKDTHEDCY4w","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I’m most proud of is being named Rookie of the Year on my college boxing team during my freshman year. I had no prior experience going in—I just showed up, stayed consistent, and pushed myself every day. That recognition wasn’t just about performance; it was proof that if I really commit to something, I can make meaningful progress. It reminded me that effort really does pay off—and that I’m capable of more than I give myself credit for.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"59f363e0-5cae-4fab-8b9a-d8fd586d5898\"}"},{"__ref":"Favorites:{\"uuid\":\"f338440a-b151-41a9-a09e-afff16310a92\"}"},{"__ref":"Favorites:{\"uuid\":\"25643856-6114-444e-9243-fb1f4355ef58\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6f38e2cf-9cda-4138-ba4f-3217affdd650\"}"}],"major":"Architecture + Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"63a35dfb-22d6-416b-abfd-ac138a164538\"}"},{"__ref":"DeepDives:{\"uui
