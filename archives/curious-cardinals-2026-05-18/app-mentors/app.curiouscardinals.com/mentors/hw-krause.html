xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"74d85cde-a87a-4e34-b999-818f8c046371\"}":{"__typename":"Favorites","uuid":"74d85cde-a87a-4e34-b999-818f8c046371","photoUrl":"https://ucarecdn.com/3c97a033-4351-4a15-9cfc-714c616643c0/","title":"Discovery - Daft Punk","type":"ALBUM"},"Favorites:{\"uuid\":\"76d5d236-37b3-4131-8b48-63e82e7df908\"}":{"__typename":"Favorites","uuid":"76d5d236-37b3-4131-8b48-63e82e7df908","photoUrl":"https://ucarecdn.com/85d488b0-f529-4c38-81dd-7e7a9d796924/","title":"Vampire Weekend","type":"ARTIST"},"Favorites:{\"uuid\":\"b0a5a7ca-a245-47c2-b9f9-dd3fd667e372\"}":{"__typename":"Favorites","uuid":"b0a5a7ca-a245-47c2-b9f9-dd3fd667e372","photoUrl":"https://ucarecdn.com/cbbbfcb2-7c36-4de6-ac0d-10dc07906837/","title":"Project Hail Mary - Andy Weir","type":"BOOK"},"CausesSupported:{\"uuid\":\"e7df68a1-4eb7-4a57-98a4-8e84d0fa5687\"}":{"__typename":"CausesSupported","uuid":"e7df68a1-4eb7-4a57-98a4-8e84d0fa5687","name":"UCSC Rocket Team","description":"\u003cp\u003eBig part of my intro to college, hope to see them succeed in every way!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/baac5562-1a1c-45dc-a680-c91e2f39db47/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"76414181-92b3-461f-8a49-0c999d0cbb36\"}":{"__typename":"DeepDives","uuid":"76414181-92b3-461f-8a49-0c999d0cbb36","content":"\u003cp\u003eI chose astrophysics, and UC Santa Cruz because I really wanted to do something with my life that I could feel truly passionate and fulfilled about, and like I did something that mattered. I’ve always been captivated by planets and stars since I was young, and this interest carried forward throughout my childhood and even now. I want my work to not feel like work, and even when things are hard with classes, I know I’m doing awesome research that actually matters.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI wasn’t always sure of my major, there were times where I thought I might not make the cut in the physics program, or that I should switch to another major like engineering or business for a more lucrative career, but I wanted to be honest with myself and pick something that really mattered to me.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"5dd5155c-e4e9-4ffc-afb4-4055d0204e68\"}":{"__typename":"DeepDives","uuid":"5dd5155c-e4e9-4ffc-afb4-4055d0204e68","content":"\u003cp\u003eOne thing about me that might not be super obvious, especially since I’m a mentor, a job exclusively about working with people, is that I’m a naturally shy person! I’m not a fan of huge groups of people whom I don’t know. Introducing myself around new people is absolutely exhausting to me and networking events are nightmarish (but necessary!)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eStill, I’ve worked through these rough experiences and gotten better at them by practicing and practicing and practicing! While they still might not be my favorite things to do, I’ve found ways to get through them, get more out of them, get better at navigating them, and maybe even find things to enjoy about them once in a while. Putting myself out there again and again has helped with this.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"791d46ff-bdaa-41c6-83b3-e145bd2ced73\"}":{"__typename":"DeepDives","uuid":"791d46ff-bdaa-41c6-83b3-e145bd2ced73","content":"\u003cp\u003eFor this one, I’m going to focus more on how I was in middle school. Back then, I hadn’t developed various skills such as interpersonal communication, flexibility, and presentation that I have now. I went to project based learning middle school, which meant lots and lots of group work and therefore collaboration. At first, I absolutely hated it! I wanted to do everything on my own as I was the only one I could trust to get the work done, and when people didn’t work well with me, I thought that proved me right. This middle school was in a different town from my elementary school, which meant all new people whom I didn’t know. I had a few friends, but it took lots of work to build a support system from the ground up.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school I began to see the value in working with other people, and how projects could be completed faster and of high quality with many people who all put in their own effort into it. We could play off one another’s strengths and weaknesses, and create something everyone was proud of. Further, we practiced and practiced presenting our work, adding elements of authentic passion to enrich what we were talking about. Again, this took me many years to learn, and I’m very grateful to have done so in high school, as it’s been an invaluable skill in my life since then, whether it comes to a group engineering project, academic research, or a job interview.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c2e4be1c-3e78-40e5-9bde-c5c193ac1a27\"}":{"__typename":"DeepDives","uuid":"c2e4be1c-3e78-40e5-9bde-c5c193ac1a27","content":"\u003cp\u003eThis is a tricky one, because there is so much I could say! Mentorship can mean so many different ways, so I’ll try to use my life experiences as a basis. Mentors can be people in your life who you look up to, who more directly show you or teach you things, like a teacher or tutor. They can be people who inspire you, whose words and experiences excite you about the subject they’re talking about, or who you find yourself resonating with.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt matters to have these “guides” in your life, as life is full of many opportunities, exciting things, and problems. People with the wisdom and experience of having been through these problems and taken advantage of these opportunities may have great advice to share regarding how to navigate them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI feel like relatability is one of the most important things in life. Finding a mentor whom you can relate to and whom you have things in common with can be the best way to get the most out of your experiences with them and potentially even build lifelong relationships!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"c452fd92-b03d-45df-8516-8d3469b2af77\"}":{"__typename":"School","uuid":"c452fd92-b03d-45df-8516-8d3469b2af77","name":"Da Vinci Charter Academy","city":"Davis","type":"HIGH","state":"California","country":"United States","zip":"95616"},"Education:{\"uuid\":\"5ebe7007-8846-4891-8635-c9f91f33b5c8\"}":{"__typename":"Education","uuid":"5ebe7007-8846-4891-8635-c9f91f33b5c8","school":{"__ref":"School:{\"uuid\":\"c452fd92-b03d-45df-8516-8d3469b2af77\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"cd2b1d56-989e-4312-bee0-3cb2611e9768\"}":{"__typename":"School","uuid":"cd2b1d56-989e-4312-bee0-3cb2611e9768","name":"University of California, Santa Cruz","city":"Santa Cruz","type":"COLLEGE","state":"California","country":"United States","zip":"95064"},"Education:{\"uuid\":\"83de1194-54f6-49b6-b690-7d70cc0ad60b\"}":{"__typename":"Education","uuid":"83de1194-54f6-49b6-b690-7d70cc0ad60b","school":{"__ref":"School:{\"uuid\":\"cd2b1d56-989e-4312-bee0-3cb2611e9768\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Physics (Astrophysics)","degree":null},"MentorPublicProfile:{\"uuid\":\"a2abc490-3d09-463c-86df-99c51137d760\"}":{"__typename":"MentorPublicProfile","uuid":"a2abc490-3d09-463c-86df-99c51137d760","displayName":"Hayden K.","slug":"hw-krause","biography":"\u003cp\u003eHi there!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m Hayden, a 3rd year undergraduate student at UC Santa Cruz majoring in astrophysics. With that, I am very passionate about topics like the stars, galaxies, and extraterrestrial life! (I am doing research on galaxies right now if you’d like to know more!) I also love physics and math, and find myself using it every day in my studies and research, and I love sharing and exchanging what I’ve learned with others. I also find myself programming all the time, so feel free to ask for any Python tips and tricks.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I really enjoy running, walking, and working out in order to blow off steam and relax myself in stressful times. I also like to channel my creative side into writing and reading (currently have a sci-fi story WIP!) I also have been learning to cook more and more, and I really love hanging out with friends and playing video games (Minecraft and the Halo series are a couple favorites, but I have so many more!) I’m also interested in engineering, specifically around rocket design, and I enjoy building model rockets.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSpeaking of rocketry, I had the chance to actually design and teach my own college level curriculum all about rocketry at an introductory level this past fall quarter of college. It was an amazing (and very difficult) experience, and I have learned so much about pedagogy, teaching habits, and how people learn better in different ways. I’ve also had experience tutoring math and science at elementary, middle, and high school levels in various subjects over the years, which has taught me a lot about assisting with learning in different environments with different people at different levels.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs mentioned before, I love sharing what I know with others, especially what I’m passionate about. I’ve found it’s easiest and most fun to talk to someone when you both are talking about something you love, and that’s why I’m so eager to talk about physics, math, or really any of the other subjects I listed above. If you’ve got something you want to talk about, and you’re excited, let’s talk! I’m here for you, whether that means helping with some problem, questions about something difficult, or just talking about something we both enjoy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;Hope to meet you soon!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"IOrKguY47Ef02a3lgituMMX8OKvHUuM5vTEyNsU32Qzw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m going to expand on one of the details I mentioned in my bio here, that I had the opportunity to design, construct, and execute my own for-credit university-level college course that I taught last fall at UC Santa Cruz. This was an absolutely incredible experience that I am very proud of, and I’d like to go through why.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe project began before I even thought I’d ever do something like this, when I first joined the UCSC Rocket Team and took a class on CAD (Computer Aided Design) and 3D printing similar to the one I’d end up teaching. This was a special class for me; it was the fall quarter of my freshman year, and it was a small environment (~20 students) with many hands-on activities and taught by fellow undergraduates. This “near-peer” level of instruction combined with the “guide on the side” teaching style made this class an incredibly fun learning experience and shaped my introduction to college.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI knew I wanted to be more involved in this program, and I really wanted to apply what I was doing on the rocket team in a new way that would promote the basics of amateur rocketry (the actual building of model rockets) to newcomers to the team and anyone else who wanted to learn. From this, myself and two others began the lengthy journey of building our course from the ground up.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWe couldn’t have done this without one another, and it was the most testing and bonding experiences someone can ever go through. We spent hours and hours writing, reviewing, and testing the course curriculum. We proofread our work again and again, sending it to our advisor who’d send it back with dozens of suggested changes for us to sort through. This project was the majority of my life’s work during my spring quarter, as we rapidly attempted to develop all that would be needed to teach in the fall.\u003c/p\u003e\u003cp\u003eTo say this was a struggle would be an absolute understatement. Going into fall, I was nervous and exhausted. My team and I had all-time low morale, and we put in every hour we could to get the class on its feet and make sure things were running as smoothly as possible. Was it smooth? Absolutely not! Even in the fall, when the class was in full swing, we ran into hiccup after hiccup with the occasional in-class activity, and we learned from each one along the way. It started to become more natural, and we had our system locked in for the final project. I’ll never forget the final week, where students had to finish constructing their rockets. I spent nearly sixty hours supervising and helping them build that week, from class time to section time to open lab hours; all on top of studying for finals.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt was worth it. The day before my students gave their final presentations, I got to see all of their rockets standing up on a table in the classroom. All of them were painted, something that we told them was optional and yet each and every one of them were passionate enough to fully polish their final products. It was so incredibly fulfilling to see an inkling of my passion come through in these students, who poured their time into a class, not for their major but because they wanted to. That was a special moment that made all of the pain and struggling throughout the entire process worth it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"74d85cde-a87a-4e34-b999-818f8c046371\"}"},{"__ref":"Favorites:{\"uuid\":\"76d5d236-37b3-4131-8b48-63e82e7df908\"}"},{"__ref":"Favorites:{\"uuid\":\"b0a5a7ca-a245-47c2-b9f9-dd3fd667e372\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"e7df68a1-4eb7-4a57-98a4-8e84d0fa5687\"}"}],"major":"Physics (Astrophysics)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"76414181-92b3-461f-8a49-0c999d0cbb36\"}"},{"__ref":"DeepDives:{\"uuid\":\"5dd5155c-e4e9-4ffc-afb4-4055d0204e68\"}"},{"__ref":"DeepDives:{\"uuid\":\"791d46ff-bdaa-41c6-83b3-e145bd2ced73\"}"},{"__ref":"DeepDives:{\"uuid\":\"c2e4be1c-3e78-40e5-9bde-c5c193ac1a27\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/44efdfc1-3fce-4f6a-93ac-665dc396c781/-/preview/-/format/jpg/","https://ucarecdn.com/8fcb7c25-c611-4a65-a436-833dc5e7959b/-/preview/-/format/jpg/","https://ucarecdn.com/0f278377-6626-4f5f-9ec3-0e49c8d235ca/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5ebe7007-8846-4891-8635-c9f91f33b5c8\"}"},{"__ref":"Education:{\"uuid\":\"83de1194-54f6-49b6-b690-7d70cc0ad60b\"}"}],"hiredAt":"2025-06-13T19:25:42.568Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus"],"communityBadges":["https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hw-krause\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a2abc490-3d09-463c-86df-99c51137d760\"}"}}},"_sentryTraceData":"31a0b90f823a4bbfafe59137dbaf8bc4-814d58e199ef99a8-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=31a0b90f823a4bbfafe59137dbaf8bc4,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"hw-krause"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
