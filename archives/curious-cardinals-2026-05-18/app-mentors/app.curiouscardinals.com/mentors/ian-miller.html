xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"00c32fb2-1c1b-4712-8347-ab3aa0198629\"}":{"__typename":"Favorites","uuid":"00c32fb2-1c1b-4712-8347-ab3aa0198629","photoUrl":"https://ucarecdn.com/96c923d6-95ee-4dc9-8892-6d1348425569/","title":"Interstellar","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"339377b3-df18-4815-ae58-f4f507375c3b\"}":{"__typename":"DeepDives","uuid":"339377b3-df18-4815-ae58-f4f507375c3b","content":"\u003cp\u003eI’d tell my younger self that struggling doesn’t mean you’re bad at school, it means you haven’t found the right systems yet. Discipline isn’t something you’re born with; it’s built through small, consistent habits. Start before you feel ready, break big tasks into manageable steps, and ask for help sooner than you think you should.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ba4545cf-ffae-44bb-9bb8-d414db05d9e9\"}":{"__typename":"DeepDives","uuid":"ba4545cf-ffae-44bb-9bb8-d414db05d9e9","content":"\u003cp\u003eI like to surf, play/produce music, go for long bike rides, play video games, and read!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2d5e44f8-837e-45f7-aba2-cc59620f7315\"}":{"__typename":"DeepDives","uuid":"2d5e44f8-837e-45f7-aba2-cc59620f7315","content":"\u003cp\u003eI chose my major because I’ve always been curious about \u003cem\u003ewhy\u003c/em\u003e people think, feel, and behave the way they do, and how Biology and environment shape that process. Studying biology, psychology, and epidemiology let me connect what’s happening at the cellular and brain level to real human experiences, learning, and health.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"ead0cf2e-686d-49b4-8078-bad3d8858616\"}":{"__typename":"School","uuid":"ead0cf2e-686d-49b4-8078-bad3d8858616","name":"Palos Verdes Peninsula High School","city":"Rolling Hills Estates","type":"HIGH","state":"California","country":"United States","zip":"90274"},"Education:{\"uuid\":\"7cca322d-aa1e-4c0a-be57-55a6a82ce022\"}":{"__typename":"Education","uuid":"7cca322d-aa1e-4c0a-be57-55a6a82ce022","school":{"__ref":"School:{\"uuid\":\"ead0cf2e-686d-49b4-8078-bad3d8858616\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"99973eb5-729a-432b-b82d-dec0bde5532a\"}":{"__typename":"Education","uuid":"99973eb5-729a-432b-b82d-dec0bde5532a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"4b7e69c9-d844-44e7-8939-2802183c0ab4\"}":{"__typename":"MentorPublicProfile","uuid":"4b7e69c9-d844-44e7-8939-2802183c0ab4","displayName":"Ian M.","slug":"ian-miller","biography":"\u003cp\u003eI’m Ian and I am currently finishing my Master's degree at Stanford in Epidemiology \u0026amp; Clinical research where I completed my undergraduate degree in Biology, with a minor Psychology. Looking forward, I am excited start medical school at UCSF this fall!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA little bit about me: I'm someone who cares deeply about helping students learn \u003cem\u003ehow to learn\u003c/em\u003e, not just how to earn good grades. Academically, I’m fascinated by how the brain works, how people think under pressure, and how habits and environments shape learning and performance. I’m currently completing a master’s degree in Epidemiology \u0026amp; Clinical Research at Stanford, where I work on research projects that combine data analysis, biology, and real-world problem solving. I also serve as a teaching assistant for the Stanford Biology Department, where I lead discussion sections, help students break down complex material, and coach them through exams and long-term projects.\u003c/p\u003e\u003cp\u003eWhat’s important to know, though, is that I wasn’t always a straight-A Stanford student.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn middle school, I struggled with study habits, organization, and discipline. I often felt overwhelmed, procrastinated, and didn’t yet know how to manage my time or approach school strategically. My grades reflected that struggle. I knew I was capable, but I didn’t have the tools or mindset to translate effort into results.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat began to change in high school when I was introduced to better systems, stronger mentorship, and most importantly a shift in mindset. I learned how to break big tasks into manageable steps, how to study with intention instead of panic, and how to view challenges as opportunities to improve rather than evidence of failure. Over time, those changes compounded. I rebuilt my habits, gained confidence, and ultimately graduated at the top of my class.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat experience shaped how I see learning and why I care so deeply about mentorship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI genuinely believe that most students are far more capable than they realize. With the right guidance, structure, and growth mindset, progress is not only possible, it’s predictable. I enjoy working with students to identify what’s holding them back, whether that’s time management, confidence, motivation, or stress, and helping them build systems that actually work for their lives.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I’m driven by curiosity and a love of building, testing, and understanding \u003cem\u003ewhy\u003c/em\u003e things work. Whether I’m experimenting with music production–learning how subtle changes in structure or sound affect how something is perceived–or designing and hand-shaping a surfboard using principles from physics and fluid dynamics, I’m constantly iterating, reflecting, and improving. I’m drawn to hands-on learning and creative problem-solving, and I bring that same mindset into mentorship: asking thoughtful questions, encouraging experimentation, and helping students see challenges as opportunities to learn rather than obstacles to avoid.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eStudents often tell me that I make challenging material feel approachable and that I help them feel more confident and capable over time. My approach is structured but flexible, supportive but honest, and focused on building independence.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI see mentorship as a way to pay forward the help I once received and to make the path a little clearer for those coming after me. If you’re looking for a mentor who believes deeply in growth, resilience, and long-term success, I’d be excited to work together!\u003c/p\u003e","teachingVideoPlaybackId":"MOOdJD32UbBwWtCHCwIEfXcw1gnb7OJ5I65bsPvCn8I","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m really proud of working on an effort that helped lead to a new California state law protecting insurance coverage for patients. It was meaningful to see research, advocacy, and persistence turn into real change that improved people’s lives.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"00c32fb2-1c1b-4712-8347-ab3aa0198629\"}"}],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"339377b3-df18-4815-ae58-f4f507375c3b\"}"},{"__ref":"DeepDives:{\"uuid\":\"ba4545cf-ffae-44bb-9bb8-d414db05d9e9\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d5e44f8-837e-45f7-aba2-cc59620f7315\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ef03c63f-3019-45d9-b0ac-eb2786b8f945/-/preview/-/format/jpg/","https://ucarecdn.com/5d25d49c-1da2-4b69-b32c-639a92dab2df/-/preview/-/format/jpg/","https://ucarecdn.com/55a43cc3-7215-4b99-af85-d46c007f081f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7cca322d-aa1e-4c0a-be57-55a6a82ce022\"}"},{"__ref":"Education:{\"uuid\":\"99973eb5-729a-432b-b82d-dec0bde5532a\"}"}],"hiredAt":"2026-01-28T16:33:55.243Z","topics":["Algebra I","Algebra II","Calculus","Geometry","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Chemistry","Physics","Writing","Academic Coaching","College Essay Writing","Executive Function","Music","Business / Entrepreneurship","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":t
