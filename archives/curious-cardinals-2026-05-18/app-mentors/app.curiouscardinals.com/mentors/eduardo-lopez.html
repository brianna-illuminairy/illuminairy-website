xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b2450b4b-ed4e-4e45-995f-e06d22c9e0b2\"}":{"__typename":"DeepDives","uuid":"b2450b4b-ed4e-4e45-995f-e06d22c9e0b2","content":"\u003cp\u003eI spent my summers spending countless hours in my high school. I was on the track team and strived to be the best in California. After coming home, I would often cut meat for my family taco stand. Working countless nights with my parents and enjoying all the small talk with my customers\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e34ae65a-e5a9-4d0f-8f74-92510c5c7c6e\"}":{"__typename":"DeepDives","uuid":"e34ae65a-e5a9-4d0f-8f74-92510c5c7c6e","content":"\u003cp\u003eI love coaching and help other kids. I never had someone to help me with my sports and hope that at the end of my CS career I have the opportunity to give back to my community and help high-schoolers go to college for sports. Enabling more people to achieve their wildest dreams\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9102e014-aeae-491e-97d6-c3b21511eae2\"}":{"__typename":"DeepDives","uuid":"9102e014-aeae-491e-97d6-c3b21511eae2","content":"\u003cp\u003eNo matter how hard things seem now, always believe in your ambitions and goals. Even if you aim for the moon and miss, you'll land upon the stars. Still one amazing view and better than before\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"71abdbd8-1932-4ff2-af93-0b7f01036a5b\"}":{"__typename":"DeepDives","uuid":"71abdbd8-1932-4ff2-af93-0b7f01036a5b","content":"\u003cp\u003eMentorship means the ability to give back to the community and help students bridge the gap between academic resources in their hometown. Hoping that my efforts could help other students become ambition and fall in love with their hobbies and enjoy life for all the fruits it offers\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"d36c3a6f-9b4e-43e3-abb1-8e34336a2985\"}":{"__typename":"School","uuid":"d36c3a6f-9b4e-43e3-abb1-8e34336a2985","name":"Birmingham Community High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91406"},"Education:{\"uuid\":\"f4d9477c-b0db-4f4c-b830-8048fd0153bf\"}":{"__typename":"Education","uuid":"f4d9477c-b0db-4f4c-b830-8048fd0153bf","school":{"__ref":"School:{\"uuid\":\"d36c3a6f-9b4e-43e3-abb1-8e34336a2985\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"a3017977-f0c4-4e82-a021-94a84edf6025\"}":{"__typename":"Education","uuid":"a3017977-f0c4-4e82-a021-94a84edf6025","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science and Applied Mathematics ","degree":null},"MentorPublicProfile:{\"uuid\":\"c8b0d5e4-1685-409a-bfef-0712eda2de7e\"}":{"__typename":"MentorPublicProfile","uuid":"c8b0d5e4-1685-409a-bfef-0712eda2de7e","displayName":"Eduardo L.","slug":"eduardo-lopez","biography":"\u003cp\u003eMy name is Eduardo Lopez, and I'm currently attending UC Berkeley on a full-ride scholarship, majoring in Computer Science and Applied Mathematics. I'm excited to share my experiences and passions with you through Curious Cardinals as your mentor!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Berkeley, I have been deeply immersed in all of my academic passions. From learning the applications of linear algebra for images to understanding how polynomials are used for passwords, I have been given the incredible opportunity to fall in love with academia. I've also delved into machine learning, exploring its transformative potential in fields like natural language processing, computer vision, and artificial intelligence. Additionally, I have worked on graph algorithms in an industry setting and developed a website from scratch for a non-profit, helping manage food supply and employee coordination.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I have developed a strong interest in sports science. One of my favorite pastimes is weightlifting, which has taught me the value of patience and the understanding that progress takes time. Another hobby of mine is coaching; watching my athletes flourish both as competitors and students brings me immense happiness.\u003c/p\u003e\u003cp\u003eAs your mentor, I am committed to providing a holistic learning experience
