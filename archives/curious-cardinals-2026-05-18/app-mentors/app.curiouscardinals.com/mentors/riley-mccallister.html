xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c2258ef6-d5a9-466f-8395-f1d2c79f6d5f\"}":{"__typename":"DeepDives","uuid":"c2258ef6-d5a9-466f-8395-f1d2c79f6d5f","content":"\u003cp\u003eI picked Environmental Engineering because I felt that it aligned well with both my values and my interests. I hope to prepare myself for meaningful work designed for benefiting the broader world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"13f9b3a8-7cb8-4590-9fbc-ebc860a9438e\"}":{"__typename":"DeepDives","uuid":"13f9b3a8-7cb8-4590-9fbc-ebc860a9438e","content":"\u003cp\u003eI spent my summers in high school in a lot of different ways. I had an internship with a district attorney's office one summer, then worked as an assist teacher for an elementary summer school the next. I also played travel lacrosse, so I spent my weekends doing that.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e9c71679-4bbc-4c1c-bd67-772ee17001cd\"}":{"__typename":"DeepDives","uuid":"e9c71679-4bbc-4c1c-bd67-772ee17001cd","content":"\u003cp\u003eI would advise myself to balance my activities, while making sure I'm not over-exerting myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2687afeb-2aa1-47f7-b06c-fb03f804a6ea\"}":{"__typename":"DeepDives","uuid":"2687afeb-2aa1-47f7-b06c-fb03f804a6ea","content":"\u003cp\u003eI would love to work as a patent lawyer!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"aa847cf0-d26a-4758-9dfd-75032aa83007\"}":{"__typename":"School","uuid":"aa847cf0-d26a-4758-9dfd-75032aa83007","name":"Marin Catholic","city":"Kentfield","type":"HIGH","state":"California","country":"United States","zip":"94904"},"Education:{\"uuid\":\"fe79466c-0f95-4e32-ba81-b09119b890e3\"}":{"__typename":"Education","uuid":"fe79466c-0f95-4e32-ba81-b09119b890e3","school":{"__ref":"School:{\"uuid\":\"aa847cf0-d26a-4758-9dfd-75032aa83007\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"80932592-ca2b-4040-81fe-0a4eef240a86\"}":{"__typename":"Education","uuid":"80932592-ca2b-4040-81fe-0a4eef240a86","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Environmental Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"07669334-14d2-4fdf-8124-96767271c26c\"}":{"__typename":"MentorPublicProfile","uuid":"07669334-14d2-4fdf-8124-96767271c26c","displayName":"Riley M.","slug":"riley-mccallister","biography":"\u003cp\u003eHi parents and students! Welcome to my profile! I'm Riley and I am from Northern California, but I go to college in New Hampshire. I love painting, hiking, and cooking as well as sports - I have played basketball, field hockey, lacrosse, and soccer throughout my life. Right now, I am involved in chemistry research, moot court, and triathlon on my college campus. I am planning on working in engineering after college then potentially going to law school, either to do patent law or environmental law. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI self studied for 14 AP exams in high school; I ended up receiving 13 scores of 5/5 and 1 score of 4/5. These AP scores  include AB Calculus, BC Calculus, Physics C: Mechanics, Biology, Chemistry, European History, United States History, Psychology, Statistics, Spanish Language, United States Government, Computer Science A, English Language and English Literature. I also excelled on the SAT which I also self studied for, receiving a score in the 1500s. I ended high school as Valedictorian and Mock Trial Champion because of this work ethic that I developed. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would love to share the tactics that I found useful with you! I have tutored math at all levels, including math basics for elementary school students, pre-Algebra, Algebra I, Algebra II, Geometry, Precalculus, Statistics, Computer Science, AB Calculus (Calc I), and BC Calculus (Calc I\u0026amp;II). This math tutoring was done with elementary, middle, and high school age students. Additionally, I have worked as a teacher's aide for both elementary school students and pre-Kindergarten students as young as 6 months old. I have experience with passion projects as well - in high school, mine was all about sustainable sewing for people in need; I made masks, tote bags, and blankets for my community, while also mending various articles of clothing. \u003c/p\u003e\u003cbr\u003e\u003cp\u003ePlease reach out if you are interested in environmental studies, engineering, math, chemistry, law, sports, or crafting! I look forward to helping you make an impact on your community by either developing your skills or creating a project centered around one of your passions. Thank you for taking the time to read this!\u003c/p\u003e","teachingVideoPlaybackId":"3PqPHw01L9XBu0047dwjilZYr7pCUVOL7g2RAT1QAOStg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environmental Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c2258ef6-d5a9-466f-8395-f1d2c79f6d5f\"}"},{"__ref":"DeepDives:{\"uuid\":\"13f9b3a8-7cb8-4590-9fbc-ebc860a9438e\"}"},{"__ref":"DeepDives:{\"uuid\":\"e9c71679-4bbc-4c1c-bd67-772ee17001cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"2687afeb-2aa1-47f7-b06c-fb03f804a6ea\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1fa02fb1-5d2f-4b60-961d-fd913568f3a5/-/preview/-/format/jpg/","https://ucarecdn.com/363a167b-3a05-413c-99cf-f12f89f6eed4/-/preview/-/format/jpg/","https://ucarecdn.com/93d8545e-72f5-44af-95e0-8e0786366948/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fe79466c-0f95-4e32-ba81-b09119b890e3\"}"},{"__ref":"Education:{\"uuid\":\"80932592-ca2b-4040-81fe-0a4eef240a86\"}"}],"hiredAt":"2026-03-18T23:51:13.420Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Chemistry","Physics","Biology","Writing","Spanish","College Essay Writing","History","Computer Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"riley-mccallister\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"07669334-14d2-4fdf-8124-96767271c26c\"}"}}},"_se
