xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"de334e81-d777-40a8-9068-3a01b655a932\"}":{"__typename":"Favorites","uuid":"de334e81-d777-40a8-9068-3a01b655a932","photoUrl":"https://ucarecdn.com/956e9bc0-fbde-47b1-9f18-a8249220b7fd/","title":"Undertale","type":"GAME"},"Favorites:{\"uuid\":\"90ad50ef-1f2b-412d-88ee-ddfca031e67d\"}":{"__typename":"Favorites","uuid":"90ad50ef-1f2b-412d-88ee-ddfca031e67d","photoUrl":"https://ucarecdn.com/021344be-4b9e-4159-91d5-74f3a54a2151/","title":"Inception","type":"MOVIE"},"Favorites:{\"uuid\":\"e9eedeec-b84a-4ffd-a125-da1ad72db35d\"}":{"__typename":"Favorites","uuid":"e9eedeec-b84a-4ffd-a125-da1ad72db35d","photoUrl":"https://ucarecdn.com/192b83af-16c1-4847-9962-f5ea9f9de0b7/","title":"Midnight's Children","type":"BOOK"},"Favorites:{\"uuid\":\"cd4af097-78f1-47ff-92e9-b79b11ec4036\"}":{"__typename":"Favorites","uuid":"cd4af097-78f1-47ff-92e9-b79b11ec4036","photoUrl":"https://ucarecdn.com/192b83af-16c1-4847-9962-f5ea9f9de0b7/","title":"Midnight's Children","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"07a21e2a-bef8-4758-b843-c9c747449225\"}":{"__typename":"DeepDives","uuid":"07a21e2a-bef8-4758-b843-c9c747449225","content":"\u003cp\u003eIn short, mentorship matters so much to me because I am in such large part a product of it, and I have experienced so deeply the ways that caring and passionate mentors can leave an indelible mark on their mentees’ intellectual and personal lives. This happens not only in the big ways—fostering seedlings of new interests that sprout and blossom into passions and hobbies and majors and life projects, helping instill confidence that will hopefully last through the many intellectual journeys ahead—but also in the smallest ways, the little aha moments of discovery that I believe foster genuine understanding and connection with the material, the day-by-day feelings of progress that culminate in the sense of achievement that makes striving and pushing our boundaries so rewarding and fulfilling. I’m lucky enough to have grown up around three grandparents who answered all of my wildest questions and pushed me to ask wilder ones, and their influence has made me a more eager learner and more compassionate teacher. And in the same way, I hope to be able to help my mentees find the sort of wonder and amazement that comes from really understanding something, the views from the top of metaphorical mountains they’ve put in the work to climb, these experiences that I’ve been chasing my whole life and hope to instill through my teaching.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"941dde8a-d837-49e2-8e56-75b314c00500\"}":{"__typename":"DeepDives","uuid":"941dde8a-d837-49e2-8e56-75b314c00500","content":"\u003cp\u003eMy perennial motivation is always the people I surround myself with — my friends and peers have an unbelievable (literally; many days I think about it and still cannot believe it) breadth and depth of passion for the things they love and drive to pursue them. The aspect of my friends that I most admire is their unabashed devotion to what they care about — the people in their lives, the subjects they are drawn to, the personal projects they undertake, the artistic and creative endeavors they embark on — talking to them and exchanging ideas and seeing the wonderful workings of their diverse minds never fails to remind me of all the possibilities that exist to do interesting and meaningful things.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9477b2f9-0a80-492e-959d-953593b3a7d7\"}":{"__typename":"DeepDives","uuid":"9477b2f9-0a80-492e-959d-953593b3a7d7","content":"\u003cp\u003eI spent my first summer in high school, during COVID, teaching coding to kids at a local community center. I created a curriculum and designed lessons for the students, adapting to feedback and the constantly changing situation every day, as well as modifying our materials when individual students would be more receptive to a different style. I learned there how to personalize my teaching, how to switch things up on the fly, and how to kindle passion in my students for something many of them had never seen before and didn’t know how much they liked.\u003c/p\u003e\u003cp\u003eThe next two summers, I did research in NYC, where I learned how to build a project from the ground up while fitting into a larger and broader vision, how to balance independence and collaboration in my contributions, and how to present and explain the concepts of my work to varied audiences. Taking a paper from far-fetched ideas to publication ended up being a three-year process that has shown me the value of taking the long view, of going slow and steady and doing things right even if that means putting in more time.\u003c/p\u003e\u003cp\u003eFinally, the summer after high school, I devoted time to personal projects, websites I’d been planning to build and writing projects I’d had on the back burner, and played lots of music, focusing back on the things I was most passionate about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"91d0276b-662d-483e-b92e-1d0608ae9e58\"}":{"__typename":"DeepDives","uuid":"91d0276b-662d-483e-b92e-1d0608ae9e58","content":"\u003cp\u003eI spend a lot of my free time on creative pursuits — writing interactive narrative pieces that blend digital elements and code with storytelling, trying to create soundscapes on the piano, or playing in (and arranging music for) ensembles and orchestras with my friends. Music in particular has always been a playground for me to invent new ways of expressing myself and connect with my own thoughts as well as others — making music with others is one of the most magical experiences I can think of, in a way not dissimilar from the joy of working on puzzles or interesting problems with friends, the buzz of ideas as energizing as the pace might be tiring. When I’m not doing those things, though, I’m probably reading interesting articles about linguistics, or urban planning, or pure math, or the immune system, or any of the countless topics I’m interested in learning more about — there’s never enough time to do it all, but I can certainly try my best.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"48a4b02e-6066-4465-a432-e45d54f76380\"}":{"__typename":"School","uuid":"48a4b02e-6066-4465-a432-e45d54f76380","name":"Rye Country Day School","city":"Rye","type":"HIGH","state":"New York","country":"United States","zip":"10580"},"Education:{\"uuid\":\"95e7276c-0b2d-467d-85b6-cf9681ac22a9\"}":{"__typename":"Education","uuid":"95e7276c-0b2d-467d-85b6-cf9681ac22a9","school":{"__ref":"School:{\"uuid\":\"48a4b02e-6066-4465-a432-e45d54f76380\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"0c39dba0-dde6-4fdb-9394-b540e2b42421\"}":{"__typename":"Education","uuid":"0c39dba0-dde6-4fdb-9394-b540e2b42421","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science \u0026 Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"451d67cd-e51f-405f-89a9-8ec5f4de47db\"}":{"__typename":"MentorPublicProfile","uuid":"451d67cd-e51f-405f-89a9-8ec5f4de47db","displayName":"Ro M.","slug":"rohan-malik","biography":"\u003cp\u003eHi! I’m Ro. I love learning, teaching, reading, writing, problem solving, and everything in between, and most of all, I love exploring, hiking towards the horizons of the garden of forking paths that we all have in front of us and soaking in hard-earned views from the mountaintops I reach along the way. My curiosity has pulled me towards many corners of the academic and extracurricular world, and the entire time, I’ve found so much joy in sharing it with others—a joy that I hope will be the guiding force during my time working with you and your child.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFormally, I study computer science and cognitive science, but my interests span math, biology, linguistics, philosophy, and urban planning, among others. I love searching for the structure that underlies things, whether that’s the conceptual foundations of academic topics or the hidden workings of cities and languages and minds, and I especially love helping others explore and discover that in their own passions. This broad experience has taught me how to bridge diverse concepts and chase interdisciplinary understanding, and it’s essential to my teaching, since I believe everything exists in context, and bringing out those connections can be immensely rewarding for me and the student alike.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also do research in computational biology, bridging the almost magical inner workings of the body with the modern tools of computer science. My past and continued engagement with research, going from amorphous project ideas to publishing in a \u003cem\u003eNature\u003c/em\u003e journal and presenting at the US’s largest oncology conference, have taught me how to manage projects efficiently and collaborate compassionately, and I’m confident in my ability to create a long-term vision and balance that pursuit with smaller proximal goals that fit into the larger story.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI went to a private high school, where I experienced firsthand the transformative power of teachers who care, of small classes where individualized attention was abundant, of innovative and interactive methods that emphasized insight. While there, I created and taught a year-long math class, designing lessons and problems that distilled concepts down to the why rather than just the what; through this and my years of one-on-one tutoring experience, I’ve tried to channel the best in all of the mentors and teachers who’ve given so much to me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m lucky to have had opportunities to chase so many of my intersecting passions and explore paths outside the core of what we learn in school, to dive deeply into the things I was passionate about without feeling limited in what I could do. And now, I hope I can pass this torch forward—by connecting with you and your child on a personal level, we can build a plan that hopefully feels like an exploration driven by curiosity, a force I know to be extremely powerful and which I’ve grown apt at cultivating in students I’ve taught, and I promise to match your child’s passion every step of the way.\u003c/p\u003e","teachingVideoPlaybackId":"ssWcy8HD8AZcnkbBbh4eDeo2aFfxlcQ800R1SGMZt7VU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"de334e81-d777-40a8-9068-3a01b655a932\"}"},{"__ref":"Favorites:{\"uuid\":\"90ad50ef-1f2b-412d-88ee-ddfca031e67d\"}"},{"__ref":"Favorites:{\"uuid\":\"e9eedeec-b84a-4ffd-a125-da1ad72db35d\"}"},{"__ref":"Favorites:{\"uuid\":\"cd4af097-78f1-47ff-92e9-b79b11ec4036\"}"}],"causesSupported":[],"major":"Computer Science \u0026 Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"07a21e2a-bef8-4758-b843-c9c747449225\"}"},{"__ref":"DeepDives:{\"uuid\":\"941dde8a-d837-49e2-8e56-75b314c00500\"}"},{"__ref":"DeepDives:{\"uuid\":\"9477b2f9-0a80-492e-959d-953593b3a7d7\"}"},{"__ref":"DeepDives:{\"uuid\":\"91d0276b-662d-483e-b92e-1d0608ae9e58\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6ad07a96-a7ea-4b4f-800b-98cf92805c9f/-/preview/-/format/jpg/"],"pronouns":"THEY_THEM","gender":"NON_BINARY","education":[{"__ref":"Education:{\"uuid\":\"95e7276c-0b2d-467d-85b6-cf9681ac22a9\"}"},{"__ref":"Education:{\"uuid\":\"0c39dba0-dde6-4fdb-9394-b540e2b42421\"}"}],"hiredAt":"2025-04-11T11:16:25.540Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Writing","Mandarin Chinese","Academic Coaching","College Essay Writing","Reading","Computer Science","Creative Writing","Music","Coding / Programming","Medicine / Health","Web Design","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rohan-malik\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"451d67cd-e51f-405f-89a9-8ec5f4de47db\"}"}}},"_sentryTra
