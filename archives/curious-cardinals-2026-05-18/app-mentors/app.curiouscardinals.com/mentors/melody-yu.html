xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"66f3965e-58fe-4cf2-a6c0-4cd19d571281\"}":{"__typename":"DeepDives","uuid":"66f3965e-58fe-4cf2-a6c0-4cd19d571281","content":"\u003cp\u003eI spent my summers doing research at Penn Gene Therapy Center! I also was a teacher's assistant at a school for kids with special needs. I had an incredible experience there, which became a huge part of why I wanted to become a doctor!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"f5068ecc-08ec-4d86-b696-b807e9a98ffa\"}":{"__typename":"DeepDives","uuid":"f5068ecc-08ec-4d86-b696-b807e9a98ffa","content":"\u003cp\u003eI performed with the Philadelphia Orchestra as a soloist at age 11! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"833cba94-4cb0-469c-b47e-69a6cf063e8b\"}":{"__typename":"DeepDives","uuid":"833cba94-4cb0-469c-b47e-69a6cf063e8b","content":"\u003cp\u003eI absolutely love to bake and try new foods. One of my favorite things to do is to explore new restaurants. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love to do yoga! I hope to become a yoga instructor one day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"015da320-1cc8-41d5-bb87-8d2f8cc76a30\"}":{"__typename":"School","uuid":"015da320-1cc8-41d5-bb87-8d2f8cc76a30","name":"The Baldwin School","city":"Bryn Mawr","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19010"},"Education:{\"uuid\":\"5583ce2b-2877-41dc-8193-967fd365c7ec\"}":{"__typename":"Education","uuid":"5583ce2b-2877-41dc-8193-967fd365c7ec","school":{"__ref":"School:{\"uuid\":\"015da320-1cc8-41d5-bb87-8d2f8cc76a30\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"25ddf025-ba72-4db2-a348-c117a0c2c593\"}":{"__typename":"Education","uuid":"25ddf025-ba72-4db2-a348-c117a0c2c593","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"b1587fc4-338d-4f39-a141-af479c659f39\"}":{"__typename":"MentorPublicProfile","uuid":"b1587fc4-338d-4f39-a141-af479c659f39","displayName":"Melody Y.","slug":"melody-yu","biography":"\u003cp\u003eHi! My name is Melody! I graduated from the University of Pennsylvania in 2024. I majored in neuroscience and minored in chemistry. I am currently working in Washington DC as a medical assistant at a dermatology practice for my gap year before attending medical school in the fall of 2025!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWith every clinical experience I've had as a future physician, I've always valued the meaningful, long-term relationships I've been able to cultivate. Through every interaction, I make an effort to truly connect with someone in a 'language' or way that makes sense to them. As a mentor, I strive to do the same.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout my undergraduate education, the classes that stand out the most to me are the ones where I've connected with teachers and teacher's assistants. Mentorship, to me, is incredibly important and is one of the main things I've relied on in my education. I became a teacher's assistant at Penn for both organic chemistry and biochemistry to be able to connect with other students while sharing my love for science.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Penn, I was involved in student government (Student Committee on Undergraduate Education), and research (Penn Undergraduate Research Mentoring Program)! I worked on a project on Congenital Disorders of Glycosylation at the Children's Hospital of Philadelphia. Using gene therapy and conditional knockout mice, I evaluated behavioral datasets and created correlations between our clinical knowledge. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, you can catch me on a long walk or run, or in the yoga studio! I am a total foodie! I love to explore new restaurants or bake a new recipe! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm excited to get to know you and hope to be your mentor! \u003c/p\u003e","teachingVideoPlaybackId":"01tWDTS02oYWXJcxu3QCaTfG02h3MS00pc9XcynF3iB3444","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"66f3965e-58fe-4cf2-a6c0-4cd19d571281\"}"},{"__ref":"DeepDives:{\"uuid\":\"f5068ecc-08ec-4d86-b696-b807e9a98ffa\"}"},{"__ref":"DeepDives:{\"uuid\":\"833cba94-4cb0-469c-b47e-69a6cf063e8b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3ffd4314-d009-
