xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"95164dff-1c46-4dc8-a3f6-45b0fa49ef34\"}":{"__typename":"Favorites","uuid":"95164dff-1c46-4dc8-a3f6-45b0fa49ef34","photoUrl":"https://ucarecdn.com/f4d0f8ee-ac36-4f39-9c7f-85635651f27b/","title":"Shah Rukh Khan","type":"ACTOR"},"Favorites:{\"uuid\":\"9f46f67a-33c5-42b3-90d3-a61695e19e57\"}":{"__typename":"Favorites","uuid":"9f46f67a-33c5-42b3-90d3-a61695e19e57","photoUrl":"https://ucarecdn.com/8905e106-9ecd-4e06-8ead-81af3e3fd356/","title":"Roger Federer","type":"ATHLETE"},"Favorites:{\"uuid\":\"d6652ab3-cab1-44d9-b8d3-d87ef30842d6\"}":{"__typename":"Favorites","uuid":"d6652ab3-cab1-44d9-b8d3-d87ef30842d6","photoUrl":"https://ucarecdn.com/c87bacc1-8e1d-409c-9686-f9fdb0a98dda/","title":"Night Changes","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e63fbff5-a8ec-4c44-9b57-faf0a91eeaf0\"}":{"__typename":"DeepDives","uuid":"e63fbff5-a8ec-4c44-9b57-faf0a91eeaf0","content":"\u003cp\u003eI’d tell myself that \u003cem\u003edelusional confidence is the key to success.\u003c/em\u003e Even when things don’t work out or people doubt you, keep believing in yourself anyway. That kind of belief pushes you to try again and again until it finally clicks. Keep going, and never give up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"4343df33-9c27-485a-a76f-6d544489e75c\"}":{"__typename":"DeepDives","uuid":"4343df33-9c27-485a-a76f-6d544489e75c","content":"\u003cp\u003eBeing a student-athlete has shaped how I teach more than anything else. Tennis taught me patience, focus, and grit, and those lessons show up in every project I take on. When I mentor students, I bring that same mindset: staying calm when things don’t work, learning from every attempt, and always pushing for progress. I don’t believe in giving up after the first try. Whether it’s coding, prototyping, or designing something new, I encourage students to keep experimenting until it clicks. Real growth comes from showing up, trying again, and believing in yourself even when it gets tough.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"b652315e-7270-4cef-a7f0-9d0116e3f642\"}":{"__typename":"DeepDives","uuid":"b652315e-7270-4cef-a7f0-9d0116e3f642","content":"\u003cp\u003eMy biggest motivation comes from seeing ideas turn into something real. Whether it was building a patent-pending contact lens device through my research at NYU or helping a middle schooler design AI-powered Smart Bins to make schools greener, I love watching small concepts grow into real impact. What drives me most is the moment when something I helped create actually helps someone else. Seeing people interact with an idea that started on my laptop or in a sketchbook and realizing it’s making their life easier or their community better is the best feeling. It reminds me that innovation isn’t just about technology, it’s about people. That connection between an idea and the difference it makes is what keeps me going.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"46a8d057-4be9-46b7-8515-aa777c12bc0d\"}":{"__typename":"DeepDives","uuid":"46a8d057-4be9-46b7-8515-aa777c12bc0d","content":"\u003cp\u003eMy greatest role model is my sister. She’s currently in medical school, and watching how hard she works every single day constantly inspires me. Her focus, discipline, and determination show me what it means to truly commit to something. I’ve seen her push through long nights, tough exams, and endless studying, and she still finds a way to stay positive and grounded. Growing up, I followed in her footsteps on the tennis court, trying to match her competitiveness and grit. Those lessons stuck with me — not just in sports, but in everything I do. She’s taught me that real success isn’t about luck or talent, it’s about showing up, putting in the effort, and refusing to give up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"74e79e57-2931-4369-a651-36e93aa143ae\"}":{"__typename":"School","uuid":"74e79e57-2931-4369-a651-36e93aa143ae","name":"CHIREC International School - Kondapur (CBSE) Campus","city":"Hyderabad","type":"HIGH","state":"Telangana","country":"India","zip":"500084"},"Education:{\"uuid\":\"1b063f16-aca6-4817-a904-d6631957d8cb\"}":{"__typename":"Education","uuid":"1b063f16-aca6-4817-a904-d6631957d8cb","school":{"__ref":"School:{\"uuid\":\"74e79e57-2931-4369-a651-36e93aa143ae\"}"},"startYear":"2022","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"349b0ff2-004b-442f-949c-19d4e17a43e1\"}":{"__typename":"Education","uuid":"349b0ff2-004b-442f-949c-19d4e17a43e1","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"1af56fc8-958b-475b-9715-cdce9ee2dc37\"}":{"__typename":"MentorPublicProfile","uuid":"1af56fc8-958b-475b-9715-cdce9ee2dc37","displayName":"Mihir P.","slug":"mihir-parcha","biography":"\u003ch3\u003e\u003cstrong\u003eMihir, Product Design, AI \u0026amp; Sustainability (Passion Project)\u003c/strong\u003e\u003cbr\u003e\u003c/h3\u003e\u003cp\u003eHey, I’m Mihir, a sophomore at Vanderbilt studying Computer Science and a former NCAA tennis player who swapped the racket for rapid prototyping. I’ve always been the kind of person who sees a small problem and immediately starts sketching ways to fix it. Sometimes that turns into a late-night idea. Sometimes it turns into a patent.\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003cbr\u003e\u003c/h3\u003e\u003cp\u003eBefore college, tennis taught me discipline, patience, and how to stay calm when things don’t go your way. I competed in international tournaments across Australia, Ghana, and India, learning how focus and preparation translate across any field. That mindset carried me into research. Through an NSF-funded program at NYU, I worked on digital manufacturing and biomedical design. Our project, \u003cem\u003eLensAssist\u003c/em\u003e, became a patent-pending, finger-worn device that helps people safely insert and remove contact lenses. I led the product strategy, surveyed over 200 users, and uncovered an $80 million market gap hiding in plain sight.\u003c/p\u003e\u003cp\u003eThat experience showed me how technology can be used for impact beyond the lab, which led to my next project. I recently worked with a middle schooler from Jersey City to create \u003cem\u003eSmart Bins\u003c/em\u003e, an AI-powered recycling system that makes waste reduction a fun competition between classrooms. Supported by the Bloomberg Youth Climate Action Fund, our project caught the attention of the Mayor of Hoboken, who reached out to discuss bringing it to more local schools.\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003cbr\u003e\u003c/h3\u003e\u003cp\u003eI mentor students who want to bring creativity, sustainability, and technology together. Whether it’s building something with AI, testing out new product ideas, or designing projects that actually solve problems, I help you turn curiosity into something real. With me, you’ll learn how to:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTransform an idea into a working prototype\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eUse AI tools to make your project smarter\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePitch your idea in a way that inspires people to care\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eOutside the classroom\u003c/strong\u003e\u003cbr\u003e\u003c/h3\u003e\u003cp\u003eWhen I’m not in the lab or testing a new prototype, you can probably find me on the tennis court, sketching ideas in a notebook, or teaching myself new AI tools that sometimes behave like overexcited teammates. As a student-athlete balancing computer science, research, and competition, I’ve learned a lot about time management and focus, and I love helping students find that same balance while chasing what excites them. I like projects that make people think, smile, and act, all at once.\u003c/p\u003e\u003cp\u003eIf you’re someone who wants to create something meaningful (and maybe a little futuristic), I’d love to help you bring it to life.\u003c/p\u003e","teachingVideoPlaybackId":"18vJ02mwg02aiSVGlYGIVRvn6C6MlYfyGv00Xc7WT02IxN4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"95164dff-1c46-4dc8-a3f6-45b0fa49ef34\"}"},{"__ref":"Favorites:{\"uuid\":\"9f46f67a-33c5-42b3-90d3-a61695e19e57\"}"},{"__ref":"Favorites:{\"uuid\":\"d6652ab3-cab1-44d9-b8d3-d87ef30842d6\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e63fbff5-a8ec-4c44-9b57-faf0a91eeaf0\"}"},{"__ref":"DeepDives:{\"uuid\":\"4343df33-9c27-485a-a76f-6d544489e75c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b652315e-7270-4cef-a7f0-9d0116e3f642\"}"},{"__ref":"DeepDives:{\"uuid\":\"46a8d057-4be9-46b7-8515-aa777c12bc0d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2b4740fe-a425-4413-a4f8-73902d448697/-/preview/-/format/jpg/","https://ucarecdn.com/2b4663da-6a61-44f6-943b-fa13afa69ccb/-/preview/-/format/jpg/","https://ucarecdn.com/d2736509-3f17-4b11-9dc9-3739f2209adb/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1b063f16-aca6-4817-a904-d6631957d8cb\"}"},{"__ref":"Education:{\"uuid\":\"349b0ff2-004b-442f-949c-19d4e17a43e1\"}"}],"hiredAt":"2025-10-15T05:49:52.710Z","topics":["Algebra I","Algebra II","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Chemistry","Academic Coaching","Computer Science","Executive Function","K-6 Storybook","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Machine Learning / AI","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mihir-parcha\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1af56fc8-958b-475b-9715-cdce9ee2dc37\"}"}}},"_sentryTraceData":"f0cb00192d3240df83c4b1b20901339b-bf514705f240f0e3-0","_sentryBaggage":"sentry-environment=vercel-pro
