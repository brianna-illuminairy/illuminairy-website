xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6d68ec2a-ed67-4974-be33-fd2665ae3304\"}":{"__typename":"Favorites","uuid":"6d68ec2a-ed67-4974-be33-fd2665ae3304","photoUrl":"https://ucarecdn.com/40f11564-d588-4939-9d28-919c80a941a9/","title":"The Secret History by Donna Tartt","type":"BOOK"},"Favorites:{\"uuid\":\"c2a68b5b-ea2b-4d5f-ad88-3ee0bdf3f2b3\"}":{"__typename":"Favorites","uuid":"c2a68b5b-ea2b-4d5f-ad88-3ee0bdf3f2b3","photoUrl":"https://ucarecdn.com/be215843-a3cb-4231-8e3c-385a3ad59f7c/","title":"Crew!","type":"SPORT"},"Favorites:{\"uuid\":\"b07b21e4-ac7c-4ed3-bb5b-8fe2770027b7\"}":{"__typename":"Favorites","uuid":"b07b21e4-ac7c-4ed3-bb5b-8fe2770027b7","photoUrl":"https://ucarecdn.com/eedcb467-a4e3-4acb-af86-763621f1dc32/","title":"Melodrama by Lorde","type":"ALBUM"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d487fc69-c42f-4d3b-9f9a-74d1fab80ee0\"}":{"__typename":"DeepDives","uuid":"d487fc69-c42f-4d3b-9f9a-74d1fab80ee0","content":"\u003cp\u003eI attended boarding school, where I gravitated towards intellectual rabbit holes and lively communities. I spent much of my time with languages—filling messy notebooks with personalized Latin translations and debating interpretations of ancient texts—but I also held leadership positions that forged cross-campus connections. I served as a prefect in lower-classmen dorms, co-presided over the Model United Nations society, and captained the Cross-Country Skiing team. I also rowed crew throughout all four years of high school, and relished the harmony of eight oarlocks clicking in perfect unison. Outside the classroom, I worked as a camp counselor in Idaho, guiding backpacking trips and braving white-water rapids that encouraged campers to embrace the all-important spirit of adventure.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9d231eb7-541a-40ad-a038-77f8fb312571\"}":{"__typename":"DeepDives","uuid":"9d231eb7-541a-40ad-a038-77f8fb312571","content":"\u003cp\u003eI’m happiest when I’m outdoors or immersed in stories. I love skiing, trail-running, and biking in the Sawtooth Mountains, where I’ve spent several summers cowboy-camping beneath the Milky Way. I’m constantly reading—sometimes contemporary novels, sometimes ancient texts— whatever will help me reach my yearly Goodreads goal. I enjoy cooking elaborate meals for family, securing the perfect study spot at a cozy cafe, and taking sunset strolls with my closest friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e07e6f70-8a8d-4858-9d72-868b716a9765\"}":{"__typename":"DeepDives","uuid":"e07e6f70-8a8d-4858-9d72-868b716a9765","content":"\u003cp\u003eI hope to curate ancient art exhibitions that showcase antiquity’s underrepresented perspectives. I’m fascinated by the stories embedded in ancient objects—who made them, who saw them, and whose voices were left out of the narratives we usually tell. Through my studies in Classics and my interest in museums, I’d love to design collections that present ancient art in ways that feel vivid, accessible, and more inclusive of the diverse communities that shaped the ancient Mediterranean. If I can help visitors see familiar artifacts through a new lens—or discover overlooked histories within them—I’ll feel like I’ve done something meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"eeab188a-52dc-4d99-8948-80c89a34ac48\"}":{"__typename":"DeepDives","uuid":"eeab188a-52dc-4d99-8948-80c89a34ac48","content":"\u003cp\u003eI absolutely hated spontaneity. I moved frequently throughout childhood—between schools in London and later to New York—and clung to routines to feel stable. But years of summers in the unpredictable Idaho wilderness slowly rewired me. As a camper, then as a counselor, I learned to embrace fluctuating plans, sudden thunderstorms, and improvised adventures. Now I appreciate the unexpected—whether that means chasing a double rainbow with campers, redesigning cross-country skiing practices during a snowless season, or experimenting with unconventional word choices in a translation. Beneath my organized exterior, I’ve learned to wholeheartedly embrace surprises, then transform them into edifying experiences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a40ffe95-6632-4e24-bf20-cb773e777316\"}":{"__typename":"Education","uuid":"a40ffe95-6632-4e24-bf20-cb773e777316","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Classics","degree":null},"School:{\"uuid\":\"98257c72-57ec-4e19-bca8-fb555ec7d23b\"}":{"__typename":"School","uuid":"98257c72-57ec-4e19-bca8-fb555ec7d23b","name":"Phillips Academy — Andover","city":"Andover","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01810"},"Education:{\"uuid\":\"8bfb1255-94ff-4a93-bd28-d208244066c3\"}":{"__typename":"Education","uuid":"8bfb1255-94ff-4a93-bd28-d208244066c3","school":{"__ref":"School:{\"uuid\":\"98257c72-57ec-4e19-bca8-fb555ec7d23b\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"75b88e33-f841-4b37-bada-1fde8dfd79e8\"}":{"__typename":"MentorPublicProfile","uuid":"75b88e33-f841-4b37-bada-1fde8dfd79e8","displayName":"Sage P.","slug":"sage-preston-1","biography":"\u003cp\u003eHi! My name is Sage, and I'm passionate about mentoring students in writing, Latin, history, and college essays. Although I appreciate STEM-oriented subjects, I've always been particularly drawn to the humanities, exploring potential answers to the question: \u003cem\u003ewhat makes us human? \u003c/em\u003eI'm currently studying Classics (Latin and Greek!) at university, and I'm interested in bringing my linguistic expertise to museums. I'm fascinated by ancient art, and would love to curate exhibitions in the future. I also love reading—in English, Latin, or Greek! In addition to translating ancient inscriptions during excavations, I hope to publish my own thoughtful translations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough I specialise in Classics, I've peer-tutored students in chemistry, as well as Latin and Greek at my previous institution. I also published and edited articles for our Classics magazine. I've won multiple awards within my high school's Classics and Social Sciences departments, and was inducted into the international Cum Laude Society upon graduation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my junior and senior years of high school, I worked as a teaching assistant for an Equity, Balance, and Inclusion class, served as prefect in lowerclassmen dorms, and guided prospective families through campus as a tour guide. I was also selected as Co-President of my institution's Model United Nations and captain of Varsity Cross-Country Skiing by my fellow teammates. Although I captained Cross-Country Skiing, I'm especially proud of my commitment to our Varsity Crew team, which I competed for throughout my entire high school career.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and extracurriculars, I love spending time outdoors, traveling, and cooking. I'm a part-time camp counselor and have spent previous summers organizing backpacking trips, river-rafting adventures, and capture-the-flag games for my adventurous campers. I also love skiing, hiking, and biking in my free time. Having hailed from London and New York City, I'm a massive fan of walkable cities—I enjoy strolling around new destinations without an agenda, taking in unforgettable sights, and collecting unique souvenirs along the way. Whenever I'm home, I spend hours in my kitchen, testing delicious recipes and throwing extravagant dinner parties for family and friends.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThanks for taking the time to get to know me and my interests— I look forward to meeting you!\u003c/p\u003e","teachingVideoPlaybackId":"drSJ00hp4bfdaA3ar2V8dHCSqBie02Y6g3bWLJ2I6CUI00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6d68ec2a-ed67-4974-be33-fd2665ae3304\"}"},{"__ref":"Favorites:{\"uuid\":\"c2a68b5b-ea2b-4d5f-ad88-3ee0bdf3f2b3\"}"},{"__ref":"Favorites:{\"uuid\":\"b07b21e4-ac7c-4ed3-bb5b-8fe2770027b7\"}"}],"causesSupported":[],"major":"Classics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d487fc69-c42f-4d3b-9f9a-74d1fab80
