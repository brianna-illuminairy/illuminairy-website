xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f0025336-e357-4c2b-8adc-e3cc2dfe3b5a\"}":{"__typename":"Favorites","uuid":"f0025336-e357-4c2b-8adc-e3cc2dfe3b5a","photoUrl":"https://ucarecdn.com/c0f0112c-0001-4b47-b422-39d0889a5b7e/","title":"Joe Burrow","type":"ATHLETE"},"Favorites:{\"uuid\":\"178324df-7d26-46b9-b2a3-4d8f5ffdb8ef\"}":{"__typename":"Favorites","uuid":"178324df-7d26-46b9-b2a3-4d8f5ffdb8ef","photoUrl":"https://ucarecdn.com/72020fc6-1456-44f4-8f46-bd3f6065e32e/","title":"Illmatic","type":"ALBUM"},"Favorites:{\"uuid\":\"cb7840eb-8c16-4b18-a472-136ae67816d7\"}":{"__typename":"Favorites","uuid":"cb7840eb-8c16-4b18-a472-136ae67816d7","photoUrl":"https://ucarecdn.com/62189a70-47bc-448e-add4-2347760d0d18/","title":"The Shawshank Redemption","type":"MOVIE"},"CausesSupported:{\"uuid\":\"9a146dbc-8579-4914-87d2-abba58f2d9da\"}":{"__typename":"CausesSupported","uuid":"9a146dbc-8579-4914-87d2-abba58f2d9da","name":"International Institute of St. Louis","description":"\u003cp\u003eHelped tutor refugees in the greater STL metro area.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/f6234a03-c272-4702-b559-d038dc446b8b/"},"CausesSupported:{\"uuid\":\"e61f6bac-c9f5-4f9f-a3db-8648779940f5\"}":{"__typename":"CausesSupported","uuid":"e61f6bac-c9f5-4f9f-a3db-8648779940f5","name":"Partners in East St. Louis","description":"\u003cp\u003eAssisted underprivileged grade-school students in East STL, Illinois.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/20b5d03d-1724-4415-9ecf-2261c8b7d33b/"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0afef809-3d90-46b2-b247-b457fbf15ec6\"}":{"__typename":"DeepDives","uuid":"0afef809-3d90-46b2-b247-b457fbf15ec6","content":"\u003cp\u003eWhen I wasn't throwing footballs in the morning, shooting hoops in the afternoon, or running sprints to stay in shape, I spent a bulk of my summers traveling. Fortunately, I was able to travel to a number of countries abroad and really learn more about the world. \u003cbr\u003e\u003cbr\u003eBeyond traveling, I could often be found reading, hammocking outside, or hanging out with our chocolate lab, Duke!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"650ac692-064e-48fe-8886-aa076e55b842\"}":{"__typename":"DeepDives","uuid":"650ac692-064e-48fe-8886-aa076e55b842","content":"\u003cp\u003eTo me, mentorship is much more than teaching; it's about establishing a real connection. I learn just as much from my mentees as they do from me. It's a shared journey where we grow together and mutually build each other up. \u003cbr\u003e\u003cbr\u003eIn the past, working as a tutor has been an incredibly fulfilling experience for me. There's something so rewarding about witnessing students grow and watching their confidence skyrocket. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d1ba629f-3337-46ae-9ca5-87dfb43b15dd\"}":{"__typename":"DeepDives","uuid":"d1ba629f-3337-46ae-9ca5-87dfb43b15dd","content":"\u003cp\u003eBeat my older brother in a race\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1ddad1bc-fc6a-47c4-9bc4-38a563799535\"}":{"__typename":"DeepDives","uuid":"1ddad1bc-fc6a-47c4-9bc4-38a563799535","content":"\u003cp\u003eEnjoy the process! it can be so easy to get lost in the relentless ascent, always focusing on the next milestone.\u003cbr\u003e\u003cbr\u003eTry to take some time and appreciate how far you have come and the people you are surrounded by. Trust in yourself to build the foundation for the future!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"83a1f3c8-d4f0-4b54-83ca-1b2342d5b23b\"}":{"__typename":"School","uuid":"83a1f3c8-d4f0-4b54-83ca-1b2342d5b23b","name":"Springfield Catholic High School","city":"Springfield","type":"HIGH","state":"MO","country":"United States","zip":"65809"},"Education:{\"uuid\":\"3f820879-0aee-4041-b3ec-21e88c34a22e\"}":{"__typename":"Education","uuid":"3f820879-0aee-4041-b3ec-21e88c34a22e","school":{"__ref":"School:{\"uuid\":\"83a1f3c8-d4f0-4b54-83ca-1b2342d5b23b\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"cba21102-fe24-4833-903a-82ea1d722903\"}":{"__typename":"Education","uuid":"cba21102-fe24-4833-903a-82ea1d722903","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2023","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"f2110c52-f2ce-46f8-ab71-e6deb9d137b3\"}":{"__typename":"MentorPublicProfile","uuid":"f2110c52-f2ce-46f8-ab71-e6deb9d137b3","displayName":"Will C.","slug":"will-crites-1","biography":"\u003cp\u003eWill is a recent graduate of Washington University in St. Louis, where he studied Neuroscience and Healthcare Management. Will plans on pursuing his Doctor of Medicine (M.D.) at the University of Cincinnati College of Medicine in July of 2024.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in Southwest Missouri, Will was dedicated in his service to others. In his high school years, Will founded a club that provided tutoring to Congolese refugees and asylum seekers in the area. Will also engaged in Alzheimer's Disease research, where he explored the impact of exercise on the debilitating illness, leading to potential breakthroughs in the field. Finally, he spent countless hours volunteering for the local community - food drives, coaching youth teams, and partnering with charities. And when he was not making a difference in the community or hitting the books, you might find Will trying to perfect his signature apple cider recipe – a pursuit he claims is 'still a work in progress.' Will ended up graduating at the top of his class, receiving an academic scholarship at WashU.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, Will continued his commitment to service. Outside of the classroom, he volunteered as a tutor for both refugee and underprivileged students in the St. Louis Metro area. Will also assisted at both Barnes-Jewish Hospital and Mercy Hospital, where he solidified his passion for medicine. Finally, Will spent hundreds of hours researching Alzheimer’s Disease at the WashU School of Medicine, coached youth baseball and - not to brag - clinched a victory in a highly competitive fantasy football league.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, Will can often be seen with his dog (a golden retriever), spending time outside, watching sports, and hanging out with friends and family. \u003cbr\u003e\u003cbr\u003eApproachable, real, and enthusiastic, Will looks forward to sharing his knowledge in medicine, healthcare, STEM, and the application process. He's also more than ready to jump into any sports, movie, or music debate you might bring to the table.\u003c/p\u003e","teachingVideoPlaybackId":"EYDhsQX7W0262W02lqWoyqgW02bd400A02ZV8OdFCizUppqk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSure, I had heard all of the noise. “General Chemistry is the weedout class.” “High school tests are nowhere near college tests.” Still, despite these warnings, I stepped onto campus for the first time, feeling a naive sense of confidence and preparedness. I believed that my former study habits I had developed would comfortably navigate me through the academic challenges of college.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePairing the buzz of my phone with the classic chime from \u003cem\u003eOutlook, \u003c/em\u003eI quickly logged into my \u003cem\u003eCanvas \u003c/em\u003eaccount, checking the score of my first midterm. 40%. Nearly 20 points below the mean and on par for a “C” in the course, I was absolutely crushed.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eRather than torturing myself over the test score, I decided to use this setback as a learning opportunity. To succeed, I needed to refine my study strategies. I began seeking out study groups, surrounding myself with others who had different strategies for learning the material. I began attending office hours, overcoming my hesitations to ask questions and seek help. Most importantly, I let go of having to be “number one,” as I embraced a growth mindset, while limiting comparisons to others.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile the results I was hoping for did not come overnight, my grades gradually began to improve - I was scoring 30 points higher on the subsequent tests. And though I only managed a B in the class, these experiences showed me the importance of continually evolving my strategies in the face of new challenges, seeking assistance and collaboration, and not being afraid to make mistakes. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f0025336-e357-4c2b-8adc-e3cc2dfe3b5a\"}"},{"__ref":"Favorites:{\"uuid\":\"178324df-7d26-46b9-b2a3-4d8f5ffdb8ef\"}"},{"__ref":"Favorites:{\"uuid\":\"cb7840eb-8c16-4b18-a472-136ae67816d7\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9a146dbc-8579-4914-87d2-abba58f2d9da\"}"},{"__ref":"CausesSupported:{\"uuid\":\"e61f6bac-c9f5-4f9f-a3db-8648779940f5\"}"}],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0afef809-3d90-46b2-b247-b457fbf15ec6\"}"},{"__ref":"DeepDives:{\"uuid\":\"650ac692-064e-48fe-8886-aa076e55b842\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1ba629f-3337-46ae-9ca5-87dfb43b15dd\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ddad1bc-fc6a-47c4-9bc4-38a563799535\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fec69404-ae68-442c-80cf-513414bddafd/-/preview/-/format/jpg/","https://ucarecdn.com/cd14b77d-af5c-46ec-ba75-b3ea47a99640/-/preview/-/format/jpg/","https://ucarecdn.com/de15c382-bb6a-4521-941a-ab55c9566d62/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3f820879-0aee-4041-b3ec-21e88c34a22e\"}"},{"__ref":"Education:{\"uuid\":\"cba21102-fe24-4833-903a-82ea1d722903\"}"}],"hiredAt":"2024-01-10T20:48:22.697Z","topics":["Global Health","STEM Project","Medicine / Health","Chemistry","Biology"],"communityBadges":["https://ucarecdn.com/09da5bb5-3efa-4fae-89ff-19db3c27efba/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"will-crites-1\"}})"
