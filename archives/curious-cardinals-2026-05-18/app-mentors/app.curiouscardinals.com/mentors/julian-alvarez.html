xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f720ecc2-833b-4ed0-8cff-04a019f7e1ce\"}":{"__typename":"Favorites","uuid":"f720ecc2-833b-4ed0-8cff-04a019f7e1ce","photoUrl":"https://ucarecdn.com/e44abeff-498c-44ef-8300-def53567694e/","title":"Man's Search for Meaning","type":"BOOK"},"Favorites:{\"uuid\":\"d5a85eec-ccf3-4051-99bc-444e3e788c40\"}":{"__typename":"Favorites","uuid":"d5a85eec-ccf3-4051-99bc-444e3e788c40","photoUrl":"https://ucarecdn.com/de927e6e-6146-45f5-9520-7449e812cabf/","title":"Flume ","type":"ARTIST"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"14ba0287-ba8f-4467-a9d1-1771c44c937e\"}":{"__typename":"DeepDives","uuid":"14ba0287-ba8f-4467-a9d1-1771c44c937e","content":"\u003cp\u003ei already have my dream job, which is to be a startup founder that is dreaming up and building out the future of education.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b9248161-597d-478f-8d19-f1a600cb3bee\"}":{"__typename":"DeepDives","uuid":"b9248161-597d-478f-8d19-f1a600cb3bee","content":"\u003cp\u003emy purpose-driven nature is to empower humans to explore, discover, and bring to life their unbounded potential.\u003cbr\u003e\u003cbr\u003ethere's two parts to this. \u003cbr\u003e\u003cbr\u003ethe first is to create the space for them to explore and discover 4 core things...\u003cbr\u003e1. becoming: who they are, who they want to become, and what gives them meaning, etc.\u003cbr\u003e2. creating: what things they enjoy creating the most (music, art, products, companies, etc.)\u003cbr\u003e3. achieving: what are the big milestones they want to achieve\u003cbr\u003e4. giving: in what ways they want to give back to the world and the people around them. what problems they care the most about solving and what type of people they want to help the most\u003cbr\u003e\u003cbr\u003eand the 2nd part is to provide the space, guidance, and support needed for them to to build the confidence, skills, \u0026amp; ownership to shape and live out their own path \u0026amp; in the process, contribute meaningfully to society.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ei think mentorship provides a direct channel to help guide others on their path to discover who they are, what type of things they care about the most, and what path they want to take in life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ementorship is also beautiful because a good mentor is able to spark meaningful introspection for others, and i think introspection is the most powerful driver of self-discovery and growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c4509120-1e7a-4220-8a78-86552a4d27df\"}":{"__typename":"DeepDives","uuid":"c4509120-1e7a-4220-8a78-86552a4d27df","content":"\u003ch2\u003e\u003cstrong\u003eI dream of\u003c/strong\u003e\u003c/h2\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eManifesting my infinite potential and empowering others to do the same\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInspiring others to do the things that inspire them\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInventing the Future of Learning \u0026amp; Education\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWriting many best selling books\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating beautiful electronic music that induces deep states of flow\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDJing at a massive music festival\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHaving a podcast with millions of listeners\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBecoming a billionaire\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a trillion dollar company\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a legacy that will echo throughout eternity\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a beautiful family\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePlaying soccer with Messi\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMaking my dreams a reality\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"88dac9ac-82b9-473d-868e-609298e9e861\"}":{"__typename":"DeepDives","uuid":"88dac9ac-82b9-473d-868e-609298e9e861","content":"\u003cp\u003eaim to be a curious explorer, scientific experimenter, and aim to develop the super power of becoming comfortable with discomfort\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ecurious explorer\u003c/strong\u003e: there's so much variety, beauty, and depth in life and unfortunately, most schools don't do a great job at giving you the exposure and space to explore so many critical \u0026amp; interesting skills, careers, and intellectual curiosities. you must be intentional and proactive in trying new things in life and to make the time to go deeper in the things that spark your curiosity\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003escientific experimenter\u003c/strong\u003e: after over 1000 different experiments, Thomas Edison finally discovered how to make a light bulb work. He has a famous saying that touches on the value of experimentation and and on how to reframe failure in your mind, \"\u003cstrong\u003e\u003cem\u003eI have not failed. I've just found 10,000 ways that won't work\u003c/em\u003e\u003c/strong\u003e.\"\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003erisk \u0026amp; discomfort\u003c/strong\u003e: the most meaningful life experiences are usually incredibly difficult and uncomfortable. most people are addicted to comfort and are never able to overcome the imaginary fears and made up limiting beliefs that hold them back. being a person of action and seeking discomfort rather than fearing it is one of the most valuable skills you can develop.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"02fc5c91-2354-44c3-83ad-079bf7091fbd\"}":{"__typename":"School","uuid":"02fc5c91-2354-44c3-83ad-079bf7091fbd","name":"IB @ Lamar Academy","city":"McAllen","type":"HIGH","state":"Texas","country":"United States","zip":"78501"},"Education:{\"uuid\":\"0dbc21d0-7aaf-4e70-a83a-db97aaa45c75\"}":{"__typename":"Education","uuid":"0dbc21d0-7aaf-4e70-a83a-db97aaa45c75","school":{"__ref":"School:{\"uuid\":\"02fc5c91-2354-44c3-83ad-079bf7091fbd\"}"},"startYear":"2011","endYear":"2015","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a55aea52-1e88-449f-8ec3-2923c93cecd1\"}":{"__typename":"School","uuid":"a55aea52-1e88-449f-8ec3-2923c93cecd1","name":"Texas A\u0026M University","city":"College Station","type":"COLLEGE","state":"Texas","country":"United States","zip":"77840"},"Education:{\"uuid\":\"d0434e7b-4c5f-456f-aa25-e8cfd7151064\"}":{"__typename":"Education","uuid":"d0434e7b-4c5f-456f-aa25-e8cfd7151064","school":{"__ref":"School:{\"uuid\":\"a55aea52-1e88-449f-8ec3-2923c93cecd1\"}"},"startYear":"2015","endYear":null,"expectedGradYear":"2020","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"3b7c9816-d5a7-4f14-ae38-456af71e8078\"}":{"__typename":"MentorPublicProfile","uuid":"3b7c9816-d5a7-4f14-ae38-456af71e8078","displayName":"Julian A.","slug":"julian-alvarez","biography":"\u003cp\u003ehi, i'm Julian! I am a curiosity driven startup founder, software engineer, and life-long learner, obsessed with dreaming up and building the future of education. \u003cbr\u003e\u003cbr\u003ei've been coding since i was 13, have been a startup founder for 9+ years, have built around 15 ideas, and my current startup, Jungle, is the first one that has worked.\u003cbr\u003e\u003cbr\u003e💥 I am a Co-Founder and the CEO at Jungle, an AI learning platform that is making learning easy and fun for 1.5M+ students. students can transform any learning material (PDFs, videos, etc.) into a gamified quiz. the core magic is being able to go from passively consuming some learning material to a fun active learning experience that uses learning science backed methods to help you gain mastery on any subject.\u003cbr\u003e🏅 i was named on Forbes 30 under 30 Education for the work i've done with Jungle. (https://www.forbes.com/profile/jungle)\u003cbr\u003e\u003cbr\u003e⏮️ previously, I was...\u003c/p\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003ea software engineer at Meta (learning team), LinkedIn Learning, and Goldman Sachs\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ethe host of the Inventing The Future Podcast (inventingthefuture.ai), where I told the stories of 25+ visionary tech entrepreneurs that are solving the world's biggest problems.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ethe Co-Founder \u0026amp; CTO at a startup named Vize, where we had the mission of helping low-income workers find a job that they love and empowering them to advance in their professional lives.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI graduated from Texas A\u0026amp;M University with a degree in Computer Science.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ethroughout the course of my professional life, i have hired and directly managed + led 20+ people\u003cbr\u003e\u003cbr\u003e🔭 why i do what i do \u0026amp; why i love being a mentor...\u003cbr\u003emy purpose-driven nature is to empower humans to explore, discover, and bring to life their unbounded potential.\u003cbr\u003e\u003cbr\u003ethere's two parts to this. \u003cbr\u003e\u003cbr\u003ethe first is to create the space for them to explore and discover 4 core things...\u003cbr\u003e1. becoming: who they are, who they want to become, and what gives them meaning, etc.\u003cbr\u003e2. creating: what things they enjoy creating the most (music, art, products, companies, etc.)\u003cbr\u003e3. achieving: what are the big milestones they want to achieve\u003cbr\u003e4. giving: in what ways they want to give back to the world and the people around them. what problems they care the most about solving and what type of people they want to help the most\u003cbr\u003e\u003cbr\u003eand the 2nd part is to provide the space, guidance, and support needed for them to to build the confidence, skills, \u0026amp; ownership to shape and live out their own path \u0026amp; in the process, contribute meaningfully to society.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cbr\u003e\u003cp\u003esome fun facts:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ei'm originally from Medellin, Colombia and grew up in small border town city in Texas named McAllen\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ei love electronic music and will sometimes DJ during my free time!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ei love playing soccer and was the captain of the varsity soccer team in high school\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eyou can learn more about me through my LinkedIn and personal website:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ehttps://www.linkedin.com/in/julianalvarez42\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ehttps://julian.ai\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"TvPMhmohtrokAoriMPXnumY01R8jW1Des8pmqeQHXLpQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f720ecc2-833b-4ed0-8cff-04a019f7e1ce\"}"},{"__ref":"Favorites:{\"uuid\":\"d5a85eec-ccf3-4051-99bc-444e3e788c40\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"14ba0287-ba8f-4467-a9d1-1771c44c937e\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9248161-597d-478f-8d19-f1a600cb3bee\"}"},{"__ref":"DeepDives:{\"uuid\":\"c4509120-1e7a-4220-8a78-86552a4d27df\"}"},{"__ref":"DeepDives:{\"uuid\":\"88dac9ac-82b9-473d-868e-609298e9e861\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7aed5626-51f8-486b-b598-c230fea7c791/-/preview/-/format/jpg/","https://ucarecdn.com/eae62004-5b4b-4ac3-9e12-dd281fb7d494/-/preview/-/format/jpg/","https://ucarecdn.com/9bb6843c-2c5f-45f9-80c1-2f287e6ff629/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0dbc21d0-7aaf-4e70-a83a-db97aaa45c75\"}"},{"__ref":"Education:{\"uuid\":\"d0434e7b-4c5f-456f-aa25-e8cfd7151064\"}"}],"hiredAt":"2026-01-06T00:58:45.348Z","topics":["Business / Entrepreneurship","Coding / Programming","Machine Learning / AI","Public Speaking"],"communityBadges":[],"restricte
