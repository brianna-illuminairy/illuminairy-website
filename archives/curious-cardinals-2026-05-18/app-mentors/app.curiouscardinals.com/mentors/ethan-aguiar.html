xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"248a12bc-5850-4554-8910-4c822d05311b\"}":{"__typename":"DeepDives","uuid":"248a12bc-5850-4554-8910-4c822d05311b","content":"\u003cp\u003e I plan to pursue a career in medicine, likely in cardiology, where I hope to combine patient care with advocacy for systemic change. Growing up, I saw how socioeconomic inequality can determine whether someone receives timely, effective treatment, and I’ve become passionate about addressing those barriers—whether through clinical work, policy reform, or community outreach. One thing I hope to accomplish in my lifetime is to fight to make quality healthcare more accessible to underprivileged communities. My goal is not just to treat patients, but to help build a system where no one’s health depends on their income or background.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"1b1beee4-5488-442d-a5f7-54be3eb521a9\"}":{"__typename":"DeepDives","uuid":"1b1beee4-5488-442d-a5f7-54be3eb521a9","content":"\u003cp\u003eWhen I was a first-year student, I really valued the mentorship I received from older pre-med students who helped me navigate the challenges of starting college and figuring out what it takes to succeed in such a demanding path. Their advice—on everything from study habits to managing burnout—made a huge difference in my confidence and direction. I quickly realized how hard it can be to find your footing when you don’t yet know what questions to ask or where to turn for guidance. Mentorship provided that bridge for me, and I want to pay it forward by helping others through the same process. Through my own experiences balancing academics, research, and wellness, I hope to make the journey a little clearer and less overwhelming for students who are just starting out.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a8d1fdf8-b990-4a1b-a651-ac13596f903f\"}":{"__typename":"DeepDives","uuid":"a8d1fdf8-b990-4a1b-a651-ac13596f903f","content":"\u003cp\u003eDuring the summers in high school, I worked at a local cheese shop and spent time volunteering at my town’s library. The job taught me a lot about working with people (and about cheese), while the library let me give back to my community in a quieter, more personal way. Outside of work, I spent a lot of time outdoors—hiking, sailing, and exploring nature trails around Rhode Island. I also made a point to enjoy time with friends and family, whether that meant going to the beach or just hanging out with friends and enjoying the break from school. Those summers taught me how to balance responsibility with making time to relax and have fun, something I found was very important moving into college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"356306c2-35eb-42dc-bd30-77145ab86a37\"}":{"__typename":"DeepDives","uuid":"356306c2-35eb-42dc-bd30-77145ab86a37","content":"\u003cp\u003eI’ve always known I wanted to go into medicine, but I chose Biochemistry because I wanted to understand what’s happening on the molecular level behind how our bodies function—and sometimes fail. My interest in chemistry really took off in high school thanks to a teacher who made the subject come alive and showed me how it connects to everything from medicine to everyday life. That experience not only deepened my curiosity but also shaped the way I approach learning—by asking questions and connecting concepts across disciplines. Studying Biochemistry feels like the perfect mix of my passion for science and my long-term goal of becoming a physician who understands both the science and the human side of care.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"6a0a4cfe-bfef-4345-b4b6-a5456a984fc0\"}":{"__typename":"School","uuid":"6a0a4cfe-bfef-4345-b4b6-a5456a984fc0","name":"Tiverton High School","city":"Tiverton","type":"HIGH","state":"RI","country":"United States","zip":"02878"},"Education:{\"uuid\":\"fde5cfd8-9263-4df0-b185-65c1f3c13380\"}":{"__typename":"Education","uuid":"fde5cfd8-9263-4df0-b185-65c1f3c13380","school":{"__ref":"School:{\"uuid\":\"6a0a4cfe-bfef-4345-b4b6-a5456a984fc0\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"1f11637d-8e56-46c8-bfa1-aff1d571fc7c\"}":{"__typename":"Education","uuid":"1f11637d-8e56-46c8-bfa1-aff1d571fc7c","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biochemistry \u0026 Molecular Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"b57c2518-4329-4dde-a524-559c0a59a76b\"}":{"__typename":"MentorPublicProfile","uuid":"b57c2518-4329-4dde-a524-559c0a59a76b","displayName":"Ethan A.","slug":"ethan-aguiar","biography":"\u003cp\u003eHi! My name is Ethan and I'm really looking forward to working with you as your CC peer mentor. I’m currently a student at Brown University majoring in Biochemistry and Molecular Biology, originally from Tiverton, Rhode Island. I’ve always been fascinated by how chemistry and biology come together to explain the world around us, from the reactions that drive our cells to the ecosystems that sustain life. My studies have deepened my appreciation for both the complexity of living systems and the importance of curiosity and persistence in understanding them.\u003c/p\u003e\u003cp\u003eOutside of academics, I’m passionate about mentorship and community building, and I serve as a peer mentor for first year college students. I love helping others find confidence in their studies, whether that’s breaking down tough concepts, developing stronger study habits, or just talking through the ups and downs of adjusting to new environments. I believe that learning is most rewarding when it’s collaborative and hands-on, and I try to create a welcoming, supportive space where questions and curiosity are always encouraged.\u003c/p\u003e\u003cp\u003eI’m especially interested in tutoring and mentoring students in Chemistry, Biology, Physics, and History, as well as offering academic coaching and executive function support, things like time management, staying organized, and balancing responsibilities. I enjoy working with people one-on-one and finding what learning strategies work best for them. My goal as a mentor is to not only help students succeed academically but to help them feel grounded, confident, and connected to the community around them.\u003c/p\u003e\u003cp\u003eWhen I’m not studying or mentoring, I spend a lot of time outdoors. I love hiking, sailing, and exploring nature trails, which give me space to slow down and reset. I also enjoy playing piano, snowboarding, and skateboarding, activities that help me focus, stay creative, and have fun. I’ve always believed in maintaining balance between academic drive and personal well-being, and I try to bring that same mindset to mentoring. From experience, I know that finding this balance can often be difficult, especially as college applications draw near, but I truly believe that setting aside time to do the things you love can, and will, help you find focus and purpose in your academics!\u003c/p\u003e\u003cp\u003eAs a peer mentor, I value meaningful conversations, open mindedness, and mutual support. I’m excited to get to know you, learn about your goals and interests, and help you find your footing both academically and personally. Whether it’s navigating classes, exploring new passions, or just figuring out what's next, I look forward to being someone you can count on for guidance, encouragement, and a friendly conversation.\u003c/p\u003e","teachingVideoPlaybackId":"KY2MTdkeD8z4IFYcnSShII7g8gu004OrLhJ01J6k89Koo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biochemistry \u0026 Molecular Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"248a12bc-5850-4554-8910-4c822d05311b\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b1beee4-5488-442d-a5f7-54be3eb521a9\"}"},{"__ref":"DeepDives:{\"uuid\":\"a8d1fdf8-b990-4a1b-a651-ac13596f903f\"}"},{"__ref":"DeepDives:{\"uuid\":\"356306c2-35eb-42dc-bd30-77145ab86a37\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2ee6f309-8824-4331-93a8-a9dbdc8610d3/-/preview/-/format/jpg/","https://ucarecdn.com/4f4936bc-c30f-44f5-b4d0-2ff1cdeff0b6/-/preview/-/format/jpg/","https://ucarecdn.com/9fe09a70-fbfe-4b50-9660-61e834
