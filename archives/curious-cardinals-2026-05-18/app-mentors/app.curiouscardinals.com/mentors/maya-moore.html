xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9abdf7c4-3ba3-49fe-b278-e02743c42ff8\"}":{"__typename":"Favorites","uuid":"9abdf7c4-3ba3-49fe-b278-e02743c42ff8","photoUrl":"https://ucarecdn.com/c4ce8d81-5654-4199-bfa5-2cfea3e37ba1/","title":"The Dry Heart","type":"BOOK"},"Favorites:{\"uuid\":\"d8aa0b55-4514-443a-8692-a03dbf7bccae\"}":{"__typename":"Favorites","uuid":"d8aa0b55-4514-443a-8692-a03dbf7bccae","photoUrl":"https://ucarecdn.com/f0c50071-9584-4085-9dd8-7360465f624d/","title":"Berkeley \u003c3","type":"CITY"},"Favorites:{\"uuid\":\"501ac26c-c61e-4164-bbea-b54c31cb660a\"}":{"__typename":"Favorites","uuid":"501ac26c-c61e-4164-bbea-b54c31cb660a","photoUrl":"https://ucarecdn.com/4d3fc850-eef8-462d-ab16-15889ad53565/","title":"Pixies","type":"ARTIST"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8c71b933-eef6-483e-9657-959a465d9d06\"}":{"__typename":"DeepDives","uuid":"8c71b933-eef6-483e-9657-959a465d9d06","content":"\u003cp\u003eI am a huge runner. I started running track \u0026amp; field when I was in kindergarten and running has been a part of my life ever since! Participating in track in kindergarten also introduced me to some of my very best friends (one of whom is pictured here after we ran the B.A.A. half marathon together). I love movies and TV shows. Some of my favorites include Severance, The Truman Show, and Everything Everywhere All at Once. Another major part of how I spend my spare time is listening to live music. I am at Yale in New Haven right now and there are so many amazing music venues here that have a really rich history.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"f24ad40f-9833-482a-bea3-673994e332e0\"}":{"__typename":"DeepDives","uuid":"f24ad40f-9833-482a-bea3-673994e332e0","content":"\u003cp\u003eI am not a strong public speaker but I was recently invited as a keynote speaker to a workshop in my field. It was an honor to have the work I have been putting into my research recognized on a bigger scale. I was one of three graduate students invited to give a talk, the rest were all postdocs, professors, or senior research scientists. I dedicated a lot of time preparing my slides and practicing my talk with anyone that would listen in an attempt to ease the anxieties I had about presenting to a room full of people who had been in my field much longer than I have. Once I started my talk I felt my practice pay off. I felt much more comfortable than I have before and I was able to feel excited that I was sharing the work I love with other people which was the best part!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"dcd83fcf-92f3-488e-aa22-82819a186ae9\"}":{"__typename":"DeepDives","uuid":"dcd83fcf-92f3-488e-aa22-82819a186ae9","content":"\u003cp\u003eMentorship is so crucial in cultivating a diverse and rich scientific community. It's impossible to know everything when you're entering a new major, a new school program, a new anything. A mentor obviously also does not know everything but they have been where you are and their guidance is essential for navigating these new spheres. Science is challenging enough and we need mentors to help create safe and welcoming spaces so that our intellectual community can grow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b6ff7ae8-309e-40da-b232-31545cbbc0d6\"}":{"__typename":"DeepDives","uuid":"b6ff7ae8-309e-40da-b232-31545cbbc0d6","content":"\u003cp\u003eI chose to study physics because it is a fundamental discipline. My field of particle physics tackles lofty questions about the origin of the universe and how we came to be. The physics world is so full of wonder, it is really inspiring as a young scientist. I also had some excellent teachers that helped guide my path in physics. I took physics my senior year of high school and my teacher was a young woman who had recently graduated from U.C. Berkeley. She spoke candidly with me about her experiences as a woman in a male-dominated field and was a strong mentor to me. She is ultimately why I ended up enrolling at U.C. Berkeley as a physics major!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2e2c1b32-ac19-43f6-a0e2-4c014741037f\"}":{"__typename":"School","uuid":"2e2c1b32-ac19-43f6-a0e2-4c014741037f","name":"Castro Valley High School","city":"Castro Valley","type":"HIGH","state":"California","country":"United States","zip":"94546"},"Education:{\"uuid\":\"798130b3-b003-4cbb-bbc1-08444be5a686\"}":{"__typename":"Education","uuid":"798130b3-b003-4cbb-bbc1-08444be5a686","school":{"__ref":"School:{\"uuid\":\"2e2c1b32-ac19-43f6-a0e2-4c014741037f\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"34f9fc4d-3ab2-4f41-8672-18a6c0ce3e20\"}":{"__typename":"Education","uuid":"34f9fc4d-3ab2-4f41-8672-18a6c0ce3e20","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Physics \u0026 Applied Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"09d93596-0af6-4e24-b352-046d4ab38c0d\"}":{"__typename":"MentorPublicProfile","uuid":"09d93596-0af6-4e24-b352-046d4ab38c0d","displayName":"Maya M.","slug":"maya-moore","biography":"\u003cp\u003eI am a PhD student in Physics at Yale University where my work focuses on experimental particle physics and advanced data analysis. My research is on tiny particles called neutrinos and understanding if their properties could explain the asymmetry of matter and antimatter in the universe. I did my undergraduate at U.C. Berkeley, where I earned my bachelor’s degree in Physics and Applied Mathematics, along with a minor in History. Studying across both technical and humanities disciplines has shaped how I think and teach. I enjoy helping students see that subjects like math and physics are not just about memorizing formulas, but about conceptual understanding and developing confidence in thinking through problems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my PhD at Yale, I have cultivated a strong passion for teaching and mentorship. I spent the first two years of my PhD teaching undergraduate physics lab courses, where I guided students through experiments, helping them understand challenging concepts and develop scientific reasoning skills. I also mentor undergraduates on research projects during the summer for my experiment. This involves identifying a realistic project they can complete within a limited timeframe and meeting with them to guide them in breaking down the project into achievable tasks. These experiences have taught me that every student learns differently. Some students benefit from visual explanations, others from working through problems together, and others from connecting concepts to real-world examples. I enjoy adapting my mentorship style to meet each student where they are and helping them build both understanding and independence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I have always been drawn to quantitative problem-solving as well as interdisciplinary learning. In high school, I took AP courses across the sciences, mathematics, and humanities, and I understand firsthand both the challenges and rewards of rigorous coursework. As a mentor, my goal is not just to help students complete assignments or prepare for exams, but to help them develop confidence in their ability to learn and think critically. Many students struggle not because they lack ability, but because they haven’t yet found an explanation that resonates with them. Whether a student is looking for tutoring help or mentorship on a research project, I aim to create a supportive and engaging learning environment where they can succeed.\u003c/p\u003e","teachingVideoPlaybackId":"PXxJBwF9NhZnqjuevCCKgc6PkADjtPVWLXsyx00LEzTc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9abdf7c4-3ba3-49fe-b278-e02743c42ff8\"}"},{"__ref":"Favorites:{\"uuid\":\"d8aa0b55-4514-443a-8692-a03dbf7bccae\"}"},{"__ref":"Favorites:{\"uuid\":\"501ac26c-c61e-4164-bbea-b54c31cb660a\"}"}],"causesSupported":[],"major":"Physics \u0026 Applied Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8c71b933-eef6-483e-9657-959a465d9d06\"}"},{"__ref":"DeepDives:{\"uuid\":\"f24ad40f-9833-482a-bea3-673994e332e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"dcd83fcf-92f3-488e-aa22-82819a186ae9\"}"},{"__ref":"DeepDiv
