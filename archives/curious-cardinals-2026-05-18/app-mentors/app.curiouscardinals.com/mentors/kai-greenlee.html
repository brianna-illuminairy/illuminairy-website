xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4bc833e8-1096-4a42-9b97-c5a445b727a8\"}":{"__typename":"DeepDives","uuid":"4bc833e8-1096-4a42-9b97-c5a445b727a8","content":"\u003cp\u003eWithout the mentors that I had in high school, especially my engineering teacher Justin Brown and my research mentor Dr. Simons, I would not be anywhere near where I am today. If,\u0026nbsp;as a mentor, I could have even a fraction of the positive influence on someone that they had on me, I would find it incredibly fulfilling. Sometimes all it takes to entirely transform the trajectory of someone's life is the right support at the right time.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"726f233b-b3e0-4a48-82e4-7074b39f840a\"}":{"__typename":"DeepDives","uuid":"726f233b-b3e0-4a48-82e4-7074b39f840a","content":"\u003cp\u003eI really enjoy spending time outdoors, so even after moving to New York City, hiking has stayed a big part of my life. It’s surprisingly easy to hop on the Metro-North and get upstate to some truly beautiful places. I also train calisthenics, and I can personally confirm that there are few better places to practice handstands than a glade in the mountains.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"9435018b-d797-4d87-a16d-3adffb6e6605\"}":{"__typename":"DeepDives","uuid":"9435018b-d797-4d87-a16d-3adffb6e6605","content":"\u003cp\u003eOne thing I hope to do in my lifetime is spend an extended period backpacking across different continents while writing a book. I don’t know exactly what form that book would take yet, but I know I’d want it to be very different from any STEM writing I do professionally or academically. I’d love to write something more abstract that captures how I experience the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"38057bb2-fa54-41a8-8a0e-3b6acab2eb5f\"}":{"__typename":"DeepDives","uuid":"38057bb2-fa54-41a8-8a0e-3b6acab2eb5f","content":"\u003cp\u003eI’m especially proud that I helped bring over $15,000 into my school’s STEM academy through competition and proposal writing during my junior and senior years of high school. At the time, the program was struggling financially, so that funding helped subsidize competition travel for students. Some of the most meaningful lessons and opportunities I had came from those experiences, so being able to help make them possible for others was something I found very rewarding.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"e670e136-97df-496d-93e2-5ef0e4bb53ed\"}":{"__typename":"Education","uuid":"e670e136-97df-496d-93e2-5ef0e4bb53ed","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Engineering","degree":null},"School:{\"uuid\":\"1a2e7662-dc99-4ae7-a9b2-cddd1f41738a\"}":{"__typename":"School","uuid":"1a2e7662-dc99-4ae7-a9b2-cddd1f41738a","name":"Kealakehe High School","city":"Kailua-Kona","type":"HIGH","state":"Hawaii","country":"United States","zip":"96740"},"Education:{\"uuid\":\"f18f2249-a731-4a55-a7d7-9a1043621a39\"}":{"__typename":"Education","uuid":"f18f2249-a731-4a55-a7d7-9a1043621a39","school":{"__ref":"School:{\"uuid\":\"1a2e7662-dc99-4ae7-a9b2-cddd1f41738a\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"919bcc05-92fe-437f-bbb0-aecb0690f61f\"}":{"__typename":"MentorPublicProfile","uuid":"919bcc05-92fe-437f-bbb0-aecb0690f61f","displayName":"Kai G.","slug":"kai-greenlee","biography":"\u003cp\u003eHi! I’m Kai Greenlee, an undergraduate at Columbia Engineering, and I help students turn big interests in science, engineering, and research into concrete projects.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eAwards/Credentials\u0026nbsp;\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eMy background spans both high-level research and competitive project work. I conducted computational astrophysics research using high-resolution spectroscopic data and became an ISEF Finalist, and I was also a top 8 finalist in the International Public Policy Forum Debate on Intellectual Property vs equitable access to pharmaceuticals. I was admitted to several highly selective engineering programs, including Caltech, Stanford, and Columbia, where I was named an Egleston Scholar, a distinction awarded to the top 15-20 incoming Columbia Engineering students. I have also led major technical and team-based projects, including helping lead the only NASA Human Rover Challenge team from Hawai‘i in 2025. In addition, I’m a National Merit Finalist, U.S. Presidential Scholars semifinalist, and two-time DOE CTE Momentum national winner.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI especially enjoy helping students with:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScience research projects\u003c/strong\u003e: developing questions, designing methods, analyzing results, and presenting findings\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCompetition-based projects\u003c/strong\u003e: science fairs, academic competitions, and other ambitious student work.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWriting-heavy projects\u003c/strong\u003e: research papers, written competition proposals, policy arguments, and presentations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEngineering and design projects\u003c/strong\u003e: brainstorming, prototyping, improving designs, and thinking through decisions.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege Application Writing\u003c/strong\u003e: crafting a cohesive narrative, brainstorming essays, and providing live feedback.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to mentor\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eA big part of what I bring as a mentor is personal experience. I know what it feels like to care deeply about a project, want it to be excellent, and need help making it a reality, but I also have experience mentoring students directly.\u0026nbsp;\u003c/p\u003e\u003cp\u003eMy experience includes:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePlanned and led manufacturing and design lessons at 3 day STEM camps for 130+ 3rd-8th graders.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMentored high school students through robotics projects, tutored calculus.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBoth paid and unpaid College application guidance.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eOutside of academics\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy hiking, camping, working out, sailing, playing basketball, and trying random things. I’m from the Big Island of Hawai‘i, and that background has shaped a lot of how I think about the balance between work and leisure.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eClosing\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eIf you’re a student who wants to build something meaningful, challenge yourself, and create work you’re genuinely proud of, I’d love to help you make it happen.\u003c/p\u003e","teachingVideoPlaybackId":"JpxDyCcqhGGHO6LqLhcYxKZ600ASK4YXsrT00Eopdgcrg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4bc833e8-1096-4a42-9b97-c5a445b727a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"726f233b-b3e0-4a48-82e4-7074b39f840a\"}"},{"__ref":"DeepDives:{\"uuid\":\"9435018b-d797-4d87-a16d-3adffb6e6605\"}"},{"__ref":"DeepDives:{\"uuid\":\"38057bb2-fa54-41a8-8a0e-3b6acab2eb5f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b167bde1-3c8c-4148-a737-1360788e4d25/-/preview/-/format/jpg/","https://ucarecdn.com/383b1618-4c36-42dc-ad12-c894e2
