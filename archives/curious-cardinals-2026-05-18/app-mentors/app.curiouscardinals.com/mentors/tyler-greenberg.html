xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8d362234-7789-430b-901e-aa8baf45a65a\"}":{"__typename":"DeepDives","uuid":"8d362234-7789-430b-901e-aa8baf45a65a","content":"\u003cp\u003eIf I could give my middle or high school self advice, it would be to worry less because everything that is meant to be will be. Looking back, I wasted so much time stressing about things that were out of my control when, in the end, it all worked out even better than I thought it would. I want to pass this message to my mentees that you can only control what is in your control, and for everything else, you have to let go and see what happens. As long as you know, you did your best, that is all anyone could ask for. I am still trying to remind myself of this constantly. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d18908d2-4b53-4404-8972-2739c0ba8a4b\"}":{"__typename":"DeepDives","uuid":"d18908d2-4b53-4404-8972-2739c0ba8a4b","content":"\u003cp\u003eI chose my major before I was even accepted to college or was even in high school, for that matter! My whole life, I have wanted to be a teacher. I love the idea of impacting the youth, and I feel so fortunate to have had such outstanding teachers growing up that I want to pass it on. As a child, my grandmother was a teacher. My favorite day of the year would be when she brought me to school with her. Even from a young age, I could see her positive effect on her students and peers at school, and I wanted to do the same thing. I have always found joy in working with children, so it was not a question of what I wanted to major in. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"ea577177-8df4-4016-a401-acfdcc69de78\"}":{"__typename":"DeepDives","uuid":"ea577177-8df4-4016-a401-acfdcc69de78","content":"\u003cp\u003eAs a high school student, I was very hardworking, studious, outgoing, social, and friendly. I was involved in numerous clubs, such as the student council, Key Club, and Pep Rally Club. I also took all types of classes, from accounting to human development to biology. Additionally, I was a part of the varsity swim team for four years! My parents often took me to school early or picked me up late because of clubs, extra help, or sports practice. Similar to myself today, I was super involved, and I like to think I was a friendly face to everyone around the school! I still keep in touch with my high school friends and even a few of my teachers! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"856db9e3-549a-4c9c-9bd9-09469523c3c5\"}":{"__typename":"DeepDives","uuid":"856db9e3-549a-4c9c-9bd9-09469523c3c5","content":"\u003cp\u003eOut of all the things I could be doing, I want to be a mentor because it is something I wish I had growing up. While in middle/high school, I had tutors, but our time together was spent solely on academics. I want to be a mentor to help my mentee in more ways than just school. I want to be the person they come to for advice, support, and help on other projects besides homework. With this support, any child can flourish. Furthermore, I want to be a mentor because I want our weekly session to be something your child looks forward to during the week rather than something they dread. I aim to show children how fun learning can be and how much more it is than memorizing flashcards.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"e2bff428-180f-47f4-a06d-c839fa2f02e0\"}":{"__typename":"School","uuid":"e2bff428-180f-47f4-a06d-c839fa2f02e0","name":"Paul D. Schreiber High School","city":"Port Washington","type":"HIGH","state":"New York","country":"United States","zip":"11050"},"Education:{\"uuid\":\"c79c373e-bf87-46b3-8d56-17d2d3d97500\"}":{"__typename":"Education","uuid":"c79c373e-bf87-46b3-8d56-17d2d3d97500","school":{"__ref":"School:{\"uuid\":\"e2bff428-180f-47f4-a06d-c839fa2f02e0\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}":{"__typename":"School","uuid":"bc77f602-b393-4fa6-9e11-df16e522c65d","name":"The University of Texas at Austin","city":"Austin","type":"COLLEGE","state":"Texas","country":"United States","zip":"78712"},"Education:{\"uuid\":\"725762ec-7c4d-43cd-b55d-c28ba925788b\"}":{"__typename":"Education","uuid":"725762ec-7c4d-43cd-b55d-c28ba925788b","school":{"__ref":"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"APPLIED LEARNING \u0026 DEVELPMNT:EC-6 GENERALIST CERTIFICATION","degree":null},"MentorPublicProfile:{\"uuid\":\"4e928f71-d85d-49dd-81bd-05d1ed2f08cd\"}":{"__typename":"MentorPublicProfile","uuid":"4e928f71-d85d-49dd-81bd-05d1ed2f08cd","displayName":"Tyler G.","slug":"tyler-greenberg","biography":"\u003cp\u003eHello, my name is Tyler Greenberg. I am a dedicated and passionate educator committed to fostering a love for learning in my students. With years of experience in the field of education, I have formed strong bonds with all different types of students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was raised in Port Washington, NY. I am the oldest of three siblings and have a golden retriever named Cody, whom I love dearly! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the classroom, I enjoy spending time with my family and friends. I love watching movies, reading books, cooking, and yoga.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI knew I wanted to become an educator since I was a little girl, as my grandmother taught elementary school for many years. I absolutely loved when she would bring me to school with her. I pursued my Bachelor’s degree in Early Childhood Education at the University of Texas at Austin, where I had the opportunity to shadow incredible teachers in the Austin Independent School District. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy love of education has now led me to pursue a Master’s degree in EC-6 General and Special Education at Touro University, equipping me with the tools to create a positive and inclusive learning environment. \u003c/p\u003e\u003cp\u003eWhile studying for my Master’s degree, I am working as an associate teacher in a first-grade classroom here in Manhattan. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my career, I have consistently demonstrated a genuine passion for connecting with my students and their families on a personal level. I truly believe in the power of building meaningful relationships as the cornerstone of effective teaching. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy teaching philosophy fosters critical thinking and a lifelong love for learning. I try my best to incorporate innovative and interactive teaching methods, integrating technology and real-world examples to make lessons engaging. By creating an environment that encourages curiosity, I hope to empower my students to participate in their education actively.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"APPLIED LEARNING \u0026 DEVELPMNT:EC-6 GENERALIST CERTIFICATION","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8d362234-7789-430b-901e-aa8baf45a65a\"}"},{"__ref":"DeepDives:{\"uuid\":\"d18908d2-4b53-4404-8972-2739c0ba8a4b\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea577177-8df4-4016-a401-acfdcc69de78\"}"},{"__ref":"DeepDives:{\"uuid\":\"856db9e3-549a-4c9c-9bd9-09469523c3c5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d539311d-e1f1-4c15-aeed-911f2a14fc0c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"c79c373e-bf87-46b3-8d56-17d2d3d97500\"}"},{"__ref":"Education:{\"uuid\":\"725762ec-7c4d-43cd-b55d-c28ba925788b\"}"}],"hiredAt":"2024-02-01T10:32:45.430Z","topics":["K-5 Grade Math","Writing","Reading"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tyler-greenberg\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4e928f71-d85d-49dd-81bd-05d1ed2f08cd\"}"}}},"_sentryTraceData":"741358e83a3545b4a07099573e6a8e54-aa67fd7d0ef06b7e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=741358e83a3545b4a07099573e6a8e54,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"tyler-greenberg"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,
