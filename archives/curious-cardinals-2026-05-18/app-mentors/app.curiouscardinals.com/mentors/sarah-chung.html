\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm a product designer from Stanford's d.school currently purusing a master's in computer science. I am a melting pot of paradoxes and harmonies. My father’s engineering mind taught me to dismantle complex problems piece by piece, while my mother’s eclectic taste and compassion shaped my love for community and creativity. This unique blend is what drives my approach to teaching.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout my time at Stanford's renowned d.school, I’ve used this skill develop innovative products that enhance the human experience. My research at IMMERS Lab this summer saw me developing an augmented reality (AR) tool to aid clinicians and researchers – a testament to my belief in the intersection of technology and human-centered design.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI bring this same approach to my tutoring sessions. \u003cstrong\u003eI believe in learning by doing.\u003c/strong\u003e Whether we’re brainstorming the next new app, prototyping functional prototypes with Figma, or delving into the foundational pillars of math and science, I guarantee a learning experience that is immersive, interactive, and tailored to your child’s unique needs.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eWhen I’m not prototyping at the d.school, you’ll find me painting, exploring farmer’s markets in search of the perfect hummus, or cooking with friends.\u003cbr\u003e\u003cbr\u003eFun fact: Last year, I've led a Q\u0026amp;A with Jony Ives, the former Chief of Design at Apple, and attended a virtual reality fashion design class in Berlin!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Product Design Engineering, Computer Science","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/dbb1ee1c-40a6-414d-baf4-546bae8ba93d/-/preview/-/format/jpg/","https://ucarecdn.com/5a19a8fd-e455-4dea-88ff-3f
