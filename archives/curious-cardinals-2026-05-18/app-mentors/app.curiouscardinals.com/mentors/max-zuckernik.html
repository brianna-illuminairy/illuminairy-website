xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0fae440b-6bb4-435b-95f9-d4cee8b27663\"}":{"__typename":"Favorites","uuid":"0fae440b-6bb4-435b-95f9-d4cee8b27663","photoUrl":"https://ucarecdn.com/4e816145-9835-4313-8552-c85e0bf06445/","title":"Jeff Buckley","type":"ARTIST"},"Favorites:{\"uuid\":\"722bd1eb-5247-4128-bbd7-2370ddb59be2\"}":{"__typename":"Favorites","uuid":"722bd1eb-5247-4128-bbd7-2370ddb59be2","photoUrl":"https://ucarecdn.com/fcafbfe7-1352-4127-b6d9-bd82156a5c68/","title":"Boston, MA","type":"CITY"},"Favorites:{\"uuid\":\"86b61df0-a300-4d8e-b0f1-03641b7411b4\"}":{"__typename":"Favorites","uuid":"86b61df0-a300-4d8e-b0f1-03641b7411b4","photoUrl":"https://ucarecdn.com/8abcc044-264c-4aa3-94db-40cc7101cb28/","title":"Close-Up","type":"MOVIE"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"94759399-1a33-4cd0-bc06-cfdf60a6f622\"}":{"__typename":"DeepDives","uuid":"94759399-1a33-4cd0-bc06-cfdf60a6f622","content":"\u003cp\u003eAs a high school student, I played an active part in the student body by participating in two main clubs and running on the cross-country team. I founded the Politics Club in which I led and participated in political discussions with club mates and also organized and directed community trash clean-ups and fundraising efforts, raising over $2,000 for charity. I was also the math department head (and tutor) for my high school's Tutoring Organization, where I designed and developed the math curriculum and supervised other math tutors.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"aa042555-5519-4860-a06a-641c15bb90b3\"}":{"__typename":"DeepDives","uuid":"aa042555-5519-4860-a06a-641c15bb90b3","content":"\u003cp\u003eIn my free time, I love watching movies, listening to music, and reading books. I'm currently reading 100 Years of Solitude by Gabriel García Márquez. I also love running, going to the gym, and watching sports (mainly soccer, American football, and basketball). Of course, my favorite thing to do is spend time with my friends. We often play soccer, basketball, card games, and video games together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"965b72c5-044e-4763-8211-b693d0cdb652\"}":{"__typename":"School","uuid":"965b72c5-044e-4763-8211-b693d0cdb652","name":"Newton North High School","city":"Newton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02460"},"Education:{\"uuid\":\"dd2cb8f8-c61e-4d29-bd42-47ccd93d4c49\"}":{"__typename":"Education","uuid":"dd2cb8f8-c61e-4d29-bd42-47ccd93d4c49","school":{"__ref":"School:{\"uuid\":\"965b72c5-044e-4763-8211-b693d0cdb652\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"27a6b60e-cfd0-41ab-9633-94e80b80a87b\"}":{"__typename":"School","uuid":"27a6b60e-cfd0-41ab-9633-94e80b80a87b","name":"University of Chicago: Hyde Park","city":"Chicago","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60637"},"Education:{\"uuid\":\"c2893ab7-5c04-4a90-b313-dd25ef30a9f1\"}":{"__typename":"Education","uuid":"c2893ab7-5c04-4a90-b313-dd25ef30a9f1","school":{"__ref":"School:{\"uuid\":\"27a6b60e-cfd0-41ab-9633-94e80b80a87b\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major"
