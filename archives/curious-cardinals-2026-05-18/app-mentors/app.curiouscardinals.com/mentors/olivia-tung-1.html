xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1bb60bd5-da7b-451d-9cac-a793bd180734\"}":{"__typename":"DeepDives","uuid":"1bb60bd5-da7b-451d-9cac-a793bd180734","content":"\u003cp\u003eI chose neuroscience because I’m drawn to questions that sit at the intersection of biology, medicine, and human experience. My early work in neurosurgery research—building brain models for clinical training—showed me how deeply scientific understanding can impact patient care. Later, working with postmortem brain tissue to study Parkinson’s disease introduced me to the complexity of neuroimmune interactions and disease progression at the molecular level. Neuroscience allows me to connect hands-on clinical impact with rigorous data-driven research, and it gives me the tools to study not just the brain in isolation, but how biology, environment, and health systems shape neurological outcomes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d6cf265e-6031-4734-8588-555082d6d995\"}":{"__typename":"DeepDives","uuid":"d6cf265e-6031-4734-8588-555082d6d995","content":"\u003cp\u003eIn my spare time, I love staying active and spending time outdoors—whether that’s running, kayaking, or just being in nature. I also enjoy baking and reading when I want something quieter, and one of my favorite ways to unwind is playing with my dog. These activities help me recharge and stay balanced alongside my academic and research work. I also love painting and art- I am always working to improve my calligraphy!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"efb7b8f9-a060-4638-97de-874882e394de\"}":{"__typename":"DeepDives","uuid":"efb7b8f9-a060-4638-97de-874882e394de","content":"\u003cp\u003eDuring high school, I spent my summers balancing research, service, and leadership. I volunteered in Mount Sinai’s neurosurgery lab, where I helped design a realistic brain model for external ventricular drain training using MRI and CT data, working closely with surgeons and engineers. At the same time, I led Scientific Minds of America, expanding free STEM tutoring programs for students from underrepresented communities and organizing virtual classes on topics like AI and entrepreneurship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"09addbc7-b07d-47a0-9535-9ba590873d74\"}":{"__typename":"DeepDives","uuid":"09addbc7-b07d-47a0-9535-9ba590873d74","content":"\u003cp\u003eMentorship matters to me because every meaningful step in my academic and professional journey has been shaped by someone who took the time to guide me. From surgeons who trusted me with real responsibility in the lab, to researchers who taught me how to ask better scientific questions, mentorship has transformed intimidating spaces into places where I felt supported and capable. It’s also why I mentor others through Scientific Minds of America—especially students who don’t always see themselves reflected in STEM. Mentorship creates access, builds confidence, and turns curiosity into action. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"9a8872d0-f677-4d78-9184-b671bc342fd9\"}":{"__typename":"School","uuid":"9a8872d0-f677-4d78-9184-b671bc342fd9","name":"Hunter College Campus Schools","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"9e33e2cd-8997-4a47-966b-946a83d305e6\"}":{"__typename":"Education","uuid":"9e33e2cd-8997-4a47-966b-946a83d305e6","school":{"__ref":"School:{\"uuid\":\"9a8872d0-f677-4d78-9184-b671bc342fd9\"}"},"startYear":"2018","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a0bbc23a-e182-4e87-a9f1-7567d4956e56\"}":{"__typename":"Education","uuid":"a0bbc23a-e182-4e87-a9f1-7567d4956e56","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"626714d3-47c2-44ab-b949-a48f03aad515\"}":{"__typename":"MentorPublicProfile","uuid":"626714d3-47c2-44ab-b949-a48f03aad515","displayName":"Olivia T.","slug":"olivia-tung-1","biography":"\u003cp\u003eOlivia Tung is a sophomore at Yale University pursuing a B.S. in Neuroscience alongside a Global Health Certificate. She is deeply interested in how neurological disease unfolds across systems—from molecular signaling to patient experience—and how translational research can be leveraged to improve care access and outcomes. Much of Olivia’s work sits at the intersection of neuroscience, technology, and social impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe currently conducts research at Yale School of Medicine, where she studies Parkinson’s disease using postmortem human brain tissue. Her project focuses on isolating neuronal, glial, and immune nuclei to characterize neuroimmune interactions across disease stages. She is especially excited by global health and is interested in understanding how structural barriers shape access to neurological care, and how research can be translated into equitable, scalable interventions across diverse health systems.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore Yale, Olivia spent two years at Mount Sinai Biodesign, where she led a project developing anatomically realistic brain models to improve training for external ventricular drain procedures. She worked closely with neurosurgeons, analyzed MRI and CT scans, and used CAD software to create 3D models that were ultimately validated through imaging and used to demonstrate novel medical technology. This experience sparked her interest in translational neuroscience and showed her how engineering, medicine, and research can converge to solve real clinical problems.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the lab, Olivia is a licensed EMT with Yale Emergency Medical Services, where she supports campus emergencies and teaches CPR. She also is a Referrals Director for the HAVEN Free Clinic, which provides free healthcare to New Haven residents. She also volunteers at  Yale New Haven Hospital’s Neurology Unit, experiences that ground her scientific work in patient-centered care. These roles have reinforced her desire to pursue physician-scientist training and contribute to neurologic care in underserved communities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOlivia is equally passionate about expanding access to STEM education. She previously served as CEO of Scientific Minds of America, a national nonprofit that provides free tutoring and programming to students from underrepresented backgrounds, and now remains on its board. At Yale, she directs the university’s Science Olympiad Invitational, supporting hundreds of students nationwide, and works with Nucleate New Haven to help grow the local biotech innovation ecosystem. She also works as a STEM Tour Guide, working for the Yale Admissions office!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOriginally from New York City, Olivia enjoys mentoring younger students, organizing community-driven projects, and exploring how emerging tools like AI and large-scale data analysis can reshape neuroscience research. She is motivated by work that bridges rigorous science with tangible social impact—and hopes to build a career focused on neurodegenerative disease alongside global health equity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, Olivia loves to run (just ran a marathon!) and spend time outdoors. She loves all things ocean, especially sea turtles, and has spent time volunteering at sea turtle hospitals and working with ocean conservation groups. She also really enjoys being creative, and a fun hobby of hers is calligraphy.\u003c/p\u003e","teachingVideoPlaybackId":"oTt9h3MKgV00adf00vPaV1WcxaDj010002XOQhHVsmEqm2nU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1bb60bd5-da7b-451d-9cac-a793bd180734\"}"},{"__ref":"DeepDives:{\"uuid\":\"d6cf265e-6031-4734-8588-555082d6d995\"}"},{"__ref":"DeepDives:{\"uuid\":\"efb7b8f9-a060-4638-97de-874882e394de\"}"},{"__ref":"DeepDives:{\"uuid\":\"09addbc7-b07d-47a0-9535-9ba590873d74\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d60c03a7-ff76-4526-862c-d5a29cb1
