xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"3d01debc-f78a-4f3b-8832-b7fa267af830\"}":{"__typename":"DeepDives","uuid":"3d01debc-f78a-4f3b-8832-b7fa267af830","content":"\u003cp\u003eI am very proud of my relationship with my siblings. I have a younger brother and a younger sister who, shockingly, are not all that young anymore. \u003c/p\u003e\u003cp\u003eEvery time I come home from a busy college semester, we sit and talk for hours about our lives, our stressors, and our desires for the days, weeks, months, and years to come. \u003c/p\u003e\u003cp\u003eI feel incredibly comfortable around my siblings because they understand me better than anyone else. I believe everyone deserves to feel understood the way I am with them, and I hope to provide at least a piece of that through my mentorship at Curious Cardinals. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"bcf11d6c-c565-4d63-b098-54e136024d85\"}":{"__typename":"DeepDives","uuid":"bcf11d6c-c565-4d63-b098-54e136024d85","content":"\u003cp\u003eIn my academic, athletic, and personal life I have had great mentors. What made these mentors great was in part their expertise and their experience. However, the most impactful mentors were the ones who gave me belief in myself. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLife gives tough challenges, we take on tough challenges to push ourselves, and I believe the role of a mentor is to tell you these challenges are not insurmountable or unreasonable. A mentor is someone who knows what you are capable of achieving even when you forget, and they remind you that someone believes you can do it while providing support along the way. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship matters to me because there are already so many young, passionate people out there ready to achieve things, they just need to be reminded that they can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c264f1e1-2373-4c65-b82b-1831a5e397e5\"}":{"__typename":"DeepDives","uuid":"c264f1e1-2373-4c65-b82b-1831a5e397e5","content":"\u003cp\u003eI am happiest when I am active. I grew up playing tons of sports: soccer, basketball, swimming, volleyball, tae kwon do, track. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eNowadays, I still play soccer, run in my free time, and picked up tennis (while also never turning down a pickup game of basketball or a race in the pool). These sports have led to some of my closest relationships and have given me a unique way to challenge and understand myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"90019214-35bd-402c-b911-39d9c9e5ea0e\"}":{"__typename":"DeepDives","uuid":"90019214-35bd-402c-b911-39d9c9e5ea0e","content":"\u003cp\u003eI want to design something, hopefully many things, that make people's lives better. \u003c/p\u003e\u003cbr\u003e\u003cp\u003ePeople are at the center of everything I design. I enjoy the challenge that designing for a wide range of users poses and the complexity of human factors engineering. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of this focus, I want to create something people truly need, that can also make them happy or give them something they don't have.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"3021fc44-3177-4fd6-84bc-422ac75073b5\"}":{"__typename":"School","uuid":"3021fc44-3177-4fd6-84bc-422ac75073b5","name":"West Morris Mendham High School","city":"Mendham Borough","type":"HIGH","state":"New Jersey","country":"United States","zip":"07945"},"Education:{\"uuid\":\"71dee82f-d958-4a87-ab02-2999edcf6806\"}":{"__typename":"Education","uuid":"71dee82f-d958-4a87-ab02-2999edcf6806","school":{"__ref":"School:{\"uuid\":\"3021fc44-3177-4fd6-84bc-422ac75073b5\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}":{"__typename":"School","uuid":"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a","name":"Massachusetts Institute of Technology","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02139"},"Education:{\"uuid\":\"ff166597-bf03-4d83-a0dd-73113b0ba350\"}":{"__typename":"Education","uuid":"ff166597-bf03-4d83-a0dd-73113b0ba350","school":{"__ref":"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d2638c02-6eeb-4324-a8b0-142061c8d7f0\"}":{"__typename":"MentorPublicProfile","uuid":"d2638c02-6eeb-4324-a8b0-142061c8d7f0","displayName":"Angelica C.","slug":"angelica-castro","biography":"\u003cp\u003eHi! My name is Angelica and I started as a Curious Cardinals mentor in 2026. I am currently a senior at MIT studying mechanical engineering.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe one thing I hope people think of when they think of me is my passion for the things I am committed to. Whether it be my hobbies- like running, playing soccer, baking, and painting- or my academic pursuits- such as mechanical engineering design, medical device research, and innovating with sustainable materials- I make sure to always give my greatest effort to these endeavors.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnother one of these things that I am passionate about is learning. I enjoy learning about subjects my friends find fascinating, about what motivates the people around me, and about myself and my goals. This love for learning has allowed me to pursue the things I love, and I hope to share this love of learning through Curious Cardinals.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have always enjoyed design, though I wasn’t totally sure how this would manifest until college. In middle school, I dreamed of being an architect because of my love for drawing and art. In high school, however, I took my first physics and calculus classes which shifted this dream. These subjects challenged me to think about how the world around us works, so I applied to MIT as a civil engineering major. While in college, I realized that what truly inspired me was creative problem solving, and thanks to some fun projects in classes and clubs, I found the world of mechanical engineering. The classes, projects, and work I have completed as a mechanical engineering student have shown me how much I can accomplish with just my creative ideas, hands, tools, and a supportive team.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow, I apply my mechanical engineering knowledge to the fields I care about most. I have gotten to work on sport equipment design projects, medical device testing \u0026amp; research, and product design for consumer goods. I hope to make a positive impact with the work I continue to do and always prioritize solving problems however I am able.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to learning something from everyone that I meet, and I hope I can leave a positive impact in return!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Pgf8c01OwFWaYKuM01DBF9u1DFX001IoQA02mT165PSnu6w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3d01debc-f78a-4f3b-8832-b7fa267af830\"}"},{"__ref":"DeepDives:{\"uuid\":\"bcf11d6c-c565-4d63-b098-54e136024d85\"}"},{"__ref":"DeepDives:{\"uuid\":\"c264f1e1-2373-4c65-b82b-1831a5e397e5\"}"},{"__ref":"DeepDives:{\"uuid\":\"90019214-35bd-402c-b911-39d9c9e5ea0e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d0d30650-a0dc-4f3e-9b6a-94f8299d1c9e/-/preview/-/format/jpg/","https://ucarecdn.com/89fa779e-2e05-42b3-851d-faf185b3e433/-/preview/-/format/jpg/","https://ucarecdn.com/0e7e65c0-d0b1-4182-becc-43bc62f12506/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"71dee82f-d958-4a87-ab02-2999edcf6806\"}"},{"__ref":"Education:{\"uuid\":\"ff166597-bf03-4d83-a0dd-73113b0ba350\"}"}],"hiredAt":"2026-01-18T05:19:31.688Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Biology","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","History","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","History Project","Business / Entrepreneurship","Medicine / Health","Web Design","Robotics / Electronics / CAD","STEM Project","Aviation / Aerospace","Sustainability","Debate","Public Speaking","Law / Government / Policy"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"angelica-castro\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d2638c02-6eeb-4324-a8b0-142061c8d7f0\"}"}}},"_sentryTraceData":"43517daf08a7417bbb4d4638e2ef2f6d-b75d61b5d11cb056-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=43517daf08a7417bbb4d4638e2ef2f6d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"angelica-castro"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
