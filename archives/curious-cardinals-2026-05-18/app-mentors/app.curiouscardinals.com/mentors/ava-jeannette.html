xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"55df43d5-a9a1-41bf-b07e-0beb3a2e5589\"}":{"__typename":"Favorites","uuid":"55df43d5-a9a1-41bf-b07e-0beb3a2e5589","photoUrl":"https://ucarecdn.com/b4cbff1f-3a26-4d0c-aa38-4fe6d71adad2/","title":"The Girl, the Cat, and the Tree","type":"ALBUM"},"Favorites:{\"uuid\":\"253ae404-ada9-4356-9f5b-41e74667f66f\"}":{"__typename":"Favorites","uuid":"253ae404-ada9-4356-9f5b-41e74667f66f","photoUrl":"https://ucarecdn.com/2825d05b-257a-4315-97f6-fcc5093bc542/","title":"White Noise","type":"BOOK"},"Favorites:{\"uuid\":\"41074cb6-9f9b-4388-b25a-c6618640421d\"}":{"__typename":"Favorites","uuid":"41074cb6-9f9b-4388-b25a-c6618640421d","photoUrl":"https://ucarecdn.com/49d7464d-9ef9-4126-8d79-6b6ebc8650dd/","title":"Oslo S","type":"SONG"},"CausesSupported:{\"uuid\":\"e018b87d-e99b-4ddf-a782-479fc1612b3a\"}":{"__typename":"CausesSupported","uuid":"e018b87d-e99b-4ddf-a782-479fc1612b3a","name":"Freedom for Immigrants","description":"\u003cul\u003e\u003cli\u003e\u003cp\u003eAnswering hotline calls from detained individuals across the country \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e6ce6d3e-73f1-460e-bb0e-0d5f7d4fb4c3\"}":{"__typename":"DeepDives","uuid":"e6ce6d3e-73f1-460e-bb0e-0d5f7d4fb4c3","content":"\u003cp\u003eExperiencing discomfort in an intimate setting is a nearly universal experience, yet one that is rarely discussed. We know there is a line in the sand that distinguishes discomfort from assault, but because the subject matter is so taboo, we don't have any sort of common understanding of where that line is.\u003c/p\u003e\u003cp\u003eCurrently, we are finding out the hard way. It makes people uncomfortable to talk about what makes them uncomfortable. It also makes people uncomfortable to ask what makes others uncomfortable. The result is a lot more discomfort than either person bargained for. And far too often, ignoring these boundaries leads to assault. \u003c/p\u003e\u003cp\u003eThese are difficult conversations to have, either preemptively or after the fact. Guilt, shame, fear of repercussions (legal or social), or feeling like “it wasn’t that big of a deal” often prevents us from saying anything at all.\u0026nbsp;The cycle continues. Hopefully, we can make some progress at figuring out where the line is, for ourselves and for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"68a6186d-e77c-41fb-8e6f-e5b5990d8a41\"}":{"__typename":"DeepDives","uuid":"68a6186d-e77c-41fb-8e6f-e5b5990d8a41","content":"\u003cp\u003eMy dream job is to be the tooth fairy of childhood wonder. This would involve tip toeing around the grounds at night with a lantern to illuminate my path, peering out with a keen eye for inner children on the loose. I would keep a detailed record via pictographs or an equally cryptic script of how the children are doing- how often they scamper, giggle, and jump for joy, the reasons they cry, the intensity of the glint in their eye (bars).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI would scurry back into the house to assume my position before the early birds can catch me, and I'd convert my notes into paper mache sculptures for every resident, and the shapes would indicate the wants and needs of their inner child. Because the process of extracting this information is so tedious, these forces are often overlooked, which leads to neglect. This cycle chips away at a student's ability to a deep chasm within oneself, which will continue to grow if it isn't acknowledged and intentionally filled early.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0aa6d72e-d88e-4c57-b203-94ce18710481\"}":{"__typename":"DeepDives","uuid":"0aa6d72e-d88e-4c57-b203-94ce18710481","content":"\u003cp\u003eI never had a clear idea of what I wanted to be when I was older, so the task of choosing a major was fairly daunting.  I always liked math \u0026amp; science and I'm very similar / close with my dad, who is a surgeon, so I began Stanford as a prospective pre-med student. I was incredibly intimidated at first but figured I'd rather attempt chemistry and fail out than always wonder what would've happened. \u003cbr\u003e\u003cbr\u003eIt took me ~ 2 years to realize that I never bothered to account for the scenario in which I did not, in fact, fail out. The short short is that I got in a pretty serious car accident over spring break of my sophomore year (thankfully I'm ok!) which got me all types of existential. Ultimately this led me to the realization that I owed it to myself to explore other fields before signing away the next 10 years of my life in preparation for an extremely specific job/lifestyle that I might not really want after all. \u003cbr\u003e\u003cbr\u003eI had recently taken (and loved!) Mechanical Engineering 101 and was embarking upon \u003cem\u003eThe Beanbag Project\u003c/em\u003e so I decided to give Design a go. I took 5 amazing d. school classes spring quarter and learned a ton but knew something was off. On one hand, I realized I didn't feel comfortable focusing my major / career around my ability to be creative. Also, I frankly missed the structure and rigor of chemistry (don't roast me I'm a massive nerd and I've come to terms with that). I wanted a more technical degree, and I wanted the same security provided by the pre-med track that my life was going to be spent helping people. \u003cbr\u003e\u003cbr\u003eThe design track I was going to pursue was titled \"Living Matter\" which was described as a life-centric bioengineering of sorts. I decided to ditch the crumbs in pursuit of the bread: Environmental Systems Engineering it was. (also, I was satisfied that the ~50 STEM units I had taken finally counted for something). I am beyond excited to learn about sustainable energy, waterways, city infrastructure, and construction and I will keep you all posted on how that goes!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a37e808b-df22-4956-b508-3030819b239a\"}":{"__typename":"DeepDives","uuid":"a37e808b-df22-4956-b508-3030819b239a","content":"\u003cp\u003eSaturday, June 3, is World Bicycle Day, and we Stanford students stand the chance to beat the\u0026nbsp;Guinness World Record\u0026nbsp;for the\u0026nbsp;Longest Bike Parade! \u003cbr\u003e\u003cbr\u003eContext: the current\u0026nbsp;world record\u0026nbsp;is less than 2,000 bikes, held by\u0026nbsp;Gurbanguly Berdimuhamedow\u0026nbsp;and his corrupt reign over the people of\u0026nbsp;Turkmenistan.\u003cbr\u003e\u003cbr\u003eRiding bikes is a hallmark of Stanford’s campus culture. There are 17,680 students currently enrolled on campus with a conservative estimate of 13,000+ bicycles in circulation on any given day. Assembling 2,000 of the into a parade on a sunny spring Saturday in California is precisely the mission of Particles in Abundance; Radical Acts of Public Euphoria*. On a day like any other, we would accomplish something extraordinary by partaking in our ordinary routines. We all remember the childlike wonder associated with reading the Guinness Book of World Records at the Scholastic Book Fair growing up, and this would be a chance to realize that sensation in our lives as adults, something we often forget how much we all need.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e*Particles in Abundance is a grassroots effort to inspire a sensation of childhood wonder amongst individuals of all ages, through the routine of gathering otherwise mundane stuff together in the spirit of play. In short, it's an effort to make the ordinary extraordinary by virtue of bringing people together to regard it as such. As a college student, I've seen how quickly people get caught up in their pursuits and forget how simple it can be to have a spectacular experience- all it takes is a spark of imagination and some logistical aptitude. Past works have included Snow Day, Sprinkler Hunting, and Chalk Murals.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"7c2b3c1f-5751-4100-a8c5-cefa2afac474\"}":{"__typename":"School","uuid":"7c2b3c1f-5751-4100-a8c5-cefa2afac474","name":"American School of Madrid","city":"Pozuelo de Alarcón","type":"HIGH","state":"Comunidad de Madrid","country":"Spain","zip":"28224"},"Education:{\"uuid\":\"82878ccf-5ba6-4bf3-90bd-e6d6ebd6aa98\"}":{"__typename":"Education","uuid":"82878ccf-5ba6-4bf3-90bd-e6d6ebd6aa98","school":{"__ref":"School:{\"uuid\":\"7c2b3c1f-5751-4100-a8c5-cefa2afac474\"}"},"startYear":"2018","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"f6e8ee61-0fb1-435b-9e1c-6133ce675173\"}":{"__typename":"Education","uuid":"f6e8ee61-0fb1-435b-9e1c-6133ce675173","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Materials Science \u0026 Architectural Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"701165a5-0423-4701-abd4-fe2c0a0fe8bc\"}":{"__typename":"MentorPublicProfile","uuid":"701165a5-0423-4701-abd4-fe2c0a0fe8bc","displayName":"Ava D.","slug":"ava-jeannette","biography":"\u003cp\u003eHello! \u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am an outdoorsy extroverted kid with a passion for silliness. Over the years, I've learned that silliness is best accompanied by academic and extracurricular prowess, and I work dutifully to ensure this balance is kept. My efforts have earned me the title of Director of Special Projects for the Associated Students of Stanford University, and I have countless ideas for how to promote goodness on campus which I am always eager to discuss. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up with privilege and I am committed to using my opportunities for good instead of evil (or even a net neutral situation). I am the proud artist of the first-ever student installation in Green Library, which is an interactive mixed-media sculpture demonstrating the various pressures which often result in sexual assault. I am also the Project Chair for the BioDesign Club and am conducting research to develop a device to mitigate the risk of date rape. Personal experiences have undoubtedly shaped my perspective and motivations, but I also want to impress the notion that you are more than your past, and there are countless ways to make a difference in the world. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eI came to Stanford as a pre-med student and continued on that track for my first two years before realizing that my interests were far broader than what is covered in medical school. I dabbled with the beloved D school and the Design Major for a bit before ultimately landing on Environmental Systems Engineering. Because, while I desperately wanted to fulfill my fantasy of being an artsy creative D school girlie, alas I had to confront the reality that I am indeed no more than an eccentric woman in stem. And that's okay too. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am deeply curious about the world, and I study inanimate systems in the classroom and my fellow animates beings through industry-endorsed interaction. I have camp counseled on numerous occasions and taught many a child how to ski and rock climb. Beyond excited to start working with whoever comes my way, and I truly cannot wait for what we create together. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eLots of love,\u003c/p\u003e\u003cp\u003eAva\u003c/p\u003e","teachingVideoPlaybackId":"emuxGga02CYx5J02xCTWTNT8PRBMNprIfOgJ9i2Bou8yo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003ePulled off Stanford University's first ever Snow Day. \u003cbr\u003e\u003cbr\u003eThe idea crossed my mind one fateful night in December, and before I knew it I was sending this message to my entire class GroupMe: \u003cbr\u003e\u003cbr\u003e\u003cem\u003eOk folks.\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eFall quarter is no longer. But what happens now? Winter quarter sophomore year is not traditionally known for its super fun and excellent exciting times.\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eNot Yet, that is. But How? You ask. Well, the answer is simple: we all politely but in the masses repeatedly ask our neighborhoods for funding to get a ton of snow to the Oval and have a big snow day, and we can make snow angels and have snowball fights and a sledding hill and ski jumps and a DJ and hot chocolate and ski school snacks like goldfish. (ft\u0026nbsp;https://www.snowbusiness.com/events/)\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e(Carbon footprint qualms? Check out the \"Environmental Ethos\" to quench every last one :) #NotSponsored #Yet\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eI have actually sent multiple emails about this myself but I realized that I had to think bigger. Dare I say I needed to make it a .. community effort. If you still have your doubts, rest assured that I ran into The Persis today and told her about this, and she was actually the one who suggested the multiple neighborhood strategy. Plus she said she knows a guy so could potensh chip in if momentum was underway 👀👀\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eThis event would characterize winter quarter, nay, your whole college experience, as a memory that you cling to, wiping a tear as you wistfully tell your kids about the makeshift sleds you and your friends made to slide down a snow hill on the Oval, that was brought to you by the one and only Class of ‘25. Ah, to be back in 2023, you'll say, and your kids will wish on every star for the chance to call such a freaking awesome core memory their own one day.\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eUndoubtedly, the class of ‘25 would go down in Stanford history as The Little Engine That Could. And once again in the spirit of full transparency I have no idea how much this snow will cost but I am planning to squeeze every single penny I can out of every mailing list that I ever mistakenly subscribed to during the club fair of freshman year, and then throwing in a slush fund to cover anything else (finger guns).\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eNeed I say more? Skip to it, a winter wonderland awaits ❄️☃️\u003c/em\u003e\u003cbr\u003e\u003cbr\u003eThe road forward was neither straightforward nor intuitive, but nevertheless I persevered. Many moons later I find myself meeting with the Office of Student Engagement regarding which areas of campus were best suitable for massive amounts of snow, and the next thing I know I'm witnessing core memories being created on our very own Wilbur Field. \u003cbr\u003e\u003cbr\u003eDream big - you'll never regret it. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"55df43d5-a9a1-41bf-b07e-0beb3a2e5589\"}"},{"__ref":"Favorites:{\"uuid\":\"253ae404-ada9-4356-9f5b-41e74667f66f\"}"},{"__ref":"Favorites:{\"uuid\":\"41074cb6-9f9b-4388-b25a-c6618640421d\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"e018b87d-e99b-4ddf-a782-479fc1612b3a\"}"}],"major":"Materials Science \u0026 Architectural Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e6ce6d3e-73f1-460e-bb0e-0d5f7d4fb4c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"68a6186d-e77c-41fb-8e6f-e5b5990d8a41\"}"},{"__ref":"DeepDives:{\"uuid\":\"0aa6d72e-d88e-4c57-b203-94ce18710481\"}"},{"__ref":"DeepDives:{\"uuid\":\"a37e808b-df22-4956-b508-3030819b239a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4aa3cf72-8738-4b10-b58d-a465837a4655/-/preview/-/format/jpg/","https://ucarecdn.com/79090393-aff6-4f05-b955-8efbca242a00/-/preview/-/format/jpg/","https://ucarecdn.com/b741e7f2-0327-4f4c-8e36-7029f22459b2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"82878ccf-5ba6-4bf3-90bd-e6d6ebd6aa98\"}"},{"__ref":"Education:{\"uuid\":\"f6e8ee61-0fb1-435b-9e1c-6133ce675173\"}"}],"hiredAt":"2023-07-21T13:54:36.832Z","topics":["K-5 Grade Math","Geometry","6-8 Grade Science","Biology","Writing","Spanish","French","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Film / Theater","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Sustainability","Public Speaking","Journalism"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ava-jeannette\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"701165a5-0423-4701-abd4-fe2c0a0fe8bc\"}"}}},"_sentryTraceData":"be0d7934869e4490a72e23c2dbb45dc7-8eb8915d13460778-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=be0d7934869e4490a72e23c2dbb45dc7,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ava-jeannette"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
