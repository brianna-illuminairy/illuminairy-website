xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7c2d1595-1daf-443d-ba0d-59bf83ce8a22\"}":{"__typename":"DeepDives","uuid":"7c2d1595-1daf-443d-ba0d-59bf83ce8a22","content":"\u003cp\u003eI would remind myself to slow down and truly ensure that I understand the concepts rather than focusing on performing well on exams. The deeper understanding has always become more valuable than any individual exam score. Confidence comes from consistent practice and understanding. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e4919306-9234-4d46-bc6c-3e5d0f4172f3\"}":{"__typename":"DeepDives","uuid":"e4919306-9234-4d46-bc6c-3e5d0f4172f3","content":"\u003cp\u003eAs a premed student, I chose Biological Sciences and Data Science because I am fascinated by the intersection of machine learning with medicine. I love to understand how quantitative tools can be used to analyze biological systems. I truly enjoy the problem-solving and critical thinking that the two fields introduce to each other. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"60afc4d5-11db-451a-bc75-454a8d473888\"}":{"__typename":"DeepDives","uuid":"60afc4d5-11db-451a-bc75-454a8d473888","content":"\u003cp\u003eAs a high school student, I was motivated to doing well, but I still didn't understand how to accomplish this effectively. I struggled with remaining organized and maintain good study habits. Over time, I learned how to prioritize deeper understanding, which is something I make sure to emphasize with students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"16f9262d-4c2f-4968-9749-32fbadd848c4\"}":{"__typename":"DeepDives","uuid":"16f9262d-4c2f-4968-9749-32fbadd848c4","content":"\u003cp\u003eMentorship matters to me because I've seen how much my confidence has changed student's trajectory in academics. The right guidance doesn't just help students learn concepts, but it helps them believe they are capable of mastering them. As a mentor I try to help make anything seem approachable and achievable.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"a38366df-8bcb-4e08-b820-0b3539d7a095\"}":{"__typename":"School","uuid":"a38366df-8bcb-4e08-b820-0b3539d7a095","name":"Harry D Jacobs High School","city":"Algonquin","type":"HIGH","state":"Illinois","country":"United States","zip":"60102"},"Education:{\"uuid\":\"11e92c9a-ac19-4779-a9cd-f811712cac89\"}":{"__typename":"Education","uuid":"11e92c9a-ac19-4779-a9cd-f811712cac89","school":{"__ref":"School:{\"uuid\":\"a38366df-8bcb-4e08-b820-0b3539d7a095\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"a152dacf-c85a-4b20-97f4-47da25e47767\"}":{"__typename":"Education","uuid":"a152dacf-c85a-4b20-97f4-47da25e47767","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biological Sciences and Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"b4d182cc-9b34-419a-96b7-08908f087ea0\"}":{"__typename":"MentorPublicProfile","uuid":"b4d182cc-9b34-419a-96b7-08908f087ea0","displayName":"Anay P.","slug":"anay-patel","biography":"\u003cp\u003eHey! My name is Anay, and I am a junior at Northwestern University studying Biological Sciences and Data Science. I help students discover the beauty in STEM by building confidence and strengthening the foundational skills needed to master topics in biology, chemistry, and data science.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eIn the past, I have:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePlaced in my state's Academic Challenge Team competitions for Chemistry and Biology\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelped students who were previously struggling earn college Biology credit through AP examinations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMentored local high school students in developing critical skills in emergency medicine\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eIn college:\u003c/strong\u003e\u003cbr\u003eI work as a peer tutor for Biology, Organic Chemistry, and General Chemistry, where I support students in developing strong problem-solving skills across a wide range of topics. I am also involved in research at Northwestern University, specializing in image analysis techniques.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eI help students build skills in:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBiology\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOrganic Chemistry\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGeneral Chemistry\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eData Science\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMachine Learning\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI work best with students who want to understand concepts on a deeper level so they can apply foundational knowledge to more advanced topics. I also help students develop effective study strategies and organizational habits so they can find their own rhythm in challenging courses. Additionally, as a pre-med student, I can help you find opportunities and experiences that can help you stand out and find your passion for medicine. \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eHow I Can Help\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI have been tutoring middle school, high school, and college students for four years. Over that time, I have learned how to meet students where they are and explain complex ideas in a way that feels intuitive and approachable.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA typical session might include:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eA check-in to identify specific questions or challenging class material\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down difficult concepts step-by-step\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing core skills to build confidence and mastery\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConnecting concepts to the bigger picture across biology, chemistry, and data science\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eOutside of the Classroom\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside of tutoring and academics, I enjoy staying active and spending time outdoors. In high school, I played varsity baseball and competed on a club team. Now, I compete on my university’s rock climbing team and enjoy climbing, hiking, and snowboarding.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re looking to build confidence in your study habits, strengthen your organization, and develop a solid foundation in STEM, I would love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"gPghV5VLltVuTeTqeCMI00QhU00xQNzy601rQeDP89vahw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biological Sciences and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7c2d1595-1daf-443d-ba0d-59bf83ce8a22\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4919306-9234-4d46-bc6c-3e5d0f4172f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"60afc4d5-11db-451a-bc75-454a8d473888\"}"},{"__ref":"DeepDives:{\"uuid\":\"16f9262d-4c2f-4968-9749-32fbadd848c4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/eb490ada-697f-472e-a6e7-8784bd53f14f/-/preview/-/format/jpg/","https://ucarecdn.com/de3b7ff5-14b2-46b0-8749-9d045287afa6/-/preview/-/format/jpg/","https://ucarecdn.com/bea2af99-0b1f-4c89-a4a1-5d32c18469ff/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"11e92c9a-ac19-4779-a9cd-f811712cac89\"}"},{"__ref":"Education:{\"uuid\":\"a152dacf-c85a-4b20-97f4-47da25e47767\"}"}],"hiredAt":"2026-04-05T20:11:46.969Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Precalculus / Trigonometry","Geometry","6-8 Grade Science","Chemistry","Biology","Academic Coaching","Executive Function","Coding / Programming","Medicine / Health","STEM Project","Machine Learning / AI"],
