xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e860156f-3f0b-495c-81a0-52201078ed5c\"}":{"__typename":"Favorites","uuid":"e860156f-3f0b-495c-81a0-52201078ed5c","photoUrl":"https://ucarecdn.com/3292e5f8-bc3f-4f15-aeca-6e047673d621/","title":"Man on the Moon - Kid Cudi","type":"ALBUM"},"Favorites:{\"uuid\":\"dbfaf618-d5bf-42a0-82b6-2fea4d4afb71\"}":{"__typename":"Favorites","uuid":"dbfaf618-d5bf-42a0-82b6-2fea4d4afb71","photoUrl":"https://ucarecdn.com/174eee64-559e-4cf8-a4bc-0e844592ba73/","title":"Gael Monfils","type":"ATHLETE"},"Favorites:{\"uuid\":\"fa8456aa-c66a-4196-a29d-458315900663\"}":{"__typename":"Favorites","uuid":"fa8456aa-c66a-4196-a29d-458315900663","photoUrl":"https://ucarecdn.com/d7973dae-895f-45e4-ba5d-4a50b87eb260/","title":"Beirut, Lebanon","type":"CITY"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"dabcdf60-0634-4005-bd26-1bd920fb0e61\"}":{"__typename":"DeepDives","uuid":"dabcdf60-0634-4005-bd26-1bd920fb0e61","content":"\u003cp\u003eMy greatest role model is my dad, who’s a hematologist-oncologist (cancer and blood doctor). Growing up, I watched him care for patients with so much dedication, even on the hardest days. What stood out to me wasn’t just how smart he is, but how seriously he takes the responsibility of helping others — not just medically, but emotionally too. He’s the reason I became interested in medicine in the first place, and he’s shown me what it looks like to lead with compassion, patience, and purpose. Even now, he’s the person I go to when I need perspective or a reality check.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"5d423372-c450-4d93-881a-fde8f63fd59c\"}":{"__typename":"DeepDives","uuid":"5d423372-c450-4d93-881a-fde8f63fd59c","content":"\u003cp\u003eAs a middle and high school student, I was 100% a procrastinator — the kind who would suddenly become very interested in cleaning their room right before a big assignment was due. I used to beat myself up about it, thinking it meant I wasn’t “disciplined enough” or that I’d never keep up with others. But over time, I realized that my procrastination wasn’t about laziness — it was often because I cared too much and wanted everything to be perfect.\u003c/p\u003e\u003cp\u003eLearning to work with that part of myself (instead of against it) taught me how to plan better, break things into smaller steps, and be kinder to myself. Now, I can spot when I’m starting to spiral into stress-mode and pause to ask: “What’s actually blocking me right now?” That self-awareness has made me a much more thoughtful student and mentor.\u003c/p\u003e\u003cp\u003eSo if you’re someone who sometimes waits until the last minute, I get it — and I promise it doesn’t mean you’re not capable. We’ll figure out systems and mindsets that work for you, not just what looks good on paper.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9a3496ea-d6f2-4c14-b6f6-3632ca32907f\"}":{"__typename":"DeepDives","uuid":"9a3496ea-d6f2-4c14-b6f6-3632ca32907f","content":"\u003cp\u003eI chose to study neuroscience because I’ve always been curious about how the brain works and how it helps us think, feel, and grow. I love science, and learning about the brain helped me understand people better too — which is really important to me because I want to become a doctor one day!\u003c/p\u003e\u003cp\u003eI also studied business because I wanted to learn how the world works outside of science — like how hospitals and healthcare systems are run. It’s helped me think in new ways and understand how doctors can make a big impact not just with patients, but with the bigger picture of healthcare too.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e7abefa7-0940-4771-b2b6-13368dd7e8bc\"}":{"__typename":"DeepDives","uuid":"e7abefa7-0940-4771-b2b6-13368dd7e8bc","content":"\u003cp\u003eMentorship matters to me because I never really had it growing up. As the oldest sibling, I had to figure out a lot of things on my own — school, college apps, balancing everything — and it would’ve made a huge difference to have someone a few steps ahead to ask questions or just talk things through with. Now that I’ve been through some of those same challenges, I want to be that support for someone else.\u003c/p\u003e\u003cp\u003eIt’s not about having all the answers — it’s about showing up, being consistent, and helping someone feel like they’re not doing it all alone. That’s what I would’ve wanted, and that’s what I try to bring to mentorship now.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"7a5d6dc5-919b-401b-af40-c953c4ab1eca\"}":{"__typename":"School","uuid":"7a5d6dc5-919b-401b-af40-c953c4ab1eca","name":"American Community School of Abu Dhabi","city":"Abu Dhabi","type":"HIGH","state":"Abu Dhabi","country":"United Arab Emirates","zip":"00000"},"Education:{\"uuid\":\"e68edf31-01fe-4d83-a3a9-277c7abf9b0a\"}":{"__typename":"Education","uuid":"e68edf31-01fe-4d83-a3a9-277c7abf9b0a","school":{"__ref":"School:{\"uuid\":\"7a5d6dc5-919b-401b-af40-c953c4ab1eca\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"e73519c6-e980-45a1-ba77-ad9e95a56dd4\"}":{"__typename":"Education","uuid":"e73519c6-e980-45a1-ba77-ad9e95a56dd4","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"6504000f-55de-4409-8e4f-dc100ace07c2\"}":{"__typename":"MentorPublicProfile","uuid":"6504000f-55de-4409-8e4f-dc100ace07c2","displayName":"Aya M.","slug":"aya-masri","biography":"\u003cp\u003eHi! I’m Aya Masri — a pre-medical student at Northwestern University majoring in Neuroscience with a minor in Business Institutions. I’m deeply passionate about understanding how the human body works, but even more so about how science can be applied to improve people’s lives. Whether it’s through clinical innovation, patient-centered care, or everyday conversations, I’m committed to bringing both empathy and critical thinking into every space I’m part of.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I’ve spent over 650 hours conducting vascular biology research, where I’ve investigated the molecular pathways that contribute to heart and blood vessel diseases. I have had incredible opportunities to present my findings at research conferences, an experience that not only strengthened my scientific communication skills but also reminded me how important collaboration and curiosity are in research. Along the way, I’ve mentored Northwestern student researchers conducting their first projects, helping them learn how to frame scientific questions and troubleshoot experiments — one of my favorite roles so far.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, I have served as the Vice President of Finance for Phi Delta Epsilon, a pre-health fraternity where I help organize professional development events and manage our chapter’s budget. I also work as a tour guide, welcoming prospective students and their families to Northwestern and sharing what makes this campus so special. I love helping people find their place and feel more confident in big transitions — whether that’s starting college, applying to research roles, or navigating the pre-med track.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not in the lab or giving tours, you can probably find me spending time in Chicago’s art museums, updating my ever-growing list of Beli restaurant reviews, playing tennis, or deep in a Spotify rabbit hole. I’m always on the lookout for connections— through food, music, people, and ideas.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs I prepare for medical school, I’m most excited by the ways medicine blends science, service, and human connection. I’m especially interested in exploring how we can make healthcare more accessible, equitable, and compassionate. I’m so excited to be part of this mentorship community and can’t wait to support others as they grow and explore their own paths!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my proudest moments was presenting my research at the National Collegiate Research Conference at Harvard University. I had spent over 2 years studying how certain proteins affect the way cells in our blood vessels respond to the flow of blood — a process that’s really important for understanding diseases like atherosclerosis. After months of experiments, data analysis, and writing, I got the chance to share my findings at a national research conference.\u003c/p\u003e\u003cp\u003ePresenting to researchers, professors, and students from across the country was a little nerve-wracking, but also incredibly exciting. It was a moment that made me realize how far I’d come — from being curious about science to actually contributing to it. It reminded me that with enough dedication (and a lot of late nights in the lab), it’s possible to turn questions into discoveries.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e860156f-3f0b-495c-81a0-52201078ed5c\"}"},{"__ref":"Favorites:{\"uuid\":\"dbfaf618-d5bf-42a0-82b6-2fea4d4afb71\"}"},{"__ref":"Favorites:{\"uuid\":\"fa8456aa-c66a-4196-a29d-458315900663\"}"}],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dabcdf60-0634-4005-bd26-1bd920fb0e61\"}"},{"__ref":"DeepDives:{\"uuid\":\"5d423372-c450-4d93-881a-fde8f63fd59c\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a3496ea-d6f2-4c14-b6f6-3632ca32907f\"}"},{"__ref":"DeepDives:{\"uuid\":\"e7abefa7-0940-4771-b2b6-13368dd7e8bc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3656b11b-0fe9-4d0b-92c5-ec179cfa8f74/-/preview/-/format/jpg/","https://ucarecdn.com/d446b42c-5df8-4b94-be3d-9e73662084ac/-/preview/-/format/jpg/","https://ucarecdn.com/b58d5860-e261-4082-af76-8b03462c9767/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e68edf31-01fe-4d83-a3a9-277c7abf9b0a\"}"},{"__ref":"Education:{\"uuid\":\"e73519c6-e980-45a1-ba77-ad9e95a56dd4\"}"}],"hiredAt":"2025-04-18T09:09:44.202Z","topics":["K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Geometry","Algebra I","Algebra II","6-8 Grade
