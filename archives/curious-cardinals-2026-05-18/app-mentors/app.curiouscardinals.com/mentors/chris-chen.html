xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"13829731-8084-4dae-be56-8a35b22f3ad3\"}":{"__typename":"School","uuid":"13829731-8084-4dae-be56-8a35b22f3ad3","name":"Lick Wilmerding High School","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94112"},"Education:{\"uuid\":\"ad9f477a-d79e-4e74-93b0-ea2d4e3472e9\"}":{"__typename":"Education","uuid":"ad9f477a-d79e-4e74-93b0-ea2d4e3472e9","school":{"__ref":"School:{\"uuid\":\"13829731-8084-4dae-be56-8a35b22f3ad3\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"094f2f89-88f1-4dd0-837f-acb829f8bf95\"}":{"__typename":"Education","uuid":"094f2f89-88f1-4dd0-837f-acb829f8bf95","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science \u0026 Economics, Architecture","degree":"Bachelor of Science - BS"},"MentorPublicProfile:{\"uuid\":\"dcfb4456-be27-4070-9d2d-b568416ea6d1\"}":{"__typename":"MentorPublicProfile","uuid":"dcfb4456-be27-4070-9d2d-b568416ea6d1","displayName":"Chris C.","slug":"chris-chen","biography":"\u003cp\u003eChris is a native San Franciscan and senior at Washington University in St. Louis where he is studying Computer Science, Economics, and Architecture. Looking to integrate the hard skills acquired through his computer science and economic coursework with his passion for the architecture and construction sector, Chris is interested in the ways emerging technologies such as AI/ML tools and cloud platforms can be leveraged to improve growth and productivity in the architecture, engineering, and construction (AEC) industry.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAs a sophomore in high school, Chris was fascinated by the field of Technical Arts and using his hands to express creativity through different mediums. He enrolled in multiple wood and metal-working classes, and after the completion of a rocking chair he designed in a joinery \u0026amp; turning class, Chris’s teacher encouraged him to take his first drafting class in the school’s architecture studio. There, Chris continued to cultivate his design skills and developed an interest in the profession of Architecture. This interest peaked when, during his junior year, Chris placed 2nd in the annual San Francisco Design Competition where he designed and modeled a YMCA facility in the Tenderloin District for underserved youth. This achievement prompted him to attend WashU and pursue a degree in Architecture.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAfter Chris’s first year in Architecture school at WashU, he interned at a construction firm and developed a newfound interest in the technological and business processes that drove the industry more than the actual design work. Still wanting to contribute to the AEC industry, Chris changed his Architecture degree to a minor and picked up a new major in Computer Science \u0026amp; Economics. While Chris still regularly takes architecture studios to continue developing his design skills, he is now additionally focused on impacting the AEC industry from the technological side and plans to be at the forefront of the industry’s digitization movement. Most recently, Chris finished a research project on studied Artificial Intelligence algorithms and their use cases in skyscraper construction.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, Chris is an engaged member in the surrounding community, both on and off campus. On campus, he is a member of Design for America’s WashU chapter and TAMID Group. On weekends, Chris assists teachers at Building Futures, a workshop aimed to teach underprivileged students in St. Louis the fundamentals of trade and shop skills. He is also an amateur powerlifter and a huge fan of the Marvel Cinematic Universe, Golden State Warriors, San Francisco 49ers, and Liverpool FC. Chris is extremely excited for the opportunity to mentor at Curious Cardinals and share his unique experiences!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science \u0026 Economics, Architecture","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/b245ffd7-34ec-44ac-8c6b-24f11646b02c/-/crop/653x653/260,0/-/preview/-/format/jpg/","https://ucarecdn.com/8e2a0880-8404-40c0-8601-70422747227d/-/preview/-/format/jpg/","https://ucarecdn.com/5fb56212-1ca3-4836-83cb-328a761b0f87/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"ad9f477a-d79e-4e74-93b0-ea2d4e3472e9\"}"},{"__ref":"Education:{\"uuid\":\"094f2f89-88f1-4dd0-837f-acb829f8bf95\"}"}],"hiredAt":"2022-11-17T23:33:24.000Z","topics":["Visual Arts / Graphic Design"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/09da5bb5-3efa-4fae-89ff-19db3c27efba/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"chris-chen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"dcfb4456-be27-4070-9d2d-b568416ea6d1\"}"}}},"_sentryTraceData":"75fc60f16e524c7eba4c1a00b7f40950-b5faff7a0f1e1812-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea
