xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"623e780c-8558-427e-83bf-a2e51e737d65\"}":{"__typename":"Favorites","uuid":"623e780c-8558-427e-83bf-a2e51e737d65","photoUrl":"https://ucarecdn.com/051627cf-1dfc-4502-bad2-f5242be6ce13/","title":"Continuum ","type":"ALBUM"},"Favorites:{\"uuid\":\"30542f3b-2d9e-444d-b713-23c51e04005d\"}":{"__typename":"Favorites","uuid":"30542f3b-2d9e-444d-b713-23c51e04005d","photoUrl":"https://ucarecdn.com/1189e27d-a36c-41ba-ac9a-e54761934bae/","title":"We Need New Names","type":"BOOK"},"Favorites:{\"uuid\":\"87fffabd-8b61-4f51-891a-be31e2ff3305\"}":{"__typename":"Favorites","uuid":"87fffabd-8b61-4f51-891a-be31e2ff3305","photoUrl":"https://ucarecdn.com/1fab36d5-76f4-42b1-9d88-93c5224d2b37/","title":"Hairspray (2007)","type":"MOVIE"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e85d5c57-7ded-4105-bb49-6fe722bbb038\"}":{"__typename":"DeepDives","uuid":"e85d5c57-7ded-4105-bb49-6fe722bbb038","content":"\u003cp\u003eI'm working on an app that combines storytelling and social entrepreneurship in Nairobi, Kenya! The project began as a multimedia storytelling project funded by the Fulbright Program and National Geographic. After months interviewing hair braiders in Kenyatta Market, a hub for Nairobi's hair braiders, we noticed that despite talents and experience in the market, Covid-19 meant the loss of a consistent client base, leaving braiders out of work. Writing stories about the braiders helped customers know the braiders are there, but it didn't solve the problem of less women wanting to come into the market. From there, the app idea was born.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d9b7c59d-d14b-4c29-bf38-fe56a794b2ec\"}":{"__typename":"DeepDives","uuid":"d9b7c59d-d14b-4c29-bf38-fe56a794b2ec","content":"\u003cp\u003eIn my spare time, I love listening to slam poetry, going on long walks, dancing badly, and consuming an uncountable number of podcasts.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d0ccc6bd-4a36-40f9-81b7-9c3501efd653\"}":{"__typename":"DeepDives","uuid":"d0ccc6bd-4a36-40f9-81b7-9c3501efd653","content":"\u003cp\u003eI would love to continue editing my books and have them published. I'd also love to take time off to write in Berlin and around Europe and have my own column in the New York Times!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e270489a-7646-4292-82ba-0445e09bd2ad\"}":{"__typename":"DeepDives","uuid":"e270489a-7646-4292-82ba-0445e09bd2ad","content":"\u003cp\u003eGoing into college, I knew I wanted to pursue journalism and writing - and one of the first pieces of advice I received from a mentor was to diversify my fields of study. Being from D.C., I always held a deep fascination for politics and social justice. I wanted to not only better understand the nuances of inequality and poverty, but learn how our current political system can fix it. I paired my major with a minor in Creative Writing and African and African American Studies because of my specific interest in how the press and government can work together to address the centuries of Black inequality.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"c07a3f56-ee8c-487b-add6-4e1039fb3874\"}":{"__typename":"School","uuid":"c07a3f56-ee8c-487b-add6-4e1039fb3874","name":"Walt Whitman High School","city":"Bethesda","type":"HIGH","state":"Maryland","country":"United States","zip":"20817"},"Education:{\"uuid\":\"bf8d53e4-a6d1-4624-a9aa-433d13683dde\"}":{"__typename":"Education","uuid":"bf8d53e4-a6d1-4624-a9aa-433d13683dde","school":{"__ref":"School:{\"uuid\":\"c07a3f56-ee8c-487b-add6-4e1039fb3874\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"ba0afb76-0bc3-4a1e-8c80-39ace876f64b\"}":{"__typename":"Education","uuid":"ba0afb76-0bc3-4a1e-8c80-39ace876f64b","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2022","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"6a9c0b86-a3e1-4e20-a2ea-3d02990a99e0\"}":{"__typename":"MentorPublicProfile","uuid":"6a9c0b86-a3e1-4e20-a2ea-3d02990a99e0","displayName":"Natachi O.","slug":"natachi-onwuamaegbu","biography":"\u003cp\u003eNatachi Onwuamaegbu writes about race, art, and culture with bylines at The Washington Post, Cosmopolitan, The Boston Globe, Seattle Times and 5280 magazine. Currently, Onwuamaegbu is one of five global Fulbright-National Geographic fellows. During her Kenya-based fellowship, she created \"Braiding Nairobi,\" a multiplatform storytelling site which aims to tell the stories and complexities of the female hair braiders in Kenyatta Market, Nairobi.\u003cbr\u003e\u003cbr\u003eOnwuamaegbu is exploring the economic opportunities in Kenyatta by interviewing female hair braiders and the key players who make decisions that dictate the lives of the hair braiders. Kenyatta market is a place for Kenyan women to find economic liberation – young women can start businesses and support their families – but it can also be a place of economic entrapment. Women are paid impossibly low wages under bosses with no legal responsibility and have no healthcare or job security. Natachi posts her research on the Field Notes National Geographic site along with braidingnairobi.com and is now collecting these narratives into a book. \u003cbr\u003e\u003cbr\u003eSince creating \"Braiding Nairobi\" in September 2022, Natachi has realized the greater need for storytelling and social entrepreneurship centering African women. Through her brand new company, the \"Ndeza Collective,\" Natachi is combining the power of storytelling with technology, accessibility, and the gig economy, to expand past the borders of Kenyatta Market, Nairobi, and Kenya. \u003cbr\u003e\u003cbr\u003eNatachi is also producing and starring in \"Crushing,\" a show of monologues about messy romantic love, which just completed a sold-out run in NYC. A documentary about the show is in production. In 2022, Onwuamaegbu graduated from Stanford University with Honors and a 3.95 GPA. She majored in Political Science and minored in Creative Writing and African and African American Studies.\u003c/p\u003e","teachingVideoPlaybackId":"tuJsvJtimJU3rdgDBMhI9mGhJ7xCEgO4fz6cQXtHdsI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":
