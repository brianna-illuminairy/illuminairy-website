xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1ec569c6-22d8-48e3-9898-c0bab429ca60\"}":{"__typename":"DeepDives","uuid":"1ec569c6-22d8-48e3-9898-c0bab429ca60","content":"\u003cp\u003eYou \u003cem\u003ecan\u003c/em\u003e do it all!! Several well meaning teachers and family members suggested I ought to drop something. If I could just focus I would surely be an unstoppable athlete, or top of the class, or a grade 8 musician, or an award winning actress, or be fluent in a bajillion languages. However, I not only survived but thrived burning the candle at both ends. I am a more well-rounded, interesting and joyful person because of my many interests and they serve as a creative catalyst far more often than as any kind of hinderance. So, go forth! Do it all! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ce7266a7-9b83-426f-b5e3-72779d6fa800\"}":{"__typename":"DeepDives","uuid":"ce7266a7-9b83-426f-b5e3-72779d6fa800","content":"\u003cp\u003eMentorship matters to me because it helps shape who we are and what we believe we can achieve. Some of the most meaningful guidance I’ve received has come not just from formal supervisors, but from unexpected moments - conversations at conferences, on buses, at gigs, or on hikes. Those interactions remind me that mentorship can happen anywhere, and that sharing insight and encouragement can have a lasting impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"dd03a24c-1134-4504-ac00-67526037c482\"}":{"__typename":"DeepDives","uuid":"dd03a24c-1134-4504-ac00-67526037c482","content":"\u003cp\u003eThe world is full of challenges and I strive to arm myself with the relevant skills and get myself into the right rooms to tackle some of these problems! Agency is truly the cure to despondency. This is why I engage with difficult ethical dilemmas in conservation. It's why I wade through literature and mucky streams with equal enthusiasm. And it's why I refuse to to let the fear of being an unprepared, naive, imposter stop me from contributing to conversations that I know my perspective is valuable to. Hefty motivations to fuel my hefty ambitions!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"4593e544-ed89-4553-99f3-8bf9ec8c9fe8\"}":{"__typename":"DeepDives","uuid":"4593e544-ed89-4553-99f3-8bf9ec8c9fe8","content":"\u003cp\u003eI am a do-er, always have been. I pride myself on stepping in to help wherever I can. While at school this even sometimes looked like \u003cem\u003eliterally\u003c/em\u003e filling someone else's shoes in some leg of relay or other such sports fixture. While at university, this mentality formalised as holding countless (well, at least 10) committee roles. While never pursued for the skills learned, connections made or street (read: CV) cred earned, I am thankful for those things but it is clear to anyone who knows me that I took on such roles to recreate the same experiences that I loved participating in. Most notably, as treasurer of the British Student Korfball Association, I helped coordinate a national series of tournaments and a team tour to Turkey demanding initiative, collaboration and organisation. 'Always down to help' is a reputation I hope always precedes me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"6a08c833-ba87-496a-98bd-9c7196db904b\"}":{"__typename":"School","uuid":"6a08c833-ba87-496a-98bd-9c7196db904b","name":"Hills Road Sixth Form College","city":"Cambridge","type":"HIGH","state":"England","country":"United Kingdom","zip":"CB2 8PE"},"Education:{\"uuid\":\"845281cb-d39f-421b-b1b7-ba66d1221367\"}":{"__typename":"Education","uuid":"845281cb-d39f-421b-b1b7-ba66d1221367","school":{"__ref":"School:{\"uuid\":\"6a08c833-ba87-496a-98bd-9c7196db904b\"}"},"startYear":"2019","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e309b076-4a61-4be3-bbfa-8a8499882822\"}":{"__typename":"School","uuid":"e309b076-4a61-4be3-bbfa-8a8499882822","name":"St John's College, Oxford","city":"Oxford","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"OX1 3JP"},"Education:{\"uuid\":\"30a4974b-b366-4000-abc5-ad0ceb5121ea\"}":{"__typename":"Education","uuid":"30a4974b-b366-4000-abc5-ad0ceb5121ea","school":{"__ref":"School:{\"uuid\":\"e309b076-4a61-4be3-bbfa-8a8499882822\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"0470d5f8-9c7f-4e59-89ea-40789a1f207e\"}":{"__typename":"MentorPublicProfile","uuid":"0470d5f8-9c7f-4e59-89ea-40789a1f207e","displayName":"Flora  T.","slug":"flora-timney","biography":"\u003cp\u003eHi! I’m Flora, a self-professed jack of all trades master of one (Biology!). I recently graduated with an Integrated Master’s in Biology from the University of Oxford, concluding a rich student life decorated with awards spanning Olympiads, sport and the arts. I’ve learned first-hand how to balance ambitious academic pursuits with achievements beyond the classroom, and I’m keen to mentor fellow do-it-all students striving for success!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI loved the breadth of my degree, both in content and modes of learning. Becoming articulate across essays, reports, and presentations in topics ranging from the tiniest subcellular process to the grandest abstractions of the natural world is fundamental to the future of biology and to addressing many of the great challenges faced by the world today. I especially valued the chance to explore these disciplines through Oxford’s one-to-one tutorials. For my Master’s project, I applied state-of-the-art computational methods to the study of animal behaviour and perception, investigating how motion and pattern interact in the warning signals of poisonous fish. Ever hesitant to close doors, I continue to attend talks on conservation and public health policy and volunteer in local ecological surveys.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond my studies, I play Korfball for Ireland (a wonderfully niche sport - think basketball, if you’re curious enough to Google it!), act in plays and voiceovers, and sing and play trumpet in bands - including one rather unexpected gig in a hotel in Kazakhstan. I also love how biology has combined with my love of travelling and learning languages; In Tanzania, I was keen to translate “I slept like a log” into Swahili (“\u003cem\u003eNililala kama gogo”\u003c/em\u003e) though, given our 6 a.m. starts tracking baboons, it didn’t get much use!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBuilding on extensive experience across a range of educational settings, I now work part-time as an Associate Lecturer at Anglia Ruskin University demonstrating for their \u003cem\u003eQuantitative Tools and Techniques for Biologists \u003c/em\u003eCourse. I’m excited to continue fostering curiosity and confidence in my students, helping them achieve their academic goals and nurture a lifelong passion for learning and discovery.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy mentorship style draws on the invaluable guidance I’ve received throughout my life - from family to teachers, academics and peers. The tutorial system in Oxford, in particular, shaped not only the biologist I’ve become but also my approach to solving complex problems and handling difficult conversations with clarity and compassion. I encourage students to channel their curiosity and ambition into tangible outcomes through engaging discussions, iteratively strategizing, and a Socratic approach to learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough my mentorship, students channel their passion and ambition to achieve tangible outcomes through engaging tasks, devising and revising strategies and plans, and the socratic method. I am the conscientious, creative, and curious person I am because of the lessons I’ve learned and the people that taught me - and I’m grateful for the chance to pass that on to the next generation of learners.\u003c/p\u003e","teachingVideoPlaybackId":"MjFTh6uMukdRBPCtxqazEsjpeba7clZMjW8uqmDHgkU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1ec569c6-22d8-48e3-9898-c0bab429ca60\"}"},{"__ref":"DeepDives:{\"uuid\":\"ce7266a7-9b83-426f-b5e3-72779d6fa800\"}"},{"__ref":"DeepDives:{\"uuid\":\"dd03a24c-1134-4504-ac00-67526037c482\"}"},{"__ref":"DeepDives:{\"uuid\":\"4593e544-ed89-4553-99f3-8bf9ec8c9fe8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/35a5d558-b4bb-4fb4-9e05-2e4fa1f2d4f5/-/preview/-/format/jpg/","https://ucarecdn.com/607a1e8a-a2b2-4ee3-b94b-1868ed0fe0a2/-/preview/-/format/jpg/","https://ucarecdn.com/57c86c25-82c2-4bfc-bc98-8c41bab8d5b2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"845281cb-d39f-421b-b1b7-ba66d1221367\"}"},{"__ref":"Education:{\"uuid\":\"30a4974b-b366-4000-abc5-ad0ceb5121ea\"}"}],"hiredAt":"2025-11-06T17:08:50.075Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Chemistry","Writing","Academic Coaching","Executive Function","Reading","Creative Writing","Film / Theater","History Project","K-6 Storybook","Music","Sports Journalism","Visual Arts / Graphic Design","Medicine / Health","STEM Project","Journalism","Public Speaking","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"flora-timney\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0470d5f8-9c7f-4e59-89ea-40789a1f207e\"}"}}},"_sentryTraceData":"358555337435461fb0fc0ad2216a78eb-84ce6baaa34ad46b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=358555337435461fb0fc0ad2216a78eb,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"flora-timney"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dat
