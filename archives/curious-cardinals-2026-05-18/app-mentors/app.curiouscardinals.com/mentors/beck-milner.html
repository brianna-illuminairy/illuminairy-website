\"uuid\":\"25037545-f150-4568-ae5e-ab6fdfe7cea0\"}":{"__typename":"MentorPublicProfile","uuid":"25037545-f150-4568-ae5e-ab6fdfe7cea0","displayName":"Beck M.","slug":"beck-milner","biography":"\u003cp\u003eHi there! I’m Beck, a second-year student at Yale University, and I am passionate about helping students master their futures!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI lived my first ten years in New York City and then moved to Park City, Utah, after 3rd grade. Since I was in middle school, I have been fascinated with how we perceive ourselves and society as a whole. In light of this fascination, I embarked on a journey to best understand myself, and in doing so, I have pursued various academic, athletic, and extracurricular opportunities that have provided me with wonderful opportunities to observe how different environments influence our behavior. Throughout my quest, some notable ventures have included:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eEnrolling in a military boarding school in Carlsbad, CA, at the beginning of 8th grade to pursue my private pilot's license and an aviation career.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTransferring across the country to the Taft School in Watertown, CT, after learning that I would be medically restricted from flying.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEarning a starter role for the Yale Bulldogs baseball team during my freshman year.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTaking a leap of faith to pursue my athletic career at a higher level in the ACC at Boston College, and\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReturning to Yale to pursue my academic passions after career-ending injuries during my 2025 campaign.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I am qualified/how I can help you\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my ventures, I have maintained a passion for helping others. Upon making the move to Park City, I joined the National Ability Center to provide opportunities for disabled youths to participate in previously impossible activities like skiing and horseback riding. Additionally, I have orchestrated peer mentoring programs at the Army and Navy academy and again at Boston College, in an effort to connect younger students with those who have been in their shoes before, and provide them with the support they need to build confidence in all aspects of their interests. Such efforts have included:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAcademic tutoring: Providing strategies for time management, course material review, and solidification of core principles necessary for academic success.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLifestyle support: Educating and conversing on the possible difficulties arising from engaging in new communities, and\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFuture gameplaning: Taking time to think critically about one’s passions and goals, and then turning them into an actionable roadmap for achieving such goals.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy style/a typical session\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eGetting to know one another - focusing on what makes you, you\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming goals and ambitions - important for maximizing our time together\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eUtilizing goals and ambitions and applying them to real-world opportunities\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTaking real-world opportunities and developing an actionable roadmap for how to obtain such opportunities for you!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eFun Facts\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePreviously, my identity has been driven by my athletics; however, there is so much more that makes me, me. I love everything that has to do with the outdoors. I am big on connecting with nature. I also love music and art, despite not being much more than an average carpool karaoke vocalist, and my recent fascination has been with the ever-developing landscape that is AI today.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe possibilities for our time together are endless, and I cannot wait to get to know you!\u003c/p\u003e","teachingVideoPlaybackId":"WCV8OEWflVvcdBlzHNYb3NzUDtSVjGaTQeWDcXqBPzA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8e484ee9-6336-4059-8a24-1e52a3d11694\"}"},{"__ref":"Favorites:{\"uuid\":\"fc76c839-c2e7-4bb6-a23c-9289a003ef55\"}"},{"__ref":"Favorites:{\"uuid\":\"a2f0a931-c7a9-4f4c-94e3-a4248c744cb7\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"752834e7-41f1-4654-9f32-7923c1e200d6\"}"}],"major":"Philosophy and Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"64209794-a0f6-4cb2-a401-50b57a248ab3\"}"},{"__ref":"DeepDives:{\"uuid\":\"eea7cbee-f072-4197-a206-b57715978ebc\"}"},{"__ref":"DeepDives:{\"uuid\":\"2c7791a3-fa59-4c3d-83b5-8bbde9668cbb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4e1ae41a-388b-4486-9426-ac304dd21fa9/-/preview/-/format/jpg/","https://ucarecdn.com/841eccab-2c3c-4e66-8e7b-70a0652b0a95/-/preview/-/format/jpg/","https://ucarecdn.com/4447c126-2ee6-4965-9dee-182932c74b9f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"bf2b1974-93d6-4a4d-8e8e-a6557d768ae5\"}"},{"__ref":"Education:{\"u
