xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"db09a664-73fb-4c30-9016-45face17dc32\"}":{"__typename":"DeepDives","uuid":"db09a664-73fb-4c30-9016-45face17dc32","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eThroughout my sophomore and junior year of college, I built and launched a unique interactive review app that combines the functionalities of multiple review apps (e.g., Yelp, Goodreads, etc.) into one platform for friends to share their best recommendations.\u003c/p\u003e\u003cp\u003eI sourced over $35,000 for app development and generated a user base of 5,000+ downloads and 1,700+\u003c/p\u003e\u003cp\u003eactive users since app launch in September 2023. I manage a team of eight employees and over 100 ambassadors to design, improve and test the app. I have extensive business development experience, having created the brand identity, designed the website, and launch the app on campus with 20+ outreach avenues.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"983dfe34-def7-4813-a8f4-ad254b7921f0\"}":{"__typename":"DeepDives","uuid":"983dfe34-def7-4813-a8f4-ad254b7921f0","content":"\u003cp\u003eIn my spare time, I can be found reading Russian literature novels (anything by Dostoevsky and Nabokov I inhale), teaching my peers how to swim (I was a competitive swimmer and am Water Safety Instructor Certified), writing creative essays, reading New Yorker profiles, and hosting game nights for friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1b5c55e7-3de2-4645-98a3-57239df8709a\"}":{"__typename":"DeepDives","uuid":"1b5c55e7-3de2-4645-98a3-57239df8709a","content":"\u003cp\u003eI would emphasize the importance of not being intimidated by the prospect of creating new things. I would encourage myself to dive fearlessly into endeavors such as learning UI/UX design, submitting my writing samples to journals and publications, learning how the insides of computers work to act as the at-home family IT person, and teaching myself to play a musical instrument. I would stress the value of embracing the process of expanding my interests and acquiring new skills, rather than being fixated on achieving perfection or creating something groundbreaking. The act of learning and exploring is inherently rewarding, and I would remind myself to cherish every opportunity for growth and self-discovery.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4b350b48-403b-4c18-9792-b78b01c5f9c1\"}":{"__typename":"DeepDives","uuid":"4b350b48-403b-4c18-9792-b78b01c5f9c1","content":"\u003cp\u003eMentorship holds immense significance for me due to my upbringing as the eldest sibling in my family, where I witnessed firsthand the struggles my younger sister faced with her autism diagnosis. This experience instilled in me a deep understanding of the importance of celebrating individuals' self-worth and empowering them to achieve their goals despite any challenges they may encounter. Whether it's guiding a student through starting a podcast, crafting a compelling English essay on \"The Great Gatsby,\" or initiating a research project on a topic they are passionate about, I am committed to fostering their growth and success. Drawing from my own journey and experiences, I possess the ability to connect with students of all backgrounds and learning styles, igniting passion and enthusiasm within them through my own drive and enthusiasm. Mentoring students allows me to make a meaningful difference in their lives, helping them realize their potential and navigate their unique paths to success.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"49746e7a-59d8-4c5e-ab9a-2d3ca4760bfc\"}":{"__typename":"School","uuid":"49746e7a-59d8-4c5e-ab9a-2d3ca4760bfc","name":"Bard High School Early College","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10002"},"Education:{\"uuid\":\"72dc1592-f552-41e0-a511-4cce6ed186ed\"}":{"__typename":"Education","uuid":"72dc1592-f552-41e0-a511-4cce6ed186ed","school":{"__ref":"School:{\"uuid\":\"49746e7a-59d8-4c5e-ab9a-2d3ca4760bfc\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1e1a689a-3a98-432d-8728-8e69b760bf72\"}":{"__typename":"Education","uuid":"1e1a689a-3a98-432d-8728-8e69b760bf72","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English \u0026 Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"6d96c16c-295f-49ad-86fa-a083a595010a\"}":{"__typename":"MentorPublicProfile","uuid":"6d96c16c-295f-49ad-86fa-a083a595010a","displayName":"Sylvie G.","slug":"sylvie-goldner","biography":"\u003cp\u003eI am a junior at Yale College with a deep passion for writing, entrepreneurship, and literature. As a writing tutor at school, my extensive experience includes guiding students through the writing process, specializing in English papers, college supplements, and essays, and research papers. From developing innovative brainstorming exercises to refining polished writing, I offer comprehensive support tailored to each student's needs. I turn students into stronger writers, teaching them necessary grammar rules, storytelling techniques, and ultimately how to provoke an emotional or intellectual reaction in their audience. Additionally, I provide help to students navigating the college application process, ensuring their essays and supplements stand out. Many of the students I've assisted with their college writing supplements have gained admission to prestigious institutions like Duke, Michigan, Cornell, and others. Moreover, drawing from my experiences founding, developing, and launching an app, as well as running a not-for-profit with over 12 chapters, I possess a unique skill set in supporting students and enabling them to achieve their goals with passion projects. I excel at turning students' passions into tangible projects, empowering them to make meaningful contributions to the people around them. Overall, my energetic, creative, and fun approach to writing and learning ensures that every student I work with not only has a great time but also creates outstanding work.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"fa
