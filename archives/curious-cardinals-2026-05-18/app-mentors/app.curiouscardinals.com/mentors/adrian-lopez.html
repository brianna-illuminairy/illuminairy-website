xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"410b5f2c-3fd3-4fc7-a19d-af744893dab9\"}":{"__typename":"DeepDives","uuid":"410b5f2c-3fd3-4fc7-a19d-af744893dab9","content":"\u003cp\u003eI first met Jacob Merkle at the end of my junior year of high school. The pandemic had turned the world upside down and I had no clue what I wanted to do with my future. We started working together on a voter registration campaign, and through his mentorship, Jacob changed the course of my life. He showed me how meditation could help me understand myself better, and he always encouraged me to build a life I’m passionate about and proud of. What really stood out to me was how fiercely authentic he was. I hope to be that kind of mentor for younger students. Someone who listens, cares, and helps them believe in themselves.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ad81392f-372f-4c28-850b-96b3bd9db9ae\"}":{"__typename":"DeepDives","uuid":"ad81392f-372f-4c28-850b-96b3bd9db9ae","content":"\u003cp\u003eAim at something and stumble toward it. It took me a long time to shake off the idea that you have to be naturally talented to be good at something. But if you let yourself stumble toward your goal, if you accept the mistakes along the way, you'll get there. It's just a matter of time. Once I realized this in high school, I started getting better at chess way faster. I hit my dream of reaching 2000 on chess.com, and eventually made it all the way to 2200. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"951fd18f-ab7a-4e3e-aa24-848bc707f5d7\"}":{"__typename":"School","uuid":"951fd18f-ab7a-4e3e-aa24-848bc707f5d7","name":"Southwest Miami Senior High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33165"},"Education:{\"uuid\":\"495d79aa-acc5-44aa-a0c5-82cc89459cf2\"}":{"__typename":"Education","uuid":"495d79aa-acc5-44aa-a0c5-82cc89459cf2","school":{"__ref":"School:{\"uuid\":\"951fd18f-ab7a-4e3e-aa24-848bc707f5d7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"50e21bbd-b8b9-476f-be48-367c3038654b\"}":{"__typename":"Education","uuid":"50e21bbd-b8b9-476f-be48-367c3038654b","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"7e475793-4dfe-422f-a9ad-80395a0fedaa\"}":{"__typename":"MentorPublicProfile","uuid":"7e475793-4dfe-422f-a9ad-80395a0fedaa","displayName":"Adrian L.","slug":"adrian-lopez","biography":"\u003cp\u003eVoltaire ends \u003cem\u003eCandide \u003c/em\u003ewith “We must cultivate our garden.” One reason it’s stuck with me for years is because it’s the perfect way to think about learning. Everyone’s garden looks different, and my job as a mentor is to help each student grow their own.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eHi! I’m Adrian López, I graduated from Brown University with a degree in Neuroscience. I’m currently taking two gap years before attending medical school, with hopes to one day become a psychiatrist. My garden right now is full of research papers on pediatric suicide prevention for my job as a clinical research assistant, prep books and cheat sheets to tutor students for the MCAT, and a bunch of books like \u003cem\u003eInfinite Jest\u003c/em\u003e I finally have time to read.\u003cem\u003e \u003c/em\u003eI was born and raised in Miami, and I’ve always been curious about how people think and feel, from the molecular level all the way up to memory and dreams.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eThat curiosity started young. I was the second grader hauling a stack of fantasy books twice my size out of the library. My love for stories and the mind eventually combined with a love for science at Brown. Since then I’ve followed that love through research on trauma and meditation, volunteering my Saturdays at a suicide hotline, and working as a Spanish medical interpreter.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eSome of my favorite moments in college have been as a teaching assistant for Brown’s Introduction to Neuroscience course, where I’ve gotten the pleasure of watching students go from confused to confident. One in four students at Brown take the course, and my proudest accomplishment was creating over 800 Anki cards that covered every chapter of the textbook, cards used by all 250 students. Outside the classroom, I co-founded Brown’s Cuban Club, co-taught salsa classes with the Salsa Club, and tutored chess during the Summer@Brown Pre-College Program. I also scored in the 98th percentile on the MCAT. One of my strengths is test-taking strategies and I love helping others build theirs too.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I try to show up as a real person and cultivate real connections. At my core, I love long books, dancing, and talking about how science helps us understand our brain and mind. I believe that learning can be super fun and, with the right support, anyone can figure out how they learn best and actually enjoy the process. I can’t wait to meet you and help you find the process that works best for you.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"18UvsrhmGDsg3VUjVZcS1ybNzeBk8PmPZICW4flwCHs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"410b5f2c-3fd3-4fc7-a19d-af744893dab9\"}"},{"__ref":"DeepDives:{\"uuid\":\"ad81392f-372f-4c28-850b-96b3bd9db9ae\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9aa341db-cbb9-484c-8e65-a3109f17f690/-/preview/-/format/jpg/","https://ucarecdn.com/15b76e03-5027-4394-bba0-45a845e4cf8f/-/preview/-/format/jpg/","https://ucarecdn.com/bb880ebb-8ba2-4732-b7c4-08d592d03289/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"495d79aa-acc5-44aa-a0c5-82cc89459cf2\"}"},{"__ref":"Education:{\"uuid\":\"50e21bbd-b8b9-476f-be48-367c3038654b\"}"}],"hiredAt":"2025-04-23T23:36:02.408Z","topics":["Statistics","Algebra I","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Physics","Writing","College Essay Writing","Reading","Executive Function","Academic Coaching"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"adrian-lopez\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7e475793-4dfe-422f-a9ad-80395a0fedaa\"}"}}},"_sentryTraceData":"97aec2dea1d3487db3a6c3e1d88c7aab-8e9b236db8f8b0d9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77
