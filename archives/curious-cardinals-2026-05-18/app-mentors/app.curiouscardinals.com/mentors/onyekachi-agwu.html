b56-5cb0bb7382ca\"}":{"__typename":"DeepDives","uuid":"aa5c54b5-1393-4ca1-9b56-5cb0bb7382ca","content":null,"videoPlaybackId":"yxOOa01fz7Ev02KR7mpWxjsuDJW3P019M89Dgoxq58lAFE","question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"9a8084c4-c1ea-4627-84bf-a71d7230c8bf\"}":{"__typename":"Education","uuid":"9a8084c4-c1ea-4627-84bf-a71d7230c8bf","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Neurobiology","degree":null},"School:{\"uuid\":\"c82d12f3-ac36-4e16-a33f-da924be49ad8\"}":{"__typename":"School","uuid":"c82d12f3-ac36-4e16-a33f-da924be49ad8","name":"The Bronx High School of Science","city":"The Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10468"},"Education:{\"uuid\":\"a5bea7c8-1ef2-4fa2-a334-965c10f3ac73\"}":{"__typename":"Education","uuid":"a5bea7c8-1ef2-4fa2-a334-965c10f3ac73","school":{"__ref":"School:{\"uuid\":\"c82d12f3-ac36-4e16-a33f-da924be49ad8\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"4c64d49d-e814-45de-806f-b390c8ac4807\"}":{"__typename":"MentorPublicProfile","uuid":"4c64d49d-e814-45de-806f-b390c8ac4807","displayName":"Onyekachi A.","slug":"onyekachi-agwu","biography":"\u003cp\u003eAt a young age, I discovered the value of service. Whether in my family home or church community, I understood that my contribution mattered, no matter how small. Additionally, I learned that we care well for others when we are active participants in their lives. Since then, my love for community service has manifested itself in various ways. As a prospective medical student, I have given back to my society by volunteering at homeless shelters, visiting lonely patients at Boston hospitals, and conducting research on public health issues. Additionally, as an avid dancer, I have shared my passion for the art by leading dance classes, coaching students on Harvard's campus, and attending community lessons. Through all these experiences, I have learned that a society's success is truly contingent on how engaged its members are. As a volunteer at the Harvard Square Homeless Shelter, the guests depended on the rest of the staff to have breakfast ready by 7 AM so they could make it to work on time. Such a task seemed so minute, but was critical in ensuring that guests were fueled to make the most of their day and help them establish social stability.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a future doctor who desires to advance medicine globally, especially in underserved regions, I have learned not to shy away from need but instead to welcome it and ask myself what I can do to better the circumstance. That is why I love mentorship, because it grants me the unique opportunity to establish meaningful relationships with students as they navigate this journey called life. As a child who struggled with imposter syndrome and fear of public speaking, it was my mentors who fought for me and helped me see the importance of my voice as a contribution to this world. They taught me the importance of advocacy and grace when it came to mentorship. That is why I hope to give back to the next generation with a heart of service and compassion. No stranger to high-pressure situations, I welcome the mind full of ideas and curiosity that each child brings, and I look forward to helping them nurture these interests in productive ways as they walk out their individual callings.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"SPjIzdPFyWeVgUz9jZSLz54K7fv6o02yGpqBoz02cJpFk","teachingVideoDescription":null
