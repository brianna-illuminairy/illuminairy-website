xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"e9e4dffe-7a2d-4822-adfe-3eeef7c1877e\"}":{"__typename":"CausesSupported","uuid":"e9e4dffe-7a2d-4822-adfe-3eeef7c1877e","name":"Best Buddies International","description":"\u003cp\u003eprovide support for individuals with intellectual \u0026amp; developmental disabilities.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"667a0842-b5ac-4a9d-8dba-fba3d192a711\"}":{"__typename":"CausesSupported","uuid":"667a0842-b5ac-4a9d-8dba-fba3d192a711","name":" Brain Exercise Initiative","description":"\u003cp\u003edecelerating memory loss \u0026amp; improve cognitive function in those with Alzheimer's.\u003c/p\u003e\u003cbr\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"50546f7f-c300-41d6-8997-078b0c2eb6c9\"}":{"__typename":"DeepDives","uuid":"50546f7f-c300-41d6-8997-078b0c2eb6c9","content":"\u003cp\u003eThe first piece of advice I would give my middle or high school self would be that failure is a part of learning and not something to be afraid of. Instead of letting the fear of failure stop you from trying new things or taking risks, view each set-back as an opportunity to grow and improve.\u003c/p\u003e\u003cp\u003eAnother piece of advice I would give my younger self would be to develop good study habits. Learn effective study techniques, such as time management, organization, and consistent study habits, are essential to making your academic journey smoother and less stressful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"99d6c987-1cff-480c-8619-f7c118fd256c\"}":{"__typename":"DeepDives","uuid":"99d6c987-1cff-480c-8619-f7c118fd256c","content":"\u003cp\u003eMentorship matters to me because it provides a unique opportunity to inspire and guide others on their journey, just as my mentors have done for me. It allows me to share my experiences, knowledge, and insights, helping mentees navigate challenges and achieve their goals. Mentorship fosters personal and professional growth for both the mentor and mentee, creating a supportive environment where individuals can thrive, build confidence, and reach their full potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"fa44a4d0-a621-4c03-b22e-4f7f37059f38\"}":{"__typename":"DeepDives","uuid":"fa44a4d0-a621-4c03-b22e-4f7f37059f38","content":"\u003cp\u003eOne of my lifetime goals is to become a doctor and leverage my medical knowledge to enhance patient care. Additionally, I aim to use my medical expertise to contribute to the Best Buddies organization, helping individuals with intellectual and developmental disabilities lead fulfilling lives and  achieve a higher quality of life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e51f1ca1-332d-40cd-bf65-29e4e03fa791\"}":{"__typename":"DeepDives","uuid":"e51f1ca1-332d-40cd-bf65-29e4e03fa791","content":"\u003cp\u003eI find it fascinating to study human nature and science, both of which provide a theoretical and evidence-based structure for understanding the world and its human inhabitants.\u003c/p\u003e\u003cp\u003eI chose to major in Psychology and Biology \u0026amp; Society because I’m passionate about understanding the human mind and body in both health and illness. For that reason, I am currently pursuing the pre-medical track at Cornell University. In the future, I hope to be on the front lines treating and advocating for society’s most vulnerable patients and strive to directly improve the lives of others.\u0026nbsp;Specifically, my work with individuals who have intellectual and developmental disabilities and with individuals with Alzheimer's has deepened my commitment to improving quality of life for those with intellectual and cognitive challenges. These experiences have solidified my goal of becoming a doctor, where I hope to integrate my knowledge and compassion to make a meaningful impact in healthcare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"e588d4d5-9008-4dbf-b574-401c6f49aec4\"}":{"__typename":"Education","uuid":"e588d4d5-9008-4dbf-b574-401c6f49aec4","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"788df948-545a-44be-a128-63fe58906950\"}":{"__typename":"Education","uuid":"788df948-545a-44be-a128-63fe58906950","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Psychology and Biology \u0026 Society","degree":null},"MentorPublicProfile:{\"uuid\":\"f01b2b7c-51c0-47ad-ade6-73063eafbc05\"}":{"__typename":"MentorPublicProfile","uuid":"f01b2b7c-51c0-47ad-ade6-73063eafbc05","displayName":"Layla K.","slug":"layla-kaiden","biography":"\u003cp\u003eHello! My name is Layla Kaiden, and I am currently a student at Cornell University, double majoring in Psychology and Biology \u0026amp; Society.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up in the vibrant and diverse environment of New York City has greatly influenced my perspective and fueled my passion for understanding human behavior and societal impacts on health. This background drives my pursuit of a future in medicine, and I am currently on the pre-medical track at Cornell. Through my academic journey, I aim to broaden my understanding and explore the intricate relationships between biological processes and social dynamics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I have had the privilege of interning at the New-York-Presbyterian Weill Cornell Simulation Lab, where I delved into simulation-based education. This experience honed my research skills and provided a platform to engage in workshops, lectures, and discussions. Additionally, my role at Gazelle Medical as a Medical Research Assistant and Administrative Assistant has allowed me to contribute to important medical research, manage data collection, and coordinate transactions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy playing soccer and squash, doing puzzles, and painting. Volunteer work has always been close to my heart. I am deeply involved in the Best Buddies Organization and currently serve as President of the Cornell Best Buddies club, facilitating relationships between students and individuals with intellectual and developmental disabilities. I have also been a dedicated member of Meals on Wheels since 2013. These experiences have taught me the importance of community and supporting those in need.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Cornell, I serve on the Executive Board of Alpha Epsilon Delta, the National Health Pre-Professional Honor Society, as well as the Brain Exercise Initiative club. This nonprofit focuses on decelerating memory loss in Alzheimer's patients through mental exercises, allowing me to combine my academic interests with my passion for community service. Working with this initiative has given me valuable insights into creating engaging and impactful exercises tailored to individual needs, a skill I bring into my tutoring sessions. I strive to make learning both enjoyable and effective, using personalized strategies to help each student succeed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy tutoring journey began at Riverdale Country School, where I was a leader of the Riverdale Community Partners club. This enabled me to support children who have experienced domestic and emotional trauma through recreational activities. I have also been a tutor for the JCC volunteer program for several years, helping struggling children achieve academic success.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my mission is to inspire curiosity and compassion in my mentees. I believe in creating an engaging and supportive learning environment where students feel encouraged to explore their interests and develop their skills. My approach to mentorship is immersive and personalized, ensuring that each student receives the guidance and support they need to succeed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am excited to be part of Curious Cardinals and look forward to the opportunity to make a positive impact on my mentees!\u003c/p\u003e","teachingVideoPlaybackId":"3qMCUk1j5D2MjHIibs2GCYjtBE01KmZETUEqxml3ipno","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"e9e4dffe-7a2d-4822-adfe-3eeef7c1877e\"}"},{"__ref":"CausesSupported:{\"uuid\":\"667a0842-b5ac-4a9d-8dba-fba3d192a711\"}"}],"major":"Psychology and Biology \u0026 Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"50546f7f-c300-41d6-8997-078b0c2eb6c9\"}"},{"__ref":"DeepDives:{\"uuid\":\"99d6c987-1cff-480c-8619-f7c118fd256c\"}"},{"__ref":"DeepDives:{\"uuid\":\"fa44a4d0-a621-4c03-b22e-4f7f37059f38\"}"},{"__ref":"DeepDives:{\"uuid\":\"e51f1ca1-332d-40cd-bf65-29e4e03fa791\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/42a6869a-c2cb-405b-a538-3dcc28893c21/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e588d4d5-9008-4dbf-b574-401c6f49aec4\"}"},{"__ref":"Education:{\"uuid\":\"788df948-545a-44be-a128-63fe58906950\"}"}],"hiredAt":"2024-07-21T15:01:53.074Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Physics","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"layla-kaiden\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f01b2b7c-51c0-47ad-ade6-73063eafbc05\"}"}}},"_sentryTraceData":"c733c070c1154484ae6f684cf2ec238f-a7d9d86eab5dfc4b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c733c070c1154484ae6f684cf2ec238f,s
