xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6b1b293a-2b49-49ad-8187-88e87a3dc5fb\"}":{"__typename":"Favorites","uuid":"6b1b293a-2b49-49ad-8187-88e87a3dc5fb","photoUrl":"https://ucarecdn.com/bb02af83-198b-47e7-99b3-27dd0e0902be/","title":"Honolulu","type":"CITY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e410c63f-6c78-4335-b2cf-e83da86247ec\"}":{"__typename":"DeepDives","uuid":"e410c63f-6c78-4335-b2cf-e83da86247ec","content":"\u003cp\u003eI spent my summer voiding natural disaster by dutifully stewarding fires which campers had woefully neglected to extinguish on their departure from the riverside campground I worked at. I also made sure to get in some training in baseball, and the rest of the time I could be found at the beach or on a hike.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"bd74db08-aced-4f42-bb5d-96310fb39172\"}":{"__typename":"DeepDives","uuid":"bd74db08-aced-4f42-bb5d-96310fb39172","content":"\u003cp\u003eMy ambition for excellence is predicated on the belief that my career will be defined by the people who I uplift and empower. Requiring, therefore, that I empower myself in such a way that I can be of utmost value to others!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"e1f618d2-90d2-4458-b979-0e0910751410\"}":{"__typename":"DeepDives","uuid":"e1f618d2-90d2-4458-b979-0e0910751410","content":"\u003cp\u003eI was a nerd masquerading as an athlete (for a while I was convinced I would play baseball in college). \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ff49d7b0-59c9-47aa-868c-a3befa88588c\"}":{"__typename":"DeepDives","uuid":"ff49d7b0-59c9-47aa-868c-a3befa88588c","content":"\u003cp\u003eMy twin brother. His drive for excellence in medicine, combined with his community-first imperatives, and value for more empathetic relationships between doctors and patients.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"aa847cf0-d26a-4758-9dfd-75032aa83007\"}":{"__typename":"School","uuid":"aa847cf0-d26a-4758-9dfd-75032aa83007","name":"Marin Catholic","city":"Kentfield","type":"HIGH","state":"California","country":"United States","zip":"94904"},"Education:{\"uuid\":\"132be4c1-14ac-46d6-8c6b-2a8100bcc33f\"}":{"__typename":"Education","uuid":"132be4c1-14ac-46d6-8c6b-2a8100bcc33f","school":{"__ref":"School:{\"uuid\":\"aa847cf0-d26a-4758-9dfd-75032aa83007\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b419364a-641d-4b4d-a4a4-bce6c3aaa6b1\"}":{"__typename":"Education","uuid":"b419364a-641d-4b4d-a4a4-bce6c3aaa6b1","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Anthropology and Native American Studies","degree":null},"Testimonial:597f56eb-2e2f-4e3d-a919-f8f6b7590fc7":{"__typename":"Testimonial","id":"597f56eb-2e2f-4e3d-a919-f8f6b7590fc7","text":"Dryden has been a perfect match for Anna’s aspirations from day one. In addition to his familiarity with the Stanford admissions process, his approachable personality, and his masterful guidance (all of which would benefit any high-school student aiming for a top university), we have found his deep subject-matter expertise to be immensely valuable. His background in anthropology informs every mentoring session with Anna and has helped her make tangible progress on her research project while developing literature-review and academic-writing skills that surpass the most demanding courses at her high school. We are grateful for Dryden’s ongoing support and the thoughtful weekly updates he sends, which enable us to reinforce Anna’s work between their sessions. We look forward to seeing the final product of the research project and the opportunities it will create for our daughter’s growth as an aspiring cultural anthropologist.","date":"2025-06-04 04:23:48.773+00","rating":5,"endorser":{"__typename":"Endorser","name":"Anna's Dad","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"c54e8453-0193-4f7e-a33a-34b2d5b54757\"}":{"__typename":"MentorPublicProfile","uuid":"c54e8453-0193-4f7e-a33a-34b2d5b54757","displayName":"Dryden M.","slug":"dryden-myers","biography":"\u003cp\u003e\u003cstrong\u003eQuick Highlights:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eStanford graduate (Phi Beta Kappa, honors, distinction) in Anthropology and Native American Studies.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNative Hawaiian mentor and East-West Center Fellow pursuing a law degree at UH Mānoa.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExperienced in college admissions, research, publishing, and academic writing.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFocused on student resilience, purpose-driven learning, and voice development.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e________\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAloha! I’m Sonny (Dryden Myers),\u003c/strong\u003e a Native Hawaiian educator, mentor, and East-West Center Graduate Fellow pursuing a J.D. at William S. Richardson School of Law at the University of Hawaiʻi. I graduated Phi Beta Kappa from Stanford University with honors and distinction in Anthropology and Native American Studies. My honors thesis explored Koʻolaupoko, Oʻahu as a cultural site of resilience for Native Hawaiian communities. I later earned a master’s in Hawaiian language to deepen my cultural and linguistic fluency and ground my future in mission-driven leadership in Hawaiʻi and beyond.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith an interdisciplinary background spanning research, publishing, college essay and application development, and community organizing, I bring a wide toolkit to mentoring. I’ve worked on public health and psychology studies, edited academic and creative work, planned conferences, and helped students sharpen their writing and time management. I understand the stress of achievement culture — and I know how powerful it is when students develop not just skills, but confidence, clarity, and joy in the process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy goal as a mentor is to help students find their voice, cultivate self-discipline, and anchor their ambitions in curiosity and meaning. Whether the goal is college admissions, a passion project, or a research paper, I work to build both hard and soft skills — from analytical thinking and writing to resilience and self-advocacy — that help students thrive in school and in life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m a baseball enthusiast and outdoorsy from mountain to sea. I enjoy drawing, writing, working out, and indie/folk/Americana/Hawaiian music. I’m passionate about mental health, cultural revitalization, and bringing out the best in others — always with a touch of humor (sometimes dark, always real).\u003c/p\u003e","teachingVideoPlaybackId":"00eAp6RGJAIT3X01V02LSuJKdYJXbGGA6EWSURlAOd02HbA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6b1b293a-2b49-49ad-8187-88e87a3dc5fb\"}"}],"causesSupported":[],"major":"Anthropology and Native American Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e410c63f-6c78-4335-b2cf-e83da86247ec\"}"},{"__ref":"DeepDives:{\"uuid\":\"bd74db08-aced-4f42-bb5d-96310fb39172\"}"},{"__ref":"DeepDives:{\"uuid\":\"e1f618d2-90d2-4458-b979-0e0910751410\"}"},{"__ref":"DeepDives:{\"uuid\":\"ff49d7b0-59c9-47aa-868c-a3befa88588c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1969ad3f-7567-438c-811c-a22a11afb939/-/preview/-/format/jpg/","https://ucarecdn.com/432077ae-05cf-4fd8-9795-860ce4be2815/-/preview/-/format/jpg/","https://ucarecdn.com/2a6db06b-5db0-4f97-9114-f3c27b09287b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"132be4c1-14ac-46d6-8c6b-2a8100bcc33f\"}"},{"__ref":"Education:{\"uuid\":\"b419364a-641d-4b4d-a4a4-bce6c3aaa6b1\"}"}],"hiredAt":"2025-01-25T01:18:04.378Z","topics":["Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","History","Economics","Creative Writing","History Project","Law / Government / Policy","Sustainability"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"di
