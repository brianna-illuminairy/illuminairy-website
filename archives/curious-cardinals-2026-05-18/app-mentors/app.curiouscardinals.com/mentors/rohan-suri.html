xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ca626301-509c-452d-a023-718858c1ca67\"}":{"__typename":"Favorites","uuid":"ca626301-509c-452d-a023-718858c1ca67","photoUrl":"https://ucarecdn.com/07b85e82-94a5-4365-b3b7-3d8367ef4b31/","title":"CJ Stroud (GO OSU)","type":"ATHLETE"},"Favorites:{\"uuid\":\"cbc85dd5-5409-45d1-bd8b-a6d278b5ca2d\"}":{"__typename":"Favorites","uuid":"cbc85dd5-5409-45d1-bd8b-a6d278b5ca2d","photoUrl":"https://ucarecdn.com/21fdfe22-1759-4135-b70a-5dac8b04e702/","title":"Revenge of the Dreamers III","type":"ALBUM"},"Favorites:{\"uuid\":\"c2b6d509-09cd-4292-907a-14e04e591163\"}":{"__typename":"Favorites","uuid":"c2b6d509-09cd-4292-907a-14e04e591163","photoUrl":"https://ucarecdn.com/5fa19279-2939-4939-83ed-34f4d5c62bfe/","title":"Amitabh Bachchan","type":"ACTOR"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c71833fd-fa0c-46d7-a027-6625e38d8c8f\"}":{"__typename":"DeepDives","uuid":"c71833fd-fa0c-46d7-a027-6625e38d8c8f","content":"\u003cp\u003eI know you’re worrying about so many things right now—school, friends, the future. It feels like the weight of the world is on your shoulders. But let me tell you something: so much of what you’re worrying about won’t matter in the long run. Let go of the small stuff. Life has a funny way of working out, often in ways you don’t expect. The energy you’re spending on anxiety could be spent on joy, curiosity, and growth.\u003c/p\u003e\u003cp\u003eHere’s the most important thing: focus on what you \u003cem\u003elove\u003c/em\u003e. Those things that light you up, that you can’t stop thinking about or talking about—they’re not just hobbies. They’re signs pointing you toward who you are. Don’t be afraid to dive into them, even if they don’t seem practical or “useful.” Doing what you love isn’t a luxury—it’s the key to building a life that feels meaningful and fulfilling.\u003c/p\u003e\u003cp\u003eYou don’t have to have it all figured out. Just trust that by following your passions, you’ll create a path that’s uniquely yours. Don’t worry so much. Dream more, explore more, and trust yourself. You’re going to do just fine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b3c3963c-1a75-49d8-a370-e868014c190d\"}":{"__typename":"DeepDives","uuid":"b3c3963c-1a75-49d8-a370-e868014c190d","content":"\u003cp\u003eIn my spare time, I love to bake and play basketball. Although they're quite different, they both serve as great stress relievers. Watching my parents share a slice of cake or my brother devour an entire pie brings me a sense of satisfaction I can't explain. Playing basketball with my friends at our local court takes the weight of impending exams off of my shoulders in a way nothing else can. I'm incredibly grateful that I have these activities and people to do them with, because without them, managing my mountain of academic and extracurricular commitments would be nearly impossible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"95f56a80-6ecd-4ed5-974d-6c3f443ebc39\"}":{"__typename":"School","uuid":"95f56a80-6ecd-4ed5-974d-6c3f443ebc39","name":"Ladue Horton Watkins High School","city":"St. Louis","type":"HIGH","state":"Missouri","country":"United States","zip":"63124"},"Education:{\"uuid\":\"ed617f4d-64ad-4913-84d8-9330f78351dc\"}":{"__typename":"Education","uuid":"ed617f4d-64ad-4913-84d8-9330f78351dc","school":{"__ref":"School:{\"uuid\":\"95f56a80-6ecd-4ed5-974d-6c3f443ebc39\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"e7b05535-af6f-4503-b038-7add10e1ef8e\"}":{"__typename":"Education","uuid":"e7b05535-af6f-4503-b038-7add10e1ef8e","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"333806fe-b17c-45a6-8240-460fe3d36d6c\"}":{"__typename":"MentorPublicProfile","uuid":"333806fe-b17c-45a6-8240-460fe3d36d6c","displayName":"Rohan S.","slug":"rohan-suri","biography":"\u003cp\u003e“Give a man a fish and you feed him for a day. Teach him how to fish and you feed him for a lifetime.” - Laozi\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHi! My name is Rohan Suri, and STEM taught me how to fish. I’m a current Chemistry major at Yale (from St. Louis, Missouri) who loves to read, play basketball, and take naps.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough there are countless reasons for my appreciation of STEM (and as my mentee, you’d be encouraged to find your own), I’ll briefly provide one. At the most basic level, STEM is a collection of tools that, when used properly, allow you to understand problems and fix them. And the beauty of it all lies not in the fact that STEM allows you to recognize the complexity of our world, but that it permits you to take advantage of it. As a mentor, I’ll instill this concept in mentees, teaching the metaphorical “student” to fish instead of resigning them to being fed.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSurprisingly enough, my experiences in startups, public speaking, nonprofit work, and past mentoring all trace their roots back to STEM, too. In the past few years, I’ve spent time working with many organizations involved in STEM-based service while building my own, an adventure that has been critical to my understanding of how to effectively create impact. At Yale, I was selected as a Helix fellow, a cohort of ~20 students chosen to be paired with budding biotechnology startups for their technical and interpersonal skills. As an Associate Editor for the Yale Undergraduate Research Journal (YURJ), I’m also heavily involved in academic research, and understand the qualities that distinguish a good piece from a great one. Additionally, My work with TEDXYale’s finance team has equipped me with hands-on fundraising and organizational experience that maintains a focus on analytical reasoning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYet as a mentor, my mission would remain to take skills that the technical side of STEM necessitates and show my mentees how to apply it to all aspects of their own life. By approaching multidisciplinary problems with a mindset oriented toward critical thinking, discovering solutions suddenly becomes far easier. Whether it’s building an organization from the ground up, designing a robot to do your chores, doing research, or simply applying to college, I’m incredibly excited to use my background to provide guidance to students—and in the process, teach them how to fish too.\u003c/p\u003e","teachingVideoPlaybackId":"6LABsFF3zS0201TONKIb7mFKLEkJ83yJ00erAWhVL4CP6s","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBaking the \u003cstrong\u003eperfect\u003c/strong\u003e chocolate chip cookie. Brown butter, gourmet chocolate, sea salt flakes, and a touch of espresso. Trust me - it doesn't get much better than this.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ca626301-509c-452d-a023-718858c1ca67\"}"},{"__ref":"Favorites:{\"uuid\":\"cbc85dd5-5409-45d1-bd8b-a6d278b5ca2d\"}"},{"__ref":"Favorites:{\"uuid\":\"c2b6d509-09cd-4292-907a-14e04e591163\"}"}],"causesSupported":[],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c71833fd-fa0c-46d7-a027-6625e38d8c8f\"}"},{"__ref":"DeepDives:{\"uuid\":\"b3c3963c-1a75-49d8-a370-e868014c190d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b26d67a0-ac84-47db-9019-49b560b925fe/-/preview/-/format/jpg/","https://ucarecdn.com/7109d17f-ea73-490c-9e25-f15c2f506a0b/-/preview/-/format/jpg/","https://ucarecdn.com/b99c6e06-25a0-4324-9825-8220c3b4c812/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"ed617f4d-64ad-4913-84d8-9330f78351dc\"}"},{"__ref":"Education:{\"uuid\":\"e7b05535-af6f-4503-b038-7add10e1ef8e\"}"}],"hiredAt":"2024-11-05T15:28:14.620Z","topics":["Robotics / Electronics / CAD","STEM Project","Statistics","Algebra II","Algebra I","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Physics","Chemistry","6-8 Grade Science","Biology","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rohan-suri\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"333806fe-b17c-45a6-8240-460fe3d36d6c\"}"}}},"_sentryTraceData":"c04680a5a9d846d6aa6021149d1a98c8-84bdfdf1af7fa986-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c04680a5a9d846d6aa6021149d1a98c8,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"rohan-suri"}
