xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"990509cf-e892-4c1c-86c9-041500910aaa\"}":{"__typename":"Favorites","uuid":"990509cf-e892-4c1c-86c9-041500910aaa","photoUrl":"https://ucarecdn.com/d6f7a01c-51c6-4acc-9997-285b4a3b7580/","title":"A Song For You - Donny Hathaway","type":"SONG"},"Favorites:{\"uuid\":\"dc96ab0d-a1c3-41ca-a363-26bda868124b\"}":{"__typename":"Favorites","uuid":"dc96ab0d-a1c3-41ca-a363-26bda868124b","photoUrl":"https://ucarecdn.com/d6f7a01c-51c6-4acc-9997-285b4a3b7580/","title":"Mikaela Shiffrin","type":"ATHLETE"},"Favorites:{\"uuid\":\"cb6df501-2c9c-42e7-a019-559d6ab7bc37\"}":{"__typename":"Favorites","uuid":"cb6df501-2c9c-42e7-a019-559d6ab7bc37","photoUrl":"https://ucarecdn.com/d6f7a01c-51c6-4acc-9997-285b4a3b7580/","title":"Finding Nemo","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"48a9c93e-46f2-4380-99ab-55e274985aa3\"}":{"__typename":"DeepDives","uuid":"48a9c93e-46f2-4380-99ab-55e274985aa3","content":"\u003cp\u003eI like to spend my spare time outdoors - on a bike, skis, or just running around the mountains! I love spending time outside and hope to inspire others to get outdoors in a way that feels good for them! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"621e6abe-9b35-4e37-bb4a-19771474358e\"}":{"__typename":"DeepDives","uuid":"621e6abe-9b35-4e37-bb4a-19771474358e","content":"\u003cp\u003eI would tell my high school self to reach out to people around me for advice and insight! I was lucky to be surrounded by incredible mentors in high school and their advice and wisdom carries with me today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"42b17563-ca3f-45fc-b7f7-f044120ec45a\"}":{"__typename":"DeepDives","uuid":"42b17563-ca3f-45fc-b7f7-f044120ec45a","content":"\u003cp\u003eI have always been fascinated by the ocean, and I feel that so much life on Earth is depending on the big blue planet! Marine Biology was a great way for me to study ocean systems and learn more about the ecosystem I love.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}":{"__typename":"School","uuid":"8294116e-a190-41eb-a458-e542ee61c042","name":"St. Paul's School","city":"Concord","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03301"},"Education:{\"uuid\":\"52908c36-30a8-46cb-a273-e259701fe01b\"}":{"__typename":"Education","uuid":"52908c36-30a8-46cb-a273-e259701fe01b","school":{"__ref":"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"38f1daf7-a993-4487-be77-ec6a121b68cf\"}":{"__typename":"Education","uuid":"38f1daf7-a993-4487-be77-ec6a121b68cf","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Biology (Marine Biology)","degree":null},"Testimonial:2f880b0a-7430-4cda-a96b-d83f0fdacdb1":{"__typename":"Testimonial","id":"2f880b0a-7430-4cda-a96b-d83f0fdacdb1","text":"Adelaide and my son are like two peas in an obscure animals pod! His sessions with Adelaide are the highlight of his week and he's so proud of his blog. The other day, he couldn't wait to show Adelaide the new book he got about \"weird animals\". Adelaide has helped my son develop his writing skills and made it fun along the way. We love Adelaide!","date":"2025-06-05 17:12:14.101+00","rating":5,"endorser":{"__typename":"Endorser","name":"Stephanie Shum","tagline":"","avatar":null}},"Testimonial:858bb050-57be-4cd6-bd54-ba605027eae4":{"__typename":"Testimonial","id":"858bb050-57be-4cd6-bd54-ba605027eae4","text":"Adelaide has been a true gift for our daughter - she managed to make a strong connection quickly, and tailored a program that is diverse and personalized in a truly engaging way. We're so happy our daughter gets to spend time with her!","date":"2025-05-28 05:19:13.597+00","rating":5,"endorser":{"__typename":"Endorser","name":"David Malek","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"60267070-8703-468f-a38d-591c38f6ded8\"}":{"__typename":"MentorPublicProfile","uuid":"60267070-8703-468f-a38d-591c38f6ded8","displayName":"Adelaide D.","slug":"adelaide-dahl","biography":"\u003cp\u003eAdelaide is a recent graduate from Brown University where she completed her Bachelors of Science degree in Biology. Before Brown, she studied at St. Paul’s School in Concord, New Hampshire, and developed skills in visual art and drawing. These skills further evolved in her undergraduate studies through courses at the Rhode Island School of Design. With passions for visual art and environmental science, Adelaide combined these interests in courses and studies on scientific communication and graduated from Brown with honors on her thesis project in Marine Ecology. \u003cbr\u003e\u003cbr\u003eAdelaide spent time at Brown working with the Marine Biology lab on campus, studied abroad for six months in New Zealand, and served as co-captain for the Brown Women’s Rowing team. Her diversity of interests allows her to bring a unique perspective to each platform and helps to highlight the importance of pursuing your passions. \u003cbr\u003e\u003cbr\u003eSince graduating from Brown, Adelaide has been working in Coral Ecology. She works on the coral reefs of Mo'orea French Polynesia, and St. John, US Virgin Islands, SCUBA diving and conducing research on the impacts of climate change on one of the planet's most critical ecosystems. She has a Master's in Biology from her work on coral reefs and is working on her PhD in Ecology, Evolution, and Marine Biology at the University of California, Santa Barbara. When she isn't studying or working underwater, Adelaide loves to bike and ski, and spend time outdoors! \u003cbr\u003e\u003cbr\u003eAs a mentor at Curious Cardinals, Adelaide hopes to encourage students to explore and discover their own passions, developing skills to carry them through all aspects of life and learning!\u003c/p\u003e","teachingVideoPlaybackId":"EZJsiNiOO1lWVU01W3BHevD02T7jzEa5A8r9PuJHB8uYo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"990509cf-e892-4c1c-86c9-041500910aaa\"}"},{"__ref":"Favorites:{\"uuid\":\"dc96ab0d-a1c3-41ca-a363-26bda868124b\"}"},{"__ref":"Favorites:{\"uuid\":\"cb6df501-2c9c-42e7-a019-559d6ab7bc37\"}"}],"causesSupported":[],"major":"Biology (Marine Biology)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"48a9c93e-46f2-4380-99ab-55e274985aa3\"}"},{"__ref":"DeepDives:{\"uuid\":\"621e6abe-9b35-4e37-bb4a-19771474358e\"}"},{"__ref":"DeepDives:{\"uuid\":\"42b17563-ca3f-45fc-b7f7-f044120ec45a\"}"}],"activ
