xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"5078e468-22fc-42ab-ae0a-60333adfdec9\"}":{"__typename":"Education","uuid":"5078e468-22fc-42ab-ae0a-60333adfdec9","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":null,"endYear":null,"expectedGradYear":"2024","major":"History \u0026 Psychology","degree":"Bachelor of Arts"},"MentorPublicProfile:{\"uuid\":\"bed6d0e1-1153-40b9-82ae-93065046dcba\"}":{"__typename":"MentorPublicProfile","uuid":"bed6d0e1-1153-40b9-82ae-93065046dcba","displayName":"Natalia T.","slug":"natalia-torres","biography":"Natalia is a junior at Yale University double majoring in History and Psychology.  Within these majors, she is interested in American history, particularly the history of the United States Constitution, and behavioral psychology, particularly human relationships.  Outside of the classroom, Natalia interns on the marketing team at Cameo, a video-sharing startup, and spends much of her time exploring New Haven’s many restaurants with friends. During the 2020-21 academic year, Natalia took a leave of absence from Yale to work with two startups - the Alliance for Inclusive and Multicultural Marketing (AIMM) and Bonfire.  At AIMM, she learned a great deal about the role of DEI in corporate America and the drastic need for better representation in advertising.  At Bonfire,  a talent development accelerator for women, she learned tactical skills for presenting yourself and your ideas in the workplace, as well as ways to hone in on your true voice.  After this gap year, she interned within McKinsey \u0026 Company’s Growth, Marketing \u0026 Sales practice and returned for a second summer internship in 2022.  Here, she learned invaluable lessons on effective communication and presentation.  Prior to traveling from sunny Miami to freezing New Haven, in 2019, she graduated summa cum laude from her high school in Miami with a Bilingual International Baccalaureate degree. She served as class treasurer and later student body treasurer for a school of ~4,000 students.  In high school, however, her passion was coral reef research and protection.  She served as co-President of her school’s environmental club, co-directed the coral lab at her school, and interned in 2018 at the Gates Coral Lab at the University of Hawaii (featured in her favorite documentary - Chasing Coral!).  Although her curiosity took her in a different academic direction once she arrived at Yale, she continues to feel very strongly about the work she was involved in in high school.  While she hopes to be in law school in 5 years, she feels comfortable embracing the uncertainty of the future in order to continue to truly refine her passions! Her three goals for the 2022-23 academic year are to establish great relationships with her mentees, get back into playing piano, and begin learning jiu jitsu.  Natalia is so excited to both teach and learn from curious and passionate students like herself!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History \u0026 Psychology","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/6e65dd61-d2f3-46eb-aeb1-7f206826dc6d/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5078e468-22fc-42ab-ae0a-60333adfdec9\"}"}],"hiredAt":"2022-09-07T03:26:14.000Z","topics":["History Project","History","Spanish","Debate","Public Speaking","Jour
