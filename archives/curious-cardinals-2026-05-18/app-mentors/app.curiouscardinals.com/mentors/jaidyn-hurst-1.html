xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8579c18e-70dd-4671-8032-4640977599e9\"}":{"__typename":"Favorites","uuid":"8579c18e-70dd-4671-8032-4640977599e9","photoUrl":"https://ucarecdn.com/3a0492d3-e069-420e-a7c4-af0d3825c0ef/","title":"Busyhead by Noah Kahan ","type":"ALBUM"},"Favorites:{\"uuid\":\"fe1e4665-1d98-4fe8-b9cb-d00f11364b7f\"}":{"__typename":"Favorites","uuid":"fe1e4665-1d98-4fe8-b9cb-d00f11364b7f","photoUrl":"https://ucarecdn.com/d31232d7-1667-4b00-8dfd-a10f67a63206/","title":"The Outsiders","type":"PLAY"},"Favorites:{\"uuid\":\"cc74d879-1de5-4f2c-a52b-6656216aa975\"}":{"__typename":"Favorites","uuid":"cc74d879-1de5-4f2c-a52b-6656216aa975","photoUrl":"https://ucarecdn.com/bd27ca35-a4d9-443b-b124-a32e61afc57b/","title":"Hello Beautiful by Ann Napolitano","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"81915ea6-7139-4dba-a6aa-1ca05c70cd8c\"}":{"__typename":"DeepDives","uuid":"81915ea6-7139-4dba-a6aa-1ca05c70cd8c","content":"\u003cp\u003eI would tell myself to live in the moment and to not stress about the future! Everything has a way of working out in the end!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c4d4fc56-1e9b-42cc-bd7a-3e36037aa5e3\"}":{"__typename":"DeepDives","uuid":"c4d4fc56-1e9b-42cc-bd7a-3e36037aa5e3","content":"\u003cp\u003eI have two dream jobs: the first would be to work in the music industry as a songwriter or as a label executive and the second would be to work in the state department and eventually become an ambassador. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"ade59f6e-6da8-4985-b08f-ec7e5f600470\"}":{"__typename":"DeepDives","uuid":"ade59f6e-6da8-4985-b08f-ec7e5f600470","content":"\u003cp\u003eI spent my high school summers attending study abroad language courses and taking classes through programs and colleges. I also interned for some amazing organizations in Colorado like Valley Settlement, a nonprofit that provides free education for immigrant families, and the Aspen Institute.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a23d0bc7-cba9-47b8-9bf2-8691e79318e2\"}":{"__typename":"DeepDives","uuid":"a23d0bc7-cba9-47b8-9bf2-8691e79318e2","content":"\u003cp\u003eMy greatest role models are my mom and dad because they have truly led by example and taught me how to work hard, how to fight for what I believe in, and how to pursue my dreams.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"28dc9414-39f2-4281-9471-f58ee71688b7\"}":{"__typename":"School","uuid":"28dc9414-39f2-4281-9471-f58ee71688b7","name":"The Hotchkiss School","city":"Lakeville","type":"HIGH","state":"Connecticut ","country":"USA","zip":"06039"},"Education:{\"uuid\":\"1e71feaf-a10b-4210-b4f3-23965eb8392b\"}":{"__typename":"Education","uuid":"1e71feaf-a10b-4210-b4f3-23965eb8392b","school":{"__ref":"School:{\"uuid\":\"28dc9414-39f2-4281-9471-f58ee71688b7\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"21e82473-a407-40f0-b975-c79b29bb2f66\"}":{"__typename":"Education","uuid":"21e82473-a407-40f0-b975-c79b29bb2f66","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Global Affairs","degree":null},"Testimonial:9a848240-b5ca-43e0-b6e7-caf04ebb399b":{"__typename":"Testimonial","id":"9a848240-b5ca-43e0-b6e7-caf04ebb399b","text":"Jaidyn, \nYou are so sweet and funny and I love coming onto our zoom meetings! You are always smiling an infectious smile. I love sharing my ideas with you, whether it's a jingle about Australia or a song about friendship, you always help me to do my best. Some of the songs may be dark or outrageous but overall we came up with SO many amazing songs. I couldn't have done it without your help!! Thank you SOOO much!!!\n ps: everyone in my family and my friends love your music!! ;)\nlove, Neve\n\nDear Jaidyn,\nYou have been a gift to our daughter and to our whole family.  Thank you for your upbeat positivity, creativity, patience \u0026 flexibility.  You have inspired Neve in so many ways - with her music, with her ambitions for her educational future, and overall you've just been an incredible role model for her!  We are so grateful for you, thank you again.","date":"2025-06-13 21:30:36.07+00","rating":5,"endorser":{"__typename":"Endorser","name":"Juli Welch","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"b54d5b0b-5c4e-44ce-8ceb-19e2eb80ef83\"}":{"__typename":"MentorPublicProfile","uuid":"b54d5b0b-5c4e-44ce-8ceb-19e2eb80ef83","displayName":"Jaidyn H.","slug":"jaidyn-hurst-1","biography":"\u003cp\u003eJaidyn Hurst is an undergraduate student at Yale University. She is double majoring in Humanities and Political Science. At Yale, Jaidyn serves as the President of the Women's Network, a writing partner at the Poorvu Center for Teaching and Learning, a reading partner for New Haven Reads, and a member of the Songwriters Collective. Before Yale, Jaidyn attended the Hotchkiss School where she was the head of the all-female identifying A Cappella group, the Hotchkiss Democrats, the Writing Center, and the French Club. She served as the class president, worked as a peer and community service tutor, and organized the annual Student Music Showcase.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile Jaidyn has always been an all-around learner, she is deeply passionate about languages, music, and books. Jaidyn grew up splitting her school year between a bilingual school in France and an outdoorsy school in Colorado. She speaks fluent French, nearly fluent Spanish, and had her very own Curious Cardinals mentor in High School that taught her Arabic. Jaidyn is also a singer-songwriter and has released an EP, \u003cem\u003eSeasons,\u003c/em\u003e and LP, \u003cem\u003eMy Reality,\u003c/em\u003e that were distributed by Sony Orchard Music. She has filmed multiple music videos and performed her own music live at multiple small venues. Lastly, Jaidyn is an avid fiction and fantasy reader and loves discussing and discovering good books. Jaidyn loves words and understanding the many ways they can be used to communicate, whether through song, a different language, or a book.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eJaidyn is so excited to help Curious Cardinal students find and foster their passions.\u003c/p\u003e","teachingVideoPlaybackId":"y4RwyjxYTvqfIIMCu00bQ9C802idrjK2T8hbFYAp4sq1A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8579c18e-70dd-4671-8032-4640977599e9\"}"},{"__ref":"Favorites:{\"uuid\":\"fe1e4665-1d98-4fe8-b9cb-d00f11364b7f\"}"},{"__ref":"Favorites:{\"uuid\":\"cc74d879-1de5-4f2c-a52b-6656216aa975\"}"}],"causesSupported":[],"major":"Global Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"81915ea6-7139-4dba-a6aa-1ca05c70cd8c\"}"},{"__ref":"DeepDives:{\"uuid\":\"c4d4fc56-1e9b-42cc-bd7a-3e36037aa5e3\"}"},{"__ref":"DeepDives:{\"uuid\":\"ade59f6e-6da8-4985-b08f-ec7e5f600470\"}"},{"__ref":"DeepDives:{\"uuid\":\"a23d0bc7-cba9-47b8-9bf2-8691e79318e2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2055dc77-3816-4eb1-b173-eca1ca19f998/-/preview/-/format/jpg/","https://ucarecdn.com/060048c4-44f8-4628-bfe3-ad7f4130b8a5/-/preview/-/format/jpg/","https://ucarecdn.com/e17318ec-7ae9-4fbf-8fc3-1f923388242a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1e71feaf-a10b-4210-b4f3-23965eb8392b\"}"},{"__ref":"Education:{\"uuid\":\"21e82473-a407-40f0-b975-c79b29bb2f66\"}"}],"hiredAt":"2023-08-18T18:28:52.797Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Writing","Spanish","Reading","College Essay Writing","Creative Writing","Music","K-6 Storybook","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:9a848240-b5ca-43e0-b6e7-caf04ebb399b"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jaidyn-hurst-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b54d5b0b-5c4e-44ce-8ceb-19e2eb80ef83\"}"}}},"_sentryTraceData":"f54b38df81e746f29864d4e9996d993f-86f5f13e0252e6b8-0","_sentryBaggage":"sentry-environment=vercel-
