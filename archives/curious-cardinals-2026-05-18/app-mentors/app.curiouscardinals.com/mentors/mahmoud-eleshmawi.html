"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Business","degree":null},"MentorPublicProfile:{\"uuid\":\"26960439-1ef0-4541-bdab-f741a7271981\"}":{"__typename":"MentorPublicProfile","uuid":"26960439-1ef0-4541-bdab-f741a7271981","displayName":"Mahmoud E.","slug":"mahmoud-eleshmawi","biography":"\u003cp\u003eHi, my name is Mahmoud El-Eshmawi! I’m a student at Northwestern University studying Learning and Organizational Change with minors in Business Institutions and Data Science. I was born in Alexandria, Egypt, and now call New York City home. Two of my biggest passions outside the classroom are soccer and fashion. I’m an avid Liverpool FC fan and love exploring how fashion intersects with identity and culture.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I’m deeply interested in understanding how organizations function and how data can be used to drive smart, equitable decisions. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I’m constantly seeking ways to grow and give back. As a consulting analyst with the Institute for Student Business Education, I’ve led research and strategy projects for companies ranging from professional soccer clubs to startup organizations. I’ll also be joining Boston Consulting Group as a Growing Future Leaders Analyst, where I look forward to continuing to blend business strategy with social impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’ve found purpose in community leadership. I currently serve as the VP of Events for the Middle Eastern and North African (MENA) Student Association and Internal chair for the Minority Business Association at Northwestern. In these roles, I’ve helped build inclusive, welcoming spaces and led event planning for campus-wide initiatives, including our annual MENA Formal.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether it’s tutoring, mentoring, or collaborating on a project, I care deeply about creating spaces where young people feel supported, understood, and empowered to explore big ideas. I’ve been fortunate to learn from mentors who pushed me to think critically and lead with empathy, and I hope to be that kind of mentor for others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re a student looking to explore the intersections of business, social change, culture, or data, or if you just want someone in your corner who knows what it’s like to juggle big goals and personal passions, I’d be excited to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"MqKFLB00qIbk02ySZy8uHHrwxX8us7nrPUVtGvpjv9t54","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am really proud of founding Northwestern's Muslim Business Student Association!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"77f20544-f014-4301-939a-1f8a1928a8b0\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5a823d00-dd45-4f0d-8a91-3bc937463de3\"}"}],"major":"Business","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4acd10b6-ad17-4395-8ab6-e1487c785d7a\"}"},{"__ref":"DeepDives:{\"uuid\":\"48c54e85-4a4a-4b6b-a4af-0cc1a0e7af51\"}"},{"__ref":"DeepDives:{\"uuid\":\"2843d805-416b-4063-84df-61a09b8b14b0\"}"},{"__ref":"DeepDives:{\"uuid\":\"3a40e4eb-3f00-4486-ab83-b99c24db2ca5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/278ef25f-58df-4fca-be91-b20291ca90b4/-/preview/-/format/jpg/","https://ucarecdn.com/8a21a5fd-c0ce-4f4a-8dda-213dd7850af5/-/preview/-/format/jpg/","https://ucarecdn.com/e96bd224-1c92-460c-b0f0-daf486e09ecd/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"24a8bad4-446d-4d58-89c0-ba086bb5c4ea\"}"},{"__ref":"Education:{\"uuid\":\"1204204a-7b45-46fb-adc2-6ec6315e6058\"}"}],"hiredAt":"2025-04-10T05:23:01.117Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Statistics","6-8 Grade Science","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics"],"communityBadges":["htt
