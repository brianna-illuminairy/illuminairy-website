99088b70e4\"}":{"__typename":"DeepDives","uuid":"afe15dc4-b822-4823-beb3-e799088b70e4","content":null,"videoPlaybackId":"LhTmItto00LhvE02hbQpp00doEPDdd02PnUF00p013G01xLQLY","question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"5312705c-1219-43c8-a5e6-2971fd9bdb2a\"}":{"__typename":"School","uuid":"5312705c-1219-43c8-a5e6-2971fd9bdb2a","name":"Dawson School","city":"Lafayette","type":"HIGH","state":"Colorado","country":"United States","zip":"80026"},"Education:{\"uuid\":\"93e7e4af-5444-47c3-8237-12029df5c322\"}":{"__typename":"Education","uuid":"93e7e4af-5444-47c3-8237-12029df5c322","school":{"__ref":"School:{\"uuid\":\"5312705c-1219-43c8-a5e6-2971fd9bdb2a\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"05291774-98b4-4bf1-a664-33b33d4ddd13\"}":{"__typename":"Education","uuid":"05291774-98b4-4bf1-a664-33b33d4ddd13","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":null},"Testimonial:1f06c1d2-12df-44ba-a878-4562a3ea6a25":{"__typename":"Testimonial","id":"1f06c1d2-12df-44ba-a878-4562a3ea6a25","text":"Coby was an incredible mentor to our son who always looked forward to their meetings. He helped improve our son's writing, taught him to apply statistics and use critical analysis in his articles. Most importantly, Coby took the time to really get to know our son and help strengthen his confidence. We had the pleasure of meeting him in person when we were visiting Northwestern. Coby carved time out of his busy schedule to show our child around and have lunch with us. I highly recommend Coby as a mentor.","date":"2025-06-08 01:44:14.953+00","rating":5,"endorser":{"__typename":"Endorser","name":"David","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"c1a5a268-6e4d-493f-b213-0b57ca66d10a\"}":{"__typename":"MentorPublicProfile","uuid":"c1a5a268-6e4d-493f-b213-0b57ca66d10a","displayName":"Coby G.","slug":"coby-grantkrenz","biography":"\u003cp\u003eHey there! My name is Coby Grant-Krenz, nice to meet you! I’m currently a student at Northwestern University, but I was raised in Boulder, Colorado.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up constantly being outside, and have a deep passion for skiing in particular. I excelled as a varsity athlete in high school, playing basketball and tennis. Even now I still incorporate basketball into my college schedule being a player on both the Men's Club Basketball Team and the Women’s Varsity practice squad. In school,\u0026nbsp;I have excelled at and enjoyed math in particular, but love learning in general and have had a strong creative drive for all of my life. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMusic is another passion of mine, as you can see from the photo above! I play the guitar, piano, and bass, and also have extensive knowledge and passion for producing, composing, and audio engineering. I have had the privilege of interning at two music studios and have plans to intern at two more this upcoming summer. Additionally, my produced songs have over 100,000 streams on Spotify. If your student is interested in anything music, I’d be thrilled to help them develop that passion!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Northwestern, my academic pursuits span Economics, Music Technology/Composition, and Cognitive Science. While this may seem like a diverse array of academic interests, there’s a method to my madness!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI truly believe in the importance of balance in life – a concept I see reflected everywhere in life, from how we manage our time to the very laws of nature. Throughout my time at university, I’ve strived to strike a balance between my academic pursuits and my skills, interests, and passions. This has materialized itself in my focus on applied mathematics within Economics, neuroscience and cultural-psychology within Cognitive Science, and music production and composition within the Music Technology program.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy emphasis on balance enables me to mentor students on a level deeper than solely focusing on the academic subject or passion project at hand. As a mentor, my goal is to instill confidence in my students, empowering them to excel not just academically but in all aspects of life. After all, life is an ongoing journey of learning that extends far beyond the confines of the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"7AGxCjLH8ysvESNUxbi1xuvAnPpAvDTD8sl8yErCC8U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a4e31dc0-abbe-448b-8bae-dfcb802238c0\"}"},{"__ref":"DeepDives:{\"uuid\":\"be2e4291-0b47-409e-a35f-9ecc201d1bbd\"}"},{"__ref":"DeepDives:{\"uuid\":\"c0f157ff-297b-4a3a-8b40-20a9bfbc8a50\"}"},{"__ref":"DeepDives:{\"uuid\":\"afe15dc4-b822-4823-beb3-e799088b70e4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/eec478c2-fa67-433b-b644-1f4fbe890d60/-/preview/-/format/jpg/","https://ucarecdn.com/2872a6fc-ed23-4cf1-b30c-09cd8f0fd58b/-/preview/-/format/jpg/","https://ucarecdn.com/0ef9d3f4-e3ba-4955-b1e0-fefe1348aed9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"93e7e4af-5444-47c3-8237-12029df5c322\"}"},{"__ref":"Education:{\"uuid\":\"05291774-98b4-4bf1-a664-33b33d4ddd13\"}"}],"hiredAt":"2024-03-14T04:18:46.093Z","topics":["Cr
