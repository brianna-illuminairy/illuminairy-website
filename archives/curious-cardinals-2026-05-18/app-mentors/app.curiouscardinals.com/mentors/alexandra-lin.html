xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"01c95f92-a097-4d12-a1b8-f9f902fd99fd\"}":{"__typename":"Favorites","uuid":"01c95f92-a097-4d12-a1b8-f9f902fd99fd","photoUrl":"https://ucarecdn.com/e947fcaf-b1e2-4e0f-ae15-b9201626bb13/","title":"BTS","type":"ARTIST"},"Favorites:{\"uuid\":\"9620491e-cacc-4b8a-bd79-3ee31dfab3c8\"}":{"__typename":"Favorites","uuid":"9620491e-cacc-4b8a-bd79-3ee31dfab3c8","photoUrl":"https://ucarecdn.com/011a744c-3d75-42fb-a6d9-a85215a6ef1c/","title":"Everything Everywhere All at Once","type":"MOVIE"},"Favorites:{\"uuid\":\"173cde68-3ad7-4e88-8ee0-73bf88a03a1a\"}":{"__typename":"Favorites","uuid":"173cde68-3ad7-4e88-8ee0-73bf88a03a1a","photoUrl":"https://ucarecdn.com/271217fe-1b3d-45d2-bf8d-58dc3a1121cb/","title":"F1","type":"SPORT"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"adf0563c-3ff2-4d4e-9015-e87b933966ed\"}":{"__typename":"DeepDives","uuid":"adf0563c-3ff2-4d4e-9015-e87b933966ed","content":"\u003cp\u003eI would tell my high school self to trust herself. I wish I wasn't so stressed and had more confidence in myself to overcome the difficult challenges I faced. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"29bf12f7-70ad-4b20-a38e-8b904ee1321c\"}":{"__typename":"DeepDives","uuid":"29bf12f7-70ad-4b20-a38e-8b904ee1321c","content":"\u003cp\u003eI chose physics because I've always been interested in how the world works. What makes planes fly? What is inside black holes? How does dark matter work? I want to learn about these questions and work toward answering them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"29a492a7-184d-49b5-b95f-6ece5c290214\"}":{"__typename":"DeepDives","uuid":"29a492a7-184d-49b5-b95f-6ece5c290214","content":"\u003cp\u003eI want to travel the world. I want to go to as many places as I can and see the beautiful things this world has to offer!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"64b95a66-1671-43cd-aaaa-e7de6c108dd1\"}":{"__typename":"DeepDives","uuid":"64b95a66-1671-43cd-aaaa-e7de6c108dd1","content":"\u003cp\u003eBeing the best version of myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"5b47ac55-7077-4144-9c52-a2655f8aaf26\"}":{"__typename":"School","uuid":"5b47ac55-7077-4144-9c52-a2655f8aaf26","name":"The Bush School","city":"Seattle","type":"HIGH","state":"Washington","country":"United States","zip":"98112"},"Education:{\"uuid\":\"d116f582-6ce0-46c8-bb87-b59b0414d2f6\"}":{"__typename":"Education","uuid":"d116f582-6ce0-46c8-bb87-b59b0414d2f6","school":{"__ref":"School:{\"uuid\":\"5b47ac55-7077-4144-9c52-a2655f8aaf26\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"5f6f3f44-7323-4bbc-b0cc-5bc48418103e\"}":{"__typename":"Education","uuid":"5f6f3f44-7323-4bbc-b0cc-5bc48418103e","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"f574978d-e266-4321-9bb5-91770d156d6c\"}":{"__typename":"MentorPublicProfile","uuid":"f574978d-e266-4321-9bb5-91770d156d6c","displayName":"Alexandra L.","slug":"alexandra-lin","biography":"\u003cp\u003eHi! My name is Alexandra and I’m from Seattle. I currently attend Cornell University and intend to major in physics. I’ve always been interested in science and math. Growing up, I loved going to the Seattle Science Center and watching Bill Nye the Science Guy in my free time.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn middle school, I started learning ahead in math. My dad supported my interests and taught me all the way up to Calculus 2, and I subsequently took Multivariable Calculus freshman year of high school. So, I know the importance of a good teacher. Having a teacher who cares about and knows you can make a world of difference. I am currently retaking these classes in college to fulfill requirements/prerequisites and fully solidify my understanding.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love helping people learn things as well. In high school I was a part of my school’s STEM Center and I was able to help students who dropped in during our lunch study periods. I also helped my friends proofread essays and college essays later on in high school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBesides STEM, I also really care about social justice and mental health. I have personally struggled with mental health, especially while facing the pressure of academics and the college application process; I hope to support students during this time as well. Additionally, starting in sophomore year of high school I led my school’s Amnesty International club. Through that, I organized letter writing campaigns and gave whole-school presentations with the members of the club.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time I like to watch TV shows/movies, write stories, and hangout with friends (I’m a big foodie so we usually go out and try new foods and drinks). My favorite movie right now is Project Hail Mary and my current favorite show is Modern Family. I also love traveling. I lived in Hong Kong for two years in elementary school and I often go back to China to visit family. Every year, I try to go to one new place!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m really excited to start working for Curious Cardinals. Even though I haven’t had a formal teaching job, I’ve helped people through difficult concepts before and I have also struggled in classes so I know what it feels like. I’m looking forward to guiding students in math and college essay writing!\u003c/p\u003e","teachingVideoPlaybackId":"OJnvkmnp6QM01sAQsKMP02DlxhA3n7Vu48qX9V4zYVGfE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"01c95f92-a097-4d12-a1b8-f9f902fd99fd\"}"},{"__ref":"Favorites:{\"uuid\":\"9620491e-cacc-4b8a-bd79-3ee31dfab3c8\"}"},{"__ref":"Favorites:{\"uuid\":\"173cde68-3ad7-4e88-8ee0-73bf88a03a1a\"}"}],"causesSupported":[],"major":"Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"adf0563c-3ff2-4d4e-9015-e87b933966ed\"}"},{"__ref":"DeepDives:{\"uuid\":\"29bf12f7-70ad-4b20-a38e-8b904ee1321c\"}"},{"__ref":"DeepDives:{\"uuid
