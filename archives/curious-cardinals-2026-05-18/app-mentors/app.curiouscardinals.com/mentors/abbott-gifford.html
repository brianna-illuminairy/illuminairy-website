xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"580194c5-b462-4cfa-bab0-2a494d1f46b0\"}":{"__typename":"DeepDives","uuid":"580194c5-b462-4cfa-bab0-2a494d1f46b0","content":"\u003cp\u003eDuring a high school physics class, my friend and I worked on a project to build our own rocket motors. We ended up turning it into our own passion project and going way beyond what was required. We mixed our own propellant, molded exhaust cones, and constructed a complex spring-based apparatus to calculate the power output. Years later, I hardly remember how well the motors performed or the grade we got on the assignment. What I do remember, though, is how much we learned about physics and rockets by doing all ourselves, and how much fun we along the way!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"14c89195-1056-41a4-830b-62ca1c3c5a28\"}":{"__typename":"DeepDives","uuid":"14c89195-1056-41a4-830b-62ca1c3c5a28","content":"\u003cp\u003eI have been lucky enough to have many fantastic mentors in my life who have helped me achieve academic success and navigate challenging decisions. Having a strong support system is crucial, and I'm excited to work with students to build that support system, helping them navigate their current academic interests and prepare for whatever comes next. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f4ec3d7f-372d-4064-bbf0-8581a8962c14\"}":{"__typename":"DeepDives","uuid":"f4ec3d7f-372d-4064-bbf0-8581a8962c14","content":"\u003cp\u003eI chose to study Neuroscience as an undergraduate because the brain is such a mystery. Even after years of study, I am amazed by how much we still have to learn, and I love digging into questions that don't have concrete answers. This perspective is central to my approach as a mentor. I enjoy helping students navigate complex concepts by fostering the same curiosity and persistence that drew me to the field in the first place.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"f878a45b-0ef2-489e-9283-97c65953b086\"}":{"__typename":"DeepDives","uuid":"f878a45b-0ef2-489e-9283-97c65953b086","content":"\u003cp\u003eIn middle and high school, I wasn't a student for whom everything came easily. I actually struggled quite a bit with subjects like math and had to put in a lot of extra hours just to keep up. However, that challenge taught me how to study effectively, and over time, those difficult subjects became my strongest and most favorite areas of study. This experience is why I love mentoring; I know exactly what it feels like to struggle with a concept, and I enjoy helping students find that \"lightbulb moment\" where a tough subject finally clicks.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a\"}":{"__typename":"School","uuid":"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a","name":"Cambridge Rindge \u0026 Latin School","city":"Cambridge","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"c1c9e392-50b1-4a3c-9a53-33ba79c9866a\"}":{"__typename":"Education","uuid":"c1c9e392-50b1-4a3c-9a53-33ba79c9866a","school":{"__ref":"School:{\"uuid\":\"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9c355a46-d17f-47de-ab06-5e81b8a5d3fd\"}":{"__typename":"School","uuid":"9c355a46-d17f-47de-ab06-5e81b8a5d3fd","name":"Colorado College","city":"Colorado Springs","type":"COLLEGE","state":"Colorado","country":"United States","zip":"80903"},"Education:{\"uuid\":\"6824f226-a8fc-4e64-80e9-4c32ea3ac9b7\"}":{"__typename":"Education","uuid":"6824f226-a8fc-4e64-80e9-4c32ea3ac9b7","school":{"__ref":"School:{\"uuid\":\"9c355a46-d17f-47de-ab06-5e81b8a5d3fd\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":"2022","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"9f2807d4-110e-4798-a453-ccb55b181cc3\"}":{"__typename":"MentorPublicProfile","uuid":"9f2807d4-110e-4798-a453-ccb55b181cc3","displayName":"Abbott G.","slug":"abbott-gifford","biography":"\u003cp\u003eI am a third-year medical student at the University of California, San Francisco, with a passion for bridging the gap between clinical care and community health. Originally from Boston, I completed my undergraduate degree at Colorado College, where I graduated \u003cem\u003ecum laude\u003c/em\u003e in Neuroscience and was inducted into Phi Beta Kappa. During my time in Colorado Springs, I discovered a passion for education and mentorship, serving as a teaching assistant for neuroanatomy and biochemistry. I also led \"North Boys,\" a mentorship group that provided guidance and support to elementary and middle school boys in underserved local communities. Last, but definitely not least, I had the unique experience of serving as the school mascot, RoCCy!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore starting medical school, I worked on the front lines of the opioid crisis as a Harm Reduction Technician for the Boston Healthcare for the Homeless Program. Providing emergency care and overdose reversal in low-threshold shelters was both challenging and incredibly rewarding, as I served as the sole medical provider in several of these environments. This experience helped me discover a passion for community based healthcare and working with unhoused patients. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a researcher, my work focuses on health disparities, including examining surgical outcomes for patients experiencing housing insecurity and describing the challenges of compiling global research across diverse cultures. My current research entails using large language models to identify and provide resources to unhoused patients admitted to the hospital. I have been lucky enough to author and contribute to numerous peer-reviewed publications and present at national conferences. At UCSF, I coordinate student-led electives in Harm Reduction, Addiction Medicine, and Sports Medicine. I also lead community initiatives, such as Bright Bodies and Healthy Saturdays, where I direct medical students in providing nutrition and physical education to children facing food insecurity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not in the hospital or conducting research, you can find me surfing, biking around San Francisco, or down at SFO doing some plane spotting. I’m a big fan of creative games like Minecraft and am always on the hunt for a new Lego set. I’m excited to work with students of all ages, whether they are seeking to investigate a new research question or simply need support with their ongoing schoolwork.\u003c/p\u003e","teachingVideoPlaybackId":"MOWiINR45xZ2zCCpigz00BZr5zdU2gJs500g5v8HHWh2E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"580194c5-b462-4cfa-bab0-2a494d1f46b0\"}"},{"__ref":"DeepDives:{\"uuid\":\"14c89195-1056-41a4-830b-62ca1c3c5a28\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4ec3d7f-372d-4064-bbf0-8581a8962c14\"}"},{"__ref":"DeepDives:{\"uuid\":\"f878a45b-0ef2-489e-9283-97c65953b086\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9ccd2076-0250-4d0c-b971-9272b73e1d20/-/preview/-/format/jpg/","https://ucarecdn.com/86931c4f-2c1a-421f-a85f-c7a08a20b1f1/-/preview/-/format/jpg/","https://ucarecdn.com/cb8065b6-4034-4064-bdd7-03caefbc4007/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c1c9e392-50b1-4a3c-9a53-33ba79c9866a\"}"},{"__ref":"Education:{\"uuid\":\"6824f226-a8fc-4e64-80e9-4c32ea3ac9b7\"}"}],"hiredAt":"2025-12-21T19:50:53.362Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"abbott-gifford\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9f2807d4-110e-4798-a453-ccb55b181cc3\"}"}}},"_sentryTraceData":"69b6122b5ab14ab88dcf18037ab3e9f6-aab7a7231fb8a68f-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=69b6122b5ab14ab88dcf18037ab3e9f6,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"abbott-gifford"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n
