1035a4-4d26-4eb6-a020-ddf47a678abd","content":null,"videoPlaybackId":"g9pJwDLRQIFWSPD702z1sLHcG00dEMp1gTfDxPXvfnYJw","question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"eb2eec0f-74d7-47fe-b6d4-54a256b66bee\"}":{"__typename":"DeepDives","uuid":"eb2eec0f-74d7-47fe-b6d4-54a256b66bee","content":null,"videoPlaybackId":"anQ3CmI01nw13qZ5avVZK9e5B8v9zP1x02JJ1rEpyCiRk","question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"63ab2d32-6ad5-484f-ae9a-9251fbc82189\"}":{"__typename":"School","uuid":"63ab2d32-6ad5-484f-ae9a-9251fbc82189","name":"Whitney M. Young Magnet High School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60607"},"Education:{\"uuid\":\"c64b4bfa-f2a4-4f80-8797-58260296dc17\"}":{"__typename":"Education","uuid":"c64b4bfa-f2a4-4f80-8797-58260296dc17","school":{"__ref":"School:{\"uuid\":\"63ab2d32-6ad5-484f-ae9a-9251fbc82189\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"27a6b60e-cfd0-41ab-9633-94e80b80a87b\"}":{"__typename":"School","uuid":"27a6b60e-cfd0-41ab-9633-94e80b80a87b","name":"University of Chicago: Hyde Park","city":"Chicago","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60637"},"Education:{\"uuid\":\"09c44358-7a1d-4b3e-b1da-9e6f105b24e2\"}":{"__typename":"Education","uuid":"09c44358-7a1d-4b3e-b1da-9e6f105b24e2","school":{"__ref":"School:{\"uuid\":\"27a6b60e-cfd0-41ab-9633-94e80b80a87b\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"820ec1e8-a48b-48ea-9463-dbb361afe8d5\"}":{"__typename":"MentorPublicProfile","uuid":"820ec1e8-a48b-48ea-9463-dbb361afe8d5","displayName":"Isabel V.","slug":"isabel-vargas","biography":"\u003cp\u003eHello! My name is Isabel, and I’m a Neuroscience major at the University of Chicago. I’m deeply people-oriented; everything I love is rooted in connection. I love spending time with friends, cooking and sharing meals, and constantly learning new things. But what makes those experiences meaningful isn’t just the activity itself; it’s the people I share them with. I believe there is something uniquely powerful in everyone, and discovering that uniqueness opens up new ways of thinking and being.\u003c/p\u003e\u003cp\u003eIn my lab, I mentor students and manage research projects focused on developing treatments for Ataxia patients so they can live more independent lives. To me, science is not just about data; it’s about empowering people to ask questions that matter and help others realize they are capable of answering them.\u003c/p\u003e\u003cp\u003eRugby has reinforced that same value in a different way. It has taught me that caring for a team means showing up physically, mentally, and emotionally. Strength isn’t just about athleticism; it’s about reliability, resilience, and commitment to your teammates.\u003c/p\u003e\u003cp\u003eI’ve been in highly competitive academic spaces where comparison can make you question whether what you bring is enough. When everything is measured, it’s easy for curiosity, creativity, and joy to feel secondary. I’ve learned that when we sideline the things we love, we also sideline parts of our potential. That’s why I care about helping others see that their interests and passions aren’t separate from their capability; they’re often the source of it.\u003c/p\u003e\u003cp\u003eI’ve also created art lessons and science experiments with students who are neurodivergent or who have intellectual and developmental disabilities, and those experiences have strengthened my commitment to inclusive mentorship. I’ve learned that when expectations are rooted in possibility rather than limitation, students often exceed what others imagined for them. Being part of that process, not by changing who they are, but by adapting to how they learn, continually inspires me to advocate for spaces where everyone’s way of thinking is seen as an asset. \u003c/p\u003e\u003cp\u003eI want to help mentees recognize their own power in their curiosity, their perspective, and their strengths. I love encouraging others to do amazing things with the skills and passions they already bring to the table, especially in the spaces where they feel most themselves.\u003c/p\u003e","teachingVideoPlaybackId":"aL02rMvdehltRMaR00OHGk02EbodZtlBABRtlMm019Bkth8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c48802a4-7dca-402b-a1ab-cf3c6d637d35\"}"},{"__ref":"Favorites:{\"uuid\":\"bb178938-0ea9-4419-995c-3d7f0535fbec\"}"}],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8bd8bc49-9ea1-4cbe-be1f-862e3dd3bbd0\"}"},{"__ref":"DeepDives:{\"uuid\":\"c189fa50-5d6d-4601-8543-a6d69c2f6550\"}"},{"__ref":"DeepDives:{\"uuid\":\"e81035a4-4d26-4eb6-a020-ddf47a678abd\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb2eec0f-74d7-47fe-b6d4-54a256b66bee\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cb732124-5660-4a54-8423-439d3519f1e4/-/preview/-/format/jpg/","https://ucarecdn.com/0191910c-d1af-42eb-9202-e346acaf252d/-/preview/-/format/jpg/","https://ucarecdn.com/f5ec6ffc-169e-468d-b94d-61a8195ffc5a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c64b4bfa-f2a4-4f80-8797-58260296dc17\"}"},{"__ref":"Education:{\"uuid\":\"09c44358-7a1d-4b3e-b1da-9e6f105b24e2\"}"}],"hiredAt":"2026-02-05T15:13:57.842Z","topics":["Creative Writing","Fashion / Cosmetics","Film / Theater","K-6 Storybook","Music","Video / Photography","Visual Arts / Graphic Design","Business / Entrepreneurship","Medicine / Health","STEM Project","Web Design"],"communityBadge
