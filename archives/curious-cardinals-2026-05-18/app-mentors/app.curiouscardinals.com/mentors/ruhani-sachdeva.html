003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"7271ebe1-2231-49da-9b6f-a737fbb96116\"}":{"__typename":"School","uuid":"7271ebe1-2231-49da-9b6f-a737fbb96116","name":"Caddo Parish Magnet High School","city":"Shreveport","type":"HIGH","state":"Louisiana","country":"United States","zip":"71101"},"Education:{\"uuid\":\"3ac91850-e69c-43fd-8235-c2b468c2efdb\"}":{"__typename":"Education","uuid":"3ac91850-e69c-43fd-8235-c2b468c2efdb","school":{"__ref":"School:{\"uuid\":\"7271ebe1-2231-49da-9b6f-a737fbb96116\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"2b18d7eb-16b5-454e-a957-6e672973bdc9\"}":{"__typename":"Education","uuid":"2b18d7eb-16b5-454e-a957-6e672973bdc9","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"e25114d2-d1ea-4e65-9e86-9e50cbeaa4f4\"}":{"__typename":"MentorPublicProfile","uuid":"e25114d2-d1ea-4e65-9e86-9e50cbeaa4f4","displayName":"Ruhani S.","slug":"ruhani-sachdeva","biography":"\u003cp\u003eHi! I’m Ruhani, a Biomedical Engineering student at Northwestern University (Class of 2026) planning to pursue an MD–PhD. I’m really interested in the intersection of medicine, engineering, and innovation, especially medical devices and wearable technologies. I’m fascinated by how thoughtfully designed tools can completely change the way we diagnose, monitor, and treat patients, and I love thinking about how engineering solutions can make healthcare more accessible, proactive, and personalized.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA big part of what excites me is the startup space. I’m drawn to the energy of turning ideas into real products, from identifying a problem to building and refining a solution that can genuinely impact people’s lives. I enjoy environments where creativity, technical problem-solving, and real-world impact all come together, and I’m especially interested in how research can move from early ideas into practical technologies that people actually use.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eRecently, I’ve been involved in several projects that reflect these interests. I’ve worked on a machine learning project in collaboration with Lurie Children’s Hospital, where we explored how accelerometry data could be used to predict CO₂ output for patients with congenital central hypoventilation syndrome. I’ve also been involved with the Querrey Simpson Institute for Bioelectronics, where I've gained a lot of hands on experience with wearable and implantable electronics. In addition, I’ve had exposure to the startup world through work with Arma Biosciences, which has further strengthened my interest in translational research and early-stage biotech innovation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentoring is deeply important to me because I had a mentor growing up who exposed me to opportunities in science and engineering that I would not have discovered on my own. That guidance completely shaped the direction of my interests and goals. Because of that experience, I care a lot about helping students feel supported, challenged, and confident as they explore their own interests and strengths.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I love playing tennis, hiking, and trying new restaurants around Chicago. I’ve also always loved art, especially drawing and painting, and I enjoy using creative outlets as a way to relax and think differently about problems. I’m always excited to learn something new, and I bring that same curiosity and energy into every mentoring session. I’m excited to work with students and help them build both skills and confidence as they pursue what excites them.\u003c/p\u003e","teachingVideoPlaybackId":"Onr01BuHvLhvoh1XCFQu5MDYhf2r016CynfO01SxIXTFwU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7a8e08ae-d5da-4708-a4f9-532227e38097\"}"},{"__ref":"Favorites:{\"uuid\":\"a2951e63-c84b-46d5-bc2b-a1c8fa4747d1\"}"},{"__ref":"Favorites:{\"uuid\":\"55fbf763-33fb-4a9e-a4da-e15d06deff4e\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fc058d84-ca6a-4440-bb35-87faef901383\"}"},{"__ref":"DeepDives:{\"uuid\":\"8561bb82-397d-49bc-9e52-16619b9225f2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dd69ae43-0f80-422c-b7b8-ebc5ecebf0fa/-/preview/-/format/jpg/","https://ucarecdn.com/e65d0f54-3714-468e-825a-c85b84212736/-/preview/-/format/jpg/","https://ucarecdn.com/7def418f-91a4-4309-b10b-a2cc50a7ecaa/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3ac91850-e69c-43fd-8235-c2b468c2efdb\"}"},{"__ref":"Education:{\"uuid\":\"2b18d7eb-16b5-454e-a957-6e672973bdc9\"}"}],"hiredAt":"2026-02-02T18:49:34.766Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","College Essay Writing","Computer Science","Academic Coaching","Visual Arts / Graphic Design","Business / Entrepreneurship","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ruhani-sachdeva\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e25114d2-d1ea-4e65-9e86-9e50cbeaa4f4\"}"}}},"_sentryTraceData":"fea373846b314918be9d10db15564f44-984fb2d525020777-0","_sentr
