xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"23f260dc-a67c-402f-8664-48a4cc68bdf0\"}":{"__typename":"DeepDives","uuid":"23f260dc-a67c-402f-8664-48a4cc68bdf0","content":"\u003cp\u003eFail more. I was so afraid of failing in high school that it stopped me from trying new things and challenging myself to the fullest. I now know that failure is a crucial part of learning and that progress cannot be made without it. I look at failure as an opportunity to learn from my mistakes and eventually succeed because of them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e51d3d28-e52c-41b2-9bd8-15121eedf3ba\"}":{"__typename":"DeepDives","uuid":"e51d3d28-e52c-41b2-9bd8-15121eedf3ba","content":"\u003cp\u003eThats easy. I want to be a trackside Formula 1 engineer working for McLaren. I love Formula 1 as it is the pinnacle of automotive engineering and I love all things cars. Formula 1 is a place that lets engineers experiment and push the absolute limits of automotive technology and manufacturing to provide on-track results every single year. I want to be part of a team that is working at the bleeding edge and willing to try any crazy ideas a good engineer can come up with. I also wouldn't mind being able to see every major city across the globe.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c84fd81e-4825-48b6-9e23-2096737a0985\"}":{"__typename":"DeepDives","uuid":"c84fd81e-4825-48b6-9e23-2096737a0985","content":"\u003cp\u003eI have been working on restoring and beefing up a 2003 Toyota MR2 Spyder. When I first got the car a couple of years back it was beat from spending years gathering dust in an auction lot. The first major milestones were to clean up the interior and exterior and then replace all the fluids in the car. After that the car started right up, much to my surprise, however it was far from perfect. I later moved on to tackle the transmission problems it was experiencing which required me completely removing and opening up the transmission to replace the 1st and 2nd gears since they were absolutely torn to shreds. More recently I have replaced the brake pads and installed some caliper covers to give it the sports car look I want. My next steps are to paint the rims and body and eventually turbo charge the engine to give it the boost it needs.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0fb3fb73-eb42-44a4-9e94-4d554d8a0c96\"}":{"__typename":"DeepDives","uuid":"0fb3fb73-eb42-44a4-9e94-4d554d8a0c96","content":"\u003cp\u003eOutside of my many home projects and school you can find me drumming, surfing, skating, and spending time with my friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"dece36d2-b8d2-40ca-8d19-6ab89eabc524\"}":{"__typename":"School","uuid":"dece36d2-b8d2-40ca-8d19-6ab89eabc524","name":"Great Oak High School","city":"Temecula","type":"HIGH","state":"California","country":"United States","zip":"92592"},"Education:{\"uuid\":\"cf5b398b-6248-4190-b247-8bc60fce185c\"}":{"__typename":"Education","uuid":"cf5b398b-6248-4190-b247-8bc60fce185c","school":{"__ref":"School:{\"uuid\":\"dece36d2-b8d2-40ca-8d19-6ab89eabc524\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"61ce191f-ce4e-4e26-82e9-0a31a46fb12b\"}":{"__typename":"Education","uuid":"61ce191f-ce4e-4e26-82e9-0a31a46fb12b","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"a8f58ddb-2907-473d-ba4b-24a4cde7c6a2\"}":{"__typename":"MentorPublicProfile","uuid":"a8f58ddb-2907-473d-ba4b-24a4cde7c6a2","displayName":"Dylan S.","slug":"dylan-sevenikar","biography":"\u003cp\u003eMy name is Dylan Sevenikar, and I’m a recent graduate of Yale University, where I majored in Mechanical Engineering. I’m originally from Temecula, California (a place not exactly known for its engineering pedigree), but it’s where my passion for mechanical systems began. Growing up without a car of my own, I spent much of my free time under the hood of my mom’s aging 2003 Toyota Camry. With no money to spare and countless miles logged, the Camry constantly needed repairs. One day, I found the car manual, discovered a blown fuse, replaced it, and restored a light that hadn’t worked in years. That small victory sparked something bigger: a deep interest in understanding how machines work and how I could make them better. It was the first step on the path to my dream of becoming a Formula 1 engineer.\u003c/p\u003e\u003cp\u003eAt Yale, I built on that foundation through coursework, research, and mentorship. I worked in the Yale Faboratory on a bio-inspired Robotic Amphibious Turtle, where I helped prototype cutting-edge designs rooted in nature. I also joined the Yale Undergraduate Aerospace Association, contributing to the CubeSat team’s efforts in satellite design. For my senior design project, I helped create a nanoscale tribometer for ASML, using CAD and precision manufacturing to build a device capable of measuring wear at the sub-micron level. As a Teaching Assistant in both Engineering Dynamics and Materials Science Lab, I enjoyed guiding other students through tough technical concepts and watching them grow in confidence.\u003c/p\u003e\u003cp\u003eTeaching quickly became one of the most rewarding parts of my college experience. I found joy not only in explaining challenging course material but also in encouraging students to pursue their own hands-on projects outside the classroom. I strongly believe that the best learning happens through trying, failing, and iterating. Whether it was helping a classmate debug a mechanism late at night in the lab or mentoring someone on their first CAD model, I loved fostering the kind of curiosity and resilience that real-world engineering demands. I’m passionate about creating learning environments where students feel safe to explore, make mistakes, and grow. I plan to carry that mindset with me into every mentee I work with.\u003c/p\u003e\u003cp\u003eOutside of the classroom, I took on the role of head audio and visual aide for Jonathan Edwards College. I supported events and student groups across the college, managing everything from microphones to full production setups. It was hands-on, high-pressure work that taught me the value of preparation, clear communication, and calm problem-solving.\u003c/p\u003e\u003cp\u003eAfter graduation, I’ll be pursuing a Master’s in Motorsport Engineering at Oxford Brookes University. Its proximity to the heart of Formula 1 in the UK is no accident—I want to be as close as possible to the teams driving innovation at the cutting edge. My ultimate goal is to become a trackside Formula 1 engineer, helping build the fastest, safest, and most advanced cars on the planet.\u003c/p\u003e","teachingVideoPlaybackId":"sJxxfyxJ6r1vH02RqX5GcUPKzk5027lf6009K8VX9uNOuM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"23f260dc-a67c-402f-8664-48a4cc68bdf0\"}"},{"__ref":"DeepDives:{\"uuid\":\"e51d3d28-e52c-41b2-9bd8-15121eedf3ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"c84fd81e-4825-48b6-9e23-2096737a0985\"}"},{"__ref":"DeepDives:{\"uuid\":\"0fb3fb73-eb42-44a4-9e94-4d554d8a0c96\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a226f72f-8b58-449b-8c90-0d9d579e034e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cf5b398b-6248-4190-b247-8bc60fce185c\"}"},{"__ref":"Education:{\"uuid\":\"61ce191f-ce4e-4e26-82e9-0a31a46fb12b\"}"}],"hiredAt":"2025-06-11T02:33:10.826Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Academic Coaching","Executive Function","College Essay Writing","Robotics / Electronics / CAD","Web Design","STEM Project","Aviation / Aerospace","Public Speaking"],"communityBadges":["https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"dylan-sevenikar\"}})":{"__ref":"MentorPublicProfile:{
