xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"764b329f-94b4-444d-b2ae-9d3b4eb4705b\"}":{"__typename":"DeepDives","uuid":"764b329f-94b4-444d-b2ae-9d3b4eb4705b","content":"\u003cp\u003eAs a first-generation Latina and the daughter of two Mexican immigrants, my heritage deeply shapes my teaching style. I understand firsthand how intimidating it can be to navigate academic spaces where you don’t always see yourself represented, and that awareness drives me to create an inclusive, affirming environment for all students. I prioritize patience, empathy, and encouragement, especially with students who may lack confidence or come from underrepresented backgrounds, because I know how transformative a supportive mentor can be. My bilingual background also helps me communicate concepts in more accessible ways when needed, and my cultural perspective helps me approach challenges with creativity and resilience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"abe30b52-70c2-40e2-b828-d470d5be377f\"}":{"__typename":"DeepDives","uuid":"abe30b52-70c2-40e2-b828-d470d5be377f","content":"\u003cp\u003eAs a high school student, I was incredibly involved, I loved immersing myself in my community in every way I could. I served as ASB President, led a club for women in engineering, and competed on the Varsity Track and Field team. Academically, I challenged myself with a full load of AP classes, and on weekends, I volunteered in Tijuana, Mexico, helping address the humanitarian crisis at the border. Whether it was leading, learning, or giving back, I was always eager to take initiative and make a meaningful impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"369d73d7-1e0e-4498-8473-1274ee75bc72\"}":{"__typename":"DeepDives","uuid":"369d73d7-1e0e-4498-8473-1274ee75bc72","content":"\u003cp\u003eI would tell my middle or high school self to take advantage of every opportunity and to get comfortable with ambiguity. At that age, it’s hard to know what your passions or career path will be—and that’s okay. The best thing you can do is explore as much as possible, even if something doesn’t seem like it will lead to your “calling.” For example, I took an engineering class in high school even though I wasn’t sure what engineering really was and didn’t think I’d pursue it. I ended up loving the class not because it led me to a career in engineering, but because it introduced me to new perspectives and people. One friend I met there actually told me about Northwestern, which is how I discovered and ultimately applied to the school. That experience taught me that not every opportunity needs to have a clear payoff, sometimes the best outcomes are the ones you never saw coming.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3d73ac91-5eca-486e-aee6-63a5e15aca81\"}":{"__typename":"DeepDives","uuid":"3d73ac91-5eca-486e-aee6-63a5e15aca81","content":"\u003cp\u003eI spent my summers in high school interning at a criminal law firm because, for a long time, I thought I wanted to be a lawyer. While I’ve since realized that law school isn’t the path I want to take, the experience taught me a lot about the legal system and how to think critically. I also started a small tutoring business focused on helping immigrant children, mostly teaching them English to help them adjust and succeed in their classrooms. That experience was incredibly fulfilling and sparked my love for mentorship and creating opportunities for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"1ac58520-7bea-4ea8-9d1c-a05afd5bad7c\"}":{"__typename":"School","uuid":"1ac58520-7bea-4ea8-9d1c-a05afd5bad7c","name":"Academy of Our Lady of Peace","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92116"},"Education:{\"uuid\":\"1abfd612-a25c-4f4a-828d-1a7267d5f432\"}":{"__typename":"Education","uuid":"1abfd612-a25c-4f4a-828d-1a7267d5f432","school":{"__ref":"School:{\"uuid\":\"1ac58520-7bea-4ea8-9d1c-a05afd5bad7c\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"76c0f0e8-28b6-4deb-b1f5-70b20b15196e\"}":{"__typename":"Education","uuid":"76c0f0e8-28b6-4deb-b1f5-70b20b15196e","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics \u0026 Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"d243b355-afd4-4154-85fa-38bef1a15766\"}":{"__typename":"MentorPublicProfile","uuid":"d243b355-afd4-4154-85fa-38bef1a15766","displayName":"Alexa C.","slug":"alexa-clemesha","biography":"\u003cp\u003eHi! My name is Alexa, and I’m a sophomore at Northwestern University studying Economics and Political Science with a minor in Business Institutions. As a first-generation college student and the daughter of Mexican immigrants, education has always meant a lot to me. I chose this combination of majors because I love how it lets me engage both my quantitative and qualitative sides. Economics sharpens my analytical thinking, political science challenges me to understand people and institutions, and my business minor ties it all together by connecting theory to real-world applications. I genuinely enjoy doing a little bit of everything, which is why this interdisciplinary path suits me so well.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I’ve explored everything from criminal law to marketing consulting, and this summer, I’ll be working in investment banking. Through all these experiences, I’ve found myself drawn to strategy consulting, where I hope to build a long-term career helping organizations solve complex problems in creative ways.\u003c/p\u003e\u003cp\u003eAs a mentor, I aim to be supportive, encouraging, and genuinely invested in my students’ growth. Whether I was staying up late to run review sessions for classmates in high school or tutoring immigrant children in English, I’ve always found deep fulfillment in helping others learn. I’m excited to get to know my students and what drives them and how I can help them succeed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I feel confident mentoring a wide range of subjects. Math was always my strongest subject in high school, and I also really enjoyed APUSH and AP Gov (which inspired my major in Poli Sci). Now, in college, I’ve fallen in love with economics and would be thrilled to help students build confidence in it. As a native Spanish speaker, I can also support students in Spanish, and I’d love to guide passion projects, whether that’s starting a business or scaling one, drawing on my experiences in marketing and finance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’m a big foodie (Mexican and Japanese cuisine are my top picks!), a former competitive dancer with a love for ballet, and someone who’s always up for a hike or a game of Rummikub. I'm so excited to meet curious, creative, and driven students, and to be a part of their academic and personal journeys!\u003c/p\u003e","teachingVideoPlaybackId":"ctAjUeSqFB5kgUE6Mq902byaeR9Obc4myjarMHGLhy02I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics \u0026 Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"764b329f-94b4-444d-b2ae-9d3b4eb4705b\"}"},{"__ref":"DeepDives:{\"uuid\":\"abe30b52-70c2-40e2-b828-d470d5be377f\"}"},{"__ref":"DeepDives:{\"uuid\":\"369d73d7-1e0e-4498-8473-1274ee75bc72\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d73ac91-5eca-486e-aee6-63a5e15aca81\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b756cb62-d92a-45f4-8bf5-6f176b9af308/-/preview/-/format/jpg/","https://ucarecdn.com/6dc0994c-bcc9-44b3-8be4-78c4f73c74be/-/preview/-/format/jpg/","https://ucarecdn.com/8c42c4be-ec87-4c37-b5af-9b1bbd2b2be4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1abfd612-a25c-4f4a-828d-1a7267d5f432\"}"},{"__ref":"Education:{\"uuid\":\"76c0f0e8-28b6-4deb-b1f5-70b20b15196e\"}"}],"hiredAt":"2025-05-08T19:28:22.320Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Computer Science","K-6 Storybook","Creative Writing","History Project","Video / Photography","Fashion / Cosmetics","Visual Arts / Graphic Design","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexa-clemesha\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d243b355-afd4-4154-85fa-38bef1a15766\"}"}}},"_sentryTraceData":"e25f803cdce94dd1a1c6703058792151-8c6978eb8dde6b9a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e25f803cdce94dd1a1c6703058792151,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alexa-clemesha"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
