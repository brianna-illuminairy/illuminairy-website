xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d9d677a0-a9ab-4bad-a529-f5349ef9e3ba\"}":{"__typename":"Favorites","uuid":"d9d677a0-a9ab-4bad-a529-f5349ef9e3ba","photoUrl":"https://ucarecdn.com/de3c3c4d-c593-4873-ab48-002a76c9c5d4/","title":"\"Love in the Time of Cholera\" by Gabriel García Márquez","type":"BOOK"},"Favorites:{\"uuid\":\"3c86bcfb-a4a9-4112-9065-c5b429986dcf\"}":{"__typename":"Favorites","uuid":"3c86bcfb-a4a9-4112-9065-c5b429986dcf","photoUrl":"https://ucarecdn.com/d68088d9-fb19-4046-861a-47fd8823a47b/","title":"Football (Soccer)","type":"SPORT"},"Favorites:{\"uuid\":\"651bb3b5-49f8-4160-a19a-df6f2c266527\"}":{"__typename":"Favorites","uuid":"651bb3b5-49f8-4160-a19a-df6f2c266527","photoUrl":"https://ucarecdn.com/0f40d9c0-565b-4746-a517-816eb69a6509/","title":"Providence, RI","type":"CITY"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6743ca7a-3f78-4ed7-84c6-49fa2f5282ce\"}":{"__typename":"DeepDives","uuid":"6743ca7a-3f78-4ed7-84c6-49fa2f5282ce","content":"\u003cp\u003e\u003cstrong\u003eI'd love to be my country's \"Development Master Planner\", \u003c/strong\u003eleading a brain trust tasked with outlining Panama's long-term vision and researching how to best materialize it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"baf048f6-cfa7-4c87-8c73-2811dec64fe1\"}":{"__typename":"DeepDives","uuid":"baf048f6-cfa7-4c87-8c73-2811dec64fe1","content":"\u003cp\u003eBesides my work in public policy and education, \u003cstrong\u003eI'm also a singer-songwriter. \u003c/strong\u003eI used to perform a lot during college, and still do so from time to time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"7eb4c79e-fbe9-44f1-be05-119228560120\"}":{"__typename":"DeepDives","uuid":"7eb4c79e-fbe9-44f1-be05-119228560120","content":"\u003cp\u003eI believe that raising other people's level of ambition for what they can do for the world is one of the most impactful things one can do with their time\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"280fbdae-1dd7-48bd-9416-ffcb9c3b50dd\"}":{"__typename":"School","uuid":"280fbdae-1dd7-48bd-9416-ffcb9c3b50dd","name":"Schwarzman Scholars (Tsinghua University)","city":"Beijing","type":"HIGH","state":"Beijing","country":"China","zip":"000000"},"Education:{\"uuid\":\"5d788e8b-41f3-4fe3-b26e-18dd50c6ad4f\"}":{"__typename":"Education","uuid":"5d788e8b-41f3-4fe3-b26e-18dd50c6ad4f","school":{"__ref":"School:{\"uuid\":\"280fbdae-1dd7-48bd-9416-ffcb9c3b50dd\"}"},"startYear":"2024","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"f2fa850f-109f-4a79-9c06-d7d1e528a226\"}":{"__typename":"Education","uuid":"f2fa850f-109f-4a79-9c06-d7d1e528a226","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"International Affairs and Latin American Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"5edaaf49-239c-4e3e-85ab-cbac7ea8baae\"}":{"__typename":"MentorPublicProfile","uuid":"5edaaf49-239c-4e3e-85ab-cbac7ea8baae","displayName":"Felipe F.","slug":"felipe-flix","biography":"\u003cp\u003eHello! My name is Felipe, and I’m a young alum of Brown University and the Schwarzman Scholars program at Tsinghua University.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Brown, I double-majored in International Affairs and Latin American Studies. After college, I moved to Washington, DC to work on Latin America’s relations with the US and EU at the Atlantic Council—where I was promoted 3 times and left as an Assistant Director, with published articles and vast experience engaging with high-level leaders. Then, I was selected to pursue a fully-funded master’s of global affairs at China and Asia’s #1 university as a Schwarzman Scholar (only 140 Scholars chosen from a pool of 4,200+ applicants). I am now a Fellow at another US think tank, where I lead research and programming on Panama and serve as the CEO’s primary advisor on its economic and political developments.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI came to Brown as an international student born, raised, and educated in Panama City, Panama. At Brown, I founded the Spanish-language edition of the largest weekly newspaper in Southern New England, served as an editor of the Brown Political Review, volunteered as a mentor for child refugees in Providence, worked as the TA of an economic development course, and won several research awards. During college, I also interned at the United Nations and advised the Wall Street Journal and Panasonic. I graduated with honors.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore college, I completed the International Baccalaureate (IB) diploma at the International School of Panama. During high school, I excelled as a Model United Nations debater, team leader, and conference organizer in Panama, Mexico, the United States, and the Netherlands. In addition, I gave two TEDx talks, founded a social justice advocacy organization, played varsity soccer, and wrote dozens of published articles and newsletter pieces. I was also selected for a startup discovery program and offered to be accelerated at age 16.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of work and academics, I enjoy watching and playing football (soccer), traveling, hiking, songwriting, and watching live music. I’m also a huge bookworm – I especially enjoy reading memoirs, Latin American literature, and nonfiction books about politics, economics, business, and China.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m bilingual in Spanish and English, proficient in Brazilian Portuguese, and fluent in dad jokes.\u003c/p\u003e","teachingVideoPlaybackId":"W021uZvGfUntXEY8XNKZ4oHzSAAW3qjvTbUut41PFAvg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d9d677a0-a9ab-4bad-a529-f5349ef9e3ba\"}"},{"__ref":"Favorites:{\"uuid\":\"3c86bcfb-a4a9-4112-9065-c5b429986dcf\"}"},{"__ref":"Favorites:{\"uuid\":\"651bb3b5-49f8-4160-a19a-df6f2c266527\"}"}],"causesSupported":[],"major":"International Affairs and Latin American Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6743ca7a-3f78-4ed7-84c6-49fa2f5282ce\"}"},{"__ref":"DeepDives:{\"uuid\":\"baf048f6-cfa7-4c87-8c73-2811dec64fe1\"}"},{"__ref":"DeepDives:{\"uuid\":\"7eb4c79e-fbe9-44f1-be05-119228560120\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6546b823-bf5f-4f5a-9d5d-ea04d0a12885/-/preview/-/format/jpg/","https://ucarecdn.com/1dcc033d-f415-40e5-901e-faa985
