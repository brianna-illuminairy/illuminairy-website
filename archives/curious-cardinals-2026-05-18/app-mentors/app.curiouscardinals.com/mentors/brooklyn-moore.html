xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0a7c744b-3132-4df1-af72-165e3a10c3d2\"}":{"__typename":"Favorites","uuid":"0a7c744b-3132-4df1-af72-165e3a10c3d2","photoUrl":"https://ucarecdn.com/e0c06bed-f65a-417b-9939-925ec225606f/","title":"Glen Powell","type":"ACTOR"},"Favorites:{\"uuid\":\"25d54169-5928-4c10-9ef3-408104bc6799\"}":{"__typename":"Favorites","uuid":"25d54169-5928-4c10-9ef3-408104bc6799","photoUrl":"https://ucarecdn.com/8d5e6caa-cd5b-48c0-ae20-e208d061bdfa/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"ffeb0e7d-11e9-4f7a-9afa-4708a27ae161\"}":{"__typename":"Favorites","uuid":"ffeb0e7d-11e9-4f7a-9afa-4708a27ae161","photoUrl":"https://ucarecdn.com/d16f807d-ab9c-4679-9a9a-2763d796898f/","title":"Chicago","type":"CITY"},"CausesSupported:{\"uuid\":\"5576ef66-c5aa-4e18-84fa-fc874914f0dd\"}":{"__typename":"CausesSupported","uuid":"5576ef66-c5aa-4e18-84fa-fc874914f0dd","name":"Service for Sight","description":"\u003cp\u003eThrough Delta Gamma, I helped the visually impaired have equal opportunity.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/5e5c33b6-8d83-4714-95a8-c0a0ac4290cb/"},"CausesSupported:{\"uuid\":\"d41185a1-1045-4c4c-ae3c-3db4bd4786f8\"}":{"__typename":"CausesSupported","uuid":"d41185a1-1045-4c4c-ae3c-3db4bd4786f8","name":"Freedom of the Press \u0026 Speech","description":"\u003cp\u003eAs a journalist, I am committed to the defense of free speech.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/897dd309-2b2c-496b-8191-8c9de76d98ef/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"98ea8d3e-b7b4-4c9d-ab17-9514dd3a77b2\"}":{"__typename":"DeepDives","uuid":"98ea8d3e-b7b4-4c9d-ab17-9514dd3a77b2","content":"\u003cp\u003eI chose to major in journalism and history because I believe every person has a story to tell—it’s just about finding the right words. Journalism gives me the tools to help others share those stories with clarity and impact. I love history because I’m genuinely a nerd about it—it’s my biggest passion. Understanding the past helps me make sense of the present, and I’m constantly fascinated by the stories that have shaped our world. Together, these majors let me explore my curiosity, connect with people, and keep learning every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b1d00904-9c11-4913-8007-2f676e4d4740\"}":{"__typename":"DeepDives","uuid":"b1d00904-9c11-4913-8007-2f676e4d4740","content":"\u003cp\u003eDuring my summers in high school, I worked as a camp counselor, mentoring kids between the ages of 7 and 15. It was one of the most meaningful experiences I’ve had—I got to help kids build confidence, make friends, and try new things in a fun and supportive environment. I learned how to lead with patience, communicate clearly, and adapt to different personalities and needs. It also taught me a lot about responsibility and how to be someone others can count on, which has stuck with me ever since.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f3b9685b-e827-42ca-b3e5-1bc210a0349a\"}":{"__typename":"DeepDives","uuid":"f3b9685b-e827-42ca-b3e5-1bc210a0349a","content":"\u003cp\u003eIn my spare time, I love staying active and relaxing in equal measure. I’m a big fan of Pilates and going on long walks—they help me clear my head and feel grounded. I’m also a huge historical fiction fan, so I spend a lot of time reading (and constantly adding to my never-ending book list). When I’m in the mood to unwind, I love watching TV—\u003cem\u003eDance Moms\u003c/em\u003e is my go-to favorite. I also teach swimming lessons, which combines my love for working with kids and my background as a lifelong swimmer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"30b06514-6c86-4462-84af-374da446d0f5\"}":{"__typename":"School","uuid":"30b06514-6c86-4462-84af-374da446d0f5","name":"St. John XXIII College Preparatory","city":"Katy","type":"HIGH","state":"Texas","country":"United States","zip":"77449"},"Education:{\"uuid\":\"595a46e1-9f71-4999-b079-a03a61c2071c\"}":{"__typename":"Education","uuid":"595a46e1-9f71-4999-b079-a03a61c2071c","school":{"__ref":"School:{\"uuid\":\"30b06514-6c86-4462-84af-374da446d0f5\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"048c8f86-a48f-4876-b5cb-493941f0df18\"}":{"__typename":"Education","uuid":"048c8f86-a48f-4876-b5cb-493941f0df18","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Journalism, History, Integrated Marketing Communications","degree":null},"MentorPublicProfile:{\"uuid\":\"6db8e693-fc6d-4a12-9b9e-9d123de7e660\"}":{"__typename":"MentorPublicProfile","uuid":"6db8e693-fc6d-4a12-9b9e-9d123de7e660","displayName":"Brooklyn M.","slug":"brooklyn-moore","biography":"\u003chr\u003e\u003cp\u003eHi! I'm Brooklyn, and I'm passionate about helping people learn, grow, and feel confident in their abilities. I care deeply about making education accessible and enjoyable, and I love breaking down complex topics in a way that makes them feel manageable and even fun.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eI just graduated from Northwestern (Class of 2025) with a degree in journalism and history\u003c/strong\u003e—two subjects that have taught me how to think critically, ask big questions, and communicate clearly. Whether I’m diving into archival research or writing a long-form article, I’m always looking for the deeper story and how to explain it well to others.\u003c/p\u003e\u003cp\u003eAcademically, I’m a diligent student who takes pride in balancing a challenging course load with other commitments. I’ve trained for and completed a half-marathon while managing a full schedule of classes, and I’ve spent hours digging through university archives for a research project on the history of Northwestern University. These experiences taught me the importance of time management, persistence, and staying organized—skills I bring into every tutoring session. I will create a study plan with deadline dates and benchmarks to help your child understand the value of time management as well as the joy of meeting goals on time or even ahead of schedule!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’ve worked as a reporter and writer, which means I know how to communicate clearly and ask good questions. I also love helping others find their own voice—whether through writing, studying, or just understanding a new concept. \u003cstrong\u003e\u003cu\u003eToday I work as the editorial coordinator for\u003c/u\u003e\u003cem\u003e\u003cu\u003e Texas Monthly\u003c/u\u003e\u003c/em\u003e\u003cu\u003e magazine.\u003c/u\u003e\u003c/strong\u003e \u003cem\u003eTexas Monthly\u003c/em\u003e is a renowned publication that excels in story telling and breakthrough writing. I am currently working on multiple long term projects revolving around racial history in Texas, and I can’t wait to see the impact the stories will have on my community. I believe that journalism is essential to healthy and educated communities, helping to build bridges between past ignorance and future acceptance.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, I aim to create a space where students feel supported, encouraged, and capable of tackling hard things. I believe everyone learns differently, and I’m here to meet you where you are and help you get where you want to go. \u003cstrong\u003e\u003cu\u003eI am especially passionate about research, genealogy, writing and storytelling.\u003c/u\u003e\u003c/strong\u003e If you're looking for a mentor\u003cu\u003e \u003c/u\u003e\u003cstrong\u003e\u003cu\u003eto help gear up for college essays, improve writing skills, develop storytelling techniques for fiction or nonfiction works\u003c/u\u003e\u003c/strong\u003e, then I am the perfect mentor for you!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore personally, I am a \u003cstrong\u003eHUGE\u003c/strong\u003e Taylor Swift fan! I also love to go to concerts and live music venues, I am a lifelong competitive swimmer, I regularly go skiing with my family in the mountains of Colorado, and I love love love coffee! I previously worked at Paramount in their marketing department, leading to so many amazing opportunities and a deep understanding of the entertainment industry, script writing, video development and more.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would be honored to work with your student and help them on their path to success! Together, we can do it!\u003c/p\u003e","teachingVideoPlaybackId":"YvHm6jI7vYyhB9veQ1ciMOPKR00sUdBYGn8vt2bsih4o","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am extremely proud of my capstone history project. Over ten weeks, I developed a timeline of two days in 1931, collecting information from archival newspapers, archival legal documents, recorded telegrams, letters, genealogy, maps and more. The minute-by-minute timeline characterized an event of abhorrent racial violence that has failed to be recognized today. The project culminated in a 25+ page paper describing the catalysts, events and fallout in a contextualized and culturally relevant manner. It is the best academic work I have ever created and it has had the greatest impact on others. It is the type of work I aspire to continue in my journalistic career.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0a7c744b-3132-4df1-af72-165e3a10c3d2\"}"},{"__ref":"Favorites:{\"uuid\":\"25d54169-5928-4c10-9ef3-408104bc6799\"}"},{"__ref":"Favorites:{\"uuid\":\"ffeb0e7d-11e9-4f7a-9afa-4708a27ae161\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5576ef66-c5aa-4e18-84fa-fc874914f0dd\"}"},{"__ref":"CausesSupported:{\"uuid\":\"d41185a1-1045-4c4c-ae3c-3db4bd4786f8\"}"}],"major":"Journalism, History, Integrated Marketing Communications","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"98ea8d3e-b7b4-4c9d-ab17-9514dd3a77b2\"}"},{"__ref":"DeepDives:{\"uuid\":\"b1d00904-9c11-4913-8007-2f676e4d4740\"}"},{"__ref":"DeepDives:{\"uuid\":\"f3b9685b-e827-42ca-b3e5-1bc210a0349a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ae9d1706-c8da-46d7-9579-3cd37ad0c027/-/preview/-/format/jpg/","https://ucarecdn.com/a9f0a3ad-6d7e-4f87-8e1c-a1d24546d118/-/preview/-/format/jpg/","https://ucarecdn.com/a24499f5-f2a9-41b3-bd44-eebef2b6c858/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"595a46e1-9f71-4999-b079-a03a61c2071c\"}"},{"__ref":"Education:{\"uuid\":\"048c8f86-a48f-4876-b5cb-493941f0df18\"}"}],"hiredAt":"2025-04-29T13:35:21.988Z","topics":["K-5 Grade Math","Writing","E
