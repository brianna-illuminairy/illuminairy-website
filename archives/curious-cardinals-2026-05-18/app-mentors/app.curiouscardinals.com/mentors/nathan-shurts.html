xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1c19c793-d10e-466a-a53a-4e207cb424f0\"}":{"__typename":"Favorites","uuid":"1c19c793-d10e-466a-a53a-4e207cb424f0","photoUrl":"https://ucarecdn.com/fcbe9d36-c39a-41c2-b03f-d502041e0b82/","title":"Ryan Reynolds","type":"ACTOR"},"Favorites:{\"uuid\":\"490a4938-638b-4579-852e-32a742693d02\"}":{"__typename":"Favorites","uuid":"490a4938-638b-4579-852e-32a742693d02","photoUrl":"https://ucarecdn.com/689b54f0-d489-4fee-8d73-d3ac18c7bfe0/","title":"Project Hail Mary","type":"BOOK"},"Favorites:{\"uuid\":\"24adefea-f939-440d-a347-1f4cd118ec94\"}":{"__typename":"Favorites","uuid":"24adefea-f939-440d-a347-1f4cd118ec94","photoUrl":"https://ucarecdn.com/5c28a4ab-d0bb-4399-b171-f9ced3f8eb17/","title":"The Martian","type":"MOVIE"},"CausesSupported:{\"uuid\":\"382ee99f-aacb-4080-8867-76eb36dfb974\"}":{"__typename":"CausesSupported","uuid":"382ee99f-aacb-4080-8867-76eb36dfb974","name":"Integrity in Government","description":"\u003cp\u003eThrough my work at the NYC DOI investigating corrupt city officials.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/4b20c78d-8a9b-4031-80aa-e4ebd2064f58/"},"CausesSupported:{\"uuid\":\"ae4ec009-f8cc-46c2-b0b7-f76f6deb0c4c\"}":{"__typename":"CausesSupported","uuid":"ae4ec009-f8cc-46c2-b0b7-f76f6deb0c4c","name":"Freedom of Speech","description":"\u003cp\u003eAs a student journalist and former Knight First Amendment Institute intern.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/be6cfeed-90df-4c25-98e6-e3ba0b8d80e5/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"efee5abc-fb0c-45fc-abba-b892a60c87c8\"}":{"__typename":"DeepDives","uuid":"efee5abc-fb0c-45fc-abba-b892a60c87c8","content":"\u003cp\u003eIn the wise words of the great philosopher Shakira: Try everything!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe only way to find out what you love is to put yourself out there and join that club, start that project, take that class, and meet that person.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDon't ever hesitate to try something new, because you might wind up finding something you're really passionate about by doing it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a031b2ce-eae6-4e47-a91b-ab7add535263\"}":{"__typename":"DeepDives","uuid":"a031b2ce-eae6-4e47-a91b-ab7add535263","content":"\u003cp\u003eYa like magic? Aliens? Dinosaurs?\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWell, right now I'm running a Dungeons and Dragons campaign for some of my friends at college that has all three, and so much more. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe campaign is based on a combination of two larger stories I've written over the years, both of which I'm very proud of. So far, my friends have been thrilled with the complex storyline and the wild twists I built in.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you're interested in creative storytelling, I'd love to hear your ideas and help you turn the world in your mind into a full-fledged story you can show your friends (or maybe even turn into your own campaign!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"6c49d213-684f-4ee6-99df-56d70c9f9f0e\"}":{"__typename":"DeepDives","uuid":"6c49d213-684f-4ee6-99df-56d70c9f9f0e","content":"\u003cp\u003eMy ultimate goal is to spend my life learning, so I am motivated by a drive to pick up new skills, learn new fun facts, explore new places, and try new things!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"445b77ed-3dac-4ae2-b17b-6c2d18a9eb52\"}":{"__typename":"DeepDives","uuid":"445b77ed-3dac-4ae2-b17b-6c2d18a9eb52","content":"\u003cp\u003eI was a very driven and ambitious high school student who wanted to do and lead everything, which kept me quite busy. I was often seen running from meeting to meeting, multitasking during classes, and brainstorming club event ideas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy parents, teachers, and friends were incredibly supportive, and I couldn't have accomplished all that I did without their help. If you're looking for that sort of help with club projects, event planning, tough coursework, or even just a personal project you don't want to slip through the cracks, I'm thrilled to hear more about how I can help :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"689b0435-7e1e-4b81-b9ca-adaf53e3a833\"}":{"__typename":"School","uuid":"689b0435-7e1e-4b81-b9ca-adaf53e3a833","name":"Kinnelon High School","city":"Kinnelon","type":"HIGH","state":"New Jersey","country":"United States","zip":"07405"},"Education:{\"uuid\":\"64541415-a2fe-4644-a37b-178f5f1f22ce\"}":{"__typename":"Education","uuid":"64541415-a2fe-4644-a37b-178f5f1f22ce","school":{"__ref":"School:{\"uuid\":\"689b0435-7e1e-4b81-b9ca-adaf53e3a833\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":"2024","major":"N/A","degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"7f5f7575-f3a4-4d2d-96b0-fde9a42bcfaa\"}":{"__typename":"Education","uuid":"7f5f7575-f3a4-4d2d-96b0-fde9a42bcfaa","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":"2028","expectedGradYear":"2028","major":"Political Science-Statistics","degree":null},"MentorPublicProfile:{\"uuid\":\"be7aac4d-caab-414e-b0aa-0eaeff8cdbd4\"}":{"__typename":"MentorPublicProfile","uuid":"be7aac4d-caab-414e-b0aa-0eaeff8cdbd4","displayName":"Nathan S.","slug":"nathan-shurts","biography":"\u003cp\u003eHi! I'm Nathan Shurts (T-Shurts for short!), and I'm a rising Junior at Columbia University. I chose the mouthful of a major that is Political Science-Statistics, using the historical knowledge and research skills I learn here to write and edit for campus publications like our human rights journal, Continents, and the Columbia Political Review. The statistics coursework has taught me data analysis and coding skills that led me to the Data Visualization team at the Columbia Spectator, where I currently serve as a Deputy Editor, training new staffers in visualization software such as Datawrapper, RawGraphs, Fluorish, and the Adobe Suite. If you're interested in visual storytelling and quantitative analysis, especially in the realm of data journalism I'd love to walk you through some of the stuff we use in the newsroom!\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy major has also positioned me well to try out internships with nonprofits, campaigns, law firms, research organizations, and, currently, the NYC Department of Investigation. In my work, I've helped track news, take notes on congressional proceedings, monitor court cases and legislation, and research policy to draft memos and recommendations. Law, government, policy, and international relations are my favorite school subjects, and I know high school history isn't always the best place to explore the fascinating intersections between them, but I'd love to help you find a project that allows you to dive into that world.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I like to enjoy nature and explore the city, play board games with my family and friends, and most of all, read and write. My favorite stories are dystopian books that offer unique and mind-bending visions of worlds that range from not too far from our own all the way up to... well, Dune. I've written my own stories too, one of which I published on Kindle Vella before the platform went down some time ago. That story was about a scientist who creates an elixir of immortality and uses the resulting fame and power to start a religious movement, which allowed me to play around with sci-fi while also embracing the more political science-y aspects of my interests :)\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAside from my writing, I also spend a lot of my free time in other creative endeavors. I've always loved singing and musical theater, so I spend a lot of time singing a cappella with my friends in Columbia SHARP, performing in various productions on campus, and occasionally belting Billy Joel songs in the shower. I've occasionally dabbled in home movies as well, using iMovie to create short productions during high school and more recently using Canva to make social media content professionally at Columbia. I've even combined all of these tools to create board games, card games, and materials for my D\u0026amp;D campaign!\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm incredibly excited to work with new mentees, and I can tell you with confidence that you are in good hands. Right now, I also work as a Story Director for Written Out Loud, which is a virtual creative writing class of sorts where I direct students and help them work together to publish books! I know the pain of virtual meetings, but I also know how to get the most out of short sessions even in that online setting. I've also tutored for the SAT, run club events to teach STEM lessons, and assisted in teaching reading and writing in elementary schools near Columbia. If you're interested in working on creative writing projects, game design, college essays, humanities coursework, standardized test prep, data analysis and visualization, research and report writing, starting clubs, or planning events, I've got lots of advice to help you through the process that I'd love to share!\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo my future students: If you're here, that means you like to think outside the box and you want to have some fun getting your project off the ground and seeing where you can take it. Knowing that, I can't wait to work with you :)\u003c/p\u003e","teachingVideoPlaybackId":"AEKfJOosZrHLiTQnF02j1j00947LOx4FkFDgerktRVnrE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1c19c793-d10e-466a-a53a-4e207cb424f0\"}"},{"__ref":"Favorites:{\"uuid\":\"490a4938-638b-4579-852e-32a742693d02\"}"},{"__ref":"Favorites:{\"uuid\":\"24adefea-f939-440d-a347-1f4cd118ec94\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"382ee99f-aacb-4080-8867-76eb36dfb974\"}"},{"__ref":"CausesSupported:{\"uuid\":\"ae4ec009-f8cc-46c2-b0b7-f76f6deb0c4c\"}"}],"major":"Political Science-Statistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"efee5abc-fb0c-45fc-abba-b892a60c87c8\"}"},{"__ref":"DeepDives:{\"uuid\":\"a031b2ce-eae6-4e47-a91b-ab7add535263\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c49d213-684f-4ee6-99df-56d70c9f9f0e\"}"},{"__ref":"DeepDives:{\"uuid\":\"445b77ed-3dac-4ae2-b17b-6c2d18a9eb52\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6d0f5153-3ac4-4df9-8a56-5978374c77ce/-/preview/-/format/jpg/","https://ucarecdn.com/130666ef-ab7b-4ab5-a2a8-b4a24856a4b9/-/preview/-/format/jpg/","https://ucarecdn.com/b7b60499-d7dc-4f27-9829-47ea4618e6cc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"64541415-a2fe-4644-a37b-178f5f1f22ce\"}"},{"__ref":"Education:{\"uuid\":\"7f5f7575-f3a4-4d2d-96b0-fde9a42bcfaa\"}"}],"hiredAt":"2026-04-08T03:18:11.873Z","topics":["Statistics","Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","Writing","College Essay Writing","Reading","History","Academic Coaching","Executive Function","K-6 Storybook","Creative Writing","History Project","Law / Government / Policy","Journalism"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nathan-shurts\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"be7aac4d-caab-414e-b0aa-0eaeff8cdbd4\"}"}}},"_sentryTraceData":"265fc1f9396941fb93665d1f540ae43a-90da4ffa32d86190-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=265fc1f9396941fb93665d1f540ae43a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"nathan-shurts"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.creat
