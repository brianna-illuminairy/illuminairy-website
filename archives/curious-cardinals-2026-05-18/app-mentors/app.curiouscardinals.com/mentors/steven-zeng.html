xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"2763fd23-0b5f-43cd-b6e0-3e35ec57e416\"}":{"__typename":"CausesSupported","uuid":"2763fd23-0b5f-43cd-b6e0-3e35ec57e416","name":"Active Minds","description":"\u003cp\u003eI regularly volunteer and submit donations to this mental health organization.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c9a7c8ab-9066-4dca-8398-e51e4adb1faf\"}":{"__typename":"DeepDives","uuid":"c9a7c8ab-9066-4dca-8398-e51e4adb1faf","content":"\u003cp\u003eDuring high school, I spent my summers exploring my passions and pushing myself beyond my comfort zone. I engaged in research programs that ranged from computer science to foreign policy. I also played basketball for several travel teams, which kept me busy. Despite having little free time, I made sure to dedicate my spare moments to community service, especially during the COVID-19 pandemic.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fae83cfd-83ee-43c8-991b-e6d6d3f363f5\"}":{"__typename":"DeepDives","uuid":"fae83cfd-83ee-43c8-991b-e6d6d3f363f5","content":"\u003cp\u003eI chose to major in Electrical and Computer Engineering because it offers a broad spectrum of knowledge, from the fundamentals of hardware and circuits to advanced software engineering. I’ve always been fascinated by how technology works at every level, and ECE allows me to bridge the gap between low-level system design and high-level problem-solving. Additionally, I’m a hands-on builder who loves creating and innovating, and this major provides the perfect foundation to turn ideas into reality.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b4dce9f1-37e9-4bab-98ff-50a028d83050\"}":{"__typename":"DeepDives","uuid":"b4dce9f1-37e9-4bab-98ff-50a028d83050","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I'd say\u003c/p\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEmbrace challenges early\u003c/strong\u003e\u0026nbsp;– Don’t shy away from difficult subjects or experiences. Growth happens when you push beyond your comfort zone.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eExplore your interests freely\u003c/strong\u003e\u0026nbsp;– It’s okay to be curious and try different things. Whether it’s research, sports, or service, every experience adds to your perspective.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eConsistency beats intensity\u003c/strong\u003e\u0026nbsp;– Progress isn’t about huge leaps but small, daily improvements. Keep learning, practicing, and refining your skills.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAsk more questions\u003c/strong\u003e\u0026nbsp;– Never be afraid to seek help or ask why something works. Understanding the “why” will set you apart.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEnjoy the process\u003c/strong\u003e\u0026nbsp;– Success isn’t just about achievements; it’s about the journey. Don’t rush through experiences—appreciate each moment, even the struggles.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003eMost importantly, trust yourself. The things you’re passionate about now will shape your future in ways you can’t even imagine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"83a77bb5-c1b7-4a8b-a678-617c02c974e5\"}":{"__typename":"DeepDives","uuid":"83a77bb5-c1b7-4a8b-a678-617c02c974e5","content":"\u003cp\u003eMentorship matters to me because I wouldn’t be where I am today without the mentors who guided me along the way. They helped me grow academically, professionally, and personally, becoming not just advisors but some of my closest friends and role models. A great mentor is someone you can go to for advice, someone you can share a laugh with, and someone who is truly devoted and committed to the success of those they mentor. Having experienced firsthand the impact of strong mentorship, I’m passionate about paying it forward—helping others learn, grow, and navigate their own journeys with the same kind of guidance that made such a difference in my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"dd11b422-c0a4-41c5-a658-ec42f1451082\"}":{"__typename":"School","uuid":"dd11b422-c0a4-41c5-a658-ec42f1451082","name":"BASIS Chandler","city":"Chandler","type":"HIGH","state":"Arizona","country":"USA","zip":"85248"},"Education:{\"uuid\":\"186b36bc-5758-47e8-8986-98193bc7343f\"}":{"__typename":"Education","uuid":"186b36bc-5758-47e8-8986-98193bc7343f","school":{"__ref":"School:{\"uuid\":\"dd11b422-c0a4-41c5-a658-ec42f1451082\"}"},"startYear":"2014","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"a0403a9a-a85a-4b37-9002-1c88c97b7078\"}":{"__typename":"Education","uuid":"a0403a9a-a85a-4b37-9002-1c88c97b7078","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"83517500-0875-44ed-a2bc-1caff21e565e\"}":{"__typename":"MentorPublicProfile","uuid":"83517500-0875-44ed-a2bc-1caff21e565e","displayName":"Steven Z.","slug":"steven-zeng","biography":"\u003cp\u003eHey everyone, I’m Steven, and I’m passionate about mentorship and helping students grow through learning and guidance. As a mentor, I take pride in fostering curiosity, building confidence, and providing personalized support to help students excel academically and personally. My background in Electrical and Computer Engineering, combined with a strong foundation in problem-solving and communication, allows me to break down complex topics in a way that is engaging and easy to understand.\u003c/p\u003e\u003cp\u003eBeyond academics, I believe in the power of mentorship to inspire lifelong learning and critical thinking. Whether guiding students through technical subjects, providing career advice, or simply encouraging a growth mindset, I strive to be a supportive and approachable mentor.\u003c/p\u003e\u003cp\u003eWhen I’m not mentoring, I enjoy playing basketball and reading—both of which have taught me discipline, strategy, and the value of continuous learning. I look forward to working with students and helping them reach their full potential!\u003c/p\u003e","teachingVideoPlaybackId":"8ez01ZIWAeP7ESdhc4FOXomp02sVz24fzcWr7ruga1A5s","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhat would make my parents the most proud? I would like to say my accomplishments regarding academics and internship outcomes. However, they took the most happiness in seeing me help my little sister, who is in high school, succeed. From being by her side as she navigates golf to volunteering with her every week I am home, she has achieved many accolades that no straight A semester from me could compete with.\u003c/p\u003e","favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"2763fd23-0b5f-43cd-b6e0-3e35ec57e416\"}"}],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c9a7c8ab-9066-4dca-8398-e51e4adb1faf\"}"},{"__ref":"DeepDives:{\"uuid\":\"fae83cfd-83ee-43c8-991b-e6d6d3f363f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"b4dce9f1-37e9-4bab-98ff-50a028d83050\"}"},{"__ref":"DeepDives:{\"uuid\":\"83a77bb5-c1b7-4a8b-a678-617c02c974e5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7e859a3e-745e-47e1-b489-b20fe976a50c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"186b36bc-5758-47e8-8986-98193bc7343f\"}"},{"__ref":"Education:{\"uuid\":\"a0403a9a-a85a-4b37-9002-1c88c97b7078\"}"}],"hiredAt":"2025-03-11T06:47:08.413Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Physics","Chemistry","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Computer Science","K-6 Storybook","Creative Writing","Music","Sports Journalism","History Project","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Web Design","Sports Analytics","Machine Learning / AI","Public Speaking"],"communityBadges":["https://ucarecdn.com/754f9a3e-f5c4-4576-8cdd-2cdf8c2e4e63/","http
