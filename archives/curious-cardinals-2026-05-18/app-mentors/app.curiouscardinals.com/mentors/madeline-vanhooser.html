xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f0183a9f-1c0f-4dc0-b1f7-539e89025a60\"}":{"__typename":"Favorites","uuid":"f0183a9f-1c0f-4dc0-b1f7-539e89025a60","photoUrl":"https://ucarecdn.com/d457f950-d3ba-40e6-b933-3b6f4cdb52fc/","title":"Pride and Prejudice","type":"BOOK"},"Favorites:{\"uuid\":\"0522ec9a-53cb-4c12-bf8a-1dca8f0efd0b\"}":{"__typename":"Favorites","uuid":"0522ec9a-53cb-4c12-bf8a-1dca8f0efd0b","photoUrl":"https://ucarecdn.com/2d9e54bf-f4da-4b2d-ab29-d822c784a6c7/","title":"Jar of Flies by Alice in Chains","type":"ALBUM"},"Favorites:{\"uuid\":\"03c355d1-5bcd-44c8-af66-33828802ff4a\"}":{"__typename":"Favorites","uuid":"03c355d1-5bcd-44c8-af66-33828802ff4a","photoUrl":"https://ucarecdn.com/71a60e16-6182-4283-97c6-47d39bcfb44c/","title":"Seattle Mariners","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"33f87226-7d83-4aa0-aaed-b268408c6c7d\"}":{"__typename":"DeepDives","uuid":"33f87226-7d83-4aa0-aaed-b268408c6c7d","content":"\u003cp\u003eI would tell my middle or high school self to actively seek out challenges that feel uncomfortable. Put yourself in rooms where you might be the youngest, the only woman, or the only person representing your perspective. It may feel overwhelming at first, but those experiences are where real growth happens. Over time, you build confidence, resilience, and the ability to navigate difficult situations. Pushing yourself in this way is one of the best ways to prepare for what comes next.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"37e6c58b-f2b5-4d62-b850-c47046df95dd\"}":{"__typename":"DeepDives","uuid":"37e6c58b-f2b5-4d62-b850-c47046df95dd","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to travel to at least six continents. Antarctica would be incredible as well, though that might be a stretch. I love immersing myself in different cultures, trying new foods, and meeting people from all over the world, and I think those experiences are one of the best ways to grow and understand perspectives beyond your own.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"114e0039-f458-4f09-b497-bd38c43d6b0c\"}":{"__typename":"DeepDives","uuid":"114e0039-f458-4f09-b497-bd38c43d6b0c","content":"\u003cp\u003eIn my spare time, I enjoy a mix of creative, social, and relaxing activities. I have been playing piano for most of my life, and I also play violin and double bass, so music is one of my favorite ways to unwind. I also love exploring new food and trying different cuisines.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I am back home in Seattle, I enjoy going to the lake with my friends and baking with my best friend. I also love studying at cafés with a good book and a hot cup of tea. Spending time outdoors is important to me, and I have two dogs that I love taking on long walks by the water.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI try to balance more structured interests like reading and music with time spent with friends and being outside, which helps me recharge and stay grounded.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c3567d19-7ac5-4b11-8a55-271e4eb3a90d\"}":{"__typename":"DeepDives","uuid":"c3567d19-7ac5-4b11-8a55-271e4eb3a90d","content":"\u003cp\u003eHuman rights law is my dream career because it brings together everything I care about. I am deeply interested in economics and political theory, especially in how systems shape people’s access to resources and opportunities. While I enjoy understanding why inequalities exist, I am even more motivated to help address them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat draws me to this field is that it is both analytical and action oriented. It allows me to use legal frameworks to advocate for more equitable outcomes and hold institutions accountable. I am also interested in working across different countries and communities, learning from diverse perspectives while contributing to meaningful change.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"68d43403-9287-4ff1-a022-8547b1169593\"}":{"__typename":"School","uuid":"68d43403-9287-4ff1-a022-8547b1169593","name":"Lakeside School","city":"Seattle","type":"HIGH","state":"Washington","country":"Estados Unidos","zip":"98125"},"Education:{\"uuid\":\"881139d4-56d4-4412-a515-4ec598ab876b\"}":{"__typename":"Education","uuid":"881139d4-56d4-4412-a515-4ec598ab876b","school":{"__ref":"School:{\"uuid\":\"68d43403-9287-4ff1-a022-8547b1169593\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}":{"__typename":"School","uuid":"67d96877-4245-4f9b-a557-94f9ecabd290","name":"Barnard College","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"3c0f3c47-6c10-4aab-a5bd-d80c54ad7878\"}":{"__typename":"Education","uuid":"3c0f3c47-6c10-4aab-a5bd-d80c54ad7878","school":{"__ref":"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Economics and Human Rights","degree":null},"MentorPublicProfile:{\"uuid\":\"f30ea50f-1f0d-4ecc-9e48-8decda7eba3d\"}":{"__typename":"MentorPublicProfile","uuid":"f30ea50f-1f0d-4ecc-9e48-8decda7eba3d","displayName":"Madeline V.","slug":"madeline-vanhooser","biography":"\u003cp\u003eI am a student at Barnard College of Columbia University, where I study the intersections between economics, human rights, and the systems that shape people’s lived experiences. I am especially interested in how economic structures influence access to resources and opportunities across different communities. Through reading political theory, I have developed a strong interest in understanding how policy and institutions create real world consequences.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI plan to attend law school to deepen this work and pursue advocacy focused on equity and access. For me, studying these subjects is not just about understanding systems, but about identifying where change is possible.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I am a writer for Columbia University’s Women in Law and Politics Journal and have worked as an ophthalmic research fellow, contributing to large scale retinal imaging projects. I am also deeply committed to mentorship, having worked as both an academic and music tutor, where I focus on helping students build confidence and develop sustainable study strategies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I spend my time academically, extracurricular, and professionally:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eUndergraduate at Barnard College focusing on economics, human rights, and political theory\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWriter for Columbia University’s Women in Law and Politics Journal\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOphthalmic Research Fellow contributing to large scale research projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAcademic and music tutor creating personalized learning strategies for students\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eActive in student leadership and campus initiatives\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eUnique accolades and experiences:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eRanked among the top swimmers in Washington State and qualified for the Futures Championship meet\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInvited speaker at the AALAS National Conference, where I presented research on the disconnect between young people and the science community and explored ways to bridge that gap\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eContributed to over 45,000 research annotations in a collaborative ophthalmic research project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublished science communication writing focused on making complex topics accessible\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMulti instrumentalist with long term training in piano, violin, and double bass\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMentorship style:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFocus on building strong study systems rather than short term fixes\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreak down complex concepts into clear, manageable steps\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEmphasize accountability while maintaining a supportive and encouraging environment\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelp students develop executive functioning skills like time management and organization\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAdapt teaching style to each student’s learning needs and goals\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eFun facts:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI spent most of my summers growing up on farms in Idaho\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMy favorite foods are Ethiopian and Vietnamese cuisine\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI love skiing and hiking\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI spent nearly two weeks backpacking in Cedar Mesa, Utah\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOne of my favorite TV segments is \u003cem\u003eAnthony Bourdain: Parts Unknown\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI LOVE studying and reading philosophical texts\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"8vzvXlneW8kdYA1RW8wuldH8vHBHl1O01j73SnZesi5w","teachingVideoDescription":null,"greatestAchievement":"\u003cblockquote\u003e\u003cp\u003eI reckon this is not what my parents brag about when they talk about me, but I am in the top 5% of people in terms of how many movies I watch each year, and I have strong opinions about all of them.\u003c/p\u003e\u003c/blockquote\u003e\u003cbr\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f0183a9f-1c0f-4dc0-b1f7-539e89025a60\"}"},{"__ref":"Favorites:{\"uui
