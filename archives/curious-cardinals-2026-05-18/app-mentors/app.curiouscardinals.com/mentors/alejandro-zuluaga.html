xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8a613ad2-0257-4472-98c6-03961c5e8e6e\"}":{"__typename":"Favorites","uuid":"8a613ad2-0257-4472-98c6-03961c5e8e6e","photoUrl":"https://ucarecdn.com/177e7737-c8e9-4fc5-bbe0-f9d45f9bdf21/","title":"Miami, FL","type":"CITY"},"Favorites:{\"uuid\":\"b390d0d6-c48a-4498-a53c-00e0b306e48c\"}":{"__typename":"Favorites","uuid":"b390d0d6-c48a-4498-a53c-00e0b306e48c","photoUrl":"https://ucarecdn.com/b0f15c40-3ec5-40aa-ba4a-0573e502ba53/","title":"Sergio Ramos","type":"ATHLETE"},"Favorites:{\"uuid\":\"a12bb1a1-1402-4bbd-9856-ea2dc0570a42\"}":{"__typename":"Favorites","uuid":"a12bb1a1-1402-4bbd-9856-ea2dc0570a42","photoUrl":"https://ucarecdn.com/ba103c95-2155-4623-b20f-89f5501728e3/","title":"Percy Jackson and the Olympians","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8dc92ec0-4f10-4894-abee-b1f784095a69\"}":{"__typename":"DeepDives","uuid":"8dc92ec0-4f10-4894-abee-b1f784095a69","content":"\u003cp\u003eMentorship matters to me because, as a first generation, low income student, navigating high school and even the beginning of my higher education journey was very difficult to do on my own. Much of the process felt unclear and isolating, and having access to people who could offer guidance, perspective, and reassurance made a meaningful difference in how I approached academic and personal decisions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWorking with younger students is especially fulfilling to me because I see many of my own experiences reflected in theirs. As a rising senior in high school, I was selected as a Young Leader in the Young Leaders Summit, where the mentorship I received was incredibly beneficial. Having mentors who were invested in my growth helped me build confidence, think more intentionally about my future, and navigate the college application process with greater clarity. That experience stayed with me and motivated me to give back by returning to the program this past summer as a Squad Leader.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Squad Leader, I had the opportunity to work with students both in person and virtually, and I found both forms of mentorship deeply rewarding. Building relationships with students, supporting them through uncertainty, and helping them articulate their goals reinforced how impactful consistent guidance can be. I am still in contact with my cohort of Young Leaders and have continued to support them over the past few months with college applications and supplemental essays.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of my background and the mentorship I have benefited from, I view mentorship as a responsibility as much as an opportunity. It allows me to help students feel less alone in the process while reinforcing the importance of paying forward the support that once made a difference in my own journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"b8d97ba4-a907-43d9-85df-33e064739a21\"}":{"__typename":"DeepDives","uuid":"b8d97ba4-a907-43d9-85df-33e064739a21","content":"\u003cp\u003eDuring the summer before my junior year of high school, I achieved the rank of Eagle Scout by completing my service project, A Round of ApPaws. I spent most of my time in Scouting with Troop 3 in Central Falls, so when it came time to choose a project, I wanted it to directly benefit the community that had shaped me. I decided to renovate the Sacred Heart Dog Park in Central Falls and partnered with Mayor Maria Rivera and Central Falls City Hall to execute the project. Over the course of my sophomore year of high school, I managed the planning, fundraising, and coordination required to bring the project to life. I raised nearly $10,000 and organized over 50 local volunteers to help transform what was once a simple fenced patch of grass into a fully functional dog park where families could spend time with their pets. The project taught me how to lead with accountability, communicate across stakeholders, and stay committed to a long term goal. More than three and a half years later, I am proud to say that the Sacred Heart Dog Park continues to serve as a safe, communal space for the families of Central Falls, which remains one of my most meaningful accomplishments.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7cf04000-c0f9-4a4a-9c18-b1285d761d0c\"}":{"__typename":"DeepDives","uuid":"7cf04000-c0f9-4a4a-9c18-b1285d761d0c","content":"\u003cp\u003eI would tell my middle and high school self to be less hard on myself and to start confronting my fear of asking for help much earlier. For a long time, I believed that struggling quietly was a sign of independence or strength, when in reality it only made things harder. Looking back, I wish I had worked with my younger self to understand that asking questions is not a weakness but a tool for growth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYears later, I am a firm believer that one conversation can change your life. Limiting the conversations you initiate, especially those driven by curiosity or a desire to grow, can quietly limit your opportunities. Progress often begins with a single question, an honest email, or a moment of vulnerability, and choosing not to take that step can close doors before they ever open.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would also remind myself that while asking a question can feel uncomfortable and make you vulnerable in the moment, never asking a question makes you vulnerable forever. When you are surrounded by the right people, mentors, classmates, or peers, curiosity should be encouraged, not punished. If asking for help consistently makes you feel small or exposed, it is worth reflecting on whether the environment itself is the right one.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I would encourage my younger self to seek out spaces that value learning and openness, and to trust that growth comes not from having all the answers, but from being willing to ask for them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"37badb9f-841e-4775-aee9-5d3dd7e0cc1b\"}":{"__typename":"DeepDives","uuid":"37badb9f-841e-4775-aee9-5d3dd7e0cc1b","content":"\u003cp\u003eIn my spare time, I spend most of my free hours staying active. My favorite pastimes are playing soccer and weightlifting. Soccer has always been a meaningful part of my life, and my favorite team is Real Madrid. My father is a huge fan, and growing up watching their matches together is something I value very deeply. Those moments helped shape my love for the sport and remain some of my favorite memories.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also really enjoy going to the gym. During my sophomore year of high school, I stopped playing competitive soccer because I chose to work a part time job to help support my family. The gym became my way of staying active, but it also turned into a space where I built discipline and community. Over time, it became a place where I made friends and continue to meet new people, which is something I still value today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFood is another big interest of mine. Both of my parents immigrated from Bogotá, Colombia in 2000, so Colombian food is a staple in my household and something I love. When I go out to eat, however, I enjoy trying foods from different cultures. Right now, some of my favorites are ramen, butter chicken, and chicken shawarma. Desserts are easily my favorite category of food, and while my number one choice changes often, I especially enjoy milkshakes and boba.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also consider myself a very open minded person. Since moving away from home and meeting entirely new people on campus, I have found a lot of joy in trying new activities with others. Some of the hobbies that have stuck with me are playing squash, playing chess, and going on runs, all of which have become fun ways to stay connected and continue exploring new interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"14dc3bc9-4a98-44d1-aa31-618304b09bf1\"}":{"__typename":"School","uuid":"14dc3bc9-4a98-44d1-aa31-618304b09bf1","name":"Blackstone Valley Prep High School","city":"Cumberland","type":"HIGH","state":"Rhode Island","country":"United States","zip":"02864"},"Education:{\"uuid\":\"e640613b-e1bb-4ac1-8a88-f5b361dd8c42\"}":{"__typename":"Education","uuid":"e640613b-e1bb-4ac1-8a88-f5b361dd8c42","school":{"__ref":"School:{\"uuid\":\"14dc3bc9-4a98-44d1-aa31-618304b09bf1\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"01c4195a-812d-49d1-b3ab-059be9591f96\"}":{"__typename":"Education","uuid":"01c4195a-812d-49d1-b3ab-059be9591f96","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"67c89a59-67fc-45a2-a803-0c1833ca4ef9\"}":{"__typename":"MentorPublicProfile","uuid":"67c89a59-67fc-45a2-a803-0c1833ca4ef9","displayName":"Alejandro Z.","slug":"alejandro-zuluaga","biography":"\u003cp\u003eMy name is Alejandro Zuluaga, and I am a sophomore at Yale University majoring in Economics. I am originally from Pawtucket, Rhode Island, and I attended Blackstone Valley Prep High School in Cumberland, RI. Growing up in a tight knit community shaped how I view education, opportunity, and responsibility, especially as a first generation, low income student. Family has always been central to my life, and I am especially close with my younger sister, who is sixteen and a constant source of motivation for me to lead by example.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I am actively involved in several student organizations that reflect both my academic interests and my personal values. I am a member of Yale Undergraduate Diversified Investments, where I engage with financial markets and investment analysis alongside peers who share a strong interest in finance. I am also involved in Scholars of Finance, which emphasizes ethical leadership and character development within the financial services industry. Beyond finance, I am a member of Club Colombia, which allows me to stay connected to my cultural roots, and the Yale Association of Rhode Island, where I enjoy building community with fellow students from my home state.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and campus involvement, I enjoy playing soccer, weightlifting, playing video games, trying new foods, and working on my clothing brand.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also involved with the Hispanic Scholarship Fund and Management Leadership for Tomorrow, both of which have played an important role in my personal and professional development. Through these organizations, I have gained mentorship, community, and a clearer understanding of how to navigate competitive professional spaces while staying grounded in my values.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis coming summer, I will be interning at JPMorgan Chase in their New York office as I continue exploring a career in finance. This past summer, I served as a Squad Leader for the Young Leaders Summit, where I worked closely with younger students and found the experience extremely fulfilling. Being able to support students as they navigated important academic and personal decisions was both meaningful and rewarding. Because of that experience, I am very excited and grateful to be a Curious Cardinals mentor and look forward to continuing to work with and learn from younger students.\u003c/p\u003e","teachingVideoPlaybackId":"lTEGl1N6naUJxN44x02TprI01x0041zT6KYDBJwGeFcMIM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I am most proud of is being admitted to Yale University and putting myself on a path to give back to my parents for the sacrifices they made for me. Both of my parents dropped out of college in Bogotá, Colombia in the year 2000 to pursue the American dream and create better opportunities for their future family. They left behind familiarity and stability in hopes that their children would have access to possibilities they never did.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was born five years later, and throughout my life my parents have been incredibly supportive, always encouraging me to work hard and take education seriously. At the same time, much of the guidance they could offer was limited, not because of a lack of care, but because their areas of expertise did not align with the academic and professional paths I have chosen to pursue. Navigating school, college applications, and professional opportunities often meant learning things on my own and figuring out how to ask for help outside of my immediate family.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing admitted to Yale represents more than a personal academic achievement. It symbolizes years of perseverance, self advocacy, and resilience shaped by my parents’ sacrifices. It is proof that their decision to start over in a new country created real, tangible opportunities for the next generation. I am proud not only of getting to Yale, but of continuing to move forward with the intention of honoring their sacrifices by building a future where I can support them and give back in meaningful ways.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"8a613ad2-0257-4472-98c6-03961c5e8e6e\"}"},{"__ref":"Favorites:{\"uuid\":\"b390d0d6-c48a-4498-a53c-00e0b306e48c\"}"},{"__ref":"Favorites:{\"uuid\":\"a12bb1a1-1402-4bbd-9856-ea2dc0570a42\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8dc92ec0-4f10-4894-abee-b1f784095a69\"}"},{"__ref":"DeepDives:{\"uuid\":\"b8d97ba4-a907-43d9-85df-33e064739a21\"}"},{"__ref":"DeepDives:{\"uuid\":\"7cf04000-c0f9-4a4a-9c18-b1285d761d0c\"}"},{"__ref":"DeepDives:{\"uuid\":\"37badb9f-841e-4775-aee9-5d3dd7e0cc1b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a38b3b9f-e115-40b7-822c-88ee1125fdec/-/preview/-/format/jpg/","https://ucarecdn.com/a1cd8c48-231b-431a-a97b-a48b0c5b5180/-/preview/-/format/jpg/","https://ucarecdn.com/1552067d-efc8-4afd-b1fc-8dbea2efbeba/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e640613b-e1bb-4ac1-8a88-f5b361dd8c42\"}"},{"__ref":"Education:{\"uuid\":\"01c4195a-812d-49d1-b3ab-059be9591f96\"}"}],"hiredAt":"2026-01-21T16:10:33.285Z","topics":["Algebra I","K-5 Grade Math","Spanish","Academic Coaching","College Essay Writing","Economics","Sports Journalism","Business / Entrepreneurship","Public Speaking"],"communityBadges":["https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alejandro-zuluaga\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"67c89a59-67fc-45a2-a803-0c1833ca4ef9\"}"}}},"_sentryTraceData":"05cbc7ba82614c90a3a1e03a104ee027-b3e5f59b8bb48b66-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=05cbc7ba82614c90a3a1e03a104ee027,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alejandro-zuluaga"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
