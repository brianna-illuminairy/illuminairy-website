xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"296d42a7-0c42-4ded-a9bf-d7dbb1cd2a3a\"}":{"__typename":"Favorites","uuid":"296d42a7-0c42-4ded-a9bf-d7dbb1cd2a3a","photoUrl":"https://ucarecdn.com/5766091f-37d2-486c-b899-d15ebd1c2435/","title":"The Elder Scrolls 3: Morrowind","type":"GAME"},"Favorites:{\"uuid\":\"94a27cbc-0fed-4438-a9af-0f11e881cf50\"}":{"__typename":"Favorites","uuid":"94a27cbc-0fed-4438-a9af-0f11e881cf50","photoUrl":"https://ucarecdn.com/27598416-30a4-4e7e-9e60-674c6544984e/","title":"St. Louis Cardinals","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b2585b0d-7dfa-48e8-ac3f-8686ff8371fe\"}":{"__typename":"DeepDives","uuid":"b2585b0d-7dfa-48e8-ac3f-8686ff8371fe","content":"\u003cp\u003eI actually started college as an Astrophysics major, but it didn’t take long to realize my true passion was somewhere else: making video games. I’ve always been drawn to creative problem-solving, and game development felt like the perfect blend of imagination and logic. Math has always come naturally to me, and pairing it with Computer Science gave me the tools I needed to bring my ideas to life. Choosing this path wasn’t just about what I enjoyed—it was about building all of the necessary skills to turn my passion into something real.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"1ba77df9-168f-4a55-ac5d-5930af44c63a\"}":{"__typename":"DeepDives","uuid":"1ba77df9-168f-4a55-ac5d-5930af44c63a","content":"\u003cp\u003eComing from a small rural town with an underfunded public school system, I’ve seen firsthand how access—or lack thereof—can shape someone’s academic journey. That experience has made me an empathetic teacher. I understand what it feels like to love learning but not always have the resources or support to pursue it fully. Because of that, I approach teaching with patience, encouragement, and the belief that every student is capable of excellence when given the right tools and someone who believes in them. I want to be that person for my students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"70cbbeb3-b71c-4778-8a91-13a3228d6ce3\"}":{"__typename":"DeepDives","uuid":"70cbbeb3-b71c-4778-8a91-13a3228d6ce3","content":"\u003cp\u003eSomething that might not be obvious right away is that I’m a writer. I spend a lot of my free time crafting essays, poems, and reflections—usually about emotions, memory, or relationships. It’s a quieter part of who I am, but it really helps me process the world around me and connect with people on a deeper level. Even though most people see me as someone logical or technical because of my major, writing is where I explore the more human side of things.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"47c25f93-5c4a-4415-9c83-9e41b2e0e09b\"}":{"__typename":"DeepDives","uuid":"47c25f93-5c4a-4415-9c83-9e41b2e0e09b","content":"\u003cp\u003eOne of my favorite passion projects is a custom chess engine I've been building from scratch. I have a successful version that plays a variant of chess on a smaller board, and I've been experimenting with different AI strategies like Minimax and Monte Carlo Tree Search to see which performs better. it's been a fun challenge that combines my love for math, programming, and games. Projects like this remind me why I chose this path, since they're both creative and deeply analytical, and I learn something new every time I sit down to work on them. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"6a709b77-2a5a-419c-97ce-ffd6f0135812\"}":{"__typename":"School","uuid":"6a709b77-2a5a-419c-97ce-ffd6f0135812","name":"Houston High School","city":"Houston","type":"HIGH","state":"Missouri","country":"United States","zip":"65483"},"Education:{\"uuid\":\"d8c790fd-99f6-4637-8926-478ab49fb11c\"}":{"__typename":"Education","uuid":"d8c790fd-99f6-4637-8926-478ab49fb11c","school":{"__ref":"School:{\"uuid\":\"6a709b77-2a5a-419c-97ce-ffd6f0135812\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"ca95d0cd-d07e-4ef4-8e43-6fc93912232b\"}":{"__typename":"Education","uuid":"ca95d0cd-d07e-4ef4-8e43-6fc93912232b","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science + Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"7013dfcf-1043-404a-96df-323938085e47\"}":{"__typename":"MentorPublicProfile","uuid":"7013dfcf-1043-404a-96df-323938085e47","displayName":"Devon S.","slug":"devon-sawyer","biography":"\u003cp\u003eBefore I ever wrote a line of code, I was asking big questions about the world around me—how it worked, why people made the choices they did, and where I fit in. Growing up in a small town in rural Missouri, I experienced firsthand the gaps in access to quality education. But I also learned how curiosity, resourcefulness, and the right mentors can change everything.\u003c/p\u003e\u003cp\u003eNow a junior at Yale studying Mathematics and Computer Science, I’ve found a home in spaces that blend logic and creativity: game development, algorithmic design, and educational mentorship. My passion lies in building things—games that let people make meaningful choices, programs that solve difficult problems, and classrooms that spark curiosity in students who might not otherwise see themselves as “math people” or “coders.” I believe in demystifying complexity, and in making math and computer science feel exciting, personal, and empowering.\u003c/p\u003e\u003cp\u003eMy own journey has been anything but linear. I began college as an Astrophysics major before realizing that my true love was game development—creating worlds where people could experiment, learn, and tell stories. I’ve since built chess engines, a text-based adventure game engine, and even my own mathematical visualization tools. I’ve also tutored students across a wide range of subjects, always with the same goal: to meet them where they are, build their confidence, and help them discover how capable they really are.\u003c/p\u003e\u003cp\u003eWhat sets my teaching apart is the empathy I bring to it. As someone with a nontraditional background in a highly technical field, I know how alienating learning can sometimes feel. But I also know the thrill of finally cracking a concept, writing your first program, or seeing a math problem in a whole new light. That’s the feeling I want to pass on.\u003c/p\u003e\u003cp\u003eWhether I’m mentoring a student through their first proof, helping them debug code, or exploring how creative writing can teach us about ourselves, I’m here to help them grow—not just as learners, but as thinkers, creators, and people.\u003c/p\u003e","teachingVideoPlaybackId":"oQ5S1FwROauP4301s800ldn00UQKF1C01XLmVEZqxQ9f018k","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the proudest moments of my life was receiving the WorldStrides Maestro Award in 2022 for my soprano saxophone solo at the Nashville Heritage Festival. The award recognizes individuals who demonstrate exceptional musical sensitivity and performance, and being chosen among so many talented musicians affirmed both my dedication and my love for music. To this day, that experience inspires me to keep creating and expressing myself—whether through music, code, or storytelling.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"296d42a7-0c42-4ded-a9bf-d7dbb1cd2a3a\"}"},{"__ref":"Favorites:{\"uuid\":\"94a27cbc-0fed-4438-a9af-0f11e881cf50\"}"}],"causesSupported":[],"major":"Computer Science + Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b2585b0d-7dfa-48e8-ac3f-8686ff8371fe\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ba77df9-168f-4a55-ac5d-5930af44c63a\"}"},{"__ref":"DeepDives:{\"uuid\":\"70cbbeb3-b71c-4778-8a91-13a3228d6ce3\"}"},{"__ref":"DeepDives:{\"uuid\":\"47c25f93-5c4a-4415-9c83-9e41b2e0e09b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/00d8e6bd-47e2-46d7-a3c9-0b3a7cd10e74/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d8c790fd-99f6-4637-8926-478ab49fb11c\"}"},{"__ref":"Education:{\"uuid\":\"ca95d0cd-d07e-4ef4-8e43-6fc93912232b\"}"}],"hiredAt":"2025-04-10T14:55:59.152Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Chemis
