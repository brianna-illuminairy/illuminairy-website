xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e69784dc-97e3-460f-a3e9-fd4a0f357c58\"}":{"__typename":"DeepDives","uuid":"e69784dc-97e3-460f-a3e9-fd4a0f357c58","content":"\u003cp\u003eI would tell myself to embrace uncertainty and trust the process. Growth often comes from discomfort, and staying disciplined and curious will always pay off in the long run. I stressed a bit too much in high school and looking back, I could have used advice like that.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"7325645c-b6c3-4554-ab8b-6766d0b99c0d\"}":{"__typename":"DeepDives","uuid":"7325645c-b6c3-4554-ab8b-6766d0b99c0d","content":"\u003cp\u003eMy greatest role model is my dad. After moving back from Thailand, I saw firsthand the sacrifices he made to raise my brother and me. He leads through consistency, resilience, and integrity. Watching him balance responsibility and family has shaped me and the way I approach everything in life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"abb634cc-a6a0-4c53-907c-d5496b10a9cc\"}":{"__typename":"DeepDives","uuid":"abb634cc-a6a0-4c53-907c-d5496b10a9cc","content":"\u003cp\u003eMentorship has been pivotal at every stage of my life. Coaches, teachers, advisors, and upperclassmen have consistently pushed me to grow and see beyond my own limitations. Having someone who offers honest guidance and support can accelerate growth in ways that would have been difficult for me to do alone.Because of this, I deeply value both receiving and giving mentorship when I can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"72807bfb-d424-4748-8add-3df314097d33\"}":{"__typename":"DeepDives","uuid":"72807bfb-d424-4748-8add-3df314097d33","content":"\u003cp\u003eIn high school, I spent most of my summers playing travel basketball. Between practices, workouts, and tournaments, it was a highly competitive and structured environment. Basketball taught me discipline, resilience, and how to work effectively within a team. Those summers shaped both my work ethic and my ability to perform under pressure.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}":{"__typename":"School","uuid":"62e59c56-ee46-4213-b082-758af3ff99db","name":"Phillips Exeter Academy","city":"Exeter","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03833"},"Education:{\"uuid\":\"b7447e2a-d844-4f99-931a-69529133d4cd\"}":{"__typename":"Education","uuid":"b7447e2a-d844-4f99-931a-69529133d4cd","school":{"__ref":"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"992d0586-6551-437e-aefa-bf570e388665\"}":{"__typename":"Education","uuid":"992d0586-6551-437e-aefa-bf570e388665","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"ce9f356d-f7db-41ba-bce9-1554dbc58c18\"}":{"__typename":"MentorPublicProfile","uuid":"ce9f356d-f7db-41ba-bce9-1554dbc58c18","displayName":"Matthew J.","slug":"matthew-jutabha","biography":"\u003cp\u003eOriginally from Bangkok, Thailand, I moved to Los Angeles at a young age and have spent most of my life growing up there. Living between cultures has deeply shaped the way I see the world. Experiencing two very different environments early on taught me how to adapt quickly, navigate unfamiliar settings, and appreciate perspectives that may differ from my own. Bangkok gave me a global foundation and an awareness of cultural nuance, while Los Angeles gave me the independence and confidence to grow into that perspective. Together, those experiences have made me comfortable in diverse spaces and curious about how people and systems interact across contexts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am currently studying Economics with a minor in Business Institutions at Northwestern University. I’m drawn to economics because it provides a structured framework for understanding how incentives shape behavior and how institutions influence opportunity. I enjoy analyzing how markets function, how policies impact communities, and how individual decisions aggregate into larger outcomes. At the same time, my business minor allows me to think more practically about how strategies are implemented within organizations. It pushes me to consider not just theory, but execution as to how leadership, structure, and decision-making processes translate ideas into measurable results. Together, these fields allow me to bridge analytical thinking with real-world application.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I value the relationships and experiences that keep me grounded. I love spending time with friends and family, whether that means trying new restaurants, having long conversations, or simply being together. I’m also an avid skier and love exploring new mountains – though nothing beats Colorado! Traveling is another passion of mine, as it allows me to experience new cultures firsthand and continuously expand my perspective. In my free time, I closely follow sports such as football and basketball.\u003c/p\u003e\u003cp\u003eI’m excited to continue developing both my analytical skills and global perspective as I explore future opportunities. I’m especially motivated by environments that challenge me to grow while staying connected to the people and activities that matter most to me. I look forward to connecting, learning from others, and contributing thoughtfully to the communities I’m part of.\u003c/p\u003e","teachingVideoPlaybackId":"uZHnFTXyQLAou9XlpIEFI01nqi6SzsuXhdDitWc5MjGQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e69784dc-97e3-460f-a3e9-fd4a0f357c58\"}"},{"__ref":"DeepDives:{\"uuid\":\"7325645c-b6c3-4554-ab8b-6766d0b99c0d\"}"},{"__ref":"DeepDives:{\"uuid\":\"abb634cc-a6a0-4c53-907c-d5496b10a9cc\"}"},{"__ref":"DeepDives:{\"uuid\":\"72807bfb-d424-4748-8add-3df314097d33\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8f8600cb-8341-4cc0-b4f5-65c366394840/-/preview/-/format/jpg/","https://ucarecdn.com/24e066f1-97f4-4161-9c0d
