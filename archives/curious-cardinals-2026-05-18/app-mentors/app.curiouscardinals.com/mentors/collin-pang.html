xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"d2262c7e-95c1-4414-8732-fa7451199a4d\"}":{"__typename":"CausesSupported","uuid":"d2262c7e-95c1-4414-8732-fa7451199a4d","name":"United Students for Veterans' Health","description":"","photoUrl":""},"CausesSupported:{\"uuid\":\"0a7f4723-5784-4757-b81a-46c3fa827756\"}":{"__typename":"CausesSupported","uuid":"0a7f4723-5784-4757-b81a-46c3fa827756","name":"Lucile Packard Children's Hospital","description":"","photoUrl":""},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"97eb940e-0780-4038-9b79-8babb5125315\"}":{"__typename":"DeepDives","uuid":"97eb940e-0780-4038-9b79-8babb5125315","content":"\u003cp\u003eIn my spare time, I like to exercise, cook, drive around the city and explore, and play video games. All of these activities can be done while listening to music, which is something that I also enjoy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"86ea2d93-3c0b-461b-abae-8ad803e33b58\"}":{"__typename":"DeepDives","uuid":"86ea2d93-3c0b-461b-abae-8ad803e33b58","content":"\u003cp\u003eMy dream job would definitely be as an orthopedic surgeon for a professional sports team! I think the combination of clinical work and being able to interact with athletes would be the perfect mix for me, because of my passions academically and interests outside of them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"5b25c653-68ff-423c-8d9c-27b12876a846\"}":{"__typename":"DeepDives","uuid":"5b25c653-68ff-423c-8d9c-27b12876a846","content":"\u003cp\u003eMy greatest source of motivation is my family - both present and future. My family has been so supportive of me and my journey, making countless sacrifices to put me in the best position to succeed. I would love nothing more than to make them proud. As for my future family, I have always aspired to give them everything they could ever want. If I can have my dream career while giving my family the financial freedom to enjoy life to the fullest, I will feel very fulfilled. In order for that to happen, though, I need to work hard in every moment leading up to it - this is what brings me motivation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"fd0077ef-b75a-41d0-8051-d6f52b947b1a\"}":{"__typename":"DeepDives","uuid":"fd0077ef-b75a-41d0-8051-d6f52b947b1a","content":"\u003cp\u003eIn high school, I spent most of my time in sports. I was on the soccer and football team, and both sports had summer trainings and games that I was committed to. Although it was tiring, it taught me dedication, hard work, and also kept my body active. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"769de860-d847-4abd-9807-cac0d9bd4f5c\"}":{"__typename":"Education","uuid":"769de860-d847-4abd-9807-cac0d9bd4f5c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Science, Technology \u0026 Society","degree":"B.S."},"School:{\"uuid\":\"f273af4b-8684-4c84-b29d-7a5d0230838f\"}":{"__typename":"School","uuid":"f273af4b-8684-4c84-b29d-7a5d0230838f","name":"Capistrano Valley High School","city":"Mission Viejo","type":"HIGH","state":"California","country":"United States","zip":"92692"},"Education:{\"uuid\":\"49bc2603-e669-4b11-8757-f34fe0df32c4\"}":{"__typename":"Education","uuid":"49bc2603-e669-4b11-8757-f34fe0df32c4","school":{"__ref":"School:{\"uuid\":\"f273af4b-8684-4c84-b29d-7a5d0230838f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"68fc7a03-5dc4-463d-8fca-ced3c4264f81\"}":{"__typename":"MentorPublicProfile","uuid":"68fc7a03-5dc4-463d-8fca-ced3c4264f81","displayName":"Collin P.","slug":"collin-pang","biography":"\u003cp\u003eCollin is a Senior at Stanford University pursuing a major in Science, Technology and Society while on the pre-medical track. With a Vietnamese father and Dutch mother, he grew up with a passion for learning about different cultures and exploring how they shape who we become as people. Born in Boston but raised in Southern California, he can not see himself moving away from the amazing West Coast weather anytime soon!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore graduating from his high school as the Valedictorian with a Seal of Biliteracy, he was a Varsity Letterman in soccer and a member of the National Honor Society. Given his love for food, he was also responsible for organizing institution-wide meals for all of the healthcare workers at the hospital he volunteered at.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, he strives to use his privilege to further make a positive impact on the wellbeing of others. He has a wide range of experience working with children and teenagers, and has worked as a camp counselor and tutor for over 5 years. He interned at Saddleback Hospital and Children’s Hospital Orange County in the past, and is currently at Lucile Packard Children’s Hospital at Stanford. He does research at the Stanford School of Medicine, with a concentration in finding a cure for Osteoarthritis in injured athletes. In a different research project, he uses a mouthguard engineered by his Lab to work closely with the Stanford Football Team. The mouthguard’s embedded sensors allow him to quantitatively measure head-to-head impacts, to analyze the collisions that pose a threat to player safety. He is also a volunteer for the U.S. Department of Veterans Affairs, spending quality time with the veterans and spreading happiness.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA self-taught surfer and avid soccer player, he believes that the key to a clear mind is an active body. He is a big sports fan, and especially loves watching football and basketball. Despite attempts to keep his music taste diverse, his favorites include Bruno Mars, SZA, and Blxst. He expresses his creative side through cooking, and loves to experiment with a “fusion” style to combine different cultures through cuisine. He also might just be the biggest Star Wars fan you’ve ever met.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor with Curious Cardinals, he is very excited to work with all kinds of students—he takes pride in his patience and communication, which allow him to make meaningful connections with his mentees. Whether the focus is academic, hobbies, or something else, he is motivated to make a positive impact on everyone he meets.\u003c/p\u003e","teachingVideoPlaybackId":"c5MJYm1LgMPQaqITAgmDzfx01ppjxcfrgoiAGupt02ImY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"d2262c7e-95c1-4414-8732-fa7451199a4d\"}"},{"__ref":"CausesSupported:{\"uuid\":\"0a7f4723-5784-4757-b81a-46c3fa827756\"}"}],"major":"Science, Technology \u0026 Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"97eb940e-0780-4038-9b79-8babb5125315\"}"},{"__ref":"DeepDives:{\"uuid\":\"86ea2d93-3c0b-461b-abae-8ad803e33b58\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b25c653-68ff-423c-8d9c-27b12876a846\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd0077ef-b75a-41d0-8051-d6f52b947b1a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/85233efe-4019-4287-b992-16c737def3cc/-/preview/-/format/jpg/","https://ucarecdn.com/3927158e-3f16-4c2c-aba6-7924ec9b2fa5/-/preview/-/format/jpg/","https://ucarecdn.com/7c18c449-75b8-4045-a3c4-6496813afe2c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"769de860-d847-4abd-9807-cac0d9bd4f5c\"}"},{"__ref":"Education:{\"uuid\":\"49bc2603-e669-4b11-8757-f34fe0df32c4\"}"}],"hiredAt":"2022-11-17T19:27:05.000Z","topics":["Sports Journalism","Medicine / Health","Sports Analytics"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"collin-pang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"68fc7a03-5dc4-463d-8fca-ced3c4264f81\"}"}}},"_sentryTraceData":"b387836fcb6c452199baf65010dc86f7-a1ba868cb88cc3f2-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc400851
