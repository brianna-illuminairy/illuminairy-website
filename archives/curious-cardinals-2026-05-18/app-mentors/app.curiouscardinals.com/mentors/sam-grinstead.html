}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a3c3351c-e3ad-4760-94d7-1ddde7d3de71\"}":{"__typename":"DeepDives","uuid":"a3c3351c-e3ad-4760-94d7-1ddde7d3de71","content":null,"videoPlaybackId":"zExJHpTXWaMeKZ7aj00yVWb3tJioxih6ks004QhAzD8Yk","question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"41bbff98-250a-45f8-a27a-2755a2539389\"}":{"__typename":"DeepDives","uuid":"41bbff98-250a-45f8-a27a-2755a2539389","content":null,"videoPlaybackId":"c01dbj8Y5NqnUsRzBQTPXIKTm5pRCNRSAdLN7anqZRHA","question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"769e0720-cf13-47f9-98fe-e04fa311eb99\"}":{"__typename":"School","uuid":"769e0720-cf13-47f9-98fe-e04fa311eb99","name":"Theodore Roosevelt High School","city":"Des Moines","type":"HIGH","state":"Iowa","country":"United States","zip":"50312"},"Education:{\"uuid\":\"b2b62fa3-30d0-45f8-afd7-bb532347550c\"}":{"__typename":"Education","uuid":"b2b62fa3-30d0-45f8-afd7-bb532347550c","school":{"__ref":"School:{\"uuid\":\"769e0720-cf13-47f9-98fe-e04fa311eb99\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"037319fa-39c4-4e06-8e62-06318a9cc568\"}":{"__typename":"School","uuid":"037319fa-39c4-4e06-8e62-06318a9cc568","name":"Iowa State University","city":"Ames","type":"COLLEGE","state":"Iowa","country":"United States","zip":"50011"},"Education:{\"uuid\":\"54e3c6be-29dc-47c6-897b-7f4796b2f5ef\"}":{"__typename":"Education","uuid":"54e3c6be-29dc-47c6-897b-7f4796b2f5ef","school":{"__ref":"School:{\"uuid\":\"037319fa-39c4-4e06-8e62-06318a9cc568\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Animal Ecology","degree":null},"MentorPublicProfile:{\"uuid\":\"1e3bead7-1ade-4272-b4fa-440fedc72bf1\"}":{"__typename":"MentorPublicProfile","uuid":"1e3bead7-1ade-4272-b4fa-440fedc72bf1","displayName":"Sam G.","slug":"sam-grinstead","biography":"\u003cp\u003eHi! I'm a scientist and Fulbright Scholar currently based in Manaus, Brazil, where I'm leading a study on chemical pollutants in commonly consumed fish. I’m living the dream many young scientists imagine—immersed in the breathtaking biodiversity of the Amazon Basin. My days are spent collecting fish from the rivers with gillnets, chemically analyzing tissue samples in a laboratory, digitizing these findings into data for statistical analysis, and then publishing my findings in peer reviewed journals. If you'd like to read one of my recent publications, you can find it here (copy and paste the link below into your browser):\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003ehttps://conbio.onlinelibrary.wiley.com/doi/full/10.1111/cobi.70110\u003c/u\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis experience is more than just a job—it's an adventure that fuels my passion for science and for sharing its wonders with others. Nothing would make me happier than helping you or your child discover that same spark.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy journey began in Iowa, where I grew up with a fascination for how nature works, which led me to a career in Ecological science. My research brought me to the Amazon—where I work affiliated with two of the premier international Amazonian research institutes; Federal University of Amazonas (UFAM), and the National Institute of Amazonian Research (INPA), an incredible experience that built the professional network and lifelong friendships with Brazilian scientists and American Fulbrighters that I have today.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring grad school, I taught several STEM courses and discovered how much I love breaking down complex topics and guiding students toward that “aha!” moment. I have four years of teaching experience at the university level, where I taught and developed curriculum for chemistry, physics, and calculus, with deepest expertise in biology, statistics, and data analysis. Before that, I spent three years tutoring high school students from underprivileged backgrounds in a range of subjects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy unorthodox path has given me a practical and diverse skill set for scientific research: advanced statistics and coding (the language of modern science), scientific writing and communication, international professionalism, multilingual ability, and—above all—hands-on experience in the full cycle of research. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI strongly believe that being a good scientist—or a good student—means seeing how different fields connect. You can’t do science without statistics to understand your data, and you need strong communication skills to share what you discover. I even believe that an eye for art helps you recognize the patterns and processes in nature.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you want to build a real-world research project, developing the skills necessary to be a scientist in any field, work on languages and communication, learn coding and statistics, get tutoring in almost any subject, or simply explore the topics that interest you most—I’m here to help. The scientific method, once understood, can be applied to any field. Too often, it's taught rigidly in ways that discourage budding researchers. I would be honored to help change that.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy mentoring style is centered on flexibility, clear communication, and building trust. I believe strong, positive relationships between student, parent, and mentor are the foundation for real progress and meaningful learning. What I want most from our sessions is to help you succeed at achieving your goals, and if something isn't working with my methods, just let me know. I'm happy to adjust my approach to fit what you and your child need.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm here to help you learn in a way that works for you. Let's figure it out together.\u003c/p\u003e","teachingVideoPlaybackId":"1gFxrLXbJVZNhPx027giNE1CLgWDZOR5uLNbcKSbmm2I","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy biggest dream was to work as a scientist studying fish in the Amazon, and last year I received a Fulbright research grant to do it.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e8cd6e21-0cde-4e1a-907e-68ffaf5163f7\"}"},{"__ref":"Favorites:{\"uuid\":\"a39db594-0009-4010-8fd9-19a460f4eb57\"}"},{"__ref":"Favorites:{\"uuid\":\"6281828e-18de-418a-ac85-1cc76f26e0fc\"}"}],"causesSupported":[],"major":"Animal Ecology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a70bbc60-97cb-4bdb-8df7-c5a2a36a0071\"}"},{"__ref":"DeepDives:{\"uuid\":\"57896624-9714-435e-92ad-6a7ebf325db0\"}"},{"__ref":"DeepDives:{\"uuid\":\"a3c3351c-e3ad-4760-94d7-1ddde7d3de71\"}"},{"__ref":"DeepDives:{\"uuid\":\"41bbff98-250a-45f8-a27a-2755a2539389\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d46ed0fd-06b5-4a2e-9c59-1e55a5f35633/-/preview/-/format/jpg/","https://ucarecdn.com/d0960ce8-7e8b-435e-9fca-24e195358990/-/preview/-/format/jpg/","https://ucarecdn.com/f2e8f359-c990-4f83-a7f1-0a710cae0ca5/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b2b62fa3-30d0-45f8-afd7-bb532347550c\"}"},{"__ref":"Education:{\"uuid\":\"54e3c6be-29dc-47c6-897b-7f4796b2f5ef\"}"}],"hiredAt":"2025-11-18T16:41:52.534Z","topics":["Geometry","K-5 Grade Math","Statisti
