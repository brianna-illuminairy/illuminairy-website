xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"603dc8e7-3444-4937-98d3-17553e05bb80\"}":{"__typename":"Favorites","uuid":"603dc8e7-3444-4937-98d3-17553e05bb80","photoUrl":"https://ucarecdn.com/0ba1015a-e047-43e6-846d-025bda003a69/","title":"The Inheritance Games","type":"BOOK"},"Favorites:{\"uuid\":\"33bef97c-ce22-47d0-abbe-4db2a9ef9bc9\"}":{"__typename":"Favorites","uuid":"33bef97c-ce22-47d0-abbe-4db2a9ef9bc9","photoUrl":"https://ucarecdn.com/9939a9f0-0b17-467f-9d4b-3b5ebf9de491/","title":"Legally Blonde","type":"MOVIE"},"Favorites:{\"uuid\":\"5a758956-15de-4231-bade-cb6524c1931a\"}":{"__typename":"Favorites","uuid":"5a758956-15de-4231-bade-cb6524c1931a","photoUrl":"https://ucarecdn.com/271e594b-0fcd-4f60-844c-348936899be1/","title":"Los Angeles","type":"CITY"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a6bc62cf-5eb0-4368-936d-beb60418a93b\"}":{"__typename":"DeepDives","uuid":"a6bc62cf-5eb0-4368-936d-beb60418a93b","content":"\u003cp\u003eSome of the most powerful moments in life happen when someone is in need and another person chooses to step in. I have always been drawn to roles centered on service and guidance, whether that means supporting students or volunteering at hospitals. My experiences with supporting others have shown me how meaningful it is to be trusted during moments of growth and vulnerability. Medicine represents that same responsibility on a deeper level. It combines lifelong learning and compassion while allowing me to make a tangible difference in people’s lives. Becoming a doctor would allow me to serve others with empathy, dedication, and purpose every single day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"69cd1ac3-b21b-4289-9e6c-25976994d9ba\"}":{"__typename":"DeepDives","uuid":"69cd1ac3-b21b-4289-9e6c-25976994d9ba","content":"\u003cp\u003eEvery time I hesitate, I think about how far my parents traveled so I would not have to. Growing up with immigrant parents shaped the way I view opportunity and hard work. I have always been aware that I have access to resources, education, and support systems they never had at my age, and that awareness motivates me to make the most of every chance I am given. Their sacrifices remind me that effort is a form of gratitude. Working toward goals they once dreamed of, not just for myself, but for themselves, pushes me to stay disciplined and resilient. I am motivated by the idea of honoring their journey while building my own, and I hope to pass that perspective on to students by encouraging them to recognize their opportunities, believe in their potential, and work with purpose.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"bfc31529-17e8-48e8-b10d-d7773e4938b3\"}":{"__typename":"DeepDives","uuid":"bfc31529-17e8-48e8-b10d-d7773e4938b3","content":"\u003cp\u003eBefore I ever learned how to explain a concept, I learned how to tell a story. In my spare time, I practice Kuchipudi, an Indian classical dance form I have been learning for over a decade. What began as just a sport to master has become a meaningful way for me to stay grounded in my culture while learning the values of discipline, respect, and gratitude. Through traditions like the \u003cem\u003enamaskaram\u003c/em\u003e, I am reminded to honor my teachers, my community, and the audiences who allow these stories to be shared.\u003c/p\u003e\u003cp\u003eOver the years, I have performed at temples and national events, experiences that taught me confidence and perseverance. However, my favorite role is supporting students by training younger dancers at my studio. I find purpose in helping students build skills, believe in themselves, and discover pride in their growth, both inside and outside the classroom.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f65bc1a6-c39c-47ef-8cbd-9f8f27fe1a14\"}":{"__typename":"DeepDives","uuid":"f65bc1a6-c39c-47ef-8cbd-9f8f27fe1a14","content":"\u003cp\u003eFor a long time, I believed success had a single definition and that I was always one step behind it. Growing up in the Bay Area, where academic pressure is constant, it often felt like everyone around me was always accomplishing so much, all at once. That environment made me question my own progress and overlook the value of my individual journey. I wish I had someone to remind me that growth isn’t a race and that comparing yourself to others only distracts you from your own potential. Now, I want to be that guiding presence for students. I strive to offer perspective, encouragement, and honesty, helping individuals recognize their unique strengths, build confidence, and understand that success looks different for everyone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"73496897-4425-4686-a703-9afdb54335fc\"}":{"__typename":"School","uuid":"73496897-4425-4686-a703-9afdb54335fc","name":"Foothill High School","city":"Pleasanton","type":"HIGH","state":"California","country":"United States","zip":"94588"},"Education:{\"uuid\":\"3d2fa27d-2603-449e-b50b-d00b26a923c5\"}":{"__typename":"Education","uuid":"3d2fa27d-2603-449e-b50b-d00b26a923c5","school":{"__ref":"School:{\"uuid\":\"73496897-4425-4686-a703-9afdb54335fc\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"2aee339f-8bd4-4f18-832c-a94e0cb381af\"}":{"__typename":"Education","uuid":"2aee339f-8bd4-4f18-832c-a94e0cb381af","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Psychobiology","degree":null},"MentorPublicProfile:{\"uuid\":\"132924ba-4512-4dfd-b991-4f5a23849973\"}":{"__typename":"MentorPublicProfile","uuid":"132924ba-4512-4dfd-b991-4f5a23849973","displayName":"Reva K.","slug":"reva-kasula-1","biography":"\u003cp\u003eHi! My name is Reva, and I am a second-year Psychobiology major at UCLA on the pre-med track. I chose this field because I have always been curious about how the brain, body, and behavior connect, and how science can be used to help people. My academic journey has pushed me to think critically, stay curious, and grow both inside and outside the classroom.\u003c/p\u003e\u003cp\u003eThroughout high school and college, I have built a strong foundation in psychology, biology, chemistry, and math. I completed AP Psychology, AP Biology, AP Chemistry, AP Calculus, and AP Statistics before moving into STEM courses at UCLA, including Physiology, Cell \u0026amp; Molecular Biology, Evolution and Ecology, General Chemistry, Clinical Psychology, Psychological Statistics, and Mathematics for Life Sciences. These experiences have shaped my analytical skills and taught me how to approach challenging material with confidence and persistence.\u003c/p\u003e\u003cp\u003eHowever, what matters most to me is mentorship. I know how overwhelming school can feel without guidance, and I have always loved being someone others can lean on. Through UCLA’s TRUST program, I design and teach habit-building workshops on goal-setting, time management, and mindfulness for youth groups across Los Angeles. Additionally, I volunteer as a Care Extender, assisting hospital staff with patient care and observing medical procedures. I have also completed EMT training, gaining hands-on experience in emergency care and patient assessment. Previously, I conducted neuroscience research at UCSB, where I co-authored a paper on acetylcholine receptors and decision-making, presented weekly findings, and analyzed behavioral data.\u003c/p\u003e\u003cp\u003eIn high school, I served as a Peer Advocate, creating mental health initiatives like Wellness Week and Peer Mentorship, and worked with the American Cancer Society, organizing Relay for Life and community fundraisers. These experiences taught me leadership, teamwork, and the importance of community impact.\u0026nbsp;\u003c/p\u003e\u003cp\u003eSo what does working with me look like? Sessions are structured, encouraging, and personalized. We might break down tough concepts step-by-step, build study systems that actually stick, map out a passion project, or practice essays and presentations. I also focus on broader skills like time management, confidence-building, and critical thinking, because success is more than just grades.\u003c/p\u003e\u003cp\u003eBeyond the classroom, I love doing Kuchipudi (Indian classical dance), trying new adventures whenever I can, and spending time in Tahoe year-round (snowboarding in the winter and jet skiing in the summer). I am also an avid reader (\u003cem\u003eThe Inheritance Games \u003c/em\u003eis a favorite) and a big \u003cem\u003eLegally Blonde\u003c/em\u003e fan; smart, driven, and stylish is always a win.\u003c/p\u003e\u003cp\u003eIf you are looking for someone who cares about learning, growth, and connection, I would love to be part of your journey!\u003c/p\u003e","teachingVideoPlaybackId":"E8LVc7kqh02yJT1g6rqB01Pxtpk1gbiIFiSJyaaWgBEZs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"603dc8e7-3444-4937-98d3-17553e05bb80\"}"},{"__ref":"Favorites:{\"uuid\":\"33bef97c-ce22-47d0-abbe-4db2a9ef9bc9\"}"},{"__ref":"Favorites:{\"uuid\":\"5a758956-15de-4231-bade-cb6524c1931a\"}"}],"causesSupported":[],"major":"Psychobiology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a6bc62cf-5eb0-4368-936d-beb60418a93b\"}"},{"__ref":"DeepDives:{\"uuid\":\"69cd1ac3-b21b-4289-9e6c-25976994d9ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"bfc31529-17e8-48e8-b10d-d7773e4938b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"f65bc1a6-c39c-47ef-8cbd-9f8f27fe1a14\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/112563ed-125f-4115-9ec9-f7795a879835/-/preview/-/format/jpg/","https://ucarecdn.com/8d5defa7-2568-4a21-b2d6-6d47706fe458/-/preview/-/format/jpg/","https://ucarecdn.com/19ff19e8-91f7-4fe5-8e8e-338bde32c3c2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3d2fa27d-2603-449e-b50b-d00b26a923c5\"}"},{"__ref":"Education:{\"uuid\":\"2aee339f-8bd4-4f18-832c-a94e0cb381af\"}"}],"hiredAt":"2025-12-02T23:27:40.144Z","topics":["Algebra I","Pre-Algebra","K-5 Grade Math","Algebra II","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Writing","Reading","History","College Essay Writing","Executive Function","Academic Coaching","K-6 Storybook","History Project","Creative Writing","Medicine / Health","STEM Project"],"communityBadg
