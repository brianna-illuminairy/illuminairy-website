xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"caedcdac-1d5c-4a58-bd42-0aad53288b57\"}":{"__typename":"Favorites","uuid":"caedcdac-1d5c-4a58-bd42-0aad53288b57","photoUrl":"https://ucarecdn.com/c354a3eb-965a-4ecc-9f9d-2974d0edd15d/","title":"Room on Fire","type":"ALBUM"},"Favorites:{\"uuid\":\"09550957-c4fb-4851-b767-9878840e77af\"}":{"__typename":"Favorites","uuid":"09550957-c4fb-4851-b767-9878840e77af","photoUrl":"https://ucarecdn.com/ea6e4180-b63d-41b4-b4b1-5759430dbe26/","title":"Anna Karenina","type":"BOOK"},"Favorites:{\"uuid\":\"5754fe7b-2321-4334-b316-f20a90cb208d\"}":{"__typename":"Favorites","uuid":"5754fe7b-2321-4334-b316-f20a90cb208d","photoUrl":"https://ucarecdn.com/61d4194d-92a1-45f0-9927-598738a9d6d8/","title":"Plants vs. Zombies","type":"GAME"},"CausesSupported:{\"uuid\":\"7cad8df9-25d1-4362-b634-0da1b6697ccd\"}":{"__typename":"CausesSupported","uuid":"7cad8df9-25d1-4362-b634-0da1b6697ccd","name":"Concerts for Compassion","description":"\u003cp\u003eMusic can and should inspire positive change far beyond the concert hall! \u003c/p\u003e","photoUrl":"https://ucarecdn.com/c7820142-308d-49f1-ae90-6117863ed3f7/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"84f679a8-9592-48ec-bbe4-6307905b8e42\"}":{"__typename":"DeepDives","uuid":"84f679a8-9592-48ec-bbe4-6307905b8e42","content":"\u003cp\u003eOriginally, I intended to major in cognitive science, but realized that my interests didn't align with the major requirements. Now, my combination of majors gives me more flexibility to take classes I love!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"086acc88-0e06-4c10-ab44-6ce7bd81cc60\"}":{"__typename":"DeepDives","uuid":"086acc88-0e06-4c10-ab44-6ce7bd81cc60","content":"\u003cp\u003eI like to think that the countless hours I've spent alone in the practice room have been spent \"mentoring\" myself. Sharing my experience and teaching younger students feels like a natural next step.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"087c0204-39f9-40ca-bf73-10e4fa0e4707\"}":{"__typename":"DeepDives","uuid":"087c0204-39f9-40ca-bf73-10e4fa0e4707","content":"\u003cp\u003eLike many high school students, I was a perfectionist. While being extremely self-critical helped me succeed in the short run, I lost sight of what really mattered to me. Perspective is something I always try to give to my students!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"b3602221-2fa0-4327-8405-1c982458bc5b\"}":{"__typename":"School","uuid":"b3602221-2fa0-4327-8405-1c982458bc5b","name":"San Luis Obispo High School","city":"San Luis Obispo","type":"HIGH","state":"California","country":"United States","zip":"93401"},"Education:{\"uuid\":\"8b35f558-2b13-4459-a541-1268af34a76e\"}":{"__typename":"Education","uuid":"8b35f558-2b13-4459-a541-1268af34a76e","school":{"__ref":"School:{\"uuid\":\"b3602221-2fa0-4327-8405-1c982458bc5b\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"058f96ba-15d9-4e48-bb60-a4b8b302db22\"}":{"__typename":"Education","uuid":"058f96ba-15d9-4e48-bb60-a4b8b302db22","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science, Anthropology, Music","degree":null},"MentorPublicProfile:{\"uuid\":\"db65d95d-9ec9-4f48-90f0-8edc6c8e7c5d\"}":{"__typename":"MentorPublicProfile","uuid":"db65d95d-9ec9-4f48-90f0-8edc6c8e7c5d","displayName":"Colin G.","slug":"colin-guan","biography":"\u003cp\u003eColin is a sophomore in the Columbia-Juilliard Exchange Program, concentrating in cello, computer science, and anthropology. He hopes to build a deeper understanding of people by gathering insights from each of these fields. He often wonders about the human experience, and only sometimes wonders why he is taking so many classes each semester.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school, Colin teaches cello at a NYC public school and organizes educational opportunities as a board member of Music Mentors Collaborative. Colin is also an executive board member of Columbia's Taiwanese American Students Association and a member of the Morningside Music Society.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a cellist, Colin is a laureate of national and international music competitions, and has performed across the US, Canada, and Europe in halls such as Carnegie Hall, Alice Tully Hall, The DiMenna Center, Jordan Hall, and the Shalin Liu Performing Arts Center. Recently, Colin had the opportunity to performing a charity concert with concert pianist Tiffany Poon for\u003cem\u003e Together with Classical\u003c/em\u003e, a classical music nonprofit for which he has served as Outreach Coordinator since the organization’s founding in 2020. He finds endless enjoyment in playing the classical repertoire (especially chamber music!) as well as collaborating with contemporary composers on new music.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eColin graduated as valedictorian from San Luis Obispo High School, and was the recipient of numerous scholarships for his community service and leadership. As a high school student, Colin worked closely with State Senator John Laird and the SLO County Office of Education to build up arts programs in public schools. The result of this partnership was “Music and You,” a series of educational short films shown in over 80 local schools and broadcasted on KSBY. Colin also founded and served as president of his school’s chapter of Tri-M Music Honor Society, organizing several fundraisers and multimedia performances for his community. In his free time, he enjoys reading, hiking, and cooking for friends and family. Colin is very excited to help younger students discover their unique passions!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"caedcdac-1d5c-4a58-bd42-0aad53288b57\"}"},{"__ref":"Favorites:{\"uuid\":\"09550957-c4fb-4851-b767-9878840e77af\"}"},{"__ref":"Favorites:{\"uuid\":\"5754fe7b-2321-4334-b316-f20a90cb208d\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"7cad8df9-25d1-4362-b634-0da1b6697ccd\"}"}],"major":"Computer Science, Anthropology, Music","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"84f679a8-9592-48ec-bbe4-6307905b8e42\"}"},{"__ref":"DeepDives:{\"uuid\":\"086acc88-0e06-4c10-ab44-6ce7bd81cc60\"}"},{"__ref":"DeepDives:{\"uuid\":\"087c0204-39f9-40ca-bf73-10e4fa0e4707\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bdc0bdaf-e6d3-45ac-a65a-ad2d8362c214/-/previe
