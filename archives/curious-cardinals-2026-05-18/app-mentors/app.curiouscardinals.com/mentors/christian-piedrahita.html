xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7dc03a7c-2961-4ff6-b1b1-b1f2b5b7e44e\"}":{"__typename":"Favorites","uuid":"7dc03a7c-2961-4ff6-b1b1-b1f2b5b7e44e","photoUrl":"https://ucarecdn.com/7a80e67c-626f-4481-8839-120a76ec719a/","title":"James Rodriguez","type":"ATHLETE"},"Favorites:{\"uuid\":\"006a049e-c141-4405-a32e-d0dca15ae202\"}":{"__typename":"Favorites","uuid":"006a049e-c141-4405-a32e-d0dca15ae202","photoUrl":"https://ucarecdn.com/99cf153e-98d7-4608-85ee-bf0f8d7d507e/","title":"Lord of the Flies","type":"BOOK"},"Favorites:{\"uuid\":\"cb01c0e5-0e29-4d7f-a823-ac6b519a7d1a\"}":{"__typename":"Favorites","uuid":"cb01c0e5-0e29-4d7f-a823-ac6b519a7d1a","photoUrl":"https://ucarecdn.com/7806253f-bfd7-4ee5-92b7-71e1dac84b98/","title":"Iron Man","type":"MOVIE"},"CausesSupported:{\"uuid\":\"900db648-5fc2-4f2f-a25f-971b0cc6155e\"}":{"__typename":"CausesSupported","uuid":"900db648-5fc2-4f2f-a25f-971b0cc6155e","name":"March of Dimes","description":"\u003cp\u003eI was born 3 months premature so this charity holds a special place in my heart.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/3bd35443-ebe3-4eff-8383-8ce280e08749/"},"CausesSupported:{\"uuid\":\"86926352-2257-44fe-b0bf-d555a1441a4e\"}":{"__typename":"CausesSupported","uuid":"86926352-2257-44fe-b0bf-d555a1441a4e","name":"Breakthrough T1D (formerly JDRF)","description":"\u003cp\u003eMy older brother grew up with T1D, I admire his resilience. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/b5f388b6-3152-44b1-b238-05c76e102334/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"31c35c2e-ea5c-43a2-b778-f7e7140f78ab\"}":{"__typename":"DeepDives","uuid":"31c35c2e-ea5c-43a2-b778-f7e7140f78ab","content":"\u003cp\u003eMy dream job is to be the founder of my own company, build it from the ground up and create something people want. Watch it flourish and then let someone else takeover once I retire. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2ef1d45e-9f60-4472-ba5b-aaf28c93a435\"}":{"__typename":"DeepDives","uuid":"2ef1d45e-9f60-4472-ba5b-aaf28c93a435","content":"\u003cp\u003eMentorship matters to me because I had a great mentor in high school and they were a major reason as to why I go into Cornell in the first place. I really want to be that person for someone else and to make a difference in someone's life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"68172a62-7ccd-4239-9bac-931e16bb0b77\"}":{"__typename":"DeepDives","uuid":"68172a62-7ccd-4239-9bac-931e16bb0b77","content":"\u003cp\u003eI would say that I was quite the \"over-achiever\" in high school. I was on the Model UN team, the robotics team, the soccer team and I mentored students. I honestly have no clue how I managed to complete of all that and looking back it may have been too much. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"2db59ce1-e2b0-4313-8082-64eef5f5e235\"}":{"__typename":"DeepDives","uuid":"2db59ce1-e2b0-4313-8082-64eef5f5e235","content":"\u003cp\u003eI hope to leave a great legacy in my lifetime, whether it be creating an amazing company and going public or having an amazing family. I want to leave a lasting impact on those around me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"cb24eec8-1cca-4773-835b-68a7f6c8adc2\"}":{"__typename":"School","uuid":"cb24eec8-1cca-4773-835b-68a7f6c8adc2","name":"Oceanside High School","city":"Oceanside","type":"HIGH","state":"New York","country":"United States","zip":"11572"},"Education:{\"uuid\":\"504ff4e6-ebd8-49be-88ca-ca32ac87090c\"}":{"__typename":"Education","uuid":"504ff4e6-ebd8-49be-88ca-ca32ac87090c","school":{"__ref":"School:{\"uuid\":\"cb24eec8-1cca-4773-835b-68a7f6c8adc2\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"addf19e2-ab2f-41e9-a20d-6ffee85e1771\"}":{"__typename":"Education","uuid":"addf19e2-ab2f-41e9-a20d-6ffee85e1771","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"e34dc0b5-c2e4-4828-b830-33d199f6b3c6\"}":{"__typename":"MentorPublicProfile","uuid":"e34dc0b5-c2e4-4828-b830-33d199f6b3c6","displayName":"Christian P.","slug":"christian-piedrahita","biography":"\u003cp\u003eHi! I’m Christian, a senior at Cornell University studying Computer Science, and I help students turn their curiosity about AI and Technology into amazing projects.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eA few years ago, I was a high school student who loved to debate current events, build cool robots and solve hard problems. Since then, I’ve:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCreated \u003cstrong\u003emachine learning programs\u003c/strong\u003e for target recognition for \u003cstrong\u003eCornell’s Unmanned Aerial Systems\u003c/strong\u003e team\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreated an \u003cstrong\u003eagentic financial platform\u003c/strong\u003e for \u003cstrong\u003eCornell’s FinTech Club\u003c/strong\u003e and presented the system to a corporate client in NYC\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilt a \u003cstrong\u003emobile management system\u003c/strong\u003e for pilots flying in the private aviation industry for a \u003cstrong\u003eYC startup\u003c/strong\u003e last summer\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences taught me not only how to build impactful applications for real clients, but also how to effectively communicate with both technical and non-technical audiences.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI mentor students who want to explore:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilding real-world AI applications\u003c/strong\u003e that involve turning an idea into a portfolio worthy project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTechnical communication\u003c/strong\u003e (presentations, documentation, pitch decks, and blog posts about AI and technology)\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI believe this new AI-era will be incredibly defining and crucial for the next generation of builders and founders. I am currently building my own startup and would love to inspire the next generation.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI was a mentor for middle school students in high school, I assisted their social and academic growth. I also volunteered at an after school program at a local elementary school and helped students complete their homework. In college, I have mentored the underclassmen that join the FinTech club and always try to be a support system throughout their time at Cornell.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurning an interesting idea into a working side project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFiguring out what you are passionate about and how to turn it into an amazing project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMapping out a step-by-step plan with milestones and goals to accomplish\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing how to present your progress so when it's time to shine in the classroom or at their job they do it with ease\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eOutside of Cornell\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI enjoy playing soccer and staying active. I also enjoy listening to all kinds of music and playing video games with my friends and my brothers.\u0026nbsp;\u003c/p\u003e\u003cp\u003eIf you’re curious, motivated, and ready to build something you’ll be proud of, I’d love to help you along your journey.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"TRYuyng9cS0116F9UZIJ3YD9SHVo3hNisll3m149Qp58","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI think as of right now, my greatest achievement was probably getting into Cornell Engineering. I knew since middle school that I wanted to go a school that was considered Ivy+. When I received my likely letter meaning they told me before Ivy Day, I felt such an immense weight lifted off my chest because I finally completed the goal I set myself for the best 6 years. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7dc03a7c-2961-4ff6-b1b1-b1f2b5b7e44e\"}"},{"__ref":"Favorites:{\"uuid\":\"006a049e-c141-4405-a32e-d0dca15ae202\"}"},{"__ref":"Favorites:{\"uuid\":\"cb01c0e5-0e29-4d7f-a823-ac6b519a7d1a\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"900db648-5fc2-4f2f-a25f-971b0cc6155e\"}"},{"__ref":"CausesSupported:{\"uuid\":\"86926352-2257-44fe-b0bf-d555a1441a4e\"}"}],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"31c35c2e-ea5c-43a2-b778-f7e7140f78ab\"}"},{"__ref":"DeepDives:{\"uuid\":\"2ef1d45e-9f60-4472-ba5b-aaf28c93a435\"}"},{"__ref":"DeepDives:{\"uuid\":\"68172a62-7ccd-4239-9bac-931e16bb0b77\"}"},{"__ref":"DeepDives:{\"uuid\":\"2db59ce1-e2b0-4313-8082-64eef5f5e235\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e4d0c961-4a86-4c18-9ace-6b80c9e8cb0d/-/preview/-/format/jpg/","https://ucarecdn.com/8b62109c-831b-4e8d-b163-3d315b9bfa59/-/preview/-/format/jpg/","https://ucarecdn.com/cc53595b-0604-46fa-b42f-25adaf5b0dfe/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"504ff4e6-ebd8-49be-88ca-ca32ac87090c\"}"},{"__ref":"Education:{\"uuid\":\"addf19e2-ab2f-41e9-a20d-6ffee85e1771\"}"}],"hiredAt":"2025-12-23T09:51:20.665Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Biology","Chemistry","Writing","Spanish","Academic Coaching","College Essay Writi
