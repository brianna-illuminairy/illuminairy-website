xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4f3e4e68-a953-40aa-9e9b-8eabffe42476\"}":{"__typename":"Favorites","uuid":"4f3e4e68-a953-40aa-9e9b-8eabffe42476","photoUrl":"https://ucarecdn.com/e1dad377-d276-4916-ada5-ba91c371f07d/","title":"Volleyball","type":"SPORT"},"Favorites:{\"uuid\":\"d8436f13-5aea-4e4f-9b6b-5f717e6c3ee7\"}":{"__typename":"Favorites","uuid":"d8436f13-5aea-4e4f-9b6b-5f717e6c3ee7","photoUrl":"https://ucarecdn.com/c0b0f912-c838-4a61-b035-8d7d3106f7bb/","title":"The House on Mango Street","type":"BOOK"},"Favorites:{\"uuid\":\"cb19c708-f1fc-4f3a-8e43-513ebcfd466d\"}":{"__typename":"Favorites","uuid":"cb19c708-f1fc-4f3a-8e43-513ebcfd466d","photoUrl":"https://ucarecdn.com/7a382349-e8a0-444e-8fc2-59dcfe7e87ad/","title":"Pride and Prejudice (2005!)","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"88778c74-1fb4-48c1-adc6-b8dd4cf04a9f\"}":{"__typename":"DeepDives","uuid":"88778c74-1fb4-48c1-adc6-b8dd4cf04a9f","content":"\u003cp\u003e\u003cstrong\u003eDon’t be afraid to ask that question!\u003c/strong\u003e\u003cbr\u003eThere were so many times in high school when I listened to a talk or lecture from someone whose work really inspired me, but I was too nervous to start a conversation or ask a question. Over time, I’ve learned that some of the most meaningful opportunities come from simply reaching out, whether that’s asking for advice or sending an email  with a thoughtful question. Most professionals are excited to talk to passionate students! I’d tell my younger self that curiosity is a strength and one brave question can open doors you never expected.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"4632bf7c-88d3-483e-9d19-43a5cff72fea\"}":{"__typename":"DeepDives","uuid":"4632bf7c-88d3-483e-9d19-43a5cff72fea","content":"\u003cp\u003e\u003cstrong\u003eMy greatest source of motivation is my parents,\u003c/strong\u003e who have always supported my dreams, no matter how big. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"af890d1b-1706-4761-a2cd-03e133d01ca0\"}":{"__typename":"DeepDives","uuid":"af890d1b-1706-4761-a2cd-03e133d01ca0","content":"\u003cp\u003e\u003cstrong\u003eIn my lifetime, I hope to successfully hike Mount Kilimanjaro! \u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2f9dafc2-c90c-491d-b290-4b72591305e9\"}":{"__typename":"DeepDives","uuid":"2f9dafc2-c90c-491d-b290-4b72591305e9","content":"\u003cp\u003eThroughout my journey, I’ve had incredible mentors, from older students to physicians, who supported me when I felt uncertain or overwhelmed. They helped me see new paths, stay grounded through challenges, and pursue goals I once thought were out of reach. Through those relationships, I learned that mentorship isn’t just about guidance, it’s also about believing in someone even when they're facing challenges. That’s why I’m so passionate about mentoring younger students: I want to provide the same encouragement and perspective that helped me grow, and to show them that curiosity and persistence can take them further than they imagine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"3e9011e1-d614-40d9-abec-94bab94e629e\"}":{"__typename":"School","uuid":"3e9011e1-d614-40d9-abec-94bab94e629e","name":"Columbia Grammar \u0026 Preparatory School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10025"},"Education:{\"uuid\":\"e0df2f5e-31ca-4689-9b0f-b319ac2b84ab\"}":{"__typename":"Education","uuid":"e0df2f5e-31ca-4689-9b0f-b319ac2b84ab","school":{"__ref":"School:{\"uuid\":\"3e9011e1-d614-40d9-abec-94bab94e629e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"f5f75688-8c7e-4e92-852b-3c60cb55e115\"}":{"__typename":"Education","uuid":"f5f75688-8c7e-4e92-852b-3c60cb55e115","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"bacf825e-8ac2-4b06-9c26-208be96b45b0\"}":{"__typename":"MentorPublicProfile","uuid":"bacf825e-8ac2-4b06-9c26-208be96b45b0","displayName":"Fabiha R.","slug":"fabiha-rafrafin","biography":"\u003cp\u003eHi! I’m Fabiha, an MSc student at UCL studying Infancy and Early Childhood Development. I'm passionate about medicine, research, and education! I love working with students and have experience teaching and mentoring students from elementary to high school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMore about me:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI recently graduated from Yale University, where I majored in Cognitive Science, was an Education Studies Scholar, and completed pre-medical coursework. I’ve always been an interdisciplinary learner, deeply interested in health, education, and community. My experiences reflect that passion:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI conducted a senior thesis investigating social disjunctive inference in infants from 13 to 18 months\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI designed an Education Studies Capstone project reimagining math instruction for third graders in NYC through creativity and social-emotional learning\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI brought the NYC-based non-profit Girls Learning Advanced Math (GLAM) to New Haven and served as Regional Director for four years\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI Co-Directed the South Asian Youth Initiative Conference, where I organized panels on environmental justice, public health, mental health, and more for 700+ students across 50+ institutions.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI interned at the NYU Langone Department of Ophthalmology where I joined a healthcare team and learned to communicate with patients and medical professionals in\u0026nbsp; fast-paced clinical settings\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThrough these roles, I’ve learned how to pursue diverse passions at a high level, and how to help others do the same.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy specialty:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love working with students who want to explore:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eScientific research, especially in neuroscience or psychology (learning to critically analyze scientific literature, conduct literature reviews, joining research labs)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eResearch competitions, such as ISEF and JSHS, from developing ideas to crafting strong presentations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding nonprofits or community-based projects, particularly initiatives in health, education, or equity\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also help students build confidence as speakers, learn to network effectively, and identify programs or internships that align with their interests.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have experience guiding students in starting nonprofits, discovering niche passions in science research, building connections with Principal Investigators, compete successfully in research competitions, and securing internships that suit their interests!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might include:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFine-tuning broad interests into focused project or research ideas\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating structured short- and long-term plans with achievable goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReviewing journal articles and complex topics and/or methods\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSimulating research competition environments, including Q\u0026amp;A sessions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing public speaking and pitching ideas to professionals\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eFun facts:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love photography, exploring nature, and picking up new creative skills (I’m currently experimenting with oil pastels!). I also enjoy cooking and recently made French onion soup for the first time!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re a motivated student eager to turn your ideas into something tangible, I’d love to support you!\u003c/p\u003e","teachingVideoPlaybackId":"oWfBGlgWWkC400vHJrOG7b2cwPXVAWnp00Mb2pGuTj4Oo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4f3e4e68-a953-40aa-9e9b-8eabffe42476\"}"},{"__ref":"Favorites:{\"uuid\":\"d8436f13-5aea-4e4f-9b6b-5f717e6c3ee7\"}"},{"__ref":"Favorites:{\"uuid\":\"cb19c708-f1fc-4f3a-8e43-513ebcfd466d\"}"}],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"88778c74-1fb4-48c1-adc6-b8dd4cf04a9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"4632bf7c-88d3-483e-9d19-43a5cff72fea\"}"},{"__ref":"DeepDives:{\"uuid\":\"af890d1b-1706-4761-a2cd-03e133d01ca0\"}"},{"__ref":"DeepDives:{\"uuid\":\"2f9dafc2-c90c-491d-b290-4b72591305e9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f336c85c-461b-4fa1-81a9-dfc1b0dba755/-/preview/-/format/jpg/","https://ucarecdn.com/31d2d138-26bb-474b-a7f9-39552ca74858/-/preview/-/format/jpg/","https://ucarecdn.com/755079be-a7c3-413d-8a59-4a5b9b8b582d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e0df2f5e-31ca-4689-9b0f-b319ac2b84ab\"}"},{"__ref":"Education:{\"uuid\":\"f5f75688-8c7e-4e92-852b-3c60cb55e115\"}"}],"hiredAt":"2025-10-21T20:57:27.959Z","topics":["Fashion / Cosmetics","History Project","Business / Entrepreneurship","Medicine / Health","STEM Project","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf27
