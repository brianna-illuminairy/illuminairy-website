xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"863e34d0-bab4-4e3f-b47c-c3205f1c3659\"}":{"__typename":"DeepDives","uuid":"863e34d0-bab4-4e3f-b47c-c3205f1c3659","content":"\u003cp\u003eMy greatest source of motivation is compassion.\u003c/p\u003e\u003cp\u003eI am deeply moved by the belief that people matter—individually, intellectually, and spiritually. Compassion, for me, is not just empathy; it is the commitment to act thoughtfully and responsibly for the good of others. It is what drives my interest in theology and ethics, and it is what shapes the way I approach leadership and mentorship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0b2e2279-ccfd-4d5d-83c4-c8239b9c835d\"}":{"__typename":"DeepDives","uuid":"0b2e2279-ccfd-4d5d-83c4-c8239b9c835d","content":"\u003cp\u003eI love fly fishing and spending time outdoors. Born and raised in Colorado, my life was shaped by exploration and adventure, early mornings in the mountains, long hikes, and days spent on the water. The outdoors is where I feel most grounded and attentive.\u003c/p\u003e\u003cp\u003eIf I have the time and the river conditions cooperate, you’ll likely find me knee-deep in a cold current, patiently casting and hoping to land a brown trout.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"46fc6c27-b57a-4b8f-8221-1a294ba6ccd2\"}":{"__typename":"DeepDives","uuid":"46fc6c27-b57a-4b8f-8221-1a294ba6ccd2","content":"\u003cp\u003eI chose to double major in Political Science and Religion because I was drawn to the space where those two disciplines meet. I’ve always been fascinated by how belief shapes public life; how theological convictions inform political theory, law, policy, and cultural movements. Rather than treating religion and politics as separate spheres, I saw an opportunity to study their interplay in a rigorous and creative way.\u003c/p\u003e\u003cp\u003ePursuing both majors required intellectual range. Political Science trained me to think analytically about institutions, governance, and power. Religion pushed me to wrestle with foundational questions about meaning, morality, and human nature. Bringing them together allowed me to ask more integrated questions: How do moral frameworks influence public policy? How does religious freedom function within pluralistic democracies? What responsibilities do leaders have when belief and law intersect?\u003c/p\u003e\u003cp\u003eFinding that “in-between” space took initiative. It meant designing research projects that crossed disciplinary boundaries and being willing to approach familiar debates from a different angle. That creative synthesis became one of my greatest strengths. It shaped my academic voice, refined my research interests, and ultimately prepared me for advanced study at the graduate level.\u003c/p\u003e\u003cp\u003eMost importantly, choosing those majors reflected how I see the world. Ideas do not live in isolation. Faith influences culture. Culture shapes institutions. Institutions affect people’s lives. Studying both Political Science and Religion gave me the tools to think carefully about that full picture, and it continues to shape the questions I pursue today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9bbf58d0-2fab-4e89-81ec-d838f30f9456\"}":{"__typename":"DeepDives","uuid":"9bbf58d0-2fab-4e89-81ec-d838f30f9456","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would be to make more memories and explore what truly excites me without hesitation. I was fortunate to compete in \u003cem\u003eWe the People\u003c/em\u003e, a national constitutional analysis competition, and that experience allowed me to “try on many hats”, from debating legal principles to analyzing political philosophy, and ultimately sparked my interest in law, politics, and public service. I would tell myself to embrace every opportunity like that, experiment widely, and not be afraid to discover new passions along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"79bd195e-75a8-4091-ab8b-777aae851bb0\"}":{"__typename":"School","uuid":"79bd195e-75a8-4091-ab8b-777aae851bb0","name":"Grandview High School","city":"Aurora","type":"HIGH","state":"Colorado","country":"United States","zip":"80016"},"Education:{\"uuid\":\"c59fbf38-7835-4526-b2f0-bfe9a57ce4e7\"}":{"__typename":"Education","uuid":"c59fbf38-7835-4526-b2f0-bfe9a57ce4e7","school":{"__ref":"School:{\"uuid\":\"79bd195e-75a8-4091-ab8b-777aae851bb0\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9895b04a-b026-4fbd-bb5e-d069f07019e7\"}":{"__typename":"School","uuid":"9895b04a-b026-4fbd-bb5e-d069f07019e7","name":"Baylor University","city":"Waco","type":"COLLEGE","state":"Texas","country":"United States","zip":"76706"},"Education:{\"uuid\":\"7a6548d1-dfa7-48a5-94e7-6d744a530afd\"}":{"__typename":"Education","uuid":"7a6548d1-dfa7-48a5-94e7-6d744a530afd","school":{"__ref":"School:{\"uuid\":\"9895b04a-b026-4fbd-bb5e-d069f07019e7\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Political Science and Religion","degree":null},"MentorPublicProfile:{\"uuid\":\"0c850230-c663-4356-be94-6748a3a961a6\"}":{"__typename":"MentorPublicProfile","uuid":"0c850230-c663-4356-be94-6748a3a961a6","displayName":"Lily D.","slug":"lily-davis","biography":"\u003cp\u003eI am a student leader and theology scholar passionate about helping students think deeply, lead courageously, and connect their beliefs to the world around them. As a Master’s student in theology, I study how faith, ethics, and public life intersect—asking questions like: What does it mean to be human? How should we care for others? How do our convictions shape the way we lead, learn, and serve?\u003c/p\u003e\u003cp\u003eMentorship matters to me because I know how formative it is to have someone take your questions seriously. I work to create spaces where students can wrestle with big ideas—about faith, justice, leadership, identity, and vocation—in ways that are intellectually rigorous and personally meaningful.\u003c/p\u003e\u003cp\u003eBeyond the classroom, I have served as Student Body President and have been deeply involved in student governance at both Baylor University and Yale University. Through the Big 12 Academic Conference, I participated in four lobbying trips to the White House, advocating for college affordability, protection of the Pell Grant, and expanded mental health resources for students. These experiences taught me how student voices can shape national conversations—and I love helping younger students see that their voices matter, too.\u003c/p\u003e\u003cp\u003eI have also worked for a religious freedom law firm, exploring the intersection of political philosophy, constitutional law, and religion. That experience strengthened my ability to guide thoughtful discussions across differences and model civil, principled dialogue—skills that are essential for students navigating today’s complex cultural landscape.\u003c/p\u003e\u003cp\u003eOn campus, I organized a large-scale food insecurity initiative that secured $15,000 in funding from student parking ticket revenue to support students in need. Service is not just an idea for me; it is a practice. I want students to see that leadership combines reflection with action.\u003c/p\u003e\u003cp\u003eAs a mentor, my goal is to help students build confidence in their thinking, clarity in their convictions, and compassion in their leadership. Whether your student wants to explore theology, public policy, ethics, or simply learn how to articulate their ideas more effectively, I am committed to meeting them where they are and helping them grow.\u003c/p\u003e\u003cp\u003eIf your student is curious, thoughtful, and eager to wrestle with meaningful questions, I would be honored to mentor them.\u003c/p\u003e","teachingVideoPlaybackId":"iOS700shtHauMU4VcJ3yNa00PJAlqIfzU9UJf8ciKIDiE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Political Science and Religion","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"863e34d0-bab4-4e3f-b47c-c3205f1c3659\"}"},{"__ref":"DeepDives:{\"uuid\":\"0b2e2279-ccfd-4d5d-83c4-c8239b9c835d\"}"},{"__ref":"DeepDives:{\"uuid\":\"46fc6c27-b57a-4b8f-8221-1a294ba6ccd2\"}"},{"__ref":"DeepDives:{\"uuid\":\"9bbf58d0-2fab-4e89-81ec-d838f30f9456\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/efd24eb4-6ed3-47c8-9a46-9d8ea39909d8/-/preview/-/format/jpg/","https://ucarecdn.com/db62d03b-ddfd-48d3-97a9-03f749944bb0/-/preview/-/format/jpg/","https://ucarecdn.com/cbb14235-8e5b-40d5-9b17-8ec6c40434f1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c59fbf38-7835-4526-b2f0-bfe9a57ce4e7\"}"},{"__ref":"Education:{\"uuid\":\"7a6548d1-dfa7-48a5-94e7-6d744a530afd\"}"}],"hiredAt":"2026-02-25T21:52:58.192Z","topics":["Creative Writing","Visual Arts / Graphic Design","History Project","Business / Entrepreneurship","Law / Government / Policy","Public Speaking","Debate"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lily-davis\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0c850230-c663-4356-be94-6748a3a961a6\"}"}}},"_sentryTraceData":"71fda0b12e494cb483301b4253825711-a99ac6db11445d0b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=71fda0b12e494cb483301b4253825711,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"lily-davis"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
