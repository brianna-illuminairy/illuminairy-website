l:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Applied Math","degree":null},"MentorPublicProfile:{\"uuid\":\"15a24976-0c54-4753-87cd-e7cc3b1dea23\"}":{"__typename":"MentorPublicProfile","uuid":"15a24976-0c54-4753-87cd-e7cc3b1dea23","displayName":"Valentina D.","slug":"valentina-doerretorres","biography":"\u003cul\u003e\u003cli\u003e\u003cp\u003eHi! My name is Valentina, I studied applied math and environmental engineering at Harvard University. \u003cbr\u003eI'm originally from Boston, MA, and both my parents are immigrants (my mother is Colombian and my father is German) so I grew up trilingual. That means we could speak in Spanish and German together!\u003cbr\u003e\u003cbr\u003eI'm passionate about caring for our environment and our bodies as an extension of that environment. I try to live in a way that supports this passion; at Harvard, I did research in a computational biology lab working on NASA's Global Ecosystem Dynamics Investigation. This project mounted lasers on the international space station to make 3D maps of the world's forests. These maps and data help scientists (like me and my lab) understand more about how climate change is impacting global forests. \u003cbr\u003eSupporting the environment and my body has also meant traveling to Germany for some months in 2023 to work on a Bio-Dynamic farm. There I learned about zero-waste, low-carbon, community living, and organic farming. \u003cbr\u003eIn my free time, I'm usually active and outdoors; running (I did track for 8 years), camping, hiking, biking, climbing... anything to celebrate and explore the way my body can move and the natural world around me. I have even taken up Jiu Jitsu and Tai Chi recently!\u003cbr\u003e\u003cbr\u003eI'm also a big creator: for the past year, I have worked as an audio designer for theater productions in Boston. The main goal of my creativity is to intentionally design safe spaces of community expression and experience. I do this mostly through music, but also set design, poetry, writing, and new media forms (video, website design, 3D modeling), and always in collaboration with friends.\u003cbr\u003e\u003cbr\u003eAs a mentor, my goal is to create a safe space for mentees that honors and supports their whole selves - academic, artist, (even a human being in a body that sometimes just needs to drink some water and stretch). I understand that in order to learn, students must be actively engaged through questions, discussions, and even movement. I believe in experimentation and making mistakes in order to grow!!! In our time together I hope to offer mentees encouragement and guidance that allows them to flourish as engaged learners.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"02r6Wen01mQ1NaILLk009mMd01UsHXraSC8QXa99dMkDCDw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am so proud of myself for engaging with creativity. As an applied math major, high school and my first two years of college were super STEM-heavy. I believed I didn't have time for creativity. Recently, that perspective completely changed, and I've now composed music for more than three theater and film productions. I am still in awe at myself for how quickly these skills developed. It made me believe that anything is truly possible and just how important it is to be creative. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4e66cb3f-729a-47c4-851d-5005f5edff7a\"}"},{"__ref":"Favorites:{\"uuid\":\"83fbe525-0a79-41fa-a37d-2e7879a278ee\"}"},{"__ref":"Favorites:{\"uuid\":\"5f27ca5a-b0c4-49b8-a015-8eccef214fb2\"}"}],"causesSupported":[],"major":"Applied Math","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"26a3678f-3810-4b63-a344-3f1bbbbf854a\"}"},{"__ref":"DeepDives:{\"uuid\":\"35a46ada-62ef-488d-81b0-88b9f6d7216c\"}"},{"__ref":"DeepDives:{\"uuid\":\"160c173b-874a-4656-9762-f8a5ba6e5a95\"}"},{"__ref":"DeepDives:{\"uuid\":\"d4c436f0-630b-46
