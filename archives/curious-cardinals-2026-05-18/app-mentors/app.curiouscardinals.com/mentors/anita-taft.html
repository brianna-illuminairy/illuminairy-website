tion","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a7544a00-97c6-4743-9591-e862403a6905\"}":{"__typename":"DeepDives","uuid":"a7544a00-97c6-4743-9591-e862403a6905","content":"\u003cp\u003e\u003cstrong\u003eyour interests can be interdisciplinary! don't box yourself. \u003c/strong\u003ecombine the things you love since the most interesting work happens in the overlap.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"7dcdda83-b382-4e45-9769-ab1f28859ebe\"}":{"__typename":"School","uuid":"7dcdda83-b382-4e45-9769-ab1f28859ebe","name":"BASIS Independent Silicon Valley Upper School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95126"},"Education:{\"uuid\":\"c7878df5-2d5c-4f0b-85cd-cb2e4c11e723\"}":{"__typename":"Education","uuid":"c7878df5-2d5c-4f0b-85cd-cb2e4c11e723","school":{"__ref":"School:{\"uuid\":\"7dcdda83-b382-4e45-9769-ab1f28859ebe\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"481ba980-c514-4d3a-b32f-4aed415c381e\"}":{"__typename":"Education","uuid":"481ba980-c514-4d3a-b32f-4aed415c381e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"c957cd48-ef6c-46f6-8fc4-1dd3c8433aa9\"}":{"__typename":"MentorPublicProfile","uuid":"c957cd48-ef6c-46f6-8fc4-1dd3c8433aa9","displayName":"Anita T.","slug":"anita-taft","biography":"\u003cp\u003eHello! I’m Anita, a first-year postbac researcher at the National Institute of Child Health and Human Development (NIH). I recently graduated from Stanford University (2024) with Honors in Human Biology with a concentration in Reproductive medicine, justice, and ethics. I also pursued a minor in Global Studies, which equipped me with an understanding of the cultural and historical context of communities to help address the complexities of global healthcare. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about helping students identify projects that align with their niche interests from creating a podcast to leading an independent qualitative research project. \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLove for teaching: \u003c/strong\u003eBefore college, I was a summer camp counselor at a Persian school teaching young kids Farsi. That instilled in me a passion for mentoring students and finding love in seeing their growth! \u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHealth Equity: \u003c/strong\u003eA really formative experience for me was volunteering and being student manager at the Cardinal Free Clinics to provide transitional healthcare for uninsured patients. A life-long goal of mine is to create diverse models of primary care and to make healthcare more accessible for the underserved. \u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFulbright Scholarship: \u003c/strong\u003eAfter graduation, I combined my love for women's health and global studies to pursue a Fulbright in Tajikistan where I researched nutrition and breastfeeding practices amongst mothers. In Sri Lanka, I worked with the International Planned Parenthood to assess service delivery gaps in centers that provide gender based violence.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNIH researcher: \u003c/strong\u003eCurrently, I am a researcher at the National Institutes of Health where I am assessing the relationship between maternal feeding behaviors and diet quality on child health outcomes.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eOverall, my interests include advancing maternal health, global health equity, and community-based healthcare solutions. \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI specialize in guiding K-12 students through:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege-readiness projects \u003c/strong\u003e(connecting you with STEM high school internships and research experiences, competitions, and conferences). \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003c/strong\u003e (creating a podcast, starting a club like GirlUP, and advocating to pass a bill)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch mentorship\u003c/strong\u003e (learning about the research process, designing a project, and presenting your findings to a national audience at conferences)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eApplying to competitive scholarships: \u003c/strong\u003eDuring/after graduating college, I can provide advice on how to write a personal statement for very competitive grants like Fulbright or the NIH.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy podcasting and Persian poetry!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"C1Lvddi6bbH01uRDj00018K0202M2rYvqu7g01kgjWafRhp5k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Biology","deepD
