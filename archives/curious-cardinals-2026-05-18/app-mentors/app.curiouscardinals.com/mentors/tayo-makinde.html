xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"fc05d890-60b1-4633-b61f-085d1d26b20a\"}":{"__typename":"DeepDives","uuid":"fc05d890-60b1-4633-b61f-085d1d26b20a","content":"\u003cp\u003eBeing a Nigerian immigrant has shaped the way I approach teaching and learning. Growing up between cultures helped me understand that people often process ideas in different ways and at different speeds. Because of that, I try to be patient and flexible when working with students. I focus on creating a supportive environment where questions are welcome and where students feel comfortable working through confusion while building confidence in their abilities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9a3af5d0-38ec-4ee2-993f-bfebecbd41ed\"}":{"__typename":"DeepDives","uuid":"9a3af5d0-38ec-4ee2-993f-bfebecbd41ed","content":"\u003cp\u003eI was always interested in building things and figuring out how technology functions behind the scenes. Computer engineering allows me to combine problem solving with creativity while working on projects that connect code with real physical systems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a92406b8-872a-4c7b-a66e-4af614126df1\"}":{"__typename":"DeepDives","uuid":"a92406b8-872a-4c7b-a66e-4af614126df1","content":"\u003cp\u003eMy greatest source of motivation is my family, especially my parents and grandparents. Their sacrifices and hard work created opportunities that would not have been possible otherwise. Seeing the effort they put into building a better future for the next generation pushes me to take my education seriously and make the most of the opportunities I have been given.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"ae719e6d-f12a-4841-b548-acc719b3d3da\"}":{"__typename":"DeepDives","uuid":"ae719e6d-f12a-4841-b548-acc719b3d3da","content":"\u003cp\u003eI value mentorship because I know how powerful it can be to have someone guide you through challenges. There were many moments growing up when I had to figure things out on my own, so I try to be the person I did not always have\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"33c2ed0a-fdb7-445e-a5c2-8376051981b1\"}":{"__typename":"School","uuid":"33c2ed0a-fdb7-445e-a5c2-8376051981b1","name":"Georgetown Preparatory School","city":"North Bethesda","type":"HIGH","state":"Maryland","country":"United States","zip":"20852"},"Education:{\"uuid\":\"9c333f62-3419-4bdb-b1d5-878ee2e94861\"}":{"__typename":"Education","uuid":"9c333f62-3419-4bdb-b1d5-878ee2e94861","school":{"__ref":"School:{\"uuid\":\"33c2ed0a-fdb7-445e-a5c2-8376051981b1\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"fdf9d870-0411-4477-aa0f-d065e2f0743e\"}":{"__typename":"Education","uuid":"fdf9d870-0411-4477-aa0f-d065e2f0743e","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"94c6ad3c-84eb-4043-bb9f-3cd9888ff99b\"}":{"__typename":"MentorPublicProfile","uuid":"94c6ad3c-84eb-4043-bb9f-3cd9888ff99b","displayName":"Tayo M.","slug":"tayo-makinde","biography":"\u003cp\u003eHi! I'm Tayo Makinde, a Computer Engineering student at Brown University. I have always been drawn to building things and understanding how the world around us works. When I was younger I found a lot of joy in taking things apart and trying to recreate ideas that I saw online or in books. That curiosity eventually grew into a deeper interest in engineering and technology. Studying computer engineering has given me the chance to explore that curiosity in a more structured way while still leaving room for creativity.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eRight now that curiosity shows up through the technical projects I work on both in and out of class. I have experience with front end and back end web development and have built websites for both personal clients and local businesses. I have also spent time working with Raspberry Pi mini computer systems and small first person drones. These kinds of projects have helped me understand how software interacts with physical hardware and how small design decisions can affect how a system behaves in the real world.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eMy experience creating projects also shapes the way I approach tutoring and mentorship. When you build something from scratch you quickly realize that understanding the process matters far more than memorizing an answer. Because of this I try to guide students toward the reasoning behind a solution rather than simply presenting the final result. When a student works through the logic step by step they begin to recognize patterns that apply to other problems. My ultimate goal is to help my students develop the confidence to approach difficult problems independently while knowing they have support when they need it.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eOutside of class I enjoy staying active. I run track at Brown, which has been a great way to balance\u0026nbsp; rigorous academics with physical activity. Recently I have also started curling, which has been a fun way to learn a sport that is very different from anything I had tried before. In addition to sports I have recently picked up the piano.Spending time practicing music gives me a creative outlet that contrasts nicely with the technical focus of engineering coursework.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"rdJAxMig5k4iLzN5SHBt63QM7eY9edYxR8J5G015XkSQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fc05d890-60b1-4633-b61f-085d1d26b20a\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a3af5d0-38ec-4ee2-993f-bfebecbd41ed\"}"},{"__ref":"DeepDives:{\"uuid\":\"a92406b8-872a-4c7b-a66e-4af614126df1\"}"},{"__ref":"DeepDives:{\"uuid\":\"ae719e6d-f12a-4841-b548-acc719b3d3da\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9256e0c7-b500-461c-98f0-6181d31458f0/-/preview/-/format/jpg/","https://ucarecdn.com/542e3734-4a75-4a02-9ebf-dd68d6d977e3/-/preview/-/format/jpg/","https://ucarecdn.com/ef01dcf6-b986-4a51-89
