mple, at Yale, he is the treasurer of the Yale Mexican Student Organization. On campus, he also serves as the treasurer for Yale Alternative Investments, and is a member of the Club Lacrosse and Soccer teams.\n\nBefore matriculating at Yale, Patricio attended Staples High School in CT, where he graduated in the top 4% of his class, served as the President of the National Honors Society, led his Church Youth Group, was the MVP of the Varsity soccer team and was a named the Staples Boys’ Soccer Scholar Athlete.\n\nOutside of the classroom, Patricio enjoys reading, running, hiking, and cooking! Patricio loves to cook traditional Mexican cuisines, but he also enjoys learning about new gastronomies on his several trips.\n\nLastly, next summer, Patricio will be working at Goldman Sachs as an Investment Banking Summer Analyst. He plans to begin his career in Finance, with the hope of entering the sports industry in the future within his hometown of Mexico City. Please feel free to reach out, as he can’t wait to get started!\n\nPatricio is passionate about helping others, and loves to help students understand and master material, which motivated him to join the Curious Cardinals team. ","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics and Philosophy ","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/6574fb4e-acc1-482e-8580-59cb258c9427/-/crop/543x544/0,286/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7fd5b5c2-4319-47a7-be55-690c7d799970\"}"}],"hiredAt":"2022-11-08T21:05:17.000Z","topics":["Economics","K-5 Grade Math","Pre-Algebra","Journalism","History","Precalculus / Trigonometry","Philosophy","Spanish","Literature","Finance / Investing","Reading","History Project","Calculus","Writing","World Cultures","Algebra I","Public Speaking","Algebra II","Law / Government / Policy","Geography","Negotiation","Geom
