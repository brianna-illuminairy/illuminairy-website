xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"df15607d-0e42-4508-b931-637f01f94c14\"}":{"__typename":"DeepDives","uuid":"df15607d-0e42-4508-b931-637f01f94c14","content":"\u003cp\u003eYou don't need to be anyone but yourself. If you stay authentic, work hard, and let your heart guide you, you'll end up exactly where you're meant to be. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"872216a4-cd06-4e7a-989c-0ac92e8b7ed9\"}":{"__typename":"DeepDives","uuid":"872216a4-cd06-4e7a-989c-0ac92e8b7ed9","content":"\u003cp\u003eI can't pick just one, so here's a few!\u003c/p\u003e\u003cp\u003e-win a Tony Award\u003c/p\u003e\u003cp\u003e-publish a book\u003c/p\u003e\u003cp\u003e-travel to every continent\u003c/p\u003e\u003cp\u003e-live abroad for at least a year\u003c/p\u003e\u003cp\u003e-host a yearly Friendsgiving so that, even when life gets busy, my friends and I can always come back together. Friends are life's greatest gift!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6e043480-9039-4aff-9b5c-604a93c73dce\"}":{"__typename":"DeepDives","uuid":"6e043480-9039-4aff-9b5c-604a93c73dce","content":"\u003cp\u003eAuthor by day, actress by night: I spend my days curled up in coffee shops writing away, and my nights on stage in musicals on Broadway (Hey! That rhymed!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"dc24ebfd-2aad-47d5-baef-3ac1ef9b8573\"}":{"__typename":"DeepDives","uuid":"dc24ebfd-2aad-47d5-baef-3ac1ef9b8573","content":"\u003cp\u003eI really love nachos, and opossums are one of my favorite animals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"71dd64ee-4678-42ad-83e9-17bd4220cae4\"}":{"__typename":"School","uuid":"71dd64ee-4678-42ad-83e9-17bd4220cae4","name":"Catasauqua High School","city":"Northampton","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"18067"},"Education:{\"uuid\":\"f38df3f6-93b6-4e33-b58a-05118eb085f7\"}":{"__typename":"Education","uuid":"f38df3f6-93b6-4e33-b58a-05118eb085f7","school":{"__ref":"School:{\"uuid\":\"71dd64ee-4678-42ad-83e9-17bd4220cae4\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b079c5b1-f3b9-455f-814b-fd3662a22215\"}":{"__typename":"Education","uuid":"b079c5b1-f3b9-455f-814b-fd3662a22215","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Theater, Dance, \u0026 Performance Studies and English, with a concentration in fiction writing ","degree":null},"MentorPublicProfile:{\"uuid\":\"35f91b63-c9f5-4cd1-8cb7-fe2dceb45c6b\"}":{"__typename":"MentorPublicProfile","uuid":"35f91b63-c9f5-4cd1-8cb7-fe2dceb45c6b","displayName":"Hannah K.","slug":"hannah-kurczeski","biography":"\u003cp\u003eHello! My name is Hannah Kurczeski, and I'm so excited to be a mentor with Curious Cardinals! I'm a current senior at Yale double majoring in Theater, Dance, \u0026amp; Performance Studies (TDPS) and English with a creative writing concentration in fiction. I am not ashamed to admit that I'm a theater kid--on campus, I perform in several shows a year, while still making time to write and produce my own work as well. I like musicals best (my favorites are \u003cem\u003eLes Misérables\u003c/em\u003e and \u003cem\u003eCabaret\u003c/em\u003e), but through a college internship, I found a love of playwriting as well and have since been lucky enough to study under renowned playwrights like Branden Jacobs-Jenkins and Sarah DeLappe. Previously, I also served as the Special Events Coordinator on the board of the Yale Dramatic Association, and as the WKND Newsletter Editor and a Staff Writer at the Yale Daily News. I also have over two years of experience advising first-generation, low income high school students on college admissions with Matriculate, and hold two on-campus jobs outside of Curious Cardinals. In my free time I love to travel, play card games with friends, listen to Taylor Swift, and read \u0026amp; write lots of fiction and plays! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in the small town of Catasauqua, Pennsylvania where I didn't have access to any sort of advising. I had no one to answer my questions about how to make my dreams a reality, and had to teach myself how to do things like build an acting portfolio, plan and write a 400+ page speculative fiction novel, and even just apply to college. Now, , I've become a passionate advocate for arts education and the expansion of access to college preparation programs. I'm eager to help younger students learn the creative, practical, and executive function skills that I've spent the last several years honing. I'm so excited to be able to mentor passionate younger students who are in need of guidance, whether that's by developing concrete steps to make their dreams a reality or by helping them find a way to love a challenging subject. I believe that everyone's got a creative or intellectual \"spark\" of some sort, and I can't wait to find out: what's yours?\u003c/p\u003e","teachingVideoPlaybackId":"J8KaIOZCkXYfYH00zfuhZHXfJVSDC00kRNYsjRbsCwazs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI've always been someone who loves to write so much that I have a Notes App full of ideas for full length novels and plays. Starting was never the hard part, but finishing... that was practically impossible. I spent most of my life coming up with ideas only to get bored and discard them a few weeks later in pursuit of a newer, \"better\" idea. In my sophomore year of high school, I realized that if I ever wanted to achieve my goal of publishing a novel, I had to actually write one first. I picked a draft that was sitting in my Google Docs, planned out the rest of the chapters I needed to write, and wrote them. Then I taught myself about the self-submission process for submitting novels to publishers without having a literary agent, and sent off draft upon draft to different publishing houses. None of them took my novel because in hindsight, it wasn't very good. But I was so proud of myself for proving that I \u003cem\u003ecan\u003c/em\u003e finish a large scale project, and adapted the tools I learned from that process to write another novel a year later. \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Theater, Dance, \u0026 Performance Studies and English, with a concentration in fiction writing ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"df15607d-0e42-4508-b931-637f01f94c14\"}"},{"__ref":"DeepDives:{\"uuid\":\"872216a4-cd06-4e7a-989c-0ac92e8b7ed9\"}"},{"__ref":"DeepDives:{\"uuid\":\"6e043480-9039-4aff-9b5c-604a93c73dce\"}"},{"__ref":"DeepDives:{\"uuid\":\"dc24ebfd-2aad-47d5-baef-3ac1ef9b8573\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b76abe5e-ac63-4146-b908-3f2e24818e98/-/preview/-/format/jpg/","https://ucarecdn.com/2ef35b40-7b6c-46a8-8bab-ebc168bf1b1b/-/preview/-/format/jpg/","https://ucarecdn.com/4e353bab-852b-43d3-8a63-e1822a904b40/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f38df3f6-93b6-4e33-b58a-05118eb085f7\"}"},{"__ref":"Education:{\"uuid\":\"b079c5b1-f3b9-455f-814b-fd3662a22215\"}"}],"hiredAt":"2026-01-18T05:25:56.281Z","topics":["K-5 Grade Math","Writing","American Sign Language","Executive Function","College Essay Writing","Reading","History","Academic Coaching","K-6 Storybook","Creative Writing","Music","Film / Theater","Video / Photography","Fashion / Cosmetics","Visual Arts / Graphic Design","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hannah-kurczeski\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"35f91b63-c9f5-4cd1-8cb7-fe2dceb45c6b\"}"}}},"_sentryTraceData":"4d1486c808f6400e8bd3272bd7abf836-af4b6d3426c6dd7f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4d1486c808f6400e8bd3272bd7abf836,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","qu
