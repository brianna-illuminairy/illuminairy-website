xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"04bff8c3-caa9-4097-b49e-3e4d239089f9\"}":{"__typename":"Favorites","uuid":"04bff8c3-caa9-4097-b49e-3e4d239089f9","photoUrl":"https://ucarecdn.com/5c689e7a-49eb-4e38-aa03-99570b97f675/","title":"Zlatan Ibrahimović","type":"ATHLETE"},"Favorites:{\"uuid\":\"8d17e038-3050-4b26-9242-272029bb9756\"}":{"__typename":"Favorites","uuid":"8d17e038-3050-4b26-9242-272029bb9756","photoUrl":"https://ucarecdn.com/965596f4-af4c-422a-95fb-48b920a17514/","title":"Madrid","type":"CITY"},"Favorites:{\"uuid\":\"06abd874-94a0-4e50-8331-72c506a7ff59\"}":{"__typename":"Favorites","uuid":"06abd874-94a0-4e50-8331-72c506a7ff59","photoUrl":"https://ucarecdn.com/eb5e78d2-a3cc-4afc-b8f6-2805a27f2662/","title":"Rugby","type":"SPORT"},"CausesSupported:{\"uuid\":\"7d0a8f73-73a6-4f44-afb2-cc30ef931645\"}":{"__typename":"CausesSupported","uuid":"7d0a8f73-73a6-4f44-afb2-cc30ef931645","name":"Plataforma Makobo","description":"\u003cp\u003e\u003cstrong\u003eAims to address social inequities and promote sustainable development.\u003c/strong\u003e\u003c/p\u003e","photoUrl":"https://ucarecdn.com/f3f47b2f-96cc-4f30-8655-91b013cf2815/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"819ca0ee-e0b8-44ba-94fa-5a27488acb13\"}":{"__typename":"DeepDives","uuid":"819ca0ee-e0b8-44ba-94fa-5a27488acb13","content":"\u003cp\u003eIf you can picture yourself doing something, you can usually find a way to make it real—just start. The trick is to begin, even with a tiny first step, because of something called the \u003cem\u003eZeigarnik Effect\u003c/em\u003e: our brains hate unfinished business, so once you open a project, your mind will keep nudging you to finish it. Want to learn guitar? Strum one chord. Curious about coding? Write one “Hello, world.” Those small openings stick in your memory and pull you back until the job is done. So dream big, break it into bite‑sized actions, and trust your brain to keep the reminder light blinking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"74cd129b-aa84-4a7e-ae4b-a34c591b646a\"}":{"__typename":"DeepDives","uuid":"74cd129b-aa84-4a7e-ae4b-a34c591b646a","content":"\u003cp\u003eIn a spring workshop at The Hotchkiss School, I guided a roomful of middle‑schoolers as we wired an Arduino with an ultrasonic sensor and wrote a few lines of code that made a buzzer beep faster when a “car” (really just a cardboard box) reversed too close to an object. Watching those students light up when the beeps finally matched the distance showed me how a single hands‑on lesson can flip the switch from curiosity to confidence. That moment—seeing kids realize, “I built this, and it works!”—is why I keep mentoring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e90190b6-a7a2-4800-91fd-d35d903c728c\"}":{"__typename":"DeepDives","uuid":"e90190b6-a7a2-4800-91fd-d35d903c728c","content":"\u003cp\u003eI picked Computer Science and Data Science because they sit right where my two big obsessions meet: spotting patterns in markets and calling out misinformation online. In the finance world I love the challenge of building “quant” models—code that chews through mountains of price data and spits out clearer signals for smarter trades. The same math and machine‑learning tools can also flag fake news before it spreads; if an article’s language, source, or timing looks fishy, the model raises a red flag. Studying Computer Science and stats gives me one toolkit I can swing at both problems: fairer, data‑driven investing on one hand and more trustworthy information on the other.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bbc6a018-f415-4ca5-9c65-7c9274333c46\"}":{"__typename":"DeepDives","uuid":"bbc6a018-f415-4ca5-9c65-7c9274333c46","content":"\u003cp\u003eI picked Computer Science and Data Science because they sit right where my two big obsessions meet: spotting patterns in markets and calling out misinformation online. In the finance world I love the challenge of building “quant” models—code that chews through mountains of price data and spits out clearer signals for smarter trades. The same math and machine‑learning tools can also flag fake news before it spreads; if an article’s language, source, or timing looks fishy, the model raises a red flag. Studying CS and stats gives me one toolkit I can swing at both problems: fairer, data‑driven investing on one hand and more trustworthy information on the other.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"28dc9414-39f2-4281-9471-f58ee71688b7\"}":{"__typename":"School","uuid":"28dc9414-39f2-4281-9471-f58ee71688b7","name":"The Hotchkiss School","city":"Lakeville","type":"HIGH","state":"Connecticut ","country":"USA","zip":"06039"},"Education:{\"uuid\":\"21118d97-4aa5-4898-a9ff-e2857688a84e\"}":{"__typename":"Education","uuid":"21118d97-4aa5-4898-a9ff-e2857688a84e","school":{"__ref":"School:{\"uuid\":\"28dc9414-39f2-4281-9471-f58ee71688b7\"}"},"startYear":"2022","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b2d9887e-574a-45c0-b70a-17d3e7ad301a\"}":{"__typename":"Education","uuid":"b2d9887e-574a-45c0-b70a-17d3e7ad301a","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science \u0026 Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"9fadc8e2-7cad-43d9-8590-895def742e52\"}":{"__typename":"MentorPublicProfile","uuid":"9fadc8e2-7cad-43d9-8590-895def742e52","displayName":"Alláh-u-Abhá R.","slug":"allhuabh-rodrigues","biography":"\u003cp\u003eOlá! I’m Alláh-u-Abhá Rodrigues, a Mozambican-Portuguese sophomore at Yale University (’27), studying Computer Science and Statistics \u0026amp; Data Science. Whether I’m packing down as a flanker for the Yale Rugby Club or carving fresh powder on a snow-dusted Vermont morning, I’m happiest when ideas—and people—collide at full speed.\u003c/p\u003e\u003cp\u003eOn campus, I’m part of BlackGen Finance, a student organization that prepares underrepresented talent for careers in investment banking, quantitative research, and fintech. The group keeps my financial-engineering skills rooted in real-world applications.\u003c/p\u003e\u003cp\u003eOutside of class, I split my time between passion projects. One is a stealth startup I co-founded last year, which turns messy clickstream data into clear dashboards so e-commerce teams can quickly spot where shoppers struggle and fix user experience issues. I also contribute to a stealth B2B venture that reimagines large hashtable architectures to speed up search and personalization for enterprise clients—work that pushes me to write efficient low-level code while designing experiences that feel effortless to end users.\u003c/p\u003e\u003cp\u003eSports keep me balanced. I play flanker for the Yale Rugby Club and head north to Vermont whenever snowfall allows for a day of snowboarding. Those hours on the pitch and the slopes teach discipline, quick decision-making, and the value of good teamwork—skills that translate directly to debugging late-night code or pitching a project to investors.\u003c/p\u003e\u003cp\u003eMentoring is another constant. Through Curious Cardinals and weekend workshops, I guide high school students through their first Python scripts and basic statistics, replacing jargon with real-world examples they can connect with. I still make time for the arts: drawing realistic portraits and shooting 35 mm street photography in Lisbon and Maputo sharpens my eye for detail and color—an attention to nuance that helps when cleaning data or refining product interfaces.\u003c/p\u003e\u003cp\u003eSome key experiences so far include reaching the finals of the FTC Robotics competition in high school (representing Connecticut), participating in the Troutbeck Symposium, and showcasing my realistic drawings while presenting research on double consciousness.\u003c/p\u003e\u003cp\u003eAnd a fun fact to close: “Alláh-u-Abhá” is a Bahá’í greeting—so my first name is literally a friendly “hi” every time someone says it. I try to bring that same welcoming energy to every class, project, and team I join.\u003c/p\u003e\u003cp\u003eSo, my name is literally “Hi” Rodrigues.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAreas I Can Help With:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eGame development \u003c/strong\u003e\u003cem\u003e(Scratch, Python)\u003c/em\u003e\u003cstrong\u003e:\u003c/strong\u003e fun, logic-building projects for all ages\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eComputer Science \u0026amp; Programming fundamentals \u003c/strong\u003e\u003cem\u003e(Python)\u003c/em\u003e\u003cstrong\u003e:\u003c/strong\u003e solid, hands-on coding foundations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWeb development \u003c/strong\u003e\u003cem\u003e(JavaScript, React, Node.js)\u003c/em\u003e\u003cstrong\u003e:\u003c/strong\u003e interactive sites and apps\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eApp development \u003c/strong\u003e\u003cem\u003e(front-end \u0026amp; back-end projects)\u003c/em\u003e\u003cstrong\u003e:\u003c/strong\u003e full-stack guidance from idea to launch.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eData Structures:\u003c/strong\u003e clear examples and practice challenges.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStatistics \u0026amp; Probability \u003c/strong\u003e\u003cem\u003e(middle school to college)\u003c/em\u003e\u003cstrong\u003e:\u003c/strong\u003e real-world data exploration.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eIntro to Machine Learning \u0026amp; AI \u003c/strong\u003e\u003cem\u003e(Python, pandas, scikit-learn)\u003c/em\u003e\u003cstrong\u003e:\u003c/strong\u003e basics of building smart models\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion project mentorship\u003c/strong\u003e\u003cem\u003e (games, apps, startups)\u003c/em\u003e\u003cstrong\u003e:\u003c/strong\u003e turn ideas into polished demos\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSoftware engineering essentials:\u003c/strong\u003e version control, debugging, unit testing for real-world readiness\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePortuguese: \u003c/strong\u003eFrom zero to Fluent/Native.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"r02ywh2s7ewtMp8CJUWCZFRkdRTures2z3HUZBUELHuk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m proudest of co‑founding \u003cstrong\u003eFlowLens\u003c/strong\u003e, a startup that spots the exact moments online shoppers get frustrated and helps store owners fix them. My co‑founder and I built a one‑click Shopify app that watches how people click and scroll, then uses light‑weight AI to say things like, “Hey, 40 % of customers are dropping off on the shipping page—here’s why and how to fix it.” During our pilot we watched a local coffee‑bean shop bump its checkout rate within a week just by following our suggestions.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"04bff8c3-caa9-4097-b49e-3e4d239089f9\"}"},{"__ref":"Favorites:{\"uuid\":\"8d17e038-3050-4b26-9242-272029bb9756\"}"},{"__ref":"Favorites:{\"uuid\":\"06abd874-94a0-4e50-8331-72c506a7ff59\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"7d0a8f73-73a6-4f44-afb2-cc30ef931645\"}"}],"major":"Computer Science \u0026 Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"819ca0ee-e0b8-44ba-94fa-5a27488acb13\"}"},{"__ref":"DeepDives:{\"uuid\":\"74cd129b-aa84-4a7e-ae4b-a34c591b646a\"}"},{"__ref":"DeepDives:{\"uuid\":\"e90190b6-a7a2-4800-91fd-d35d903c728c\"}"},{"__ref":"DeepDives:{\"uuid\":\"bbc6a018-f415-4ca5-9c65-7c9274333c46\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/884dd270-ffd4-455f-bcc9-11cc13e2dade/-/preview/-/format/jpg/","https://ucarecdn.com/60704a75-0c1a-4215-83be-03ed03c69a33/-/preview/-/format/jpg/","https://ucarecdn.com/b1de14c0-2099-40ce-8670-7ff66e001ae9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"21118d97-4aa5-
