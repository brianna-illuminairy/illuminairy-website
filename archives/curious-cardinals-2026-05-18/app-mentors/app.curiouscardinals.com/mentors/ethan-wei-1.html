xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"167a95f5-3f7e-40ab-a65e-cd0ecf855dd8\"}":{"__typename":"DeepDives","uuid":"167a95f5-3f7e-40ab-a65e-cd0ecf855dd8","content":"\u003cp\u003eIts cliche but I would say to do what you love. As I've grown older, I've realized how important it is to find what you are truly passionate about. I really believe that if you find what you love to do, it'll be the greatest motivator for you to succeed in your work. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fb8a47d5-e618-4a09-baa0-ab8913134a54\"}":{"__typename":"DeepDives","uuid":"fb8a47d5-e618-4a09-baa0-ab8913134a54","content":"\u003cp\u003eGrowing up, I've had many mentors I really look up to or that have shaped my life. Even if I only play a small part, I hope as a mentor I can do the same. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8d1574df-fabc-442d-8ec5-5cc623b87f1d\"}":{"__typename":"DeepDives","uuid":"8d1574df-fabc-442d-8ec5-5cc623b87f1d","content":"\u003cp\u003eGrowing up, I was always super invested in STEM. From math competitions to academic research, I was completely enveloped in engineering so I knew that one day, I wanted to do something engineering related. I coded a lot in high school but while applying to college, I had the realization that I don't really love coding the way I think you need to in order to pursue it as your career. AI as a major covers a lot more of what I found out I enjoy: the math and theory of these models. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"7140a0cb-3fbf-487e-b9dc-bf9a7de93ed0\"}":{"__typename":"DeepDives","uuid":"7140a0cb-3fbf-487e-b9dc-bf9a7de93ed0","content":"\u003cp\u003eMy senior year of high school, I had a lot of free time. I came across a youtube video of someone building a keyboard from complete scratch and it really hooked me. I had been building custom keyboards but this seemed like the perfect intersection of my love for engineering with this fun side hobby. I got to work and had to learn a lot of new skills like PCB design and soldering but in the end, I was able to build a small sized keyboard with my own 3D modeled case and custom designed PCB. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"dd11b422-c0a4-41c5-a658-ec42f1451082\"}":{"__typename":"School","uuid":"dd11b422-c0a4-41c5-a658-ec42f1451082","name":"BASIS Chandler","city":"Chandler","type":"HIGH","state":"Arizona","country":"USA","zip":"85248"},"Education:{\"uuid\":\"e7ac16d0-bf8b-45da-bbc3-031324b10061\"}":{"__typename":"Education","uuid":"e7ac16d0-bf8b-45da-bbc3-031324b10061","school":{"__ref":"School:{\"uuid\":\"dd11b422-c0a4-41c5-a658-ec42f1451082\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"fdca0558-c060-4b40-870b-b707e460e861\"}":{"__typename":"Education","uuid":"fdca0558-c060-4b40-870b-b707e460e861","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Artificial Intelligence","degree":null},"MentorPublicProfile:{\"uuid\":\"5a64a214-95e0-48b7-9541-696f6b27c716\"}":{"__typename":"MentorPublicProfile","uuid":"5a64a214-95e0-48b7-9541-696f6b27c716","displayName":"Ethan W.","slug":"ethan-wei-1","biography":"\u003cp\u003e\u003cstrong\u003eHi! I'm Ethan.\u003c/strong\u003e I'm a rising sophomore at the University of Pennsylvania studying artificial intelligence and math. I help students turn curiosities about any topic into tangible, real-world projects and research. I can also help students build problem-solving skills to approach math in a way that will hopefully teach them to love it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor my whole life, I've been really involved with STEM in many ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eIn high school, I:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConducted university-level research as an intern at ASU and as an Anson L. Clark Scholar at TTU. I focused mainly on various AI/ML topics such as computer vision and anomaly detection.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublished a full-length paper on graph-based anomaly detection to identify illegal activity in business networks in the IEEE/ACM BDCAT conference. Presented my research at the University of Sharjah in the UAE.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eQualified 3 times for the American Invitational Mathematics Examination (AIME) and tutored many students in all the AP maths.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGrew my school's Science Olympiad Club from 10 people to hundreds of applicants by not only making the club successful (nationals qualifier and #1 in AZ), but also a tighter and fun community where teammates become close friends over the course of the year.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAt Penn, I've been really involved in:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI joined Hack4Impact, a club that builds websites/apps for non-profits to truly impact the world.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding more on my own for any of my interests. More specifically, I built SocialScour, a real-time sentiment analysis engine for any topic that scrapes social media to analyze public sentiment, and I am currently working on quantitative analysis and trading bots for prediction markets.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eThis summer, I will be interning at a hedge fund in Singapore, working on internal technical projects!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat can I help you with\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI've tutored various math classes as well as learning and taking many classes, so I've learned how to explain concepts in many ways to ensure anyone can learn.\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eSchool math: Algebra, Geometry, Calculus (AP and multivariate), Statistics, Discrete\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCompetition math: AMC 8/10/12, Mathcounts and Mathleague\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eHaving lots of research experience as well, I can help with various passion projects.\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eResearch \u0026amp; Publication: Guiding you through the full research lifecycle. From formulating questions and applying machine learning models to preparing papers for publication or science fairs.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eProduct Development \u0026amp; AI: Building full-stack web apps and AI tools. We can dive into Python, React, and data analysis to build a product you can actually launch.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eParents know that being good at coding or math doesn't guarantee you can teach it. I've been tutoring math for many years and have learned various ways to approach problem-solving. In Hack4Impact, I serve as the education chair, teaching new students technical skills and running our annual bootcamp.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might involve:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWalking through a tough, competitive math problem from the most basic steps to build confidence in solving these problems alone.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorm a unique project or research topic that you are passionate about, and how you could turn this into a strong research project.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReviewing code and again breaking it down into the foundational steps to build confidence in understanding how things work.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eLife Outside of School:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eSome hobbies of mine include basketball, cello, cardistry, building PCs and keyboards, puzzle games (NYT and LinkedIn Games), and trying new restaurants. I've recently been learning how to DJ.\u003c/p\u003e","teachingVideoPlaybackId":"2NL5utBqhGFi5CBzOQga4HUQqOdQly56oxN01f2bytgY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Artificial Intelligence","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"167a95f5-3f7e-40ab-a65e-cd0ecf855dd8\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb8a47d5-e618-4a09-baa0-ab8913134a54\"}"},{"__ref":"DeepDives:{\"uuid\":\"8d1574df-fabc-442d-8ec5-5cc623b87f1d\"}"},{"__ref":"DeepDives:{\"uuid\":\"7140a0cb-3fbf-487e-b9dc-bf9a7de93ed0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0221b3d1-4a01-4246-a56d-644fe01f577e/-/preview/-/format/jpg/","https://ucarecdn.com/f01accef-3528-4b52-be57-362b88514950/-/preview/-/format/jpg/","https://ucarecdn.com/0506735d-26a9-4a37-8aac-33ebffb6a506/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e7ac16d0-bf8b-45da-bbc3-031324b10061\"}"},{"__ref":"Education:{\"uuid\":\"fdca0558-c060-4b40-870b-b707e460e861\"}"}],"hiredAt":"2026-04-19T04:23:38.995Z","topics":[],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ethan-wei-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5a64a214-95e0-48b7-9541-696f6b27c716\"}"}}},"_sentryTraceData":"1cc185c42928452a8fccd38b369c635a-9ecca065c07a9bd6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1cc185c42928452a8fccd38b369c635a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]
