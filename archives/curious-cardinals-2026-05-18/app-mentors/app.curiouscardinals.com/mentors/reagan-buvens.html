xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6c011487-a7d8-41b7-a936-5dc9019d3159\"}":{"__typename":"Favorites","uuid":"6c011487-a7d8-41b7-a936-5dc9019d3159","photoUrl":"https://ucarecdn.com/6d562198-bd3a-4cdb-9764-8d6cabaea54f/","title":"Aretha in Paris (Live Album, 1968)","type":"ALBUM"},"Favorites:{\"uuid\":\"298f0f1f-29be-45f3-aaca-7cf69bbeb412\"}":{"__typename":"Favorites","uuid":"298f0f1f-29be-45f3-aaca-7cf69bbeb412","photoUrl":"https://ucarecdn.com/86a98966-334b-4050-af10-5515787def68/","title":"The Namesake, by Jhumpa Lahiri","type":"BOOK"},"Favorites:{\"uuid\":\"c3a8c997-f242-4ae5-be50-2171d6ac9d9e\"}":{"__typename":"Favorites","uuid":"c3a8c997-f242-4ae5-be50-2171d6ac9d9e","photoUrl":"https://ucarecdn.com/b1a640d4-c9f6-4124-925d-a8f057f85d60/","title":"Coco Gauff","type":"ATHLETE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"44b3d7c1-db21-4cf2-bfb0-01a031821114\"}":{"__typename":"DeepDives","uuid":"44b3d7c1-db21-4cf2-bfb0-01a031821114","content":"\u003cp\u003eGrowing up, I was absolutely, positively, 100% sure that I was going to be an English major. I loved books, I loved writing, and I couldn't imagine loving anything else nearly as much. Then, in my freshman year of high school, I had to take a computer science class—and I excelled. I had a knack for logic, and code always seemed to fall perfectly into place. So, I kept taking CS classes through high school, and eventually ended up going to college as a Computer Science major and a Creative Writing minor. I still love books and writing, but I love math and logic, too. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"1b3bc7c0-c888-43d1-bd09-923d7d8553cc\"}":{"__typename":"DeepDives","uuid":"1b3bc7c0-c888-43d1-bd09-923d7d8553cc","content":"\u003cp\u003eIn a lot of ways, I was exactly like I am now, and in a lot of ways, I was completely different. High school me loved reading, but hated studying. She loved math, but hated math class (it always went so slow)! She spent all of her time either at her best friend's house or at choir rehearsal, using sign language to talk to her best friend across the room. Now, I still have the same best friend, I still love reading and math, but I've learned to enjoy studying. I don't sing quite so much as I play piano now, and I've grown a lot more confidence than I ever had in high school. I love who I was in high school, but I love who I've developed into even more!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"387a807d-72fc-4249-9bfa-b1e8548879fa\"}":{"__typename":"DeepDives","uuid":"387a807d-72fc-4249-9bfa-b1e8548879fa","content":"\u003cp\u003eDon't be afraid to reach out to new people and to try new activities. A lot of the best things I did in middle school and high school happened because I was brave and I decided to make new friends or blurt out a crazy idea. In middle school, I and a couple of my friends raised thousands of dollars to build water wells in communities without access to clean water—because I stayed after school one day and convinced my friends to start a club with me. In high school, I got to take an advanced creative writing course over the summer—because I reached out to my teacher and told her that writing was the thing I loved, and I wanted to do more of it. It's \u003cem\u003ehard\u003c/em\u003e to get out of your comfort zone, to say hi to a stranger, to commit to a new club, but it can lead to amazing, wonderful things.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"47157f08-a6db-4160-8a83-bd06a6a5de3e\"}":{"__typename":"DeepDives","uuid":"47157f08-a6db-4160-8a83-bd06a6a5de3e","content":"\u003cp\u003eMy mom. I know it's a cliche answer, but she is the smartest, coolest, best person I know. She is a professional pianist, and she raised me as a single mom, working hard day and night to make sure I had the best life possible. That feeling you have as a little kid, that your parent knows everything about everything? I still have that—I call her every day, and I ask her all the silly questions. She is the hardest-working, most-talented person I can think of, and I would love to be just like her.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"7720f99d-24a9-49cb-a93a-9044ffbf5954\"}":{"__typename":"School","uuid":"7720f99d-24a9-49cb-a93a-9044ffbf5954","name":"Bryn Mawr College","city":"Bryn Mawr","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19010"},"Education:{\"uuid\":\"ade549de-f370-4b70-82bc-e737c71e4a3f\"}":{"__typename":"Education","uuid":"ade549de-f370-4b70-82bc-e737c71e4a3f","school":{"__ref":"School:{\"uuid\":\"7720f99d-24a9-49cb-a93a-9044ffbf5954\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"School:{\"uuid\":\"4b8b3ed5-038c-49df-8ac5-be3cba0557b9\"}":{"__typename":"School","uuid":"4b8b3ed5-038c-49df-8ac5-be3cba0557b9","name":"School for the Talented and Gifted","city":"Dallas","type":"HIGH","state":"Texas","country":"United States","zip":"75203"},"Education:{\"uuid\":\"41e6e0c0-a391-401a-8a59-b9e3b5c52698\"}":{"__typename":"Education","uuid":"41e6e0c0-a391-401a-8a59-b9e3b5c52698","school":{"__ref":"School:{\"uuid\":\"4b8b3ed5-038c-49df-8ac5-be3cba0557b9\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ec2c7cda-7c03-4541-995b-41d7953c2985\"}":{"__typename":"MentorPublicProfile","uuid":"ec2c7cda-7c03-4541-995b-41d7953c2985","displayName":"Reagan B.","slug":"reagan-buvens","biography":"\u003cp\u003eHi, I'm Reagan! I'm a senior at Bryn Mawr College, majoring in Computer Science and minoring in Creative Writing, and I'm in my first year of a Master of Computer Science at the University of Pennsylvania. I'm excited to help students expand their knowledge and capabilities in STEM fields (especially math and CS!), while maintaining a well-rounded education and diverse interests.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor the past two years, I've worked as a teaching assistant for introductory Computer Science courses at Bryn Mawr College, holding office hours once a week and helping dozens of students to succeed in their studies. I also worked as a freelance tutor in my freshman year of college, and, in high school, I volunteered as an academic tutor and personal mentor for incoming freshmen, helping them learn study skills and keep themselves organized. I absolutely \u003cem\u003elove\u003c/em\u003e tutoring—it's so wonderful to see the look on a student's face when they finally understand a difficult concept. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can help with a lot of different subjects (there's a list at the top of the page!), but I'm especially passionate about and skilled in Computer Science, Math, Physics, and Writing. I know that a lot of students have multiple, disparate passions that might seems worlds apart, and, particularly given my experience as a STEM major and arts minor, I believe that those passions should each be nurtured with care and encouraged to develop—contrasting interests make for interesting, accomplished people!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm also a huge proponent of passion projects; a big, self-driven project can push a student to venture outside their comfort zone, learn new things, and develop their willpower. It's also a great confidence booster—your student will look back one day and say, \"Wow! I did all that? I'm pretty awesome.\" In the past, I have: developed a full-stack web application (using Python, SQL, JavaScript, HTML, and CSS), completed a screenplay adaptation of a novel (Neil Gaiman's \u003cem\u003eThe Graveyard Book\u003c/em\u003e), and implemented a scheduling-optimization algorithm for university registrars (as a group project). I know how exciting it can be to start a new project, and just how incredible it feels to look back on all your hard work!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I love reading, music, and dogs. I'm a big fan of the books of Catherine Lacey, R. F. Kuang, and Alix E. Harrow, and my top three musical artists are Hozier, Brandi Carlile, and Aretha Franklin. At home, I have two big dogs, Bowie (after David, of course) and Daisy. I also love the opera—I make a trip up to NYC at least once a semester to catch a show at the Met! I am so excited to get to meet you; please reach out if I sound like a good fit!\u003c/p\u003e","teachingVideoPlaybackId":"59EnuXR73bd9DSiHIAxV00YO4FJdxxEwaZM2lYmNKYKQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6c011487-a7d8-41b7-a936-5dc9019d3159\"}"},{"__ref":"Favorites:{\"uuid\":\
