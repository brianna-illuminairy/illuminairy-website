xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"283eaeea-2011-4f51-b9fe-5f8bb0c36731\"}":{"__typename":"Favorites","uuid":"283eaeea-2011-4f51-b9fe-5f8bb0c36731","photoUrl":"https://ucarecdn.com/cce1c4de-9460-447e-b608-4023186732ad/","title":"Good Will Hunting","type":"MOVIE"},"Favorites:{\"uuid\":\"a0ccdf6c-e7e6-4e18-b7e7-120417620ab0\"}":{"__typename":"Favorites","uuid":"a0ccdf6c-e7e6-4e18-b7e7-120417620ab0","photoUrl":"https://ucarecdn.com/8cbf1840-dca8-4d33-8000-6c4c988ce5f0/","title":"Jalen Hurts","type":"ATHLETE"},"Favorites:{\"uuid\":\"26a74a5c-4618-48a4-b988-6be75f664614\"}":{"__typename":"Favorites","uuid":"26a74a5c-4618-48a4-b988-6be75f664614","photoUrl":"https://ucarecdn.com/884899b5-9d26-4545-988d-fec25cf8138b/","title":"Frank Sinatra","type":"ARTIST"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2e51ca0b-85cb-4731-ac61-1c0b12cfa0e1\"}":{"__typename":"DeepDives","uuid":"2e51ca0b-85cb-4731-ac61-1c0b12cfa0e1","content":null,"videoPlaybackId":"PbzGeRzLBBvWhTZW36UNmu00dZrt02ToDyrqAK8LM00ihA","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"91a781a1-a92f-403b-a747-1f06273d7c4b\"}":{"__typename":"DeepDives","uuid":"91a781a1-a92f-403b-a747-1f06273d7c4b","content":"\u003cp\u003eIn my free time, I love to go on hikes and runs! I'm new to California and I must say, the hiking scene here is incredible. I also love to cook anything and everything vegetarian, so if you have some good recipes let me know. When I have downtime at night, I try to play some piano and sing, though I'm not sure how much my roommates enjoy it :') I also love to keep up to date on coding since I don't get to use CS in my job anymore. I like to make games, website, etc. with my friends who live in chicago as a way of keeping in touch. \u003cbr\u003e\u003cbr\u003eLet me know what interests you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"823e926e-13bb-4beb-a3e1-6eb7706034e7\"}":{"__typename":"DeepDives","uuid":"823e926e-13bb-4beb-a3e1-6eb7706034e7","content":null,"videoPlaybackId":"Qd022S2016UhMnw9CLPBES100v4Uc00ghepLupgkv8Shtss","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"888921ab-86f8-4894-a645-d3f841563719\"}":{"__typename":"DeepDives","uuid":"888921ab-86f8-4894-a645-d3f841563719","content":"\u003cp\u003eMentorship is something that genuinely everyone needs at EVERY stage of life, whether they know it or not. I have received so much help throughout my academic career that it would be impossible to pinpoint a single person that is responsible for where I am today. So in that light, I would say being a mentor is important to me because it is my way of paying it forward. \u003cbr\u003e\u003cbr\u003eNot only that, but there is a joy that comes from spreading your passions with others. Showing someone that physics, calculus, and even research can be fun and not scary is one of my favorite ways to engage with education. It really isn't about teaching a topic, it's about getting someone excited about the topic so they'll want to learn about it themselves!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"42a55753-b39a-4682-a6c8-70fd0359dc62\"}":{"__typename":"School","uuid":"42a55753-b39a-4682-a6c8-70fd0359dc62","name":"Glenelg High School","city":"Glenelg","type":"HIGH","state":"Maryland","country":"United States","zip":"21737"},"Education:{\"uuid\":\"c452091f-ed07-4c51-94d3-dbd5b7549499\"}":{"__typename":"Education","uuid":"c452091f-ed07-4c51-94d3-dbd5b7549499","school":{"__ref":"School:{\"uuid\":\"42a55753-b39a-4682-a6c8-70fd0359dc62\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c9b44e42-4328-4891-94b9-d3074236050b\"}":{"__typename":"School","uuid":"c9b44e42-4328-4891-94b9-d3074236050b","name":"University of Notre Dame","city":"Notre Dame","type":"COLLEGE","state":"Indiana","country":"United States","zip":"46556"},"Education:{\"uuid\":\"a4fcea72-5d1e-4cb7-aca3-34cddfd787a3\"}":{"__typename":"Education","uuid":"a4fcea72-5d1e-4cb7-aca3-34cddfd787a3","school":{"__ref":"School:{\"uuid\":\"c9b44e42-4328-4891-94b9-d3074236050b\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"703a8a97-624e-4120-974f-d518c39dd0fe\"}":{"__typename":"MentorPublicProfile","uuid":"703a8a97-624e-4120-974f-d518c39dd0fe","displayName":"Collin F.","slug":"collin-finnan-1","biography":"\u003cp\u003eHello everyone! My name is Collin and I've been a curious cardinal mentor since October 2023. I am a first year PhD student at the University of California, Berkeley studying electrical engineering. I previously studied electrical engineering at the University of Notre Dame. Go Irish and Go bears! I am passionate about math, physics, and engineering, and want to spread that passion to the next generation! Science and math are fun and can be easier (and more useful) than people think! \u003cbr\u003e\u003cbr\u003eI am a life-long student AND educator. From national honors society peer tutoring in high school, to teaching assistantships throughout college, to peer mentorship as a graduate student, I have figured out that I happiest when I'm working with others on cool STEM stuff :) I've been recognized twice in graduate school for my teaching, winning the outstanding instructor award for my undergraduate mentorship. Watching students develop into independent learners and researchers is one of the great points of pride in my life. \u003cbr\u003e\u003cbr\u003eIn my free time I like to try new vegetarian dishes, go for runs or bike rides with friends, hike, or watch some football on the weekends (Go Eagles!). I also love doing coding or DIY engineering projects at home, so feel free to ask me about those! I enjoy creative outlet too, including playing the piano and singing. I also enjoy wood working to make outdoor furniture, though I am still pretty novice at this!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy personal research has to do with nanoscale fabrication techniques used for modern computer chips. My passion is computing and manufacturing transistors! If you see me at work, I will often be in the full bunny-suit used in clean rooms to keep our silicon wafers defect-free. If you have a passion for lab work or science, I love talking shop about working through tough STEM problems. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've led several curious cardinals projects, including the design, assembly, and coding of an autonomous robot. I've also led projects that lead to high school publications, including a soil health analysis science project. I am looking forward to making new connections with ambitious and curious students! \u003c/p\u003e","teachingVideoPlaybackId":"moFqAikDFRZ3004b6i020202EoclpNvL5P5339SYRbk8YC8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eNot sure if this is my GREATEST achievement, but it is certainly a memory that changed my outlook on life. For the majority of high school, I would just sing casually around my house. I was pretty embarrassed to do it in front of others, and I wasn't particularly close with the theatre crowd at school. My senior year, I decided to take a leap of faith and just do the spring musical. What did I have to lose? I had 3 more months of high school left, I'd have to do pretty horribly in an audition for anyone to remember! I ended up getting the lead, and more importantly, made life long friends I would've never had otherwise. I wasn't particularly proud of getting the lead; it was the act of doing something that for years I was too uncomfortable to do that gave me pride (I literally almost threw up before the audition I was so scared). Since then, at each inflection point of life, I've tried to expand my horizons and make myself uncomfortable!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"283eaeea-2011-4f51-b9fe-5f8bb0c36731\"}"},{"__ref":"Favorites:{\"uuid\":\"a0ccdf6c-e7e6-4e18-b7e7-120417620ab0\"}"},{"__ref":"Favorites:{\"uuid\":\"26a74a5c-4618-48a4-b988-6be75f664614\"}"}],"causesSupported":[],"major":"Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2e51ca0b-85cb-4731-ac61-1c0b12cfa0e1\"}"},{"__ref":"DeepDives:{\"uuid\":\"91a781a1-a92f-403b-a747-1f06273d7c4b\"}"},{"__ref":"DeepDives:{\"uuid\":\"823e926e-13bb-4beb-a3e1-6eb7706034e7\"}"},{"__ref":"DeepDives:{\"uuid\":\"888921ab-86f8-4894-a645-d3f841563719\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5042b39f-d205-493f-bf6e-e9af91bf6a46/-/preview/-/format/jpg/","https://ucarecdn.com/91ce1afb-f4b5-4435-8523-11476fe6d902/-/preview/-/format/jpg/","https://ucarecdn.com/39a362e6-ca2e-41e3-a3d0-554d5c7f80a9/-/preview/-/format/jpg/"],"pronouns"
