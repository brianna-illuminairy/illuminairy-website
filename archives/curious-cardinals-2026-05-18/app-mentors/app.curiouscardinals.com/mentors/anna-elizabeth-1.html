6\"}":{"__typename":"Education","uuid":"8dce97ca-625d-447c-9403-07f3c057d6a6","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"df0853fa-5749-41fc-b5e0-2fe38aa49370\"}":{"__typename":"MentorPublicProfile","uuid":"df0853fa-5749-41fc-b5e0-2fe38aa49370","displayName":"Anna E.","slug":"anna-elizabeth-1","biography":"\u003cp\u003eHi! I’m Anna, a rising sophomore at Stanford University studying Political Science and Economics. Through 9 homes, 8 schools, and 3 continents, I’ve grown up all around the world as a military dependent 🗺️, and a proud Air Force brat. I was the Air Force Youth of the Year finalist and Garrison Youth Mayor, in which I took great pride in representing my military community. As a 2024 U.S. Presidential Scholar, I was able to continue to bring light to internationally-based U.S. students. My family currently lives in Stuttgart, Germany\u0026nbsp; 🇩🇪,\u0026nbsp; but my favorite place I’ve lived is Seoul, South Korea 🇰🇷. I am also currently an Army ROTC cadet at Stanford, and have found a love for entrepreneurship through my role as a Chapter Development Lead for Stanford’s premier entrepreneurial club (ASES), where I am in charge of starting international ASES chapters all around the world. I am extremely passionate about policy and government, and serve as one of the 15 elected senators serving Stanford’s undergraduate population of 7,600+ 🧑‍⚖️. I also work as a research assistant at the Freeman Spogli Institute for International Studies, researching the rise of populism around the world. In High School, I created a petition that reached 1,000+ signatures from teachers, parents, and students advocating for specific policies in my school district, and created content for my high school that reached 1,000,000+ views. In my junior year of high school, I created an organization called Treats for Troops, that provided baked goods and meals for unaccompanied soldiers in my military community during the holiday season.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free-time, I love hiking, traveling (I've been to 37 countries!), and trying new foods. My favorite food is ice cream 🍦, specifically Sahne Kirshe gelato from across the street from my house in Germany. I’ve played piano for 12 years 🎹, and am currently learning how to DJ 🎛️🔊. I enjoyed cross-country and played soccer in high school, and am now part of the running club at Stanford 🏃.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I pride myself on reliability and offering clear, honest feedback that helps others reach their full potential. I have been a volunteer tutor for over 4 years, and have helped students win scholarships, build passion projects, and earn A+’s on their school projects. As a student leader who has won over $20k+ in scholarships, I strive to share my knowledge and resources to help others access similar opportunities.\u003c/p\u003e","teachingVideoPlaybackId":"4QxU8gLkt201W94DiZScG4ZabjKqG566tM013amR2m3ZU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003e2024 U.S. Presidential Scholar\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCan Juggle\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"8ffe4531-99ee-470c-b3c3-720935c3634d\"}"},{"__ref":"Favorites:{\"uuid\":\"8c3bece3-a2bd-48f4-89eb-0b21af5e8f9b\"}"},{"__ref":"Favorites:{\"uuid\":\"b826bf9b-10b3-4f04-b654-3bcd5accf9ad\"}"}],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c7baf321-3285-4f8b-9c8d-9b228d25881f\"}"},{"__ref":"DeepDives:{\"uuid\":\"7aa1e43a-6439-45cc-a803-3adaa16401ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"339408f0-391e-4e85-a528-923ca1cd5449\"}"},{"__ref":"DeepDives:{\"uuid\":\"07c5a3ad-a2d7-475c-b681-683aee57409a\"}"}],"active":true,"profilePhotos":["https://uca
