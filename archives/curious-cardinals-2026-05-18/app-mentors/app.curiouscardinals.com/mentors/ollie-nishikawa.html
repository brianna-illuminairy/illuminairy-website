stion:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"7d0cf2af-2728-4f41-bc9e-d195c3980c81\"}":{"__typename":"DeepDives","uuid":"7d0cf2af-2728-4f41-bc9e-d195c3980c81","content":null,"videoPlaybackId":"4EdLdfkETFJhsghboyfJjvnPd5ug87w4HGVrUjN32Fs","question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"b04bf76b-412a-4ffe-bf78-5bf36e4f6ed8\"}":{"__typename":"DeepDives","uuid":"b04bf76b-412a-4ffe-bf78-5bf36e4f6ed8","content":null,"videoPlaybackId":"8X1zaPkRvRo00FB00VHph6dO2cm7ygMW6KTQWUGOfSTm8","question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"f63e18ad-d8be-4ffd-b01f-202e27056645\"}":{"__typename":"School","uuid":"f63e18ad-d8be-4ffd-b01f-202e27056645","name":"Punahou School","city":"Honolulu","type":"HIGH","state":"Hawaii","country":"United States","zip":"96822"},"Education:{\"uuid\":\"5a12ed96-2f48-4c56-8120-29eb510d6c1d\"}":{"__typename":"Education","uuid":"5a12ed96-2f48-4c56-8120-29eb510d6c1d","school":{"__ref":"School:{\"uuid\":\"f63e18ad-d8be-4ffd-b01f-202e27056645\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"8714bbda-11ad-4bc8-8134-e230cc76adb1\"}":{"__typename":"Education","uuid":"8714bbda-11ad-4bc8-8134-e230cc76adb1","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"887439d7-77a9-4749-bd3a-1b1cee1bcc1c\"}":{"__typename":"MentorPublicProfile","uuid":"887439d7-77a9-4749-bd3a-1b1cee1bcc1c","displayName":"Ollie N.","slug":"ollie-nishikawa","biography":"\u003cp\u003eIn many ways, the pathways of my life have been dictated by my passion for problem solving and learning. Whether it be career-oriented extracurriculars, classes, or even sports, at the core of many of the memories I hold close to my heart has been this passion for learning.\u003cbr\u003e\u003cbr\u003eHi! My name is Oliver, and I'm a rising senior at Cornell studying Chemical Engineering. I was born and raised in Honolulu, Hawaii, although most of my year is now spent in Ithaca for my studies. As my major may indicate, I love chemistry, physics, math, and the intersection of them all.\u003cbr\u003e\u003cbr\u003eMy studies early on were largely informed by my experience as a wrestler in high school. From wrestling, I had the experience of cutting weight, which, in pursuit of optimizing, I began to learn about the basics of nutrition for. As my passion for wrestling grew, so did my passion for the food and nutrition I was putting in my body. So naturally, when I heard Cornell had a dedicated nutritional sciences major, I applied immediately.\u003cbr\u003e\u003cbr\u003eSo I came to Cornell as a nutritional sciences major. I spent one semester within the major, taking basic science courses, but quickly realized it wasn’t what I had hoped for; It lacked the rigorous problem solving aspect that I was so drawn to in my studies in high school. I wanted something that felt more like a puzzle—something that would build my skills and give me the tools to apply the knowledge I held to projects in the real world.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnd so I switched to Chemical Engineering. It wasn’t an easy process, and I had hiccups in the road here and there, but I look back on the memory fondly, not only because I’m now in a major I am truly passionate about, but also because of the opportunities it gave me to question my motivations, passions, and choices.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of classes I am involved in the ChemE Car Project Team, a competition based project team that builds a shoebox-sized car that runs entirely powered by chemical reactions. I’m also involved in research in the Materials Science Engineering department, investigating the optoelectronic properties of Cadmium Sulfide magic-sized cluster films through different spectroscopic techniques. Last summer I worked at home in Hawaii as a Materials Engineering intern at Oceanit, characterizing an anti-corrosion coating they had engineered and tweaking formulations with viscosifier and surfactant additives. These experiences have given me the opportunity to expand my skill set as an engineer and grow in my ability to communicate and apply knowledge to real-world projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not doing academic-related work, I also work at the Asian American Resource Center here at Cornell, taking care of many administrative tasks, while also contributing to the BeComing planning team, a group that organizes a student-speaker series centering around Asian-American student experiences, themes, and identity. I love cooking and trying new recipes, playing with my many little dogs, and doing all sorts of things with my friends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"ZQGUDqkUxlxXl00dQGK02d98T35GigynmTGSx7anKu8XU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ae3ccaa7-4ca6-464b-a809-a9b1e66da0f1\"}"},{"__ref":"Favorites:{\"uuid\":\"23df481c-eaae-42b1-aeb4-999ff6b7560a\"}"},{"__
