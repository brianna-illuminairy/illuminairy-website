xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7a823b27-940d-4b7f-910e-30ba3c1651ec\"}":{"__typename":"Favorites","uuid":"7a823b27-940d-4b7f-910e-30ba3c1651ec","photoUrl":"https://ucarecdn.com/e25ce5ed-3ac7-449a-a712-3851d2066ac8/","title":"What's Going On- Marvin Gaye","type":"SONG"},"Favorites:{\"uuid\":\"b369af53-7360-4500-8f52-9093c3706d23\"}":{"__typename":"Favorites","uuid":"b369af53-7360-4500-8f52-9093c3706d23","photoUrl":"https://ucarecdn.com/21caaa23-c3a0-46a1-9bc1-956df0b29955/","title":"Michigan Wolverines","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"81a38c17-ea35-4d22-85cd-bb64d8529b6a\"}":{"__typename":"Favorites","uuid":"81a38c17-ea35-4d22-85cd-bb64d8529b6a","photoUrl":"https://ucarecdn.com/dd9d2189-8c63-4365-be10-ee3429c57e35/","title":"Illmatic","type":"ALBUM"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"92323656-3c67-4bcf-803e-6559292f3576\"}":{"__typename":"DeepDives","uuid":"92323656-3c67-4bcf-803e-6559292f3576","content":"\u003cp\u003eIn a dream world where money isn’t a concern, I think I would want to be a coach. There is nothing more fulfilling to me than giving someone advice and seeing them use that advice to succeed. When I was in high school, I helped coach my school track team while I was also competing. Imparting the knowledge I had on younger athletes and seeing them take that advice and use it to become better is something that always brought me joy. I see a coach as not only being the person who trains and instructs workouts for their athletes, but also as someone who can act as a mentor and has the power to shape a young person's life by teaching them valuable lessons that don't just apply to their sport. It is very easy to get lost as a young person and start to develop bad habits or hang out with the wrong people, but a coach has the power to set them on the right path and teach them how to better develop their character so that they can find success.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"e36af036-e38f-4986-b1af-03726c448b9a\"}":{"__typename":"DeepDives","uuid":"e36af036-e38f-4986-b1af-03726c448b9a","content":"\u003cp\u003eHigh school was an extremely transformative time in my life, in which I greatly grew as a student and as a person. As with many kids my age, I entered high school with very little idea of what I enjoyed studying or the discipline it takes to succeed. I would consider my freshman year the year in which I improved the most as a student, due to the rapid adjustment I had to make from the moderate work load of middle school to taking high school classes at one of the most competitive high schools in the country during the COVID-19 pandemic. This period of my life was especially transformative because it taught me how to structure my time in a way that allows me to complete my homework while still doing the things I love, such as spending time with my friends and playing sports. By the time I was applying to colleges, I had raised my gpa over 5% while also finding time for extracurriculars such as volunteering and running track. High school taught me how to manage my time and gave me invaluable leadership skills that will last with me for the rest of my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"80ff0a0b-0112-4da7-97ba-35c2f5622b62\"}":{"__typename":"DeepDives","uuid":"80ff0a0b-0112-4da7-97ba-35c2f5622b62","content":"\u003cp\u003eOne achievement I am extremely proud of is winning the position of Vice President of the Sigma Nu Chapter at the University of Michigan. Since high school, I have consistently sought leadership roles wherever possible, as they provide me with valuable skills that I hope to apply upon graduating from college. The position of Vice President has always been something I have looked up to as a role that would greatly improve all of the skills I need to be effective in the job force. As the Vice President of a fraternity, my main role is to facilitate all of the inner workings that make this organization run. I am the Chief Officer of Operations, overseeing 20 chair positions that each play a distinct role within the organization. From philanthropy events to scholarship programs, I make sure that everything runs smoothly, and I must constantly work with the other chair positions to figure out ways to make being in a fraternity a more beneficial experience for everyone. This experience has allowed me to greatly improve my organizational management abilities as well as teaching me how to think outside the box and be dedicated to finding solutions to problems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"2b57a8a9-4795-4b44-a0bd-751a95926411\"}":{"__typename":"DeepDives","uuid":"2b57a8a9-4795-4b44-a0bd-751a95926411","content":"\u003cp\u003eI have been more than lucky to have had mentors in my life who have been hugely beneficial in shaping me to become the person I am today. While I could write a book about all the amazing mentors I have had, one that specifically stands out to me is my high jump coach from high school. In high school, I competed in track and field as my primary sport, and my main focus was the high jump. The high jump is an extremely technical event that requires the ability to jump as well as somersault in a movement similar to what is seen in gymnastics, with the goal being to clear the highest height possible. My freshman year of high school, my parents started driving me to New Jersey to participate in group lessons where a high jump coach taught me and a few other kids my age the proper form to excel in this event. What shocked me about this specific coach is his incredible ability to watch his athletes run and jump and give extremely specific technical feedback about their entire approach, all while several athletes were performing their jumps in rapid succession to each other to the tune of over 200 jumps in each 90-minute practice session. This was a person who already had obtained success in his field through his past athletic achievements, but instead of retiring, chose to help others at a price that was affordable to every athlete. His focus and passion for his sport, even into his 60’s, inspires me every day to put all of my effort into being the most effective person I can be. Having someone as dedicated to their craft as my coach was as a mentor has inspired me to have that same role in someone else’s life.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}":{"__typename":"School","uuid":"7f9a6683-e17a-47fa-9e6d-534e82c727e1","name":"Brooklyn Technical High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11217"},"Education:{\"uuid\":\"63136f42-15fb-4be7-b5c8-c69ec43d5171\"}":{"__typename":"Education","uuid":"63136f42-15fb-4be7-b5c8-c69ec43d5171","school":{"__ref":"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}":{"__typename":"School","uuid":"9a91466f-187b-4e9b-8a98-c02cef7bf621","name":"University of Michigan","city":"Ann Arbor","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48109"},"Education:{\"uuid\":\"3482d94f-a0ef-4f25-8e04-98837ee1e458\"}":{"__typename":"Education","uuid":"3482d94f-a0ef-4f25-8e04-98837ee1e458","school":{"__ref":"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"991c0c36-e492-4847-bdf1-daecedd071bd\"}":{"__typename":"MentorPublicProfile","uuid":"991c0c36-e492-4847-bdf1-daecedd071bd","displayName":"Joe D.","slug":"joe-dittmann","biography":"\u003cp\u003eHi! My name is Joe, and I am currently a Sophomore studying Economics at the University of Michigan. My love for learning originates from a love for track and field in high school. Being passionate about my sport allowed me to develop an obsession with the science of how athletes move. My fascination with training quickly led me to spend countless nights reading kinesiology and anatomy papers. While I no longer run track and field, this high school pastime introduced me to a world of academics and how to relate hobbies to academics, making learning much more enjoyable.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was born and raised in Brooklyn, New York, and I believe that growing up in the city has given me a unique perspective that I could not have gotten anywhere else. Growing up in such a diverse and culturally rich area has allowed me the privilege of meeting people of all walks of life. I love New York because whether you are a street vendor or you work at a hedge fund on Wall Street, we all walk the same streets and ride the same subways.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy high school experience is what I would consider New York in a bubble. Going to the largest public high school in the country was certainly something that had a major role in shaping me into who I am today. While going to a school with 6,000 kids seemed daunting at first, I learned invaluable lessons about how to advocate for myself. It was in high school that I first found inspiration in teaching. I believe that all it takes is one outstanding teacher to completely reshape how a child views learning and that teacher came for me in my Junior year AP Biology class. This teacher brought so much energy and excitement to her classroom that it inspired in how I work with children. My dream is to have an impact on my students in the same way my junior year biology teacher had a positive impact on me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWorking with children and helping people is one of my passions. I started tutoring in highschool during the pandemic when children were really struggling to adapt to a different style of education. I have spent my last three summers as a camp counselor for the 4-5 year old group at a community center in uptown Manhattan. Although managing a group of children can be challenging at times, their endless energy and positivity inspire me to be a more enthusiastic person in my daily life and I plan to use this enthusiasm to encourage my students to be more interested in learning and succeed in whatever academic pursuits they choose.\u003c/p\u003e","teachingVideoPlaybackId":"UUrECOBAqh7y006Vjt589CTRwc78RkTf01WcCZ65QASBg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7a823b27-940d-4b7f-910e-30ba3c1651ec\"}"},{"__ref":"Favorites:{\"uuid\":\"b369af53-7360-4500-8f52-9093c3706d23\"}"},{"__ref":"Favorites:{\"uuid\":\"81a38c17-ea35-4d22-85cd-bb64d8529b6a\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"92323656-3c67-4bcf-803e-6559292f3576\"}"},{"__ref":"DeepDives:{\"uuid\":\"e36af036-e38f-4986-b1af-03726c448b9a\"}"},{"__ref":"DeepDives:{\"uuid\":\"80ff0a0b-0112-4da7-97ba-35c2f5622b62\"}"},{"__ref":"DeepDives:{\"uuid\":\"2b57a8a9-4795-4b44-a0bd-751a95926411\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1abda7a1-b91d-47c4-88a8-d9e156a2c7ce/-/preview/-/format/jpg/","https://ucarecdn.com/2bc72093-342c-4e08-a24b-a170a14ec9ce/-/preview/-/format/jpg/","https://ucarecdn.com/809e319c-784b-42c5-94e3-c334b4931e78/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"63136f42-15fb-4be7-b5c8-c69ec43d5171\"}"},{"__ref":"Education:{\"uuid\":\"3482d94f-a0ef-4f25-8e04-98837ee1e458\"}"}],"hiredAt":"2025-06-12T09:06:37.373Z","topics":["K-5 Grade Math","Pre-Algebra","Writing","Academic Coaching","Executive Function","K-6 Storybook","Creative Writing","Sports Journalism","Video / Photography","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"joe-dittmann\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"991c0c36-e492-4847-bdf1-daecedd071bd\"}"}}},"_sentryTraceData":"e7273f6fe4f74856ac747771b078715c-81e4a604a1e1d669-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e7273f6fe4f74856ac747771b078715c,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"joe-dittmann"},
