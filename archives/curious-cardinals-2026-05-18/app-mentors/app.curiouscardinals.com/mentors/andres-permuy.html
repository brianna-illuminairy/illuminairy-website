xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4318fc66-1b93-48ea-87cd-233ccb95997b\"}":{"__typename":"Favorites","uuid":"4318fc66-1b93-48ea-87cd-233ccb95997b","photoUrl":"https://ucarecdn.com/ac7a0160-2f54-4cd9-a0a4-f33735cff4f6/","title":"Washington Capitals","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"a98888fc-12e0-4303-b4e2-5d5f6c4b8ac2\"}":{"__typename":"Favorites","uuid":"a98888fc-12e0-4303-b4e2-5d5f6c4b8ac2","photoUrl":"https://ucarecdn.com/832f300a-b5e0-42c8-a813-ff396205314f/","title":"Ice Hockey","type":"SPORT"},"Favorites:{\"uuid\":\"46461b4e-77fe-4def-affa-5975381b2c63\"}":{"__typename":"Favorites","uuid":"46461b4e-77fe-4def-affa-5975381b2c63","photoUrl":"https://ucarecdn.com/60bf3ed9-f4d9-4cee-b3f1-525c46dae631/","title":"GRiZ","type":"ARTIST"},"CausesSupported:{\"uuid\":\"ab0f7a0b-42ae-4981-978e-c2588714f6c3\"}":{"__typename":"CausesSupported","uuid":"ab0f7a0b-42ae-4981-978e-c2588714f6c3","name":"Students for the Exploration and Development of Space (SEDS-USA)","description":"\u003cp\u003e\u003cem\u003eFormer Board of Directors: \u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eVice Chair \u0026amp; Member-At-Large\u003c/em\u003e\u003c/p\u003e","photoUrl":"https://ucarecdn.com/2dba4ee5-775e-4371-b54e-05d287498f8b/"},"CausesSupported:{\"uuid\":\"114f61c9-0558-4370-99b8-522553cada5f\"}":{"__typename":"CausesSupported","uuid":"114f61c9-0558-4370-99b8-522553cada5f","name":"Space Generation Advisory Council","description":"\u003cp\u003eDelegate and member of the Japan Team\u003c/p\u003e","photoUrl":"https://ucarecdn.com/6a504a26-272d-4fc2-948a-87061aea8dab/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"edd2e704-5068-4734-bb4f-f6ec0e71639a\"}":{"__typename":"DeepDives","uuid":"edd2e704-5068-4734-bb4f-f6ec0e71639a","content":"\u003cp\u003eMy dream job is to be an orbital roboticist who helps make our atmosphere and orbits cleaner and safer, and the space industry more accessible.  I want my work to benefit others and the greater good, while also inspiring the next generation of leaders in space.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4ce50cad-5c0b-42ae-98a3-843fea311433\"}":{"__typename":"DeepDives","uuid":"4ce50cad-5c0b-42ae-98a3-843fea311433","content":"\u003cp\u003eMentorship is by far one of the most important and impactful ways to give back to your community.  Throughout my academic and professional career, I have had multiple mentors who have helped me become who I am today.  Knowing firsthand how impactful a mentor can be, I've always made it a priority to reach back and bring other students along as I progress.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFrom making connections and bringing students to their first conferences to tutoring and college essay review, I do what I can to help students the same way I was helped in the past.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEspecially for a field like robotics, all you need is that first push to get started!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"15fa459f-df03-401d-9678-a9c6e48d5cb3\"}":{"__typename":"DeepDives","uuid":"15fa459f-df03-401d-9678-a9c6e48d5cb3","content":"\u003cp\u003eI would give them a piece of advice that I received late in high school that helped me later on:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\"Don't let the perfect be the destroyer of the good.\"\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOften, with students, imposter syndrome gets in the way of networking, and failure can freeze progress on personal projects and ambition. What I learned to realize in late high school and early in university is that:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003eEveryone is just a person; you can't be afraid to reach out for help or information.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eYou \u003cu\u003eneed\u003c/u\u003e to fail to make meaningful progress and learn to adapt and take things in stride.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter learning that there were no perfect people, projects, or ways to do something, I gave myself the freedom to learn and push myself to new goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"05ab522c-2f47-4e30-a06c-72958d27b637\"}":{"__typename":"DeepDives","uuid":"05ab522c-2f47-4e30-a06c-72958d27b637","content":"\u003cp\u003eEver since the 2016 release of Boston Dynamics' SPOT prototype, when I was in high school, I knew I wanted to work in robotics.  However, even though I knew what, I didn't know why or what for.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo answer these questions for myself, I went to study physics at Georgetown as part of the Columbia Engineering Combined plan rather than taking the typical route of going straight to an engineering school.  Here, I took advantage of Georgetown's global network and connections to policy and law to explore issues I could address through my interests in space and robotics.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile there, I discovered ISAM technology and orbital debris mitigation, which finally answered my question of what issue I wanted to solve.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI studied abroad at Waseda University in Tokyo and interned at a Japanese space company to gain another perspective on robotic applications and engineering, then returned to the US and began specializing in engineering and robotics at Columbia University.  With my background in Physics and an end goal in mind, studying engineering is now what I love and has never been more fun!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"fd124514-dfde-4118-ae01-f9d9ac4e70a2\"}":{"__typename":"School","uuid":"fd124514-dfde-4118-ae01-f9d9ac4e70a2","name":"Columbia University (SEAS), Georgetown University, \u0026 Waseda University (ASE)","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"3076853b-f772-4752-ad92-ca320d73a766\"}":{"__typename":"Education","uuid":"3076853b-f772-4752-ad92-ca320d73a766","school":{"__ref":"School:{\"uuid\":\"fd124514-dfde-4118-ae01-f9d9ac4e70a2\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2027","major":"M.S. Robotics \u0026 Controls, B.S. Mechanical Engineering \u0026 Physics","degree":null},"School:{\"uuid\":\"33c2ed0a-fdb7-445e-a5c2-8376051981b1\"}":{"__typename":"School","uuid":"33c2ed0a-fdb7-445e-a5c2-8376051981b1","name":"Georgetown Preparatory School","city":"North Bethesda","type":"HIGH","state":"Maryland","country":"United States","zip":"20852"},"Education:{\"uuid\":\"bb0a0997-bea5-49ff-8619-93311a383e48\"}":{"__typename":"Education","uuid":"bb0a0997-bea5-49ff-8619-93311a383e48","school":{"__ref":"School:{\"uuid\":\"33c2ed0a-fdb7-445e-a5c2-8376051981b1\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"3932c9b2-7a52-4ea8-b3c2-961a6920b750\"}":{"__typename":"MentorPublicProfile","uuid":"3932c9b2-7a52-4ea8-b3c2-961a6920b750","displayName":"Andres P.","slug":"andres-permuy","biography":"\u003cp\u003eHello! My name is Andres Permuy, and I am a fourth-year Mechanical Engineering major and first-year Robotics \u0026amp; Controls graduate student at Columbia University (SEAS). In 2024, I received a Bachelor of Science in Physics with a minor in Mathematics from Georgetown University. While at Georgetown, I also studied physics and engineering abroad at Waseda University's School of Advanced Science and Engineering (ASE) in Tokyo, Japan.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile my primary focus is currently Robotics engineering, I love space and have been heavily involved in the space industry for the past five years. My current goal is to work with automation that can be utilized in the space industry for ISAM capabilities, orbital debris mitigation, and extraterrestrial exploration.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eMy Background\u003c/u\u003e:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eMy Links:\u003c/u\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cu\u003eLinkedIn\u003c/u\u003e: https://www.linkedin.com/in/andres-permuy/\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cu\u003eEngineering Portfolio\u003c/u\u003e: https://andres-permuy-engineering-portfolio.b12sites.com/index\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eIn recent years, I've worked on personal projects, internships, non-profits, mentoring, and more.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eFor robotics and space, I have been:\u003c/u\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eA graduate researcher at the Columbia Robotic Manipulation and Mobility (ROAM) Lab, where I built a back brace to suspend our robot, the claws it uses to manipulate objects, and conducted dexterity training.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eA Robotics Engineering intern at Icarus Robotics, where I full-stack designed, assembled, and configured a bimanual teleoperation robotic leader arm for space station applications.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eA Robotics and Computer Vision Intern twice at Astroscale Japan in Tokyo, developing simulation capabilities for the ADRAS-J2 mission.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eA robotics engineering shadow at KMI.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eA solo robotics researcher at the Communication, Culture, and Technology master's program at Georgetown University, focusing on the accessibility of robotics for students with no prior experience.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTaught LEGO robotics (Mindstorm/EV3) and was manager at a summer camp counselor for 4 years during high school.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eOutside of an industry and academic setting, I have:\u003c/u\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eServed as Vice Chair and Member-At-Large on the Board of Directors of the Students for the Exploration and Development of Space (SEDS-USA), earning the 2024 SpaceNews Icons Educational Outreach and Advocacy Award\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLed the new Lunabotics team at the Columbia University Space Initiative\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFounded/led the Georgetown University Space Initiative (GUSI)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eMy Specialty\u003c/u\u003e:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have both academic and interpersonal specialties that I love to share with fellow students. \u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eWithin robotics:\u003c/u\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eArduino-Based Autonomous Robotics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIntroduction of the RaspberryPi and Going Headless (Wireless)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eImplementing ROS2, SLAM, and Robotic Control\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eRobotic Design and Kinematics\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eOutside of robotics:\u003c/u\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eEngineering Portfolio Design / Workshop\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eResume / CV Review\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNetworking and How to Pitch Yourself\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCollege Essay Review\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eMe Outside the Lab:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not working on a project or in school, I love to be active and travel when I can! \u0026nbsp;I go to the gym regularly, am a brand ambassador for an electric skateboarding company, and go on rides with groups in DC and NYC, and I grew up playing Ice Hockey and Ultimate Frisbee!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also enjoy playing video games, Dungeons \u0026amp; Dragons, watching anime, and all your typical nerdy stuff (which is actually where I get most of my robotics inspiration!).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eIf you’re motivated, ambitious, and passionate about building and learning something new, let’s work together to make it happen!\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"uAogowDUkkcR9266MeerwOhKa029tEe01AiKWmHcaFlMc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy proudest achievement was the successful formation of the \u003cstrong\u003eGeorgetown University Space Initiative\u003c/strong\u003e (GUSI) during my undergraduate program at Georgetown.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring COVID, I joined the newly formed GUSI because of my interest in space and immediately dedicated myself to growing the idea into a full-fledged organization. At 19, I flew to my first conference in Colorado to begin networking and slowly started what would become the group that still runs at Georgetown. I owe everything to the opportunities this community has provided me, and I am so grateful for the chance to give back to the students who followed me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile leading GUSI as president, I became involved in our parent organization's leadership and joined the Board of Directors of the Students for the Exploration and Development of Space (SEDS-USA). I began representing students both at Georgetown and nationally, appearing on panels, in workshops, and at interviews, lectures, and presentations. In 2024, we were recognized by SpaceNews with the Icons Educational Outreach and Advocacy Award.\u003cbr\u003e\u003cbr\u003eDuring the years I led GUSI, we went from meetings with only four students to having over 40 active members, a rocketry team, national collaborations with SEDS-USA, hosting a national conference, meeting with professional organizations, winning competitions, and more.\u003cbr\u003e\u003cbr\u003eI am truly proud of what GUSI has become, the community it has grown into, and the members who make it all possible. I am confident that this is just the beginning of GUSI and that Georgetown University will truly become a destination for space education in the near future.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4318fc66-1b93-48ea-87cd-233ccb95997b\"}"},{"__ref":"Favorites:{\"uuid\":\"a98888fc-12e0-4303-b4e2-5d5f6c4b8ac2\"}"},{"__ref":"Favorites:{\"uuid\":\"46461b4e-77fe-4def-affa-5975381b2c63\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ab0f7a0b-42ae-4981-978e-c2588714f6c3\"}"},{"__ref":"CausesSupported:{\"uuid\":\"114f61c9-0558-4370-99b8-522553cada5f\"}"}],"major":"M.S. Robotics \u0026 Controls, B.S. Mechanical Engineering \u0026 Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"edd2e704-5068-4734-bb4f-f6ec0e71639a\"}"},{"__ref":"DeepDives:{\"uuid\":\"4ce50cad-5c0b-42ae-98a3-843fea311433\"}"},{"__ref":"DeepDives:{\"uuid\":\"15fa459f-df03-401d-9678-a9c6e48d5cb3\"}"},{"__ref":"DeepDives:{\"uuid\":\"05ab522c-2f47-4e30-a06c-72958d27b637\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/763b4c5c-0e73-49a3-ad86-62e95ab7b334/-/preview/-/format/jpg/","https://ucarecdn.com/a676b5f2-4636-4e4e-8464-aeb434fbc43d/-/preview/-/format/jpg/","https://ucarecdn.com/f3ada4cf-e3a2-4405-978a-45f051b61f7f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3076853b-f772-4752-ad92-ca320d73a766\"}"},{"__ref":"Education:{\"uuid\":\"bb0a0997-bea5-49ff-8619-93311a383e48\"}"}],"hiredAt":"2025-12-24T00:10:18.251Z","t
