xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"43a121f8-4ad4-44cb-bcef-51b6840cdf4c\"}":{"__typename":"DeepDives","uuid":"43a121f8-4ad4-44cb-bcef-51b6840cdf4c","content":"\u003cp\u003eI would advise my middle school self to go into situations with open mindedness. I would advise them not to limit themselves to what they think they can and cannot do. Keeping an open mind and embracing new experiences can lead to unexpected opportunities and personal growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9797dc4b-1793-40f6-b0e2-0d17d237e0dc\"}":{"__typename":"DeepDives","uuid":"9797dc4b-1793-40f6-b0e2-0d17d237e0dc","content":"\u003cp\u003eWith the help of a mentor, an individual can succeed both academically and professionally. Mentorship has always been important to me because when I was a child I used to shy away from asking questions, but when I learned the importance of seeking help, I was able to reach my full potential. The benefits of mentoring are many in everyday life, because it helps someone step out of their comfort zone in search of knowledge and learning more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a0b4c561-7167-4c8e-b596-82a5b2f7e3bc\"}":{"__typename":"DeepDives","uuid":"a0b4c561-7167-4c8e-b596-82a5b2f7e3bc","content":"\u003cp\u003eIn my lifetime I hope to make a difference across underserved communities helping individuals mitigate stressors that they face in healthcare systems. Working with translational services I have realized the difficulties immigrants and low income populations face while receiving healthcare services. I am currently enrolled in my Masters of Healthcare Administration at Cornell to help make this dream a reality!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"8786b8f0-5e45-47ec-b32a-6503a5e02588\"}":{"__typename":"School","uuid":"8786b8f0-5e45-47ec-b32a-6503a5e02588","name":"MAST Academy Rickenbacker Causeway","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33149"},"Education:{\"uuid\":\"10198c90-75b8-4989-8262-84457d308b5d\"}":{"__typename":"Education","uuid":"10198c90-75b8-4989-8262-84457d308b5d","school":{"__ref":"School:{\"uuid\":\"8786b8f0-5e45-47ec-b32a-6503a5e02588\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"910e577c-0472-4910-b34c-7153c39111b7\"}":{"__typename":"Education","uuid":"910e577c-0472-4910-b34c-7153c39111b7","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Global and Public Health Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"4be42e82-93e3-4fc9-9544-62f74763ba6d\"}":{"__typename":"MentorPublicProfile","uuid":"4be42e82-93e3-4fc9-9544-62f74763ba6d","displayName":"Layla P.","slug":"layla-profeta","biography":"\u003cp\u003eHi! Layla Profeta is currently receiving her Masters in Health Administration at Cornell University. She recently graduated with her Bachelor’s in Science from Cornell University where she studied\u0026nbsp; Global and Public Health Sciences on the pre-med track with a minor in Creative Writing. Her combined education studying Global and Public Health Sciences and Creative Writing has shaped the way she approaches problem solving on a daily basis. In high school, she was named best teen writers for three consecutive years for her poetry where she wrote about her personal experiences and her family history of immigration from Cuba to the U.S. During this time she became involved with nonprofit management and started two nonprofit organizations focused on environment sustainability and raising money for cardiac health.\u0026nbsp;\u003cbr\u003e\u003cbr\u003eLayla spent her undergrad career studying global and public health sciences, finding new outlets to solve local, community wide and global problems individuals face in healthcare. Her minor in Creative Writing allowed her to approach these problems with a unique perspective using a think-out-of -the-box approach. \u003cbr\u003e\u003cbr\u003eSince her sophomore year of Cornell, Layla has worked in translational services, learning of the inequalities faced by minority groups in healthcare. She sought to expand her involvement in the community and develop diligent research skills guided towards enabling those who serve. As the only undergraduate researcher on the Weill Cornell Patient Activated Learning System (PALS), Layla develops medical and nutritional data for the layperson (in a 6-7 reading level). It has been entirely rewarding to use strong communication skills to help educators from the Expanded Food and Nutrition Education Programs better deliver pertinent nutrition education to patients.\u0026nbsp;She furthered these communication skills by collaborating with non-profits locally. She worked with The Learning Web, a non-profit in Ithaca that aims to ensure that young people will make the transition to adulthood successfully. With this non-profit she taught local middle school and high school students about career paths and global issues like climate change.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eLayla used these skills to work abroad in Ghana where she worked in a mobile health clinic serving rural communities and providing individuals with necessary medications. Simultaneously, she was working with a pen pal in London writing poetry for publication. Her creative experiences abroad and her research experiences led her to continue her studies at Cornell where she is gaining her Masters in Health Administration.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e","teachingVideoPlaybackId":"gWu9xBIhFbcSPAx2rCBSAFscKqzqedC8rrqthQD77VU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Global and Public Health Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"43a121f8-4ad4-44cb-bcef-51b6840cdf4c\"}"},{"__ref":"DeepDives:{\"uuid\":\"9797dc4b-1793-40f6-b0e2-0d17d237e0dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"a0b4c561-7167-4c8e-b596-82a5b2f7e3bc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8c18cd55-fd9e-401c-8de3-94a10334ceaa/-/preview/-/format/jpg/","https://ucarecdn.com/edcf8c56-e1e8-473b-bbef-e231ab296279/-/preview/-/format/jpg/","https://ucarecdn.com/64a26aa6-8a97-49de-b35e-1b190795f6b1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"10198c90-75b8-4989-8262-84457d308b5d\"}"},{"__ref":"Education:{\"uuid\":\"910e577c-0472-4910-b34c-7153c39111b7\"}"}],"hiredAt":"2023-09-27T01:29:09.569Z","topics":["K-5 Grade Math","Pre-Algebra","Al
