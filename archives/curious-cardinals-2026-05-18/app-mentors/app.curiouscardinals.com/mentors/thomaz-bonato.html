3e\u003cbr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"1b37ba5e-612e-4a1d-9b45-dd55c6fd437d\"}":{"__typename":"School","uuid":"1b37ba5e-612e-4a1d-9b45-dd55c6fd437d","name":"Unionville High School","city":"Kennett Square","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19348"},"Education:{\"uuid\":\"6d6ce4f9-6362-4177-bf74-f48eca9cf069\"}":{"__typename":"Education","uuid":"6d6ce4f9-6362-4177-bf74-f48eca9cf069","school":{"__ref":"School:{\"uuid\":\"1b37ba5e-612e-4a1d-9b45-dd55c6fd437d\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"804fd48e-f497-4cdd-9c62-392cfb1875f1\"}":{"__typename":"Education","uuid":"804fd48e-f497-4cdd-9c62-392cfb1875f1","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"AI for Business","degree":null},"MentorPublicProfile:{\"uuid\":\"3d274290-dc4f-4f10-bede-c3b143ea2014\"}":{"__typename":"MentorPublicProfile","uuid":"3d274290-dc4f-4f10-bede-c3b143ea2014","displayName":"Thomaz B.","slug":"thomaz-bonato","biography":"\u003cp\u003eHey there! 👋 My name is Thomaz (pronounced Thomas) and I am studying AI for Business at USC. I am originally from Brazil but grew up moving around in Australia, Costa Rica, and the US. I attended high school in Pennsylvania and now live between LA and Boston.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love playing basketball and tennis, exploring the outdoors, and a little chess here and there (~1000 elo, working on it!). I am also an avid reader and love challenging my thought processes through books. My friends would describe me as enthusiastic, driven, and compassionate as I love learning and helping others learn!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I have researched \u0026amp; built AI/ML projects, consulted for tech startups, and founded a legal tech startup. In the education space, I have experience tutoring middle school and high school students in calculus, algebra, physics, computer science, and the SAT.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy mission as a mentor is to guide you to discover your passions by learning hard things. However, I believe all actions need to work for, not against, our own human nature. That’s why my goal is to work with you to construct a practical path to work towards your dreams, using the tips and tricks I’ve learned along my journey in the tech space.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love working with students because teaching is personally rewarding for me. Seeing others experince the same satisfaction from understanding something like the math behind neural networks or the statistical nature of LLMs is just amazing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would love to meet you and hear about your dreams and wishes!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"030092e5-c4aa-45e8-93a9-6968947b9bff\"}"},{"__ref":"Favorites:{\"uuid\":\"ceb83b63-62dd-4fa4-be8c-2558993406ad\"}"},{"__ref":"Favorites:{\"uuid\":\"3ced7d9c-2acb-48a4-bc67-e195a24fd74b\"}"}],"causesSupported":[],"major":"AI for Business","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"89580521-77e1-4fbb-927c-4e9e0310e375\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2a46eff3-c9f0-4207-9a82-ffca83437d87/-/preview/-/format/jpg/","https://ucarecdn.com/2b70ccd2-5356-4632-be41-58d69e5258b2/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education
