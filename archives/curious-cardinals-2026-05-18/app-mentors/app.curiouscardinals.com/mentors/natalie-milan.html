-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"52c2633e-dbc3-4772-ac71-d93894d2dd6d\"}":{"__typename":"DeepDives","uuid":"52c2633e-dbc3-4772-ac71-d93894d2dd6d","content":"\u003cp\u003e\u003cstrong\u003eIt's always one day at time — so do your best today.\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"73d2f49a-5b59-4289-af09-ec0586ef476c\"}":{"__typename":"Education","uuid":"73d2f49a-5b59-4289-af09-ec0586ef476c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Sociology, Sustainability","degree":null},"School:{\"uuid\":\"96fb633b-6859-42fe-814a-4eb933861dce\"}":{"__typename":"School","uuid":"96fb633b-6859-42fe-814a-4eb933861dce","name":"El Molino High School","city":"Forestville","type":"HIGH","state":"CA","country":"USA","zip":"95446"},"Education:{\"uuid\":\"f72d60af-5249-4002-92bb-6563c7651688\"}":{"__typename":"Education","uuid":"f72d60af-5249-4002-92bb-6563c7651688","school":{"__ref":"School:{\"uuid\":\"96fb633b-6859-42fe-814a-4eb933861dce\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"342cf74d-d921-431a-a851-53f45f294494\"}":{"__typename":"MentorPublicProfile","uuid":"342cf74d-d921-431a-a851-53f45f294494","displayName":"Natalie M.","slug":"natalie-milan","biography":"\u003cp\u003eHi! I'm Natalie. Born and raised among the redwoods in Sonoma County, California, I attended Stanford and earned a BA in Sociology and MA in Sustainability Science and Practice. My passions revolve around social equality and natural conservation, and I support students in writing, research, and exploring the social impact field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, I was part of the Human and Planetary Health Action Lab, a member of the Global Health Student Council, and published research on educational equity and women's health. After graduating, I joined The Nature Conservancy, a global non-profit with a mission to protect the lands and waters that sustain all life. As a member of the Philanthropy team, I supported incredible teams developing new conservation technologies and deploying existing nature-based climate solutions across the globe. I recently moved to Lisbon, Portugal to explore the European environmental landscape!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am profoundly interested in global climate negotiations, human capacities for altruism and empathy, and the promise of planetary health and abundance. These interests have led me to 1,500+ hours of volunteer work in my home of California and around the world. Projects have ranged from designing urban greening initiatives in the San Francisco Bay Area and organizing a food justice delegation to the White House to publishing research on agricultural surplus and working on a circular farm in the mountains of Monteverde, Costa Rica. I have also been fortunate to work in Kampala, Uganda, launching a small-business incubator for local entrepreneurs, as well as Cape Town, South Africa. I bring an international lens to my work around climate justice and social equity and a timeless desire to learn from all those around me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a Curious Cardinals mentor, I strive to make my students feel seen, heard, and fully supported in their educational pursuits and beyond. It is my goal to be a listening ear, a supportive place to land, and a sounding board at every step along the way, providing actionable guidance based on my own experiences across professional and academic spheres. Speaking English and Spanish, I specialize in helping students of all ages excel in Humanities and the Social Sciences and develop and grow passion projects with an environmental and social focus. With three years of experience tutoring Stanford students 1:1 in writing and oral presentation, I am excited to help Curious Cardinals students write winning applications for programs, schools, and awards. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"barsksakGP3GBzvoKsKIN01unPOMqD8a92BEqofw006g00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Sociology, Sustainability","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"37a82947-3754-41c9-b0d5-c879ae1b5ffa\"}"},{"__ref":"DeepDives:{\"uuid\":\"c704f809-34ff-43d7-a917-2250d8fc5c20\"}"},{"__ref":"DeepDives:{\"uuid\":\"ffddf96f-420f-4191-b327-ab4b0a43758d\"}"},{"__ref":"DeepDives:{\"uuid\":\"52c2633e-dbc3-4772-ac71-d93894d2dd6d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6bf2e36f-8841-4d62-a9a4-90d9efed5c3c/-/preview/-/format/jpg/","https://ucarecdn.com/cb067cb8-ebf5-492b-8da2-d5350d498076/-/preview/-/format/jpg/","https://ucarecdn.com/9f420071-0a12-4223-bad3-965a9a0fbcef/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"73d2f49a-5b59-4289-af09-ec0586ef476c\"}"},{"__ref":"Education:{\"uuid\":\"f72d60af-5249-4002-92bb-6563c7651688\"}"}],"hiredAt":"2021-10-26T05:25:49.000Z","topics":["Writing","Academic Coaching","College Essay Writing","History","Reading","Creative Writing","K-6 Storybook","Business / Entrepreneurship","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\"
