xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"8d4bd864-88bb-4b5f-a6ff-50f32f096cd0\"}":{"__typename":"CausesSupported","uuid":"8d4bd864-88bb-4b5f-a6ff-50f32f096cd0","name":"Camp Kesem","description":"\u003cp\u003eCamp Kesem is a completely free camp for kids dealing with a parent's cancer.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/aaae3bb6-24b1-4df7-b180-a906af29f39d/"},"CausesSupported:{\"uuid\":\"d6f7e463-7663-4126-ba5d-50aadafde497\"}":{"__typename":"CausesSupported","uuid":"d6f7e463-7663-4126-ba5d-50aadafde497","name":"Best Buddies","description":"\u003cp\u003eIt provides job and friendship opportunities for those with disabilities. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/cf33c92f-d0f0-4894-a74d-adb83b779c1a/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7236f836-18d9-4838-a6ce-02ced8ee0e2d\"}":{"__typename":"DeepDives","uuid":"7236f836-18d9-4838-a6ce-02ced8ee0e2d","content":"\u003cblockquote\u003e\u003cp\u003eIn high school, I spent a lot of energy worrying about building the \"right\" resume for college. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut I've learned since then that the strongest resumes grow naturally when you invest in projects that genuinely excite you. Instead of sapping your energy, they let you indulge in your curiosity and feel proud of the work you do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHigh school can be a lot, but I really believe students can have fun \u003cem\u003eand\u003c/em\u003e do amazing things, and I'd love to help with both.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"f8d98bb0-9141-40fe-bda3-b44df6db4b35\"}":{"__typename":"School","uuid":"f8d98bb0-9141-40fe-bda3-b44df6db4b35","name":"Palo Alto High School","city":"Palo Alto","type":"HIGH","state":"California","country":"United States","zip":"94301"},"Education:{\"uuid\":\"897b6abb-f8b3-49fc-8ad1-30f2d0706545\"}":{"__typename":"Education","uuid":"897b6abb-f8b3-49fc-8ad1-30f2d0706545","school":{"__ref":"School:{\"uuid\":\"f8d98bb0-9141-40fe-bda3-b44df6db4b35\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}":{"__typename":"School","uuid":"891dad70-4e24-4602-8353-1e8140b8eb0c","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60201"},"Education:{\"uuid\":\"f6d965e6-ff99-4730-b469-27fba852533b\"}":{"__typename":"Education","uuid":"f6d965e6-ff99-4730-b469-27fba852533b","school":{"__ref":"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Data Science and Journalism","degree":null},"MentorPublicProfile:{\"uuid\":\"6ef8d945-2948-4cbf-a5ef-3c9457889d8f\"}":{"__typename":"MentorPublicProfile","uuid":"6ef8d945-2948-4cbf-a5ef-3c9457889d8f","displayName":"Grace G.","slug":"grace-gormley","biography":"\u003cp\u003eHi! I'm Grace, a sophomore in Northwestern's Medill School of Journalism, double majoring in Journalism and Data Science. I'm a big believer that if you set your mind to something you're passionate about, you can create some amazing things. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat belief is what led me to create Stand Up, Speak Out Camp in high school. It's a free journalism camp where 70+ underserved middle schoolers each picked something they cared about, reported on it, and saw their writing printed in a real magazine that they got to keep. I designed it as a feeder program into my high school's journalism program to bring in voices that hadn't been represented before, and I built it from scratch — writing the curriculum, recruiting and training my peers to be counselors, fundraising for the magazines and running the camp day-to-day (all while juggling the busyness of junior year in high school). It taught me firsthand how challenging and rewarding it is to take an abstract idea and turn it into something you're proud of.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat same drive shows up in the projects I pursue in college. Right now I'm reporting for \u003cem\u003eThe Daily Northwestern\u003c/em\u003e, working with the Knight Lab and the Mellon Foundation to turn millions of pages of government environmental surveys into a one-of-a-kind digital exhibit and freelancing for the \u003cem\u003ePalo Alto Weekly\u003c/em\u003e and other Bay Area papers. I love blending high quality data analysis with compelling storytelling, and my unique set of multidisciplinary skills means I can help you with any project you set your mind to!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love working with students — I've mentored middle schoolers through Pathwise in Palo Alto, served as a Camp Kesem Counselor where I support kids with a parent facing cancer, and I also am a Peer Adviser at Northwestern, helping new students in their transition into college. Getting to know my mentees and support them as they accomplish big things is such a joy. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not writing or wrangling data, I love swimming, playing water polo, making art, and watching \"The Great British Bake Off.\" \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'd love to help you build something you're proud of!\u003c/p\u003e","teachingVideoPlaybackId":"VdLNzgLFyFv900AtWbtZjLsPfY4DVcC7Z1KD02Ts4Axw4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"Cause
