and the world. History was that for me – I believe people are defined by our actions, and by learning our stories we can begin to see our true selves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"fe985a95-6a52-4aab-8313-677f374408ee\"}":{"__typename":"DeepDives","uuid":"fe985a95-6a52-4aab-8313-677f374408ee","content":"\u003cp\u003eWrite a book! Hopefully more than one :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d7171cc7-6831-464e-9161-f7a7bf0d0223\"}":{"__typename":"DeepDives","uuid":"d7171cc7-6831-464e-9161-f7a7bf0d0223","content":"\u003cp\u003eMentorship to me is a two-way street built on trust. I want to be learning along with my students, which means building a relationship as we develop our skills. There's nothing I love more than seeing the lightbulb go on for a student – that means it went on for me as I helped them along the way!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"8a598a98-f8af-48c9-82fd-8c32fc707fe9\"}":{"__typename":"School","uuid":"8a598a98-f8af-48c9-82fd-8c32fc707fe9","name":"Wellesley High School","city":"Wellesley","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02481"},"Education:{\"uuid\":\"4065b220-b422-4a89-a9c6-9bd2aec4951a\"}":{"__typename":"Education","uuid":"4065b220-b422-4a89-a9c6-9bd2aec4951a","school":{"__ref":"School:{\"uuid\":\"8a598a98-f8af-48c9-82fd-8c32fc707fe9\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"ad313f36-72c4-4824-8a0e-5a55e60f9cca\"}":{"__typename":"Education","uuid":"ad313f36-72c4-4824-8a0e-5a55e60f9cca","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"a8446c63-af83-4594-aa42-6410dfc913af\"}":{"__typename":"MentorPublicProfile","uuid":"a8446c63-af83-4594-aa42-6410dfc913af","displayName":"Zach M.","slug":"zach-miller","biography":"\u003ch1\u003e\"Just remember that your real job is that if you are free, you need to free somebody else. If you have some power, then your job is to empower somebody else.\"\u003c/h1\u003e\u003cbr\u003e\u003cp\u003eZach Miller is a 26-year-old graduate of Columbia University and a lifelong learner, writer, and reader. A US History major and student journalist at Columbia, he spent three years after graduating working in Crisis Communications for clients at the apex of politics, business, and entertainment before leaving to focus on immigration advocacy and legal defense. You can often find him riding the New York City subway, novel in hand, listening to the perfect album. \u003cbr\u003e\u003cbr\u003eZach is intensely passionate about the written word, and believes the love of language can be cultivated at any age or  development level. He has spent the past six years tutoring formerly incarcerated students of all ages as they work towards advanced degrees, first through Columbia's Justice-in-Education initiative and later through the Petey Greene Program. The basics, like reading, always come first – to Zach, the \"right\" way to learn is however a student feels most comfortable building their skills, whether in something as esoteric as creative writing or as tangible as foundational mathematical concepts. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eZach's first love was journalism, for which he won numerous awards as the editor-in-chief of his high school newspaper. Since then, he has never stopped searching for truth: in stories, in people, and in how we can better share, grow, and learn together.\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Pxf1LqFJ6eOS6ZVWMbxRffTrlUuK3lQRK6P4WSbm00gw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eAt my previous job working in crisis communications, I was part of E. Jean Carroll's trial team in her multiple successful lawsuits against then-former President Trump. It was my honor to help secure her millions of dollars in damages and spread her story of proud survival to the world!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4d6a6021-c7ba-421d-919d-b8f8bc4844e9\"}"},{"__ref":"Favorites:{\"uuid\":\"7d7456cb-c6a0-4b7e-ac4c-3003d2a820e0\"}"},{"__ref":"Favorites:{\"uuid\":\"f800fbc6-4cbc-440c-8624-37871c2f7f81\"}"}],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e5df9b6a-da4e-43ed-83ad-ddfecc054218\"}"},{"__ref":"DeepDives:{\"uuid\":\"391b7ae6-7cce-410b-8f86-558c7bdd473e\"}"},{"__ref":"DeepDives:{\"uuid\":\"fe985a95-6a52-4aab-8313-677f374408ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7171cc7-6831-464e-9161-f7a7bf0d0223\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/71665145-3772-4b34-9b03-70b73cf0e648/-/preview/-/format/jpg/","https://ucarecdn.com/4d53a150-76f7-49e5-869d-9afbdc354df3/-/preview/-/format/jpg/","https://ucarecdn.com/492520c5-b397-4cb3-b588-89e7075b020b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4065b220-b422-4a89-a9c6-9bd2aec4951a\"}"},{
