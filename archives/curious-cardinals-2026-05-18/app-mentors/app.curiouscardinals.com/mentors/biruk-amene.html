ar":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"bfd4c712-b93a-40e9-ba91-bd7edca52900\"}":{"__typename":"MentorPublicProfile","uuid":"bfd4c712-b93a-40e9-ba91-bd7edca52900","displayName":"Biruk A.","slug":"biruk-amene","biography":"\u003cp\u003eHi! My name is Biruk, and I’m a senior at Duke University pursuing a Bachelor’s degree in Computer Science. I was born in Houston, Texas, and grew up in Apex, North Carolina alongside my younger brother and sister. Growing up in a household where I often helped my siblings with schoolwork played a major role in shaping my sense of responsibility and mentorship from an early age. This carried into my high school years, where I became actively involved in tutoring and academic support through various extracurricular programs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was a member of the Technology Engineering and Design Academy, a four-year STEM program that exposed me to rigorous coursework across engineering, mathematics, and computer science. Through this program, I worked on long-term technical projects, collaborated with peers, and developed strong problem-solving skills. It was during this time that I discovered my passion for computer science and its ability to create practical, impactful solutions. Additionally, as a member of Mu Alpha Theta, I regularly tutored students after school in subjects ranging from algebra to calculus, further strengthening my ability to explain complex concepts clearly and patiently.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Duke, I have continued to pursue both academic excellence and professional development. I’m actively involved in Catalyst, the university’s premier pre-professional technology organization, as well as the Duke Applied Machine Learning Group, where I engage with peers who share an interest in cutting-edge technology and software development. These experiences have allowed me to grow not only as a technical thinker but also as a collaborator and leader.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past summer, I interned as a software engineer at Atlassian in their New York City office, where I gained hands-on experience working on real-world systems in a professional engineering environment. Following graduation, I will be returning to Atlassian full-time as a software engineer.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy going to the gym, playing basketball, working on personal projects, reading, and watching shows. Balancing a full course load with extracurricular and professional commitments has strengthened my time-management skills and reinforced my strong work ethic. I am highly motivated, goal-oriented, and committed to consistently pushing myself to achieve long-term success.\u003c/p\u003e","teachingVideoPlaybackId":"1wbze94mxqSmWRcbdPHlgVRG026ai01b4hcvFqrnNmBTk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9ec335af-7d8a-4926-9c80-810621818ce1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2e527d96-e5fc-4fc4-acab-a8ad4ea7bd41/-/preview/-/format/jpg/","https://ucarecdn.com/c731eb61-fa55-44a0-9a3a-8e75ce8b661b/-/preview/-/format/jpg/","https://ucarecdn.com/18738051-1766-4728-ae84-b6253e4aee7e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"190ee632-f867-4e1b-9a0d-e09480d82fc0\"}"},{"__ref":"Education:{\"uuid\":\"82e60df2-9e42-465e-b1b8-296db74c9074\"}"}],"hiredAt":"2024-02-27T12:45:45.123Z","topics":["Web Design","Coding / Programming","Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Computer Science"],"communityBadges":["https://ucarecdn.com/c942d968-716c-4352-9dd1-9c8441a54458/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]}
