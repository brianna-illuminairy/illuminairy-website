xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"470b4336-9696-4334-a149-a6f080f780f8\"}":{"__typename":"Favorites","uuid":"470b4336-9696-4334-a149-a6f080f780f8","photoUrl":"https://ucarecdn.com/e6b3b303-295b-4b78-becb-51369fd91fdf/","title":"Laufey","type":"ARTIST"},"Favorites:{\"uuid\":\"7f2bb86b-edb6-426a-9421-47c8831e6279\"}":{"__typename":"Favorites","uuid":"7f2bb86b-edb6-426a-9421-47c8831e6279","photoUrl":"https://ucarecdn.com/d934e701-c0b8-4c9d-85d0-1df6a274960e/","title":"The Hunger Games","type":"BOOK"},"Favorites:{\"uuid\":\"d35fa9aa-92aa-4b2f-9bb0-2020f6c43505\"}":{"__typename":"Favorites","uuid":"d35fa9aa-92aa-4b2f-9bb0-2020f6c43505","photoUrl":"https://ucarecdn.com/cfe1e9dd-1d6b-4236-b7cb-0a8d2561d51c/","title":"Minecraft","type":"GAME"},"CausesSupported:{\"uuid\":\"35d0ae1b-6581-45bc-a9b1-a1f40950620d\"}":{"__typename":"CausesSupported","uuid":"35d0ae1b-6581-45bc-a9b1-a1f40950620d","name":"The Humane Society","description":"\u003cp\u003eAs someone who loves animals, caring for them is very important to me!\u003c/p\u003e\u003cbr\u003e","photoUrl":"https://ucarecdn.com/5450d4d1-83b2-40a0-b779-e2c117633de7/"},"CausesSupported:{\"uuid\":\"d50e659d-3ede-412a-a2f5-412f996915e9\"}":{"__typename":"CausesSupported","uuid":"d50e659d-3ede-412a-a2f5-412f996915e9","name":"Science Club for Girls","description":"\u003cp\u003eI am passionate about increasing interest in STEM among girls!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/82e34ca5-ec07-4951-a9d8-dec341b9f088/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6855bc8b-53cf-46ab-8e52-dd7c294f81e5\"}":{"__typename":"DeepDives","uuid":"6855bc8b-53cf-46ab-8e52-dd7c294f81e5","content":"\u003cp\u003eMy dream job is to work on flight computers as an electrical engineer and explore how artificial intelligence can be applied to the space industry! I’m especially interested in the intersection of computer science and aerospace engineering, and I really enjoy learning how both fields come together to solve complex problems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"107e5e63-0794-463b-8fcd-1adcdef6588e\"}":{"__typename":"DeepDives","uuid":"107e5e63-0794-463b-8fcd-1adcdef6588e","content":"\u003cp\u003eIn middle school, I was a quiet, thoughtful student who loved reading and learning independently. I spent a lot of time exploring my interests on my own, and by high school, I had become more confident in sharing my ideas with others and taking on new challenges!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"379f8428-1f82-42dd-86f6-9c6234ed3c8e\"}":{"__typename":"DeepDives","uuid":"379f8428-1f82-42dd-86f6-9c6234ed3c8e","content":"\u003cp\u003eMentorship has always been important to me because of my grandpa. He taught me how to build model planes and showed me how to work through problems step by step without just giving me the answers. That experience stuck with me, and I love being able to do the same for students by helping them explore what they’re interested in and feel more confident taking on challenges.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b569c95d-7e77-4bd6-b04d-836d95b4955b\"}":{"__typename":"DeepDives","uuid":"b569c95d-7e77-4bd6-b04d-836d95b4955b","content":"\u003cp\u003eI would tell myself to trust the process and not be afraid to explore new interests or take on challenges! Looking back, I realize that asking for help from my grandpa or teachers made a huge difference. Now, as a mentor, I try to give students the same encouragement I wish I had, helping them gain confidence and realize that they’re capable of more than they might think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"d3e286ce-ba4a-41d0-b958-d2d94453ac32\"}":{"__typename":"School","uuid":"d3e286ce-ba4a-41d0-b958-d2d94453ac32","name":"The Out-of-Door Academy - Middle \u0026 Upper School - Lakewood Ranch","city":"Sarasota","type":"HIGH","state":"Florida","country":"United States","zip":"34240"},"Education:{\"uuid\":\"d23a9179-61d3-4a65-ad35-fef478e5214b\"}":{"__typename":"Education","uuid":"d23a9179-61d3-4a65-ad35-fef478e5214b","school":{"__ref":"School:{\"uuid\":\"d3e286ce-ba4a-41d0-b958-d2d94453ac32\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}":{"__typename":"School","uuid":"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a","name":"Massachusetts Institute of Technology","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02139"},"Education:{\"uuid\":\"3ca6dfc7-2194-455f-b5d6-86791e7f5659\"}":{"__typename":"Education","uuid":"3ca6dfc7-2194-455f-b5d6-86791e7f5659","school":{"__ref":"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Electrical Engineering \u0026 Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"f6f47530-1ce5-4fcf-b838-82e82457948b\"}":{"__typename":"MentorPublicProfile","uuid":"f6f47530-1ce5-4fcf-b838-82e82457948b","displayName":"Kaitlyn R.","slug":"kaitlyn-roman","biography":"\u003cp\u003eHello! I’m Kaitlyn, a first-year MIT student studying electrical engineering and computer science with an interest in designing software and hardware for aerospace applications. I’m passionate about helping students use their interests to create exciting, hands-on projects while developing academic expertise and strong project and time-management skills!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Journey\u003c/strong\u003e\u003cbr\u003eWhen I was in high school, I knew I was passionate about space, but I didn’t know how to pursue that interest while balancing academics, music, and time with family and friends. Through lots of trial and error, I learned how to pursue STEM beyond the classroom, create opportunities to share my interests with others, and manage my time effectively while maintaining a healthy sleep schedule and pursuing my hobbies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCompeted in the Conrad Challenge\u003c/strong\u003e, a STEM entrepreneurship competition, designing a nanotechnology-enhanced astronaut suit with an international team and earning the second-highest title\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFounded a STEM outreach club\u003c/strong\u003e by partnering with a local Title I elementary school to conduct fun science experiments and engineering challenges with over 35 students, growing the club from 4 to 11 members\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilt an RC plane from scratch\u003c/strong\u003e for my senior project, learning about aerodynamics and stability while constructing a tangible aircraft\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePerformed as a violist\u003c/strong\u003e for my school orchestra, local youth orchestra, and Honors Florida All-State Orchestra\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow, at MIT, I:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDevelop power circuit boards for the MIT Rocket Team’s avionics projects\u003c/strong\u003e, collaborating with multiple subteams to build a unified rocket system\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePerform in the MIT Symphony Orchestra as a violist\u003c/strong\u003e, rehearsing approximately five hours per week\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStudy effectively for my science and engineering classes\u003c/strong\u003e while still making time to read, watch my favorite shows and movies, connect with family and friends, and prioritize sleep\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eHow I Can Help You\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI specialize in guiding K–12 students through:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic Mentorship:\u003c/strong\u003e math, physics, computer science, chemistry, music, and economics, executive function\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion Projects:\u003c/strong\u003e starting a new club or nonprofit, gaining internships or research experiences, designing engineering prototypes, or composing original creative works\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege Preparation:\u003c/strong\u003e crafting a compelling personal narrative, selecting best-fit universities, editing personal statements and supplemental essays, and refining activities and awards lists\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m Qualified\u003c/strong\u003e\u003cbr\u003eI’m passionate about teaching and have developed strong mentorship skills through:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eServing as Academic Prefect in my school’s house system\u003c/strong\u003e, organizing study opportunities for 70+ students while tutoring in math, science, English, Spanish, and social sciences\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWorking as a part-time math tutor\u003c/strong\u003e for local elementary and middle school students\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eVolunteering as a middle school mentor for beginning violists\u003c/strong\u003e, teaching proper posture, intonation, and technical skills\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eRecently navigating one of the most competitive college admissions cycles\u003c/strong\u003e, earning admission to MIT, Georgia Tech, and other top universities\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eWhat Typical Sessions With Me Look Like\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademic Mentorship:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eUsing the Socratic Method\u003c/strong\u003e to guide students toward an intuitive understanding of complex topics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWorking through practice problems together\u003c/strong\u003e with an emphasis on reasoning, confidence, and independence\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDeveloping effective study strategies\u003c/strong\u003e, organization systems, and time-management skills\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePassion Projects \u0026amp; College Preparation:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBrainstorming and refining passion project ideas\u003c/strong\u003e aligned with the student’s interests\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBreaking long-term goals into manageable steps\u003c/strong\u003e with realistic timelines and tracking progress during weekly sessions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCrafting a cohesive personal narrative and editing essay\u003c/strong\u003es for clarity, authenticity, and strong storytelling\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eFun Facts About Me!\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI love spending time with my two Bernedoodles, Maya (“Goose”) and Maverick (both names inspired by Top Gun)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI enjoy playing video games, reading, baking, going to the gym, and exploring Boston\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI’ve been in the eye of a Category 3 hurricane\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"ImYsxgg2fduyaR3iWO2n8GnaoL01fMjbybwmcHnh5J02A","teachingVideo
