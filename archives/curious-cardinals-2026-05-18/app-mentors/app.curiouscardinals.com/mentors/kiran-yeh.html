xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d4af8645-c1f6-41c7-9e80-a863d995a72c\"}":{"__typename":"Favorites","uuid":"d4af8645-c1f6-41c7-9e80-a863d995a72c","photoUrl":"https://ucarecdn.com/8bf3b0fb-2c1b-4a01-80dd-afc7a47148c9/","title":"Little Women (2019)","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"76525fff-0d7c-4033-9395-4d9db55079c3\"}":{"__typename":"DeepDives","uuid":"76525fff-0d7c-4033-9395-4d9db55079c3","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I’d say: don’t do things just to get into college—do them because you care. Looking back, I wish I had pursued what genuinely interested me instead of worrying so much about what would look good on an application. Now that I’m in college, I find myself wishing I had read more of the books that scared me and taken the harder classes without the fear of getting a bad grade. I wish I had given myself the freedom to discover the passions I now know I have. And more than anything, I wish I had spent more time with my friends—learning from them, laughing with them, and realizing that some of the best education comes from the people around you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a4f0f34d-df1b-4ebb-a1ea-a8b3fca37749\"}":{"__typename":"DeepDives","uuid":"a4f0f34d-df1b-4ebb-a1ea-a8b3fca37749","content":"\u003cp\u003eI chose my major because it’s deeply interdisciplinary and offers the freedom to explore a range of interests. I’ve always been drawn to history, literature, and politics—especially topics related to the American founding and government. American Studies allows me to connect these areas in meaningful ways and think critically about the forces that shape our society. I’m also hoping it will give me a strong foundation for a future in law.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"949e1458-b760-4b3e-b462-f8cbf7260522\"}":{"__typename":"DeepDives","uuid":"949e1458-b760-4b3e-b462-f8cbf7260522","content":"\u003cp\u003eDuring the summer after my freshman year, I wrote curriculum and shared personal stories through Youth Communication. In my sophomore summer, I participated in the NBC Young Leaders in Journalism program, the School of The New York Times, and Girls Who Code. The following year, I interned at the American Civil Liberties Union, where I explored my interests in civil liberties and advocacy. The summer after senior year, I traveled to Ladakh, India, and spent a week trekking with my parents—a meaningful and grounding experience before starting college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7fd9d2fb-accc-4de1-a51e-22bd029a13ae\"}":{"__typename":"DeepDives","uuid":"7fd9d2fb-accc-4de1-a51e-22bd029a13ae","content":"\u003cp\u003eMentorship matters to me because I wouldn’t be where I am without it. In high school, as someone whose parents didn’t go through the college system and who attended a public school with limited resources, I often felt unsure about how to navigate the process. I turned to older students who had been in my shoes—they gave me guidance, shared their experiences, and helped me focus on what really mattered. Their support made all the difference, and I want to be that kind of resource for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}":{"__typename":"School","uuid":"7f9a6683-e17a-47fa-9e6d-534e82c727e1","name":"Brooklyn Technical High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11217"},"Education:{\"uuid\":\"258eb24e-879c-4c72-9a7e-56f104d99922\"}":{"__typename":"Education","uuid":"258eb24e-879c-4c72-9a7e-56f104d99922","school":{"__ref":"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"57a0d06a-8294-491b-aca9-287077ed89c2\"}":{"__typename":"Education","uuid":"57a0d06a-8294-491b-aca9-287077ed89c2","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"American Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"3eee17c1-5c67-4d67-b90c-4292c4f950cb\"}":{"__typename":"MentorPublicProfile","uuid":"3eee17c1-5c67-4d67-b90c-4292c4f950cb","displayName":"Kiran Y.","slug":"kiran-yeh","biography":"\u003cp\u003eKiran Yeh is from Brooklyn, New York, and a graduate of Brooklyn Technical High School, where she majored in Law and Society. Through this intensive program, she explored the intersections of government, policy, and justice by taking courses in criminal law, constitutional law, civil law, and criminal procedure, all while completing an Advanced Placement curriculum. Her coursework gave her a strong foundation in legal reasoning and civic engagement, which she deepened through participation in several civic fellowship programs focused on youth leadership and community advocacy. She has a strong understanding of the New York City school system and what opportunities are available to students in the area.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond the classroom, Kiran was deeply involved in journalism, an interest that became central to her academic and extracurricular identity. She participated in several journalism-focused initiatives, including NBC Young Leaders in Journalism, Youth Communication, and The School of the New York Times, where she learned how storytelling can shape public understanding of justice and democracy. Over time, she merged her passions for media and law by advocating for First Amendment rights and freedom of the press for student journalists. In addition, she won the PEN American Free Expression essay in 2023. She was a fellow with Press Pass NYC on a citywide project to expand access to journalism programs across New York City public high schools, ensuring that students from all backgrounds could share their stories. For her commitment to youth journalism, she was named the New York State Journalist of the Year in 2024.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale University, Kiran is majoring in American Studies, a discipline that allows her to examine the cultural and political forces shaping the United States. She was a student in Directed Studies, an intensive interdisciplinary program grounded in the Western canon, where she developed her skills in close reading, analytical writing, and philosophical inquiry. Currently, she is taking a Yale Law School seminar on the Constitution, exploring how legal principles evolve in response to political and social change.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHer professional experiences include internships at the American Civil Liberties Union, Freedom Reads, Amica Center for Immigrant Rights, Human Rights First, and the Center for Democracy and Technology, where she contributed to projects at the intersection of civil liberties, criminal justice, and storytelling.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLooking ahead, she hopes to continue combining her interests in law, literature, and advocacy to uplift different communities and voices. In her free time, Kiran enjoys running, reading contemporary fiction, and exploring new places to eat good food.\u003c/p\u003e","teachingVideoPlaybackId":"UnI026RozD8dalJg00loy9C01o5PGf5VAmg5bibDc8fDL4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBecoming Editor-in-Chief of my high school newspaper, and getting to tell my grandfather.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d4af8645-c1f6-41c7-9e80-a863d995a72c\"}"}],"causesSupported":[],"major":"American Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"76525fff-0d7c-4033-9395-4d9db55079c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"a4f0f34d-df1b-4ebb-a1ea-a8b3fca37749\"}"},{"__ref":"DeepDives:{\"uuid\":\"949e1458-b760-4b3e-b462-f8cbf7260522\"}"},{"__ref":"DeepDives:{\"uuid\":\"7fd9d2fb-accc-4de1-a51e-22bd029a13ae\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/192032c7-2331-485b-b9ce-7e175846f4c2/-/preview/-/format/jpg/","https://ucarecdn.com/0bbbe9db-a07f-4f87-bf91-baba727bd21c/-/preview/-/format/jpg/","https://ucarecdn.com/283b8590-f067-4e9f-bfb4-c40755b9067c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"258eb24e-879c-4c72-9a7e-56f104d99922\"}"},{"__ref":"Education:{\"uuid\":\"57a0d06a-8294-491b-aca9-287077ed89c2\"}"}],"hiredAt":"2025-04-10T05:17:38.135Z","topics":["Algebra I","Algebra II","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Writing","Spanish","Academic Coaching","College Essay Writing","Executive Function","History","Reading","Creative Writing","History Project","K-6 Storybook","Journalism","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kiran-yeh\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3eee17c1-5c67-4d67-b90c-4292c4f950cb\"}"}}},"_sentryTraceData":"6d3825c9c0464f52896901c7b656196f-b16b10588680f2c9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=6d3825c9c0464f52896901c7b656196f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"kiran-yeh"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?
