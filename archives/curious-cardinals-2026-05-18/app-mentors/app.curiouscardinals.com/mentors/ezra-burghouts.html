xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3694eb5c-47bf-493a-981d-d399bf07dc53\"}":{"__typename":"Favorites","uuid":"3694eb5c-47bf-493a-981d-d399bf07dc53","photoUrl":"https://ucarecdn.com/9619bbf0-3d6a-4073-b704-d94e69b01cb1/","title":"Discovery - Daft Punk","type":"ALBUM"},"Favorites:{\"uuid\":\"fdc13974-dce9-4141-928e-7af02ce59666\"}":{"__typename":"Favorites","uuid":"fdc13974-dce9-4141-928e-7af02ce59666","photoUrl":"https://ucarecdn.com/c483d68f-fe64-429e-ad16-596fa3b990ff/","title":"Rotterdam, The Netherlands","type":"CITY"},"Favorites:{\"uuid\":\"a73a654e-ce18-48a1-bd8c-f48b5d310118\"}":{"__typename":"Favorites","uuid":"a73a654e-ce18-48a1-bd8c-f48b5d310118","photoUrl":"https://ucarecdn.com/86445d44-8721-43d2-b1a3-cdc9941630b4/","title":"Inglorious Basterds","type":"MOVIE"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c1d1b83d-cfe8-4c7e-bea2-747e0dcc5f7d\"}":{"__typename":"DeepDives","uuid":"c1d1b83d-cfe8-4c7e-bea2-747e0dcc5f7d","content":"\u003cp\u003eA project I’ve been especially proud of is creating a detailed model of the ancient Aztec city of Tenochtitlan. I have an immense passion history and a strong curiosity to uncover as much as possible about past civilizations. Unfortunately, the effects of Spanish colonization of the Americas have made it impossible to experience the city in its original form today. Reconstructing it myself, through extensive research into its culture, architecture, and infrastructure, was a fun experience which not only stimulated my wonder for the city but allowed me to use my artistic skills.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4c7ec1cd-27a2-4a55-ba0b-740516f30d06\"}":{"__typename":"DeepDives","uuid":"4c7ec1cd-27a2-4a55-ba0b-740516f30d06","content":"\u003cp\u003eAs a child, my biggest passion was biology and learning all about the organisms of the world, how all different organisms, including humanity, are interconnected through ecosystems. However, as a teenager, my curiosity shifted focus towards the field of history and how all human experiences have impacted the world and led us to where we are today. I am always striving to understand the basis of the world and what makes everything turn. My effort to comprehend complex systems and basic principles naturally led me to an interest of pursuing a major in mathematics, which provides the logical framework and tools necessary to explore and understand concrete and abstract phenomena alike.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"60cfbac9-22bf-43e4-bed4-30539ae6c299\"}":{"__typename":"DeepDives","uuid":"60cfbac9-22bf-43e4-bed4-30539ae6c299","content":"\u003cp\u003eBefore moving to the United States in 2016, I was raised in three different countries: the Netherlands (where I was born), Switzerland, and the Czech Republic. In Switzerland and the Czech Republic, the student bodies of the schools I attended had over 60 nationalities. Students were encouraged to actively share their own cultural backgrounds, creating a deep mutual respect and acceptance. I learned to value intercultural differences and made friendships that lasted even when my friends returned to their home countries. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis experience makes me able to find community wherever I land, no matter who I'm with I'm able to form connections and find bonds with anyone that remain strong across thousands of miles. As a teacher, this translates into a classroom environment where I encourage students to share their own perspectives, and be themselves openly.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3302ba58-6ce6-4845-b5d7-7170b3967d5a\"}":{"__typename":"DeepDives","uuid":"3302ba58-6ce6-4845-b5d7-7170b3967d5a","content":"\u003cp\u003eOne piece of advice I would give to my high school self is to believe in yourself and pursue what truly speaks to you. I struggled sometimes with believing in my own ability to succeed and achieve my goals academically, but I believe that confidence in yourself and your abilities is one of the most valuable ingredients to success, and thats a vital piece of advice I'd give to my old self.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"52a1649a-7ff9-4e2c-83bf-2a69aff37c67\"}":{"__typename":"School","uuid":"52a1649a-7ff9-4e2c-83bf-2a69aff37c67","name":"Harrison High School","city":"Harrison","type":"HIGH","state":"New York","country":"United States","zip":"10528"},"Education:{\"uuid\":\"7dac3f54-b14f-4454-8e86-6d117f96376e\"}":{"__typename":"Education","uuid":"7dac3f54-b14f-4454-8e86-6d117f96376e","school":{"__ref":"School:{\"uuid\":\"52a1649a-7ff9-4e2c-83bf-2a69aff37c67\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"ce5bb6b4-fcb9-40c3-a500-6f770d1418cc\"}":{"__typename":"Education","uuid":"ce5bb6b4-fcb9-40c3-a500-6f770d1418cc","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"46608b50-d56c-4d78-8035-775fb2ec493b\"}":{"__typename":"MentorPublicProfile","uuid":"46608b50-d56c-4d78-8035-775fb2ec493b","displayName":"Ezra B.","slug":"ezra-burghouts","biography":"\u003cp\u003e\u003cstrong\u003eAbout Me:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eHi, I'm Ezra! I am a rising sophomore at Cornell University studying mathematics. My first year of college has been full of both fun times and adversity, yet I am so happy with all I've achieved and the life I've created for myself here. I have managed to maintain a 4.0 GPA while exploring my passions across mathematics, science, and more. In addition, I have kept up with my love for art, winning awards and making sure to always stop by the Cornell Visual Arts Guild on Saturdays. These days, I love to go hiking with my friends in the gorgeous mountains around Ithaca and maybe take a dip in the many natural lakes and waterfalls along the way.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve always been a curious person, learning new things feels almost as essential to me as food or water. I’m constantly interested in understanding how the world works, whether that’s through exploring history, the intricacies of mathematics, or the natural forces that shape our universe. That curiosity is what led me to discover and constantly further my academic passions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I Specialize In:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eSpecifically, I am suited to mentoring in high school-level:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePhysics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHistory\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMathematics (including Algebra II, Pre-Calculus, and Calculus I, II, and III). \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI mentor students who want to grow academically across fields, as throughout my academic journey I have engaged in my passions in a variety of ways, whether working to show my local government the value of a history passion project for our education system, participating in math and physics competitions, leading and growing our high school Physics Club, or mentoring other students.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI struggled in high school with staying on top of my work and finding the motivation to achieve the things I knew I was capable of. It was through having my own mentors that I learned techniques to overcome this and discovered how to use my passions to motivate my work. I brought these lessons with me to college, which has allowed me to excel academically. I would love to share this with younger students who may be struggling in similar ways.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I Can Help:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAfter tutoring students for three years, I have built strong experience in sharing ideas clearly and helping others find the motivation they need to fully apply themselves. If you need any mentoring support, I would love to help!\u003c/p\u003e","teachingVideoPlaybackId":"G022cIhru5XAiuAfzp8EGO4VxrH3FrqHdqBpITv6ja88","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3694eb5c-47bf-493a-981d-d399bf07dc53\"}"},{"__ref":"Favorites:{\"uuid\":\"fdc13974-dce9-4141-928e-7af02ce59666\"}"},{"__ref":"Favorites:{\"uuid\":\"a73a654e-ce18-48a1-bd8c-f48b5d310118\"}"}],"causesSupported":[],"major":"Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c1d1b83d-cfe8-4c7e-bea2-747e0dcc5f7d\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c7ec1cd-27a2-4a55-ba0b-740516f30d06\"}"},{"__ref":"DeepDives:{\"uuid\":\"60cfbac9-22bf-43e4-bed4-30539ae6c299\"}"},{"__ref":"DeepDives:{\"uuid\":\"3302ba58-6ce6-4845-b5d7-7170b3967d5a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a77339bd-c7e4-424c-a9ba-a641475b456e/-/preview/-/format/jpg/","https://ucarecdn.com/b20acc5b-4183-4215-96d3-6c2aa0093226/-/preview/-/format/jpg/","https://ucarecdn.com/1605604a-f588-41e1-947e-1959b25a1028/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7dac3f54-b14f-4454-8e86-6d117f96376e\"}"},{"__ref":"Education:{\"uuid\":\"ce5bb6b4-fcb9-40c3-a500-6f770d1418cc\"}"}],"hiredAt":"2026-04-05T17:41:05.267Z","topics":["Calculus","Precalculus / Trigonometry","Algebra II","Physics","French","History"],"communityBadges":["https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ezra-burghouts\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"46608b50-d56c-4d78-8035-775fb2ec493b\"}"}}},"_sentryTraceData":"b23bff62f7d24dd9b3bb680e9f72d857-ae6c9beb516187da-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b23bff62f7d24dd9b3bb680e9f72d857,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sample
