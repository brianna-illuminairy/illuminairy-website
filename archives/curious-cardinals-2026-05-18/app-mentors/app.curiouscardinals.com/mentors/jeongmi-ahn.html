xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"82eaaef8-4095-4f7a-94df-297432ee7df8\"}":{"__typename":"Favorites","uuid":"82eaaef8-4095-4f7a-94df-297432ee7df8","photoUrl":"https://ucarecdn.com/a266a04f-5e60-44bb-87a9-739b1d88a181/","title":"Jung Hoo Lee","type":"ATHLETE"},"Favorites:{\"uuid\":\"78663fed-2c44-4de7-ba8f-b911efb80dfd\"}":{"__typename":"Favorites","uuid":"78663fed-2c44-4de7-ba8f-b911efb80dfd","photoUrl":"https://ucarecdn.com/c30e7064-97c6-4388-a567-613e5c1ec4fa/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"3ca624ec-f186-4c33-ba96-ee380156790a\"}":{"__typename":"Favorites","uuid":"3ca624ec-f186-4c33-ba96-ee380156790a","photoUrl":"https://ucarecdn.com/c2bff005-079f-4f53-8432-5c854c8d75bd/","title":"Tennis/Fencing","type":"SPORT"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a854eedc-7d1f-4d44-bbdd-99ca3f7283e5\"}":{"__typename":"DeepDives","uuid":"a854eedc-7d1f-4d44-bbdd-99ca3f7283e5","content":"\u003cp\u003eOne passion project I have developed is the Spice Explorers program, which focuses on making nutrition education engaging, culturally inclusive, and accessible for young students. Through this program, I design interactive lessons that introduce students to different spices, cultural foods, and their health benefits, helping them build a positive and curious relationship with food. I wanted to move beyond traditional nutrition education by incorporating cultural storytelling, hands-on activities, and discussions about how food connects to identity and community. This project reflects my belief that nutrition education should not only promote health, but also celebrate diversity and empower students to make informed choices that are meaningful to their own lives. Through Spice Explorers, I have been able to combine my interests in nutrition, education, and community engagement while creating a space where students feel excited to learn and explore.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"576dd723-322f-4464-913a-67115b0dd96d\"}":{"__typename":"DeepDives","uuid":"576dd723-322f-4464-913a-67115b0dd96d","content":"\u003cp\u003eI chose to study Nursing and Nutrition Science because I am passionate about approaching healthcare in a more holistic and preventative way. I have always been interested in how everyday factors, especially nutrition, play a major role in long-term health, and I wanted to better understand how to support patients beyond just treating illness. Nursing allows me to work directly with patients and provide compassionate, hands-on care, while nutrition science gives me the tools to educate and empower individuals to make informed decisions about their health.\u003c/p\u003e\u003cp\u003eAdditionally, my experiences working with diverse and underserved communities have shown me how gaps in access to healthcare and nutrition education can impact health outcomes. This motivated me to pursue a path where I can combine clinical care with community-based education and advocacy. Ultimately, I chose this major because it allows me to integrate science, service, and education in a way that aligns with my goal of promoting equitable and culturally responsive healthcare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d174b9c3-ec8a-401d-a86d-4174b549603c\"}":{"__typename":"DeepDives","uuid":"d174b9c3-ec8a-401d-a86d-4174b549603c","content":"\u003cp\u003eIn my spare time, I enjoy staying active and creative in a variety of ways. I love playing pickleball and tennis, and I have recently gotten into rock climbing, which has been a fun challenge both physically and mentally. In high school, I also did fencing, which taught me discipline, focus, and strategic thinking. I also enjoy watching baseball, which I find both relaxing and exciting.\u003c/p\u003e\u003cp\u003eOutside of sports, I enjoy cooking and baking, especially experimenting with new recipes and incorporating different cultural flavors. This connects closely with my passion for nutrition, as it allows me to explore healthy eating in a hands-on and enjoyable way. I also love doing nails, which gives me a creative outlet and a way to unwind.\u003c/p\u003e\u003cp\u003eOverall, these activities help me maintain a healthy balance while allowing me to express both my active and creative sides.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"66730aa8-703c-4112-ade3-a66ff04c3ed5\"}":{"__typename":"School","uuid":"66730aa8-703c-4112-ade3-a66ff04c3ed5","name":"M479 Beacon High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10036"},"Education:{\"uuid\":\"f828ffe2-cc3d-49da-9d0e-48a4d87982f2\"}":{"__typename":"Education","uuid":"f828ffe2-cc3d-49da-9d0e-48a4d87982f2","school":{"__ref":"School:{\"uuid\":\"66730aa8-703c-4112-ade3-a66ff04c3ed5\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"eabf388f-f8f8-4f7e-9029-eabc5f2fabff\"}":{"__typename":"Education","uuid":"eabf388f-f8f8-4f7e-9029-eabc5f2fabff","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Nursing \u0026 Nutrition Science","degree":null},"MentorPublicProfile:{\"uuid\":\"38b4ee5c-3385-47b0-90ea-fb48164d6947\"}":{"__typename":"MentorPublicProfile","uuid":"38b4ee5c-3385-47b0-90ea-fb48164d6947","displayName":"Jeongmi A.","slug":"jeongmi-ahn","biography":"\u003cp\u003eI am a student studying Nursing and Nutrition Science with a strong passion for advancing equitable healthcare, particularly in the areas of nutrition and community health education. I am especially interested in how access to culturally responsive care and preventative health education can improve long-term health outcomes in underserved communities. My academic interests are rooted in understanding both the clinical and social determinants of health, and I am motivated to bridge the gap between medical care and community-based support systems.\u003c/p\u003e\u003cp\u003eI spend much of my time engaging in work that reflects these interests. I work with young students through nutrition education initiatives, helping them build healthy habits and better understand the role of food in their overall well-being. I also tutor students in college preparation, supporting them academically while helping them build confidence in their educational goals. Through these experiences, I have developed strong communication skills, adaptability, and a deeper appreciation for mentorship and accessible education. I value creating supportive learning environments where students feel encouraged to ask questions and grow.\u003c/p\u003e\u003cp\u003eIn addition to my academic and professional commitments, I have been involved in community-based work that centers advocacy and support for diverse populations, including immigrant communities. Through this work, I have gained experience in communication, cultural humility, and collaboration, all of which are essential in providing effective and compassionate care. These experiences have strengthened my ability to connect with individuals from different backgrounds and reinforced my commitment to addressing health disparities through both education and direct patient care.\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy staying active and creative. I love playing pickleball and tennis, which help me maintain a balanced lifestyle and prioritize my own well-being. I also enjoy cooking and baking as a way to explore nutrition in a hands-on and meaningful way, often experimenting with recipes that align with healthy and accessible eating.\u003c/p\u003e\u003cp\u003eThrough my academic, extracurricular, and professional experiences, I aim to empower underserved communities by promoting accessible, culturally responsive care. I hope to continue growing as both a healthcare provider and advocate, using my skills to make a meaningful and lasting impact in the communities I serve while continuing to learn from those around me.\u003c/p\u003e","teachingVideoPlaybackId":"yWBySvavsDjzG2ntTferDjh75oWlz3g76A5c18ZylS8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"82eaaef8-4095-4f7a-94df-297432ee7df8\"}"},{"__ref":"Favorites:{\"uuid\":\"78663fed-2c44-4de7-ba8f-b911efb80dfd\"}"},{"__ref":"Favorites:{\"uuid\":\"3ca624ec-f186-4c33-ba96-ee380156790a\"}"}],"causesSupported":[],"major":"Nursing \u0026 Nutrition Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a854eedc-7d1f-4d44-bbdd-99ca3f7283e5\"}"},{"__ref":"DeepDives:{\"uuid\":\"576dd723-322f-4464-913a-67115b0dd96d\"}"},{"__ref":"DeepDi
