xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0c764b06-1f7a-4ad2-ab76-6df6e62a797f\"}":{"__typename":"DeepDives","uuid":"0c764b06-1f7a-4ad2-ab76-6df6e62a797f","content":"\u003cp\u003eI would tell my younger self not to be afraid of uncertainty and change. In high school, I thought I had to pick one “track” and stick with it, but some of my most meaningful growth has come from letting my interests evolve—from biology research to public policy, to discovering sociology in college. I’d remind myself that curiosity and openness lead to opportunities, and that it’s okay not to have everything figured out as long as I pursue what I feel passionate about with determination and drive.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"593ec45c-2537-46f0-ac76-1dde03a292bb\"}":{"__typename":"DeepDives","uuid":"593ec45c-2537-46f0-ac76-1dde03a292bb","content":"\u003cp\u003eMentorship matters because I know firsthand how transformative it can be to have someone believe in you, guide you, and help you see your potential. In my own journey, mentors have given me confidence to take risks and try new things. I want to pass that forward—whether it’s helping a student grasp a tough math concept, or encouraging them when they feel stuck. Mentorship isn’t just about teaching skills; it’s about helping people feel seen and capable.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a734c590-455b-494e-be9d-ad14c0569be7\"}":{"__typename":"DeepDives","uuid":"a734c590-455b-494e-be9d-ad14c0569be7","content":"\u003cp\u003eOne thing I hope to accomplish is to help make systems more equitable—whether through education, public policy, or community-focused projects. I want to use what I’ve learned in sociology and math to bridge data and people’s lived experiences, and to design solutions that empower communities. On a personal level, I also hope to build a life where I keep creating—whether through art, writing, or mentorship—and contribute to something larger than myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1ad6fa15-0493-4411-a1e7-43acd3c803ae\"}":{"__typename":"DeepDives","uuid":"1ad6fa15-0493-4411-a1e7-43acd3c803ae","content":"\u003cp\u003eI chose sociology because I became fascinated by the way social structures shape people’s lives, and I wanted to understand inequality, culture, and policy from a new lens. At the same time, I kept my love for math, because it teaches me to think rigorously and find structure in complexity. Together, these majors let me explore both the human and analytical sides of problems, which feels true to how I think and what I want to do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"6f221ecb-c3be-4f27-983d-5781fb6d5bb6\"}":{"__typename":"School","uuid":"6f221ecb-c3be-4f27-983d-5781fb6d5bb6","name":"Berkeley Preparatory School","city":"Tampa","type":"HIGH","state":"Florida","country":"United States","zip":"33615"},"Education:{\"uuid\":\"c8b2badc-2673-44a8-a618-f0e31339044a\"}":{"__typename":"Education","uuid":"c8b2badc-2673-44a8-a618-f0e31339044a","school":{"__ref":"School:{\"uuid\":\"6f221ecb-c3be-4f27-983d-5781fb6d5bb6\"}"},"startYear":"2012","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"5ddbc816-e81e-4633-89df-a99bbeb0114c\"}":{"__typename":"Education","uuid":"5ddbc816-e81e-4633-89df-a99bbeb0114c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mathematics, Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"4d4e2f76-3e08-481b-99b7-e560dcedf96f\"}":{"__typename":"MentorPublicProfile","uuid":"4d4e2f76-3e08-481b-99b7-e560dcedf96f","displayName":"Ella A.","slug":"ella-adebonojo","biography":"\u003cp\u003eHi everyone! I'm Ella, and I'm a student at Yale University studying Math and Sociology. I'm from Tampa, FL, and I am very passionate about mentoring and learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince high school, I’ve been drawn to both the sciences and public policy, and I’ve worked to merge those interests with my passion for teaching and mentoring. My curiosity for STEM first took root through research, where I was fortunate to conduct molecular biology work at MIT's McGovern Institute as part of the Research Science Institute. At the same time, I felt deeply motivated to make an impact through service. I founded \u003cem\u003eArtful Minds\u003c/em\u003e, a project dedicated to teaching art to memory care and Alzheimer’s patients. We used art therapy to support mental health and foster connection. These early experiences taught me how much joy and meaning I find in helping others learn, grow, and feel supported.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout high school, I balanced a range of commitments that shaped my love for mentorship and leadership. I served as editor-in-chief of the yearbook, led discussions around diversity and culture as a student leader, headed my school's branch of the Red Cross, and tutored both in science for younger students at my school and in English as a second language for girls in Sri Lanka. As captain of my rowing team, I learned firsthand the importance of discipline, teamwork, and encouragement—values I carry into every mentoring relationship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I’ve expanded my academic interests and found new ways to connect them with service. While I came in focused on STEM, I discovered a deep passion for the social sciences, and now study sociology alongside mathematics. This combination allows me to think about both people and systems, structure and community. Beyond the classroom, I’ve pursued my love for sustainability through the Yale Sustainable Food Program, contributing to projects centered on food sovereignty and ecological justice. I also studied abroad in France, which deepened my perspective on culture and global connection.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and service, I find balance in art and athletics. I spend much of my free time in the pottery studio, where I love the meditative process of shaping clay. I’m also an avid skier and compete with Yale’s club ski team, bringing the same persistence and energy to the slopes that I do to academics and mentoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, what drives me is the opportunity to support others as they find confidence in their abilities. Tutoring and mentoring allow me to share knowledge, but more importantly, they give me the chance to encourage curiosity, resilience, and joy in learning.\u003c/p\u003e","teachingVideoPlaybackId":"DB00kDnQIEXGM022zwS02zD3zCdafuRW4IwZo232Z8A00VQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mathematics, Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0c764b06-1f7a-4ad2-ab76-6df6e62a797f\"}"},{"__ref":"DeepDives:{\"uuid\":\"593ec45c-2537-46f0-ac76-1dde03a292bb\"}"},{"__ref":"DeepDives:{\"uuid\":\"a734c590-455b-494e-be9d-ad14c0569be7\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ad6fa15-0493-4411-a1e7-43acd3c803ae\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/03b73778-546a-4bcf-90a5-e54150f07a71/-/preview/-/format/jpg/","https://ucarecdn.com/ecdd9d52-340b-405e-afe3-8ac7711b2388/-/preview/-/format/jpg/","https://ucarecdn.com/2034d3ca-175c-464c-ad03-66fbce93c239/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c8b2badc-2673-44a8-a618-f0e31339044a\"}"},{"__ref":"Education:{\"uuid\":\"5ddbc816-e81e-4633-89df-a99bbeb0114c\"}"}],"hiredAt":"2025-08-13T20:50:03.142Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Writing","College Essay Writing","Academic Coaching","Reading","Visual Arts / Graphic Design","Video / Photography","K-6 Storybook","Medicine / Health","STEM Project","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ella-adebonojo\"}})"
