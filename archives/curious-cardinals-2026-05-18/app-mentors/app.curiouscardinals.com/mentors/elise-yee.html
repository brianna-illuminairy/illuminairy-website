xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"80114798-e88d-414e-8415-b3887653e859\"}":{"__typename":"DeepDives","uuid":"80114798-e88d-414e-8415-b3887653e859","content":"\u003cp\u003eAfter creating my own cookie company and working in the commercial kitchen, I gained a deep appreciation and skillset for creative collaboration and analytical thinking. Going into college, I wanted to not only delve deeper into financial analysis but also the communication strategies that shape how ideas are shared, problems are solved, and people are brought together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4fe5f0a2-cdcb-4c4d-83c6-70ebe6f90526\"}":{"__typename":"DeepDives","uuid":"4fe5f0a2-cdcb-4c4d-83c6-70ebe6f90526","content":"\u003cp\u003eIn middle school, I switched schools and had a difficult time adjusting. But I discovered a love for baking, which helped me build connections and form lifelong friendships through sharing homemade treats. During COVID, I decided to turn that passion into something bigger by creating a frozen cookie dough company—Dough Baby—that combined my love for baking with my interest in entrepreneurship. Through Dough Baby, I formed community partnerships with organizations like Homeboy Industries, A Sense of Home, and LA Family Housing. I also learned how to form an LLC and gained hands-on experience working in a commercial kitchen.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}":{"__typename":"School","uuid":"693ea7b8-def0-456d-88a4-4055bd090a62","name":"Marlborough School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90004"},"Education:{\"uuid\":\"896d912b-9cd9-45e5-aeed-5c2f208081d1\"}":{"__typename":"Education","uuid":"896d912b-9cd9-45e5-aeed-5c2f208081d1","school":{"__ref":"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"616d8211-af16-416d-8fc8-0d1c12f1489b\"}":{"__typename":"Education","uuid":"616d8211-af16-416d-8fc8-0d1c12f1489b","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Communications and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"344c3c27-748d-4a64-a4e7-7c094b57a718\"}":{"__typename":"MentorPublicProfile","uuid":"344c3c27-748d-4a64-a4e7-7c094b57a718","displayName":"Elise Y.","slug":"elise-yee","biography":"\u003cp\u003eI'm currently a Sophomore at Northwestern University studying Economics and Communication with a minor in Business and the Segal Design Certificate—but more importantly, I love working with students to help them grow into confident, curious thinkers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always been someone who learns by doing. In high school, I combined my love for baking with a spirit of creativity and launched my own frozen cookie dough business. Beyond the recipes and packaging, it taught me how to lead with patience, ask thoughtful questions, and solve problems one step at a time—skills I now bring into every mentorship relationship. While running a business taught me logistics, the most rewarding part was collaborating with others, learning from their ideas, and watching something grow together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern, I’ve continued to build on these strengths. I work closely with small businesses through a consulting club called CASE, and write for \u003cem\u003eSpoon University\u003c/em\u003e, a food publication that blends storytelling with community building. Whether I’m leading a team or tutoring a peer, I aim to create a space where others feel supported, listened to, and encouraged to explore new ideas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs someone with ADHD, I know that every brain works a little differently—and that’s something to celebrate. Growing up, I had to figure out how to stay organized, manage distractions, and turn what felt like chaos into creative energy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I’m always up for an adventure—from trying new restaurants in Chicago to skydiving in California! I bring that same energy to my mentoring: curious, warm, and excited to meet every student where they are. I look forward to being a guide, cheerleader, and thought partner to the students I work with.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Communications and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"80114798-e88d-414e-8415-b3887653e859\"}"},{"__ref":"DeepDives:{\"uuid\":\"4fe5f0a2-cdcb-4c4d-83c6-70ebe6f90526\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/20b68b97-baf7-4476-a043-64668f1a9a8a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"896d912b-9cd9-45e5-aeed-5c2f208081d1\"}"},{"__ref":"Education:{\"uuid\":\"616d8211-af16-416d-8fc8-0d1c12f1489b\"}"}],"hiredAt":"2025-04-21T12:12:05.559Z","topics":["Creative Writing","Fashion / Cosmetics","K-6 Storybook","Business / Entrepreneurship","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elise-yee\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"344c3c27-748d-4a64-a4e7-7c094b57a718\"}"}}},"_sentryTraceData":"a5a0b8c68a5840e2b9d83b06b252fe00-be9b409d2695855e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a5a0b8c68a5840e2b9d83b06b252fe00,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"elise-yee"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
