xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9fca6fa2-93f3-4ce6-b5f0-1927a7024a92\"}":{"__typename":"DeepDives","uuid":"9fca6fa2-93f3-4ce6-b5f0-1927a7024a92","content":"\u003cp\u003eI realized pretty quickly that I didn't want to just be a \"pure\" scientist or a \"pure\" engineer—I wanted to be the person who bridges the gap between the two.\u003c/p\u003e\u003cp\u003eI chose Environmental Hardware Systems Engineering because I'm obsessed with the \"Silicon-to-Science\" pipeline. In my eyes, you can’t fully understand complex atmospheric dynamics or climate change if you don't understand the hardware and sensors actually collecting that data.\u003c/p\u003e\u003cp\u003eAt Cornell, I designed this major to combine Electrical and Computer Engineering (think digital design and embedded systems) with Earth and Atmospheric Sciences (like radar remote sensing). My goal is to build the next generation of geophysical sensing tools—hardware that is optimized from the chip level up to handle data in the world’s most extreme environments. Whether it’s silicon validation or system architecture, I want to be the one building the tech that makes high-stakes environmental science possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1bc0d8a9-5345-447b-b667-b44f141551df\"}":{"__typename":"DeepDives","uuid":"1bc0d8a9-5345-447b-b667-b44f141551df","content":"\u003cp\u003eMentorship matters to me because I know exactly what it’s like to have a massive, complex idea—like building a custom silicon chip or a remote sensing payload—and have no idea where to start \"de-bugging\" the path to get there.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I want to be that \"System Architect\" for my students. Whether we’re working on RISC-V microprocessor design or just trying to make Calculus click, I love helping students realize that technical skills aren't just for passing tests—they’re tools for building things that actually matter. Seeing a student go from \"I'm interested in AI\" to \"I just deployed a machine learning model to analyze environmental data\" is the coolest part of the job. It’s about giving them the technical confidence to build the future they’re actually excited about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f3ba7cc4-0615-45fe-adde-bd063a43de81\"}":{"__typename":"DeepDives","uuid":"f3ba7cc4-0615-45fe-adde-bd063a43de81","content":"\u003cp\u003eWhen I’m not in the lab at Cornell or deep in a post-silicon validation sprint for our custom chips, I’m usually still tinkering with something. I’ve always been a \"builder\" at heart, so my spare time often involves working on independent electronics projects—usually trying to get a new RF-controlled device to work or experimenting with embedded systems just for the fun of seeing a physical product come to life from lines of code.\u003c/p\u003e\u003cp\u003eLiving in Ithaca, I also make it a point to get outside and actually see the \"environmental\" part of my major. Whether it’s hiking around the gorges or just observing the atmospheric shifts we talk about in my Earth and Atmospheric Sciences classes, it helps keep the \"science\" part of my \"Silicon-to-Science\" pipeline grounded.\u003c/p\u003e\u003cp\u003eAnd, of course, I’m a big fan of sustainability and tech that actually makes an impact. I love staying up to date on the latest in Green Tech and Aviation, often diving into how we can make aerospace systems more efficient. Basically, if it involves a complex system, a bit of Python-based automation, or a creative hardware solution, I’m probably into it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"a409931e-fb80-4857-be53-a26c45fd39f1\"}":{"__typename":"School","uuid":"a409931e-fb80-4857-be53-a26c45fd39f1","name":"Hawthorne High School","city":"Hawthorne","type":"HIGH","state":"California","country":"United States","zip":"90250"},"Education:{\"uuid\":\"956ae67a-8946-424a-8d83-9b8ddaf89de1\"}":{"__typename":"Education","uuid":"956ae67a-8946-424a-8d83-9b8ddaf89de1","school":{"__ref":"School:{\"uuid\":\"a409931e-fb80-4857-be53-a26c45fd39f1\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"62f73754-0d20-4aa7-a829-462e40ec5573\"}":{"__typename":"School","uuid":"62f73754-0d20-4aa7-a829-462e40ec5573","name":"Cornell Duffield College of Engineering","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14853"},"Education:{\"uuid\":\"78306496-957c-498a-819f-c2154361aa14\"}":{"__typename":"Education","uuid":"78306496-957c-498a-819f-c2154361aa14","school":{"__ref":"School:{\"uuid\":\"62f73754-0d20-4aa7-a829-462e40ec5573\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2027","major":"Environmental Hardware Systems Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"e9aeb7dc-d8ed-47bd-9c8e-391df1c6b69b\"}":{"__typename":"MentorPublicProfile","uuid":"e9aeb7dc-d8ed-47bd-9c8e-391df1c6b69b","displayName":"Kene C.","slug":"kene-chukwuma","biography":"\u003cp\u003eHi! I’m Kene, and I’m a 4th year student at Cornell University pursuing a self-designed Independent Major in Environmental Hardware Systems Engineering. I help students master the \"\u003cem\u003eSilicon-to-Science\u003c/em\u003e\" pipeline by teaching them how to build the hardware, write the code, and analyze the environmental data that helps us understand our planet.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI noticed a gap between the scientists who study the climate and the engineers who build the tools they use. I created my major to bridge that gap. I’ve spent my time at Cornell and in the industry learning how to make technology work in extreme environments. Some of my highlights include:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSystems Engineering at GE Aerospace\u003c/strong\u003e: I led qualification testing and automated data analysis for aerospace systems, ensuring hardware can handle the toughest conditions.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSystem Architect for Cornell Custom Silicon Systems:\u003c/strong\u003e I lead post-silicon validation and automation efforts—basically, making sure the \"brains\" of our computers work perfectly.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHardware Builder\u003c/strong\u003e: I’ve designed RISC-V microprocessors, built FPGA-based digital systems, and engineered RF-controlled IoT devices from the ground up.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI mentor students who want to be \"Builders\" and \"Thinkers.\" My expertise spans the entire technical stack:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eRobotics, Electronics \u0026amp; CAD:\u003c/strong\u003e We can design physical objects in CAD and bring them to life with custom circuitry and sensors.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCoding \u0026amp; AI / Machine Learning:\u003c/strong\u003e I specialize in Python-based automation and using Machine Learning to interpret complex data.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAviation \u0026amp; Aerospace: \u003c/strong\u003eUsing my background from GE to explore how we design things that fly.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eThe \"Science of Tech\": \u003c/strong\u003eMastering Physics, Calculus, and Algebra II by seeing how they apply to real-world sensors and environmental monitors.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eI also offer Academic Coaching for students navigating heavy STEM workloads, helping them build the executive functioning skills to manage complex, multi-month projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhether you’re interested in Remote Sensing, Computer Architecture, or Sustainability, I’ve been there. I’ve navigated the process of designing my own curriculum and leading project teams at one of the top engineering schools in the world.\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAn Architect's Blueprint:\u003c/strong\u003e Mapping out a Passion Project from a \"cool idea\" to a technical reality (e.g., \"Let's build a weather station that uses AI to predict local micro-climates\").\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTechnical Deep-Dives: \u003c/strong\u003eDebugging a circuit board or refining a Python script until it’s professional-grade.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down intimidating Precalculus or Physics concepts into the \"logic\" of how things actually work.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eOutside of the Lab \u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not designing microprocessors or looking at atmospheric radar data, you can find me hiking, tinkering with vintage electronics, or baking. I’m a huge advocate for Sustainability and love showing students how \"Green Tech\" is the future of engineering.\u003c/p\u003e\u003cp\u003eIf you’re a student who loves to take things apart to see how they work, or if you want to build technology that actually makes an impact on the world, I’d love to help you get started.\u003c/p\u003e","teachingVideoPlaybackId":"3j00BkBMer0100wRRWLY3yhKmpoup9h029tsD02FsaZcdr02M","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environmental Hardware Systems Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9fca6fa2-93f3-4ce6-b5f0-1927a7024a92\"}"},{"__ref":"DeepDives:{\"uuid\":\"1bc0d8a9-5345-447b-b667-b44f141551df\"}"},{"__ref":"DeepDives:{\"uuid\":\"f3ba7cc4-0615-45fe-adde-bd063a43de81\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e8793393-4a86-4e20-a750-c3a0416bd9b4/-/preview/-/format/jpg/","https://ucarecdn.com/bcec3972-7a76-4592-bc7a-a9ab913c93dc/-/preview/-/format/jpg/","https://ucarecdn.com/0b1038be-4d0d-40c0-b5bd-19c549469971/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"956ae67a-8946-424a-8d83-9b8ddaf89de1\"}"},{"__ref":"Education:{\"uuid\":\"78306496-957c-498a-819f-c2154361aa14\"}"}],"hiredAt":"2026-03-29T18:00:09.422Z","topics":["Precalculus / Trigonometry","Calculus","Algebra II","Pre-Algebra","K-5 Grade Math","Physics","Biology","Computer Science","Academic Coachin
