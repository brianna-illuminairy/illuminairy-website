xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"b89941e1-7e1b-4e96-b202-80f21329d8b3\"}":{"__typename":"DeepDives","uuid":"b89941e1-7e1b-4e96-b202-80f21329d8b3","content":"\u003cp\u003eI watched a lot of Disney cartoons growing up, and I would see crazy things like opening a small bag to reveal a mansion inside or people living in it. I was in my inventor phase, and I told my friends that we should invent something like a house that folds into a book. The idea was that while traveling, instead of packing all your things and wasting time, you could press a button in the house, step out, and it would fold into the book. You could then carry it with you to your destination, and when you arrived, you’d open the book with your code, and your house would be right there! It’s a silly dream, but I genuinely think it could be possible, right? 👀😂\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"0e26067a-f846-4588-9823-c4b7aa5c50ac\"}":{"__typename":"DeepDives","uuid":"0e26067a-f846-4588-9823-c4b7aa5c50ac","content":"\u003cp\u003eMy greatest source of motivation comes from reflecting on how far I’ve come. Honestly, Judith five years ago would never have imagined being where I am today. Recognizing my growth and the challenges I've overcome inspires me to keep pushing forward. It reminds me that progress is possible and reinforces my belief that nothing is impossible—that I can always push through my limits and unlock my potential. This motivation fuels my desire to help others achieve their own goals. I aspire to be a living example that with determination and support, anyone can transform their circumstances and create a bright future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7528e94c-83a7-405a-bfd1-3ecac7e3d4a7\"}":{"__typename":"DeepDives","uuid":"7528e94c-83a7-405a-bfd1-3ecac7e3d4a7","content":"\u003cp\u003eI chose my major out of curiosity. I took my first computer science class in high school during my senior year, but due to COVID, the learning experience was limited, and I felt I didn't grasp the depth of the subject. I realized there was so much more to learn and explore in computer science, which truly fascinated me.\u003c/p\u003e\u003cp\u003eI also love how versatile and flexible the major is. It allows me to branch out and explore different areas within technology and beyond, rather than being rigidly confined to one path. This flexibility excites me, as it opens up numerous opportunities to apply my skills in various fields, satisfying my curiosity while also broadening my horizons.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6422e5bc-f70d-4590-bd8a-cefd20ab9490\"}":{"__typename":"DeepDives","uuid":"6422e5bc-f70d-4590-bd8a-cefd20ab9490","content":"\u003cp\u003eIn my spare time, I love hanging out with friends and family, exploring new places, and trying out fun activities. Traveling is a big passion of mine because it lets me experience different cultures and meet new people. I also enjoy experimenting with new recipes, dancing, and unwinding with some good shows—especially Disney princess movies and musicals! I can’t resist a good karaoke session with those songs. Plus, I have a bit of a thing for perfumes; I love discovering new scents!\u003c/p\u003e\u003cp\u003eGo-karting is one of my favorite ways to unwind! I like to think I’m a pretty good racer, especially since I still don’t have my driver’s license yet🫣. I mean, who needs one when you can drift like a pro in a go-kart?😂 Overall, I really value these moments of joy and connection, as they help me maintain a balanced and fulfilling life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"5822e5eb-6fdc-4bf6-b0a8-3ac911ca7b92\"}":{"__typename":"School","uuid":"5822e5eb-6fdc-4bf6-b0a8-3ac911ca7b92","name":"North Star Academy Charter School Of Newark","city":"Newark","type":"HIGH","state":"New Jersey","country":"United States","zip":"07102"},"Education:{\"uuid\":\"740b67d5-e757-40e1-9611-db895b4e1fbc\"}":{"__typename":"Education","uuid":"740b67d5-e757-40e1-9611-db895b4e1fbc","school":{"__ref":"School:{\"uuid\":\"5822e5eb-6fdc-4bf6-b0a8-3ac911ca7b92\"}"},"startYear":"2019","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"f5d8d261-6467-4265-ba13-2a2f89a97592\"}":{"__typename":"Education","uuid":"f5d8d261-6467-4265-ba13-2a2f89a97592","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"present","major":"Computer Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"fb8e64fe-1731-4603-917f-e7027ae1f49c\"}":{"__typename":"MentorPublicProfile","uuid":"fb8e64fe-1731-4603-917f-e7027ae1f49c","displayName":"Judith J.","slug":"judith-jatto","biography":"\u003cp\u003eJudith is a student at Cornell University, studying Computer Information Science, Systems, and Technology in the College of Engineering. Her curiosity for computer science was sparked during her senior year of high school when the pandemic disrupted traditional learning, prompting her to explore the field more deeply. This newfound interest led her to pursue a major that would allow her to uncover more about technology and its impact.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Cornell, Judith serves as the Vice President of Underrepresented Minorities in Computing (URMC), an organization she has been involved with since her freshman year. She is committed to empowering students through mentorship, professional development, and fostering a welcoming environment. Judith is passionate about ensuring that others have the guidance and support they need, especially after entering college without a mentor and feeling the gap in guidance during that transition. She experienced the impact of mentorship firsthand when she got a mentor during her freshman year, which made a huge difference in her journey.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eJudith’s story reflects her resilience and perseverance—qualities that guide her through challenges and motivate her to uplift others in her community. In addition to her work with URMC, she is actively involved in other organizations that align with her mission to support and impact the community while advocating for diversity and inclusion in tech. She has received several accolades for her dedication and impact, including the Cornell Bowers CIS Distinguished Leadership in Service Award and the Cornell CIS Bowers Diversity, Equity, Inclusion, and Belonging (DEIB) Awards - Most Impactful Student. Judith also gained valuable experience as a Software Engineer Intern at Uber, further enhancing her skills and knowledge in the field.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of her studies and leadership initiatives, Judith places a high value on health and maintaining a balanced life. She understands the importance of taking breaks and recharging. In her free time, she enjoys hanging out with friends, traveling, trying out new recipes, dancing, and watching Korean Dramas, Disney princess shows and musicals, along with go-karting for fun.\u003c/p\u003e\u003cp\u003eFamily is very important to her, and her faith plays a significant role in how she lives and gives back to her community. Ultimately, Judith is dedicated to being a supportive mentor, friend, and sister to those around her.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cbr\u003e","favorites":[],"causesSupported":[],"major":"Computer Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b89941e1-7e1b-4e96-b202-80f21329d8b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e26067a-f846-4588-9823-c4b7aa5c50ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"7528e94c-83a7-405a-bfd1-3ecac7e3d4a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"6422e5bc-f70d-4590-bd8a-cefd20ab9490\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0a7387a6-36a3-467f-acb6-4b3cb61b42ce/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"740b67d5-e757-40e1-9611-db895b4e1fbc\"}"},{"__ref":"Education:{\"uuid\":\"f5d8d261-6467-4265-ba13-2a2f89a97592\"}"}],"hiredAt":"2024-09-18T10:33:05.743Z","topics":["Coding / Programming","Precalculus / Trigonometry","Calculus","College Essay Writing","Academic Coaching
