xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"dd325def-2c5a-43f9-9d47-b8ead85ee56c\"}":{"__typename":"Favorites","uuid":"dd325def-2c5a-43f9-9d47-b8ead85ee56c","photoUrl":"https://ucarecdn.com/555d120a-e81a-425e-9a7b-52e4b577c3be/","title":"Paris, France","type":"CITY"},"Favorites:{\"uuid\":\"37f9a4df-780a-419f-97ac-8d64b19e4734\"}":{"__typename":"Favorites","uuid":"37f9a4df-780a-419f-97ac-8d64b19e4734","photoUrl":"https://ucarecdn.com/2dfcc1c8-9672-4922-9f43-bd1b48a8ba30/","title":"Carlos Alcaraz","type":"ATHLETE"},"Favorites:{\"uuid\":\"faa18086-ca0a-4508-ae7f-f76f561e1d87\"}":{"__typename":"Favorites","uuid":"faa18086-ca0a-4508-ae7f-f76f561e1d87","photoUrl":"https://ucarecdn.com/fba50ad5-6940-4d47-831c-d4ad751ff35b/","title":"Me Before You","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ab1f1e01-3a6f-44ee-9feb-0ee9e5ac6d94\"}":{"__typename":"DeepDives","uuid":"ab1f1e01-3a6f-44ee-9feb-0ee9e5ac6d94","content":"\u003cp\u003eI chose Applied Medical Sciences because I was interested in understanding not just what happens in the body, but why it happens.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always been curious about how things work, and I wanted a course that went beyond memorisation and actually encouraged deeper thinking about disease and the human body. It also felt like a really good way to explore whether medicine was the right path for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver time, it gave me a strong foundation in both the science and the mindset needed for medicine, thinking critically, asking questions, and being comfortable working through things that don’t make sense right away. It confirmed that I enjoy both the intellectual side of medicine and the idea of applying that knowledge in a meaningful way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8d9241d4-efe8-4847-81cf-39b40531ed3c\"}":{"__typename":"DeepDives","uuid":"8d9241d4-efe8-4847-81cf-39b40531ed3c","content":"\u003cp\u003eMy dream job is to become a physician, and I’m particularly interested in going into orthopaedics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve had the chance to observe a range of specialties: cardiology, ENT, surgery, and the paediatric emergency department, which has been really helpful in understanding different areas of medicine. But my interest in orthopaedics actually started in a much simpler way, during a musculoskeletal systems lecture in undergrad.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt was one of those moments where something just clicked. I found the structure and function of bones really interesting, especially how everything is so interconnected in terms of movement, stability, and repair. Since then, I’ve been more drawn to that area.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cdcb9f84-1809-4468-bf0a-0c01a2231725\"}":{"__typename":"DeepDives","uuid":"cdcb9f84-1809-4468-bf0a-0c01a2231725","content":"\u003cp\u003eIn my spare time, I like to keep things pretty balanced between relaxing and trying something new. I love finding new shows to watch, especially horror, and I’m always taking recommendations from friends.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also go through phases of picking up random activities, like crocheting or trying out something new like a pilates or returning to an archery class after years, which has been really fun. I enjoy going out to eat with friends as well, it’s probably one of my favourite ways to unwind.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd when I have a bit more time, I love watching tennis. I’m a big fan, although I’d definitely say I’m a better spectator than I am a player.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"2742c464-db73-48cb-a6fc-248c3ece3bae\"}":{"__typename":"DeepDives","uuid":"2742c464-db73-48cb-a6fc-248c3ece3bae","content":"\u003cp\u003eAs a high school student, I went to an all-girls boarding school in England, which honestly changed me a lot.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore that, I was very shy and focused on academics and didn’t really do much outside of it. But being in that environment kind of forced me to branch out. I got involved in things like speech and drama, pottery, even picked up sports like netball, lacrosse, and volleyball, and continued playing piano. It definitely made me more well-rounded than I had been before.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was also just a teenager who really enjoyed being around my friends all the time. We were together constantly, which made school feel a lot more fun and supportive.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePersonality-wise, I’d say I was quite adaptable, open to trying new things, and generally someone who liked being part of a community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"5d102eaf-fbe1-4581-b08d-f39a2a14163e\"}":{"__typename":"School","uuid":"5d102eaf-fbe1-4581-b08d-f39a2a14163e","name":"Downe House","city":"Thatcham","type":"HIGH","state":"England","country":"United Kingdom","zip":"RG18 9JJ"},"Education:{\"uuid\":\"9a13793c-8f69-4903-82c7-55a4aeeb8a64\"}":{"__typename":"Education","uuid":"9a13793c-8f69-4903-82c7-55a4aeeb8a64","school":{"__ref":"School:{\"uuid\":\"5d102eaf-fbe1-4581-b08d-f39a2a14163e\"}"},"startYear":"2015","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e8a83887-fa25-4420-84d3-1a6ced8ee3fb\"}":{"__typename":"School","uuid":"e8a83887-fa25-4420-84d3-1a6ced8ee3fb","name":"University College London","city":"London","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"WC1E 6BT"},"Education:{\"uuid\":\"e7afe1a9-c5d7-436b-80fa-cb9f25128840\"}":{"__typename":"Education","uuid":"e7afe1a9-c5d7-436b-80fa-cb9f25128840","school":{"__ref":"School:{\"uuid\":\"e8a83887-fa25-4420-84d3-1a6ced8ee3fb\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Applied Medical Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"e284f885-cb3b-4902-8782-37fed369c0ec\"}":{"__typename":"MentorPublicProfile","uuid":"e284f885-cb3b-4902-8782-37fed369c0ec","displayName":"Ayobami R.","slug":"ayobami-razakshittu","biography":"\u003cp\u003eHi! I’m Ayobami (you can call me Ayo), and I'm a pre-med student at Columbia University with a background in Applied Medical Sciences who genuinely loves helping students figure things out, especially when things stop making sense and it all starts to feel a bit overwhelming.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up between Nigeria, the UK, and now the US, and I’ve been through a pretty wide range of school environments (including boarding school, where no one was there to remind me to do my work 😅). I definitely wasn’t always on top of everything at the start, so I understand what it feels like to struggle a bit, but more importantly, how to get back on track.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love science, especially biology and chemistry, and maths, but more importantly, I love making things make sense.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI studied at University College London (UCL), where I also did research on amyloidosis, looking at how certain protein mutations behave and break down under different conditions. It was very detailed (and occasionally stressful), but it really taught me how to break complex ideas down into something clear and manageable, which is exactly how I approach teaching.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also worked as an academic mentor in physics and maths, and as a Transition Mentor at UCL, supporting students as they adjusted to new academic environments. Those experiences taught me how to explain things in different ways, meet students where they are, and build confidence, not just understanding.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I led a student-run charity focused on raising awareness around blood and organ donation, which is something I care a lot about.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also gone through multiple application processes (undergrad, graduate, pre-med, and now med school), so I can help with goal-setting, planning, and making the whole process feel way less overwhelming.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy sessions are structured but relaxed, I’m not here to make things more stressful than they already are. We’ll focus on actually understanding what you’re learning (not just memorising it), and I’ll help you build study habits, time management, and confidence along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I love travelling, trying new things, finding new shows to watch and staying active. I’ve been playing netball since I was 12 and competed up until my time at UCL, so I’m very familiar with balancing a lot at once and staying consistent without making it feel overwhelming :)\u003c/p\u003e","teachingVideoPlaybackId":"xhMrXhCNXLrqshEKJX5101s38JdSfIDA5g5azI9WTiy8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is leading a student-run charity focused on blood and organ donation awareness. It’s not exactly the most casual topic, but that’s kind of why it mattered. We were trying to take something people don’t usually think about and make it easier to understand and talk about.\u003c/p\u003e\u003cp\u003eWe worked directly with both primary and secondary school students, running sessions to educate them on donation and break down some of the stigma or uncertainty around it. I also took on the role of Blood Lead in my first year, where I was responsible for planning events focused on blood donation awareness.\u003c/p\u003e\u003cp\u003eOne of my favourite initiatives was organising “Know Your Blood Type” events on campus. We used quick finger-prick tests as a more interactive (and slightly less intimidating) way to get people involved, and it actually led to a lot of students registering as first-time blood donors and booking appointments with the NHS.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I’m most proud of is the tangible impact. We were able to bring in new volunteers and donors, but also just get more people talking about something that really matters.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"dd325def-2c5a-43f9-9d47-b8ead85ee56c\"}"},{"__ref":"Favorites:{\"uuid\":\"37f9a4df-780a-419f-97ac-8d64b19e4734\"}"},{"__ref":"Favorites:{\"uuid\":\"faa18086-ca0a-4508-ae7f-f76f561e1d87\"}"}],"causesSupported":[],"major":"Applied Medical Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ab1f1e01-3a6f-44ee-9feb-0ee9e5ac6d94\"}"},{"__ref":"DeepDives:{\"uuid\":\"8d9241d4-efe8-4847-81cf-39b40531ed3c\"}"},{"__ref":"DeepDives:{\"uuid\":\"cdcb9f84-1809-4468-bf0a-0c01a2231725\"}"},{"__ref":"DeepDives:{\"uuid\":\"2742c464-db73-48cb-a6fc-248c3ece3bae\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/78e46e9d-2fd5-47f2-8dfd-bd6d74376b04/-/preview/-/format/jpg/","https://ucarecdn.com/8f7035cb-67a7-4a74-a2d8-d67ad58b9f82/-/preview/-/format/jpg/","https://ucarecdn.com/3b15b5cb-65a5-42fe-aa01-0e4f69d88170/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9a13793c-8f69-4903-82c7-55a4aeeb8a64\"}"},{"__ref":"Education:{\"uuid\":\"e7afe1a9-c5d7-436b-80fa-cb9f25128840\"}"}],"hiredAt":"2026-04-22T20:28:57.360Z","topics":["Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Chemistry","Physics","Latin","Academic Coaching","College Essay Writing","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ayobami-razakshittu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e284f885-cb3b-4902-8782-37fed369c0ec\"}"}}},"_sentryTraceData":"65900950c35a4a03900e18391ee166f2-80dfcd96134c4aa4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=65900950c35a4a03900e18391ee166f2,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ayobami-razakshittu"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElemen
