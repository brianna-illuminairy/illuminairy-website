js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"fc56fd98-1207-43ef-9043-ac999ba2d2e7\"}":{"__typename":"DeepDives","uuid":"fc56fd98-1207-43ef-9043-ac999ba2d2e7","content":"\u003cp\u003eDuring my high school summers, I stayed busy in ways that allowed me to explore both my passions and responsibilities—and I learned a lot about myself in the process. My summers were a mix of creative work, community involvement, and family care, and looking back, I’m really grateful for how they helped shape my work ethic, patience, and leadership skills.\u003c/p\u003e\u003cp\u003eOne of the most rewarding parts of my summer was teaching lyrical dance at my local studio’s summer camp. I worked with young dancers between the ages of 5 and 10, helping introduce them to movement, music, and creative expression. It was such a joy to watch their confidence grow over the course of a few weeks, and it taught me a lot about how to communicate effectively with different types of learners. I had to learn how to keep the class structured while also keeping things light and fun—which was a great challenge! That experience sparked my love for teaching and helped me realize how much I enjoy working with younger students, especially in artistic or educational settings.\u003c/p\u003e\u003cp\u003eIn addition to teaching, I worked at a locally owned rolled ice cream shop. This was my first experience in a fast-paced customer service environment, and it taught me the value of teamwork, time management, and adaptability. The shop was small and community-focused, and I really appreciated the chance to build relationships with both the customers and my coworkers. Plus, getting to make custom rolled ice cream creations was a fun (and delicious!) way to put creativity into a different kind of practice.\u003c/p\u003e\u003cp\u003eI also spent time volunteering at my dance studio in other ways, like helping reorganize the costume closet—a surprisingly big and satisfying project! I’ve always loved bringing order to chaos, and getting the chance to help out behind the scenes showed me the importance of the small details that keep a creative space running smoothly.\u003c/p\u003e\u003cp\u003eLastly, I spent a lot of time babysitting my younger brothers. That probably taught me the most about patience, problem-solving, and being flexible when plans change—skills that have translated into every area of my life since.\u003c/p\u003e\u003cp\u003eOverall, my summers in high school were full of meaningful work that challenged me to grow in different ways. Whether I was in the studio, at the shop, or at home, I was always learning, creating, and trying to make someone’s day just a little bit better.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"48ae3b0c-4c3f-477b-a24c-364228bd8d61\"}":{"__typename":"DeepDives","uuid":"48ae3b0c-4c3f-477b-a24c-364228bd8d61","content":"\u003cp\u003eMentorship matters deeply to me because it’s about so much more than just teaching—it’s about empowering, connecting, and growing alongside someone. I’ve always loved guiding others through challenges, especially in academic settings, and I believe mentorship can be a life-changing experience for both the mentor and the mentee.\u003c/p\u003e\u003cp\u003eGrowing up with three younger siblings, I naturally stepped into a mentor role early on. Whether it was helping them with their homework, walking them through tough questions, or simply encouraging them when they felt frustrated, I found real joy in those moments of connection. I learned that mentorship isn’t about having all the answers—it’s about helping others discover that they’re capable of finding the answers themselves. That mindset has stayed with me and continues to shape the way I work with students today.\u003c/p\u003e\u003cp\u003eCurrently, I work as a tutor for underserved students in the New Haven public school system, many of whom are first-generation and low-income. These students are incredibly bright, curious, and capable—they just haven’t always had access to the resources and support they deserve. Mentoring them in academic readiness has been one of the most meaningful parts of my college experience so far. I help with everything from homework to study skills, but what’s even more important is the relationship-building: showing up consistently, believing in their potential, and helping them see their own strengths.\u003c/p\u003e\u003cp\u003eI’m constantly inspired by the resilience and brilliance of the students I work with. They’ve reminded me that academic potential isn’t defined by background or circumstance—it thrives when it’s nurtured with care, encouragement, and opportunity. Being part of that process, even in a small way, is incredibly rewarding.\u003c/p\u003e\u003cp\u003eMentorship also matters to me because it’s reciprocal. While I strive to inspire my students, they inspire me just as much. They challenge me to think creatively, communicate clearly, and lead with empathy. Every student I’ve worked with has taught me something new about the world and about myself.\u003c/p\u003e\u003cp\u003eUltimately, I believe mentorship is about believing in people—sometimes before they even believe in themselves. It’s about creating spaces where students feel seen, heard, and supported, and where their questions are met with curiosity rather than judgment. I mentor because I want to be that person who helps a student realize just how capable, brilliant, and powerful they truly are.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a11fe22b-cf6e-4d00-be87-313fdbaa80e5\"}":{"__typename":"DeepDives","uuid":"a11fe22b-cf6e-4d00-be87-313fdbaa80e5","content":"\u003cp\u003eI chose to major in Molecular Biophysics and Biochemistry because I’ve always been fascinated by the intricacies of life at the molecular level—especially enzymes and how they drive the complex chemical reactions that keep our bodies functioning. There’s something incredibly beautiful about understanding how microscopic biological systems can have such profound effects on human health. That sense of wonder is what drew me to science in the first place, and it’s what continues to fuel my academic journey.\u003c/p\u003e\u003cp\u003eI’m also on the pre-med track, and my interest in medicine has always been rooted in a desire to care for others—especially children. I’ve long been drawn to pediatrics for that reason, but in recent years, I’ve also developed a deep interest in reproductive endocrinology. The idea that I could help a couple build their family, or support someone through fertility challenges, is incredibly inspiring to me. RE is one of those specialties that combines cutting-edge science with deeply human moments, and I love the idea of being able to use my knowledge to directly impact someone’s life in such a meaningful way.\u003c/p\u003e\u003cp\u003eAt the same time, I’ve always been passionate about education, and that’s why I’m pursuing a minor in Educational Studies. I’ve spent a lot of time working with kids—as a dance teacher, a tutor, a babysitter, and a mentor—and those experiences have shown me how transformative good education can be. I’m especially interested in how we can better support students from underserved communities, and how educational equity intersects with healthcare access and opportunity. Studying education alongside biochemistry allows me to think critically about systems and solutions, and how I can be a more compassionate, informed future physician.\u003c/p\u003e\u003cp\u003eUltimately, my major reflects both my scientific curiosity and my human-centered values. I love learning about the “why” and “how” behind biological systems, but I’m equally passionate about the bigger picture—how that knowledge can be used to help people, uplift communities, and create lasting change. Choosing Molecular Biophysics and Biochemistry, with a focus on medicine and education, felt like the perfect way to bring all of my interests together. It’s challenging, yes—but also incredibly rewarding. I’m excited to continue learning and growing in both fields, and to one day turn that learning into meaningful action in the lives of others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"66bbc145-6ecd-4fbf-a994-5d400cfc8bd7\"}":{"__typename":"DeepDives","uuid":"66bbc145-6ecd-4fbf-a994-5d400cfc8bd7","content":"\u003cp\u003eIn my spare time, I love to lean into creativity—especially through music, baking, and spending time with the people I care about. I’ve always had a strong artistic side, and when I’m not studying or working, you can usually find me doing something musical or making something sweet to share with others.\u003c/p\u003e\u003cp\u003eMusic has been one of the most meaningful parts of my life, both personally and socially. I’m largely self-taught—I picked up ukulele first, then guitar and piano along the way. There’s something so satisfying about teaching yourself how to make music; it’s a combination of discipline, creativity, and expression that feels both grounding and freeing. In high school, music was also a big part of how I found community. Being in choir and a cappella gave me a sense of belonging and allowed me to connect with people across different backgrounds, all through a shared love for music. That sense of connection continues in college, where I sing with \u003cem\u003eRedhot and Blue\u003c/em\u003e, Yale’s oldest all-gender a cappella group. Music brings us together, and some of my favorite moments are just casual jam sessions or rehearsals where we’re laughing and creating something as a group.\u003c/p\u003e\u003cp\u003eOutside of music, I’m also an avid baker. I love baking not just because it’s relaxing and creative, but because it’s a form of gift-giving and service. Acts of service are one of the main ways I express care, so baking for others is my way of showing appreciation or celebrating someone’s accomplishments. I regularly bake for my a cappella group—whether it’s cookies before a big performance or macarons for a special occasion, it brings me a lot of joy to make something from scratch and then share it with others. There’s something about the process of baking—measuring, mixing, decorating—that I find really soothing, and the final product becomes a tangible way to connect with people.\u003c/p\u003e\u003cp\u003eWhen I’m not making music or baking, I love to read, especially novels and memoirs that let me see the world through someone else’s eyes. And most of all, I just love spending quality time with my friends and the \u003cem\u003eRedhot\u003c/em\u003e community—whether we’re performing, traveling, or just hanging out, those are the moments that fill my cup.\u003c/p\u003e\u003cp\u003eMy free time is where I feel most myself—creative, connected, and energized by the people and passions I care about most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"94ad8867-bafd-4822-86f4-18d495ff2e70\"}":{"__typename":"School","uuid":"94ad8867-bafd-4822-86f4-18d495ff2e70","name":"Abilene High School","city":"Abilene","type":"HIGH","state":"Texas","country":"United States","zip":"79603"},"Education:{\"uuid\":\"de033fec-38ea-43ec-979a-1b2ffaf42001\"}":{"__typename":"Education","uuid":"de033fec-38ea-43ec-979a-1b2ffaf42001","school":{"__ref":"School:{\"uuid\":\"94ad8867-bafd-4822-86f4-18d495ff2e70\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"bf4d1158-8911-4cc7-adb4-b2f3c34d4f67\"}":{"__typename":"Education","uuid":"bf4d1158-8911-4cc7-adb4-b2f3c34d4f67","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Molecular Biophysics \u0026 Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"16d17dbf-3248-4983-99db-453256b55bff\"}":{"__typename":"MentorPublicProfile","uuid":"16d17dbf-3248-4983-99db-453256b55bff","displayName":"Arabella M.","slug":"arabella-marz","biography":"\u003cp\u003eHello! My name is Belle Marz, and I’m currently a sophomore at Yale University majoring in Molecular Biophysics \u0026amp; Biochemistry and Educational Studies. I’ve always been drawn to the intersection of science and people—curious about how things work on a molecular level while also being passionate about how we teach and share that knowledge. This dual interest has shaped not only my academic path but also the kind of mentor I strive to be: someone who is both technically strong and deeply attuned to how students learn best.\u003c/p\u003e\u003cp\u003eI specialize in STEM subjects and AP coursework, particularly in the sciences and math. In high school, I took a wide array of AP courses including AP Biology, AP Chemistry, AP Calculus, and AP Physics, so I understand firsthand how rigorous and fast-paced these classes can be. But I also know how rewarding they are, especially when you have someone in your corner to help break down the tough concepts, make the material feel relevant, and boost your confidence along the way. As a mentor, that’s exactly the kind of support I aim to provide.\u003c/p\u003e\u003cp\u003eAt Yale, I’ve immersed myself in every opportunity to deepen my STEM knowledge and apply it in real-world contexts. I’ve worked in a molecular biology research lab, joined pre-med and networking clubs, and explored how educational frameworks can be used to improve the way STEM is taught in classrooms. My Educational Studies coursework, in particular, has helped me better understand how students process information, the role of motivation in learning, and how to adapt teaching strategies to meet individual needs. This blend of science and pedagogy allows me to be a more thoughtful, adaptive mentor.\u003c/p\u003e\u003cp\u003eMentoring, to me, is not just about helping someone pass a class or ace a test—it’s about building a relationship rooted in curiosity, trust, and growth. I love working with students who are excited about learning, but I also find great joy in helping students who may be feeling stuck, overwhelmed, or unsure of where to start. No matter where a student is on their academic journey, I approach mentorship with empathy, encouragement, and a strong belief in their potential.\u003c/p\u003e\u003cp\u003eOutside of academics, I find joy and creative expression through music, dance, and baking. I sing in Yale’s oldest all-gender a cappella group, Redhot and Blue, where I serve as business manager, social chair, and rush manager—coordinating travel, tours, and events for a 16-person group. It’s a role that’s taught me organization, leadership, and the value of community. I also dance with a campus ballet company and bake (French macarons are my go-to challenge bakes!). These creative outlets keep me balanced and help me bring a sense of energy, fun, and flexibility into everything I do—including mentorship.\u003c/p\u003e\u003cp\u003eIf there’s one thing I want students to know, it’s that you don’t have to go it alone. Whether you're preparing for an AP exam, exploring a new STEM topic, or simply trying to reignite your love of learning, I’m here to support you. I love working collaboratively, celebrating small wins, and helping students discover that they’re capable of more than they think. I meet students where they are and help them grow from there.\u003c/p\u003e\u003cp\u003eI’m incredibly excited about the opportunity to mentor through Curious Cardinals because I believe deeply in the power of connection, curiosity, and shared learning. I can’t wait to learn more about my students’ interests and goals, and to help them thrive—both inside and outside of the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"DF0158ezp7e9U300bOSxvY2fOU00FGsGR1xQf35qL5GPNY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular Biophysics \u0026 Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fc56fd98-1207-43ef-9043-ac999ba2d2e7\"}"},{"__ref":"DeepDives:{\"uuid\":\"48ae3b0c-4c3f-477b-a24c-364228bd8d61\"}"},{"__ref":"DeepDives:{\"uuid\":\"a11fe22b-cf6e-4d00-be87-313fdbaa80e5\"}"},{"__ref":"DeepDives:{\"uuid\":\"66bbc145-6ecd-4fbf-a994-5d400cfc8bd7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/83bf3e1c-7e25-4261-87a1-1f56d63f2e32/-/preview/-/format/jpg/","https://ucarecdn.com/c7c75d42-69e2-4482-9815-837abfc59fab/-/preview/-/format/jpg/","https://ucarecdn.com/3eb72f2a-2eae-48c7-a7f4-4a79932c2505/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"de033fec-38ea-43ec-979a-1b2ffaf42001\"}"},{"__ref":"Education:{\"uuid\":\"bf4d1158-8911-4cc7-adb4-b2f3c34d4f67\"}"}],"hiredAt":"2025-09-03T20:34:22.775Z","topics":["Pre-Algebra","K-5 Grade Math","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"arabella-marz\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"16d17dbf-3248-4983-99db-453256b55bff\"}"}}},"_sentryTraceData":"c3ba046f01aa4463bfd2248fd04af738-9995fbae38b112f2-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c3ba046f01aa4463bfd2248fd04af738,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"arabella-marz"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=G
