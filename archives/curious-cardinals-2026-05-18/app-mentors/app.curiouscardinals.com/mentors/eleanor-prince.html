xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"14474ec6-10a5-451d-a9f4-00a42d1b1f73\"}":{"__typename":"DeepDives","uuid":"14474ec6-10a5-451d-a9f4-00a42d1b1f73","content":"\u003cp\u003eI majored in Mechanical Engineering because I love learning, and M.E. is wide-reaching enough that it let me take an incredibly wide range of different courses that applied to different problems in the world: I studied robotics, electronics, math, computer science, design, fluids, biomechanics, manufacturing, ethics in engineering, art, you name it. The M.E. professors at Stanford are incredibly creative, and I loved learning how to think about new problems from unusual angles. Plus, you get to build cool things! I've kept the robots, self-driving cars, rockets, medical devices, and art installations I've built because they were a blast to create from scratch.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"a6a5c6aa-bc03-4c05-9434-2e78ce2a7f2b\"}":{"__typename":"DeepDives","uuid":"a6a5c6aa-bc03-4c05-9434-2e78ce2a7f2b","content":"\u003cp\u003eBeing a woman interested in STEM subjects isn't easy sometimes. Sometimes I was the only girl in my robotics teams or rocketry clubs, and it made me feel like I had to prove myself--which is silly in truth, because you should get to learn and make mistakes! And I know some of my friends who felt different in other ways also felt this--whether because they looked different than the rest of the team, talked different, worked different... I even had male friends who felt like outsiders when they wanted to pursue ballet like I did outside of school. We all feel that way sometimes. If you feel like an outsider in the things you're interested in, I hope you know that you're allowed to learn at your own pace, you're allowed to make mistakes, and you're allowed to show who you are inside rather than masking it--and if you don't believe that, let's talk! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"df048dab-08b3-4fb1-a957-d1a7aeb5bb2d\"}":{"__typename":"DeepDives","uuid":"df048dab-08b3-4fb1-a957-d1a7aeb5bb2d","content":"\u003cp\u003eIn undergrad I created a virtual air-hockey video game: You control the air-hockey paddle on a screen by moving a physical joystick, and can play 2-player air-hockey against your friends by trying to score into their goal on the screen. The joystick even gives you physical feedback by vibrating and jerking just like a real air-hockey paddle would. It involved writing the code, designing the game visuals, 3D-printing and programming the joysticks, and then testing on friends. I'm proud of it because it was so interdisciplinary, and my friends and I got to enjoy the final game together--and now I do similar projects for my jobs!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"bb6135ca-4634-4732-b513-95253a0af87c\"}":{"__typename":"DeepDives","uuid":"bb6135ca-4634-4732-b513-95253a0af87c","content":"\u003cp\u003eMy AP European History teacher, Ms. Brundige, was an incredible mentor in high school. Not only did she teach us how to be good students (how to get excited about history, how to take good notes, how to listen carefully), but also how to be a good human. She talked about how it's okay to be an introvert (there's power in independence, and it's okay that you need to recharge with alone time when you need it), how it's important to learn from people that are different from you, and how anyone can be a good student if they find something they care about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"0fce756b-a438-4408-82ab-9abfb6a85948\"}":{"__typename":"School","uuid":"0fce756b-a438-4408-82ab-9abfb6a85948","name":"Louisville Collegiate School","city":"Louisville","type":"HIGH","state":"Kentucky","country":"United States","zip":"40204"},"Education:{\"uuid\":\"dc6710a6-86c0-4e13-bea7-1d5db5ba5d2f\"}":{"__typename":"Education","uuid":"dc6710a6-86c0-4e13-bea7-1d5db5ba5d2f","school":{"__ref":"School:{\"uuid\":\"0fce756b-a438-4408-82ab-9abfb6a85948\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d5ccecb2-c200-4730-94a0-0964c0abbc3b\"}":{"__typename":"Education","uuid":"d5ccecb2-c200-4730-94a0-0964c0abbc3b","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Mechanical Engineering","degree":null},"Testimonial:96665890-7887-4758-b1ca-6b27c1c43e82":{"__typename":"Testimonial","id":"96665890-7887-4758-b1ca-6b27c1c43e82","text":"Dear Ellie;\nYour note made me tear up!  Such a thoughtful note that made me so happy to read.  It truly shows how much you have helped Henley this year.  \nIt was such a HUGE transition for our 16 year old - from living at home to living away from home and moving to on-line school while starting a pre-professional ballet program.  No small feat! \nYet, you empowered her with tools to help make her day-day scheduling easier, you made math FUN and engaging by using real life analogies, and you believed in her which ultimately allowed her to be brave enough to believe in herself.  \nThrough your support, she has succeeded in finishing her year strong and proved she can accomplish anything she sets her mind to.\nYour personal relationship with ballet allowed you to lead with empathy and understanding with regards to her injury this fall.  This ultimately got her through a very tough time after just moving away from home.  \nOur family is eternally grateful.  You lead with kindness, grace and optimism.  And that is exactly what Henley needed most during a very trying year.  \nThank you, Ellie!!","date":"2025-05-29 23:59:16.091+00","rating":5,"endorser":{"__typename":"Endorser","name":"Shannon Leversedge","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"aa722fe6-7e24-4995-81ff-b9f5d5338074\"}":{"__typename":"MentorPublicProfile","uuid":"aa722fe6-7e24-4995-81ff-b9f5d5338074","displayName":"Eleanor P.","slug":"eleanor-prince","biography":"\u003cp\u003eEleanor (you can call her Ellie) is a Stanford engineering student originally from Louisville, Kentucky. She earned her B.S. in Mechanical Engineering and is mid-way through an M.S. in Robotics, doing research in the Stanford Intelligent Systems Laboratory on AI and self-driving cars. But as a child of teachers and a lifelong learner, she loves every subject in school--and teaching every subject. In industry, she's worked on Falcon-9 rockets (SpaceX), self-driving cars (Waymo \u0026amp; Cruise), robots (NVIDIA), and more.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEllie has taught as a Stanford Engineering Course Assistant, rocketry team member, and even in the arts world. She teaches all subjects but has extra experience in STEM fields like Computer Science/Coding, Physics, and all levels of Math (Algebra I, Algebra II, Calculus, Geometry, K-6 Grade Math, Pre-Algebra, Precalculus \u0026amp; Trigonometry). She's also incredibly passionate about organization and habit-building to make excelling in school easier--If you need extra support in finding successful methods for studying, organizing, planning, and executing in school that work individually for you, feel free to reach out.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, Ellie loves the arts, music, comedy, and the outdoors. Before Stanford she was a professional ballerina, and is still incredibly involved in the arts world. She's a huge believer that you don't just have to be \u003cem\u003eone\u003c/em\u003e thing--You can be an artist, an academic, an athlete, a creator, a builder... so if you have more than one passion or are scared to try something new, definitely reach out!\u003c/p\u003e","teachingVideoPlaybackId":"43lbfK5fbHU7hRKUbUQbMS3eonylsSXsUqNwDV6954k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"14474ec6-10a5-451d-a9f4-00a42d1b1f73\"}"},{"__ref":"DeepDives:{\"uuid\":\"a6a5c6aa-bc03-4c05-9434-2e78ce2a7f2b\"}"},{"__ref":"DeepDives:{\"uuid\":\"df048dab-08b3-4fb1-a957-d1a7aeb5bb2d\"}"},{"__ref":"DeepDives:{\"uuid\":\"bb6135ca-4634-4732-b513-95253a0af87c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d34d3c31-f2dc-4f5b-aee3-33b28cbe7ba0/-/preview/-/format/jpg/","https://ucarecdn.com/a9c50889-f180-4b64-b004-27d04af283fe/-/preview/-/format/jpg/","https://ucarecdn.com/3582f2db-410d-42ce-86a1-18e51da80034/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"dc6710a6-86c0-4e13-bea7-1d5db5ba5d2f\"}"},{"__ref":"Education:{\"uuid\":\"d5ccecb2-c200-4730-94a0-0964c0abbc3b\"}"}],"hiredAt":"2024-03-19T08:10:32.643Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","Physics","Computer Science","Academic Coaching","Executive Function"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:96665890-7887-4758-b1ca-6b27c1c43e82"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"eleanor-prince\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"aa722fe6-7e24-4995-81ff-b9f5d5338074\"}"}}},"_sentryTraceData":"2e9d36115d484a9a95417cdef3220035-ba3716cbf1d34774-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2e9d36115d484a9a95417cdef3220035,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"eleanor-prince"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore
