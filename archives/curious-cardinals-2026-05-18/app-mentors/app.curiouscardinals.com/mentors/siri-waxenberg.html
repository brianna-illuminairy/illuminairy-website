mentorship matter to you?"},"DeepDives:{\"uuid\":\"abae12d9-cfa6-491b-ba5d-9f9d2de89b2c\"}":{"__typename":"DeepDives","uuid":"abae12d9-cfa6-491b-ba5d-9f9d2de89b2c","content":"\u003cp\u003eI believe that everyone deserves to find something that excites them. I hope I can help mentees find/grow their spark!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}":{"__typename":"School","uuid":"7f9a6683-e17a-47fa-9e6d-534e82c727e1","name":"Brooklyn Technical High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11217"},"Education:{\"uuid\":\"c4388f02-b41e-453a-bac9-6eeebcb05c26\"}":{"__typename":"Education","uuid":"c4388f02-b41e-453a-bac9-6eeebcb05c26","school":{"__ref":"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"973a82c7-6dac-453f-9c41-8150db72ff51\"}":{"__typename":"Education","uuid":"973a82c7-6dac-453f-9c41-8150db72ff51","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Civil Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"a5f65f46-e1fa-4857-9e26-19995c0461c5\"}":{"__typename":"MentorPublicProfile","uuid":"a5f65f46-e1fa-4857-9e26-19995c0461c5","displayName":"Siri W.","slug":"siri-waxenberg","biography":"\u003cp\u003eHi, I’m Siri! Within math and science, I love finding outlets for artistic creativity. Whether that means making a colorful study guide or utilizing art for my STEM-related clubs, it brings balance to my structured field of study.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've brought architecture focused knowledge from high school to my Civil Engineering studies at Cornell. One example is the Cornell Concrete Canoe project team where we build a buoyant 20-foot concrete boat! I am on the Aesthetics Subteam where we create the theming, design, and uniform for our team. Last year, I led our subteam of eight in our work with design elements and materials, such as colored concrete.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter three successful years at Cornell, I am especially proud of the community I have built here. I love to cook and explore with friends as we all work hard toward our respective goals. Along with friends, I am giving back to the CU Engineering community as a Peer Advisor and Academic Excellence Workshop (AEW) facilitator. Peer Advising is easing freshmen engineers’ transition to Cornell, and AEWs use research supported active learning strategies to increase student understanding of material. This work has improved my understanding of what it takes to be a fulfilled student and how to find that motivation in myself and others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am pursuing civil engineering because I want to build lasting structures. After three summers working in construction management in New York, I feel I have found my avenue for this work. I want to help other students find the field or goal that drives them. Finding civil engineering was also what led me to Cornell. Cornell has one of the most well regarded programs in the country and when I learned that (along with how close it is to NYC) I knew it was my first choice. I applied Early Decision in 2023 and I’m very happy with my choice.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn terms of hobbies, I love to paint, climb, and crochet! I can follow a football or hockey convo but please don’t try to talk to me about soccer because it \u003cem\u003ewill\u003c/em\u003e just go over my head. If we both love art, I’m sure we can work it into our lessons!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor my work with Curious Cardinals, I want to find what makes work exciting for my students. I've mentored and tutored students in middle school, high school, and college. I've been told my enthusiasm is contagious. I hope it spreads to you!\u003c/p\u003e","teachingVideoPlaybackId":"mgoiu302zEYZqfPGBa1C02ltzE6zAYFByyRkH01riKOG4o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"fa7f0bf5-5c2b-4f42-b425-19b33760b49d\"}"},{"__ref":"Favorites:{\"uuid\":\"b89f1741-efe1-475d-bfca-ec93b19865b4\"}"},{"__ref":"Favorites:{\"uuid\":\"22777745-fef6-448c-bc6d-408aa307ec06\"}"}],"causesSupported":[],"major":"Civil Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"712d95da-5161-4df0-9fb7-a5337576e801\"}"},{"__ref":"DeepDives:{\"uuid\":\"abae12d9-cfa6-491b-ba5d-9f9d2de89b2c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9626f6ab-2ad5-41c6-ad5a-458b3fe9fd8e/-/preview/-/format/jpg/","https://ucarecdn.com/41d95382-359e-48b5-b293-99457550ce97/-/preview/-/format/jpg/","https://ucarecdn.com/655d815a-3215-4682-9d18-5370f4da1721/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c4388f02-b41e-453a-bac9-6eeebcb05c26\"}"},{"__ref":"Education:{\"uuid\":\"973a82c7-6dac-453f-9c41-8150db72ff51\"}"}],"hiredAt":"2025-11-23T22:01:46.721Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","Academic Coaching","Executive Function","College Essay Writing","Computer Science"],"communityBadges":["https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile(
