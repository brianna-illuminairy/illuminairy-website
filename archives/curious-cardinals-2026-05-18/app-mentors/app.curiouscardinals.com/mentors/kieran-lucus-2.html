xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7a7136aa-9da5-4e2d-a4e6-40ef3e9471c0\"}":{"__typename":"Favorites","uuid":"7a7136aa-9da5-4e2d-a4e6-40ef3e9471c0","photoUrl":"https://ucarecdn.com/9135d385-4d46-4e52-a27a-64437a892531/","title":"Anna Hathaway","type":"ACTOR"},"Favorites:{\"uuid\":\"ea40ca22-b855-4d47-901a-a8c44a9e486f\"}":{"__typename":"Favorites","uuid":"ea40ca22-b855-4d47-901a-a8c44a9e486f","photoUrl":"https://ucarecdn.com/ab8c4aff-bf01-4181-abca-77e32e51744d/","title":"Blonde by Frank Ocean","type":"ALBUM"},"Favorites:{\"uuid\":\"0a4003d2-bf87-4efa-a11f-5270b8325fa4\"}":{"__typename":"Favorites","uuid":"0a4003d2-bf87-4efa-a11f-5270b8325fa4","photoUrl":"https://ucarecdn.com/c7257e78-db0b-4e06-9954-eb1c967f3966/","title":"The Perks of Being a Wallflower","type":"MOVIE"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"1fb0a7e0-8f76-4ed1-b006-e9b7935bb4cf\"}":{"__typename":"DeepDives","uuid":"1fb0a7e0-8f76-4ed1-b006-e9b7935bb4cf","content":"\u003cp\u003eWhen I was in high school, I was extremely driven, and honestly, at times a bit neurotic. I wanted to make the most and achieve as much as possible, but at times lacked time-management and organizational skills, causing a lot of stress. I'm very proud of my successes, however, as I ended up being a National Merit Finalist, salutatorian of my graduating class, a 6x school record holder swimmer, Founder of my high school's varsity volleyball program, and above all else, Teacher's Pet as voted by my peers!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d20c01a6-0816-4cc0-9655-497e23557f86\"}":{"__typename":"DeepDives","uuid":"d20c01a6-0816-4cc0-9655-497e23557f86","content":"\u003cp\u003eWhen I was in high school, I was absolutely obsessed with the sport of swimming, during the summer especially. My average summer day started by waking up at 4 am to go to a 5 am long-course swim practice. Then, I would eat breakfast and go to the lake by my house, where I grew up learning to swim, and volunteer-coached until I was old enough to apply for the position. Finally, my day of swimming was over after I attended my second practice of the day at my local community college. I hated this demanding schedule at the time, but I would give anything to go back and swim with my friends one more time!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"18edcf45-a631-4c33-9867-0594151b4c8c\"}":{"__typename":"DeepDives","uuid":"18edcf45-a631-4c33-9867-0594151b4c8c","content":"\u003cp\u003eI had the pleasure last year of working in conjunction with the Planned Parenthood of Rhode Island and the Sexual Health Advocacy and Peer Education Club at Brown University to write an inclusive sexual health curriculum. I believe access to comprehensive sexual education is one of the greatest contributors to socioeconomic divide, so getting to work on this was incredibly impactful. It was then so fulfilling to be able to teach this curriculum in local underfunded Providence high schools.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"16848a7c-07c4-4c40-81f3-247862932e64\"}":{"__typename":"School","uuid":"16848a7c-07c4-4c40-81f3-247862932e64","name":"Randolph High School","city":"Randolph","type":"HIGH","state":"New Jersey","country":"United States","zip":"07869"},"Education:{\"uuid\":\"f38fab95-3165-4229-945e-2a18452ff02f\"}":{"__typename":"Education","uuid":"f38fab95-3165-4229-945e-2a18452ff02f","school":{"__ref":"School:{\"uuid\":\"16848a7c-07c4-4c40-81f3-247862932e64\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"ef567bfd-fe9a-437a-a997-14883ba1dd5d\"}":{"__typename":"Education","uuid":"ef567bfd-fe9a-437a-a997-14883ba1dd5d","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Applied Math and Business-Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"477733bc-04f2-43d4-a912-c938b057b3c0\"}":{"__typename":"MentorPublicProfile","uuid":"477733bc-04f2-43d4-a912-c938b057b3c0","displayName":"Kieran L.","slug":"kieran-lucus-2","biography":"\u003cp\u003eHi! My name is Kieran Lucus, and I’m currently a junior at Brown University where I’m studying Applied Mathematics and Business-Economics. I am very drawn to mentoring a high school student, because I think there is a gap in the lives of students this age that often leaves them misguided and confused. I hope to provide my mentees with a comforting ear and empowering advice as I want to answer the questions that their peers, parents, guidance counselors, etc may not be able to answer. I hope to use the struggles I went through not so long ago when I was their age to help guide these ambitious students toward excellence.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne common struggle I dealt particularly closely with in high school was navigating my passions. I loved so many subjects, and I had a hard time landing on one thing I wanted to pursue. Surprisingly, when I was in high school, I thought I wanted to become a doctor. I won my high school's biology award, did genetics and embryology research, and applied to all my colleges as a biochemistry major. Arriving to Brown, however, I have been introduced to new topics, and have been working toward a career in pharmaceuticals to fuse all of my passions professionally. I hope to help my mentees not settle on one avenue when their interests pull them in multiple different directions!\u003c/p\u003e\u003cp\u003eOutside of the classroom, I’m very passionate about advocacy work, especially in the LGBTQ+ community. While in college, I have had the opportunity to intern for a non-profit advocating for incarcerated and previously incarcerated LGBTQ+ people, and I was able to work in conjunction with the Providence Planned Parenthood\u0026nbsp; and SHAPE club at Brown to construct an inclusive sexual education curriculum which I then taught in local high schools. Beyond advocacy, I have also worked on a strategy consulting project working on an African company’s US market entry strategy, and I have interned with an art curation social media platform startup in business development.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and professional goals, I also love to have fun, and believe this is a critical part of any successful person’s life! I’m really into music on my campus as I play the viola in the Brown University Orchestra. I also love talking to people and engaging with my community, leading me to be involved in 2 student government organizations on campus. On a day when I have no responsibilities to attend to, you can find me trying out a new coffee shop in Providnce, working out at the gym, or binging reality TV!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m so excited to get started!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7a7136aa-9da5-4e2d-a4e6-40ef3e9471c0\"}"},{"__ref":"Favorites:{\"uuid\":\"ea40ca22-b855-4d47-901a-a8c44a9e486f\"}"},{"__ref":"Favorites:{\"uuid\":\"0a4003d2-bf87-4efa-a11f-5270b8325fa4\"}"}],"causesSupported":[],"major":"Applied Math and Business-Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1fb0a7e0-8f76-4ed1-b006-e9b7935bb4cf\"}"},{"__ref":"DeepDives:{\"uuid\":\"d20c01a6-0816-4cc0-9655-497e23557f86\"}"},{"__ref":"DeepDives:{\"uuid\":\"18edcf45-a631-4c33-9867-0594151b4c8c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3844ec6e-4275-4007-ab51-a970a5af8061/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f38fab95-3165-4229-945e-2a18452ff02f\"}"},{"__ref":"Education:{\"uuid\":\"ef567bfd-fe9a-437a-a997-14883ba1dd5d\"}"}],"hiredAt":"2025-01-29T21:32:16.309Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Biology","Physics","Writing","Spanish","Academic Coaching","College Essay Writing","Economics","Computer Science","Reading","Music","Finance / Investing","Business / Entrepreneurship","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kieran-lucus-2\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"477733bc-04f2-43d4-a912-c938b057b3c0\"}"}}},"_sentryTraceData":"6fc672f3ea5543a28953ff
