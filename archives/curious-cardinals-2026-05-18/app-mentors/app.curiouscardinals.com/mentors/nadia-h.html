xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"172c37a8-b345-4218-8ae2-c1b86a9129b2\"}":{"__typename":"DeepDives","uuid":"172c37a8-b345-4218-8ae2-c1b86a9129b2","content":"\u003cp\u003eAs someone that has been blessed with outstanding mentors, I know how it feels to have someone dedicated to your ideas, education, and future. I would not be where I am today without my mentors and I feel that every student should have the opportunity to be mentored! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"6a79fb11-706d-4074-b6a5-f9b9716a06fb\"}":{"__typename":"DeepDives","uuid":"6a79fb11-706d-4074-b6a5-f9b9716a06fb","content":"\u003cp\u003eAs a first-generation Iranian American and public health researcher, my heritage deeply informs my teaching style. Growing up at the intersection of two cultures has taught me to approach learning with empathy, adaptability, and an appreciation for diverse perspectives. This shapes the way I connect with students, emphasizing inclusivity and real-world relevance.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9d9351e3-5209-4cb2-94cf-7f780d2104fb\"}":{"__typename":"DeepDives","uuid":"9d9351e3-5209-4cb2-94cf-7f780d2104fb","content":"\u003cp\u003eKeep exploring classes and activities that genuinely interest you. By following your curiosity, you'll uncover the career path that feels like the perfect fit for you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"16d1d656-c009-468e-9f66-9668156fe1c4\"}":{"__typename":"DeepDives","uuid":"16d1d656-c009-468e-9f66-9668156fe1c4","content":"\u003cp\u003eWhen I was 17, my twin sister and I started a small business creating custom tote bags and sweatshirts. It quickly became my passion—I loved bringing each unique design to life and seeing how it transformed every piece into something special.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"253abe40-1366-4d5e-a26f-1ffc1d5c36db\"}":{"__typename":"School","uuid":"253abe40-1366-4d5e-a26f-1ffc1d5c36db","name":"Aragon High School","city":"San Mateo","type":"HIGH","state":"California","country":"United States","zip":"94402"},"Education:{\"uuid\":\"91883ea8-bff2-46f3-9ba1-a82fa04b87f3\"}":{"__typename":"Education","uuid":"91883ea8-bff2-46f3-9ba1-a82fa04b87f3","school":{"__ref":"School:{\"uuid\":\"253abe40-1366-4d5e-a26f-1ffc1d5c36db\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"470be863-aff8-4c8d-8056-8de4d1287098\"}":{"__typename":"Education","uuid":"470be863-aff8-4c8d-8056-8de4d1287098","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2023","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"3fae1713-6dac-418b-be60-3d7f88fd34f6\"}":{"__typename":"MentorPublicProfile","uuid":"3fae1713-6dac-418b-be60-3d7f88fd34f6","displayName":"Nadia H.","slug":"nadia-h","biography":"\u003cp\u003eHi everyone! My name is Nadia Hemmat, and I’m excited to support students and families on their educational journeys. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am currently pursuing my PhD in Public Health at UC San Diego and San Diego State University, with a focus on improving health equity and accessibility. I hold a Master’s degree in Global Health from UCSF and a Bachelor’s degree in Human Biology from Stanford University. My academic and professional experiences have centered around health research, education, and global women’s and child health issues.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my studies, I am passionate about teaching and mentoring students. I have taught courses and led research studies that inspire curiosity and critical thinking, particularly in areas related to global health and social impact. I strive to make learning engaging and accessible, helping students not only succeed academically but also grow into empathetic and informed individuals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not in the classroom or conducting research, you can find me playing rugby, hiking scenic trails, or experimenting with Persian recipes in the kitchen (sometimes successfully!).\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eI look forward to working with your family to help your student achieve their goals and reach their full potential!\u003c/p\u003e","teachingVideoPlaybackId":"qNa00Ekphk00FMluB3500Rq019kTkfdJyy00mwpnO4QM2dQ4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"172c37a8-b345-4218-8ae2-c1b86a9129b2\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a79fb11-706d-4074-b6a5-f9b9716a06fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d9351e3-5209-4cb2-94cf-7f780d2104fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"16d1d656-c009-468e-9f66-9668156fe1c4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d5ce0d17-e3c2-4f5a-aebd-13afd8550df8/-/preview/-/format/jpg/","https://ucarecdn.com/7d45aeca-45d0-41a2-9466-74406c90c351/-/preview/-/format/jpg/","https://ucarecdn.com/aeb221db-460d-4f27-8271-6525cf2747b8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"91883ea8-bff2-46f3-9ba1-a82fa04b87f3\"}"},{"__ref":"Education:{\"uuid\":\"470be863-aff8-4c8d-8056-8de4d1287098\"}"}],"hiredAt":"2024-11-21T11:42:34.757Z","topics":["Medicine / Health","Spanish","Business / Entrepreneurship","Law / Government / Policy","College Essay Writing","Executive Function"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nadia-h\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3fae1713-6dac-418b-be60-3d7f88fd34f6\"}"}}},"_sentryTraceData":"b0cd11edecee434ab949f4279d7b7de2-96278bf65b3fec96-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b0cd11edecee434ab949f4279d7b7de2,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":
