xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1485e71d-2599-4717-bd62-a99eac2aa3d9\"}":{"__typename":"Favorites","uuid":"1485e71d-2599-4717-bd62-a99eac2aa3d9","photoUrl":"https://ucarecdn.com/96db425c-07a7-4daa-af3c-d7e515dfd137/","title":"Daniel Ceasar","type":"ARTIST"},"CausesSupported:{\"uuid\":\"e7f7ac32-747f-40bc-ae59-5a27348b5a9e\"}":{"__typename":"CausesSupported","uuid":"e7f7ac32-747f-40bc-ae59-5a27348b5a9e","name":"American Red Cross","description":"\u003cbr\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f1cabb24-fa9c-4502-9ef6-762f95fa4522\"}":{"__typename":"DeepDives","uuid":"f1cabb24-fa9c-4502-9ef6-762f95fa4522","content":"\u003cblockquote\u003e\u003cp\u003eSay yes! Many of my most memorable moments have come from experiences that I almost turned down because I was nervous, unsure, or didn’t feel “ready.” Looking back, the moments where I grew the most weren’t the ones where everything felt planned out, but the ones where I took a chance and figured things out as I went. Saying yes led me to new people, unexpected opportunities, and lessons I never would have learned if I had stayed comfortable. I wish I had trusted earlier that it’s okay not to have everything figured out—growth comes from trying, not waiting.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"80216ca4-24cf-4d95-9fad-6300fb588bbb\"}":{"__typename":"DeepDives","uuid":"80216ca4-24cf-4d95-9fad-6300fb588bbb","content":"\u003cblockquote\u003e\u003cp\u003eOut of all the things I could be doing, mentorship matters most to me because it shaped one of my proudest accomplishments. Publishing a book wasn’t something I could have done on my own—it happened because mentors believed in me before I fully believed in myself. They didn’t just give advice; they pushed me to think bigger, helped me refine my ideas, and reminded me that my voice mattered when I doubted it. That experience showed me how powerful it is when someone invests time and care into your growth. I want to be that person for others—to help them see possibilities they might not yet see, to guide them through challenges, and to give them the confidence to turn ideas into something real, just like my mentors did for me.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c8737de7-f941-4831-bbf6-612eb4c8aa30\"}":{"__typename":"DeepDives","uuid":"c8737de7-f941-4831-bbf6-612eb4c8aa30","content":"\u003cblockquote\u003e\u003cp\u003eMy dream job probably doesn’t have a clean title. I just want to spend my life learning about all kinds of things—serious things, random things, and things I didn’t even know existed five minutes ago. One day I want to understand how public policy shapes real lives, the next I want to learn why bugs behave the way they do or how a single decision can ripple through an entire system. I love asking questions, connecting dots that don’t obviously belong together, and constantly being a beginner at something new. If there’s a job that lets me explore ideas, talk to people who think differently, and keep being curious forever, that’s the dream.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"b16bce16-974a-4dda-8a86-33fc1ae66785\"}":{"__typename":"DeepDives","uuid":"b16bce16-974a-4dda-8a86-33fc1ae66785","content":"\u003cblockquote\u003e\u003cp\u003eMy hometown of El Paso sits at the intersection of breathtaking desert mountains and the frontlines of the immigration crisis. A few years ago, as thousands of migrants arrived at the border, I watched national conversations reduce their lives to statistics rather than stories. Wanting to push back against that narrative, I set out to listen—to interview immigrants in my community, learn their experiences, and write their stories. That work became \u003cem\u003e10 Stories of Hope\u003c/em\u003e, a book that briefly reached Amazon’s immigration bestseller list. I was proud not only of its success, but of the fact that it gave voice to people whose stories often go unheard.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"d4f28c11-517c-47c1-86a0-c0fdb4957425\"}":{"__typename":"School","uuid":"d4f28c11-517c-47c1-86a0-c0fdb4957425","name":"Coronado High School","city":"El Paso","type":"HIGH","state":"Texas","country":"United States","zip":"79912"},"Education:{\"uuid\":\"3f0210c6-bcdf-4fe8-99aa-a49808acd184\"}":{"__typename":"Education","uuid":"3f0210c6-bcdf-4fe8-99aa-a49808acd184","school":{"__ref":"School:{\"uuid\":\"d4f28c11-517c-47c1-86a0-c0fdb4957425\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"68e377b6-7841-4745-8cac-6d77c6bdf0b3\"}":{"__typename":"Education","uuid":"68e377b6-7841-4745-8cac-6d77c6bdf0b3","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science + Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"fe1d302e-9917-42ee-bd76-981d929ed60e\"}":{"__typename":"MentorPublicProfile","uuid":"fe1d302e-9917-42ee-bd76-981d929ed60e","displayName":"William Q.","slug":"william-qian-1","biography":"\u003cblockquote\u003e\u003cp\u003eHi! My name is William Qian, and I am a sophomore at Yale University studying Computer Science and Economics. I am passionate about helping students build confidence, curiosity, and long-term direction—both academically and beyond the classroom.\u003c/p\u003e\u003cp\u003eAt Yale, I’m deeply interested in strategy, game theory, and decision-making, exploring how individuals and institutions make choices under uncertainty. I enjoy applying these ideas not just in economics and computer science, but also in real-world contexts like investing, problem-solving, and goal-setting. This strategic mindset shapes how I mentor students: I focus on helping them think critically, break problems into manageable pieces, and develop systems that allow them to succeed independently rather than relying on memorization alone.\u003c/p\u003e\u003cp\u003eI have extensive experience working directly with students through my role as a math tutor at Mathnasium, where I’ve supported learners across a wide range of ages and skill levels. There, I learned how to adapt explanations to different learning styles, build rapport quickly, and help students regain confidence—especially those who previously felt discouraged or “not good at math.” I place a strong emphasis on patience, encouragement, and measurable progress.\u003c/p\u003e\u003cp\u003eBeyond tutoring, I have significant experience with passion projects and academic growth. I published a book focused on immigration advocacy and have helped many students develop their own projects, explore their interests, and successfully apply to competitive schools, including Yale. I understand how overwhelming this process can feel, and I strive to provide the mentorship and structure I wish I had at that age.\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy debating ideas, investing, photography, playing golf, baking cookies, and going on long drives. I’ll be joining McKinsey \u0026amp; Company as an intern, further strengthening my interest in strategy, leadership, and problem-solving at scale.\u003c/p\u003e\u003cp\u003eI genuinely enjoy working with students and families and place great importance on open communication, clear goal-setting, and highly personalized support. My goal is not only to help students feel empowered, capable, and excited about learning, but also to instill a way of thinking that enables them to approach complex challenges with confidence. By teaching students how to break down large, unfamiliar problems into manageable steps, I help them develop the tools to think independently and tackle increasingly difficult tasks on their own. I look forward to the opportunity to work with you and support your student’s growth!\u003c/p\u003e\u003c/blockquote\u003e","teachingVideoPlaybackId":"aiwUaq00XMkyYr1vdP525e400VPn6f5OvYZle8p01Mriwc","teachingVideoDescription":null,"greatestAchievement":"\u003cblockquote\u003e\u003cp\u003eWith the guidance and support of mentors during my junior year of high school, I published a book titled \u003cem\u003e10 Stories of Hope\u003c/em\u003e, which shares the journeys of immigrants in my community and their paths to the United States. The book went on to become a bestseller in Amazon’s immigration category, an outcome that reaffirmed the power of storytelling to create awareness and understanding.\u003c/p\u003e\u003c/blockquote\u003e\u003cblockquote\u003e\u003cbr\u003e\u003c/blockquote\u003e\u003cblockquote\u003e\u003cp\u003eAs a child of immigrants myself, this project was deeply personal. I’ve seen firsthand how access to opportunity often depends on whether stories are heard, understood, and valued. Spaces for future opportunity are created when stories of resilience and possibility are shared with those who may not otherwise encounter perspectives different from their own.\u003c/p\u003e\u003c/blockquote\u003e\u003cblockquote\u003e\u003cbr\u003e\u003c/blockquote\u003e\u003cblockquote\u003e\u003cp\u003eI credit much of my ability to bring this book to life to the mentors who believed in me, guided me through uncertainty, and helped turn an idea into something meaningful. Their support shaped not only this project, but also my desire to mentor others. Today, I strive to provide the same guidance to students as they develop and publish passion projects on topics that matter to them, helping them find their voice and bring their ideas into the world.\u003c/p\u003e\u003c/blockquote\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"1485e71d-2599-4717-bd62-a99eac2aa3d9\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"e7f7ac32-747f-40bc-ae59-5a27348b5a9e\"}"}],"major":"Computer Science + Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f1cabb24-fa9c-4502-9ef6-762f95fa4522\"}"},{"__ref":"DeepDives:{\"uuid\":\"80216ca4-24cf-4d95-9fad-6300fb588bbb\"}"},{"__ref":"DeepDives:{\"uuid\":\"c8737de7-f941-4831-bbf6-612eb4c8aa30\"}"},{"__ref":"DeepDives:{\"uuid\":\"b16bce16-974a-4dda-8a86-33fc1ae66785\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d951028c-1b65-4d0a-aafd-970ef707af57/-/preview/-/format/jpg/","https://ucarecdn.com/02f486a7-879e-4f18-96c0-f5dda5404da3/-/preview/-/format/jpg/","https://ucarecdn.com/a5a98791-0f85-4553-bcfe-ed3bc6056bd3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3f0210c6-bcdf-4fe8-99aa-a49808acd184\"}"},{"__ref":"Education:{\"uuid\":\"68e377b6-7841-4745-8cac-6d77c6bdf0b3\"}"}],"hiredAt":"2026-01-09T23:01:55.244Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Writing","Academic Coaching","College Essay Writing","Economics","History"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"william-qian-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fe1d302e-9917-42ee-bd76-981d929ed60e\"}"}}},"_sentryTraceData":"c6b32802dff945db91c5b0b5b61dafb8-b434a66838da8896-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c6b32802dff945db91c5b0b5b61dafb8,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"william-qian-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="htt
