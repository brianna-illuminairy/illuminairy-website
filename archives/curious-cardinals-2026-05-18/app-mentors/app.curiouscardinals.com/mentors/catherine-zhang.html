xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"05cad643-7716-483f-9cb9-f213097f8027\"}":{"__typename":"Favorites","uuid":"05cad643-7716-483f-9cb9-f213097f8027","photoUrl":"https://ucarecdn.com/fa12c26f-f6b9-4a5d-a0ad-ee3e07b59350/","title":"Hamilton","type":"PLAY"},"Favorites:{\"uuid\":\"d4874d9e-66d6-47cf-878b-23e5353bdbc3\"}":{"__typename":"Favorites","uuid":"d4874d9e-66d6-47cf-878b-23e5353bdbc3","photoUrl":"https://ucarecdn.com/7989e944-eec9-4ea5-85cf-be62d00493fb/","title":"Inception","type":"MOVIE"},"Favorites:{\"uuid\":\"bbbb5018-2fb8-4057-a503-46d1032b83b7\"}":{"__typename":"Favorites","uuid":"bbbb5018-2fb8-4057-a503-46d1032b83b7","photoUrl":"https://ucarecdn.com/7989e944-eec9-4ea5-85cf-be62d00493fb/","title":"Soccer","type":"SPORT"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b8076d54-a81c-4113-92b9-e3b93a40842a\"}":{"__typename":"DeepDives","uuid":"b8076d54-a81c-4113-92b9-e3b93a40842a","content":"\u003cp\u003eGrowing up in Silicon Valley, I have always been inspired by the power of technology to solve real world problems in innovative ways. Whether its large tech giants changing the our daily lives or startups targeting specific niches, I love how technology can be applied to just about any problem. Additionally, I am drawn to the inherent problem solving aspect of computer science and love tinkering with problems and learning the logic behind algorithms. I genuinely believe that technology is pushing boundaries everyday and would love the opportunity to see first-hand how it continues to grow and change our lives. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"cdc42920-dc25-447c-a2d9-2420600dc1af\"}":{"__typename":"DeepDives","uuid":"cdc42920-dc25-447c-a2d9-2420600dc1af","content":"\u003cp\u003eThe biggest piece of advice I would give to my younger self is just to live in the moment and explore things I love. Oftentimes, it can be so easy to get caught up on thinking about the future and preparing for the future that you lose out on your current experiences. It's important to stay present and just enjoy the time you have with the people you care about. I also would encourage myself to explore different things. I believe that it's super important to explore new things when you have the chance to learn more about the world as well as yourself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"fd2f4076-218e-4d77-a5bb-d04f2db9cdb5\"}":{"__typename":"DeepDives","uuid":"fd2f4076-218e-4d77-a5bb-d04f2db9cdb5","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is contribute to the fight against climate change through innovative technologies. I have always been passionate about both tech and sustainability and would love to the opportunity to combine these interests by working on cutting-edge climate tech. Sustainability is an issue that is very personal to me and I would hope to apply my expertise in computer science to be able to work in the sustainability sector and make a tangible impact on our environment. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"307ae123-aef2-4e95-8545-9ed64ead017c\"}":{"__typename":"DeepDives","uuid":"307ae123-aef2-4e95-8545-9ed64ead017c","content":"\u003cp\u003eMentorship matters to me because I believe that it is a truly mutually-beneficial relationship that has the power to change people's lives. I have had the privilege of working with incredible mentors who have not only given me great insights on my career but also advice in my personal life. My mentors are people that I look up to and have greatly shaped both my academic and personal journey. On the other hand, as a mentor myself, I have learned so much from my mentees and love getting to know them outside of the classroom. As an extremely outgoing person, I love to form meaningful connections with my mentees and provide support for them in all areas. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"008fe15a-8cb8-499e-8640-0656d4d62c96\"}":{"__typename":"School","uuid":"008fe15a-8cb8-499e-8640-0656d4d62c96","name":"Homestead High School","city":"Cupertino","type":"HIGH","state":"California","country":"United States","zip":"95014"},"Education:{\"uuid\":\"4fd85211-449e-4c0d-8ed7-8eeee3c96442\"}":{"__typename":"Education","uuid":"4fd85211-449e-4c0d-8ed7-8eeee3c96442","school":{"__ref":"School:{\"uuid\":\"008fe15a-8cb8-499e-8640-0656d4d62c96\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7aac0eca-4e77-4dcc-bc91-3797eab8775b\"}":{"__typename":"Education","uuid":"7aac0eca-4e77-4dcc-bc91-3797eab8775b","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"a010f02e-1bf1-4e11-9d61-b523a2782145\"}":{"__typename":"MentorPublicProfile","uuid":"a010f02e-1bf1-4e11-9d61-b523a2782145","displayName":"Catherine Z.","slug":"catherine-zhang","biography":"\u003cp\u003eHi everyone! My name is Catherine and I am so excited to be part of Curious Cardinal. Growing up in Silicon Valley, I've always been inspired by technology, entrepreneurship, and problem solving in different areas. I have been a tutor all throughout high school on topics ranging from math to english and love working with others! Outside of academic interest, I love being outdoors whether it's playing soccer, hiking, or going on walks. I also recently became interested in pickleball and learning how to cook. \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn high school, I successfully launched a mobile app to help students with ADHD organize assignments during remote learning. This was a topic I was particularly passionate about as many of my close friends were struggling to keep up in remote learning due to their ADHD symptoms. Therefore, I create a team through the LaunchX MIT Program and created an app to help address key pain points. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"05cad643-7716-483f-9cb9-f213097f8027\"}"},{"__ref":"Favorites:{\"uuid\":\"d4874d9e-66d6-47cf-878b-23e5353bdbc3\"}"},{"__ref":"Favorites:{\"uuid\":\"bbbb5018-2fb8-4057-a503-46d1032b83b7\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b8076d54-a81c-4113-92
