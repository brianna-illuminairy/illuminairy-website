xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6ef12bd9-b12e-49d8-8ffd-643437fcd175\"}":{"__typename":"DeepDives","uuid":"6ef12bd9-b12e-49d8-8ffd-643437fcd175","content":"\u003cp\u003eI chose Neuroscience because I wanted to understand the “why” behind so many of the conditions that had touched my own family. Growing up, I watched my grandmother live with Alzheimer’s, and I was curious about what was happening in her brain when she struggled to find words or recognize us. In college, neuroscience gave me the tools to connect that curiosity with real science. It combined my love for biology and chemistry with a focus on the human side of medicine, which has shaped both my academic path and my career goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"db4b562b-e0c9-46d0-8b21-d05c5f03efa0\"}":{"__typename":"DeepDives","uuid":"db4b562b-e0c9-46d0-8b21-d05c5f03efa0","content":"\u003cp\u003eMy greatest motivation comes from seeing progress, both in myself and in others. Whether it was watching a younger teammate reach a new personal best in running or seeing a student finally feel confident with a concept that once felt impossible, those small steps remind me why the effort matters. I do not expect perfection, but I am inspired when I see growth build over time, and that keeps me committed to showing up and giving my best.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"0e708f0d-9225-4c07-ad1d-ed15c31a15c7\"}":{"__typename":"DeepDives","uuid":"0e708f0d-9225-4c07-ad1d-ed15c31a15c7","content":"\u003cp\u003eSomething people are often surprised to learn is how much I love spending time outdoors. I grew up spending summers on my family’s farm in North Dakota, where I helped in the garden, explored fields with my cousins, and learned to appreciate simple moments outside. That part of my life made me value fresh air, open spaces, and staying active in ways that go beyond the classroom.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"f7b91159-2333-4901-bdb6-d327c55d4ced\"}":{"__typename":"DeepDives","uuid":"f7b91159-2333-4901-bdb6-d327c55d4ced","content":"\u003cp\u003eAs a student, I was motivated and curious, but I also put a lot of pressure on myself. In middle school, I was the kid who loved science projects but felt nervous before every math test. By high school, I was balancing AP classes with hours of cross country and track practice. I often tried to take on too much, but over time I learned the importance of structure, encouragement, and celebrating small wins. That perspective helps me relate to students who are figuring out how to manage school and activities at the same time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"adbd8837-fb02-4c52-8685-8c51b271d97d\"}":{"__typename":"School","uuid":"adbd8837-fb02-4c52-8685-8c51b271d97d","name":"The Rivers School","city":"Weston","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02493"},"Education:{\"uuid\":\"a7a04de4-122e-4b8c-8469-b5ddf283c03c\"}":{"__typename":"Education","uuid":"a7a04de4-122e-4b8c-8469-b5ddf283c03c","school":{"__ref":"School:{\"uuid\":\"adbd8837-fb02-4c52-8685-8c51b271d97d\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"a6eaeeb1-76ce-442c-b609-ff8e10c1f504\"}":{"__typename":"Education","uuid":"a6eaeeb1-76ce-442c-b609-ff8e10c1f504","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"4412127d-eba0-4bf7-84c0-c12dffb462dc\"}":{"__typename":"MentorPublicProfile","uuid":"4412127d-eba0-4bf7-84c0-c12dffb462dc","displayName":"Adeline V.","slug":"adeline-vettel","biography":"\u003cp\u003eHi! I’m Adeline, and I love helping students discover that learning can be both exciting and manageable. I graduated from Northwestern University with a degree in Neuroscience, where I developed a passion for science and a strong foundation in STEM. I mentor \u003cstrong\u003emiddle and high school students\u003c/strong\u003e, with a focus on \u003cstrong\u003ebiology and chemistry\u003c/strong\u003e, and I also enjoy teaching \u003cstrong\u003emath (K-6, Pre-Algebra, and Algebra I)\u003c/strong\u003e and supporting students with \u003cstrong\u003ecreative writing and college application essays\u003c/strong\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy experience as a mentor started in high school, when I tutored sixth- and eighth-grade math students. In college, I continued working with peers as a mentor for pre-med freshmen and sophomores, helping them balance demanding courses with extracurricular commitments. I also completed research internships at Northwestern’s Feinberg School of Medicine, where I studied Alzheimer’s and Parkinson’s disease. After graduation, I spent a year working as a medical assistant in an orthopedic surgery practice, gaining hands-on experience in patient care. I am now applying to medical school for the 2026 cycle, and I bring that same curiosity, patience, and dedication into my mentoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eI can support students with:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSTEM foundations\u003c/strong\u003e (K-6 math, Pre-Algebra, Algebra I, Biology, Chemistry)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWriting and communication\u003c/strong\u003e (creative writing, essay coaching, college applications)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStudy strategies and test prep\u003c/strong\u003e (organization, sustainable study habits, time management, balancing academics with extracurriculars)\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eMy time as a Division I cross country and track athlete at Northwestern taught me perseverance, resilience, and how to thrive under pressure. I know what it feels like to juggle academics, sports, and personal commitments, and I enjoy helping students build strategies to stay balanced and confident in their own lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might include:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking down a tricky science or math concept step by step\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReviewing and polishing a writing assignment to highlight the student’s voice\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a personalized study plan to stay organized and on track\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing test-taking strategies and building confidence through review\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eMost importantly, I want students to feel supported and encouraged. I aim to meet each student where they are, help them see progress, and give them tools that extend far beyond the classroom.\u003c/p\u003e\u003cp\u003eOutside of academics, I believe in keeping life active and well-rounded. Along with my passion for science and interest in medicine, I enjoy running, yoga, and skiing as ways to recharge and challenge myself.\u003c/p\u003e\u003cp\u003eIf you are looking for a mentor who can make \u003cstrong\u003escience engaging, math approachable, and writing empowering\u003c/strong\u003e, while also helping your student grow into a confident and organized learner, I would be excited to work together.\u003c/p\u003e","teachingVideoPlaybackId":"hY300YfOBM1i9a47ti4DJo14CWJFY6dpVWmu8V8UGJS00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6ef12bd9-b12e-49d8-8ffd-643437fcd175\"}"},{"__ref":"DeepDives:{\"uuid\":\"db4b562b-e0c9-46d0-8b21-d05c5f03efa0\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e708f0d-9225-4c07-ad1d-ed15c31a15c7\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7b91159-2333-4901-bdb6-d327c55d4ced\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e8c98953-e993-437c-9785-67651c20868d/-/preview/-/format/jpg/","https://ucarecdn.com/f91482f7-5b9b-4788-b8fc-18c03afcf03c/-/preview/-/format/jpg/","https://ucarecdn.com/11119c01-c7b4-477b-87f5-cdf272d714c0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a7a04de4-122e-4b8c-8469-b5ddf283c03c\"}"},{"__ref":"Education:{\"uuid\":\"a6eaeeb1-76ce-442c-b609-ff8e10c1f504\"}"}],"hiredAt":"2025-10-01T14:30:09.694Z","topics":["Algebra I","Algebra II","Precalculus / Trigonometry","Pre-Algebra","6-8 Grade Science","Chemistry","Biology","Writing","College Essay Writing","Executive Function","Academic Coaching","Creative Writing","History Project","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"adeline-vettel\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4412127d-eba0-4bf7-84c0-c12dffb462dc\"}"}}},"_sentryTraceData":"8d71c356a8f3459b92646fffc0421242-b5a5d7f94ac41826-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8d71c356a8f3459b92646fffc0421242,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"adeline-vettel"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</sc
