:null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5bdf7fa7-1cb4-4533-b68b-5a8b139e37a6\"}":{"__typename":"DeepDives","uuid":"5bdf7fa7-1cb4-4533-b68b-5a8b139e37a6","content":"\u003cp\u003eRun the Boston Marathon! 🏃‍♂️\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"c71479fb-d512-48de-99d9-5d69b72b0a82\"}":{"__typename":"School","uuid":"c71479fb-d512-48de-99d9-5d69b72b0a82","name":"College Park High School","city":"Pleasant Hill","type":"HIGH","state":"California","country":"United States","zip":"94523"},"Education:{\"uuid\":\"e6840c82-90d9-42f1-9fb3-0b4143cb0f14\"}":{"__typename":"Education","uuid":"e6840c82-90d9-42f1-9fb3-0b4143cb0f14","school":{"__ref":"School:{\"uuid\":\"c71479fb-d512-48de-99d9-5d69b72b0a82\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"8bf6f544-111a-48be-aa1d-304bcd039178\"}":{"__typename":"Education","uuid":"8bf6f544-111a-48be-aa1d-304bcd039178","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biomedical Computation","degree":null},"MentorPublicProfile:{\"uuid\":\"3bcada95-1cc3-4916-82d3-57df50d30d48\"}":{"__typename":"MentorPublicProfile","uuid":"3bcada95-1cc3-4916-82d3-57df50d30d48","displayName":"Max B.","slug":"max-benabou","biography":"\u003cp\u003e\u003cstrong\u003eHi, I’m Max!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m a recent graduate from Stanford University where I majored in \u003cstrong\u003ebiomedical computation\u003c/strong\u003e (a fun mix of computer science and bioengineering) and minored in \u003cstrong\u003eSpanish\u003c/strong\u003e. I’ve always been interested in biology, especially the brain, and pursued engineering to learn how to better utilize the tools to understand the body and treat it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough my coursework, I learned how to code in languages like \u003cstrong\u003ePython, C++, and C\u003c/strong\u003e, and studied the \u003cstrong\u003ehuman body from molecular to anatomical levels\u003c/strong\u003e. I’ve brought these interests together through classes in neuroengineering and data science. Moreover, I devoted a large aspect of my curriculum to Spanish (and even studied abroad in Madrid for three months), culminating in an \u003cstrong\u003eAdvanced proficiency certificate\u003c/strong\u003e from the American Council on the Teaching of Foreign Languages.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond the classroom, I was involved in basic, clinical, and computational \u003cstrong\u003eneuroscience research\u003c/strong\u003e. My projects have included modeling neurons to simulate learning, studying how stress affects neurotransmitter release, and exploring how visual cues influence language processing. As \u003cstrong\u003ePresident of the Stanford Undergraduate Neuroscience Society\u003c/strong\u003e, I helped expand access to neuroscience through initiatives like our new journal \u003cem\u003eThe Stanford Axon\u003c/em\u003e and an international conference on neuroethics and undergraduate research with King’s College London and the University of Toronto.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve also worked to \u003cstrong\u003egive back through community service\u003c/strong\u003e, using my Spanish to support underserved patients as a Patient Navigator at a free clinic, teach English to Stanford custodial staff, help low-resource communities through food distribution programs, and encourage Spanish-speaking communities to vote during key elections.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout all of these experiences, teaching others the knowledge and skills that I gained has been the most rewarding. Whether acting as a TA for a freshman neuroscience course, teaching new lab members bench techniques, or tutoring students in calculus, I aim to both provide new knowledge as well as \u003cstrong\u003eempower students to do something amazing\u003c/strong\u003e with it. As a Curious Cardinals mentor, I aim to build meaningful relationships with each of my students that foster a learning environment full of \u003cstrong\u003eresilience, passion, and curiosity\u003c/strong\u003e. I meet students where they are and tailor my approach to their learning style, whether that means breaking down tough concepts, talking through their goals, or just helping them stay motivated.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eA little more about me:\u003c/em\u003e\u003cbr\u003eIn my free time, I enjoy running (third marathon in October!), playing trumpet, and cooking foods from all over the world. A fun fact is that I just found out in May that my twin and I are genetically identical!\u003c/p\u003e","teachingVideoPlaybackId":"pki02PMdR3pYnQ536UX2ENltGQVkfYWJxEyBJHsVdLsA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3aa00e4a-1bf4-44af-830f-e8847228767b\"}"},{"__ref":"Favorites:{\"uuid\":\"86f5e8e0-f0ea-4a38-848c-8b29eb96a661\"}"},{"__ref":"Favorites:{\"uuid\":\"fcb4ccc7-e3ca-4cf1-bf3f-1fd57dfca052\"}"}],"causesSupported":[],"major":"Biomedical Computation","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"833121cd
