xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"edc07dac-0928-4eda-aaf4-82fd1ff41cb7\"}":{"__typename":"CausesSupported","uuid":"edc07dac-0928-4eda-aaf4-82fd1ff41cb7","name":"East Harlem Tutorial Program","description":"\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eHomework Helper Volunteer from 2015-2019.\u003c/strong\u003e\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"fa8c4752-4251-42af-8ec8-fe78ac828ecf\"}":{"__typename":"DeepDives","uuid":"fa8c4752-4251-42af-8ec8-fe78ac828ecf","content":"\u003cp\u003eMy greatest source of motivation is the feeling of progress—seeing myself or others grow, even in small ways, reminds me that effort leads to change. That, and a really good to-do list.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"e4b73a48-aebf-42c6-b6c2-2c2c90b2e510\"}":{"__typename":"DeepDives","uuid":"e4b73a48-aebf-42c6-b6c2-2c2c90b2e510","content":"\u003cp\u003eMy greatest role model is my older sister. She’s always been one step ahead—literally leaving me binders and perfectly organized notes from every grade—and she’s shown me how to lead with generosity, discipline, and heart. I’ve looked up to her for as long as I can remember.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"991c4f2a-a6c6-4a7f-aabd-4e5af9e96d96\"}":{"__typename":"DeepDives","uuid":"991c4f2a-a6c6-4a7f-aabd-4e5af9e96d96","content":"\u003cp\u003eMentorship matters to me because I truly grew up relying on it—it shaped who I am. The guidance, encouragement, and support I received from mentors at different stages made all the difference in my growth and confidence. I’d love to pay that forward and be that kind of presence in someone else’s journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d529a631-b3b8-4074-acf2-ce43fd2f65ea\"}":{"__typename":"DeepDives","uuid":"d529a631-b3b8-4074-acf2-ce43fd2f65ea","content":"\u003cp\u003eIn high school, I was stressed, anxious, and always working—I put a lot of pressure on myself to be “perfect.” Looking back, I wish I could tell my younger self to take a deep breath and change the way I viewed my work: it didn’t have to be about proving something, it could be about learning, growing, and enjoying the process.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}":{"__typename":"School","uuid":"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5","name":"The Chapin School","city":"New York","type":"HIGH","state":"NY","country":"USA","zip":"10028"},"Education:{\"uuid\":\"e02972cc-9a54-442f-bba3-c4083f11c930\"}":{"__typename":"Education","uuid":"e02972cc-9a54-442f-bba3-c4083f11c930","school":{"__ref":"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}"},"startYear":"2006","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"f0f6ea58-c961-455c-a805-16c1d45e7eb3\"}":{"__typename":"Education","uuid":"f0f6ea58-c961-455c-a805-16c1d45e7eb3","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"History and Film","degree":null},"MentorPublicProfile:{\"uuid\":\"20cb4863-b9e3-4bf9-b53c-b7279972c343\"}":{"__typename":"MentorPublicProfile","uuid":"20cb4863-b9e3-4bf9-b53c-b7279972c343","displayName":"Grace C.","slug":"grace-coolidge","biography":"\u003cp\u003eGracie graduated from Harvard in May 2024 with a degree in History and Filmmaking. She now works at a fast-growing skincare startup that blends science and innovation in the beauty space. She's always been drawn to big ideas—whether that means understanding how revolutions take shape, breaking down the structure of a screenplay, or crafting the perfect thesis to bring an essay together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Harvard, she explored everything from 18th-century political theory to modern film editing, always seeking unexpected connections and diving deep into how stories shape the world around us. Gracie genuinely enjoys writing, critical thinking, and communicating complex ideas in a clear and engaging way (ideally with a bit of personality).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat said, these skills didn’t come easily to her at first. Gracie had to work at them—learning, over time and with the help of great mentors, how to approach big and overwhelming tasks with more confidence and creativity. These days, she actually enjoys tackling dense texts, facing a blank page, or unpacking a tough topic until it finally clicks.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne thing she cares a lot about—and wishes she had figured out earlier—is organization. She used to be the kid with color-coded highlighters and no idea where her homework went. But after plenty of trial and error, she learned how to build systems that actually work—and now she loves helping students discover what works for them. Whether it’s creating a study schedule, managing a heavy reading load, or finding the right kind of planner, Gracie believes that mastering organization is one of the most empowering skills a student can learn.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, Gracie’s goal is to meet students where they are, help them build confidence, and show them that learning doesn’t have to be scary or dry—it can be creative, rewarding, and even a little fun. For students looking for a thoughtful, patient, and encouraging guide, she’s excited to help.\u003c/p\u003e","teachingVideoPlaybackId":"g9aK3r02OnGlsSoPgRveoC4O0002QuP8vtkElZ2Jx00rv9s","teachingVideoDescription":null,"greatestAchievement":"\u003cbr\u003e","favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"edc07dac-0928-4eda-aaf4-82fd1ff41cb7\"}"}],"major":"History and Film","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fa8c4752-4251-42af-8ec8-fe78ac828ecf\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4b73a48-aebf-42c6-b6c2-2c2c90b2e510\"}"},{"__ref":"DeepDives:{\"uuid\":\"991c4f2a-a6c6-4a7f-aabd-4e5af9e96d96\"}"},{"__ref":"DeepDives:{\"uuid\":\"d529a631-b3b8-4074-acf2-ce43fd2f65ea\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c91d43fd-0aa3-4ca1-9db9-ad78708d4a1e/-/preview/-/format/jpg/","https://ucarecdn.com/79771ec0-93cc-4661-b6be-4c1caebc7824/-/preview/-/format/jpg/","https://ucarecdn.com/7f18ba98-3274-4895-bca3-adde040d24e3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e02972cc-9a54-442f-bba3-c4083f11c930\"}"},{"__ref":"Education:{\"uuid\":\"f0f6ea58-c961-455c-a805-16c1d45e7eb3\"}"}],"hiredAt":"2025-03-21T20:25:01.704Z","topics":["Writing","Academic Coaching","Executive Function","History","College Essay Writing","Creative Writing","Fashion / Cosmetics","Film / Theater","History Project","Video / Photography"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"grace-coolidge\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"20cb4863-b9e3-4bf9-b53c-b7279972c343\"}"}}},"_sentryTraceData":"152a8c2665c04f4a98407a5163253583-be9eb917e04e496b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=152a8c2665c04f4a98407a5163253583,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"grace-coolidge"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
