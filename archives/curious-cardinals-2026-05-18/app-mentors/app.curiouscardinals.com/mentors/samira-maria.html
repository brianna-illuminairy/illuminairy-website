xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"349913e3-9561-4522-9e0d-6336131b2db2\"}":{"__typename":"Favorites","uuid":"349913e3-9561-4522-9e0d-6336131b2db2","photoUrl":"https://ucarecdn.com/ca175bfd-d371-46d6-b835-c0418d1e5de5/","title":"stardew valley","type":"GAME"},"Favorites:{\"uuid\":\"b81473d9-ba6f-4fad-a2fa-40f9172b4f44\"}":{"__typename":"Favorites","uuid":"b81473d9-ba6f-4fad-a2fa-40f9172b4f44","photoUrl":"https://ucarecdn.com/e6a62430-a347-417a-a6ff-088ba615e379/","title":"the sound of music","type":"MOVIE"},"Favorites:{\"uuid\":\"1f404b20-7648-459c-8ffb-063535595b97\"}":{"__typename":"Favorites","uuid":"1f404b20-7648-459c-8ffb-063535595b97","photoUrl":"https://ucarecdn.com/4271a5be-3142-41df-848e-48aa87952524/","title":"don't smile","type":"SONG"},"CausesSupported:{\"uuid\":\"7013217d-d3d3-40b4-a3e4-32c04fba727a\"}":{"__typename":"CausesSupported","uuid":"7013217d-d3d3-40b4-a3e4-32c04fba727a","name":"Girls Who Code","description":"\u003cp\u003e2 years in Girls Who Code; now co lead an advanced coding class.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"7f73327d-059a-4c78-8486-bfbf73073bac\"}":{"__typename":"CausesSupported","uuid":"7f73327d-059a-4c78-8486-bfbf73073bac","name":"CodeWorks","description":"\u003cp\u003eFounded CodeWorks, teaching kids coding through creative, hands on projects.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"fb4d1c4a-31a7-4549-ab9c-f2a618ff03e8\"}":{"__typename":"DeepDives","uuid":"fb4d1c4a-31a7-4549-ab9c-f2a618ff03e8","content":"\u003cp\u003eMy dream job is being a data scientist who uses technology to make the world a little more understandable and a little more fair. I love the idea of turning messy information into stories that people can actually learn from. \u003cbr\u003e\u003cbr\u003eData is everywhere, but most of the time people do not know how to read it or use it. I want to be someone who can take numbers and transform them into visuals, tools, or interactive projects that help people see patterns they might have missed.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA big part of that dream also involves creativity. I do not see coding as something cold or purely technical. To me it feels artistic. When I build projects in Python or experiment with computer vision, it feels like I am creating something from scratch that can actually interact with the real world. I love that moment when code finally works and suddenly a dataset becomes a graph, a simulation, or a program that teaches someone something new.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3362cf36-bb25-4faa-9fbd-9e764f87d01b\"}":{"__typename":"DeepDives","uuid":"3362cf36-bb25-4faa-9fbd-9e764f87d01b","content":"\u003cp\u003eIn my spare time I like doing a mix of relaxing and creative things. One of my favorite activities is playing golf. I like how calm it feels being outside and focusing on each shot. It is one of those sports where you are always trying to improve a little bit at a time, which makes it really satisfying.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love playing games. Sometimes it is video games, sometimes puzzle type games or strategy games with friends. I enjoy figuring things out and thinking through different possibilities, which is probably why I like coding too.\u003c/p\u003e\u003cp\u003eWhen I want something more creative and quiet, I spend time watercolor painting. I like experimenting with colors and letting the paint move naturally on the paper. It feels really relaxing and different from the structured thinking I do when coding.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnother small hobby of mine is collecting stickers. Whenever I find interesting or artistic stickers I save them. Some go on notebooks or laptops, and some I just keep because I like the designs. It is a fun way to keep little pieces of art around.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a835154f-3ebd-4806-95d8-de65e8b613c4\"}":{"__typename":"DeepDives","uuid":"a835154f-3ebd-4806-95d8-de65e8b613c4","content":"\u003cp\u003eMentorship matters to me because it is often the moment when someone’s dreams start to feel real. A lot of people have big ideas about what they want to do, but without someone guiding them, encouraging them, or simply showing them where to start, those dreams can feel distant.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, mentorship is powerful because it turns curiosity into confidence. When someone takes the time to explain something, answer questions, or believe in your potential, it changes how you see yourself. Suddenly something that once felt intimidating becomes possible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have seen this especially when teaching younger students how to code. At first many of them think programming is too hard or that they are not the kind of person who can do it. But once someone sits with them, shows them the basics, and encourages them when things break, their mindset shifts. They start experimenting, asking questions, and building things they did not think they could create before. That moment when their eyes light up is when you can see their dreams starting to come alive.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship is also meaningful because it creates a cycle. The support you receive from mentors inspires you to pass that same encouragement to others. It turns learning into a community effort where people grow together instead of struggling alone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"d75a674b-1d00-4f0d-af91-d2fa36919326\"}":{"__typename":"DeepDives","uuid":"d75a674b-1d00-4f0d-af91-d2fa36919326","content":"\u003cp\u003eOne passion project that means a lot to me is my work around making coding more accessible for younger students. I have always believed that technology should feel welcoming and creative, especially for kids who might not normally see themselves in STEM.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of that, I started focusing on ways to teach coding in a way that feels fun and interactive rather than intimidating. When I work with students, I try to turn programming into something visual and playful. Instead of only explaining syntax, I like building small projects where they can immediately see what their code is doing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis interest has also pushed me to keep developing my own skills in data science and programming. My goal is to eventually create tools or platforms that help students learn computational thinking through visuals, games, or interactive data projects. I want coding to feel less like memorizing commands and more like exploring and creating.\u003c/p\u003e\u003cp\u003eI am especially interested in how data can be used in education. If students can explore real world datasets or see patterns through simple visualizations, it makes learning feel more meaningful. I hope to combine data science with education to build resources that help students understand technology while also encouraging curiosity and creativity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, the idea behind my passion project is simple. I want kids to feel empowered when they encounter coding for the first time. If I can help even a few students realize that they can build things with technology, then I know the work is worth it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}":{"__typename":"School","uuid":"7f9a6683-e17a-47fa-9e6d-534e82c727e1","name":"Brooklyn Technical High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11217"},"Education:{\"uuid\":\"680f053d-e801-4872-8929-f4f27621ae07\"}":{"__typename":"Education","uuid":"680f053d-e801-4872-8929-f4f27621ae07","school":{"__ref":"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"5dba424d-1424-4e5f-80e2-c62a10f17130\"}":{"__typename":"Education","uuid":"5dba424d-1424-4e5f-80e2-c62a10f17130","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Information Science, Systems, and Technology","degree":null},"MentorPublicProfile:{\"uuid\":\"28b5074d-8baf-474f-974f-248cc889bcb9\"}":{"__typename":"MentorPublicProfile","uuid":"28b5074d-8baf-474f-974f-248cc889bcb9","displayName":"Samira M.","slug":"samira-maria","biography":"\u003cp\u003eHi, I’m Samira! Here's a bit about me :)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the things I’m most proud of is founding CodeWorks, a coding initiative where I teach students how to program in a fun and approachable way. I started CodeWorks because I wanted younger students to see coding not as something intimidating, but as something creative and exciting. Through CodeWorks, I design lessons that mix programming with art, storytelling, and hands on activities. I have also partnered with one of the largest afterschool programs in New York City to introduce elementary school students in underserved communities to coding early. Watching students go from thinking coding is impossible to building their first project is one of the most rewarding parts of my work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy interest in technology also led me to research through the ARISE program at NYU Tandon School of Engineering. During this program, I spent over 200 hours exploring building inspection data and learning how data analysis can help improve building safety. My research focused on how automation and data tools could support safer building façade inspections. I was fascinated by how large datasets can reveal patterns that help engineers and cities make smarter decisions about infrastructure and safety.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond research and teaching, I love creating projects that combine technology with creativity. One of my favorite projects was an interactive sustainability game I built using Python’s Turtle library. The game teaches younger students about environmental responsibility through an arcade style experience where players make choices that impact the environment. Projects like this allow me to combine coding, storytelling, and education in ways that make learning memorable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also spend time mentoring and supporting my community. I volunteered with a South Asian women’s organization where I helped immigrants practice conversational English and prepare for the citizenship test. Seeing people gain confidence as they learn new skills reminds me why education and mentorship matter so much.\u003c/p\u003e\u003cp\u003eWhen I’m not coding or teaching, I enjoy journaling, watercolor painting, crocheting, and exploring creative hobbies. I believe creativity plays a big role in problem solving, and some of my favorite ideas come from combining artistic thinking with technology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is to create a supportive and encouraging environment where students feel comfortable asking questions, exploring new ideas, and building projects they are proud of. Whether a student wants to start coding, build a passion project, or explore technology in a creative way, I love helping them take that first step and turn their ideas into something real.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"SpUX00NZeb8axsrhjHDMSxD00qE7j14LtMu4TwRk7dzf00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI recently did my first hackathon, and it ended up being one of the coolest experiences I have had. I went in not really knowing what to expect, just excited to try something new and see what I could build in a short amount of time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver the event, my team and I took an idea and turned it into a working prototype, which was honestly a challenge. We had to think quickly, figure things out as we went, and work closely together the whole time. There were a lot of late nights debugging and making last minute changes, but it all paid off when we made it to the final demo round.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat part felt really rewarding, but what I am most proud of is how much I grew during the process. I got more comfortable explaining ideas, working under pressure, and just trusting my problem solving skills. I also realized how much I enjoy fast paced, data driven work where you are constantly building and improving something.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"349913e3-9561-4522-9e0d-6336131b2db2\"}"},{"__ref":"Favorites:{\"uuid\":\"b81473d9-ba6f-4fad-a2fa-40f9172b4f44\"}"},{"__ref":"Favorites:{\"uuid\":\"1f404b20-7648-459c-8ffb-063535595b97\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"7013217d-d3d3-40b4-a3e4-32c04fba727a\"}"},{"__ref":"CausesSupported:{\"uuid\":\"7f73327d-059a-4c78-8486-bfbf73073bac\"}"}],"major":"Information Science, Systems, and Technology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fb4d1c4a-31a7-4549-ab9c-f2a618ff03e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"3362cf36-bb25-4faa-9fbd-9e764f87d01b\"}"},{"__ref":"DeepDives:{\"uuid\":\"a835154f-3ebd-4806-95d8-de65e8b613c4\"}"},{"__ref":"DeepDives:{\"uuid\":\"d75a674b-1d00-4f0d-af91-d2fa36919326\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/76efa537-1ed8-4910-82f5-606426e8922c/-/preview/-/format/jpg/","https://ucarecdn.com/8cdd53b1-7a14-4cfc-a5da-9371e0c6480a/-/preview/-/format/jpg/","https://ucarecdn.com/6ab49606-c56c-4f1f-b723-9f03f9a63391/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"680f053d-e801-4872-8929-f4f27621ae07\"}"},{"__ref":"Education:{\"uuid\":\"5dba424d-1424-4e5f-80e2-c62a10f17130\"}"}],"hiredAt":"2026-03-12T01:49:54.753Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Physics","Writing","Spanish","Executive Function","College Essay Writing","Computer Science","Reading","Academic Coaching","Economics","K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Business / Entrepreneurship","Coding / Programming","Sports Analytics","Web Design","Robotics / Electronics / CAD","Machin
