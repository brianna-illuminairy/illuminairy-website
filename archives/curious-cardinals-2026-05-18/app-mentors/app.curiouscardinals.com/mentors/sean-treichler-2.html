xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"971f5788-52b3-47ea-bd3f-a2e59e9ab043\"}":{"__typename":"Favorites","uuid":"971f5788-52b3-47ea-bd3f-a2e59e9ab043","photoUrl":"https://ucarecdn.com/b3fa3ff4-89e7-4b7f-863d-0cbd072f76cc/","title":"East of Eden ","type":"BOOK"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"1e8bef05-7c92-4d11-885a-113ced53f867\"}":{"__typename":"DeepDives","uuid":"1e8bef05-7c92-4d11-885a-113ced53f867","content":"\u003cp\u003eMy freshman year of college I was not super secure with my concentration (major but Brown wants to be fancy haha). It wasn't until an upperclassman student from the Biochem Department Undergraduate Group told me that I should pull the trigger and commit to the Biochemistry degree, which was way more rigorous than other fields I was considering. His encouragement was so validating, especially since he was my teaching assistant in organic chemistry. He saw me struggle through different problems, and in the end we would always debrief and fine tune my problem-solving approach. He believed in me and inspired me to push myself, and I have not regretted my decision. I hope to be that role model for younger students, students who simply need a little bit of sincere encouragement to bring them to the next level.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ffee8fb9-2452-4fba-a7c2-25acb26ddfe7\"}":{"__typename":"DeepDives","uuid":"ffee8fb9-2452-4fba-a7c2-25acb26ddfe7","content":"\u003cp\u003eI love to walk. As simple as it sounds, it is genuinely one of the most mentally stimulating things we can do, especially if you are engaged in conversation with someone. When I'm home I walk my dog and take him to the beach, and when I'm at school I routinely walk this gorgeous street called Blackstone Boulevard. I am also biased because my grandmother wrote her dissertation on the therapeutic benefits of walking. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a0ae9b4d-7d5b-4d4b-9870-538209802a9a\"}":{"__typename":"DeepDives","uuid":"a0ae9b4d-7d5b-4d4b-9870-538209802a9a","content":"\u003cp\u003eI would tell myself to speak up more. I was too insecure at times, especially in large group settings, to bring attention to myself. Being in college has taught me how important it is to self-advocate. No one else is going to come and represent you and your needs. If you really need something, whether it be a revised explanation from your professor or an assignment extension, make sure you make your voice heard! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"fd3d27a6-52d9-4c84-b19d-abf6122747d9\"}":{"__typename":"DeepDives","uuid":"fd3d27a6-52d9-4c84-b19d-abf6122747d9","content":"\u003cp\u003eI am proud of myself for being an effective ambulance attendant. This was one of my first experiences where pure book knowledge was not rewarded. What was rewarded was confidence and competence. I learned how to assert myself in the emergency room, advocating for my patient and addressing their needs. I gained lots of flexibility when it came to navigating challenging situations, such as unruly psychiatric and physically combative patients. Traveling between hospitals, behavioral health centers, private residences, and skilled nursing facilities made me appreciate my own health and privileges. A healthy person has many wishes. A sick person has one. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"b811478d-7e4e-4529-93f1-6d60d23cfef8\"}":{"__typename":"School","uuid":"b811478d-7e4e-4529-93f1-6d60d23cfef8","name":"Dana Hills High School","city":"Dana Point","type":"HIGH","state":"California","country":"United States","zip":"92629"},"Education:{\"uuid\":\"0110aaa2-0e10-45d1-9a51-1d456b1489db\"}":{"__typename":"Education","uuid":"0110aaa2-0e10-45d1-9a51-1d456b1489db","school":{"__ref":"School:{\"uuid\":\"b811478d-7e4e-4529-93f1-6d60d23cfef8\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"38692eed-d362-4a75-9dd1-067fd5e44475\"}":{"__typename":"Education","uuid":"38692eed-d362-4a75-9dd1-067fd5e44475","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biochemistry and Molecular Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"5943ed05-23ca-4ab2-9a64-8634f20b82b3\"}":{"__typename":"MentorPublicProfile","uuid":"5943ed05-23ca-4ab2-9a64-8634f20b82b3","displayName":"Sean T.","slug":"sean-treichler-2","biography":"\u003cp\u003eHello! My name is Sean and I am a senior at Brown on the pre-med track. I work in a lab that studies aging at the molecular level, and I'm currently involved in a project focused on the sup-1 protein in C. elegans. Outside of the lab, I spend lots of time leading Brown's Biochemistry Department Undergraduate Group, which is the main source of mentorship for undergraduates considering concentrating in biochemistry. One of the most hands-on classes I've taken at Brown is Ultrastructure/Bioimaging, where I learned how to use different types of microscopes and process collected images. In one of my profile pictures you can see an image of plasma salt structures from my own blood!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI care a lot about public health and general well-being, given my experience as an interfacility EMT and community health clinic volunteer. I aspire to be an effective emergency room physician that prioritizes culturally competent care. My mother is Colombian and therefore I grew up with some Spanish, but I really improved my speaking skills this summer in Madrid with a program through UPenn. \u003c/p\u003e\u003cp\u003eI'd love to support students that have an interest in health, at the sociological, psychological, and biological level. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLastly, one of my strengths is standardized test-taking strategy. I scored 91% percentile on the MCAT and I believe that what I learned along the way can support students in any class that involves test-taking. There's so much more I'd love to share about myself, but that will have to wait for our first meeting. Can't wait to meet you! \u003c/p\u003e","teachingVideoPlaybackId":"PMvKR72ttQFOMLSzLKS2100Of01yPPYRBRgDC01mQMpFYQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"971f5788-52b3-47ea-bd3f-a2e59e9ab043\"}"}],"causesSupported":[],"major":"Biochemistry and Molecular Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1e8bef05-7c92-4d11-885a-113ced53f867\"}"},{"__ref":"DeepDives:{\"uuid\":\"ffee8fb9-2452-4fba-a7c2-25acb26ddfe7\"}"},{"__ref":"DeepDives:{\"uuid\":\"a0ae9b4d-7d5b-4d4b-9870-538209802a9a\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd3d27a6-52d9-4c84-b19d-abf6122747d9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ddf684ac-0c2d-4859-9f84-895b12ca5aec/-/preview/-/format/jpg/","https://ucarecdn.com/fff6d46b-8d8f-4dff-a9d4-342880a70b8d/-/preview/-/format/jpg/","https://ucarecdn.com/1a1eb320-c023-4d0a-b50c-47f74ddc8203/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0110aaa2-0e10-45d1-9a51-1d456b1489db\"}"},{"__ref":"Education:{\"uuid\":\"38692eed-d362-4a75-9dd1-067fd5e44475\"}"}],"hiredAt":"2024-11-05T15:39:51.599Z","topics":["Chemistry","Biology","6-8 Grade Science","Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Physics","STEM Project","Medicine / Health"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sean-treichler-2\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5943ed05-23ca-4ab2-9a64-8634f20b82b3\"}"}}},"_sentryTraceData":"9916b285865e4f4a9426fb814c9dfb64-b553673f64f12dd9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9916b285865e4f4a9426fb814c9dfb64,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sean-treichler-2"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterIn
