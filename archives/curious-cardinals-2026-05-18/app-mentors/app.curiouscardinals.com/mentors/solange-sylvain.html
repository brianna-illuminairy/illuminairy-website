js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2113c549-9be0-4e8d-95c4-37fedbfe7708\"}":{"__typename":"DeepDives","uuid":"2113c549-9be0-4e8d-95c4-37fedbfe7708","content":"\u003cp\u003eI would tell my past self to challenge myself a little more. In middle school, and definitely in the beginning of high school, I shied away from really pushing myself to be in difficult classes or do projects outside of the classroom that interested me. I think a big reason for that was just a general fear of failure. It's only now, in college, that I'm really understanding that they key to growing as a person and as a learner is by constantly urging myself to exit my comfort zone and do things even if they make me severely uncomfortable. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"01d1ab8b-4764-42a2-9fbd-6d72ebe8a708\"}":{"__typename":"DeepDives","uuid":"01d1ab8b-4764-42a2-9fbd-6d72ebe8a708","content":"\u003cp\u003eThrough a lot of my life both within and out of school spaces, I've looked for role models and people who I aspire to resemble. That's not to say that I didn't have a vision for a specific and personal adult version of myself, but rather that I was (and still am) looking for people who represented values and actions that I could be proud of embodying. I could only hope that as a mentor, I could be that person for younger people. Mentorship matters to me because I want to provide the same motivation for younger students that I was and still am provided. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"1cce17b6-a240-4137-a9fa-52960c6bf740\"}":{"__typename":"DeepDives","uuid":"1cce17b6-a240-4137-a9fa-52960c6bf740","content":"\u003cp\u003eFirst, I spent a lot of time playing soccer. Even though my current college choice was not oriented around my love soccer, I am endlessly grateful for the weeks and even months spent playing in camps and programs. I also spent about 3 summers working for a retail store where I was tasked with doing inventory, working at a cash register, and dealing with some really painfully uncooperative customers. The summer before my junior year (my covid summer), I did an online class at Columbia called Political and Economic Ideologies of the Modern World. Even though it was unpleasant to take online after an already painful Spring of online school, it helped me better understand subjects and ideas that interest me. That same summer, I worked with my High School's administration to try and make the school a more racially equitable place. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ec83dc54-de1f-4471-9101-00dc4b5990c5\"}":{"__typename":"DeepDives","uuid":"ec83dc54-de1f-4471-9101-00dc4b5990c5","content":"\u003cp\u003eI love going for walks! Whether a walk is just 10 minutes or an hour, I love having the chance to debrief a long week with a friend or listen to some music. It's been a great destresser during the chaos of college. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"67913605-30e4-4cdc-8fa2-5c03b9984c64\"}":{"__typename":"Education","uuid":"67913605-30e4-4cdc-8fa2-5c03b9984c64","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Symbolic Systems","degree":"Bachelor of Arts"},"School:{\"uuid\":\"3a879362-b982-469b-8e2e-85d84fd12ac3\"}":{"__typename":"School","uuid":"3a879362-b982-469b-8e2e-85d84fd12ac3","name":"Dalton School","city":"New York","type":"HIGH","state":"NY","country":"United States","zip":"10128"},"Education:{\"uuid\":\"3b2e094e-fca3-4b81-902f-b006e68915a1\"}":{"__typename":"Education","uuid":"3b2e094e-fca3-4b81-902f-b006e68915a1","school":{"__ref":"School:{\"uuid\":\"3a879362-b982-469b-8e2e-85d84fd12ac3\"}"},"startYear":"2009","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"33271256-904f-4219-b12d-722bbb5429df\"}":{"__typename":"MentorPublicProfile","uuid":"33271256-904f-4219-b12d-722bbb5429df","displayName":"Solange S.","slug":"solange-sylvain","biography":"\u003cp\u003eHi! I’m Solange, a rising sophomore at Stanford University. I grew up in New York City and I attended Dalton, a private school in Manhattan, for 13 years. At Stanford, I’m currently on the club soccer team, working as a tour guide, and doing some linguistics research in the fall. I’m still figuring out my major, but am leaning towards an interdisciplinary major called Symbolic Systems that merges Computer Science, Math, Linguistics, Philosophy, Psychology, and some Social Systems courses. I'm really excited about this major because it allows me to strengthen my mathematical, linguistics, and social science interests, while also enabling me to have a strong foundation in courses like Computer Science, which I feel is definitely an important skill to have.\u003c/p\u003e\u003cp\u003eOutside of my academic interests, some of my favorite things to do for fun are go for a run on a hiking trail called “The Dish,” or read on the several lawns on my campus. My identity stems from all my micro-communities, which include the club soccer team that I was a part of for almost 10 years, to my various extracurriculars within my school, to my neighborhood, Harlem, which is predominantly inhabited by people from across the African diaspora — I’m second generation Haitian and Sierra Leonean. In my senior year of high school, I was captain of my school’s soccer and track teams while also competing in club soccer outside of school. My other focuses were classical piano and working for my school's administration, where I focused on admissions and anti-racist systemic changes. I also worked closely with a young 8th grader whom I’d been tutoring for the past 4 years at a public school a few blocks from my house. Throughout my whole life I’ve had the chance to exist in a way that all my little identities, whether that be athlete or musician or student, can flourish. I’m excited to aid my mentees in expressing the various layers of their identities during our sessions together because of how grateful I feel to have been able to do that myself. In college, I’ve discovered a serious interest in storytelling. All my life, I have been sharing stories through my musical expression, like a story told in a piano piece by Chopin, however, more recently I’ve started taking photos of people around me, and specifically within Harlem. Through this, I’ve been able to speak with so many people across my five block radius that I wouldn’t have otherwise met. My love of stories and the power of stories to connect people are exactly why mentorship is so important to me. When I first started working with the eighth grade student years ago, he was incredibly shy and hesitant to really interact with me. However, once I started asking him questions about his interests, or what made him laugh, or even what he disliked most about school, he started warming up. Of course, this is a bare minimum interaction. However, I got the sense that few teachers or academic mentors of his had really taken the time to get to know him as an individual. From the years of working together, even during Covid, we created a relationship where he would excitedly inquire into my life, and I would inquire into his. As a mentor, and academic advisor, my hope is that my mentee feels prioritized and heard throughout our time together. As someone who has had an academic mentor myself, I believe that the best relationships are founded on a deliberate effort to build a partnership of camaraderie and trust. With my mentee, I hope to teach analytical writing and math as those are things I definitely struggled with as a younger student but feel passionate about now. As a college student, I have more to learn than ever, and in my mentees, I look forward to instilling a love of learning and confidence in their ability to grow.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2113c549-9be0-4e8d-95c4-37fedbfe7708\"}"},{"__ref":"DeepDives:{\"uuid\":\"01d1ab8b-4764-42a2-9fbd-6d72ebe8a708\"}"},{"__ref":"DeepDives:{\"uuid\":\"1cce17b6-a240-4137-a9fa-52960c6bf740\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec83dc54-de1f-4471-9101-00dc4b5990c5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c64d52e9-6ac7-4fca-80b4-639527e08c40/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"67913605-30e4-4cdc-8fa2-5c03b9984c64\"}"},{"__ref":"Education:{\"uuid\":\"3b2e094e-fca3-4b81-902f-b006e68915a1\"}"}],"hiredAt":"2022-12-08T20:53:27.000Z","topics":["Writing","Pre-Algebra","Music","History","Precalculus / Trigonometry","Algebra II","History Project","Geometry","Algebra I"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"solange-sylvain\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"33271256-904f-4219-b12d-722bbb5429df\"}"}}},"_sentryTraceData":"8d4df6ad71fe41e89d14bf2feeeaccbf-824701e91a73afd1-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8d4df6ad71fe41e89d14bf2feeeaccbf,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"solange-sylvain"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
