:"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7fde3991-ab79-454f-92a9-a65cc0024e9e\"}":{"__typename":"DeepDives","uuid":"7fde3991-ab79-454f-92a9-a65cc0024e9e","content":"\u003cp\u003eFreelance tutoring, Fishing guide, and lifeguarding\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"52a1649a-7ff9-4e2c-83bf-2a69aff37c67\"}":{"__typename":"School","uuid":"52a1649a-7ff9-4e2c-83bf-2a69aff37c67","name":"Harrison High School","city":"Harrison","type":"HIGH","state":"New York","country":"United States","zip":"10528"},"Education:{\"uuid\":\"d89a75c4-06a9-47de-9e85-670ccd06f333\"}":{"__typename":"Education","uuid":"d89a75c4-06a9-47de-9e85-670ccd06f333","school":{"__ref":"School:{\"uuid\":\"52a1649a-7ff9-4e2c-83bf-2a69aff37c67\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"22f6d7c6-4657-4fdf-b734-1e141a3dff47\"}":{"__typename":"Education","uuid":"22f6d7c6-4657-4fdf-b734-1e141a3dff47","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"B.S. in Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"c408e6e6-2092-4dc2-9e09-ad8bb1d18f06\"}":{"__typename":"MentorPublicProfile","uuid":"c408e6e6-2092-4dc2-9e09-ad8bb1d18f06","displayName":"Alec U.","slug":"alec-udell","biography":"\u003cp\u003eHi! I’m Alec, a Duke University student majoring in computer science and minoring in environmental science. I’m from Harrison, NY, and growing up, I was always interested in nature and became an avid fisherman. This led to my dad and me waking up at 3 AM every weekend to drive to Long Island just to catch fish.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up, I was always a curious student who was very eager to learn. I began tutoring in 6th grade as part of a school club and eventually graduated to running my own freelance tutoring business in high school, in addition to being Director of the Peer Tutoring Club. I have extensive tutoring experience in Mathematics (Algebra and AP Calculus), History (AP World), and English/Writing, and I have tutored kids from 7 to 16 years old.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was fascinated with sustainability and started a research project where I evaluated the biodegradability of biodegradable plastics in water through IR spectroscopy analysis. As a result, I have also tutored students and guided them in pursuing their own research interests. I have experience tutoring kids with ADHD and Dyslexia and I have spent a substantial amount of time helping students with their college applications and essays.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUpon getting into Duke, I began to explore my interests in mathematics, climate technology, and sustainability by joining the Energy Club and Duke Impact Investing Group, where I have worked with different energy and tech startups doing market research or exploratory data analysis. This is where I learned the importance of finance in driving innovation, so I began to learn more about the space. I joined Alpha Kappa Psi business fraternity and became head of operations at GoBringIt, Duke’s food delivery service and largest student-run business on campus. This led me to pursue my future position as a 2027 investment banking summer analyst at Bank of America, and through my experiences, I have learned to tutor students in business and finance topics as well.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOverall, I’d say my tutoring style is very hands-on; I love building materials for students and customized lesson plans tailored to their learning. Seeing something click in a mentee’s eyes has always been something that gives me joy. Some fun facts about me are that I am a drummer, club Spikeball champion, and chef. My favorite artist is The Beatles, and my favorite movie is Forest Gump. I look forward to the opportunity of meeting and tutoring you!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"kVFNdGYqvFffc9utoijcfpagDdDzPvO9vkUfqOpR00cY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"B.S. in Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bf2038d0-2230-4327-8389-d003a2c48a43\"}"},{"__ref":"DeepDives:{\"uuid\":\"9123549c-903c-4008-ab36-85871564f140\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2346007-77bd-4317-a102-a6911478802a\"}"},{"__ref":"DeepDives:{\"uuid\":\"7fde3991-ab79-454f-92a9-a65cc0024e9e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bd7437f2-e6ec-4191-b433-da19de3d3d51/-/preview/-/format/jpg/","https://ucarecdn.com/696f519f-cd70-4ab7-9c3a-0d21363883de/-/preview/-/format/jpg/","https://ucarecdn.com/40c403b1-09e3-4b49-a56f-640c46a9f74c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d89a75c4-06a9-47de-9e85-670ccd06f333\"}"},{"__ref":"Education:{\"uuid\":\"22f6d7c6-4657-4fdf-b734-1e141a3dff47\"}"}],"hiredAt":"2026-02-15T17:15:06.020Z","topics":["Algebra I","Algebra II","Geometry","Calculus","Statistics","Physics","Writing","Spanish","College Essay Writing","Reading","History","Economics","Academic Coaching","Music","Creative Writing","Finance / Investing","Coding / Programming","Machine Learning / AI","Sustainability","Public Speaking","Debate"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]}
