xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"864b6f74-d145-44da-9493-bedc6c2196e7\"}":{"__typename":"DeepDives","uuid":"864b6f74-d145-44da-9493-bedc6c2196e7","content":"\u003cp\u003eMentorship matters to me because nothing in life is done alone. I continue to seek advice from mentors to this day and believe that paying that forward is an obligation. It is a great way to connect with people who share the same values or interests and amazing things often times are born from great mentor-mentee relationships.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"e554c46e-c904-47f6-a2a3-f4ef22bf986c\"}":{"__typename":"DeepDives","uuid":"e554c46e-c904-47f6-a2a3-f4ef22bf986c","content":"\u003cp\u003eMy identity impacts my teaching style because I know what it can feel like to be the only one who looks like you in a classroom or school setting. What often times can come with that is stress and self-doubt that doesn't serve us. I strive to help my mentees build awareness around these feelings and through our time together, build confidence in themselves. Having mentors to talk about these feelings and letting them pass before diving into the task at hand has helped me at many points along my academic and career journey, and I would strive to do the same for my mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"15705be8-d73d-4399-a86b-35941b99597d\"}":{"__typename":"DeepDives","uuid":"15705be8-d73d-4399-a86b-35941b99597d","content":"\u003cp\u003eI'm a huge Spiderman and MCU fan. I've seen all of the movies multiple times and even had a Spiderman collectors item anthology book as a kid that detailed the character's evolution, the different villains he's faced, and more background into how the character was developed. I'm a huge Game of Thrones, Lord of the Rings, and Harry Potter fan too! I'm slowly making my way through the Game of Thrones books and have read the first two of the series. Any and all things nerdy are right up my alley!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"11b82332-51f3-435f-a741-1f84b5a95475\"}":{"__typename":"DeepDives","uuid":"11b82332-51f3-435f-a741-1f84b5a95475","content":"\u003cp\u003eI was fairly busy during the summers in high school! I played basketball all throughout high school and had summer practices and tournaments each summer. I was in Boy Scouts and also spent time on camping trips and activities a few times during the summer. After my junior year, I was selected by my high school to spend a week doing Alabama Boys State with students from across the state to develop leadership skills. I also spent a week at West Point Military Academy as a part of the Summer Leadership Experience. Needless to say, a lot of my time was spent playing sports or participating in leadership enrichment activities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"12ad8f29-95f1-45cf-9cce-0c97786ba9dc\"}":{"__typename":"School","uuid":"12ad8f29-95f1-45cf-9cce-0c97786ba9dc","name":"Spain Park High School","city":"Birmingham","type":"HIGH","state":"Alabama","country":"United States","zip":"35242"},"Education:{\"uuid\":\"d926cb5b-9fee-4c7a-9feb-be7b59203db3\"}":{"__typename":"Education","uuid":"d926cb5b-9fee-4c7a-9feb-be7b59203db3","school":{"__ref":"School:{\"uuid\":\"12ad8f29-95f1-45cf-9cce-0c97786ba9dc\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"52427180-25a8-4451-8161-4f0f529e7b7a\"}":{"__typename":"School","uuid":"52427180-25a8-4451-8161-4f0f529e7b7a","name":"Morehouse College","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30314"},"Education:{\"uuid\":\"8a561bce-966f-496a-9b52-4c9771af182c\"}":{"__typename":"Education","uuid":"8a561bce-966f-496a-9b52-4c9771af182c","school":{"__ref":"School:{\"uuid\":\"52427180-25a8-4451-8161-4f0f529e7b7a\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"d49c29f5-7f78-4598-8ddf-bd2750a452d1\"}":{"__typename":"MentorPublicProfile","uuid":"d49c29f5-7f78-4598-8ddf-bd2750a452d1","displayName":"Jameson F.","slug":"jameson-floyd","biography":"\u003cp\u003eI’m a medical student at University of California, San Francisco and am excited to be a mentor with Curious Cardinals! I’m originally from Birmingham, Alabama, and have lived in Atlanta, Georgia, and Washington, D.C. before moving to San Francisco, where I’m currently based. I’m pursuing a career in emergency medicine and naturally gravitate toward being a “jack of all trades”—someone who’s curious, adaptable, and eager to learn across disciplines.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI earned my undergraduate degree in physics, which gave me a strong analytical foundation and a deep appreciation for problem-solving. After graduating, I spent three years conducting research at the National Institutes of Health, where I developed skills in critical thinking, collaboration, and scientific communication. While my background is STEM-heavy, I’ve always believed that the most meaningful growth happens at the intersection of different interests. That mindset has led me to explore creative outlets like music and writing—I’ve taught myself to play both piano and guitar, and I maintain a personal blog where I reflect on my journey through medicine, personal growth, and life more broadly.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I bring both structure and flexibility. I understand what it takes to pursue ambitious academic goals, but I also know that every student is different. My goal is to meet students where they are—whether that means building confidence in math and science, developing effective study habits, exploring creative interests, or simply having a supportive space to think through challenges. I especially enjoy helping students connect what they’re learning in school to the real world, making subjects feel more engaging and relevant.\u003c/p\u003e\u003cp\u003eOutside of academics, I value balance and consistency. I enjoy running, strength training, cooking, reading both fiction and nonfiction, playing guitar, and spending quality time with friends and family. These habits help me stay grounded and energized, and I often encourage students to build routines that support both their goals and their well-being.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the core of my approach is a simple belief: confidence is built through consistent effort. By showing up each day and focusing on progress—not perfection—we create momentum that leads to meaningful growth. I aim to help students develop not just knowledge, but resilience, curiosity, and a genuine sense of ownership over their learning.\u003c/p\u003e","teachingVideoPlaybackId":"rIs9v8qiJJjbj4ui00srDrKh9ZO00OTFNGUmn1IKe00BSA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"864b6f74-d145-44da-9493-bedc6c2196e7\"}"},{"__ref":"DeepDives:{\"uuid\":\"e554c46e-c904-47f6-a2a3-f4ef22bf986c\"}"},{"__ref":"DeepDives:{\"uuid\":\"15705be8-d73d-4399-a86b-35941b99597d\"}"},{"__ref":"DeepDives:{\"uuid\":\"11b82332-51f3-435f-a741-1f84b5a95475\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4da1474c-7ab0-4fda-987d-9547ef9d0911/-/preview/-/format/jpg/","https://ucarecdn.com/fc5fbe97-79f1-4831-ba7c-8d29e4e96431/-/preview/-/format/jpg/","https://ucarecdn.com/8291efc6-bb95-4315-b4b9-da8c04a94a66/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d926cb5b-9fee-4c7a-9feb-be7b59203db3\"}"},{"__ref":"Education:{\"uuid\":\"8a561bce-966f-496a-9b52-4c9771af182c\"}"}],"hiredAt":"2026-04-21T21:04:15.951Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jameson-floyd\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d49c29f5-7f78-4598-8ddf-bd2750a452d1\"}"}}},"_sentryTraceData":"d9eaa13dd7dd43b1af998f1707fd605a-bcb94a7cbba62805-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d9eaa13dd7dd43b1af998f1707fd605a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jameson-floyd"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id"
