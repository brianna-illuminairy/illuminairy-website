js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d30455e1-6e85-4d0e-b757-8d68b6d99cef\"}":{"__typename":"DeepDives","uuid":"d30455e1-6e85-4d0e-b757-8d68b6d99cef","content":"\u003cp\u003eI chose Neuroscience because I have always been fascinated by how the brain shapes the way we think, feel, move, learn, and interact with the world around us. During one high school summer, I had the opportunity to shadow neurosurgeons during both brain tumor resections and movement disorder procedures. I remember being struck by two very different sides of the field: the emotional weight of seeing patients and families face brain tumor diagnoses, and the hope of watching a brain-based procedure restore function for someone whose hands had been limited by Parkinson's or Essential tremor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat experience made the brain feel both scientifically fascinating and deeply human. Neuroscience and the opportunities associated with the degree gave me a way to tangibly explore questions about biology, behavior, disease, perception, and identity while keeping sight of the people behind those questions. I chose the major because it sits at the intersection of complexity and human impact, which is exactly the kind of space I find most meaningful. Certainly an incredibly interesting and ever-changing field.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fb038b80-136a-485f-aa20-85f2d1ed5bc8\"}":{"__typename":"DeepDives","uuid":"fb038b80-136a-485f-aa20-85f2d1ed5bc8","content":"\u003cp\u003eMentorship matters to me because the right guidance can make a student feel like a path that once seemed intimidating is actually possible. Some of the most meaningful moments in my own academic journey came from people who took the time to explain things clearly, answer my questions without judgment, and help me see the bigger picture when I felt unsure.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think mentorship is especially powerful because it goes beyond simply teaching content. A good mentor helps a student build confidence, curiosity, and a sense of direction. Whether a student is exploring medicine, neuroscience, research, or just trying to figure out what they enjoy, I hope to create a space where they feel comfortable asking questions, making mistakes, and taking ownership of their learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"123df39d-3e56-42d4-b36f-f80eb42c5d91\"}":{"__typename":"DeepDives","uuid":"123df39d-3e56-42d4-b36f-f80eb42c5d91","content":"\u003cp\u003eMy greatest role model is my grandfather. I have always been inspired by the story of how he immigrated to the United States, built a life and career through an incredible amount of hard work, and found the confidence to practice patient care in a place where he often stood out. What motivates me most is not only what he accomplished, but the way he did it: by earning the trust of his patients, demonstrating grit, being incredibly resilient in the face of hardship, building genuine relationships, and supporting the family around him with quiet consistency.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I have gotten older, I have come to appreciate how much each generation faces its own version of uncertainty, sacrifice, and change. My grandfather’s story reminds me that confidence is often built through persistence, that belonging can be created through service, and that meaningful work is not just about personal achievement, but also about the people you help along the way. Those are lessons I hope to carry into my own path in medicine, mentorship, and life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"51c287fe-da4b-464e-98c4-3bf7fe15fb58\"}":{"__typename":"DeepDives","uuid":"51c287fe-da4b-464e-98c4-3bf7fe15fb58","content":"\u003cp\u003eI would tell my younger self not to feel pressured to have everything figured out so early. In middle and high school, it can feel like everyone else has a clear plan, but a lot of growth comes from exploring, trying new things, and being willing to change direction as you learn more about yourself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would also remind myself that being curious is more important than being perfect. Some of the best opportunities I have had came from asking questions, reaching out to people, pushing back when people tell you one thing or the other, and trying things that initially felt unfamiliar. I would encourage my younger self to focus less on comparing timelines and more on building habits, relationships, and exploring interests that feel meaningful. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"f6d817a3-8035-45eb-9184-6a6355fc41b7\"}":{"__typename":"School","uuid":"f6d817a3-8035-45eb-9184-6a6355fc41b7","name":"Hinsdale Central High School","city":"Hinsdale","type":"HIGH","state":"Illinois","country":"United States","zip":"60521"},"Education:{\"uuid\":\"8d85fb5b-47d8-4cf6-aabe-823acf72c943\"}":{"__typename":"Education","uuid":"8d85fb5b-47d8-4cf6-aabe-823acf72c943","school":{"__ref":"School:{\"uuid\":\"f6d817a3-8035-45eb-9184-6a6355fc41b7\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"f3830e96-dae1-4b7c-aaa7-7e4adf4918e0\"}":{"__typename":"Education","uuid":"f3830e96-dae1-4b7c-aaa7-7e4adf4918e0","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"a1170a1a-5176-47db-b0a7-a5453336bea0\"}":{"__typename":"MentorPublicProfile","uuid":"a1170a1a-5176-47db-b0a7-a5453336bea0","displayName":"Amaan M.","slug":"amaan-musabji","biography":"\u003cblockquote\u003e\u003cp\u003eMy name is Amaan Musabji, and I studied Neuroscience and Global Health at Northwestern University. I am currently on the pre-med track, with broad interests in medicine, research, education, and the role mentorship can play in shaping a student’s academic confidence and curiosity.\u003c/p\u003e\u003c/blockquote\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern, I spent my time across a mix of academic, research, and student leadership spaces. On campus, I was involved in student cultural organizations, active in pre-medical student organizations, and served on the executive board of a 501(c)(3) nonprofit dedicated to creating educational and career-exploration opportunities for high school students interested in healthcare and STEM. Through that work, I helped develop programming meant to make fields like medicine, science, and research feel more accessible to high school aged students who were still figuring out what they were curious about or wanted to pursue. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I have always been drawn to questions about the brain, the body, and how scientific discoveries translate into real-world care. I have been fortunate to explore those interests through several types of research. I have worked alongside PhD candidates and postdoctoral researchers in wet-lab brain cancer research, collaborated with physicians and residents on presented/peer reviewed clinical case reports, and contributed to published clinical research projects. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I enjoy helping students build confidence in subjects that may initially feel intimidating, whether that means breaking down biology concepts, discussing what the pre-med path looks like, brainstorming research ideas, or helping students think through their academic and extracurricular goals. I especially enjoy working with students who are curious about science coursework, medicine, neuroscience, research, or STEM more broadly but may not yet know exactly where to begin.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy goal as a mentor is to create a supportive, low-pressure environment where students feel comfortable asking questions, exploring their interests, and developing skills that will help them beyond a single class or project. I believe the best mentorship comes from meeting students where they are, helping them recognize what excites them, and giving them the tools to take the next step with confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy nature photography, playing tennis, spending time outdoors, hanging out with my family, and cooking!\u003c/p\u003e","teachingVideoPlaybackId":"chrjRFZ7IdEONIKLabRIdMTuZr3n02jEY7L9Cs97aCts","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d30455e1-6e85-4d0e-b757-8d68b6d99cef\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb038b80-136a-485f-aa20-85f2d1ed5bc8\"}"},{"__ref":"DeepDives:{\"uuid\":\"123df39d-3e56-42d4-b36f-f80eb42c5d91\"}"},{"__ref":"DeepDives:{\"uuid\":\"51c287fe-da4b-464e-98c4-3bf7fe15fb58\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/aea4dbc3-45c7-4574-8a2b-25970aa5a377/-/preview/-/format/jpg/","https://ucarecdn.com/6d339b27-1528-4738-b574-f4b1fee929d4/-/preview/-/format/jpg/","https://ucarecdn.com/16310a24-49a4-4cf8-9063-81ce67b5f57e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8d85fb5b-47d8-4cf6-aabe-823acf72c943\"}"},{"__ref":"Education:{\"uuid\":\"f3830e96-dae1-4b7c-aaa7-7e4adf4918e0\"}"}],"hiredAt":"2026-04-30T06:36:59.742Z","topics":[],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"amaan-musabji\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a1170a1a-5176-47db-b0a7-a5453336bea0\"}"}}},"_sentryTraceData":"8257c7d318504e0490ba0828a6fc1888-aff05ca55a5f9865-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8257c7d318504e0490ba0828a6fc1888,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"amaan-musabji"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive",
