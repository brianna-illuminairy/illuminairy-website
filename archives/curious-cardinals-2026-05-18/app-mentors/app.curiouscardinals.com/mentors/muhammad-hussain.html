xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5c3350eb-5f7a-45a3-8a72-483814f7efc9\"}":{"__typename":"Favorites","uuid":"5c3350eb-5f7a-45a3-8a72-483814f7efc9","photoUrl":"https://ucarecdn.com/45300473-a688-49ab-a98a-b5e683f2ded2/","title":"Chicago Bears","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"db755382-22bd-4b12-8b68-7c9e4d1d6ab9\"}":{"__typename":"Favorites","uuid":"db755382-22bd-4b12-8b68-7c9e4d1d6ab9","photoUrl":"https://ucarecdn.com/95627d70-400a-4834-8820-c39363f6a316/","title":"Minecraft","type":"GAME"},"Favorites:{\"uuid\":\"d7c894ae-57f0-43a0-9df9-3f7baea3191c\"}":{"__typename":"Favorites","uuid":"d7c894ae-57f0-43a0-9df9-3f7baea3191c","photoUrl":"https://ucarecdn.com/7256ac1e-6b77-4fa9-94a3-75d1084bbbb5/","title":"The Autobiography of Malcolm X","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"00ecd6d7-5863-4f78-af46-e1dcde678f9c\"}":{"__typename":"DeepDives","uuid":"00ecd6d7-5863-4f78-af46-e1dcde678f9c","content":"\u003cp\u003eI’ve always had a passion for numbers and math, but studying pure math at a high level felt a little too abstract for me. That’s why I was drawn to Northwestern’s one of a kind Mathematical Methods in the Social Sciences (MMSS) program. MMSS dives deep into advanced math concepts but applies them to real-world socioeconomic issues, which is exactly what I was looking for. It’s the perfect mix of theory and practice, letting me sharpen my math skills while tackling real-world problems and making a meaningful impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e74451ea-d1df-4dd6-874f-b8a7890f059e\"}":{"__typename":"DeepDives","uuid":"e74451ea-d1df-4dd6-874f-b8a7890f059e","content":"\u003cp\u003eIf I could give my middle or high school self one piece of advice, it would be to not be afraid to take risks. I often wanted to play it safe, sticking to what I knew instead of exploring new opportunities. I’d remind myself that stepping outside my comfort zone can lead to unexpected growth and exciting experiences. Embracing challenges can open doors to new friendships, skills, and passions that I might never have discovered otherwise.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ce3e2b9a-35d2-437a-9543-31968d9ec5e8\"}":{"__typename":"DeepDives","uuid":"ce3e2b9a-35d2-437a-9543-31968d9ec5e8","content":"\u003cp\u003eI’m currently excited to be part of Northwestern's Sports Analytics Group, where I’m going to be writing an opinion-based sports article using quantitative data analysis to reveal information about everything from projected player performances to optimal coaching strategies. I can’t wait to dive deep into the numbers to make a compelling argument and I hope my article will spark discussion among fellow sports fans and math nerds.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b4d9dfc0-a20f-4563-af8f-5dd545ade4cd\"}":{"__typename":"DeepDives","uuid":"b4d9dfc0-a20f-4563-af8f-5dd545ade4cd","content":"\u003cp\u003eI love playing a variety of sports whenever I can whether it's pickup basketball, intramural tennis, or ultimate frisbee for Northwestern's club team. I'm also an avid baker, constantly experimenting with new recipes. Otherwise I might go for long bike rides when the weather's nice, or stay inside and play video games if it's not.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"54b9bc88-4e85-446a-bfb6-b61120b1ccf0\"}":{"__typename":"School","uuid":"54b9bc88-4e85-446a-bfb6-b61120b1ccf0","name":"Elgin High School","city":"Elgin","type":"HIGH","state":"Illinois","country":"United States","zip":"60120"},"Education:{\"uuid\":\"a008272c-ffd3-4f5d-b11d-1e19ee953c22\"}":{"__typename":"Education","uuid":"a008272c-ffd3-4f5d-b11d-1e19ee953c22","school":{"__ref":"School:{\"uuid\":\"54b9bc88-4e85-446a-bfb6-b61120b1ccf0\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"cedae50c-8367-42cf-b010-699c433952fc\"}":{"__typename":"Education","uuid":"cedae50c-8367-42cf-b010-699c433952fc","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mathematical Methods in the Social Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"fff913c3-92ac-4610-8c39-0b53c9dfbbbf\"}":{"__typename":"MentorPublicProfile","uuid":"fff913c3-92ac-4610-8c39-0b53c9dfbbbf","displayName":"Muhammad H.","slug":"muhammad-hussain","biography":"\u003cp\u003eHello everyone!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Muhammad and I’m a junior at Northwestern University studying economics and MMSS, a unique program that combines advanced mathematical concepts with their practical applications in real-world socioeconomic situations. I’ve always had a passion for working with numbers, but what excites me most is using math and data to uncover patterns and make decisions that can have a meaningful impact on people’s lives.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Northwestern, I’ve sought out experience across a wide range of fields to explore how analytical thinking shows up in different environments. Through Campus Catalyst, a student run consulting program that partners teams of undergraduates with nonprofits across Chicago, I gained early experience working with real clients and helping them think through organizational challenges. I then spent time on an independent research project where I built machine learning based trading models and studied how different algorithms can be used to predict short term price movements in financial markets. This past fall I completed an investment banking internship that gave me hands on exposure to financial modeling and the deal process from start to finish. Looking ahead, I will be working in economic consulting this coming summer, which will give me the chance to use data, statistics, and economic reasoning to help analyze real world topics ranging from market competition to complex legal disputes. Across all of these experiences, the common thread for me has been curiosity and an excitement for learning new ways to apply data, economics, and structured thinking to understand complex problems and make informed decisions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also a huge sports fan and that passion really shapes a lot of what I do outside the classroom. I’m involved with Northwestern's Sports Analytics Group (NSAG), where I get to unite my passions for math and sports by poring over stats and diving into data-driven projects. When I’m not crunching numbers, I’m out on the field playing for the Club Ultimate Frisbee team, hitting practices and tournaments with an awesome group of teammates. I also play intramural tennis for some fun competition and when I’m not playing, I’ll definitely be watching whatever football or basketball game is on.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I’d be excited to teach a variety of subjects, from economics and political theory to college applications. However, my favorite thing to teach is math at any level. For me, math isn’t just about memorizing formulas and plugging in numbers; it’s a lens through which we can analyze and optimize almost any situation. Even when I'm performing seemingly mundane tasks, like baking chocolate chip cookies or setting my fantasy football lineups, I often think about how different variables can affect the results, and what the optimal outcome would be. I hope to inspire my mentees to see the beauty and practicality in math, encouraging them to apply these concepts beyond the classroom and into the world around them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"7Qc0000PW018yPEjFj19Jihzvgcmxk003E9nGIcEKKMgHys","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5c3350eb-5f7a-45a3-8a72-483814f7efc9\"}"},{"__ref":"Favorites:{\"uuid\":\"db755382-22bd-4b12-8b68-7c9e4d1d6ab9\"}"},{"__ref":"Favorites:{\"uuid\":\"d7c894ae-57f0-43a0-9df9-3f7baea3191c\"}"}],"causesSupported":[],"major":"Mathematical Methods in the Social Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"00ecd6d7-5863-4f78-af46-e1dcde678f9c\"}"},{"__ref":"DeepDives:{\"uuid\":\"e74451ea-d1df-4dd6-874f-b8a7890f059e\"}"},{"__
