xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b7075aaa-87be-49c8-9859-98c4f988c8b5\"}":{"__typename":"DeepDives","uuid":"b7075aaa-87be-49c8-9859-98c4f988c8b5","content":"\u003cp\u003eYou'd be hard pressed to not find me outside during the summer! I really love being active and spending as much of my time as possible outdoors, whether i'm walking my Cavapoo, going for a hike in the White Mountains, or hitting the golf course. Sometimes I go on solo adventures to relax and clear my head, but its always great to group up with a bunch of friends and just have fun. Especially while working during the summers, I always look forward to the weekend and getting outdoors  de-stress, have some fun, and make some lifelong memories while were at it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"63c4b9e1-817f-4b2f-a910-8e2aa828a643\"}":{"__typename":"DeepDives","uuid":"63c4b9e1-817f-4b2f-a910-8e2aa828a643","content":"\u003cp\u003e Mentorship for me is what truly makes or breaks a students experience. On my debate team in high school, I always looked up to the upperclassmen who would take time out of their busy schedules to answer my questions or genuinely help me learn rather then brushing me off. Even better, they became my friends and I grew as a person as well as a debater. When it was my turn to be an upperclassmen, I made it my mission to be the best I could be for freshmen so that they could have the same great experience with mentorship that I had. It was so rewarding seeing them grow and learn just as I had, and every minute was worth it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"a3aaad04-27d4-4a71-be2b-7ea7239322b3\"}":{"__typename":"DeepDives","uuid":"a3aaad04-27d4-4a71-be2b-7ea7239322b3","content":"\u003cp\u003eI was shy! I really didn't like new situations that pushed me outside of my comfort zone because they were unfamiliar, and that honestly made me uncomfortable. But, while I still understand what that discomfort feels like, I've grown to further appreciate being outside of my comfort zone as an opportunity to learn.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"f3adfd3a-5e69-4a48-aaa6-1e2fe941e309\"}":{"__typename":"School","uuid":"f3adfd3a-5e69-4a48-aaa6-1e2fe941e309","name":"Newton South High School","city":"Newton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02459"},"Education:{\"uuid\":\"e68b92d6-792e-472a-8f90-7873225cf3a9\"}":{"__typename":"Education","uuid":"e68b92d6-792e-472a-8f90-7873225cf3a9","school":{"__ref":"School:{\"uuid\":\"f3adfd3a-5e69-4a48-aaa6-1e2fe941e309\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"08898619-9fa5-40a3-aecb-d3fb4b17b4ab\"}":{"__typename":"Education","uuid":"08898619-9fa5-40a3-aecb-d3fb4b17b4ab","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"015e1721-869d-46ed-a8ca-2dddeff164aa\"}":{"__typename":"MentorPublicProfile","uuid":"015e1721-869d-46ed-a8ca-2dddeff164aa","displayName":"Kassra E.","slug":"kassra-ehsan","biography":"\u003cp\u003eHey my name's Kassra and i'm an undergrad at Brown University!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA few things about me:\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm really passionate about medicine! This is a huge reason I decided on majoring in biomedical engineering, as I really wanted to combine my love for building and designing with wanting to help others. That desire has driven me to get my EMT license in RI, and I now work at a fire department just outside Providence responding to 911 calls.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm almost always listening to or trying to play music. I'm super big into the 70’s to 90’s era of rock, but also jazz in general too. Even though I played piano for a while, I just picked up learning the guitar this past semester and have been trying my hand at learning some of my favorite songs. Right now I'm working on learning some metallica and rolling stones but it's definitely hard!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHuge outdoors person almost all year round. I’m originally from the Boston area so I’ve explored a lot of the mountains in New England either on foot or on skis, but always looking to explore something new! I like to get pretty intense with both, but I'm definitely a bigger skier, and always try to push what I can do to the limits even if it means tearing my ACL. Rehab took a while but I got back on the slopes this winter.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship means a lot to me. Whether as a mentor or a mentee -\u0026nbsp; I think that it really helps shape us as students and people. In a lot of what I’ve done, EMT training, Debate in high school, learning the play the guitar, physical therapy: they all had some form of mentorship that made me much better at that thing than if I had I not had any. And from these lessons in mentorship I’ve felt inspired to pass on what I know to others!\u003c/p\u003e","teachingVideoPlaybackId":"VsWfvoTjKDOf8wVWvcq12nksXF1SRmLQG4CjAwez5T8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b7075aaa-87be-49c8-9859-98c4f988c8b5\"}"},{"__ref":"DeepDives:{\"uuid\":\"63c4b9e1-817f-4b2f-a910-8e2aa828a643\"}"},{"__ref":"DeepDives:{\"uuid\":\"a3aaad04-27d4-4a71-be2b-7ea7239322b3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1526d882-522c-45b6-a4e7-874d6e553038/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"e68b92d6-792e-472a-8f90-7873225cf3a9\"}"},{"__ref":"Education:{\"uuid\":\"08898619-9fa5-40a3-aecb-d3fb4b17b4ab\"}"}],"hiredAt":"2025-01-27T15:26:10.476Z","topics":["Calculus","Precalculus / Trigonometry","Chemistry","Biology"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kassra-ehsan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"015e1721-869d-46ed-a8ca-2dddeff164aa\"}"}}},"_sentryTraceData":"8ede58ceb9cc407899847673334b867b-806970a2a0b9cdae-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8ede58ceb9cc407899847673334
