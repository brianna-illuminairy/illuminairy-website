94d9894a-8ee5-4c83-afdb-1f1f94fc9220","content":"\u003cp\u003eHelping as many people as I can to achieve their dreams in the film biz. I want to produce lesser-known artists work and raise awareness about issues of sexism, classism, and racism.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"789d5ec6-7254-4748-b2cb-bfc6cd126833\"}":{"__typename":"DeepDives","uuid":"789d5ec6-7254-4748-b2cb-bfc6cd126833","content":"\u003cp\u003e'Keep the channel open' \u0026lt; some of the most crucial advice I ever received. It doesn't matter how 'good' your expression is, or if it 'fits the mold' — what matters is that you always keep it open. Keep trying, keep learning, keep expressing yourself and being yourself. THAT is what matters in this life, and that is what will take you far. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"fb452899-9ec3-41c9-b729-a2b5a77f718c\"}":{"__typename":"DeepDives","uuid":"fb452899-9ec3-41c9-b729-a2b5a77f718c","content":"\u003cp\u003eMy high school choir teacher, who taught me the importance of loving the work, dedication and attention to detail, and the joy of helping others succeed. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0fc56786-95e1-4ac9-9d37-ba8bd94ba009\"}":{"__typename":"DeepDives","uuid":"0fc56786-95e1-4ac9-9d37-ba8bd94ba009","content":"\u003cp\u003eWorking at the Hollywood Bowl here in Los Angeles! I got a ton of musical exposure and learned about preparedness (wearing the right shoes to work will make or break your night). \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"a4127478-b536-4a5a-8f9c-476355f5096c\"}":{"__typename":"School","uuid":"a4127478-b536-4a5a-8f9c-476355f5096c","name":"Mayfield Senior School","city":"Pasadena","type":"HIGH","state":"California","country":"United States","zip":"91105"},"Education:{\"uuid\":\"469dbbba-90eb-4c41-969c-395716c9f42e\"}":{"__typename":"Education","uuid":"469dbbba-90eb-4c41-969c-395716c9f42e","school":{"__ref":"School:{\"uuid\":\"a4127478-b536-4a5a-8f9c-476355f5096c\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"75bcbcf9-df06-4b74-89ef-21fc3bbec8e4\"}":{"__typename":"Education","uuid":"75bcbcf9-df06-4b74-89ef-21fc3bbec8e4","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Film and Media Studies (Minors in Comparative Literature and Communications)","degree":null},"MentorPublicProfile:{\"uuid\":\"679de5c1-f413-4c6d-9e9b-18f7fd98ab88\"}":{"__typename":"MentorPublicProfile","uuid":"679de5c1-f413-4c6d-9e9b-18f7fd98ab88","displayName":"Marie B.","slug":"marie-estelle","biography":"\u003cp\u003eHi, I'm Marie! I grew up in Pasadena, a suburb of Los Angeles, and went to Mayfield Senior School. In high school I became obsessed with creative writing of all kinds. Poetry, playwriting, short stories—I loved it all. My favorite classes were french, english, and history, although I loved calculus too (mostly because I had an amazing teacher!). \u003cbr\u003e\u003cbr\u003eI also loved (and still love!) to sing. I was a member of the Los Angeles Children's Chorus for 8 years. Through LACC, I was able to sing at Walt Disney Concert Hall, be on an album for Steven Spielberg and John Williams, and generally fell in love with music and the process of creating art with other people. It's super important for any kid to feel like they are good at something, and for me, that was music. A goal of mine with every student I mentor is to make them feel important and powerful in the thing that they love (or are learning to love) to do. Whether it be writing music, essays, poetry, or even just practicing french, I want every kid to feel like they have something to offer, something that they should be proud of, to their classmates and themselves. \u003cbr\u003e\u003cbr\u003eI studied screenwriting and literature at Stanford University. While at school, I was a member of the contemporary theater group on campus, sang in an acapella group, developed a love of photography, and wrote a ton! I want to make movies someday, but in the meantime, I want to help your student succeed—whatever that means to them! Whether it be essay writing, creative writing, french, entrepreneurship, or even video production, I can't wait to work with you :)\u003c/p\u003e","teachingVideoPlaybackId":"xGHOSHpG02C02OkWhTaEtLlTH3T2ISEVers1WXevn7IpU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI think my greatest achievement has got to be developing, writing, and directing a film while still in college! Being able to bring a team together to produce my work was incredibly rewarding :)\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"534813cd-b550-45a8-ad14-72c
