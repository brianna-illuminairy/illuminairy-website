xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"da7d8683-69b7-4bb7-884e-15ba0341efdd\"}":{"__typename":"Favorites","uuid":"da7d8683-69b7-4bb7-884e-15ba0341efdd","photoUrl":"https://ucarecdn.com/b9158846-8d28-4e65-b013-eefc254a9aab/","title":"Currents by Tame Impala","type":"ALBUM"},"Favorites:{\"uuid\":\"f5f9ee60-482d-4033-8b13-54e76374659d\"}":{"__typename":"Favorites","uuid":"f5f9ee60-482d-4033-8b13-54e76374659d","photoUrl":"https://ucarecdn.com/b74bca17-93f7-44f9-8ede-6e549dcd6415/","title":"Kill Your Darlings (2013)","type":"MOVIE"},"Favorites:{\"uuid\":\"187a4d46-106e-4845-ab29-1aab68e8c4dc\"}":{"__typename":"Favorites","uuid":"187a4d46-106e-4845-ab29-1aab68e8c4dc","photoUrl":"https://ucarecdn.com/c2e08a5c-527f-4c65-8359-cec26b2474d7/","title":"Angels in America by Tony Kushner","type":"PLAY"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"643c3edb-99b2-472d-b6d2-2eb61e52a74a\"}":{"__typename":"DeepDives","uuid":"643c3edb-99b2-472d-b6d2-2eb61e52a74a","content":"\u003cp\u003ePoetry has always been the way that I make sense of life. In high school, whenever the world was too overwhelming, I would add as many words as that day demanded to one long word document. I kept adding to this collection during university, and eventually in my second year at Stanford I compiled, edited, and published it as a cohesive (anonymous!) poetry collection. I still write whenever life demands it from me, more so now when its beauty is overpowering, as well as its pain. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"13cfa5ea-9ba1-4656-a890-5c8708ad07e2\"}":{"__typename":"DeepDives","uuid":"13cfa5ea-9ba1-4656-a890-5c8708ad07e2","content":"\u003cp\u003eBecoming ourselves and finding our \"why\" is one of the most painful and most rewarding things that we all have to do while growing up. Despite how individual that process is, I have found that it is so, so helpful to have models that we can look up to, take inspiration from, or even just have as thought partners! I want to share back some of the guidance that I was fortunate to have in the first parts of that process for myself, as well as to fill in the gaps of models I wish I had known about earlier.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"fbf52090-1342-40d6-b446-6674bec1ef8e\"}":{"__typename":"DeepDives","uuid":"fbf52090-1342-40d6-b446-6674bec1ef8e","content":"\u003cp\u003eHonestly, my friends. The single greatest thing my friends have done for me is live their lives authentically, be themselves without hesitation, and chase joy in a world that refuses to center it, or even denies it. I am so lucky to have friends who are passionate enough to chase life, no matter the stress it brings, whether that means taking the risk of being a full-time musician, moving to an new country, starting a business, or doing community-based research even before an institution will support it, to never leave behind where they began.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"32cef8dc-bef1-44b9-8fe5-762237f9183c\"}":{"__typename":"DeepDives","uuid":"32cef8dc-bef1-44b9-8fe5-762237f9183c","content":"\u003cp\u003eFollowing what sparks interest and joy in you is a greater indicator of success and fulfillment than pushing yourself towards what you think you \"should\" be doing. There are so many competing voices in school, among family, and in society about who and how you \"should\" be -- but the most important voice to find and listen to is your own.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}":{"__typename":"School","uuid":"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5","name":"The Chapin School","city":"New York","type":"HIGH","state":"NY","country":"USA","zip":"10028"},"Education:{\"uuid\":\"1bab2661-cdfa-4c91-b886-934dc78fec43\"}":{"__typename":"Education","uuid":"1bab2661-cdfa-4c91-b886-934dc78fec43","school":{"__ref":"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4c125bbe-1d18-4be0-9ea1-4059c50696ec\"}":{"__typename":"Education","uuid":"4c125bbe-1d18-4be0-9ea1-4059c50696ec","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2022","major":"Comparative Studies in Race \u0026 Ethnicity, minor in Theater \u0026 Performance Studies (BA) - Sociology (MA)","degree":null},"MentorPublicProfile:{\"uuid\":\"b8bc204a-b4b3-446f-bd2c-015b0d5d7d43\"}":{"__typename":"MentorPublicProfile","uuid":"b8bc204a-b4b3-446f-bd2c-015b0d5d7d43","displayName":"Charlie O.","slug":"charlie-odonohue","biography":"\u003cp\u003eHi there! My name is Charlie, and I am a recent graduate of Stanford University, where I majored in Comparative Studies in Race \u0026amp; Ethnicity, minored in Theater \u0026amp; Performance Studies, and completed a Master's in Sociology. Love as an action rooted in social context is my life's driving force. I find the most purpose in work that is solidarity-based, people-first, and creative. I combined many of these passions in my honors thesis, which documented queer and transgender oral history interviews to uplift community members' lived experiences and make evident the gendered violence of settler colonialism.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am originally from NYC, where I went to The Chapin School and was maybe-even-too involved in theater, dance, and creative writing. Some of my favorite moments there happened while directing, acting, or just existing in the black box theater, while reading student works as Editor-in-Chief of our literary magazine, or while running Feminism Club. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI currently live and work in Berlin, Germany as a mental health facilitator, sociologist, and writer. I am otherwise usually found hosting picnics in parks, dancing in kitchens (to the dismay of my friends who just want to cook), reading, writing poetry, and convincing my loved ones \"it's just a short walk away\" when it is at least a 45-60 minute distance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am so excited to share my passions and experience with my mentees - and more importantly, to help them cultivate their own passions and shine!\u003c/p\u003e","teachingVideoPlaybackId":"ku9iIQtnYbdQoBb01dFSk3MLTE400KuzJVczMDi00d2nhc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"da7d8683-69b7-4bb7-884e-15ba0341efdd\"}"},{"__ref":"Favorites:{\"uuid\":\"f5f9ee60-482d-4033-8b13-54e76374659d\"}"},{"__ref":"Favorites:{\"uuid\":\"187a4d46-106e-4845-ab29-1aab68e8c4dc\"}"}],"causesSupported":[],"major":"Comparative Studies in Race \u0026 Ethnicity, minor in Theater \u0026 Performance Studies (BA) - Sociology (MA)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"643c3edb-99b2-472d-b6d2-2eb61e52a74a\"}"},{"__ref":"DeepDives:{\"uuid\":\"13cfa5ea-9ba1-4656-a890-5c8708ad07e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"fbf52090-1342-40d6-b446-6674bec1ef8e\"}"},{"__ref":"DeepDives:{\"uuid\":\"32cef8dc-bef1-44b9-8fe5-762237f9183c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e04518d0-ae15-40be-ba09-dceebad5f261/-/preview/-/format/jpg/","https://ucarecdn.com/3bd9cc01-8675-403f-867b-58e7581dbfd4/-/preview/-/format/jpg/","https://ucarecdn.com/28f02cd0-c17a-482b-94e7-8d980e282c31/-/preview/-/format/jpg/"],"pronouns":"THEY_THEM","gender":"NON_BINARY","education":[{"__ref":"Education:{\"uuid\":\"1bab2661-cdfa-4c91-b886-934dc78fec43\"}"},{"__ref":"Education:{\"uuid\":\"4c125bbe-1d18-4be0-9ea1-4059c50696ec\"}"}],"hiredAt":"2024-10-09T11:59:42.321Z","topics":["Literature","Women \u0026 Gender Studies","Race \u0026 Ethnicity","Public Speaking","Writing","Film / Theater","Journalism"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"charlie-odonohue\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b8bc204a-b4b3-446f-bd2c-015b0d5d7d43\"}"}}},"_sentryTraceData":"f9afb165e8884922bed31b40d887fe28-b00aafe1be00dc7c-0","_sentryBaggage":"sentry-environme
