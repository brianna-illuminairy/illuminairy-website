xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"7e70354e-3652-465f-84da-30a61f0186a4\"}":{"__typename":"DeepDives","uuid":"7e70354e-3652-465f-84da-30a61f0186a4","content":"\u003cp\u003eMy dream is to be an Aerospace Engineer at a space company! I have loved my experience in optimizing structures and objects for efficient aerodynamic flow in my Project Team, and would love to continue this in a professional capacity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ec8f0654-da64-43fd-81cd-8c49f8a9c200\"}":{"__typename":"DeepDives","uuid":"ec8f0654-da64-43fd-81cd-8c49f8a9c200","content":"\u003cp\u003eMy proudest project was a \"weather clock\" (still working on the name) I created in high school. This was an Arduino based project, which fed live weather data from AccuWeather to an ESP8266 microcontroller. This data was then parsed and analysed, and multiple judgements were made by the program; whether it was rainy, whether it was sunny, and whether it was hot. The thresholds for these judegements could all be controlled by the user. The physical product was as follows: a frame around the outside, covering up four servo motors. Four transparent plastic arms connected to each servo, and an item of clothing or accessory made of paper (e.g. umbrella, sunglasses, hoodie, trousers), connected to each piece of transparent plastic. In the center of the frame was a stick figure, wearing shorts and a t-shirt (for the standard sunny weather). When the weather changed, the appropriate item of clothing or accessory would descend onto the stick figure. If it got cold, the trousers and hoodie would rotate over the stick figure, covering the shorts and the t-shirt, and signifying cold weather. If it began to rain, or was forecast to rain, the umbrella would descend into the stick figure's hand. If it became sunny, the sunglasses would descend to cover the stick figure's eyes. The angle to which each servo motor rotated was dependant on the initial position of the clothing or accessory relative to the final position. This was all controlled by a motor control unit. This has been my favourite \"passion project\", because It allowed me to explore my interests in Arduino and microcontrollers, whilst also allowing me to create a product which I believe has real world applications. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"5a04fd06-f66a-4a37-973c-12572f12cedd\"}":{"__typename":"DeepDives","uuid":"5a04fd06-f66a-4a37-973c-12572f12cedd","content":"\u003cp\u003eThe most significant realisation I have experienced throughout my schooling is how much impact a teacher can have on a student. My 10th grade Physics teacher is the only reason I pursued a career in Engineering, because of his enthusiasm and willingness to go above and beyond. I now have the opportunity to do the same. In the past, I have taught young students, and enjoyed it thoroughly. Now, I have the opportunity to teach students who are nearing University, which, in my opinion, is the most crucial age for decision making. If I can help even one student in their path towards a STEM career, I believe it would absolutely worth my time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e184e8b2-1e8f-48be-93a3-aac3b1c0ab0f\"}":{"__typename":"DeepDives","uuid":"e184e8b2-1e8f-48be-93a3-aac3b1c0ab0f","content":"\u003cp\u003eI love to work on cars!! Having spent a few summers working at a local mechanic, I have gained a deep interest in diagnosing and fixing cars. My experience lies in BMWs, Mini Coopers, and Volkswagens. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"ab5feac9-8136-48d4-81dc-50d05b5ec15a\"}":{"__typename":"School","uuid":"ab5feac9-8136-48d4-81dc-50d05b5ec15a","name":"King's College School, Wimbledon","city":"London","type":"HIGH","state":"England","country":"United Kingdom","zip":"SW19 4TT"},"Education:{\"uuid\":\"2a763e50-48a5-4939-b9b2-f095db1dc818\"}":{"__typename":"Education","uuid":"2a763e50-48a5-4939-b9b2-f095db1dc818","school":{"__ref":"School:{\"uuid\":\"ab5feac9-8136-48d4-81dc-50d05b5ec15a\"}"},"startYear":"2013","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"6313484b-4bbf-438d-9824-fd5a7e1696a2\"}":{"__typename":"Education","uuid":"6313484b-4bbf-438d-9824-fd5a7e1696a2","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical and Aerospace Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"7f5ebcf7-7bb1-4413-8fc8-278b86d9832b\"}":{"__typename":"MentorPublicProfile","uuid":"7f5ebcf7-7bb1-4413-8fc8-278b86d9832b","displayName":"Serkan Y.","slug":"serkan-yurday","biography":"\u003cp\u003eHello! My name is \u003cstrong\u003eSerkan\u003c/strong\u003e, and I am a sophomore pursuing a \u003cstrong\u003eBachelor's of Science in Mechanical Engineering\u003c/strong\u003e with a minor in \u003cstrong\u003eAerospace Engineering\u003c/strong\u003e at Cornell University. I'm passionate about the mechanics of how things work and I love sharing that enthusiasm with others. I believe that engineering is more than just equations; it's a powerful way to solve real-world problems, and I'm here to help you master the foundational concepts and apply them to your own ambitious projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Specializations: Academic Mentorship and Passion Projects\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic Mentorship:\u003c/strong\u003e I specialize in the core subjects essential for any aspiring engineer: \u003cstrong\u003eMaths\u003c/strong\u003e (including Algebra, Geometry, Pre-Calculus, and AP/Calculus) and \u003cstrong\u003ePhysics\u003c/strong\u003e (both algebra-based and \u003cstrong\u003ecalculus-based\u003c/strong\u003e). I welcome \u003cstrong\u003emiddle school, high school, and pre-college students\u003c/strong\u003e who are preparing for a future in STEM.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion Project Coaching:\u003c/strong\u003e I will coach you on ambitious engineering and design projects, and I will personally help you navigate every phase: from your initial concept all the way through hands-on prototyping (using tools like \u003cstrong\u003eCAD\u003c/strong\u003e and \u003cstrong\u003e3D printing\u003c/strong\u003e), testing, and presentation.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I'm Qualified to Mentor You\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a student at Cornell Engineering, I have gained significant \u003cstrong\u003ehands-on experience with mechanical design and prototyping\u003c/strong\u003e. My most relevant experience is my involvement with the prestigious \u003cstrong\u003eCornell Electric Vehicles (CEV)\u003c/strong\u003e project team. I am a key member of the chassis subsystem, where I am actively involved in the complex process of designing, analyzing, and \u003cstrong\u003emanufacturing a carbon fiber chassis\u003c/strong\u003e for our latest electric race car. This responsibility requires advanced structural analysis, material science application, and a deep understanding of vehicle dynamics. Beyond my university work, I was also recognized in several \u003cstrong\u003eNational Physics Olympiads\u003c/strong\u003e.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Mentorship Credentials:\u003c/strong\u003e I have \u003cstrong\u003ethree years of prior experience successfully tutoring students\u003c/strong\u003e in science and math subjects, which has given me a refined approach to teaching. My sessions go beyond merely explaining a formula. \u003cstrong\u003eA typical session with me would look like this:\u003c/strong\u003e We will start by clearly identifying the core concept you need to master. For a math problem, we'll break it down into logical steps and spend time on \u003cstrong\u003ecritical thinking\u003c/strong\u003e, asking \"Why does this work?\" rather than just \"How do I solve it?\" For a project, we'll collaborate to perform a \u003cstrong\u003edesign review\u003c/strong\u003e, troubleshooting potential flaws and iterating on your CAD models in real-time. My goal is to teach you \u003cstrong\u003eproblem-solving\u003c/strong\u003e and \u003cstrong\u003etime-management\u003c/strong\u003e skills that are applicable in any academic or professional setting.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile I spend a lot of time in the lab, I promise I'm a normal college student! When I'm not calculating stress tolerances, you can find me in the gym (only sometimes skipping leg day) or going on long walks in gorgeous Ithaca.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to potentially working with you!\u003c/p\u003e","teachingVideoPlaybackId":"SZc97lbZDmpfU02ldcr71XGJmMcwyhalebeIFTv2i7D8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical and Aerospace Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7e70354e-3652-465f-84da-30a61f0186a4\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec8f0654-da64-43fd-81cd-8c49f8a9c200\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a04fd06-f66a-4a37-973c-12572f12cedd\"}"},{"__ref":"DeepDives:{\"uuid\":\"e184e8b2-1e8f-48be-93a3-aac3b1c0ab0f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/eb2b932a-d001-48c7-8827-2eeec3451352/-/preview/-/format/jpg/","https://ucarecdn.com/f15801da-3fa3-476e-bd0f-8200912d5989/-/preview/-/format/jpg/","https://ucarecdn.com/f4d0cb8f-bc73-44e9-85d8-2dcd54b5139d/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2a763e50-48a5-4939-b9b2-f095db1dc818\"}"},{"__ref":"Education:{\"uuid\":\"6313484b-4bbf-438d-9824-fd5a7e1696a2\"}"}],"hiredAt":"2025-09-30T16:55:52.953Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Chemistry","Physics","Academic Coaching","Economics","Executive F
