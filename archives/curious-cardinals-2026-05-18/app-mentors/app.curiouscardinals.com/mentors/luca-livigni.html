xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8e55045c-cc68-4ec5-a879-d9f843551d72\"}":{"__typename":"DeepDives","uuid":"8e55045c-cc68-4ec5-a879-d9f843551d72","content":"\u003cp\u003eI was a hardworking student in high school and always liked challenging myself, but I also tried to keep a good balance. I cared about learning and pushing myself, while still making time for the things that made me happy. Teaching karate, spending time with my family, and growing closer to my friends helped me enjoy the moment and stay grounded. Looking back, I think high school taught me how important it is to work hard while still making space for the people and activities that matter to you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fc6a91ca-5b76-4444-96a8-169a2994595e\"}":{"__typename":"DeepDives","uuid":"fc6a91ca-5b76-4444-96a8-169a2994595e","content":"\u003cp\u003eI chose my majors because they sit at the intersection of so many important parts of technology today. Mathematics and statistics provide the foundation for understanding how AI works, while computer science and data science equip me with the tools to build algorithms, analyze data, and create real applications. I like that my majors do not limit me to one path. Instead, they give me the flexibility to apply my skills across many different fields, from AI and healthcare to business, education, and everyday technology.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"df4b3da1-fa71-4126-aa0a-7066a50f75fc\"}":{"__typename":"DeepDives","uuid":"df4b3da1-fa71-4126-aa0a-7066a50f75fc","content":"\u003cp\u003eIn my spare time, my favorite thing to do is spend time with friends and family while exploring new places, whether that’s around my city or somewhere across the world. I love going on spontaneous side quests with friends, trying new food, and making endless memories along the way. I also enjoy creative indoor activities like cooking and decorating, as well as outdoor activities like surfing, swimming, and pretty much anything that has to do with the water. Occasionally, I also love playing video games with friends as a fun way to relax and stay connected.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6a9dd177-497f-454a-ab82-d3f294f7dc0c\"}":{"__typename":"DeepDives","uuid":"6a9dd177-497f-454a-ab82-d3f294f7dc0c","content":"\u003cp\u003eMy advice to my middle or high school self would be to live in the moment more. You only get to experience that time once, and while planning for the future is important, it is also important not to let it take over everything. Your future will always matter at every stage of life, but if you are constantly focused on what comes next, you can miss what is happening right in front of you. I would remind myself to work hard and think ahead, but to always make space to enjoy the present.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"4a08a2b6-244c-4da2-ac2b-ec8b7e3c6796\"}":{"__typename":"School","uuid":"4a08a2b6-244c-4da2-ac2b-ec8b7e3c6796","name":"Dublin High School","city":"Dublin","type":"HIGH","state":"California","country":"United States","zip":"94568"},"Education:{\"uuid\":\"1415d69b-4f52-4530-b90f-a9a48a1aa1ce\"}":{"__typename":"Education","uuid":"1415d69b-4f52-4530-b90f-a9a48a1aa1ce","school":{"__ref":"School:{\"uuid\":\"4a08a2b6-244c-4da2-ac2b-ec8b7e3c6796\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"efacfeed-21b3-4d22-84f5-09a7c010a7d2\"}":{"__typename":"Education","uuid":"efacfeed-21b3-4d22-84f5-09a7c010a7d2","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mathematics of Computation \u0026 Statistics and Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"7288f9aa-c54e-44bb-b545-430d5607632c\"}":{"__typename":"MentorPublicProfile","uuid":"7288f9aa-c54e-44bb-b545-430d5607632c","displayName":"Luca L.","slug":"luca-livigni","biography":"\u003cp\u003eHi! I’m Luca, a second-year student at UCLA studying Mathematics of Computation and Statistics \u0026amp; Data Science, with a minor in Data Science Engineering. I’ve always been interested in the intersection of math, computer science, and data because these fields can be used as tools to solve real-world problems and build new technologies. Through studying STEM, I am especially focused on the impact that AI and machine learning can create, from healthcare to education to everyday technology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am originally from the Bay Area in California, and growing up around so much technology helped shape my interest in STEM. What first drew me in was the idea that the concepts we learn in math, coding, and statistics can be used to create things that actually exist in the real world. From watching sci-fi movies as a kid and imagining what technology could do, to deploying my own LLMs and building AI chatbots into websites, I’ve always been excited by the creative side of STEM.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I love surfing and pretty much anything that has to do with the beach. I also enjoy meeting new people, traveling around the world, and working within machine learning to build projects that let me combine creativity with problem-solving.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI work best with students who are new to STEM, want to strengthen their foundations, or want to build confidence in challenging subjects. I understand how frustrating math, coding, and problem-solving can feel when concepts do not click right away, but I believe challenges are where real learning happens.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy focus areas include:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;• \u003cstrong\u003eMath and science foundations:\u003c/strong\u003e K–5 Grade Math, Pre-Algebra, Algebra I, Algebra II, Geometry, Precalculus / Trigonometry, Calculus, Linear Algebra, Statistics, 6–8 Grade Science, Physics, and Chemistry\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;• \u003cstrong\u003eCoding and computer science:\u003c/strong\u003e Computer Science, Coding / Programming, Python, Java, C++, HTML/CSS, JavaScript, and foundational programming concepts\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;• \u003cstrong\u003eAI and project-based learning:\u003c/strong\u003e Machine Learning / AI, STEM Projects, helping students build real coding projects, and turning ideas into something they can share\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;• \u003cstrong\u003eCollege preparedness:\u003c/strong\u003e College essay writing, brainstorming application themes, strengthening academic confidence, and presenting interests clearly\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;• \u003cstrong\u003eAcademic coaching and confidence building:\u003c/strong\u003e Developing problem-solving strategies, learning how to ask better questions, building study habits, and becoming more comfortable with difficult material\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a UCLA student studying math, statistics, data science, and computer science, I have built a strong foundation across multiple areas of STEM. I have worked on programming, data analysis, and AI-related projects, including deploying my own LLMs and building AI chatbots into company based websites. These experiences have helped me see STEM as more than formulas or homework, but it is a way to understand the world, create useful tools, and turn ideas into something real.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, I focus on meeting students where they are. I do not want students to simply memorize steps. I want them to understand why something works, how to approach a problem, and how to build from their own initial thoughts.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy tutoring style:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve breaking down a difficult concept step by step, walking through practice problems together, connecting ideas to real-world examples, or helping a student build confidence with a project or assignment. I want students to feel comfortable asking questions, making mistakes, and explaining how they think through a problem.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you want to strengthen your STEM foundations, build confidence, or explore how math, coding, and AI connect to the real world, I would love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"500201CLsa01XbIvpkf8kBJZYuldC4Fd93L6VbDmxquzJM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mathematics of Computation \u0026 Statistics and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8e55045c-cc68-4ec5-a879-d9f843551d72\"}"},{"__ref":"DeepDives:{\"uuid\":\"fc6a91ca-5b76-4444-96a8-169a2994595e\"}"},{"__ref":"DeepDives:{\"uuid\":\"df4b3da1-fa71-4126-aa0a-7066a50f75fc\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a9dd177-497f-454a-ab82-d3f294f7dc0c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d774a633-41fe-46f1-84b2-b001961a2e05/-/preview/-/format/jpg/","https://ucarecdn.com/2e622c34-d1ed-4308-8b92-756e403a1c72/-/preview/-/format/jpg/","https://ucarecdn.com/c5f0ed01-5367-4d50-be13-ce57d8433069/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1415d69b-4f52-4530-b90f-a9a48a1aa1ce\"}"},{"__ref":"Education:{\"uuid\":\"efacfeed-21b3-4d22-84f5-09a7c010a7d2\"}"}],"hiredAt":"2026-05-11T04:06:48.479Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"luca-livigni\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7288f9aa-c54e-44bb-b545-430d5607632c\"}"}}},"_sentryTraceData":"116be2a7db644
