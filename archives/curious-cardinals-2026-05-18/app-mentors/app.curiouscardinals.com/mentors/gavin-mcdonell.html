xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0a3fbec6-7a5e-4ebe-b193-adbeda34f0db\"}":{"__typename":"Favorites","uuid":"0a3fbec6-7a5e-4ebe-b193-adbeda34f0db","photoUrl":"https://ucarecdn.com/8d8ea84e-aa27-442e-8668-6e1940973394/","title":"Punisher","type":"ALBUM"},"Favorites:{\"uuid\":\"4bd0594b-2cb7-4d91-b370-d347b2b02fc6\"}":{"__typename":"Favorites","uuid":"4bd0594b-2cb7-4d91-b370-d347b2b02fc6","photoUrl":"https://ucarecdn.com/8d8ea84e-aa27-442e-8668-6e1940973394/","title":"Season of the Witch: Enchantment, Terror, and Deliverance in the City of Love","type":"BOOK"},"Favorites:{\"uuid\":\"04f8db58-f92f-484a-b484-ea75acccd8fc\"}":{"__typename":"Favorites","uuid":"04f8db58-f92f-484a-b484-ea75acccd8fc","photoUrl":"https://ucarecdn.com/8d8ea84e-aa27-442e-8668-6e1940973394/","title":"Stanford Women's Basketball","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"17f9ac30-e5b0-49a7-bb8b-c5be4712ce2f\"}":{"__typename":"DeepDives","uuid":"17f9ac30-e5b0-49a7-bb8b-c5be4712ce2f","content":"\u003cp\u003eKeep exploring! There is so much value in trying out new things — especially things that don't come easily to you or are out of your comfort zone. An essential part of finding your passion(s) is exploration.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fcd15ab5-29e6-4c8e-a212-5533c908d16e\"}":{"__typename":"DeepDives","uuid":"fcd15ab5-29e6-4c8e-a212-5533c908d16e","content":"\u003cp\u003eI switched my major multiple times before eventually deciding on mathematics. I tried out physics, English, economics, computer science and more before settling on math. Ultimately, my passion for the subject won out. There are certainly more practical majors — majors that guaranteed you job offers post-graduation — but none that interest me more than math.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"2f2e7209-4292-42ac-a4fb-702d18258a8d\"}":{"__typename":"DeepDives","uuid":"2f2e7209-4292-42ac-a4fb-702d18258a8d","content":"\u003cp\u003eI'm proud to call myself a Caroline D. Bradley (CDB) Scholar. The merit-based, need-blind high school scholarship is the only of its kind in the country, and it has a fantastic community. I have made some amazing friendships through CDB over the years.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f1b2d3ce-02d6-46cc-82b9-3b755caaf428\"}":{"__typename":"DeepDives","uuid":"f1b2d3ce-02d6-46cc-82b9-3b755caaf428","content":"\u003cp\u003eI've written a number of short essays over the past few years. My latest piece, titled \"Irish Goodbyes,\" explores themes of music as religion, self-acceptance and solitude. I'm always excited to talk about creative writing!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"885cd74a-eb63-45e4-8da1-7de8144a91ad\"}":{"__typename":"School","uuid":"885cd74a-eb63-45e4-8da1-7de8144a91ad","name":"San Francisco University High School","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94115"},"Education:{\"uuid\":\"0a6d4e1b-6919-4ecc-ae10-bdac6bdc02cb\"}":{"__typename":"Education","uuid":"0a6d4e1b-6919-4ecc-ae10-bdac6bdc02cb","school":{"__ref":"School:{\"uuid\":\"885cd74a-eb63-45e4-8da1-7de8144a91ad\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"0a7b3d11-31c6-4b70-82c3-218142c97e47\"}":{"__typename":"Education","uuid":"0a7b3d11-31c6-4b70-82c3-218142c97e47","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Mathematics, Management Science \u0026 Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"4fb1dee5-88d5-41e6-990b-7679a2abe8b6\"}":{"__typename":"MentorPublicProfile","uuid":"4fb1dee5-88d5-41e6-990b-7679a2abe8b6","displayName":"Gavin M.","slug":"gavin-mcdonell","biography":"\u003cp\u003eHello, I’m Gavin! I’m currently a co-term student at Stanford University, where I study math, economics and management science and engineering (MS\u0026amp;E). At school, I spend my time learning new things, practicing with the Stanford Women’s Basketball Team, serving as a resident assistant, writing piano music and covering sports for The Stanford Daily. I’m originally from San Francisco, and I don’t intend to leave the Bay Area any time soon.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMath was my first academic passion, and I’m still enthralled by the subject. I think there’s a certain purity and elegance to it that one can’t find elsewhere — the satisfaction of finally understanding a concept, solving a problem or completing a proof is almost unmatched. I’m passionate about making all levels of math accessible and comfortable teaching a wide range of subjects: K-6 math, pre-algebra, algebra, geometry, precalculus, calculus, statistics, multivariable calculus, linear algebra and real analysis.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether we’re working on math, economics, creative writing or journalism, I’m excited to help you on your journey!\u003c/p\u003e","teachingVideoPlaybackId":"8LpFBXyulKfzWCvsQHxpDv3UZ01mT01GYsXXW001J8S02CQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0a3fbec6-7a5e-4ebe-b193-adbeda34f0db\"}"},{"__ref":"Favorites:{\"uuid\":\"4bd0594b-2cb7-4d91-b370-d347b2b02fc6\"}"},{"__ref":"Favorites:{\"uuid\":\"04f8db58-f92f-484a-b484-ea75acccd8fc\"}"}],"causesSupported":[],"major":"Mathematics, Management Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"17f9ac30-e5b0-49a7-bb8b-c5be4712ce2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"fcd15ab5-29e6-4c8e-a212-5533c908d16e\"}"},{"__ref":"DeepDives:{\"uuid\":\"2f2e7209-4292-42ac-a4fb-702d18258a8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"f1b2d3ce-02d6-46cc-82b9-3b755caaf428\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/680a238d-ecb9-467c-80e6-b2ca50689bdd/-/preview/-/format/jpg/","https://ucarecdn.com/536dd8c2-a031-408e-8fb1-66700ad66f5f/-/preview/-/format/jpg/","https://ucarecdn.com/057b5634-8f7c-43d2-8c3a-d07c805f52e8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"0a6d4e1b-6919-4ecc-ae10-bdac6bdc02cb\"}"},{"__ref":"Education:{\"uuid\":\"0a7b3d11-31c6-4b70-82c3-218142c97e47\"}"}],"hiredAt":"2023-09-19T00:50:21.968Z","
