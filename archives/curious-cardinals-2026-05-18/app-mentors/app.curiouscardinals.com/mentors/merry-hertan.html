xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fc7f1158-08f7-443d-953f-73062cb18bea\"}":{"__typename":"DeepDives","uuid":"fc7f1158-08f7-443d-953f-73062cb18bea","content":"\u003cp\u003eIn high school I was always passionate about math and science. I was excited about trying something new in college, and engineering seemed like the perfect opportunity to apply my interests! I took an architecture class over my junior summer and got interested in the mix between the quantitative field of civil engineering and more creative field of architecture.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1c0a2200-1d09-49c0-8dac-8b926eb5ea21\"}":{"__typename":"DeepDives","uuid":"1c0a2200-1d09-49c0-8dac-8b926eb5ea21","content":"\u003cp\u003eIn my spare time I enjoy spending time being active outdoors. Specifically, I love hiking and biking. In college I led freshman on a 4-night camping experience and it was one of my favorite extracurriculars! I also love to bake, specifically cakes. I am currently enjoying exploring New York City!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"69113ce6-7b4d-4820-b12d-0afeea177a7b\"}":{"__typename":"DeepDives","uuid":"69113ce6-7b4d-4820-b12d-0afeea177a7b","content":"\u003cp\u003eIn high school I spent my summers doing a range of different things. After my sophomore year, I spent a month in Peru doing a Spanish immersion program. It was an awesome experience because I got to live with a homestay family and go to school with my host sister. After my junior year I did an architecture program which actually helped me designed on studying civil engineering/architecture at college!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"211a4818-4727-4ad8-8bea-cb1edd32d81c\"}":{"__typename":"DeepDives","uuid":"211a4818-4727-4ad8-8bea-cb1edd32d81c","content":"\u003cp\u003eI am excited about mentorship because it is something I have done throughout my life! In college I was a mentor for high school students who didn't have access to a college advisor. It was so meaningful to impart my knowledge on someone else and really feel like I made an impact. I am excited to continue doing so through Curious Cardinals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"a670ec83-670d-428e-9c95-61d4578f0248\"}":{"__typename":"School","uuid":"a670ec83-670d-428e-9c95-61d4578f0248","name":"Staples High School","city":"Westport","type":"HIGH","state":"CT","country":"United States","zip":"06880"},"Education:{\"uuid\":\"b1546116-21ef-4a40-86a3-d83416196fbc\"}":{"__typename":"Education","uuid":"b1546116-21ef-4a40-86a3-d83416196fbc","school":{"__ref":"School:{\"uuid\":\"a67
