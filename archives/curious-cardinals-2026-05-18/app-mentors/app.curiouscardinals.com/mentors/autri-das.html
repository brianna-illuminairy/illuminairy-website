xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"bc3b0c43-ad23-4a11-a414-42842d80ee4b\"}":{"__typename":"DeepDives","uuid":"bc3b0c43-ad23-4a11-a414-42842d80ee4b","content":"\u003cp\u003eI love exploring nature in my spare time. Growing up, I spent a lot of time in my neighborhood creek hoping to find small animals. I try to continue spending time in nature by going to the beach and hiking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"efe2ab34-f3fd-4526-a717-068c1cf967ac\"}":{"__typename":"DeepDives","uuid":"efe2ab34-f3fd-4526-a717-068c1cf967ac","content":"\u003cp\u003eGrowing up, I always felt grateful for the mentorship I received from my older brother who exposed me to STEM topics from an early age. Thanks to him, I felt free to think creatively and act on any scientific curiosities. As a mentor, I hope to give kids the same experience I had with learning STEM. I aim to instill curiosity and creativity in the kids I teach the same way my older brother did for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"f8bc7885-d943-438f-936b-d98889a1c386\"}":{"__typename":"DeepDives","uuid":"f8bc7885-d943-438f-936b-d98889a1c386","content":"\u003cp\u003eAs a high school student focused on academics and supporting my friends, I often took the role of peer tutor. I would help my friends with homework and eventually grew to support other students in my high school through our school's science research club. I would help students in the club with their projects and the research process. Through my leadership position in the club, my informal peer tutor role among friends became official!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"9d9862fe-af33-40f2-824e-1c0cc76f0c43\"}":{"__typename":"DeepDives","uuid":"9d9862fe-af33-40f2-824e-1c0cc76f0c43","content":"\u003cp\u003eSomething I am proud of is my dance choreography and teaching journey because I did not have family members or close friends to look up to when exploring dance. After I finished my formal dance training, I continued dance through choreographing independently, performing at local shows, and teaching kids in my community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"15f20f87-a3cd-4f95-be28-0501f4d4565b\"}":{"__typename":"School","uuid":"15f20f87-a3cd-4f95-be28-0501f4d4565b","name":"Sunset High School","city":"Portland","type":"HIGH","state":"Oregon","country":"United States","zip":"97229"},"Education:{\"uuid\":\"c69c648e-8646-4333-8cfa-190ff5c12059\"}":{"__typename":"Education","uuid":"c69c648e-8646-4333-8cfa-190ff5c12059","school":{"__ref":"School:{\"uuid\":\"15f20f87-a3cd-4f95-be28-0501f4d4565b\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"6640c6bc-c754-4185-ade3-5d088d6db298\"}":{"__typename":"Education","uuid":"6640c6bc-c754-4185-ade3-5d088d6db298","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Materials Science \u0026 Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"e7c7b3df-7069-48c6-8bf8-af7cae7ff2a2\"}":{"__typename":"MentorPublicProfile","uuid":"e7c7b3df-7069-48c6-8bf8-af7cae7ff2a2","displayName":"Autri D.","slug":"autri-das","biography":"\u003cp\u003eHello! My name is Autri and I am a freshman at Stanford planning to study Materials Science \u0026amp; Engineering. I became interested in the field through independent science projects and internship opportunities focused on chemistry and materials science. My research was mostly focused on applications of materials science to environmental issues such as climate change and pollution. I love passing on my interest in STEM to younger kids! I think instilling curiosity about STEM is largely missing from our existing education system and I find it important to give kids a chance to explore these questions through constructive projects. During high school, I started a STEM program called Love of Learning for students K-5 at my local elementary school. I led peer in designing curriculum and teaching fun, interactive lessons to kids. We did lots of hands-on activities, engineering design projects, and experiments that exposed kids to advanced content in an easy, approachable way. The interactive format allowed kids to ask questions and experiment with their ideas. I have also tutored kids one on one for four years online through an online non-profit called Learn to Be. I worked with kids K-6 as a tutor in math and reading. I focused on making lessons catered to individual student needs and interests. Throughout high school, I frequently worked with peers and younger students to help them develop innovative science projects. I provided support with research, experimentation, and presentations as they prepared for competing in local science competitions. I love working with kids of all ages to make STEM approachable and help them figure out what they are curious about! In my free time, I enjoy Indian classical dance! I have been performing dance for 10+ years and have started performing self-choreographed dances in the past years. Before college, I also worked with kids in my community to choreograph and team them dance. Outside of dance, I love exploring the outdoors. Growing up, I enjoyed spending time at my neighborhood creek and developed much of my initial interest in science by making observations about the nature around me. Nowadays, I continue exploring nature by visiting beaches, kayaking, and hiking.\u003c/p\u003e","teachingVideoPlaybackId":"s00d3M67wG4EpUfjpuZP8JtUjkNN4lFk5JJMfRwt1lRk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Materials Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bc3b0c43-ad23-4a11-a414-42842d80ee4b\"}"},{"__ref":"DeepDives:{\"uuid\":\"efe2ab34-f3fd-4526-a717-068c1cf967ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"f8bc7885-d943-438f-936b-d98889a1c386\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d9862fe-af33-40f2-824e-1c0cc76f0c43\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/94e24160-ead3-4209-af68-55f57c729cf5/-/preview/-/format/jpg/","https://ucarecdn.com/f371efaf-300f-45c9-88db-d6d03a0c740e/-/preview/-/format/jpg/","https://ucarecdn.com/bd686bc7-984b-4d16-a9de-45613084b764/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":
