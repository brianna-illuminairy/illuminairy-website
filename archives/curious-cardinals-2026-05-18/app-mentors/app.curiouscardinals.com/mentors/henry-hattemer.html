xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"11d9b031-f04e-4420-a7cf-2e9e1ce62f24\"}":{"__typename":"Favorites","uuid":"11d9b031-f04e-4420-a7cf-2e9e1ce62f24","photoUrl":"https://ucarecdn.com/44796d77-2907-40c7-8556-0dda01116b88/","title":"The Fugitive","type":"MOVIE"},"Favorites:{\"uuid\":\"57345a2c-3257-4f04-9bff-2e2bae034063\"}":{"__typename":"Favorites","uuid":"57345a2c-3257-4f04-9bff-2e2bae034063","photoUrl":"https://ucarecdn.com/2d737dee-0ac9-4eb0-9adb-37f3bd565009/","title":"Leo Messi","type":"ATHLETE"},"Favorites:{\"uuid\":\"50ce5816-ec1b-4c6e-b7ca-27d9f845a4fe\"}":{"__typename":"Favorites","uuid":"50ce5816-ec1b-4c6e-b7ca-27d9f845a4fe","photoUrl":"https://ucarecdn.com/56e34463-becb-4611-87da-22b9621194cd/","title":"Harry Potter and the Half-Blood Prince","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"286469ca-7c1c-4af7-85c8-43e6707670bf\"}":{"__typename":"DeepDives","uuid":"286469ca-7c1c-4af7-85c8-43e6707670bf","content":"\u003cp\u003eI would tell my middle school self to try everything while the stakes are so low. It's a great time to figure out things you might enjoy. While I certainly had my fair share of things going on, I would have appreciated some guidance reminding me to maximize my time while I was in that stage\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"cdb0405b-fb67-4f37-a452-359ab0e11d5e\"}":{"__typename":"DeepDives","uuid":"cdb0405b-fb67-4f37-a452-359ab0e11d5e","content":"\u003cp\u003eI initially was deciding between engineering and humanities, actually. I also liked mechanical concepts and architecture, but I eventually opted to go the humanities route because I wanted to keep my options wide open, and I realized I wanted to directly help people and work towards a more sustainable future. While engineering does not preclude this, I decided political science would better equip me for more policy-related work. Eventually, I added a second major - economics - to obtain a more quantitative perspective of our society. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"99817803-db60-404b-98d4-97ac4e491301\"}":{"__typename":"DeepDives","uuid":"99817803-db60-404b-98d4-97ac4e491301","content":"\u003cp\u003eMy dreams usually come in phases. And these phases are kind of funny. My dreams closely follow whatever sort of minor and casual interest I have - usually a board game or video game. For a bit, I would have chess dreams, and then FIFA dreams.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut the oddest ones, with one especially strange one, were when I played fortnite for a few months. One night, I was stuck in an upside-down battle royale, fighting my neighbors with Chipotle ingredients for supremacy. Not as fun as it sounds.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"90a1f94d-f239-47dc-95d2-8e633d5a51c7\"}":{"__typename":"DeepDives","uuid":"90a1f94d-f239-47dc-95d2-8e633d5a51c7","content":"\u003cp\u003eDuring high school, I would spent my summers at a wilderness tripping camp. We would embark on long canoe trips through Canada, relying on only ourselves for support. The Camp liked to use rather antiquated - but effective - containers for food and gear: big canvas bags called Duluth Packs, and wooden boxes called wannigans. The early french voyageurs used canvas packs and wannigans. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring COVID, deprived of my usual camp summer, I decided to build a wannigan for my own canoe. I researched different styles online, drafted a model in CAD, and went to home depot. I constructed the frame, siding, and a custom silverware drawer and lid. Then I sealed it with polyurethane. Finally, I created canvas backpack straps, and a leather tumpline (goes on your forehead to balance weight), and riveted them to the box. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love using my wannigan on my own canoe trips now. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"cb6faebc-aafe-45a5-8db7-045b71f39298\"}":{"__typename":"School","uuid":"cb6faebc-aafe-45a5-8db7-045b71f39298","name":"Walnut Hills High School","city":"Cincinnati","type":"HIGH","state":"Ohio","country":"United States","zip":"45207"},"Education:{\"uuid\":\"8e1d58be-a7a0-4f0c-9e1d-c7f2664aa142\"}":{"__typename":"Education","uuid":"8e1d58be-a7a0-4f0c-9e1d-c7f2664aa142","school":{"__ref":"School:{\"uuid\":\"cb6faebc-aafe-45a5-8db7-045b71f39298\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"d4f09743-707a-4e97-a42e-668f7063d925\"}":{"__typename":"Education","uuid":"d4f09743-707a-4e97-a42e-668f7063d925","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics, Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"dba51d96-c84c-4a78-8e52-6c13cca17405\"}":{"__typename":"MentorPublicProfile","uuid":"dba51d96-c84c-4a78-8e52-6c13cca17405","displayName":"Henry H.","slug":"henry-hattemer","biography":"\u003cp\u003eHi! My name is Henry, and I am thrilled to be apart of the Curious Cardinals Team.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI recently graduated \u003cem\u003ecum laude \u003c/em\u003efrom the University of California, Los Angeles. At UCLA, I double-majored in Economics and Political Science, while minoring in Environmental Systems and Society. I was also a member of the competitive Ski and Snowboard Team and a trip leader for the UCLA Backpacking Club while in college.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am highly passionate about the environment. I wish to be an active part in our fight against climate change, and my undergraduate studies were focused on the goal of acquiring a multidisciplinary perspective of our current environmental issues. I am hoping to undertake a career in either climate policy or environmental law.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eSpeaking of law, I am currently studying for the LSAT - so I understand in real time the struggles of test prep. I plan to matriculate at law school in either 2027 or 2028. In the meantime, I live in Salt Lake City, Utah, and am enjoying the wonderful mountains here!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore UCLA, I attended Walnut Hills High School, in Cincinnati, Ohio. I played soccer, ran track, and participated in numerous clubs - including Academic Quiz Team, Model UN, and Junior Engineering Technical Society (JETS). I enjoyed almost every subject, and liked to deepen my knowledge in all of them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI took fifteen AP courses, and passed all the exams - including nine 5s, and five 4s. I would be happy to refresh my knowledge and tutor any of those subjects. I also scored a 35 on the ACT, and was a National Merit Semifinalist.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my summers, I would attend (or work at, in later years) Camp Kooch-i-ching, an intense wilderness tripping camp in International Falls, Minnesota. From our home base, we would embark on two-four week canoe trips through the rivers, lakes, and streams of Manitoba and Ontario's wilderness. My favorite trip was a 26-day, 500-mile expedition to the Hudson Bay via the Seal and Caribou Rivers. I saw 18 polar bears! Only a couple chased us.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I like doing anything outdoors. I love skiing, running, most sports, biking, climbing, and lifting weights. I am an avid cruciverbalist (crossword-puzzle-doer, what studying latin for four years will do to you) and reader. When I'm not doing those things, I can be found wrenching on my old Toyota or woodworking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI can't wait to meet you! I would love to help you in any way I can!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eI tutor all levels of students, and have a wide range of courses, examinations, and concepts in my repertoire. I've listed them below.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStandardized Tests: ACT, SAT, PSAT, SAT Subject Tests\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAPs: World History, European History, United States History, Comparative Government, Human Geography, Macroeconomics, Microeconomics, United States Government and Politics, Precalculus, Calculus AB, Calculus BC, Statistics, Computer Science A, Chemistry, Physics 1, Physics 2, Physics C: Mechanics, Physics C: Electricity and Magnetism, Environmental Science, Latin, English Language, English Literature, Art History.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOther courses: Any English/Language Arts/Writing, Any Math, Any Science (excluding AP Biology), Any History/Social Studies, Lower-level Spanish, Engineering Principles.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOther: Time management, study skills\u003c/p\u003e","teachingVideoPlaybackId":"Obr46Ov5LEshEE4tcFkNSOdxGzgoAPNSR3W891jUJDw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"11d9b031-f04e-4420-a7cf-2e9e1ce62f24\"}"},{"__ref":"Favorites:{\"uuid\":\"57345a2c-3257-4f04-9bff-2e2bae034063\"}"},{"__ref":"Favorites:{\"uuid\":\"50ce5816-ec1b-4c6e-b7ca-27d9f845a4fe\"}"}],"causesSupported":[],"major":"Economics, Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"286469ca-7c1c-4af7-85c8-43e6707670bf\"}"},{"__ref":"DeepDives:{\"uuid\":\"cdb0405b-fb67-4f37-a452-359ab0e11d5e\"}"},{"__ref":"DeepDives:{\"uuid\":\"99817803-db60-404b-98d4-97ac4e491301\"}"},{"__ref":"DeepDives:{\"uuid\":\"90a1f94d-f239-47dc-95d2-8e633d5a51c7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d48b798d-9d5d-4415-a5d8-1f7cdcc596f9/-/preview/-/format/jpg/","https://ucarecdn.com/f1d69be6-5040-41b9-817c-b6f7e8a17078/-/preview/-/format/jpg/","https://ucarecdn.com/55091c7b-2bc4-4984-a9c9-ce27e1741265/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"8e1d58be-a7a0-4f0c-9e1d-c7f2664aa142\"}"},{"__ref":"Education:{\"uuid\":\"d4f09743-707a-4e97-a42e-668f7063d925\"}"}],"hiredAt":"2025-09-30T02:28:07.762Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Chemistry","Physi
