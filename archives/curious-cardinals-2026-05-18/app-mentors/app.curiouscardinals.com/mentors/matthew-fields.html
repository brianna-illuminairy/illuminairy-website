chool:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Molecular Biophysics and Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"b3cbebcd-1e8b-4077-bd23-e3c3169f29f3\"}":{"__typename":"MentorPublicProfile","uuid":"b3cbebcd-1e8b-4077-bd23-e3c3169f29f3","displayName":"Matthew F.","slug":"matthew-fields","biography":"\u003cbr\u003e\u003cp\u003eI am a student at Yale studying Molecular Biophysics and Biochemistry. Now is a time of fundamental change in our understanding of what is possible with biology. Revolutions in aging biology suggest that the aging process might not be as inevitable as we once thought, while breakthroughs in RNA biology are showing that extraordinary control over humans’ biological functions is possible. I was a member of a neuroscience lab in high school, where I studied the effect of a Parkinson’s disease-associated mutation on the developing brain. I am now a part of a lab at Yale that is studying how mRNA controls the activity of proteins in the body. Many students are not aware of the multitude of opportunities for high schoolers to get involved in science and really dig into their passions beyond the memorization they have to do in school, and I am so grateful for the strong science research program my high school had, which allowed me to engage with real science so early in my career. I am excited to work with driven students who are fascinated by the science they see in school, but wish to go deeper and begin their scientific training in earnest. Personally, I am a big proponent of finding your own path. All throughout high school, I fenced at a national level. I never achieved the international results I was training for or a college recruitment spot that many pursue, but I was able to walk onto the team after getting into Yale on my own, and I now compete at the Division 1 level in fencing. This path was unique and required sticking to the things I truly love and enjoy over many years, especially when results were not immediate. I look forward to getting to know students who have drive and ambition to unlock the potential of science, and who are willing to put in the concerted work required to achieve their goals. Outside of school and fencing, I love being outdoors, spending time with friends and family, and reading science fiction and fantasy (my favorite book is Lord of the Rings).\u003c/p\u003e","teachingVideoPlaybackId":"014AS4GIOH53Bwkma2u2q3qHwRJiouL3ftSph5MlOZ6Y","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"def8acd9-af09-4622-9ddb-90ad463201df\"}"},{"__ref":"Favorites:{\"uuid\":\"aad4582b-a5c6-4b4e-9c72-282f5885b60c\"}"},{"__ref":"Favorites:{\"uuid\":\"fb9ea94b-f7a5-45f2-a5df-6771f5e77aba\"}"}],"causesSupported":[],"major":"Molecular Biophysics and Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a018db75-333f-4fcf-a6c3-94352bf371b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"e5df4ca2-81b9-4f09-8c40-9be4d7f85fe3\"}"},{"__ref":"DeepDives:{\"uuid\":\"05f26e4d-973e-45fc-84a4-25f716db2a70\"}"},{"__ref":"DeepDives:{\"uuid\":\"148dd0b9-3d60-4bfa-b162-8bfe3a08958d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cea7ba44-dbf3-4b08-90dc-9e9c08942801/-/preview/-/format/jpg/","https://ucarecdn.com/15b58ca5-84bb-43f2-a830-946f1b241089/-/preview/-/format/jpg/","https://ucarecdn.com/08673f24-aa15-4d40-9d2a-a8de5cb7c02a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"98f2d8e6-4937-467a-9be4-26493939941a\"}"},{"__ref":"Education:{\"uuid\":\"7bc324b1-32a0-46d3-9933-6b923fce6a13\"}"}],"hiredAt":"2026-02-01T23:03:31.776Z","topics":["Algebra II","Calculus","Precalculus / Trigonometry","Biology","Chemistry","Writing","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","http
