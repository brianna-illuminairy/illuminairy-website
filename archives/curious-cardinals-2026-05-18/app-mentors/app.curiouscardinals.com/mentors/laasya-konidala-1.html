xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"95548968-327b-429c-bb0e-5d7ddfb5e919\"}":{"__typename":"Favorites","uuid":"95548968-327b-429c-bb0e-5d7ddfb5e919","photoUrl":"https://ucarecdn.com/f7616bcb-bc24-4d51-9a3c-b09e1d77a431/","title":"Maggie Rogers","type":"ARTIST"},"Favorites:{\"uuid\":\"9dacbe45-800f-499c-bb4b-1c93d921cf40\"}":{"__typename":"Favorites","uuid":"9dacbe45-800f-499c-bb4b-1c93d921cf40","photoUrl":"https://ucarecdn.com/ae3d4aa8-508b-4214-904f-cde00da14eed/","title":"Where The Crawdads Sing","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"81dbfff8-e058-4f33-8756-7e70842e7b56\"}":{"__typename":"DeepDives","uuid":"81dbfff8-e058-4f33-8756-7e70842e7b56","content":"\u003cp\u003eThere is no such thing as the “wrong” dream. Before I found my love for computer science, I explored so many different passions - microbiology, robotics, creative writing, and more. Each one taught me something new and shaped the way I think today. Don’t feel pressured to follow what everyone else is doing and don't feel stressed if you aren't sure what you are passionate about yet. Instead, lean into what genuinely excites you, even if it doesn’t seem like the obvious or popular path. Curiosity is never wasted - it’s what leads you to who you’re meant to become.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"736e11f1-731f-4a93-a628-0eb3549ef915\"}":{"__typename":"DeepDives","uuid":"736e11f1-731f-4a93-a628-0eb3549ef915","content":"\u003cp\u003eDance! I trained in Bharatanatyam, a classical South Indian dance form, throughout elementary to high school. At Stanford, I’ve tapped into the social dance scene, exploring salsa, swing, and tango. Dance has always been a joyful, grounding way for me to stay creative and connect with others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6a5de622-2792-4c7d-98e4-e4c8bc622ebf\"}":{"__typename":"DeepDives","uuid":"6a5de622-2792-4c7d-98e4-e4c8bc622ebf","content":"\u003cp\u003eMentorship matters to me because I wouldn't be the person I am today without the incredible mentors I've had that believed in me and invested their time into me. From dance teachers and robotics coaches to professors who welcomed me into their labs, my mentors have shaped my confidence and curiosity, and I hope to offer that same support to my students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a90b521f-aa42-4afd-bebb-3ec16b2871bb\"}":{"__typename":"DeepDives","uuid":"a90b521f-aa42-4afd-bebb-3ec16b2871bb","content":"\u003cp\u003eI spent my high school summers exploring a mix of interests - conducting microbiology research at a local university, teaching myself how to code, and tutoring students on writing. I also cherished the chance to travel and visit distant family!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"4c46c8b8-0c1a-4e46-bc05-aef8273ab523\"}":{"__typename":"School","uuid":"4c46c8b8-0c1a-4e46-bc05-aef8273ab523","name":"Mills E. Godwin High School","city":"Richmond","type":"HIGH","state":"Virginia","country":"United States","zip":"23238"},"Education:{\"uuid\":\"3b12d37d-4236-4567-aaf0-a9b4d335b2ec\"}":{"__typename":"Education","uuid":"3b12d37d-4236-4567-aaf0-a9b4d335b2ec","school":{"__ref":"School:{\"uuid\":\"4c46c8b8-0c1a-4e46-bc05-aef8273ab523\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"9a6f4723-fcef-4031-877e-6be74ee220ef\"}":{"__typename":"Education","uuid":"9a6f4723-fcef-4031-877e-6be74ee220ef","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"8fb9d213-49f1-4a76-a866-2d46560eaffb\"}":{"__typename":"MentorPublicProfile","uuid":"8fb9d213-49f1-4a76-a866-2d46560eaffb","displayName":"Laasya K.","slug":"laasya-konidala-1","biography":"\u003cp\u003eLaasya is a junior at Stanford University studying Computer Science with a special interest in Artificial Intelligence. But long before she ever took a coding class, she was already passionate about asking big questions and chasing down answers through research. Since seventh grade, Laasya has completed independent science research projects across a wide range of topics - from exploring how plants grow in different conditions to studying bacteria and even designing tools to help detect cancer. She has competed in over 20 regional, state, and international science fairs, winning awards from organizations like the Intel International Science and Engineering Fair and the U.S. Agency for International Development.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, she served as Co-President of the Virginia Junior Academy of Science Student Government, where she helped students across the state, especially those in under-resourced schools, get involved in hands-on science research. For Laasya, science has always been about more than labs or textbooks; it’s about creativity, problem-solving, and making an impact on the world around her.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, Laasya continues to pursue this mission through research in Artificial Intelligence. She works in a research group that focuses on large language models (like the kind behind ChatGPT!), where she helps make these tools faster, smarter, and more useful for real-world applications. She’s also part of Stanford’s CS + Social Good and robotics communities, where she builds projects that blend technology with purpose, especially in education and accessibility.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of computer science, Laasya is also a passionate writer. Since her first year at Stanford, she’s been a writing tutor at the Hume Center for Writing and Speaking, helping students tell their stories and communicate their ideas clearly and powerfully. Her favorite part of tutoring is building students’ confidence by showing them that clear communication is a skill anyone can learn.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen she’s not in the lab or the library, you’ll probably find Laasya on the dance floor. She’s a big fan of social dancing, especially salsa, tango, and swing! As a mentor, Laasya believes in learning by doing - whether that’s building a robot, designing an experiment, or leading an organization. She tailors every lesson to her student’s unique interests, creating an immersive and engaging experience that works towards concrete goals and milestones. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbove all, Laasya is energized by curiosity. She’s excited to work with students across disciplines and grade levels, helping them turn their own questions and passions into bold, original projects just like she did.\u003c/p\u003e","teachingVideoPlaybackId":"ig3fCp00NuoaIsdZcOQUDVv02qZTYzWAgtRcHxic01Enf8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"95548968-327b-429c-bb0e-5d7ddfb5e919\"}"},{"__ref":"Favorites:{\"uuid\":\"9dacbe45-800f-499c-bb4b-1c93d921cf40\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"81dbfff8-e058-4f33-8756-7e70842e7b56\"}"},{"__ref":"DeepDives:{\"uuid\":\"736e11f1-731f-4a93-a628-0eb3549ef915\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a5de622-2792-4c7d-98e4-e4c8bc622ebf\"}"},{"__ref":"DeepDives:{\"uuid\":\"a90b521f-aa42-4afd-bebb-3ec16b2871bb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9dbbeb2b-8ca9-4559-883a-20ea1c5a4b77/-/preview/-/format/jpg/","https://ucarecdn.com/d9959271-f5d9-4e13-bbe9-aaec8d58fbe9/-/preview/-/format/jpg/","https://ucarecdn.com/fc66bf58-bbc2-4f88-9ae3-6e9829a7fb08/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3b12d37d-4236-4567-aaf0-a9b4d335b2ec\"}"},{"__ref":"Education:{\"uuid\":\"9a6f4723-fcef-4031-877e-6be74ee220ef\"}"}],"hiredAt":"2025-09-11T22:20:06.255Z","topics":["Algebra I","Calculus","K-5 Grade Math","Writing","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Creative Writing","Business / Entrepreneurship","Coding / Programming","STEM Project"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","ment
