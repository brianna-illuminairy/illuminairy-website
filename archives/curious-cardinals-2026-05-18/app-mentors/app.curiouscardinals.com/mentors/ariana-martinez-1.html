xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e6f93602-34ac-41a5-b9cc-6d6ab1e159d3\"}":{"__typename":"DeepDives","uuid":"e6f93602-34ac-41a5-b9cc-6d6ab1e159d3","content":"\u003cp\u003eI spent my summers taking dual enrollment classes at my local community college, training and competing with my club swim team, and conducting research in the Nalbondian Lab at California Baptist University.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"3286cbf3-1775-48d9-87f1-88fa7da3e2b8\"}":{"__typename":"DeepDives","uuid":"3286cbf3-1775-48d9-87f1-88fa7da3e2b8","content":"\u003cblockquote\u003e\u003cp\u003eI am someone who genuinely loves people; I was always the kid who talked to everyone. At the same time, I was both studious and athletic. Over time, I learned that these parts of my life weren’t compartmentalized...they were what made me \u003cem\u003eme\u003c/em\u003e. I could be the athletic kid while still keeping up with schoolwork and excelling academically. Because I truly loved what I was doing, the hard work never felt like work. In middle school I wasn't the student excelling academically yet, and I learned a lot of study habits and techniques that made learning so much more fun.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d8e4dac2-5cbf-4bed-bf24-2ff045452830\"}":{"__typename":"DeepDives","uuid":"d8e4dac2-5cbf-4bed-bf24-2ff045452830","content":"\u003cp\u003eOut of all the things I could be doing, I choose mentorship because I know what it feels like to struggle. I’ve experienced moments of self-doubt and uncertainty, and I wouldn’t be where I am today without the mentors who believed in me before I fully believed in myself. Their encouragement pushed me to excel, not just academically or athletically, but as a person.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship showed me the power of someone taking the time to listen, guide, and invest in another person’s growth. Because of the mentors in my life, I learned that success isn’t meant to be kept, it’s meant to be shared. If we want to change the world in a lasting way, we have to keep training and uplifting the next generation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e89936e8-b9ec-4201-93c6-0d3e6fc780e4\"}":{"__typename":"DeepDives","uuid":"e89936e8-b9ec-4201-93c6-0d3e6fc780e4","content":"\u003cp\u003eMy dream job is to become a physician-advocate, providing direct care while also working to change the systems that affect patient outcomes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"be5a73c0-91fd-41f1-826c-9f7e880d6685\"}":{"__typename":"School","uuid":"be5a73c0-91fd-41f1-826c-9f7e880d6685","name":"Western Center Academy","city":"Hemet","type":"HIGH","state":"California","country":"United States","zip":"92543"},"Education:{\"uuid\":\"d55f61ea-627c-4e3d-82ea-6bd7dd3f258b\"}":{"__typename":"Education","uuid":"d55f61ea-627c-4e3d-82ea-6bd7dd3f258b","school":{"__ref":"School:{\"uuid\":\"be5a73c0-91fd-41f1-826c-9f7e880d6685\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"85e848f0-2fb3-4ac0-8d63-5492921fa1b2\"}":{"__typename":"Education","uuid":"85e848f0-2fb3-4ac0-8d63-5492921fa1b2","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Molecular Biophysics and Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"7b5e833c-5a1b-4eb9-bee8-89826a6d1491\"}":{"__typename":"MentorPublicProfile","uuid":"7b5e833c-5a1b-4eb9-bee8-89826a6d1491","displayName":"Ariana M.","slug":"ariana-martinez-1","biography":"\u003cp\u003eAriana (Ari for short) is a Yale University student originally from Southern California. She is currently a Junior at Yale getting her B.S. in Molecular Biophysics and Biochemistry while simultaneously working on an independent research project focused on protein dynamics at Yale in the Davis Lab. Ari is also an editor of Yale University’s Symposia Journal, a coordinator of the Yale Community Kitchen, a member of Yale College Council, and winner of both the Yale Undergraduate First Year Fellowship and Yale Deans Fellowship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school Ari got a 1500 on the SAT, was captain of her schools First Tech Challenge Robotics team for five years (two time semifinalist), president of National Honors society, and CIF Swimming/Diving Winner in 2023. She graduated with a 4.81 taking 12 AP classes, 13 dual enrollment classes, and balancing research/varsity athletics.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAri has extensive experience tutoring across subjects and grade levels, with particular strength in math and STEM-related coursework. She tutors all levels of math, including K–6 Math, Pre-Algebra, Algebra I \u0026amp; II, Geometry, Precalculus \u0026amp; Trigonometry, and Calculus, and is comfortable supporting students in additional subjects as needed. Having taken a wide range of rigorous coursework herself, Ari understands how to break down complex material in a way that feels approachable and manageable. Ari has helped several students excel from barely passing classes to exceeding expectations and successfully advancing into higher coursework at the top of their class.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics, Ari is especially passionate about helping students develop strong systems for success. She works closely with students on organization, study strategies, time management, and habit-building and recognizes that excelling in school often depends just as much on \u003cem\u003ehow\u003c/em\u003e you work as on \u003cem\u003ewhat\u003c/em\u003e you’re learning. Her approach is highly individualized, meeting students where they are and helping them build confidence alongside skills.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, Ari is deeply interested in human rights, advocacy, and service, particularly in areas related to health, equity, and community care. She brings empathy, patience, and encouragement into her teaching style, creating a supportive environment where students feel safe asking questions and making mistakes. Ari also enjoys any activity in the water, from swimming for her school to playing waterpolo and surfing. Ari is an avid chess player with a \u003cu\u003echess.com\u003c/u\u003e rating of 1700.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAri strongly believes that students don’t have to fit into a single box. You are academic, creative, athletic, curious, and still figuring things out all at once. If you’re feeling overwhelmed, juggling multiple commitments, or just need someone who genuinely cares about your growth, Ari would love to help… So if you are ready to take the next step please reach out!!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI now also tutor MCAT prep!\u003c/p\u003e","teachingVideoPlaybackId":"acag9xdVCn02uOCw15qaC7Y4g9qZJYb8HT9mrMnSJDgc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular Biophysics and Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e6f93602-34ac-41a5-b9cc-6d6ab1e159d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"3286cbf3-1775-48d9-87f1-88fa7da3e2b8\"}"},{"__ref":"DeepDives:{\"uuid\":\"d8e4dac2-5cbf-4bed-bf24-2ff045452830\"}"},{"__ref":"DeepDives:{\"uuid\":\"e89936e8-b9ec-4201-93c6-0d3e6fc780e4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/26c5e250-b100-4d87-8c14-0a1b8510fbd3/-/preview/-/format/jpg/","https://ucarecdn.com/61b160c0-b443-41e2-9cbf-584e3619d009/-/preview/-/format/jpg/","https://ucarecdn.com/37667520-8f4c-4262-880f-3c9cf292b035/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d55f61ea-627c-4e3d-82ea-6bd7dd3f258b\"}"},{"__ref":"Education:{\"uuid\":\"85e848f0-2fb3-4ac0-8d63-5492921fa1b2\"}"}],"hiredAt":"2026-01-19T18:49:56.250Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Chemistry","Physics","Writing","American Sign Language","Academic Coaching","College Essay
