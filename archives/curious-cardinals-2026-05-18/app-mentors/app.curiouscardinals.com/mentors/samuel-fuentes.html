xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"09c6d5db-c77e-494b-884d-b711f62f2a33\"}":{"__typename":"DeepDives","uuid":"09c6d5db-c77e-494b-884d-b711f62f2a33","content":"\u003cp\u003eMy two main hobbies are almost opposites in location. During the day, I like to run, cycle and swim (I'm currently training for a triathlon). \u003cbr\u003e\u003cbr\u003eDuring the mornings and evenings I enjoy reading quite a bit. Right now I'm very into 20th century history with various novels sprinkled in between!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e87d8b09-e151-463b-b278-dac4c5d0f291\"}":{"__typename":"DeepDives","uuid":"e87d8b09-e151-463b-b278-dac4c5d0f291","content":"\u003cp\u003eAsk for help! It is definitely possible to do well by yourself, but I think the depth and breadth of your knowledge can be greatly expanded by learning with/from others and it can be more fun as well. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"811b233e-f499-4180-8978-a19e8fe5ab04\"}":{"__typename":"DeepDives","uuid":"811b233e-f499-4180-8978-a19e8fe5ab04","content":"\u003cp\u003eI hope to make a significant contribution to an area of biomedical research. I don't know what area specifically, but I love the research process and the ability to answer large questions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"1daf2ea9-a9b6-465d-9716-b5139fb84b5e\"}":{"__typename":"DeepDives","uuid":"1daf2ea9-a9b6-465d-9716-b5139fb84b5e","content":"\u003cp\u003eI'm proud of my work as a Medical Spanish Translator at my undergrad's free clinic. I worked very hard to improve my Spanish and be able to translate well. I was proud to be able to help people through problems that my grandparents and other family members faced here in the US. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"48d4a1f6-dbb6-4d73-8ec9-744b7ce06f5b\"}":{"__typename":"School","uuid":"48d4a1f6-dbb6-4d73-8ec9-744b7ce06f5b","name":"West Covina High School","city":"West Covina","type":"HIGH","state":"California","country":"United States","zip":"91791"},"Education:{\"uuid\":\"df44b64d-158e-422e-8d59-0116907783a5\"}":{"__typename":"Education","uuid":"df44b64d-158e-422e-8d59-0116907783a5","school":{"__ref":"School:{\"uuid\":\"48d4a1f6-dbb6-4d73-8ec9-744b7ce06f5b\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"20d11b6b-ecc2-42c2-a73e-1142272fcf8d\"}":{"__typename":"Education","uuid":"20d11b6b-ecc2-42c2-a73e-1142272fcf8d","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Human Biology ","degree":null},"MentorPublicProfile:{\"uuid\":\"74797bfb-6108-4cfd-ba87-effdacda3e69\"}":{"__typename":"MentorPublicProfile","uuid":"74797bfb-6108-4cfd-ba87-effdacda3e69","displayName":"Samuel F.","slug":"samuel-fuentes","biography":"\u003cp\u003eHi, my name is Samuel Fuentes. I am from Los Angeles, California, and I graduated from Stanford in Human Biology in 2022. My mom is a teacher but raised my brother and me full-time while growing up. I like to think I was her first student, and one of the lessons she imparted to me was a love of teaching. One of the reasons I am pursuing a career in medicine is because I want to be able to educate my patients and help them live healthier lives. I have a long way to go in that journey, so I am extremely excited that I will be able to continue to teach and learn from students through Curious Cardinals. While my area of study is in medicine, I have a wide range of interests, from statistics to computer science (my major concentration) to history and literature. I've pursued each of these thoroughly in and out of school. \u003cbr\u003e\u003cbr\u003eOutside of my professional and academic interests, I love getting outside. From my profile pictures above, you can see me in a very happy mood after summiting Mt. Whitney and another picture of my recent trip to Vietnam. Before starting medical school this year, I am training for an Ironman. Resting after runs or cycling gives me plenty of time for my other hobby, reading. Currently, I'm reading Beloved by Toni Morrison (I'll try to keep this updated with what I'm reading). \u003cbr\u003e\u003cbr\u003eI hope to have the privilege of teaching you. \u003cbr\u003e\u003c/p\u003e","teac
