outh America. It's a stunning region and a delight for anyone who loves nature like me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5b501eaa-4a74-4449-9d28-e6793d01bc22\"}":{"__typename":"DeepDives","uuid":"5b501eaa-4a74-4449-9d28-e6793d01bc22","content":"\u003cp\u003eMalcom X is someone I admire for his steadfastness in the face of injustice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"7dcdda83-b382-4e45-9769-ab1f28859ebe\"}":{"__typename":"School","uuid":"7dcdda83-b382-4e45-9769-ab1f28859ebe","name":"BASIS Independent Silicon Valley Upper School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95126"},"Education:{\"uuid\":\"f94ca22f-3f6a-4e89-b64d-8ce06ccd221e\"}":{"__typename":"Education","uuid":"f94ca22f-3f6a-4e89-b64d-8ce06ccd221e","school":{"__ref":"School:{\"uuid\":\"7dcdda83-b382-4e45-9769-ab1f28859ebe\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"5ecfbca3-ed2b-45b3-9f40-59e980eb3b22\"}":{"__typename":"Education","uuid":"5ecfbca3-ed2b-45b3-9f40-59e980eb3b22","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"Testimonial:6f222593-ca75-4836-b213-ecac90f7f710":{"__typename":"Testimonial","id":"6f222593-ca75-4836-b213-ecac90f7f710","text":"Ayush has been an exceptional mentor to our son, Sahaj. Over the past several months, he has not only helped him grow technically but also nurtured his problem-solving mindset and creative confidence. Whether it was patiently debugging code, introducing new concepts, or encouraging independent exploration, Ayush created a safe and inspiring learning environment.\n\nWhat truly sets Ayush apart is his thoughtful and thorough teaching style. Whenever Sahaj encounters a challenging concept, Ayush doesn’t just move on — he takes the time to slow down, revisit the topic, and make sure Sahaj fully understands it before taking the next step. And when introducing something entirely new, Ayush dives deep, breaking down complex ideas into manageable, relatable parts. That level of depth and patience has helped Sahaj build not just skills, but true understanding.\n\nA great example of the impact Ayush has had is the photography website Sahaj created — a spontaneous project that stemmed from the confidence and curiosity Ayush helped cultivate. The project they were working on together also came to life under Ayush’s guidance, and seeing it actually run was a big milestone.\n\nAyush’s calm, consistent support and ability to meet students where they are have made a lasting impact. His mentorship has shaped Sahaj’s interest in computer science and AI — not just as a subject, but as a direction he genuinely wants to pursue.\n\nWe’re incredibly grateful for Ayush’s time, dedication, and the care he brings to every session.\n\nThank you, Ayush, for being such a thoughtful and transformative mentor!\n\n— Preeti Taneja","date":"2025-06-03 16:28:44.777+00","rating":5,"endorser":{"__typename":"Endorser","name":"Preeti Taneja","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"fa9658dd-b684-4e29-bb9f-6556f4d668ee\"}":{"__typename":"MentorPublicProfile","uuid":"fa9658dd-b684-4e29-bb9f-6556f4d668ee","displayName":"Ayush A.","slug":"ayush-agarwal","biography":"\u003cp\u003eI care about transforming the way we work and live through tech startups. I find startups fascinating because they change lives by, at the core of it, typing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI study Computer Science at Stanford, and have a particular interest in AI and Machine Learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I love taking classes on LLMs and the roots of AI/ML. Extracurricular wise, I love working on coding side projects with friends, brainstorming startup ideas, and networking with other founders. Professionally, I'm pursuing founding engineer roles at various VC-backed startups.\u003cbr\u003e\u003cbr\u003eI have a couple of unique accolades. In high school debate, I ended up ranking 4th in the nation for Public Forum. I also had a non-profit which raised over $30,000 and got featured on the New York Times for building computer labs in schools across the globe, including 6 in Tanzania.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of my unique combination of debate and technical fields like Computer Science, I have a lot of leeway to mentor on subjects across the board - not just CS or Math but also humanities, writing, reading, speaking, history, English, and on.\u003c/p\u003e","teachingVideoPlaybackId":"EhTvbvWMv87pf6BxmtgozQehHyU9dNovDkXcKjxxmyc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing featured on the New York Times for my non-profit, ClosingTheDivide, that built computer labs in schools across the world, including places like Tanzania.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"210dba1e-4b6c-4864-a32c-af97a964d004\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5ceae340-cc16-4ba3-adbd-2ea9d4f26f8a\"}"},{"__ref":"DeepDives:{\"uuid\":\"01bdc7dc-4fa2-40bf-ae23-cd5ddebfb3ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"4deb9ccb-ac5c-4986-91e2-f9531a19a980\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b
