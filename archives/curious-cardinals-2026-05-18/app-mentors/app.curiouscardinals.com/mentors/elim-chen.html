xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ecb2d59c-144e-4f75-a290-a17cb37dd33b\"}":{"__typename":"DeepDives","uuid":"ecb2d59c-144e-4f75-a290-a17cb37dd33b","content":"\u003cp\u003eIf I were to give advice to my younger self, I would definitely tell myself to say yes to more opportunities. I know it can be nerve wracking to try something new or do something you are unsure about, but pushing myself outside of my comfort zone has given me so many opportunities to grow as a person! It never hurts to at least try. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7438d5f1-6b03-4add-8474-1836b11d8263\"}":{"__typename":"DeepDives","uuid":"7438d5f1-6b03-4add-8474-1836b11d8263","content":"\u003cp\u003eGrowing up, I have been so fortunate to have had so many wonderful mentors who have guided and supported me through my endeavors. Because of their impact on my life, I want to do the same for other students. My goal is to be someone who can help students reach their full potential, be confident, and achieve their goals by working together! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"1b240237-7413-408d-9ec3-7bb7bd1c677b\"}":{"__typename":"DeepDives","uuid":"1b240237-7413-408d-9ec3-7bb7bd1c677b","content":"\u003cp\u003eAs an Asian American, I essentially grew up being immersed in two cultures and two languages. This experience has shown me the importance of cultural sensitivity, empathy, and diversity. Tailoring support to each student's unique background and learning style is extremely important to me, as I understand how much everybody's experiences shape them. I strive to create a learning environment where students feel seen, comfortable, and encouraged :) \u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"91eb11d4-05a0-4671-9e61-d9c657439c90\"}":{"__typename":"School","uuid":"91eb11d4-05a0-4671-9e61-d9c657439c90","name":"Sewickley Academy","city":"Sewickley","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"15143"},"Education:{\"uuid\":\"a9b97f29-38e9-422d-8c8a-30e046e9ee1f\"}":{"__typename":"Education","uuid":"a9b97f29-38e9-422d-8c8a-30e046e9ee1f","school":{"__ref":"School:{\"uuid\":\"91eb11d4-05a0-4671-9e61-d9c657439c90\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"55d6c3a8-9dde-46b1-81eb-d1341438916f\"}":{"__typename":"Education","uuid":"55d6c3a8-9dde-46b1-81eb-d1341438916f","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"6b86c9c1-6d67-461e-bd2a-6bcb0786412d\"}":{"__typename":"MentorPublicProfile","uuid":"6b86c9c1-6d67-461e-bd2a-6bcb0786412d","displayName":"Elim C.","slug":"elim-chen","biography":"\u003cp\u003e\u003cstrong\u003eAbout Me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi everyone! My name is Elim, and I am currently a senior majoring in Biological Sciences with a minor in Biomedical Engineering at Carnegie Mellon University. I was also born and raised here in Pittsburgh! After graduation, I’m super excited to be starting medical school in the fall.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Experiences\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI have always been super passionate about science and global health. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eHere are some of my favorite experiences through college: \u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConducted ophthalmology research and helped with designing research projects. I am currently working on an age-related study with rats!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as Vice President, then President, of Global Medical Brigades, where I have led 3 medical brigades to Honduras, Guatemala, and Belize\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as Social Chair, Vice President, and now President, of Doctors of Carnegie Society, the largest pre-health organization on campus.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBeen nominated for the Senior Leadership Recognition Award\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAside from science, I have always loved reading and writing as well!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I Can Help You!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI work with students who are interested in starting organizations, large-scale events, or even their own research projects!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI also work with students who want to strengthen their skills in biology, basic math and statistics, and essay writing.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eIn high school, I served as a Peer Tutor in math, Chinese, and essay writing. I also coached tennis for kids ages 6-16 throughout my summers, which I absolutely loved!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIn college, I have:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eServed as a teaching assistant for 3 courses: first year course where I mentored students transitioning into college, Modern Biology Laboratory, and a Masters-level Biology Lab Course\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI actively maintain a Mentor-Mentee program within Doctors of Carnegie Society, where we hope to provide guidance on navigating the pre-health track!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWhat a typical session might look like with me:\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eLearning about what your goals, learning style, and interests are\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a lesson timeline for our next sessions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorking through tricky concepts through examples and socratic questioning\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing problems together step by step\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEnding with a summary of concepts and tasks to practice for our next session\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSome Fun Facts!\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I love:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eReading books (especially romance and fantasy books)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorking out – tennis, running, solidcore\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWatching reality TV shows\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTraveling with my friends and family!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"GoAyDWQvHBRuPbUQweqZsDsV00HpyvYjnFkx02w7uTosw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ecb2d59c-144e-4f75-a290-a17cb37dd33b\"}"},{"__ref":"DeepDives:{\"uuid\":\"7438d5f1-6b03-4add-8474-1836b11d8263\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b240237-7413-408d-9ec3-7bb7bd1c677b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0411b55e-c1db-4397-b08c-2647e1cb6230/-/preview/-/format/jpg/","https://ucarecdn.com/6b9bc371-1dfa-454e-a49f-2a9bbce33892/-/preview/-/format/jpg/","https://ucarecdn.com/aabc5471-45cb-49ff-825c-75b8d52a1976/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a9b97f29-38e9-422d-8c8a-30e046e9ee1f
