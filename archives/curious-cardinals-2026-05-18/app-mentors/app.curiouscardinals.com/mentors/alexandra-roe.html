xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"53e33876-ba44-46fa-a787-c3b210caf64d\"}":{"__typename":"Favorites","uuid":"53e33876-ba44-46fa-a787-c3b210caf64d","photoUrl":"https://ucarecdn.com/f24142f8-143d-4364-b0c5-a8bec01faaac/","title":"Reneé Rapp","type":"ACTOR"},"Favorites:{\"uuid\":\"4d28d668-e3ed-4795-acdc-71ae72a68dfc\"}":{"__typename":"Favorites","uuid":"4d28d668-e3ed-4795-acdc-71ae72a68dfc","photoUrl":"https://ucarecdn.com/0fc47d19-e8be-4059-80d7-03a65f87cb44/","title":"New York","type":"CITY"},"Favorites:{\"uuid\":\"bdc56de8-b053-4f17-948c-bb95bc1fb90a\"}":{"__typename":"Favorites","uuid":"bdc56de8-b053-4f17-948c-bb95bc1fb90a","photoUrl":"https://ucarecdn.com/a26249a4-b979-488d-86a8-fdcdffefdecb/","title":"The Devil Wears Prada","type":"MOVIE"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"f88f5b03-060a-44a5-b2f2-18f254919f10\"}":{"__typename":"DeepDives","uuid":"f88f5b03-060a-44a5-b2f2-18f254919f10","content":"\u003cp\u003eMentoring allows me to make a tangible impact and help students unlock their potential! As the oldest of three, I’ve naturally taken on a mentorship role—helping my siblings with school, guiding them through challenges, and supporting them in their growth. Working as a nanny and an assistant art teacher reinforced these skills, teaching me how to be patient, adaptable, and encouraging. I know how to break down complex ideas, adjust to different learning styles, and create a positive environment where students feel confident and supported.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bfaf9e0f-b4e3-4ae2-9052-df91bf521411\"}":{"__typename":"DeepDives","uuid":"bfaf9e0f-b4e3-4ae2-9052-df91bf521411","content":"\u003cp\u003eBe kind to yourself, trust your instincts, and remember—who you are is already enough! You don’t need to wait for permission to take up space, to share your thoughts, or to chase what excites you. Speak up in class, even if your voice shakes. Try new things, even if you’re afraid of failing! The more you step outside your comfort zone, the more your confidence will grow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ed0ee104-3229-472e-8b95-606e3dae07cc\"}":{"__typename":"DeepDives","uuid":"ed0ee104-3229-472e-8b95-606e3dae07cc","content":"\u003cp\u003eI decided to major in German because I have a strong connection to the German-American community. Growing up, I attended after-school German classes and spent my summers at Waldsee, a German immersion camp in Minnesota. In my Georgetown classes, I enjoy studying German art and literature. My favorite writers are Goethe and Bertolt Brecht, and my favorite artists are Max Liebermann, Franz Marc, and Adolph Menzel.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs for economics, I enjoy analytical thinking and understanding how markets work. Upon my graduation, I will be working on Wall Street at an asset management firm specializing in growth equity investing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"06d398e8-5a2b-437d-9ac6-994779a5da3f\"}":{"__typename":"School","uuid":"06d398e8-5a2b-437d-9ac6-994779a5da3f","name":"The Spence School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"16aaf5e5-95e9-4b89-bab8-b7f5d2ac913b\"}":{"__typename":"Education","uuid":"16aaf5e5-95e9-4b89-bab8-b7f5d2ac913b","school":{"__ref":"School:{\"uuid\":\"06d398e8-5a2b-437d-9ac6-994779a5da3f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"1b0cf3d0-f7dd-4bc8-b77a-80c40ceccc6d\"}":{"__typename":"Education","uuid":"1b0cf3d0-f7dd-4bc8-b77a-80c40ceccc6d","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"German \u0026 Economics","degree":null},"Testimonial:b7411584-cf55-442d-8271-b8686f21a4d0":{"__typename":"Testimonial","id":"b7411584-cf55-442d-8271-b8686f21a4d0","text":"Alexandra was the perfect match for me! Over the 10 weeks we were paired, I looked forward to our meetings and working on my passion projects! Best ever 💜","date":"2025-08-31 20:54:06.373+00","rating":5,"endorser":{"__typename":"Endorser","name":"Gali Yehezkel","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"af1e39b8-f356-4a9b-9b06-c1e3c172ca63\"}":{"__typename":"MentorPublicProfile","uuid":"af1e39b8-f356-4a9b-9b06-c1e3c172ca63","displayName":"Alexandra R.","slug":"alexandra-roe","biography":"\u003cp\u003eHi there! I'm Alexandra, a Georgetown senior studying German and Economics. I’ve always loved learning, and I know firsthand how important the right support and encouragement can be. I also studied in Berlin, where I took courses in German business culture, film, and art history, so I enjoy bringing real-world connections into my lessons. I’m excited to help students build confidence, improve their skills, and achieve their academic goals!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics, I’m passionate about finance, marketing, and entrepreneurship. Growing up, I was obsessed with making art (I even submitted an art portfolio to Georgetown), so I love blending analytical thinking with creative strategy. On campus, I work with students through Georgetown Ventures, our student-run startup accelerator, to help young entrepreneurs with branding, website design, and social media marketing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe every student has unique strengths, and my goal is to help them discover their potential in a supportive and encouraging environment. As the oldest of three, and with experience as a part-time nanny and assistant teacher, I’m well-equipped to work with a wide range of students!\u003c/p\u003e","teachingVideoPlaybackId":"he31x02KWzFNukSbm8FdzB6SWD3jY4YsZ5GSqXbq9BGw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my greatest accomplishments was winning a princess title (first runner-up) in the 2023 Miss German-America competition, an experience that allowed me to embrace and celebrate my heritage. Competitors submitted essays, a resume, a cover letter, and participated in interviews and an audience vote. Representing my community was both an honor and a responsibility, as it gave me the chance to promote German culture and connect with others who share a similar background.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI developed valuable skills in public speaking (I was interviewed on live television for Good Morning America!), leadership, and cultural advocacy. I participated in cultural events that highlighted German heritage across the tri-state area (you might have seen me in the Steuben Day Parade on 5th Avenue in NYC) and build lifelong relationships with individuals who are also passionate about sharing their roots.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"53e33876-ba44-46fa-a787-c3b210caf64d\"}"},{"__ref":"Favorites:{\"uuid\":\"4d28d668-e3ed-4795-acdc-71ae72a68dfc\"}"},{"__ref":"Favorites:{\"uuid\":\"bdc56de8-b053-4f17-948c-bb95bc1fb90a\"}"}],"causesSupported":[],"major":"German \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f88f5b03-060a-44a5-b2f2-18f254919f10\"}"},{"__ref":"DeepDives:{\"uuid\":\"bfaf9e0f-b4e3-4ae2-9052-df91bf521411\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed0ee104-3229-472e-8b95-606e3dae07cc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/51169c5f-6a99-4189-9b3b-a707be3acd84/-/preview/-/format/jpg/","https://ucarecdn.com/d7f1d689-79db-4234-9363-9508e5542cee/-/preview/-/format/jpg/","https://ucarecdn.com/b9e26961-8454-42a6-b698-d22a85c71549/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"16aaf5e5-95e9-4b89-bab8-b7f5d2ac913b\"}"},{"__ref":"Education:{\"uuid\":\"1b0cf3d0-f7dd-4bc8-b77a-80c40ceccc6d\"}"}],"hiredAt":"2025-02-05T14:07:24.409Z","topics":["Writing","German","Academic Coaching","Executive Function","Reading","History","Fashion / Cosmetics","Visual Arts / Graphic Design","History Project","Creative Writing","K-6 Storybook","Video / Photography","Business / Entrepreneurship","Finance / Investing"],"communityBadges":["https://ucarecdn.com/4898ea96-6627-4c32-80af-8dd44881bd39/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:b7411584-cf55-442d-8271-b8686f21a4d0"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexandra-roe\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"af1e39b8-f356-4a9
