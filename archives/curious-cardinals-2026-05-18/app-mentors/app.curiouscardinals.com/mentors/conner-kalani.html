xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6ec1ba42-fae9-443c-9fc6-397f77c38467\"}":{"__typename":"DeepDives","uuid":"6ec1ba42-fae9-443c-9fc6-397f77c38467","content":"\u003cp\u003eAlways chase what interests you, it will lead to great things. I've lived my life so far simply chasing whatever is the most exciting at the time, whether that understanding markets, writing code in high-frequency markets, or trading cryptocurrencies! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBy chasing what you love, you'll undoubtedly become exceptional at it. Once you're exceptional in something, great things tend to follow :) \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"38381ff4-aa2a-473a-85c9-7b884df82a0b\"}":{"__typename":"DeepDives","uuid":"38381ff4-aa2a-473a-85c9-7b884df82a0b","content":"\u003cp\u003eMy role models are 2 teachers I had back in high school. They've shaped how I view life and still guide me through my various adventures today. I simply hope to guide one or two students' lives in the same way my role models have done for me and pass on the little knowledge I've learned about life to the next generation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0f053347-cd30-4802-92f8-fde36a4ab97d\"}":{"__typename":"DeepDives","uuid":"0f053347-cd30-4802-92f8-fde36a4ab97d","content":"\u003cp\u003eEver since high school, I've been fascinated by high-frequency trading. Getting my hands dirty and writing arbitrage bots myself, I found myself having to learn to write faster and faster code to outcompete others. To become the best in the world, I knew I would have to choose computer science as my major to follow this passion. There was no better place than Stanford to become exceptional in this discipline. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"2536d53c-65d5-4daa-92c8-7f3d6e9e0616\"}":{"__typename":"DeepDives","uuid":"2536d53c-65d5-4daa-92c8-7f3d6e9e0616","content":"\u003cp\u003eThe strongest form of motivation I've ever found is simply doing what I love. Once I discovered the things I love to do in life, losing track of time and working 16 hours a day on specific problems not only became easy but natural. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"741299fd-9f23-44bd-9e77-471c400cd06c\"}":{"__typename":"School","uuid":"741299fd-9f23-44bd-9e77-471c400cd06c","name":"The American School in Japan","city":"Chofu","type":"HIGH","state":"Tokyo","country":"Japan","zip":"182-0031"},"Education:{\"uuid\":\"2cf25983-9edb-4d2b-a806-86fa380e3ac0\"}":{"__typename":"Education","uuid":"2cf25983-9edb-4d2b-a806-86fa380e3ac0","school":{"__ref":"School:{\"uuid\":\"741299fd-9f23-
