js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"44a28c3d-88ab-4933-8dfd-f0c2ebd1e741\"}":{"__typename":"DeepDives","uuid":"44a28c3d-88ab-4933-8dfd-f0c2ebd1e741","content":"\u003cp\u003eI would tell my younger self to breathe a little deeper and stop rushing toward a future she thinks she has to earn in one perfect attempt. I would tell her that she is allowed to try, fail, restart, reinvent, and wander for a while. Nothing meaningful grows in a straight line. The paths that seem confusing now will one day make sense, and the things she thinks are weaknesses will become the very places where her strength learns to take shape.\u003c/p\u003e\u003cp\u003eI would tell her to trust her curiosity. The hours she spends experimenting with beauty, sketching ideas for small businesses, writing in the margins of notebooks, or losing herself in thoughts about the world are not distractions. They are early signs of the person she is becoming. I would want her to know that she does not need to shrink herself to fit into expectations. She is allowed to love fashion and finance at the same time. She is allowed to be creative and analytical in the same breath. She is allowed to dream bigger than the people around her understand.\u003c/p\u003e\u003cp\u003eI would tell her that it is okay not to know her purpose yet. Ikigai is not something you find in one moment. It grows with you. It shifts as you grow into your voice. I would tell her to keep noticing the small things that make her feel alive, like the smell of a new book, the quiet of early mornings, the comfort of a café, or the way writing helps her understand herself. These pieces will eventually become her compass.\u003c/p\u003e\u003cp\u003eMost of all, I would tell her to be kinder to herself. She works so hard, often without realizing how much she is carrying. I would remind her that she does not need to prove her worth through achievements. She is worthy simply because she exists, and the world will open for her in ways she cannot yet imagine. Her job is to stay curious, stay open, and trust that all the versions of herself she is afraid to outgrow will someday thank her for becoming someone stronger, softer, wiser, and more whole.\u003c/p\u003e\u003cp\u003eAnd I would tell her this: you do not have to have everything figured out. You only need to keep going. Your future self is proud of you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"aa5a2e87-9649-4439-8ac0-89b5c77ab9a3\"}":{"__typename":"DeepDives","uuid":"aa5a2e87-9649-4439-8ac0-89b5c77ab9a3","content":"\u003cp\u003eMy heritage shapes the way I teach in ways I did not always understand when I was younger. Growing up in India meant growing up surrounded by a culture that treats learning as something both intimate and communal. Knowledge is not only what you study in a classroom. It is what you absorb by watching people, by listening to stories, by noticing the small details around you. That shaped me more than any textbook ever could. I teach with that same spirit. I want my students to feel that learning is not a narrow path but a wide landscape they can walk through at their own pace.\u003c/p\u003e\u003cp\u003eBeing Indian also taught me the value of resilience and resourcefulness. I grew up in a place where people build dreams out of whatever they have, where creativity and practicality live side by side. Because of that, I teach students to be adaptable, to think outside the box, to experiment, and to use whatever tools and stories their identities give them. I want them to see that their background is not something to hide or minimize. It is something that deepens their perspective and enriches their work.\u003c/p\u003e\u003cp\u003eMy identity as a global student adds another layer. Studying and living across countries opened my eyes to how differently people learn and express themselves. That experience made me a patient and intuitive mentor. I listen first. I try to understand how a student thinks before I guide them. I know what it feels like to navigate new systems, new expectations, and new environments, so my teaching is gentle, encouraging, and rooted in empathy.\u003c/p\u003e\u003cp\u003eCulturally, I grew up with the belief that knowledge should be shared generously. That teaching is not about hierarchy but about understanding someone’s dreams and helping them build a path toward them. That is the energy I bring to mentoring. I want students to feel safe, inspired, and grounded in who they are. I want them to see that their identity is not a barrier but a source of richness, creativity, and direction.\u003c/p\u003e\u003cp\u003eIn many ways, my heritage taught me to value curiosity, community, humility, and purpose. These values guide every session I lead. They shape the way I connect with students, the questions I ask, and the way I help them discover who they want to become.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"90d46778-1b1d-4a24-ba1a-e17488852f2d\"}":{"__typename":"DeepDives","uuid":"90d46778-1b1d-4a24-ba1a-e17488852f2d","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to build a life that feels real to me. I want a life that is full of honesty, depth, and a sense of calm that comes from knowing I chose my path for myself. Not because it looked good on paper. Not because it was expected of me. I want to wake up one day and feel that the way I am living reflects the person I have slowly grown into.\u003c/p\u003e\u003cp\u003eI want to create something that makes people feel understood. When I was younger, I often carried my ambitions quietly and my confusion alone. I wished someone would sit beside me and say that it is normal to feel lost, and that there is nothing wrong with wanting a life that is both creative and practical. If I can build a space, a project, or even a small community where students and young people feel seen in this way, I would feel like I have done something meaningful.\u003c/p\u003e\u003cp\u003eI want to write something honest before my life ends. Nothing dramatic and nothing perfect. Just something true. Something that comes from the moments I never talk about, the moments that shaped me quietly. If a person I have never met reads my words and feels less alone, that would mean everything to me.\u003c/p\u003e\u003cp\u003eI hope to learn how to stay soft in a world that often teaches hardness. I want to become someone who chooses curiosity over fear and growth over comfort. I want to learn how to step back, to breathe, and to trust that becoming yourself is a lifelong process.\u003c/p\u003e\u003cp\u003eMost of all, I hope I can build a life that feels peaceful. A life where the people around me feel loved and appreciated. A life where my work has heart. A life where I feel at home in my own body and my own choices. If I can reach that place, quietly and steadily, I will consider that the greatest accomplishment of my lifetime.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"fc4fac8a-6bd9-4a15-8322-4e03845650a4\"}":{"__typename":"DeepDives","uuid":"fc4fac8a-6bd9-4a15-8322-4e03845650a4","content":"\u003cp\u003eI choose mentorship because I know what it feels like to look at your future and see a blur instead of a path. I know what it feels like to work hard without knowing if your efforts are pointed in the right direction. I know what it feels like to have dreams that feel too big for the space you are standing in. When I was younger, I would have given anything for someone who could sit with me, listen without judgment, and help me understand where my strengths and passions could take me. I want to be that person for someone else.\u003c/p\u003e\u003cp\u003eMentorship gives me a chance to offer the kind of support I once needed. It allows me to help a student connect pieces of themselves they never realized belonged together. Beauty and business. Creativity and logic. Ambition and uncertainty. I love showing students that their identity and interests are not scattered. They are seeds that can grow into something strong when someone teaches you how to nurture them.\u003c/p\u003e\u003cp\u003eThere is something deeply human about mentorship. It is not about telling someone who they should be. It is about helping them see who they already are. It is about guiding them toward their own clarity, not mine. It is about being present for the moments when a student finally understands their potential. Those small shifts are powerful. They stay with you.\u003c/p\u003e\u003cp\u003eI choose mentorship because I believe in the ripple effect. When you help one young person find confidence or purpose, you are not just helping them. You are shaping the communities they will build, the ideas they will create, and the lives they will touch. You are helping them become someone who will one day mentor others.\u003c/p\u003e\u003cp\u003eI choose mentorship because it feels real. It feels meaningful. It feels like work that aligns with who I am. I like listening. I like understanding people. I like guiding someone toward their own north star or ikigai. And I believe that if I can make even one student feel more hopeful, more capable, or more grounded, then I have spent my time in a way that matters.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"27cd1df0-b506-4ef8-af05-f13fd9dcec86\"}":{"__typename":"School","uuid":"27cd1df0-b506-4ef8-af05-f13fd9dcec86","name":"Vidya Bhavan School and Jr College","city":"Pune","type":"HIGH","state":"Maharashtra","country":"India","zip":"411016"},"Education:{\"uuid\":\"d9714411-b211-4e16-9398-73cae0650035\"}":{"__typename":"Education","uuid":"d9714411-b211-4e16-9398-73cae0650035","school":{"__ref":"School:{\"uuid\":\"27cd1df0-b506-4ef8-af05-f13fd9dcec86\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}":{"__typename":"School","uuid":"0a298df6-dac8-4a1d-8e35-77e7b609185d","name":"Minerva University","city":"San Francisco","type":"COLLEGE","state":"California","country":"United States","zip":"94103"},"Education:{\"uuid\":\"acc3e29f-b3bc-440b-b368-c12651ceb13d\"}":{"__typename":"Education","uuid":"acc3e29f-b3bc-440b-b368-c12651ceb13d","school":{"__ref":"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Business and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"ff5d7b1c-ffbc-4eb0-9a32-e3dc75bd6a42\"}":{"__typename":"MentorPublicProfile","uuid":"ff5d7b1c-ffbc-4eb0-9a32-e3dc75bd6a42","displayName":"Mansi M.","slug":"mansi-more","biography":"\u003cp\u003eI care most about helping students discover the parts of themselves that feel powerful, beautiful, and purposeful. I have always believed that learning becomes transformative when someone shows you how your interests, no matter how small or scattered they seem, can turn into something meaningful. My journey blends beauty, business, finance, entrepreneurship, technology, and creativity, and I love mentoring students who are just beginning to explore where their passions might lead.\u003c/p\u003e\u003cp\u003eI study Business, Finance, and Computer Science at Minerva University, a global undergraduate program that has taken me across cities and cultures and given me a deep appreciation for how people learn differently depending on where they come from. My academic world is a mix of financial modeling, entrepreneurial strategy, AI automation, and creative projects in fashion and beauty. I enjoy the intersection of these fields. I like understanding how a beauty brand grows, how a startup raises capital, how AI makes work easier, and how you can turn scattered ideas into a vision you can execute.\u003c/p\u003e\u003cp\u003eProfessionally, I have worked across venture capital, operations, educational nonprofits, and social impact initiatives. I have helped launch youth-focused NGO projects, contributed to strategy and analysis for startups, and supported teams in creating more efficient systems using AI tools. Each experience taught me how empowering it is when someone feels supported while exploring a big idea. I mentor from that place. I know how overwhelming it can be to choose a path, and I love helping students find clarity in their passions, strengths, and long-term goals. Whether a student wants to build a brand, start a community project, learn about investing, or experiment with AI to automate their workflows, I enjoy guiding them through those early steps.\u003c/p\u003e\u003cp\u003eOutside academics and work, I write constantly. Writing is where I reflect, dream, and try to understand the world. I spend my weekends wandering through cafés, journaling between sips of coffee, or taking photographs of quiet corners that feel like stories waiting to be told. These small rituals keep me grounded and help me notice beauty in the everyday. They also shape how I mentor. I care about confidence, expression, gentle exploration, and helping students connect deeply with themselves. I want every student I work with to feel safe, supported, and inspired.\u003c/p\u003e\u003cp\u003eIf you want guidance in beauty or creative expression, if you want to learn about entrepreneurship or finance, if you want to use AI in a smart and simple way, or if you just want help finding your north star or ikigai, I would be excited to mentor you. You do not need to have everything figured out. You only need curiosity, honesty, and the willingness to explore who you are becoming. I am here to support that journey.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"dmBS1A8deUixUOWORxzVbNBFkacowkQOZad6m302EVCg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"44a28c3d-88ab-4933-8dfd-f0c2ebd1e741\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa5a2e87-9649-4439-8ac0-89b5c77ab9a3\"}"},{"__ref":"DeepDives:{\"uuid\":\"90d46778-1b1d-4a24-ba1a-e17488852f2d\"}"},{"__ref":"DeepDives:{\"uuid\":\"fc4fac8a-6bd9-4a15-8322-4e03845650a4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ebe8ddb9-396e-481d-bdae-683006bb4b04/-/preview/-/format/jpg/","https://ucarecdn.com/5d3bf50f-e66c-4ccf-b904-5e3ee5101918/-/preview/-/format/jpg/","https://ucarecdn.com/46b1b2cd-4fef-4b61-9d29-2d28228aa727/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d9714411-b211-4e16-9398-73cae0650035\"}"},{"__ref":"Education:{\"uuid\":\"acc3e29f-b3bc-440b-b368-c12651ceb13d\"}"}],"hiredAt":"2025-11-03T01:20:09.743Z","topics":["Fashion / Cosmetics","Business / Entrepreneurship","Finance / Investing"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f5ae8359-9f55-41d8-a96b-8f3dc3ad05db/","https://ucarecdn.com/c278d819-50e0-435a-a1b0-1b3a8793462f/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mansi-more\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ff5d7b1c-ffbc-4eb0-9a32-e3dc75bd6a42\"}"}}},"_sentryTraceData":"f93f7569fa3a42dbbfa9281b9e3bff25-86591e36fd1518c7-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f93f7569fa3a42dbbfa9281b9e3bff25,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"mansi-more"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
