xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"583dd67c-7bb8-47d8-b5e6-775051c27c85\"}":{"__typename":"DeepDives","uuid":"583dd67c-7bb8-47d8-b5e6-775051c27c85","content":"\u003cp\u003eI love being outdoors wether that be hiking, skiing or playing tennis! I also enjoy painting, crocheting, and photography in my free time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7cf661f7-35cd-4684-a600-c1540c1a8a1e\"}":{"__typename":"DeepDives","uuid":"7cf661f7-35cd-4684-a600-c1540c1a8a1e","content":"\u003cp\u003eDon't let the fear of failure hold you back from trying new things or pursuing your dreams. Explore new subjects, hobbies, and experiences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"38f2c20c-5e1e-46bd-a80c-a4e270f3431b\"}":{"__typename":"DeepDives","uuid":"38f2c20c-5e1e-46bd-a80c-a4e270f3431b","content":"\u003cp\u003eI believe that everyone learns in different ways, and it's crucial for students to feel confident and enthusiastic about learning by finding the methods that work best for them. I want to be able to find each student’s best learning style, to foster a sense of empowerment and motivation that will fuel their academic success and personal growth. Ultimately, mentorship allows me to empower students to unlock their full potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"fc75b043-87b6-4419-8b6b-c8997b81cd06\"}":{"__typename":"DeepDives","uuid":"fc75b043-87b6-4419-8b6b-c8997b81cd06","content":"\u003cp\u003eMy greatest role model and mentor is my brother, who is also a Stanford student. He embodies qualities that I deeply admire and aspire to emulate. He is not only extremely driven and eager to learn all the time but also possesses a remarkable social intelligence and empathy. He genuinely cares deeply about others and goes out of his way to support and uplift those around him. His dedication to personal and academic growth, coupled with his compassion and kindness towards others, makes him an inspiring figure in my life. I am fortunate to have him as a role model and mentor who constantly motivates me to strive for excellence and make a positive impact in the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"993ef857-a9ee-42e8-8bd1-e344eb0f21d6\"}":{"__typename":"School","uuid":"993ef857-a9ee-42e8-8bd1-e344eb0f21d6","name":"Colegio Nueva Granada","city":"Bogotá","type":"HIGH","state":"Bogotá","country":"Colombia","zip":"110231"},"Education:{\"uuid\":\"d24c8914-ff62-435a-bc1d-a52be8f5be22\"}":{"__typename":"Education","uuid":"d24c8914-ff62-435a-bc1d-a52be8f5be22","school":{"__ref":"School:{\"uuid\":\"993ef857-a9ee-42e8-8bd1-e344eb0f21d6\"}"},"startYear":"2008","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"59575b17-74a4-4e24-a1c5-633dd60bbe5f\"}":{"__typename":"Education","uuid":"59575b17-74a4-4e24-a1c5-633dd60bbe5f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Symbolic Systems \u0026 Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"f1a8c784-963e-41fb-bff6-f69bc9f5ecfd\"}":{"__typename":"MentorPublicProfile","uuid":"f1a8c784-963e-41fb-bff6-f69bc9f5ecfd","displayName":"Nicole C.","slug":"nicole-cortes","biography":"\u003cp\u003eHI! Im Nicole and I am from Bogota Colombia. As a junior double majoring in Symbolic Systems and Psychology at Stanford University, my academic journey has been a combination of the human mind and technology. I\u0026nbsp; aim to understanding the intersection of cognition, behavior, and innovation, I've found myself drawn to disciplines that allow me to bridge the gap between the humanities and the sciences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I am the VPO of marketing in Stanford Latino and also part of the Stanford marketing group where I am able to apply my creativity and organizational skills to develop impactful marketing campaigns and foster community engagement. These roles have not only honed my leadership abilities but have also allowed me to connect with individuals from diverse backgrounds.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCareer-wise, I have worked in roles in Human Resources, advertising and tech consulting. These experiences have provided me with a versatile skill set, from conducting research and analysis to crafting compelling narratives and implementing strategic initiatives. One area that particularly excites me is the intersection of healthcare and technology.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my academic and professional pursuits, I am an avid advocate for personal growth and exploration. I thrive on stepping outside of my comfort zone, whether it's trying a new sport, learning a new language, or immersing myself in a different culture. In essence, I am a passionate and energetic individual with a diverse range of interests and experiences. With a commitment to excellence, a thirst for knowledge, and an unwavering optimism, I am excited to continue my journey of discovery and make meaningful impacts in peoples lives.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"JuvXpNaVNC6HfvhQaba001egSUu02q5dnnbwMiwQARrGM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems \u0026 Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"583dd67c-7bb8-47d8-b5e6-775051c27c85\"}"},{"__ref":"DeepDives:{\"uuid\":\"7cf661f7-35cd-4684-a600-c1540c1a8a1e\"}"},{"__ref":"DeepDives:{\"uuid\":\"38f2c20c-5e1e-46bd-a80c-a4e270f3431b\"}"},{"__ref":"DeepDives:{\"uuid\":\"fc75b043-87b6-4419-8b6b-c8997b81cd06\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9837604a-479a-459b-9c26-36a4b19af37c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d24c8914-ff62-435a-bc1d-a52be8f5be22\"}"},{"__ref":"Education:{\"uuid\":\"59575b17-74a4-4e24-a1c5-633dd60bbe5f\"}"}],"hiredAt":"2024-02-27T15:50:05.547Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","K-6 Storybook","Business / Entrepreneurship","Medicine / Health"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typena
