e trying out new foods and exploring different cities. Each new experience brings fresh perspectives and ideas that I enjoy bringing into our sessions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe that learning should be a dynamic and enjoyable process, and I aim to bring a bit of that excitement into our work together. My approach is all about making complex topics accessible and relatable, and I’m here to support you every step of the way.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLet’s make learning both rewarding and enjoyable, and have some fun along the way!\u003c/p\u003e","teachingVideoPlaybackId":"pA2RCLlrnScqRWOM1o02Y2IM47FQmsgP01qpmo01iO1VmY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business, Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d83f24e9-1134-49e9-a663-2954b70e464c\"}"},{"__ref":"DeepDives:{\"uuid\":\"84b7bc0b-1c1c-44b8-b39c-52e9a85c7853\"}"},{"__ref":"DeepDives:{\"uuid\":\"85d7de5d-b5da-464b-9077-3f63b5c6a37a\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f20702d-6114-43c7-825e-dad5d4e26251\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d2bdd5fd-0821-4114-b6c5-3b5961dd4392/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1f22c289-93be-4d7a-ba22-6bd99280e07c\"}"},{"__ref":"Education:{\"uuid\":\"cbce661d-c4f2-446c-8c5e-045d7a1d5488\"}"}],"hiredAt":"2024-08-30T11:32:45.717Z","topics":["Public Speaking","Finance / Investing","Coding / Programming","Machine Learning / AI","Negotiation","Philosophy","K-5 Grade Math","Pre-Algebra","Calculus","Statistics","Algebra I","Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tommy-yu\"}})":{"__
