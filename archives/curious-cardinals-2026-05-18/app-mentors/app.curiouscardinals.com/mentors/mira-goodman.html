xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"68d1ba95-9635-4cd0-ad92-89aabaf385f2\"}":{"__typename":"Favorites","uuid":"68d1ba95-9635-4cd0-ad92-89aabaf385f2","photoUrl":"https://ucarecdn.com/97efbd94-fa00-4d3f-a17e-91bbe7198499/","title":"Demon Copperhead","type":"BOOK"},"Favorites:{\"uuid\":\"e3ae1059-f9c8-495b-a8cb-7c61f306bd34\"}":{"__typename":"Favorites","uuid":"e3ae1059-f9c8-495b-a8cb-7c61f306bd34","photoUrl":"https://ucarecdn.com/ff1eea8e-7fe9-4e8a-a71b-ab9bddaaa372/","title":"Before Sunrise","type":"MOVIE"},"CausesSupported:{\"uuid\":\"ff53aa2a-fb17-4852-837a-72123f50227e\"}":{"__typename":"CausesSupported","uuid":"ff53aa2a-fb17-4852-837a-72123f50227e","name":"The Petey Greene Program","description":"\u003cp\u003eI worked as an academic mentor tutoring formerly incarcerated people.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4488c3fd-a033-45ac-8eae-5daaeeff383b\"}":{"__typename":"DeepDives","uuid":"4488c3fd-a033-45ac-8eae-5daaeeff383b","content":"\u003cp\u003eDon't worry so much! I know it sounds cliché but it really is true and I wish I spent less time in high school freaking out about what college I was going to get into and more time enjoying life! You only get to be a teenager in high school once in your life so enjoy it while you can!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"7bc1a332-cab7-4582-8d61-9f353abc0d95\"}":{"__typename":"DeepDives","uuid":"7bc1a332-cab7-4582-8d61-9f353abc0d95","content":"\u003cp\u003eI hope that I can successfully say I impacted one or multiple peoples lives in some way, either through art or through direct action. I would love to know that the work I'm doing has a meaningful effect in the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"58913c8a-fa01-4fa6-a171-a0d3930cf970\"}":{"__typename":"DeepDives","uuid":"58913c8a-fa01-4fa6-a171-a0d3930cf970","content":"\u003cp\u003eI went to summer camp, which was one of the most special and memorable times in my life. So much so, that I decided to work as an outdoor leader there for three summers. It is one of those places I will never forget, as it holds so many memories of growing up!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e93b9b2d-4f17-4a76-bb27-19e1eb6aa53e\"}":{"__typename":"DeepDives","uuid":"e93b9b2d-4f17-4a76-bb27-19e1eb6aa53e","content":"\u003cp\u003eMy thesis, which was a series of sculptural paintings, pieces of writing, and sculptures that I completed in my senior year of college. I put a lot of work into it and it represents a lot of intense, emotional, and meaningful experiences I've had in my life thus far.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"24485441-fae0-4d1c-9735-c2db6ad91b82\"}":{"__typename":"School","uuid":"24485441-fae0-4d1c-9735-c2db6ad91b82","name":"Mamaroneck High School","city":"Mamaroneck","type":"HIGH","state":"New York","country":"United States","zip":"10543"},"Education:{\"uuid\":\"b3bbd45b-0a76-40e3-8ef5-d961c3a7f6b3\"}":{"__typename":"Education","uuid":"b3bbd45b-0a76-40e3-8ef5-d961c3a7f6b3","school":{"__ref":"School:{\"uuid\":\"24485441-fae0-4d1c-9735-c2db6ad91b82\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"6cc33b16-6ed9-4a41-9ab4-44a69c674110\"}":{"__typename":"Education","uuid":"6cc33b16-6ed9-4a41-9ab4-44a69c674110","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Visual Arts","degree":null},"MentorPublicProfile:{\"uuid\":\"c2991368-3878-4f9b-8cf0-2480284d640e\"}":{"__typename":"MentorPublicProfile","uuid":"c2991368-3878-4f9b-8cf0-2480284d640e","displayName":"Mira G.","slug":"mira-goodman","biography":"\u003cp\u003eHi! I'm Mira and I just graduated from Brown University this past May with an honors degree in Visual Arts. During my senior year I completed an honors thesis project, and had a solo gallery exhibition for my work. I was selected as a student leader for the arts department at Brown, and was responsible for hosting tours and events all year. At the end of my time in college, I was also awarded the Gilbert Stuart Award which \"honors students who exhibit unique and creative perspectives in their work.\" I have developed a lot of skills in the arts that I am excited to share with my mentees, whether that be: professionalism, building an AP portfolio, making a website, documenting your work, or exhibiting your work. I'm excited to work alongside you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy whole life, I was known as the student in the classroom with a million questions. I wanted to understand the root of everything, why things worked beyond what the curriculum required teachers to explain. Luckily, I learned that by studying art in college I could discover some of those unexplainable questions myself with the power of creating. Besides art, I'm also passionate about hiking, working with people, theater, and women's studies. I hope that I can help students be curious and delve into ideas that allow them to explore different parts of the world and themselves!\u003c/p\u003e","teachingVideoPlaybackId":"3gDQPc01HVcEVLJT01cF8kdxB00ZPO4yyPn680100DM2xp02k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"68d1ba95-9635-4cd0-ad92-89aabaf385f2\"}"},{"__ref":"Favorites:{\"uuid\":\"e3ae1059-f9c8-495b-a8cb-7c61f306bd34\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ff53aa2a-fb17-4852-837a-72123f50227e\"}"}],"major":"Visual Arts","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4488c3fd-a033-45ac-8eae-5daaeeff383b\"}"},{"__ref":"DeepDives:{\"uuid\":\"7bc1a332-cab7-4582-8d61-9f353abc0d95\"}"},{"__ref":"DeepDives:{\"uuid\":\"58913c8a-fa01-4fa6-a171-a0d3930cf970\"}"},{"__ref":"DeepDives:{\"uuid\":\"e93b9b2d-4f17-4a76-bb27-19e1eb6aa53e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/19c3efea-8dda-4721-8642-fbd23d62d82c/-/preview/-/format/jpg/","https://ucarecdn.com/795bc95d-efc9-4c38-ba9b-88f262a7fe55/-/preview/-/format/jpg/","https://ucarecdn.com/b3cf64e5-89ee-4e0b-96c0-001b3e04900e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b3bbd45b-0a76-40e3-8ef5-d961c3a7f6b3\"}"},{"__ref":"Education:{\"uuid\":\"6cc33b
