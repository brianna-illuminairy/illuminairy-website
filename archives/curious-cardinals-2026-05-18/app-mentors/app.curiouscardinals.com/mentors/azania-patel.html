xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7fa9b37e-fc04-4998-933a-3c21ece4ccc3\"}":{"__typename":"DeepDives","uuid":"7fa9b37e-fc04-4998-933a-3c21ece4ccc3","content":"\u003cp\u003eLife truly does get easier. I had big emotions and a lot of imposter syndrome during my early school years, and it often felt like I didn’t quite fit. But staying close to the subjects I loved, trusting my curiosity, and working hard gradually led me to places where I finally found like-minded people. Keep following what excites you—you grow into the spaces that are right for you\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3f9381ef-64c9-4baa-8217-f2db1a61dec8\"}":{"__typename":"DeepDives","uuid":"3f9381ef-64c9-4baa-8217-f2db1a61dec8","content":"\u003cp\u003eMentorship matters to me because my own path has been shaped by incredible people who went out of their way to support and guide me. I want to give back in the same spirit, and I’m genuinely energised by working with curious, thoughtful young people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1e71f112-81a9-4eca-9d6f-3b22818add7d\"}":{"__typename":"DeepDives","uuid":"1e71f112-81a9-4eca-9d6f-3b22818add7d","content":"\u003cp\u003eOne of my main passion projects is the India Ghost Project, which I founded to study ghost stories as a window into culture, memory, and urban change. What started as a personal fascination became a full research initiative collecting oral histories, analysing patterns in folklore, and exploring how paranormal narratives reveal deeper truths about how communities cope with uncertainty, loss, and rapid transformation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3c78a80d-ea0c-40ae-a864-5b0f711d718d\"}":{"__typename":"DeepDives","uuid":"3c78a80d-ea0c-40ae-a864-5b0f711d718d","content":"\u003cp\u003eI chose to study public policy because I wanted to do work that felt practical and grounded. I’ve always been motivated by the idea of making a difference, and policy offered a path to understand problems deeply and help shape the solutions. It was also a way for me to stay connected to and give back to the communities that raised me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"4da3924d-ed31-470a-b6ab-32cb7703009c\"}":{"__typename":"School","uuid":"4da3924d-ed31-470a-b6ab-32cb7703009c","name":"Utpal Sanghvi Global School","city":"Mumbai","type":"HIGH","state":"Maharashtra","country":"India","zip":"400103"},"Education:{\"uuid\":\"eb66af1a-0eda-4229-8f69-f55fc3e3ca7d\"}":{"__typename":"Education","uuid":"eb66af1a-0eda-4229-8f69-f55fc3e3ca7d","school":{"__ref":"School:{\"uuid\":\"4da3924d-ed31-470a-b6ab-32cb7703009c\"}"},"startYear":"2015","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518\"}":{"__typename":"School","uuid":"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518","name":"University of Oxford","city":"Oxford","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"OX1 2JD"},"Education:{\"uuid\":\"c516047f-7a9a-4c5d-9166-f05526df49a1\"}":{"__typename":"Education","uuid":"c516047f-7a9a-4c5d-9166-f05526df49a1","school":{"__ref":"School:{\"uuid\":\"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2022","major":"Master of Public Polciy","degree":null},"MentorPublicProfile:{\"uuid\":\"1a45e720-a2f4-44c0-84ae-635b24b40150\"}":{"__typename":"MentorPublicProfile","uuid":"1a45e720-a2f4-44c0-84ae-635b24b40150","displayName":"Azania P.","slug":"azania-patel","biography":"\u003cp\u003eI care deeply about helping young people build a way of seeing the world that is curious, informed, and rooted in empathy. Whether I’m researching emerging technologies, reporting from the field, or building tools that democratise knowledge, a constant thread in my work is the belief that learning should make the world feel bigger, not smaller. I’m especially passionate about supporting students who want to make sense of complex issues—technology, society, politics, literature—and showing them how big ideas become less intimidating when you learn how to break them down.\u003c/p\u003e\u003cp\u003eI studied at the University of Oxford as a Rhodes Scholar, completing an MSc in Modern South Asia and a Master of Public Policy with a focus on technology policy and governance. Before that, I earned my BA in Liberal Arts at NMIMS Mumbai, concentrating in literature and sociology. These fields taught me how to think critically, write clearly, and understand the human stories behind systems and institutions.\u003c/p\u003e\u003cp\u003eProfessionally, I have pursued an interdisciplinary path guided by curiosity. I currently serve as Interim Director of the India office at Suffrago, where I lead strategy for a civic-tech platform strengthening democratic participation through AI-powered tools. Alongside this, I’m a Research Fellow at Equitech Futures, where I teach courses on societal and ethical perspectives in technology and contribute research on global governance. I also helped build the LIPI Library, a dual-purpose initiative that preserves South Asia’s post-independence literature while creating benchmark datasets for low-resource language AI.\u003c/p\u003e\u003cp\u003eEarlier, I worked as a journalist with The Economist, covering defence technology, human development, and political change through field reporting—including assignments in Kenya and at a British military base. I later researched and scripted episodes for a major podcast series during the Indian elections. I’ve also written on global tech regulation for The Stack and supported international outreach for the Ellison Institute of Technology.\u003c/p\u003e\u003cp\u003eBeyond my professional work, I founded the India Ghost Project, an interdisciplinary research initiative exploring paranormal narratives and urban transformation, and I currently serve as Co-Chair of the Indian Association of Rhodes Scholars.\u003c/p\u003e\u003cp\u003eAs a mentor, my goal is to create an intellectually adventurous, warm, and encouraging space. I want students to feel confident asking questions, exploring new ideas, and finding clarity in subjects that might initially feel overwhelming. Above all, I hope to help them nurture a curiosity that stays with them long after our sessions end.\u003c/p\u003e","teachingVideoPlaybackId":"t6W1Yak13xtb6k2XTBIffhBdq6qHtbpati9vL6O1kHE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne achievement I’m really proud of is being selected as a Rhodes Scholar for India. It was an incredibly meaningful moment—not just because it’s a prestigious scholarship, but because it represented years of hard work, resilience, and the support of so many people who believed in me. It opened doors to study at Oxford and completely transformed the way I think about leadership, service, and the world\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Master of Public Polciy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7fa9b37e-fc04-4998-933a-3c21ece4ccc3\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f9381ef-64c9-4baa-8217-f2db1a61dec8\"}"},{"__ref":"DeepDives:{\"uuid\":\"1e71f112-81a9-4eca-9d6f-3b22818add7d\"}"},{"__ref":"DeepDives:{\"uuid\":\"3c78a80d-ea0c-40ae-a864-5b0f711d718d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ec77407b-1529-4005-bb29-205e3dd15054/-/preview/-/format/jpg/","https://ucarecdn.com/bf764328-902a-44da-8383-e0b57e0e163f/-/preview/-/format/jpg/","https://ucarecdn.com/e403fd32-e00e-44c3-8ca0-80abd6122add/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"eb66af1a-0eda-4229-8f69-f55fc3e3ca7d\"}"},{"__ref":"Education:{\"uuid\":\"c516047f-7a9a-4c5d-9166-f05526df49a1\"}"}],"hiredAt":"2025-12-02T19:24:40.199Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Creative Writing","Sports Journalism","Film / Theater","History Project","Law / Government / Policy","Journalism","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"azania-patel\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1a45e720-a2f4-44c0-84ae-635b24b40150\"}"}}},"_sentryTraceData":"9d11321458ed4e6489b3dd27af96df8b-831242a0cde88451-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9d11321458ed4e6489b3dd27a
