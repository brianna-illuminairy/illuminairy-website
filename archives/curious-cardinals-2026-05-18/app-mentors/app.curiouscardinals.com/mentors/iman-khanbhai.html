xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"df8e4553-3c2f-4d68-9adf-94b21daec5e6\"}":{"__typename":"Favorites","uuid":"df8e4553-3c2f-4d68-9adf-94b21daec5e6","photoUrl":"https://ucarecdn.com/3bf3d562-573f-4b22-b767-08bb5a54f81a/","title":"Crying in H Mart","type":"BOOK"},"Favorites:{\"uuid\":\"05da4448-cdf2-44ba-80eb-428a2243793e\"}":{"__typename":"Favorites","uuid":"05da4448-cdf2-44ba-80eb-428a2243793e","photoUrl":"https://ucarecdn.com/4854f9f6-99b0-4c40-9747-240f16b69c64/","title":"Seattle, WA","type":"CITY"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"deae935d-7b04-4f36-a49d-71d97343fc9b\"}":{"__typename":"DeepDives","uuid":"deae935d-7b04-4f36-a49d-71d97343fc9b","content":"\u003cp\u003eIn my spare time, I love to keep both my body and mind active. On nice days, you can often find me out on a run, bike ride, long walk, or skipping around. I find this to be great time for myself where I get to listen to my favorite songs or a cool podcast. If it is not the nicest weather out, I love to play games and puzzles! My favorite board games are Settlers of Catan, Monopoly Deal, Risk, and Chess. I am also known for my deep love of 1000-piece puzzles!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e3f94287-c0d0-4850-94f7-7c11a9235a61\"}":{"__typename":"DeepDives","uuid":"e3f94287-c0d0-4850-94f7-7c11a9235a61","content":"\u003cp\u003eThroughout my entire life, I have valued feedback and have never hesitated to ask for help when I needed it. Mentorship to me means helping others gain more confidence and knowledge, but most importantly it means creating a strong bond. I love to meet new people, learn about their learning styles, and help on where they are struggling to ease the stress of being overwhelmed or learning new subject matter. I am grateful for the mentorship I have received and so being a mentor, myself, means I get to give back and be a part of someone else's learning journey and create a lovely friendship along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"52ad3ea4-0e01-4bf3-9120-0b4e3a22cb77\"}":{"__typename":"DeepDives","uuid":"52ad3ea4-0e01-4bf3-9120-0b4e3a22cb77","content":"\u003cp\u003eMy greatest role model is my grandmother! We have been close my entire life, and she has taught me so many things that I am grateful for. She speaks multiple languages, is the best cook I have ever met, insanely good at candy crush, and is beyond generous and social. She lives in Pakistan now, but we call almost every day and debrief our days together. I hope to be just like her when I get older.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b2347ea9-7200-43bd-92a8-3b9949f20f53\"}":{"__typename":"DeepDives","uuid":"b2347ea9-7200-43bd-92a8-3b9949f20f53","content":"\u003cp\u003eDo the things that you love and are passionate about! And take in your time during those years and live in the moment. You only get to be a high schooler once, so be present and do the things that make you happy. Work hard and push yourself, taking advantage of opportunities that come your way. And say yes to new things-- always have an open mind because it will get you far. :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"713cc3fe-70a0-43ac-ad2b-ce8057c63ce1\"}":{"__typename":"School","uuid":"713cc3fe-70a0-43ac-ad2b-ce8057c63ce1","name":"The Wheeler School","city":"Providence","type":"HIGH","state":"Rhode Island","country":"United States","zip":"02906"},"Education:{\"uuid\":\"691f9545-89cb-4193-a959-7b4ed85dd263\"}":{"__typename":"Education","uuid":"691f9545-89cb-4193-a959-7b4ed85dd263","school":{"__ref":"School:{\"uuid\":\"713cc3fe-70a0-43ac-ad2b-ce8057c63ce1\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"8abdaad2-c344-4e96-b127-19d19138230e\"}":{"__typename":"Education","uuid":"8abdaad2-c344-4e96-b127-19d19138230e","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Environmental Science, Business Economics, \u0026 Urban Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"a67d3206-8703-40c7-96c4-40531b038f07\"}":{"__typename":"MentorPublicProfile","uuid":"a67d3206-8703-40c7-96c4-40531b038f07","displayName":"Iman K.","slug":"iman-khanbhai","biography":"\u003cp\u003eIman is a recent graduate of Brown University, where she graduated Magna Cum Laude with a Bachelor of Sciences in Environmental Science and a Bachelor of Arts in Economics. She has grown up in Rhode Island her whole life and feels a lot of appreciation for the smallest state, but now she lives in New York City. Iman has loved deciphering the intermediary between these disciplines and exploring ways to finance climate solutions. She is also passionate about making cities greener and climate-resilient, while enhancing democratic involvement in the design and stewardship of the public realm. Previously, Iman was a reporter for Possibly, a sustainability-focused podcast that comes out with episodes every Tuesday, as part of a co-production of Brown's Climate Solutions Initiative and the Public's Radio. She also was a researcher for the Climate and Development Lab at Brown, and was a climate policy intern at the Green Energy Consumers Alliance of Rhode Island. She also started a club called Food Lovers at Brown, or FLAB! After interning at a climate consulting firm last summer, Iman is currently a NYC Urban Fellow, working on the Urban Planning team for NYC Department of Parks and Recreation. In this role, she positively contributes to the lives of everyday New Yorkers by making their parks more equitable, accessible, and green!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIman is extremely passionate about helping others grasp a subject, even when they feel it is extremely challenging at the beginning. She was an advisor to freshman students at Brown for four years, helping them with course registration, acclimating to college life, and everything in between. Iman understands the struggle of feeling like you are 'not a math person or a writer or an artist' and hopes to alter that narrative to one where people feel encouraged to try new things and practice to get better at a certain subject. She hopes to build confidence in her mentees and find ways to help them accomplish anything they desire!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her free time, Iman loves going on long runs, exploring local coffee shops, collaging with her roommates, doing crosswords and 1000-piece puzzles, and attempting to skateboard. She also enjoys cooking new recipes and hanging out with her brother. :)\u003c/p\u003e","teachingVideoPlaybackId":"ffnPPzt7BwYIsNzzDD7oOmpjABzD3iYDDJ00xCC01NmTY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"df8e4553-3c2f-4d68-9adf-94b21daec5e6\"}"},{"__ref":"Favorites:{\"uuid\":\"05da4448-cdf2-44ba-80eb-428a2243793e\"}"}],"causesSupported":[],"major":"Environmental Science, Business Economics, \u0026 Urban Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"deae935d-7b04-4f36-a49d-71d97343fc9b\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3f94287-c0d0-4850-94f7-7c11a9235a61\"}"},{"__ref":"DeepDives:{\"uuid\":\"52ad3ea4-0e01-4bf3-9120-0b4e3a22cb77\"}"},{"__ref":"DeepDives:{\"uuid\":\"b2347ea9-7200-43bd-92a8-3b9949f20f53\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/504bdcf9-4af0-4e39-8887-60ed033f7f14/-/preview/-/format/jpg/","https://ucarecdn.com/075de610-eaf9-42ca-8feb-818d1af06384/-/preview/-/format/jpg/","https://ucarecdn.com/e2222acd-cf08-44da-b103-ac4e43a162dd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"691f9545-89cb-4193-a959-7b4ed85dd263\"}"},{"__ref":"Education:{\"uuid\":\"8abdaad2-c344-4e96-b127-19d19138230e\"}"}],"hiredAt":"2024-03-19T08:03:37.000Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Writing","French","Academic Coaching","College Essay Writing","Economics","Executive Function","History","Reading","Creative Writing","Fashion / Cosmetics","History Project","K-6 Storybook","Video / Photography","Visual Arts / Graphic Design","Business / Entrepreneurship","Web Design","Journalism","Public Speaking","Sustainability
