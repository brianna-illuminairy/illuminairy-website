xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c79cd0d8-4152-465c-96ab-330a95c35159\"}":{"__typename":"Favorites","uuid":"c79cd0d8-4152-465c-96ab-330a95c35159","photoUrl":"https://ucarecdn.com/5d4606eb-5f12-4e3f-af29-91d7d4677398/","title":"San Diego","type":"CITY"},"Favorites:{\"uuid\":\"e8892cf2-4010-493e-91fe-cbff3174c13b\"}":{"__typename":"Favorites","uuid":"e8892cf2-4010-493e-91fe-cbff3174c13b","photoUrl":"https://ucarecdn.com/b4c3dc81-f87a-44ac-8ddd-e6766c00f724/","title":"Catan!","type":"GAME"},"Favorites:{\"uuid\":\"288efbd9-7787-425d-8a00-8937e7064a2c\"}":{"__typename":"Favorites","uuid":"288efbd9-7787-425d-8a00-8937e7064a2c","photoUrl":"https://ucarecdn.com/ababf3fe-2f9d-46e3-abef-8df5622d3315/","title":"Basketball","type":"SPORT"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"45c05806-786b-4a3b-97f0-8703bc8b80b8\"}":{"__typename":"DeepDives","uuid":"45c05806-786b-4a3b-97f0-8703bc8b80b8","content":"\u003cp\u003eIn my spare time, I love being outdoors as much as possible. Whether it’s catching waves at the beach, road-tripping to the mountains to snowboard, playing a variety of sports, or simply taking a walk to soak up the sun, I always look for ways to disconnect from the digital world. I also enjoy exploring new trails, hiking in nature, and staying active to keep both my mind and body refreshed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6ed3d6d0-0f43-4c11-a87c-405ace800bd1\"}":{"__typename":"DeepDives","uuid":"6ed3d6d0-0f43-4c11-a87c-405ace800bd1","content":"\u003cp\u003eBefore deciding on Aerospace Engineering, I initially chose Mechanical Engineering as my major because I wasn't sure exactly what I wanted to do. I knew I enjoyed math and engineering, and since Mechanical Engineering is the broadest discipline, it seemed like a solid choice. During my time at UC Davis for undergrad, I took a couple of aerospace electives and found them just as fascinating as my mechanical classes. That realization led me to pursue a double major, allowing me to get the best of both worlds. When I started my Master’s at Stanford, I chose Aeronautics and Astronautics because the program focuses heavily on autonomy and controls—precisely the area within aerospace/mechanical engineering that I aim to build my career around.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a8e907e0-5831-42f5-812a-4b503537334e\"}":{"__typename":"DeepDives","uuid":"a8e907e0-5831-42f5-812a-4b503537334e","content":"\u003cp\u003eMy dream job is one where I can make a meaningful impact on the world, especially in the fields of autonomy, aerospace, or AI, helping to drive innovation and push technological boundaries. At the same time, I believe that true success also includes a balance between professional achievement and personal fulfillment. I want a role that not only allows me to contribute to impactful projects but also gives me the flexibility to enjoy other important aspects of life, like traveling and spending time outdoors. I believe that a healthy work-life balance is essential for long-term success and happiness. Ideally, my dream job would be one that allows me to grow, innovate, and lead, while also giving me the freedom to experience the world beyond my career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"d188c24c-ab8f-4bf2-ab90-9559735b0b72\"}":{"__typename":"DeepDives","uuid":"d188c24c-ab8f-4bf2-ab90-9559735b0b72","content":"\u003cp\u003eMy greatest source of motivation comes from my parents. They grew up in the Middle East, where they stood out above their peers through their dedication to education. Despite the challenges they faced, they used their academic excellence as a stepping stone to find opportunities that eventually led them to build very successful careers in the United States. Their journey has always inspired me to push myself, seize opportunities, and never take education or hard work for granted. Watching how they leveraged their knowledge and determination to create a better future for our family drives me to follow in their footsteps, not just to achieve success but to also create meaningful change in my own path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"be0ba6c1-02d0-4305-b5c7-7b7b27dd8484\"}":{"__typename":"School","uuid":"be0ba6c1-02d0-4305-b5c7-7b7b27dd8484","name":"La Jolla High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92037"},"Education:{\"uuid\":\"90c9910a-bbb0-4baa-b557-45c74cfa8096\"}":{"__typename":"Education","uuid":"90c9910a-bbb0-4baa-b557-45c74cfa8096","school":{"__ref":"School:{\"uuid\":\"be0ba6c1-02d0-4305-b5c7-7b7b27dd8484\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"401c9b1e-101a-4ae3-a002-89a3727f8502\"}":{"__typename":"Education","uuid":"401c9b1e-101a-4ae3-a002-89a3727f8502","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2025","major":"M.S. Aeronautics and Astronautics","degree":null},"MentorPublicProfile:{\"uuid\":\"781a935c-38f3-4974-b2bd-0a0647c6ef1d\"}":{"__typename":"MentorPublicProfile","uuid":"781a935c-38f3-4974-b2bd-0a0647c6ef1d","displayName":"Faress Z.","slug":"faress-zwain","biography":"\u003cp\u003eI am passionate about helping students unlock their potential and navigate their educational and career journeys. As an \u003cstrong\u003eAerospace Engineer\u003c/strong\u003e and \u003cstrong\u003eEntrepreneur\u003c/strong\u003e, I bring a unique blend of technical expertise and entrepreneurial experience to mentoring students who are already passionate about a subject, or just want to learn more to see if it’s the right fit for them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I’ve specialized in aerospace/mechanical engineering, robotics, and control systems, and have worked on many exciting projects throughout my undergraduate and graduate careers. I’ve also had the opportunity to work on cutting-edge AI voice agents through my company, ManyFlow AI, where we help business' drive growth by improving customer satisfaction through the use of AI. My technical skills include Engineering, Product Design, Coding, App Building, Simulations, and AI agent development.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough internships at several engineering companies, I’ve contributed to enhancing state-of-the-art aerospace systems, while also working on cool projects in school like a vision-aided algorithm for rocket landings. This diverse background in AI, robotics, and aerospace allows me to guide students through a variety of technical challenges, whether they’re interested in coding, AI, or engineering.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m excited to share my knowledge, inspire curiosity, and help students build a strong foundation for the future. Whether you’re passionate about technology, entrepreneurship, or just exploring STEM, I’m here to help you grow and succeed.\u003c/p\u003e","teachingVideoPlaybackId":"9x5IsYXtkbZtY401h6i3J2RKl9SQiJLJft1X6zt2XTgg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c79cd0d8-4152-465c-96ab-330a95c35159\"}"},{"__ref":"Favorites:{\"uuid\":\"e8892cf2-4010-493e-91fe-cbff3174c13b\"}"},{"__ref":"Favorites:{\"uuid\":\"288efbd9-7787-425d-8a00-8937e7064a2c\"}"}],"causesSupported":[],"major":"M.S. Aeronautics and Astronautics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"45c05806-786b-4a3b-97f0-8703bc8b80b8\"}"},{"__ref":"DeepDives:{\"uuid\":\"6ed3d6d0-0f43-4c11-a87c-405ace800bd1\"}"},{"__ref":"DeepDives:{\"uuid\":\"a8e907e0-5831-42f5-812a-4b503537334e\"}"},{"__ref":"DeepDives:{\"uuid\":\"d188c24c-ab8f-4bf2-ab90-9559735b0b72\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/66a17db0-e422-4dee-a014-45bb9e18eeb7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"90c9910a-bbb0-4baa-b557-45c74cfa8096\"}"},{"__ref":"Education:{\"uuid\":\"401c9b1e-101a-4ae3-a002-89a3727f8502\"}"}],"hiredAt":"2024-09-12T17:06:34.234Z","topics":["Business / Entrepreneurship","Robotics / Electronics / CAD","Product Design","Aviation / Aerospace","Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics"],"communityBadges":["ht
