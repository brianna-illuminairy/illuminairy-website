eatest role model/mentor?"},"DeepDives:{\"uuid\":\"9fe23381-009b-4f94-9f08-e90669bb9138\"}":{"__typename":"DeepDives","uuid":"9fe23381-009b-4f94-9f08-e90669bb9138","content":"\u003cp\u003eJesus! He had all the power in the world but he chose to be humble and sacrifice himself for us so that we can live a new life free from shame and guilt. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8ab4fd6b-8957-4406-af14-d9515a52c8ae\"}":{"__typename":"DeepDives","uuid":"8ab4fd6b-8957-4406-af14-d9515a52c8ae","content":"\u003cp\u003eTry everything! That's the best way to figure out what you are really passionate about. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"e12a324a-6c2b-4266-9bc6-1de09cdee474\"}":{"__typename":"School","uuid":"e12a324a-6c2b-4266-9bc6-1de09cdee474","name":"Shanghai American School","city":"Shanghai","type":"HIGH","state":"Shang Hai Shi","country":"China","zip":"201106"},"Education:{\"uuid\":\"3e53a2b3-f88b-4bc0-ae06-a9eae896da90\"}":{"__typename":"Education","uuid":"3e53a2b3-f88b-4bc0-ae06-a9eae896da90","school":{"__ref":"School:{\"uuid\":\"e12a324a-6c2b-4266-9bc6-1de09cdee474\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"bad63897-e694-403a-8a63-242381e0b1bd\"}":{"__typename":"Education","uuid":"bad63897-e694-403a-8a63-242381e0b1bd","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Finance \u0026 Accounting","degree":null},"MentorPublicProfile:{\"uuid\":\"425fe124-f0b3-4030-a2e6-473677ad5cea\"}":{"__typename":"MentorPublicProfile","uuid":"425fe124-f0b3-4030-a2e6-473677ad5cea","displayName":"Nicholas P.","slug":"nicholas-penaloza","biography":"\u003cp\u003eHello! My name is Nicholas Penaloza, and I am a senior at USC studying finance and accounting. Growing up with American and Canadian parents in Shanghai has shaped me into an empathetic and flexible individual. My multicultural upbringing has fostered a deep appreciation for different cultures, allowing me to connect easily with a diverse range of people.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eBeyond my academic pursuits, I am passionate about entrepreneurship. I am currently developing PrayTogether, a mobile app that streamlines the process of sharing and organizing prayers. In high school, I created CAPISCE, an air quality app with over 36,000 users that translates pollution data into the equivalent number of cigarettes smoked daily. These entrepreneurial ventures have taught me valuable lessons about innovation, problem-solving, and perseverance—skills I am eager to share with mentees to help them realize their own dreams.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn addition to my entrepreneurial activities, I am a big basketball enthusiast and a video game nerd. My favorite NBA teams are the Golden State Warriors and Oklahoma City Thunder. I also have a deep love for Star Wars, Pokémon, and Harry Potter, and I can remember far too many lines from the first Harry Potter movie! This blend of interests allows me to relate to students on multiple levels, fostering strong and meaningful connections.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis summer, I will be working at JPMorgan Chase as a Commercial Banking Analyst intern, where I will gain valuable financial analysis and communication skills. I am excited to bring these skills to my mentoring, offering practical financial knowledge and insights that can benefit your child.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eMy goal is to create a nurturing environment where your child feels valued, encouraged, and supported as they navigate their path. I am dedicated to helping your child become the best version of themselves, equipped with the skills and confidence to succeed. I look forward to supporting your child's growth and development.\u003c/p\u003e","teachingVideoPlaybackId":"17j4SHSWcGh1CuD4s01vKHx9uZQRHCed9nwFZ4mX3T02g","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f5d5730c-b01b-41ef-a6aa-6f746a80e054\"}"},{"__ref":"Favorites:{\"uuid\":\"ce18c9e8-e842-485e-9968-ba77be3a2945\"}"}],"causesSupported":[],"major":"Finance \u0026 Accounting","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"badbeaaf-bc97-491f-8609-2118c45ac75b\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b004fb6-7fc2-494d-b3cd-e92e00e38207\"}"},{"__ref":"DeepDives:{\"uuid\":\"9fe23381-009b-4f94-9f08-e90669bb9138\"}"},{"__ref":"DeepDives:{\"uuid\":\"8ab4fd6b-8957-4406-af14-d9515a52c8ae\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/df6193a2-8c72-4dc1-9b46-ee052f9605f0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3e53a2b3-f88b-4bc0-ae06-a9eae896da90\"}"},{"__ref":"Education:{\"uuid\":\"bad63897-e694-403a-8a63-242381e0b1bd\"}"}],"hiredAt":"2024-06-10T11:31:31.131Z","topics":["Finance / Investing","Business / Entrepreneurship","Writing"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/b98f175c-f982-4497-bb8d-4a9c11113cd8/"],"restrictedProfileVisibility":false,"d
