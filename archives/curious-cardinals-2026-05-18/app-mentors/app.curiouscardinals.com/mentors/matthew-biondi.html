xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0048273e-ebef-46bb-9816-dc40dffe2860\"}":{"__typename":"Favorites","uuid":"0048273e-ebef-46bb-9816-dc40dffe2860","photoUrl":"https://ucarecdn.com/095b4085-cbc1-4fc8-9483-91b1637e9d99/","title":"Eli Manning","type":"ATHLETE"},"Favorites:{\"uuid\":\"b5164391-281c-4062-ac9f-6a3550f44e8b\"}":{"__typename":"Favorites","uuid":"b5164391-281c-4062-ac9f-6a3550f44e8b","photoUrl":"https://ucarecdn.com/cb89d71e-a131-4b25-93b4-ca136b4bd3b2/","title":"Grateful Dead","type":"ARTIST"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"dcc19566-a790-4b5e-b4a5-65a0a15cbc08\"}":{"__typename":"DeepDives","uuid":"dcc19566-a790-4b5e-b4a5-65a0a15cbc08","content":"\u003cp\u003eMentorship has been crucial to my growth, and I wouldn’t be where I am today without it. One of my main mentors always told me, “Don’t thank me, just pass it forward one day.” That stuck with me, and I’m committed to doing the same—helping others the way I’ve been helped. Mentorship isn’t just about advice; it’s about lifting others up and sharing what you’ve learned. I’m passionate about paying it forward and supporting others in their journey, just as I’ve been supported along mine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"52c6295c-47e3-43b4-880a-b74340303fe7\"}":{"__typename":"DeepDives","uuid":"52c6295c-47e3-43b4-880a-b74340303fe7","content":"\u003cp\u003eMy mom and my dog Maho \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"0e82b8b8-5125-44ae-ba57-74cea7083605\"}":{"__typename":"DeepDives","uuid":"0e82b8b8-5125-44ae-ba57-74cea7083605","content":"\u003cp\u003eAs a high school student, I was very grounded and always committed to reaching my goals, but I also made sure to enjoy myself along the way. I balanced being a part of three varsity sports teams with staying focused on my academics and personal ambitions. I loved being active and social, always finding time to connect with friends and stay involved. It was about working hard, but also making sure I had fun and made the most of my high school experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"185f44e1-38e3-4d3d-aa46-29b308cffb00\"}":{"__typename":"DeepDives","uuid":"185f44e1-38e3-4d3d-aa46-29b308cffb00","content":"\u003cp\u003eI spent my summers in high school always on the go. I worked at a country club and what I still call the greatest bar in the world, alongside some of my best friends, which made every shift a blast. Even though I was working, it never really felt like it.\u003c/p\u003e\u003cp\u003eWhen I wasn’t on the clock, I was always moving—playing golf, hitting the beach, surfing, running, playing basketball, and finding time to go out and enjoy the moment.\u003c/p\u003e\u003cp\u003eI loved the balance of putting in hours at work while making the most of every day with good people and good energy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"7000632b-da2e-4a5c-9701-ca89cd0620bc\"}":{"__typename":"School","uuid":"7000632b-da2e-4a5c-9701-ca89cd0620bc","name":"Westhampton Beach Senior High School","city":"Westhampton Beach","type":"HIGH","state":"New York","country":"United States","zip":"11978"},"Education:{\"uuid\":\"3fa14c8d-ef21-4cce-9a02-a97f30e88bbb\"}":{"__typename":"Education","uuid":"3fa14c8d-ef21-4cce-9a02-a97f30e88bbb","school":{"__ref":"School:{\"uuid\":\"7000632b-da2e-4a5c-9701-ca89cd0620bc\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"3f7d4d5c-afca-415b-8a52-754149e00f0b\"}":{"__typename":"Education","uuid":"3f7d4d5c-afca-415b-8a52-754149e00f0b","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Business Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"8d7326f2-b2aa-4d46-a6f8-2a2965ad4a03\"}":{"__typename":"MentorPublicProfile","uuid":"8d7326f2-b2aa-4d46-a6f8-2a2965ad4a03","displayName":"Matthew B.","slug":"matthew-biondi","biography":"\u003cp\u003eHi! I’m heading into my third year at UCLA, where I study Business Economics with a focus on value investing. Over the past couple of years, I’ve gotten the chance to dive deep into finance—especially real estate, private equity, and investment banking. I’ve been fortunate to land internships across all three areas for Summer 2025 and Summer 2026, but it definitely didn’t happen overnight. I’ve learned that hard work, discipline, and consistent daily habits are what really move the needle.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, I’ve always believed in balance. Life isn’t just about the grind, it’s about enjoying the process and making the most of every moment. For me, that means spending time with friends, trying new things, or just appreciating the little wins along the way. Success isn’t just another line on a resume; it’s building a life you’re proud of while actually having fun in the process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school and work, I’m usually staying active or outdoors. I love surfing, golfing, hitting the beach, lifting at the gym, and just hanging out with good people. Those are the things that recharge me and keep me grounded.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I’m minoring in history and have taken some challenging coursework across math, economics, and writing—all areas I’m more than happy to help with. I also really enjoy helping people develop personally, whether that means building better habits, boosting confidence, or just figuring out how to navigate the ups and downs of college and career planning.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also vividly remember how overwhelming the college application process was—trying to build the perfect school list, craft a standout resume, write authentic essays, and somehow keep it all together. I’ve been through it and learned a lot along the way. I’m more than happy to help with anything from application strategy and essay feedback to sharing my own materials and experiences. My goal is always to make the process less stressful and more empowering for anyone going through it.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you're thinking about careers in finance or real estate, navigating tough classes like math, econ, or writing, or tackling the college application process, I’m always happy to share what I’ve learned and the mistakes I’ve made along the way. I know how valuable it can be to have someone who’s been there to offer real, honest advice. Whether it’s career guidance, academic support, college app strategy, or building systems and habits for success, I’m committed to being transparent and supportive, and I’ll do everything I can to help you succeed. If you're willing to put in the work, you can count on me to be there every step of the way.\u003c/p\u003e","teachingVideoPlaybackId":"NebSYFexqKM1L29DHzdTEb01uQAW8ofpANAC02eilL1YE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0048273e-ebef-46bb-9816-dc40dffe2860\"}"},{"__ref":"Favorites:{\"uuid\":\"b5164391-281c-4062-ac9f-6a3550f44e8b\"}"}],"causesSupported":[],"major":"Business Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dcc19566-a790-4b5e-b4a5-65a0a15cbc08\"}"},{"__ref":"DeepDives:{\"uuid\":\"52c6295c-47e3-43b4-880a-b74340303fe7\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e82b8b8-5125-44ae-ba57-74cea7083605\"}"},{"__ref":"DeepDives:{\"uuid\":\"185f44e1-38e3-4d3d-aa46-29b308cffb00\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f09fcb4a-a55b-4e94-9c3c-4a91a38f7256/-/preview/-/format/jpg/","https://ucarecdn.com/2bddfd2b-2831-4218-aec2-c4fea7d98a5d/-/preview/-/format/jpg/","https://ucarecdn.com/09c30eb6-75d2-47d6-bd0f-2e73ec0df25e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3fa14c8d-ef21-4cce-9a02-a97f30e88bbb\"}"},{"__ref":"Education:{\"uuid\":\"3f7d4d5c-afca-415b-8a52-754149e00f0b\"}"}],"hiredAt":"2025-05-08T00:56:00.910Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Economics"],"communityBadges":["https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVi
