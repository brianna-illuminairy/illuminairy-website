xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"04d30bed-1ee3-4255-bcaa-1ca2b57b10d3\"}":{"__typename":"Favorites","uuid":"04d30bed-1ee3-4255-bcaa-1ca2b57b10d3","photoUrl":"https://ucarecdn.com/3f8d55a4-5f4c-4ab5-9ac1-c80c1316e64c/","title":"The Prophet by Khalil Gibran","type":"BOOK"},"Favorites:{\"uuid\":\"1bcaf303-3829-4561-9e45-2cfb77ce0e25\"}":{"__typename":"Favorites","uuid":"1bcaf303-3829-4561-9e45-2cfb77ce0e25","photoUrl":"https://ucarecdn.com/a93e6d0b-8ec4-4af8-afc6-ed232be2fe26/","title":"Everything Everywhere All at Once \u0026 Big Hero 6!","type":"MOVIE"},"Favorites:{\"uuid\":\"e949458f-eaea-4394-8596-70f21d76b7d3\"}":{"__typename":"Favorites","uuid":"e949458f-eaea-4394-8596-70f21d76b7d3","photoUrl":"https://ucarecdn.com/bb43db00-d51b-4d22-a14e-b49aa89746ef/","title":"Dawn by Yebba","type":"ALBUM"},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"0a47eabb-3a67-4ce1-abd0-3b50ee8d75c1\"}":{"__typename":"DeepDives","uuid":"0a47eabb-3a67-4ce1-abd0-3b50ee8d75c1","content":"\u003cp\u003eI absolutely LOVE horror movies! It's one of my favorite pastimes outside of crafting and graphic design! I would love any and all recommendations :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"4945f6ea-e351-4ff1-972e-1ebfb5a29fcc\"}":{"__typename":"DeepDives","uuid":"4945f6ea-e351-4ff1-972e-1ebfb5a29fcc","content":"\u003cp\u003eMy family! I'm incredibly lucky to have the most amazing parents and little brother in the world. They are the reason I try my hardest to be the best person, sister/daughter, student, and mentor that I can be! They are my everything.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b5d92b87-ca86-4efb-abac-af20012fa530\"}":{"__typename":"DeepDives","uuid":"b5d92b87-ca86-4efb-abac-af20012fa530","content":"\u003cp\u003eAs someone interested in going into medicine, I wanted to choose a major that allowed me to understand the internal/mental struggles that patients may face in healthcare settings. Physicians focus a lot on the external wounds, but the hospital can be a scary place mentally for patients as well. I want to make sure that my future patients feel comfortable and cared for, and I believe understanding psychology and mental health care is the best way to do so!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"40aea1cc-1a0b-462d-8a78-333d01b2e9a1\"}":{"__typename":"DeepDives","uuid":"40aea1cc-1a0b-462d-8a78-333d01b2e9a1","content":"\u003cp\u003eI hope to write and illustrate my own children's book! I've worked on creating a preliminary version for my Education Studies Capstone during undergrad, but it has a lot more work to be done before it can be released into the world! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"af2b171c-b201-4f9a-9a64-c534bc81032d\"}":{"__typename":"School","uuid":"af2b171c-b201-4f9a-9a64-c534bc81032d","name":"Lyman Hall High School","city":"Wallingford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06492"},"Education:{\"uuid\":\"e9ad6e19-1ce1-424c-859a-b395f6c53c43\"}":{"__typename":"Education","uuid":"e9ad6e19-1ce1-424c-859a-b395f6c53c43","school":{"__ref":"School:{\"uuid\":\"af2b171c-b201-4f9a-9a64-c534bc81032d\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"38eff870-7665-4ec8-adf1-2d0d03c2c30f\"}":{"__typename":"Education","uuid":"38eff870-7665-4ec8-adf1-2d0d03c2c30f","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology \u0026 Education Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"e0aac26a-8412-4fba-b006-d390c0500384\"}":{"__typename":"MentorPublicProfile","uuid":"e0aac26a-8412-4fba-b006-d390c0500384","displayName":"Yagmur O.","slug":"yagmur-ozturkoglu","biography":"\u003cp\u003eHi! My name is Yagmur (Yags for short). I'm an MSc student at the University of Oxford studying Evidence-Based Social Intervention \u0026amp; Policy Evaluation. My passions lie in mental health care, medicine, policy, research, and education! \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAdditional Background Info on Me! \u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI recently graduated from Yale University with a Bachelor of Science in Psychology (Neuroscience Concentration) and was an Education Studies Scholar. My coursework incorporated pre-medicine requirements and interdisciplinary classes in the realm of education and psychology. My experiences both inside and outside of the classroom have solidified my interest in community work, prevention medicine, and mental health! \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eOver the last four years I've had the opportunity and privilege to accomplish the following:\u003c/strong\u003e \u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eComplete a novel research project on associations between children's emotion regulation strategies and their stress biomarkers with the Yale Child Study Center (CSC) \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreated a visual storybook for adolescents on being a first-generation immigrant in the U.S. \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked with the APA Center for Psychology in Schools \u0026amp; Education, National Institute of Mental Health, the HAVEN Free Clinic in New Haven, and City of New Haven's Department of Community Resilience \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorking with multiple research labs such as the Yale Leonard Learning Lab, the Yale Human and Animal Integrated Research (HAIR) Lab, and the Stanford Muslim Mental Health \u0026amp; Islamic Psychology Lab\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMentoring students through the YES! College Questbridge program, Yale Department of Psychology's 2024/25 Senior Mentor Cohort, and as a TA for Turkish Level one at Yale! \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eThrough these experiences, I was able to build a path focused on policy, medicine, and education.\u003cstrong\u003e\u003cem\u003e I hope to be able to do the same for other students interested in an interdisciplinary framework for their studies/passions! \u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eSpecialization Areas:\u003c/strong\u003e \u003c/p\u003e\u003cp\u003eI would love to work with students who are interested in the following: \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cu\u003ePassion Projects\u003c/u\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cem\u003eCommunity Initiatives \u0026amp; Engagement\u003c/em\u003e: health-related, education (afterschool programming), and policy \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cem\u003eResearch\u003c/em\u003e: focusing on qualitative research in Psychology/Neuroscience (joining research labs, reading papers, etc.)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cem\u003eAdvocacy Work\u003c/em\u003e: creating policy portfolios, engaging with local governments \u0026amp; the community, creating outreach materials \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cu\u003eAcademic\u003c/u\u003e\u003c/p\u003e\u003cp\u003eI would love to help out in the following academic fields as well: biology, history/social science, and psychology! \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eFun Facts: \u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI absolutely love all things arts \u0026amp; crafts! I've been making my own jewelry since high school, and have recently gotten into creating clay pendants. I'm slowly making my way into felt-based crafts and graphic design as well :) \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm really excited to support students in their academic and passion project endeavors! \u003c/p\u003e","teachingVideoPlaybackId":"5o4v8bE4wLEG5Yxwp48vmbeZGu02pqLibZwSGAL02tGNk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"04d30bed-1ee3-4255-bcaa-1ca2b57b10d3\"}"},{"__ref":"Favorites:{\"uuid\":\"1bcaf303-3829-4561-9e45-2cfb77ce0e25\"}"},{"__ref":"Favorites:{\"uuid\":\"e949458f-eaea-4394-8596-70f21d76b7d3\"}"}],"causesSupported":[],"major":"P
