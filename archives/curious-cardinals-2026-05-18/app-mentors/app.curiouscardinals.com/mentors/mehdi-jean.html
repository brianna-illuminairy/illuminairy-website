ct easily digestible and accessible. He is now a Structured Finance intern at Cypress Creek Renewables, one of the country's largest solar development companies, working to finance large-scale solar projects nationwide. Mehdi graduated Cum Laude from Sacramento Country Day, where he moved after spending 10 years at an international school in Belgium. In high school, Mehdi was an integral part of both the school's newspaper and Mock Trial team, becoming Editor-in-Chief of the former and an attorney/team captain of the latter. His senior year, the mock trial team won their Sacramento County competition, one of the most competitive in the state. Having struggled to find ways to transform his passion for the environment into something concrete while in High School, Mehdi is extremely excited to help guide students with that same passion to find their own path toward environmental impact!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Earth Systems","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/c158b5ca-78ed-45d6-b97c-ac1502293d74/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"64ef3e3f-09f7-441c-b962-be74304fe05f\"}"}],"hiredAt":"2022-10-17T18:08:26.000Z","topics":["Coding / Programming","Sustainability","Economics","Negotiation","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mehdi-jean\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4dd2dfdb-f08b-4876-ad49-cb13e38002f0\"}"}}},"_sentryTraceData":"e331a989c5b9471f872bd80d63a83c15-94f64725e585c315-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e331a989c5b9471f872bd80d63a83c
