xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d41b5834-5bc6-4c0d-a895-18a5b1046c2d\"}":{"__typename":"Favorites","uuid":"d41b5834-5bc6-4c0d-a895-18a5b1046c2d","photoUrl":"https://ucarecdn.com/c0432be6-ae84-4a98-8d73-5dc16a7a2ba5/","title":"Leonardo DiCaprio","type":"ACTOR"},"Favorites:{\"uuid\":\"e5b3b18f-879d-4f7e-b7a1-2297cf1e8245\"}":{"__typename":"Favorites","uuid":"e5b3b18f-879d-4f7e-b7a1-2297cf1e8245","photoUrl":"https://ucarecdn.com/2a806e34-ef79-4dda-906a-651ac120fe2b/","title":"Ronaldinho Gaúcho","type":"ATHLETE"},"Favorites:{\"uuid\":\"706e86a9-06b3-4528-b792-77bd22b50d98\"}":{"__typename":"Favorites","uuid":"706e86a9-06b3-4528-b792-77bd22b50d98","photoUrl":"https://ucarecdn.com/cf62aee1-7dac-4557-bf3c-fc2f7a199422/","title":"Inception","type":"MOVIE"},"CausesSupported:{\"uuid\":\"c202f231-8312-44d6-aecc-8429689b492e\"}":{"__typename":"CausesSupported","uuid":"c202f231-8312-44d6-aecc-8429689b492e","name":"Futbol Por Mi Pais","description":"\u003cp\u003eFamily Foundation\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4a740ff9-036e-4355-b8b2-0ca589399d8d\"}":{"__typename":"DeepDives","uuid":"4a740ff9-036e-4355-b8b2-0ca589399d8d","content":null,"videoPlaybackId":"023z01t00dsrYDZkAE602GqHclJaPtBKLLFMQIHgics58rY","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"741719ae-6d21-4534-8360-7634e2a5cb6f\"}":{"__typename":"DeepDives","uuid":"741719ae-6d21-4534-8360-7634e2a5cb6f","content":"\u003cp\u003eIn high school, I pushed myself through rigorous courses like Calculus, AP Physics, and Linear Algebra, facing challenges that tested my resolve. Through late-night study sessions and endless problem-solving, I discovered the deep reward that accompanies perseverance in math and science. Each “aha” moment fueled an ever-growing curiosity that I now eagerly want to share with others. Mentorship offers a unique opportunity to pass on both knowledge and a passion for exploration—sparking excitement in students to think critically and question creatively. Watching them develop not just academically, but intellectually, is incredibly fulfilling. That is why I am drawn to mentorship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"2ead937c-2f8a-407d-9cc0-50459e08c987\"}":{"__typename":"DeepDives","uuid":"2ead937c-2f8a-407d-9cc0-50459e08c987","content":"\u003cp\u003eIn high school, I showed a relentless curiosity and drive to fully comprehend what I was learning. I wasn’t content to simply memorize facts or formulas. Instead, I sought to unravel the reasons behind each concept, frequently seeking additional explanations from my teachers. This intense focus on depth over surface-level knowledge became a hallmark of my academic approach, motivating me to go beyond what was taught in class. I believed that true understanding came from asking questions and exploring different perspectives. Ultimately, I aimed to excel, not for recognition, but for the satisfaction of intellectual growth and collaboration.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b3a094df-118c-412a-a4a3-ef28f3e29362\"}":{"__typename":"DeepDives","uuid":"b3a094df-118c-412a-a4a3-ef28f3e29362","content":"\u003cp\u003eIn my spare time, I love diving into aviation videos and exploring random, niche topics that spark my curiosity, from obscure scientific phenomena to hidden historical events. When I’m not lost in research, I head outdoors, playing soccer by Lake Michigan or mountain biking and hiking back home in Costa Rica. Spending quality time with friends completes my balanced downtime.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9464bade-63c4-4a9a-bb40-9090cd1dd241\"}":{"__typename":"School","uuid":"9464bade-63c4-4a9a-bb40-9090cd1dd241","name":"Country Day School Costa Rica","city":"San Rafael","type":"HIGH","state":"Alajuela Province","country":"Costa Rica","zip":"20108"},"Education:{\"uuid\":\"6758b59c-9d29-4c0d-941e-7090a7c10831\"}":{"__typename":"Education","uuid":"6758b59c-9d29-4c0d-941e-7090a7c10831","school":{"__ref":"School:{\"uuid\":\"9464bade-63c4-4a9a-bb40-9090cd1dd241\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}":{"__typename":"School","uuid":"891dad70-4e24-4602-8353-1e8140b8eb0c","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60201"},"Education:{\"uuid\":\"b1c1b6d9-ec8b-4562-80a7-158f218323ca\"}":{"__typename":"Education","uuid":"b1c1b6d9-ec8b-4562-80a7-158f218323ca","school":{"__ref":"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"7b954a88-c8aa-4d7b-9a4d-c29210260090\"}":{"__typename":"MentorPublicProfile","uuid":"7b954a88-c8aa-4d7b-9a4d-c29210260090","displayName":"Ilan M.","slug":"ilan-mayer","biography":"\u003cp\u003e“Why?” This question has been embedded in my life. At its core, it is a manifestation of the human’s innate curiosity. It is the desire to understand things beyond what meets the eye. Despite constantly asking the people around me these questions, my dad always encouraged me to ask more. He explained that it is part of who we are.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis curiosity led me to take rigorous courses in high school, such as AP Economics, Calculus, and Linear Algebra. When it came time to apply to college, I sought a field of study that encompassed challenging subjects I was curious about. This led me to pursue Mechanical Engineering at Northwestern University, where I am now a senior.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIt led me to meet other curious individuals and join extracurriculars such as the Aviation Club. It inspired me to take coursework beyond my major such as Machine Learning and Advanced CAD.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eMy name is Ilan, and I love staying curious. I grew up many miles from here in San Jose, Costa Rica (If you haven’t been, add it to your bucket list… SERIOUSLY!).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThere, I attended Country Day School. In high school, I took on the challenge of prototyping and building a Black Soldier Fly harvesting unit. In simple terms, Black Soldier Flies serve as a sustainable source of feed for livestock, poultry, and marine life, and my role was to design and construct their habitat.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis summer, I had the unique experience of interning at ThetaRay: a startup developing AI-based solutions for anti-money laundering and financial crime compliance. Over the span of 3 months, I spent my time working with the product team to develop new features, and building databases for sales teams to be more effective. It was one of my most unique experiences so far!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e5 years down the road I see myself in a product management role at a tech company. It’s hard to predict where I’ll end up, what remains certain is the pursuit of learning and engaging with others!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am the older brother to four younger siblings and have spent hours with them on all sorts of subjects. I’ve had experience mentoring classmates in subjects such as pre-calculus, calculus, physics, and economics. My friends would describe me as inquisitive and energetic, as I am constantly eager to explain and bring up new topics. My experience, paired with my emphasis on understanding things in every detail have given me the ability to break down complicated subjects into simplified, sizeable, and understandable pieces of information.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen taking a break from learning and teaching, you’ll find me outdoors; whether mountain biking back home, playing soccer by the lake, or surfing. I love spending time with friends, taking on long road-trips and exploring new cities.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am excited to engage with mentors who are passionate about learning and understanding. Yet, what drives me even more is the opportunity to inspire—to spark curiosity in students, encourage them to question ideas and processes, and help them discover what truly excites them.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSessions with me place an emphasis on your child’s understanding and engagement in the topic. Beyond simplified verbal explanations, subjects are taught with visuals, online simulations, and learning tools. Tools that students can actively engage with to stay motivated and interested. In their sessions, your child will feel empowered to ask questions freely, challenge ideas, and cultivate a mindset of lifelong learning.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhat matters most to me as a mentor is your child’s interest and understanding. I want them to grasp concepts, not memorize them. More importantly, I want them to be interested in what they learn. I encourage them to connect their personal projects and passions with their studies – whether it’s exploring the applications of physics in aviation or recognizing the role statistics in their favorite video game. I want them to keep asking ‘why?’’ and to be endlessly curious about the world around them.\u003c/p\u003e","teachingVideoPlaybackId":"DD1Dt700i005YEN4X8wDDtxcI100jOv4HZaBLcRfVS802xg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eCompleting a race in the Big Mountain Enduro! 47 km of enduro racing on a mountain bike at elevation. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d41b5834-5bc6-4c0d-a895-18a5b1046c2d\"}"},{"__ref":"Favorites:{\"uuid\":\"e5b3b18f-879d-4f7e-b7a1-2297cf1e8245\"}"},{"__ref":"Favorites:{\"uuid\":\"706e86a9-06b3-4528-b792-77bd22b50d98\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"c202f231-8312-44d6-aecc-8429689b492e\"}"}],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4a740ff9-036e-4355-b8b2-0ca589399d8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"741719ae-6d21-4534-8360-7634e2a5cb6f\"}"},{"__ref":"DeepDives:{\"uuid\":\"2ead937c-2f8a-407d-9cc0-50459e08c987\"}"},{"__ref":"DeepDives:{\"uuid\":\"b3a094df-118c-412a-a4a3-ef28f3e29362\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/255a7367-a1f0-4f62-baec-f71cda75c06b/-/preview/-/format/jpg/","https://ucarecdn.com/c6ccad6a-1858-41ce-a2b4-0f8556bde138/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6758b59c-9d29-4c0d-941e-7090a7c10831\"}"},{"__ref":"Education:{\"uuid\":\"b1c1b6d9-ec8b-4562-80a7-158f218323ca\"}"}],"hiredAt":"2025-02-15T01:36:47.739Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Spanish","Academic Coaching","Executive Function","Economics","Computer Science"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ilan-mayer\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7b954a88-c8aa-4d7b-9a4d-c29210260090\"}"}}},"_sentryTraceData":"9542ba632aab431a8c710a17eb715593-a390180a46fc8c2a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9542ba632aab431a8c710a17eb715593,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ilan-mayer"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-579
