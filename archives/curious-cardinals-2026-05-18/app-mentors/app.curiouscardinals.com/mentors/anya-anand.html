xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"06e3cb01-bdf9-405f-aec1-3bfe909395e5\"}":{"__typename":"Favorites","uuid":"06e3cb01-bdf9-405f-aec1-3bfe909395e5","photoUrl":"https://ucarecdn.com/920d8e03-0f59-48fa-9618-f9329d41c14b/","title":"Basketball","type":"SPORT"},"Favorites:{\"uuid\":\"7c12683f-1ac8-4289-a457-980750f2618d\"}":{"__typename":"Favorites","uuid":"7c12683f-1ac8-4289-a457-980750f2618d","photoUrl":"https://ucarecdn.com/c437d481-ee92-4fbe-ad14-89e5257b6524/","title":"Frank Ocean","type":"ARTIST"},"Favorites:{\"uuid\":\"7dcdf52c-460b-484a-909d-39ee2e510ef1\"}":{"__typename":"Favorites","uuid":"7dcdf52c-460b-484a-909d-39ee2e510ef1","photoUrl":"https://ucarecdn.com/c84ceec4-ae80-4b98-a98f-f2d7b152a261/","title":"Crying in H Mart","type":"BOOK"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"805a7dc7-a8e6-495b-b017-970e1e69cb33\"}":{"__typename":"DeepDives","uuid":"805a7dc7-a8e6-495b-b017-970e1e69cb33","content":"\u003cp\u003eI love to hang out with friends, try boba \u0026amp; matcha cafes, go on hikes, and run (currently training for my 3rd half marathon). \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"23f6a219-7681-4178-94ee-82ca4b9ae184\"}":{"__typename":"DeepDives","uuid":"23f6a219-7681-4178-94ee-82ca4b9ae184","content":"\u003cp\u003eWhen I entered college, I had almost no experience with programming. I took my first computer science course and was immediately drawn in. Then I discovered Electrical and Computer Engineering, which offered the best of both worlds. Through ECE, I’ve been able to take software-focused classes in machine learning and data systems, while also diving into the hardware side. I chose this major because it allows me to explore cutting-edge technologies while also understanding the physical foundations that make them possible. It’s the perfect intersection of my interests in optimization, systems, and real-world impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"126336f5-63d7-4cab-8e76-64d997aede00\"}":{"__typename":"DeepDives","uuid":"126336f5-63d7-4cab-8e76-64d997aede00","content":"\u003cp\u003eFind what you’re genuinely passionate about and lean into it. Whether it’s music, math, computer science, writing, or history; explore it fully and figure out what excites you about it. I’d tell my younger self that it’s okay not to have everything figured out yet, but if something makes you happy and you can see yourself spending hours with it without getting tired, that’s worth holding onto.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4b813a06-f0e1-4b66-aee0-d7f0055a1423\"}":{"__typename":"DeepDives","uuid":"4b813a06-f0e1-4b66-aee0-d7f0055a1423","content":"\u003cp\u003eI hope to make a real impact on the world and help others. As a personal goal, I hope to continue to lean into my passions, and help others with the same guidance I have also been given in my journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"f717a8a0-5684-43d7-9536-d375b1b6f23c\"}":{"__typename":"School","uuid":"f717a8a0-5684-43d7-9536-d375b1b6f23c","name":"Freedom High School","city":"Chantilly","type":"HIGH","state":"Virginia","country":"United States","zip":"20152"},"Education:{\"uuid\":\"ce3d2c85-4562-462f-afc9-848ba2da3235\"}":{"__typename":"Education","uuid":"ce3d2c85-4562-462f-afc9-848ba2da3235","school":{"__ref":"School:{\"uuid\":\"f717a8a0-5684-43d7-9536-d375b1b6f23c\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"67ed1bcf-db05-422e-a8cd-2ee5e63c57d8\"}":{"__typename":"Education","uuid":"67ed1bcf-db05-422e-a8cd-2ee5e63c57d8","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"2f92fe62-5d4d-43c1-b786-123c3e428b04\"}":{"__typename":"MentorPublicProfile","uuid":"2f92fe62-5d4d-43c1-b786-123c3e428b04","displayName":"Anya A.","slug":"anya-anand","biography":"\u003cp\u003eHi! I’m Anya, a junior at Princeton University from Northern Virginia. I’m majoring in Electrical and Computer Engineering with minors in Computer Science and Statistics \u0026amp; Machine Learning. I’m passionate about building systems that solve real problems and just as passionate about making sure people feel empowered to use them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat interest started when I took apart a broken circuit in high school just to see if I could fix it (I couldn’t yet). One of the first projects that made me fall in love with engineering was building a speed sensor with an Arduino and infrared sensors to track moving objects. It was the first time I saw code and hardware come together to do something tangible, and I’ve been hooked ever since. Before college, I had almost no experience with programming or technical work—I didn’t grow up coding or participating in robotics competitions. But when I arrived at Princeton and enrolled in my first CS class, I realized I loved the challenge of making something from scratch and the creativity that came with solving problems through technology.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince then, I’ve gotten to design dashboards for over 200,000 students while interning in Vietnam, build internal tools that sped up research processing by 40 percent, and create fraud detection models using machine learning. But no matter the project, what I love most is working with people and translating technical ideas into something others can actually understand and use.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Princeton, I stay involved beyond the classroom as a mentor for students in CS and engineering courses, and I’m part of communities like Women in Computer Science and Society of Women Engineers. Additionally, I am extremely passionate about music and playing the oboe, participating as a member in the Princeton University Orchestra. I’ve also been a TA for everything from Physics to Linear Algebra, and I love helping students work through moments of confusion and build confidence—especially if they’ve ever felt like they aren’t technical enough.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school, I’m always trying something new—whether it’s training for my third half marathon this fall, experimenting with homemade matcha and jam, or exploring new food and drink spots (I’ll never say no to boba). I also enjoy rewatching favorite shows like New Girl, Brooklyn 99, and Avatar the Last Airbender, and I’m an avid reader of everything from nonfiction memoirs to feel-good romance novels.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship has been a constant in my life, and I wouldn’t be where I am without the people who encouraged me to take up space in rooms I wasn’t sure I belonged in. I’m excited to now be that person for someone else, whether it’s talking through a problem set, debugging a tricky coding project, or just helping you find your own path!\u003c/p\u003e","teachingVideoPlaybackId":"ohP8hCt7y00B7SlZ9XnVpIIMFm8EdkWyPI6bbz5e5oj8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting into Princeton was genuinely a dream come true. Coming from a public high school, accomplishing a dream of not only getting into an Ivy but also my dream school did not seem possible. I am proud of the hard work and perseverance I invested in myself to make my dream a reality.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"06e3cb01-bdf9-405f-aec1-3bfe909395e5\"}"},{"__ref":"Favorites:{\"uuid\":\"7c12683f-1ac8-4289-a457-980750f2618d\"}"},{"__ref":"Favorites:{\"uuid\":\"7dcdf52c-460b-484a-909d-39ee2e510ef1\"}"}],"causesSupported":[],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"805a7dc7-a8e6-495b-b017-970e1e69cb33\"}"},{"__ref":"DeepDives:{\"uuid\":\"23f6a219-7681-4178-94ee-82ca4b9ae184\"}"},{"__ref":"DeepDives:{\"uuid\":\"126336f5-63d7-4cab-8e76-64d997aede00\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b813a06-f0e1-4b66-aee0-d7f0055a1423\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/36c635eb-773a-4aee-85b9-8c6a12b39104/-/preview/-/format/jpg/","https://ucarecdn.com/67c4319e-9475-4a44-9abd-3f2344c4566e/-/preview/-/format/jpg/","https://ucarecdn.com/fb975ae4-a427-4a0c-8050-f7f234456859/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ce3d2c85-4562-462f-afc9-848ba2da3235\"}"},{"__ref":"Education:{\"uuid\":\"67ed1bcf-db05-422e-a8cd-2ee5e63c57d8\"}"}],"hiredAt":"2025-07-02T17:48:38.290Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","Writing","College Essay Writing","Computer Science","Academic Coaching","Music","Coding / Programming","Machine Learning / AI","Web Design"],"communityBadges":["https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anya-anand\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2f92fe62-5d4d-43c1-b786-123c3e428b04\"}"}}},"_sentryTraceData":"c8a2735fcc6a4662b658e01085ea261b-9ff468d11cc2dc2d-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c8a2735fcc6a4662b658e01085ea261b,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"anya-anand"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe
