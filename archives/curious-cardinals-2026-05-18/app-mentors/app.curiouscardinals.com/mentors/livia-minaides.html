xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c2f9b038-d0bc-4392-b82b-fb6a6c78f607\"}":{"__typename":"Favorites","uuid":"c2f9b038-d0bc-4392-b82b-fb6a6c78f607","photoUrl":"https://ucarecdn.com/ff18921b-1a27-4eb6-a869-54861d42938a/","title":"Swimming ","type":"SPORT"},"Favorites:{\"uuid\":\"b42c23ab-b762-4020-a5f8-6b7a072888d6\"}":{"__typename":"Favorites","uuid":"b42c23ab-b762-4020-a5f8-6b7a072888d6","photoUrl":"https://ucarecdn.com/7c809e2c-384a-4b7b-80b3-6eb98cb7ed54/","title":"Michael Phelps","type":"ATHLETE"},"Favorites:{\"uuid\":\"2c13c22f-023c-4b38-8b6c-6b95fc19e8e3\"}":{"__typename":"Favorites","uuid":"2c13c22f-023c-4b38-8b6c-6b95fc19e8e3","photoUrl":"https://ucarecdn.com/b0927e1a-20aa-4583-933c-45cbeca084e8/","title":"New York City ","type":"CITY"},"CausesSupported:{\"uuid\":\"1aa19740-edae-415c-bcbb-aff8d91cccd6\"}":{"__typename":"CausesSupported","uuid":"1aa19740-edae-415c-bcbb-aff8d91cccd6","name":"Special Olympics ","description":"\u003cp\u003eCoaching Special Olympics swim taught me gratitude, strength, and true joy.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/3cecd811-dfa3-4747-8b95-774b871f9e63/"},"CausesSupported:{\"uuid\":\"d99a02a2-8ee9-4660-a5e7-67e60fea1b61\"}":{"__typename":"CausesSupported","uuid":"d99a02a2-8ee9-4660-a5e7-67e60fea1b61","name":"The Food Bank Network of Somerset County","description":"","photoUrl":"https://ucarecdn.com/822da98a-bdda-491d-85fe-442928b42fca/"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"833e0065-4817-470f-b80d-783bc8a0c9bc\"}":{"__typename":"DeepDives","uuid":"833e0065-4817-470f-b80d-783bc8a0c9bc","content":"\u003cp\u003eOne of the things I’m most proud of is co-founding and winning first place in the \u003cstrong\u003eMayo Business Plan Competition\u003c/strong\u003e, where my team received $30,000 in funding for our startup, \u003cem\u003eJuniper, an AI-powered\u003c/em\u003e MedTech platform designed to make healthcare more efficient, personal, and compassionate.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe idea for \u003cem\u003eJuniper\u003c/em\u003e came from a very real place. I’ve seen people close to me struggle in doctors’ offices spending hours waiting, feeling unheard, and watching physicians buried in paperwork instead of connecting with their patients. It was frustrating to see how the system often got in the way of care. I wanted to help create something that could change that.\u003c/p\u003e\u003cp\u003eThat’s where \u003cem\u003eJuniper\u003c/em\u003e began: as a way to give time back to the people who need it most. Our platform uses real-time audio transcription to automatically document consultations, select billing codes, and update patient records allowing doctors to focus on patients, not screens. It also provides patients with an easy-to-use app to schedule appointments, track their health, and communicate directly with their providers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDeveloping \u003cem\u003eJuniper\u003c/em\u003e taught me so much about innovation, leadership, and empathy. My team spent months researching, interviewing healthcare workers, and refining our business plan. We started small, focusing on private practices and elderly care homes, where we saw the greatest need to reduce burnout and improve care.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen we heard our name announced as the winners, I felt more than excitement I felt hope. Hope that technology, when designed with compassion, can make healthcare more human. That experience reminded me why I love combining creativity and strategy: because when done with purpose, business can genuinely change lives.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"074adaf5-a166-421f-b50b-820d9991e23c\"}":{"__typename":"DeepDives","uuid":"074adaf5-a166-421f-b50b-820d9991e23c","content":"\u003cp\u003eMentorship matters to me because it’s one of the most meaningful ways to give back. I’ve always been passionate about helping others, and mentoring allows me to do that in a hands-on way by teaching, guiding, and encouraging students to see their own potential. I love helping them set goals, push past their comfort zones, and realize what they’re truly capable of achieving.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I was a freshman at The College of New Jersey, I was part of a mentorship program in the School of Business. My mentor made such a lasting impact on me. She believed in me before I believed in myself and helped me find direction when everything felt new and overwhelming. Her support inspired me to become that person for someone else.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, as a \u003cstrong\u003eCEO Peer Mentor\u003c/strong\u003e, I teach a class of more than twenty freshmen each week, helping them build confidence, develop leadership skills, and adjust to college life. I make it a priority to get to know each student as a person first, because understanding who they are helps me guide them more meaningfully.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship matters because it creates a ripple effect. My mentor once inspired me, and now I get to inspire others. Through Curious Cardinals, I hope to continue that cycle by helping students believe in themselves, take chances, and discover how far they can go when someone reminds them they’re capable.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"153ad5fe-200b-4732-8bb8-97afa20fbb1b\"}":{"__typename":"DeepDives","uuid":"153ad5fe-200b-4732-8bb8-97afa20fbb1b","content":"\u003cblockquote\u003e\u003cp\u003eI love trying new coffee shops and finding the perfect latte. I spend a lot of time hiking and enjoying the outdoors. When I’m not out exploring, I’m usually with friends and family.\u003c/p\u003e\u003c/blockquote\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"a4fa678f-6c6b-4ce3-b475-7c75e007d344\"}":{"__typename":"School","uuid":"a4fa678f-6c6b-4ce3-b475-7c75e007d344","name":"Mount Saint Mary Academy","city":"Watchung","type":"HIGH","state":"New Jersey","country":"United States","zip":"07069"},"Education:{\"uuid\":\"4c05f331-7c0e-4421-a775-35d4b0cfaef9\"}":{"__typename":"Education","uuid":"4c05f331-7c0e-4421-a775-35d4b0cfaef9","school":{"__ref":"School:{\"uuid\":\"a4fa678f-6c6b-4ce3-b475-7c75e007d344\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1a3d400-bf4d-4801-812d-7c86c0a5cf9e\"}":{"__typename":"School","uuid":"e1a3d400-bf4d-4801-812d-7c86c0a5cf9e","name":"The College of New Jersey","city":"Ewing Township","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08618"},"Education:{\"uuid\":\"e48e6f76-d68e-4170-91ad-365256127e44\"}":{"__typename":"Education","uuid":"e48e6f76-d68e-4170-91ad-365256127e44","school":{"__ref":"School:{\"uuid\":\"e1a3d400-bf4d-4801-812d-7c86c0a5cf9e\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Marketing","degree":null},"MentorPublicProfile:{\"uuid\":\"b120f8b0-b324-4601-aa82-6270b1702775\"}":{"__typename":"MentorPublicProfile","uuid":"b120f8b0-b324-4601-aa82-6270b1702775","displayName":"Livia M.","slug":"livia-minaides","biography":"\u003cp\u003eLivia is studying Marketing at The College of New Jersey, where she’s discovered her passion for the space where creativity, data, and human connection meet. She’s always been fascinated by the “why” behind what people do: why a campaign inspires someone, why a message resonates, or why a brand earns trust. To her, marketing isn’t just about numbers or design; it’s about empathy, storytelling, and creating meaningful impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt TCNJ, Livia teaches a first-year business seminar as a \u003cstrong\u003eCEO Peer Mentor\u003c/strong\u003e, helping more than twenty freshmen navigate the transition into college. She leads weekly lessons on leadership, communication, and professional development\u0026nbsp; but what she values most are the moments in between: the small conversations that help students feel seen, supported, and capable of so much more than they realize. Livia makes an intentional effort to get to know each of her students as a person first, before seeing them as a student. She believes that by understanding who they are, what excites them, and what challenges them, she can better guide their growth and confidence both inside and outside the classroom. Teaching has taught her that mentorship isn’t just about sharing knowledge; it’s about building trust, empathy, and community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the classroom, Livia serves as \u003cstrong\u003eVice President of Membership\u003c/strong\u003e for the American Marketing Association and \u003cstrong\u003eDirector of Service\u003c/strong\u003e for Zeta Tau Alpha. In both roles, she finds joy in bringing people together, organizing events, building relationships, and helping others find a sense of belonging. She’s passionate about creating spaces that are not only collaborative but kind, where creativity thrives and everyone’s ideas are valued.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, Livia has explored the marketing world through internships with \u003cstrong\u003eMJH Life Sciences\u003c/strong\u003e and \u003cstrong\u003eSavvy-Marketers\u003c/strong\u003e, where she supported projects for major clients such as \u003cstrong\u003eJohnson \u0026amp; Johnson, JPMorgan Chase,\u003c/strong\u003e and \u003cstrong\u003eChurch \u0026amp; Dwight\u003c/strong\u003e. She also leads digital content for \u003cstrong\u003eHer Briefcase\u003c/strong\u003e, a financial literacy platform dedicated to empowering young women to take control of their futures with confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn 2025, Livia co-founded and won the \u003cstrong\u003eMayo Business Plan Competition\u003c/strong\u003e with \u003cem\u003eJuniper\u003c/em\u003e, an AI-powered MedTech startup designed to make healthcare operations more efficient and accessible. The experience taught her that innovation is most powerful when guided by compassion, a lesson she carries into everything she does.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen she’s not in class or mentoring students, Livia loves hiking, exploring local cafés, and taking long drives with a good playlist. Her friends describe her as genuine, curious, and endlessly driven. As a mentor, she hopes to bring warmth, encouragement, and curiosity to every interaction, helping students discover their potential, find their purpose, and turn their ideas into something meaningful.\u003c/p\u003e","teachingVideoPlaybackId":"kfIKuqy74s7uhoVHBQhlUc6y1XeUy6LOOSJ702AVIoEg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I’m really proud of is co-founding and winning first place in the \u003cstrong\u003eMayo Business Plan Competition\u003c/strong\u003e, where my team received $30,000 for our startup, \u003cem\u003eJuniper, an AI-powered\u003c/em\u003e MedTech platform designed to make healthcare more efficient and compassionate.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe idea came from seeing people close to me struggle in doctors’ offices, where long waits and endless documentation took time away from genuine care. I wanted to change that. \u003cem\u003eJuniper\u003c/em\u003e helps doctors spend less time on paperwork and more time with patients by automatically transcribing visits, selecting billing codes, and updating medical records in real time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWinning was an incredible moment, but what meant more was realizing that something we created could make a real difference. It reminded me that innovation isn’t about recognition, it is about impact. That experience solidified my passion for using business and technology to help others in meaningful, human ways.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c2f9b038-d0bc-4392-b82b-fb6a6c78f607\"}"},{"__ref":"Favorites:{\"uuid\":\"b42c23ab-b762-4020-a5f8-6b7a072888d6\"}"},{"__ref":"Favorites:{\"uuid\":\"2c13c22f-023c-4b38-8b6c-6b95fc19e8e3\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"1aa19740-edae-415c-bcbb-aff8d91cccd6\"}"},{"__ref":"CausesSupported:{\"uuid\":\"d99a02a2-8ee9-4660-a5e7-67e60fea1b61\"}"}],"major":"Marketing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"833e0065-4817-470f-b80d-783bc8a0c9bc\"}"},{"__ref":"DeepDives:{\"uuid\":\"074adaf5-a166-421f-b50b-820d9991e23c\"}"},{"__ref":"DeepDives:{\"uuid\":\"153ad5fe-200b-4732-8bb8-97afa20fbb1b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/70366af6-74dc-4ecf-aa96-366dc8b4b3a2/-/preview/-/format/jpg/","https://ucarecdn.com/3bd38dc5-06d6-4ba6-8d9a-6627906148c2/-/preview/-/format/jpg/","https://ucarecdn.com/c3bc1c83-ddeb-4372-97c1-3a0477a93881/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4c05f3
