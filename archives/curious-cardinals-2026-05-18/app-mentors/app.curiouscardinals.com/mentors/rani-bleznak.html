xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"26140d1b-5b62-46e4-8dad-5319783a5943\"}":{"__typename":"Favorites","uuid":"26140d1b-5b62-46e4-8dad-5319783a5943","photoUrl":"https://ucarecdn.com/8f64a96b-4e28-4c9e-a911-586cf7611a27/","title":"Jalen Hurts","type":"ATHLETE"},"Favorites:{\"uuid\":\"c85abb33-8b87-46ee-8a2f-218b8d30f36d\"}":{"__typename":"Favorites","uuid":"c85abb33-8b87-46ee-8a2f-218b8d30f36d","photoUrl":"https://ucarecdn.com/24d1a037-3028-4918-9cf7-4daa813b8d24/","title":"Soccer","type":"SPORT"},"Favorites:{\"uuid\":\"c96f997b-2ae2-49b2-bfb5-2479fde3b9cc\"}":{"__typename":"Favorites","uuid":"c96f997b-2ae2-49b2-bfb5-2479fde3b9cc","photoUrl":"https://ucarecdn.com/89670867-2020-4801-9b15-cbfb506fcf74/","title":"Copenhagen","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8e7c43b5-6677-43b0-98da-1fc394379172\"}":{"__typename":"DeepDives","uuid":"8e7c43b5-6677-43b0-98da-1fc394379172","content":"\u003cp\u003eI truly believe that every good mentor was once a mentee, and I would not be where I am today without the various mentors I have had to get me here. Mentorship is so crucial to open one's eyes to the endless possibilities they can pursue, and I want to do that for as many others as I can!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"79a06c8b-8f44-4fbf-9264-997afa7ca824\"}":{"__typename":"DeepDives","uuid":"79a06c8b-8f44-4fbf-9264-997afa7ca824","content":"\u003cp\u003eI would love to be the commissioner of a sports league one day!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"1820ec25-6031-4571-b914-37774a462454\"}":{"__typename":"DeepDives","uuid":"1820ec25-6031-4571-b914-37774a462454","content":"\u003cp\u003eI was motivated by grades, but I often failed to see the bigger picture. It took a lot of mentors and life lessons to show me that grades are not all that matter.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7b35d419-aa66-4a07-bb60-5ef18248ed2b\"}":{"__typename":"DeepDives","uuid":"7b35d419-aa66-4a07-bb60-5ef18248ed2b","content":"\u003cp\u003eDuring COVID, I started a summer camp for kids to safely leave their houses. I also worked as an SAT tutor for students younger than me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"015da320-1cc8-41d5-bb87-8d2f8cc76a30\"}":{"__typename":"School","uuid":"015da320-1cc8-41d5-bb87-8d2f8cc76a30","name":"The Baldwin School","city":"Bryn Mawr","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19010"},"Education:{\"uuid\":\"4cf26c56-4883-48d5-bb0b-9c8f2bf288e4\"}":{"__typename":"Education","uuid":"4cf26c56-4883-48d5-bb0b-9c8f2bf288e4","school":{"__ref":"School:{\"uuid\":\"015da320-1cc8-41d5-bb87-8d2f8cc76a30\"}"},"startYear":"2007","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"40654972-ea25-45ca-a3e8-f46a1c9a5ff5\"}":{"__typename":"Education","uuid":"40654972-ea25-45ca-a3e8-f46a1c9a5ff5","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Public Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"b70594d9-bff2-489c-82c4-6fcdfce85b60\"}":{"__typename":"MentorPublicProfile","uuid":"b70594d9-bff2-489c-82c4-6fcdfce85b60","displayName":"Rani B.","slug":"rani-bleznak","biography":"\u003cp\u003eHi, everyone! My name is Rani Bleznak, and I recently graduated from Duke University with a major in Public Policy and a certificate in Innovation \u0026amp; Entrepreneurship. I entered college unsure of my exact field of study, and these two tracks allowed me to pursue my various interests while also engaging in extracurricular activities, including coaching basketball to Durham youth, managing the Duke football team, leading a freshman orientation program, and leading partnerships for Duke Sports Business. I attended as many Duke sports games as possible and slept outside in tents for months on end for basketball tickets, taking advantage of all of the magic of Duke. Prior to Duke, I served as my high school’s Senate head and worked on Congresswoman Scanlon’s Youth Cabinet, inspiring my interest in Public Policy. I was also Soccer Captain and a 5-year varsity basketball player, and the combination of my interests led me to Duke, a place where I could engage in all different areas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I am starting work at Moody's as a Sales Analyst in New York City, and I previously worked at the NBA as a Marketing Partnerships and Media intern. In this role, I assisted the day-to-day management and activation of multi-property partners, contributed to key partnership renewals, and worked on the ground at the NBA Draft and WNBA All-Star in Phoenix. This summer was very formative for me, bolstering my desire to understand and work in the business of sports and reiterating the importance of soft skills, the things they don’t necessarily teach you in a classroom. I want to incorporate these lessons in every lesson I teach through Curious Cardinals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school and work, I love playing soccer, cooking, cheering on all of my favorite sports teams, and going on adventures with friends and family. I have always had a great desire to explore, whether I'm in my hometown or studying abroad, and this has led me to live in New York City, a place where every day can be a new journey. I am often found playing soccer in Battery Park City, followed by dumplings and a long walk on the West Side Highway. I hope to inspire everyone I mentor in any subject area with a sense of curiosity and desire to explore more.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you have any questions for me, don’t hesitate to reach out, and I look forward to getting to know and work with you!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"TVB8kwg0002kyPX63ceDvnhFD8ZQsU01u43m7TJwTwZctk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eFollowing my internship at the NBA, I stayed in touch with Commissioner Adam Silver and invited him to come speak to my sports club at Duke. He came down and imparted wisdom upon us all, and it was such an amazing experience!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"26140d1b-5b62-46e4-8dad-5319783a5943\"}"},{"__ref":"Favorites:{\"uuid\":\"c85abb33-8b87-46ee-8a2f-218b8d30f36d\"}"},{"__ref":"Favorites:{\"uuid\":\"c96f997b-2ae2-49b2-bfb5-2479fde3b9cc\"}"}
