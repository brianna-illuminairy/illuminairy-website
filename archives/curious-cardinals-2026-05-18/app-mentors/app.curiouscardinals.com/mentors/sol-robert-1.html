xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e229d4c7-71fa-4ce8-9d66-52a78d56980c\"}":{"__typename":"DeepDives","uuid":"e229d4c7-71fa-4ce8-9d66-52a78d56980c","content":"\u003cp\u003eI spent most of my youth trying to answer \"why?\" for almost everything around me. As I grew older, I realized the most interesting questions for me revolved around the human body and our existence. By devoting myself to studying the brain and molecular biochemistry around it, I have been able to answer many of my original whys, and I have been inspired to answer tenfold more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e07a32f3-88ae-4d2f-bc1b-5643111fcf80\"}":{"__typename":"DeepDives","uuid":"e07a32f3-88ae-4d2f-bc1b-5643111fcf80","content":"\u003cp\u003eIt is okay to not have everything figured out! Life is complicated. Feeling lost is all part of the process to find the path that is right for you. You are allowed to fail and make mistakes; these will often be the key moments that provide you direction and insight into your future. As long as you work hard and remain true to yourself, the rest will fall into place!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f1f6277f-c38b-4ad5-abf5-7da1eb870df5\"}":{"__typename":"DeepDives","uuid":"f1f6277f-c38b-4ad5-abf5-7da1eb870df5","content":"\u003cp\u003eOne of my largest regrets in my academic journey was being too afraid and ashamed to ask for help. There were so many opportunities and desired advice that I could have had if I had connected to a mentor figure. I want to ease that journey for students who remind me of myself at their age and continue to inspire a love and curiosity for learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1186909b-4398-4041-ae56-984a7a6e1174\"}":{"__typename":"DeepDives","uuid":"1186909b-4398-4041-ae56-984a7a6e1174","content":"\u003cp\u003eA passion project I created was a two-week STEM workshop designed for Korean middle school students. We focused on discovering chemistry and enforcing creativity through cooking. With a budget of 2000$, we were able to create a space where students could have fun learning about biochemistry while building the concepts out with household items and their own hands. I hope to continue exciting a love for learning through my time at CC!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}":{"__typename":"School","uuid":"1dc8c564-7629-4af5-851c-69ed64a8870e","name":"Ransom Everglades High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33133"},"Education:{\"uuid\":\"a45a6151-79e7-4fda-9b33-64d32fca7905\"}":{"__typename":"Education","uuid":"a45a6151-79e7-4fda-9b33-64d32fca7905","school":{"__ref":"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}":{"__typename":"School","uuid":"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a","name":"Massachusetts Institute of Technology","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02139"},"Education:{\"uuid\":\"0df38ad1-7da8-4aed-81fe-87d396959891\"}":{"__typename":"Education","uuid":"0df38ad1-7da8-4aed-81fe-87d396959891","school":{"__ref":"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"5-7 (Biology and Chemistry) + 9 (Brain and Cognitive Science)","degree":null},"MentorPublicProfile:{\"uuid\":\"10407a1c-2144-4246-a1cd-a42658ff65f0\"}":{"__typename":"MentorPublicProfile","uuid":"10407a1c-2144-4246-a1cd-a42658ff65f0","displayName":"Sol R.","slug":"sol-robert-1","biography":"\u003ch3\u003eSol, Biochemistry/Neuroscience (Passion Project or Academic Mentorship)\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eHi there! I’m Sol, a senior undergraduate student at MIT, and I help students enhance their curiosity into STEM applications!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003eA bit about me:\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI was always the type of student to study hard and focus on tests, but since coming to MIT, I have realized the most formative learning experiences are those that involved my own interests alongside hands-on activities. These past four years have shown me that interactive learning was the missing puzzle piece I needed back when I was in middle and high school. \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eSome fun facts about what I do:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConducted \u003cstrong\u003epre-clinical research\u003c/strong\u003e at MIT\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eKoch Institute @ Yilmaz Lab - tissue culture + mice work to discover nutritional cures to colon cancer\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePicower Institute @ Choi Lab - mouse perfusion, staining, and imaging to identify neuroimmunology pathways when healthy mice are exposed to sick mice + ML model for behavioral mouse analysis\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked on a \u003cstrong\u003eGTL Korea \u003c/strong\u003eworkshop 2 years in a row focusing on educating less privileged middle school students in Changwon, Seoul and Busan in biochemistry\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eThese experiences taught me how to organize my own research as well as how to communicate it to a younger student audience!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003eWhat I specialize in\u003c/h3\u003e\u003cp\u003eI mentor students who want to explore:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eIntroductory biochemistry/neuroscience research\u003c/strong\u003e (designing small experiments you can do at home, analyzing the results, writing and submitting the research paper)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScience communication\u003c/strong\u003e (presentations, blogs, podcasts, or other social media content)\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also help students build the skills that really determine whether a project takes off or fizzles out. I’ve worked with mentees on how to reach out to researchers and professionals, and how to talk about their work with confidence in presentations, poster sessions, and interviews.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eWhy I’m qualified to help you:\u003c/p\u003e\u003cp\u003e\u003cbr\u003eIn both high school and college, I’ve been a peer mentor, guiding dozens of students through STEM and health‑related projects and tutoring. I have also worked on several papers and presented my own research posters and papers in several different areas. I bring that same mix of rigor, encouragement, and practical strategy I use on my own work to every student I collaborate with.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eHelping you take a vague interest (“neuroscience seems cool”) and turn it into a sharp, original project idea\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCo-creating a roadmap with concrete next steps and checkpoints, so you always know what to do \u003cem\u003ethis\u003c/em\u003e week\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCoaching you on how to explain your work so it sounds clear, compelling, and truly yours\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eRunning challenge rounds where I play the unreasonably tough evaluator, so you can practice staying steady and answering hard questions under pressure\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003eOutside of school\u003c/h3\u003e\u003cp\u003eOutside of school, I’m a big fan of \u003cstrong\u003ehip hop dance, music \u003c/strong\u003e(especially R\u0026amp;B and K-Pop)\u003cstrong\u003e, walking in nature, and reading mystery novels\u003c/strong\u003e. I am always interested in interdisciplinary connections between arts/humanities with STEM passions.\u003c/p\u003e\u003cp\u003eIf you’re excited to learn, willing to put in the work, and want a project that genuinely feels like \u003cem\u003eyours\u003c/em\u003e, I’m here to help you bring it from idea to reality.\u003c/p\u003e","teachingVideoPlaybackId":"S1IFLW2VSdV8UO8SYDAXOFUWqI6Ks7ia7Jx01JsfvU6U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"5-7 (Biology and Chemistry) + 9 (Brain and Cognitive Science)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e229d4c7-71fa-4ce8-9d66-52a78d56980c\"}"},{"__ref":"DeepDives:{\"uuid\":\"e07a32f3-88ae-4d2f-bc1b-5643111fcf80\"}"},{"__ref":"DeepDives:{\"uuid\":\"f1f6277f-c38b-4ad5-abf5-7da1eb870df5\"}"},{"__ref":"DeepDives:{\"uuid\":\"1186909b-4398-4041-ae56-984a7a6e1174\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2e0197ab-c931-411a-88de-dbc6902792b6/-/preview/-/format/jpg/","https://ucarecdn.com/2c73780d-a280-4678-92a2-19a9975ec797/-/preview/-/format/jpg/","https://ucarecdn.com/d5456055-0e76-4c63-a50e-f8f131483732/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a45a6151-79e7-4fda-9b33-64d32fca7905\"}"},{"__ref":"Education:{\"uuid\":\"0df38ad1-7da8-4aed-81fe-87d396959891\"}"}],"hiredAt":"2026-01-21T15:51:52.897Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Chemistry","Biology","Writing","French","Academic Coaching","College Essay Writing","Reading","Executive Function","Fashion / Cosmetics","K-6 Storybook","Creative Writing","Medicine / Health","STEM Project","Law / Government / Policy","Public Speaking","Debate"],"communityBadges":["https://ucarecdn.com/7888bd4b-612e-4eb6-94e7-3442bd9a4a01/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sol-robert-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"10407a1c-2144-4246-a1cd-a42658ff65f0\"}"}}},"_sentryTraceData":"496bf53288e7470593b57d83cf2a5c0f-996c3c92866665d5-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38
