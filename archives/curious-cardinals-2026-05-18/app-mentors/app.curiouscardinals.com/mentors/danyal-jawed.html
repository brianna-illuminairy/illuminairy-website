xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f20213a0-f4b2-4489-b2b5-54ea2a445c8f\"}":{"__typename":"DeepDives","uuid":"f20213a0-f4b2-4489-b2b5-54ea2a445c8f","content":"\u003cp\u003eAs a younger brother, I can't overstate the effect having an older sibling who had experienced a lot of the things I was going through, whether it be academically, professionally, socially, had on me growing up. I am extremely grateful for the lessons and mentorship I have received from my brother and hope to be able to leverage my experiences to have a similar impact on others through mentorship!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b23673a6-0ee3-463d-90c2-08064d2db750\"}":{"__typename":"DeepDives","uuid":"b23673a6-0ee3-463d-90c2-08064d2db750","content":"\u003cp\u003eMy favorite thing to do in my free time is to get outside and play any type of sport casually with friends like pickup basketball, pickleball, and spikeball!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"cdfa7805-5fc0-4b78-9324-4574e2adc814\"}":{"__typename":"DeepDives","uuid":"cdfa7805-5fc0-4b78-9324-4574e2adc814","content":"\u003cp\u003eEconomics excites me because of its intuitiveness and wide-spanning applications. Whether it be understanding businesses and markets or coaching decisions in sports games, economic models and frameworks are extremely fun to think through and even apply day-to-day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a8a27fd0-ebc6-4654-8c39-82ca64f1d22a\"}":{"__typename":"DeepDives","uuid":"a8a27fd0-ebc6-4654-8c39-82ca64f1d22a","content":"\u003cp\u003eI am currently working on developing my own software company and have learned so much ranging from the technical development aspects of starting a tech company to the business management and sales side of things.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"a633de03-e69e-4a20-9317-4e41c4351df1\"}":{"__typename":"Education","uuid":"a633de03-e69e-4a20-9317-4e41c4351df1","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":"A.B."},"School:{\"uuid\":\"f6d817a3-8035-45eb-9184-6a6355fc41b7\"}":{"__typename":"School","uuid":"f6d817a3-8035-45eb-9184-6a6355fc41b7","name":"Hinsdale Central High School","city":"Hinsdale","type":"HIGH","state":"Illinois","country":"United States","zip":"60521"},"Education:{\"uuid\":\"d819656d-fe83-483f-9c73-a3187bcc00d2\"}":{"__typename":"Education","uuid":"d819656d-fe83-483f-9c73-a3187bcc00d2","school":{"__ref":"School:{\"uuid\":\"f6d817a3-8035-45eb-9184-6a6355fc41b7\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"0c74833f-8b00-4dd3-9dbd-d8d4b8b30845\"}":{"__typename":"MentorPublicProfile","uuid":"0c74833f-8b00-4dd3-9dbd-d8d4b8b30845","displayName":"Danyal J.","slug":"danyal-jawed","biography":"\u003cp\u003eHi everyone, my name is Danyal and I'm currently a junior at Princeton studying economics. I'm so excited to get to work with you and have included a bit more context on my background to help you get to know me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I have a strong interest in technology, innovation, entrepreneurship, and investing. This summer, I will be interning in software private equity in the bay area, and I spent a couple of summers working at a start up and two venture capital firms. Furthermore, I am currently working on my own passion project, building a SaaS company! I love talking all things tech, finance, and entrepreneurship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I really enjoy economics and actually got to join the Fed Challenge Team here at Princeton, where we took 2nd and 1st nationally the past two years. I've had the chance to explore really cool applications of econ outside of the classroom such as the intersection of economics and sports, economics and the internet, and macroeconomics more generally. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a younger sibling and someone who has learned a lot from the mentors in my life, I believe strongly in the power of mentorship and hope to work closely with you and give it my all to support you in your academic, professional, and personal endeavors.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy favorite thing to
