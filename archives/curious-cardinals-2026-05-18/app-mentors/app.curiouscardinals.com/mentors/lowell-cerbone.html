xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f55d418e-1beb-4cf9-a0ac-0827a6685258\"}":{"__typename":"DeepDives","uuid":"f55d418e-1beb-4cf9-a0ac-0827a6685258","content":"\u003cp\u003eI was lucky enough to grow up with an older brother that was a role model of academic and career success. Throughout middle and high school, he went out of his way to take advanced courses, fully committed to his extracurricular activities, and aspired to attend a top university after graduation. I often wonder if I would’ve been Valedictorian and gotten into Columbia without him. I know that many don’t have an older brother to turn to for advice on how to excel in school, pursue their passions to the greatest extent, and dream of success in and out of the classroom. I’m thrilled to be able to serve as that mentor for someone in a stage of life I was in just a few years ago. In my experience as a teaching assistant in New York public schools, an Ignite Fellow for Teach for America, and a camp counselor at 4-H camp, I realize the impact of being an engaged mentor to young children. I realize the potential one child who needs a little extra help with their school work or needs assistance with a passion project has. I’m honored to be the mentor that a talented student needs to succeed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b6e48d00-3960-4b17-89ea-52b5045500a4\"}":{"__typename":"DeepDives","uuid":"b6e48d00-3960-4b17-89ea-52b5045500a4","content":"\u003cp\u003eAs a young child, I was always sketching Pokémon characters, scenes from vacation, and animals I saw in nature or building elaborate “set-ups” with magnet blocks, wooden blocks, and animal figurines. In elementary school, however, I became specifically interested in architecture. \u0026nbsp;In sixth grade, I researched the early 20th century Bauhaus movement for the Social Studies fair.\u0026nbsp;I learned about the movement’s combining the principles of fine art and functionality, its influence on many of the buildings and products we see today, and its hope to create a more just world by designing clean and visually appealing environments for the working class. I found a love for carefully planning and constructing cardboard buildings.\u0026nbsp;I built a diorama of Walter Gropius’ Bauhaus School, using cardboard, paper, and an Exacto knife. The challenge of crafting this complex building encouraged me to design other buildings for individual projects in the Talented and Gifted program at school. I realized that architecture isn’t just about designing the most attractive buildings; it’s about addressing important issues the world faces such as ever-growing wealth disparities and the effects of climate change. I decided that my mind and skills would be best utilized in the field of Architecture.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"c04b4be4-7b21-4f04-93a8-b11860acf977\"}":{"__typename":"School","uuid":"c04b4be4-7b21-4f04-93a8-b11860acf977","name":"Preston High School","city":"Kingwood","type":"HIGH","state":"WV","country":"United States","zip":"26537"},"Education:{\"uuid\":\"5544d812-efc7-46f4-8c4b-034b230880fa\"}":{"__typename":"Education","uuid":"5544d812-efc7-46f4-8c4b-034b230880fa","school":{"__ref":"School:{\"uuid\":\"c04b4be4-7b21-4f04-93a8-b11860acf977\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"c8c765ca-f56b-4ef4-88d4-f7c0bc368fca\"}":{"__typename":"Education","uuid":"c8c765ca-f56b-4ef4-88d4-f7c0bc368fca","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Architecture","degree":null},"Testimonial:da6aeb8a-539e-4b5a-89e4-f287de2fd241":{"__typename":"Testimonial","id":"da6aeb8a-539e-4b5a-89e4-f287de2fd241","text":"Lowell Cerbone has been an outstanding mentor for my son, Bradley M, a junior in high school. Lowell has taught and guided Bradley to learn a lot of about architecture and design. He has furthered Bradley's interest in the field with his encouraging attitude and by sharing fascinating real-world projects he has been involved in college.","date":"2025-06-01 22:44:27.92+00","rating":5,"endorser":{"__typename":"Endorser","name":"Wendy Miele","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"ca1abc3a-7aee-41b5-9d16-9cfe44d61a3c\"}":{"__typename":"MentorPublicProfile","uuid":"ca1abc3a-7aee-41b5-9d16-9cfe44d61a3c","displayName":"Lowell C.","slug":"lowell-cerbone","biography":"\u003cp\u003eMy name is Lowell Cerbone and I am a Junior at Columbia University in New York City. I study architecture but I’m also interested in art history, urban planning, and film. I was born and raised in West Virginia but I’ve loved the adjustment to living in the city. At Columbia, I am a member of the Architecture Society, a peer-reviewer for the Urban Review, and an Engagement Fellow for Hillel. Beyond those roles, I am an Ignite Fellow for Teach for America in which I lead virtual learning experiences for students in underserved areas. In past semesters, I have been involved with AmericaReads in which I served as a teaching assistant in fourth-grade classrooms in Harlem.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThough I take all of these roles seriously, architecture has been my true passion since as early as elementary school. That interest has persisted through numerous studio courses in college, involvement with architecture clubs and publications, and an internship last summer at an architecture firm in Midtown. I am ready to facilitate any design-oriented passion project or answer any questions about the discipline. In addition, Columbia’s extensive Core Curriculum has prepared me to discuss literature and philosophy at a college level.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school, I love hiking, yoga, antiquing, watching movies, and throwing pots. Before college, I was a serious cross country runner, and now I love to run in the park. My upbringing in rural West Virginia introduced me to many other activities such as raising chickens, vegetable gardening, and landscaping. Most recently, I have found a love for cooking and hosting dinner parties during my summer internship in the city.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFrom working as a camp counselor at 4-H camp to tutoring public school students in Harlem and now as a mentor for Curious Cardinals, I’ve found great joy in working with children. I look forward to building on your child’s skills and interests to become the best version of themselves!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Architecture","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f55d418e-1beb-4cf9-a0ac-0827a6685258\"}"},{"__ref":"DeepDives:{\"uuid\":\"b6e48d00-3960-4b17-89ea-52b5045500a4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/416a6281-9857-4bf1-892a-af27d15f3e5c/-/preview/-/format/jpg/","https://ucarecdn.com/9b60b06e-cee4-4570-8b89-35418e8c1373/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5544d812-efc7-46f4-8c4b-034b230880fa\"}"},{"__ref":"Education:{\"uuid\":\"c8c765ca-f56b-4ef4-88d4-f7c0bc368fca\"}"}],"hiredAt":"2024-08-26T23:40:06.167Z","topics":["Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Writing","Academic Coaching","College Essay Writing","Reading","Creative Writing","History Project","K-6 Storybook","Video / Photography","Visual Arts / Graphic Design"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:da6aeb8a-539e-4b5a-89e4-f287de2fd241"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lowell-cerbone\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ca1abc3a-7aee-41b5-9d16-9cfe44d61a3c\"}"}}},"_sentryTraceData":"7b581ffba29f458fa59a3be65af2302e-907048e7a3507d04-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7b581ffba29f458fa59a3be65af2302e,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"lowell-cerbone"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'}
