xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"91a7fb89-0c0a-441d-b58a-2aadefb63c03\"}":{"__typename":"Favorites","uuid":"91a7fb89-0c0a-441d-b58a-2aadefb63c03","photoUrl":"https://ucarecdn.com/80671c4d-31a2-492b-bbee-3e6b6a13f81f/","title":"When Breath Becomes Air ","type":"BOOK"},"CausesSupported:{\"uuid\":\"0900dc99-2078-4ba7-bd14-d479722963c8\"}":{"__typename":"CausesSupported","uuid":"0900dc99-2078-4ba7-bd14-d479722963c8","name":"Crohns and Colitis Foundation","description":"\u003cp\u003eI create dances and seminars to support IBD patients and explore stress relief.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/6d4e5a50-df68-4d8e-b9d4-67e2225fb213/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"33eb50ea-b008-48ec-afc4-736041e81e21\"}":{"__typename":"DeepDives","uuid":"33eb50ea-b008-48ec-afc4-736041e81e21","content":"\u003cp\u003eI’d tell my middle or high school self: Dream as big as you possibly can—bigger than your classroom, your town, or even what feels realistic right now. The world is so much larger and more exciting than it seems, and you’re capable of being a part of something incredible. Find mentors who inspire you, ask them all your questions, and let them help you see the potential you might not see in yourself yet. And most importantly, don’t be afraid to wonder about “what if?”—those moments of curiosity are where the magic happens!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"8abaf835-1398-4311-b4c7-73d12b0d67d1\"}":{"__typename":"DeepDives","uuid":"8abaf835-1398-4311-b4c7-73d12b0d67d1","content":"\u003cp\u003eMentorship holds a special place in my heart because I’ve experienced firsthand how life-changing a great mentor can be. Growing up, I was incredibly lucky to have mentors who believed in me, challenged me, and opened doors I didn’t even know existed. They didn’t just teach me—they helped me dream bigger and pushed me to reach beyond what I thought was possible. Those experiences completely changed the trajectory of my life, and I’d love to do the same for others. Being a mentor means paying forward the guidance and encouragement I received, and there’s nothing more rewarding than helping someone realize their potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"660cc667-0e0a-4967-8ace-da4a2a14cac9\"}":{"__typename":"DeepDives","uuid":"660cc667-0e0a-4967-8ace-da4a2a14cac9","content":"\u003cp\u003eMy South Asian heritage and identity deeply influence my teaching style by inspiring me to value storytelling, adaptability, and cultural sensitivity. Growing up in a community that emphasized both tradition and innovation, I learned how powerful it is to approach challenges with creativity while staying grounded in core values. In teaching, this translates to finding engaging, relatable ways to connect material to a student’s unique perspective—whether through drawing parallels to their interests or framing lessons in ways that resonate with their experiences.\u003c/p\u003e\u003cp\u003eAs someone who’s navigated different cultural worlds, I’m also mindful of how identity shapes learning. I strive to create an inclusive space where students feel seen, understood, and encouraged to express themselves. My heritage reminds me of the importance of empathy, patience, and the belief that every student’s story adds something valuable to the learning process. This approach not only enriches the material but also makes learning a collaborative and meaningful experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"ce59c36f-62bf-4b4b-a3c3-e5e893da1f4e\"}":{"__typename":"School","uuid":"ce59c36f-62bf-4b4b-a3c3-e5e893da1f4e","name":"Union High School","city":"Tulsa","type":"HIGH","state":"Oklahoma","country":"United States","zip":"74133"},"Education:{\"uuid\":\"19047ae4-c1a0-4f42-8913-6ef48a9ac7fb\"}":{"__typename":"Education","uuid":"19047ae4-c1a0-4f42-8913-6ef48a9ac7fb","school":{"__ref":"School:{\"uuid\":\"ce59c36f-62bf-4b4b-a3c3-e5e893da1f4e\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1cce7192-3bc7-41ee-b030-89245912b1f6\"}":{"__typename":"Education","uuid":"1cce7192-3bc7-41ee-b030-89245912b1f6","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"dc0d4d1e-c565-4859-8ddc-ccb9e8f846be\"}":{"__typename":"MentorPublicProfile","uuid":"dc0d4d1e-c565-4859-8ddc-ccb9e8f846be","displayName":"Shrea T.","slug":"shrea-tyagi","biography":"\u003cp\u003eHello! I’m Shrea, a senior at Yale University with a passion for combining curiosity, creativity, and problem-solving to make learning an exciting journey. While at Yale, I’ve spent my time unraveling neural circuits, pitching award-winning ideas, and building solutions for global health challenges. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship is one of my favorite ways to share the curiosity and creativity I’ve cultivated through these experiences—and to help students discover their own superpowers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I believe in transforming challenges into opportunities for growth. Whether it’s breaking down complex math concepts, crafting compelling essays, or tackling STEM projects, I focus on fostering critical thinking, creativity, and confidence. My background in research, leadership, and the arts enables me to connect seemingly unrelated ideas, making every subject engaging and accessible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEach mentoring session is a collaborative experience, tailored to individual learning styles and designed to spark curiosity. My goal is to empower students to approach problems with excitement, embrace new perspectives, and take pride in their progress. With a balance of structure, patience, and innovative teaching, I strive to make every moment of learning meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether we’re tackling tricky math problems, mastering the art of persuasive speaking, or exploring the intersection of storytelling and science, I love finding unexpected ways to make learning exciting. I thrive on blending structure and creativity—a philosophy I bring to every mentoring session.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore than just tutoring, I focus on mentoring in a way that builds confidence, independence, and a genuine love of learning. I am excited to share my knowledge, create engaging learning experiences, and provide the tools needed to navigate challenges and succeed in any endeavor. My approach is all about fostering curiosity and uncovering strengths, and I can’t wait to inspire growth and discovery through every session!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"91a7fb89-0c0a-441d-b58a-2aadefb63c03\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0900dc99-2078-4ba7-bd14-d479722963c8\"}"}],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"33eb50ea-b008-48ec-afc4-736041e81e21\"}"},{"__ref":"DeepDives:{\"uuid\":\"8abaf835-1398-4311-b4c7-73d12b0d67d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"660cc667-0e0a-4967-8ace-da4a2a14cac9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ab27549a-27b8-4d75-b099-8aadc1d2adef/-/preview/-/format/jpg/","https://ucarecdn.com/1851288e-ac13-4d14-9d3a-1bd00f9c4cf8/-/preview/-/format/jpg/","https://ucarecdn.com/321ad9f2-a039-4d39-b270-e72ddf6878ea/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"19047ae4-c1a0-4f42-8913-6ef48a9ac7fb\"}"},{"__ref":"Education:{\"uuid\":\"1cce7192-3bc7-41ee-b030-89245912b1f6\"}"}],"hiredAt":"2024-11-20T11:55:52.152Z","topics":["K-5 Grade Math","Algebra I","Algebra II","Calculus","Pre-Algebra","Chemistry","6-8 Grade Science","Physics","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Creative Writing","K-6 Storybook","Business / Entrepreneurship","STEM Project","Medicine / Health","Web Design","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"shrea-tyagi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"dc0d4d1e-c565-4859-8ddc-ccb9e8f846be\"}"}}},"_sentryTraceData":"93f315d47fba40dbab14e3cc78b
