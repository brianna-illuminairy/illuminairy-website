xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ed99ec3a-d878-4338-867d-522c63d3b95e\"}":{"__typename":"DeepDives","uuid":"ed99ec3a-d878-4338-867d-522c63d3b95e","content":"\u003cp\u003eUse your time wisely and discover your passions. Don't be afraid to get your hands dirty. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d7f4869f-4cdd-4098-a0f1-5aba47aca37a\"}":{"__typename":"DeepDives","uuid":"d7f4869f-4cdd-4098-a0f1-5aba47aca37a","content":"\u003cp\u003eMy dream is to found a school to inspire our next generations for years to come and help them reach their individual potential. I want to make school fun, efficient and help students find their unique purpose.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"8ae98dfb-4eb9-46ac-8995-15b0b1cfae7b\"}":{"__typename":"DeepDives","uuid":"8ae98dfb-4eb9-46ac-8995-15b0b1cfae7b","content":"\u003cp\u003eMy parents are both from Sri Lanka - neither of them went to college. I am very grateful that I not only had the opportunity to get a university degree, but also graduate from an Ivy League School. This is why I want to mentor other students and share my insights with them. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c404d81d-74da-4870-8c61-b2c603f24a22\"}":{"__typename":"DeepDives","uuid":"c404d81d-74da-4870-8c61-b2c603f24a22","content":"\u003cp\u003eMy favorite subjects in school were Math and Biology. I did not want to become a mechanical engineer, nor a physician - so I decided to combine those subjects and pursued a career in Biomedical Engineering.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"eb8c7b62-f9c8-4d76-8382-ebb047b9a07c\"}":{"__typename":"School","uuid":"eb8c7b62-f9c8-4d76-8382-ebb047b9a07c","name":"Ritzefeld-Gymnasium Stolberg","city":"Stolberg","type":"HIGH","state":"Nordrhein-Westfalen","country":"Germany","zip":"52222"},"Education:{\"uuid\":\"79042b60-0872-4d4e-a27b-43db77199238\"}":{"__typename":"Education","uuid":"79042b60-0872-4d4e-a27b-43db77199238","school":{"__ref":"School:{\"uuid\":\"eb8c7b62-f9c8-4d76-8382-ebb047b9a07c\"}"},"startYear":"2009","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"f160d20b-f667-4de7-991f-96de38bd1d54\"}":{"__typename":"Education","uuid":"f160d20b-f667-4de7-991f-96de38bd1d54","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2023","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"1587ae46-cff1-4053-8401-768692e0c790\"}":{"__typename":"MentorPublicProfile","uuid":"1587ae46-cff1-4053-8401-768692e0c790","displayName":"Rashad I.","slug":"rashad-ismail","biography":"\u003cp\u003eI’m someone who sits at the intersection of engineering, product thinking, and community-building. At my core, I care deeply about using technology and structured problem-solving to improve people’s lives - not just in theory, but in ways that are practical, human, and sustainable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, my background is in \u003cstrong\u003eBiomedical Engineering\u003c/strong\u003e, with a strong emphasis on \u003cstrong\u003emechanical engineering and design\u003c/strong\u003e. I completed my undergraduate studies in Bavaria, Germany, where I was trained in a rigorous, systems-oriented engineering environment that emphasized precision, responsibility, and long-term thinking. Afterwards, I moved to the US to pursue my \u003cstrong\u003eMaster’s degree in Biomedical Engineering at Columbia University\u003c/strong\u003e, where I continued to deepen my technical foundation while expanding into areas like product strategy, innovation, and interdisciplinary collaboration.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have been tutoring students since \u003cstrong\u003egrade 8\u003c/strong\u003e, initially helping friends and neighbors and later supporting learners across different ages and academic levels. This long-term experience taught me how to explain complex topics clearly, adapt to individual learning styles, and build students’ confidence - not just their grades. Professionally, I served as \u003cstrong\u003eHead of Consulting Services at Aelius Foerderwerk\u003c/strong\u003e, where I worked closely with students and parents on academic planning, scholarships, and post-school pathways. I led consultations, coordinated expert advisors, and helped families turn uncertainty into clear, structured plans. Parents choose me because I combine years of hands-on tutoring with strategic guidance, strong communication, and a genuine commitment to their child’s long-term success, not just short-term academic performance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of formal academics, I’ve been deeply involved in \u003cstrong\u003ecommunity-driven initiatives\u003c/strong\u003e. I helped think through ways to identify people’s skills, match them with community needs, and reduce friction in volunteering and collaboration. What stood out to me was that communities often don’t lack talent - they lack structure and intentional connection.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf there’s a consistent thread through my experiences, it’s this: I’m motivated by building bridges - between disciplines, between people, and between ideas and execution. Students who work with me can expect someone who values \u003cstrong\u003eclarity, curiosity, and purpose\u003c/strong\u003e, and who believes that learning is most powerful when it’s connected to real problems and real people. My goal is not just to teach skills, but to help others think more intentionally about how they can use what they know to contribute meaningfully to the world.\u003c/p\u003e","teachingVideoPlaybackId":"Q1RZaZj9rDsnQ68ODT7vkoPW4AFS7rp3tcQExOXEd94","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ed99ec3a-d878-4338-867d-522c63d3b95e\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7f4869f-4cdd-4098-a0f1-5aba47aca37a\"}"},{"__ref":"DeepDives:{\"uuid\":\"8ae98dfb-4eb9-46ac-8995-15b0b1cfae7b\"}"},{"__ref":"DeepDives:{\"uuid\":\"c404d81d-74da-4870-8c61-b2c603f24a22\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3f69356b-ca29-461e-bb8e-78d6a51c24ba/-/preview/-/format/jpg/","https://ucar
