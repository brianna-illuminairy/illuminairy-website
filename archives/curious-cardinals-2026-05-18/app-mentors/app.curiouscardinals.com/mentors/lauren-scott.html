xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d3b3a0d2-881b-4db8-ba90-0fad67f75097\"}":{"__typename":"Favorites","uuid":"d3b3a0d2-881b-4db8-ba90-0fad67f75097","photoUrl":"https://ucarecdn.com/e740288a-4b0c-4cea-9e62-0dde40d31f3a/","title":"Sza","type":"ARTIST"},"Favorites:{\"uuid\":\"7ae35608-13b3-400b-8933-5f08e53c2bf0\"}":{"__typename":"Favorites","uuid":"7ae35608-13b3-400b-8933-5f08e53c2bf0","photoUrl":"https://ucarecdn.com/481e9a0a-7944-4100-a9f8-2d53a40aea92/","title":"Barcelona!","type":"CITY"},"Favorites:{\"uuid\":\"7411c426-375c-41ed-876b-aa7098994210\"}":{"__typename":"Favorites","uuid":"7411c426-375c-41ed-876b-aa7098994210","photoUrl":"https://ucarecdn.com/719a06bb-dd7d-4eb1-876b-603296446f26/","title":"Waitress","type":"PLAY"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a1dbe9fc-2c4a-462f-8b4a-f05c9479177c\"}":{"__typename":"DeepDives","uuid":"a1dbe9fc-2c4a-462f-8b4a-f05c9479177c","content":"\u003cp\u003eIn my spare time, I love to dance. I was a competition dancer focused on ballet throughout middle and high school and now dance with a dance team at Yale. I love both dancing and teaching dance. Over the past 3 years I have been ballet teacher to children ages 4-12!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"644de938-f36a-40ca-b1f2-bbb6c4f72f5d\"}":{"__typename":"DeepDives","uuid":"644de938-f36a-40ca-b1f2-bbb6c4f72f5d","content":"\u003cp\u003eDuring high school, I frequently spent the summers working at my dance studio as a summer camp counselor. I loved getting to interact with the students every day over many weeks. One memorable summer I also interned at the University of Miami Medical School as part of a research lab focused on Alzheimer's and brain health and enjoyed seeing how a lab environment worked. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}":{"__typename":"School","uuid":"1dc8c564-7629-4af5-851c-69ed64a8870e","name":"Ransom Everglades High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33133"},"Education:{\"uuid\":\"d8c28f48-e244-427f-9339-0013288e5928\"}":{"__typename":"Education","uuid":"d8c28f48-e244-427f-9339-0013288e5928","school":{"__ref":"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"ae6564a5-664f-452a-b608-37771e2d4ca0\"}":{"__typename":"Education","uuid":"ae6564a5-664f-452a-b608-37771e2d4ca0","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"56291582-fe14-4fec-bc75-6640585f142a\"}":{"__typename":"MentorPublicProfile","uuid":"56291582-fe14-4fec-bc75-6640585f142a","displayName":"Lauren S.","slug":"lauren-scott","biography":"\u003cp\u003eHi! I’m Lauren, a current sophomore from Miami, Florida studying at Yale University. I am majoring in Mechanical Engineering with a concentration in Spanish. Engineering is a subject that caught my eye because while I do love math and science, I really love design. In high school, I was lucky enough to have engineering design classes and simply watching a product or idea come to life from start to finish was incredibly rewarding. Those classes introduced me to the world of engineering and I plan to continue pursuing the subject throughout undergrad. After college, I hope to dive into the design aspect of engineering and explore product design or architectural engineering. Alongside engineering I am also interested in psychology and the brain. During high school I interned at an Alzheimer’s and sleep lab at the University of Miami and found the intricacies of the human brain fascinating.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAside from academics, I also love to dance. Dance has been a part of my life since elementary school and I was a competitive dancer and now part of a Yale dance team. I have also been a dance teacher for the past three years and learned many valuable skills for how to teach children and connect with them in a way that facilitates growth and enjoyment. My favorite part of teaching is creating genuine connections with my students and finding ways to impact and improve their lives both within the studio or classroom and beyond. In college I am part of a volunteer group called DEMOS. Each week I go to a local public elementary school and perform science experiments with the students. With organizations like this one, I can make a consistent difference and positively influence the lives of students.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor I care about my students' growth and success in their chosen subject, but more importantly aim to improve my students’ confidence and eagerness to learn. I can’t wait to share my passions with my students and encourage them to find joy in knowledge.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"ifvMUzkUoUwty55GMvcWD6MI6jCyy2r901hA6AzBm01RQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d3b3a0d2-881b-4db8-ba90-0fad67f75097\"}"},{"__ref":"Favorites:{\"uuid\":\"7ae35608-13b3-400b-8933-5f08e53c2bf0\"}"},{"__ref":"Favorites:{\"uuid\":\"7411c426-375c-41ed-876b-aa7098994210\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a1dbe9fc-2c4a-462f-8b4a-f05c9479177c\"}"},{"__ref":"DeepDives:{\"uuid\":\"644de938-f36a-40ca-b1f2-bbb6c4f72f5d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/92913849-06f0-4fdd-9910-e92658ac296c/-/preview/-/format/jpg/","https://ucarecdn.com/3085c95e-a7fb-4742-8f4c-471c80d62b6b/-/preview/-/format/jpg/","https://ucarecdn.com/dd0fee46-a14e-4181-b98d-973b70fb4725/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d8c28f48-e244-427f-9339-0013288e5928\"}"},{"__ref":"Education:{\"uuid\":\"ae6564a5-664f-452a-b608-37771e2d4ca0\"}"}],"hiredAt":"2025-04-16T23:36:36.474Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Writing","Spanish","Executive Function","Reading","Academic Coaching","College Essay Writing"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lauren-scott\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"56291582-fe14-4fec-bc75-6640585f142a\"}"}}},"_sentryTraceData":"195aa284c7d14e448c13ad8c8a83f593-83de3a9a9a20e4b9-1","_sentryBaggage":"sentry-environment=vercel-production,sentry
