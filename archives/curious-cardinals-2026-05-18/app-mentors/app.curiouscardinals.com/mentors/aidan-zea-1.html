xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"88039887-8730-4a76-b20d-dafee036fbc8\"}":{"__typename":"DeepDives","uuid":"88039887-8730-4a76-b20d-dafee036fbc8","content":"\u003cp\u003eMy dream job would be working in the 3D art / entertainment industry. I would love the opportunity to help talented artists tell stories through animations, video games, or movies that will influence the next generation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9589ff57-903a-432c-9910-2f5f48a81e61\"}":{"__typename":"DeepDives","uuid":"9589ff57-903a-432c-9910-2f5f48a81e61","content":"\u003cp\u003eI chose to major in Computer Science because I knew it would allow me to continue pursuing my passions while also teaching me the fundamental critical thinking and logical skills that let me pivot into adjacent fields.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"b2f67dd4-d834-457e-8109-4f37107d5329\"}":{"__typename":"DeepDives","uuid":"b2f67dd4-d834-457e-8109-4f37107d5329","content":"\u003cp\u003eI believe that my greatest source of motivation is reflecting on the hard work that my parents have done to put me in the best position to succeed. Without their support, I wouldn’t be where I am today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a5e1cc7d-6183-4cf2-a1e7-58e7d5be0139\"}":{"__typename":"DeepDives","uuid":"a5e1cc7d-6183-4cf2-a1e7-58e7d5be0139","content":"\u003cp\u003eMy greatest role model is my father. Throughout my whole life, he has taught me how to be kind and to always put others before myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"63ab2d32-6ad5-484f-ae9a-9251fbc82189\"}":{"__typename":"School","uuid":"63ab2d32-6ad5-484f-ae9a-9251fbc82189","name":"Whitney M. Young Magnet High School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60607"},"Education:{\"uuid\":\"414d4c03-b7d0-46d0-9f04-fcf02ccfcfe5\"}":{"__typename":"Education","uuid":"414d4c03-b7d0-46d0-9f04-fcf02ccfcfe5","school":{"__ref":"School:{\"uuid\":\"63ab2d32-6ad5-484f-ae9a-9251fbc82189\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"dc661d82-4311-4217-8e67-551b9356dc69\"}":{"__typename":"Education","uuid":"dc661d82-4311-4217-8e67-551b9356dc69","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"Testimonial:2c130c15-8bf2-4a95-b4eb-8ed3df5299c5":{"__typename":"Testimonial","id":"2c130c15-8bf2-4a95-b4eb-8ed3df5299c5","text":"Aidan has been an amazing mentor! Benjamin looks forward to their weekly session and has enjoyed every part of the process. Aidan is very kind, patient and keeps a good flow of communication.","date":"2025-08-22 16:03:23.182+00","rating":5,"endorser":{"__typename":"Endorser","name":"Maria C Villa","tagline":"","avatar":null}},"Testimonial:0379e4e6-13b7-4e6d-858c-c18bb68259eb":{"__typename":"Testimonial","id":"0379e4e6-13b7-4e6d-858c-c18bb68259eb","text":"Aiden connected in a natural and easy way right away with our son, Axel. They have a wonderful time every week working on a real passion project for him. I would highly recommend this service to other families.","date":"2025-07-20 21:59:36.068+00","rating":4,"endorser":{"__typename":"Endorser","name":"Sofia Chappuis","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"13996d2d-c5df-4e1f-9425-583c97916a56\"}":{"__typename":"MentorPublicProfile","uuid":"13996d2d-c5df-4e1f-9425-583c97916a56","displayName":"Aidan Z.","slug":"aidan-zea-1","biography":"\u003cp\u003eHi! I'm Aidan Zea and I'm currently a sophomore at Northwestern University studying Computer Science with a minor in Media Arts + Game Design + Animation. I’m most interested in learning about 3D graphics and visual effects, as I hope to start a career in entertainment technology post-graduation. I find this area in computer science appealing to me since it provides students with the opportunity to train both the right and left sides of the brain. It requires mathematical and logical reasoning, while allowing one’s creativity to flourish.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eRegarding my background in Computer Science, I’ve always known I wanted to work in the technology industry ever since I was young. Yet, I strongly believe that when you're growing up and trying to figure out what type of career you want, it’s alright to not be sure. My own interests within and surrounding the Computer Science field have shifted plenty of times. It’s gone from graphic design, to software engineering, to user interface interaction, to finally 3D graphics. I just had to look for the common trait amongst my previous interests, and it was simply wanting to make things look pretty.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince I’ve started attending Northwestern, I’ve been trying to immerse myself in communities and work on projects that align with my interests. I’m involved in Northwestern’s annual hackathon, where students compete to create the best piece of software within a 24-hour time span. I also participate in our university’s Esports Club, where students with similar interests come together to discuss pop culture and video games, as well as network with professionals in the video game industry. Outside of school, I enjoy playing pick-up basketball and listening to music from local Chicago artists.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"m1TUIm6KrogXrYgP6HwaHVVmaXWhKOYpKfVgFi9UTwc","teachingVideoDescription":null,"greatestAchievement":"\u003cbr\u003e","favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"88039887-8730-4a76-b20d-dafee036fbc8\"}"},{"__ref":"DeepDives:{\"uuid\":\"9589ff57-903a-432c-9910-2f5f48a81e61\"}"},{"__ref":"DeepDives:{\"uuid\":\"b2f67dd4-d834-457e-8109-4f37107d5329\"}"},{"__ref":"DeepDives:{\"uuid\":\"a5e1cc7d-6183-4cf2-a1e7-58e7d5be0139\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ee0227d6-ca8a-4efe-b2c2-dbe42375a68b/-/preview/-/format/jpg/","https://ucarecdn.com/b24d3a20-51cd-4ada-9665-b132378d8c76/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"414d4c03-b7d0-46d0-9f04-fcf02ccfcfe5\"}"},
