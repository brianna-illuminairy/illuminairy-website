g out with friends, golf, play basketball, and go on hikes!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"69556e1c-a647-4e34-a2be-c80e515c119b\"}":{"__typename":"DeepDives","uuid":"69556e1c-a647-4e34-a2be-c80e515c119b","content":"\u003cp\u003eMostly playing soccer with my friends for the upcoming season and working jobs + doing research\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"84663d8f-a52e-45af-a6fd-7e4f3fc75b6a\"}":{"__typename":"DeepDives","uuid":"84663d8f-a52e-45af-a6fd-7e4f3fc75b6a","content":"\u003cp\u003eDue to my love for food and chemistry, I made a cookbook that outlined the chemical processes of each cooking step.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"517bd328-9e20-4a3b-8b4f-d5aabf199934\"}":{"__typename":"School","uuid":"517bd328-9e20-4a3b-8b4f-d5aabf199934","name":"Cannon School","city":"Concord","type":"HIGH","state":"North Carolina","country":"United States","zip":"28027"},"Education:{\"uuid\":\"e4fd4308-9fa6-461f-b947-1052e1aae4ef\"}":{"__typename":"Education","uuid":"e4fd4308-9fa6-461f-b947-1052e1aae4ef","school":{"__ref":"School:{\"uuid\":\"517bd328-9e20-4a3b-8b4f-d5aabf199934\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"5b608e3a-4361-4625-8e86-45553bb775fd\"}":{"__typename":"Education","uuid":"5b608e3a-4361-4625-8e86-45553bb775fd","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"3f05d73e-529f-4b17-924c-5ea06e27197a\"}":{"__typename":"MentorPublicProfile","uuid":"3f05d73e-529f-4b17-924c-5ea06e27197a","displayName":"Ryan C.","slug":"ryan-chen-1","biography":"\u003cp\u003eRyan is a current senior at Duke University studying computer science with minors in math and financial economics. He is from Charlotte, NC, and grew up in Cleveland, OH. After graduation, he will be working at McKinsey \u0026amp; Company in New York as a Business Analyst. While coming into school as a premed \u0026amp; electrical engineer, he took his first computer science class and fell in love with the logical aspect of the subject. Given his inclination for puzzles and love for logic and video games, computer science seemed like a perfect fit. It has since worked out, as he has explored his interests in both algorithms and computer systems. In his free time, Ryan loves to play and watch sports (especially Golf and watching Duke Basketball), explore new cities (his favorite city he has traveled to is Stavanger, Norway), and hang out with friends.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn 2022, Ryan graduated from Cannon School as valedictorian of his class. He learned from his time in high school as well as his transition from public to private school how to adapt both academically and socially. He is grateful for the mentors and teachers who've helped him to where he is. Some of his favorite subjects included math, science, and history; his favorite class in high school was AP Chemistry.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout high school, Ryan tutored various students between his neighborhood and his high school. One of his fond memories is during his visit to Duke, his mentee's parent asked for a tutoring session, so he asked his parents if they could pull into a gas station and promptly logged onto Zoom on his iPad. Ryan hopes to continue providing the best service to his mentees through Curious Cardinals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, Ryan has received great guidance from parents, teachers, and coaches in pursuits such as classical piano, math and chemistry competitions, and soccer. Having experienced first-hand how important mentors are from both an academic and life perspective, Ryan hopes to be able to connect with and help guide his students in whatever ventures they might be taking on—whether it be math, science, or college essay writing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFeel free to reach out!\u003c/p\u003e","teachingVideoPlaybackId":"hNirH02EuTWrOrWzSXCgiF01c8WBEXmJI00RgtbOCC9Dps","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGoing from being the worst cook in my family to making some great steaks for New Year's dinner!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"37702d8a-da38-46cb-a76c-1c9bdbb0784d\"}"},{"__ref":"Favorites:{\"uuid\":\"5ba5548c-193d-416f-b81a-2d00e6010f30\"}"},{"__ref":"Favorites:{\"uuid\":\"d59116d5-dc43-491f-8c65-95d55a413e30\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4471f640-b407-4d0a-b0f3-31016a0cd753\"}"},{"__ref":"DeepDives:{\"uuid\":\"78139cb8-0cea-4b4b-9dc8-6010a784544c\"}"},{"__ref":"DeepDives:{\"uuid\":\"69556e1c-a647-4e34-a2be-c80e515c119b\"}"},{"__ref":"DeepDives:{\"uuid\":\"84663d8f-a52e-45af-a6fd-7e4f3fc75b6a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/592583bb-d2b4-4c56-b049-a99ace327397/-/preview/-/format/jpg/","ht
