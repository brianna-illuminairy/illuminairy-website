xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"a4de3fda-4a12-45d5-bd1d-24ec3f3d0a95\"}":{"__typename":"School","uuid":"a4de3fda-4a12-45d5-bd1d-24ec3f3d0a95","name":"Bethesda Chevy Chase High School","city":"Bethesda","type":"HIGH","state":"Maryland","country":"United States","zip":"20814"},"Education:{\"uuid\":\"b736f000-8742-493c-a66c-3f739162c111\"}":{"__typename":"Education","uuid":"b736f000-8742-493c-a66c-3f739162c111","school":{"__ref":"School:{\"uuid\":\"a4de3fda-4a12-45d5-bd1d-24ec3f3d0a95\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"a84f36f2-001c-4fab-ae96-6a5775fd0610\"}":{"__typename":"Education","uuid":"a84f36f2-001c-4fab-ae96-6a5775fd0610","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Education and Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"5453d219-9c32-4cf3-a978-8c93f104f79a\"}":{"__typename":"MentorPublicProfile","uuid":"5453d219-9c32-4cf3-a978-8c93f104f79a","displayName":"JD G.","slug":"jon-gorman","biography":"\u003cp\u003eHi all! My name is JD Gorman. I am from Maryland, right outside of Washington D.C., but currently I live in Providence, Rhode Island and attend Brown University. I study both education and sociology here. When I started at Brown I was not sure what I wanted to study, but after taking courses in the education and sociology departments I realized I found my fit. Sociology often gives me an incredible framework and lens from which to observe, analyze, and understand the systems, structures, and overall world around me. Additionally, I have a deep belief in the change-making powers of education and educators. I have experience as an educator in multiple capacities, having taught an array of courses from 9th grade algebra to musicology. This being said, I am incredibly excited to work collaboratively together with mentees towards their goals. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore coming to Brown I took a gap year in which I pin balled around the world. I took any excuse to leave my hometown, whether that be a job, volunteering opportunity, or just a cheap plane ticket. Through these experiences I really learned how to take something from a big picture idea and bring it to reality. Before I started the gap year I would often look at my calendar, wide open with space and opportunity, and just imagine all the possibilities of how I could fill my time. This practice allowed me to think big and then figure out the various steps towards MAKING IT HAPPEN! As a mentor I look forward to finding these steps for my mentees, wether this manifests in event planning, social organizing, or the wide wonderful range of passions our mentees bring. I can't wait to bring a wide-eyed imagination and can do attitude to assisting your mentee with their passion projects.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I am not working on my academics I am most likely pursuing my passions in music. I am a multi-instrumentalist and songwriter, but I especially love playing the bass. I play in a variety of ensembles and genres ranging from jazz to hip-hop/RnB to mariachi. I would love to work with mentees on anything music related, from traditional lessons to EP/Album project planning to band creating/leading and anything else!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can't wait to get to work with all the amazing mentees!\u003c/p\u003e","te
