xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"99e1aa4a-22c7-4114-8387-07d5bfdd51e5\"}":{"__typename":"Favorites","uuid":"99e1aa4a-22c7-4114-8387-07d5bfdd51e5","photoUrl":"https://ucarecdn.com/ed51e995-4cff-4fc1-9e7e-6bd8f6235b09/","title":"The Kite Runner - Khaled Hosseini","type":"BOOK"},"Favorites:{\"uuid\":\"6a65f645-9d84-4b6f-9708-4078b625e746\"}":{"__typename":"Favorites","uuid":"6a65f645-9d84-4b6f-9708-4078b625e746","photoUrl":"https://ucarecdn.com/f2bb096e-4730-42b1-b9ae-da14bcfdc8bc/","title":"Cape Town, South Africa!","type":"CITY"},"Favorites:{\"uuid\":\"7ad36d01-28b1-439e-8384-f3aaa8289c0f\"}":{"__typename":"Favorites","uuid":"7ad36d01-28b1-439e-8384-f3aaa8289c0f","photoUrl":"https://ucarecdn.com/bfedb8e8-c97c-4423-9820-49edc9c8c561/","title":"Breakfast at Tiffany's","type":"MOVIE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"626ed16c-e7e7-4f27-a74a-8e40d156362f\"}":{"__typename":"DeepDives","uuid":"626ed16c-e7e7-4f27-a74a-8e40d156362f","content":"\u003cp\u003eDr. Watson was one of the most influential mentors in my life. He taught high school history, but the impact he had extended far beyond the subject itself. His classroom was the kind of space where you felt steady, supported, and capable, a place that quietly shaped how you saw yourself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome of the biggest blessings in my life have been the people who stepped into mentor roles without ever being asked. Mentorship is the force that pushed me toward the biggest decisions I’ve made, from applying to Stanford, to pursuing international opportunities across four continents, to entering rooms I never imagined I could be in. I know with complete certainty that I wouldn’t have had the confidence to even try without the support systems I was lucky enough to have. Dr. Watson was one of those people.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHis passion for history was undeniable, and it had a way of extending onto his students. He taught Mao’s China and the British Empire through narrative, not memorization, and every lesson felt like a story unfolding. He asked us to begin each class with a news article, and together we would connect it back to patterns of the past. It taught me early on that nothing happening today stands alone.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up in a small Middle Eastern country, I didn’t often see people who looked like me in the spaces I hoped to reach. When I told Dr. Watson I was applying to schools like Stanford, he didn’t hesitate: “Absolutely. You should go for it.” Later, when I was in university, he wrote to me, “The world would be better with more female economists like you.” I’ve never forgotten that.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI still look back on his classroom and remember how engaged, supported, and capable I felt. I hope to inspire even a fraction of what he imparted on me. He may never realize the magnitude of his impact, but I always will.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"a2334fa1-dfd3-45d8-936c-3035bfb4a6e1\"}":{"__typename":"DeepDives","uuid":"a2334fa1-dfd3-45d8-936c-3035bfb4a6e1","content":"\u003cp\u003eIn my junior year at Stanford, I spent a quarter studying abroad in Cape Town, South Africa. It’s a breathtaking city, but its inequalities are impossible to miss. Just miles apart, you’ll find oceanfront homes and informal settlements where families live without steady access to clean water.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile there, I worked with the Environmental Monitoring Group on a project focused on improving water access in these communities. We spent our days speaking with families, community leaders, and local scientists, learning how people collected water, where the biggest gaps were, and what solutions were realistic. Some relied on a shared tap; others walked long distances each day.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOur team helped support the rollout of community-managed filtration systems, and by the end of the project, households we had worked with were able to access clean water consistently.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing part of that process - listening, learning, and seeing a tangible change in people’s daily lives - is something I’m deeply grateful for. It remains one of the experiences I’m most proud of.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"7380e104-34bb-4f51-afa7-b19c00d52469\"}":{"__typename":"School","uuid":"7380e104-34bb-4f51-afa7-b19c00d52469","name":"St. Christopher's School","city":"Isa Town","type":"HIGH","state":"Southern Governorate","country":"Bahrain","zip":"NA"},"Education:{\"uuid\":\"9e086cfa-570c-461b-bf69-a4862eb2bbc3\"}":{"__typename":"Education","uuid":"9e086cfa-570c-461b-bf69-a4862eb2bbc3","school":{"__ref":"School:{\"uuid\":\"7380e104-34bb-4f51-afa7-b19c00d52469\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"2f4ced5b-257b-4d44-b87c-d86a0fe3010d\"}":{"__typename":"Education","uuid":"2f4ced5b-257b-4d44-b87c-d86a0fe3010d","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"a989df03-9de6-4b7f-ad25-d8720417b813\"}":{"__typename":"MentorPublicProfile","uuid":"a989df03-9de6-4b7f-ad25-d8720417b813","displayName":"Layal K.","slug":"layal-kazerooni-1","biography":"\u003cp\u003e\u003cstrong\u003eHi! I’m Layal\u003c/strong\u003e, a recent Stanford graduate who studied Economics and spent the last few years exploring big global questions through research, travel, and hands-on projects. I’ve always been someone who learns by exploring, asking questions, and diving into new environments, and that curiosity has taken me to work across four continents in Africa, Asia, Europe, and North America.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, I focused on international, development, environmental, and sustainability economics. I worked on labor-migration research in Ethiopia, water-access projects in South Africa, and economic planning work with national economies. On campus, I served as Co-Director of the King Center’s International Development Association, where I helped organize events with global leaders like former World Bank President and organizations working on women’s property rights and poverty alleviation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore Stanford, I was involved in international debate, traveling to countries like Thailand, Malaysia, Vietnam, and across the U.S. for global tournaments. Debate taught me how to speak clearly, think critically, and connect with people from all backgrounds, skills I now bring into every mentoring session! I’m also a national scholarship winner and was heavily involved in many community service and sustainability initiatives prior to Stanford.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI love mentoring students who want to explore creative, academic, and globally inspired projects. I support:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCreative writing \u0026amp; storytelling\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFashion, cosmetics, \u0026amp; aesthetic projects\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFilm, podcast, video, \u0026amp; photography projects\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHistory research \u0026amp; project-building\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBusiness \u0026amp; entrepreneurship concepts\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAviation enthusiasm projects\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLaw, government, \u0026amp; policy\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSustainability \u0026amp; environmental thinking\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDebate, public speaking, \u0026amp; confidence-building\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCommunity service \u003cbr\u003e\u003cbr\u003e\u003c/strong\u003eI also work well with students who learn differently, including students with ADHD or unique learning styles. I’m patient, structured, and very adaptive; I meet students exactly where they are!\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eMy mentoring style\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eBefore joining Curious Cardinals, I volunteered as a mentor for over 70 students, which taught me how differently every student thinks, learns, and grows. That experience shaped the way I mentor now: calm, encouraging, and very student-centered.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEvery student comes in with their own superpower. My job is simply to help them see it, sharpen it, and feel confident using it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might include brainstorming a passion project, breaking it into a step-by-step plan, practicing communication or presentation skills, or adding creative polish to make a student’s work feel personal and exciting. I’m especially good at helping students turn vague ideas into clear, doable projects that they feel proud of.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbove all, I’m genuinely enthusiastic about whatever my students care about. Watching their confidence grow as their ideas take shape is one of my favorite parts of mentoring.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eA few fun facts\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eWhen I’m not mentoring or working, you’ll probably find me trying a new workout class (pilates, hot yoga, circuit training - I’m always trying something new!), discovering new cafés, or planning my next trip. I’m pretty adventurous by nature and have gone skydiving… but don’t worry, I won’t be encouraging your kids to jump out of planes!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love reading, playing the piano, being outdoors, and generally saying yes to anything that lets me learn or experience something new. I’m naturally curious, and whatever your child is passionate about, I’m excited to help them turn it into something real! \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"trOqOsC4miDfjVK7HDyer9EvAiWkTQkjxkRwaHLVZ48","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"99e1aa4a-22c7-4114-8387-07d5bfdd51e5\"}"},{"__ref":"Favorites:{\"uuid\":\"6a65f645-9d84-4b6f-9708-4078b625e746\"}"},{"__ref":"Favorites:{\"uuid\":\"7ad36d01-28b1-439e-8384-f3aaa8289c0f\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"626ed16c-e7e7-4f27-a74a-8e40d156362f\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2334fa1-dfd3-45d8-936c-3035bfb4a6e1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/13663883-56d9-493c-afcc-5745af08283b/-/preview/-/format/jpg/","https://ucarecdn.com/d5e2a1f4-8f20-4763-9f0c-a5e99ebca60c/-/preview/-/format/jpg/","https://ucarecdn.com/566cac59-8e07-4ba1-a888-159a168457b1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9e086cfa-570c-461b-bf69-a4862eb2bbc3\"}"},{"__ref":"Education:{\"uuid\":\"2f4ced5b-257b-4d44-b87c-d86a0fe3010d\"}"}],"hiredAt":"2025-10-18T20:47:48.023Z","topics":["K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Business / Entrepreneurship","Aviation / Aerospace","Law / Government / Policy","Sustainability","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"layal-kazerooni-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a989df03-9de6-4b7f-ad25-d8720417b813\"}"}}},"_sentryTraceData":"6c57d20e8fab46e6a09ac8386a88d45a-973376297666d3ff-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=6c57d20e8fab46e6a09ac8386a88d45a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","
