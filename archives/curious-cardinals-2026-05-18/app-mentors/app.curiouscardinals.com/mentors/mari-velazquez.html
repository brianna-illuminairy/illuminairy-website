xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"300c4e62-682e-46ad-8301-936470832f15\"}":{"__typename":"Favorites","uuid":"300c4e62-682e-46ad-8301-936470832f15","photoUrl":"https://ucarecdn.com/6e7668e9-5663-4763-88bb-6643a04b22ca/","title":"The Alchemist","type":"BOOK"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9778ab61-813e-4132-9e4b-2139b7b9d94a\"}":{"__typename":"DeepDives","uuid":"9778ab61-813e-4132-9e4b-2139b7b9d94a","content":"\u003cp\u003eIn high school I spent my summers doing astronomy research at the Arecibo Observatory, which was the world's largest single-aperture telescope for 53 years until 2016. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a6220172-ea7f-4f86-ba47-064080e926fb\"}":{"__typename":"DeepDives","uuid":"a6220172-ea7f-4f86-ba47-064080e926fb","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to become fluent in five languages. I’m already fluent in English, Spanish, and Italian, and I’d love to add two more languages to my repertoire. It would be amazing to connect with people from different cultures and broaden my understanding of the world through their languages.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"274387f2-83b5-4694-a7f1-dd469564330d\"}":{"__typename":"DeepDives","uuid":"274387f2-83b5-4694-a7f1-dd469564330d","content":"\u003cp\u003eMentorship is incredibly important to me because of the transformative impact it had on my life. When I was younger, I struggled with concentration in classrooms and wasn’t exactly a model student. Group tutors didn’t quite work for me; my attention span was all over the place. That all changed when my mom introduced me to a mentor from the local college. I went from barely scraping by with Bs in elementary school to becoming the valedictorian of my class! Thanks to my mentor, I started enjoying my subjects and realized my true potential. Mentorship turned my academic journey from a struggle into a triumph, and I’ll always value how it helped me reach heights I never thought possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4196d5e9-8554-42c4-ab60-f196894ec989\"}":{"__typename":"DeepDives","uuid":"4196d5e9-8554-42c4-ab60-f196894ec989","content":"\u003cp\u003eGrowing up in Puerto Rico, I was  surrounded by conversations about the economy, but they were rarely positive. From a young age, I heard people talking about economic struggles and the constant search for financial stability.\u003c/p\u003e\u003cp\u003eWhen I first took an economics class in college, I began to understand the intricate workings behind those conversations I’d overheard growing up. I realized that the issues affecting Puerto Rico weren’t just abstract problems—they were complex challenges that could be understood and, more importantly, addressed with the right knowledge and tools. Now, as I dive deeper into my studies in economics, I’m driven by a personal mission to contribute to meaningful change. I want to be part of the solution, using my understanding of economic principles to help create a better future for my community and others facing similar challenges. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"97d1560d-c872-46a6-9d9d-2a227662e244\"}":{"__typename":"School","uuid":"97d1560d-c872-46a6-9d9d-2a227662e244","name":"Colegio Puertorriqueño de Niñas","city":"Guaynabo","type":"HIGH","state":"Guaynabo","country":"Puerto Rico","zip":"00968"},"Education:{\"uuid\":\"6f7994b5-3793-45db-9550-7f5513d84c08\"}":{"__typename":"Education","uuid":"6f7994b5-3793-45db-9550-7f5513d84c08","school":{"__ref":"School:{\"uuid\":\"97d1560d-c872-46a6-9d9d-2a227662e244\"}"},"startYear":"2007","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"f428359a-93a2-4782-87c7-eb954120aec3\"}":{"__typename":"Education","uuid":"f428359a-93a2-4782-87c7-eb954120aec3","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":"B.A."},"MentorPublicProfile:{\"uuid\":\"91522b9c-d802-4f97-99e1-d6b7f849610f\"}":{"__typename":"MentorPublicProfile","uuid":"91522b9c-d802-4f97-99e1-d6b7f849610f","displayName":"Mari V.","slug":"mari-velazquez","biography":"\u003cp\u003eMari is a Sophomore at Harvard College majoring in Economics. As a Puerto Rican, Mari is fully fluent in Spanish and takes great pride in teaching her language to others. Throughout high school, Mari volunteered at a tutoring center for low income students from the severely underfunded and understaffed public schools of Puerto Rico. During this time, she grew to love helping students improve their math and English skills and develop confidence in themselves. To her, there are few things more satisfying than helping a student overcome the challenges they think are most difficult. \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"300c4e62-682e-46ad-8301-936470832f15\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9778ab61-813e-4132-9e4b-2139b7b9d94a\"}"},{"__ref":"DeepDives:{\"uuid\":\"a6220172-ea7f-4f86-ba47-064080e926fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"274387f2-83b5-4694-a7f1-dd469564330d\"}"},{"__ref":"DeepDives:{\"uuid\":\"4196d5e9-8554-42c4-ab60-f196894ec989\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a456b8ce-2244-46a7-bf3e-2400bb3d7ea2/-/crop/460x460/0,80/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"6f7994b5-3793-45db-9550-7f5513d84c08\"}"},{"__ref":"Education:{\"uuid\":\"f428359a-93a2-4782-87c7-eb954120aec3\"}"}],"hiredAt":"2022-09-07T01:48:17.000Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","Algebra II","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mari-velazquez\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"91522b9c-d802-4f97-99e1-d6b7f849610f\"}"}}},"_sentryTraceData":"e793587
