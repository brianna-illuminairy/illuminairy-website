xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e5333251-d603-4129-95ba-218bc0bb75a2\"}":{"__typename":"DeepDives","uuid":"e5333251-d603-4129-95ba-218bc0bb75a2","content":"\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;I walk into Park Terrace Swim and Tennis Club wearing new leather flip-flops and a loose ‘Coaches’ tank. I review the strokes with young swimmers they have long forgotten from last season. After a day of coaching, I dive into my own practice, prancing out of the club at dusk with those same flip-flops. This time, the leather has a fresh chlorine scent from splash after splash and a strange sunscreen stain—a sign of an outstanding day. There is no place I would rather spend the next seventy-six days of summer.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;When I was young, I participated widely in activities from soccer to ballet, competitive sailing to acting. I plunged into various passions and countless teams with enthusiasm. On the day I joined the Penguins swim team as a preschooler, I was unaware of how much this club would impact my life\u003cem\u003e.\u003c/em\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;I was a determined Penguin, spending hours mastering a lap I now complete in eleven seconds. I lived summer glued to the pool, where coaches would lead practice sets, provide private lessons on groundbreaking techniques, cheer relentlessly for teammates, and coach the team to be Suburban Swim League’s most victorious. When I started swimming, I raced similarly to the group—diving way too deep or belly-flopping. As I shifted into older age groups, I discovered breaststroke and collected first place ribbons. My further dedication to the precision of the sport and mindset to win placed me on top of the podium in the league for breaststroke and freestyle over the years.\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Through swim teams, open water swims, water polo, and clinics, swimming has always been a journey whereby I extend my reach to succeed and drive towards goal achievement. Reaching ambitiously in swimming transfers to my academic dedication. I know how to persevere and ‘swim in my lane’, focusing deeply on any challenge. In a race, beyond form and strategy, the victory ultimately goes to whoever aspires to win the most. The drive I found in the pool helps me accomplish anything I set my mind to outside the water.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;The act of swimming also captures my curious mind. The sport defies the laws of biology—humans do not breathe underwater and lack necessary fins to lead an underwater lifestyle. In each lap, I amuse myself with how I maneuver the mass of hydrogen molecules bonded to oxygen. Every centimeter of water the body pulls at specific angles, and with precise execution, makes the difference between a gold versus silver medal for Michael Phelps. Swimming is more than a sport to me—it is an amazing study in chemistry, biology, and mechanics that puts my engineering mind to work.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;Over time, the Park Terrace community and competitive swimming enveloped my core. As I transition to my final years, I have a new spotlight as a Coach. After years idolizing previous coaches, I embrace the opportunity to mature into this job and instruct the next generation of preschoolers entering the club. In my thirteenth summer, with this scrappy team at our charming six lane pool, I swim daily and spend hours on the deck coaching. I teach children under six years the basics of freestyle, or ten-year-olds the art of a flip-turn. Leading the team that raised me brings out my positive energy in the best ways, using my youthfulness to goof around with little kids, and sharing technical expertise with advanced teenagers.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;I find myself dreading the summer I graduate from this swim club, which I consider my second home. Here, I cultivated lifelong companions and learned about people of different backgrounds striving for the same goal. Beyond winning, we enjoy laughing endlessly, dressing up for the championship meet parade, and delivering the most spirit for the club we love. At the same time, I find the pool offers a peaceful escape with the rhythm of each stroke and the science in my technique. It propels me forward in life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2fa6fe8f-59a3-47dd-bbc0-a8b274c0ff68\"}":{"__typename":"School","uuid":"2fa6fe8f-59a3-47dd-bbc0-a8b274c0ff68","name":"Christian Brothers High School","city":"Sacramento","type":"HIGH","state":"California","country":"United States","zip":"95820"},"Education:{\"uuid\":\"6b7fd0db-3deb-43e5-bd98-2ad531a53105\"}":{"__typename":"Education","uuid":"6b7fd0db-3deb-43e5-bd98-2ad531a53105","school":{"__ref":"School:{\"uuid\":\"2fa6fe8f-59a3-47dd-bbc0-a8b274c0ff68\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"676d64d8-2b67-4982-9548-8507e6911dc6\"}":{"__typename":"Education","uuid":"676d64d8-2b67-4982-9548-8507e6911dc6","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Civil and Environmental Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"6f65e5b9-c20e-4a5b-9dd4-17e0739c6f7f\"}":{"__typename":"MentorPublicProfile","uuid":"6f65e5b9-c20e-4a5b-9dd4-17e0739c6f7f","displayName":"Eliza F.","slug":"eliza-f","biography":"\u003cp\u003e\u0026nbsp;\u0026nbsp; Hi, I’m Liza!! I’m a sophomore studying Civil and Environmental Engineering at Stanford. I study all things math, design, physics, climate \u0026amp; engineering related. I love sunsets, fun adventures with my sisters and friends, eating and baking good food, and water sports.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp; I have enjoyed the opportunity to take classes within Stanford’s new Doerr School of Sustainability. I have done summer internships connected to electrofuels, sustainability, environmental policy, and structural engineering. One day, I hope to work on the business side of engineering where I can create my own construction projects.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp; At Stanford, I am the president of the Coed Club Water Polo team; and I created and competed in our first Women’s Club Water Polo team. I have always loved swimming, and spent hours every day ages 4-18 in a pool. For my hometown swim club, I was a coach where I worked with kids all ages to teach them my passion. I can’t wait for the opportunity to meet more friendly faces!!\u003c/p\u003e","teachingVideoPlaybackId":"2D1jagOkqJeCaP5023iuug1MzStrPjAjZYp1gyz8CpH8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Civil and Environmental Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e5333251-d603-4129-95ba-218bc0bb75a2\
