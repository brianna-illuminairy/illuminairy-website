xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"25da944f-0945-4ae7-840d-e3e47cd4f7cc\"}":{"__typename":"Favorites","uuid":"25da944f-0945-4ae7-840d-e3e47cd4f7cc","photoUrl":"https://ucarecdn.com/0126744e-6850-419c-89a9-eb4fc5d716f2/","title":"Chicago","type":"CITY"},"Favorites:{\"uuid\":\"77302384-eac4-456e-8a9f-79a326682928\"}":{"__typename":"Favorites","uuid":"77302384-eac4-456e-8a9f-79a326682928","photoUrl":"https://ucarecdn.com/dded16b3-8577-42e5-b30f-385043522666/","title":"Chicago Bears","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"3460c7f6-b0bd-4689-8144-64380217fd0f\"}":{"__typename":"Favorites","uuid":"3460c7f6-b0bd-4689-8144-64380217fd0f","photoUrl":"https://ucarecdn.com/9ea12891-ab59-4d1b-a615-94caa138ac8a/","title":"Interstellar","type":"MOVIE"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1bc738d6-8bf0-45e0-98fa-dcf19643a135\"}":{"__typename":"DeepDives","uuid":"1bc738d6-8bf0-45e0-98fa-dcf19643a135","content":"\u003cp\u003eOne of my favorite passion projects has been founding Northwestern’s chapter of Blood Cancer United. I’ve been volunteering with the organization since high school, and their work with underprivileged communities really resonates with me. I’ve enjoyed contributing to this work by starting initiatives here at Northwestern, from organizing lobbying trips to the Illinois Capitol to connecting patients with the BCU resources which best support their needs. I find it incredibly fulfilling to be able to support individuals who otherwise would be unable to access the care they need, and I hope to carry this forward into my medical career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"98101a6d-a774-4260-b003-2abf362ad23e\"}":{"__typename":"School","uuid":"98101a6d-a774-4260-b003-2abf362ad23e","name":"Walter Payton College Preparatory High School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60610"},"Education:{\"uuid\":\"4ac28af3-3951-4d80-8a01-718c9c9671fd\"}":{"__typename":"Education","uuid":"4ac28af3-3951-4d80-8a01-718c9c9671fd","school":{"__ref":"School:{\"uuid\":\"98101a6d-a774-4260-b003-2abf362ad23e\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"f5490152-a584-4d72-bc11-8dfe1c547f62\"}":{"__typename":"Education","uuid":"f5490152-a584-4d72-bc11-8dfe1c547f62","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biology + Global Health","degree":null},"MentorPublicProfile:{\"uuid\":\"e199caa8-090c-4574-8b7d-e028bfd3617d\"}":{"__typename":"MentorPublicProfile","uuid":"e199caa8-090c-4574-8b7d-e028bfd3617d","displayName":"Ritvik V.","slug":"ritvik-viniak","biography":"\u003cp\u003eHey there! I’m Ritvik and I'm a student at Northwestern studying Biology and Global Health on the pre-med track. My passion for medicine began close to home. Watching my grandmother suffer because of her health conditions inspired me to pursue a career dedicated to helping others.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I joined a research lab to better understand the biology behind my grandmother’s conditions and quickly fell in love with the research process. The idea that my work at the bench could lead to better treatments and less suffering for patients like her captivated me. I went on to design several independent projects and present my work at the International Science and Engineering Fair. Sparking that same curiosity in others has become just as meaningful to me as the research itself. Since graduating, I’ve founded the Chicago Public Schools Science Fair mentorship program, helping cultivate that same sense of scientific wonder in other students.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern, I've continued doing research at the medical school while deepening my understanding of health equity through my Global Health coursework. I've come to realize that scientific breakthroughs only matter if everyone can access them, turning me into a bigger patient advocate. I founded Northwestern's chapter of Blood Cancer United, where I've led our team to raise tens of thousands of dollars for patient support services and lobbied Illinois lawmakers to reduce medical debt. I’ve also enjoyed leading community initiatives through our emergency medical services club. Here, I teach emergency medicine related workshops to local high schoolers, improving their ability to respond to emergencies in their communities and inspiring them to go into the medical field themselves. I’m excited to continue this work in medical school–in 2027, I’ll be matriculating to the Feinberg School of Medicine!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I'm not in the lab or classroom, you can find me running on Chicago's lakefront trail, lifting weights, or experimenting with new recipes in the kitchen. My family is originally from North India, so I love connecting with my culture by dancing on Northwestern Bhangra, our school’s premier North Indian dance team. Like any true Chicagoan, I’m also a huge Bears fan. These past few years have been rough, but I’m sure that this year is our year! :)\u003c/p\u003e","teachingVideoPlaybackId":"tRYoQ6GkJtgwUmKFr00P97EAhCyfhexRH8fcpK4bVHwQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"25da944f-0945-4ae7-840d-e3e47cd4f7cc\"}"},{"__ref":"Favorites:{\"uuid\":\"77302384-eac4-456e-8a9f-79a326682928\"}"},{"__ref":"Favorites:{\"uuid\":\"3460c7f6-b0bd-4689-8144-64380217fd0f\"}"}],"causesSupported":[],"major":"Biology + Global Health","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1bc738d6-8bf0-45e0-98fa-dcf19643a135\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c0472b31-c4fc-46e9-bff9-df835dbb1376/-/preview/-/format/jpg/","https://ucarecdn.com/c31501e1-660f-4788-b52d-2381313a0919/-/preview/-/format/jpg/","https://ucarecdn.com/5906d0c5-b8ea-481e-8d6e-33a2a5b5ddf1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4ac28af3-3951-4d80-8a01-718c9c9671fd\"}"},{"__ref":"Education:{\"uuid\":\"f5490152-a584-4d72-bc11-8dfe1c547f62\"}"}],"hiredAt":"2026-04-19T04:24:39.889Z","topics":[],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ritvik-viniak\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e199caa8-090c-4574-8b7d-e028bfd3617d\"}"}}},"_sentryTraceData":"6c4b10d1c6b545a68caf96636f159ad2-9bc584377157efe4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=6c4b10d1c6b545a68caf96636f159ad2,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ritvik-viniak"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketi
