st things in life are on the other side of discomfort!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4c302173-5c2f-4bb6-a4f7-eaf6214b87aa\"}":{"__typename":"DeepDives","uuid":"4c302173-5c2f-4bb6-a4f7-eaf6214b87aa","content":"\u003cp\u003eMentorship matters to me because it allows me to share knowledge and experiences, helping others navigate their paths more effectively. It's a way to give back, support growth, and foster a sense of community. Seeing mentees succeed and knowing I played a part in their journey is incredibly rewarding.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"94bc58dc-cfd5-4a0e-a5b3-d9bbc77daf49\"}":{"__typename":"DeepDives","uuid":"94bc58dc-cfd5-4a0e-a5b3-d9bbc77daf49","content":"\u003cp\u003eMy greatest source of motivation is the drive to continually learn and grow, both personally and professionally. I find inspiration in setting and achieving goals, overcoming challenges, and making a positive impact on others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"b5baebd7-5d92-4df8-bc56-8459eb02a051\"}":{"__typename":"DeepDives","uuid":"b5baebd7-5d92-4df8-bc56-8459eb02a051","content":"\u003cp\u003eI am extremely proud of my internship with the NBA, where I learned how to engage in a corporate environment while working in the industry I've loved my whole life. This experience allowed me to deepen my understanding of the sports business and contribute meaningfully to a major organization.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"03ea45c9-9e01-474d-a667-eee073c1b0ab\"}":{"__typename":"School","uuid":"03ea45c9-9e01-474d-a667-eee073c1b0ab","name":"Breck School","city":"Golden Valley","type":"HIGH","state":"Minnesota","country":"United States","zip":"55422"},"Education:{\"uuid\":\"30220304-bc59-4596-95ef-d3326aa824b7\"}":{"__typename":"Education","uuid":"30220304-bc59-4596-95ef-d3326aa824b7","school":{"__ref":"School:{\"uuid\":\"03ea45c9-9e01-474d-a667-eee073c1b0ab\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"f4bef84d-120d-4f51-86bf-b85c5e84eaec\"}":{"__typename":"Education","uuid":"f4bef84d-120d-4f51-86bf-b85c5e84eaec","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"86f26811-f9b3-43f2-909b-1025488e345e\"}":{"__typename":"MentorPublicProfile","uuid":"86f26811-f9b3-43f2-909b-1025488e345e","displayName":"Owen P.","slug":"owen-power","biography":"\u003cp\u003eHi! My name is Owen Power, and I’m currently pursuing a Bachelor of Arts in Economics with a minor in Business at the University of Southern California (USC). I am a proud member of Phi Beta Kappa Honors Society, placing me in the top 5% of my class. Beyond academics, I serve on the Executive Board of the USC Sports Business Association (SBA) as the Director of Membership Experience, where I’ve recruited 250 members, marketed the club, managed a speaker series, and organized weekly sports events. I’m also involved in the Trojan Investing Society, The Consulting Club Mentorship Program, and the Trojans Chess Club.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis summer, I interned with the National Basketball Association (NBA) in New York. I analyzed income statements of the 30 NBA teams to identify variances between projected and actual revenues and expenses. I created a report for the CFO and consolidated cash flow statements for the WNBA, G-League, and 2K-League. Additionally, I participated in management meetings and networking events. This experience gave me a deep understanding of the NBA’s business model.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my professional and academic pursuits, I’m passionate about teaching and coaching chess. From 2018 to 2022, I provided private chess lessons to children and adults. Currently, I’m involved in the 32nd Street Magnet School’s after-school chess program in Los Angeles, where I instruct students, recruit volunteers, and coordinate mentoring events.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy playing and teaching chess, basketball, pickleball, wakesurfing, skiing, and engaging in fantasy football and sports stats. I also have a strong background in community service, having founded the Can-Can Challenge Food Drive in Minneapolis, which collected over 15,000 pounds of food for Every Meal during COVID.\u003c/p\u003e","teachingVideoPlaybackId":"AY017WYfWju1hjlIdct02H014tRJ64PABSRc5XIaRxgLXQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eEarned Phi Beta Kappa at USC (Top 5% of my class) and succeeded
