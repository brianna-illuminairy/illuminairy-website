4b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e7d449ae-bb8a-48bf-8fbd-13d5560ad981\"}":{"__typename":"DeepDives","uuid":"e7d449ae-bb8a-48bf-8fbd-13d5560ad981","content":"\u003cp\u003eFrom a young age, I always knew CS was what I would dedicate my life to. Knowing my passion was in telling stories and turning the ideas in my head into reality, CS is my medium to create. Due to my neurological and processing differences, I could not use pen and paper to express myself as effectively as I desired, and I am grateful everyday that I found the FIRE substitute of a computer and keyboard. My life and work has always centered around Computer Science, so there is truly no other major for me. I simply love it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c18f7b93-b441-434b-a5fc-5d9bd4e3a1a9\"}":{"__typename":"DeepDives","uuid":"c18f7b93-b441-434b-a5fc-5d9bd4e3a1a9","content":"\u003cp\u003eI still don't quite know, but I definitely want to own my own company! I have worked or am working in game design, graphics, and AI in companies like EA, Dolby, and Amazon which I have all loved! I envision myself somehow combining all of those interests something I found and create myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"c8589d24-467e-4666-8829-366d68f44487\"}":{"__typename":"Education","uuid":"c8589d24-467e-4666-8829-366d68f44487","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"CS","degree":"Bachelors"},"School:{\"uuid\":\"3b8a65fa-e1a0-49bc-b0cd-ffaa3acc8056\"}":{"__typename":"School","uuid":"3b8a65fa-e1a0-49bc-b0cd-ffaa3acc8056","name":"Montclair Kimberley Academy","city":"Montclair","type":"HIGH","state":"New Jersey","country":"United States","zip":"07042"},"Education:{\"uuid\":\"138191c8-0f9d-43a9-a5f9-109cd9471c2a\"}":{"__typename":"Education","uuid":"138191c8-0f9d-43a9-a5f9-109cd9471c2a","school":{"__ref":"School:{\"uuid\":\"3b8a65fa-e1a0-49bc-b0cd-ffaa3acc8056\"}"},"startYear":"2017","endYear":"1021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"b511ea71-25bd-4748-b40a-2ec185860443\"}":{"__typename":"MentorPublicProfile","uuid":"b511ea71-25bd-4748-b40a-2ec185860443","displayName":"Zoe D.","slug":"zoe-d","biography":"\u003cp\u003eHi there :). My name is Zoe Lynch and I am a current junior soon to begin my co-terminal masters at Stanford University studying CS with a concentration in AI and graphics! I've been obsessed with coding, math, physics, design, digital art, and video games for as long as I can remember. I always loved storytelling but growing up with ADHD and reading differences, I learned the only way I could express the ideas in my head was through software development and game design! I have coded up countless of games/chatbots on a range of platforms in a range of programming languages and have a breadth of work experience across many domains. I have worked for EA on the sims for 2 summers (my favorite game EVER since middle school), Amazon (upcoming), multiple CS Stanford labs, and Dolby all as a SWE in game design, game simulation, AI, and visual computing! I love design, fashion, Fortnight/Valorant, baking, volleyball, talking, learning, music (I love anything and everything by Drake), and teaching! Also, being both Ecuadorean and Jamaican, I am a huge foodie and eater and can talk about food preferences all day. I play a range of different video games with my little sister and am also BIG into watching gameplay/esports! I am excited to tutor in math, physics, ACT/SAT (36), anything CS (machine learning, NLP, VR/AR, graphics, etc.), UI/UX, graphic design, and ANYTHING game related (from more design oriented to more technical implementation)! I am and have been involved in a range of clubs on campus: a member of Stanford XR (VR/AR), SVGA (video game association), WiCS (women in computer science), and more! I am a person who tries to make everything fun, especially when it comes to learning new things. As much as you will learn from me, I will learn from you and our time together. Together, we will set up a personalized curriculum around your areas of interest, goals, milestones, and/or projects you can showcase on a website or portfolio! I love out of the box thinking to problem solve and feel everyone has an inner creative/maker ready to be unleashed and pop off. I'm so so so excited to meet you! Let's get curious and learn some cool things 💪\u003c/p\u003e","teachingVideoPlaybackId":"68p9KjJ5Zh501LarWPOTwbPvDcRCHoFLmAfuqLuvUc2g","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f0faeb2b-c362-4ac4-9a60-282d01c6fc4d\"}"},{"__ref":"Favorites:{\"uuid\":\"43c9a9b4-fb53-4e94-8cd0-b5853a3403c9\"}"},{"__ref":"Favorites:{\"uuid\":\"293b20b9-f0d0-4607-82af-257873aab6c0\"}"}],"causesSupported":[],"major":"CS","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"47ed42c0-1f0f-44af-b51a-fbd3bf2dadc0\"}"},{"__ref":"DeepDives:{\"uuid\":\"90540d62-51c9-44a5-9d16-ce0eb3ac9d36\"}"},{"__ref":"DeepDives:{\"uuid\":\"e7d449ae-bb8a-48bf-8fbd-13d5560ad981\"}"},{"__ref":"DeepDives:{\"uuid\":\"c18f7b93-b441-434b-a5fc-5d9bd4e3a1a
