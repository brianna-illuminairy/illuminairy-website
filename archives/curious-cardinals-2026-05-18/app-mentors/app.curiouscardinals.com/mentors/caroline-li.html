xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f738b714-fd5c-4835-a8cb-1e6ec0e406ac\"}":{"__typename":"DeepDives","uuid":"f738b714-fd5c-4835-a8cb-1e6ec0e406ac","content":"\u003cp\u003eRemember you are exactly where you need to be! School, extracurriculars, and life can sometimes get the best of you and feel super overwhelming - remind yourself you are trying your best. Be patient with yourself and the progress you wish to see :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"39ca1a07-2321-4fdb-8dc0-4827783f324a\"}":{"__typename":"DeepDives","uuid":"39ca1a07-2321-4fdb-8dc0-4827783f324a","content":"\u003cp\u003eBeing a student-athlete, I value my relationships with my coaches and my professors. I want to pay it forward by providing support and knowledge to help you thrive!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"46e0db26-0c97-4590-8a94-38706d83acc8\"}":{"__typename":"DeepDives","uuid":"46e0db26-0c97-4590-8a94-38706d83acc8","content":"\u003cp\u003eMy entire dream was me eating an ice cream cookie sandwich...\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"cf6baa6e-acaf-4287-b672-03ee99bf54b8\"}":{"__typename":"DeepDives","uuid":"cf6baa6e-acaf-4287-b672-03ee99bf54b8","content":"\u003cp\u003eI chose data science because I loved the intersection between math, statistics, and computer science. I also appreciate how universal it is - you can apply it to business, healthcare, entertainment, or anything else!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"af0546b8-af30-4c5d-ae9a-e599621f9e9c\"}":{"__typename":"School","uuid":"af0546b8-af30-4c5d-ae9a-e599621f9e9c","name":"Okemos High School","city":"Meridian charter Township","type":"HIGH","state":"Michigan","country":"United States","zip":"48864"},"Education:{\"uuid\":\"f5746baa-a48b-4f83-9b19-8e80d08d9983\"}":{"__typename":"Education","uuid":"f5746baa-a48b-4f83-9b19-8e80d08d9983","school":{"__ref":"School:{\"uuid\":\"af0546b8-af30-4c5d-ae9a-e599621f9e9c\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"1d72f3a4-f95d-4db3-9a53-b29db4b8e2f9\"}":{"__typename":"Education","uuid":"1d72f3a4-f95d-4db3-9a53-b29db4b8e2f9","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"c7163841-81bb-4b17-b9cd-03da9149a2a9\"}":{"__typename":"MentorPublicProfile","uuid":"c7163841-81bb-4b17-b9cd-03da9149a2a9","displayName":"Caroline L.","slug":"caroline-li","biography":"\u003cp\u003e\u003cstrong\u003e\u003cu\u003eHi!\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’m Caroline, a third-year senior at Northwestern University and a Division I student-athlete graduating with a degree in data science, and pursuing Kellogg's Masters in Management starting in the fall. I’m passionate about helping students build confidence, balance demanding schedules, and develop the skills they need to succeed academically and beyond.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eAbout me!\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I was in high school, I was deeply involved in \u003cstrong\u003eacademics, leadership, athletics, and service\u003c/strong\u003e — and learning how to balance everything was just as important as excelling in any one area. I took 10 AP courses, became a BPA National Finalist, and served as a volunteer club captain, while also competing at the highest levels of my sport, diving!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAthletics played a major role in shaping how I approach challenges. I am on the Taiwan National Diving Team, became a national champion, placed as an international finalist, and now compete as an NCAA Division I student-athlete at Northwestern. Through diving, I learned \u003cstrong\u003ediscipline, time management, resilience, and how to perform under pressure.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, I’ve continued to build strong academic foundations through coursework in \u003cstrong\u003emath, statistics, economics, data science, and computer science\u003c/strong\u003e, while gaining real-world experience through \u003cstrong\u003econsulting and finance internships\u003c/strong\u003e. These experiences taught me how classroom concepts translate into practical decision-making and problem-solving.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eWhy I’m qualified to help!\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCurrently serve as an \u003cstrong\u003eundergraduate teaching assistant\u003c/strong\u003e for data science courses\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTutored \u003cstrong\u003emiddle and high school students in STEM\u003c/strong\u003e through a volunteer club in high school\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCoached \u003cstrong\u003especial needs students in diving\u003c/strong\u003e, adapting instruction to different learning styles\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eHow I can help you!\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eStrengthening skills in \u003cstrong\u003eSTEM subjects\u003c/strong\u003e, especially math, data science, and analytical thinking\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching \u003cstrong\u003etime management, organization, and balance\u003c/strong\u003e for students juggling school and activities\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSupporting the \u003cstrong\u003ecollege search process\u003c/strong\u003e, including essays, applications, and decision-making\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOffering guidance on \u003cstrong\u003ecareer exploration, networking, and goal-setting\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelping students build confidence in how they think, communicate, and advocate for themselves\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eA typical session with me might involve:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down challenging problems into clear, step-by-step strategies\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorking through examples together using guided questions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a realistic weekly plan that balances academics, activities, and rest\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReflecting on progress and adjusting strategies to improve efficiency and confidence\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cu\u003eOutside of academics:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI love \u003cstrong\u003esports, food, and travel\u003c/strong\u003e, and I’m passionate about \u003cstrong\u003esocial change\u003c/strong\u003e. I volunteer with a nonprofit organization and care deeply about giving back to my community. These interests shape how I mentor: with empathy, perspective, and a focus on growth beyond grades.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"59wLac1O8VUPLWb8lQ8lJuiW3oYtg1j00L7iJNk8av48","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f738b714-fd5c-4835-a8cb-1e6ec0e406ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"39ca1a07-2321-4fdb-8dc0-4827783f324a\"}"},{"__ref":"DeepDives:{\"uuid\":\"46e0db26-0c97-4590-8a94-38706d83acc8\"}"},{"__ref":"DeepDives:{\"uuid\":\"cf6baa6e-acaf-4287-b672-03ee99bf54b8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/23a9e297-ed51-4c64-8374-57c329d32977/-/preview/-/format/jpg/","https://ucarecdn.com/c8aa56a7-35a3-42a3-b7ae-4ce38e4bf163/-/preview/-/format/jpg/","https://ucarecdn.com/c0f309c2-2a2a-4011-b056-7529073ad165/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f5746baa-a48b-4f83-9b19-8e80d08d9983\"}"},{"__ref":"Educati
