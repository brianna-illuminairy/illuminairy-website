js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"35a20405-9ce5-4c6e-a941-1f3895db4863\"}":{"__typename":"DeepDives","uuid":"35a20405-9ce5-4c6e-a941-1f3895db4863","content":"\u003cp\u003eI chose Bioengineering and Electrical Engineering because I’m really interested in regenerative medicine and in the idea of using engineering to help the body heal or regenerate more effectively. I wanted to study something that would let me understand the body from a biological perspective, while also giving me the technical skills to design devices and systems that could eventually contribute to that kind of work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eElectrical engineering especially stood out to me because I’m interested in how signals, systems, and devices can interact with biological processes. More broadly, I liked that this combination would let me approach problems from both the science side and the engineering side.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also have always enjoyed math, and because I had a strong math background going into college, I felt prepared to challenge myself with a path that was more quantitative and engineering-focused.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ea4e9145-a31b-42ab-8cde-a11c4a948ed2\"}":{"__typename":"DeepDives","uuid":"ea4e9145-a31b-42ab-8cde-a11c4a948ed2","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to contribute in some meaningful way to figuring out how to regenerate limbs or help the body regenerate complex tissues more effectively. That is a huge challenge, and I definitely do not see it as something any one person will solve alone. But I think it would be incredibly meaningful to be part of the progress toward something like that.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat draws me to it is the possibility of combining biology and engineering to improve people’s lives in a really direct way. Even if my role ends up being just one small piece of a much larger effort, I would be proud to contribute to work that could one day help restore function and quality of life for people in a transformative way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7de2b596-3eaa-4783-89d0-1d8e85373237\"}":{"__typename":"DeepDives","uuid":"7de2b596-3eaa-4783-89d0-1d8e85373237","content":"\u003cp\u003eDuring my high school summers, I spent most of my time either volunteering or doing research internships. After freshman year, I volunteered at local children’s summer camps, which gave me early experience working with kids and helping create a fun, supportive environment for them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn later summers, I became much more involved in research. Living on campus and doing physics research at Oregon State was incredibly rewarding because it combined the excitement of a college environment with the joy of learning and discovery. My math background was especially helpful there, and I used Coherent Mira and Legend laser systems to produce extremely high-frequency electromagnetic waves to scan material samples. One of the most exciting parts of that experience was seeing how THz laser imaging could potentially have future applications in advanced medical diagnostics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Nike, I gained additional hands-on engineering research experience. I explored a variety of mechanical and materials engineering testing methods, and I also had the opportunity to collaborate with designers and the Nike Sports Research Lab. That experience gave me valuable exposure to interdisciplinary teamwork and applied problem-solving.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"6c9b5c05-8c40-452c-ae1f-5b83338e8041\"}":{"__typename":"DeepDives","uuid":"6c9b5c05-8c40-452c-ae1f-5b83338e8041","content":"\u003cp\u003eAs a high school student, I was definitely someone who liked to stay busy. I was advanced in my coursework and always pushed myself academically, but I was also really involved in sports. I was a double state champion in soccer and track, so a lot of my time went into training, competing, and being part of those teams.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, a big part of who I was in high school was just enjoying the experience and being around my friends. Growing up in Portland, Oregon, I loved being outside, playing hacky sack with friends, and making the most of everyday life at school. I also had some really great teachers who made learning exciting and had a big impact on me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo while I was definitely motivated and involved, I’d say I was also just someone who genuinely enjoyed high school, the people around me, and the balance between working hard and having fun.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"06ffadbf-5818-4d87-b798-6124ce649de8\"}":{"__typename":"School","uuid":"06ffadbf-5818-4d87-b798-6124ce649de8","name":"Jesuit High School","city":"Portland","type":"HIGH","state":"Oregon","country":"United States","zip":"97225"},"Education:{\"uuid\":\"d3443627-6463-48fb-ad72-c2ad5626706c\"}":{"__typename":"Education","uuid":"d3443627-6463-48fb-ad72-c2ad5626706c","school":{"__ref":"School:{\"uuid\":\"06ffadbf-5818-4d87-b798-6124ce649de8\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"ee0870d6-8e9f-4d90-b571-1dfba8e2f928\"}":{"__typename":"Education","uuid":"ee0870d6-8e9f-4d90-b571-1dfba8e2f928","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Bioengineering + Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"21cc68e8-a94a-4697-b563-f7936c510d24\"}":{"__typename":"MentorPublicProfile","uuid":"21cc68e8-a94a-4697-b563-f7936c510d24","displayName":"Calvin H.","slug":"calvin-hansen","biography":"\u003cp\u003eHi! I’m Calvin and I’m a freshman at the University of Pennsylvania studying Bioengineering \u0026amp; Electrical Engineering! I am passionate about helping students advance in STEM coursework, deepen their understanding of what they are learning, and develop the curiosity to explore beyond the classroom.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy interest in STEM started early, but entering high school, I was not entirely sure what direction I wanted to pursue. Over time, through both coursework and independent exploration, I discovered how exciting STEM can be, not only for solving problems, but also better understanding the world and creating meaningful solutions. That process of exploration shaped the way I approach learning, and it is also the mindset I hope to encourage in the students I work with.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout high school and college, I have had the opportunity to explore STEM in a variety of settings. I worked in a university physics lab and in a materials and mechanical engineering lab during high school, and I currently work in a tissue engineering lab at Penn. These experiences have given me exposure to different scientific fields and helped me discover a strong interest in regenerative medicine, which I hope to pursue further through a PhD in the future.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI mentor students who want to work on:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAdvancing in and understanding STEM coursework in school\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding effective study habits\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDeveloping confidence and enjoyment in STEM\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePursuing personal STEM research outside of school to enrich in-class learning and personal development\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking large goals into clear, manageable steps\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAs a tutor, I bring both experience and perspective. From elementary and middle school onward, I pushed myself to learn math beyond my grade level, allowing me to begin AP Calculus as a freshman in high school. Later, I helped organize my high school’s tutoring center and personally tutored students in mathematics through linear algebra, as well as English, Spanish, and history. These experiences taught me that strong mentoring is not just about explaining material well. It is also about understanding how each student learns, meeting them where they are, and helping them build the skills and confidence to improve over time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eIdentifying current challenges\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a step-by-step plan for improvement and practicing problem-solving strategies\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing self-awareness to explore interests and find passions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreate a framework to practice in real life going forward\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eOutside of school\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I love sports and the outdoors! In high school, I was a state champion in both track and soccer. I am originally from Oregon, so I especially enjoy hiking, camping, and spending time outside! At Penn, you can usually find me hanging out with friends, playing hacky sack, or watching cooking and woodworking videos.\u003c/p\u003e\u003cp\u003eIf you are looking to grow in STEM, strengthen your study skills, and become a more confident learner, I would love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"1QNM00Fqi3dichgse02vkh1YaVcDCxYSYWwKzvjoBxtM00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Bioengineering + Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"35a20405-9ce5-4c6e-a941-1f3895db4863\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea4e9145-a31b-42ab-8cde-a11c4a948ed2\"}"},{"__ref":"DeepDives:{\"uuid\":\"7de2b596-3eaa-4783-89d0-1d8e85373237\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c9b5c05-8c40-452c-ae1f-5b83338e8041\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c69cb95f-8efc-490e-abd5-48d74beb568b/-/preview/-/format/jpg/","https://ucarecdn.com/8b9492db-6ae5-4cda-ab80-2ccd2baf96d3/-/preview/-/format/jpg/","https://ucarecdn.com/cd2e1fa6-0c80-446a-97c4-2556ec80ecb9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d3443627-6463-48fb-ad72-c2ad5626706c\"}"},{"__ref":"Education:{\"uuid\":\"ee0870d6-8e9f-4d90-b571-1dfba8e2f928\"}"}],"hiredAt":"2026-03-30T19:06:49.863Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"calvin-hansen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"21cc68e8-a94a-4697-b563-f7936c510d24\"}"}}},"_sentryTraceData":"c456f4a2ea6e4304b1494eef1af4a253-807801abfabcc99c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c456f4a2ea6e4304b1494eef1af4a253,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"calvin-hansen"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","da
