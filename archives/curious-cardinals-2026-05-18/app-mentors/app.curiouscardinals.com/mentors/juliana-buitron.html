xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"db52c7ad-d9b0-4168-a0fc-a17ee91db9ef\"}":{"__typename":"Favorites","uuid":"db52c7ad-d9b0-4168-a0fc-a17ee91db9ef","photoUrl":"https://ucarecdn.com/1eaa33b8-6004-4ffc-8b85-7cbc09f2d643/","title":"Philadelphia Eagles","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"6063d59b-9c87-403e-9be9-24ae64818a41\"}":{"__typename":"Favorites","uuid":"6063d59b-9c87-403e-9be9-24ae64818a41","photoUrl":"https://ucarecdn.com/a0fd2815-366f-4861-9d5a-50174223e723/","title":"Swimming","type":"SPORT"},"Favorites:{\"uuid\":\"cae4e313-7de1-4b3c-a91f-5d73d3ace108\"}":{"__typename":"Favorites","uuid":"cae4e313-7de1-4b3c-a91f-5d73d3ace108","photoUrl":"https://ucarecdn.com/6df4b395-fb70-4096-b71e-b9ac48f1f5ba/","title":"Interstellar","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"719cb7e9-9774-47ca-adad-3d7535353ae0\"}":{"__typename":"DeepDives","uuid":"719cb7e9-9774-47ca-adad-3d7535353ae0","content":"\u003cp\u003eI would tell my high school self to not stress so much about having everything figured out. I think a lot of the time there feels to be pressure but the path to success isn’t always linear, and it’s okay to explore different interests before finding what truly excites you. Enjoy the learning process and do not be afraid to ask for help/guidance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1d23a54c-9604-4b84-b2d1-15b36d0a1a0a\"}":{"__typename":"DeepDives","uuid":"1d23a54c-9604-4b84-b2d1-15b36d0a1a0a","content":"\u003cp\u003eEveryone deserves someone in their corner who encourages them, helps them navigate challenges, and celebrates their wins. Mentorship is about building that support system and showing students that they are capable of more than they realize!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"28311999-25dc-4729-9a4b-25a87568100b\"}":{"__typename":"DeepDives","uuid":"28311999-25dc-4729-9a4b-25a87568100b","content":"\u003cp\u003eWhile I have ambitious career goals, I also want to prioritize my relationships and personal well-being. One thing I hope to accomplish in my life is to build a life where I can make a meaningful impact in my career while also cherishing time with family and friends, traveling, and pursuing my hobbies.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fe8239a2-99c7-4787-8e4b-2cf5a8b3927f\"}":{"__typename":"DeepDives","uuid":"fe8239a2-99c7-4787-8e4b-2cf5a8b3927f","content":"\u003cp\u003eI chose to major in Political Science because I am deeply interested in understanding the injustices within our government and political systems. Growing up, I became increasingly aware of the systemic inequalities that exist in our laws and policies—how some communities are disproportionately affected by decisions made at the highest levels of power. I wanted to study political science not just to learn about these injustices, but to find ways to challenge and change them.\u003c/p\u003e\u003cp\u003eThrough my studies, I’ve explored issues like immigration law, voting rights, and the influence of money in politics, all of which highlight the disparities in our system. I believe that knowledge is the first step toward change, and I want to use what I learn to make a tangible impact, whether through law, advocacy, or policy reform.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"238f97e6-3098-4e26-9862-5074f668a6f0\"}":{"__typename":"School","uuid":"238f97e6-3098-4e26-9862-5074f668a6f0","name":"East High School","city":"West Chester","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19380"},"Education:{\"uuid\":\"4563272f-43e0-4a8c-88a5-5d501aa6e244\"}":{"__typename":"Education","uuid":"4563272f-43e0-4a8c-88a5-5d501aa6e244","school":{"__ref":"School:{\"uuid\":\"238f97e6-3098-4e26-9862-5074f668a6f0\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"78ab3259-a649-427c-8427-40f64d157cc4\"}":{"__typename":"Education","uuid":"78ab3259-a649-427c-8427-40f64d157cc4","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"9035e33e-da3d-4ea6-9542-1d4ee100fd03\"}":{"__typename":"MentorPublicProfile","uuid":"9035e33e-da3d-4ea6-9542-1d4ee100fd03","displayName":"Juliana B.","slug":"juliana-buitron","biography":"\u003cp\u003e\u003cstrong\u003eHi! I’m Juliana Buitron, a third-year Political Science student at UCLA with a passion for education, civic engagement, and mentorship.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt UCLA, I serve as the External Vice President of IGNITE, a national organization that empowers young women to become political leaders. I lead both the Civic Engagement and Marketing committees, organize campus-wide events, recruit members, and build partnerships with external organizations. Through this work, I’ve strengthened my leadership, public speaking, and organizational skills—tools I hope to bring to every mentoring session.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAcademic Support Areas:\u003c/strong\u003e\u003cbr\u003e📚 College Essay Writing\u003cbr\u003e📖 Law, Government \u0026amp; Policy\u003cbr\u003e🧠 K–5 Grade Math\u003cbr\u003e📝 Writing \u0026amp; Essay Coaching\u003cbr\u003e📘 U.S. History \u0026amp; Civics\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI specialize in helping students refine their writing, particularly for\u003cstrong\u003e college essays.\u003c/strong\u003e I guide students through the entire process, from brainstorming unique topics to crafting compelling narratives that highlight their strengths and passions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also assist students in creating\u003cstrong\u003e passion projects\u003c/strong\u003e, whether it's starting a blog, launching a community initiative, or pursuing a creative idea. I help them identify their interests, formulate a plan, and set achievable goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition, I’m well-versed in law, government, and policy, and can help students navigate complex political concepts with real-world applications. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor younger students, I offer tutoring in \u003cstrong\u003eK–5 grade math\u003c/strong\u003e, breaking down concepts in a way that builds confidence and understanding. My past experiences include tutoring my younger cousin in reading, writing, and elementary math. These roles taught me how to foster a supportive and engaging environment for students of all ages.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWork Experience Highlights:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLegal Intern, Public Counsel – Nation’s Largest Pro Bono Law Firm\u003c/strong\u003e: Supported asylum seekers and unaccompanied minors by conducting intake interviews in Spanish, drafting memos, researching country conditions, and assisting attorneys with immigration court filings.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLegal Intern, Kingbird Legal\u003c/strong\u003e: Communicated with clients and insurance companies, prepared legal documents, and supported attorneys at a personal injury and pro bono law firm.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePolitical Research Intern, Crossroads Campaign Solutions\u003c/strong\u003e: Advanced civic engagement campaigns through policy research, phone banking, and community outreach for pro-immigration reform efforts.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEach of these experiences has strengthened my communication, organization, and mentorship skills, preparing me to connect with students from diverse backgrounds and learning styles.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside the classroom\u003c/strong\u003e, I enjoy swimming, playing tennis, hiking with friends, and spending time with my family. I also love reading and exploring new perspectives through books and stories.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e✨ If you’re looking for a patient, encouraging mentor who can help make learning meaningful, I’d love to work with you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"jjxwjzOgOFJxNf1zC5kGw2i8Rj302CLbwI29Kv00Vs37s","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I’m most proud of is getting into UCLA. The college application process was intense, requiring countless hours of studying, writing essays, and balancing extracurriculars, but my hard work paid off when I was accepted into my dream school. Being at UCLA has given me the opportunity to learn from incredible professors, engage in meaningful discussions, and gain hands-on experience in advocacy and civic engagement. Looking back, I’m proud not just of getting in, but of the dedication and perseverance it took to get here. I hope to inspire students to believe in themselves and pursue their ambitions with confidence—because with determination and the right support, they can achieve anything.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"db52c7ad-d9b0-4168-a0fc-a17ee91db9ef\"}"},{"__ref":"Favorites:{\"uuid\":\"6063d59b-9c87-403e-9be9-24ae64818a41\"}"},{"__ref":"Favorites:{\"uuid\":\"cae4e313-7de1-4b3c-a91f-5d73d3ace108\"}"}],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"719cb7e9-9774-47ca-adad-3d7535353ae0\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d23a54c-9604-4b84-b2d1-15b36d0a1a0a\"}"},{"__ref":"DeepDives:{\"uuid\":\"28311999-25dc-4729-9a4b-25a87568100b\"}"},{"__ref":"DeepDives:{\"uuid\":\"fe8239a2-99c7-4787-8e4b-2cf5a8b3927f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4cec2715-c8d3-4e8c-be47-a8b6a3f779f0/-/preview/-/format/jpg/","https://ucarecdn.com/40a76f94-8187-4b03-9047-52dcd5b8f0ee/-/preview/-/format/jpg/","https://ucarecdn.com/abba1cd5-5067-4c1c-a1dc-a62eb4cd8e8c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\
