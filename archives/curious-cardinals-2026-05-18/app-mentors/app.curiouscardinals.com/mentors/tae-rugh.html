xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2040ca4c-322f-4550-a6ee-38c1009edb55\"}":{"__typename":"Favorites","uuid":"2040ca4c-322f-4550-a6ee-38c1009edb55","photoUrl":"https://ucarecdn.com/9a78963f-c097-4480-9c99-d0583a77519d/","title":"Good Will Hunting","type":"MOVIE"},"Favorites:{\"uuid\":\"3a297d3c-a927-40cf-9750-4a68952fe6bb\"}":{"__typename":"Favorites","uuid":"3a297d3c-a927-40cf-9750-4a68952fe6bb","photoUrl":"https://ucarecdn.com/bfbdae32-70ed-412c-8539-f0489bafdf89/","title":"Les Miserables","type":"PLAY"},"Favorites:{\"uuid\":\"8b3d5512-2b3c-44b8-8a3d-b4cb81f8d91f\"}":{"__typename":"Favorites","uuid":"8b3d5512-2b3c-44b8-8a3d-b4cb81f8d91f","photoUrl":"https://ucarecdn.com/7a8b60b2-4c01-4caf-a9d0-f69bd205e1f5/","title":"Harry Potter (Deathly Hallows)","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"088f814e-b1b8-43a5-a4fa-bf6f9134dcbf\"}":{"__typename":"DeepDives","uuid":"088f814e-b1b8-43a5-a4fa-bf6f9134dcbf","content":"\u003cp\u003eIn my career, I want to make a positive impact on the world and have fun doing it. I have always been inclined to work with my hands and build things, so mechanical engineering was a natural fit. Later, I decided that in particular I want to help make robots that do good.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"8b5c283a-46d8-4eb0-876d-468c003db88c\"}":{"__typename":"DeepDives","uuid":"8b5c283a-46d8-4eb0-876d-468c003db88c","content":"\u003cp\u003eI spent every summer of my childhood in a small beach town in Cape Cod called Woods Hole. It is a very quirky and very science-y town, home to 3 marine research institutions. I attended (and later worked at) a summer camp called Science School which taught all sorts of science from marine ecology to submersible robot engineering. I learned a tremendous amount from these \"classes\" although it never felt like school because it was so much fun. The experience shaped my teaching style to emphasize the joy of learning by leveraging hands-on activities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"011fbfea-3e96-4e82-8cb6-8398b6e4bb3e\"}":{"__typename":"DeepDives","uuid":"011fbfea-3e96-4e82-8cb6-8398b6e4bb3e","content":"\u003cp\u003eAt my grandparents house, there is this marble game called Marble Solitaire where you jump marbles over each other and try to end up with only one left at the end. I play it endlessly every time I visit them, but I still have never beaten the game. This time, I have decided to cheat a little by coding a program to find the solution.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"6f84690a-d229-44bf-922e-c2dac5795a5c\"}":{"__typename":"Education","uuid":"6f84690a-d229-44bf-922e-c2dac5795a5c","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering (MS)","degree":"MS"},"School:{\"uuid\":\"888d454a-5e56-4edf-aee3-81e83892b286\"}":{"__typename":"School","uuid":"888d454a-5e56-4edf-aee3-81e83892b286","name":"Menlo-Atherton High School","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"35bb3cec-98e4-48da-9c03-160de8d3ed7e\"}":{"__typename":"Education","uuid":"35bb3cec-98e4-48da-9c03-160de8d3ed7e","school":{"__ref":"School:{\"uuid\":\"888d454a-5e56-4edf-aee3-81e83892b286\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"60eac35f-b083-49c4-8729-fcd71bdad3a7\"}":{"__typename":"MentorPublicProfile","uuid":"60eac35f-b083-49c4-8729-fcd71bdad3a7","displayName":"Tae R.","slug":"tae-rugh","biography":"Tae is a graduate student at Carnegie Mellon University studying robotic and control systems. He recently finished his undergraduate degree at the University of California Irvine, with a major in mechanical engineering and a minor in computer science. At school, outside of classes and studying, he designed and fabricated a linear induction motor from scratch for a Hyperloop project (think super high-speed train). Tae previously interned at Tesla where he worked with robotic arms and assisted with the development and track testing of new prototype vehicles. When he's not busy working on robots, he enjoys playing soccer, reading books, and exploring the outdoors. Tae is excited to share with younger students his joy and passion for creating things using math, physics, and computer science.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2040ca4c-322f-4550-a6ee-38c1009edb55\"}"},
