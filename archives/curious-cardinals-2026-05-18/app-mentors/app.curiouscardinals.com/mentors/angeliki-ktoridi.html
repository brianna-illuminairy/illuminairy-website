xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"81cd31ba-81e2-4394-8a24-f8c4d695e57d\"}":{"__typename":"Favorites","uuid":"81cd31ba-81e2-4394-8a24-f8c4d695e57d","photoUrl":"https://ucarecdn.com/ef250ac7-1e2a-4737-a52a-d0382ba3a5c1/","title":"the Bell Jar by Sylvia Plath","type":"BOOK"},"Favorites:{\"uuid\":\"68efeb59-170a-4173-a81c-c2f098c17c75\"}":{"__typename":"Favorites","uuid":"68efeb59-170a-4173-a81c-c2f098c17c75","photoUrl":"https://ucarecdn.com/82c35c6e-152f-45b7-9c18-967e37274c73/","title":"Kirsten Dunst","type":"ACTOR"},"Favorites:{\"uuid\":\"1a60e701-bad5-40da-9379-64a64b4487e9\"}":{"__typename":"Favorites","uuid":"1a60e701-bad5-40da-9379-64a64b4487e9","photoUrl":"https://ucarecdn.com/902eee6f-17e9-4a8a-80f0-ddf4b108b1cc/","title":"Neon Pill by Cage the Elephant","type":"ALBUM"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"be4e6ae7-f0cd-409c-b5d2-aa7b6d21d798\"}":{"__typename":"DeepDives","uuid":"be4e6ae7-f0cd-409c-b5d2-aa7b6d21d798","content":"\u003cp\u003eGrowing up speaking Spanish and English, I experienced firsthand the language barriers between my family and society. I learned to appreciate dialects, sayings, and the nuances of different languages. So when I started high school, I began learning French for fun, and it quickly blossomed into a passion that earned me a scholarship award senior year! At the same time, I was also taking AP Spanish Literature which helped me discover the enchanting realm of Spanish literature. This led me to cultivate a love for languages and I started learning Greek as well– so I know firsthand the frustration of grappling with grammar tenses on Duolingo! This led me to major in French at Boston College where I rediscovered my love for literature through Baudelaire’s poetry and Flaubert’s \u003cem\u003eMadame Bovary\u003c/em\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing born and raised in Miami not only introduced me to different backgrounds but also my love for the ocean. Growing up right by the water cultivated my passion for environmental justice and climate advocacy. In highschool, I founded \u003cem\u003eSea Change\u003c/em\u003e, a club dedicated to raising awareness of the dangers of water pollution in South Florida’s unique marine ecosystems. As president, I coordinated cleanups with local NGOs\u0026nbsp; and implemented sustainability initiatives within my school. At the same time, I took classes such as AP Government and Politics which expanded my interests and introduced me to the world of law. These experiences allowed me to merge my passions for environmental sustainability and political science, inspiring my goal of becoming an environmental lawyer. Combining this love for literature, languages, philosophy, and politics, majoring in French and Political Science was the best choice for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"349359a0-a74d-41d8-bb63-02a9bf171d62\"}":{"__typename":"DeepDives","uuid":"349359a0-a74d-41d8-bb63-02a9bf171d62","content":"\u003cp\u003eAs a first-generation American and first-generation college student, I understand the challenges of navigating unfamiliar environments and how overwhelming it may be. I always want to make sure I communicate properly so things don't get lost in translation. I have learned firsthand the value of communication in bridging cultural and linguistic gaps. Having tutored in the past, I always mold my teaching style to every student’s needs, striving to foster mutual understanding and cooperation to achieve shared goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy gender identity has also always been a prevalent topic in my education, and now in my mentoring style. Having attended an all-girls school shaped my focus on empowering women and breaking social norms, especially in male-dominated fields.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese experiences have definitely influenced my understanding of gender and cultural identity. Now at Boston College, I’m so glad to be surrounded by people who love to learn, and in my tight-knit community I stress the importance that ‘empowered women empower women’. Always making sure to be my authentic self, I strive to be the best mentor to fit your needs!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"c0027122-ffa5-425c-9a19-c58faa4338d5\"}":{"__typename":"DeepDives","uuid":"c0027122-ffa5-425c-9a19-c58faa4338d5","content":"\u003cp\u003eAs a symbol of personal resilience and professional success, one of the first authors I looked up to is Maya Angelou. Reading \u003cem\u003ePhenomenal Woman\u003c/em\u003e by Maya Angelou was my first experience with poetry and it truly opened my eyes to the world of feminist literature. The first time I read her work I loved how I could understand her writing with ease, even if she was a renowned writer and I a 5th grader. As a young girl, it helped me with my confidence, physically and mentally. I began to walk like the woman in the poem, with a “click of my heels” and I felt like a phenomenal woman at just 11 years old. It inspired me to begin writing for my high school newspaper and even learn more about multilingual literature, like \u003cem\u003eHouse of the Spirits \u003c/em\u003eby Isabel Allende and \u003cem\u003e20 Love Poems and a Song of Despair\u003c/em\u003e by Pablo Neruda. This newfound love for poetry and literature in general also felt like a way for me to connect with my society and instilled in me a sense of power. My encounter with Maya Angelou, as a woman, scholar, and writer, was the birth of my everlasting passion for reading and writing. She inspired me to believe in myself and my own identity, which had a lasting impact on the way I view myself and my dreams.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"509d0e1d-115a-4fb9-9671-9cf7e7ae62ae\"}":{"__typename":"DeepDives","uuid":"509d0e1d-115a-4fb9-9671-9cf7e7ae62ae","content":"\u003cp\u003eSeeing how my accomplishments make me and my family proud keeps me motivated to keep going every day. I want to give back to my family since as a young girl I saw how my grandma helped to take care of me while my single mom worked to provide for us. My dreams manifest to me in everything I see and even at times when my interests branch out and I see them turning into Sylvia Plath’s fig tree analogy, more often than not this is what keeps me going! Even at times when the journey is not always linear, reflecting on my achievements always helps re-ground me when things get a bit complicated. My time in college has solidified the importance of a good support system; this manifests itself in maintaining close ties with friends, family, and mentors! My Greek tutor, Antonis, is always motivating me to strive above and beyond, inspiring me to keep going during times when I need that extra push.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"fb90af96-a126-4411-9ab0-cba6be8982fc\"}":{"__typename":"School","uuid":"fb90af96-a126-4411-9ab0-cba6be8982fc","name":"Carrollton School of the Sacred Heart - Barat Campus","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33133"},"Education:{\"uuid\":\"89e23788-9e42-431a-bf4b-1ce540c8271f\"}":{"__typename":"Education","uuid":"89e23788-9e42-431a-bf4b-1ce540c8271f","school":{"__ref":"School:{\"uuid\":\"fb90af96-a126-4411-9ab0-cba6be8982fc\"}"},"startYear":"2018","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fb9cd652-9df1-4dec-b081-ad0eb4d67623\"}":{"__typename":"School","uuid":"fb9cd652-9df1-4dec-b081-ad0eb4d67623","name":"Boston College","city":"Chestnut Hill","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02467"},"Education:{\"uuid\":\"19508718-f526-4960-8b84-8ac0eade1e35\"}":{"__typename":"Education","uuid":"19508718-f526-4960-8b84-8ac0eade1e35","school":{"__ref":"School:{\"uuid\":\"fb9cd652-9df1-4dec-b081-ad0eb4d67623\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Political Science and French","degree":null},"MentorPublicProfile:{\"uuid\":\"d600a3c4-c1f2-4182-97be-40b4f1f9c874\"}":{"__typename":"MentorPublicProfile","uuid":"d600a3c4-c1f2-4182-97be-40b4f1f9c874","displayName":"Angeliki K.","slug":"angeliki-ktoridi","biography":"\u003cp\u003e“I am never stagnant; I rise from my worst disasters, I turn, I change.” -Virginia Woolf, \u003cem\u003eThe Waves.\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eHi! My name’s Angeliki Ktoridi, I’m from Miami, and I’m currently a sophomore at BC studying Political Science and French.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have always been passionate about languages, literature, political philosophy (oddly enough!), and environmental advocacy. One thing about me is that I strongly believe that true communication stems from knowing at least two languages. Coming from a multicultural background—with a Cuban mom and a Greek-Cypriot dad—I grew up deeply connected to different cultures.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and advocacy, I love reading and writing, which led me to join \u003cem\u003eThe Laughing Medusa\u003c/em\u003e, Boston College’s women and non-binary literary magazine. I am currently Web Editor so I spend lots of time on WordPress and Canva and I recently re-designed our website! Additionally, I explore journalism through \u003cem\u003eThe Heights\u003c/em\u003e, BC’s student newspaper, where I write about all things pop culture, from movie to book reviews. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eStaying active is also a huge part of my life. Growing up with a marathon-runner dad, I developed a love for fitness. I am currently a spin instructor at BC, where I plan and teach 45-minute classes twice a week. One of my favorite moments was organizing a Greek-themed class for my dad when he visited during Parents' Weekend! Outside of cycling, I enjoy Pilates and HIIT workouts.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time you’ll find me scrolling through Pinterest, visiting farmers markets, or adding new books to my GoodReads list and movies to my Letterboxd! I’m currently reading Eileen by Ottessa Moshfegh– feel free to reach out for any book or movie recs!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor,\u0026nbsp; I am dedicated to supporting students and promise that whatever subject I will be helping out in or passion projects we’ll be planning, I will give you my all! I love sharing and helping others on topics that I am truly passionate about. I believe a mentor is the best way to get both feet on the ground and learn about yourself and what you truly love to do. I promise to bring my enthusiasm, dedication, and firsthand experience to every session, helping students navigate their learning journeys with confidence!\u003c/p\u003e","teachingVideoPlaybackId":"Zw1f79xs6PUkRVMfHRXgF005boiTpvvcJ9Jp6c33nZrA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"81cd31ba-81e2-4394-8a24-f8c4d695e57d\"}"},{"__ref":"Favorites:{\"uuid\":\"68efeb59-170a-4173-a81c-c2f098c17c75\"}"},{"__ref":"Favorites:{\"uuid\":\"1a60e701-bad5-40da-9379-64a64b4487e9\"}"}],"causesSupported":[],"major":"Political Science and French","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"be4e6ae7-f0cd-409c-b5d2-aa7b6d21d798\"}"},{"__ref":"DeepDives:{\"uuid\":\"349359a0-a74d-41d8-bb63-02a9bf171d62\"}"},{"__ref":"DeepDives:{\"uuid\":\"c0027122-ffa5-425c-9a19-c58faa4338d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"509d0e1d-115a-4fb9-9671-9cf7e7ae62ae\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/76a94cb6-aff3-41ef-8a5d-d6275c7cb72a/-/preview/-/format/jpg/","https://ucarecdn.com/821d207d-d749-4fb3-9245-f1e0d38972c4/-/preview/-/format/jpg/","https://ucarecdn.com/efc0a2c6-5dd2-47ad-bfef-666d76b06321/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"89e23788-9e42-431a-bf4b-1ce540c8271f\"}"},{"__ref":"Education:{\"uuid\":\"19508718-f526-4960-8b84-8ac0eade1e35\"}"}],"hiredAt":"2025-02-28T10:03:27.045Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Writing","Spanish","French","History","Executive Function","Academic Coaching","Reading","K-6 Storybook","Music","Fashion / Cosmetics","History Project","Law / Government / Policy","Journalism","Sustainability"],"communityBadges":["https://ucarecdn.com/98153803-7084-46d6-8edc-6473c210cc7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"angeliki-ktoridi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":
