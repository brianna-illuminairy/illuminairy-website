js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b6f249b7-3d94-49bb-8bdf-a621c4419dde\"}":{"__typename":"DeepDives","uuid":"b6f249b7-3d94-49bb-8bdf-a621c4419dde","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would be to focus less on having everything figured out and more on exploring what genuinely interests you. At that age, it’s easy to feel pressure to follow a “perfect” path—getting the best grades, joining the right clubs, or building a resume—but in reality, the most valuable experiences come from trying new things and being open to change.\u003c/p\u003e\u003cp\u003eI would also remind myself not to be afraid of failure. Some of the most important lessons I’ve learned have come from things that didn’t go as planned—whether that’s a project that didn’t work out or an opportunity I didn’t get. Those moments build resilience and help you grow in ways that success alone can’t.\u003c/p\u003e\u003cp\u003eAnother piece of advice would be to invest in relationships. The people around you—friends, mentors, teachers—play a huge role in shaping your experience and opening doors you didn’t even know existed. Don’t hesitate to ask questions, seek guidance, and learn from others.\u003c/p\u003e\u003cp\u003eFinally, I’d tell myself to enjoy the process. It’s easy to always look ahead to the next milestone, but middle and high school are a unique time to discover who you are, what you care about, and what excites you. The more you stay curious and engaged, the more meaningful your journey will be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"faad1985-0eb2-4ecf-a996-1f7184d05b89\"}":{"__typename":"DeepDives","uuid":"faad1985-0eb2-4ecf-a996-1f7184d05b89","content":"\u003cp\u003eMentorship matters to me because I’ve seen firsthand how much of a difference the right guidance can make in someone’s life. At a young age, having someone who believes in you, answers your questions, and helps you think through challenges can completely change your confidence and the way you approach opportunities. I’ve been fortunate to learn from mentors who took the time to invest in me, and it’s had a lasting impact on how I make decisions and pursue my goals.\u003c/p\u003e\u003cp\u003eThat experience is a big part of why I’m passionate about giving back. Through co-founding Financial Literacy for You, I’ve worked with thousands of students, and I’ve seen how powerful it is when learning feels personal, engaging, and relevant. It’s not just about teaching concepts—it’s about helping students build confidence in their own abilities and showing them what’s possible.\u003c/p\u003e\u003cp\u003eI also believe mentorship is about more than academics or career advice. It’s about helping someone develop how they think, approach challenges, and grow over time. Everyone’s path looks different, and having a mentor can make that path feel a lot less overwhelming and a lot more intentional.\u003c/p\u003e\u003cp\u003eUltimately, mentorship matters to me because it creates a ripple effect. The support and guidance one person receives can shape their future in meaningful ways, and I think being part of that process—helping someone discover their interests, build skills, and believe in themselves—is incredibly rewarding.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a41dfe5f-44bc-48f7-b1c4-25db8712b93e\"}":{"__typename":"DeepDives","uuid":"a41dfe5f-44bc-48f7-b1c4-25db8712b93e","content":"\u003cp\u003eMy greatest source of motivation is the idea of creating meaningful impact through the work that I do. I’m driven by the belief that the skills I’m developing—whether in finance, problem-solving, or communication—can be used to help others and create opportunities that wouldn’t otherwise exist.\u003c/p\u003e\u003cp\u003eA big part of this comes from my experience co-founding Financial Literacy for You. Teaching personal finance to thousands of students showed me how powerful knowledge can be when it’s shared in an accessible way. Seeing students gain confidence in topics that once felt intimidating made me realize that even small efforts can have a lasting impact, and that’s something that continues to motivate me.\u003c/p\u003e\u003cp\u003eI’m also motivated by growth. I enjoy putting myself in environments where I’m challenged and constantly learning, whether that’s through academics, internships, or extracurriculars. I find a lot of fulfillment in improving over time and pushing myself beyond what I thought I was capable of.\u003c/p\u003e\u003cp\u003eLastly, I’m motivated by the people around me—my peers, mentors, and the communities I’m part of. Being surrounded by driven, curious individuals pushes me to hold myself to a higher standard and take full advantage of the opportunities in front of me.\u003c/p\u003e\u003cp\u003eAt the core, my motivation comes from wanting to make the most of my opportunities while also creating value for others along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"3a166a29-98ee-4ad8-ac6f-bddb64304526\"}":{"__typename":"DeepDives","uuid":"3a166a29-98ee-4ad8-ac6f-bddb64304526","content":"\u003cp\u003eAs a high school student, I was very driven but also still figuring out where to focus that energy. I cared a lot about doing well academically and being involved, but more importantly, I was curious and willing to try new things. I explored different interests—from leadership roles to starting initiatives—and used those experiences to better understand what I actually enjoyed.\u003c/p\u003e\u003cp\u003eOne of the most defining parts of my high school experience was co-founding Financial Literacy for You. What started as a small idea turned into something much larger, and it taught me a lot about initiative, persistence, and working with others. It also helped me shift from just participating in activities to trying to create impact, which changed how I approached both school and extracurriculars.\u003c/p\u003e\u003cp\u003eAt the same time, I wasn’t someone who had everything perfectly figured out. There were moments of uncertainty, balancing different commitments, and learning how to manage my time effectively. Those challenges helped me become more disciplined and intentional over time.\u003c/p\u003e\u003cp\u003eI was also someone who valued relationships. I enjoyed being part of a community—whether that was through school, extracurriculars, or service—and I learned a lot from the people around me. Looking back, I think I was someone who was motivated, open to growth, and gradually becoming more confident in my interests and abilities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"a88747d5-5202-41a7-9c2b-4a37fb292baa\"}":{"__typename":"School","uuid":"a88747d5-5202-41a7-9c2b-4a37fb292baa","name":"Oak Ridge High School","city":"El Dorado Hills","type":"HIGH","state":"California","country":"United States","zip":"95762"},"Education:{\"uuid\":\"c49fbbcc-06cc-40bb-9d08-d0fd6345bf44\"}":{"__typename":"Education","uuid":"c49fbbcc-06cc-40bb-9d08-d0fd6345bf44","school":{"__ref":"School:{\"uuid\":\"a88747d5-5202-41a7-9c2b-4a37fb292baa\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"91917608-50e6-417e-9e41-e86c9aa2dfeb\"}":{"__typename":"School","uuid":"91917608-50e6-417e-9e41-e86c9aa2dfeb","name":"University of Pennsylvania, Wharton School of Business","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"6a2b6b9a-0988-4724-af76-453a89476ee8\"}":{"__typename":"Education","uuid":"6a2b6b9a-0988-4724-af76-453a89476ee8","school":{"__ref":"School:{\"uuid\":\"91917608-50e6-417e-9e41-e86c9aa2dfeb\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Finance, Behavioral Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"254c56ba-b2c0-4eea-8119-279cdae5416f\"}":{"__typename":"MentorPublicProfile","uuid":"254c56ba-b2c0-4eea-8119-279cdae5416f","displayName":"Shawn V.","slug":"shawn-varshney","biography":"\u003cp\u003eHi! My name is Shawn Varshney, and I’m currently a student at the University of Pennsylvania’s Wharton School, where I’m pursuing a B.S. in Economics with a concentration in Finance and Behavioral Economics. I’m deeply interested in how people make decisions—whether in investing, business strategy, or everyday life—and I love helping others build the confidence to think critically and make informed choices.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I spend a lot of time exploring topics like corporate finance, consumer behavior, and statistics, and I’ve been fortunate to apply these concepts in real-world settings. I’ve worked in investment roles with organizations like the California State Teachers’ Retirement System (CalSTRS), one of the largest pension funds in the world, and I’ll be joining Hackensack Meridian Health as an Investment Management Summer Analyst. Through these experiences, I’ve developed a strong foundation in financial analysis, research, and problem-solving—skills I’m excited to share with students in a practical and approachable way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’m heavily involved on campus. I’m part of several student organizations including the Wharton Hedge Fund Club, the Wharton Undergraduate Entrepreneurship Club, and a student-run investment group where I help generate equity investment ideas. I also serve in leadership roles focused on communication and community-building, which has strengthened my ability to connect with others and create engaging, supportive environments.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the most meaningful experiences I’ve had is co-founding a nonprofit called Financial Literacy for You, where I’ve helped teach personal finance concepts—like budgeting, saving, and credit—to over 7,000 K–12 students around the world. This work has shown me how powerful education can be when it’s made accessible, interactive, and relevant to real life. It’s also reinforced my passion for mentorship and working directly with students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is to meet students where they are and help them grow—not just academically, but in how they think, approach challenges, and build confidence in themselves. Whether we’re working on school subjects, exploring interests like business or investing, or developing long-term goals, I aim to create a space that’s both supportive and motivating.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I enjoy staying active through sports like basketball, running, and strength training, and I’m a big fan of music and spending time outdoors. I’m excited to work with Curious Cardinals students and help them discover their interests, build new skills, and reach their goals!\u003c/p\u003e","teachingVideoPlaybackId":"K5o8PB7po7CF6vr4qliBa1j7Tdc4IUzlqPA2p4bW3GA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Finance, Behavioral Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b6f249b7-3d94-49bb-8bdf-a621c4419dde\"}"},{"__ref":"DeepDives:{\"uuid\":\"faad1985-0eb2-4ecf-a996-1f7184d05b89\"}"},{"__ref":"DeepDives:{\"uuid\":\"a41dfe5f-44bc-48f7-b1c4-25db8712b93e\"}"},{"__ref":"DeepDives:{\"uuid\":\"3a166a29-98ee-4ad8-ac6f-bddb64304526\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dab635c0-0459-42f0-807d-b7bd38863628/-/preview/-/format/jpg/","https://ucarecdn.com/0670697e-6914-4713-9476-aaad0d40a531/-/preview/-/format/jpg/","https://ucarecdn.com/ba7fcd4a-991e-4939-9e2d-c83ffdc82661/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c49fbbcc-06cc-40bb-9d08-d0fd6345bf44\"}"},{"__ref":"Education:{\"uuid\":\"6a2b6b9a-0988-4724-af76-453a89476ee8\"}"}],"hiredAt":"2026-04-14T20:17:49.356Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"shawn-varshney\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"254c56ba-b2c0-4eea-8119-279cdae5416f\"}"}}},"_sentryTraceData":"1e15caf48ec445c3811626e87edbc834-bdc1f419e68601c2-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1e15caf48ec445c3811626e87edbc834,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/men
