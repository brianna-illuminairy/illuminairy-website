xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"69ab1278-f345-4c76-9a55-f929a364d412\"}":{"__typename":"DeepDives","uuid":"69ab1278-f345-4c76-9a55-f929a364d412","content":"\u003cp\u003eDream big \u0026amp; do it yesterday.\u003cbr\u003e\u003cbr\u003eThere are two parts to success: dreaming it and doing it. If you can master those two, I promise you won't be able to recognize where you are a year from now.\u003cbr\u003e\u003cbr\u003eYou got this! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"11968cb3-c350-439b-8a6d-fb54287de0f3\"}":{"__typename":"DeepDives","uuid":"11968cb3-c350-439b-8a6d-fb54287de0f3","content":"\u003cp\u003eI've always been a storyteller, and growing up, storytelling was a medium for transferring knowledge.\u003cbr\u003e\u003cbr\u003eOver the years, I've learned a thing or two. I can't think of a greater purpose in this life than to share this with a younger generation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"34f72da9-0ec6-40c5-ad71-b431597e6989\"}":{"__typename":"DeepDives","uuid":"34f72da9-0ec6-40c5-ad71-b431597e6989","content":"\u003cp\u003eTwo things, actually.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e1. I want to create communities built for impact and change that will last long after I'm gone. Mentoring is a part of that dream.\u003cbr\u003e\u003cbr\u003eand 2. I want to win a fries eating contest. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6347f41d-3fb8-4225-8a4d-781dfdac7e1c\"}":{"__typename":"DeepDives","uuid":"6347f41d-3fb8-4225-8a4d-781dfdac7e1c","content":"\u003cp\u003eI started at Stanford doing a computer science degree and finished most of it in 2 years. Then, I took a gap quarter to work at a startup where I did a lot more than code. \u003cbr\u003e\u003cbr\u003eThere, I realized I would rather use my college experience to gain as many transferable skills as possible. \u003cbr\u003e\u003cbr\u003eHence, I designed my own major with a bit of CS, Design, and Management. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"1c315744-af8c-4ed1-9b0e-f4ba012b2cf5\"}":{"__typename":"School","uuid":"1c315744-af8c-4ed1-9b0e-f4ba012b2cf5","name":"Cox Mill High School","city":"Concord","type":"HIGH","state":"NC ","country":"United States","zip":"28027"},"Education:{\"uuid\":\"201213f0-eb12-42b9-9c01-cb6bc11e921f\"}":{"__typename":"Education","uuid":"201213f0-eb12-42b9-9c01-cb6bc11e921f","school":{"__ref":"School:{\"uuid\":\"1c315744-af8c-4ed1-9b0e-f4ba012b2cf5\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"c1895692-0491-4e15-b389-bda708fe3d27\"}":{"__typename":"Education","uuid":"c1895692-0491-4e15-b389-bda708fe3d27","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science + Design ","degree":null},"MentorPublicProfile:{\"uuid\":\"0b19878b-0abc-4b29-95e3-257a4eb8b2e2\"}":{"__typename":"MentorPublicProfile","uuid":"0b19878b-0abc-4b29-95e3-257a4eb8b2e2","displayName":"Astha  B.","slug":"astha-bhandari-1","biography":"\u003cp\u003eHi! I’m an immigrant who believes deeply in education as a way to level the playing field. I’ve been teaching for over 7 years, and I’m passionate about helping students—especially those who’ve been underestimated—reach their full potential.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs someone with ADHD, I’ve learned how to navigate learning challenges firsthand, and I bring that empathy and experience into my work. I’ve supported many students with learning disabilities, tailoring my approach to meet them where they are and help them thrive.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I’ve worked with over 30 students on college applications—from activity planning to essay writing—with a 100% success rate of students getting into their dream school. All 26 were admitted to their dream schools which included top 20 colleges and Ivy League schools.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI care deeply about every student I work with, and I’m excited to help you or your child discover what’s possible.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science + Design ","deepDives":[{"__ref":"DeepDives:{\"u
