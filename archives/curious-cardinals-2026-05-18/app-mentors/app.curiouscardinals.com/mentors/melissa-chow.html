xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a1ccf976-fb1e-4bca-a4bd-1fb6585f3806\"}":{"__typename":"DeepDives","uuid":"a1ccf976-fb1e-4bca-a4bd-1fb6585f3806","content":"\u003cp\u003eLive abroad for an extended period of time! I went to an international school for 9 years and being bilingual/bicultural is a huge aspect of my identity. After studying abroad in Prague last fall, I know that I want to spend more time living outside the US at some point. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"782d2cc9-6a60-4c4f-8065-8e85e958b84c\"}":{"__typename":"DeepDives","uuid":"782d2cc9-6a60-4c4f-8065-8e85e958b84c","content":"\u003cp\u003eI have been so lucky to have such great role models in my life, whether that be friends, teachers or even strangers. I credit these people with helping me make some really difficult decisions and shaping me into the person that I am. It seems only fair to provide that same level of support and guidance when I can!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"6d154cf6-3a81-4386-929d-7b96c6a8b30f\"}":{"__typename":"DeepDives","uuid":"6d154cf6-3a81-4386-929d-7b96c6a8b30f","content":"\u003cp\u003eWhen I was 8 or 9 years old, I saw the movie Cloudy with a Chance of Meatballs and for some reason the scene with the Jello castle really resonated with me. To this day I have a recurring dream in which I enter and run around in this giant jello jumpy house.   \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6852147d-346a-41ec-8f33-b94cb40db18c\"}":{"__typename":"DeepDives","uuid":"6852147d-346a-41ec-8f33-b94cb40db18c","content":"\u003cp\u003eWhen I'm not working or studying, I love to maximize my time outside! This usually means skiing, hiking, running and swimming. Since finishing college in December, I have also really enjoyed devoting more time to some of my other hobbies such as reading, cooking, and crocheting. I am a huge Bachelor fan, as well as a Formula 1 fan, and I'm always looking for people who are also eager to discuss my favorite show and sport!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"6ec7981d-733f-4e7f-9171-b8dff7b3cdea\"}":{"__typename":"School","uuid":"6ec7981d-733f-4e7f-9171-b8dff7b3cdea","name":"The Branson School","city":"Ross","type":"HIGH","state":"California","country":"United States","zip":"94957"},"Education:{\"uuid\":\"c7be8bd8-b701-4581-a1ec-2f252a26fcda\"}":{"__typename":"Education","uuid":"c7be8bd8-b701-4581-a1ec-2f252a26fcda","school":{"__ref":"School:{\"uuid\":\"6ec7981d-733f-4e7f-9171-b8dff7b3cdea\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"c7d4e797-6fb0-468d-8259-580a9a0a8a54\"}":{"__typename":"Education","uuid":"c7d4e797-6fb0-468d-8259-580a9a0a8a54","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Economics \u0026 Public Health","degree":null},"MentorPublicProfile:{\"uuid\":\"bf57e9ec-d3e0-4371-9e2e-3bc2b7b5413a\"}":{"__typename":"MentorPublicProfile","uuid":"bf57e9ec-d3e0-4371-9e2e-3bc2b7b5413a","displayName":"Melissa C.","slug":"melissa-chow","biography":"\u003cp\u003eHello! My name is Melissa, and I'm an Economics and Public Health student at Georgetown University. I’m originally from San Francisco, California but am moving to New York after I graduate this spring. As much as I love my home city, I am constantly looking for ways to push myself out of my comfort zone, meet new people, and try new things so I am very excited about this next step!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the fall of my freshman year of college, I took a women’s health course and immediately knew that I wanted to work in the healthcare space. After taking AP Chemistry in high school, I was fairly certain that I was NOT going to be a doctor. Thankfully, I quickly realized that working in healthcare is not limited to practicing medicine and I began testing out different roles and types of work to explore the industry’s vast and ever changing landscape. Whether I was conducting market research at a digital health focused nonprofit, escorting patients at Planned Parenthood, or interning within the healthcare group at a global bank, I approached each of these experiences with an open-mind and eagerness to learn about a new facet of the industry. Sure, I discovered that most of these jobs were not the right fit for me. However, I am a strong believer that more often than not, you have to find what you dislike first before you get to where you want to be. Any opportunity to learn and gain exposure is a privilege, and I encourage people to continuously challenge themselves and seek out uncomfortable situations in order to grow.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy own trial and error job-seeking process made me realize that I really enjoy chatting with people who are undergoing similar experiences. At Georgetown, I work at the undergraduate career center as a peer advisor. I find this experience to be exceptionally rewarding as it allows me to not only meet and connect with Georgetown students that I may not have overlapped with in any other capacity, but also ease their anxiety and provide some guidance as they work towards their goals. \u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to my work at the career center, I am also involved with Georgetown’s chapter of the Women’s Network, a student-run nonprofit consulting club, and the Georgetown club ski team. Outside of any sort of academic and professional endeavors, I’m passionate about living a healthy life and surrounding myself with the best people that I can! There is no shortage of things that I’m interested in and in my free time you can find me outside running, hiking, swimming, reading, learning new languages, cooking, and catching up on both the Bachelor and Formula 1 related news. I have also recently discovered the joy of crocheting and everyone in my life who has an upcoming birthday will be receiving a hat whether they like it or not!\u0026nbsp;\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"MCWcOZTmiFwhp9opmk5KQBk00A8u6gPXF9nJz29gw01tg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics \u0026 Public Health","deepDives":[{"__ref":"
