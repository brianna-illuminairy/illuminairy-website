DeepDives:{\"uuid\":\"4326b990-7c82-49e9-9869-11c18a9da4ac\"}":{"__typename":"DeepDives","uuid":"4326b990-7c82-49e9-9869-11c18a9da4ac","content":"\u003cp\u003eDon't be boring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"de97947e-6b01-440f-b75e-bc9f63003701\"}":{"__typename":"Education","uuid":"de97947e-6b01-440f-b75e-bc9f63003701","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Computer Science (Specializing in AI)), Archaeology","degree":null},"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}":{"__typename":"School","uuid":"8294116e-a190-41eb-a458-e542ee61c042","name":"St. Paul's School","city":"Concord","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03301"},"Education:{\"uuid\":\"6e6b0c4f-8ae0-4e81-a9f2-cdcb11640237\"}":{"__typename":"Education","uuid":"6e6b0c4f-8ae0-4e81-a9f2-cdcb11640237","school":{"__ref":"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"4ea7ad63-28d1-4918-8c51-56d5e87ab627\"}":{"__typename":"MentorPublicProfile","uuid":"4ea7ad63-28d1-4918-8c51-56d5e87ab627","displayName":"Chance E.","slug":"chance-emerson","biography":"\u003ch1\u003eHello, my name is \u003cstrong\u003eChance Emerson\u003c/strong\u003e.\u003c/h1\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I do two things well.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003eI help leaders understand the technologies available to them.\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cbr\u003e\u003col class=\"list-decimal list-inside\" start=\"2\"\u003e\u003cli\u003e\u003cp\u003eI work with their teams to implement those technologies across their companies. If and only if there is no alternative, I build custom software myself.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cbr\u003e\u003cp\u003eA few projects I'm especially proud of:\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLed technical development of a loan brokerage platform. They were on a no-code platform that was hitting its limits with live users and rapidly growing revenue. Delivered a six-month rebuild/migration plan and built out their first developer team to execute the plan.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDesigned workflow automation for a music label, cutting onboarding of new signees from 14 days to 2. The gap between signing an artist and when their existing music started earning for the label was a gray area where money was slipping through the cracks. Shortening it meaningfully increased revenue.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBuilt an internal product for a music publisher to track roster growth and pitch writers. Pulls in live stream counts and gives every writer their own live, shareable catalog page with all their credits, as well as a full roster page for the publishing company.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFounded a fanbase management CRM for independent musicians from my college dorm. Scaled to 2M fans and $200k ARR, handed it off to an operator, still running.\u003cbr\u003e\u003cbr\u003eOutside of technology, I love to make music. I have headlined a sold-out tour of Taiwan, opened for Sting, and played Lollapalooza. I've also helped produce or write songs with over 100 million combined streams.\u003cbr\u003e\u003cbr\u003eYou can reach me at \u003cu\u003echance.s.emerson@gmail.com\u003c/u\u003e.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eFive things I like.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003eMy Deering banjo. I once lugged it out to Joshua Tree and wrote a song that went to country radio.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cem\u003eHeart of Nowhere\u003c/em\u003e by Noah and the Whale. My favorite album. I found it when I was 13. Old habits die hard.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePaper Design. LLMs are good enough for really complex work now. In my opinion, the true barrier to accessing current model capabilities is now the software/tools around it. Paper is the exception that made me feel it doesn't have to be this way.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cem\u003eThe Thousand Autumns of Jacob de Zoet\u003c/em\u003e by David Mitchell. Artificial islands, historical fiction, Japan, trading posts. Everything I like in one book.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMy grandmother's car. I learned to drive in her 2003 convertible, then she sold it to me. I keep it alive by all means possible, fiscally responsible or not.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science (Specializing in AI)), Archaeology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"06716b71-efd5-4aa0-92fc-4180f693486f\"}"},{"__ref":"DeepDives:{\"uuid\":\"a59247dc-0c5a-46b3-bbec-d86d65095308\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2032901-b2dc-4efd-b38b-6e448b0e9ba1\"}"},{"__ref":"DeepDives:{\"uuid\":\"4326b990-7c82-49e9-9869-11c18a9da4ac\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8e55c4f3-933e-43e2-ad50-d050bb9095a6/-/preview/-/format/jpg/","https://ucarecdn.com/d98fb439-1983-4fd9-aa8c-22bc019b0c08/-/preview/-/format/jpg/","https://ucarecdn.com/6a1d5e22-bc92-4487-a66a-6eadca
