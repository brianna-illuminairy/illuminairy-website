xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a4bbba9c-2bee-4dae-8485-fb22026c5e4b\"}":{"__typename":"Favorites","uuid":"a4bbba9c-2bee-4dae-8485-fb22026c5e4b","photoUrl":"https://ucarecdn.com/f283c71d-7153-493b-b554-81001009e800/","title":"About Time","type":"MOVIE"},"Favorites:{\"uuid\":\"88ddcb08-f651-4cc4-aaa9-37338bf4e1d5\"}":{"__typename":"Favorites","uuid":"88ddcb08-f651-4cc4-aaa9-37338bf4e1d5","photoUrl":"https://ucarecdn.com/4984254f-23fd-44a7-8091-f6009526f3e8/","title":"Beach Volleyball","type":"SPORT"},"Favorites:{\"uuid\":\"510fc55e-8283-4551-b32e-abd301318bb9\"}":{"__typename":"Favorites","uuid":"510fc55e-8283-4551-b32e-abd301318bb9","photoUrl":"https://ucarecdn.com/4e5e8120-d6ee-4b87-a1e0-4ef0f98a13c2/","title":"When Breath Becomes Air by Paul Kalanithi","type":"BOOK"},"CausesSupported:{\"uuid\":\"1fbe28e5-7acf-4e16-8289-fdbca124cbbb\"}":{"__typename":"CausesSupported","uuid":"1fbe28e5-7acf-4e16-8289-fdbca124cbbb","name":"USVH","description":"\u003cp\u003eUnited Students for Veteran's Health\u003c/p\u003e","photoUrl":"https://ucarecdn.com/cead42f2-31d6-471c-b0de-3576d00e7f0f/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6097b67f-90e8-4d0c-aad8-bb003f57849d\"}":{"__typename":"DeepDives","uuid":"6097b67f-90e8-4d0c-aad8-bb003f57849d","content":"\u003cp\u003eI would want to tell my younger self that it is ok to not have everything together at all times.  Mistakes and lows are natural, and that is how you as a person learn to move forward.  I often felt from a young age I should know exactly what I wanted to do in my life and that I needed perfection academically to get there.  While I believe you should strive to do your best at whatever you pursue, I've found I am much happier and actually more successful when I cut myself some slack and prioritize activities that I enjoy rather than those I think I should be doing (and more often than not, the things I enjoy serve me well academically and professionally in the end).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"30ac9bd5-828c-4e4b-8b90-19dd18d79440\"}":{"__typename":"DeepDives","uuid":"30ac9bd5-828c-4e4b-8b90-19dd18d79440","content":"\u003cp\u003eI chose to study biology because I knew coming into college that I wanted to pursue a science and health-related career.  I have also always been fascinated by biology and the human body and how we are able to do what we do every day in order to live.  I chose Neurobiology as a focus because of a specific fascination with the brain.  The brain is at the epicenter of everything, who we are and how we function, and there is still so much we as a scientific community do not know. I liked the idea of learning about a field that is constantly evolving and gaining knowledge so that I can contribute to that continued progress. Though, even though I majored in biology, I made sure to take classes in other subjects I wouldn't normally pursue, like philosophy and computer science, to broaden my perspectives and take full advantage of the incredible resources at Stanford.  This is how I found my interest in biomedical informatics and what helped me to decide to pursue my master's degree.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"00a4f64a-4182-4c44-b6e1-277c807532a3\"}":{"__typename":"School","uuid":"00a4f64a-4182-4c44-b6e1-277c807532a3","name":"Monte Vista High School","city":"Danville","type":"HIGH","state":"CA","country":"USA","zip":"94506"},"Education:{\"uuid\":\"bdf59b2b-5abf-47e1-ace8-60c559b92641\"}":{"__typename":"Education","uuid":"bdf59b2b-5abf-47e1-ace8-60c559b92641","school":{"__ref":"School:{\"uuid\":\"00a4f64a-4182-4c44-b6e1-277c807532a3\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d19be593-7996-488e-99c9-31a4d57a233d\"}":{"__typename":"School","uuid":"d19be593-7996-488e-99c9-31a4d57a233d","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"CA","country":"USA","zip":"94306"},"Education:{\"uuid\":\"6e7f09dd-d64d-4891-b178-37d16d2458b9\"}":{"__typename":"Education","uuid":"6e7f09dd-d64d-4891-b178-37d16d2458b9","school":{"__ref":"School:{\"uuid\":\"d19be593-7996-488e-99c9-31a4d57a233d\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022, 2023","major":"Biology, Biomedical Informatics","degree":null},"MentorPublicProfile:{\"uuid\":\"631cd843-2f6e-4857-97e6-a51465112bf9\"}":{"__typename":"MentorPublicProfile","uuid":"631cd843-2f6e-4857-97e6-a51465112bf9","displayName":"Maddie D.","slug":"maddie-dailey","biography":"\u003cp\u003eHi! I'm Maddie, I grew up in the Bay Area and studied Biology with a focus on Neurobiology during undergrad and Biomedical Informatics as a master’s student both at Stanford.\u0026nbsp; I was recruited to play for the Beach Volleyball team and competed for 4 years then joined the Women’s Rugby team for my final year on campus.\u0026nbsp; During summers and with my additional time during the school year, I did quite a bit of research into neurodegenerative diseases including ALS and Alzheimer’s Disease.\u0026nbsp; Outside of all of that, I played with the Stanford Marching Band, volunteered at the local Veteran’s Hospital, wrote for the Stanford Daily, and gladly took part in many of the wonderful traditions that come with being a Stanford student.\u0026nbsp; I loved going to school at Stanford and having the opportunity to learn from the many different and amazing people around me.\u0026nbsp; Since graduating, I’ve been applying to medical school and hope to pursue a career in medicine and clinical research, specifically in Neurology or Emergency Medicine.\u0026nbsp; I'm really passionate about learning, teaching, and helping other students find their own academic passions.\u0026nbsp; I have exceptional background knowledge in biology, computer science, premedical planning, essay composition, and ACT test prep in addition to a few other subjects and previous experience with tutoring and mentorship.\u0026nbsp; I am happy to offer any assistance that I can and excited to help students find success along their academic and professional journeys.\u003c/p\u003e","teachingVideoPlaybackId":"lPt9RREEoc77axjCrM4BzwGmm82fcl9V5QGOIGincpk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a4bbba9c-2bee-4dae-8485-fb22026c5e4b\"}"},{"__ref":"Favorites:{\"uuid\":\"88ddcb08-f651-4cc4-aaa9-37338bf4e1d5\"}"},{"__ref":"Favorites:{\"uuid\":\"510fc55e-8283-4551-b32e-abd301318bb9\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"1fbe28e5-7acf-4e16-8289-fdbca124cbbb\"}"}],"major":"Biology, Biomedical Informatics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6097b67f-90e8-4d0c-aad8-bb003f57849d\"}"},{"__ref":"DeepDives:{\"uuid\":\"30ac9bd5-828c-4e4b-8b90-19dd18d79440\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fc67e027-589d-4e2b-986c-39efd68898bd/-/preview/-/format/jpg/","https://ucarecdn.com/5113cb95-7950-4e59-934f-d8c172f41cfc/-/preview/-/format/jpg/","https://ucarecdn.com/a16df1c5-3472-4208-825a-95c72c3cc142/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"bdf59b2b-5abf-47e1-ace8-60c559b92641\"}"},{"__ref":"Educa
