xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"dda96540-a5e7-41cd-8248-ba4843baefe8\"}":{"__typename":"Favorites","uuid":"dda96540-a5e7-41cd-8248-ba4843baefe8","photoUrl":"https://ucarecdn.com/2ccc6e06-d399-4d3f-9d72-5462360c393b/","title":"Chicago White Sox","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"2e5c9ce8-3d8a-4cb8-8f0b-f287f4043780\"}":{"__typename":"Favorites","uuid":"2e5c9ce8-3d8a-4cb8-8f0b-f287f4043780","photoUrl":"https://ucarecdn.com/de837a45-d11b-4fef-8e70-62e55859c15e/","title":"Figure Skating","type":"SPORT"},"Favorites:{\"uuid\":\"f430f587-6a93-4de5-9400-1e2d5bc4c984\"}":{"__typename":"Favorites","uuid":"f430f587-6a93-4de5-9400-1e2d5bc4c984","photoUrl":"https://ucarecdn.com/b875faba-eeb6-4efd-97ff-1ae6e952afe9/","title":"Noah Kahan","type":"ARTIST"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5147f1a8-723e-453b-b79f-ed3e51e23a3b\"}":{"__typename":"DeepDives","uuid":"5147f1a8-723e-453b-b79f-ed3e51e23a3b","content":"\u003cp\u003eMy mom is definitely my greatest role model. As a leader in the business world herself, she always inspires me to become the best version of myself. She always approaches the world with a positive attitude and is a joy to be around. My mom always reminds me to remember two words: positive and confident. That is something I want to bring into Curious Cardinals and inspire others to feel the same. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen faced with two options of entering a room of people you know or don't know, she says pick the one you don't. There is immense value in putting yourself in new and uncomfortable situations. She is the definition of an empathetic leader and I truly admire her personal and career development over the years. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7a5a4f91-bec6-4205-9956-0c65f433963c\"}":{"__typename":"DeepDives","uuid":"7a5a4f91-bec6-4205-9956-0c65f433963c","content":"\u003cp\u003eI chose Human and Organizational Development (HOD) as my primary major because entering college, I really had no idea what I wanted to do. I knew I probably wanted to go into something business related, but I really wanted to explore different areas. The HOD major is unique to Vanderbilt and provides critical thinking and analysis skills that translate well to any career. I also enjoy the experiential learning aspect of the major as the classes are very hands-on and group focused. I also appreciate that there is a capstone semester where you get you get real experience through an internship to learn more about what career may be of interest. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI chose to also add on Economics as a second major because I do really enjoy math and the quantitative aspect of business. HOD is more focused on developing critical soft-skills while econ allows me to supplement that with a analytical problem solving. I am also doing the business minor which I chose to help introduce me to more business-focused classes. Overall, I have genuinely enjoyed classes in all of these areas.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"af070e86-f713-4bc8-9f76-65ecec4a9218\"}":{"__typename":"DeepDives","uuid":"af070e86-f713-4bc8-9f76-65ecec4a9218","content":null,"videoPlaybackId":"LlX64UIMnJy95w01rxvO4IpWGq5d01Fh300EY01ROIcT9A8","question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"604397da-46e9-4bcc-972a-3cbc287c6ffe\"}":{"__typename":"DeepDives","uuid":"604397da-46e9-4bcc-972a-3cbc287c6ffe","content":null,"videoPlaybackId":"WoNA9BpinrcC3YwMAkahiJAbO00QF4ltbPdGM2lQFkoI","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"b45e49d5-ffe6-4495-871b-bbe33aa50fb3\"}":{"__typename":"School","uuid":"b45e49d5-ffe6-4495-871b-bbe33aa50fb3","name":"Glenbrook South High School","city":"Glenview","type":"HIGH","state":"Illinois","country":"United States","zip":"60026"},"Education:{\"uuid\":\"2ea536fe-bfd5-4d02-8f16-68e527ad2c69\"}":{"__typename":"Education","uuid":"2ea536fe-bfd5-4d02-8f16-68e527ad2c69","school":{"__ref":"School:{\"uuid\":\"b45e49d5-ffe6-4495-871b-bbe33aa50fb3\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"ebcb39ef-9483-4eb9-b657-62a21d816c4d\"}":{"__typename":"Education","uuid":"ebcb39ef-9483-4eb9-b657-62a21d816c4d","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics \u0026 Human and Organizational Development","degree":null},"MentorPublicProfile:{\"uuid\":\"2d407d81-dcc5-43a9-8b2e-b22a03b446d7\"}":{"__typename":"MentorPublicProfile","uuid":"2d407d81-dcc5-43a9-8b2e-b22a03b446d7","displayName":"Ava W.","slug":"ava-winer","biography":"\u003cp\u003eHi! My name is Ava Winer, and I’m a sophomore at Vanderbilt University from the Chicago area. I’m double majoring in Human and Organizational Development (HOD) and Economics, with a minor in Business. HOD, a major unique to Vanderbilt, is essentially the psychology of business, combining classroom learning with hands-on experiences, including a unique capstone semester.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve always been drawn to creative problem-solving and analytical thinking, which shapes my academic and career aspirations in marketing and consulting. At Vanderbilt, I’ve pursued advanced coursework in economics, math, and business to strengthen my skill set. During high school, I developed a passion for mentoring by hosting AP Microeconomics review sessions through Fiveable, helping students around the world grasp complex economic concepts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLast summer, I worked as a remote marketing intern for Sprinkles Cupcakes, where I gained valuable hands-on experience in branding and strategy. Last semester I was  a project manager for Anchor Marketing, where I co-lead a team of 30 students providing marketing consulting services to local businesses in Nashville. Through this role, I’ve honed my leadership, collaboration, and strategic thinking skills while delivering tangible results for our clients. This semester I am serving as the internal deputy director of the club, helping to source clients and overall manage the club.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnother meaningful involvement for me is TAMID. I am the current Executive Vice President of TAMID Group at Vanderbilt, a consulting/finance club working directly with real Israeli companies. I help to oversee operations for this club of around 100 active members through education, consulting, and investment fund cohorts. Through TAMID, I attended the prestigious summer fellowship in Israel where I conducted market research for Datonics, a data-analytics company.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I’m involved in a variety of activities. I've been a figure skating since age 3. In the past I competed individually and on a synchronized skating team. Currently I am a member and PR chair of the Vanderbilt Figure Skating Team. On campus I am also a member of the professional business fraternity Phi Chi Theta. I started my own charitable baking business called The Cookie Collective. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy baking, playing pickleball, and attending concerts. As a mentor for Curious Cardinals, I believe my diverse experiences allow me to connect with students across a range of interests and subjects. I love working with others to help them discover their passions and potential. I look forward to meeting you soon! \u003c/p\u003e","teachingVideoPlaybackId":"NhniC02W5qeQPWctA801JadqKetqfCzu5JgIoAyiCHYf00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"dda96540-a5e7-41cd-8248-ba4843baefe8\"}"},{"__ref":"Favorites:{\"uuid\":\"2e5c9ce8-3d8a-4cb8-8f0b-f287f4043780\"}"},{"__ref":"Favorites:{\"uuid\":\"f430f587-6a93-4de5-9400-1e2d5bc4c984\"}"}],"causesSupported":[],"major":"Economics \u0026 Human and Organizational Development","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5147f1a8-723e-453b-b79f-ed3e51e23a3b\"}"},{"__ref":"DeepDives:{\"uuid\":\"7a5a4f91-bec6-4205-9956-0c65f433963c\"}"},{"__ref":"DeepDives:{\"uuid\":\"af070e86-f713-4bc8-9f76-65ecec4a9218\"}"},{"__ref":"DeepDives:{\"uuid\":\"604397da-46e9-4bcc-972a-3cbc287c6ffe\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e2c58a02-fc00-47a7-b388-e3f8b1cd509a/-/preview/-/format/jp
