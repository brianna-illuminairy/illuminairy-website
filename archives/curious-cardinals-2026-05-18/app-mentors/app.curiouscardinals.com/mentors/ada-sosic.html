xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e81b3e2b-84ba-4782-be23-e6acd4d82cfa\"}":{"__typename":"DeepDives","uuid":"e81b3e2b-84ba-4782-be23-e6acd4d82cfa","content":"\u003cp\u003eBeing a woman that ‘little me’ would think is extremely cool and genuinely successful. I think about her often — the most outspoken, loudest kid in the room who loved music and had insatiable curiosity about the world. I just know she’d love to be friends with me now! Not just because of my CV, but because I managed to turn that unquenchable thirst for knowledge into a life that I used to dream of without compromising my authentic self. My goal is to help my students do the same — to find the logic in their own mix of interests and build a future that makes them truly proud of the person \u003cem\u003ethey \u003c/em\u003eare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"ed042906-fa25-4c9c-a502-b8535eabace9\"}":{"__typename":"DeepDives","uuid":"ed042906-fa25-4c9c-a502-b8535eabace9","content":"\u003cp\u003eComing from a cross-cultural background — Serbia, the U.K., Italy, France, the U.S. — taught me that there's no single 'right' way to think or learn. I'm a bridge-builder. I adapt to how \u003cem\u003eyour\u003c/em\u003e brain works, not the other way around; I’m very patient with accents, language barriers, and the feeling of being the new kid in the room — because I've been all of those things. My mission is to help you see that your unique background isn't a hurdle but your superpower. No one else has your perspective. Let's use it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"49dec93e-48b8-42b2-920b-0462ec78e382\"}":{"__typename":"DeepDives","uuid":"49dec93e-48b8-42b2-920b-0462ec78e382","content":"\u003cp\u003eI'd tell my younger self: Stop waiting until you feel 'ready.' You never will. Dreaming big means always raising your standard, which makes it impossible to be constantly prepared. I spent so much time thinking I needed more qualifications, more confidence, more\u0026nbsp;\u003cem\u003epermission\u003c/em\u003e\u0026nbsp;— but every good thing that happened to me came from showing up a little nervous anyway. Start the club. Send the email. Apply to the thing. Embrace your uniqueness. Also? You don't have to be good at \u003cem\u003eeverything\u003c/em\u003e. Just stay curious and keep showing up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"adac9311-b99b-48b2-947d-5d7296ea43c2\"}":{"__typename":"DeepDives","uuid":"adac9311-b99b-48b2-947d-5d7296ea43c2","content":"\u003cp\u003eBecause no one should have to figure it out alone. I remember what it felt like to have big dreams and no roadmap. In reality, the difference between ‘being stuck’ and ‘starting’ is often just one person who says: “You've got this — let me help you out.” For me, mentorship is exactly that gap between “I have no idea what I'm doing” and “I actually did it!” It is a friendly hand that helps turn overwhelming potential into actionable confidence. And it usually takes just one person who believes in you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"be6747ce-7061-4797-9252-a464c31ae88e\"}":{"__typename":"School","uuid":"be6747ce-7061-4797-9252-a464c31ae88e","name":"Oswestry School","city":"Oswestry","type":"HIGH","state":"England","country":"United Kingdom","zip":"SY11 2TL"},"Education:{\"uuid\":\"9b8741a6-ff6a-43a0-b99d-666dc517c9db\"}":{"__typename":"Education","uuid":"9b8741a6-ff6a-43a0-b99d-666dc517c9db","school":{"__ref":"School:{\"uuid\":\"be6747ce-7061-4797-9252-a464c31ae88e\"}"},"startYear":"2019","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"cb6c9f1b-2983-44e3-8aa7-0f18ad4782d5\"}":{"__typename":"Education","uuid":"cb6c9f1b-2983-44e3-8aa7-0f18ad4782d5","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2026","endYear":null,"expectedGradYear":"2026","major":"International Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"a29df100-ebb9-4ca8-942b-bb039331d261\"}":{"__typename":"MentorPublicProfile","uuid":"a29df100-ebb9-4ca8-942b-bb039331d261","displayName":"Ada S.","slug":"ada-sosic","biography":"\u003cp\u003e\u003cstrong\u003eHow big do you think the world actually is? — Spoiler: bigger than a map and way more fun than a textbook!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi! I'm Ada, and I've spent my life answering that question. From Belgrade to Manchester, Rome, Paris, Bologna, and Philadelphia, my journey has taught me that the world gets bigger—and more exciting—the more you explore it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've just recently completed the last semester of my graduate studies at the \u003cstrong\u003eUniversity of Pennsylvania\u003c/strong\u003e, and am working on my Master's degree thesis in International Relations at the \u003cstrong\u003eUniversity of Bologna\u003c/strong\u003e, where I specialise in Crime, Justice, and Security. Along the way, I've also studied Politics, Philosophy and Economics at \u003cstrong\u003eLuiss University\u003c/strong\u003e, \u003cstrong\u003eSciences Po Paris\u003c/strong\u003e, as well as \u003cstrong\u003eJohns Hopkins SAIS\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI truly believe that the most incredible thing about us is that we all have different, vibrant interests that make us unique. My goal as a mentor is to help you find and nourish yours, turning your unexplored curiosity into your own success story!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA few years ago, I was a high school student who loved to dance and travel, and was (maybe even a bit too much) opinionated about world affairs— but had no idea how those things could possibly fit together.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince then, I've:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCompleted a \u003cstrong\u003eBA\u003c/strong\u003e (and am on my way to getting a \u003cstrong\u003eMA\u003c/strong\u003e) with honours;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterned at the \u003cstrong\u003eMinistry of Foreign Affairs\u003c/strong\u003e in Serbia, where I worked alongside foreign ambassadors in the Security Policy Sector;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked at the \u003cstrong\u003eUnited Nations World Food Programme\u003c/strong\u003e, the Nobel Peace Prize-winning UN agency.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHere's what I learned: the world isn't waiting for you to join. Instead, you must choose to walk in — at first, a little nervous but with your head up high — and figure it out as you go!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eI mentor students who\u003c/strong\u003e:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWant to explore \u003cstrong\u003einternational studies\u003c/strong\u003e (international relations, history, law), and various topic areas connected to \u003cstrong\u003eglobal politics, philosophy, and economics\u003c/strong\u003e (including — but not limited to — diplomacy, negotiations, and corporate crime);\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAre interested in \u003cstrong\u003ePassion Projects\u003c/strong\u003e like starting up a small business (I did that myself in high school to generate profit for the renovation of school facilities — needless to say, I've made the mistakes so you don't have to) or organising a school club (I started up an MUN club in my school, and was a member of numerous volunteering organisations);\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWant to develop \u003cstrong\u003epublic speaking skills \u003c/strong\u003eor build their \u003cstrong\u003econfidence\u003c/strong\u003e (I love being on stage — and I have a few tips and tricks for you in my back pocket!);\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAre thinking of \u003cstrong\u003eresearch projects \u003c/strong\u003e— from topic papers (I've written briefings for diplomats and countless academic works) to final thesis (currently on my second one);\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNeed help with \u003cstrong\u003eExecutive Functioning \u003c/strong\u003eor \u003cstrong\u003ePath Finding\u003c/strong\u003e; unlocking their ambitions and breaking down huge, scary projects into small, actionable steps. Exploration, organisation and time management hardly follow a one-size-fits-all framework; everyone needs a system that works for their brain — and I can help you find yours!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy qualifications:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've been a \u003cstrong\u003enote-taker for disabled students\u003c/strong\u003e at Sciences Po Paris, an \u003cstrong\u003eEnglish language tutor for Italian high-schoolers\u003c/strong\u003e in Rome (in-person and online), and a \u003cstrong\u003eStudent Ambassador\u003c/strong\u003e at Luiss University. I've learned that being good at something doesn't automatically make you a suitable mentor — so I focus on patience, meeting you where you are, and celebrating the small wins.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might involve:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurning a vague \"I like XY\" interest into a specific project;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMapping out a step-by-step plan for your concrete goal with deadlines that make you excited rather than stressed out;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing how to generate your thoughts and present ideas in a confident manner — even if your hands are shaking (mine still too sometimes!);\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOrganising your thoughts, calendar, or life. With no judgment. Ever.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside of classroom:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eUnderwater world\u003c/strong\u003e: I am a certified scuba diver who loves exploring the ocean (underwater is really the only place where my brain finally rests);\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eArtistic roots\u003c/strong\u003e: I spent 15 years as a solo dancer in a traditional Serbian ensemble, went on world-wide tours, and played both classical and electric guitar in music school;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLeadership\u003c/strong\u003e: I served as a Sergeant and Second in Command in the Combined Cadet Forces, which taught me that true leadership is all about teamwork and keeping a cool head;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWellness\u003c/strong\u003e: I am a true yoga fan who enjoys trying out new healthy recipes weekly! I am also a part-time gym rat and retired boxing enthusiast.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSo, are you curious? Overwhelmed? Bursting with ideas but no clue where to start? Have an outline in your head but need some help with its execution? Pick any or all! Your weird mix of interests isn't chaos or distraction — it's your world. Let's map it out together!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhere are we going first?\u003c/p\u003e","teachingVideoPlaybackId":"4cfRPaveP7PtAl2w00pQYUt1URE100BuNboYEgJjefNKs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e81b3e2b-84ba-4782-be23-e6acd4d82cfa\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed042906-fa25-4c9c-a502-b8535eabace9\"}"},{"__ref":"DeepDives:{\"uuid\":\"49dec93e-48b8-42b2-920b-0462ec78e382\"}"},{"__ref":"DeepDives:{\"uuid\":\"adac9311-b99b-48b2-947d-5d7296ea43c2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c8117186-b5d6-4b21-a5f4-c2ffc9438b9f/-/preview/-/format/jpg/","https://ucarecdn.com/aff6520d-b0bf-4003-8c45-9d8ac3705615/-/preview/-/format/jpg/","https://ucarecdn.com/2a2d6a7f-0f0e-4dfa-a2c6-71ec48a5a37b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9b8741a6-ff6a-43a0-b99d-666dc517c9db\"}"},{"__ref":"Education:{\"uuid\":\"cb6c9f1b-2983-44e3-8aa7-0f18ad4782d5\"}"}],"hiredAt":"2026-05-01T18:57:21.608Z","topics":[],"communityBadges":["https://ucarecdn.com/4d492211-7b83-4aa5-a016-8991edde1bb6/","https://ucarecdn.com/7e9ab2cb-d457-4e4e-9f2d-4946a44b3ea9/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ada-sosic\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a29df100-ebb9-4ca8-942b-bb039331d261\"}"}}},"_sentryTraceData":"9b81d0788d384dbf8bae456d99cf688a-96acf3f444ff9f64-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9b81d0788d384dbf8bae456d99cf688a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ada-sosic"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-
