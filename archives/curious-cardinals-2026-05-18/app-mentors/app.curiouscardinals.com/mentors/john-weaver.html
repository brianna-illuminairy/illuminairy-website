xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8dcfd55b-08fd-4039-bee5-97279f04605f\"}":{"__typename":"Favorites","uuid":"8dcfd55b-08fd-4039-bee5-97279f04605f","photoUrl":"https://ucarecdn.com/183370a9-bb78-4636-8404-4e09c537cd60/","title":"Bryan Cranston","type":"ACTOR"},"Favorites:{\"uuid\":\"309a3d14-35d9-4f00-8c96-51a1252e7950\"}":{"__typename":"Favorites","uuid":"309a3d14-35d9-4f00-8c96-51a1252e7950","photoUrl":"https://ucarecdn.com/a27fc79c-db7d-4f9d-ab6b-a4fc2b8765dc/","title":"Denzel Curry","type":"ARTIST"},"Favorites:{\"uuid\":\"367df1a0-a217-4c9a-991d-eb698888ccdb\"}":{"__typename":"Favorites","uuid":"367df1a0-a217-4c9a-991d-eb698888ccdb","photoUrl":"https://ucarecdn.com/acef4f65-621f-48db-8c01-b688f18fb6c4/","title":"Shohei Ohtani","type":"ATHLETE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b74ab6ff-e0e7-418c-9779-1638481b6dda\"}":{"__typename":"DeepDives","uuid":"b74ab6ff-e0e7-418c-9779-1638481b6dda","content":"\u003cp\u003eIf I could give advice to my high school self, it would be this: stop being so afraid of failing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor a long time, I treated failure like it was permanent like one mistake could define me. I avoided certain risks, hesitated to put myself out there, and sometimes chose the safer path simply because it protected my ego. But what I’ve learned is that growth only happens when you’re willing to look uncertain, unpolished, and even a little foolish.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would tell my younger self to try out for the thing you’re not sure you’ll make. Start the project you don’t yet feel qualified to lead. Have the difficult conversation. Apply to the program that feels slightly out of reach. The moments that shape you most won’t be the ones where you felt fully prepared, they’ll be the ones where you stepped forward anyway.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFailure is not the opposite of success; it’s the training ground for it. Every rejection builds resilience. Every awkward first attempt builds skill. Every risk builds courage. The people you admire are not fearless, they’ve just failed more times than you can see.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would also remind myself that identity isn’t fixed. You are allowed to reinvent yourself. You are allowed to change your mind. You are allowed to grow beyond the version of you that felt safe in high school. The world is much bigger than your current circle, and so are you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost importantly: don’t let fear of judgment keep you small. People are far less focused on your mistakes than you think. What they remember is your energy, your effort, and your authenticity. You won’t regret the risks you take nearly as much as the ones you were too afraid to try.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"7744ee9d-e6b3-41ad-8bcb-f4529db041e5\"}":{"__typename":"DeepDives","uuid":"7744ee9d-e6b3-41ad-8bcb-f4529db041e5","content":"\u003cp\u003eMy greatest source of motivation is the belief that there is always a light at the end of the tunnel.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNo matter how difficult a moment feels, whether it’s failure, uncertainty, rejection, or self-doubt, I genuinely believe that darkness is temporary. Challenges are not dead ends, but transitions. That perspective has carried me through setbacks and reminded me that growth often happens in seasons that feel the hardest. When I keep my eyes on the light, I can move forward with patience, discipline, and hope.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut beyond personal resilience, what truly drives me is the desire to spread that light to others.\u003c/p\u003e\u003cp\u003eI want to leave every space, team, and relationship better than I found it. I want people to feel more capable, more hopeful, and more confident after interacting with me. Positivity, to me, isn’t blind optimism it’s a deliberate choice to believe in possibility, especially when it’s hard. It’s choosing encouragement over cynicism. It’s reminding people of their potential when they’ve temporarily forgotten it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m motivated by the idea of a ripple effect. If I can inspire one person to pursue a dream they were afraid to chase, that could influence the way they show up in their family, their workplace, or their community. That energy multiplies. A single act of belief can compound into something much larger than we ever see directly.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I’m driven by impact, not just in achievements, but in people. I want my work, my leadership, and my relationships to reflect hope and forward momentum. If I can help create an environment where people feel empowered to dream boldly and live fully, then I know I’m moving toward something meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe light at the end of the tunnel isn’t just something I look for, it’s something I want to help create.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"7c01b52e-961d-4ed4-9e83-d59a7840e094\"}":{"__typename":"DeepDives","uuid":"7c01b52e-961d-4ed4-9e83-d59a7840e094","content":"\u003cp\u003eOne accomplishment I am extremely proud of is the documentary work I produced for the National History Day and C-Span StudentCam competitions while I was in middle and high school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile in classes, I took on the responsibility of producing multiple 10-minute documentary films from start to finish. I led every stage of production: research, scriptwriting, outreach, interviews, editing, narration, and final presentation. Those projects became my first real experience with ownership, leadership, and creative accountability.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe topics I chose reflected the questions that genuinely fascinated me. I produced documentaries on the Hubble Space Telescope and its transformational impact on modern astronomy, on George Washington’s 10-day stand during the Battles of Princeton and Trenton, and on climate change mitigation and lobbying efforts shaping environmental policy. Each project required deep research and, more importantly, the courage to reach out to leading professionals in the field.\u003c/p\u003e\u003cp\u003eAs a middle and high school student, I cold-contacted scientists at NASA and the European Space Agency, Pulitzer Prize-winning authors, climate scientists, historians, and political advocates. To my surprise, many responded. I conducted interviews with individuals whose work I had only read about in textbooks, and included these interviews in the finished documentaries. Those conversations not only strengthened my films but expanded my confidence, showing me that initiative can open doors at any age.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe documentaries went on to receive awards and recognition, including honors from the Daughters of the American Revolution and George Washington’s Headquarters at Morristown, and I also became an award winner in the 2020 C-Span StudentCam competition. While I am grateful for those acknowledgments, what makes me most proud is not the awards themselves it’s the discipline, curiosity, and boldness those projects required.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking back, those documentaries were an early signal of who I wanted to become: someone unafraid to pursue ambitious ideas, someone willing to do the hard research, and someone committed to telling stories that matter. They taught me that age does not limit impact, only hesitation does.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a79c974b-1d04-4d79-a4da-154343fa169e\"}":{"__typename":"DeepDives","uuid":"a79c974b-1d04-4d79-a4da-154343fa169e","content":"\u003cp\u003eA passion project that defines me is Novalord, an original animated series I created and have been developing over the past several years.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat began as an idea in my notebook evolved into a fully written and developed animated pilot, one that I believed in enough to pause my traditional academic path. I made the decision to take a gap year to fully commit to bringing the project to life. During that time, I independently raised over $39,000 to fund production, pitching the vision, building trust with supporters, and demonstrating that the concept had both creative and commercial potential. That experience alone transformed the way I think about risk, resilience, and ownership.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, I have managed every aspect of the project. As Creative Director, I lead a team of approximately 40 animation professionals across writing, storyboarding, design, and production. I oversee creative direction, production timelines, budgeting, team coordination, and long-term strategy. I’ve had to think not only as a storyteller, but as an executive, balancing artistic vision with operational discipline.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe process has required me to develop skills far beyond writing. I’ve learned how to build and motivate a team, communicate vision clearly, solve production bottlenecks, negotiate contracts, and maintain momentum during uncertain phases. There have been moments of doubt and setbacks, but each challenge has strengthened my ability to lead with both conviction and adaptability.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat makes Novalord especially meaningful to me is that it represents a bet on myself. No one assigned me this project. There was no syllabus, no grade, and no guaranteed outcome. It exists because I chose to pursue it relentlessly.\u003c/p\u003e\u003cp\u003eThis project reflects the intersection of everything I care about, storytelling, strategy, innovation, and leadership. More than anything, it proves to me that ideas only become real when you are willing to carry them forward with discipline and belief.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"62d32046-56e4-4140-af7e-7d27a2016095\"}":{"__typename":"School","uuid":"62d32046-56e4-4140-af7e-7d27a2016095","name":"The Lawrenceville School","city":"Lawrence Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08648"},"Education:{\"uuid\":\"09e81765-a7f9-40cb-86f2-96250eb08654\"}":{"__typename":"Education","uuid":"09e81765-a7f9-40cb-86f2-96250eb08654","school":{"__ref":"School:{\"uuid\":\"62d32046-56e4-4140-af7e-7d27a2016095\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"86f32191-811d-4553-9197-d6338edf00a3\"}":{"__typename":"Education","uuid":"86f32191-811d-4553-9197-d6338edf00a3","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"6cae8ae5-21a9-4644-8bc0-edc7a0b3da3a\"}":{"__typename":"MentorPublicProfile","uuid":"6cae8ae5-21a9-4644-8bc0-edc7a0b3da3a","displayName":"John W.","slug":"john-weaver","biography":"\u003cp\u003eFourth-year student at Princeton University majoring in Economics and pursuing a triple minor in Computer Science, Chinese Language, and Astrobiology. My academic interests sit at the intersection of technology, storytelling, and global systems, whether that’s analyzing digital markets, building technical tools, studying language and culture, or exploring the economics of innovation across industries. My coursework includes classes ranging from Economics of the Internet and Artificial Intelligence, Language and Society in Chinese Contexts, Computing and Optimization, Quadrotor Robotics, Life in the Universe, and Creative Fiction Writing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I have developed experience across business strategy, technology, and film production within both startup environments and major global media companies. As an Emma Bowen Foundation Fellow, I have gained early exposure to leadership, media, and corporate strategy within top-tier entertainment organizations. As an AI4ALL Research Fellow, I worked at the intersection of artificial intelligence and social impact, strengthening my technical foundation while exploring responsible innovation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Warner Bros. Discovery and Warner Bros. Animation, I have worked across Studio Business Operations, Animation Production, and Animation Development. In Business Operations, I engaged with strategic planning, financial coordination, and studio-wide process management. In Production, I worked alongside artists and production managers to support pipeline execution and cross-functional collaboration. In Development, I contributed to story evaluation, creative strategy, and early-stage project analysis, experiences that sharpened both my analytical thinking and creative instincts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am also the Creative Director of Strivy, a startup media production company, where I currently lead and manage a team of 40 animation professionals in the creation of a pilot episode for an original animated series I wrote and developed, Novalord. This role has required vision-setting, operational leadership, fundraising strategy, and hands-on creative direction across writing, storyboarding, and production workflows.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond media and technology, I have worked as a Ringle Tutor, teaching English to Korean students and developing strong cross-cultural communication skills. Outside of academics and professional work, I enjoy chess, baseball, track, soccer, and video games, which are competitive outlets that reinforce strategic thinking, discipline, and creativity in both my personal and professional life. I also run a YouTube channel in my spare time where I post animation from my projects and academic advice for students, called \"NovalordTV\". I am ecstatic for the opportunity to work alongside highly ambitious and curious students, and welcome the opportunity to learn something new in the process!\u003c/p\u003e","teachingVideoPlaybackId":"d01iIvz4fCbghW01abXFhSzSvauPv02Knxz632kJ65whVE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI recently reached a
