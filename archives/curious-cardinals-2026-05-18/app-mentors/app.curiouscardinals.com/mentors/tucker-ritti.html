xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"05966e92-668b-4f33-a28d-00e95aa08245\"}":{"__typename":"DeepDives","uuid":"05966e92-668b-4f33-a28d-00e95aa08245","content":"\u003cp\u003eMy dream job has always been to build and scale my own startup. I love identifying problems in the world and finding innovative ways to solve them through technology. There’s something incredibly exciting about taking an idea, turning it into a product, and leading a team to bring it to life. A startup is the perfect environment for that – fast-paced, high-impact, and constantly evolving. I thrive in situations where I can build, iterate, and push boundaries, and ultimately, I want to create something that makes a real difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"352b2ed7-96ac-4697-b38f-38041c1e9c26\"}":{"__typename":"DeepDives","uuid":"352b2ed7-96ac-4697-b38f-38041c1e9c26","content":"\u003cp\u003eI’m excited to be the person I wish I had access to when I was younger. Throughout my journey, I’ve benefited from learning from others – whether through direct mentorship, observing great leaders, or simply having conversations with people who challenged my way of thinking. Now, I want to pay that forward. I believe mentorship is a two-way learning experience; while I hope to guide and inspire someone else, I also know I’ll be challenged in new ways, gaining fresh perspectives and refining my own understanding in the process. There’s something incredibly rewarding about helping someone navigate their own path, offering insights, and seeing them grow into their potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"01afa7f1-545f-4753-b3c3-d6dc56bda1aa\"}":{"__typename":"DeepDives","uuid":"01afa7f1-545f-4753-b3c3-d6dc56bda1aa","content":"\u003cp\u003eOne of my favorite passion projects was building a digital sign-out system for my high school. During junior year, students gained the privilege of leaving campus for lunch, but the excitement quickly turned into frustration when signing out required standing in a 30-minute line just to get a paper slip. I saw an opportunity to use technology to solve a real-world problem.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI pitched the idea of a digital sign-out app to my school’s administration, built an MVP, and launched a pilot program. Instead of physically waiting in line, students could now request sign-out approval with the tap of a button. The request was sent directly to the receptionist, who could approve or deny it in real-time. Not only did this save time, but it also made the school safer. In emergencies, such as the California wildfires that forced evacuations, administrators no longer had to sift through paper logs – they could instantly see who was on campus.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe app is still in use today, and every time I visit, I’m reminded of the impact it had. It reinforced my passion for building technology that improves everyday experiences. More than just writing code, this project taught me about problem-solving, user experience, and the importance of persistence – skills I carry into every project I take on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"45f4aee6-7761-4be6-808d-7136d7d9e6f1\"}":{"__typename":"DeepDives","uuid":"45f4aee6-7761-4be6-808d-7136d7d9e6f1","content":"\u003cp\u003eA few days after my 17th birthday, I officially passed my private pilot checkride, earning myself my pilots license. This was one of the most rewarding challenges I’ve taken on.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAviation has always fascinated me. The combination of great freedom and great responsibility makes it unlike anything else. There’s something incredible about taking off into the open sky, knowing that every decision you make has real consequences. It forces you to stay sharp, think critically, and always be learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond just flying, the aviation community itself is what makes it even more special. Pilots are a unique group – driven, disciplined, and always eager to share their experiences. Being part of that culture, meeting others who share the same passion, and constantly learning from them has been one of my favorite aspects of becoming a pilot.\u003c/p\u003e\u003cp\u003eI also love understanding everything that goes on behind the scenes – how instrument approaches work, the rules and regulations that keep the skies safe, and the engineering behind how airplanes actually fly. There’s a level of precision and complexity in aviation that I find really exciting, and learning to navigate that world has been incredibly satisfying.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I had the opportunity to start my flight training, it was a no-brainer. It was something I had always wanted to do, and I didn’t hesitate to jump in. But what makes it even more meaningful is the history behind it – my great-grandfather was the lead engineer on the first twin-rotor helicopter. Knowing that I’m continuing that legacy, in my own way, makes every flight even more special.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"8d582739-7652-4fec-9820-9de212ae08d6\"}":{"__typename":"School","uuid":"8d582739-7652-4fec-9820-9de212ae08d6","name":"Crossroads School for Arts \u0026 Sciences","city":"Santa Monica","type":"HIGH","state":"California","country":"United States","zip":"90404"},"Education:{\"uuid\":\"a7ad45cc-a153-4ae5-90d9-72151a46a4f5\"}":{"__typename":"Education","uuid":"a7ad45cc-a153-4ae5-90d9-72151a46a4f5","school":{"__ref":"School:{\"uuid\":\"8d582739-7652-4fec-9820-9de212ae08d6\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"8f8138df-000a-449d-8ad1-695dc6035f2b\"}":{"__typename":"Education","uuid":"8f8138df-000a-449d-8ad1-695dc6035f2b","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"c35db48b-513a-4f4a-8c79-209db2b6923f\"}":{"__typename":"MentorPublicProfile","uuid":"c35db48b-513a-4f4a-8c79-209db2b6923f","displayName":"Tucker R.","slug":"tucker-ritti","biography":"\u003cp\u003eHello! I'm Tucker, and what excites me most is helping students discover they can build anything they set their minds to. There's something truly special about that moment when a challenging concept finally clicks, or when someone realizes they're far more capable than they initially thought.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm currently studying Computer Science at Dartmouth College with a focus on Artificial Intelligence and Entrepreneurship. I transferred from Georgia Tech because I wanted to explore how technology and business intersect in meaningful ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy fascination with understanding how things work started early. As a kid, I found myself more interested in studying the soccer field's irrigation systems than actually playing the game. I spent countless hours reading books like \u003cem\u003eThe Way Things Work\u003c/em\u003e and even \u003cem\u003eThe Home Depot Home Wiring Guide\u003c/em\u003e. This curiosity led me to take on leadership roles in technical theater at my elementary school, where I later returned to mentor younger students. That experience opened my eyes to something important-I genuinely love teaching and helping others unlock their potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy entrepreneurial path began in seventh grade when I started a phone repair business. Recognizing the need for better customer management systems, I spent 16 months teaching myself web development to create my first website. This experience sparked my passion for using technology to solve practical problems. I went on to launch a custom PC-building business and offered digital conversion services, working with clients including Saban Entertainment Inc. Each venture taught me valuable lessons about innovation, persistence, and creative problem-solving that I enjoy sharing with students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I've gained diverse experience across different types of technology companies. At Snap Inc., I had the opportunity to become one of the youngest interns in company history, working on Human Computer Interaction and Privacy Engineering teams across multiple summers. I've also interned at Loops.so, which is reimagining business email experiences, and most recently completed an internship at Amazon building AI agents on the Delivery Experience Sub-Same Day team. These experiences have given me insights into both startup culture and large-scale technology operations that I can share with students exploring their career paths.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe same curiosity that drove me to earn my pilot's license at 17 and restore classic cars continues to motivate me today. Whether I'm helping students master computer science fundamentals, develop entrepreneurial thinking, or build confidence in their problem-solving abilities, my goal is to inspire that sense of curiosity and possibility that has shaped my own journey.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my co-founding experience with Ticket Tutors, which connected me to Curious Cardinals, I'm passionate about mentorship because I believe every student has untapped potential waiting to be discovered. I approach tutoring not just as academic support, but as an opportunity to help students see new possibilities for their futures.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not coding or mentoring, you'll find me skiing, surfing, mountain biking, or working on my next project - I'm always learning and building something new!\u003c/p\u003e","teachingVideoPlaybackId":"1JkhAFNn022qApMjzSf5UbU00tM00pMYdVR3gF01bHz01akM","teachingVideoDescription":null,"greatestAchievement":"\u003cbr\u003e","favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"05966e92-668b-4f33-a28d-00e95aa08245\"}"},{"__ref":"DeepDives:{\"uuid\":\"352b2ed7-96ac-4697-b38f-38041c1e9c26\"}"},{"__ref":"DeepDives:{\"uuid\":\"01afa7f1-545f-4753-b3c3-d6dc56bda1aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"45f4aee6-7761-4be6-808d-7136d7d9e6f1\"}"}],"active":t
