xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"43885fef-2ef3-4220-b7a3-0a77513edab1\"}":{"__typename":"Favorites","uuid":"43885fef-2ef3-4220-b7a3-0a77513edab1","photoUrl":"https://ucarecdn.com/8e0904db-7d88-458e-a693-8b7a75eaf116/","title":"Simone Biles","type":"ATHLETE"},"Favorites:{\"uuid\":\"2b02361e-9c35-47a5-a047-305a4022c882\"}":{"__typename":"Favorites","uuid":"2b02361e-9c35-47a5-a047-305a4022c882","photoUrl":"https://ucarecdn.com/8e0904db-7d88-458e-a693-8b7a75eaf116/","title":"Paris, France","type":"CITY"},"Favorites:{\"uuid\":\"3a6afd05-3dab-42e1-9cb6-7cb9558abe06\"}":{"__typename":"Favorites","uuid":"3a6afd05-3dab-42e1-9cb6-7cb9558abe06","photoUrl":"https://ucarecdn.com/8e0904db-7d88-458e-a693-8b7a75eaf116/","title":"Cars 2","type":"MOVIE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"65ca38d4-f34d-4f33-992b-6ab3b5811357\"}":{"__typename":"DeepDives","uuid":"65ca38d4-f34d-4f33-992b-6ab3b5811357","content":"\u003cp\u003eI was raised in a Korean church, and through this church I also attended Korean school. Since I am not ethnically Korean, unlike other students, I did not have a Korean name given to me by my parents. My first Korean teacher at the school not only gave me a Korean name but also allowed me to use her Korean surname while in class. Her guidance at such an early age heavily attributed to me being able to full integrate into my church's community and really feel at home. \u003cbr\u003e\u003cbr\u003eThrough her I learned that mentorship is not something that stops in the classroom. Mentorship is guiding students in the best way that promotes their growth, whether that be academically or socially. I am still grateful towards that Korean teacher all these years later, for she made such a lasting impact on my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"78ca344f-9d4c-4500-8273-93e634efb02c\"}":{"__typename":"DeepDives","uuid":"78ca344f-9d4c-4500-8273-93e634efb02c","content":"\u003cp\u003eI love sports! I could talk sports for hours. I often go to sporting events back home in Boston or here on campus at Yale. My favorite sports to watch are soccer, basketball, gymnastics, American football, and F1 racing. \u003cbr\u003e\u003cbr\u003eAdditionally, I love the fine arts. Boston is filled with so many beautiful museums that I frequent with my family. On top of that, I love watching films and learning about film theory. However, surprising to everyone, my favorite movie of all time is Cars 2, an absolute classic. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"155db3cb-10c7-4793-85ed-4f2eb5c6dc27\"}":{"__typename":"DeepDives","uuid":"155db3cb-10c7-4793-85ed-4f2eb5c6dc27","content":"\u003cp\u003eI came into university knowing that I wanted to do something quantitative as a major. That left me with a good selection of majors like economics, applied mathematics, and physics etc. I decided to land on economics because I wanted a major that could tie in with my multilingualism. I speak English, Korean, and French and have always wanted to use these languages in my future job. I found that if I majored in economics that would open doorways to working in areas like international trade, diplomacy, or foreign business relations etc., all jobs that seek out people who are multilingual. So very naturally, I picked economics as my major. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"dc6ce0a4-e5a9-430f-8d68-54cd347f435f\"}":{"__typename":"School","uuid":"dc6ce0a4-e5a9-430f-8d68-54cd347f435f","name":"Wilbraham \u0026 Monson Academy","city":"Wilbraham","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01095"},"Education:{\"uuid\":\"b5b8c620-0b20-424e-8dcd-9f3814d38f1c\"}":{"__typename":"Education","uuid":"b5b8c620-0b20-424e-8dcd-9f3814d38f1c","school":{"__ref":"School:{\"uuid\":\"dc6ce0a4-e5a9-430f-8d68-54cd347f435f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"de9291ac-0e02-4d62-9db8-e672f517e785\"}":{"__typename":"Education","uuid":"de9291ac-0e02-4d62-9db8-e672f517e785","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"a23237fa-5fee-4782-b12a-93f017bffcb5\"}":{"__typename":"MentorPublicProfile","uuid":"a23237fa-5fee-4782-b12a-93f017bffcb5","displayName":"Tendo K.","slug":"tendo-kalule","biography":"\u003cp\u003eTendo is a junior at Yale University pursuing a degree in Economics and certification in French and Francophone Studies. She grew up in Boston, Massachusetts and speaks English, Korean, and French fluently! Outside of her academic pursuits, Tendo loves nourishing her creative side and you'll often find her acting in short films, writing short stories and scripts, painting, drawing, and frequenting art museums. During summer 2022, she completed an acting intensive program at HB Studios in NYC and during summer 2023, she completed a six week course on the Birth of Modern French Art in Paris, France. Though pursuing a career in film acting, Tendo remains an active member and student mentor of Black Gen Capital at Yale, an investment group built to help more POC and FGLI students enter working in finance post-grad. During summer 2024, Tendo completed an internship with Goldman Sachs, giving her more access and insight into teaching others about finance!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBack home in Boston, Tendo remains an active member of her community, teaching Korean and English to young students in the same church she grew up in! Having grown up in a multinational, multilingual setting, Tendo continues to remember the importance of global integration and awareness played in shaping her into the person she is today, therefore is always willing to talk about her lived experiences growing up amongst many different cultures.\u003c/p\u003e","teachingVideoPlaybackId":"uqbzIzL2LBi02ksKt00oqnDVpplKmqx01DVarARUX2RjO00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"43885fef-2ef3-4220-b7a3-0a77513edab1\"}"},{"__ref":"Favorites:{\"uuid\":\"2b02361e-9c35-47a5-a047-305a4022c882\"}"},{"__ref":"Favorites:{\"uuid\":\"3a6afd05-3dab-42e1-9cb6-7cb9558abe06\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"65ca38d4-f34d-4f33-992b-6ab3b5811357\"}"},{"__ref":"DeepDives:{\"uuid\":\"78ca344f-9d4c-4500-8273-93e634efb02c\"}"},{"__ref":"DeepDives:{\"uuid\":\"155db3cb-10c7-4793-85ed-4f2eb5c6dc27\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1c68a096-a794-4c5d-870e-3e1cd4825874/-/preview/-/format/jpg/","htt
