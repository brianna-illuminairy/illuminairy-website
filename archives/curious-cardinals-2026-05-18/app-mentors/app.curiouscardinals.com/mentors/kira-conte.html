Dives:{\"uuid\":\"c8b2d8c2-26c4-4b9b-98c0-415b9007dc2f\"}":{"__typename":"DeepDives","uuid":"c8b2d8c2-26c4-4b9b-98c0-415b9007dc2f","content":null,"videoPlaybackId":"1p01czQIQ41Jx8zmcYweYmI3O4RtLuufFADaIi02u3OXw","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f49ff1bb-09d7-4ebc-966a-04b68be62b80\"}":{"__typename":"DeepDives","uuid":"f49ff1bb-09d7-4ebc-966a-04b68be62b80","content":null,"videoPlaybackId":"z8NEkKhcBDYCGVeDyIdJmYm38R5MhM847WfAH55QVm4","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"7fd03323-8736-4ca6-af06-016f40684cbc\"}":{"__typename":"DeepDives","uuid":"7fd03323-8736-4ca6-af06-016f40684cbc","content":"\u003cp\u003eI'm also incredibly proud of my honors thesis work in psychology, which took me two years to complete. My thesis, titled \u003cem\u003e\"Addition of Controllable Meta-Mindset in the Stress Mindset Intervention\u003c/em\u003e.\" The study focused on stress mindset interventions and incorporated an innovative controllable-meta mindset module.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough a randomized controlled trial, I explored how these interventions could help individuals transform their beliefs about stress, empowering them to better manage its effects in their daily lives. The research revealed that the enhanced intervention significantly improved stress mindsets both immediately and at the one-month follow-up, but unexpectedly, it didn’t lead to the predicted increases in controllable meta-mindset. Despite this, the findings shed light on the complexity of mindset interventions and how they can be improved.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the most fulfilling moments came from a participant’s feedback, who said, \"I'm actually really excited to try and implement these strategies into my day.\" This quote underscored the potential of mindset interventions to make a tangible impact on people’s health, well-being, and performance, which made all the hard work worthwhile.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"035ec45e-5a11-4607-bacb-95b34a5a654a\"}":{"__typename":"School","uuid":"035ec45e-5a11-4607-bacb-95b34a5a654a","name":"Smithtown High School East","city":"Saint James","type":"HIGH","state":"New York","country":"United States","zip":"11780"},"Education:{\"uuid\":\"44191cdb-da3a-4806-a6cb-f9da4355dd9b\"}":{"__typename":"Education","uuid":"44191cdb-da3a-4806-a6cb-f9da4355dd9b","school":{"__ref":"School:{\"uuid\":\"035ec45e-5a11-4607-bacb-95b34a5a654a\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a2f1444d-d7bf-43a8-b227-d304ef6c9664\"}":{"__typename":"Education","uuid":"a2f1444d-d7bf-43a8-b227-d304ef6c9664","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Sociology, MA + Psychology, BA (Honors) + Minors in Education and Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"1412cac6-4898-4566-a0af-b38a90e55885\"}":{"__typename":"MentorPublicProfile","uuid":"1412cac6-4898-4566-a0af-b38a90e55885","displayName":"Kira C.","slug":"kira-conte","biography":"\u003cp\u003eAs a dedicated educator and mentor I am passionate about guiding students through their academic journeys from K-12 and beyond. With a background in psychology, education, and data science, I create personalized learning experiences that cater to each student’s strengths and areas for growth. Whether helping students master STEM subjects, enhance executive functioning skills, or develop their writing, my approach is always focused on fostering curiosity, confidence, and academic success.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn STEM subjects, particularly data science, I mentor students by making complex topics accessible and engaging. My hands-on experience in data analysis enables me to support students in areas like coding, math, and data interpretation, helping them build critical thinking skills. By nurturing their problem-solving abilities, I guide students to confidently approach challenges and explore new possibilities in science and technology.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve also worked extensively with students facing executive functioning challenges, mentoring them to improve their organization, time management, and focus. My coaching strategies are personalized to meet each student's unique needs, allowing them to excel both academically and personally. I love helping students discover the tools that work for them and guiding them toward sustainable success.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy passion for psychology and science research comes alive when I mentor students through innovative projects. Whether it’s preparing for prestigious science competitions like Regeneron and ISEF or diving into psychology research, I help students develop critical thinking and research skills. My goal is to guide students in exploring topics that fascinate them while encouraging them to push the boundaries of their learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to STEM and research, I mentor students in developing strong writing skills. From reading comprehension to essay editing and grammar, I work with students to help them articulate their ideas effectively. I believe in guiding students to become confident, clear communicators, essential skills they’ll use throughout their academic careers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor college applications, I offer specialized mentoring to help students navigate the highly competitive admissions process. I guide them through brainstorming, structuring their essays, and refining their drafts, ensuring their unique voices shine. My students have successfully gained admission to top schools, including Yale and Stanford, and I take pride in helping them tell their stories in compelling and authentic ways.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love mentoring students through passion projects! I help them turn their creative ideas into reality and explore entrepreneurial ventures. Currently, I am Chief of Staff at an AI startup. I bring my enthusiasm for entrepreneurship into my mentoring, supporting students in exploring new pathways and pursuing their goals with confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor fun, I love running, coaching gymnastics (as a former gymnast, I am always happy to chat about the sport!), all dogs, and exploring the Bay Area!\u003c/p\u003e","teachingVideoPlaybackId":"ubpn9MmdbBy5xE3S02Vie01Kwq00WIVqlXh02qqo8G00TL5s","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the achievements I’m most proud of is developing a high school data science curriculum in collaboration with YouCubed, an educational initiative based at Stanford. The course was designed to introduce students to the world of data science by engaging them with real-world datasets and applications. We focused on helping students build foundational skills in data analysis while encouraging critical thinking and problem-solving, which are essential in today’s data-driven world.\u003c/p\u003e\u003cp\u003eThis project was particularly special because it made a complex subject accessible and exciting for high school students, empowering them to see the practical uses of data science in their everyday lives. I also conducted research on the impact of the course, and I’m proud to have published a paper on the findings, which demonstrated the value of data science education in high school settings.\u003c/p\u003e\u003cp\u003eDeveloping this curriculum has been one of the most rewarding experiences of my career, as it allowed me to contribute to the growing field of data science education while fostering curiosity and innovation in the next generation of learners.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"410e9a1a-32e3-4b9c-b985-e80232a85729\"}"},{"__ref":"Favorites:{\"uuid\":\"0787ad32-1be5-44a0-b6d6-71a813853c7e\"}"},{"__ref":"Favorites:{\"uuid\":\"1e476a5e-2e11-4dc2-be58-1f929124b274\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"138e403d-6b9a-4679-a139-f5319f71a89e\"}"}],"major":"Sociology, MA + Psychology, BA (Honors) + Minors in Education and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"55ded69c-0143-4ecb-961e-9fcd257fa6ad\"}"},{"__ref":"DeepDives:{\"uuid\":\"c8b2d8c2-26c4-4b9b-98c0-415b9007dc2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f49ff1bb-09d7-4ebc-966a-04b68be62b80\"}"},{"__ref":"DeepDives:{\"uuid\":\"7fd03323-8736-4ca6-af06-016f40684cbc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1080a2e9-3ee8-4378-93cd-015fdf282fce/-/preview/-/format/jpg/","https://ucarecdn.com/969ede6d-54ed-4b78-878f-5e17c5cd96b1/-/preview/-/format/jpg/","https://ucarecdn.com/03056a4c-a0e5-4f19-81c8-31c019520bb7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"44191cdb-da3a-4806-a6cb-f9da4355dd9b\"}"},{"__ref":"Education:{\"uuid\":\
