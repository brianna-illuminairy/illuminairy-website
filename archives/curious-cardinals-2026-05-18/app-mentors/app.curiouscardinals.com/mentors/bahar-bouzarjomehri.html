xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"02528416-7b50-40f9-98de-3084a51607f0\"}":{"__typename":"DeepDives","uuid":"02528416-7b50-40f9-98de-3084a51607f0","content":"\u003cp\u003eMy greatest role model has to be my mom. She immigrated to the U.S with my older brother from Iran when she was only 22 years old. She left her entire family behind, her job, and her culture to come to a new place where she didn't even speak the language in hopes of offering my brother and I a better future. In her thirties, she went back to school to become a licensed Acupuncture all while taking care of two young children. Her life has been an emblem of perseverance and I strive to be as strong as she is. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0ef6b7be-8f69-4eb0-a68e-5f5e8c14c40b\"}":{"__typename":"DeepDives","uuid":"0ef6b7be-8f69-4eb0-a68e-5f5e8c14c40b","content":"\u003cp\u003eIn high school, I really had no idea what career path I wanted to follow. For a while, I thought I wanted to follow the pre-law track. However, I quickly realized I was much more confident in my STEM skills than humanities. In my first-year at Yale, I declared to be a Psychology major because I was drawn to clinical psychology and the development of psychiatric disorders. After taking intro biology courses, I realized I was actually more interested in understanding the molecular mechanisms that cause neuropsychiatric disease. It astounds me that we all essentially share 99.9% of our DNA, yet we are so diverse. What makes one person more likely to develop a disease than other? How much of our health is pre-determined by our genetic nature? These were the types of questions I found myself most invigorated by, so in my Sophomore year, I switched my major to Molecular, Cellular, and Developmental Biology on the pre-medical track. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"56011834-4de5-4163-9de9-849148a9f10d\"}":{"__typename":"DeepDives","uuid":"56011834-4de5-4163-9de9-849148a9f10d","content":"\u003cp\u003eOne very random thing that most people would never guess about me is that I can juggle! I was very bored one winter break in high school and I spontaneously decided that I wanted to devote several days to learning how to juggle. It's now my go to party trick and fun fact!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d7a1c9f6-68a9-4485-b372-856ee20d769c\"}":{"__typename":"DeepDives","uuid":"d7a1c9f6-68a9-4485-b372-856ee20d769c","content":"\u003cp\u003eIn my spare time, I like to be outdoors. Growing up in Washington, I was spoiled by the presence of beautiful state and national parks all around. My family would go on frequent hiking trips and camping endeavors, so I spent most of my childhood in nature. Now, I try to go outdoors as much as I can. Being in nature helps center me and rejuvenates my energy. Whether its biking, hiking, climbing, or just going for a stroll, I like to spend my spare time admiring all the beauty the world has to offer. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b2a686f4-2710-4f06-8b5d-0891c27aa042\"}":{"__typename":"Education","uuid":"b2a686f4-2710-4f06-8b5d-0891c27aa042","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Molecular, Cellular, and Developmental Biology","degree":"B.S"},"School:{\"uuid\":\"16970566-93ba-41a3-85fd-0911248cd5ef\"}":{"__typename":"School","uuid":"16970566-93ba-41a3-85fd-0911248cd5ef","name":"Olympia High School ","city":"Olympia","type":"HIGH","state":"Washington","country":"Thurston","zip":"98513"},"Education:{\"uuid\":\"215cb016-d64f-4088-8a46-f4917e5909ae\"}":{"__typename":"Education","uuid":"215cb016-d64f-4088-8a46-f4917e5909ae","school":{"__ref":"School:{\"uuid\":\"16970566-93ba-41a3-85fd-0911248cd5ef\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"f30acacf-8b9f-435d-ab5a-3cb5c5083e40\"}":{"__typename":"MentorPublicProfile","uuid":"f30acacf-8b9f-435d-ab5a-3cb5c5083e40","displayName":"Bahar B.","slug":"bahar-bouzarjomehri","biography":"\u003cp\u003eBahar is a junior at Yale University majoring in Molecular, Cellular, and Developmental Biology with a concentration in Neurobiology. She is most passionate about the intersection of STEM and public service so she plans to pursue a career in medicine as a Neurologist. Bahar is originally from Olympia, Washington and she graduated as the top of her class at her local public high school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHer academic passion for molecular biology has led her to engage in biomedical research at several labs at Yale University including the Clinical Affective Neuroscience and Development lab in the Department of Psychology, the Pollitt lab at the Yale School of Public Health, and most recently, the Brennand Lab in the Department of Psychiatry. Currently, Bahar’s research involves studying the pathogenesis of common neuropsychiatric disorders such as schizophrenia and Autism Spectrum Disorder using human induced pluripotent stem cells as a model system. Overall, Bahar is fascinated by the human body and can’t wait to dedicate her life to unraveling its mysteries as a medical scientist!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlong with her academic passions, Bahar engages in many community service projects. She has been an active volunteer at Yale New Haven Hospital, Connecticut Hospice, and HAVEN Free Clinic for the last three years where she provides patient care. Additionally, Bahar is also a mentor with the Urban Improvement Corps where she tutors underserved students and with the Integrated Refugee \u0026amp; Immigrant Services (IRIS) where she guides refugees in moving towards their career goals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout her life, Bahar has also always strived to engage in advocacy work. In high school, she led a grassroots climate advocacy movement which successfully pressured the city of Olympia into signing a bill to reach net-zero carbon emissions by 2060. At Yale, she is the co-director of Advocacy at the Yale Undergraduate Prison Project where she directs \u0026gt;150 students and facilitates partnerships with local community organizers who strive to improve the life quality of incarcerated and formerly incarcerated people. Overall, Bahar is passionate about justice and strives to make the world a more just and equitable place.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her free time, Bahar likes to be with her friends and family. More often than not, you’ll probably find her hiking some mountain somewhere or going on mini-road trips around Washington. Recently, she has also really gotten into rock climbing! Some of her favorite books are A Thousand Splendid Suns by Khaled Hosseini, The Alchemist by Paulo Coelho, and The Book Thief by Markus Zusak.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"KAcF00kH5I00b4sA00obOSs4cYY9YoGnfq6plmWe7CXEN00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular, Cellular, and Developmental Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"02528416-7b50-40f9-98de-3084a51607f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"0ef6b7be-8f69-4eb0-a68e-5f5e8c14c40b\"}"},{"__ref":"DeepDives:{\"uuid\":\"56011834-4de5-4163-9de9-849148a9f10d\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7a1c9f6-68a9-4485-b372-856ee20d769c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/96fbcd1f-2eca-4eba-b668-ec17f6967151/-/preview/-/format/jpg/","https://ucarecdn.com/bb8726c1-fab8-4507-9ecf-fd1e7df2d8c5/-/preview/-/format/jpg/","https://ucarecdn.com/50814ff6-d6b4-41bf-99b2-f7d161105e8c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b2a686f4-2710-4f06-8b5d-0891c27aa042\"}"},{"__ref":"Education:{\"uuid\":\"215cb016-d64f-4088-8a46-f4917e5909ae\"}"}],"hiredAt":"2023-09-16T12:32:24.918Z","topics":["6-8 Grade Science","Statistics","Global Health","Medicine / Health","STEM Project","Sustainability","Algebra I","Algebra II","Geometry","Calculus","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Chemistry","Biology","Physics"],"
