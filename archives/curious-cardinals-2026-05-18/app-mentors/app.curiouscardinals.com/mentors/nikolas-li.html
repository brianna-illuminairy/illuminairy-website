xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ca573bec-634a-41d9-aae7-3cd20f45437a\"}":{"__typename":"DeepDives","uuid":"ca573bec-634a-41d9-aae7-3cd20f45437a","content":"\u003cp\u003eIf I could go back and talk to my high school freshman year self, I'd tell him to play \"Here Comes the Sun\" by the Beatles every morning. Let me explain - it sounds ridiculous, but that one habit changed everything for me. I used to be the king of procrastination—last-minute cramming, endless distractions, putting things off until the stress became unbearable. I kept waiting for motivation to magically strike, but it never did. In the end, it wasn't some big change that worked, but a host of tiny habits - starting with \"Here Comes the Sun\". That song became my trigger. Once I had that, I added another small habit, then another. None of them felt significant on their own, but they compounded. I'd tell my younger self that discipline isn't something you're born with—it's something you build, one small habit at a time. And sometimes, it starts with something as simple as a three-minute song.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e6cf8600-d3f6-4577-8ee4-1e79a50975be\"}":{"__typename":"DeepDives","uuid":"e6cf8600-d3f6-4577-8ee4-1e79a50975be","content":"\u003cp\u003eMy interest in economics started before I even knew what the word meant. When I was a kid, my mom bought me a little picture book about economics—probably just to keep me entertained—but something about it stuck. As I got older, that curiosity only deepened. To me, economics isn't just mountains of data and financial charts; it's an amalgamation of history, politics, psychology, and so many other disciplines woven together. I'm fascinated by the relationship between economics and geopolitics—how the forces that shape nations also shape markets, and vice versa. One of my favorite projects was a paper I wrote on Singapore's economy, where I explored how an unassuming swamp transformed into a global economic powerhouse through a unique combination of geography, policy, and timing. I'm an avid reader, especially of history, and I make a point to stay current with global news because I believe you can't understand where we're going without understanding where we've been. Now, through my work as a Course Assistant in Cornell's Economics Department, I get to share that same curiosity with other students. I hope to do the same with my students here at Curious Cardinals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d7579ba0-bc9f-4ba3-bf16-cfe77ac5477e\"}":{"__typename":"DeepDives","uuid":"d7579ba0-bc9f-4ba3-bf16-cfe77ac5477e","content":"\u003cp\u003eI spend my spare time either at the gym or the library. I'm an avid reader—especially anything involving classical and medieval history or fantasy—and that love of history has spilled over into my own writing. My current passion project is a historical fiction novel about a corsair, set during the Golden Age of the Ottoman Empire. On the active side, I train Brazilian Jiu Jitsu and have been at it for about a year and a half now. I'm currently preparing to compete this summer, and I also try to go the gym regularly. If you're into history, reading, weightlifting, or martial arts, I would love to meet with you and have a chat!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"24008c53-6fe7-4b51-a60c-b1e6690dfe82\"}":{"__typename":"DeepDives","uuid":"24008c53-6fe7-4b51-a60c-b1e6690dfe82","content":"\u003cp\u003eMy heritage and background shape everything about how I teach. I grew up in Hong Kong, attended a local school, transitioned to an international high school, and then moved to America for college—three completely different education systems, each with its own expectations, pressures, and styles of learning. That experience gave me a firsthand understanding of what it's like to adapt, feel out of place, and eventually find your footing. I speak English, Cantonese, and Mandarin fluently, which allows me to communicate comfortably with students and families in whichever language feels most natural to them. Growing up with Asian parents, hard work and discipline were drilled into me from a young age, values I try to instill in all my students. But I also learned, especially in high school and college, the importance of exploring your creative and social side, not just grinding academically. I bring both of those perspectives to my tutoring: the discipline to push students toward their best work, and the understanding that education is about more than just grades. I understand that all my students are unique individuals, with their own strengths and struggles, and I strive to present each student with a personalized curriculum focused on addressing the distinctive needs of each student.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"ef9dab90-3cf0-40af-9b80-88046acf694f\"}":{"__typename":"School","uuid":"ef9dab90-3cf0-40af-9b80-88046acf694f","name":"Canadian International School of Hong Kong","city":"Hong Kong","type":"HIGH","state":"Hong Kong","country":"Hong Kong","zip":"000"},"Education:{\"uuid\":\"e5f390b0-3126-488e-99c5-41efecef41fd\"}":{"__typename":"Education","uuid":"e5f390b0-3126-488e-99c5-41efecef41fd","school":{"__ref":"School:{\"uuid\":\"ef9dab90-3cf0-40af-9b80-88046acf694f\"}"},"startYear":"2017","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"344b8fec-93c0-4b43-9d36-e70fab67f2d3\"}":{"__typename":"Education","uuid":"344b8fec-93c0-4b43-9d36-e70fab67f2d3","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"6829b225-bef4-4eef-a7f4-773ad330b503\"}":{"__typename":"MentorPublicProfile","uuid":"6829b225-bef4-4eef-a7f4-773ad330b503","displayName":"Nikolas L.","slug":"nikolas-li","biography":"\u003cp\u003eHi! I'm Nikolas, a sophomore at Cornell University double majoring in Economics and Mathematics. Originally from Hong Kong, I've had the opportunity to learn and work across different countries and cultures—experiences that have shaped how I connect with students from all kinds of backgrounds.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI specialize in tutoring \u003cstrong\u003eMath, Economics, and English\u003c/strong\u003e for middle school through high school students, including those preparing for the IB Diploma. Having gone through the IB program myself (and survived!), I understand the unique challenges it presents and know how to help students not just get through it, but actually thrive. Another one of my strong suits is the \u003cstrong\u003eSAT. \u003c/strong\u003eI know better than anyone else how daunting it can first seem - I took it 3 times, and performed terribly the first 2. Yet with perseverance and new studying techniques, I was able to get a 1560 on my third try - and I believe you can too.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat makes me qualified?\u003c/strong\u003e I've been tutoring since 2023 and have worked with over 60 students across a range of subjects and skill levels. One of the things I'm most proud of is helping 11 students go from failing grades to the B+ to A range—proof that with the right approach, any student can turn things around. I've also partnered with tutoring centers and college consultants to expand my reach, and I founded a free tutoring service to help students who might not otherwise have access to academic support.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt \u003cstrong\u003eCornell\u003c/strong\u003e, I currently serve as a \u003cstrong\u003eCourse Assistant\u003c/strong\u003e for the Economics Department, where I lead weekly discussion sections for over 100 undergraduates, grade assignments, and help develop instructional materials like problem sets and quizzes. This role has sharpened my ability to break down complex concepts and provide clear, actionable feedback—skills I bring directly into my tutoring sessions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I've interned at \u003cstrong\u003eTencent\u003c/strong\u003e and \u003cstrong\u003eEY\u003c/strong\u003e, where I worked on everything from ESG financial modeling to corporate restructuring and market entry strategies. These experiences taught me how classroom concepts apply in the real world, and I love sharing those connections with my students to make learning feel relevant and exciting.\u003c/p\u003e\u003cp\u003eA session with me is collaborative and tailored to how \u003cem\u003eyou\u003c/em\u003e learn best. I focus on building strong foundations, developing problem-solving intuition, and—just as importantly—helping students build confidence and solid study habits they can carry forward.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not tutoring or buried in coursework, you can find me training Brazilian Jiu Jitsu, boxing, playing water polo, or lifting at the gym. I'm also a big reader and am currently working on writing my own historical fiction novel. Oh, and I started a clothing brand once—so if you ever want to talk entrepreneurship, I'm your guy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI speak \u003cstrong\u003eEnglish, Cantonese, and Mandarin\u003c/strong\u003e, so I'm happy to work with students and families in any of those languages.\u003c/p\u003e\u003cp\u003eLooking forward to meeting you and helping you crush your goals!\u003c/p\u003e","teachingVideoPlaybackId":"yp02J02nop3x98wVJpkJuj11602AoEKs02Gnp356I3v5GLA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ca573bec-634a-41d9-aae7-3cd20f45437a\"}"},{"__ref":"DeepDives:{\"uuid\":\"e6cf8600-d3f6-4577-8ee4-1e79a50975be\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7579ba0-bc9f-4ba3-bf16-cfe77ac5477e\"}"},{"__ref":"DeepDives:{\"uuid\":\"24008c53-6fe7-4b51-a60c-b1e6690dfe82\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cd7d9dfb-1122-4152-9ead-21ad82cec2f0/-/preview/-/format/jpg/","https://ucarecdn.com/e38dd961-aa33-4e2b-b0ad-795d50c035b5/-/preview/-/format/jpg/","https://ucarecdn.com/92f8b497-f8e5-41d0-b4b9-837a7a9fba0b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"
