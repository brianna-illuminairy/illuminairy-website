xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"42df880c-1625-40c9-8eee-6a3f3c217ad4\"}":{"__typename":"Favorites","uuid":"42df880c-1625-40c9-8eee-6a3f3c217ad4","photoUrl":"https://ucarecdn.com/f015e7db-1d02-4469-9e72-177dc5b7cc6d/","title":"Rebecca by Daphne du Mau","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0c1948d4-0b73-4450-a0e0-e9b7fc0bf760\"}":{"__typename":"DeepDives","uuid":"0c1948d4-0b73-4450-a0e0-e9b7fc0bf760","content":"\u003cp\u003eMentorship matters to me because it has given me the confidence to pursue goals and the tools to overcome challenges. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0ef4f2b5-f18a-495b-8724-3c48d2fb950d\"}":{"__typename":"DeepDives","uuid":"0ef4f2b5-f18a-495b-8724-3c48d2fb950d","content":"\u003cp\u003eOne summer in high school, I worked at a coffee and gelato shop in DC! Another summer, I worked at a hotel in Italy and was able to pick up some Italian! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b8d75113-3544-4ba7-86c8-7ffc05424d05\"}":{"__typename":"DeepDives","uuid":"b8d75113-3544-4ba7-86c8-7ffc05424d05","content":"\u003cp\u003eI chose my major because it allows me to take classes in various subjects and challenges me to improve my skills in data analytics. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9b9cf199-c9d5-4761-b154-a070fc7d4879\"}":{"__typename":"DeepDives","uuid":"9b9cf199-c9d5-4761-b154-a070fc7d4879","content":"\u003cp\u003eIn my spare time, I love to hang out with friends, listen to music, and take my yellow lab for walks. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"7c88e7db-365b-40ce-8869-6b9f9b2396a4\"}":{"__typename":"School","uuid":"7c88e7db-365b-40ce-8869-6b9f9b2396a4","name":"The Potomac School","city":"McLean","type":"HIGH","state":"Virginia","country":"United States","zip":"22101"},"Education:{\"uuid\":\"e6f5b776-a44d-40a9-ad4d-ca3e6279897c\"}":{"__typename":"Education","uuid":"e6f5b776-a44d-40a9-ad4d-ca3e6279897c","school":{"__ref":"School:{\"uuid\":\"7c88e7db-365b-40ce-8869-6b9f9b2396a4\"}"},"startYear":"2019 ","endYear":"2023 ","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"f2fb502d-4f2e-453b-b12b-2525ad799a41\"}":{"__typename":"Education","uuid":"f2fb502d-4f2e-453b-b12b-2525ad799a41","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Industrial and Labor Relations ","degree":null},"MentorPublicProfile:{\"uuid\":\"47decafc-f688-4489-9a43-fb1ff3ebcb87\"}":{"__typename":"MentorPublicProfile","uuid":"47decafc-f688-4489-9a43-fb1ff3ebcb87","displayName":"Genevieve H.","slug":"genevieve-harris-1","biography":"\u003cp\u003eHello! My name is Genevieve, and I am a sophomore at Cornell University studying Industrial and Labor Relations with minors in Business and Spanish. I am super excited to join the Curious Cardinals mentoring team!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm originally from Washington, D.C., and had the privilege of attending a bilingual school where I developed a deep passion for languages and social justice. My bilingual education gave me a unique perspective on how language can be a bridge between different communities and experiences.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout my academic journey, I've become especially passionate about issues surrounding immigration. The intersection of law and language is something that fascinates me. After college, I plan on pursuing a career in immigration law where I hope to advocate for marginalized communities and support individuals navigating complex legal systems.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy passion for mentoring has always been a big part of my life. During my sophomore year of high school, during the covid-19 pandemic, I started an after-school enrichment mentoring program for 4th and 5th-grade students from my previous school. This program was designed to offer academic support, emotional encouragement, and mentoring to students who lacked connection in the new virtual learning environment. Through this experience, I gained a love for working with kids and learned the importance of creating a supportive and welcoming environment for these students.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout high school, I was a three-season runner and competed at the state and national level in the 1600 and 3200 events. Long-distance running is one of my favorite hobbies and something I do to clear my mind and be outside. Now that I live in Ithaca, I am always taking advantage of being outdoors and going for runs or walks on the beautiful trails.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve seen firsthand how mentorship can build confidence, inspire curiosity, and foster a love for learning. I’m excited to be a part of the Curious Cardinals Community and I look forward to collaborating with my students and being a part of their growth and learning journey.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"2W6sWMEHX2acZgVzcbAMLfA02LebzwGz5CrhWrS502AMg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"42df880c-1625-40c9-8eee-6a3f3c217ad4\"}"}],"causesSupported":[],"major":"Industrial and Labor Relations ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0c1948d4-0b73-4450-a0e0-e9b7fc0bf760\"}"},{"__ref":"DeepDives:{\"uuid\":\"0ef4f2b5-f18a-495b-8724-3c48d2fb950d\"}"},{"__ref":"DeepDives:{\"uuid\":\"b8d75113-3544-4ba7-86c8-7ffc05424d05\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b9cf199-c9d5-4761-b154-a070fc7d4879\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ec28a2af-a51f-4f18-83db-e3992e2b6045/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e6f5b776-a44d-40a9-ad4d-ca3e6279897c\"}"},{"__ref":"Education:{\"uuid\":\"f2fb502d-4f2e-453b-b12b-2525ad799a41\"}"}],"hiredAt":"2025-01-27T15:03:21.185Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Writing","Spanish","Col
