xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9f241976-e524-47ae-b2bb-2cacb75f498a\"}":{"__typename":"DeepDives","uuid":"9f241976-e524-47ae-b2bb-2cacb75f498a","content":"\u003cp\u003eI spent my summers in high school working at a reclaimed urban landfill called Freshkills Park. Freshkills Park used to be the world's largest landfill, and now it's full of native habitat and three times the size of Central Park! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a125cc6e-4441-4eed-8d88-af40008d58bf\"}":{"__typename":"DeepDives","uuid":"a125cc6e-4441-4eed-8d88-af40008d58bf","content":"\u003cp\u003eDon't be afraid to ask questions! When I was younger, I was too afraid of asking \"dumb\" questions and looking like I didn't know anything. Now I know that any question is a good question. Always better to ask and have your mistakes corrected early on than to go on assuming the wrong things!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"73ce2faf-d4ac-47b9-afa8-d3c6dc7ef358\"}":{"__typename":"DeepDives","uuid":"73ce2faf-d4ac-47b9-afa8-d3c6dc7ef358","content":"\u003cp\u003eIn my lifetime, I hope to be able to take a photo of each of Hawaii's endemic birds. I've never been to Hawaii before, but one day...  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5e37da5a-f46a-433e-8071-86d55e6e437f\"}":{"__typename":"DeepDives","uuid":"5e37da5a-f46a-433e-8071-86d55e6e437f","content":"\u003cp\u003eI love birding with my friends, reading books on rainy days, and making coffee/tea in the morning! My favorite author is Brandon Sanderson, but if you have some suggestions, please let me know! My preferred morning drink is a matcha latte without any sweetener, but I also love using my Aeropress for coffee!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f252a376-79ce-4aff-977a-e80f1a900b7e\"}":{"__typename":"School","uuid":"f252a376-79ce-4aff-977a-e80f1a900b7e","name":"Staten Island Technical High School","city":"Staten Island","type":"HIGH","state":"New York","country":"United States","zip":"10306"},"Education:{\"uuid\":\"43941700-02b0-4d8c-bf4d-4c2c4ffc940c\"}":{"__typename":"Education","uuid":"43941700-02b0-4d8c-bf4d-4c2c4ffc940c","school":{"__ref":"School:{\"uuid\":\"f252a376-79ce-4aff-977a-e80f1a900b7e\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"7a31a554-8ef9-4003-b642-0708288475ef\"}":{"__typename":"Education","uuid":"7a31a554-8ef9-4003-b642-0708288475ef","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Ecology \u0026 Evolutionary Biology | Earth \u0026 Planetary Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"84049ace-40b6-45c9-b4d4-2638039bcc09\"}":{"__typename":"MentorPublicProfile","uuid":"84049ace-40b6-45c9-b4d4-2638039bcc09","displayName":"Erica Y.","slug":"erica-yu","biography":"\u003cp\u003eHello everyone! My name's Erica and I'm majoring in Ecology and Earth Sciences. I love learning about the world around us and trying to understand all the living and non-living aspects of Earth. I’ve always been curious about the natural world—from why birds migrate to how scientists learn about climates from thousands of years ago—and I enjoy sharing that curiosity with others. In high school, I competed in science fairs across NYC and even competed in Regeneron ISEF. Continuing with my scientific passions, most of my academic time on campus is spent working hands-on with science. I have worked at the Yale Peabody Museum of Natural History, where I assist in preparing and cataloging real specimens. Additionally, I serve as a lab assistant at various labs on campus, ranging from those utilizing soil chemistry to understand climate change to those analyzing bones from 2.6 million years ago to understand ecological differences. Science isn’t just something you read about or watch videos on—it’s something to play with! Outside the lab, I’m deeply involved in science outreach and education. I serve on the board of Yale Undergraduate Science Olympiad, organize events with the Yale Ecology \u0026amp; Evolutionary Biology Undergraduate Group, lead bird walks with Yale Birding, and I help lead birding workshops through Yale’s Taking Flight Project. Whether I’m helping students identify birds, think through a tricky problem, or explore a new topic for the first time, my goal is always the same: to make learning feel exciting, supportive, and confidence-building. I want students to feel comfortable asking questions, making mistakes, and realizing that they are capable of understanding complex ideas. If I had to describe my teaching style, I’d say I’m patient, encouraging, and judgement-free. I enjoy breaking big ideas into manageable pieces and helping students see how concepts connect to the real world. My hope is that students walk away not only understanding the material better, but also feeling more confident in their abilities and more curious about the world around them. Learning isn't about being ahead of the curve, it's about the excitement of new knowledge! I’m excited to support students and families on their learning journeys—and to help make education something kids feel excited about, not stressed by.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"XcblCy1Wqt2I5X1cFMEDKVBI00U00Ha25xOOht3WCKcmg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ecology \u0026 Evolutionary Biology | Earth \u0026 Planetary Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9f241976-e524-47ae-b2bb-2cacb75f498a\"}"},{"__ref":"DeepDives:{\"uuid\":\"a125cc6e-4441-4eed-8d88-af40008d58bf\"}"},{"__ref":"DeepDives:{\"uuid\":\"73ce2faf-d4ac-47b9-afa8-d3c6dc7ef358\"}"},{"__ref":"DeepDives:{\"uuid\":\"5e37da5a-f46a-433e-8071-86d55e6e437f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cee43a0c-b09b-4ae2-ab38-500076faca91/-/preview/-/format/jpg/","https://ucarecdn.com/6e9bcb87-8523-4dc7-aa57-dabdf15f7550/-/preview/-/format/jpg/","https://ucarecdn.com/4ef46d07-f4bd-4667-9dcb-b0ace3dd5a75/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"43941700-02b0-4d8c-bf4d-4c2c4ffc940c\"}"},{"__ref":"Education:{\"uuid\":\"7a31a554-8ef9-4003-b642-07082
