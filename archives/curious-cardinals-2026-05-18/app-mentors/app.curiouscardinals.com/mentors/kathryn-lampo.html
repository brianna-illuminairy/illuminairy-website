xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"00bf993d-6b95-49cd-8473-b3196f057e54\"}":{"__typename":"Favorites","uuid":"00bf993d-6b95-49cd-8473-b3196f057e54","photoUrl":"https://ucarecdn.com/78736bf8-22d0-4179-ac94-01dd952bc80f/","title":"Project Hail Mary","type":"BOOK"},"Favorites:{\"uuid\":\"096ecf2b-87ac-4490-8861-fe9492bed81c\"}":{"__typename":"Favorites","uuid":"096ecf2b-87ac-4490-8861-fe9492bed81c","photoUrl":"https://ucarecdn.com/68719990-7571-4bc0-b01a-4ebeedf06afc/","title":"Caamp","type":"ARTIST"},"Favorites:{\"uuid\":\"727b1e72-f7b2-4fd1-8e61-9c26d9f9c9da\"}":{"__typename":"Favorites","uuid":"727b1e72-f7b2-4fd1-8e61-9c26d9f9c9da","photoUrl":"https://ucarecdn.com/841503d1-84b2-4560-a730-cbeeb28f5ece/","title":"Good Will Hunting","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d3b3134f-4b91-4689-9bbf-d40af6e689b6\"}":{"__typename":"DeepDives","uuid":"d3b3134f-4b91-4689-9bbf-d40af6e689b6","content":"\u003cp\u003eI love spending time outside and being active—I run, hike, lift, camp, and am hoping to take up rowing soon here at Oxford! I’m also a big fan of the New York Times games, and play the Mini Crossword, Wordle, and Connections religiously every morning as I drink my coffee. Recently, I’ve been trying to learn new recipes and improve my (woeful) cooking skills to moderate success.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think balance is incredibly important to both personal well-being and professional success, and it took me a long time to foster and value rest in my own life. As part of my mentorship, I’m happy to discuss strategies for creating balance, managing stress, and alleviating internal \u0026amp; external pressures to help every student reach their fullest potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"9a5baa97-83fb-48f1-a1c5-4ba5a037dcf8\"}":{"__typename":"DeepDives","uuid":"9a5baa97-83fb-48f1-a1c5-4ba5a037dcf8","content":"\u003cp\u003eWhen I graduated from Columbia this past year, I received two awards at graduation: the Campbell Award (for exceptional leadership and Columbia spirit) and the George Vincent Wendell Memorial Award (for character, scholarship and service). Both awards are given to one student in the Engineering School’s graduating class, and are decided by the Alumni Association and a faculty/student vote, respectively.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile I’m proud of a lot of my work at Columbia, I’m most proud of the community that I was a part of, and I was immensely humbled to be selected for both awards. As an engineer, I know the importance of fostering inclusion to build strong teams, and I will always value my impact on others over my technical achievements.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"15c1bdb9-296d-4bdb-a724-2d1cf4059779\"}":{"__typename":"DeepDives","uuid":"15c1bdb9-296d-4bdb-a724-2d1cf4059779","content":"\u003cp\u003eTo me, mentorship is all about inclusion and giving back. I firmly believe in the old adage of “it takes a village”—I know that I wouldn’t be where I am without the support of the numerous teachers, mentors, friends, and role models that I’ve been lucky enough to have throughout my life. Teaching, tutoring, and mentoring are the ways that I feel best equipped to give back, and I do it because I believe that every student should have the opportunity to pursue their ambitions to the fullest.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"ded772a5-6c80-4d2c-94c3-c624afac2f78\"}":{"__typename":"DeepDives","uuid":"ded772a5-6c80-4d2c-94c3-c624afac2f78","content":"\u003cp\u003eHonestly, stressed! I had lofty ambitions for college, but no idea how to target my energy or time. I loved school—and took plenty of AP courses—but was involved in way too many extracurriculars that my heart wasn’t completely in. While I was lucky enough to grow up in an incredibly supportive environment, I imposed a lot of pressure on myself internally, which bled into how I approached school and life. Looking back, I’d tell my high school self to focus her energy on the things she cared most deeply about, rather than worrying about securing every leadership position or joining every club.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"ee3b6770-1aa0-441d-96df-1d29bee1459e\"}":{"__typename":"School","uuid":"ee3b6770-1aa0-441d-96df-1d29bee1459e","name":"Legacy High School","city":"Broomfield","type":"HIGH","state":"Colorado","country":"United States","zip":"80023"},"Education:{\"uuid\":\"48899737-4173-4509-bdbf-1d36248298ab\"}":{"__typename":"Education","uuid":"48899737-4173-4509-bdbf-1d36248298ab","school":{"__ref":"School:{\"uuid\":\"ee3b6770-1aa0-441d-96df-1d29bee1459e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"b5843f6b-8991-4c75-a600-e9e1ca5acdb7\"}":{"__typename":"Education","uuid":"b5843f6b-8991-4c75-a600-e9e1ca5acdb7","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"960f0be7-ec2c-47ea-8023-894d15e3e7c8\"}":{"__typename":"MentorPublicProfile","uuid":"960f0be7-ec2c-47ea-8023-894d15e3e7c8","displayName":"Kathryn L.","slug":"kathryn-lampo","biography":"\u003cp\u003eHey everyone! My name is Kathryn (though you can call me Kate!) and I’m a master’s student in Engineering Science at the University of Oxford. I graduated from Columbia University earlier this year with a bachelor’s degree in Mechanical Engineering, and I’m passionate about all things robotics and aerospace—think rovers, probes, robot arms, and satellites!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was born and raised in Broomfield, Colorado, and attended a large public high school before heading to Columbia. During my undergrad, I worked across both industry and academia, interning at NASA Ames, Carnegie Mellon’s Robotics Institute, and Lockheed Martin Space. My work took me across the U.S., and I also spent a semester living and studying in Madrid—one of the highlights of my college experience! (Regrettably, my Spanish skills haven’t quite stood the test of time.)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Columbia, I was heavily involved with the Columbia Space Initiative (CSI), a 250+ member club dedicated to space science and engineering. I wore many hats there, working on lunar astronaut tools tested in NASA’s Neutral Buoyancy Laboratory, two satellites slated to launch in the next couple of years, and educational outreach for middle and high schools in New York. I also served for a year as Co-President of the club, during which I was fortunate enough to experience several pinch-me moments: facilitating a live call to the ISS, meeting nine(!) different astronauts from the U.S. and Canada, and hosting events with a former NASA Administrator and NASA Flight Director, to name a few.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond CSI, I conducted research and published papers on solar sails and robotic manipulation, including developing a robot hand for Astrobee, the free-flying robot on the ISS (check out my portfolio below for more on that!). I also spearheaded a new aerospace engineering program at Columbia, helping establish a new minor and begin development of a full major before I graduated. In addition, my commitment to teaching and outreach continued throughout that time: I worked as a physics and engineering Teaching Assistant, campus tour guide, volunteer tutor, and superuser in the Mechanical Engineering machine shop too.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my senior year, I was honored to receive both a Marshall Scholarship and an NSF Graduate Research Fellowship to further my studies, as well as to be recognized as an Aviation Week 20 Twenties Laureate—one of 20 students selected globally for their potential to transform aerospace throughout their careers. I've since taken up the Marshall at Oxford, where my research focuses on robotic planning for on-orbit assembly.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m thrilled to share my passions for engineering, robotics, and aerospace with the Curious Cardinals community, and I look forward to working with some of you very soon! 🤖🌟🛰️\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePortfolio: https://kathrynlampo.com/\u003c/p\u003e","teachingVideoPlaybackId":"nBofrTP13HsRBhXNk6S7puF8tXaAU8U2Srht8Esjo4U","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eTaking the leap to move from my home in suburban Colorado to New York City for college! It was a big change that took me far from my family, but it also opened the door for so much personal and professional growth. Looking back, I'm incredibly proud of myself for having the courage to dive in.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"00bf993d-6b95-49cd-8473-b3196f057e54\"}"},{"__ref":"Favorites:{\"uuid\":\"096ecf2b-87ac-4490-8861-fe9492bed81c\"}"},{"__ref":"Favorites:{\"uuid\":\"727b1e72-f7b2-4fd1-8e61-9c26d9f9c9da\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d3b3134f-4b91-4689-9bbf-d40af6e689b6\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a5baa97-83fb-48f1-a1c5-4ba5a037dcf8\"}"},{"__ref":"DeepDives:{\"uuid\":\"15c1bdb9-296d-4bdb-a724-2d1cf4059779\"}"},{"__ref":"DeepDives:{\"uuid\":\"ded772a5-6c80-4d2c-94c3-c624afac2f78\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/99643b74-e8b9-43bf-a4fc-608fc33e6ec0/-/preview/-/format/jpg/","https://ucarecdn.com/d14541cd-c12e-4b85-b9b8-dfb27f5b384a/-/preview/-/format/jpg/","https://ucarecdn.com/44254dd9-d13d-4190-9912-37cf52af193b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"48899737-4173-4509-bdbf-1d36248298ab\"}"},{"__ref":"Education:{\"uuid\":\"b5843f6b-8991-4c75-a600-e9e1ca5acdb7\"}"}],"hiredAt":"2025-09-25T16:22:41.592Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Physics","Chemistry","Writing","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Coding / Programming","Robotics / Electronics / CAD","Aviation / Aerospace","Public Speaking"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/"],"restrictedProfileVisibility":true,"disp
