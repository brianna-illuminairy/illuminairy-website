xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e5820c06-5fb1-4561-b826-874acfa5e3e8\"}":{"__typename":"DeepDives","uuid":"e5820c06-5fb1-4561-b826-874acfa5e3e8","content":"\u003cp\u003eI think I keenly felt the pressure—not only in middle and high school, but through college and beyond—to design my life in intricate detail. From a young age, I carried the weighty expectation of having an academic passion and an artistic vision, an athletic routine and a seemingly effortless side project, all while curating a polished personality and a perfect social media presence. Unsurprisingly, those pressures became so heavy they ended up bogging down  my academics, my creativity, my self.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf I could speak to my younger self, I’d tell her to live her life rather than try to design it. Not only is that a far more joyful way to spend your time, but it also turns out to be the most gratifying path in the long run. The personal anecdote I added to an academic essay, the screenplay I wrote based on lived experience, the club sport I picked up to fill an idle afternoon rather than pad a resume—those were the moments that ended up enriching all the areas I was so anxious about: my academics, my artistry, and my professional life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOf course, that’s easier said than done—especially when the pressure to fill every hour with a resume booster feels inescapable. So I’d remind my younger self to carve out a moment each day simply to be. To breathe. To sit alone with herself. Whether it was the 10 quiet minutes I had coming home from school years ago, or the 10 I have now after a long workday, I’ve learned to protect that time: to stretch, to twist, to breathe a little deeper, and to ground myself in the reality of my present day—my desires, my frustrations, my curiosities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLike building a muscle, this practice of presence has helped me live more fully in the now. And the more I do that, the more resilient I become against the pressure to become someone I don’t even want to be. The truth is, the life you live—when you're honest, curious, and awake to your present—is more than enough. It might even be exactly what you were reaching for all along.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"87ce6d3b-cf01-4bd0-a5ed-6dab44fa641a\"}":{"__typename":"DeepDives","uuid":"87ce6d3b-cf01-4bd0-a5ed-6dab44fa641a","content":"\u003cp\u003eThe makeshift movies and music videos I’d make on pre-TikTok apps… The endless make-believe games I’d play at sleepovers and with my sister… The books I’d write adapting my class’ required reading into personal narratives…. Dedicating my college degree to stories, how they’re made, why they matter, and how I can wield them felt as natural as taking a breath in.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e… However, no matter how natural the choice felt for me, it is not a natural or, to shift to a better word, \u003cem\u003ecommon\u003c/em\u003e choice for someone to make. Film \u0026amp; Media Studies is not a common major— it’s not even an option at some schools. Film \u0026amp; Media Studies isn’t the common guess that people make when they take a look at me, and it wasn’t the common major among my friends or among my peers in college. While at first, pursuing a relatively-rare area of study felt like wielding a superpower among mere humans, it then got a bit isolating. Other tracks had large lecture classes that everyone else got to bond over, and had more standardized job tracks that united my friends… meanwhile I was huddled over my laptop, laboring over my independent passion project.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut pursing Film \u0026amp; Media Studies isn’t just about wanting to make films (or critique films, teach films, etc). Choosing the major also means joining a relatively-small but mighty community of those who are similarly passionate about the artform. Put another way, I wanted to pursue film because I personally couldn’t imagine expressing myself and my stories in any other way, but I needed the major to teach me that film is not a solo act— it necessitates collaboration, community, even creative friction.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo major in film—rather than quietly write screenplays alone or post takes on Letterboxd—is to bring your passion into a shared arena: one filled with peers and professors, comps and critique. While you \u003cem\u003ecan\u003c/em\u003e make film alone, that version is more like a theatrical soliloquy—powerful, yes, but limited. I’ve always wanted to keep my film ideas close, to polish them in private until they were perfect (which, of course, means never sharing them at all). But the major pushed me to let go of perfection in favor of progress—to ask for help, for feedback, for collaboration. Film may be an \u003cem\u003euncommon\u003c/em\u003e path, but for those of us who choose it, the rewards are unparalleled.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"12c4820f-fbc1-4ea4-a9e6-7e1f89c0c1e2\"}":{"__typename":"Education","uuid":"12c4820f-fbc1-4ea4-a9e6-7e1f89c0c1e2","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Film \u0026 Media Studies","degree":null},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"efce40d4-b24c-4108-85df-9930d7200ad3\"}":{"__typename":"Education","uuid":"efce40d4-b24c-4108-85df-9930d7200ad3","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2006","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"8b8bb9f9-872f-483f-b9b1-ce9e4feb3bd0\"}":{"__typename":"MentorPublicProfile","uuid":"8b8bb9f9-872f-483f-b9b1-ce9e4feb3bd0","displayName":"Elsa C.","slug":"elsa-chung","biography":"\u003cp\u003eElsa is a New York City-based filmmaker and writer whose work explores identity and the ethics of representation across film and theater. Passionate about supporting emerging creatives, she is excited to mentor students as they bring their vision to life. Elsa has worked at production companies including Florentine Films, Nine Stories Productions, and Assemble Media. She collaborated with filmmakers Christie Herring and Professor Estelle Freedman on the documentary \u003cem\u003eSinging for Justice\u003c/em\u003e, orchestrating its successful Kickstarter campaign that surpassed its $30k goal by raising over $43k.\u003c/p\u003e\u003cp\u003eAn alumna of the Ghetto Film School, the British American Drama Academy, and the Stella Adler Conservatory, Elsa is committed to storytelling from multiple vantage points. She received a Columbia University Scholars Program grant to write her second feature-length screenplay and recently completed the Assistant Producer Apprenticeship with Digital Bodega in partnership with NBCUniversal's Creative Impact Lab.\u003c/p\u003e\u003cp\u003eElsa earned her degree in Film and Media Studies from Columbia University with Latin Honors and Phi Beta Kappa distinction. She currently works in international television sales and distribution at All3Media International.\u003c/p\u003e\u003cp\u003eElsa brings a collaborative, thoughtful approach to mentorship—eager to help students develop their creative voices while navigating both the craft and the industry.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Film \u0026 Media Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e5820c06-5fb1-4561-b826-874acfa5e3e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"87ce6d3b-cf01-4bd0-a5ed-6dab44fa641a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cffefcd5-f7fd-410d-95e8-e8ba9af98aa4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"12c4820f-fbc1-4ea4-a9e6-7e1f89c0c1e2\"}"},{"__ref":"Education:{\"uuid\":\"efce40d4-b24c-4108-85df-9930d7200ad3\"}"}],"hiredAt":"2021-08-05T01:01:48.000Z","topics":["Visual Arts / Graphic Design","Music","Creative Writing","Film / Theater","Spanish","Women \u0026 Gender Studies","Journalism","Race \u0026 Ethnicity","Fashion / Cosmetics","Cooking","Literature","Sports Journalism","Philosophy","Video / Photography"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elsa-chung\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8b8bb9f9-872f-483f-b9b1-ce9e4feb3bd0\"}"}}},"_sentryTraceData":"847b4b8511
