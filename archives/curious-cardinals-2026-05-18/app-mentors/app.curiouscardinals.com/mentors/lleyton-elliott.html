xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a41eee81-287e-441a-8389-1380a77cb5de\"}":{"__typename":"Favorites","uuid":"a41eee81-287e-441a-8389-1380a77cb5de","photoUrl":"https://ucarecdn.com/95c6c88a-17ef-4a77-bb4c-c05be6a0d475/","title":"The Count of Monte Cristo","type":"BOOK"},"Favorites:{\"uuid\":\"1261c48d-65da-4cbe-b651-0fe7ed9b4920\"}":{"__typename":"Favorites","uuid":"1261c48d-65da-4cbe-b651-0fe7ed9b4920","photoUrl":"https://ucarecdn.com/5599fc7e-7707-467b-be58-851c13d98c0d/","title":"Rocket Man by Elton John","type":"SONG"},"Favorites:{\"uuid\":\"e9ba07fd-0d89-4b64-b072-074fafe4b3e3\"}":{"__typename":"Favorites","uuid":"e9ba07fd-0d89-4b64-b072-074fafe4b3e3","photoUrl":"https://ucarecdn.com/191fee49-28c5-4b5f-892c-85b0e8e9640b/","title":"Carolina Panthers","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ed10d255-dc58-4da8-9616-f260e3100349\"}":{"__typename":"DeepDives","uuid":"ed10d255-dc58-4da8-9616-f260e3100349","content":"\u003cp\u003eI've known that I wanted to build/create things for as long as I can remember! My mom likes to tell a story about how I tried to take a vacuum cleaner apart when I was younger to figure out how it works. I think Robotics is the most exciting field in Mechanical Engineering, and I can't wait to see what comes of it (and be a part of it!) in the years to come.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"45b62f2c-7b9b-408d-89fc-28d2f50355bf\"}":{"__typename":"DeepDives","uuid":"45b62f2c-7b9b-408d-89fc-28d2f50355bf","content":"\u003cp\u003eI have been blessed to have many great role models throughout my life, but the greatest one is my grandfather. An engineer like me, he is a loving grandparent who has also always been firm and held me to high standards, and challenged me to think critically and be passionate. I grew up very close to my extended family, and I strive to be like my grandfather in many ways.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"7c05b975-cd39-41aa-9c91-071095cc9426\"}":{"__typename":"DeepDives","uuid":"7c05b975-cd39-41aa-9c91-071095cc9426","content":"\u003cp\u003eIt's a tie, so I'll cheat by giving both answers. First of all, I want to make an impact in a field I'm interested in; I know that what I love can be used to help people, and also medical robotics are as cool as they are useful. On a more personal level, though, having a little sister has always pushed me to be the best role model I can possibly be. She's extremely intelligent and talented, and has always looked up to me, so I want to make sure she has the right kind of motivation coming from her brother. She's also the reason I made the final decision to apply to Curious Cardinals in the first place!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2e23bcfb-c88b-43f8-beb9-30c09b960197\"}":{"__typename":"DeepDives","uuid":"2e23bcfb-c88b-43f8-beb9-30c09b960197","content":"\u003cp\u003eI spent my summers by the water; my grandparents live by the coast, and we visited them every year. Also, I live right by a big chain of lakes, on which I also rowed in high school. My friends and I would jump in the lake after practice or swim in a pool all the time in high school. When you live in the south, being in the water is a must for the summer!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"832578f5-0af1-4318-a1af-9bc43c2954ab\"}":{"__typename":"School","uuid":"832578f5-0af1-4318-a1af-9bc43c2954ab","name":"Olympia High School","city":"Orlando","type":"HIGH","state":"Florida","country":"United States","zip":"32835"},"Education:{\"uuid\":\"2bf8ef64-88a0-476d-b893-16dcf218624f\"}":{"__typename":"Education","uuid":"2bf8ef64-88a0-476d-b893-16dcf218624f","school":{"__ref":"School:{\"uuid\":\"832578f5-0af1-4318-a1af-9bc43c2954ab\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}":{"__typename":"School","uuid":"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a","name":"Massachusetts Institute of Technology","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02139"},"Education:{\"uuid\":\"2cfb5851-79f6-420c-85d3-64832219a651\"}":{"__typename":"Education","uuid":"2cfb5851-79f6-420c-85d3-64832219a651","school":{"__ref":"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering, Concentration in Robotics","degree":null},"MentorPublicProfile:{\"uuid\":\"54cf6da3-e4e8-491c-83f1-af81904e5d13\"}":{"__typename":"MentorPublicProfile","uuid":"54cf6da3-e4e8-491c-83f1-af81904e5d13","displayName":"Lleyton E.","slug":"lleyton-elliott","biography":"\u003cp\u003eHi! I'm Lleyton, a senior at MIT studying Mechanical Engineering with a concentration in Control, Instrumentation, and Robotics. I'm passionate about using my interests to help people - I hope to continue to a graduate program where I can research medical robotics - and I love being in a teacher/mentor role. In addition to my major, I have a humanities concentration in Music and have done research on autonomous materials discovery for solar cells. Outside of school, I love making music (I've been singing for 11 years and am in an a cappella group on campus), rowing/working out (I rowed in high school and used to be on MIT's team), watching old movies, reading classic novels, and working on random fun projects. I was born in Charlotte, NC, my family now lives in Orlando, FL, and I go to school in Cambridge, MA, so I've lived and explored up and down the east coast!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMany experiences throughout my life shape who I am. This past summer, I was a Vehicle Systems Engineering Intern for Toyota Racing Development right in my old hometown, where I found an appreciation for a fast-paced and professional technical environment. I've also recently been published as a co-author in a paper about my aforementioned research. Otherwise, I was a member of the NAfME All-National High School Choir, have traveled throughout college with friends and family, and have joined communities and found friends from myriad background who have changed my life and broadened my perspective. I say all this because so many things throughout my life have come to me because I was encouraged by a teacher, mentor, or role model of my own. These connections have been so important to me for as long as I can remember, which is part of the reason CC's mission matters to me.\u003cbr\u003e\u003cbr\u003eI've found a love for teaching and mentorship throughout my life. My engineering teacher in middle school came to me with an opportunity to help him pass engineering curriculum on to other teachers who were interested in bringing it to their schools. At MIT, I've been on the course staff for various design and robotics classes. Now, I'm a CC mentor who is excited not only to teach my students information, but to bring out their passion and help connect with what makes them tick. I know how many different ways people can learn, and love watching folks discover their love for learning in different ways. I'm extremely excited and thankful to be a mentor!\u003c/p\u003e","teachingVideoPlaybackId":"1BlcCvAtCSoCGl00tJ000201vOrlQVsE5IsRtS4eGdLgKUI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a41eee81-287e-441a-8389-1380a77cb5de\"}"},{"__ref":"Favorites:{\"uuid\":\"1261c48d-65da-4cbe-b651-0fe7ed9b4920\"}"},{"__ref":"Favorites:{\"uuid\":\"e9ba07fd-0d89-4b64-b072-074fafe4b3e3\"}"}],"causesSupported":[],"major":"Mechanical Engineering, Concentration in Robotics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ed10d255-dc58-4da8-9616-f260e3100349\"}"},{"__ref":"DeepDives:{\"uuid\":\"45b62f2c-7b9b-408d-89fc-28d2f50355bf\"}"},{"__ref":"DeepDives:{\"uuid\":\"7c05b975-cd39-41aa-9c91-071095cc9426\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e23bcfb-c88b-43f8-beb9-30c09b960197\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4583efa2-5dc6-4f36-8daf-78de4ee363d8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2bf8ef64-88a0-476d-b893-16dcf218624f\"}"},{"__ref":"Education:{\"uuid\":\"2cfb5851-79f6-420c-85d3-64832219a651\"}"}],"hiredAt":"2025-02-03T20:51:10.749Z","topics":["Algebra I","Algebra II","Geometry","Pre-Algebra","Precalculus / Trigonometry","Calculus","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Computer Science","Music","Sports Journalism","Robotics / Electronics / CAD","Sports Analytics","Coding / Programming","Medicine / Health"
