xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"cde07632-36a2-45b3-9c34-26c8d1d3a00e\"}":{"__typename":"DeepDives","uuid":"cde07632-36a2-45b3-9c34-26c8d1d3a00e","content":"\u003cp\u003eI would tell my middle or high school self that struggling doesn’t mean you’re failing—it usually means you’re learning something that actually matters. I spent a lot of time thinking that if things didn’t come easily, it meant I wasn’t “good” at them, when in reality those were the moments that helped me grow the most. I’d also remind myself that you don’t have to fit into one mold to be successful. Being curious, creative, and a little different isn’t a weakness—it’s often your biggest strength, even if it doesn’t feel that way at the time. Finally, I’d say this: ask questions, take risks, and don’t be afraid to need help. The sooner you learn that learning is a process, not a performance, the more confident and capable you’ll become.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"889f2393-4187-45c5-bf90-22b2ec361844\"}":{"__typename":"DeepDives","uuid":"889f2393-4187-45c5-bf90-22b2ec361844","content":"\u003cp\u003eMentorship matters to me because I know how powerful it is to have someone believe in you before you fully believe in yourself. Some of the most critical turning points in my life came from mentors—teachers, coaches, and older peers—who saw potential in me even when my path didn’t look traditional or linear. They helped me reframe struggle as growth and gave me the confidence to keep going when things felt uncertain.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI wasn’t a conventional student, and mentorship gave me both direction and reassurance. A good mentor doesn’t just give answers; they ask the right questions, hold you to high standards, and create a space where you can take risks, make mistakes, and learn from them. That balance of trust and challenge is what allows real growth to happen. Being that person for someone else—especially for students who feel underestimated or unsure of themselves—is incredibly meaningful to me, and it’s why mentorship plays such a central role in how I approach tutoring and teaching.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1387253b-2e65-4eb0-b023-b99621399b9f\"}":{"__typename":"DeepDives","uuid":"1387253b-2e65-4eb0-b023-b99621399b9f","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is helping build intelligent infrastructure for mental healthcare that makes support more continuous, thoughtful, and human. Through building my own startup, I’ve become deeply interested in how technology can help people reflect more intentionally, understand their patterns over time, and feel supported beyond isolated moments of care.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"18ac323c-1f3b-4b52-b55f-5931cc240077\"}":{"__typename":"DeepDives","uuid":"18ac323c-1f3b-4b52-b55f-5931cc240077","content":"\u003cp\u003eI chose my major because I genuinely love English and the way it trains you to think. I’ve always been drawn to reading, writing, and analyzing ideas, and studying English allowed me to lean into those strengths rather than work around them. It’s a field that values curiosity, creativity, and careful thinking—all things I enjoy and feel challenged by.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also believe the skills English builds are applicable almost anywhere. Learning how to read closely, write clearly, form strong arguments, and communicate complex ideas has shaped how I approach problems across disciplines and in professional settings. For me, choosing English wasn’t just about passion; it was about developing a set of skills that translate far beyond the classroom while playing to what I naturally do best.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}":{"__typename":"School","uuid":"70146acc-a4ce-459e-8969-b791ab43dfb2","name":"Menlo School","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"c11c2049-2aa2-4cd0-9f71-a85975ac9a88\"}":{"__typename":"Education","uuid":"c11c2049-2aa2-4cd0-9f71-a85975ac9a88","school":{"__ref":"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"34dc68a8-089a-4191-8f6f-b77417f2dfc5\"}":{"__typename":"Education","uuid":"34dc68a8-089a-4191-8f6f-b77417f2dfc5","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"bfce0469-3137-4e55-97b9-fa7419a45250\"}":{"__typename":"MentorPublicProfile","uuid":"bfce0469-3137-4e55-97b9-fa7419a45250","displayName":"Charlotte H.","slug":"charlotte-herrin","biography":"\u003cp\u003eHi! I’m Charlie Herrin, a Stanford University student studying English with an honors concentration, and I am so excited to help students grow into confident, capable learners. I care deeply about education—not just as a way to achieve strong academic outcomes, but as a process of exploration, challenge, and self-discovery. Some of the most meaningful learning happens when students are encouraged to take risks, make mistakes, and figure out how to move forward from them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, I spend much of my time reading closely, writing analytically and creatively, and working on demanding long-term projects, including my honors thesis. I also work as a peer tutor in Stanford’s writing center, where I support undergraduate and graduate students with brainstorming, structure, argument development, and revision. This experience has taught me how to help students strengthen their thinking while still feeling supported, understood, and motivated to improve.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI wasn’t a cookie-cutter student growing up, and I know that success doesn’t look the same for everyone. I often work best with students who think differently, feel underestimated, or need someone to believe in their ideas before they fully believe in themselves. I aim to create a learning environment where students feel safe enough to be challenged—because if you never fail, you’re probably not being pushed toward your highest potential. Growth requires trust, encouragement, and high expectations held with care.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m passionate about creative writing, entrepreneurship, and mental health advocacy. I also love backpacking and have completed extended wilderness expeditions, experiences that taught me resilience, independence, and how to stay focused when things feel uncomfortable or uncertain. On campus, I’ve held leadership and mentoring roles that emphasize responsibility, communication, and supporting others through periods of growth and transition.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, I combine structure with encouragement. I care about clear goals, strong fundamentals, and measurable progress, but I also believe students do their best work when they feel seen and supported. My goal is for students to leave sessions feeling challenged, confident, and better equipped to succeed both in and beyond the classroom.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re looking for a tutor who balances high standards with a supportive, growth-oriented environment, I’d love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"302005hfZ01yZyD2diFnqkx1JW4Rnq2GapN5HQeE501wArk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cde07632-36a2-45b3-9c34-26c8d1d3a00e\"}"},{"__ref":"DeepDives:{\"uuid\":\"889f2393-4187-45c5-bf90-22b2ec361844\"}"},{"__ref":"DeepDives:{\"uuid\":\"1387253b-2e65-4eb0-b023-b99621399b9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"18ac323c-1f3b-4b52-b55f-5931cc240077\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/500de37e-a54d-410a-9494-e831864acc7e/-/preview/-/format/jpg/","https://ucarecdn.com/95fa166c-6141-4633-89a0-ada6cd8ecb16/-/preview/-/format/jpg/","https://ucarecdn.com/ff88b331-dc86-4472-b575-4b906e138f66/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c11c2049-2aa2-4cd0-9f71-a85975ac9a88\"}"},{"__ref":"Education:{\"uuid\":\"34dc68a8-089a-4191-8f6f-b77417f2dfc5\"}"}],"hiredAt":"2026-01-01T02:17:10.525Z","topics":["Writing","Academic Coaching","College Essay Writing","Executive Function","History","Reading","Creative Writing","History Project","Business / Entrepreneurship","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"charlotte-herrin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bfce0469-3137-4e55-97b9-fa7419a45250\"}"}}},"_sentryTraceData":"158786ac9e38460f9a28d0940fe6fa6a-bc953adb7024e98a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=158786ac9e38460f9a28d0940fe6fa6a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"charlotte-herrin"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
