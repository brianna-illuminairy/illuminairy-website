xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"989a48ac-54e7-4017-a631-1c6326ebed7c\"}":{"__typename":"DeepDives","uuid":"989a48ac-54e7-4017-a631-1c6326ebed7c","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is building something—whether it’s a product, a company, or even a team—that has a real, positive impact on people’s lives. I want to create something meaningful that combines the skills I’ve developed in engineering with the values I care about, like community, growth, and connection. Whether it helps solve a problem, makes someone’s day easier, or brings people together, I want to look back and know I contributed something lasting that mattered to others—not just to myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"4aaf601c-ec8a-4942-a68c-78b394a56004\"}":{"__typename":"School","uuid":"4aaf601c-ec8a-4942-a68c-78b394a56004","name":"Briarcliff High School","city":"Briarcliff Manor","type":"HIGH","state":"New York","country":"United States","zip":"10510"},"Education:{\"uuid\":\"cc910970-0683-4b64-b3e9-4ef9c4cc5e67\"}":{"__typename":"Education","uuid":"cc910970-0683-4b64-b3e9-4ef9c4cc5e67","school":{"__ref":"School:{\"uuid\":\"4aaf601c-ec8a-4942-a68c-78b394a56004\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"a420ad78-703d-490c-8e25-94ca7c24422b\"}":{"__typename":"Education","uuid":"a420ad78-703d-490c-8e25-94ca7c24422b","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"8ca12640-82e0-44e9-b081-0cd91158a6c0\"}":{"__typename":"MentorPublicProfile","uuid":"8ca12640-82e0-44e9-b081-0cd91158a6c0","displayName":"Toby Y.","slug":"toby-young","biography":"\u003cp\u003eHi, I’m Toby! I’m currently studying engineering at Cornell University, driven by a long-standing passion for physics and math that first sparked in high school. I’ve always enjoyed breaking complex ideas down into simple, intuitive steps—whether I’m solving a tough mechanics problem or helping a friend understand a math concept for the first time.\u003c/p\u003e\u003cp\u003eOutside the classroom, soccer has been a huge part of my life. I played varsity soccer for four years in high school as a goalkeeper and now play for Cornell’s Mundial Club Soccer team. Being a goalie taught me how to stay calm under pressure, communicate clearly, and lead from the back—a mindset I bring into academics and beyond. I also spend a lot of time at the gym, not just to stay fit but because I love the discipline and routine it builds. It’s something I really value across all areas of life.\u003c/p\u003e\u003cp\u003eMy friends and family mean everything to me. I’m close with my siblings and parents, and I’m always up for helping out my teammates, whether that means tutoring, talking through a tough week, or just showing up when it matters. My girlfriend’s also a big part of my support system, and I try to be the same for her.\u003c/p\u003e\u003cp\u003eWhen I work with students, I aim to create a comfortable space where they feel heard, encouraged, and genuinely supported. I believe in being patient, relatable, and honest—especially when something’s not clicking right away. I’ve found that learning is less about how \"smart\" you are and more about how you approach the challenge, ask questions, and stick with it.\u003c/p\u003e\u003cp\u003eWhether we’re tackling physics equations, prepping for an exam, or just figuring out a study game plan, I’m here to help however I can. I know what it’s like to feel stuck or overwhelmed, and I also know how great it feels to finally understand something that once seemed impossible. That’s the moment I work toward with every student.\u003c/p\u003e","teachingVideoPlaybackId":"rtdW9huvac1iwdOFuHamlT4dGbGlU02jPTiuo3CpjCr00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"989a48ac-54e7-4017-a631-1c6326ebed7c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c18aa0cb-6abe-4909-9cef-12ac43cf066c/-/preview/-/format/jpg/","https://ucarecdn.com/41611623-75c2-4d2b-9b75-4288613dd04c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cc910970-0683-4b64-b3e9-4ef9c4cc5e67\"}"},{"__ref":"Education:{\"uuid\":\"a420ad78-703d-490c-8e25-94ca7c24422b\"}"}],"hiredAt":"2025-04-12T06:39:32.943Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Economics","Computer Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"toby-young\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8ca12640-82e0-44e9-b081-0cd91158a6c0\"}"}}},"_sentryTraceData":"3db7be1384ae4171994ecfc57544299b-a1b66eff41af9196-0",
