I think my friends would describe me as easygoing, energetic, and funny. I’m the youngest of three siblings, with two older brothers. While I joke that this makes me the favorite, I truly appreciate being the youngest. I've learned a lot from my brothers and consider them great mentors.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Duke, I gravitate towards numbers and have taken a range of Stats, Math, and Computer Science courses. This summer, I've been able to apply what I've learned by working with Machine Learning Models at the Duke University Brain Tool Laboratory.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love to exercise. I enjoy running, lifting weights, and playing sports. My newest hobby is golf. While I’m not very good, I find it both calming and fun. I also love to cook; with more free time in the summer, I make an effort to cook every meal for myself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbout six months ago, I found myself feeling bored and not making much progress toward any specific goal. Since I enjoyed running, I decided to run a marathon. The only marathon available was just two weeks away. To ensure I wouldn't back out, I paid the hefty entrance fee and trained intensively for those two weeks. I was thrilled to finish 10 minutes ahead of my goal time.\u003c/p\u003e","teachingVideoPlaybackId":"dgeyB02H3F32oofjhYyTsQFdTEr01Zkh4RZRqf1aDOJg4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"518acab5-b727-4a34-b45e-aa27368a55f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"7bcbfa18-4917-486a-ab1e-0ce56aaeca6b\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f669ab3-64d3-49f6-bea8-7b9ab4f47014\"}"},{"__ref":"DeepDives:{\"uuid\":\"75fbd68a-4052-4341-865d-e9cb5192ee89\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2db7f6bc-6157-4d12-b9ef-632585bdd174/-/preview/-/format/jpg/","https://ucarecdn.com/b5fde5ec-5af0-4c9d-9434-f88ef0405f57/-
