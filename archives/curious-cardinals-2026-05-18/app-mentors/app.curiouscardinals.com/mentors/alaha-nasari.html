xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5ea3fdb8-83fc-4965-991f-c50db24a4558\"}":{"__typename":"Favorites","uuid":"5ea3fdb8-83fc-4965-991f-c50db24a4558","photoUrl":"https://ucarecdn.com/36dabbd0-0483-4b50-8e82-717aedb21632/","title":"The Art of Loving","type":"ALBUM"},"Favorites:{\"uuid\":\"0d9d7c6e-7fb3-44f5-ab2a-d5ef751aac7c\"}":{"__typename":"Favorites","uuid":"0d9d7c6e-7fb3-44f5-ab2a-d5ef751aac7c","photoUrl":"https://ucarecdn.com/78715b76-d03b-4b2d-863f-cae09e93a8e6/","title":"The Hunger Games","type":"BOOK"},"Favorites:{\"uuid\":\"77c88f8a-1fdf-470a-9bda-786a39c79c18\"}":{"__typename":"Favorites","uuid":"77c88f8a-1fdf-470a-9bda-786a39c79c18","photoUrl":"https://ucarecdn.com/67cd19b6-926d-4e57-94a7-2938a69d222a/","title":"Boston","type":"CITY"},"CausesSupported:{\"uuid\":\"a69e06ae-c5df-42a2-83a4-814ed29a7d0f\"}":{"__typename":"CausesSupported","uuid":"a69e06ae-c5df-42a2-83a4-814ed29a7d0f","name":"Help Women and Girls in Afghanistan","description":"\u003cp\u003eAfghan women face severe limits. Supporting UN Women supports their rights.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/9b79509d-c3d8-496b-9559-3febe78ac365/"},"CausesSupported:{\"uuid\":\"2ff8d105-5f80-448b-ad7e-0aeb687199e1\"}":{"__typename":"CausesSupported","uuid":"2ff8d105-5f80-448b-ad7e-0aeb687199e1","name":"Maternal Health in Crisis Zones","description":"\u003cp\u003eWomen in low-resource settings face preventable risks in pregnancy and birth.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/88b1e3bf-a914-43a9-9aa9-76c60e550c64/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"aeab7d20-1432-4c51-8734-dcdca6b53aa1\"}":{"__typename":"DeepDives","uuid":"aeab7d20-1432-4c51-8734-dcdca6b53aa1","content":"\u003cp\u003eDo not wait to feel ready before starting something new. Clarity comes from doing, not from overthinking. Start small by writing the essay, sending the email, or designing the project even if it feels imperfect. You do not need one perfectly defined passion. Your interests in science, history, writing, and justice can grow together and strengthen one another. Trust that blending disciplines will become an advantage, not a weakness. Take your curiosity seriously, and follow the questions that feel too big.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"452306f4-2b9d-40d2-bbf7-afc928b1ad7e\"}":{"__typename":"DeepDives","uuid":"452306f4-2b9d-40d2-bbf7-afc928b1ad7e","content":"\u003cp\u003eI hope to help reshape how medicine understands responsibility to communities affected by conflict and displacement. I want to contribute work that ensures research, policy, and clinical care are informed by the lived realities of refugees and marginalized populations rather than abstract assumptions. Whether through scholarship, teaching, or patient care, my goal is to build bridges between evidence and empathy so that healthcare systems respond not only to disease, but to the social conditions that make healing possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"ff58fe42-fcfe-4aa4-9843-6bd5246bbc4d\"}":{"__typename":"DeepDives","uuid":"ff58fe42-fcfe-4aa4-9843-6bd5246bbc4d","content":"\u003cp\u003eGrowing up as the child of Afghan immigrants meant that I often translated school letters for my parents and navigated academic spaces without a clear roadmap. I learned how confusing unspoken expectations can be, especially when no one around you has walked the same path. In my teaching, I am intentional about naming processes that are usually left implicit. I break down assignments step by step, model how to ask questions, and normalize uncertainty as part of learning. I draw on my background when teaching history or public health by centering communities that are often missing from curricula, including refugees and displaced populations. My goal is to make classrooms and mentoring spaces where students never feel that confusion equals inadequacy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"313b7bea-fdf5-41a0-b71d-d32a7d78e2fe\"}":{"__typename":"DeepDives","uuid":"313b7bea-fdf5-41a0-b71d-d32a7d78e2fe","content":"\u003cp\u003eMy greatest role model has been Dr. Paul Farmer. Taking his course on global health at Harvard shaped how I think about medicine not only as a clinical field but as a moral practice grounded in solidarity and deep accountability to patients. What I most admired was how his work paired rigorous science with humility and long-term commitment to communities experiencing crisis. He showed me that scholarship and service do not have to exist separately, and that careful listening can be as powerful as technical expertise. His approach continues to guide how I teach, research, and mentor students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"7e1954af-107a-405a-a88f-2045830d675a\"}":{"__typename":"School","uuid":"7e1954af-107a-405a-a88f-2045830d675a","name":"Hicksville High School","city":"Hicksville","type":"HIGH","state":"New York","country":"United States","zip":"11801"},"Education:{\"uuid\":\"8998c618-6f32-4d9b-a001-65e158a6fa87\"}":{"__typename":"Education","uuid":"8998c618-6f32-4d9b-a001-65e158a6fa87","school":{"__ref":"School:{\"uuid\":\"7e1954af-107a-405a-a88f-2045830d675a\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"29984e2c-cdfc-4e1d-b6cb-d5ee4e6acd72\"}":{"__typename":"Education","uuid":"29984e2c-cdfc-4e1d-b6cb-d5ee4e6acd72","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"History of Science and Global Health \u0026 Health Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"0f46336b-1207-46ca-b263-a3e5863adb04\"}":{"__typename":"MentorPublicProfile","uuid":"0f46336b-1207-46ca-b263-a3e5863adb04","displayName":"Alaha N.","slug":"alaha-nasari","biography":"\u003cp\u003eHi! I’m Alaha—a Harvard graduate in the History of Science (Medicine \u0026amp; Society) with a secondary in Global Health \u0026amp; Health Policy—and I help students turn curiosity about medicine, science, and social impact into meaningful, real-world projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I was in high school, I loved science and writing, but I had no idea how to bridge those interests into something tangible. At Harvard, I learned that curiosity doesn’t have to live in one lane—it can become research, advocacy, storytelling, and community work all at once. Since then, I have:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDesigned and led original global-health research on healthcare collapse in Afghanistan, interviewing frontline clinicians to examine how sanctions and aid withdrawal disrupted patient care, and introducing “economic legitimacy” as a new social determinant of health — presented at national research conferences\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCo-authored peer-reviewed publications in \u003cem\u003eThe Lancet, BMJ, and Nature Medicine\u003c/em\u003e analyzing conflict-related health crises in Gaza, Lebanon, Syria, and Afghanistan\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked with Physicians for Human Rights mapping a nationwide network of asylum medical-evaluation clinics now used by legal teams and program staff\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConducted health fieldwork across refugee camps and cities in the West Bank, studying how military checkpoints and travel permit systems delay emergency and chronic care\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCompleted Farsi-language medical intake assessments at the International Rescue Committee, helping Afghan refugee families navigate U.S. healthcare systems and access specialized care\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTaught hands-on science with BioBus, leading microscope labs, anatomy demonstrations, and inquiry-based STEM lessons for middle-school classrooms\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI mentor students who want to explore:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMedicine \u0026amp; global-health passion projects\u003c/strong\u003e — designing community health studies, advocacy campaigns, or ethics-based investigations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePublic health research \u0026amp; education\u003c/strong\u003e — introducing students to epidemiology basics, health-access mapping, inequities analysis, and community health modeling\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHistory \u0026amp; social-studies inquiries\u003c/strong\u003e — developing original projects in the history of medicine, migration, war, human rights, ethics, and policy using archival research and oral histories\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch mentorship\u003c/strong\u003e — forming a research question, conducting interviews or literature reviews, analyzing data, and preparing abstracts, posters, or presentations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScience communication \u0026amp; writing\u003c/strong\u003e — op-eds, articles, blogs, or multimedia storytelling that translate complex science and policy into clear, compelling narratives\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege readiness \u0026amp; portfolio building\u003c/strong\u003e — essays, resumes, project showcases, and shaping a cohesive academic narrative\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI especially love working with students who have big questions and interdisciplinary interests—those who don’t quite fit into a single “box” and want to combine science with humanities, storytelling, ethics, or justice.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI have spent years mentoring and teaching students across grade levels—from running anatomy review sessions for Science Olympiad students to guiding high school delegates at Harvard Model Congress and leading interactive science notebooks with BioBus classrooms. I’ve also supported first-generation and low-income college students through Harvard’s pre-orientation mentoring programs, helping mentees build both academic confidence and self-advocacy skills.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcross all of this, I focus on one thing: helping students realize that their ideas matter and giving them the structure and confidence to build something real from them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eA typical session with me might involve\u003c/strong\u003e\u003c/h3\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurning a vague interest (“I like medicine”) into a specific, exciting project idea\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a step-by-step roadmap with weekly goals and check-ins\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing presentations or scholarship interviews\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEditing essays or project proposals for clarity, voice, and strength\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down complex concepts into clear, visual explanations\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eOutside of mentoring\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside of my work, I love photography, museum visits, and practicing Farsi calligraphy as a way to stay connected to my heritage. I’m usually rotating between research reading, writing projects, and hunting down the best iced matcha in NYC.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re curious, motivated, and ready to build something meaningful, I would love to help you bring your ideas to life.\u003c/p\u003e","teachingVideoPlaybackId":"6WxUq4DkhOQ3dSawD4SFpgchfSpStLTVBCxhBs7EriM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I’m most proud of is founding Alnisa’s Medical Alliance at Harvard, a student organization created to explore how faith, identity, and medicine intersect. What started as a small conversation turned into a monthly reflection series bringing together physicians, students, and community members to discuss ethical dilemmas, burnout, and spiritual care in clinical settings. Building this space meant coordinating speakers, designing programming, and creating an environment where students felt comfortable sharing perspectives that were often absent from medical dialogue. Seeing students find confidence in their voices and leave feeling more connected to their future in medicine reminded me how powerful intentional community-building can be.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5ea3fdb8-83fc-4965-991f-c50db24a4558\"}"},{"__ref":"Favorites:{\"uuid\":\"0d9d7c6e-7fb3-44f5-ab2a-d5ef751aac7c\"}"},{"__ref":"Favorites:{\"uuid\":\"77c88f8a-1fdf-470a-9bda-786a39c79c18\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"a69e06ae-c5df-42a2-83a4-814ed29a7d0f\"}"},{"__ref":"CausesSupported:{\"uuid\":\"2ff8d105-5f80-448b-ad7e-0aeb687199e1\"}"}],"major":"History of Science and Global Health \u0026 Health Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"aeab7d20-1432-4c51-8734-dcdca6b53aa1\"}"},{"__ref":"DeepDives:{\"uuid\":\"452306f4-2b9d-40d2-bbf7-afc928b1ad7e\"}"},{"__ref":"DeepDives:{\"uuid\":\"ff58fe42-fcfe-4aa4-9843-6bd5246bbc4d\"}"},{"__ref":"DeepDives:{\"uuid\":\"313b7bea-fdf5-41a0-b71d-d32a7d78e2fe\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/547d7f68-8a19-485c-865b-f44541fb9876/-/preview/-/format/jpg/","https://ucarecdn.com/bf313250-8363-4161-9a20-0b0e412b9a72/-/preview/-/format/jpg/","https://ucarecdn.com/88843d9a-9407-467a-afb1-1937a676450c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8998c618-6f32-4d9b-a001-65e158a6fa87\"}"},{"__ref":"Education:{\"uuid\":\"29984e2c-cdfc-4e1d-b6cb-d5ee4e6acd72\"}"}],"hiredAt":"2025-12-02T17:22:35.915Z","topics":["Algebra I","K-5 Grade Math","Pre-Algebra","Biology","Chemistry","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","History Project","Video / Photography","Medicine / Health","STEM Project","Law / Government / Policy","Public Speaking","Journalism","Debate"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alaha-nasari\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0f46336b-1207-46ca-b263-a3e5863adb04\"}"}}},"_sentryTraceData":"3050a8d5ca824a438a9ca5e8078d1c06-8a60925e333fad7e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3050a8d5ca824a438a9ca5e8078d1c06,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alaha-nasari"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createE
