5-87ae-230182159ebb\"}":{"__typename":"DeepDives","uuid":"9fc26803-ab20-4205-87ae-230182159ebb","content":null,"videoPlaybackId":"jL9SCfN6EotIxI01we8h3HWFWG1Lgb8XeA8AmH019ppYc","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"1769dcac-00f6-4f6e-aa89-b4bb41c7e9b9\"}":{"__typename":"Education","uuid":"1769dcac-00f6-4f6e-aa89-b4bb41c7e9b9","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Applied Mathematics Biology ","degree":"B.S."},"School:{\"uuid\":\"b2a1edfa-c011-4766-8b21-2432be98e999\"}":{"__typename":"School","uuid":"b2a1edfa-c011-4766-8b21-2432be98e999","name":"Brighton College","city":"Brighton","type":"HIGH","state":"England","country":"United Kingdom","zip":"BN2 0AL"},"Education:{\"uuid\":\"973a9d2f-a366-4f96-9332-ac993026bc78\"}":{"__typename":"Education","uuid":"973a9d2f-a366-4f96-9332-ac993026bc78","school":{"__ref":"School:{\"uuid\":\"b2a1edfa-c011-4766-8b21-2432be98e999\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"1c9f4b08-be5d-44f2-9fcf-92a6c91c0fa7\"}":{"__typename":"MentorPublicProfile","uuid":"1c9f4b08-be5d-44f2-9fcf-92a6c91c0fa7","displayName":"Nader M.","slug":"nader-maarouf-1","biography":"\u003cp\u003eI'm Nader Maarouf, a senior at Brown majoring in Applied Mathematics and Biology. My dream is to become a Physician-Scientist so I can not only provide care to patients and conduct impactful research but also advise students and give talks at universities around the world. I currently do cancer research at Rhode Island Hospital and will hopefully pursue this further at NYU's Medical School next year. I'm very grateful to have had the privilege of growing up in the cosmopolitan city of Dubai where I was exposed to people from a wide variety of different backgrounds. My childhood has made me particularly passionate about supporting vulnerable communities. Locally, I’ve volunteered with uninsured Latino immigrants at the Free Clinic and displaced youth from Afghanistan, Iraq, and West Africa at the Refugee Center. Globally, I’ve worked with humanitarian organizations operating in Syria and Israel. I speak Arabic and some French and am very passionate about Middle Eastern cultures, particularly the music and cooking traditional dishes. My favorite sports are strength training, long-distance running, and mixed martial arts but I also play team sports with friends for fun. As a quantitative major on the pre-med track whose electives are all in Psych/Sociology, History, and Literature, I am happy to provide academic mentoring in the physical and life sciences as well as the social sciences and humanities. As a career and academic advisor who loves reading, I also enjoy supporting students' journeys as they explore and learn about new topics. Having published scientific research, written articles analyzing foreign films, and started cultural clubs among other initiatives, I love helping students pursue projects related to their passions.\u003c/p\u003e","teachingVideoPlaybackId":"Mc2eWFcs2NJG02cjSOrOScoYQMRTdfPvKiaNWxt7hMvc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Mathematics Biology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ed25657f-e84c-43fa-874d-9d9aae39614f\"}"},{"__ref":"DeepDives:{\"uuid\":\"4aceba8a-3299-41d7-94f0-79a1b3d558f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"e30ba34f-26a3-4f07-94c6-49333365a882\"}"},{"__ref":"DeepDives:{\"uuid\":\"9fc26803-ab20-4205-87ae-230182159ebb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d889ac19-e23b-424d
