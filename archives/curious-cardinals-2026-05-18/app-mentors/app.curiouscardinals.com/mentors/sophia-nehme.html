xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"cad5ad54-7f6e-47aa-a9ac-3c52b376ff44\"}":{"__typename":"DeepDives","uuid":"cad5ad54-7f6e-47aa-a9ac-3c52b376ff44","content":"\u003cp\u003eIn high school, I used my summers as an opportunity to engage in long-term passion projects that I otherwise wouldn’t have had the chance to pursue. The summer after my freshman year, I worked on a documentary-style short film about the effects of gun violence on adolescents in the U.S., interviewing individuals who had lost loved ones in shootings. The summer after my sophomore year, I went on a service learning trip to Costa Rica, where I worked with young children on their English. Inspired by the effects of COVID-19, and the number of summer camp cancellations in my area, I founded and ran a socially distant neighborhood summer camp during my junior and senior summers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a0f82e25-7452-4a3b-b6dd-e2bfc6274f82\"}":{"__typename":"DeepDives","uuid":"a0f82e25-7452-4a3b-b6dd-e2bfc6274f82","content":"\u003cp\u003eMy greatest role model is my mom. She’s done it all—from attending law school, to working in fashion PR, to becoming an Italian professor, and now starting her own business in the art industry. She’s a true testament to the idea that there are no limits to what you can do with your career, and that it’s important to follow your heart and passions, rather than a specific, predetermined path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"66dc718f-75b7-47fd-af04-890220b67cb5\"}":{"__typename":"DeepDives","uuid":"66dc718f-75b7-47fd-af04-890220b67cb5","content":"\u003cp\u003eI recently did stand-up comedy for the first time! I've always loved SNL and other short-form comedic content, and pushed myself outside of my comfort zone to try it. It turned out to be WAY harder than it looks, but ultimately an unbelievably rewarding experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"81b0134b-6a54-4ad1-94c5-3b78bdacd359\"}":{"__typename":"DeepDives","uuid":"81b0134b-6a54-4ad1-94c5-3b78bdacd359","content":"\u003cp\u003eI'd love to see all seven continents!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"89f810b4-6976-441a-810d-5697873ac2b7\"}":{"__typename":"School","uuid":"89f810b4-6976-441a-810d-5697873ac2b7","name":"Washington International School, Tregaron Campus","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20008"},"Education:{\"uuid\":\"1ec689ac-250d-4c41-9a72-879ac72bfd5a\"}":{"__typename":"Education","uuid":"1ec689ac-250d-4c41-9a72-879ac72bfd5a","school":{"__ref":"School:{\"uuid\":\"89f810b4-6976-441a-810d-5697873ac2b7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"484f20f1-8653-435f-86d0-d0e7ca9f6f12\"}":{"__typename":"Education","uuid":"484f20f1-8653-435f-86d0-d0e7ca9f6f12","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology, Consumer Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"735ff2fc-555c-48c0-aa8a-9e4fec2a974f\"}":{"__typename":"MentorPublicProfile","uuid":"735ff2fc-555c-48c0-aa8a-9e4fec2a974f","displayName":"Sophia N.","slug":"sophia-nehme","biography":"\u003cp\u003eHi! I'm Sophia, a senior at the University of Pennsylvania majoring in Psychology with a minor in Consumer Psychology. I’m passionate about behavioral science, specifically how people make decisions, and how these insights can be used to inform communications. It's fascinating to me how even the smallest change in wording can make a message more persuasive and resonate more widely! I worked at L'Oréal this past summer and am thrilled to be returning to their marketing department after graduation to continue merging my interests in human insights and creative storytelling.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEffective communication is not only my favorite subject in school but also permeates other aspects of my life. At Penn, I tutor through the West Philadelphia Tutoring Project, give tours of the school through the Kite and Key Society, and contribute to a fashion publication called The Walk. Last year, I even tried communicating in a different language - taking on a marketing job in Barcelona while studying abroad, leveraging my trilingualism (English, Spanish, and Italian) in marketing efforts. In these settings, I’ve had the opportunity to try out different communication styles and approaches, as well as fine-tune my public speaking and writing for various contexts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeing a daughter of two immigrants, the college process was something I did largely on my own. Both of my parents didn’t attend undergrad in the US and were unfamiliar with the system. Mentorship became incredibly important to me throughout this journey, and I now feel passionate about offering that same support to others.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile I am more than equipped to help with anything, my strengths lie in public speaking, storytelling, and writing. I know how to fine-tune a narrative, and I am particularly suited to help in subjects like English, History, Psychology, Marketing, reading/writing standardized test prep, and college essay writing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, I spend my time running (currently training for a half marathon!), doing the NYT crossword, trying new foods, and shopping second-hand. Please feel free to reach out with any questions!\u003c/p\u003e","teachingVideoPlaybackId":"YdRFTY100mHnZk00oN9Zm1KL01f00UfMdQ6Ws4hogwB5Q02E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology, Consumer Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cad5ad54-7f6e-47aa-a9ac-3c52b376ff44\"}"},{"__ref":"DeepDives:{\"uuid\":\"a0f82e25-7452-4a3b-b6dd-e2bfc6274f82\"}"},{"__ref":"DeepDives:{\"uuid\":\"66dc718f-75b7-47fd-af04-890220b67cb5\"}"},{"__ref":"DeepDives:{\"uuid\":\"81b0134b-6a54-4ad1-94c5-3b78bdacd359\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/92734711-0463-48d0-95d9-21b464b8efa0/-/preview/-/form
