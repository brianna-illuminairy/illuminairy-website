xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fea06507-5b7a-44b8-9bbe-c43b6ffaef77\"}":{"__typename":"Favorites","uuid":"fea06507-5b7a-44b8-9bbe-c43b6ffaef77","photoUrl":"https://ucarecdn.com/ab9f6969-9032-4970-92ce-1a3a0e0ec4e4/","title":"Marvel Rivals","type":"GAME"},"Favorites:{\"uuid\":\"2b6b6ce2-65a9-4f64-84fb-a9eba18f045a\"}":{"__typename":"Favorites","uuid":"2b6b6ce2-65a9-4f64-84fb-a9eba18f045a","photoUrl":"https://ucarecdn.com/7f4d09c2-5374-4756-9985-65ffb9e0f828/","title":"Kevin Durant","type":"ATHLETE"},"Favorites:{\"uuid\":\"fbf3db16-6fac-4fe7-926d-92d80d02ed6c\"}":{"__typename":"Favorites","uuid":"fbf3db16-6fac-4fe7-926d-92d80d02ed6c","photoUrl":"https://ucarecdn.com/e1f8ea31-28ed-4ea5-95a4-e1dbb55f0a47/","title":"Lord of the rings","type":"MOVIE"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"feb4a7d4-f730-4a0e-beec-7e322601054e\"}":{"__typename":"DeepDives","uuid":"feb4a7d4-f730-4a0e-beec-7e322601054e","content":"\u003cp\u003eLiving with ADHD has shaped my teaching style to be highly empathetic, flexible, and focused on clarity. I know firsthand how challenging it can be to stay engaged or process information in traditional formats, so I’m intentional about breaking concepts down, using real-world analogies, and adapting to different learning speeds. I prioritize structure without rigidity, giving space for creativity and focus while still maintaining clear goals. My experience has taught me that everyone learns differently, and my goal is always to meet people where they are and make learning feel approachable rather than overwhelming.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"84c8b90f-f328-4ec1-b986-2d23af20c927\"}":{"__typename":"DeepDives","uuid":"84c8b90f-f328-4ec1-b986-2d23af20c927","content":"\u003cp\u003eBecause I know how much of a difference the right guidance can make. I’ve had moments where a single conversation with someone more experienced helped me see a path I hadn’t considered or gave me the confidence to take the next step. Mentorship is about more than giving advice. It’s about listening, understanding, and helping someone unlock their own potential. I want to be that kind of presence for someone else. Whether it's sharing what I’ve learned or just being a consistent support, I see mentorship as a chance to give back in a meaningful and lasting way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a3c7d0cf-798a-48e3-8c00-20e4d3fb1494\"}":{"__typename":"DeepDives","uuid":"a3c7d0cf-798a-48e3-8c00-20e4d3fb1494","content":"\u003cp\u003eIn my spare time, I like to stay active and keep learning. I’ve been getting into chess and teaching myself guitar, which both challenge me in different ways. I also make time for the gym regularly, both for physical and mental balance. When I’m unwinding, I enjoy watching sports and anime. They’re a great mix of competition, storytelling, and creativity, which I really connect with.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5ec3ddb9-1344-4a17-8ef2-9535448e5007\"}":{"__typename":"DeepDives","uuid":"5ec3ddb9-1344-4a17-8ef2-9535448e5007","content":"\u003cp\u003eMy greatest role model is my mom. Growing up, I watched her balance multiple responsibilities, from working long hours to supporting me in school and sports, all while leading with patience, discipline, and strength. She set the standard for what it means to show up every day and give your best, even when it’s hard. Her work ethic and values continue to shape how I approach challenges and support others. She’s the reason I hold myself to a high standard and stay focused on my goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"cd5e50c6-2112-44e8-a3db-7646f4a28b3c\"}":{"__typename":"School","uuid":"cd5e50c6-2112-44e8-a3db-7646f4a28b3c","name":"Cypress Ridge High School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77041"},"Education:{\"uuid\":\"dad6a8c8-c26b-44d4-b51c-b8302891dd99\"}":{"__typename":"Education","uuid":"dad6a8c8-c26b-44d4-b51c-b8302891dd99","school":{"__ref":"School:{\"uuid\":\"cd5e50c6-2112-44e8-a3db-7646f4a28b3c\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"e44beb34-d279-4fbf-af0f-b8d534ace16e\"}":{"__typename":"Education","uuid":"e44beb34-d279-4fbf-af0f-b8d534ace16e","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"cd084507-3a25-4cf5-b018-ed5aaff89d80\"}":{"__typename":"MentorPublicProfile","uuid":"cd084507-3a25-4cf5-b018-ed5aaff89d80","displayName":"Kade B.","slug":"kade-barnes","biography":"\u003cp\u003eMy name is Kade Barnes, and I’m a recent graduate of Yale University where I majored in political science and played cornerback on the varsity football team. I currently live in Brooklyn, New York, and work as a financial representative. I am preparing to apply to law school with a strong interest in public interest and sports law. I have always been drawn to challenging, structured thinking, and the legal field gives me a way to think critically, advocate for others, and solve real-world problems. Whether in the classroom, on the field, or through my work, I have consistently sought out environments where I can learn deeply and contribute meaningfully.\u003c/p\u003e\u003cp\u003eSports have played a huge role in shaping who I am. I started playing soccer at age four and began football at six. That early exposure to teamwork and competition instilled in me a deep sense of discipline and taught me how to lead and support others through high-pressure situations. At Yale, I was fortunate enough to win two Ivy League championships, experiences that taught me about resilience, sacrifice, and the importance of trusting the people around you. The relationships I built with my teammates are some of the most meaningful in my life.\u003c/p\u003e\u003cp\u003eAnother key part of my identity is how I have learned to work with my ADHD. I was diagnosed in sixth grade, and over the years, I developed systems to stay organized, productive, and focused. Instead of seeing ADHD as a limitation, I have come to recognize it as part of how I operate. It is a challenge that has made me more creative, empathetic, and flexible. It also fuels my curiosity and helps me see connections between ideas that others might miss.\u003c/p\u003e\u003cp\u003eOutside of work and academics, I like to stay sharp and engaged. I am learning to play guitar, enjoy chess, and follow anime and sports closely. I also like to play video games as a way to relax and connect with friends. I lift weights regularly and value both mental and physical discipline. I am a fan of all Houston sports teams except the Texans, because I have always rooted for the 49ers.\u003c/p\u003e\u003cp\u003eI am also an only child, and that has made my relationships with my parents especially meaningful. They have been my biggest supporters and closest confidants throughout my life. Through my professional work mentoring high school students, I have learned how much I enjoy being a resource to others. I believe the relationships you build are what truly define who you are.\u003c/p\u003e","teachingVideoPlaybackId":"DO5NylF00b1tQTXixLOxbnpCpg9yu55qmCdN008Qh025uw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m especially proud of graduating summa cum laude from Yale while also winning two Ivy League championships as a member of the football team. Balancing the academic rigor of Yale with the demands of being a Division I athlete pushed me in every way. It challenged me mentally, physically, and emotionally. I had to develop strong time management, stay disciplined, and learn how to perform under pressure. There were moments when the workload felt overwhelming or when setbacks on the field tested my confidence, but staying committed to both goals taught me how to stay focused and resilient. These two achievements represent not just what I accomplished, but how I grew and the values I now carry with me.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"fea06507-5b7a-44b8-9bbe-c43b6ffaef77\"}"},{"__ref":"Favorites:{\"uuid\":\"2b6b6ce2-65a9-4f64-84fb-a9eba18f045a\"}"},{"__ref":"Favorites:{\"uuid\":\"fbf3db16-6fac-4fe7-926d-92d80d02ed6c\"}"}],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"feb4a7d4-f730-4a0e-beec-7e322601054e\"}"},{"__ref":"DeepDives:{\"uuid\":\"84c8b90f-f328-4ec1-b986-2d23af20c927\"}"},{"__ref":"DeepDives:{\"uuid\":\"a3c7d0cf-798a-48e3-8c00-20e4d3fb1494\"}"},{"__ref":"DeepDives:{\"uuid\":\"5ec3ddb9-1344-4a17-8ef2-9535448e5007\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/63a6d420-b56c-4c34-a930-52ba7a0ad3a4/-/preview/-/format/jpg/","https://ucarecdn.com/8a4c9f4e-c4f0-4e8a-8202-3aa3d31b497b/-/preview/-/format/jpg/","https://ucarecdn.com/cd533b00-3269-4b75-94e2-7cd3c3fc9f30/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"dad6a8c8-c26b-44d4-b51c-b8302891dd99\"}"},{"__ref":"Education:{\"uuid\":\"e44beb34-d279-4fbf-af0f-b8d534ace16e\"}"}],"hiredAt":"2025-07-31T16:35:01.256Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Statistics","6-8 Grade Science","Chemistry","Biology","Writing","American Sign Language","Academic Coaching","College Essay Writing","Reading","History","Economics","Sports Journalism","Finance / Investing","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kade-barnes\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"cd084507-3a25-4cf5-b018-ed5aaff89d80\"}"}}},"_sentryTraceData":"a747758cbbf84d9c87fdfbf320909a10-a0a18060793e5b03-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a7
