xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9e148c75-312f-4878-bf46-edcaea5fada8\"}":{"__typename":"Favorites","uuid":"9e148c75-312f-4878-bf46-edcaea5fada8","photoUrl":"https://ucarecdn.com/84ea79f9-064f-41ac-a410-1dab36bedf3f/","title":"Chris Evans","type":"ACTOR"},"Favorites:{\"uuid\":\"da7c2693-1d30-4e99-af77-8152e30da241\"}":{"__typename":"Favorites","uuid":"da7c2693-1d30-4e99-af77-8152e30da241","photoUrl":"https://ucarecdn.com/e19f3cb8-86da-48c6-bc7b-d53f12f52837/","title":"FOUR by One Direction","type":"ALBUM"},"Favorites:{\"uuid\":\"0b5099f1-4aa6-425b-9e8a-1597edd938e0\"}":{"__typename":"Favorites","uuid":"0b5099f1-4aa6-425b-9e8a-1597edd938e0","photoUrl":"https://ucarecdn.com/3ab366b2-db76-4e9e-b9a0-f75e519e9d9e/","title":"BlackPink","type":"ARTIST"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"9e64388f-a720-476b-9a01-4b8edd1e0c4e\"}":{"__typename":"DeepDives","uuid":"9e64388f-a720-476b-9a01-4b8edd1e0c4e","content":"\u003cp\u003eMy greatest source of motivation is my dad. Watching his dedication, resilience, and kindness inspires me every day to work hard and stay grounded, no matter the challenges I face. His unwavering support and the lessons he’s taught me about perseverance and integrity drive me to keep pushing forward in both my academic and creative pursuits.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c32cdd0b-413b-4928-854e-0656a58e5892\"}":{"__typename":"DeepDives","uuid":"c32cdd0b-413b-4928-854e-0656a58e5892","content":"\u003cp\u003eIn my spare time, I love sketching, drawing, and creating detailed art illustrations. I’ve been passionate about fashion illustration for over seven years and enjoy exploring different styles and techniques. I also like making vision boards to plan and inspire my art pieces, which helps me bring my creative ideas to life. Art is my way of relaxing and expressing myself, and I’m always excited to try new concepts and push my creative boundaries.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"5fe30556-da21-4046-bc63-632ee86fe77f\"}":{"__typename":"DeepDives","uuid":"5fe30556-da21-4046-bc63-632ee86fe77f","content":"\u003cp\u003eOut of all the things I could be doing, I choose mentorship because I’ve been fortunate to have amazing mentors throughout my life who shaped who I am today. Their guidance and support, whether in art, research projects, or academics, made a huge difference in my growth and confidence. I want to give back to the community that built me by helping others in the same way, supporting students as they navigate their own journeys and unlock their potential. Mentorship is my way of paying it forward and making a positive impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ee0cf2f1-6051-4e91-a623-705c7043f89a\"}":{"__typename":"DeepDives","uuid":"ee0cf2f1-6051-4e91-a623-705c7043f89a","content":"\u003cp\u003eOne of my recent passion projects is a fashion illustration portfolio inspired by my love for the ocean. This collection includes around five to six detailed illustrations that explore sea-themed designs, blending elements of marine life and fashion. The beauty and mystery of the ocean have deeply motivated me to create these pieces, allowing me to express both my artistic vision and my fascination with the natural world. This project combines my interests in art, fashion, and environmental inspiration, and it continues to be a rewarding creative journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"741a9cd3-cfb5-44d0-99fc-77cbdf2dc033\"}":{"__typename":"School","uuid":"741a9cd3-cfb5-44d0-99fc-77cbdf2dc033","name":"Velammal Vidyalaya Ayanambakkam","city":"Chennai","type":"HIGH","state":"Tamil Nadu","country":"India","zip":"600095"},"Education:{\"uuid\":\"fb7709ad-47d7-4e57-a975-fb6c4a6f260d\"}":{"__typename":"Education","uuid":"fb7709ad-47d7-4e57-a975-fb6c4a6f260d","school":{"__ref":"School:{\"uuid\":\"741a9cd3-cfb5-44d0-99fc-77cbdf2dc033\"}"},"startYear":"2018","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"d51f96b5-2c40-414b-a7a3-a552f1915d9a\"}":{"__typename":"Education","uuid":"d51f96b5-2c40-414b-a7a3-a552f1915d9a","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2026","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"f56332c8-9eb4-4ba2-a149-73aacddbe9c3\"}":{"__typename":"MentorPublicProfile","uuid":"f56332c8-9eb4-4ba2-a149-73aacddbe9c3","displayName":"Shruthi A.","slug":"shruthi-arunkumar","biography":"\u003cp\u003eHi! I’m currently pursuing a Master’s in Data Science at the University of Pennsylvania, where I focus on areas like big data, machine learning, and AI. I have a strong background in teaching and applied data work, and I love helping students break down complex technical topics into something approachable and engaging.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Penn, I mentor first-year students in the MSE Data Science program and previously served as a Graduate Teaching Assistant at Wharton for a course on blockchain and cryptocurrencies. I also led a blockchain bootcamp for high school students through My Ivy Global Academy, where I created beginner-friendly lesson plans and hosted live coding sessions to help students explore emerging tech in a hands-on, accessible way.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore grad school, I completed my undergraduate degree in Information Technology in India, where I worked as a Research Assistant and Teaching Assistant for courses like DBMS and Data Structures. I also interned as a Data Analyst, where I gained hands-on experience in data collection, cleaning, analysis, and visualization using tools like Python, Power BI, and Excel.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Student Ambassador for the Hyperledger India Chapter, I helped grow the blockchain community on campus by organizing workshops and mentoring students on blockchain development projects. These roles have allowed me to combine my interests in teaching, community-building, and tech.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m a passionate visual artist. I’ve been drawing professionally for over 12 years and have been doing fashion illustration for more than seven. My work blends traditional drawing with digital techniques, often inspired by haute couture, technology, and futuristic aesthetics. I’m especially interested in the intersection of data and design. I love experimenting with how information can be represented artistically through visual storytelling. My favorite designer is\u0026nbsp; Iris van Herpen, whose ability to merge fashion and technology deeply inspires my creative work.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also enjoy working on self-driven art and fashion projects, collaborating with peers, and sharing my process online. Whether it’s sketching detailed garments, designing digital concepts, or exploring themes of identity and innovation through visual media, creativity is a constant part of my life.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA fun fact about me: I’m fascinated by orcas — they're incredibly intelligent, powerful creatures, and I’ve been obsessed with them since I was a kid.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether it's mentoring students in data science or guiding them through creative passion projects, I'm excited to support curious and imaginative learners on their journey. I'm especially passionate about mentoring students in the areas of fashion and cosmetics, visual arts and graphic design, video and photography, creative writing, coding and programming, and web design.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"1m8wBNby7xzO02ngu63my002TTbe355wWg100UddGYLQDU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9e148c75-312f-4878-bf46-edcaea5fada8\"}"},{"__ref":"Favorites:{\"uuid\":\"da7c2693-1d30-4e99-af77-8152e30da241\"}"},{"__ref":"Favorites:{\"uuid\":\"0b5099f1-4aa6-425b-9e8a-1597edd938e0\"}"}],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9e64388f-a720-476b-9a01-4b8edd1e0c4e\"}"},{"__ref":"DeepDives:
