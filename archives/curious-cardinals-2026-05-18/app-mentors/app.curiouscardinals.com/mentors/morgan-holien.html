xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9b921c53-9e59-421a-9c96-b1357250e9ea\"}":{"__typename":"Favorites","uuid":"9b921c53-9e59-421a-9c96-b1357250e9ea","photoUrl":"https://ucarecdn.com/a557a091-14a5-443d-aaad-b667491ebc59/","title":"LINKIN PARK","type":"ARTIST"},"Favorites:{\"uuid\":\"0365ff06-03c0-4488-82d4-0e61d4f790ed\"}":{"__typename":"Favorites","uuid":"0365ff06-03c0-4488-82d4-0e61d4f790ed","photoUrl":"https://ucarecdn.com/bbde8078-83d9-49fd-90db-bcf5c700e07e/","title":"Ready Player One by Ernest Cline","type":"BOOK"},"Favorites:{\"uuid\":\"6dd3d92c-0f30-4cc2-b93a-08044c66f1df\"}":{"__typename":"Favorites","uuid":"6dd3d92c-0f30-4cc2-b93a-08044c66f1df","photoUrl":"https://ucarecdn.com/48dbe828-0e52-4522-8032-3492646e5979/","title":"Rocket League","type":"GAME"},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"d98c45ec-1f40-44bc-bb88-26f667dafe56\"}":{"__typename":"DeepDives","uuid":"d98c45ec-1f40-44bc-bb88-26f667dafe56","content":"\u003cp\u003eIn middle school, I was honestly kind of a brat.\u0026nbsp; Not on purpose, and not to my friends or other students, of course.\u0026nbsp; But I did not have the best relationship with many of my teachers and the school administration as a whole.\u0026nbsp; Why?\u0026nbsp; Because middle school (particularly my middle school) is not typically a place that that celebrates challenging thinking or individuality.\u0026nbsp; Being a curious student, I always wanted to know why things were run the way they were, why certain rules were in place, or why we had to do certain activities.\u0026nbsp; It never came from a place of hostility, I was just genuinely curious and wanted to challenge my teachers about their ideas the way they’d challenged me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt that age, however, asking questions gets perceived as back-talk.\u0026nbsp; And when teachers don’t have a good answer (and they know it), they often resort to the tired response “because I said so.”\u0026nbsp; Which, of course, only made me push harder, because that’s a stupid and unsatisfying response.\u0026nbsp; I got in a lot of trouble, and many teachers didn’t like me because of this.\u0026nbsp; Especially when I would correct them in their own lessons.\u0026nbsp; Because I full believed, and I still believe, that teachers should listen to their students and be able ot admit when they make mistakes.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I had much better relationships with my teachers.\u0026nbsp; Not all of them, but I found that many more were willing to listen to what I had to say and would engage in real discussion with me.\u0026nbsp; It wasn’t until I had mentors that believed in me, that listened to me and allowed me to challenge them the way they challenged me, that I discovered my passion and love for learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"30505572-9be8-4901-9b4b-c92afb8fe3d3\"}":{"__typename":"DeepDives","uuid":"30505572-9be8-4901-9b4b-c92afb8fe3d3","content":"\u003cp\u003eAt 10 years old, I picked up a Rubik’s Cube and resolved to solve it on my own.\u0026nbsp; No guides, no internet, no help.\u0026nbsp; Just me and the puzzle.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSolving a cube by scratch doesn’t require the sort of special genius one might think it does.\u0026nbsp; It’s really just a matter of failing and learning.\u0026nbsp; Perform some sequence of moves, then observe how it affects the relevant pieces.\u0026nbsp; Use that knowledge wisely, and the puzzle becomes nothing more than ordered chaos.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy first solve took three days.\u0026nbsp; I remember waking up my entire family in the middle of the night out of pure excitement.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePicking up a new cube and figuring out how to solve it is now one of my favorite pastimes.\u0026nbsp; The intellectual challenge of confronting a new, difficult problem is utterly thrilling.\u0026nbsp; The harder the puzzle, the more fun it is to solve.\u0026nbsp; I remember taking three months to solve a Ghost Cube, which is best described as an asymmetric shape-shifting nightmare.\u0026nbsp; It was the most satisfying puzzle I’d ever encountered.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCubing, as it’s called, has also taught me how to approach new obstacles.\u0026nbsp; Life isn’t about immediately seeing the solution, it’s about failing, learning, and applying.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"67659b47-bdde-43df-abca-34390a0398e3\"}":{"__typename":"DeepDives","uuid":"67659b47-bdde-43df-abca-34390a0398e3","content":"\u003cp\u003eI’m extremely proud of my independent mathematics research, which won several awards at the International Science and Engineering Fair (ISEF).\u0026nbsp; My goal was to derive an explicit non-integer formula for an operation called tetration, which may be thought of as iterated exponentiation.\u0026nbsp; There is no universally accepted definition of non-integer tetration, since different presumptions about the operation’s behavior yield incompatible results.\u0026nbsp; As such, my aim was to develop an interpolation without relying on conventional assumptions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWithout realizing it, I thrust myself deep into an extremely complex and difficult topic.\u0026nbsp; I couldn’t even read the attempts by other mathematicians.\u0026nbsp; After many months of false starts and dead ends, my trashcan overflowed with crumpled-up notes, an infinite series of defeat.\u0026nbsp; It was maddening.\u0026nbsp; But, as I was recovering old notes in a lame attempt to submit something before the deadline, I revisited a series of formulas long since crossed-out and discarded as useless.\u0026nbsp; Standing there, staring at my failure, inspiration struck suddenly and forcefully.\u0026nbsp; I realized the problem could be solved if it was phrased in terms of iterated logarithms, a closely related operation.\u0026nbsp; After an ingenious substitution, the proceeding derivation required an infinite series of nested polynomials, for which I was forced to invent my own notation.\u0026nbsp; Every step of the process involved exceptional creativity, persistence, and mathematical intuition.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe final formula, albeit rather unwieldy, was a success.\u0026nbsp; It was an explicit solution for non-integer tetration that agreed with known values, derived on the basis of functional power identities instead of conventional assumptions.\u0026nbsp; The project went on to win numerous international awards, garnering the attention of the NSA and the American Mathematical Society.\u0026nbsp; More importantly, this project taught me that without failure, success simply does not exist.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"e7658beb-51e4-430b-9df7-40ad2110b3e3\"}":{"__typename":"DeepDives","uuid":"e7658beb-51e4-430b-9df7-40ad2110b3e3","content":"\u003cp\u003eI was terrified of spiders when I was a little kid.\u0026nbsp; I still am, despite being an avid lover of bugs and nature.\u0026nbsp; But as a wide eyed 6-year-old, spiders seemed awfully big and scary.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI still remember one dream I had as a little kid.\u0026nbsp; Coming out of my bedroom, I peered down the stairs into the front room where I saw a massive black widow, so large it barely fit under the 20 foot ceiling.\u0026nbsp; It looked mean, creepy, horrifying, and most of all, gigantic.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e“Mom!” I yelled, terrified.\u0026nbsp; “There’s a spider!”\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e“Don’t worry,” she replied from somewhere downstairs, clearly not bothering to check.\u0026nbsp; “It’s just a little one, it won’t hurt you.”\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat was the end of the dream.\u0026nbsp; I don’t know what happened next, or if my mom ever realized how mistaken she was.\u0026nbsp; My family and I still laugh about my dream to this day.\u0026nbsp; When you’re that age, everything seems big and scary.\u0026nbsp; But as you grow older, you realize that many of your deepest fears, like impossibly big spiders, are actually quite silly.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"282608f5-95ee-4a75-8490-a65bcde92421\"}":{"__typename":"School","uuid":"282608f5-95ee-4a75-8490-a65bcde92421","name":"Monarch High School","city":"Louisville","type":"HIGH","state":"Colorado","country":"United States","zip":"80027"},"Education:{\"uuid\":\"af2994de-79e1-4c00-9ad7-b1b604102416\"}":{"__typename":"Education","uuid":"af2994de-79e1-4c00-9ad7-b1b604102416","school":{"__ref":"School:{\"uuid\":\"282608f5-95ee-4a75-8490-a65bcde92421\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"98014ccb-68aa-4bb0-a6d5-180a12088423\"}":{"__typename":"Education","uuid":"98014ccb-68aa-4bb0-a6d5-180a12088423","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Math \u0026 Physics","degree":null},"Testimonial:97b765ef-fdbc-4b98-8b68-b0e9e8924d01":{"__typename":"Testimonial","id":"97b765ef-fdbc-4b98-8b68-b0e9e8924d01","text":"Dear Morgan, \nThank you so much for teaching us lots of math concepts. You’ve helped us improve a lot and you have taught us so much. And you have been so kind and fun while teaching us making our sessions fun. I can’t wait to learn more. Thank you.\n\n                                   — John","date":"2025-08-17 01:33:52.945+00","rating":5,"endorser":{"__typename":"Endorser","name":"John Keegan","tagline":"","avatar":null}},"Testimonial:7fe69a94-963b-4477-83c8-d8cb5edb1c56":{"__typename":"Testimonial","id":"7fe69a94-963b-4477-83c8-d8cb5edb1c56","text":"From John and George: \n\nDear Morgan, \n\nThank you so much for mentoring us this summer. From your interesting choose formula to helping us master probability you have really helped me learn. I want to thank you so much for helping me learn so much and adjusting your teaching to fit my learning style. I hope you have a wonderful rest of the summer and a great new year!\n\n-George","date":"2025-08-17 01:30:14.799+00","rating":5,"endorser":{"__typename":"Endorser","name":"George Keegan ","tagline":"","avatar":null}},"Testimonial:e5f74122-96be-430e-904a-a9d5b9cc7ee1":{"__typename":"Testimonial","id":"e5f74122-96be-430e-904a-a9d5b9cc7ee1","text":"Morgan has been an incredible inspiration for our boys. They look forward to math with him every time, thanks to his creative games and engaging stories. His enthusiasm for the subject is contagious, and he has a gift for making learning both exciting and memorable.","date":"2025-08-15 12:17:24.309+00","rating":5,"endorser":{"__typename":"Endorser","name":"Quynh Nguyen","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"ba0c97c8-eb81-4cf5-84d1-7150137c3061\"}":{"__typename":"MentorPublicProfile","uuid":"ba0c97c8-eb81-4cf5-84d1-7150137c3061","displayName":"Morgan H.","slug":"morgan-holien","biography":"\u003cp\u003eHello!\u0026nbsp; My name is Morgan Holien, and I’m a senior at Yale University pursuing a Bachelor’s degree in Physics \u0026amp; Mathematics.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love learning about the world by thinking about how and why things work, specifically the beauty of math and how I can convey my knowledge at a deep, intuitive level.\u0026nbsp; As a student always interested in understanding the “why,” I know just how frustrating the education system can be, particularly in areas like science and math.\u0026nbsp; I know firsthand how difficult it can be to learn a complicated subject when it’s explained poorly by someone who probably doesn’t understand it very well themselves.\u0026nbsp; Despite the difficulty this has caused me as a student, I’ve turned it into a superpower, making it a habit to rederive everything from scratch and truly understand instead of just memorize.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat is my gift as a teacher: I know what it’s like to struggle, but I can also save you the time and anguish of learning a poorly taught subject.\u0026nbsp; I know how to build and teach concepts in a way that makes sense to students, not just to bored teachers who’ve been sitting on their math degrees for 50 years.\u0026nbsp; If you’re struggling to learn math or science because it’s not explained well, I’m your guy.\u0026nbsp; If you struggle with memorization and figuring out when to apply specific techniques or formulas, I know how to help you.\u0026nbsp; Because I’ve been there.\u0026nbsp; And even if you’re a curious student who just wants to learn more, like me, I can help put you on the right path.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of being a full-time student, one of my biggest passions is martial arts.\u0026nbsp; I’m a second degree black belt in Shotokan karate, and I used to be a nationally ranked athlete (back when I had more time to compete).\u0026nbsp; I love martial arts for both its beauty as a sport and the many practical lessons I’ve learned, from self discipline and perseverance to pushing my limits.\u0026nbsp; I have many years of experience teaching karate to younger students, from which I’ve learned how to inspire, connect with my students, and teach effectively.\u0026nbsp; In both performance and teaching, martial arts has shown me the astounding heights one can reach with proper training and a mentor who truly cares.\u003c/p\u003e\u003cp\u003eOn top of everything else, I enjoy drawing, solving Rubick’s cubes, lifting, and playing Rocket League.\u0026nbsp; On campus I’m quite involved with The Good Life Center, a dedicated mental health space that provides mindfulness workshops, yoga, a quiet place to study, and good tea.\u0026nbsp; I’m not sure yet what I want to do when I graduate, but I’ve recently become very interested in quantitative finance, the study of using math to beat the stock market.\u0026nbsp; (If you’re interested in turning math into a lucrative career, I’m the one to talk to!)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a teacher, my gift is drawing from these experiences and lessons I’ve learned as a student in many different capacities.\u0026nbsp; I want to help answer the why, to explain the unknown, and break complicated subjects into manageable pieces.\u0026nbsp; Most of all, I want to help you grow as a student and achieve your full potential.\u0026nbsp; Because I’ve been there, and I know what it takes to succeed.\u003c/p\u003e","teachingVideoPlaybackId":"EDflitzZ801UEeUA01RrOoEFtsR6VdV3zvNdAkrlLZAyU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9b921c53-9e59-421a-9c96-b1357250e9ea\"}"},{"__ref":"Favorites:{\"uuid\":\"0365ff06-03c0-4488-82d4-0e61d4f790ed\"}"},{"__ref":"Favorites:{\"uuid\":\"6dd3d92c-0f30-4cc2-b93a-08044c66f1df\"}"}],"causesSupported":[],"major":"Math \u0026 Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d98c45ec-1f40-44bc-bb88-26f667dafe56\"}"},{"__ref":"DeepDives:{\"uuid\":\"30505572-9be8-4901-9b4b-c92afb8fe3d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"67659b47-bdde-43df-abca-34390a0398e3\"}"},{"__ref":"DeepDives:{\"uuid\":\"e7658beb-51e4-430b-9df7-40ad2110b3e3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b4420f96-9cd0-4d44-8c48-5b7b9bc3d5fe/-/preview/-/format/jpg/","https://ucarecdn.com/e2eb9546-4b2d-4cf0-823f-8126555b3156/-/preview/-/format/jpg/","https://ucarecdn.com/c62303ae-7a4c-43bb-85ef-171a787d3bcb/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"af2994de-79e1-4c00-9ad7-b1b604102416\"}"},{"__ref":"Education:{\"uuid\":\"98014ccb-68aa-4bb0-a6d5-180a12088423\"}"}],"hiredAt":"2025-03-27T23:44:10.638Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","
