xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"dfd3264e-be2b-45e8-a5e4-5d1d0f6e4275\"}":{"__typename":"DeepDives","uuid":"dfd3264e-be2b-45e8-a5e4-5d1d0f6e4275","content":"\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFirst summer: \u003c/strong\u003eBuilding out my 501(c)(3) non-profit! \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSecond summer: \u003c/strong\u003ePaid research intern at the NASA Ames Research Center GeneLab Group. Worked on omics data analysis of mice flown in space.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eThird summer: \u003c/strong\u003eResearch Science Institute (RSI) scholar at MIT working on a project simulating stress response in \u003cem\u003eC. elegans\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFourth summer: \u003c/strong\u003ePaid research intern at the Department of Defense Air Force Research lab studying the photochemical and photothermal damage from lasers on retinal cells. \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a1b3a12c-b29f-4169-a5f1-f05036de25ab\"}":{"__typename":"DeepDives","uuid":"a1b3a12c-b29f-4169-a5f1-f05036de25ab","content":"\u003cp\u003eI'm currently coding up a personal website, applying some social computing skills that I have built up over the years. As an amateur photographer, I have a collection of landscape photographs that I hope to share in a succinct and structured way. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fd097528-a381-4864-9f25-0650be70c9b6\"}":{"__typename":"DeepDives","uuid":"fd097528-a381-4864-9f25-0650be70c9b6","content":"\u003cp\u003eMentorship matters to me because it accelerates growth in a way that no textbook or class ever can. A great mentor doesn’t just give answers. Instead, they challenge how you think, help you see potholes, and push you toward opportunities you wouldn't know to pursue. I love to see people I mentor explore their own interests and find their own passions.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"787b7df7-6180-46bb-9918-4569ee55a217\"}":{"__typename":"DeepDives","uuid":"787b7df7-6180-46bb-9918-4569ee55a217","content":"\u003cp\u003eI’d tell my middle/high school self:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eYou don’t have to win everything to be successful.\u003c/strong\u003e Depth matters more than collecting achievements. Pick a few things and go all in on them. \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStart before you feel ready.\u003c/strong\u003e Apply for the program, send the email, enter the competition. Rejection won’t define you but not acting  will.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eRelationships matter more than you think.\u003c/strong\u003e Whether in science research or when building a non-profit, relationships with donors, teachers, mentors, friends, and even the community is an important aspect to your success.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eYou’re allowed to change direction.\u003c/strong\u003e Curiosity, especially in middle and high school, is important to gain new perspectives! \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"85d9b5a9-d1d4-49a5-bf8d-d00aca6a1436\"}":{"__typename":"School","uuid":"85d9b5a9-d1d4-49a5-bf8d-d00aca6a1436","name":"Fairview High School","city":"Boulder","type":"HIGH","state":"Colorado","country":"United States","zip":"80305"},"Education:{\"uuid\":\"0d02e8be-7aeb-4722-b181-15945f5a2529\"}":{"__typename":"Education","uuid":"0d02e8be-7aeb-4722-b181-15945f5a2529","school":{"__ref":"School:{\"uuid\":\"85d9b5a9-d1d4-49a5-bf8d-d00aca6a1436\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e91a3f2a-09d4-4028-9629-9d80abe66451\"}":{"__typename":"Education","uuid":"e91a3f2a-09d4-4028-9629-9d80abe66451","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Computation","degree":null},"MentorPublicProfile:{\"uuid\":\"c78fd45e-e99d-4281-a3c5-f0d9e7346833\"}":{"__typename":"MentorPublicProfile","uuid":"c78fd45e-e99d-4281-a3c5-f0d9e7346833","displayName":"Jason C.","slug":"jason-cui","biography":"\u003cp\u003eI’m a Stanford University undergraduate (Class of 2026) majoring in Biomedical Computation. I attended high school between 2018 and 2022, where I qualified for the Regeneron International Science and Engineering Fair (\u003cstrong\u003eISEF\u003c/strong\u003e), won the Technical Paper Award at the Colorado State Science Fair (\u003cstrong\u003eCSEF\u003c/strong\u003e), was selected as a finalist for the 2022 Regeneron Science Talent Search (\u003cstrong\u003eSTS\u003c/strong\u003e), and was a 2021 Research Science Institute (\u003cstrong\u003eRSI\u003c/strong\u003e) Scholar. Throughout the past 7 years, I have also interned with the NASA Ames Research Center GeneLab Group (2020), the Department of Defense Air Force Research Lab (2022), the Beth Israel Deaconess Medical Center (2023), and in multiple labs at Stanford. I am an author on multiple publications, with a first-author paper pending publication! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, my academic work sits at the intersection of computational biology and human health. I conduct research focused on protein domain evolution and alternative splicing, building large-scale datasets and writing code to analyze biological patterns across thousands of genes. Through this work, I’ve developed strong experience in Python, data analysis, and scientific reasoning. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the lab, I serve as a co-instructor and financial officer for Stanford Alternative Spring Break (ASB) program, where I help lead immersive service-learning programs focused on rural healthcare in Alaska. Through ASB, I’ve designed educational programming and helped mentor students as they engage with complex social and health challenges. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eUpon graduating, I will be working in strategy and growth consulting for the pharmaceutical and medical device industry. Long term, I’m interested in combining technical expertise with leadership in the pharmaceutical industry.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I am an avid, albeit amateur, landscape photographer. I am currently trying to curate a portfolio! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am happy to serve as a mentor for those interested in science or those looking for opportunities to explore science. I am patient and structured. Some aspects that I could help on range from applying to summer research programs to developing scientific intuition to college applications to passion project guidance. Furthermore, I understand what it feels like to navigate rigorous coursework, competitive academic environments, and big life decisions. My goal isn’t just to help students succeed academically, but to help them build confidence, develop disciplined thinking habits, and discover what excites them intellectually.\u003c/p\u003e","teachingVideoPlaybackId":"WC40215xH02QfgXzXCmDy9dv01Fk1Ri97fSYKDyKp37lBs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m especially proud of is building and leading a service-learning program at Stanford that has grown to be the second largest club! Alternative Spring Break (ASB) was built to make complex social issues tangible for other students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eInstead of just organizing volunteer hours, I worked to design immersive experiences where students could learn directly from community partners, reflect critically, and connect their service to larger structural issues. That meant coordinating logistics, fundraising, building partnerships, and mentoring students through difficult conversations about inequality and responsibility.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat makes me proud isn’t any title or recognition but rather seeing and knowing that these experiences truly give my peers an opportunity to become more thoughtful, more informed, and more committed to long-term impact. \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Biomedical Computation","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dfd3264e-be2b-45e8-a5e4-5d1d0f6e4275\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1b3a12c-b29f-4169-a5f1-f05036de25ab\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd097528-a381-4864-9f25-0650be70c9b6\"}"},{"__ref":"DeepDives:{\"uuid\":\"787b7df7-6180-46bb-9918-4569ee55a217\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4fb92f60-79d3-406b-847c-960b79fa2214/-/preview/-/format/jpg/","https://ucarecdn.com/6a1024e5-de4a-4678-ac7c-6bd297a34f1a/-/preview/-/format/jpg/","https://ucarecdn.com/d2935792-ec20-4f66-a99f-46f5f6ab7a68/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0d02e8be-7aeb-4722-b181-15945f5a2529\"}"},{"__ref":"Education:{\"uuid\":\"e91a3f2a-09d4-4028-9629-9d80abe66451\"}"}],"hiredAt":"2026-02-12T17:57:49.386Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jason-cui\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c78fd45e-e99d-4281-a3c5-f0d9e7346833\"}"}}},"_sentryTraceData":"cf5e8e96bd2b42c2a1759ab5682b215a-8753d347220623e4-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=cf5e8e96bd2b42c2a1759ab5682b215a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jason-cui"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w
