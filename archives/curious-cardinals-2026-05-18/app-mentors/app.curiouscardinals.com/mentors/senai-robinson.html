xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"82cd65a8-6c9f-4a8e-9905-1db5f320a336\"}":{"__typename":"Favorites","uuid":"82cd65a8-6c9f-4a8e-9905-1db5f320a336","photoUrl":"https://ucarecdn.com/c6892320-ae08-4f9d-873e-2168188ae9f0/","title":"Zendaya","type":"ACTOR"},"Favorites:{\"uuid\":\"f9df2dd2-65ba-4dcb-b23b-8506ca880864\"}":{"__typename":"Favorites","uuid":"f9df2dd2-65ba-4dcb-b23b-8506ca880864","photoUrl":"https://ucarecdn.com/1b9f1e7c-df41-44c7-b68c-1702df2d4ca1/","title":"Debi Tirar Más Fotos","type":"ALBUM"},"Favorites:{\"uuid\":\"7b446070-3367-4c87-81c3-cbac7bad56e7\"}":{"__typename":"Favorites","uuid":"7b446070-3367-4c87-81c3-cbac7bad56e7","photoUrl":"https://ucarecdn.com/f2cfd82c-1ae9-4bdb-ba18-0554ef80b908/","title":"Song of Solomon","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9b48115d-d71b-4fcc-a7ca-76693e848c5a\"}":{"__typename":"DeepDives","uuid":"9b48115d-d71b-4fcc-a7ca-76693e848c5a","content":"\u003cp\u003eI would tell my highschool self to enjoy the experience while it lasts. There are only so many years you can capture the life of a place. By the time you reach high school, school feels like a chore, and we forget the joys of what it is and how to enjoy each others company. Many of the people in your school will not be in the same place again. Social life is just as important as an academic one, and you don't want to miss crucial memories only focused on the one goal of graduating. Life is more than academic stepping stones, it's every step we take, so enjoy it to its fullest.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3002bb54-de64-4e2b-bc80-e13515a10bfd\"}":{"__typename":"DeepDives","uuid":"3002bb54-de64-4e2b-bc80-e13515a10bfd","content":"\u003cp\u003eMentorship is different from tutoring because it offers more than just knowledge. Its a chance to build community, lean into our weaknesses to forge our strengths, and cultivates a strong awareness of self. I hope to be a good mentor to any that come my way because my mentors made me into the strong and healthy candidate I am today.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"08351607-433f-4d76-8f16-e58e048a9285\"}":{"__typename":"DeepDives","uuid":"08351607-433f-4d76-8f16-e58e048a9285","content":"\u003cp\u003eMy dream job is to serve as an attorney to defend people's citizenship and homes. I believe in fair trials and fair representation, but often than not, many who can not afford legal counsel receive less support. I want to be the bridge between affordability and quality legal services, and I hope to achieve this in the coming years. The first step is to graduate and get into law school. Life as a student never ends, as we perpetually are always learning, whether that be in life experience, or in an academic setting. So part of my dream is to always keep learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}":{"__typename":"School","uuid":"62e59c56-ee46-4213-b082-758af3ff99db","name":"Phillips Exeter Academy","city":"Exeter","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03833"},"Education:{\"uuid\":\"4aa4beb8-8f30-4a9e-a297-c1ee5d8f7446\"}":{"__typename":"Education","uuid":"4aa4beb8-8f30-4a9e-a297-c1ee5d8f7446","school":{"__ref":"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"f7d1fa49-094b-483d-869f-38534dfb19b7\"}":{"__typename":"Education","uuid":"f7d1fa49-094b-483d-869f-38534dfb19b7","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2028","major":"Social Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"5d23dfbe-ddb0-40a3-836e-42ace1de89e3\"}":{"__typename":"MentorPublicProfile","uuid":"5d23dfbe-ddb0-40a3-836e-42ace1de89e3","displayName":"Senai R.","slug":"senai-robinson","biography":"\u003cp\u003eHi! I am a very excited mentor who believes everyone is capable of learning and being a strong student. When I was younger, I was told my writing was subpar, and I gravitated more to stem because of my grades. However, my later years in high school and college woke me up to the passion I have always had, and I believe in redefining who you are as many times as you need to discover who you really are. I first entered college wanting to be a pre-med student, but fell in love with writing and books again, and now I study history and literature, social studies to be specific.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI enjoy what I study, and am currently working on a thesis about bodily autonomy and the importance of self-determination for smaller communities, such as indigenous cultures across the world. We often forget that many of our histories repeat themselves if they are not taught properly. In order to build community and foster empathy we must be willing to look into the enclaves of people we cast out, and understand why and how this occurs. This is the ethical job of a sociologist. I also focus on the liberation and expression of black and indigenous populations as part of my social studies thesis in college.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy second area of study revolves around art and expression, focusing on film and media. The way we tell stories is important, and technology gives us the glorious benefit of making film that capture our imaginations as well as our truths. For example, I may not have seen Casablanca 20 times, but I have seen classics such as Scarface and 12 angry men and argue they have important morals about our society and justice.\u003c/p\u003e\u003cp\u003eI am looking forward to pursuing the rest of my film studies until graduation. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs part of my writing accolades, I have been a writer for The Exonian and The Harvard Crimson, but I publish most of my writing on Substack. I have received an award in English for my discussion of literature called the William Tencher Award. My biggest accomplishments are to my students, having tutored English to business officials and students in Korea on Ringle and making them more confident English speaking professionals. I also tutored students in New York City study and prepare for SATs and Regional Exams, and each of my students performed highly well.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have used my time at college well, planning to study abroad in order to complete my thesis. I am currently planning to study in Puerto Rico, and Spain to accompany my overview of Caribbean indigenous identity. I am still a student, and while my higher education is less traditional, it makes me more competent in making the most of educational opportunities, not just achieving high grades. So as an advocate of learning for life, I understand any struggles that may come your way and how to overcome. I will work diligently to secure your status as a hard working student that achieves their goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I would be helpful for passion projects or regular academic tutoring in all classes. As I mentioned before, I was pre-med, so I have the knowledge to help in math, biology, and chemistry if needed. I received high honors graduating from high school and achieved A grades for AP Biology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also good at building a schedule that meets the demands of any project, so you can stay on task and finish your goals on time. Nothing is too hard to learn, one only needs the right practice and explanation, and I hope to be that for anyone.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt takes courage to ask for assistance, so recognize your strength for enlisting curious cardinals. P.S I also love to play piano, and cook meals, and in my free time I watch films and tv shows. Let's catch up with our favorite media while learning and growing our minds.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"E6HE02iEce5PyCh6wEmDh1RkjYOSD9LMtbCYKJdQKcoo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"82cd65a8-6c9f-4a8e-9905-1db5f320a336\"}"},{"__ref":"Favorites:{\"uuid\":\"f9df2dd2-65ba-4dcb-b23b-8506ca880864\"}"},{"__ref":"Favorites:{\"uuid\":\"7b446070-3367-4c87-81c3-cbac7bad56e7\"}"}],"causesSupported":[],"major":"Social Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9b48115d-d71b-4fcc-a7ca-76693e848c5a\"}"},{"__ref":"DeepDives:{\"uuid\":\"3002bb54-de64-4e2b-bc80-e13515a10bfd\"}"},{"__ref":"DeepDives:{\"uuid\":\"08351607-433f-4d76-8f16-e58e048a9285\"}"}],"active":true,"pr
