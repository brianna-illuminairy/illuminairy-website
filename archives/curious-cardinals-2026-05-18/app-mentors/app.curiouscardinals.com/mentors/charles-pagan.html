xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"189de134-a268-4659-902d-6e1a00ad5bac\"}":{"__typename":"DeepDives","uuid":"189de134-a268-4659-902d-6e1a00ad5bac","content":"\u003cp\u003eThe mentors in my life have inspired me to be the person I am today, and I will always be grateful for that. Mentorship is about more than just teaching; it is about igniting a passion for a shared interest. I am an Eagle Scout, and one of our repeated mottos when packing up a campsite was “leave no trace.” Not only should we leave the area as we found it, but we should in fact leave it better than it was before. Mentorship works in a similar way. As a mentor, I strive to honor my teachers by not only replicating the things I learned from them, but by expanding upon their knowledge in order to instill progress and forward movement. Mentorship is my way to give back. It is how I can leave things better than I found them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"54c7ae95-89eb-4dad-a787-9a68bc2d2192\"}":{"__typename":"DeepDives","uuid":"54c7ae95-89eb-4dad-a787-9a68bc2d2192","content":"\u003cp\u003eI selected my English major in my sophomore year after bouncing between dozens of potential degrees that I found interest in. I found my combination of English and history to be the most all-encompassing and engaging path to an undergraduate degree. Since then, I have grown passionate about English and about English education. For me, English has been a way for me to both understand myself and communicate my thoughts. Through history, I can come to understand my society and contemporary world. These degrees do not correspond to a direct career path like finance or biology do, but I find them to be the best ways for me to understand myself and the wider world around me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"a7b8e009-a415-48f7-aada-a299cdc58173\"}":{"__typename":"DeepDives","uuid":"a7b8e009-a415-48f7-aada-a299cdc58173","content":"\u003cp\u003eI tried to involve myself in as many things as I could in high school because of my curiosity and enthusiasm for activity. I pushed myself in my academics, but I also participated in our school orchestra and varsity football team for all four years. I did not have a free period, and I was selected for several school committees and clubs. While I do not regret packing my own schedule throughout my high school career, I still vividly remember my struggles with time management and stress. In such a competitive environment, I never realized that it was normal to be stressed or tired, and that all my peers actually felt the exact same way as I did. I loved high school, and I fully embrace extracurricular activities and academic ambition for students, but I also aspire to help students communicate their feelings and manage their stress. High school should be a happy time of exploration and growth, and I hope to encourage students to find balance in their lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8b6e426a-a1e4-4e92-8b26-4d0eda419dac\"}":{"__typename":"DeepDives","uuid":"8b6e426a-a1e4-4e92-8b26-4d0eda419dac","content":"\u003cp\u003eIn high school, I took a three-week course on novel writing from one of my favorite English teachers. In addition to learning the tenants of creative writing, we each began to work on our own texts. In those three weeks, I wrote about 150 manuscript pages on a story that was very personal to me. I have since been adapting the novel into an episodic series fit for television. I have written several drafts, and I aspire to submit the scripts to competitions and potentially sell the pilot script to a producer. I have written several screenplays and scripts since this, but this continues to be one of my favorites.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"c6bfd0d1-66cc-4fbd-94e3-ba9451ef5327\"}":{"__typename":"School","uuid":"c6bfd0d1-66cc-4fbd-94e3-ba9451ef5327","name":"Kinkaid School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77024"},"Education:{\"uuid\":\"84fc4b1f-f85f-4c8c-b180-ad2bc94abab7\"}":{"__typename":"Education","uuid":"84fc4b1f-f85f-4c8c-b180-ad2bc94abab7","school":{"__ref":"School:{\"uuid\":\"c6bfd0d1-66cc-4fbd-94e3-ba9451ef5327\"}"},"startYear":"2007","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"bf5bb9b4-3797-447b-b277-a17c4baf47ae\"}":{"__typename":"Education","uuid":"bf5bb9b4-3797-447b-b277-a17c4baf47ae","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"c0ce221f-f6ca-4896-8bdc-3ea3e014403f\"}":{"__typename":"MentorPublicProfile","uuid":"c0ce221f-f6ca-4896-8bdc-3ea3e014403f","displayName":"Charlie P.","slug":"charles-pagan","biography":"\u003cp\u003eHello! My name is Charlie Pagan, and I am a junior at Vanderbilt University studying English Literature and History. I am originally from Houston, Texas, and my favorite book is \u003cem\u003eInfinite Jest\u003c/em\u003e by David Foster Wallace. I play five musical instruments and enjoy listening to all sorts of music: from rock to classical to R\u0026amp;B. I was on the varsity football team for three years in high school, and I still love to play golf in my free time.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe words are our greatest tools to understand our collective past and our individual selves. As Shakespeare wrote, while all that is “fair sometime declines,” our words make it so that our “eternal summer[s] shall not fade” (Sonnet 18, 7-9). Words are our greatest tools in understanding the actions of those who preceded us. Through them, we can find our own voices. This is my passion: refining my own communication and helping others do the same.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond my studies, I greatly enjoy the arts. I engage in many forms of creative expression - from creative writing to filmmaking to music. I spent much of my sophomore year writing reviews for submissions to the Nashville Film Festival, and I greatly enjoyed making short films and writing stories in high school. I find art to be at its best when shared and discussed, so I love to talk about new music and movies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am spending the spring of my junior year in Barcelona, Spain to study Spanish and history and immerse myself in Flamenco music, tapas, and F.C. Barcelona. I am excited to get to work with Curious Cardinals!\u003c/p\u003e","teachingVideoPlaybackId":"6V5G8qBt6HtROXKft01w5bDjtQ2P8ooVG3101nGShPucM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"189de134-a268-4659-902d-6e1a00ad5bac\"}"},{"__ref":"DeepDives:{\"uuid\":\"54c7ae95-89eb-4dad-a787-9a68bc2d2192\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7b8e009-a415-48f7-aada-a299cdc58173\"}"},{"__ref":"DeepDives:{\"uuid\":\"8b6e426a-a1e4-4e92-8b26-4d0eda419dac\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6ceaa426-debb-42f1-85e7-c862f6877673/-/preview/-/format/jpg/","https://ucarecdn.com/5d2d302f-1860-4fe3-b446-d5435db2fa88/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"84fc4b1f-f85f-4c8c-b180-ad2bc94abab7\"}"},{"__ref":"Education:{\"uuid\":\"bf5bb9b4-3797-447b-b277-a17c4baf47ae\"}"}],"hiredAt":"2024-01-19T18:17:34.286Z","topics":["Literature","History Project","Film / Theater","Creative Writing","Music","Philosophy","Reading","History","Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"charles-pagan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c0ce221f-f6ca-4896-8bdc-3ea3e014403f\"}"}}},"_sentryTraceData":"d217c9be26ec4b1488e1c3c77b3cdc42-8e16cf50af44c75d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d217c9be26ec4b1488e1c3c77b3cdc42,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-s
