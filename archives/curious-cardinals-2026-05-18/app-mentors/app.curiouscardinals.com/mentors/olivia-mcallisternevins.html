xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cd34b5fc-4cc6-45d3-8c49-96dedcc106d2\"}":{"__typename":"Favorites","uuid":"cd34b5fc-4cc6-45d3-8c49-96dedcc106d2","photoUrl":"https://ucarecdn.com/71ef245b-4e93-4700-903d-845513ee9cb3/","title":"On Earth We're Briefly Gorgeous","type":"BOOK"},"Favorites:{\"uuid\":\"b94145af-c5a1-46a2-957e-ecd75ad919ff\"}":{"__typename":"Favorites","uuid":"b94145af-c5a1-46a2-957e-ecd75ad919ff","photoUrl":"https://ucarecdn.com/33508849-5a48-408c-8a93-c806aa20d0f9/","title":"Good Will Hunting","type":"MOVIE"},"Favorites:{\"uuid\":\"f2ae73b4-9e6a-46f6-8eae-88a967aeaef8\"}":{"__typename":"Favorites","uuid":"f2ae73b4-9e6a-46f6-8eae-88a967aeaef8","photoUrl":"https://ucarecdn.com/9955dc00-3b7f-472b-8d8a-206673b23f9f/","title":"NYC","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f7a1aaed-71a7-4fba-a041-cccb5e528014\"}":{"__typename":"DeepDives","uuid":"f7a1aaed-71a7-4fba-a041-cccb5e528014","content":"\u003cp\u003ePursue what you're truly passionate about. Block out the noise—people will always have opinions about what you \u003cem\u003eshould\u003c/em\u003e care about or how you \u003cem\u003eshould\u003c/em\u003e spend your time. But only you know what lights you up inside.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd never forget: we’re all like ducks. On the surface, it looks like everyone else is gliding effortlessly through life, but underneath, we’re all paddling like crazy just to stay afloat. Everyone has their own struggles. It’s never just you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"4534bb2c-72aa-41d3-ba2c-860d24c17db0\"}":{"__typename":"DeepDives","uuid":"4534bb2c-72aa-41d3-ba2c-860d24c17db0","content":"\u003cp\u003eShe gives the best advice and, like any great parent, has a way of lifting me up when my confidence has taken a hit. She is extremely smart and accomplished, but she has the humility to admit when she’s wrong, and she leads with kindness and honesty. \u003c/p\u003e\u003cp\u003eShe’s shown me, through her actions, that the foundation of any strong relationship is simply showing up. Her example has shaped the way I connect with others and taught me the true meaning of accountability and support.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"f3ae6bd2-3573-401d-b2e1-87723d317779\"}":{"__typename":"DeepDives","uuid":"f3ae6bd2-3573-401d-b2e1-87723d317779","content":"\u003cp\u003eMy big Jewish family has always valued education and intellectual development, as well as healthy debate, all of which have impacted my teaching and learning style. Being surrounded by strong personalities taught me the importance of listening, compromising, and flexibility.\u003c/p\u003e\u003cp\u003eIn moments of challenge or frustration, I’ve learned to stay patient and persistent. I’m not afraid to try different approaches until something works, and I believe that kind of resilience comes directly from the dynamic, opinionated, and loving environment I grew up in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f86fbceb-b73b-4ca3-b590-cb734052e4e9\"}":{"__typename":"DeepDives","uuid":"f86fbceb-b73b-4ca3-b590-cb734052e4e9","content":"\u003cp\u003eBeing a doctor, specifically a surgeon, is my dream. As I mentioned in my bio, I’ve always been drawn to the unique combination of helping people and being deeply immersed in science—two things that I find incredibly fulfilling.\u003c/p\u003e\u003cp\u003eOn top of that, I think the human body is endlessly fascinating. The idea of seeing and working with it up close every day excites me—not only because of the challenge, but because it means that no two days will ever be the same.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}":{"__typename":"School","uuid":"2ff73c87-6442-482c-8d92-863dfb263ea0","name":"The Dalton School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"11571f39-fe4e-41bd-8947-996b65653ed8\"}":{"__typename":"Education","uuid":"11571f39-fe4e-41bd-8947-996b65653ed8","school":{"__ref":"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"246ee41b-3696-4344-9f8b-89e7c961a77e\"}":{"__typename":"Education","uuid":"246ee41b-3696-4344-9f8b-89e7c961a77e","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biological Sciences/Global History","degree":null},"MentorPublicProfile:{\"uuid\":\"7659804b-6860-4e4a-8cfa-56a4f9520179\"}":{"__typename":"MentorPublicProfile","uuid":"7659804b-6860-4e4a-8cfa-56a4f9520179","displayName":"Olivia M.","slug":"olivia-mcallisternevins","biography":"\u003cp\u003eHello! My name is Olivia (or Liv) McAllister-Nevins, and I’m from New York City. I’m an aspiring doctor who has dreamed of combining a love for science and patient care since I was six years old. Alongside my pre-medical studies, I also pursue a degree in global history—reading, writing, and discussing historical events and their lasting consequences has always been a passion of mine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m especially excited to be part of a community that values meaningful and lasting mentorship. I’ve served as a sleepaway camp counselor for many years and as a Peer Advisor in both high school and college. I believe I’ve been incredibly fortunate to learn from strong mentors who have shaped me, and I’m committed to paying that forward by supporting others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I serve on the executive board of my school’s chapter of Spoon University, a national food and culture magazine. We publish a biannual print magazine and host a range of food-focused events throughout the year—from panels featuring food critics and Evanston restaurateurs to a food festival and an annual trivia night at one of Evanston’s best pizza spots. This experience has opened my eyes to the world of event planning and collaboration with local businesses. It’s taught me the importance of community engagement and supporting small businesses, while also helping me grow as a leader. Plus, it’s a lot of fun—I’ve made some of my closest friends through this work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome fun facts about me is that I recently became an Irish citizen, ran my first half marathon, and I am the oldest of three siblings! I love to read, and my favorite author is Ann Patchett.\u003c/p\u003e","teachingVideoPlaybackId":"l5D3jveVIWdpn2TCeSUQ8IIbTo015K7AnF2MGSVSAuS4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"cd34b5fc-4cc6-45d3-8c49-96dedcc106d2\"}"},{"__ref":"Favorites:{\"uuid\":\"b94145af-c5a1-46a2-957e-ecd75ad919ff\"}"},{"__ref":"Favorites:{\"uuid\":\"f2ae73b4-9e6a-46f6-8eae-88a967aeaef8\"}"}],"causesSupported":[],"major":"Biological Sciences/Global History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f7a1aaed-71a7-4fba-a041-cccb5e528014\"}"},{"__ref":"DeepDives:{\"uuid\":\"4534bb2c-72aa-41d3-ba2c-860d24c17db0\"}"},{"__ref":"DeepDives:{\"uuid\":\"f3ae6bd2-3573-401d-b2e1-87723d317779\"}"},{"__ref":"DeepDives:{\"uuid\":\"f86fbceb-b73b-4ca3-b590-cb734052e4e9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4bcd62bf-49a7-4bc4-9acf-a143567ae08c/-/preview/-/format/jpg/","https://ucarecdn.com/3c9b7c1d-54eb-4fad-851f-2034230a8903/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"11571f39-fe4e-41bd-8947-996b65653ed8\"}"},{"__ref":"Education:{\"uuid\":\"246ee41b-3696-4344-9f8b-89e7c961a77e\"}"}],"hiredAt":"2025-04-04T03:43:49.265Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Executive Function","Reading","History"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"olivia-mcallisternevi
