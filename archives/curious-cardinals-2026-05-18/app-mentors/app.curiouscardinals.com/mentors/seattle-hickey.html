xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0f3fd106-4913-4bb6-a6d9-238e078f6ec8\"}":{"__typename":"Favorites","uuid":"0f3fd106-4913-4bb6-a6d9-238e078f6ec8","photoUrl":"https://ucarecdn.com/6b187d75-d252-4638-90bd-aa14a3bc7677/","title":"Timothee Chalamet","type":"ACTOR"},"Favorites:{\"uuid\":\"7f3e758c-c5fb-493a-a5a8-802d44c09bac\"}":{"__typename":"Favorites","uuid":"7f3e758c-c5fb-493a-a5a8-802d44c09bac","photoUrl":"https://ucarecdn.com/26464f31-8701-4b32-a226-2643fe80aa7f/","title":"Moonrise Kingdom","type":"MOVIE"},"Favorites:{\"uuid\":\"b9a6c3ae-a6cd-4ff5-b445-b41e825a935c\"}":{"__typename":"Favorites","uuid":"b9a6c3ae-a6cd-4ff5-b445-b41e825a935c","photoUrl":"https://ucarecdn.com/60024c5b-84cf-4f53-9972-1ae6704512f3/","title":"Catan","type":"GAME"},"CausesSupported:{\"uuid\":\"9ea15781-fc23-4465-a50d-f0af2dc63a58\"}":{"__typename":"CausesSupported","uuid":"9ea15781-fc23-4465-a50d-f0af2dc63a58","name":"AIDS Healthcare Foundation","description":"\u003cp\u003eI interned for their Global Advocacy and Marketing Department this summer!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/78271cf4-484d-42b5-b7c4-19e6e318c27b/"},"CausesSupported:{\"uuid\":\"deb87c42-c325-485d-bc1a-f22775c9daf5\"}":{"__typename":"CausesSupported","uuid":"deb87c42-c325-485d-bc1a-f22775c9daf5","name":"Strong Women Strong Girls","description":"\u003cp\u003eI serve as Community Outreach Director and mentor for the Harvard chapter!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/fc4b747d-2a73-43c6-92e1-8fd8af0089c0/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fa23d976-a3ee-4a16-9afa-7bc9c4867a72\"}":{"__typename":"DeepDives","uuid":"fa23d976-a3ee-4a16-9afa-7bc9c4867a72","content":"\u003cp\u003eI chose History of Science because it allowed me to study the hard sciences while also investigating how our current knowledge systems were formed and continue to change as they interact with our society. Understanding science as influenced and having an influence on our culture gives me a broader perspective on how to make healthcare better, and is less black and white than biology or chemistry would be. As someone who likes to mettle in the grey between the black and white, History of Science is the perfect line of study for me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"a79f0c7d-b3c5-4afe-97fb-f0a60b1b0d92\"}":{"__typename":"DeepDives","uuid":"a79f0c7d-b3c5-4afe-97fb-f0a60b1b0d92","content":"\u003cp\u003eAs a Southerner who loves to make everyone feel welcome, I like to take a kind approach to teaching, because I believe that students/mentees learn best when they feel most comfortable. In addition, I have extensive experience mentoring students with learning disabilities in high school, virtually and in-person, including family members, and would love to support students with unique learning abilities succeed. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f8433b68-097a-40f9-9354-9a014eba8630\"}":{"__typename":"DeepDives","uuid":"f8433b68-097a-40f9-9354-9a014eba8630","content":"\u003cp\u003eIn high school, I created an iPhone game where the user is the President and has to work through different expectations of their constituents, party, and platform. Many kids and adults across the United States do not fully understand how the government works, especially the executive branch, and I think that an educated voter base is an integral part of democracy. Making this app, I hoped to give kids a fun way to learn about what the president really does.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"50b449c2-9a96-4f9e-81e0-1e0d5454d208\"}":{"__typename":"DeepDives","uuid":"50b449c2-9a96-4f9e-81e0-1e0d5454d208","content":"\u003cp\u003eIn my spare time, I like to paint with acrylics, go hiking with friends, run, and do yoga. When I am able to, I love to visit my family back home, where I can spend time with all our  animals (we have goats, chickens, ducks, dogs, and cats!!!) and my siblings and step siblings. My family means a lot to me, and I cherish the time we have together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"c20a0b71-5702-48b2-910c-3213f289dbbc\"}":{"__typename":"School","uuid":"c20a0b71-5702-48b2-910c-3213f289dbbc","name":"Grapevine High School","city":"Grapevine","type":"HIGH","state":"Texas","country":"United States","zip":"76051"},"Education:{\"uuid\":\"fd305e8c-92b5-4bd0-9747-461af1436c61\"}":{"__typename":"Education","uuid":"fd305e8c-92b5-4bd0-9747-461af1436c61","school":{"__ref":"School:{\"uuid\":\"c20a0b71-5702-48b2-910c-3213f289dbbc\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"08e413b6-b437-470a-a2b3-12641dd3e2cb\"}":{"__typename":"Education","uuid":"08e413b6-b437-470a-a2b3-12641dd3e2cb","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"History of Science and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"f3a2650f-5113-4de1-8e09-e8635f1e0145\"}":{"__typename":"MentorPublicProfile","uuid":"f3a2650f-5113-4de1-8e09-e8635f1e0145","displayName":"Seattle H.","slug":"seattle-hickey","biography":"\u003cp\u003e\u003cbr\u003eSeattle, currently a junior at Harvard, is pursuing dual majors in the History of Science and Computer Science. A native Texan, she was raised in Houston before relocating to Dallas during her high school years. With a strong passion for community-building and providing help to others, she served as the vice president of Best Buddies and initiated the first chapter of She's the First in her high school. This organization aims to support girls who are the first in their families to graduate high school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eBefore enrolling at Harvard, Seattle took a gap year to work at the Houston Methodist Hospital, contributing to the expansion of their Virtual ICU program across various regional hospitals. This improved patient outcomes during the Covid-19 pandemic. This experience sparked her interest in the healthcare sector and led her to initially opt for Pre-Med when she entered Harvard.\u003cbr\u003e\u003cbr\u003eWhile she was stimulated by the rigorous Pre-Med curriculum, Seattle found herself missing the joy of coding. Consequently, she decided to pursue a combined degree in the History of Science and Computer Science. Her goal is to enter the healthcare startup arena after graduating from college. Her coursework in the History of Science offers her a broad view of the scientific field, enabling her to comprehend how knowledge evolves, disseminates, and transforms based on its cultural context.\u003cbr\u003e\u003cbr\u003eSeattle's fervor for building communities persists. She is currently the Secretary of the Crimson Key Society at Harvard, where she volunteers as a tour guide, welcomes parents during family weekends, and facilitates freshman orientation activities. She also contributes to the Harvard College Women's Center as an Education intern, providing a secure and inclusive environment for all Harvard students, with a special focus on gender minorities.\u003cbr\u003e\u003cbr\u003eIn her leisure time, Seattle expresses her creativity through painting. She joined the Harvard Independent Newspaper as a member of the Design board and has also taken up writing about gender parity issues faced by students on campus. Her leadership and mentorship skills were put to use last year when she held the position of staff recruitment director for the newspaper. Under her guidance, the staff size of the newspaper doubled, and she personally mentored over 100 students through the application process.\u003cbr\u003e\u003cbr\u003eGiven her non-linear academic career, she can relate to mentees who find their passions span seemingly unrelated interests, and she can't wait to help her mentees learn how to find connections between their interests. She hopes to help her students embark on their academic and professional journeys with confidence, wonder, and care!\u003c/p\u003e","teachingVideoPlaybackId":"gUdWLFIDs3yag4yxY01bjoLCr2xwWDyyXgfPiu8RQTtY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0f3fd106-4913-4bb6-a6d9-238e078f6ec8\"}"},{"__ref":"Favorites:{\"uuid\":\"7f3e758c-c5fb-493a-a5a8-802d44c09bac\"}"},{"__ref":"Fa
