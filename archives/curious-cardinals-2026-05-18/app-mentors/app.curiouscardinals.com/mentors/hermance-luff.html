"}":{"__typename":"DeepDives","uuid":"177160b2-fdfe-4a14-9801-26551154890c","content":"\u003cp\u003eOther than reading, I find it crucial for my mental health to create. At the moment, I am working on creating a portfolio of linocuts (stamps) to print on up-cycled clothing for a local clothing swap. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"6e82d355-757b-4b81-ada8-567200e80ab0\"}":{"__typename":"DeepDives","uuid":"6e82d355-757b-4b81-ada8-567200e80ab0","content":"\u003cp\u003eAs a first-generation college graduate, everything my parents have done to support my dreams.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"3a9ef408-803e-4eb1-8f59-e944b2c47f0a\"}":{"__typename":"DeepDives","uuid":"3a9ef408-803e-4eb1-8f59-e944b2c47f0a","content":"\u003cp\u003eA scientist at the IPCC\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"7ad90e6a-bf46-4967-870c-be3766acf575\"}":{"__typename":"School","uuid":"7ad90e6a-bf46-4967-870c-be3766acf575","name":"Red Mountain High School","city":"Mesa","type":"HIGH","state":"Arizona","country":"United States","zip":"85207"},"Education:{\"uuid\":\"56a52405-f916-4a14-b551-882cd4a2e471\"}":{"__typename":"Education","uuid":"56a52405-f916-4a14-b551-882cd4a2e471","school":{"__ref":"School:{\"uuid\":\"7ad90e6a-bf46-4967-870c-be3766acf575\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"7250d282-44e5-4060-9567-36b205004850\"}":{"__typename":"Education","uuid":"7250d282-44e5-4060-9567-36b205004850","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2026","major":"Earth and Environmental Engineering, M.S.","degree":null},"MentorPublicProfile:{\"uuid\":\"40283759-da9f-4bb1-99d1-242c7a572d9b\"}":{"__typename":"MentorPublicProfile","uuid":"40283759-da9f-4bb1-99d1-242c7a572d9b","displayName":"Hermance L.","slug":"hermance-luff","biography":"\u003cp\u003eCurrently, I am studying to become a Carbon Management Engineer at Columbia University, where I am enrolled in the Earth and Environmental Engineering program at the\u0026nbsp;Columbia University. My work focuses on developing practical, scalable solutions to reduce atmospheric carbon and transition global energy systems toward sustainability. Previously, I studied Sustainability at\u0026nbsp;Arizona State University, concentrating on energy systems and climate solutions. I have a deep passion for the environment, the Earth, and, if you couldn’t guess, carbon! My academic interests extend into applied mathematics, fusion energy, carbon mineralization, and innovative decarbonization technologies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout both high school and my undergraduate studies, I maintained above a 4.0 GPA while holding multiple professional roles and staying actively involved in extracurricular activities. I was a committed soccer player and participated in organizations such as Women in STEM, which strengthened my leadership skills and deepened my commitment to increasing representation in technical fields. I prioritize education and intellectual growth, but I strongly believe that well-rounded development; through sports (soccer), clubs, and community, is equally important. Discipline and balance are two values I carry into both my academic and mentoring work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have been tutoring and mentoring for over five years and plan to continue this passion long-term. I have taught STEM education to K–6 students for three years, high school math and science for three years, and university-level applied mathematics for two years. As you might notice, many of these roles overlapped, that’s how much I genuinely love teaching and working one-on-one with students!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eMy mentoring philosophy centers on building both competence and confidence. I focus not only on mastering material, but on helping students develop systems for learning: time management strategies, exam preparation techniques, analytical thinking, and long-term academic planning. I believe strong study habits and problem-solving frameworks are just as important as content knowledge.\u003c/p\u003e\u003cp\u003eI especially enjoy mentoring students who are curious about STEM but may not yet feel confident in their abilities. I understand what it takes to excel academically while managing multiple responsibilities, and I strive to help students realize that high achievement is attainable with structure, discipline, and the right support. Whether a student is aiming for top universities, exploring STEM for the first time, or simply trying to improve their grades, I am committed to providing structured guidance, accountability, and encouragement every step of the way.\u003c/p\u003e","teachingVideoPlaybackId":"QMo1yy7qNRGBIgTcJM00YjMX00zzWwVkU301QrnOKbE2ms","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9d63120b-1a5d-462b-927a-6078ab1f2749\"}"},{"__ref":"Favorites:{\"uuid\":\"ca2a6f2
