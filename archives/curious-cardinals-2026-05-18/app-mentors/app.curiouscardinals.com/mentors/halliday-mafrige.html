xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"95d084a5-8d86-47fb-a074-043c03ae3dc3\"}":{"__typename":"Favorites","uuid":"95d084a5-8d86-47fb-a074-043c03ae3dc3","photoUrl":"https://ucarecdn.com/c80693b1-93b7-4d3a-96b8-b9c13edae384/","title":"A Tale of Two Cities","type":"BOOK"},"Favorites:{\"uuid\":\"1ddd7e70-9ee9-4e50-86fb-fe184acc646a\"}":{"__typename":"Favorites","uuid":"1ddd7e70-9ee9-4e50-86fb-fe184acc646a","photoUrl":"https://ucarecdn.com/40306b6d-dd4b-4da6-a60d-54c482facff4/","title":"Hamlet","type":"PLAY"},"Favorites:{\"uuid\":\"45c40997-2de6-46b0-b196-e9e6d1de1df5\"}":{"__typename":"Favorites","uuid":"45c40997-2de6-46b0-b196-e9e6d1de1df5","photoUrl":"https://ucarecdn.com/e954a100-09d7-44e2-9616-56d8436ef884/","title":"Elf","type":"MOVIE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e7ac3c7c-5bd5-411f-af9b-d92110f89bed\"}":{"__typename":"DeepDives","uuid":"e7ac3c7c-5bd5-411f-af9b-d92110f89bed","content":"\u003cp\u003eIf you had asked me this question as a kid, you would have received the unwavering answer of \"Doctor Lawyer Mermaid.\" Without a doubt in my mini-mind, I was convinced that this would be my future. \u003c/p\u003e\u003cp\u003e\u003cbr\u003eApologies to my past self, but that is not the path I would choose for myself today. Since then, though, I've wanted to be a writer. The type of writer I wanted to be shifted almost daily until I tried each of them out. I eventually landed on the Journalism career path, where I plan to use my voice to report on things that bring other people joy. For me, that is fashion journalism. I also really enjoy sports reporting, but I enjoy more of getting to the person behind the athlete--again coming back to storytelling. My dream is to eventually rise to be an editor at a reputable fashion journalism publication.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"967465f7-94d6-41c8-b6b3-42e17f738286\"}":{"__typename":"DeepDives","uuid":"967465f7-94d6-41c8-b6b3-42e17f738286","content":"\u003cp\u003eI tried out all kinds of writing. I knew I wanted to try writing novels first. I wanted to tell a story that would inspire others to do so as well. I soon realized that my ADHD made it difficult to focus on one idea for such a long period of time with no tangible results, so I moved on. I tried songwriting next, but it did not come naturally to me. It was hard for me to come up with things that rhymed the whole way through, so I abandoned the rhymes and tried some more free form poetry. This was much easier to me because it felt like the pressure was gone, but telling a cohesive story through poetry it was much harder than I anticipated. The last thing I tried was journalism, and it stuck immediately. I loved the process of picking through someone's brain and figuring out what makes them, them. I knew that I wanted to major in it after those first interviews, and I was able to circle back around to that love of poems and books through my English Literature minor. It is the best of both worlds for me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"fd035ea8-ce87-4ba7-919a-faf7f836cd51\"}":{"__typename":"DeepDives","uuid":"fd035ea8-ce87-4ba7-919a-faf7f836cd51","content":"\u003cp\u003eI wanted to be a mentor to help students learn. Of course, about academics, but also skills or concepts that will stick with you for life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne career-defining mentor that sticks out in my mind is my freshman year English teacher, who introduced me to the novel that most stimulates my intellectual curiosity: \u003cem\u003eA Tale of Two Cities \u003c/em\u003eby Charles Dickens. Every day, we took quizzes on minor details, and it was really confusing in the beginning. I was greeted with questions such as “What color was this character’s hat?” and “What image was one character knitting in one scene?” One day, my teacher explained that the details make the story what it is. Dickens was able to weave a story by using seemingly minute details that would come back in a big way. It took us no time at all to see that she was correct. The color of the character’s hat referred to his social standing, and the character’s tapestry ended up being a major plot point because of what she was knitting. Not only did this inspire me to be an intentional writer, but it also taught me a valuable lesson: life lives in the details.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"f4168bdc-bb35-4bc4-b7c0-948ab536cdfc\"}":{"__typename":"School","uuid":"f4168bdc-bb35-4bc4-b7c0-948ab536cdfc","name":"Duchesne Academy of the Sacred Heart","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77024"},"Education:{\"uuid\":\"bf6b2ec5-df0f-42e7-8d26-b7cc083d1b76\"}":{"__typename":"Education","uuid":"bf6b2ec5-df0f-42e7-8d26-b7cc083d1b76","school":{"__ref":"School:{\"uuid\":\"f4168bdc-bb35-4bc4-b7c0-948ab536cdfc\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"266e4202-cb12-4fa9-a583-87eb57a6baaf\"}":{"__typename":"Education","uuid":"266e4202-cb12-4fa9-a583-87eb57a6baaf","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Journalism, English","degree":null},"MentorPublicProfile:{\"uuid\":\"87988c83-9686-41dd-bda0-5ae3f1d20e32\"}":{"__typename":"MentorPublicProfile","uuid":"87988c83-9686-41dd-bda0-5ae3f1d20e32","displayName":"Halliday M.","slug":"halliday-mafrige","biography":"\u003cp\u003eHi! My name is Halliday, and I have always had a passion for storytelling! Whether it was writing my own books as a child or reporting for journalism stories in college, I have always found joy in using my language to paint a picture. I always find myself looking forward to each English or Journalism class, excited to either learn about or write stories. I also enjoy editing my work and trying to make it the best that it can be. I have found a real joy in editing and hope to one day be an editor! I love learning about and improving my writing because I know that I want to live my life pursuing the happiness a story brings me.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA bit more about me as a human is that I enjoy carrying my camera with me for impulse photos, taking long car drives with the windows down, and having intentionally horrible movie nights (we recently watched Attack of the Killer Tomatoes). Because I am a Texas girl, I love watching sports games in my free time and am a firm believer that college football is better than the NFL. I am also a proud Astros fan so apologies in advance to any Dodgers or Yankees fans. I also love fashion and have used it as personal expression for years. Fun fact: You can always tell what mood I am in based on my outfit!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI strongly believe in my ability to be a fantastic resource as a mentor--I've been doing it for my sister and her friends for years! I have experience in teaching English and am confident I can help you learn something new. I am also a creative person with a background in content creation, so I am great to bounce ideas off of. I have also worked through my fair share of troubles and will be particularly helpful for students with ADHD, anxiety, or struggling with perfectionism. I've been there and have come out on the other side--and now I have some fantastic tools in my toolbelt to help. Can't wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"8028QCz4bE49tHUHG7bT2hMsLe500BxEfrqu3J02JI6Ajs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"95d084a5-8d86-47fb-a074-043c03ae3dc3\"}"},{"__ref":"Favorites:{\"uuid\":\"1ddd7e70-9ee9-4e50-86fb-fe184acc646a\"}"},{"__ref":"Favorites:{\"uuid\":\"45c40997-2de6-46b0-b196-e9e6d1de1df5\"}"}],"causesSupported":[],"major":"Journalism, English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e7ac3c7c-5bd5-411f-af9b-d92110f89bed\"}"},{"__ref":"DeepDives:{\"uuid\":\"967465f7-94d6-41c8-b6b3-42e17f738286\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd035ea8-ce87-4ba7-919a-faf7f836cd51\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d6fa0737-d193-49dc-acfa-0db62cc72a7c/-/preview/-/format/jpg/","https://ucarecdn.com/92c56e89-fec6-4a73-9d9f-4633dac6deb8/-/preview/-/format/jpg/","https://ucarecdn.com/054969a3-b981-4f29-b3f9-36fdec25ec62/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"bf6b2ec5-df0f-42e7-8d26-b7cc083d1b76\"}"},{"__ref":"Education:{\"uuid\":\"266e4202-cb12-4fa9-a583-87eb57a6baaf\"}"}],"hiredAt":"2024-04-08T14:53:33.187Z","topics":["Writing","College Essay
