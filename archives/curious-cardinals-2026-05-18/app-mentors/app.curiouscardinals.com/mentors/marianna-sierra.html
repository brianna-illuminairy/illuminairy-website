xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"888520b2-24e6-4474-8e22-4f675fb97284\"}":{"__typename":"DeepDives","uuid":"888520b2-24e6-4474-8e22-4f675fb97284","content":"\u003cp\u003eWhen I was 13 years old, I moved to Lima, Peru with my mother and younger sister. Up until that point, I had been good at school, though I didn't necessarily know why. Then, all of the sudden, I was illiterate and felt no better than a babbling baby at my new school, where everything was in Spanish.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI went through a transformative process where I not only learned how to read, write, and speak in Spanish, but I also started to think about what goes into learning and how I could be more intentional about it. This was thanks to the wonderful mentor who stood by my side, despite the fact that I was a tremendously difficult teenage know-it-all who still hadn't accepted living in Lima. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy mentor inspired me to help students gain skills in English, both so I could cement my own skills in Spanish, and so I could share a the kind of confidence she gave. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, I've worked with students with tremendously different backgrounds. Frankly, I keep coming back because they inspire me: I learn from them, I enjoy helping them learn about themselves, and I especially love the game of helping someone see something differently. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"909a5e36-d0e8-4151-935f-79d7e3a3e56d\"}":{"__typename":"DeepDives","uuid":"909a5e36-d0e8-4151-935f-79d7e3a3e56d","content":"\u003cp\u003eGrowing up, I didn't have very much exposure to art. As I went through school, I always gravitated towards English and History, and when I applied to college, I was firmly convinced that my interest in analytical thinking plus my international background meant I had to study international relations. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThen, I got to Yale and ... I hated the major. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI went through a long period of figuring out what felt right: I revisited my love of history and decided it was my new major. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn a whim, I signed up for an interesting art history course called \"Humbugs and Visionaries: American Art until the Civil War.\" With an intriguing title, I went in with zero background, and I was instantly hooked. Over the span of the semester, my professor completely reshaped my relationship to art, and at times, to my own eyes. I began to look at works of art that had never appealed to me (think landscapes and portraits of the aristocracy), and was able to feel connected, to find meaning. Next thing I knew, I was looking at the trees and the sidewalks of New Haven differently. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter the class, I knew I wanted to spend the rest of my time at Yale pursuing that feeling, challenging my eyes to see more than they were accustomed to. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"be5811fc-96c9-4744-9a19-c5d50f7eb6ed\"}":{"__typename":"DeepDives","uuid":"be5811fc-96c9-4744-9a19-c5d50f7eb6ed","content":"\u003cp\u003eI enjoy finding new ways to get outside and stay active: I love playing tennis, hiking, surfing, cycling, running, and (embarrassingly) anything that will allow me to chase a ball like a dog. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also like experimenting in the kitchen, celebrating Shabbat, traveling, and making jokes. Bonus points if I get to do this alongside friends and/or strangers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"fe74cb71-57df-4a2d-a1cf-8a2323ff6349\"}":{"__typename":"School","uuid":"fe74cb71-57df-4a2d-a1cf-8a2323ff6349","name":"Western High School","city":"Davie","type":"HIGH","state":"Florida","country":"United States","zip":"33325"},"Education:{\"uuid\":\"edc44623-7b07-4a26-9dbd-83f11cde978a\"}":{"__typename":"Education","uuid":"edc44623-7b07-4a26-9dbd-83f11cde978a","school":{"__ref":"School:{\"uuid\":\"fe74cb71-57df-4a2d-a1cf-8a2323ff6349\"}"},"startYear":"2016","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a1e9679f-68f2-4cd1-aaf7-58fc2f550b5c\"}":{"__typename":"Education","uuid":"a1e9679f-68f2-4cd1-aaf7-58fc2f550b5c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"History of Art","degree":null},"Testimonial:e6766bb2-2701-4422-a5a0-1759501c77d8":{"__typename":"Testimonial","id":"e6766bb2-2701-4422-a5a0-1759501c77d8","text":"Marianna has been wonderful!","date":"2025-06-14 01:44:43.694+00","rating":4,"endorser":{"__typename":"Endorser","name":"Emma Stewart","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"d1efbbd7-ea0d-40fc-84b8-e1e2e762ed8f\"}":{"__typename":"MentorPublicProfile","uuid":"d1efbbd7-ea0d-40fc-84b8-e1e2e762ed8f","displayName":"Marianna S.","slug":"marianna-sierra","biography":"\u003cp\u003eHi there! My name is Marianna—\u0026nbsp;I recently graduated from Yale University with a B.A in Art History. In my year since graduating, I completed a Fulbright English Teaching Fellowship in La Rioja, Spain where I worked at the largest charter high school in the region as an English, Biology, and Technology teaching assistant for 90 seventh graders. And boy… did they teach me something!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI have mentored students of all grade levels for nearly ten years, in subjects as wide-ranging as Geometry, college essay writing, Spanish, and Biology. As someone who has been on both sides of the mentoring relationship, I have thought deeply about the flavor of mentorship I most believe in: to me, great mentorship revolves around \u003cstrong\u003etrust\u003c/strong\u003e and \u003cstrong\u003eprogress\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eBy centering \u003cstrong\u003etrust\u003c/strong\u003e in the relationships I build with the students I mentor, I want to create openness, which I believe is fundamental to the process of learning and growing. And I’m talking about a \u003cem\u003eno-limits\u003c/em\u003e type of openness, whether it’s the kind that allows you to drop assumptions and look at a painting differently than you knew you could, to take a math class you know will challenge you, or to speak earnestly about the emotions your personal essay has stirred within you. I've seen this kind of openness transform students I've mentored, helping them become more confident thinkers and doers, but it’s no easy task without a person you trust on your side. That’s my first job as a mentor.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eMy second job as a mentor is to follow through on that trust and deliver \u003cstrong\u003eprogress\u003c/strong\u003e. I ask you to follow me to a space that, at first, may seem uneasy: a space where you'll make mistakes, ask silly questions, and won’t have all the answers. Taking that risk \u003cem\u003eonly\u003c/em\u003e makes sense when you see rewards over time, and I am just as serious about helping my students reach their goals as I am about celebrating their victories, however big they may be.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eUltimately, there’s a lot of business that goes into learning how to learn. Finding the answers to questions as concrete as “how should I structure my time” to those as abstract as “how can I look at this problem with different eyes” come much easier when you have built a space to answer them with someone you trust. Let’s get busy!\u003c/p\u003e","teachingVideoPlaybackId":"gd7sm7WYR027z78W02wkL8CF5924JV9aVA1xJXCVv1M2I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History of Art","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"888520b2-24e6-4474-8e22-4f675fb97284\"}"},{"__ref":"DeepDives:{\"uuid\":\"909a5e36-d0e8-4151-935f-79d7e3a3e56d\"}"},{"__ref":"DeepDives:{\"uuid\":\"be5811fc-96c9-4744-9a19-c5d50f7eb6ed\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/62ffca69-3b6d-4951-ade6-d09e1963a596/-/preview/-/format/jpg/","https://ucarecdn.com/63dbbe8a-b35b-42d4-9867-d858949e9b20/-/preview/-/format/jpg/","https://ucarecdn.com/a97111ac-96f2-4e5f-b562-199560139633/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"edc44623-7b07-4a26-9dbd-83f11cde978a\"}"},{"__ref":"Education:{\"uuid\":\"a1e9679f-68f2-4cd1-aaf7-58fc2f550b5c\"}"}],"hiredAt":"2024-11-12T09:01:00.920Z","topics":["History Project","Film / Theater","K-5 Grade Math","Pre-Algebra","Geometry","Statistics","Biology","Chemistry","Writing","Spanish","Reading","College Essay Writing","Academic Coaching","Algebra I","6-8 Grade Science","Video / Photography","K-6 Storybook","Visual Arts / Graphic Design","Creative Writing","Algebra II","History","Executive Function"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[{"__ref":"Testimonial:e6766bb2-2701-4422-a5a0-1759501c77d8"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"marianna-sierra\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d1efbbd7-ea0d-40fc-84b8-e1e2e762ed8f\"}"}}},"_sentryTraceData":"7f078a84f1264e42af6fa480be13a4a9-872a11174072bf12-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7f078a84f1264e42af6fa480be13a4a9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"marianna-sierra"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden">
