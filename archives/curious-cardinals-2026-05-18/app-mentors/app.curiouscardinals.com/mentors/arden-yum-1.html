xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"72366b4c-93d2-4667-bebd-9817168ccd58\"}":{"__typename":"DeepDives","uuid":"72366b4c-93d2-4667-bebd-9817168ccd58","content":"\u003cp\u003eMy dream is to be a writer! I would love to publish novels, essay collections, and short stories. I also adore movies, and it would be awesome to try my hand at directing to adapt one of my books into a feature-length film.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"45263aee-be0d-4672-ae65-fd75a943bcdd\"}":{"__typename":"DeepDives","uuid":"45263aee-be0d-4672-ae65-fd75a943bcdd","content":"\u003cp\u003eI love reading, cooking, and walking around new neighborhoods in New York City. Recently, I have been rediscovering my passion for visual art. I found my old watercolors, oil pastels, and sketching pencils in my room and have spent whole days covering canvases with color. It's such a great way to practice relaxation, self-expression, and working with my hands!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"18da1d06-d3bb-462b-8b6c-a4a61b7fa012\"}":{"__typename":"DeepDives","uuid":"18da1d06-d3bb-462b-8b6c-a4a61b7fa012","content":"\u003cp\u003eI'm currently directing most of my energy toward my newsletter, Ad Hoc! It started in February 2024 as a way to write consistently, and in the last year and a half, my community has grown to over 10,000 subscribers. I have LOVED getting to write about anything from the rise of matcha, to the economic theory behind sports drafts, to friendship in college. I've gotten to meet so many incredible writers on the platform, too. Ad Hoc just might be my favorite passion project to date!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0d4bfd9c-6d43-439d-9510-951779fc260a\"}":{"__typename":"DeepDives","uuid":"0d4bfd9c-6d43-439d-9510-951779fc260a","content":"\u003cp\u003eI would tell myself that the way that you view yourself determines the way that other people will see you, so be assured and compassionate! I'd also tell her that her hard work will pay off, and that she should stay focused on the things that matter to her: writing, friendship, creating \u0026amp; connecting. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"5f41d4ea-47f9-4577-9143-b2b49b3baf15\"}":{"__typename":"School","uuid":"5f41d4ea-47f9-4577-9143-b2b49b3baf15","name":"Trinity SchooI","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10024"},"Education:{\"uuid\":\"cebee728-6459-44eb-84cf-218d1edd9db1\"}":{"__typename":"Education","uuid":"cebee728-6459-44eb-84cf-218d1edd9db1","school":{"__ref":"School:{\"uuid\":\"5f41d4ea-47f9-4577-9143-b2b49b3baf15\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"949493bc-9f7c-41d3-8578-dda06a5962c7\"}":{"__typename":"Education","uuid":"949493bc-9f7c-41d3-8578-dda06a5962c7","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"b91e48a8-f108-4ab2-88b5-6a66cfe378c4\"}":{"__typename":"MentorPublicProfile","uuid":"b91e48a8-f108-4ab2-88b5-6a66cfe378c4","displayName":"Arden Y.","slug":"arden-yum-1","biography":"\u003cp\u003eArden Yum is a recent graduate of Yale University, where she earned a degree in Cognitive Science with a focus on language, emotion, and culture. Her senior thesis explored how language shapes emotional expression across cultural contexts, reflecting her broader interest in how words shape world-perception and social connection.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn high school, Arden created The Peahce Project, a digital media platform spotlighting Asian American art and advocacy. She led a team of over 100 members and oversaw the production of 800+ multimedia pieces across web, podcast, and social media channels. The Peahce Project cemented her love for storytelling, creative collaboration, and community building. It taught her how important it is to surround yourself with smart, motivated, and kind-hearted people, and that with enough ambition and energy, it is possible to bring any idea to life.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003eAt Yale, Arden ran a micro-bakery called PLAY, hosting pop-ups and baking custom cakes for the student community. She also served on the Communications and Design team at the Asian American Cultural Center, taught computer science for Yale's largest introductory course, and contributed to several campus publications. In her senior spring, she wrote, produced, and directed a play with her best friend about sharing a dorm room together.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eArden is also the creator of Ad Hoc, a Substack newsletter with over 10,000 readers. Since February 2024, she has sent out a letter every Monday morning. Her writing blends personal reflection with cultural critique, covering topics from vocabulary building to digital existence. Through Substack, she has written for publications like \u003cem\u003ePersuasion\u003c/em\u003e and \u003cem\u003eThe New Critic\u003c/em\u003e, and partnered with brands such as Hinge and Brooklinen on newsletter campaigns. Ad Hoc has been an incredibly rewarding project in terms of sharpening her voice and finding people who resonate with her work.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAfter interning at a strategy consulting firm during her junior summer, Arden will return to the company full-time in January 2026. Until then, she is focused on writing, artmaking, and mentoring with Curious Cardinals. She’s especially excited to support students exploring writing, media, language, and identity—and believes that finding your voice is one of the most empowering parts of learning.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs a born-and-raised New Yorker, Arden loves spending afternoons in Central Park, running along the river, and finding the best bagel shops in the city. If she isn't reading or writing, you can find her whisking matcha, solving a crossword, walking around the MoMA or the MET museum, or decorating a pavlova (PLAY's most popular dessert order). She can't wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"z5RyXBA3tNml02pALRfui7NS7OUKel5PUuT9qhvTRUK4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"72366b4c-93d2-4667-bebd-9817168ccd58\"}"},{"__ref":"DeepDives:{\"uuid\":\"45263aee-be0d-4672-ae65-fd75a943bcdd\"}"},{"__ref":"DeepDives:{\"uuid\":\"18da1d06-d3bb-462b-8b6c-a4a61b7fa012\"}"},{"__ref":"DeepDives:{\"uuid\":\"0d4bfd9c-6d43-439d-9510-951779fc260a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8b582f09-dfa5-4541-963c-ca2486dda947/-/preview/-/format/jpg/","https://ucarecdn.com/709fe3d6-1a4e-404c-90b9-60e3fdd843a7/-/preview/-/format/jpg/","https://ucarecdn.com/a0ab1032-4126-4d14-95dc-14f3b2f73a61/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cebee728-6459-44eb-84cf-218d1edd9db1\"}"},{"__ref":"Education:{\"uuid\":\"949493bc-9f7c-41d3-8578-dda06a5962c7\"}"}],"hiredAt":"2025-08-05T02:41:21.868Z","topics":["Writing","College Essay Writing","Executive Function","Reading","Creative Writing","Video / Photography","Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"arden-yum-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b91e48a8-f108-4ab2-88b5-6a66cfe378c4\"}"}}},"_sentryTraceData":"403d3a7b9e1c414f86001cff7de113e9-8bdae7833b45200e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=403d3a7b9e1c414f86001cff7de113e9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page"
