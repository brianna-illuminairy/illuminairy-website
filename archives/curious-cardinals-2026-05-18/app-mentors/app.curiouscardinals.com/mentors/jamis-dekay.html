\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"eb306fb2-805f-4f01-9c8a-2359ed3e96c7\"}":{"__typename":"DeepDives","uuid":"eb306fb2-805f-4f01-9c8a-2359ed3e96c7","content":"\u003cp\u003eThere is no discipline, industry, lifestyle, or practice that cannot benefit from understanding the past.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"118ce07f-8196-4cdd-a99d-648a0d470792\"}":{"__typename":"School","uuid":"118ce07f-8196-4cdd-a99d-648a0d470792","name":"Campbell Hall","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91607"},"Education:{\"uuid\":\"b4422bc9-c5eb-423a-85d4-59b77711ea71\"}":{"__typename":"Education","uuid":"b4422bc9-c5eb-423a-85d4-59b77711ea71","school":{"__ref":"School:{\"uuid\":\"118ce07f-8196-4cdd-a99d-648a0d470792\"}"},"startYear":"2005","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"8a3b119c-ecde-472a-a7d3-972963392220\"}":{"__typename":"Education","uuid":"8a3b119c-ecde-472a-a7d3-972963392220","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"History (Politics, Law, and Govt.); Advanced French Language Certificate","degree":null},"MentorPublicProfile:{\"uuid\":\"cef86efc-bc09-44a7-a0de-6d80eaf58933\"}":{"__typename":"MentorPublicProfile","uuid":"cef86efc-bc09-44a7-a0de-6d80eaf58933","displayName":"Jamis D.","slug":"jamis-dekay","biography":"\u003cp\u003eHi, I'm Jamis! I joined Curious Cardinals because I admire their commitment to fostering students' diverse interests. My academic journey has been shaped by a love for language, history, and storytelling—I’ve studied and translated French, earned a bachelor's degree in political history, and taught creative writing to students of all ages.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in Los Angeles, surrounded by the arts, spending my free time playing guitar and chasing my dream of playing college baseball. That dream led me to Yale, where I was a four-year varsity catcher, but not before I spent time in Toulouse, France, translating subtitles for local film festivals. Yale gave me a strong foundation in history, while my work with \u003cem\u003eWritten Out Loud\u003c/em\u003e, a Connecticut-based program, sparked my passion for teaching creative writing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, music and baseball have been central to my life. At Yale, I balanced athletics with the arts, performing with \u003cem\u003eTangled Up In Blue\u003c/em\u003e, the university’s premier folk group. After graduating, I entered the music industry, working at an LA-based management company where I managed rock bands and DJs on nationwide tours. In January 2025, I shifted my focus to my own artist project, recording an album and performing at top venues across Brooklyn and Manhattan.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurious Cardinals has given me the opportunity to bring my varied passions into a structured mentorship environment. I’m excited to share my experiences and knowledge with the next generation of curious, multi-talented students!\u003c/p\u003e","teachingVideoPlaybackId":"isfeSY2Bj4WhtOsYvd01M33Af22t17zmdAmCOld2km02s","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History (Politics, Law, and Govt.); Advanced French Language Certificate","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"701f933c-bfa6-447f-a4f1-05dd097e41ec\
