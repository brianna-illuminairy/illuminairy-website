xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"baf5e276-ae18-4e56-9e27-5c5ee48c2afb\"}":{"__typename":"DeepDives","uuid":"baf5e276-ae18-4e56-9e27-5c5ee48c2afb","content":"\u003cp\u003eI would tell my younger self to be more explorative! I should have tried hobbies such as pottery, 3D art, electronic music making, or investing. The advantage of being so young is that you have so much time to try new things and see what you like. The worst thing that happens is that you fail, and even then you would be better at that skill than if you had never done it before. Trying different things can also lead you to strengthen existing interests, such as learning 3D art would help with computer game animation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cb326af9-d2ff-412e-9ac9-8a142b7b677c\"}":{"__typename":"DeepDives","uuid":"cb326af9-d2ff-412e-9ac9-8a142b7b677c","content":"\u003cp\u003eI love to play sports and cooking. I've been playing soccer since I was 5, am currently on the club basketball team in college, and training to run a half-marathon in March! I also love experimenting in the kitchen. My sister and I make unique ice cream flavors, like maple sea salt pecan and pistachio cheesecake, as well as homemade pizzas such as Margherita and Thai chicken. We have also been trying to cook an international dish from every country. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"765917e7-5a27-4898-8e09-5e9f0dd1493c\"}":{"__typename":"DeepDives","uuid":"765917e7-5a27-4898-8e09-5e9f0dd1493c","content":"\u003cp\u003eAs a high school student, I was very focused on grades. I had my consistent extracurriculars such as club soccer, school soccer, and Website Design lead at a coding nonprofit, but I was primarily focused on school. I had a difficult time making friends initially, since my freshman year was online, but through soccer and being more outgoing in my classes, I was able to form a community by senior year. I was a good participant in most of my classes, and with my favorite teachers, I would talk to them after class and learn more about their experiences and life outside the classroom.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"fbc7bd23-0391-4c6c-a13c-1f67825e501a\"}":{"__typename":"DeepDives","uuid":"fbc7bd23-0391-4c6c-a13c-1f67825e501a","content":"\u003cp\u003eIn my freshman summer, I took a supplementary physics class to prepare for AP Physics C sophomore year but I primarily just enjoyed it. In sophomore year, I attended the Berkeley Computer Science Academy camp, a two-week program that covered the first-semester content of Berkeley’s introductory computer science course. I then spend a month at COSMOS learning how to build video games in Unity. That was a very unique experience and fostered my love for video game design. In my junior year summer, I was doing a remote internship at the data science company Zettabolt Technologies, where I was using graph algorithms to detect fraud in credit card transactions. It was a valuable learning experience, since I had never worked with graphs or big data before. In my senior year summer, I savored every last minute of it, hanging out with my friends, doing diamond art, cooking, and working out. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"85d4b1aa-d23e-4948-8ba8-703233ac5ac8\"}":{"__typename":"School","uuid":"85d4b1aa-d23e-4948-8ba8-703233ac5ac8","name":"Evergreen Valley High School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95148"},"Education:{\"uuid\":\"95046b41-a9c5-4dc5-ad57-2e835fc0b79d\"}":{"__typename":"Education","uuid":"95046b41-a9c5-4dc5-ad57-2e835fc0b79d","school":{"__ref":"School:{\"uuid\":\"85d4b1aa-d23e-4948-8ba8-703233ac5ac8\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"2c94ade9-9566-4f49-9b73-862f9bbd7870\"}":{"__typename":"Education","uuid":"2c94ade9-9566-4f49-9b73-862f9bbd7870","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer and Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"cbca7de9-0085-40c4-97e7-0d0b5b7cdd26\"}":{"__typename":"MentorPublicProfile","uuid":"cbca7de9-0085-40c4-97e7-0d0b5b7cdd26","displayName":"Shrishti R.","slug":"shrishti-roy","biography":"\u003cp\u003eHi, I’m Shrishti, an engineering student at the University of Pennsylvania studying Computer Science and minoring in Math. I was a huge Apple fan growing up, learning the chip design and features of every new iPhone, which kept me curious about how to optimize the most recent technologies, especially now with AI. That curiosity is what led me to pursue computer science and has shaped the way I approach both learning and teaching. Professionally, I am doing research at Penn on Agentic AI and have worked as an AI DevOps intern at AMD. I enjoy taking complex ideas and breaking them down into small pieces, whether that is in code, research, or teaching.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI teach STEM subjects and AP courses and have extensive experience in Computer Science (Python, Java, Web Development), Physics, and all levels of Math, including K–8 Math, Geometry, Pre-Algebra, Algebra I, Algebra II, Calculus, and Trigonometry. My approach is to start small and break problems down to make them feel less intimidating. I believe that anyone can learn anything with enough time and dedication, which is the mindset I bring to Curious Cardinals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in the Bay Area, I have always been surrounded by innovation, which motivated me to create on my own. I love playing video games like Valorant or NBA 2K, but also developing them. At Penn, I am part of the game design club, where we create multiplayer games in Unity, including projects like an animal-themed tank game. Outside of video games, my favorite activities are sports. I have been playing soccer since I was five, am on the club basketball team in college, and love watching the NBA. Go Warriors! When I want a creative break, I turn to cooking and baking. My sister and I love experimenting with new recipes, from cooking international dishes to inventing our own ice cream flavors.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Curious Cardinals, I hope to be more than just a tutor. My goal is to be a mentor who helps students grow academically while also learning how to work hard, stay motivated, and believe in their own abilities. I’m excited to support students wherever they are in their learning journey and help them build skills that last far beyond the classroom. Feel free to reach out!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"wh0175sPHpWzUKSkTR2N01JSmLsRtkjHmZ01NaTbwl6pww","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer and Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"baf5e276-ae18-4e56-9e27-5c5ee48c2afb\"}"},{"__ref":"DeepDives:{\"uuid\":\"cb326af9-d2ff-412e-9ac9-8a142b7b677c\"}"},{"__ref":"DeepDives:{\"uuid\":\"765917e7-5a27-4898-8e09-5e9f0dd1493c\"}"},{"__ref":"DeepDives:{\"uuid\":\"fbc7bd23-0391-4c6c-a13c-1f67825e501a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/22bbd0a4-5ae7-49d6-8fb6-7a0060f5049a/-/preview/-/format/jpg/","https://ucarecdn.com/d1cbb0c8-2ae9-4632-9f0e-e0017a6637c6/-/preview/-/format/jpg/","https://ucarecdn.com/fd88ce7f-0ae1-492d-bc61-9c292dc7f6f1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"95046b41-a9c5-4dc5-ad57-2e835fc0b79d\"}"},{"__ref":"Education:{\"uuid\":\"2c94ade9-9566-4f49-9b73-862f9bbd7870\"}"}],"hiredAt":"2026-01-11T16:57:57.284Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Physics","Spanish","Academic Coaching","Computer Science","Economics","Executive Function"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":
