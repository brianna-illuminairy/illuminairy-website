xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"4beef797-7242-463b-896d-e547439842dd\"}":{"__typename":"DeepDives","uuid":"4beef797-7242-463b-896d-e547439842dd","content":"\u003cp\u003eConstantly adapting to new environments made me observe how people’s unique experiences shaped their perspective and behaviors. I noticed patterns: organizing these personalities and mindsets into groups informed how I problem-solved. Growing up in an entrepreneurial family reinforced this habit. At the dining table, I learned to listen beyond what people say they want and uncover the deeper reasons why. I carried this insight into running my Code Ninjas franchise, where I turned a loss-making business profitable within a year. I invited parents to share frustrations and aspirations, then I reframed those into narratives where Code Ninjas was the bridge between their child’s current state and what they wanted them to be. I introduced reward systems as a feedback loop where kids presented projects to peers and parents. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese presentations reframed Code Ninjas as more than coding—it was a place to grow communication, leadership, and social skills, the qualities parents most valued. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I want to bring a lens of crafting educational experiences that resonate deeply across both students and parents, making learning feel meaningful. I believe the future of education lies in helping people understand their identity and aspirations, and in designing experiences where they feel truly seen for it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"d7460a6c-0de0-4346-a24d-1bb82f671fcf\"}":{"__typename":"DeepDives","uuid":"d7460a6c-0de0-4346-a24d-1bb82f671fcf","content":"\u003cp\u003eWhen I co-founded RoomReach, a student housing startup, I realized solving a real pain point wasn’t enough—we needed visibility. With no marketing background, I learned through experimentation. I studied how students consumed content, built a consistent posting schedule, partnered with campus creators, and ran A/B tests. Coffee chats with influencers taught me that relatability drives virality, so I focused on authentic, funny content like landlords telling roommate horror stories. This strategy grew our reach to ~250,000 monthly impressions across TikTok and Instagram.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also tapped into existing campus networks by partnering with the school newspaper, gaining access to their 1M monthly visitors and positioning RoomReach as their official digital housing guide. Through this, I learned that effective marketing combines creativity, user psychology, and the reach of existing networks through mutually beneficial partnerships, skills I now apply in marketing my own small business.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"409ce06b-ba04-4aae-bd79-8fbfe140fee3\"}":{"__typename":"DeepDives","uuid":"409ce06b-ba04-4aae-bd79-8fbfe140fee3","content":"\u003cp\u003eI’ve always thought in two languages: the precision of systems and the complexity of people. Early on I leaned technical, but during a high school internship—building a wireless tongue-touch interface for a quadriplegic Harvard student—I realized real impact comes from stretching systems to fit the messy realities of human lives. That’s what draws me to product management.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, I’ve built GenAI products, co-founded a student housing startup, and ran my own coding center, blending technical expertise with entrepreneurial instinct. Most recently at Shield AI, I finished my project in three weeks, then carved out my own path by interviewing stakeholders, uncovering pain points, and building an AI-powered mission planner that cut planning time from hours to minutes and helped close Korea as a customer. That experience cemented my passion for acting as a “mini-CEO,” shaping direction in uncertainty while driving results.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy belief in AI as the next general-purpose interface, streamlining processes and improving human life with hyper-personalization, represents the intersection of cognitive science, tech, and business that excites me. I hope to leverage my skills with tech and entrepreneurship to deliver delightful experiences for people in this new age of intelligence we've entered.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c5457657-0f8f-480e-8179-5614fd19b96e\"}":{"__typename":"DeepDives","uuid":"c5457657-0f8f-480e-8179-5614fd19b96e","content":"\u003cp\u003e\u003cu\u003eToday’s weather\u003c/u\u003e: Clear skies (no clouds)\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cu\u003eInstructions\u003c/u\u003e:\u0026nbsp;\u003c/p\u003e\u003cp\u003e1. \u0026nbsp; \u0026nbsp; Set a timer to 1 hour\u003c/p\u003e\u003cp\u003e2. \u0026nbsp; \u0026nbsp;Begin teleportation - look through the eyepiece of the Celestron Telescope\u003c/p\u003e\u003cp\u003eI’m thrust into the cosmos full of star clusters, planets and their moons, nebulas, and deep-sky galaxies. As I scan through each degree of my vision, I am excited by the endless paths I can journey on.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince light takes millions of years to reach earth from distant stars, the opportunity to view the cosmos even before humans ever existed is exhilarating. Sometimes, I bask in the beauty of the glowing gases in the Orion Nebula, or in the sparkling brilliance of the Pleiades star cluster. Other times, I spacewalk on our earth’s moon, exploring the Copernicus and Tycho craters while pondering the feasibility of an American moon base. Very often, I entertain myself with contemplation over the possibilities of life on Europa - one of Jupiter's largest moons.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut, what I long for is to propel myself within the proximity of a Pulsar – a highly compact and magnetized rotating star which emits light, acting like a lighthouse of the skies. It’s perfect light beam intervals make it the most accurate time source in the cosmos.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy alarm rings and I’m thrown back into my backyard, refreshed. As I lie in bed with space images locked in my head, I look forward to another night with a clear sky to continue exploring new and colorful phenomena adorning the celestial canvas.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"7b4aa5f5-3ea7-4f50-ae34-8bb086ca5b36\"}":{"__typename":"School","uuid":"7b4aa5f5-3ea7-4f50-ae34-8bb086ca5b36","name":"West Windsor-Plainsboro High School North","city":"Plainsboro Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08536"},"Education:{\"uuid\":\"63b8ac66-cf46-4afa-a3c4-dd489883ff04\"}":{"__typename":"Education","uuid":"63b8ac66-cf46-4afa-a3c4-dd489883ff04","school":{"__ref":"School:{\"uuid\":\"7b4aa5f5-3ea7-4f50-ae34-8bb086ca5b36\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"f9bcd389-9161-4a14-878a-7118f5891901\"}":{"__typename":"School","uuid":"f9bcd389-9161-4a14-878a-7118f5891901","name":"University of Illinois Urbana-Champaign","city":"Champaign","type":"COLLEGE","state":"Illinois","country":"United States","zip":"61820"},"Education:{\"uuid\":\"e1da2d68-3a8f-454f-bb3a-58f3cd842fed\"}":{"__typename":"Education","uuid":"e1da2d68-3a8f-454f-bb3a-58f3cd842fed","school":{"__ref":"School:{\"uuid\":\"f9bcd389-9161-4a14-878a-7118f5891901\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d72c5852-e1b2-433b-aac8-572c8c24de9d\"}":{"__typename":"MentorPublicProfile","uuid":"d72c5852-e1b2-433b-aac8-572c8c24de9d","displayName":"Ethan P.","slug":"ethan-pereira","biography":"\u003cp\u003eHi! I’m Ethan, a pilot, engineer, and business owner who loves turning curiosity into real-world projects. I learn best by building things, breaking them, fixing them, and figuring out how they can be better. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up between the U.S. and India, which shaped how I see the world early on. Being exposed to different cultures made me more adaptable and curious, and it pushed me to ask better questions about how people live and solve problems. I love traveling and experiencing new places, and my favorite city is Prague because of its history, architecture, and creative energy. Stepping outside your comfort zone, whether through travel or learning something new, is where I felt I grew the most.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I became a private pilot, which sparked a deep interest in aerospace and engineering. I also worked at an aircraft mechanic shop rebuilding plane engines, where I learned how complex systems work in the real world. I started college studying aerospace engineering, then switched into computer engineering after realizing how powerful software and AI can be in shaping the future and improving human lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat path led me to work on AI and autonomy systems at Blue Origin and later at Shield AI. At Shield AI, I helped build an AI intelligent mission planning assistant designed to help military leaders make better decisions in complex environments. That experience made me especially excited about working on AI applications that have a real and meaningful impact on people’s lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always enjoyed personal projects alongside school and work. One of my favorites was building an autonomous drone that could fly on its own, perform flips and aerial tricks, recover mid-air, and even water my garden using complex control software. I’ve also built startups, including a student housing platform focused on increasing price transparency for students.\u003c/p\u003e\u003cp\u003eI currently own and operate a Code Ninjas center, where the focus is helping kids build confidence through creativity. By emphasizing empathy, communication, and making learning genuinely fun, the center has won awards as a top 10 earning location two years in a row.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I focus on passion projects because that’s where students discover who they are. Whether a student is interested in technology, business, or something entirely new, my goal is to help them explore their interests, build confidence, and enjoy learning by creating things they are genuinely excited about.\u003c/p\u003e","teachingVideoPlaybackId":"TCM6CFnzUwL8AWr4VxG2TWt4GHQwHL63bKIf6S7inQI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4beef797-7242-463b-896d-e547439842dd\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7460a6c-0de0-4346-a24d-1bb82f671fcf\"}"},{"__ref":"DeepDives:{\"uuid\":\"409ce06b-ba04-4aae-bd79-8fbfe140fee3\"}"},{"__ref":"DeepDives:{\"uuid\":\"c5457657-0f8f-480e-8179-5614fd19b96e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/457fa2cd-f65d-445d-93ac-366bbc5d10ed/-/preview/-/format/jpg/","https://ucarecdn.com/031b0a6a-af5d-43f9-96c2-04b4f63f8dc3/-/preview/-/format/jpg/","https://ucarecdn.com/ef9a2d83-a933-4bb3-bed3-c84f9ce6a432/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"63b8ac66-cf46-4afa-a3c4-dd489883ff04\"}"},{"__ref":"Education:{\"uuid\":\"e1da2d68-3a8f-454f-bb3a-58f3cd842fed\"}"}],"hiredAt":"2025-12-15T19:00:21.551Z","topics":["Business / Entrepreneurship","Finance / Investing","Coding / Programming","Aviation / Aerospace","Machine Learning / AI","Robotics / Electronics / CAD"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ethan-pereira\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d72c5852-e1b2-433b-aac8-572c8c24de9d\"}"}}},"_sentryTraceData":"1a4bca5dc6f64afd8d5f46f148256bec-91636a170f7db5b7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1a4bca5dc6f64afd8d5f46f148256bec,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ethan-pereira"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFal
