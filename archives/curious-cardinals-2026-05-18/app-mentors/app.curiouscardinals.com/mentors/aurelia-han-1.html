y and CityStep, an organization dedicated to working with local students through social and arts impact. She also worked as a research assistant for a Harvard Business School lab headed by Professor Ting Zhang that focused on effective mentorship and leadership. Originally from Dallas, TX, Aurelia also attended The Hockaday School and took AP classes in World History, U.S. History, Spanish, English Literature, Mathematics, and more.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eDuring the 2020-2021 school year, Aurelia took a gap year and worked as an intern at a real estate private equity firm. She also completed various finance internships during her college summers and will return as an analyst at Alpine Investors, a private equity firm based in San Francisco, in the fall of 2023.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eIn her free time, Aurelia loves to run and is always looking to train for her next marathon. She also loves to bake, often helping out with Cades Cakes, a custom cake business started by friends in Dallas. Aurelia has also participated in mentorship programs since high school, assisting students in areas including English writing, math, history, and the college application process.\u003c/p\u003e","teachingVideoPlaybackId":"ecVM22G9LICXxCgDPK25vu4WWWl600IY00kP3CmXryHA00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Social Studies, East Asian Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6984b3a1-4802-4f5e-ac03-16ad72ddb234\"}"},{"__ref":"DeepDives:{\"uuid\":\"49cf9410-ead5-49bc-ab6a-e8bb96a5c4b6\"}"},{"__ref":"DeepDives:{\"uuid\":\"15b130a4-9c76-4dc3-8b9d-0d079e22c33c\"}"},{"__ref":"DeepDives:{\"uuid\":\"393a659d-d51b-414b-813c-0e251e291f59\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7020f66c-fb0c-4b94-a72c-43cc44be6161/-/preview/-/format/jpg/","https://ucarecdn.com/91e6dc8a-bfd9-4d3f-ad44-7e47be7ebcbf/-/preview/-/format/jpg/","https://ucarecdn.com
