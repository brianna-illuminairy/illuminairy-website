xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6a455f7c-6c8a-4be9-86fe-c02dcd72daef\"}":{"__typename":"DeepDives","uuid":"6a455f7c-6c8a-4be9-86fe-c02dcd72daef","content":"\u003cp\u003eGrowing up in a rigorous school environment, I often felt the need for someone older to look up to and ask questions to. As the oldest sibling in my family, I never had an older sibling to turn to for guidance. In high school, I found a mentor - a girl who has very similar interests in both a personal and professional way- and she became my unofficial mentor. This experience helped me realize how important it is to have someone to look up up. Eventually, I began mentoring and tutoring younger students, experiencing what it was like to be on the other side and offer support. Both of these experiences showed me the true value of mentorship and how meaningful it is to find a mentor in your life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"af103640-46fd-4323-960c-7f0414801b21\"}":{"__typename":"DeepDives","uuid":"af103640-46fd-4323-960c-7f0414801b21","content":"\u003cp\u003eI chose to major in Economics because I've always been fascinated by how the world works and how people make decisions. I think it is so interesting seeing how markets function and how policies shape outcomes in everyday life. Economics is a great intersection between real-world impact and analytical thinking. I am gaining the tools to understand how big-picture systems affect individual behavior and consumer choices. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love how Economics is about human behavior and how to make the most of limited resources in the world. I am encouraged to think critically and solve data-driven problems, all very valuable skills to take with me after college. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5aff640b-bb9d-4a63-90f0-542b00ca2460\"}":{"__typename":"DeepDives","uuid":"5aff640b-bb9d-4a63-90f0-542b00ca2460","content":"\u003cp\u003eI spent my summers in high school in two very different ways. The first two years of high school, I continued going to summer camp. I have been attending the same 7-week sleep away camp since I was 8 years old, so I continued going until I was 15. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter that, I shifted my focus to non-profits. I wanted to gain hands on experience helping others while also learning about how businesses run. I interned at the Alzheimer's Foundation of America, where I worked with dementia patients and in the office. I was able to create recreational activities to do with the patients, allowing them to have some positive experiences throughout the day. I also worked in the office, where I really got to collaborate with others and see how the behind the scenes work happened. The next summer, I interned at Baby2Baby, where I volunteered and worked in the office as well. This taught me more about giving back, while also learning how to run a business and conduct corporate calls and presentations.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"ae080941-13a5-45e5-8547-fcec8a3f4995\"}":{"__typename":"DeepDives","uuid":"ae080941-13a5-45e5-8547-fcec8a3f4995","content":"\u003cp\u003eIn middle school, I was definitely on the quieter side. I was shy and often found myself observing rather than jumping into conversations. I did not always feel confident to speak up or take the lead.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHowever, in high school this all started to change. I began stepping out of my comfort zone - joining clubs, taking on leadership roles, and building stronger relationships with my peers and teachers. As I got more involved, I gained a lot more confidence in myself as a person and my abilities. This was a really valuable time for me, showing me who I really was and shaping who I am today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"be122fc4-dcc7-46d5-97e7-786a8bd73446\"}":{"__typename":"School","uuid":"be122fc4-dcc7-46d5-97e7-786a8bd73446","name":"Brentwood School, East Campus","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90049"},"Education:{\"uuid\":\"2d9e84a5-3af0-4e89-a004-d0568c2f810a\"}":{"__typename":"Education","uuid":"2d9e84a5-3af0-4e89-a004-d0568c2f810a","school":{"__ref":"School:{\"uuid\":\"be122fc4-dcc7-46d5-97e7-786a8bd73446\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}":{"__typename":"School","uuid":"9a91466f-187b-4e9b-8a98-c02cef7bf621","name":"University of Michigan","city":"Ann Arbor","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48109"},"Education:{\"uuid\":\"97f43773-6500-4632-8761-064fcb197a5c\"}":{"__typename":"Education","uuid":"97f43773-6500-4632-8761-064fcb197a5c","school":{"__ref":"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"f76e2cd8-2b9b-45f0-a69d-324f3807c1d8\"}":{"__typename":"MentorPublicProfile","uuid":"f76e2cd8-2b9b-45f0-a69d-324f3807c1d8","displayName":"Ella T.","slug":"ella-teich","biography":"\u003cp\u003eHi, I'm Ella! I'm a sophomore at the University of Michigan studying Economics. I am involved in many business organizations across campus, including TAMID Group and Michigan Business Women. These organizations focus on connecting like-minded students interested in business careers, and they emphasize the importance of collaboration and dedication. In TAMID, we consult with Israeli startups and pitch a variety of stocks. In Michigan Business Women, I found a group of other women interested in finance, allowing me to connect with other women in such a male-dominated field. I love finding new collaborative approaches to solving problems and real situations in the world around me and working with others. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also love spending time with my friends and family, playing tennis, or going for runs. I am currently training for the Half Marathon. I also have a younger sister and a dog. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am here to make the stress of school and work feel manageable and less stressful. I am so excited to get started and work on your personal and professional goals to make sure you succeed!\u003c/p\u003e","teachingVideoPlaybackId":"h9pYMaapaOve9qhvj00Xri5lIF6k2tJRI2a7019GoYmMs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"majo
