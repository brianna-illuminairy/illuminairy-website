xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1e323cb5-9e4e-4978-b6cb-7768c3e6b73c\"}":{"__typename":"Favorites","uuid":"1e323cb5-9e4e-4978-b6cb-7768c3e6b73c","photoUrl":"https://ucarecdn.com/7f26803d-bdea-4408-8e43-e557b4d62cef/","title":"Los Angeles Kings","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"09ad2d88-17e7-46f4-9851-4ecb8dc8c366\"}":{"__typename":"DeepDives","uuid":"09ad2d88-17e7-46f4-9851-4ecb8dc8c366","content":"\u003cp\u003eThe motivation you can create within yourself is the most effective and lasting type of motivation. While competition with others is great, there is no greater feeling than making progress towards a goal you set for yourself. I get the most excited for something when I am motivating myself to do it. The reward from this feeling is unmatched\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1275412a-5951-4cda-82dd-74fc8f0526aa\"}":{"__typename":"DeepDives","uuid":"1275412a-5951-4cda-82dd-74fc8f0526aa","content":"\u003cp\u003eTake more risks and continue to be curious. Life is not only more entertaining, but gets better when you are not afraid to trip up, make mistakes, and take risks to better yourself. I look back and see that the few risks I took are the reason I am who I am today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6cd4240c-e4a0-46b2-bee9-bd2b374aa0f3\"}":{"__typename":"DeepDives","uuid":"6cd4240c-e4a0-46b2-bee9-bd2b374aa0f3","content":"\u003cp\u003eI come from a large family of engineers, but I knew I wanted to continue to explore how to problem solve analytically for a variety of different applications. My minors in Mathematics and Engineering Entrepreneurship allow be to see how data-driven thinking is impacting so many different industries. My specialization in Systems Engineering is in Probability, Optimization, and mathematical modeling through computer science. While it is tough work at times, it is extremely rewarding and continues to keep me interest in diving deeper.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"340470f7-e980-4192-bf08-f32fbb9be174\"}":{"__typename":"DeepDives","uuid":"340470f7-e980-4192-bf08-f32fbb9be174","content":"\u003cp\u003eCurrently my new fixation is been making sourdough bread. My mom started baking bread when I was back home and got me hooked. While I am looking to expand into more extravagant recipes soon, I'm trying to build a consistent basis of good sourdough bread. The smell of the bread as it bakes is a nice plus as well!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"bb26b8df-d74d-4e6b-a733-7ebf69ff9c59\"}":{"__typename":"School","uuid":"bb26b8df-d74d-4e6b-a733-7ebf69ff9c59","name":"Groton School","city":"Groton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01450"},"Education:{\"uuid\":\"8e4c0d87-88b2-44a4-9f8c-5fe3f443b8e6\"}":{"__typename":"Education","uuid":"8e4c0d87-88b2-44a4-9f8c-5fe3f443b8e6","school":{"__ref":"School:{\"uuid\":\"bb26b8df-d74d-4e6b-a733-7ebf69ff9c59\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"be63df20-bf11-4952-af3b-603aaf700a80\"}":{"__typename":"Education","uuid":"be63df20-bf11-4952-af3b-603aaf700a80","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Systems Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"3d4aae70-a647-4e17-a69b-937074f13def\"}":{"__typename":"MentorPublicProfile","uuid":"3d4aae70-a647-4e17-a69b-937074f13def","displayName":"Aidan A.","slug":"aidan-armaly","biography":"\u003cp\u003eHey! My name is Aidan Armaly, and I'm a rising senior at the University of Pennsylvania studying Systems Engineering, with minors in Mathematics and Engineering Entrepreneurship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOriginally from Los Angeles, California I headed east to Boston for boarding school to pursue my hockey and strong academics. Along the way, I have been fortunate enough to find strong mentors that shaped many of my values today. Leaning on the help of amazing mentors is what has made me a better person across the board.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile my academic focus is in STEM, some of the most valuable lessons I've learned have come from mentors who've guided me beyond the classroom—covering everything from leadership skills to learning responsibility. I have prior experience tutoring math topics in-person and via zoom through high school and college. I also continue to advising middle and high school students in preparation in taking the SSAT, the SAT equivalent to applying to boarding school, taking interviews, and writing application essays.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough I still love catching a good hockey game, these days I am normally exploring new cities, finding cool thrift stores, cooking up new recipes, or staying active through fitness.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm excited to give back to everyone who has helped me by sharing my experiences and insights with you. Looking forward to meeting and supporting you soon! Feel free to reach out about anything!\u003c/p\u003e","teachingVideoPlaybackId":"gg1FIOOwYXv01zQeitRbsoe3Q4tNu5qhSIXuoOJK86D00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1e323cb5-9e4e-4978-b6cb-7768c3e6b73c\"}"}],"causesSupported":[],"major":"Systems Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"09ad2d88-17e7-46f4-9851-4ecb8dc8c366\"}"},{"__ref":"DeepDives:{\"uuid\":\"1275412a-5951-4cda-82dd-74fc8f0526aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"6cd4240c-e4a0-46b2-bee9-bd2b374aa0f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"340470f7-e980-4192-bf08-f32fbb9be174\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c2500b93-5b1f-4244-9bd5-fa6348513230/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8e4c0d87-88b2-44a4-9f8c-5fe3f443b8e6\"}"},{"__ref":"Education:{\"uuid\":\"be63df20-bf11-4952-af3b-603aaf700a80\"}"}],"hiredAt":"2025-04-23T09:34:25.207Z","topics":["Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Statistics","Physics","Academic Coaching","Executive Function","Economics","Computer Science","Business / Entrepreneurship","F
