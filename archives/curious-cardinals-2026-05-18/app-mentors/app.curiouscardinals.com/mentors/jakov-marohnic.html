xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"ecb9e790-3b49-4ecf-b930-7d3108ac311b\"}":{"__typename":"DeepDives","uuid":"ecb9e790-3b49-4ecf-b930-7d3108ac311b","content":"\u003cp\u003eBeing from another country, learning English was a crucial part of my first few months in America. I remember times in school when I was very confused at what was going on in school, but my teachers and classmates were patient enough to try to explain things with pictures and gestures. While this patience might not seem significant, it went a long way for me. Now, I apply this to whenever I'm teaching a person something new. Struggling is a part of the learning process, but patience is what pushes that struggle into progress. The worst thing you can do is be impatient with someone when they're struggling and just give them the answer. This undermines their learning process and takes away their confidence. Instead, what I try to do is guide students towards the right answer by asking them questions and being patient until they find the answer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"26104295-b173-4138-b323-c779ee1d9de4\"}":{"__typename":"DeepDives","uuid":"26104295-b173-4138-b323-c779ee1d9de4","content":"\u003cp\u003eI spent my high school summers trying to combine time with my friends with something that will help me professionally. I ended up working at the local surf shop near where I usually spent my summers. I did this for almost every summer in high school, and it was an amazing experience. While working there, I was tasked with managing all the surf equipment and collaborating with the instructors to set up surf lesson schedules that worked for them. This was the first time that I had real responsibility outside of school, and it taught me valuable lessons in accountability and time management. Not only did I learn some valuable lessons, but I got to do so on sunny summer days at the beach surrounded by my friends!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5277a125-a59a-4672-98ac-b67f6ce4c7d1\"}":{"__typename":"DeepDives","uuid":"5277a125-a59a-4672-98ac-b67f6ce4c7d1","content":"\u003cp\u003eI grew up with a very \"outdoorsy\" childhood, so I learned to love all kinds of outdoor activities. My favorite sport is soccer, but I also love skiing, surfing, mountain biking, and hiking. I love playing sports in my free time because I find that it's a great way to destress from my everyday academic and professional life. I always make sure to have time during the week that's dedicated to being active. Even if it's just for an hour a day, it puts a smile on my face and helps me be more productive in other aspects of my life. If you have any sports that you're passionate about I'd love to hear all about them!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"c8a64f41-3b64-4d75-b9bc-9fe0c2573b7f\"}":{"__typename":"DeepDives","uuid":"c8a64f41-3b64-4d75-b9bc-9fe0c2573b7f","content":"\u003cp\u003eMy greatest role model is my dad. I look up to him because he came from a modest background and built everything we have today, all while raising a family with my mom. He grew up in socialist Yugoslavia, and when the country broke apart, his family was left with very little. He went on to leave home in order get an education in computer science and eventually started his own company. Later on, my family moved to New York, and I got to grow up with many opportunities which all came directly from his hard work. One of the lessons that he taught me which stuck with me was the importance of consistency. He would always say that if you set your mind on something, and worked on it for even just 15 minutes a day, over the course of several years, those 15 minutes each day would stack up. Soon you would find yourself so far ahead of the rest of the field, that no matter how much time people started investing into that goal, it'd be too late for them to catch up. It's never too early to get started on your ambitions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"bf0b5064-b913-446d-b59a-f9530655426c\"}":{"__typename":"School","uuid":"bf0b5064-b913-446d-b59a-f9530655426c","name":"LREI- High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10014"},"Education:{\"uuid\":\"0392fbe1-7d98-4e54-8c75-50b7166c0b41\"}":{"__typename":"Education","uuid":"0392fbe1-7d98-4e54-8c75-50b7166c0b41","school":{"__ref":"School:{\"uuid\":\"bf0b5064-b913-446d-b59a-f9530655426c\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bf414d61-018f-48e0-9c3c-98b3ed3a37ca\"}":{"__typename":"School","uuid":"bf414d61-018f-48e0-9c3c-98b3ed3a37ca","name":"Tufts University","city":"Medford","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02155"},"Education:{\"uuid\":\"0fa9f426-1df6-4e7a-b9e5-417a26721106\"}":{"__typename":"Education","uuid":"0fa9f426-1df6-4e7a-b9e5-417a26721106","school":{"__ref":"School:{\"uuid\":\"bf414d61-018f-48e0-9c3c-98b3ed3a37ca\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering ","degree":null},"MentorPublicProfile:{\"uuid\":\"ae5efca5-5524-45d0-9963-27c9bd3a2b32\"}":{"__typename":"MentorPublicProfile","uuid":"ae5efca5-5524-45d0-9963-27c9bd3a2b32","displayName":"Jakov M.","slug":"jakov-marohnic","biography":"\u003cp\u003e   Everyone's had at least one role model at some point in their life. Whether you realize it in the moment or a couple years down the line, these role models have a huge impact on the person we turn out to be. Role models are put in the unique position to instill principal values in the people that look up to them and, especially when it comes to younger people, a good role model can mean a lot to a person's growth and development. I say all this because I used to be a very shy kid, but now if you met me, I doubt that shy would be the first word that comes to mind.  All of the role models in my life, from my math teachers to my coaches, helped to slowly build up my confidence by letting me grow on my own but also by being there to help me through struggles. I'm very thankful for all of these people, and I know that I wouldn't be who I am today without them. This is one of the reasons why I joined the Curious Cardinals team. One day I would want to have an impact on someone's life, just like the one my role models had on me. I know that through this mentorship program, I will meet very intelligent and curious individuals, and I hope that one day they can look back on me as a role model.\u003c/p\u003e","teachingVideoPlaybackId":"01F5xVMV01zFsxPTA9tra02AvZvsZlcL6rpYf9iOxv02kT00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ecb9e790-3b49-4ecf-b930-7d3108ac311b\"}"},{"__ref":"DeepDives:{\"uuid\":\"26104295-b173-4138-b323-c779ee1d9de4\"}"},{"__ref":"DeepDives:{\"uuid\":\"5277a125-a59a-4672-98ac-b67f6ce4c7d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"c8a64f41-3b64-4d75-b9bc-9fe0c2573b7f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8cc0b01a-75bb-4a85-8742-e7228467dc0e/-/preview/-/format/jpg/","https://ucarecdn.com/bdc85bb0-17da-4e9f-8308-10462df30767/-/preview/-/format/jpg/","https://ucarecdn.com/51360ff3-05a4-4711-ba01-707df5be1dcc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0392fbe1-7d98-4e54-8c75-50b7166c0b41\"}"},{"__ref":"Education:{\"uuid\":\"0fa9f426-1df6-4e7a-b9e5-417a26721106\"}"}],"hiredAt":"2025-01-25T01:18:04.558Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Chemistry","Physics","6-8 Grade Science","French","Economics","Computer Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jakov-marohnic\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ae5efca5-5524-45d0-9963-27c9bd3a2b32\"}"}}},"_sentryTraceData":"d4afa9864f154138bb23fa4a7f42f640-877edee65ea4f387-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d4afa9864f154138bb23fa4a7f42f640,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jakov-marohnic"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","is
