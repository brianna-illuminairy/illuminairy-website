xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"5d66bc57-21b6-496e-864e-e6a141f610c9\"}":{"__typename":"CausesSupported","uuid":"5d66bc57-21b6-496e-864e-e6a141f610c9","name":"Reeves Foundation ","description":"\u003cp\u003eThe Reeves Foundation focuses on spinal cord injury research \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9dc75a41-3724-44d0-a1d1-c5702fc8ab5d\"}":{"__typename":"DeepDives","uuid":"9dc75a41-3724-44d0-a1d1-c5702fc8ab5d","content":"\u003cp\u003eI built a functioning app for breast cancer patients dealing with drain management post surgery! The app allowed women to track their drain output and communicate with their doctor appropriately and was used in the Stanford Hospital Plastic Surgery clinic this year!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"b2e3019d-8e84-42af-a312-96e58ff3669e\"}":{"__typename":"DeepDives","uuid":"b2e3019d-8e84-42af-a312-96e58ff3669e","content":"\u003cp\u003eI qualified for the Boston Marathon in my second marathon! I didn't know if I could do it, but with a lot of training and support along the way I ran a 3:20 !!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f011e3f8-65b2-4897-9198-4566bf4e99f0\"}":{"__typename":"DeepDives","uuid":"f011e3f8-65b2-4897-9198-4566bf4e99f0","content":"\u003cp\u003eIt took me a LONG time to choose a major! I think I must have chosen 4 or 5 different majors before I settled on BioEngineering - for my I felt like BioE gave me the breadth of experience I wanted to get in college. I knew that I wanted to focus on computer science, but what excited me was applying computational tools to biological problems and in BioE I had the flexibility with courseworks and projects to do that! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"00227815-b12b-4c92-888e-9c4d7bf08d70\"}":{"__typename":"DeepDives","uuid":"00227815-b12b-4c92-888e-9c4d7bf08d70","content":"\u003cp\u003eI love teaching computer science! CS is a whole new language, but learning it can open up a world of possibilities - you can automate so many tasks, do research, create websites and apps to help people and more! I love helping a student discover these possibilities and give them a totally new skillset they can take with them into whatever project, field or job they might undertake in the future. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"School:{\"uuid\":\"ff8d11b8-a997-4b3c-9926-91eb25df6bcf\"}":{"__typename":"School","uuid":"ff8d11b8-a997-4b3c-9926-91eb25df6bcf","name":"Milton Academy","city":"Milton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02186"},"Education:{\"uuid\":\"e0aedbad-bae8-4274-86a2-cce419383120\"}":{"__typename":"Education","uuid":"e0aedbad-bae8-4274-86a2-cce419383120","school":{"__ref":"School:{\"uuid\":\"ff8d11b8-a997-4b3c-9926-91eb25df6bcf\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"c4b61430-5941-4fc0-9566-e8260dd92652\"}":{"__typename":"Education","uuid":"c4b61430-5941-4fc0-9566-e8260dd92652","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"BioEngineering","degree":null},"MentorPublicProfile:{\"uuid\":\"1670f040-3387-4200-9ecb-8f0080a4cec5\"}":{"__typename":"MentorPublicProfile","uuid":"1670f040-3387-4200-9ecb-8f0080a4cec5","displayName":"Elina T.","slug":"elina-thadhani","biography":"\u003cp\u003eI am currently a PhD student studying BioEngineering at a joint program between Harvard Medical School and MIT, called HST - I am focusing on optimizing vaccine delivery to cells! Before graduate school I worked in industry for three years doing computational drug discovery at DE Shaw Research. I did my undergrad at Stanford where I majored in BioEngineering and got my Master's in Computer Science. I have always loved to teach - throughout college I was a TA for several introductory computer science classes and after college I helped organize and run a computer science class out of Stanford for high school students around the country! \u003cbr\u003e\u003cbr\u003eIn my free time I love to run (I'm training for my third marathon) and spend time with my 2 year old labradoodle named Finn (sometimes I force him to run with me, but he is not a huge fan of that!) \u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThe past three years I worked on CS105 with Stanford Digital Education and the National Education Equity Lab - we taught introductory CS to Title I high schools around the US remotely, teaching over 300 kids a semester. Many of the kids I mentored the first semester I taught are now starting in college and are majoring in Computer Science (one is even at Stanford!) \u003c/p\u003e","favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5d66bc57-21b6-496e-864e-e6a141f610c9\"}"}],"major":"BioEngineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9dc75a41-3724-44d0-a1d1-c5702fc8ab5d\"}"},{"__ref":"DeepDives:{\"uuid\":\"b2e3019d-8e84-42af-a312-96e58ff3669e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f011e3f8-65b2-4897-9198-4566bf4e99f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"00227815-b12b-4c92-888e-9c4d7bf08d70\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/aff01bbd-beaa-4857-bc0f-2914512c8569/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e0aedbad-bae8-4274-86a2-cce419383120\"}"},{"__ref":"Education:{\"uuid\":\"c4b61430-5941-4fc0-9566-e8260dd92652\"}"}],"hiredAt":"2025-05-14T14:16:38.925Z","topics":["Calculus","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Chemistry","Biology","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","Coding / Programming","Medicine / Health","Web Design","STEM Project","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/7888bd4b-612e-4eb6-94e7-3442bd9a4a01/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"
