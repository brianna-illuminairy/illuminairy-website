xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6a0f9081-fda1-43f4-b717-4034b61a3d5e\"}":{"__typename":"Favorites","uuid":"6a0f9081-fda1-43f4-b717-4034b61a3d5e","photoUrl":"https://ucarecdn.com/bf29cc34-c3c9-4c2e-bf57-dbc9c019edef/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"8db86aa4-856d-43ef-b4c4-589e16a72d04\"}":{"__typename":"Favorites","uuid":"8db86aa4-856d-43ef-b4c4-589e16a72d04","photoUrl":"https://ucarecdn.com/b6e46dec-5247-4300-8128-eb96ce6f2528/","title":"Simone Biles","type":"ATHLETE"},"Favorites:{\"uuid\":\"5ba17a6d-2256-4a69-b411-d1ac35bfe5f2\"}":{"__typename":"Favorites","uuid":"5ba17a6d-2256-4a69-b411-d1ac35bfe5f2","photoUrl":"https://ucarecdn.com/c0840246-0e50-4a84-b094-8620b8c901b8/","title":"Parent Trap","type":"MOVIE"},"CausesSupported:{\"uuid\":\"1e9834f1-0533-4e8b-b26b-9494d2a594a8\"}":{"__typename":"CausesSupported","uuid":"1e9834f1-0533-4e8b-b26b-9494d2a594a8","name":"Red Cross","description":"\u003cp\u003eHosted blood drives and attend events such as Veteran's Day Parade!\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"16999ce4-c3c0-4377-b226-d54e6edebd61\"}":{"__typename":"CausesSupported","uuid":"16999ce4-c3c0-4377-b226-d54e6edebd61","name":"Girls Who Code","description":"\u003cp\u003eInspiring young girls to code despite a male-dominating field!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ef52741d-70a2-4b1b-b2aa-82fb6aa79bcb\"}":{"__typename":"DeepDives","uuid":"ef52741d-70a2-4b1b-b2aa-82fb6aa79bcb","content":"\u003cp\u003eAs a child, I often felt intimidated to speak up or ask questions in class because I was worried about how others would judge me. The advice I would give my younger self is simple: ask questions. Curiosity is how real learning begins, and understanding only comes from being willing to seek answers (even when it feels uncomfortable). For a long time, I associated embarrassment with failure, but I’ve learned that embarrassment is often a sign of growth. Once I realized this in high school, I began asking questions constantly, even if it meant standing out or annoying my teachers. Through that process, I discovered the true power of computer science and developed a genuine passion for pursuing it as a career. Asking questions allowed me to move beyond surface-level understanding and start creating tangible solutions. It taught me that mistakes are not something to avoid, but something to learn from. The deeper I leaned into curiosity, the more confident and capable I became. Today, I believe that meaningful learning comes from curiosity, persistence, and the courage to speak up. I hope to give future students that confidence to speak up I so often lacked when I was younger.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2c89b66e-a045-4ebc-b0d2-2e2fd2b55367\"}":{"__typename":"DeepDives","uuid":"2c89b66e-a045-4ebc-b0d2-2e2fd2b55367","content":"\u003cp\u003eFor years, I felt helpless watching my grandfather struggle with Parkinson’s disease. Wanting to do more than simply observe, I began seeking ways technology could meaningfully support people facing serious medical conditions. This motivation led me to explore how computer science, particularly artificial intelligence, could be applied in healthcare. I took the opportunity to conduct research on the use of AI algorithms to improve pneumonia diagnosis through medical imaging. Using CNNs, I worked with X-ray data to enhance detection accuracy and better identify patterns associated with pneumonia. Through this experience, I saw firsthand how AI can save lives. Witnessing this transformed my understanding of computer science. It showed me that CS is not just about code, but about creating tools that directly help individuals. Through such experiences, I realized how interconnected computer science is with other fields and solidified my passion for using technology to drive positive change in society. I am now more than ever focused on the specific impact that computer science has as I look forward to building tangible solutions to  empower people facing real-world challenges.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b2f9e626-bd14-4c9b-91d8-3fde8e33c92b\"}":{"__typename":"DeepDives","uuid":"b2f9e626-bd14-4c9b-91d8-3fde8e33c92b","content":"\u003cp\u003eMy high school summers are ones I will always treasure. At their core, they were filled with doing things I genuinely loved: learning, creating, and spending time with people who mattered to me.\u003c/p\u003e\u003cp\u003eAcademically, I spent many summers participating in programs like Girls Who Code, where I let my curiosity flow and strengthened my computer science skills by building projects such as websites and applications. Creating real projects where I applied concepts helped me solidify fundamentals in a way that felt effective. I also spent summers tutoring younger students in game design and block coding while we would take breaks and have water balloon fights. \u003c/p\u003e\u003cp\u003eBeyond STEM, I was deeply involved in speech and debate. The ability to express a story through your own creative freedom excited me. I spent summers preparing my Duo Interpretation speech with my partner and even took the opportunity to attend Nationals in Arizona one summer. These experiences helped me grow as a communicator and teammate.\u003c/p\u003e\u003cp\u003eMy summers were not only academic, though. I balanced it out with traveling loads with family to places like Italy and Switzerland while enjoying California’s beaches with friends. Through pushing myself to grow while also being present with family, summers were quite literally my favorite. I made it a goal to do as much as I could during summer, entering the next school year knowing that even one second did not go to waste.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f0c0422b-ac02-49be-be66-884d634a5648\"}":{"__typename":"DeepDives","uuid":"f0c0422b-ac02-49be-be66-884d634a5648","content":"\u003cp\u003eAs an avid music fan living in LA, I was often frustrated by missing pop-up shows from artists like Daniel Caesar and Tyler, the Creator. That inspired me to build SoundScape, a concert discovery web app that highlights concerts and pop-up shows across the LA area, including key details like location, date, time, and artist, making it easier for people to discover live music around them. Now, music fans like me can avoid FOMO by easily discovering and attending events through one centralized app!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"85d4b1aa-d23e-4948-8ba8-703233ac5ac8\"}":{"__typename":"School","uuid":"85d4b1aa-d23e-4948-8ba8-703233ac5ac8","name":"Evergreen Valley High School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95148"},"Education:{\"uuid\":\"a0b76fa5-744c-4ed1-8554-62907273abf9\"}":{"__typename":"Education","uuid":"a0b76fa5-744c-4ed1-8554-62907273abf9","school":{"__ref":"School:{\"uuid\":\"85d4b1aa-d23e-4948-8ba8-703233ac5ac8\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"bff36c9a-d643-4966-8624-207b38fb7c9b\"}":{"__typename":"Education","uuid":"bff36c9a-d643-4966-8624-207b38fb7c9b","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science + Linguistics","degree":null},"MentorPublicProfile:{\"uuid\":\"a4ca63f5-1651-4952-8654-24e0aaa2387b\"}":{"__typename":"MentorPublicProfile","uuid":"a4ca63f5-1651-4952-8654-24e0aaa2387b","displayName":"Sonia S.","slug":"sonia-shah-1","biography":"\u003cp\u003eHello, I am Sonia, a second-year student at UCLA studying Computer Science + Linguistics and minoring in Bioinformatics! I have always been interested in the interdisciplinary aspect of computer science, as it can be used as a toolkit to advance other fields, ranging from healthcare to criminal justice. Through studying technology, I am specifically focused on the \u003cem\u003e\u003cu\u003eimpact\u003c/u\u003e\u003c/em\u003e it can create.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI help students uncover a passion for STEM that I struggled to find in high school. I understand how intimidating it can feel, but I look to make problem-solving exciting through puzzles and real-world scenarios (not just following a monotonous school curriculum)!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eIn the past, I:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCo-founded a nonprofit, Code Unite, that seeks to teach underprivileged children coding skills\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGrew a Girls Who Code club from 8 to 40 students by making coding \u003cem\u003efun\u003c/em\u003e through interactive games and hands-on puzzles\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTaught game design and block coding to English Language Learners through visual methods\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePresented a technology-driven sustainability proposal to industry professionals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCo-organized the largest blood drives at my high school for three consecutive years\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eWhy I am qualified:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI have extensive experience tutoring neurodivergent, underprivileged, and English Language Learner students, helping them build coding skills from the ground up. I hosted weekly STEM-related workshops to local middle schoolers for four years.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough years of tutoring, I’ve learned how to adapt my teaching to how students learn best, helping them master core fundamentals and foster curiosity through creating something \u003cem\u003e\u003cu\u003etangible\u003c/u\u003e\u003c/em\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI work best with students who are new to STEM or want to strengthen their foundations while building confidence.\u003c/p\u003e\u003cp\u003eMy focus areas include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCoding:\u003c/strong\u003e Python, Java, C++, HTML/CSS, JavaScript, and other foundational computer science concepts\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMath fundamentals: \u003c/strong\u003ePre-Algebra, Algebra, Calculus, and Linear Algebra\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eProject-based learning \u003c/strong\u003ethat guides students in coding real projects they can build\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege Essay Writing\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eOutside of school:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI am a HUGE gymnastics fan! I actually take recreational gymnastics on campus which helps me de-stress, and yes, I have seen Jordan Chiles multiple times at UCLA (I'm a big fan of her).\u003c/p\u003e\u003cp\u003eI am also a big matcha enthusiast and enjoy exploring different cafés around LA with friends (fun fact: I even built an app to track and rate matcha spots which all of us use). I love to play tennis and chess!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you want to develop your confidence in STEM-related subjects and understand how it is utilized to solve real-world problems, I would love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"cQU9U8UI01rvVTumsRulc9yoA009T4kNOxSiD24szQw00g","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eRealizing how certain groups lacked access to education, I co-founded Code Unite to expand STEM opportunities for under-resourced children. From teaching coding in local homeless shelters to adapting our curriculum with translators and shared computers for orphanages in rural India, we enabled over 100 children to learn coding. Our curriculum has since been integrated into the school, ensuring Code Unite’s lasting legacy while witnessing students’ interest in coding grow.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"6a0f9081-fda1-43f4-b717-4034b61a3d5e\"}"},{"__ref":"Favorites:{\"uuid\":\"8db86aa4-856d-43ef-b4c4-589e16a72d04\"}"},{"__ref":"Favorites:{\"uuid\":\"5ba17a6d-2256-4a69-b411-d1ac35bfe5f2\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"1e9834f1-0533-4e8b-b26b-9494d2a594a8\"}"},{"__ref":"CausesSupported:{\"uuid\":\"16999ce4-c3c0-4377-b226-d54e6edebd61\"}"}],"major":"Computer Science + Linguistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ef52741d-70a2-4b1b-b2aa-82fb6aa79bcb\"}"},{"__ref":"DeepDives:{\"uuid\":\"2c89b66e-a045-4ebc-b0d2-2e2fd2b55367\"}"},{"__ref":"DeepDives:{\"uuid\":\"b2f9e626-bd14-4c9b-91d8-3fde8e33c92b\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0c0422b-ac02-49be-be66-884d634a5648\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0bd5d6bc-2838-41d3-ab03-7943a7c8a156/-/preview/-/format/jpg/","https://ucarecdn.com/96c0dc95-931b-4950-99ab-5566f02747dc/-/preview/-/format/jpg/","https://ucarecdn.com/4847af52-df36-45d4-92ff-550018f7a9ea/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a0b76fa5-744c-4ed1-8554-62907273abf9\"}"},{"__ref":"Education:{\"uuid\":\"bff36c9a-d643-4966-8624-207b38fb7c9b\"}"}],"hiredAt":"2025-12-28T21:54:32.032Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","Statistics","Writing","Computer Science","College Essay Writing"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"son
