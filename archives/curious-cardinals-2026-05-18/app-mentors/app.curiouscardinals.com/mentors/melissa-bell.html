xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"213b8a4e-1c5f-4a5f-9372-0d9871ded658\"}":{"__typename":"DeepDives","uuid":"213b8a4e-1c5f-4a5f-9372-0d9871ded658","content":"\u003cp\u003eThe main advice I would give my middle and high school self is to focus on discovering your academic interests. When I was younger, I was so focused on my grades that I didn’t let myself fully enjoy learning. As a result, it was not until college that I realized I had many genuine intellectual passions, and I wish I had started exploring them sooner.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fde3352a-1448-4590-ad31-d28c389bec17\"}":{"__typename":"DeepDives","uuid":"fde3352a-1448-4590-ad31-d28c389bec17","content":"\u003cp\u003eI chose my major—Health \u0026amp; Societies—because I knew I wanted a career in health care, but I also wanted to explore a wide range of topics. Through the major, I have taken courses within the in Sociology, History, Urban Studies, and Gender Studies departments, as well as Penn's business school. I am incredibly grateful that my major has provided me with such a diverse and multifaceted educational experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"168b5130-a878-4d07-97f9-c3f8b8d15036\"}":{"__typename":"DeepDives","uuid":"168b5130-a878-4d07-97f9-c3f8b8d15036","content":"\u003cp\u003eMy dream job is to do health policy research! I would love to work for a federal health agency, such as the Centers for Disease Control and Prevention or the National Institutes of Health. I am striving to engage in social science research to inform federal policy decisions to improve population health.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"76fba432-ea44-4d9a-ad9a-94ab881cd654\"}":{"__typename":"DeepDives","uuid":"76fba432-ea44-4d9a-ad9a-94ab881cd654","content":"\u003cp\u003eDuring high school, I spent my summers volunteering at a local hospital. I mainly delivered meals to patients and walked them to their appointments. I loved doing small things that brightened patients' days and appreciated the opportunity to learn more about how the hospital operated. These experiences inspired me to pursue a career in health care.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"3ccc636c-b716-4ab2-9fe5-4763c9c80d9f\"}":{"__typename":"School","uuid":"3ccc636c-b716-4ab2-9fe5-4763c9c80d9f","name":"Lower Merion High School","city":"Ardmore","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19003"},"Education:{\"uuid\":\"bc0f9307-08b9-4006-9153-7be6dc58c2b8\"}":{"__typename":"Education","uuid":"bc0f9307-08b9-4006-9153-7be6dc58c2b8","school":{"__ref":"School:{\"uuid\":\"3ccc636c-b716-4ab2-9fe5-4763c9c80d9f\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"24e552d2-c05b-4992-81aa-a47d6dd9b138\"}":{"__typename":"Education","uuid":"24e552d2-c05b-4992-81aa-a47d6dd9b138","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Health \u0026 Societies","degree":null},"MentorPublicProfile:{\"uuid\":\"9d786551-db6c-482d-a2bf-909087ee973d\"}":{"__typename":"MentorPublicProfile","uuid":"9d786551-db6c-482d-a2bf-909087ee973d","displayName":"Melissa B.","slug":"melissa-bell","biography":"\u003cp\u003eHello! My name is Melissa Bell, and I’m a senior at the University of Pennsylvania majoring in Health \u0026amp; Societies with a concentration in Health Care Markets and Finance. I am passionate about advancing health equity and love learning about how history, politics, and economics shape population health. Through my undergraduate experience, I have had diverse internships in the realm of\u0026nbsp; health care. Two summers ago, I interned at the Public Health Foundation of India, and conducted research on federal health insurance programs and their impact on national health outcomes. Last summer, I worked with CVS Health, and did venture capital in the health start-up landscape. After graduation, I am excited to begin my career as an analyst at Health Advances, a healthcare consulting firm.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I am involved in various extracurricular activities. For the past three years, I have tutored with Penn’s West Philadelphia Tutoring Project. I have worked with the same student weekly on math, English and science. I also serve as the chair of the events committee for our chapter of The Women’s Network, where I lead initiatives such as alumni panels and resume workshops. Additionally, I am a member of MEDLIFE, a health and education equity organization, through which I volunteer at hospitals and food distribution centers. In my free time, I enjoy reading, watching movies, traveling, hiking, and spending time with friends and family.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI became a mentor with Curious Cardinals because of the transformative impact mentorship has had on my life. Throughout high school, one-on-one support from tutors boosted my confidence and helped me excel academically. In college, I developed close relationships with professors, who have guided me in discovering my academic passions and assisted me in my professional pursuits. Now, as I approach the end of my college career, I am eager to offer the same kind of personal, academic, and professional mentorship to others.\u003c/p\u003e","teachingVideoPlaybackId":"mbw9siB6IfeLMBW5sVnd5KjTMMzH02f9JTnEhcLclv6Q","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Health \u0026 Societies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"213b8a4e-1c5f-4a5f-9372-0d9871ded658\"}"},{"__ref":"DeepDives:{\"uuid\":\"fde3352a-1448-4590-ad31-d28c389bec17\"}"},{"__ref":"DeepDives:{\"uuid\":\"168b5130-a878-4d07-97f9-c3f8b8d15036\"}"},{"__ref":"DeepDives:{\"uuid\":\"76fba432-ea44-4d9a-ad9a-94ab881cd654\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b12961e1-c346-4431-aa9a-f290629b9fed/-/preview/-/format/jpg/","https://ucarecdn.com/ec0ca162-3ab4-4952-a51c-ba18f33e69cf/-/preview/-/format/jpg/","https://ucarecdn.com/592e55ee-4f93-4c5f-af7c-002f04f37c31/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"bc0f9307-08b
