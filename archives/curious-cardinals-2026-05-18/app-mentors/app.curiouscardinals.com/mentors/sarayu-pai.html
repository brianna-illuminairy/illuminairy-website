n":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"85209a6f-9fa8-475d-a54c-444e4c2c40b0\"}":{"__typename":"DeepDives","uuid":"85209a6f-9fa8-475d-a54c-444e4c2c40b0","content":"\u003cp\u003eAt some point, I would love to work for National Geographic!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"d5edff37-527f-4c6f-b13a-2bcdbd5c2f83\"}":{"__typename":"School","uuid":"d5edff37-527f-4c6f-b13a-2bcdbd5c2f83","name":"Grimsley High School","city":"Greensboro","type":"HIGH","state":"NC","country":"US","zip":"27410"},"Education:{\"uuid\":\"2d39528f-ad80-4aec-8053-6d7f8ad658a5\"}":{"__typename":"Education","uuid":"2d39528f-ad80-4aec-8053-6d7f8ad658a5","school":{"__ref":"School:{\"uuid\":\"d5edff37-527f-4c6f-b13a-2bcdbd5c2f83\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"2cccad62-5f7d-43df-929f-6d039779b693\"}":{"__typename":"Education","uuid":"2cccad62-5f7d-43df-929f-6d039779b693","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"8cff7a20-3052-4fc1-8ec7-5dcc2f5eae1b\"}":{"__typename":"MentorPublicProfile","uuid":"8cff7a20-3052-4fc1-8ec7-5dcc2f5eae1b","displayName":"Sarayu P.","slug":"sarayu-pai","biography":"\u003cp\u003eSarayu recently graduated from Stanford with a B.S. in Mechanical Engineering and will be returning for an M.S. in the same department. She hails from the great state of North Carolina, a place she credits with instilling in her a love for unique food combinations like Takis and tofu. Sarayu decided to study mechanical engineering given its versatility and focus on creative problem-solving, and some of her favorite classes have been in the dynamics, materials, and biomechanics fields. She has also cherished the projects she has completed in Stanford’s Product Realization Lab, using the woodshop, foundry, welding, 3D printing, lathe, manual mill, and most recently, the CNC. \u003cbr\u003eOn campus, Sarayu enjoys writing for The Stanford Daily across a variety of sections, including News, Campus Life, Arts and Life, and the Grind. Topics she has written about include the 40 Fruit Tree, concerts at Frost, ghost encounters on campus, Lake Lagunita, and strange animal encounters on campus. She also enjoys playing instruments and presented her senior recital in flute this past spring. With her studies, she has had the opportunity to have some insightful engineering and design internship experiences at companies like Tesla, Apple, and Adidas. Earlier in her undergraduate experience, Sarayu did research on a farm in Hawai'I and participated in Stanford’s Sophomore College program in Galápagos, where she wrote a research paper analyzing the impacts of modern stressors on the endemic marine iguana. \u003cbr\u003eApart from school, Sarayu loves hiking, climbing, making clothes, customizing shoes, reading, and learning languages. Nike Air Maxes and Blazers are her favorite sneakers. When it comes to listening to music, Sarayu likes to think she has an eclectic taste, characterized by genres spanning from R\u0026amp;B and hip-hop to reggaeton and alternative. If she were to attend Hogwarts, she believes the Sorting Hat would place her either into Gryffindor or Slytherin, and her Patronus would be a jellyfish since she has been stung by one before. Sarayu is also working on her layup and hopes to spectate an NBA game in person in the near future.\u003c/p\u003e","teachingVideoPlaybackId":"mhTun5YR00qNw4kyaBW01dhkCsucfM4b9EXuPMbqXqogQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eA couple things I'm really proud of are being selected to participate in the Galapagos Sophomore College program and presenting my senior recital in flute! I'm also proud of the articles I write for The Stanford Daily; I have received lovely messages from readers thanking me for sharing stories, and this is one of the most rewarding parts!\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b56f98b3-9155-4255-8930-f34dd1dd056a\"}"},{"__ref":"DeepDives:{\"uuid\":\"160f50eb-b96a-4cf7-964d-6d431b7de93a\"}"},{"__ref":"DeepDives:{\"uuid\":\"ae66bab6-2dc1-423c-a3d3-72fd4728c8ad\"}"},{"__ref":"DeepDives:{\"uuid\":\"85209a6f-9fa8-475d-a54c-444e4c2c40b0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dbd14e37-1b08-48a0-bfba-0961f76568d1/-/preview/-/format/jpg/","https://ucarecdn.com/005b8b91-491e-4477-b8d9-96edbfbe7c81/-/preview/-/format/jpg/","https://ucarecdn.com/01d68edb-89e4-40f4-8cd0-491e39b71d22/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2d39528f-ad80-4aec-8053-6d7f8ad658a5\"}"},{"__ref":"Education:{\"uuid\":\"2cccad62-5f7d-43df-929f-6d039779b693\"}"}],"hiredAt":"2023-08-16T00:45:17.710Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","Executive Function","K-6 Storybook","Creative Writing","Music","Fashion / Cosmetics","Visual Arts / Graphic Design","Sports Journalism","History Project","Video / Photography","Robotics / Electronics /
