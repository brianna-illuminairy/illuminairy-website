xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"923f55b0-3559-41e8-89f5-190cc6ba2a9a\"}":{"__typename":"DeepDives","uuid":"923f55b0-3559-41e8-89f5-190cc6ba2a9a","content":"\u003cp\u003ePicture your ideal future self and set your intention everyday to work towards becoming that version of you! The power of goal orientation and positive mindset can make all the difference!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9548a7cd-1e67-4b2d-90df-ed3b1fde4ee3\"}":{"__typename":"DeepDives","uuid":"9548a7cd-1e67-4b2d-90df-ed3b1fde4ee3","content":"\u003cp\u003eReflecting on my past mentors I have had in my life, I do not believe that I would have had the motivation or drive to be where I am today without them. Finding those people who push you to be the best version of yourself is one of the most important lessons I have learned. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"3d43eaaf-5163-4004-ae3f-407a57a39428\"}":{"__typename":"DeepDives","uuid":"3d43eaaf-5163-4004-ae3f-407a57a39428","content":"\u003cp\u003eBecoming a child psychologist doing therapy focused work!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"936d6292-e45c-4424-b1b3-1bf1686442cf\"}":{"__typename":"DeepDives","uuid":"936d6292-e45c-4424-b1b3-1bf1686442cf","content":"\u003cp\u003eI am a proud Canadian! So I love to bring a bit of my Canadian spirits and quirks into my teaching practice :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"26cdcff4-dc2e-43f2-ba03-4ec1bfce8606\"}":{"__typename":"School","uuid":"26cdcff4-dc2e-43f2-ba03-4ec1bfce8606","name":"Auburn Drive High School","city":"Halifax","type":"HIGH","state":"Nova Scotia","country":"Canada","zip":"B2Y 3N5"},"Education:{\"uuid\":\"e56eda77-320a-4314-ac8f-c4f8de92003e\"}":{"__typename":"Education","uuid":"e56eda77-320a-4314-ac8f-c4f8de92003e","school":{"__ref":"School:{\"uuid\":\"26cdcff4-dc2e-43f2-ba03-4ec1bfce8606\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"3aeb9e77-c804-4a8a-8af9-aec94fa71cde\"}":{"__typename":"Education","uuid":"3aeb9e77-c804-4a8a-8af9-aec94fa71cde","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2028","major":"PhD in School Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"be3eab1c-6c0b-41d1-bf77-d8c63d2c89f3\"}":{"__typename":"MentorPublicProfile","uuid":"be3eab1c-6c0b-41d1-bf77-d8c63d2c89f3","displayName":"Umara H.","slug":"umara-hansen","biography":"\u003cp\u003eUmara Hansen is a second year PhD student in the School Psychology program at the University of California, Berkeley. She received her Honors in Psychology Bachelor of Science at the University of Ottawa, Canada.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eUmara has ample experience in the mental health field by working in research practices and organizations across the United States and Canada such as Anxiety Canada, Best Buddies, research labs and psychological clinics. Umara has a passion for working with students of all ages and has held a variety of roles such as being a camp counsellor in her youth, being a practicum school psychology student at K-12 schools in the Bay area and as a Clinical Psychology teacher at UC Berkeley’s Academic Talent Development Program (ATDP) this past summer. She is also currently a mentor for fellow graduate students at UC Berkeley leading student’s through goal-setting workshops. She also has experience working with College level athletes at UC Berkeley mentoring students with time management strategies and tutoring in a variety of social science courses.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn undergrad Umara spent her time researching the effects of Mindfulness on Anxiety using fMRI techniques. Before applying to graduate school, Umara spent her time conducting research throughout the United States and Canada such as at the Depression, Anxiety and Stress Lab University of British Columbia, the OCD Clinic at the BC Children’s Hospital and at the Stress and Development Lab at Harvard University. She is currently interested in exploring the manifestations of toxic stress within the classroom with the goal of creating a nurturing and supportive environment for all children both at home and at school.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn her free time Umara can be seen exploring the great outdoors surfing, hiking, skiing, and sailing. One of her passions is travelling and she loves to plan trekking trips. She recently completed the 4-day Salkantay Trek/ Machu Picchu trek and the 21-day Mount Everest Base Camp Trek.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003ePursuing my PhD at UC Berkeley always felt like a dream, never a reality. I remember applying to PhD programs and my mom telling me to \"apply to one of my dream schools, because why not!\" Reflecting back on my experiences it was the experiences I had, the opportunities I took, and most importantly, the people I was surrounded by who really made my dream turn into my reality. I realize now that it was not out of luck that I was accepted into my program but my endless drive over the years that brought me to where I am today. \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"PhD in School Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"923f55b0-3559-41e8-89f5-190cc6ba2a9a\"}"},{"__ref":"DeepDives:{\"uuid\":\"9548a7cd-1e67-4b2d-90df-ed3b1fde4ee3\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d43eaaf-5163-4004-ae3f-407a57a39428\"}"},{"__ref":"DeepDives:{\"uuid\":\"936d6292-e45c-4424-b1b3-1bf1686442cf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/03992d3f-2c46-4fa7-b740-25aaa29f7c74/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e56eda77-320a-4314-ac8f-c4f8de92003e\"}"},{"__ref":"Education:{\"uuid\":\"3aeb9e77-c804-4a8a-8af9-aec94fa71cde\"}"}],"hiredAt":"2023-10-29T17:52:13.928Z","topics":["Literature","STEM Project","Writing","Executive Function","Reading","Academic Coaching","College Essay Writing"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://u
