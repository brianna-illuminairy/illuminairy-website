xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e52d597a-53a1-49c0-ae4f-48bdaac26109\"}":{"__typename":"Favorites","uuid":"e52d597a-53a1-49c0-ae4f-48bdaac26109","photoUrl":"https://ucarecdn.com/6d51e59e-4e06-48bb-bec4-77fb959c2563/","title":"The Green Knight","type":"MOVIE"},"Favorites:{\"uuid\":\"ab1614ae-4adc-4fb6-b135-dae74bde5d45\"}":{"__typename":"Favorites","uuid":"ab1614ae-4adc-4fb6-b135-dae74bde5d45","photoUrl":"https://ucarecdn.com/ca089cb3-bbe0-48b5-8839-95df1b1cc04c/","title":"LeBron James","type":"ATHLETE"},"Favorites:{\"uuid\":\"9e304dc2-c025-4a68-9189-ea99104a32d8\"}":{"__typename":"Favorites","uuid":"9e304dc2-c025-4a68-9189-ea99104a32d8","photoUrl":"https://ucarecdn.com/0a38b1b9-b417-4ec4-a117-bf5ba62b308f/","title":"Childish Gambino","type":"ARTIST"},"CausesSupported:{\"uuid\":\"969ba162-5fba-430d-b921-8a380767f654\"}":{"__typename":"CausesSupported","uuid":"969ba162-5fba-430d-b921-8a380767f654","name":"Niles Main Street Association","description":"\u003cp\u003eI serve as Volunteer Coordinator where I helped plan \u0026amp; execute community events.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/4d235296-508a-466a-8aef-95e7c1465124/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7a8ffafd-36bc-4c8e-8f33-444810491685\"}":{"__typename":"DeepDives","uuid":"7a8ffafd-36bc-4c8e-8f33-444810491685","content":"\u003cp\u003eIf I could choose just one lesson to impart to myself during high school, it'd be the following: do more things, the time is now. I don't mean this in the sense that I should've overexerted myself or burned out, but instead that stopping myself from developing or growing in some way because I thought I'd be better off doing it later is almost always wrong. At the time I didn't realize that the more I do things, the more I iterate, the more I fail, all those things just lend to a more developed skill set. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c84ad5d5-6765-4099-9beb-50496d0b2661\"}":{"__typename":"DeepDives","uuid":"c84ad5d5-6765-4099-9beb-50496d0b2661","content":"\u003cp\u003eI chose my major of Physics and Applied Math because I am very intrinsically motivated to break down processes into their fundamentals. Whenever I come across something cool, like a levitating superconductor for example, my first instinct is almost always to say 'Wow, I wonder why it does that?', instead of something more common for an engineer like, 'Wow, I wonder what I could build with that?'. Hence, I think Physics and Applied Math provide exactly the kind of fundamental rational analysis that I like to do when encountering the world around me. I chose Applied Math specifically since I also think it pairs quite well with Physics for my aspired future career in quantum computing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"505b658f-cb7c-4ba2-baed-2a3873c090e6\"}":{"__typename":"DeepDives","uuid":"505b658f-cb7c-4ba2-baed-2a3873c090e6","content":"\u003cp\u003eMy dream job is to build quantum computing hardware and to design quantum computing algorithms. Quantum computing is an emerging field that combines computer science and physics to create computers that leverage quantum mechanical properties to conduct computation. Currently, the strongest quantum computers only contain around a 1000 qubits (quantum bits) that often have to be cooled to extremely cold temperatures to compute. As such, the need for more powerful quantum computers is abundantly evident, yet the need for quantum computing algorithms is a more subtle but equally important initiative. Right now, only a handful of quantum algorithms exist that can truly utilize the power of quantum computers, so creating clever algorithms to get this done is a challenge that I'd love to work on!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"dc31c75e-0262-49bd-9af6-f04a22954f2f\"}":{"__typename":"DeepDives","uuid":"dc31c75e-0262-49bd-9af6-f04a22954f2f","content":"\u003cp\u003eOkay, as silly and random as will sound, I would have to say my most memorably odd dream is one I had a few years ago. The premise was basically that I was in a school bus and I was orbiting around a black hole (that for some reason looked like Mercury). All the while 'Hotel California' by Eagles was playing in the background. Eventually, as I got close enough to the black hole, time started to slow down and once it fully stopped I woke up. The reason I find it so memorable though is because even as my dream self I remember thinking, 'Wow, what an odd song choice, I wonder why I chose this'. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"49464df2-e7ff-497e-b5c9-3b3c0b07539d\"}":{"__typename":"School","uuid":"49464df2-e7ff-497e-b5c9-3b3c0b07539d","name":"Washington High School","city":"Fremont","type":"HIGH","state":"California","country":"United States","zip":"94536"},"Education:{\"uuid\":\"1f411ba6-ef2d-4a5c-8a5c-ef433daf384c\"}":{"__typename":"Education","uuid":"1f411ba6-ef2d-4a5c-8a5c-ef433daf384c","school":{"__ref":"School:{\"uuid\":\"49464df2-e7ff-497e-b5c9-3b3c0b07539d\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}":{"__typename":"School","uuid":"dff4a26a-20c2-4281-9c2a-b500907e0661","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"3f852129-8c90-4cf4-95ac-40f2762a5e30\"}":{"__typename":"Education","uuid":"3f852129-8c90-4cf4-95ac-40f2762a5e30","school":{"__ref":"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Physics \u0026 Applied Math","degree":null},"MentorPublicProfile:{\"uuid\":\"b954f04e-80d8-4767-b1e5-daffb12cc843\"}":{"__typename":"MentorPublicProfile","uuid":"b954f04e-80d8-4767-b1e5-daffb12cc843","displayName":"Yadukrishna R.","slug":"yadukrishna-raghu","biography":"\u003cp\u003eHey!\u003c/p\u003e\u003cp\u003eMy name is Yadukrishna Raghu, but you can call me Yadu! I'm a Physics and Applied Math major and a rising sophomore at UC Berkeley. I'm originally from Fremont, CA, and I've lived in California my whole life. Currently, I'm doing research on brown dwarfs, which are some of the coldest and lightest stars in the night sky. Specifically, for the past 4 years I've studied the mass distribution of brown dwarfs, which just describes how many brown dwarfs exist at a given mass, and this helps astronomers better understand how the star formation process works as a whole. As such, I've learned a lot about what scientific research requires and what it teaches you—namely rationally-guided creativity to generate/validate ideas and clear, effective communication to convey these ideas. Even if you have no interest in doing research, these are extremely valuable talents to help differentiate you in any field, so I look forward to helping my mentees develop these skills.\u003c/p\u003e\u003cp\u003eUltimately, I'd like to go into quantum computing, which is an emerging field at the intersection of physics and computer science that uses quantum mechanics and its properties to conduct computations, sometimes much faster than our current classical computers. I've knew I wanted to go into a physics-adjacent field ever since middle school, when I became fascinated by the astrophysical wonders of the universe. I'd spend hours hooked on watching YouTube videos explaining how black holes or neutron stars work, and despite my passion having shifted over the years from astrophysics to quantum computing, my appreciation for curious exploration and rational development has only gotten stronger. What do I mean by that? I mean to say the following: the process by which we arrive at an answer is often far more rewarding than the actual answer itself, especially within the context of learning something new in a STEM field. I can say with confidence that some of my most memorable and cherished moments doing math or physics have been because I had the chance to organically explore a concept and build my own mental scaffolding to understand the idea as fundamentally as possible. Fortunately, this practice of prioritizing exploration as a way to learn is very much something that a mentor can help facilitate, and I'm really excited to be a part of that process for you!\u003c/p\u003e\u003cp\u003eLastly, I'll go into a bit more about me outside of academics. I love to play basketball, I'm really interested in learning history and linguistics, and I am a big fan of trying new foods. In general, I'm fairly social, extroverted, and willing to learn more about whoever I have the pleasure of meeting. I think this is important because I hope to structure our lessons as a conversation whenever possible, so I can naturally guide you towards the answer as opposed to a more traditional, rigid lesson structure. In any case, I'm excited to start working with you, and I hope you're just as excited for all the interesting concepts we'll learn!\u003c/p\u003e","teachingVideoPlaybackId":"SwsLjnms7Aviw023Vdy01EGjo01a01GvfVXELrofblexii8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI would say that my greatest achievement is publishing a first-author paper. I started doing research through a NASA citizen science directive that connected curious minds interested in astronomy across the world to do telescope data analysis. To go from that to eventually working with a staff scientist at Caltech on writing a paper myself was such an incredible progression for myself that I'm really glad I got the chance to do. The process of writing the paper itself was very rewarding, and realizing that I had made a very real contribution to science felt amazing. For context, my paper is on using simulated brown dwarf populations to better constrain the brown dwarf mass function. In simpler terms, I tested a bunch of potential samples brown dwarf to see which one best fit our current observations of the distribution of brown dwarf masses in the sky. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e52d597a-53a1-49c0-ae4f-48bdaac26109\"}"},{"__ref":"Favorites:{\"uuid\":\"ab1614ae-4adc-4fb6-b135-dae74bde5d45\"}"},{"__ref":"Favorites:{\"uuid\":\"9e304dc2-c025-4a68-9189-ea99104a32d8\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"969ba162-5fba-430d-b921-8a380767f654\"}"}],"major":"Physics \u0026 Applied Math","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7a8ffafd-36bc-4c8e-8f33-444810491685\"}"},{"__ref":"DeepDives:{\"uuid\":\"c84ad5d5-6765-4099-9beb-50496d0b2661\"}"},{"__ref":"DeepDives:{\"uuid\":\"505b658f-cb7c-4ba2-baed-2a3873c090e6\"}"},{"__ref":"DeepDives:{\"uuid\":\"dc31c75e-0262-49bd-9af6-f04a22954f2f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/51a7ddfe-a52e-4609-a31b-0621bf48b563/-/preview/-/format/jpg/","https://ucarecdn.com/333e32e5-9609-40c4-a18d-e64a52b5e1d3/-/preview/-/format/jpg/","https://ucarecdn.com/a2bd8e80-7f19-4e27-ac6f-78e30283a947/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1f411ba6-ef2d-4a5c-8a5c-ef433daf384c\"}"},{"__ref":"Education:{\"uuid\":\"3f852129-8c90-4cf4-95ac-40f2762a5e30\"}"}],"hiredAt":"2025-06-25T15:54:07.361Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","Computer Science","Academic Coaching","Executive Function","Coding / Programming","STEM Project","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/","https://ucarecdn.com/9a4c114f-3114-4d6c-908a-b4d35953934d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"yadukrishna-raghu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b954f04e-80d8-4767-b1e5-daffb12cc843\"}"}}},"_sentryTraceData":"3c3a1e624ebb4f24b8f6d24322ca5752-a14afdc775d3933e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3c3a1e624ebb4f24b8f6d24322ca5752,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"yadukrishna-raghu"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].
