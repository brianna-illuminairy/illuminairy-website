xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"5aa7f675-03e2-4db2-92e7-0e5d6a200045\"}":{"__typename":"DeepDives","uuid":"5aa7f675-03e2-4db2-92e7-0e5d6a200045","content":"\u003cp\u003eA passion project I created is codeHER, an international nonprofit I founded when I was 14. It started as a response to a simple, but powerful question: \u003cem\u003eWhy are so few girls like me being taught to code—especially in communities that need it most?\u003c/em\u003e\u003c/p\u003e\u003cp\u003ecodeHER empowers young women in low- and middle-income countries by equipping them with technological and leadership skills. Over the past 8 years, we’ve reached over 1,400 women across 41 countries, helping them launch social-impact ventures, pursue education, and break into the tech workforce.\u003c/p\u003e\u003cp\u003eWhat makes codeHER meaningful to me is that it’s never just been about coding—it’s about giving women the tools to tell their own stories, solve their own problems, and lead in their own communities. We've partnered with organizations like the Gates Foundation and the U.S. State Department, but our biggest impact has come from the girls who now teach others. That ripple effect is what drives me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"98b93a1d-210e-4afa-aceb-33b0ddacca38\"}":{"__typename":"DeepDives","uuid":"98b93a1d-210e-4afa-aceb-33b0ddacca38","content":"\u003cp\u003eBecause someone once believed in me before I believed in myself—and that changed everything.\u003c/p\u003e\u003cp\u003eMentorship, to me, is one of the most powerful forms of impact. It’s not about having all the answers. It’s about showing someone what’s possible, helping them navigate uncertainty, and reminding them that they belong—even when the world says otherwise.\u003c/p\u003e\u003cp\u003eThrough codeHER, I’ve mentored girls from Morocco to Malaysia, many of whom were the first in their families to pursue tech. Watching them go from hesitant to confident, from learners to leaders, has been one of the most fulfilling experiences of my life. Mentorship creates ripple effects that outlast any single project or job title—and that’s why I choose it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b64375c3-8fbc-4eae-b7cb-456375179f63\"}":{"__typename":"DeepDives","uuid":"b64375c3-8fbc-4eae-b7cb-456375179f63","content":"\u003cp\u003eI chose Symbolic Systems because I’ve always been fascinated by how people think—and how machines try to mimic that thinking. I didn’t want to just learn how to code. I wanted to understand how intelligence, language, decision-making, and ethics intersect with technology.\u003c/p\u003e\u003cp\u003eSymbolic Systems let me study AI not just as a technical tool, but as a human one. I explored everything from neural networks to moral philosophy, and it shaped how I build products—always with people at the center. For someone who cares deeply about ethical tech and systems that empower, not replace, human agency, Symbolic Systems was the perfect fit.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ff96d08c-868c-486c-a8df-46939060b93d\"}":{"__typename":"DeepDives","uuid":"ff96d08c-868c-486c-a8df-46939060b93d","content":"\u003cp\u003eI’d tell her: \u003cem\u003eYou don’t have to have it all figured out to begin. Just start.\u003c/em\u003e\u003c/p\u003e\u003cp\u003eYou’re going to feel like an outsider sometimes—in tech rooms where you're the only girl, in conversations where you question if you belong. But lean into that discomfort. That voice in your head that says “What if I tried?” is the one you should listen to.\u003c/p\u003e\u003cp\u003eYou don’t need to be perfect to lead. You just need to care enough to try. The nonprofit you start, the research you do, the bold questions you ask—they’ll all come from moments where you chose courage over certainty. Keep choosing that.\u003c/p\u003e\u003cp\u003eAnd finally: protect your empathy. It will be your superpower in every room you walk into.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"9ecae2fc-0c94-4b7a-8bca-7966d0467c61\"}":{"__typename":"School","uuid":"9ecae2fc-0c94-4b7a-8bca-7966d0467c61","name":"River Hill High School","city":"Columbia","type":"HIGH","state":"Maryland","country":"United States","zip":"21029"},"Education:{\"uuid\":\"9e971c1d-da46-4953-b12a-8ae3be473d11\"}":{"__typename":"Education","uuid":"9e971c1d-da46-4953-b12a-8ae3be473d11","school":{"__ref":"School:{\"uuid\":\"9ecae2fc-0c94-4b7a-8bca-7966d0467c61\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a40138a0-0a40-4271-b091-533567ecd775\"}":{"__typename":"Education","uuid":"a40138a0-0a40-4271-b091-533567ecd775","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Symbolic Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"70a2cda2-e7e9-4b9a-ada1-cf519234acfe\"}":{"__typename":"MentorPublicProfile","uuid":"70a2cda2-e7e9-4b9a-ada1-cf519234acfe","displayName":"Saniya V.","slug":"saniya-vashist","biography":"\u003cp\u003e\u003cstrong\u003eAbout Me\u003c/strong\u003e\u003cbr\u003eHi, I’m Saniya Vashist, a Stanford graduate who studied Symbolic Systems, where I focused on the intersection of computer science, cognitive science, and artificial intelligence. Later this year, I’ll be joining Bain \u0026amp; Company in New York as an Associate Consultant.\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eWhat I Care About\u003c/strong\u003e\u003cbr\u003eI care about building technology that empowers—especially women, underserved communities, and those left behind by traditional systems. Whether it’s improving access to education, advancing mental health, or safeguarding digital privacy, I’m passionate about tech that drives ethical and global impact.\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eWhat I Study\u003c/strong\u003e\u003cbr\u003eAt Stanford, Symbolic Systems has allowed me to bridge technical skills with human-centered thinking. My coursework spans AI, philosophy of mind, data ethics, and computational theory—equipping me to approach complex problems with both rigor and empathy.\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eHow I Spend My Time\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademically\u003c/strong\u003e, I’ve conducted research on gender equity in Indian politics and digital access for incarcerated youth.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eProfessionally\u003c/strong\u003e, I’ve held strategy and product roles at Point72, Paramount, and Mindmarker. I’m also the Co-Founder and Chief Product Officer of Mantra, an AI-powered wellness and productivity tool.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eExtracurricularly\u003c/strong\u003e, I founded codeHER, an international nonprofit that has trained over 1,400 women in 41 countries in tech and leadership. I also serve as Senior VP for Stanford Women in Business, where I help run a 200-person Women in Tech summit.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eUnique Accolades and Experiences\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePresented at Johns Hopkins Applied Physics Lab\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMaryland winner of the NCWIT Award for Aspirations in Computing\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNamed a Baltimore Orioles Birdland Community Hero\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSpoken on international stages about women in technology\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSecured funding for codeHER from the Gates Foundation, US State Department, and Goldman Sachs\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5aa7f675-03e2-4db2-92e7-0e5d6a200045\"}"},{"__ref":"DeepDives:{\"uuid\":\"98b93a1d-210e-4afa-aceb-33b0ddacca38\"}"},{"__ref":"DeepDives:{\
