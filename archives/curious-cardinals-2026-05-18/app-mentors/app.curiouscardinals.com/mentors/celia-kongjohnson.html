xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d89f5909-f4c0-43f8-8258-d06c96f1ab45\"}":{"__typename":"Favorites","uuid":"d89f5909-f4c0-43f8-8258-d06c96f1ab45","photoUrl":"https://ucarecdn.com/2fe241f2-ec31-4791-b098-de42c1a98330/","title":"Sydney McLaughlin-Levrone","type":"ATHLETE"},"Favorites:{\"uuid\":\"e7cf5895-b79f-49f9-bea0-70f1a7227f3a\"}":{"__typename":"Favorites","uuid":"e7cf5895-b79f-49f9-bea0-70f1a7227f3a","photoUrl":"https://ucarecdn.com/9653818f-6b0b-4312-a1d2-bd924688b32e/","title":"Harry Potter series","type":"MOVIE"},"Favorites:{\"uuid\":\"554fd062-0379-442f-8376-0f5c54503cb0\"}":{"__typename":"Favorites","uuid":"554fd062-0379-442f-8376-0f5c54503cb0","photoUrl":"https://ucarecdn.com/1fbbb137-f308-4933-b719-3a523dddffa8/","title":"The Rose Code","type":"BOOK"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"97f8ea17-800a-4d05-9b93-cd71df4cf5fd\"}":{"__typename":"DeepDives","uuid":"97f8ea17-800a-4d05-9b93-cd71df4cf5fd","content":"\u003cp\u003eI usually spent my summers traveling and competing in soccer tournaments in California. When I was home (and not at tournaments), I would usually go to the beach with my friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"47247077-08a7-421e-a66d-e464a399c46e\"}":{"__typename":"DeepDives","uuid":"47247077-08a7-421e-a66d-e464a399c46e","content":"\u003cp\u003eMy parents are both Earth scientists so I was exposed to that field from an early age. They also traveled all over the world for their work, so I of course was enticed by that. At Brown, I started research my sophomore year where I reconstructed past climate using isotopes which spurred my interest in using isotopes and other aspects of geochemistry to learn more about Earth processes and how they record the climate. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"7c2f9faa-b55e-4547-b24f-a447bff7180e\"}":{"__typename":"DeepDives","uuid":"7c2f9faa-b55e-4547-b24f-a447bff7180e","content":"\u003cp\u003eIn my first research internship, I was mentored by a fourth-year graduate student, and it was one of the most influential experiences that I have had. She got me excited about the research that we were doing, so much so that I then pursued (and am now conducting) similar research in graduate school. She not only taught me \u003cem\u003eso \u003c/em\u003emuch in regards to geochemistry and research, but also became somebody that I could look up and turn to for any aspect of my life. Although this was 2 years ago and we both are at completely different stages in our life, we still keep in touch. This experience showed me how influential and important mentors can be and I hope to have this impact on my mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e9f3f1e6-ef6f-4b62-9f46-cc8f6c10b690\"}":{"__typename":"DeepDives","uuid":"e9f3f1e6-ef6f-4b62-9f46-cc8f6c10b690","content":"\u003cp\u003eSince being in grad school, I find that I'm actually really tired at the end of the day, so I usually watch a show and crochet to unwind. On the weekends I try to do things with my friends around the Bay Area, usually in San Francisco since there's so much happening all the time. I recently picked up pickleball, so on Sunday morning, I play with my friends in San Francisco.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f63e18ad-d8be-4ffd-b01f-202e27056645\"}":{"__typename":"School","uuid":"f63e18ad-d8be-4ffd-b01f-202e27056645","name":"Punahou School","city":"Honolulu","type":"HIGH","state":"Hawaii","country":"United States","zip":"96822"},"Education:{\"uuid\":\"b044a6f3-66e9-4691-96c7-3a1eb1cc022f\"}":{"__typename":"Education","uuid":"b044a6f3-66e9-4691-96c7-3a1eb1cc022f","school":{"__ref":"School:{\"uuid\":\"f63e18ad-d8be-4ffd-b01f-202e27056645\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"76bacb55-5994-4f24-9bfd-45a3a5319bc5\"}":{"__typename":"Education","uuid":"76bacb55-5994-4f24-9bfd-45a3a5319bc5","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Geochemistry and Applied Math","degree":null},"MentorPublicProfile:{\"uuid\":\"028290b5-4a08-4bad-b00f-b0d9cb3e4ed5\"}":{"__typename":"MentorPublicProfile","uuid":"028290b5-4a08-4bad-b00f-b0d9cb3e4ed5","displayName":"Celia K.","slug":"celia-kongjohnson","biography":"\u003cp\u003eI'm from Honolulu, Hawaii and am currently a first year PhD student at UC Berkeley studying Geochemistry with a focus on isotope geochemistry in various plant materials. I did my undergraduate at Brown University where I majored in Geochemistry and Applied Math. My research at Brown focused on reconstructing past precipitation in the Philippines using isotopic data from calcium carbonate cave deposits and linking it to how the southeast Asian monsoon evolved over the past 5,000 years. I did 2 summer research fellowships during my undergrad: one at Caltech and one at the National Center for Atmospheric Research (NCAR). At Caltech I did more geochemistry work where I worked to develop a method for position-specific carbon isotope analysis in tree rings; at NCAR I branched out and did more computational work relating to climate and the first voyages to Hawaii. Over my undergrad career I applied to and considered many avenues of research/summer internships, so reach out if you have any questions about navigating internship/research applications!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEarth science is a very interdisciplinary field, so despite my focus in this field, my research often involves many aspects of biology, physics, and math (and of course chemistry), which I am eager to delve into with any of my mentees. I’m really excited to be joining the team here at Curious Cardinals and work with students to help them not only develop skills in a specific subject, but also skills that they can use throughout their academic and professional career. I’ve been lucky enough to have incredible mentors who have supported and guided me to where I am today. They not only influenced my academic growth, but my personal growth as well. I’m excited for the opportunity to pay that forward, helping students discover their passions, build confidence, and reach their full potential.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince coming to Berkeley, I've been enjoying exploring SF and the Bay Area - there's so much happening every weekend, so it’s really nice to get into the city every now and then. I love to travel and go to national parks, which is another plus that I’m finding out about the Bay Area (so many outdoor activities and national parks!). I am also a HUGE foodie and will accept any reason to go try a new place or eat out at a favorite restaurant. My favorite cuisine is probably Japanese, specifically sushi, I love matcha and chai, and I love, love, love ice cream. I did hurdles in college, and since graduating this spring I’ve found myself signing up for more running events – I did the 2025 SF marathon, I’m doing the 2025 Berkeley half marathon, and I will probably do the 2026 SF marathon.\u003c/p\u003e","teachingVideoPlaybackId":"OMfKEnQ23cBjob5Sqodgo00YP6nfxFgWBiMAjq9HdlH00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDuring my senior year of college, I worked hard on writing my Senior Honors Thesis and applying to graduate schools, so my greatest achievement so far stems from this. I won 2 awards for my research in my department, got into my top choice graduate school (with the advisor that I wanted), and finished my Senior Honors Thesis. I also won the National Science Foundation Graduate Research Fellowship Award, which was especially competitive this past year.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d89f5909-f4c0-43f8-8258-d06c96f1ab45\"}"},{"__ref":"Favorites:{\"uuid\":\"e7cf5895-b79f-49f9-bea0-70f1a7227f3a\"}"},{"__ref":"Favorites:{\"uuid\":\"554fd062-0379-442f-8376-0f5c54503cb0\"}"}],"causesSupported":[],"major":"Geochemistry and Applied Math","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"97f8ea17-800a-4d05-9b93-cd71df4cf5fd\"}"},{"__ref":"DeepDives:{\"uuid\":\"47247077-08a7-421e-a66d-e464a399c46e\"}"},{"__ref":"DeepDives:{\"uuid\":\"7c2f9faa-b55e-4547-b24f-a447bff7180e\"}"},{"__ref":"DeepDives:{\"uuid\":\"e9f3f1e6-ef6f-4b62-9f46-cc8f6c10b690\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f4da65a0-054d-4e46-b8e1-86816e637223/-/preview/-/format/jpg/","https://ucarecdn.com/2527f7ff-34d3-49d4-845b-6e83b822a17f/-/preview/-/format/jpg/","https://ucarecdn.com/a099ccf2-16d8-43cd-bea0-7dc66b28c0cc/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b044a6f3-66e9-4691-96c7-3a1eb1cc022f\"}"},{"__ref":"Education:{\"uuid\":\"76bacb55-5994-4f24-9bfd-45a3a5319bc5\"}"}],"hiredAt":"2025-10-24T04:08:52.509Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Chemistry","Writing","College Essay Writing","Executive Function","Creative Writing","STEM Project"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"celia-kongjohnson\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"028290b5-4a08-4bad-b00f-b0d9cb3e4ed5\"}"}}},"_sentryTraceData":"8e6247be8d9e499face49f7500389ee4-8044325564e46c86-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8e6247be8d9e499face49f7500389ee4,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"celia-kongjohnson"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().g
