xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1bdf9290-f704-437c-a8b8-e74d2826bc34\"}":{"__typename":"Favorites","uuid":"1bdf9290-f704-437c-a8b8-e74d2826bc34","photoUrl":"https://ucarecdn.com/d3ff4a1d-1157-4142-a462-1c8366711314/","title":"ping pong","type":"SPORT"},"Favorites:{\"uuid\":\"9bc7dcc7-d324-4404-a68f-d178e18fd228\"}":{"__typename":"Favorites","uuid":"9bc7dcc7-d324-4404-a68f-d178e18fd228","photoUrl":"https://ucarecdn.com/b20193f6-6c44-4dbd-b77f-d7aab615a90a/","title":"malarky","type":"GAME"},"Favorites:{\"uuid\":\"4b8fb329-a0cc-4e69-af12-16e35f416b47\"}":{"__typename":"Favorites","uuid":"4b8fb329-a0cc-4e69-af12-16e35f416b47","photoUrl":"https://ucarecdn.com/c4002408-78c4-49df-9082-42aabddee853/","title":"try everything","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"117257d9-5353-46dc-bb60-4b6dbb52d377\"}":{"__typename":"DeepDives","uuid":"117257d9-5353-46dc-bb60-4b6dbb52d377","content":"\u003cp\u003e\u003cem\u003eIt's never too early.\u003c/em\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout middle and high school, I was told to just be patient, to wait until I get a degree and a \"real job\" to start making a difference. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut I quickly learned that age is just a number. If you want to start a non-profit, or launch a campaign, it's never too early.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn middle school, I founded my own tutoring company, the Kool SKool, to help my peers connect their learnings to real-world issues. In high school, I expanded the concept into the Tinker Project, a five-week summer camp for low-income students in my community. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Curious Cardinals, I'm excited about mentoring passion projects in particular, inspiring the next generation to believe that they truly are capable of anything. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"76b7bb55-79f5-4ccc-955b-d6c962bc5cba\"}":{"__typename":"DeepDives","uuid":"76b7bb55-79f5-4ccc-955b-d6c962bc5cba","content":"\u003cp\u003eAs a middle schooler, I was constantly moving due to my parents' work, switching between homes and schools. I sometimes found it difficult to fit in or make friends. Instead, I hyperfocused on my academics, and on becoming the best that I could be. I was quiet and shy, but was always the hardest worker in the room. I would often get bored when concepts came too easily to me, and I was always looking for creative ways to challenge myself. I took on elaborate projects and taught myself the most random skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I began to come out of my shell, getting involved in tons of extracurriculars and taking on several leadership roles. Academics were still a priority, and I was definitely still an introvert, but I began putting myself out there, trying new things and discovering my own unique sense of confidence. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm passionate about helping people find that extra challenge, or motivating students to put themselves out there. Both in and out of the classroom, I'm eager to inspire individuals to unlock their full potential. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"22659e3b-4a52-40e5-9962-66cd7dc45766\"}":{"__typename":"DeepDives","uuid":"22659e3b-4a52-40e5-9962-66cd7dc45766","content":"\u003cp\u003eIn my spare time, I have a bunch of random hobbies. I'm an Eagle Scout, so I love being outdoors, even in the snow or rain. My favorite outdoor activity is backpacking, but I'll never turn down a camping or kayaking trip. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love using my hands for literally anything and everything. One of my favorite pastimes is baking, and I'm especially a fan of making realistic cakes (yes, like the ones on TV!). I really enjoy cooking, where I challenge myself to never make the same thing twice. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've spent countless hours sewing, embroidering and crocheting everything from quilts and sweaters to beanbags and stuffed animals. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy favorite way to get my aggression out is through power tools. I really love using saws and drills to build-well, anything, really. The bigger, the better! On the weekends, I'll make elaborate cardboard structures like safes and vending machines. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I've gotten into change-ringing, the centuries-old English practice of ringing mathematical permutations of tuned bells. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"97cf9361-1841-438e-adc9-ddb1fcea2478\"}":{"__typename":"DeepDives","uuid":"97cf9361-1841-438e-adc9-ddb1fcea2478","content":"\u003cp\u003eI taught myself ping pong during Covid and ended up getting pretty good! I competed in tournaments throughout high school and was even an international qualifier. At practices and meets, I noticed the sport was extremely male-dominated. So I started a club to inspire young women to play as an outlet for fun and confidence-building. One of my mentees even went on to win a gold medal! In college, I'm organizing free lessons for students with professional coaches and Olympic-level players. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"49231d4f-8808-4a17-8bba-886395680ef3\"}":{"__typename":"School","uuid":"49231d4f-8808-4a17-8bba-886395680ef3","name":"Plainfield North High School","city":"Plainfield","type":"HIGH","state":"Illinois","country":"United States","zip":"60585"},"Education:{\"uuid\":\"2ed9d74f-6c1d-4e79-9f94-d1c4a00a50a0\"}":{"__typename":"Education","uuid":"2ed9d74f-6c1d-4e79-9f94-d1c4a00a50a0","school":{"__ref":"School:{\"uuid\":\"49231d4f-8808-4a17-8bba-886395680ef3\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"f05c11dd-1fe9-4edc-9ef5-d4b5818974fd\"}":{"__typename":"Education","uuid":"f05c11dd-1fe9-4edc-9ef5-d4b5818974fd","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Medical Anthropology","degree":null},"MentorPublicProfile:{\"uuid\":\"feec7dbb-c459-45ad-b2f7-1a0f7577834a\"}":{"__typename":"MentorPublicProfile","uuid":"feec7dbb-c459-45ad-b2f7-1a0f7577834a","displayName":"Serena S.","slug":"serena-sabzaali","biography":"\u003ch3\u003e\u003cstrong\u003eSerena (Passion Project)\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eHi! I’m Serena, a first-year Medical Anthropology student at Princeton University, and I’m passionate about helping students turn their ideas into reality.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eA few years ago, I was a high school student desperate to enact real change in my community, but with no clear path for how to go about it. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, I’ve:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFounded my own \u003cstrong\u003etutoring center\u003c/strong\u003e, \u003cstrong\u003esummer camp\u003c/strong\u003e and \u003cstrong\u003eping-pong club\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInitiated service projects at \u003cstrong\u003eMvita Primary School\u003c/strong\u003e in Mombasa, Kenya\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eThese experiences taught me not only how to positively impact my community, but how to become an active global citizen.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI mentor students who want to:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFound a non-profit\u003c/strong\u003e (everything from researching a cause to executing events)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLaunch a campaign\u003c/strong\u003e (podcasts, fundraisers and everything in between)\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also help students develop skills that make all the difference in project success. I’ve helped past mentees learn how to network with organizations and gain more confidence in leadership and public speaking!\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI was a peer tutor throughout high school, as well as a teacher and mentor through my Jamatkhana (religious center) and Scouts troop. I’ve guided students through everything from discovering a new passion to honing existing skills.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurning a general interest (“I love to crochet”) into a specific, actionable project\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eMapping out a step-by-step plan with milestones\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePracticing how to present your project so it feels natural and engaging\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e(don’t worry, I only bite when I’m really hungry)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eOutside of school\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I’m a big fan of \u003cstrong\u003ebackpacking, ping-pong, and baking realistic cakes\u003c/strong\u003e (yes, like the ones on TV!). I’m also a Scrabble enthusiast and have recently gotten into Ultimate Tic-Tac-Toe (it gets intense!).\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love to use my hands to do everything from sewing and crocheting to building stairs and tables. I love to cook, but I will never make the same thing twice. I will devour books in one sitting on a regular basis, and I will watch medical shows on repeat (I’ve watched every episode of Grey’s Anatomy six times to date).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re curious, motivated, and ready to build something you’ll be proud of, I’d love to help you make it happen.\u003c/p\u003e","teachingVideoPlaybackId":"Wv7MefL00BrK55iBEmquqoDvJCSpRxckjhj9h01AaEMCY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1bdf9290-f704-437c-a8b8-e74d2826bc34\"}"},{"__ref":"Favorites:{\"uuid\":\"9bc7dcc7-d324-4404-a68f-d178e18fd228\"}"},{"__ref":"Favorites:{\"uuid\":\"4b8fb329-a0cc-4e69-af12-16e35f416b47\"}"}],"causesSupported":[],"major":"Medical Anthropology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"117257d9-5353-46dc-bb60-4b6dbb52d377\"}"},{"__ref":"DeepDives:{\"uuid\":\"76b7bb55-79f5-4ccc-955b-d6c962bc5cba\"}"},{"__ref":"DeepDives:{\"uuid\":\"22659e3b-4a52-40e5-9962-66cd7dc45766\"}"},{"__ref":"DeepDives:{\"uuid\":\"97cf9361-1841-438e-adc9-ddb1fcea2478\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d6658116-62af-4c80-9a6b-6df1bc2d0ee0/-/preview/-/format/jpg/","https://ucarecdn.com/9880f2e7-7d9f-42b3-a8f3-b64bc787d8b8/-/preview/-/format/jpg/","https://ucarecdn.com/3a00e739-ce1b-4355-bea3-346b37113c75/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2ed9d74f-6c1d-4e79-9f94-d1c4a00a50a0\"}"},{"__ref":"Education:{\"uuid\":\"f05c11dd-1fe9-4edc-9ef5-d4b5818974fd\"}"}],"hiredAt":"2025-12-23T10:04:22.142Z","topics":["Geometry","6-8 Grade Science","Chemistry","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","K-6 Storybook","STEM Project","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","K-5 Grade Math","Biology"],"communityBadges":["https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/"],"restrictedProfileVisibilit
