\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"1ce01cd3-0982-42c3-b3af-48f747518262\"}":{"__typename":"DeepDives","uuid":"1ce01cd3-0982-42c3-b3af-48f747518262","content":"\u003cp\u003eMy dream job would be running a nonprofit organization that pushes the boundaries of global health in the right direction, focusing on capacity building and empowering communities rather than extracting resources from communities or working for my own empowerment. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"03aea89d-8435-44f2-ae9b-778ec76643c3\"}":{"__typename":"School","uuid":"03aea89d-8435-44f2-ae9b-778ec76643c3","name":"Wiregrass Ranch High School","city":"Wesley Chapel","type":"HIGH","state":"Florida","country":"United States","zip":"33543"},"Education:{\"uuid\":\"548fd46f-a735-4552-a6ba-9b791ba3e01a\"}":{"__typename":"Education","uuid":"548fd46f-a735-4552-a6ba-9b791ba3e01a","school":{"__ref":"School:{\"uuid\":\"03aea89d-8435-44f2-ae9b-778ec76643c3\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"3e89f8ec-6593-41cc-b634-d6e796449c8f\"}":{"__typename":"Education","uuid":"3e89f8ec-6593-41cc-b634-d6e796449c8f","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Public Health","degree":"B.A."},"MentorPublicProfile:{\"uuid\":\"7c8a03d0-ceb9-43ed-9333-8310b063cdc9\"}":{"__typename":"MentorPublicProfile","uuid":"7c8a03d0-ceb9-43ed-9333-8310b063cdc9","displayName":"Neil R.","slug":"neil-rupani","biography":"\u003cp\u003eNeil is a Brown University alumnus, passionate about Global Health and attending medical school at home in Florida. Growing up hearing stories of his parents and grandparents struggles with poverty in India, Neil always felt the responsibility to serve those in low-resourced settings. At high school in Florida, he started a non-profit organization to provide resources for respiratory healthcare in rural India. At Brown, Neil has continued his commitment to community service initiatives both locally and internationally. Neil co-founded Brown's Doctors and Engineers without Borders Student Chapter, in which he has worked to develop a water distribution system and community health worker system in Obuasi, Ghana. Alongside this endeavor, Neil has worked as a patient advocate, conducted research on infectious diseases in the Congo and Brazil, and worked as a teaching assistant for biology courses. Neil has traveled abroad both for service projects and for his studies. He traveled to Loma Bonita, Mexico to fund and distribute medical equipment to a shelter in the community. He also studied abroad at King’s College in London, where he shadowed clinicians and learned about the healthcare system in the UK. Outside of school Neil loves produce music, DJ, and dance. He also enjoys spending time outdoors doing calisthenics and meditating (on the few days that’s its sunny in Providence). Neil looks forward to sharing his passion for applied learning with students and giving back to communities as his mentors have done for him.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Public Health","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3def2dd7-1cb6-41a7-84c2-b2934c514c2e\"}"},{"__ref":"DeepDives:{\"uuid\":\"410c08f6-5b70-448f-aa31-a1e4b9d8c477\"}"},{"__ref":"DeepDives:{\"uuid\":\"f12d84
