":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"1528f3dd-49e4-460f-b3bf-a24b1a921122\"}":{"__typename":"DeepDives","uuid":"1528f3dd-49e4-460f-b3bf-a24b1a921122","content":"\u003cp\u003eMy dad! He is one of the happiest and most successful people I know; he always taught my brother and I that no goal is out of reach and that we should pursue the career that we love because success comes from happiness. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ecdd5840-0b52-41a4-be4b-0fac11960e1d\"}":{"__typename":"DeepDives","uuid":"ecdd5840-0b52-41a4-be4b-0fac11960e1d","content":"\u003cp\u003eIn high school, I really enjoyed physics and ended up taking an engineering elective class. The 11th grade bridge competition helped me find that I really enjoyed building and engineering things. I fell more in love with the engineering field as college application time came around and decided to pursue Mechanical Engineering because it would allow me to have the most robust experience in this field!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"20cfff8e-c6b6-4577-87f6-ad6e7cafde25\"}":{"__typename":"DeepDives","uuid":"20cfff8e-c6b6-4577-87f6-ad6e7cafde25","content":"\u003cp\u003eI like to hangout with my new rescue dog Sammie, volunteer at the animal shelter, read a book, bake cookies, spend time with friends, and go hiking or on a long walk.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}":{"__typename":"School","uuid":"1dc8c564-7629-4af5-851c-69ed64a8870e","name":"Ransom Everglades High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33133"},"Education:{\"uuid\":\"c9b84414-764b-4844-a5ce-086726c0ce29\"}":{"__typename":"Education","uuid":"c9b84414-764b-4844-a5ce-086726c0ce29","school":{"__ref":"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"24a67341-00ad-405d-a427-335cecce6022\"}":{"__typename":"Education","uuid":"24a67341-00ad-405d-a427-335cecce6022","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"aaaa94a2-59fb-4ea9-9ff5-ae5a3d30852a\"}":{"__typename":"MentorPublicProfile","uuid":"aaaa94a2-59fb-4ea9-9ff5-ae5a3d30852a","displayName":"Holly A.","slug":"holly-alesandro","biography":"\u003cp\u003eHi! My name is Holly and I am an undergraduate student at Georgia Tech majoring in Mechanical Engineering and minoring in Nuclear Engineering. I am very passionate about the nuclear energy field and look forward to helping develop the next wave of energy post graduation! \u003c/p\u003e\u003cp\u003eOutside of career and academics... I enjoy staying active by going to the gym, running, and hiking; I absolutely love animals and regularly volunteer at a local animal shelter (I even adopted my own dog this past year!); and I spend a lot of my free time reading,
