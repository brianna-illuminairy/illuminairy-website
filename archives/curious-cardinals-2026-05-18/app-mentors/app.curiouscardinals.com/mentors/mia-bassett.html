xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d9b1aeae-0c50-44e3-ba8e-62482e91e518\"}":{"__typename":"Favorites","uuid":"d9b1aeae-0c50-44e3-ba8e-62482e91e518","photoUrl":"https://ucarecdn.com/07087ee1-8c26-4197-a9d8-d7270ff98ff5/","title":"San Francisco Giants","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"dcd406ef-4dc7-44d3-be2a-8940a2c596e0\"}":{"__typename":"Favorites","uuid":"dcd406ef-4dc7-44d3-be2a-8940a2c596e0","photoUrl":"https://ucarecdn.com/4ae200fb-be8e-42a9-92db-808a25def99f/","title":"Little Women (2019)","type":"MOVIE"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5a055a51-f975-4aa1-b458-707ef529a70c\"}":{"__typename":"DeepDives","uuid":"5a055a51-f975-4aa1-b458-707ef529a70c","content":"\u003cp\u003eIn high school I spent my summers coaching swimming! I was never the fastest swimmer, but swimming provided me with an amazing community of the most incredible people. I loved seeing my swimmers build their self confidence over the course of the summer and reach their goals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b5f78bd4-a820-461c-b7c9-19d77d2f3eb5\"}":{"__typename":"DeepDives","uuid":"b5f78bd4-a820-461c-b7c9-19d77d2f3eb5","content":"\u003cp\u003eGrowing up in the Bay Area, I wasn’t really exposed to people working in the creative industries. It wasn’t until I came to college and met other film students that I gained a clearer understanding of the possible career paths in the entertainment industry. Since film and digital media are not something traditionally taught in high school, it can feel overwhelming to learn all the foundational topics at once. Having someone to guide you through the process is invaluable, and I love being that person for my students!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"850067ad-ab99-44f6-b62f-839c52f34d45\"}":{"__typename":"DeepDives","uuid":"850067ad-ab99-44f6-b62f-839c52f34d45","content":"\u003cp\u003eAlthough I am a NorCal girl at heart, I hope to work in Hollywood someday! My dream job is to work at a talent agency, production company or media company. My favorite movies and tv shows have been so impactful to me, and I want to help create meaningful media in any way possible!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6a9bb2ef-f54e-42a7-855c-159b5e075725\"}":{"__typename":"DeepDives","uuid":"6a9bb2ef-f54e-42a7-855c-159b5e075725","content":"\u003cp\u003eIn my junior year of high school, I was assigned to make a short documentary about something I was passionate about. I chose to feature the Girl Scout camp I grew up attending, which burned down in the CZU Lightning Complex Fires in Northern California in 2020. I was so invested in sharing this story that I took on the project as a passion project, even interviewing the CEO of Girl Scouts of Northern California. This project taught me the importance of perseverance and creative exploration; I often return to this experience to remind myself what is possible when I put my mind to it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"2f34c995-7021-499a-9a8f-275aa4bd4b95\"}":{"__typename":"School","uuid":"2f34c995-7021-499a-9a8f-275aa4bd4b95","name":"Mountain View High School","city":"Mountain View","type":"HIGH","state":"California","country":"United States","zip":"94040"},"Education:{\"uuid\":\"109e2803-dd5e-4b2e-88df-4727b8707b13\"}":{"__typename":"Education","uuid":"109e2803-dd5e-4b2e-88df-4727b8707b13","school":{"__ref":"School:{\"uuid\":\"2f34c995-7021-499a-9a8f-275aa4bd4b95\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"7a3d0a63-6117-4332-b9bf-75be31f93fe3\"}":{"__typename":"Education","uuid":"7a3d0a63-6117-4332-b9bf-75be31f93fe3","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Radio/Television/Film and Integrated Marketing Communications","degree":null},"Testimonial:c954236f-c19e-4bb8-9a7e-e92c6c960ed0":{"__typename":"Testimonial","id":"c954236f-c19e-4bb8-9a7e-e92c6c960ed0","text":"Mia was an incredible support to Layla with each step of building her website! Thank you Mia!","date":"2025-05-26 00:18:45.899+00","rating":5,"endorser":{"__typename":"Endorser","name":"Anu Vadhan","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"537b07df-4add-4dcb-beca-fd7f711b32c8\"}":{"__typename":"MentorPublicProfile","uuid":"537b07df-4add-4dcb-beca-fd7f711b32c8","displayName":"Mia B.","slug":"mia-bassett","biography":"\u003cp\u003eHi! My name is Mia, and I am a student at Northwestern University studying Radio/Television/Film and Integrated Marketing Communications. My passion for digital media began when I got my first camera in 7th grade, and I have been documenting my life through photos and videos ever since. I took my first film class in high school and immediately knew it was something I wanted to pursue for the rest of my life!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Northwestern, I have learned about every aspect of the film and entertainment industry, both the creative and business sides. Through my exploration of the filmmaking process, I have found my passion truly lies in cinematography, which means operating the camera and designing each shot.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis past year, I was the Director of Photography on a feature-length film for the charity Applause for a Cause at Northwestern, a project I am extremely proud of! I am also on the board of Studio 22 Productions, Northwestern’s oldest student-run production company.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA fun fact about me is that I work as a camera operator for the San Jose Giants (the minor league affiliate team of the San Francisco Giants)! Outside of film, I am very involved with Girl Scouts of Northern California, where I have spent the last four years working as a camp counselor. Being outdoors is my happy place, and I am constantly exploring new spots around the Bay and Chicago (though most of the time, I just miss the Bay Area nature).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOtherwise, I love reading, writing, crafting, baking, and cooking! I am currently challenging myself to bake something new every week which has been quite the adventure. I am so grateful for my arts and humanities education which inspired me to pursue this career path, and I hope to provide the same opportunity to others.\u003c/p\u003e","teachingVideoPlaybackId":"ZOBoHQUIktdYxke01cvXVeKg2Awv01r7hIY01a6XBg79fM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d9b1aeae-0c50-44e3-ba8e-62482e91e518\"}"},{"__ref":"Favorites:{\"uuid\":\"dcd406ef-4dc7-44d3-be2a-8940a2c596e0\"}"}],"causesSupported":[],"major":"Radio/Television/Film and Integrated Marketing Communications","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5a055a51-f975-4aa1-b458-707ef529a70c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b5f78bd4-a820-461c-b7c9-19d77d2f3eb5\"}"},{"__ref":"DeepDives:{\"uuid\":\"850067ad-ab99-44f6-b62f-839c52f34d45\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a9bb2ef-f54e-42a7-855c-159b5e075725\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/390f41e5-1e28-4d11-91ee-68f26df0a3c4/-/preview/-/format/jpg/","https://ucarecdn.com/5e0a10f4-666c-43af-880d-a57290563605/-/preview/-/format/jpg/","https://ucarecdn.com/7c18e4df-63a4-4127-afaa-ed44253e78df/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"109e2803-dd5e-4b2e-88df-4727b8707b13\"}"},{"__ref":"Education:{\"uuid\":\"7a3d0a63-6117-4332-b9bf-75be31f93fe3\"}"}],"hiredAt":"2024-07-04T04:16:39.703Z","topics":["Writing","Reading","College Essay Writing","Creative Writing","K-6 Storybook","Visual Arts / Graphic Design","Film / Theater","Video / Photography","History Project","Web Design","Public Speaking"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:c954236f-c19e-4bb8-9a7e-e92c6c960ed0"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mia-bassett\"}})":{"__ref":"MentorPubl
