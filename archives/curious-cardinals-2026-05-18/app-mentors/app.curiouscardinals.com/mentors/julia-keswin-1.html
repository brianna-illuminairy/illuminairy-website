xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"5d76d16f-f424-4324-99ed-06240e28e61a\"}":{"__typename":"DeepDives","uuid":"5d76d16f-f424-4324-99ed-06240e28e61a","content":"\u003cp\u003eSomething you wouldn't know about me just by looking is that I am an athlete. I grew up in New York City, but my family and I moved to Colorado when I was in first grade. I fell in love with skiing and joined a ski racing team in Connecticut when I moved back to New York. I raced competitively for 10 years and even won a national title! Ski racing is tough, both mentally and physically. Races consist of two make-or-break runs and I've learned the consequence of this rule the hard way. Skiing taught me commitment, perseverance, and even how to prevent frostbite. But, the best part is shocking everyone when they see me on the mountain!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4d32c127-ff98-4f6e-806f-190a4b57c090\"}":{"__typename":"DeepDives","uuid":"4d32c127-ff98-4f6e-806f-190a4b57c090","content":"\u003cp\u003eChance Favors the Prepared Mind! My middle name \"Chance\" is actually named after this quote which says that hard, preparatory work leads to success. Reflecting on High School and Middle School, it is clear that those who challenged themselves and went beyond what was asked of them reaped the benefits!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"76f4a427-85ad-4ecc-bc02-78d4e59fcea7\"}":{"__typename":"DeepDives","uuid":"76f4a427-85ad-4ecc-bc02-78d4e59fcea7","content":"\u003cp\u003eI really want to run a half marathon soon!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"5244771e-97db-4351-b6fe-86e1889b908f\"}":{"__typename":"Education","uuid":"5244771e-97db-4351-b6fe-86e1889b908f","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"6e447c98-770d-4913-8f75-dca14fff95bc\"}":{"__typename":"Education","uuid":"6e447c98-770d-4913-8f75-dca14fff95bc","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Marketing \u0026 Business Analytics","degree":null},"MentorPublicProfile:{\"uuid\":\"e7d84326-5eb6-4214-be2d-39d4bfc9d262\"}":{"__typename":"MentorPublicProfile","uuid":"e7d84326-5eb6-4214-be2d-39d4bfc9d262","displayName":"Julia K.","slug":"julia-keswin-1","biography":"\u003cp\u003eHi! My name is Julia Keswin and I am so excited to be part of the Curious Cardinals Team. I am so lucky to have had amazing mentors throughout high school and college and I would love to be yours!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am currently a senior at the University of Pennsylvania where I study Marketing \u0026amp; Business Analytics. I have always had a passion for marketing, even though I didn’t know marketing is what I would study. For as long as I can remember, I have been captivated by brands and consumer sentiment. I grew up watching the Superbowl advertisements with more enthusiasm than I did the football and I vividly recall the disappointment I felt when my mom brought home a new brand of hummus instead of Sabra or a new salsa instead of Tostitos. I look back at these moments and realize the power of marketing to shape our perceptions and drive our choices. I spent the last summer working in Consumer Marketing in New York City and hope to be a Chief Marketing Officer one day!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Penn, I work as a teaching assistant for Wharton’s public speaking course and as a consultant for Tamid, and I am part of the Marketing Undergraduate Student Establishment.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school and work, I love sports! I love skiing, tennis, and cheering for the New York Knicks. I also love to travel, try new restaurants, and attempt to finish the New York Times Crossword Puzzle.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love working with young people and hope to not only teach them but give them tools that they can use to learn and grow on their own. I am eager to mentor students in reading, writing, college essay prep, public speaking, or a marketing passion project!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFeel free to reach out with any questions!\u003c/p\u003e","teachingVideoPlaybackId":"ewow01vnKkqRe7Kf00ak4Y7T6jgv78Z3atFYPs02x5IeOY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Marketing \u0026 Business Analytics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5d76d16f-f424-4324-99ed-06240e28e61a\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d32c127-ff98-4f6e-806f-190a4b57c090\"}"},{"__ref":"DeepDives:{\"uuid\":\"76f4a427-85ad-4ecc-bc02-78d4e59fcea7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4c55cd94-12fd-4617-bbaf-5b86b613c063/-/preview/-/format/jpg/","https://ucarecdn.com/e3cbf235-aa18-4765-8cdc-78494c775a81/-/preview/-/format/jpg/","https://ucarecdn.com/9f03b3dc-c7b9-4991-9d32-df76fab8f664/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5244771e-97db-4351-b6fe-86e1889b908f\"}"},{"__ref":"Education:{\"uuid\":\"6e447c98-770d-4913-8f75-dca14fff95bc\"}"}],"hiredAt":"2024-11-12T10:41:13.841Z","topics":["Public Speaking","Writing","Business / Entrepreneurship","College Essay Writing","Academic Coaching","History","K-5 Grade Math"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"julia-keswin-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e7d84326-5eb6-4214-be2d-39d4bfc9d262\"}"}}},"_sentryTraceData":"06d753a13ce44ad0b783c6772ab42d20-8181cf7792fa7109-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=06d753a1
