js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"2b3ddb04-86fc-41cd-8789-f3f3b21a93a6\"}":{"__typename":"DeepDives","uuid":"2b3ddb04-86fc-41cd-8789-f3f3b21a93a6","content":"\u003cp\u003eGrowing up across four countries has deeply shaped how I approach teaching and mentorship. Being immersed in different educational systems and cultural norms taught me early on that there is no single “right” way to think, learn, or succeed—and that perspective shows up in how I work with students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of this background, I’m especially attentive to how context shapes understanding. I’m patient with students who think differently, ask unconventional questions, or need time to articulate their ideas, and I encourage them to see those differences as strengths rather than obstacles. I also tend to emphasize \u003cem\u003ewhy\u003c/em\u003e something matters, not just \u003cem\u003ehow\u003c/em\u003e to do it, helping students connect abstract concepts to real-world situations and their own experiences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy identity has also made me very conscious of access and confidence. I aim to create a space where students feel safe asking questions, challenging ideas, and developing their own voice. Ultimately, my heritage has taught me that learning is relational and contextual. I try to meet students where they are, respect where they’re coming from, and help them build the confidence to navigate unfamiliar academic spaces with curiosity rather than fear.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bc9ff9da-6218-45c9-9f73-75796af4258b\"}":{"__typename":"DeepDives","uuid":"bc9ff9da-6218-45c9-9f73-75796af4258b","content":"\u003cp\u003eI would tell my middle- or high-school self that you don’t need to have a perfectly defined path in order to be doing well. It’s okay if your interests feel scattered or if you’re drawn to things that don’t obviously “match” each other yet. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would also say: don’t confuse being capable with being confident. There were many moments when I understood the material but doubted my voice or waited for permission to speak up. I’d remind myself that asking questions, changing your mind, or not knowing something right away are not weaknesses, but they’re signs that you’re actually engaging with the work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I’d emphasize the importance of learning how you learn. Grades matter, but understanding \u003cem\u003ewhy\u003c/em\u003e something is hard for you, what strategies help, and when you need support matters more in the long run. If you can build those habits early, you’ll be far better equipped for whatever comes next, even if you don’t yet know what that is.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f0f4d4a2-48d2-4a47-885e-aa5fec5044f4\"}":{"__typename":"DeepDives","uuid":"f0f4d4a2-48d2-4a47-885e-aa5fec5044f4","content":"\u003cp\u003eI love cooking and hosting friends. Experimenting in the kitchen and sharing meals is one of my favorite ways to unwind and connect with people. When I want to reset or get some alone time, I turn to movement: hot yoga, long walks, gardening, and spending time outdoors help me clear my head and stay grounded.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d84b93be-0928-4572-bbca-b110cc106fd2\"}":{"__typename":"DeepDives","uuid":"d84b93be-0928-4572-bbca-b110cc106fd2","content":"\u003cp\u003eMentorship matters to me because so much of my own growth came from people who took my curiosity seriously before I fully knew how to articulate it. At key moments, having someone help me name my interests, ask better questions, or see possibilities I hadn’t considered made a lasting difference by helping me trust my thinking.\u003c/p\u003e\u003cp\u003eI also know how intimidating academic and professional spaces can feel. Mentorship, at its best, makes those spaces more navigable. It turns confusion into something manageable and self-doubt into a skill you can work with rather than something that stops you.\u003c/p\u003e\u003cp\u003eFor me, mentorship is about meeting students where they are and helping them build both confidence and tools: how to break down a problem, how to study effectively, how to ask for help, and how to recognize what genuinely excites them. I care deeply about creating an environment where students feel supported, challenged, and taken seriously. Feeling seen and guided as a young student changed how I approached learning for years to come.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"2261481a-69ac-40e0-a886-848446414042\"}":{"__typename":"School","uuid":"2261481a-69ac-40e0-a886-848446414042","name":"The American School in London","city":"London","type":"HIGH","state":"England","country":"United Kingdom","zip":"NW8 0NP"},"Education:{\"uuid\":\"f0a26629-1e96-432f-9cde-e07b3d85d51b\"}":{"__typename":"Education","uuid":"f0a26629-1e96-432f-9cde-e07b3d85d51b","school":{"__ref":"School:{\"uuid\":\"2261481a-69ac-40e0-a886-848446414042\"}"},"startYear":"2014","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"90396e7b-afbd-4ec6-b3e8-eb92a5086b98\"}":{"__typename":"Education","uuid":"90396e7b-afbd-4ec6-b3e8-eb92a5086b98","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"bed0fbb9-7c19-4ebb-979a-ac7bef82f0f4\"}":{"__typename":"MentorPublicProfile","uuid":"bed0fbb9-7c19-4ebb-979a-ac7bef82f0f4","displayName":"Charlotte F.","slug":"charlotte-fink","biography":"\u003cp\u003eHi! My name is Charlotte. The first thing to know about me is that I bring an international perspective to my conversations, relationships, and approach to work. I was born in London to an American mother and French father, and completed most of my education in the UK. However, I also spent a portion of my childhood living in Dubai from 2011-2014, and lots of time between New York, France, and Switzerland visiting family. As a result, I am fluent in both English and French with elementary proficiency in Spanish and Arabic. I love languages and am working towards full proficiency!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI moved to the US in 2022 to attend Yale University, where I am now in my last year and in the process of writing my senior thesis for my major, Cognitive Science (or as we call it, Cog Sci). My focus within Cog Sci is on decision making, centred particularly on criminal behaviour and the question: why do people make choices that seem irrational or unfair, especially when the consequences are serious? This has driven my thesis topic, which is about how socio-economic status relates to decision making in tricky situations. Through Yale’s Mechanisms of Disinhibition Lab (MoD Lab), I personally collected the data (running interviews, cognitive/executive functioning examinations, running psych tasks) for my thesis from over 130 participants in the greater New Haven area, the majority of whom struggle with addiction, homelessness, reintegration, and are especially prone to risky behaviour.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlso through the MoD Lab, I am proud to say that I was recently published as a co-author on the paper “\u003cem\u003eWhat we have learned about adolescent mental health and where we are going after a decade with the Adolescent Brain Cognitive Development Study” (\u003cu\u003ehttps://doi.org/10.1016/j.dcn.2026.101686\u003c/u\u003e) \u003c/em\u003ein the academic journal \u003cem\u003eScienceDirect\u003c/em\u003e. I am passionate about working with children and teenagers, having mentored since age 14 (I’m now 22!). My experience has spanned from volunteering homework help with children as young as five at the Doorstep Homeless Families Project, to supporting private school students in their Ivy League applications, to working with younger Yalies. Regardless of my students’ background, my priority is to form a deep and lasting relationship, to listen and to and support my mentees across domains, and to build their passions and confidence. I joined Curious Cardinals because I can’t imagine giving up mentoring once I graduate (May 2026).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I am also the founder and president of the Yale Undergraduate Women’s Law Association, where I organize speaker events, career panels, and mentorship opportunities for students interested in law. I spent a summer working at the New York State Supreme Court, gaining firsthand exposure to the criminal justice system and for which I was awarded Yale's Joe Rose '81 Government Service Fellowship. Internationally, I worked on political campaigns in London, strengthening my interest in the inner workings of public institutions and cross-cultural communication. During the school year, I work part-time as an investment analyst for a New York-based firm called 42 Asset Management.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have lots of hobbies and am always seeking more! I am a massive foodie (half of my family are trained chefs), I love gardening/hiking/being outdoors, hot yoga, traveling to new cities, reading books and watching films (please send me recommendations!), exploring museums, and making new friends. I also have a passion for tennis, skiing, and scuba diving. I would love to learn pottery, golf, how to do a handstand, and always more languages. Cats have a special place in my heart, though I love dogs and most other animals too – you lose me at spiders, though.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you think your student and I would get along, I would absolutely love to set up a chat to get to know each other better! Thank you for taking the time to get to know me, and I hope to meet you soon!\u003c/p\u003e","teachingVideoPlaybackId":"Z39GaJGIAhgGKNnmKV7u802nw9rg01dJm88ON01yM6vYog","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2b3ddb04-86fc-41cd-8789-f3f3b21a93a6\"}"},{"__ref":"DeepDives:{\"uuid\":\"bc9ff9da-6218-45c9-9f73-75796af4258b\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0f4d4a2-48d2-4a47-885e-aa5fec5044f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"d84b93be-0928-4572-bbca-b110cc106fd2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8f7b0954-86b2-4df7-bba7-9319019aa891/-/preview/-/format/jpg/","https://ucarecdn.com/69af7af8-c11c-49ce-875a-8298c184457c/-/preview/-/format/jpg/","https://ucarecdn.com/7f6a2281-6971-40fd-852e-649876e5b741/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f0a26629-1e96-432f-9cde-e07b3d85d51b\"}"},{"__ref":"Education:{\"uuid\":\"90396e7b-afbd-4ec6-b3e8-eb92a5086b98\"}"}],"hiredAt":"2026-01-26T21:06:40.047Z","topics":["Writing","Academic Coaching","College Essay Writing","History","Reading","Creative Writing","Film / Theater","History Project","K-6 Storybook","Business / Entrepreneurship","Debate","Journalism","Law / Government / Policy","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"charlotte-fink\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bed0fbb9-7c19-4ebb-979a-ac7bef82f0f4\"}"}}},"_sentryTraceData":"3aaf8f8cf6224961a4efc219c9061878-aea83a68ffcc54ea-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3aaf8f8cf6224961a4efc219c9061878,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"charlotte-fink"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketin
