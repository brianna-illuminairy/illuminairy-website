ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics \u0026 Communications","degree":null},"MentorPublicProfile:{\"uuid\":\"ceb1b2a9-e0c0-43bb-b0a6-28926c88970b\"}":{"__typename":"MentorPublicProfile","uuid":"ceb1b2a9-e0c0-43bb-b0a6-28926c88970b","displayName":"Ellie H.","slug":"ellie-huppe","biography":"\u003cp\u003eHello! My name is Ellie Huppe, and I am a student at Northwestern University double majoring in Economics and Communications with a minor in Psychology. I’ve always been fascinated by how the economy works and what makes businesses thrive, which has inspired me to pursue a career in management consulting. After graduation, I’ll be joining Bain \u0026amp; Company in Chicago!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I have a strong background in mentoring and leadership. In high school, I led my school’s math and science tutoring center and adapted its programming during COVID to ensure students continued to get the support they needed. At Northwestern, I’m the president of a consulting club, CASE, where I mentor students through the consulting recruiting process. I’m also a mentor for Chicago Field Studies, a Northwestern program that helps underclassmen land their first internships—a role I’ve held for nearly two years.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not working or studying, I’m a huge foodie! I photograph for \u003cem\u003eSpoon\u003c/em\u003e, Northwestern’s campus food magazine, and run a small food Instagram account. I love exploring restaurants of all cuisines (but my phone always eats first!). This year, I’ve been working on improving my cooking skills to balance my love of restaurants. I also love to travel (recently took a solo trip to Annecy, France), play pool with my little brother, and watch hockey.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy learning philosophy is that I believe the best learning happens when students see how concepts apply to things they care about — their lives, their passions, etc. Whether I’m explaining the basics of supply and demand, helping brainstorm college essay topics, or workshopping resume bullet points, I will strive to make every lesson as meaningful (and fun!) as I can. But, being a mentor is about so much more than learning. As a mentor, my goal is also to inspire and to be someone whom my mentees can lean on for support. My past mentors were a critical support system for me, and feeling like I had that support inspired me to achieve my goals and become the best version of myself (I’m even working with one of my past mentors after graduation!). I promise to be someone your child can look up to for support, advice, or just a friendly face to bounce ideas off of. \u003c/p\u003e","teachingVideoPlaybackId":"A0001poZhXlk6yEY7029ZVBGRuQ4IfIDBlLBxtxIqY4BeU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f37e4aa0-93c8-433e-a6ab-bd01838739da\"}"},{"__ref":"Favorites:{\"uuid\":\"d2aeb213-f485-4976-8e01-a02f1709522c\"}"},{"__ref":"Favorites:{\"uuid\":\"ab42a647-c55b-4abc-aa2b-6d6499db2789\"}"}],"causesSupported":[],"major":"Economics \u0026 Communications","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c6d439dc-5001-44a6-9d0b-0c54b15d0c45\"}"},{"__ref":"DeepDives:{\"uuid\":\"3318eb56-9199-4060-ad5d-47075044f10f\"}"},{"__ref":"DeepDives:{\"uuid\":\"e2440cf1-2d1a-40ba-87d2-7e4334bc11e6\"}"},{"__ref":"DeepDives:{\"uuid\":\"75d8ffad-14ad-4315-ba5e-ef92e300b6db\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0feceb83-942c-4fd6-84bf-e1e0b3739907/-/preview/-/format/jpg/","https://ucarecdn.com/b7c6f491-2824-4f65-91cb-4187816c9c6c/-/preview/-/format/jpg/","https://ucarecdn.com/ef34c74c-6468-4690-bb26-b632b815780d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9c65e30d-8d8a-4974-bfc6-764706209d61\"}"},{"__ref":"Education:{\"uuid\":\"d56c55e5-2cb0-493d-bd27-27bd58910a9f\
