xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"69c79d10-22d4-4324-a1bf-c6e2d1e477d6\"}":{"__typename":"DeepDives","uuid":"69c79d10-22d4-4324-a1bf-c6e2d1e477d6","content":"\u003cp\u003eI would tell my middle or high school self to take a breather! I know high school can be a very stressful time worrying about college applications and maintaining high grades, but I wish I could have dived deeper into pursuing the topics and activities I was really passionate about.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"99d348d3-9d02-4fe4-91ea-d0c0bebcfc79\"}":{"__typename":"DeepDives","uuid":"99d348d3-9d02-4fe4-91ea-d0c0bebcfc79","content":"\u003cp\u003eDuring the COVID pandemic, I recognized the power of storytelling and created \u003cem\u003eStill Standing Strong Stories\u003c/em\u003e, an organization where people can anonymously post stories about overcoming a difficult experience and how that experience made them stronger. Through the four years I ran Still Standing Strong Stories, we have grown into a family of individuals who have chosen to share their experiences to help others in a similar situation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"e9ee809c-7cb9-4695-849d-7edc9de45b9a\"}":{"__typename":"DeepDives","uuid":"e9ee809c-7cb9-4695-849d-7edc9de45b9a","content":"\u003cp\u003eIn middle and high school (and even now), I loved learning about the Earth. Throughout my life, I have been fascinated with the Earth. I have always wanted to study the Earth from multiple perspectives, whether this be from a geologic or anthropological perspective. This passion made me fall in love with geography, environmental science, and politics.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have been involved in geography competitions ever since I was in elementary school. My passion for geography started with my love for globes and atlases. In elementary school, I began collecting globes, fascinated by how many stories a singular globe could tell. Whether this be from the start and end of each river to how borders formed between different countries, globes became my favorite storybooks. I carried my love for geography into middle and high school, where I was invited to represent the United States at the International Geography Bee (IGB) World Championship in Berlin (2018) and Montreal (2022).\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy love for environmental science sprouted from my passion for geography. I became highly interested in ecology, sustainability, and environmental justice. My passion for environmental science led me to participate in Envirothon, North America's largest environmental education competition, where my team qualified to represent Illinois (my home state) at the national tournament.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"be5599bb-9ec8-484f-be82-777f764e8fc5\"}":{"__typename":"DeepDives","uuid":"be5599bb-9ec8-484f-be82-777f764e8fc5","content":"\u003cp\u003eSymbolic Systems is a unique major at Stanford that examines the relationship between systems built using symbols (such as natural language, programming code, and formal logic) and systems that interpret symbols (such as the brain, computers, and social networks). The program integrates computer science, psychology, philosophy, math, linguistics, and statistics to explore how humans and machines process information. Through this interdisciplinary approach, I hope to gain a more humanistic viewpoint of technology, equipping me to better understand its societal impacts and ethical implications.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3224da09-4d67-4a2a-8b8e-36bd911f78e7\"}":{"__typename":"School","uuid":"3224da09-4d67-4a2a-8b8e-36bd911f78e7","name":"University of Chicago Laboratory Schools","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60637"},"Education:{\"uuid\":\"1e351967-51cb-477b-b90b-eba011b1683d\"}":{"__typename":"Education","uuid":"1e351967-51cb-477b-b90b-eba011b1683d","school":{"__ref":"School:{\"uuid\":\"3224da09-4d67-4a2a-8b8e-36bd911f78e7\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"0be36187-733d-4db0-9a1a-4f89675f5beb\"}":{"__typename":"Education","uuid":"0be36187-733d-4db0-9a1a-4f89675f5beb","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Symbolic Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"bf263e75-ee6c-44f6-96b0-f3ac4d9b619b\"}":{"__typename":"MentorPublicProfile","uuid":"bf263e75-ee6c-44f6-96b0-f3ac4d9b619b","displayName":"Akshay B.","slug":"akshay-badlani","biography":"\u003cp\u003eHi! My name is Akshay, and I am a current Stanford student from Chicago studying Symbolic Systems, Public Policy, and Management Science \u0026amp; Engineering. I am extremely interested in learning about technology from a humanistic standpoint, and I hope to become a leader in social innovation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI first became interested in technology when conducting Ancient DNA research at UChicago's GenSCAPE Lab. I was fascinated by how many of the Earth's stories could be revealed by a single strand of DNA and the tools used to sequence and analyze it. I primarily researched biases in current Ancient DNA practices, for which I needed to learn R, a statistical programming language. Through my research, I realized how amazing it is that technology can help us reveal more stories from our past. By sequencing ancient DNA, we can learn more about how we became the people we are today. Figures I created for this project and at UChicago's GenSCAPE Lab were presented at the National Centre for Biological Sciences (NCBS) in Bengaluru (Bangalore), India, and incorporated into a Master's course. They were also presented at the UChicago Molecular Biology Clusters Retreat.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough my ancient DNA research, I developed a deep understanding of the power of technology in uncovering historical and biological narratives, and I am eager to apply these skills to solve real-world problems. Focusing on my love for biology, I decided to join Stanford's Healthcare Consulting Group, where I was chosen to be a Project Manager. My team and I are assessing a currently implemented AI tool designed to predict clinical deterioration in the inpatient setting at Stanford. Our work will inform improvements to the tool and workflow and provide critical feedback for enhancing its effectiveness through analyzing and cleaning data.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese projects made me realize the true impact technology can have on people's lives, and I hope that one day, I am able to help someone using the power of technology.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSome of my other passions include learning more about the world through geography, environmental science, and policy. Fun fact: When I was in eighth grade, I designed a constitution curriculum that I am incredibly proud of. Click on the \u003cstrong\u003eWhat were you like as a middle school student / a high school student? \u003c/strong\u003equestion to learn more!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love to go on night runs and analyze films on \u003cem\u003eLetterboxd\u003c/em\u003e. My favorite movies include \u003cem\u003eHowl's Moving Castle\u003c/em\u003e, \u003cem\u003eFinding Nemo\u003c/em\u003e, and \u003cem\u003eInterstellar\u003c/em\u003e. I also enjoy cooking for friends and family. I can't wait to meet you and show off my Mac and Cheese recipe!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"2rahZuc7lVrlPfVlDElWxuH3xXmWJ0268gflO5c02sPEg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"69c79d10-22d4-4324-a1bf-c6e2d1e477d6\"}"},{"__ref":"DeepDives:{\"uuid\":\"99d348d3-9d02-4fe4-91ea-d0c0bebcfc79\"}"},{"__ref":"DeepDives:{\"uuid\":\"e9ee809c-7cb9-4695-849d-7edc9de45b9a\"}"},{"__ref":"DeepDives:{\"uuid\":\"be5599bb-9ec8-484f-be82-777f764e8fc5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f1d587f6-7416-43d5-aebe-b468608b8e08/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1e351967-51cb-477b-b90b-eba011b1683d\"}"},{"__ref":"Education:{\"uuid\":\"0be36187-733d-4db0-9a1a-4f89675f5beb\"}"}],"hiredAt":"2024-09-05T02:20:36.796Z","topics":["Geography","History","Law / Government / Policy","Coding / Programming","Calculus","Sustainability","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"akshay-badlani\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bf263e75-ee6c-44f6-96b0-f3ac4d9b619b\"}"}}},"_sentryTraceData":"11898b656cab442887669ac7d73ec9a9-9c50c437548f56f7-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=11898b656cab442887669ac7d73ec9a9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"akshay-badlani"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></no
