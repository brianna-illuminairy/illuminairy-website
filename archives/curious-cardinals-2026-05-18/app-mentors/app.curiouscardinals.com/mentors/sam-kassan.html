xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1bed9e9e-9d24-4356-9794-6608a2fafab5\"}":{"__typename":"Favorites","uuid":"1bed9e9e-9d24-4356-9794-6608a2fafab5","photoUrl":"https://ucarecdn.com/d5a96904-bd65-4f00-b1f9-c1e7d5e32119/","title":"The Dark Forest by Cixin Liu","type":"BOOK"},"Favorites:{\"uuid\":\"f1c653a8-90c7-4be0-bcc5-692a167e2c1a\"}":{"__typename":"Favorites","uuid":"f1c653a8-90c7-4be0-bcc5-692a167e2c1a","photoUrl":"https://ucarecdn.com/c02cc2c1-fdbf-4cc9-9870-afdd1fa152f1/","title":"The Shawshank Redemption","type":"MOVIE"},"Favorites:{\"uuid\":\"94544116-3d03-4932-9ad7-5e3b44bb6c43\"}":{"__typename":"Favorites","uuid":"94544116-3d03-4932-9ad7-5e3b44bb6c43","photoUrl":"https://ucarecdn.com/d38ac3b3-6b94-4af8-a043-c6988ac1e9d3/","title":"New York City","type":"CITY"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ca710180-eeb2-4d3d-9b68-3b3c2d09d565\"}":{"__typename":"DeepDives","uuid":"ca710180-eeb2-4d3d-9b68-3b3c2d09d565","content":"\u003cp\u003eEveryone needs a proper work-life balance. In my free time, I love playing basketball with friends, rock climbing, reading, and watching my favorite sports teams (Go Yankees, Knicks, and Giants).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"b02189eb-5453-48fc-b408-c6c7476fde70\"}":{"__typename":"DeepDives","uuid":"b02189eb-5453-48fc-b408-c6c7476fde70","content":"\u003cp\u003eI think I did a pretty good job of keeping a healthy balance in high school. I was a hard worker, taking challenging courses and several extracurriculars. However, I made time for friends and relaxation. I also ran track and cross country, although I would not call myself a star athlete.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"41eab7f8-a29f-4339-830f-1743b62bfed9\"}":{"__typename":"DeepDives","uuid":"41eab7f8-a29f-4339-830f-1743b62bfed9","content":"\u003cp\u003eAside from my longshot dream of being an Olympic skiier (I think that ship has sailed), my dream job would be designing medical devices. Whether its neurotech, surgical robotics, or orthopedics, pushing the boundaries of life saving technology sounds like a dream to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f2b1653f-1d74-43e5-9df9-9bc1ad8c8ec1\"}":{"__typename":"DeepDives","uuid":"f2b1653f-1d74-43e5-9df9-9bc1ad8c8ec1","content":"\u003cp\u003eDuring the summer before senior year in high school, I interned at a bioelectronic medicine research lab. The work of the neighboring lab is what caught my attention, though. They'd managed to restore significant hand motion to quadriplegics that hadn't so much as lifted a finger in years. Using a BCI (Brain computer interface), they were able to bridge the gap between the brain and the peripheral nerves and muscles that the damaged spinal cord had created. I was fascinated. Although I wouldn't officially become a biomedical engineer until halfway through freshman year of college, I knew in the back of mind that this is where I wanted to be: at the intersection between medicine and technology.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"e2bff428-180f-47f4-a06d-c839fa2f02e0\"}":{"__typename":"School","uuid":"e2bff428-180f-47f4-a06d-c839fa2f02e0","name":"Paul D. Schreiber High School","city":"Port Washington","type":"HIGH","state":"New York","country":"United States","zip":"11050"},"Education:{\"uuid\":\"1ac70346-4ff4-47e8-b39e-c8fafe6ea4bd\"}":{"__typename":"Education","uuid":"1ac70346-4ff4-47e8-b39e-c8fafe6ea4bd","school":{"__ref":"School:{\"uuid\":\"e2bff428-180f-47f4-a06d-c839fa2f02e0\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"b113bd8b-828d-4a21-aae9-f37bea520213\"}":{"__typename":"Education","uuid":"b113bd8b-828d-4a21-aae9-f37bea520213","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"cd04926d-8a30-45e9-8d0a-7920a108ce25\"}":{"__typename":"MentorPublicProfile","uuid":"cd04926d-8a30-45e9-8d0a-7920a108ce25","displayName":"Sam K.","slug":"sam-kassan","biography":"\u003cp\u003eI am a rising senior at Vanderbilt University majoring in biomedical engineering with a minor in digital fabrication. I’m passionate about helping younger students explore science, creativity, and problem-solving. I love building things and working on projects where I can take an idea from concept to reality, whether that means designing parts in CAD, using different kinds of 3D printers, laser cutting components, or putting together a circuit. There is something incredibly rewarding about imagining a solution, testing it, refining it, and eventually seeing it become a real, functional prototype.\u003c/p\u003e\u003cp\u003eA lot of my experience has come from technical and team-based environments. I’ve spent several summers in research labs, working on projects ranging from biomechanics to medical device design to Alzheimer's research. My lab experience has taught me important technical skills, professional habits, and how to solve problems that seem impossible.\u003c/p\u003e\u003cp\u003eAt school, I participate in several extracurricular activities. I serve as the Vice President of Vanderbilt Neurotech Club, which has given me experience leading a team, collaborating with others, and supporting projects at the intersection of engineering and neuroscience. We have been working over the past few semesters to create an EEG-controlled assistive feeding robotic arm. I also participate annually in the Tikkun Olam Makers’ Makeathon, where I get to work with an interdisciplinary team to solve a problem for a disabled member of the community over the course of a weekend. At the most recent event, we worked to ideate, design and prototype a lightweight, removable folding desk attachment for the wheelchair of a child with Duchenne’s muscular dystrophy. We utilized Fusion 360 and laser cutting devices to assemble the desk.\u003c/p\u003e\u003cp\u003eI actually did not come into college with a passion for engineering - I learned nothing about it in high school and only discovered it at Vanderbilt. Since then, I have come to appreciate how exciting and creative engineering can be, especially when it is taught through real projects and examples. I would love the opportunity to introduce younger students to that world earlier, help them see what engineering looks like in practice, and make it feel accessible, interesting, and open to them.\u003c/p\u003e","teachingVideoPlaybackId":"kg6uNzEVJfPO1cMgP7Opap01r0200AscQkkiDIE029ofm4I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1bed9e9e-9d24-4356-9794-6608a2fafab5\"}"},{"__ref":"Favorites:{\"uuid\":\"f1c653a8-90c7-4be0-bcc5-692a167e2c1a\"}"},{"__ref":"Favorites:{\"uuid\":\"94544116-3d03-4932-9ad7-5e3b44bb6c43\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ca710180-eeb2-4d3d-9b68-3b3c2d09d565\"}"},{"__ref":"DeepDives:{\"uuid\":\"b02189eb-5453-48fc-b408-c6c7476fde70\"}"},{"__ref":"DeepDives:{\"uuid\":\"41eab7f8-a29f-4339-830f-1743b62bfed9\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2b1653f-1d74-43e5-9df9-9bc1ad8c8ec1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5d192322-35ac-425b-be56-f9bd8b0d3874/-/preview/-/format/jpg/","https://ucarecdn.com/5ad89526-feed-455b-8272-6caf95ece69b/-/preview/-/format/jpg/","https://ucarecdn.com/723229a5-6bd6-41ad-bd3b-3d39f0ae16c3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1ac70346-4ff4-47e8-b39e-c8fafe6ea4bd\"}"},{"__ref":"Education:{\"uuid\":\"b113bd8b-828d-4a21-aae9-f37bea520213\"}"}],"hiredAt":"2026-04-30T23:35:06.587Z","topics":["Algebra I","Algebra II","Calculus","Statistics","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","History","Computer Science","Economics","Reading","Medicine / Health","Robotics / Electronics / CAD","STEM Project"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile
