xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7dc18017-8776-4ea6-b38e-2a05dc96bad9\"}":{"__typename":"DeepDives","uuid":"7dc18017-8776-4ea6-b38e-2a05dc96bad9","content":"\u003cp\u003eDon't be afraid to try vastly different experiences without a clear \"path\" in mind.  Getting to work with different types of people who approach work very differently is one of the best learning experiences you could ask for.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"45c70396-b784-4247-bb5d-e6588d5c1fc0\"}":{"__typename":"DeepDives","uuid":"45c70396-b784-4247-bb5d-e6588d5c1fc0","content":"\u003cp\u003eI loved that my major was interdisciplinary and allowed me the flexibility to really pursue classes I loved.  I wanted to build a quantitative skillset to better understand the world around me but loved that I also could explore my love for reading and writing in various classes in my major and minor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"41d1013d-02a2-401c-97e3-fc0eb4155ef2\"}":{"__typename":"DeepDives","uuid":"41d1013d-02a2-401c-97e3-fc0eb4155ef2","content":"\u003cp\u003eMentorship matters to me tremendously.  It's because of those who were kind enough to invest in me that I am where I am today.  I'm excited about the opportunity to pay that back.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"e02ebe80-e285-4c8f-98cc-ff59e6656540\"}":{"__typename":"DeepDives","uuid":"e02ebe80-e285-4c8f-98cc-ff59e6656540","content":"\u003cp\u003eI did 15 years of competitive gymnastics! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"d11c9865-9e8b-4585-a0d8-b60e8e446c27\"}":{"__typename":"School","uuid":"d11c9865-9e8b-4585-a0d8-b60e8e446c27","name":"Brentwood High School","city":"Brentwood","type":"HIGH","state":"New York","country":"United States","zip":"11717"},"Education:{\"uuid\":\"2d2cfa38-99c3-448a-bcf6-6aad474bdffc\"}":{"__typename":"Education","uuid":"2d2cfa38-99c3-448a-bcf6-6aad474bdffc","school":{"__ref":"School:{\"uuid\":\"d11c9865-9e8b-4585-a0d8-b60e8e446c27\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"605e97e0-4497-4946-8255-89d746db82b4\"}":{"__typename":"Education","uuid":"605e97e0-4497-4946-8255-89d746db82b4","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2022","major":"Management Science and Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"54cac121-12c1-4b10-8bf8-5da0c9944abf\"}":{"__typename":"MentorPublicProfile","uuid":"54cac121-12c1-4b10-8bf8-5da0c9944abf","displayName":"Caroline S.","slug":"caroline-spertus","biography":"\u003cp\u003eHi! I'm Caroline and am very excited to get to know you!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated from Stanford in June 2022 (after taking a gap year during COVID) with a major in Management Science and Engineering and a minor in Classics. I loved the interdisciplinary nature of the major (and minor) that armed me with quantitative and qualitative skills. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver the past few years, I've worked for a non-profit combatting food insecurity, the Civil Rights Division of the DOJ and as an investment banking analyst.  Each experience was vastly different and I'm so grateful for exactly that; I'm passionate about understanding the various systems that underpin our society in order to maximize impact down the road.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'll be attending Columbia Law School in the fall and would be happy to answer any questions you might have on the law school process as well.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Management Science and Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7dc18017-8776-4ea6-b38e-2a05dc96bad9\"}"},{"__ref":"DeepDives:{\"uuid\":\"45c70396-b784-4247-bb5d-e6588d5c1fc0\"}"},{"__ref":"DeepDives:{\"uuid\":\"41d1013d-02a2-401c-97e3-fc0eb4155ef2\"}"},{"__ref":"DeepDives:{\"uuid\":\"e02ebe80-e285-4c8f-98cc-ff59e6656540\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fe4fafab-c324-48bf-b57c-49a1c2928ef2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2d2cfa38-99c3-448a-bcf6-6aad474bdffc
