iplines external to her majors. In her first semester at Berkeley, she was chosen to conduct research in the Anthropology department relating to Middle Meningeal and Endocranial data. She is part of a wide variety of clubs across campus including the ASUC Sustainability Commission, the Student Organic Gardening Association, the Science Fiction and Fantasy Writing Workshop, the Art and Mind Organization, and the Free Peach Comedy and Sketch Group. In addition to her coursework and numerous clubs, Emma often spends time hiking, painting, or reading and watching Harry Potter! \n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/a1092dc0-3195-46c9-ba33-03a0526e574c/-/crop/762x763/38,0/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fc7df554-f046-4b95-b4e6-2257e8b7881c\"}"}],"hiredAt":"2021-08-06T15:39:36.000Z","topics":["Race \u0026 Ethnicity","Coding / Programming","Visual Arts / Graphic Design","Aviation / Aerospace","French","Precalculus / Trigonometry","Physics","Algebra I","Creative Writing","Women \u0026 Gender Studies","Statistics","Law / Government / Policy","Calculus","Journalism","Sustainability","Algebra II","Geometry","Music","6-8 Grade Science","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"emma-born\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"462628f1-9db3-4ba9-b36f-3b339a98df4e\"}"}}},"_sentryTraceData":"7389257b7dba49b9a928f3cdd7f591f8-8d4fc4e0fe4a53f1-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7389257b7dba49b9a928f3cdd7f591f8,sentry-sample_rate=0.2,
