xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8beceecc-361f-42d3-89f7-3bc4c2b67a1f\"}":{"__typename":"Favorites","uuid":"8beceecc-361f-42d3-89f7-3bc4c2b67a1f","photoUrl":"https://ucarecdn.com/6f3cd518-5cc3-4615-a317-58d837281dbe/","title":"Ke Huy Quan","type":"ACTOR"},"Favorites:{\"uuid\":\"1bbf2b28-acf3-410d-89d3-c30b875a7e63\"}":{"__typename":"Favorites","uuid":"1bbf2b28-acf3-410d-89d3-c30b875a7e63","photoUrl":"https://ucarecdn.com/5ffab6b9-71b4-4ed4-8bc0-12b9965fe62e/","title":"Jimmy Butler","type":"ATHLETE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"fa1ca2c2-fde4-42cb-ae0e-910921fd82e2\"}":{"__typename":"DeepDives","uuid":"fa1ca2c2-fde4-42cb-ae0e-910921fd82e2","content":"\u003cp\u003eIf I could go back, I would tell my high school self to be more adventurous when choosing classes. I tended to stick to the standard academic track—Calculus, Economics, History—believing that following a traditional path was the “right” thing to do. In hindsight, I wish I had explored more creative electives, taken more arts classes, joined more clubs, and built stronger relationships with my teachers. High school is as much about discovering what excites you as it is about academics, and I missed some of those opportunities by playing it safe.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking back at middle school, I would encourage myself to be even more exploratory. Unlike high school, middle school isn’t about grades or building a resume—it’s about discovering what you enjoy. I would remind myself that it’s the perfect time to try everything, pursue curiosity without pressure, and explore as many interests as possible. That early exploration could have helped me enter high school with a clearer sense of direction and a better understanding of where my passions lie.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2fcdd515-83ad-441e-b601-04a48bc9ca19\"}":{"__typename":"DeepDives","uuid":"2fcdd515-83ad-441e-b601-04a48bc9ca19","content":"\u003cp\u003eIn my behavioral economics class, we explored the concept of choice paralysis—the idea that when we’re faced with too many options, we often freeze and end up making no choice at all. I’ve found that without mentorship or someone to help guide you, it can be incredibly difficult to discover your passions or dive deeply into a subject. In today’s world of social media and increasingly diverse curricula, students are constantly exposed to countless “paths” or archetypes they feel they need to fit into. From the outside, it can feel overwhelming and even paralyzing. As a mentor, I hope to support students who are unsure of what they want to pursue, whether they’re choosing high school classes or trying to decide on a college essay topic. My goal is to help them navigate these choices with more clarity and confidence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"2bea526a-5bf8-4294-8c34-c664cbd9c73f\"}":{"__typename":"School","uuid":"2bea526a-5bf8-4294-8c34-c664cbd9c73f","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":" 37203-5721"},"Education:{\"uuid\":\"8ce52293-a073-4e07-a9e0-0040a9c03b8c\"}":{"__typename":"Education","uuid":"8ce52293-a073-4e07-a9e0-0040a9c03b8c","school":{"__ref":"School:{\"uuid\":\"2bea526a-5bf8-4294-8c34-c664cbd9c73f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Economics and Computer Science","degree":null},"School:{\"uuid\":\"101fe0d6-2516-4d89-94b0-67c175cece26\"}":{"__typename":"School","uuid":"101fe0d6-2516-4d89-94b0-67c175cece26","name":"Singapore American School","city":"Singapore","type":"HIGH","state":"Singapore","country":"Singapore","zip":"738547"},"Education:{\"uuid\":\"ed203a97-8f36-416f-bb91-e16ddb16cd5a\"}":{"__typename":"Education","uuid":"ed203a97-8f36-416f-bb91-e16ddb16cd5a","school":{"__ref":"School:{\"uuid\":\"101fe0d6-2516-4d89-94b0-67c175cece26\"}"},"startYear":"2022","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"7a0ece75-28f8-4dfc-9de7-91878a17822a\"}":{"__typename":"MentorPublicProfile","uuid":"7a0ece75-28f8-4dfc-9de7-91878a17822a","displayName":"Noah Y.","slug":"noah-yi-1","biography":"\u003cp\u003eHi,\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Noah, and I am currently studying Economics and Computer Science with a minor in Business at Vanderbilt University. About me personally, I grew up in Singapore, and I’ve been fortunate enough to travel around Southeast Asia and East Asia. Some of the coolest places I’ve been to are the Java rainforest in Indonesia and rural Japan. Having been able to travel around the world and observe vastly different nations, I became inspired to study economics, specifically with a concentration in development and international economics. Academically, I’ve always been drawn to a wide range of disciplines. I find value in mathematics, economics, literature, and history—fields that may seem distinct but collectively contribute to a more holistic approach to learning. Alongside this, I’ve always had a fascination with creation. Although studying theory and principles is fascinating in its own right. I’ve consistently felt empowered by the ability to create something and put my name on it, which is why I am also pursuing a double major in Computer Science. In high school, I created a coding club that taught elementary and middle school students Python principles and also did many artificial intelligence fellowships.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOther extracurriculars I did in high school included theatre, rugby, and investment club. These experiences taught me core skills that have translated well into my college career: initiative, communication, and speaking. I’ve come to believe that how you communicate and present ideas is just as important as the ideas themselves. Whether I’m giving a presentation, collaborating on group projects, or writing emails and papers, I always emphasize clarity and interpersonal skills.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eProfessionally, I’ve been able to work for small financial services companies in Singapore to large corporations like Airbus. As with my ethos for double majoring, I believe the best way to learn is through experiential learning, which guides my pursuit of extracurriculars and internships. I believe that impactful learning comes from beyond the classroom. Like how learning to shoot a basketball or watching a film on MJ is great in theory, you will only get better at basketball through playing and practicing, learning through experience. Outside of internships, I followed this philosophy during college and high school through research. Whether professionally or for assignments, doing unguided assignments like research papers or passion projects allows students to break out beyond the classroom and discover \u003cem\u003ewhat they think about the subject \u003c/em\u003e\u003cstrong\u003ebeyond\u003c/strong\u003e what the textbook says. In a world where A.I. can do so much of our thinking, I believe it is paramount to learn to think in an unguided framework.\u003c/p\u003e","teachingVideoPlaybackId":"IXmNi8ujugRp2IVRG1hj02SNOZy2GSK1KzDmHvZIFqAw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8beceecc-361f-42d3-89f7-3bc4c2b67a1f\"}"},{"__ref":"Favorites:{\"uuid\":\"1bbf2b28-acf3-410d-89d3-c30b875a7e63\"}"}],"causesSupported":[],"major":"Economics and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fa1ca2c2-fde4-42cb-ae0e-910921fd82e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"2fcdd515-83ad-441e-b601-04a48bc9ca19\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/30bc2626-a147-49eb-ae3d-3b2d92000132/-/preview/-/format/jpg/","https://ucarecdn.com/db9a3f85-cabf-41bc-961a-e2e43e717a2c/-/preview/-/format/jpg/","https://ucarecdn.com/4e03bd50-dfb4-4189-b388-f3292b10adb0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8ce52293-a073-4e07-a9e0-0040a9c03b8c\"}"},{"__ref":"Education:{\"uuid\":\"ed203a97-8f36-416f-bb91-e16ddb16cd5a\"}"}],"hiredAt":"2025-07-03T12:07:06.218Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Computer Science","Film / Theater","History Project","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"noah-yi-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7a0ece75-28f8-4dfc-9de7-91878a17822a\"}"}}},"_sentryTraceData":"28a6483458ce446db4228dfc5d2cc658-929ad3273f896eb7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_ke
