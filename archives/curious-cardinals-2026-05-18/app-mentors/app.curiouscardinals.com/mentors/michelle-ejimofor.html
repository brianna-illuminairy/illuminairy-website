xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"61d79f35-f61a-4166-82d0-f3357144f8cb\"}":{"__typename":"Favorites","uuid":"61d79f35-f61a-4166-82d0-f3357144f8cb","photoUrl":"https://ucarecdn.com/356726e3-316d-41f1-9040-6cc2015f7da8/","title":"Jennifer Lawrence ","type":"ACTOR"},"Favorites:{\"uuid\":\"c45466bb-6434-4d9f-9703-0971fdb2822f\"}":{"__typename":"Favorites","uuid":"c45466bb-6434-4d9f-9703-0971fdb2822f","photoUrl":"https://ucarecdn.com/356726e3-316d-41f1-9040-6cc2015f7da8/","title":"Miraculous Ladybug \u0026 Cat Noir: The Movie","type":"MOVIE"},"Favorites:{\"uuid\":\"c07fd9e5-e808-4c04-b3f3-3219e35844cd\"}":{"__typename":"Favorites","uuid":"c07fd9e5-e808-4c04-b3f3-3219e35844cd","photoUrl":"https://ucarecdn.com/356726e3-316d-41f1-9040-6cc2015f7da8/","title":"Some Things Never Change","type":"SONG"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"11fcaded-d8a4-467d-b9fe-8869e428b095\"}":{"__typename":"DeepDives","uuid":"11fcaded-d8a4-467d-b9fe-8869e428b095","content":"\u003cp\u003eIn my sophomore year of high school, I decided that I no longer wanted to follow the career path handed to me by my father. When thinking about a new career, I knew I wanted to help those struggling mentally/emotionally (I specifically have a heart for children and trauma survivors) and believed myself to be a compassionate person, so psychology seemed right up my ally. Additionally, I believe I would have benefited from some sort of therapy growing up, so the decision to study psychology is my gift to my younger self.\u003cbr\u003e\u003cbr\u003eThe decision to be a Jewish Studies minor came in my sophomore summer of college. However, the seeds were planted early on. I was raised Christian and have continued my faith journey in college, and as Christianity began as a sect of Judaism, the desire to understand it has always been there. Furthermore, I participated in a Jewish summer program in high school, and took Hebrew classes my freshman year of college. However, the action that cemented my decision was a class I took called \"The Jewish Jesus.\"\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"6cdece12-423d-442a-bd6c-f3064cc4142e\"}":{"__typename":"DeepDives","uuid":"6cdece12-423d-442a-bd6c-f3064cc4142e","content":"\u003cp\u003eWhile I have never had a solid mentor figure, I have had many adults throughout my time in the school system notice my potential, and subsequently encourage me to do things I otherwise would not have done, such as join the debate team in high school and apply to an Ivy League institution!\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a first generation college student who grew up in a low-income area, I understand the value in having someone take an interest in you/your learning. So, whether through organizations at my college or now with Curious Cardinals, I aim to guide/teach my fellow peers with the knowledge I have acquired through my life experiences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"3173b189-5756-417c-a805-2835a98a08ec\"}":{"__typename":"DeepDives","uuid":"3173b189-5756-417c-a805-2835a98a08ec","content":"\u003cp\u003eWell, the big one is that I am biracial. My father is Nigerian and my mother is Mexican - a combination people never guess.\u003cbr\u003e\u003cbr\u003eAlso, I have a shy exterior, but once you get to know me, you will realize that I love making others laugh and am a child inside the body of an adult. I may or may not know all the words to some of the songs from Disney's \"Descendants\" and \"Frozen.\" As you can tell, I am a huge fan of both animated and musical films :)\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"575b29f1-c109-44a5-9695-c2d09a8904fd\"}":{"__typename":"DeepDives","uuid":"575b29f1-c109-44a5-9695-c2d09a8904fd","content":"\u003cp\u003eI am a sporadic binger of television shows, the latest beast I've tackled was the 12 seasons of \"The Big Bang Theory,\" which if you were wondering, I give my stamp of approval to.\u003cbr\u003e\u003cbr\u003eRecently, I have gotten back into reading; my genres of choice include: faith, self-help, and historical non-fiction. I have also began my artistic journey, so you can find me watching how-to drawing videos on YouTube! Additionally, I listen to faith based podcasts; some of my favorites include: \"Happy \u0026amp; Healthy\" with Jeanine Amapola and \"Bought + Beloved\" with Kirby Kelly. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"c8c2a085-640d-447e-b521-37e263b4719c\"}":{"__typename":"School","uuid":"c8c2a085-640d-447e-b521-37e263b4719c","name":"Westbury High School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77035"},"Education:{\"uuid\":\"ea5ba302-4f0b-47fc-99f1-320747bbdcc4\"}":{"__typename":"Education","uuid":"ea5ba302-4f0b-47fc-99f1-320747bbdcc4","school":{"__ref":"School:{\"uuid\":\"c8c2a085-640d-447e-b521-37e263b4719c\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"f2fec2f1-b025-410e-aa92-d50fc9ad3dc6\"}":{"__typename":"Education","uuid":"f2fec2f1-b025-410e-aa92-d50fc9ad3dc6","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology, minoring in Jewish Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"462557f3-0109-4c01-be0b-3d9fb40449f1\"}":{"__typename":"MentorPublicProfile","uuid":"462557f3-0109-4c01-be0b-3d9fb40449f1","displayName":"Michelle E.","slug":"michelle-ejimofor","biography":"\u003cp\u003eWelcome to my neck of the woods! \u003cbr\u003e\u003cbr\u003eHello, my name is Michelle and I am a first generation junior at Dartmouth College pursuing a degree in Psychology with a minor in Jewish Studies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I am not in class or studying, you can find me doing one of three things:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e1. Volunteering in various activities associated with the Christian community on campus. One of my favorite events involves the intersection of different Christian organizations, called \"Christian Waffles\" in which members of the Christian community serve waffles and water during the night to those coming from and going to parties. I have also dedicated my time to serving as an Outreach Coordinator for one of the fellowships called \"Agape\" which included planning events to reach out to the broader campus and fostering a sense of community within Agape.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e2. Working at a child care center off campus. Working with preschoolers brings me great joy and is something I was intentional about doing as an aspiring Child Psychologist. It is not simply babysitting, but guiding the children on a path of cognitive and social enrichment through Reggio-inspired activities and self-directed play. I love working with children and that is not limited to future career aspirations as I also volunteer in the nursery at my church.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e3. Facilitating information sessions for The Sexual Violence Prevention Project (SVPP). This involved participating in training sessions where my cohort was taught different public speaking techniques to ensure an impactful delivery and practiced fostering both a connection with our peers and an open dialogue/safe space.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy skills in communication, leadership, and compassion in tandem with my love for creative expression (as seen by my profile photos) will make me an engaging and fun mentor who will strive to make a mundane-sounding subject such as history interesting, and create interactive lessons my mentees will enjoy!\u003c/p\u003e","teachingVideoPlaybackId":"MLJhw1H02cBzjbTayikJUEYk6RicwLw02ruo702Q6s49ac","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"61d79f35-f61a-4166-82d0-f3357144f8cb\"}"},{"__ref":"Favorites:{\"uuid\":\"c45466bb-6434-4d9f-9703-0971fdb2822f\"}"},{"__ref":"Favorites:{\"uuid\":\"c07fd9e5-e808-4c04-b3f3-3219e35844cd\"}"}],"causesSupported":[],"major":"Psychology, minoring in Jewish Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"11fcaded-d8a4-467d-b9fe-8869e42
