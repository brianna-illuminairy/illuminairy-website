3e\"}":{"__typename":"MentorPublicProfile","uuid":"7e48e163-05f1-417a-a3b0-2ae40af35a3e","displayName":"Evelyn H.","slug":"evelyn-howe","biography":"\u003cp\u003e\u003cstrong\u003eHi there! I’m Evelyn Howe, a Princeton University student from Hong Kong, majoring in Public and International Affairs with minors in Entrepreneurship and Gender Studies.\u003cbr\u003e\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m passionate about working at the intersection of impact and innovation—some of the biggest, most meaningful changes in the world come from the most creative ideas. I’m especially dedicated to using innovation to uplift marginalized communities, and my academic journey reflects this commitment. I’ve conducted research on improving rights for domestic workers in NYC, studied social policies that protect vulnerable communities in South Africa, and I’m currently researching how public policy can better support working mothers in Hong Kong.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond the classroom, I’m deeply involved in social entrepreneurship. I served on the leadership team of Princeton’s Entrepreneurship Club (E-Club) and led the Princeton team for Impact First Ventures, where we helped support impact-driven startups. I’m also the co-founder and co-host of \u003cem\u003eThe Impact Agenda Podcast\u003c/em\u003e, where we’ve interviewed leaders in purpose-driven careers—our podcast is now ranked in the top 20% of video podcasts worldwide!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship is incredibly important to me. I love helping young people discover their passions and watching them grow in confidence as they pursue what excites them. I’ve mentored students as a Matriculate advisor, guiding high schoolers from low-income backgrounds through the college admissions process, and I’ve also taught Debate \u0026amp; English using my experience as a former member of the Hong Kong National Debate Team and Head Girl of my high school.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my academic and professional interests, I’m a competitive dancer involved in three campus dance groups, an avid traveler (I spent a semester studying in Cape Town), and meditate and practice yoga daily. After graduation, I’ll be joining McKinsey \u0026amp; Company full-time, but for now, I’m excited to mentor, inspire, and support the next generation of changemakers!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3f235b7d-1f8d-4ab4-9df4-ab03e9f07d22\"}"},{"__ref":"Favorites:{\"uuid\":\"08a27d02-a62a-4460-8a0e-4a2d24024ab1\"}"}],"causesSupported":[],"major":"School of Public \u0026 International Affairs ","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/bf605cd6-2ae3-4eab-904a-ce5b75980a42/-/preview/-/format/jpg/","https://ucarecdn.com/3214ffd4-e7c3-4ee0-a089-15eaae6d02f7/-/preview/-/format/jpg/","https://ucarecdn.com/24c0461d-ce62-4933-9217-762e4fbc7e67/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6cef742c-e1da-4f12-b27a-a7f620a2c3e8\"}"},{"__ref":"Education:{\"uuid\":\"cc8df328-7594-4c7c-be3f-57c6c7d5ec6d\"}"}],"hiredAt":"2025-02-06T19:10:37.060Z","topics":["Writing","Executive Function","College Essay Writing","Reading","History","Film / Theater","Business / Entrepreneurship","Debate","Public Speaking","Law / Government / Policy","Sustainability"],"communityBadges":["https://ucarecdn.com/4f6b2e92-2aa8-4328-90be-11c5a7d63bc7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"evelyn-howe\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7e48e163-05f1-417a-a3b0-2ae40af35a3e\"}"}}},"_sentryTraceData":"979f898318c04297875ed4bd2a1f6e36-b8ff2fea39f31871-0","_sentryBaggage":"sentry-environment=verc
