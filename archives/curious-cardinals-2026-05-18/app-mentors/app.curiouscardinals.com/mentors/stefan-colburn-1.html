xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"5cdb9529-9423-453c-9be1-2f2f29ad7bc7\"}":{"__typename":"DeepDives","uuid":"5cdb9529-9423-453c-9be1-2f2f29ad7bc7","content":"\u003cp\u003eMy dream job is starting and running a non profit that teaches younger audiences about personal finance. When you begin learning about saving and investing, everyone begins to tell you time is your best friend. This is definitely true, as compound interest really is imperative when investing. The problem is, we never tell this to people who have the most time, young people. This is why I want to create this organization, because if we educate the younger generations on budgeting, saving, and investing, we can begin to build financial stability for all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8b1f318f-0fe8-488b-9df0-1fc5435aa440\"}":{"__typename":"DeepDives","uuid":"8b1f318f-0fe8-488b-9df0-1fc5435aa440","content":"\u003cp\u003eWhen I was in high school, I was the Chair of Operations at a local non profit that connected day laborers to jobs in our community. Most of our laborers were physical laborers, so when the pandemic hit, they were all out of work. We needed a solution to this problem so I came up with the idea to create a computer lab to teach our workers computer skills. After applying and securing grant funding, I purchased the hardware and software required and set up the lab in our headquarters. I then arranged for volunteers to teach different lessons such as how to create a resume and how to use Microsoft Office. This eventually led to higher salaries for our workers. This was an extremely meaningful project, and also gave me the confidence to pursue more projects in the future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4fd6d0c0-7a8a-4e9d-9fa5-e05d6c5cdfca\"}":{"__typename":"DeepDives","uuid":"4fd6d0c0-7a8a-4e9d-9fa5-e05d6c5cdfca","content":"\u003cp\u003eIn high school I did a little bit of everything, especially during the summer\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e- working at a restaurant\u003c/p\u003e\u003cp\u003e- training for baseball\u003c/p\u003e\u003cp\u003e- playing in basketball tournaments\u003c/p\u003e\u003cp\u003e- racing mountain bikes\u003c/p\u003e\u003cp\u003e- going to the beach\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"72962145-cf54-4d6d-8131-ab67d8bd4806\"}":{"__typename":"DeepDives","uuid":"72962145-cf54-4d6d-8131-ab67d8bd4806","content":"\u003cp\u003eI think mentors are one of the most important figures in a child’s upbringing. Their family and friends are extremely important, but someone outside of their family, who truly cares about them and will always look out for them is irreplaceable. I really want to be that person for someone, helping them through tough times and decisions, while also celebrating their accomplishments. I have done a lot of things I am very happy with, and have also made some decisions I regret, and I would love to pass this advice off to a younger student to help them in their journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"10ee3945-ad8f-4fc0-b5ca-bcecb4416e3f\"}":{"__typename":"School","uuid":"10ee3945-ad8f-4fc0-b5ca-bcecb4416e3f","name":"Malibu High School","city":"Malibu","type":"HIGH","state":"California","country":"United States","zip":"90265"},"Education:{\"uuid\":\"414869be-af97-4a70-aa2c-50ca32eece74\"}":{"__typename":"Education","uuid":"414869be-af97-4a70-aa2c-50ca32eece74","school":{"__ref":"School:{\"uuid\":\"10ee3945-ad8f-4fc0-b5ca-bcecb4416e3f\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"2cebe226-c25b-4343-8cfc-0e039deac925\"}":{"__typename":"Education","uuid":"2cebe226-c25b-4343-8cfc-0e039deac925","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Business Administration (Emphasis in Finance)","degree":null},"MentorPublicProfile:{\"uuid\":\"2e93bad9-9734-4931-9e22-dca9aa729fc4\"}":{"__typename":"MentorPublicProfile","uuid":"2e93bad9-9734-4931-9e22-dca9aa729fc4","displayName":"Stefan C.","slug":"stefan-colburn-1","biography":"\u003cp\u003eHello! My name is Stefan Colburn and I am a junior studying business administration with an emphasis in finance at the University of Southern California. I am a very outgoing person, who loves doing anything active and outdoors!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school I was involved in a variety of different things. I played both baseball and basketball at the varsity level, and also mountain-biked competitively. Outside of sports, I founded and ran the largest club at my school, which raised thousands of dollars per year for local children’s hospitals. I also was on the board of a local non profit where I was the Chair of Operations. In this role I created a computer lab and organized courses to teach the day laborers we worked with computer skills which led to an increase in their salaries.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile I was unsure of what I wanted to do coming into college, I knew I wanted to do something that makes a positive impact in the world. I have always had a passion for numbers and I enjoy working in teams, so I decided finance was the career I wanted to pursue. Upon my graduation in May, I will be moving to San Francisco to start my full time job in investment banking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have stayed very busy throughout college through a variety of different endeavors. I am part of the Joint Educational Project at USC where I teach local K-12 students about personal finance and accounting. I am hoping this will help create a more financially literate future for them, as I think financial literacy is one of the most important things for young people to learn. I was also Vice President of my fraternity, where my main project I was working on was founding a member led investment fund that allows members to get hands-on financial experience while also utilizing the profits to allow us to give more scholarships to deserving current or prospective members.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor I hope to make a deep connection with your student that goes beyond our scheduled meetings. I have been lucky enough to have had great role models and mentors to look up to, and I hope to be that to other young, motivated students. I would love to create a relationship that lasts through their schooling and even beyond. As previously mentioned, I have taught in K-12 schools. Through this, I have developed strong teaching skills which allow me to effectively tailor my lessons to an individual student's needs. This allows me to keep them engaged, having fun, while also learning. As someone who has completed two major projects and is in the midst of completing a third, I believe I know exactly what it takes to oversee and guide a project from idea creation to completion.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI cannot wait to get to know you and your student!\u003c/p\u003e","teachingVideoPlaybackId":"sxBuBfdv4BiTF802mHHaJL00cFeDNW6EQYBE101oMgSzmg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business Administration (Emphasis in Finance)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5cdb9529-9423-453c-9be1-2f2f29ad7bc7\"}"},{"__ref":"DeepDives:{\"uuid\":\"8b1f318f-0fe8-488b-9df0-1fc5435aa440\"}"},{"__ref":"DeepDives:{\"uuid\":\"4fd6d0c0-7a8a-4e9d-9fa5-e05d6c5cdfca\"}"},{"__ref":"DeepDives:{\"uuid\":\"72962145-cf54-4d6d-8131-ab67d8bd4806\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/498aa244-8e2b-48a2-ac42-1c722d6d0f67/-/preview/-/format/jpg/","https://ucarecdn.com/53adbbc5-f188-485b-83e8-10f9e40bdefc/-/preview/-/format/jpg/","https://ucarecdn.com/923604c7-1b53-46de-9c6d-e43f52d5a9e9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"414869be-af97-4a70-aa2c-50ca32eece74\"}"},{"__ref":"Education:{\"uuid\":\"2cebe226-c25b-4343-8cfc-0e039deac925\"}"}],"hiredAt":"2024-06-26T03:08:24.243Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","Economics","Sports Journalism","Business / Entrepreneurship","Finance / Investing","Sports Analytics"],"communityBadges":["https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/","https://ucarecdn.com/b98f175c-f982-4497-bb8d-4a9c11113cd8/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"stefan-colburn-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2e93bad9-9734-4931-9e22-dca9aa729fc4\"}"}}},"_sentryTraceData":"a056891252d34ea7a205f04c4198c5f4-bc5d305d5fd04f58-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a056891252d34ea7a205f04c4198c5f4,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"stefan-colburn-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
