xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2219a6c2-cbf6-4b2c-baba-953c1fd7592a\"}":{"__typename":"DeepDives","uuid":"2219a6c2-cbf6-4b2c-baba-953c1fd7592a","content":"\u003cp\u003eMentorship matters to me because it’s one of the fastest ways to change a student’s trajectory by giving them structure, belief, and tools they can carry forward. I’ve seen how talented students can still feel stuck when they don’t know what the next step is, or when they assume everyone else has insider knowledge about research, writing, or college admissions. Being mentored (and later mentoring others) taught me that confidence isn’t something you either have or don’t. It’s something you build through clear feedback and someone who takes your goals seriously.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt also matters to me because I genuinely enjoy the moment when a student’s thinking clicks into place: when they realize their story has value, or that a big, intimidating goal can be broken into manageable pieces. Whether I’m helping someone revise an essay or plan a passion project, the goal is the same: to help them make decisions with clarity instead of anxiety. I care a lot about students learning how to advocate for themselves, ask better questions, and develop a process they can reuse long after our sessions end.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, mentorship feels meaningful to me because it’s personal: I like building trust, showing up consistently, and watching students grow into people who can guide others. The best mentorship creates a ripple effect: students gain skills and confidence, and then they pass that support forward in their own communities. That’s the kind of impact I want to have.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"71c59067-0034-4280-bdef-449869ba2f96\"}":{"__typename":"DeepDives","uuid":"71c59067-0034-4280-bdef-449869ba2f96","content":"\u003cp\u003eMy identity as a first-generation college student whose parents did not finish high school shapes my teaching style in a very practical way: I never assume a student already knows the “unwritten rules” of school, college admissions, or research. Because I was in ESL until 4th grade, I understand what it feels like to work twice as hard just to catch up, and I’m attentive to pacing, clarity, and confidence-building rather than rushing through material. A mentor in high school helped me see that college and research were genuinely possible for me, and I try to be that same steady source of direction for my students: someone who expands what they believe they can do and gives them a clear path to get there.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn sessions, I teach step-by-step and check for real understanding and progress at each stage, whether that’s a concept, a draft, or a project milestone, so students don’t move forward with gaps that later become overwhelming. If something isn’t working, we diagnose the obstacle, go back to the point of confusion, brainstorm alternatives, and iterate until we find an approach that clicks. My goal is for students to leave not only with a better result, but with a repeatable process they can use independently in future classes and challenges.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"51990fd9-75b7-47d5-ae5f-845f39614a51\"}":{"__typename":"DeepDives","uuid":"51990fd9-75b7-47d5-ae5f-845f39614a51","content":"\u003cp\u003eIn high school, I was extremely involved and very driven. I took 16 AP classes and held leadership roles as president of three organizations: Academic Decathlon, Medical Careers Club, and Science Honor Society, and I was also active in NHS, Science NHS, and NJCL Latin Honor Society (I studied Latin for five years). My biggest commitment was Academic Decathlon, a rigorous ten-event competition spanning math, science, literature, economics, social science, art, music, essay, speech, and interview; our nine-person team advanced to nationals, where I placed second overall. Outside of school, I worked every day after class at my family’s restaurant and helped take care of my younger siblings by supporting them with homework, so I learned early how to balance responsibility with ambition. I also volunteered every Sunday at a local nursing home and stayed committed to research, continuing projects through my school’s gifted program, in the biotechnology lab. I also pursued writing a literature review and presenting my research from the University of Pittsburgh cancer labs at local science fairs and poster sessions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"5664728b-5979-419f-8ad8-33ffc161f51c\"}":{"__typename":"DeepDives","uuid":"5664728b-5979-419f-8ad8-33ffc161f51c","content":"\u003cp\u003eIn high school, I created a community-facing passion project through my family’s Chinese restaurant: we launched a boba fundraiser where proceeds supported Alzheimer’s research. Because I worked at the restaurant every day after school, I built the project around the resources I actually had—developing a menu item people would genuinely order, making flyers, promoting it locally, and iterating on execution so it was sustainable rather than a one-time idea. It taught me that impact isn’t just about having a good cause; it’s about designing something that works in the real world and following through consistently.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also pursued a research-focused passion project through the Hillman Academy program, where I spent my junior and senior years conducting cancer biology research on lung and ovarian cancer. I was mentored by postdocs and PIs in the lab, wrote my own literature review, and presented my work through poster talks and multiple science fairs, including a regional science fair. That experience made research feel tangible and showed me how sustained curiosity, mentorship, and clear communication can turn complex science into something you can share with others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"84bb32b6-cd78-4e64-a0a8-a39b63ba4bf4\"}":{"__typename":"School","uuid":"84bb32b6-cd78-4e64-a0a8-a39b63ba4bf4","name":"Seneca Valley Senior High School","city":"Harmony","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"16037"},"Education:{\"uuid\":\"4348fa32-bdba-4154-b354-f2370269862e\"}":{"__typename":"Education","uuid":"4348fa32-bdba-4154-b354-f2370269862e","school":{"__ref":"School:{\"uuid\":\"84bb32b6-cd78-4e64-a0a8-a39b63ba4bf4\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"6cb7d2b5-4c0a-4167-b43c-859435841ece\"}":{"__typename":"Education","uuid":"6cb7d2b5-4c0a-4167-b43c-859435841ece","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"MCDB (Molecular, Cellular, and Developmental Biology)","degree":null},"MentorPublicProfile:{\"uuid\":\"d162b63e-31e8-4793-b489-b8b732208843\"}":{"__typename":"MentorPublicProfile","uuid":"d162b63e-31e8-4793-b489-b8b732208843","displayName":"Nancy C.","slug":"nancy-chen","biography":"\u003cp\u003eI’m Nancy Chen, a BS/MS student in Molecular, Cellular, and Developmental Biology at Yale University (Class of 2027), and I’m excited to mentor high school and pre-college students through Curious Cardinals. I care deeply about helping students feel both capable and seen: capable because they have a clear plan and the skills to execute it, and seen because their interests and stories are taken seriously and valued. Alongside my academic work, I’ve been recognized with the Yale College First-Year Summer Research Fellowship and the J. Edward Meeker Prize from the Yale English Department for nonfiction writing, bringing both scientific rigor and strong storytelling to my mentorship.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in:\u003c/strong\u003e I support students across college applications, passion projects, and academic growth. For college admissions, I help students identify an authentic narrative and turn it into polished writing, such as brainstorming personal statements, building outlines, and revising sentence-by-sentence so each draft sounds like you, not an adult rewriting you into someone else. I’ve also worked at two college admissions companies, where I mentored students on crafting stronger applications and edited 100+ essays, which sharpened my ability to diagnose what an essay is really saying (and what it’s accidentally not saying yet). For passion projects, I guide students from “I’m interested in ___” to a real, finished product: a research question, a structured timeline, weekly deliverables, and a final output (paper, presentation, portfolio, or community initiative) they can be proud of. Academically, I excel in the life sciences, mathematics, and reading. I help students study more effectively by breaking down dense content, identifying gaps early, and establishing routines that remain consistent during busy weeks. My teaching background includes two years of tutoring math and reading at Kumon, tutoring science and math through my middle school, and ongoing work with Bridges ESL.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to mentor:\u003c/strong\u003e I’ve spent years in wet-lab research environments, which have trained me to think methodically, test ideas carefully, and communicate results clearly. I’ve also taught and mentored students directly: I tutor through an ESL program (designing personalized lessons and building confidence step-by-step), and I regularly support students with writing, planning, and accountability. I’m detail-oriented, highly organized, and honest about standards (supportive in tone, but serious about helping students reach excellence).\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat sessions with me feel like: \u003c/strong\u003estructured, calm, and productive. We’ll leave every session with concrete next steps (not vague motivation), and I’ll help you build independence so you can keep progressing between meetings.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eFun facts about me:\u003c/strong\u003e I love cooking and baking for friends and family, I do photography, I knit, and I collect and try different teas (I’m always hunting for a new favorite). If you’re the kind of student who wants both high standards and someone genuinely in your corner, I’d love to work together.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"EEI01QarkAMfi7nImtzD02aMXRPWZAUrQfbeP02bbSCs02E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"MCDB (Molecular, Cellular, and Developmental Biology)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2219a6c2-cbf6-4b2c-baba-953c1fd7592a\"}"},{"__ref":"DeepDives:{\"uuid\":\"71c59067-0034-4280-bdef-449869ba2f96\"}"},{"__ref":"DeepDives:{\"uuid\":\"51990fd9-75b7-47d5-ae5f-845f39614a51\"}"},{"__ref":"DeepDives:{\"uuid\":\"5664728b-5979-419f-8ad8-33ffc161f51c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/201cba49-3e72-48de-b7fd-b40e81e8ec51/-/preview/-/format/jpg/","https://ucarecdn.com/a9680d32-528a-4c86-b895-6fbee8e52121/-/preview/-/format/jpg/","https://ucarecdn.com/9d162cbb-8f43-4429-87a1-f8a12a713534/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4348fa32-bdba-4154-b354-f2370269862e\"}"},{"__ref":"Education:{\"uuid\":\"6cb7d2b5-4c0a-4167-b43c-859435841ece\"}"}],"hiredAt":"2026-02-01T08:32:50.154Z","topics":["Calculus","Biology","Chemistry","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Economics","Creative Writing","Medicine / Health"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nancy-chen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d162b63e-31e8-4793-b489-b8b732208843\"}"}}},"_sentryTr
