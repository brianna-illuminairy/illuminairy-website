xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f903b842-217b-4a5d-8a9f-e56e177e69ae\"}":{"__typename":"Favorites","uuid":"f903b842-217b-4a5d-8a9f-e56e177e69ae","photoUrl":"https://ucarecdn.com/f7e434da-8555-4a95-8721-4a6c300fe397/","title":"Good Will Hunting","type":"MOVIE"},"Favorites:{\"uuid\":\"978fe5ed-1169-467c-b038-32e0b2c3615c\"}":{"__typename":"Favorites","uuid":"978fe5ed-1169-467c-b038-32e0b2c3615c","photoUrl":"https://ucarecdn.com/a7041f84-17af-4e68-be49-8b1dcb526e3d/","title":"\"Ottolenghi\" by Loyle Carner","type":"SONG"},"Favorites:{\"uuid\":\"97c908a3-14d0-4740-bc18-766649769566\"}":{"__typename":"Favorites","uuid":"97c908a3-14d0-4740-bc18-766649769566","photoUrl":"https://ucarecdn.com/37719ee9-ce13-4cb1-a03c-70c4bf207fc3/","title":"Cape Town","type":"CITY"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"dd433b37-018d-4481-ad3c-89272057e065\"}":{"__typename":"DeepDives","uuid":"dd433b37-018d-4481-ad3c-89272057e065","content":"\u003cp\u003eIn my spare time, I'm a bit of a hobby mixologist:\u003cbr\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eI pick fruits on Stanford's campus, but not just any fruits. No, these are the elite oranges that have passed a rigorous taste test. If an orange makes the cut, it's picked. If not, well, it's sentenced to live out its days on the tree, contemplating its citrusy shortcomings. 🍊\u003cbr\u003e\u003cbr\u003eSailing while playing the guitar? You bet! It's a musical voyage like no other. I call it \"rocking the boat,\" and it involves more out-of-tune sea shanties than you can shake a sailor's hat at. Sure, the fish don't clap, but I'm convinced their silence is a sign of deep aquatic appreciation. ⛵️\u003cbr\u003e\u003cbr\u003eAnd tutoring? Oh, you mean my part-time gig as the \"Homework Whisperer.\" I don't just teach subjects; I communicate with them. \u003cbr\u003e\u003cbr\u003eMath problems? We negotiate a truce. History dates? We have long, meaningful conversations. And don't even get me started on Physics; we're still not speaking after a heated debate about gravity (... \u0026amp; after receiving a bad grade on my exam) 🎓\u003cbr\u003e\u003cbr\u003eNeedless to say, my main mentorship focus/tutoring theme is not physics; rather it is \"English/poetry writing\" + \"college application reviews\": try me! \u003cbr\u003e\u003cbr\u003e🌱 📖 🌞 \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"aea88d16-a068-4727-b35c-18e60c9a4d2f\"}":{"__typename":"DeepDives","uuid":"aea88d16-a068-4727-b35c-18e60c9a4d2f","content":"\u003cp\u003e\"just keep swimming\" (it's true!) 🐠 \u003cbr\u003e\u003cbr\u003e- - \u003cbr\u003e\u003cbr\u003e*Things almost always get better [long-term] as long as each \u0026amp; every day you're trying: zoom out \u0026amp; remind yourself of your resilience + strengths throughout the years –– those moments you made it through tough times...\u003cbr\u003e\u003cbr\u003eNow ask yourself when another difficult moment arises: what makes ______ (*insert any difficult situation you may be grappling with*) any different? \u003cbr\u003e\u003cbr\u003e(My bet: You've dealt with similar feelings before –– you are stronger than you know –– you just need to be seen, heard, and belong). \u003cbr\u003e\u003cbr\u003e- - \u003cbr\u003e\u003cbr\u003eGood things come around to those who wait, yes, but also to those who \"just keep swimming\" each \u0026amp; every day, trying to get better + keeping true to healthy mindsets. 🏆 \u003cbr\u003e\u003cbr\u003e'Little wins make the champion' (just made this up; but you catch my drift!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"779d1028-4590-4ee4-94a1-b3f284b0bebb\"}":{"__typename":"DeepDives","uuid":"779d1028-4590-4ee4-94a1-b3f284b0bebb","content":"\u003cp\u003eIt is perhaps the most meaningful practice one can adopt in my opinion. \u003cbr\u003e\u003cbr\u003eIt is a practice lasting millenniums of humanity –– teaching via mentorship as the center-point of what allows flow of knowledge, what keeps us connected –– growing \u0026amp; learning something new each-every day ahead of us ✏️ 🧠 .  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3ab662dc-623d-4ded-ab9b-6294cf6bd67f\"}":{"__typename":"DeepDives","uuid":"3ab662dc-623d-4ded-ab9b-6294cf6bd67f","content":"\u003cp\u003eBeing a rambunctious kid...\u003cbr\u003e\u003cbr\u003e- Bodysurfing \u0026amp; Beachgoing 🏝 \u003cbr\u003e- Rock-climbing / free diving 🌊 \u003cbr\u003e- Studying... because I  love learning! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"DeepDives:{\"uuid\":\"b86b6702-b3aa-4697-9d51-e18e593046 "question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"f63e18ad-d8be-4ffd-b01f-202e27056645\"}":{"__typename":"School","uuid":"f63e18ad-d8be-4ffd-b01f-202e27056645","name":"Punahou School","city":"Honolulu","type":"HIGH","state":"Hawaii","country":"United States","zip":"96822"},"Education:{\"uuid\":\"64fd3e6b-4f99-44cc-b12d-669d2147d9df\"}":{"__typename":"Education","uuid":"64fd3e6b-4f99-44cc-b12d-669d2147d9df","school":{"__ref":"School:{\"uuid\":\"f63e18ad-d8be-4ffd-b01f-202e27056645\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d13d4ebd-58c0-4e4c-aeb4-5b29214844be\"}":{"__typename":"Education","uuid":"d13d4ebd-58c0-4e4c-aeb4-5b29214844be","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Psychology ","degree":null},"MentorPublicProfile:{\"uuid\":\"3509284e-64f2-4772-a7d3-024317e01e8e\"}":{"__typename":"MentorPublicProfile","uuid":"3509284e-64f2-4772-a7d3-024317e01e8e","displayName":"Matthew M.","slug":"matthew-mettias","biography":"\u003cp\u003eAs an academic tutor and student mentor at Curious Cardinals, I help high school students achieve their academic and personal goals through personalized online learning and coaching. I specialize in tutoring subjects such as psychology and poetry and mentoring students on other topics such as college applications, leadership development, and social impact. \u003cbr\u003e\u003cbr\u003eI am passionate about creating a supportive and engaging learning environment for my students, and empowering them to pursue their interests and aspirations.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am also a master's student in Sustainability Science and Practice at Stanford University, where I explore the interdisciplinary and innovative approaches to address the complex and urgent challenges of environmental and social sustainability. \u003cbr\u003e\u003cbr\u003eI have a strong background in psychology and science, technology, and society, which I studied as an undergraduate at Stanford University, graduating with honors. I have applied my knowledge and skills to various research, consulting, and leadership projects, such as working as a public policy consultant for the World Bank, a marketing strategist for the Marriage Pact, and a co-chair for the Stanford Disability Alliance. I am always eager to both teach (\u0026amp; learn!) new things, collaborate with diverse teams, and contribute to positive change whenever \u0026amp; wherever 🦉📚 !\u003cbr\u003e\u003cbr\u003e- - \u003cbr\u003e\u003cbr\u003ehttps://www.linkedin.com/in/matthewmettias/\u003cbr\u003e\u003cbr\u003ehttps://matthewmettias.weebly.com/\u003c/p\u003e","teachingVideoPlaybackId":"peiMYtyjdbBErKVeUkR9zPA4YcWGrB00Po600UOBweuEA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMaking meaningful connections with friends back at school (🌲 ): \u003cbr\u003e\u003cbr\u003eTrying to lead with a direct approach that allows others to critically envision + examine new possibilities \u0026amp; the feasibility of their thoughts. \u003cbr\u003e\u003cbr\u003eScaffolding/coaching students in their respective subjects, supporting them to reach their goals.  \u003cbr\u003e\u003cbr\u003eLeaving life a little better than it was originally left through active, strengths-based leadership. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f903b842-217b-4a5d-8a9f-e56e177e69ae\"}"},{"__ref":"Favorites:{\"uuid\":\"978fe5ed-1169-467c-b038-32e0b2c3615c\"}"},{"__ref":"Favorites:{\"uuid\":\"97c908a3-14d0-4740-bc18-766649769566\"}"}],"causesSupported":[],"major
