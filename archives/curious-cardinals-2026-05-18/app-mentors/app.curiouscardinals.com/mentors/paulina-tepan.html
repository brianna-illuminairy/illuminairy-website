xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"340c5320-e272-4655-872d-ac5fc25b6304\"}":{"__typename":"Favorites","uuid":"340c5320-e272-4655-872d-ac5fc25b6304","photoUrl":"https://ucarecdn.com/c7db8717-2843-4c89-b5f2-cc254aee259b/","title":"La La Land","type":"MOVIE"},"Favorites:{\"uuid\":\"9d1e4ffa-48ed-494d-8b4f-dcab6a948b78\"}":{"__typename":"Favorites","uuid":"9d1e4ffa-48ed-494d-8b4f-dcab6a948b78","photoUrl":"https://ucarecdn.com/d3ffdbd1-b6bc-46d5-9682-a350c189fa41/","title":"Paris","type":"CITY"},"Favorites:{\"uuid\":\"5031334a-fa22-4f72-82b9-5ca9df952eb2\"}":{"__typename":"Favorites","uuid":"5031334a-fa22-4f72-82b9-5ca9df952eb2","photoUrl":"https://ucarecdn.com/3686a38d-c804-44b6-8d4b-89af7d4f2a29/","title":"Soccer","type":"SPORT"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3ee06b1d-b058-4038-a1c8-6c9c292e43c2\"}":{"__typename":"DeepDives","uuid":"3ee06b1d-b058-4038-a1c8-6c9c292e43c2","content":"\u003cp\u003eBaking, soccer, fashion/modeling, long walks, \u0026amp; trying new restaurants \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"494862b6-449e-4737-9992-53e762f7292f\"}":{"__typename":"DeepDives","uuid":"494862b6-449e-4737-9992-53e762f7292f","content":"\u003cp\u003eSophomore summer, I launched my baking business and baking classes which took up most of my time. \u003cbr\u003e\u003cbr\u003eJunior summer, I continued my business, began baking for my local food pantry, visited Hawaii, and prepared my Common App essay for college applications.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSenior summer was the best. I interned at a wealth management Firm, First Manhattan, enjoyed my last few weeks with my home friends, and travelled to Europe. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"13e1a43c-5d64-4dca-b971-84732eee38f0\"}":{"__typename":"School","uuid":"13e1a43c-5d64-4dca-b971-84732eee38f0","name":"Rye High/Middle School","city":"Rye","type":"HIGH","state":"New York","country":"United States","zip":"10580"},"Education:{\"uuid\":\"78f9f591-a667-4ede-bcc6-59788096d235\"}":{"__typename":"Education","uuid":"78f9f591-a667-4ede-bcc6-59788096d235","school":{"__ref":"School:{\"uuid\":\"13e1a43c-5d64-4dca-b971-84732eee38f0\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"0db62ef6-e963-413a-8f54-68447217d68a\"}":{"__typename":"Education","uuid":"0db62ef6-e963-413a-8f54-68447217d68a","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Finance and AI","degree":null},"MentorPublicProfile:{\"uuid\":\"c09c3c06-5c5f-41db-936c-3658ce3047bc\"}":{"__typename":"MentorPublicProfile","uuid":"c09c3c06-5c5f-41db-936c-3658ce3047bc","displayName":"Paulina T.","slug":"paulina-tepan","biography":"\u003cp\u003eHi! I'm Paulina Tepan, a sophomore at the University of Pennsylvania, studying Finance and AI. I grew up in Rye, New York, and was raised by my dad—a U.S. Marine—who taught me the value of hard work, discipline, and pushing through challenges. Those lessons have shaped everything about how I approach school, work, and life.\u003c/p\u003e\u003cp\u003eAt Wharton, I'm focused on investment banking and consumer brands. This summer I’m interning at LVMH in their NYC Financial Planning and Analysis team, and summer 2027, will be doing investment banking at Alantra. I've done financial analysis on companies like PepsiCo, and I've had internship experience in private equity and wealth management. I'm especially drawn to founder-led businesses because there's always a great story behind them—and I love figuring out what makes a company successful.\u003c/p\u003e\u003cp\u003eOutside of class, I cook and bake for Penn Appétit, my university's food magazine, and I'm involved in fashion and modeling through The WALK, our university's fashion publication. I also enjoy playing soccer and going on long walks outside of campus. On top of that, I started my own small baking business, Sw33t Brand, making diabetic-friendly desserts — because why not combine creativity, health, and entrepreneurship all in one? It's been one of my favorite ways to explore what it actually feels like to run something.\u003c/p\u003e\u003cp\u003eMy interest in business started early, working in my family's business. I watched them make real decisions—how to price things, manage inventory, keep customers happy—and I saw how much goes into running your own business. That's what made me fall in love with business: it's not just math and spreadsheets, it's people and problem-solving.\u003c/p\u003e\u003cp\u003eSomething I really care about is making finance and business feel less intimidating, especially for people who didn't grow up seeing themselves in those spaces. Coming from a Hispanic family with a small business background, I know how powerful it is when someone takes the time to guide you. I want to be that person for someone else.\u003c/p\u003e\u003cp\u003eIf you're curious, ambitious, or trying to figure out where you're headed, I'd love to support you through your next chapter. Nothing is off limits. I can't wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"wpFdp7J1x95T02oQ9tuEpqTz2lXM1m7tS9qmeJCpYeiE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"340c5320-e272-4655-872d-ac5fc25b6304\"}"},{"__ref":"Favorites:{\"uuid\":\"9d1e4ffa-48ed-494d-8b4f-dcab6a948b78\"}"},{"__ref":"Favorites:{\"uuid\":\"5031334a-fa22-4f72-82b9-5ca9df952eb2\"}"}],"causesSupported":[],"major":"Finance and AI","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3ee06b1d-b058-4038-a1c8-6c9c292e43c2\"}"},{"__ref":"DeepDives:{\"uuid\":\"494862b6-449e-4737-9992-53e762f7292f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f563fc20-7d48-47e1-9409-079ad3dd840d/-/preview/-/format/jpg/","https://ucarecdn.com/d3fb24ee-736e-4363-8942-33eb1b53549f/-/preview/-/format/jpg/","https://ucarecdn.com/83103c4e-595a-4489-963e-7ab0b23e6a35/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"78f9f591-a667-4ede-bcc6-59788096d235\"}"},{"__ref":"Education:{\"uuid\":\"0db62ef6-e963-413a-8f54-68447217d68a\"}"}],"hiredAt":"2026-05-01T18:53:29.518Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"paulina-tepan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c09c3c06-5c5f-41db-936c-3658ce3047bc\"}"}}},"_sentryTraceData":"b94017ba9d1d48668a64fccdee0dca08-9783c40ab3ebdc56-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b94017ba9d1d48668a64fccdee0dca08,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_
