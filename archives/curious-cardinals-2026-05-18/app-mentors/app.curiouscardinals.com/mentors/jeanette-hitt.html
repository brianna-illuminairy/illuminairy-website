xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8ca1ccca-bd59-4848-8a89-0e20bcccf9b5\"}":{"__typename":"DeepDives","uuid":"8ca1ccca-bd59-4848-8a89-0e20bcccf9b5","content":"\u003cp\u003eThroughout high school and college, I was supported by incredible teachers and professionals. Their commitment to locating opportunities for me, connecting me with resources, and just being there to chat, changed the course of my education. I want to pay their actions forward, and offer my skills to someone else. I believe in the transformative power of listening to young adults, to hearing about their passions, advocating for them, and helping them achieve their full potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"5d3de204-0f40-4b10-9519-6c34fb98c979\"}":{"__typename":"DeepDives","uuid":"5d3de204-0f40-4b10-9519-6c34fb98c979","content":"\u003cp\u003eIn a word, a nerd. I have always loved learning in class, but also devoted all my time outside of class to extracurriculars. In high school, I served on the 'sustainability board', a working group of students dedicated to implementing more sustainable school policies. I co-led the Students Advocating for gender Equity (SAGE) club, and ran cross country. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a4dd6d25-d372-4606-9f0d-3170237b9961\"}":{"__typename":"DeepDives","uuid":"a4dd6d25-d372-4606-9f0d-3170237b9961","content":"\u003cp\u003eI hope to leverage technology to uncover critical insights about the climate. I want to conduct the cutting-edge research (specifically using remote sensing techniques) needed to develop more resilient climate solutions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0d11f69e-7c8d-411e-9646-f41bc5a46931\"}":{"__typename":"DeepDives","uuid":"0d11f69e-7c8d-411e-9646-f41bc5a46931","content":"\u003cp\u003eI chose to double major in English and Science \u0026amp; Technology Studies (STS) because I did not want to sacrifice neither my interest in science nor passion for writing. The STS program enabled me to build a strong technical foundation in the scientific method, while critically examining its history and philosophy. As an English student, I cultivated critical thinking and writing capability. By pursuing both science and the humanities, I developed a well-rounded, unique perspective I bring to each of my roles and a varied skillset.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"ff8d11b8-a997-4b3c-9926-91eb25df6bcf\"}":{"__typename":"School","uuid":"ff8d11b8-a997-4b3c-9926-91eb25df6bcf","name":"Milton Academy","city":"Milton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02186"},"Education:{\"uuid\":\"7078af54-3990-4ee1-af06-48e2f5dfb4a9\"}":{"__typename":"Education","uuid":"7078af54-3990-4ee1-af06-48e2f5dfb4a9","school":{"__ref":"School:{\"uuid\":\"ff8d11b8-a997-4b3c-9926-91eb25df6bcf\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d0b1fa77-da0f-4488-b92b-4dcb04d0ec5e\"}":{"__typename":"School","uuid":"d0b1fa77-da0f-4488-b92b-4dcb04d0ec5e","name":"Wesleyan University","city":"Middletown","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06459"},"Education:{\"uuid\":\"550906eb-0334-4832-8933-0f3d37c813e4\"}":{"__typename":"Education","uuid":"550906eb-0334-4832-8933-0f3d37c813e4","school":{"__ref":"School:{\"uuid\":\"d0b1fa77-da0f-4488-b92b-4dcb04d0ec5e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English \u0026 Science and Technology Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"8cc7b8f1-da62-459a-92f0-1542225a8111\"}":{"__typename":"MentorPublicProfile","uuid":"8cc7b8f1-da62-459a-92f0-1542225a8111","displayName":"Jeanette H.","slug":"jeanette-hitt","biography":"\u003ch3\u003e\u003cstrong\u003eNettie, Writing \u0026amp; Research (Passion Project)\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eHey! I’m Jeanette (you can call me Nettie) , a recent graduate from Wesleyan University, an experienced writing tutor and burgeoning scientific researcher.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a highly interdisciplinary person, I have nurtured lifelong passions for both the sciences and humanities. At Wesleyan, I majored in both English and Science \u0026amp; Technology Studies (concentrating in Earth Science). Applying both of these passions, I’ve:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAuthored a 70-page critical thesis that earned me several awards, including the Dorchester Prize, High Honors in the English Department, and contributed to my status as the sole recipient of Wesleyan’s highest academic recognition for 2025.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterned with NASA through the DEVELOP program, conducting a geospatial, Earth science research project that used satellite imagery to develop a machine-learning model.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCo-authored two publications with my professors, a book chapter about the history of metabolic science, and separately, an essay on contemporary literature.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as the senior prose editor for Wesleyan’s creative writing magazine, the Lavender.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThroughout each of these experiences, I was supported by dedicated mentors who guided me through numerous applications, drafts, and deadlines. I am passionate about serving as an effective, knowledgeable resource to students.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eProjects we can do\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI mentor students who want to explore:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch Projects \u003c/strong\u003e(designing and conducting a science or social science research project, creating deliverables)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNon-fiction \u0026amp; Fiction Writing \u003c/strong\u003e(developing a writing portfolio, authoring a long-form piece, preparing works for publication)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also help cultivate project formulation, organization, and time management skills! In the past, I have helped students break-up a long, daunting process into manageable steps.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy mentorship style\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAs a peer writing tutor in high school and college, I developed an aptitude for helping students grow into confident and articulate writers. I specialize in organizing jumble of ideas into clear, concise language. As a researcher, I bring in-depth knowledge of the scientific process, and support in experimental design, execution, and scientific report authorship. My diverse skillset equips me to work with students across various academic areas. I believe that writing skills are critical for every discipline and industry.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWorkshopping your latest piece of fiction writing\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a clear, executable methodology for your research project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTransforming your interest into a polished project you are proud of.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eMore about me\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside of class, I enjoy hiking, trail running, fishing, and traveling. I love to identify plants, and pride myself on knowing most all of the species in a typical New England forest! You can also find me in the used-bookstore, at the flea market, at the movie theater, or out for coffee.\u003c/p\u003e","teachingVideoPlaybackId":"BxadMSc59bAy8pbPGrUfZucCaEuKSPCt5AmXm96FoBw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English \u0026 Science and Technology Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8ca1ccca-bd59-4848-8a89-0e20bcccf9b5\"}"},{"__ref":
