xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2ef6018e-29cb-4979-9913-249dc6217347\"}":{"__typename":"DeepDives","uuid":"2ef6018e-29cb-4979-9913-249dc6217347","content":"\u003cp\u003eI worked as a lead camp counselor for a swim and recreation club in my neighborhood all throughout high school! I would create daily schedules of engaging and enriching learning activities for campers, and lead meetings and training programs for counselors and new hires. By working with kids ages 4-14, I really grasped what it's like to build community among all different age groups.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"ec9a17cd-34ea-4488-bb29-81a45acb641c\"}":{"__typename":"DeepDives","uuid":"ec9a17cd-34ea-4488-bb29-81a45acb641c","content":"\u003cp\u003eI defended my title as a track and field state champion in the 400m dash two years in a row! After winning it my junior year in high school, there was a lot of pressure that weighed on me the following year. However, with a lot of grit, determination, and many hours spent in the rain practicing on the track, I won the event again in my senior year! For me, track is a sport that has such a good culture, as it encompasses so many different running and field events that all fall under the same umbrella sport. It was so exciting to be able to show my coaches and fellow teammates that consistency and dedication to the workouts and program really paid off, and even if others participated in a different event than I, they were still able to appreciate these qualities and celebrate with me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7fa05629-b62f-4c44-a24b-5658273c84c3\"}":{"__typename":"DeepDives","uuid":"7fa05629-b62f-4c44-a24b-5658273c84c3","content":"\u003cp\u003eIt's so important that we as mentors can share our learned experiences, passions, and strategies with the next generation of learners - and inspire them to want to carry on this tradition themselves. I've found myself in so many situations where I wondered if an older student or teacher also had the same experience, and the answer is usually yes! By sharing my tried-and-true tips on how to write a stellar college essay, or ways to remember the quadratic formula, etc., I think it's wonderful that someone out there is following in your footsteps and could really benefit from a guiding, helping hand.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"1cfaef56-bf47-4dae-868f-8b9751261cae\"}":{"__typename":"School","uuid":"1cfaef56-bf47-4dae-868f-8b9751261cae","name":"Interlake High School","city":"Bellevue","type":"HIGH","state":"Washington","country":"United States","zip":"98008"},"Education:{\"uuid\":\"a3d857fa-5b7d-4a44-80ef-4a4627044c5e\"}":{"__typename":"Education","uuid":"a3d857fa-5b7d-4a44-80ef-4a4627044c5e","school":{"__ref":"School:{\"uuid\":\"1cfaef56-bf47-4dae-868f-8b9751261cae\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"2ea6846b-ac85-41ea-857b-10b58b3dc773\"}":{"__typename":"Education","uuid":"2ea6846b-ac85-41ea-857b-10b58b3dc773","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"841403ea-bba1-41ba-8c22-3ccd09b7647e\"}":{"__typename":"MentorPublicProfile","uuid":"841403ea-bba1-41ba-8c22-3ccd09b7647e","displayName":"Elaine H.","slug":"elaine-hudacsko","biography":"\u003cp\u003eHi everyone! My name is Elaine Hudacsko, and I’m a rising sophomore at Yale University studying Mechanical Engineering. I’m particularly excited to delve into the field of engineering, not only to strengthen my understanding of core math/physics principles but also to gain the skills to design and build ideas I’m passionate about. However, those who know me well are aware that I am also very into the humanities. As a result, I’m a big fan of the interdisciplinary approach that Yale has with its curriculum, as it allows me to follow both of my interests in depth, by taking not only engineering design classes but also ample writing and seminar-style classes that allow me to convey my thoughts and ideas through story-telling. I would love to mentor students who also have multiple interests that they’re passionate about and need advice on how to pursue both!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHowever, post graduation, I am planning to follow this engineering path towards more of a civil route in order to focus my scope on cities and transportation, as I find that what interests me the most is infrastructure applicable to my daily life - as I get to see how they really work on a day-to-day basis! After interning at my city’s department of transportation as a senior in high school, it further solidified my interest in the world of structural engineering, and I’m excited to apply what I learn at university to this career path.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOther than being an engineer, I am also a student-athlete on the track and field team at Yale. I’m a sprinter running the 200m and the 400m. Although I just started running four years ago, I’ve found myself so attached to the running community. It possesses a culture of not only grit and determination (which positively influences my academic life as well), but also of supporting one another during long days of practice, rehabilitation, or during meet day! The reality of being a collegiate athlete is that your sport ends up being very time consuming, but as a result I’ve learned how to stay organized and great time management skills, and I would love to work with students who also have very demanding schedules.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m back in my hometown of Seattle, I often spend my time working with kids of all ages as a camp counselor. Whether I’m working an after school care program, a birthday party, or a winter break camp, I love returning back to my neighborhood recreation camp! This program is what originally inspired me to start tutoring and mentoring students of all ages, and I can’t wait to carry on this journey as a Curious Cardinals mentor. I hope to give back to the younger generation of learners the knowledge that I have acquired, and in turn inspire those to continue careers in the subjects I’m most passionate about as well.\u003c/p\u003e","teachingVideoPlaybackId":"3kbWtMbapPm67n54rR4gyOfJu02FFh9UmIE7JQgA4RM4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2ef6018e-29cb-4979-9913-249dc6217347\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec9a17cd-34ea-4488-bb29-81a45acb641c\"}"},{"__ref":"DeepDives:{\"uuid\":\"7fa05629-b62f-4c44-a24b-5658273c84c3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1ff78c57-f041-4b97-8ce6-2503f4fa61ed/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a3d857fa-5b7d-4a44-80ef-4a4627044c5e\"}"},{"__ref":"Education:{\"uuid\":\"2ea6846b-ac85-41ea-857b-10b58b3dc773\"}"}],"hiredAt":"2025-05-13T13:46:28.331Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Statistics","Precalculus / Trigonometry","Geometry","Physics","Writing","College Essay Writing","Reading","Executive Function","Academic Coaching"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elaine-hudacsko\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"841403ea-bba1-41ba-8c22-3ccd09b7647e\"}"}}},"_sentryTraceData":"180de8d6d59e497aa3930f9527a19419-a4d0d9d3b9a1a4a7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=180de8d6d59e497aa3930f9527a19419,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"elaine-hudacsko"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.goo
