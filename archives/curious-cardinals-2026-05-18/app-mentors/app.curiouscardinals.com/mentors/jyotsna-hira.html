xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"deeb6ae5-bd97-4f6f-8226-b83e32e96c12\"}":{"__typename":"Favorites","uuid":"deeb6ae5-bd97-4f6f-8226-b83e32e96c12","photoUrl":"https://ucarecdn.com/8a83f0f5-7c13-4785-92ff-b3cbe80386d3/","title":"Jennifer Aniston","type":"ACTOR"},"Favorites:{\"uuid\":\"55bc51b7-af1a-4f5a-a828-a8204fea23aa\"}":{"__typename":"Favorites","uuid":"55bc51b7-af1a-4f5a-a828-a8204fea23aa","photoUrl":"https://ucarecdn.com/c7243850-ab3c-49d8-a15d-63cce8222224/","title":"Soccer","type":"SPORT"},"Favorites:{\"uuid\":\"88d33d48-2a66-4df5-bc09-f87542e2e513\"}":{"__typename":"Favorites","uuid":"88d33d48-2a66-4df5-bc09-f87542e2e513","photoUrl":"https://ucarecdn.com/be2e48d3-0dbf-4cd2-befd-4a602028d389/","title":"Liverpool","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"a28fae02-0294-41ee-9434-489f9be63a1d\"}":{"__typename":"CausesSupported","uuid":"a28fae02-0294-41ee-9434-489f9be63a1d","name":"Hearts For Homeless, UCLA Mobile Clinic","description":"","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"15dfe849-a18d-460e-ab4c-2203bc2f88eb\"}":{"__typename":"DeepDives","uuid":"15dfe849-a18d-460e-ab4c-2203bc2f88eb","content":"\u003cp\u003eI’d tell my younger self to stop panicking every time something doesn’t go perfectly. You don’t need to have your entire future figured out at 14 or 17, you just need to keep showing up and trying.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d also remind myself that being organized is a skill you learn, not something you’re magically born with. Once I stopped comparing myself to others and focused on what worked for \u003cem\u003eme\u003c/em\u003e, everything felt more manageable. Progress \u0026gt; perfection, always. Finally I would tell myself to relax and make more memories with my friends and family. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"07921d60-4f00-47fb-93d6-b4cad848ebb5\"}":{"__typename":"DeepDives","uuid":"07921d60-4f00-47fb-93d6-b4cad848ebb5","content":"\u003cp\u003eI was curious, hardworking, and definitely a bit of an overthinker. I cared a lot about doing well, sometimes too much, and I put a lot of pressure on myself to “get things right.”\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, I loved learning, asking questions, and finding meaning in what I studied. I wasn’t perfect at balance, but I was always trying and that experience helps me really understand students who want to succeed but feel overwhelmed or unsure how to manage it all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d4bbd31e-0d45-4ef8-a821-b5277c2f3b29\"}":{"__typename":"DeepDives","uuid":"d4bbd31e-0d45-4ef8-a821-b5277c2f3b29","content":"\u003cp\u003eMy dream job is to become a dermatologist. I love how dermatology blends science, problem-solving, and creativity, while also allowing you to build long-term relationships with patients. Skin affects how people feel about themselves, and I find it really meaningful to help people feel confident, comfortable, and cared for.\u003c/p\u003e\u003cp\u003eI also love that dermatology isn’t just one thing, it can involve medical care, procedures, research, and education all at once. Being able to combine science with human connection is what excites me most about this path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"fa2dea33-f46c-49cb-a2b0-f6f3d89ff7a3\"}":{"__typename":"DeepDives","uuid":"fa2dea33-f46c-49cb-a2b0-f6f3d89ff7a3","content":"\u003cp\u003eIn my spare time, I love baking (there’s usually something sweet happening in my kitchen), exploring new restaurants, and sketching when I need a creative reset. I’m also a big fan of TV shows and movies, from comfort rewatches to new series I get way too invested in.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese hobbies keep me grounded and remind me that life isn’t just about checking boxes. I really believe that doing things you enjoy helps you show up better in school and in life and I try to pass that mindset on to students too.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"6fe20704-9d1a-4b5d-9a94-c92dc2aa165f\"}":{"__typename":"School","uuid":"6fe20704-9d1a-4b5d-9a94-c92dc2aa165f","name":"Indian Language School","city":"Lagos","type":"HIGH","state":"Lagos","country":"Nigeria","zip":"100252"},"Education:{\"uuid\":\"013daa06-259b-4802-8a03-488b46cbe1a9\"}":{"__typename":"Education","uuid":"013daa06-259b-4802-8a03-488b46cbe1a9","school":{"__ref":"School:{\"uuid\":\"6fe20704-9d1a-4b5d-9a94-c92dc2aa165f\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"4b12c852-2c92-461f-95d8-06850fe6ff7c\"}":{"__typename":"Education","uuid":"4b12c852-2c92-461f-95d8-06850fe6ff7c","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Microbiology ","degree":null},"MentorPublicProfile:{\"uuid\":\"b27dd679-f831-454e-afd7-ee8385b25b69\"}":{"__typename":"MentorPublicProfile","uuid":"b27dd679-f831-454e-afd7-ee8385b25b69","displayName":"Jyotsna H.","slug":"jyotsna-hira","biography":"\u003cp\u003eHi! I’m Jyotsna: a future physician, current medical assistant, and someone who genuinely loves mentoring students through moments that feel overwhelming, confusing, or just \u003cem\u003ea lot\u003c/em\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI studied Microbiology and Immunology at UCLA and  a master’s of science in Physiology. While science and medicine are a big part of my life, what I care about just as much is how people \u003cem\u003elearn\u003c/em\u003e and how they build confidence along the way. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver the years, I’ve worked with students as a tutor and mentor across different ages and learning styles, and I’ve seen how often capable, motivated students feel stuck because they’re overwhelmed, disorganized, or unsure where to start.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat’s where I come in.\u003c/p\u003e\u003cp\u003eAs a mentor, I love helping students break big goals into manageable steps, build routines that work for them, and create systems for accountability that feel supportive rather than stressful. I work especially well with students who struggle with executive functioning, time management, motivation, or self-doubt. My approach is patient, honest, and encouraging, I've always believed that progress doesn’t require perfection, just the right support.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m deeply involved in community health and service. I co-founded a heart health initiative focused on blood pressure screenings and education in underserved neighborhoods, and I’ve worked in mobile clinics serving patients with limited access to healthcare. These experiences shaped how I mentor: with empathy, curiosity, and a belief that growth happens best when people feel safe asking questions and making mistakes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not working or studying, you’ll usually find me baking something sweet, exploring new restaurants around the city, or sketching when I need a mental reset. I also love TV shows and movies; from comforting rewatches to thoughtful series and everything in between. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI try to bring that same balance into mentorship. I believe students do their best when there’s room for structure \u003cem\u003eand\u003c/em\u003e creativity, discipline \u003cem\u003eand\u003c/em\u003e joy. If you’re looking for a mentor who will meet you where you are, help you feel more organized and confident, and remind you that you’re doing better than you think and to push you to do better every step of the way. I’d love to work with you. We’ll figure things out together, one step at a time.\u003c/p\u003e","teachingVideoPlaybackId":"OznuVaoGliu8LmxIZFS2iD3HQl100DCYEOuP6FP5mDVo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I’m most proud of is co-founding a community heart health initiative focused on blood pressure education and screenings in an underserved neighborhood. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWe didn’t begin with big funding or polished systems. Instead, we began by listening. We met community members where they were, learned about their daily barriers to healthcare, and focused on making preventive care feel approachable rather than intimidating. Over time, we were able to offer blood pressure screenings, education on lifestyle changes, and referrals when needed. Seeing people return week after week, remembering us, asking questions, and bringing friends or family showed me that meaningful impact isn’t always loud or flashy. Often, it’s built quietly through relationships.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat makes this experience especially meaningful to me is how much it shaped the way I think about service and leadership. I learned how to take initiative, adapt when things didn’t go as planned, and work with others toward a shared goal. I also learned that leadership doesn’t mean having all the answers, it means being willing to learn alongside others and stay committed even when progress is slow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis experience continues to guide how I approach both medicine and mentorship. Whether I’m supporting a student or working with a patient, I carry forward the same belief: real change happens when people feel respected, supported, and seen.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"deeb6ae5-bd97-4f6f-8226-b83e32e96c12\"}"},{"__ref":"Favorites:{\"uuid\":\"55bc51b7-af1a-4f5a-a828-a8204fea23aa\"}"},{"__ref":"Favorites:{\"uuid\":\"88d33d48-2a66-4df5-bc09-f87542e2e513\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"a28fae02-0294-41ee-9434-489f9be63a1d\"}"}],"major":"Microbiology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"15dfe849-a18d-460e-ab4c-2203bc2f88eb\"}"},{"__ref":"DeepDives:{\"uuid\":\"07921d60-4f00-47fb-93d6-b4cad848ebb5\"}"},{"__ref":"DeepDives:{\"uuid\":\"d4bbd31e-0d45-4ef8-a821-b5277c2f3b29\"}"},{"__ref":"DeepDives:{\"uuid\":\"fa2dea33-f46c-49cb-a2b0-f6f3d89ff7a3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8b8581e2-3282-4376-b444-ef0ed582ac81/-/preview/-/format/jpg/","https://ucarecdn.com/d7d1ea37-9a07-413f-99fd-0d0bcc571041/-/preview/-/format/jpg/","https://ucarecdn.com/90e611ad-4592-4482-a4fe-e2e6a78ed719/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"013daa06-259b-4802-8a03-488b46cbe1a9\"}"},{"__ref":"Education:{\"uuid\":\"4b12c852-2c92-461f-95d8-06850fe6ff7c\"}"}],"hiredAt":"2025-12-21T22:19:52.838Z","topics":["K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","6-8 Grade Science","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Creative Writing","Video / Photography","Fashion / Cosmetics","Medicine / Health","STEM Project","Public Speaking","Debate"],"communityBadges":["https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jyotsna-hira\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b27dd679-f831-454e-afd7-ee8385b25b69\"}"}}},"_sentryTraceData":"010301f6d15c4ab9896d659b738b15a3-9f3977d7c76be7fb-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=010301f6d15c4ab9896d659b738b15a3,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jyotsna-hira"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z
