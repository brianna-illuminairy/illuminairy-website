xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"722ea48f-8162-406c-a118-434bab71d356\"}":{"__typename":"Favorites","uuid":"722ea48f-8162-406c-a118-434bab71d356","photoUrl":"https://ucarecdn.com/2ba16322-1534-4e8c-b1ed-8ca7c6e3b5d3/","title":"Noah Kahan","type":"ARTIST"},"Favorites:{\"uuid\":\"1119b0d5-e705-45b8-89f4-0583dcc5bda7\"}":{"__typename":"Favorites","uuid":"1119b0d5-e705-45b8-89f4-0583dcc5bda7","photoUrl":"https://ucarecdn.com/2d1740eb-222d-4bc6-9b73-824ab0714190/","title":"New York","type":"CITY"},"Favorites:{\"uuid\":\"bff79d00-dec4-4bf4-82ed-a238e017461c\"}":{"__typename":"Favorites","uuid":"bff79d00-dec4-4bf4-82ed-a238e017461c","photoUrl":"https://ucarecdn.com/028d1ad2-8351-45a6-b06f-0aa9191f701f/","title":"Speak Now - Taylor Swift","type":"ALBUM"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1f186e84-c997-471a-9bcf-ad0a05f6d52d\"}":{"__typename":"DeepDives","uuid":"1f186e84-c997-471a-9bcf-ad0a05f6d52d","content":"\u003cp\u003eAt Yale, I chose to major in economics because it combined my love for math and global affairs. I knew I wanted a course of study that was both quantitative and qualitative and was able to do so through economics. I also chose to pursue a certificate in Energy Studies because I loved environmental science in high school. The certificate has been a great opportunity to learn both about the physical science and policy achievements made in order to better understand how we use energy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"44b3ed18-81d3-4567-baee-b8c6b5d8eaa9\"}":{"__typename":"DeepDives","uuid":"44b3ed18-81d3-4567-baee-b8c6b5d8eaa9","content":"\u003cp\u003eIn my spare time, I love to go to concerts! I grew up playing many different instruments always loved learning to play new ones. My grandfather had started a music school and he was my teacher for twelve years. Now, I love going to concerts of all different genres whether with my little sisters, friends from high school, or coworkers. My favorite concert I have ever been to was Coldplay!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"62125fc8-bdbb-42d5-99f9-63b611f8f1c4\"}":{"__typename":"DeepDives","uuid":"62125fc8-bdbb-42d5-99f9-63b611f8f1c4","content":"\u003cp\u003eIn my family, I am the oldest of three girls. I loved giving them advice and had so much fun teaching them to do new things, whether it was sports or school related. I felt like their friend but also their teacher often. I wish that I had had an older sibling or mentor to ask questions to when I was younger because often times I was too intimidated to ask my teachers or the adults around me. I think mentorship is super important because it's so important to learn about your favorite topics from other like-minded students who share your passions and interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"fc2b9be4-9fcb-4514-9fe3-e083b1cf7cb5\"}":{"__typename":"Education","uuid":"fc2b9be4-9fcb-4514-9fe3-e083b1cf7cb5","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":"B.A."},"School:{\"uuid\":\"68aee16a-c3db-435b-aacf-d8b24813ac21\"}":{"__typename":"School","uuid":"68aee16a-c3db-435b-aacf-d8b24813ac21","name":"Hopkins School","city":"New Haven","type":"HIGH","state":"CT","country":"United States","zip":"06437"},"Education:{\"uuid\":\"3ebb9ea1-f0c5-4ce5-ab1b-0ef3d242000f\"}":{"__typename":"Education","uuid":"3ebb9ea1-f0c5-4ce5-ab1b-0ef3d242000f","school":{"__ref":"School:{\"uuid\":\"68aee16a-c3db-435b-aacf-d8b24813ac21\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"67842435-48c6-47ed-9740-4ef06a856c55\"}":{"__typename":"MentorPublicProfile","uuid":"67842435-48c6-47ed-9740-4ef06a856c55","displayName":"Ella Z.","slug":"ella-zuse","biography":"\u003cp\u003eElla is a junior at Yale University. She is pursuing a degree in Economics and certificate in Energy Studies and Statistics and Data Science. Ella is also very passionate about history and film and loves conducting research in those two areas! She has written papers about the origins of movie theaters, the media’s portrayal of Silicon Valley, and comic books in the media. Ella is originally from Connecticut and graduated cum laude from the Hopkins School in 2021. She took a wide variety of AP subjects including AP U.S. History, A.P. Human Geography, and A.P Biology. In high school she played basketball, soccer, and lacrosse. At Hopkins she also served as the Student Council President and volunteered for the Connecticut Food Bank. Outside of school, she also worked as a Save the Children Teen Ambassador and volunteered for local State Senators to pursue her love of international relations and politics. She is also very passionate about sustainability and has worked on projects involving sustainable buildings in Connecticut. At Yale, she is on the sailing team, is a member of Smart Woman Securities, an all-female finance club, and is part of the Dwight Hall Socially Responsible Investment Fund, the oldest and largest ESG investment club in the country. This past summer she worked for a distressed debt hedge fund in New York and participated in the Girls Who Invest Program. Ella has been to over 10 concerts in the past year! She is very excited to share her curiosity and passions with members of the Curious Cardinals community!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"722ea48f-8162-406c-a118-434bab71d356\"}"},{"__ref":"Favorites:{\"uuid\":\"1119b0d5-e705-45b8-89f4-0583dcc5bda7\"}"},{"__ref":"Favorites:{\"uuid\":\"bff79d00-dec4-4bf4-82ed-a238e017461c\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1f186e84-c997-471a-9bcf-ad0a05f6d52d\"}"},{"__ref":"DeepDives:{\"uuid\":\"44b3ed18-81d3-4567-baee-b8c6b5d8eaa9\"}"},{"__ref":"DeepDives:{\"uuid\":\"62125fc8-bdbb-42d5-99f9-63b611f8f1c4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/611ec47e-ed1c-45bc-9410-d44bbb629e1e/-/crop/653x652/0,0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fc2b9be4-9fcb-4514-9fe3-e083b1cf7cb5\"}"},{"__ref":"Education:{\"uuid\":\"3ebb9ea1-f0c5-4ce5-ab1b-0ef3d242000f\"}"}],"hiredAt":"2022-08-16T20:37:06.000Z","topics":["Geometry","Sustainability","Law / Government / Policy","Pre-Algebra","STEM Project","Biology","Precalculus / Trigonometry","Public Speaking","Spanish","6-8 Grade Science","Geography","Literature","Reading","Writing","K-5 Grade Math","Finance / Investin
