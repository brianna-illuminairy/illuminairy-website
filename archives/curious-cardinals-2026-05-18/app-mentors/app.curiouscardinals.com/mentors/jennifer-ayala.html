xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"445582c4-90e3-478a-8bc8-7db271b51a0b\"}":{"__typename":"Favorites","uuid":"445582c4-90e3-478a-8bc8-7db271b51a0b","photoUrl":"https://ucarecdn.com/ebb8ecd3-b17c-4a2c-bbbe-716dbd7d08b1/","title":"Simone Biles ","type":"ATHLETE"},"Favorites:{\"uuid\":\"bf9b922c-72ef-470c-8d18-e4123ce85e22\"}":{"__typename":"Favorites","uuid":"bf9b922c-72ef-470c-8d18-e4123ce85e22","photoUrl":"https://ucarecdn.com/1c9dee50-018c-4044-8a9c-46673637e42d/","title":"DC","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b0eb3556-e3d8-4460-bc06-d23ac5224115\"}":{"__typename":"DeepDives","uuid":"b0eb3556-e3d8-4460-bc06-d23ac5224115","content":"\u003cp\u003eThe advice I would give my high school self would be not to rush the process. Every new experience, good or bad, embrace it and learn from it. It's okay if it takes you a little longer to understand something; everyone has their own pace.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"610d7248-e804-49c5-a95f-4b9deb0e15cd\"}":{"__typename":"DeepDives","uuid":"610d7248-e804-49c5-a95f-4b9deb0e15cd","content":"\u003cp\u003eIn high school, I was very independent, social, and enjoyed being academically challenged. I was very involved with my school community and still am. I helped organize many events / fundraisers. I was very close to my teachers and school staff, who all helped me get to where I am today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a8616f8b-8259-48cf-9729-f07d6838ea77\"}":{"__typename":"DeepDives","uuid":"a8616f8b-8259-48cf-9729-f07d6838ea77","content":"\u003cp\u003eIn my spare time, I enjoy going on walks, watching movies, and trying new restaurants! I love trying new activities that allow me to be creative and get out of my comfort zone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"dc6b50fb-8a44-4e1f-9f31-6b49b0b99c58\"}":{"__typename":"DeepDives","uuid":"dc6b50fb-8a44-4e1f-9f31-6b49b0b99c58","content":"\u003cp\u003eMentorship goes beyond teaching; it's a relationship in which you and your mentee share interests and unlock possibilities that once may have gone unseen. From personal experience, having a mentor helped me learn more about who I am and the skills I excel in. I hope to give the same experience and help my mentees be the change they want to see!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"9645c73c-e15f-4981-a28d-8aeadb3f0e87\"}":{"__typename":"School","uuid":"9645c73c-e15f-4981-a28d-8aeadb3f0e87","name":"Columbia Heights Educational Campus","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20010"},"Education:{\"uuid\":\"c43ea60c-db67-47c2-824c-c194e80e1fe9\"}":{"__typename":"Education","uuid":"c43ea60c-db67-47c2-824c-c194e80e1fe9","school":{"__ref":"School:{\"uuid\":\"9645c73c-e15f-4981-a28d-8aeadb3f0e87\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"9b1f61f2-b591-4f9f-95c9-c2621f5adf25\"}":{"__typename":"Education","uuid":"9b1f61f2-b591-4f9f-95c9-c2621f5adf25","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"ca00085d-7598-46d7-b156-5895309f6dfb\"}":{"__typename":"MentorPublicProfile","uuid":"ca00085d-7598-46d7-b156-5895309f6dfb","displayName":"Jennifer A.","slug":"jennifer-ayala","biography":"\u003cp\u003eHi! I'm Jennifer, a junior at Cornell University majoring in Cognitive Science, with minors in Psychology and East Asian Studies. I help students gain the skills and confidence to express themselves through writing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was very interested in writing, math, and language learning. I had many interests, but didn't know how to do them all. At Cornell, I was able to:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearched the effects of sleep deprivation on memory\u003c/strong\u003e (applied existing research into self-interested topics) and presented to professors.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePursued my language interest\u003c/strong\u003e by learning Mandarin Chinese, participating in a global immersion program in China, and studying abroad in Taiwan.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003eI believe having many interests is something worth exploring. While it can feel overwhelming at times, I help students discover fun, engaging ways to connect their passions and make learning more meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI help k-12 students through:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege Preparation\u003c/strong\u003e (personal statements, supplemental essays and scholarship applications)  \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOrganizing Events\u003c/strong\u003e (planning fundraisers and cultural exchange events) \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch Mentorship\u003c/strong\u003e (developing research skills, and discovering meaningful, self-driven topics)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePublic Speaking\u003c/strong\u003e (building confidence and expressing ideas clearly)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI was a summer intern at a high school, where I tutored students in a range of writing assignments. I also planned and coordinated fundraisers and events for school clubs and departments, which enhanced my leadership and organizational skills. In addition, I served as a translator for various events, strengthening my communication skills. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might include:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eGenerating or refining ideas for essay, personal statements, presentations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePlan and organize writing through personalize roadmap\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStrengthen writing through revisions, feedback and editing\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDevelop confidence in communicating ideas both in writing and public speaking \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eFun Facts\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOutside of class, I love going on walks, trying new foods, solving puzzles, doing DIY projects, and watching movies. I also really enjoy watching \"Guess the Language\" videos because I love learning about different languages and the many dialects people use to communicate with others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'd love to help you channel the writer in you by guiding you to develop your ideas, strengthen your voice, and gain confidence in expressing yourself both on the page and verbally.\u003c/p\u003e","teachingVideoPlaybackId":"bvb016JiW027ex7kCUzWHGvEhZoeNpsvAd2LavIPKY1tk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI earned the community service award from my high school. I was very involved  with my community in which we positively impacted many families.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"445582c4-90e3-478a-8bc8-7db271b51a0b\"}"},{"__ref":"Favorites:{\"uuid\":\"bf9b922c-72ef-470c-8d18-e4123ce85e22\"}"}],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b0eb3556-e3d8-4460-bc06-d23ac5224115\"}"},{"__ref":"DeepDives:{\"uuid\":\"610d7248-e804-49c5-a95f-4b9deb0e15cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"a8616f8b-8259-48cf-9729-f07d6838ea77\"}"},{"__ref":"DeepDives:{\"uuid\":\"dc6b50fb-8a44-4e1f-9f31-6b49b0b99c58\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2bf69523-d073-4570-852c-c20fd1ee7240/-/preview/-/f
