xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a8fc735e-ec8c-4f97-8e90-acfadd867819\"}":{"__typename":"Favorites","uuid":"a8fc735e-ec8c-4f97-8e90-acfadd867819","photoUrl":"https://ucarecdn.com/8c69c59f-6880-468b-91af-01250e0884d8/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"e8eeef5e-ad98-44ad-8cc1-5e0bebebf608\"}":{"__typename":"Favorites","uuid":"e8eeef5e-ad98-44ad-8cc1-5e0bebebf608","photoUrl":"https://ucarecdn.com/7f1831d3-76eb-4db2-a0fb-f414c3afae35/","title":"The Art of Living by Epictetus","type":"BOOK"},"Favorites:{\"uuid\":\"86b2dede-d547-45ef-9660-361b5230ea9a\"}":{"__typename":"Favorites","uuid":"86b2dede-d547-45ef-9660-361b5230ea9a","photoUrl":"https://ucarecdn.com/d2f4f615-4d68-42d1-b738-c83c919aa695/","title":"Swimming","type":"SPORT"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"51ccdc3b-c926-4f8a-9ada-870becb1b0c6\"}":{"__typename":"DeepDives","uuid":"51ccdc3b-c926-4f8a-9ada-870becb1b0c6","content":null,"videoPlaybackId":"XTK2UqwqQSbaufo8k02E2T02K5duVu8LoIQVZhPOfrjUs","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"552071b7-04a6-439d-b024-f1901ad47d8c\"}":{"__typename":"DeepDives","uuid":"552071b7-04a6-439d-b024-f1901ad47d8c","content":null,"videoPlaybackId":"sFrSge00KWex0001N19MueRJ2mIyVEQ01FpqcH9N15F01qrQ","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"d81ecd89-2134-41f5-83fa-025f8d708a63\"}":{"__typename":"DeepDives","uuid":"d81ecd89-2134-41f5-83fa-025f8d708a63","content":null,"videoPlaybackId":"e1021q02BYLLoqm01M02PGRiIz2pc02NqXDagbrO4SHPb6N4","question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"b07bad8e-67d7-40e0-bfce-0a1371638e06\"}":{"__typename":"DeepDives","uuid":"b07bad8e-67d7-40e0-bfce-0a1371638e06","content":"\u003cp\u003eI’m currently learning Blender to create my own short film. I was inspired by the film \u003cem\u003eFlow\u003c/em\u003e, which was created using Blender, and it motivated me to bring my own story ideas to life through 3D animation. This project has become a creative outlet where I’m learning the entire process—from storytelling and visual design to animation and technical execution.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"6a3858a9-f89f-4e9d-81c2-e9c9421997b7\"}":{"__typename":"School","uuid":"6a3858a9-f89f-4e9d-81c2-e9c9421997b7","name":"Eleanor Roosevelt High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10021"},"Education:{\"uuid\":\"1623a39b-3d24-4b70-90e8-b9072188fe01\"}":{"__typename":"Education","uuid":"1623a39b-3d24-4b70-90e8-b9072188fe01","school":{"__ref":"School:{\"uuid\":\"6a3858a9-f89f-4e9d-81c2-e9c9421997b7\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ab150efa-5bad-4822-8ccd-e596d8fc8d87\"}":{"__typename":"School","uuid":"ab150efa-5bad-4822-8ccd-e596d8fc8d87","name":"Stony Brook University","city":"Stony Brook","type":"COLLEGE","state":"New York","country":"United States","zip":"11794"},"Education:{\"uuid\":\"8b1fe1cc-44e2-462e-a806-28f49fe84c92\"}":{"__typename":"Education","uuid":"8b1fe1cc-44e2-462e-a806-28f49fe84c92","school":{"__ref":"School:{\"uuid\":\"ab150efa-5bad-4822-8ccd-e596d8fc8d87\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"563cda90-386b-4b5f-93fd-4cc91e1c1286\"}":{"__typename":"MentorPublicProfile","uuid":"563cda90-386b-4b5f-93fd-4cc91e1c1286","displayName":"Grace W.","slug":"grace-wang","biography":"\u003cp\u003eHi! I’m Grace, a \u003cstrong\u003esenior studying Computer Science at Stony Brook University\u003c/strong\u003e, and\u0026nbsp;\u003cstrong\u003eI’m passionate about helping students turn curiosity into confidence, and ideas into something real\u003c/strong\u003e. I was born and raised in New York City and love reading, writing, swimming, photography, traveling, and creative storytelling—especially through stop-motion animation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m a builder and creative problem solver by nature. Post-grad, I’ll be joining \u003cstrong\u003eGoogle as a Software Engineer after interning there last summer! \u003c/strong\u003eI’ve also worked across startups, research labs, and education-focused environments, which has given me a broad perspective on how technology is built, taught, and applied in the real world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt the same time, I care deeply about mentorship and education. I’ve been tutoring and mentoring students consistently since high school, and much of my work today sits at the intersection of technical learning, confidence-building, and long-term growth.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI especially enjoy working with students who have great ideas but need structure, reassurance, or guidance on where to begin. I believe it’s never too late to start—and that \u003cstrong\u003ereal growth comes from learning by doing.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eMy Journey\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eMy journey into computer science was not a traditional one. I attended a humanities-and-arts-focused high school in New York City and didn’t take my first computer science class until my senior year. While many of my peers in tech seemed to have started coding years earlier, I quickly learned that curiosity, persistence, and resilience matter far more than when you begin.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOnce I discovered computer science, I became motivated to explore it beyond the classroom. In college, I intentionally sought out opportunities to challenge myself, learn from others, and build real-world skills—academically, professionally, and creatively. Through trial and error, mentorship, and hands-on experiences, I learned not only technical skills, but also how to manage time, balance commitments, and grow through challenges.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlongside STEM, I’ve always been drawn to the arts. While studying abroad in Singapore at Nanyang Technological University, I took my first-ever stop-motion animation class with no prior animation background. Over a 13-week semester, I wrote and co-directed a short film with a team of animation students, learning the entire filmmaking process from scratch. That experience reinforced a belief I share with students often: you don’t need to be “ready” to start—you learn by doing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eWhy I’m Qualified to Mentor\u003c/strong\u003e\u003c/h2\u003e\u003ch2\u003eDuring College, I Have:\u003c/h2\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eInterned as a Software Engineer at Google and worked across startups, research labs, and large tech environments\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as a Teaching Assistant for Data Structures and Algorithms, leading weekly recitations and holding office hours\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked as a one-on-one tutor teaching object-oriented programming and core computer science concepts\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMentored first-generation college students for three years, supporting academic growth and personal transition\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLed and organized hackathons and served on executive boards for organizations such as the Stony Brook Computing Society and SBUHacks\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eWho I Work With\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI work best with students who are curious, ambitious, creative, or unsure where to begin—and who want support turning ideas into action. My role is to be your guide and collaborator in turning that interest into tangible skill.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Specialty: Passion Projects\u003c/strong\u003e\u003cbr\u003eMy specialty is helping students bridge the gap between \"I have an idea\" and \"I made something.\" I demystify the creative process, whether the project lives on a screen, in a video, or in an app.\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTogether, we shape interests in film, art, storytelling, or tech into a concrete plan. Want to make a short film, design a simple app, or create a digital portfolio? We’ll build a roadmap.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI believe in building to learn. We’ll create quick prototypes—like a storyboard for an animation, a mockup for an app, or a short video edit—to make ideas tangible and learn skills in context.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI help break down intimidating projects into small, manageable steps. This builds momentum and teaches how to tackle complex ideas—a useful skill in any subject.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAcademic Mentorship: Building a Strong Base\u003c/strong\u003e\u003cbr\u003eI provide targeted support in:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eIntroductory Computer Science \u0026amp; Digital Literacy: Building a strong, intuitive foundation for how technology works, perfect for first-time coders or students in AP CSP courses.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eProject Management for Students: Developing organization, time management, and planning skills through the lens of a fun project.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOvercoming \"Stuckness\": Strategies for starting projects, iterating on ideas, and moving past the perfectionism that often stalls creative work.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eWhat to Expect When We Meet\u003c/strong\u003e\u003cbr\u003eThink of our sessions as a collaborative workshop or studio time. They are:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eHands-On \u0026amp; Active: We might be sketching a storyboard, planning a video shoot, wireframing an app idea, or debugging the first lines of code for a project.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStudent-Led \u0026amp; Adaptable: We work on what you are excited about each week. I provide structure and expertise, but the direction is yours.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFocused on Progress: Every session ends with a clear, achievable next step—a small win that builds confidence and keeps the project moving forward.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eThe Bottom Line\u003c/strong\u003e\u003cbr\u003eI believe the best way to learn is by doing. My goal is to equip you with not just knowledge, but the methodological toolkit and the confidence to build what you imagine.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e","teachingVideoPlaybackId":"xsd8aFpDGjUPV00gYmo00E7Eb801J02KBQeYL5hZi9CfxaI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a8fc735e-ec8c-4f97-8e90-acfadd867819\"}"},{"__ref":"Favorites:{\"uuid\":\"e8eeef5e-ad98-44ad-8cc1-5e0bebebf608\"}"},{"__ref":"Favorites:{\"uuid\":\"86b2dede-d547-45ef-9660-361b5230ea9a\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"51ccdc3b-c926-4f8a-9ada-870becb1b0c6\"}"},{"__ref":"DeepDives:{\"uuid\":\"552071b7-04a6-439d-b024-f1901ad47d8c\"}"},{"__ref":"DeepDives:{\"uuid\":\"d81ecd89-2134-41f5-83fa-025f8d708a63\"}"},{"__ref":"DeepDives:{\"uuid\":\"b07bad8e-67d7-40e0-bfce-0a1371638e06\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/96958be0-ecff-41e6-b3c4-8ef7296e0618/-/preview/-/format/jpg/","https://ucarecdn.com/bed414dd-17e9-4faf-8514-1e892fa9ece0/-/preview/-/format/jpg/","https://ucarecdn.com/db681026-3233-4a99-a17e-eb7cf097763e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1623a39b-3d24-4b70-90e8-b9072188fe01\"}"},{"__ref":"Education:{\"uuid\":\"8b1fe1cc-44e2-462e-a806-28f49fe84c92\"}"}],"hiredAt":"2026-01-22T04:57:41.356Z","topics":["Video / Photography","Visual Arts / Graphic Design","Film / Theater","Coding / Programming","STEM Project","Machine Learnin
