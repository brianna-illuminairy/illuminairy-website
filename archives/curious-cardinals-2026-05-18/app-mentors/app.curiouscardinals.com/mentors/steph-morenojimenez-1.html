xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d5f7b24d-2526-4da8-bcc0-8ab73e572684\"}":{"__typename":"Favorites","uuid":"d5f7b24d-2526-4da8-bcc0-8ab73e572684","photoUrl":"https://ucarecdn.com/925d8b45-771b-4848-ae2f-c8200cceb18c/","title":"Jayson Tatum","type":"ATHLETE"},"Favorites:{\"uuid\":\"5ddf0a4f-9373-4bff-84ca-5f89c008edad\"}":{"__typename":"Favorites","uuid":"5ddf0a4f-9373-4bff-84ca-5f89c008edad","photoUrl":"https://ucarecdn.com/1b07816a-cdc8-4165-8ed8-e71a7d11a5f6/","title":"Chappell Roan","type":"ARTIST"},"Favorites:{\"uuid\":\"29f1e7f7-ecfb-435a-93d1-070cc7636496\"}":{"__typename":"Favorites","uuid":"29f1e7f7-ecfb-435a-93d1-070cc7636496","photoUrl":"https://ucarecdn.com/fc477b39-2a5a-4e1e-a138-643d0a9681d1/","title":"channel ORANGE","type":"ALBUM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"07c931bd-0e28-4bca-8a64-b0f5f2b1c6f7\"}":{"__typename":"DeepDives","uuid":"07c931bd-0e28-4bca-8a64-b0f5f2b1c6f7","content":"\u003cp\u003eI was a very shy kid in elementary school and found it very difficult to come out of my shell around other kids my age and I really struggled with this until I met my first mentor Coach Dawnn. Everyday at recess she would come and talk to me when I was alone and encouraged me to try new things like dance which was something that seemed impossible before meeting her. Without her I would not be the person I am today and I'm forever grateful for the kindness she showed me and a consistent goal of mine is to provide to others even a slimmer of what she did for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8ca96c48-ce77-4f14-ac54-91e41984e00d\"}":{"__typename":"DeepDives","uuid":"8ca96c48-ce77-4f14-ac54-91e41984e00d","content":"\u003cp\u003eI would tell myself to always focus on what I'm passionate about and to avoid distracting myself with things other people are telling me I should be doing instead. I feel as though students are often doing things simply to appease a future college admissions officer, when the truth is you would really impress that admissions officer if you simply stuck to what you love and care about. When you care deeply about something it shows in your work and people can feel the energy you bring. I remember in high school I would constantly write poetry but never show it to anyone because I didn't think it was impressive enough, but anything you do is good enough as long as you're doing it with care!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8760d5f5-6c7b-4050-953d-5d6919bb989a\"}":{"__typename":"DeepDives","uuid":"8760d5f5-6c7b-4050-953d-5d6919bb989a","content":"\u003cp\u003eIn High School I worked as a Teaching Assistant for 4th and 5th grade science classes for a summer education program. It was a program I was in when I was a kid and it felt really nice to be able to come back and help kids who were in the exact same position I was not very long ago. It taught me responsibility from a young age and made me aware of how my actions impact younger generations and it is something I hold close to my heart still today/\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"646253fb-fb8b-4449-9424-602f3cc4986e\"}":{"__typename":"DeepDives","uuid":"646253fb-fb8b-4449-9424-602f3cc4986e","content":"\u003cp\u003eMy dream job is to be the superintendent of a school district! I haven't decided on the district yet, but education is something I truly have a passion for and want to improve upon for generations to come. Teaching is an absolute joy of mine, but I often feel as though administratively efforts are lackluster to properly support teachers and other faculty and I want to be the one to fix that!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"41732d09-1945-4a55-a361-961520cd3867\"}":{"__typename":"School","uuid":"41732d09-1945-4a55-a361-961520cd3867","name":"Brimmer and May","city":"Newton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02467"},"Education:{\"uuid\":\"8ef2394a-2598-4969-ab6b-e758a3621734\"}":{"__typename":"Education","uuid":"8ef2394a-2598-4969-ab6b-e758a3621734","school":{"__ref":"School:{\"uuid\":\"41732d09-1945-4a55-a361-961520cd3867\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"7fa9c072-c243-43ef-bb41-246a322ab1da\"}":{"__typename":"Education","uuid":"7fa9c072-c243-43ef-bb41-246a322ab1da","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"3e72e991-6ad0-45ba-84d2-f2605b7c9d09\"}":{"__typename":"MentorPublicProfile","uuid":"3e72e991-6ad0-45ba-84d2-f2605b7c9d09","displayName":"Steph M.","slug":"steph-morenojimenez-1","biography":"\u003cp\u003eAs a recent Harvard graduate with a degree in Sociology and a secondary in Government, I’ve been passionate about education for nearly a decade. My journey in education began at 15, when I stepped into the role of a teaching assistant for a 6th-grade science class in a summer program. From that moment, I was captivated by the joy of teaching and guiding students, and it’s a passion that has only grown stronger with time.\u003c/p\u003e\u003cp\u003eOver the years, I’ve worn many hats in the education field—from science teacher to SAT tutor, college admissions advisor, parent education and financial coach, and program director. This wide-ranging experience has given me the opportunity to work with students from diverse backgrounds and of all ages. I take pride in my ability to connect with each individual, finding what motivates them and helping them unlock their full potential. I know firsthand the impact that a dedicated mentor can have, and I’m committed to providing that same level of support and encouragement to my students.\u003c/p\u003e\u003cp\u003eMy academic mentors have been pillars in my own life, and I understand how crucial it is to create a learning environment where students feel both challenged and understood. I approach each session with the goal of fostering curiosity, encouraging resilience, and building confidence. Whether it’s crafting the perfect college essay, mastering a challenging subject, or providing guidance on future goals, I aim to make learning engaging and empowering.\u003c/p\u003e\u003cp\u003eBeyond my professional life, I’m an enthusiastic reader with a love for history, literature, and political theory, always eager to bring new perspectives into my teaching. I also have a cat named Rocky who keeps me grounded and reminds me to appreciate the small joys in life.\u003c/p\u003e\u003cp\u003eI’m thrilled to join the Curious Cardinals team, where I can continue my journey in education, empowering students to discover their passions and achieve their aspirations.\u003c/p\u003e","teachingVideoPlaybackId":"zFmvUkrMomigoYxOgwZlC1LCD201zcWtsFtUXBLkdcHk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI graduated this year from Harvard University!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d5f7b24d-2526-4da8-bcc0-8ab73e572684\"}"},{"__ref":"Favorites:{\"uuid\":\"5ddf0a4f-9373-4bff-84ca-5f89c008edad\"}"},{"__ref":"Favorites:{\"uuid\":\"29f1e7f7-ecfb-435a-93d1-070cc7636496\"}"}],"causesSupported":[],"major":"Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"07c931bd-0e28-4bca-8a64-b0f5f2b1c6f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"8ca96c48-ce77-4f14-ac54-91e41984e00d\"}"},{"__ref":"DeepDives:{\"uuid\":\"8760d5f5-6c7b-4050-953d-5d6919bb989a\"}"},{"__ref":"DeepDives:{\"uuid\":\"646253fb-fb8b-4449-9424-602f3cc4986e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d7b0971c-d693-4bde-a701-1487d177d64a/-/preview/-/format/jpg/","https://ucarecdn.com/17897917-20f7-4d30-b08b-59beab135100/-/preview/-/format/jpg/","https://ucarecdn.com/1cfb90ad-616f-4f92-9149-a8989097e498/-/preview/-/format/jpg/"],"pronouns":"THEY_THEM","gender":"NON_BINARY","education":[{"__ref":"Education:{\"uuid\":\"8ef2394a-2598-4969-ab6b-e758a3621734\"}"},{"__ref":"Education:{\"uuid\":\"7fa9c072-c243-43ef-bb41-246a322ab1da\"}"}],"hiredAt":"2024-11-22T20:58:23.444Z","topics":[],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":
