../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ef0a2588-920a-4c56-bd78-69701b928593\"}":{"__typename":"Favorites","uuid":"ef0a2588-920a-4c56-bd78-69701b928593","photoUrl":"https://ucarecdn.com/6cbf1a41-cc27-4ebc-bd19-001c0ef30c2f/","title":"Les Miserables by Victor Hugo","type":"BOOK"},"Favorites:{\"uuid\":\"9300401b-c5b7-4e36-a1c5-c427d5503123\"}":{"__typename":"Favorites","uuid":"9300401b-c5b7-4e36-a1c5-c427d5503123","photoUrl":"https://ucarecdn.com/0133f0f1-a59a-41a3-b3da-2cfa3aca0a41/","title":"Vincent Van Gogh","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"33171ad7-191e-4d69-887b-b7cb83a377ec\"}":{"__typename":"DeepDives","uuid":"33171ad7-191e-4d69-887b-b7cb83a377ec","content":"\u003cp\u003eI came into Princeton planning on majoring in Philosophy but my Sophomore Fall I took a class that would change my life. Muertos was about Pre-Columbian Mesoamerican Archaeology and combined looking at visual culture through an archaeological lens with anthropology and art history and I really saw the potential for Art History and Archaeology to be Socially-Engaged disciplines. Aside from that, it was also just a really cool class and I loved it so much that I switched my plans to Art \u0026amp; Archaeology and haven't looked back since!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"4d1ccff1-0486-4750-8815-5d235391b3fd\"}":{"__typename":"DeepDives","uuid":"4d1ccff1-0486-4750-8815-5d235391b3fd","content":"\u003cp\u003eIn high school I really had no idea what I wanted to do so I pretty much did everything. I ran for my school's track team, played trumpet and competed on a national level, and started an ultimate frisbee club at my school with some friends. I took about every class I found interesting and had a great time exploring my interests!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3eaceb9d-ff89-4cd8-ae88-d935c243d88c\"}":{"__typename":"DeepDives","uuid":"3eaceb9d-ff89-4cd8-ae88-d935c243d88c","content":"\u003cp\u003eIn high school, I spent every one of my summers playing at music institutes. I was a pretty serious musician (still am) and just wanted to have every musical experience possible. I loved playing with other people and meeting new musicians and something I found incredible about music institutes such as Interlochen was that I had an instant community of friends that were passionate about the same thing as me and wanted to take that passion to the next level. It's a super inspiring feeling!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"aa57dcf2-6d5a-4e7a-85b3-7b8c19ce74d8\"}":{"__typename":"DeepDives","uuid":"aa57dcf2-6d5a-4e7a-85b3-7b8c19ce74d8","content":"\u003cp\u003eMentorship matters to me because if I wasn't mentored on my own passions, I would not be who I am today. I was lucky enough to have a community of mentors that were dedicated to my success and helping me discover what success meant to me. I hope to be able to do the same for others and this is what drew me to Curious Cardinals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"5b35f5d8-8446-499f-bed2-387b51b2bd35\"}":{"__typename":"Education","uuid":"5b35f5d8-8446-499f-bed2-387b51b2bd35","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Archaeology/History of Art","degree":"A.B."},"School:{\"uuid\":\"829591e9-ca11-424b-bf8e-d05dc6d414b4\"}":{"__typename":"School","uuid":"829591e9-ca11-424b-bf8e-d05dc6d414b4","name":"Gulf Coast High School","city":"Naples","type":"HIGH","state":"Florida","country":"United States","zip":"34119"},"Education:{\"uuid\":\"8c645df8-8928-4086-8aa3-571c78ffbab0\"}":{"__typename":"Education","uuid":"8c645df8-8928-4086-8aa3-571c78ffbab0","school":{"__ref":"School:{\"uuid\":\"829591e9-ca11-424b-bf8e-d05dc6d414b4\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"71f1fc5e-0dfe-4f02-898a-fbdf399ac8b1\"}":{"__typename":"MentorPublicProfile","uuid":"71f1fc5e-0dfe-4f02-898a-fbdf399ac8b1","displayName":"Gabriel C.","slug":"gabriel-chalick","biography":"\u003cp\u003eI am a recent graduate from Princeton with a major Art History \u0026amp; Archaeology and a minor in Jazz Trumpet. I spent my last year playing in orchestras, jazz combos, and many different other musical groups while studying for a master's degree in jazz performance. I've worked as a journalist in Morocco, an archaeologist in Greece, and was lucky to get to play on orchestra tours to Greece and other Balkan states! I love to read, play soccer, discover new music, and study archaeology. I find it incredibly important to bring both my interests and mentees' interests to mentorships and I believe strongly in the power of learning through topics that students love! I have taught students how to play trumpet, how to improve writing skills through studying paleontology and mythology, and how to crush standardised tests such as the ACT and SAT. \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ef0a2588-920a-4c56-bd78-69701b928593\"}"},{"__ref":"Favorites:{\"uuid\":\"9300401b
