":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"41b974e8-301d-430e-bf45-1e872659816f\"}":{"__typename":"DeepDives","uuid":"41b974e8-301d-430e-bf45-1e872659816f","content":"\u003cp\u003eMentorship matters to me because I have had incredible mentors throughout my life who helped me better understand my passions and achieve my goals. I understand how valuable a mentor can be and I want to be that person for others, and help young learners in any way I can! \u003cbr\u003e\u003cbr\u003eSpecifically, I want to help young learners understand how to be better students, how to get organized, how to submit the best applications they can to internships and universities, how to balance work with other life responsibilities, and provide students the opportunity to fulfill passion projects they have been hoping to spend time on but have been unsure about how to get started.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"da3a49e8-0123-467b-bc4f-609a7cef9b82\"}":{"__typename":"Education","uuid":"da3a49e8-0123-467b-bc4f-609a7cef9b82","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Symbolic Systems","degree":"Bachelors of Science"},"School:{\"uuid\":\"211ac82c-93fa-45ce-a294-f454cae1965b\"}":{"__typename":"School","uuid":"211ac82c-93fa-45ce-a294-f454cae1965b","name":"Novato High School","city":"Novato","type":"HIGH","state":"California","country":"United States","zip":"94947"},"Education:{\"uuid\":\"9252c6bd-da8d-4d2b-b8c3-59e471355c49\"}":{"__typename":"Education","uuid":"9252c6bd-da8d-4d2b-b8c3-59e471355c49","school":{"__ref":"School:{\"uuid\":\"211ac82c-93fa-45ce-a294-f454cae1965b\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"442c5d93-6a5a-454a-a9a8-6bf49e980813\"}":{"__typename":"MentorPublicProfile","uuid":"442c5d93-6a5a-454a-a9a8-6bf49e980813","displayName":"Melina S.","slug":"melina-seligmantovar","biography":"\u003cp\u003eMelina is a senior at Stanford University studying Symbolic Systems with a concentration in Decision Making and Rationality, and a minor in Spanish. She is also a coterminal masters student in Management Science and Engineering. Melina’s major has provided her an interdisciplinary perspective, as it includes psychology, economics, computer science, statistics, philosophy, linguistics, and more! At Stanford, Melina is a research assistant for the Management Science and Engineering Department, examining the experiences of belonging for minorities in remote and hybrid work. She’s also a Vice President for Stanford’s premier consulting group, Stanford Consulting, which provides strategic services to businesses from Disney to Google. Melina has also developed an application for the App Store by conducting user interviews, market research, designing prototypes, coding, developing pitch decks, and testing with users. She is an avid musician, as she has been a violinist since kindergarten, she taught ukulele and singing, and she has participated in musical theatre since the third grade. She is now a singer, violinist, and Director of Outreach and Media for Stanford’s Mariachi band. As the daughter of an immigrant from Mexico City, Melina is passionate about immigration rights and has interned at the Immigration Institute of the Bay Area writing persuasive DACA declarations. She also volunteered for a detention center hotline. Previously, Melina interned at JPMorgan in the Innovation Development Program, at the consulting firm, Bain \u0026amp; Company in the Innovation and Design side, and will now work at Microsoft as a product manager intern. Outside of academics and music, Melina is excited about design, exploring nature, exercising, and attending concerts. Melina looks forward to working with students who are just as excited to become lifelong learners and develop their skills to achieve goals they’re passionate about!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bb352a1d-14dc-4ef3-8f42-e134fb2e3706\"}"},{"__ref":"DeepDives:{\"uuid\":\"41b974e8-301d-430e-bf45-1e872659816f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3089d46f-63e4-41fe-baae-fb72aadfee8c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"da3a49e8-0123-467b-bc4f-609a7cef9b82\"}"},{"__ref":"Education:{\"uuid\":\"9252c6bd-da8d-4d2b-b8c3-59e471355c49\"}"}],"hiredAt":"2022-08-30T06:36:23.000Z","topics":["Writing","Music","Visual Arts / Graphic Design","Spanish","Product Design","Algebra I","Public Speaking","Film / Theater"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"melina-seligmantovar\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"442c5d93-6a5a-454a-a9a8-6bf49e980813\"}"}}},"_sentryTraceData":"033291f1e3a44c7ea17f67ecf66b8c6e-8830b2d139fde731-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_
