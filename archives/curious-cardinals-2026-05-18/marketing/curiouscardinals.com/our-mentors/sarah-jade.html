 used by over 21,000 students worldwide!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"80d4edb7-c70e-4502-8bd7-f251ecfe55bf\"}":{"__typename":"DeepDives","uuid":"80d4edb7-c70e-4502-8bd7-f251ecfe55bf","content":"\u003cp\u003eI hope to start my own company, either within the food and beverages industry or within the intersection of technology and design. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"45d91fdf-0ada-4da9-9f79-5cb7bb712974\"}":{"__typename":"DeepDives","uuid":"45d91fdf-0ada-4da9-9f79-5cb7bb712974","content":"\u003cp\u003eMentorship matters so much to me because it serves as a pathway for students to learn and grow with the guidance of someone who has already been in that position. It creates a deep connection between student and mentor that can last a lifetime. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4889bfc6-337a-4b4c-8ad4-d9673fcf38f0\"}":{"__typename":"DeepDives","uuid":"4889bfc6-337a-4b4c-8ad4-d9673fcf38f0","content":"\u003cp\u003eI chose to major in CS + PD because I feel as though the projects and curriculum push me to be a strong problem-solver and better understand and empathize with my users.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4a15dd3c-651c-43b1-97a7-f1a6ff0fe7b2\"}":{"__typename":"Education","uuid":"4a15dd3c-651c-43b1-97a7-f1a6ff0fe7b2","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"PD/CS","degree":"Undergraduate"},"School:{\"uuid\":\"0bfda57b-830f-484c-84b4-2b5aedf9b4bf\"}":{"__typename":"School","uuid":"0bfda57b-830f-484c-84b4-2b5aedf9b4bf","name":"Dougherty Valley High School","city":"San Ramon","type":"HIGH","state":"California","country":"United States","zip":"94582"},"Education:{\"uuid\":\"fcee2d87-e365-4c3e-9f9a-ba6ca77b6a6e\"}":{"__typename":"Education","uuid":"fcee2d87-e365-4c3e-9f9a-ba6ca77b6a6e","school":{"__ref":"School:{\"uuid\":\"0bfda57b-830f-484c-84b4-2b5aedf9b4bf\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"9795f872-3361-45ae-aa87-91171e43807c\"}":{"__typename":"MentorPublicProfile","uuid":"9795f872-3361-45ae-aa87-91171e43807c","displayName":"Sarah J.","slug":"sarah-jade","biography":"\u003cp\u003eSarah is a fourth-year at Stanford University studying Computer Science and Product Design. She enjoys these majors because she feels as though the projects and curriculum push her to be a strong problem-solver and better understand and empathize with her users. Professionally, she's had experiences building websites (front and back-end), winning projects like the Kleiner Perkins Fellowship, Bessemer Fellowship, Stanford Treehacks, etc. She’s currently researching and building CodeInPlace - a project that teaches 10k students Stanfords’ intro-to-coding class. She will be working at full-time at McKinsey in San Fransisco. \u003cbr\u003e\u003cbr\u003eDuring high school, she prepared a visual arts portfolio that won multiple gold and silver scholastic awards and helped supplement her college application. She also built her own 501c3 non-profit, Project CreateAFuture, a sustainably-focused organization that received recognition at the regional/state level through the Violet Richardson Soroptimist Award. Over the course of 3 years, Sarah curated lines of sustainable clothing and sold them to fundraise over $2,500 for the Alturas Wildlife Sanctuary. Additionally, she formed an CreateAFuture ambassador network of over 500 students from 32 countries to help her teach their schools about living more sustainably. \u003cbr\u003e\u003cbr\u003eAlong with strong extracurriculars, she has a strong academic background - receiving high grades and test scores in AP Biology, AP Lang, AP Literature, AP Calc AB, AP Calc BC, AP Drawing, AP Studio Art 2-D, AP World History, AP Psychology, AP US Government, Honors Anatomy and Physiology, and Honors Chemistry. She can also tutor in standardized tests like the SAT, ACT, AP tests, or subject tests. \u003cbr\u003e\u003cbr\u003eSarah is passionate about educating women about design (UIUX, design consulting, graphic/visual design, fine arts), building out products on Web3, mechanical engineering, social impact and investing, and entrepreneurship. She feels as though these disciplines push her to think more creatively, and challenge the way the world works.\u003c/p\u003e","teachingVideoPlaybackId":"LAVIIpZnh1w8TWnLT101faTuAPPdOAN5WRSEMOPhPM1g","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"PD/CS","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"89d6deb8-09c2-4f18-8a0e-2039ba16b553\"}"},{"__ref":"DeepDives:{\"uuid\":\"80d4edb7-c70e-4502-8bd7-f251ecfe55bf\"}"},{"__ref":"DeepDives:{\"uuid\
