eater","degree":null},"School:{\"uuid\":\"048941f4-3d5f-45c8-aca8-5516937d283d\"}":{"__typename":"School","uuid":"048941f4-3d5f-45c8-aca8-5516937d283d","name":"Interlochen Arts Academy","city":"Interlochen","type":"HIGH","state":"Michigan","country":"United States","zip":"49643"},"Education:{\"uuid\":\"2ac0cb1e-4968-4fe9-875d-8e899ca4e09c\"}":{"__typename":"Education","uuid":"2ac0cb1e-4968-4fe9-875d-8e899ca4e09c","school":{"__ref":"School:{\"uuid\":\"048941f4-3d5f-45c8-aca8-5516937d283d\"}"},"startYear":"2017","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"37b75faf-c887-451e-84e3-4131fd40ffa7\"}":{"__typename":"MentorPublicProfile","uuid":"37b75faf-c887-451e-84e3-4131fd40ffa7","displayName":"Mia G.","slug":"mia-goodman","biography":"\u003cp\u003eMia grew up acting professionally in the D.C. theatre scene and has worked at regional theatres all over the country. She is a proud alumna of Interlochen Arts Academy, where she studied acting, directing, voice and dance. At The Boston Conservatory, Mia served as the President of the New Ground Theatre Company, a company dedicated to uplifting new student work. This past winter, she was one of sixteen college students selected for the LINK program, a nomination-based program for gifted college-age artists, in their TV/Film Track. She graduated summa cum laude with a B.F.A. in Musical Theater from The Boston Conservatory at Berklee and signed with Hudson Artists Agency for theatrical representation. \u003c/p\u003e\u003cp\u003eShe is incredibly passionate about teaching voice and acting to the next generation of artists. Mia teaches a variety of acting methods, from Linklater’s foundational vocal work, Stanislavski’s emotion memory technique, to Laban and Grotowski’s physical theater techniques. She also works as a vocal and audition coach for students who are interested in pursuing musical theater. When Mia is not performing or teaching, you can find her taking spin class with her friends, reading Emily Henry novels, or cooking pasta (with extra cheese). \u003c/p\u003e","teachingVideoPlaybackId":"DXoiK02G6M18WmrB7pvUa8VS81rva0127brdoOJPKpC2I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"B.F.A. Musical Theater","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"453217f6-7e6b-4a3b-b837-8d9a00926ced\"}"},{"__ref":"DeepDives:{\"uuid\":\"6f3a6d8a-2086-4d38-bd3a-29d31e8d8770\"}"},{"__ref":"DeepDives:{\"uuid\":\"c7ecf657-25ae-4641-a272-7e944e1b482a\"}"},{"__ref":"DeepDives:{\"uuid\":\"62a2d462-9ccb-4c35-8200-cc0955fe8735\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/86222dce-1097-46c3-93be-7cffdf6ee5ae/-/preview/-/format/jpg/","https://ucarecdn.com/143063af-5cf8-4864-9623-5c6ad8e213e8/-/preview/-/format/jpg/","https://ucarecdn.com/45b86665-1c29-468e-9349-03232f6ef510/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"72662c7c-0899-41b3-8e16-8dde55944b26\"}"},{"__ref":"Education:{\"uuid\":\"2ac0cb1e-4968-4fe9-875d-8e899ca4e09c\"}"}],"hiredAt":"2023-05-08T23:37:22.302Z","topics":["Music","History","Spanish","Journalism","History Project","Film / Theater"],"communityBadges":["https://ucarecdn.com/8dd78be7-da2e-4b2d-826e-2820e9e33bd0/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mia-goodman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"37b75faf-c887-451e-84e3-4131fd40ffa7\"}"}}},"_sentryTraceData":"a9164c5ca87942d2b46e835a60b03814-bec2780e548efc21-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a9164c5ca87942d2b46e835a60b03814,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled
