ame":"DeepDives","uuid":"7647656c-23fd-4791-ae18-d323e51fb0af","content":"\u003cp\u003eMy family.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"ff000eb9-4493-4890-857e-5c89786b81e0\"}":{"__typename":"DeepDives","uuid":"ff000eb9-4493-4890-857e-5c89786b81e0","content":"\u003cp\u003eGoing to a 7-week summer camp in Maine!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"be122fc4-dcc7-46d5-97e7-786a8bd73446\"}":{"__typename":"School","uuid":"be122fc4-dcc7-46d5-97e7-786a8bd73446","name":"Brentwood School, East Campus","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90049"},"Education:{\"uuid\":\"a222ca93-8135-499c-ad03-4a15a62da031\"}":{"__typename":"Education","uuid":"a222ca93-8135-499c-ad03-4a15a62da031","school":{"__ref":"School:{\"uuid\":\"be122fc4-dcc7-46d5-97e7-786a8bd73446\"}"},"startYear":"2006","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"0fd7659e-abcd-4698-b82a-1f45570a5dad\"}":{"__typename":"Education","uuid":"0fd7659e-abcd-4698-b82a-1f45570a5dad","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Journalism ","degree":"Bachelor's Degree"},"Testimonial:52c8a619-cbd9-4d04-9885-ffcd08343479":{"__typename":"Testimonial","id":"52c8a619-cbd9-4d04-9885-ffcd08343479","text":"We are incredibly thankful to have Sarah Meadow as our daughter Carly's mentor.  We always knew that Carly loved sports and was quite knowledgable about athletes, teams, etc., but she wasn't a great writer and we had no idea how she could turn her passion into a project.  Enter Curious Cardinals and Sarah!  Carly and Sarah started a sports blog and eventually a podcast.  Before we knew it, Carly's writing skills evolved and as a special bonus, her confidence was boosted too!  Not only has Sarah been an absolutely wonderful mentor but Carly looks up to her on a personal level as well.  Curious Cardinals has delivered on every promise that they made when we first signed up and then some.  I highly recommend that anyone looking for a passion project for their child consider Curious Cardinals!","date":"2025-05-29 23:42:44.931+00","rating":5,"endorser":{"__typename":"Endorser","name":"Susie Polow","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"1c530a07-4b94-43dc-9a18-fccb96a235e2\"}":{"__typename":"MentorPublicProfile","uuid":"1c530a07-4b94-43dc-9a18-fccb96a235e2","displayName":"Sarah M.","slug":"sarah-meadow","biography":"\u003cp\u003eSarah is a 2023 graduate of Northwestern University's Medill School of Journalism, with a minor in psychology and certificate in marketing. While at Northwestern, she wrote for a variety of on-campus publications, interned with March Madness, CAA, SLAM and the Chicago Blackhawks as well as covering the 2023 NCAA DI Women's Lacrosse Champion Northwestern Wildcats. As the oldest of three girls, Sarah hopes to inspire young women to find their own passions and not be afraid to disrupt the status quo. In her free time, she loves reading, doing yoga, and listening to podcasts.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eA native of Los Angeles, the tangible and vibrant feeling of the connection between sports and community in high school and the larger city drew her into sports.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eShe now works at the NBA in New York City, creating authentic stories through branded content campaigns on social media.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThe accomplishment I am most proud is co-founding UNCUT Northwestern, a student-athlete storytelling platform that originated at UNC-Chapel Hill. As the Head of Operations, I oversaw all storytelling initiatives with Northwestern student-athletes in written forms and on social media, including website design, outreach, and recruiting students to join our staff. This was not an easy process, but I learned so much about myself and what it means to be a good leader throughout our launch, including setting up meetings with our athletic department, learning from other UNCUT chapters, and creating outreach plans and meeting with student-athletes. \u003cbr\u003e\u003cbr\u003eGetting to create our branding, advertise our stories to other publications on campus, and more has been the most enriching experience I have had thus far. Marketing, project management, teamwork, and organization were absolutely crucial to successfully launching UNCUT. \u003cbr\u003e\u003cbr\u003eIt has been incredible to see this project come to life from start to finish, and I'm honored to have left a legacy at Northwestern that combines all my passions: storytelling, sports and mental health.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"cc6d7747-8edc-41f5-b801-25472a5a76f1\"}"},{"__ref":"Favorites:{\"uuid\":\"dacf1130-8c3d-4b26-9b5b-4e066d89511d\"}"},{"__ref":"Favorites:{\"uuid\":\"e9bc33f2-f5cc-411e-be0c-07b4470738ff\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"915aedc8-052c-46e7-9897-3cd7f80f6e01\"}"}],"major":"Journalism ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0a23ef7f-d7ab-496c-adb4-fc3604ca729c\"}"},{"__ref":"DeepDives:{\"uuid\":\"fa79de50-bcf5-4f62-8769-85da93a0f546\"}"},{"__ref":"DeepD
