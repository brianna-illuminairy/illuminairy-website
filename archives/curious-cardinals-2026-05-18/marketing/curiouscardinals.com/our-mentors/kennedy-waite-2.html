t weird awakening, 3 of the 4 courses I enrolled in at Brown the following semester were in the Psych department… my passion for Psych only grew from there!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"79b3e65c-4e70-4ad3-ac4b-291eeb71d78b\"}":{"__typename":"Education","uuid":"79b3e65c-4e70-4ad3-ac4b-291eeb71d78b","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023.5","major":"Psychology","degree":"Psychology AB"},"School:{\"uuid\":\"467238b2-2da2-4a7e-af64-d7950fb143a0\"}":{"__typename":"School","uuid":"467238b2-2da2-4a7e-af64-d7950fb143a0","name":"Calabasas High School","city":"Calabasas","type":"HIGH","state":"California","country":"United States","zip":"91302"},"Education:{\"uuid\":\"b5e25fd1-97e3-4171-9537-dc14b868f1b0\"}":{"__typename":"Education","uuid":"b5e25fd1-97e3-4171-9537-dc14b868f1b0","school":{"__ref":"School:{\"uuid\":\"467238b2-2da2-4a7e-af64-d7950fb143a0\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"e418c489-2082-4289-931e-fd3e415ba08c\"}":{"__typename":"MentorPublicProfile","uuid":"e418c489-2082-4289-931e-fd3e415ba08c","displayName":"Kennedy W.","slug":"kennedy-waite-2","biography":"Kennedy (she/her) is a gap-semester senior at Brown University concentrating in Psychology. Her interest in Psych began with therapy and how inaccessible it is and expanded to include child development, education, animal behavior, and social psych. She also has experience in psychology in business, economics, and marketing, though she quickly realized it wasn't her passion after an internship at a software marketing startup company.\n\nIn 2019, she graduated from Calabasas High School where she was a Valedictorian, Captain of the Varsity Track \u0026 Field Team, member of the Varsity Women's Tennis Team, board member of the Black Student Union, member of the National Honors Society (NHS), co-president of Toys for Tots, and a Link Leader for Freshmen Orientation. \n\nKennedy was recruited to Brown as a Sprinter for D1 Track \u0026 Field, where she competed and was the “morale manager” for 2.5 years. She currently holds 3rd fastest all-time in Brown’s history in the Indoor 200m, and 6th fastest all-time in Brown’s history in the Indoor 60m. Running track and singing Alto in The Jabberwocks (Brown's oldest A Cappella group) took up most of her time during her freshman and sophomore years. But like most Brown students, she has many interests. She pursued research assistant positions for various projects, including Sociology research on First Generation / Low-Income students her freshman spring, and Education research on a Cross-Cultural Analysis Between The Interactions Of Chinese Immigrant Mothers With their Infants and The Interactions Of European American Mothers With Their Infants. In the middle of Junior year, she pulled a \"Zac Efron\" and quit the track team to pursue more of the arts. She was cast as Mimi in Rent in the Spring of 2022, then went back to her childhood acting days and dabbled in film in the Fall of 2022, where she landed lead actress for a senior thesis film and Assistant Director for a Brown Motion Pictures film.\n\nKennedy is currently using her gap semester to take a break from the rigor of Brown, and is working at an Italian restaurant and tutoring with Curious Cardinals. In her free time, she enjoys sitting in on friends’ classes, supporting live jazz combo performances, and attending activism rallies on the main green. She really enjoys bike riding, rock climbing, singing, discovering/sharing amazing music, people-watching, and journaling! Just in the past couple of years grew more of an adoration for fiction writing and creative nonfiction books that read like fiction (but aren't!), such as In The Dream House by Carmen Machado. She is constantly looking for ways to sharpen her abilities as a vocalist and performer, and searching for outlets in which she feels immense freedom of expression and creativity. Kennedy finds speaking to people and hearing about their work and how and where they came from to be incredibly inspiring, and you'll often find her engaged in in-depth conversations with people she just barely met. \n\nShe’s excited to get to know you and all the things that spark your curiosity! ^_^\n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8969cfe7-8026-4d9e-baf1-a7b8042debb6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e4601fa0-5027-4dd1-a27b-986750f5f466/-/crop/892x891/0,25/-/preview/-/format/jpg/","https://ucarecdn.com/6eaf2414-0a5a-4580-8bb9-777825e7f98b/-/preview/-/format/jpg/","https://ucarecdn.com/7068ae8c-f2e6-4686-8b54-3a048f24d7d8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"79b3e65c-4e70-4ad3-ac4b-291eeb71d78b\"}"},{"__ref":"Education:{\"uuid\":\"b5e25fd1-97e3-4171-9537-dc14b868f1b0\"}"}],"hiredAt":"2023-03-07T20:09:02.623Z","topics":["Coding / Programming","STEM Project","Film / Theater","K-5 Grade Math","Pre-Algebra","Geometry","Writing","French","Reading","Computer Science","Creative Writing","College Essay Writing","Academic Coaching","Algebra I"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"]
