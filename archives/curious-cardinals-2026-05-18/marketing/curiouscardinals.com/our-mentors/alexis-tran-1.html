../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bba1ca96-e5cb-473f-a8f0-8190bf23905c\"}":{"__typename":"DeepDives","uuid":"bba1ca96-e5cb-473f-a8f0-8190bf23905c","content":"\u003cp\u003eI chose Science, Technology, and Society (STS) because of my interest in pursuing an interdisciplinary education. The program is very flexible and allows me to engage in all of my seemingly disparate interests like anthropology, biology, A.I., media, etc, etc. This flexibility is something I really value and encompasses the exploratory, interdisciplinary education I was looking forward to coming into college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"04c946c5-cf8b-4fe9-ab39-75d6389f0bd3\"}":{"__typename":"DeepDives","uuid":"04c946c5-cf8b-4fe9-ab39-75d6389f0bd3","content":"\u003cp\u003eSomething you might not know about me was that I used to be a competitive hip hop dancer! Fun fact, I actually have danced half-time and prime-time at several Warriors' games ;) While I no longer compete, I still love to dance as a therapeutic and creative outlet, but also just to have fun.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d4c55e79-608f-4920-b566-ada5d5874598\"}":{"__typename":"DeepDives","uuid":"d4c55e79-608f-4920-b566-ada5d5874598","content":"\u003cp\u003eI'm a firm believer that my mentors played a big role in shaping me into the person I am today. Their support, encouragement, and guidance allowed me to feel confident in exploring my interests, hobbies, and passions and instill in me a mindset to never accept limits on my potential. As a result, I've made it one of my biggest passions in life to be on the other side of the equation--offering invaluable mentorship to younger students so that they, too, can develop confidence, intellectual curiosity, and passions of their own.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"410345ea-a999-4a32-be3b-28f8c2a9bf36\"}":{"__typename":"DeepDives","uuid":"410345ea-a999-4a32-be3b-28f8c2a9bf36","content":"\u003cp\u003eI love hanging out with my friends, whether that be getting good food together, working out, bouldering, going out to explore random places, or just simply going on walks together. I also love to engage in self-care time while watching movies, doing yoga/face masks/drinking tea, or cooking/baking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9622dd81-5797-4a88-ba43-46fca6829905\"}":{"__typename":"School","uuid":"9622dd81-5797-4a88-ba43-46fca6829905","name":"Sobrato High School","city":"Morgan Hill","type":"HIGH","state":"California","country":"United States","zip":"95037"},"Education:{\"uuid\":\"85b407e2-fab1-4744-b728-6825ae829bd4\"}":{"__typename":"Education","uuid":"85b407e2-fab1-4744-b728-6825ae829bd4","school":{"__ref":"School:{\"uuid\":\"9622dd81-5797-4a88-ba43-46fca6829905\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"0d356c6a-1bfa-43b8-b526-5559cafb0103\"}":{"__typename":"Education","uuid":"0d356c6a-1bfa-43b8-b526-5559cafb0103","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Science, Technology, and Society","degree":"B.S."},"MentorPublicProfile:{\"uuid\":\"be6ca868-0589-43b4-80f3-74d34a31854e\"}":{"__typename":"MentorPublicProfile","uuid":"be6ca868-0589-43b4-80f3-74d34a31854e","displayName":"Lexy T.","slug":"alexis-tran-1","biography":"\u003cp\u003eLexy is a medical student at UCSF School of Medicine and graduated from Stanford University with her B.S. in Science, Technology, and Society and M.S. in Community Health and Prevention Research. She considers teaching and mentorship to be one of her biggest passions. Lexy has spent a large portion of undergrad teaching weekly health education lessons to middle schoolers through the Cardinal Health Education Collaborative and tutoring/mentoring students from underserved communities as part of the Teach For America corps.\u003cbr\u003e\u003cbr\u003eA large part of what makes these experiences so enjoyable for Lexy is the similarity of the students she mentors to herself: curious, driven, and passionate. In high school, she started the nonprofit PERIOD to help address period poverty and co-founded Team HBV to help spread awareness of hepatitis B and liver cancer. Now, at Stanford, she volunteers at the VA medical center and is continuing her outreach efforts with Team HBV. She also has many years of experience in the research lab, and is currently working on using stem cell derived organoids to better understand endometrial cancer. Lexy has also ventured into journalism, serving as an Editor-in-Chief of the Intersect Journal of Science, Technology, and Society and as an Interdisciplinary Editor for the Stanford Journal of Public Health. \u003cbr\u003e\u003cbr\u003eAs a Curious Cardinals mentor, she hopes to similarly inspire younger students to follow their passions, explore their interests, and stay curious!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Science, Technology, and Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bba1ca96-e5cb-473f-a8f0-8190bf23905c\"}"},{"__ref":"DeepDives:{\"uuid\":\"04c946c5-cf8b-4fe9-ab39-75d6389f0bd3\"}"},{"__ref":"DeepDives:{\"uuid\":\"d4c55e79-608f-4920-b566-ada5d5874598\"}"},{"__ref":"DeepDives:{\"uuid\":\"410345ea-a999-4a32-be3b-28f8c2a9bf36\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e24ede7b-1c14-45b4-a53a-8d34f94c57fa/-/preview/-/format/jpg/","https://ucarecdn.com/b8a74d87-44e4-4e00-9a9b-d3f4bcd15abc/-/preview/-/format/jpg/","https://ucarecdn.com/6ade79a0-9e11-4d48-8ff6-5c198c17c18b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"85b407e2-fab1-4744-b728-6825ae829bd4\"}"},{"__ref":"Education:{\"uuid\":\"0d356c6a-1bfa-43b8-b526-5559cafb0103\"}"}],"hiredAt":"2022-10-27T20:50:11.000Z","topics":["Precalculus / Trigonometry","Algebra I","Algebra II","Pre-Algebra","K-5 Grade Math","Calculus","Chemistry","Biology","6-8 Grade Science","Writing","Academic Coaching","College Essay Writing","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexis-tran-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"be6ca868-0589-43b4-80f3-74d34a31854e\"}"}}},"_sentryTraceData":"fa46ca46e3ee42c0a2e7a9835ae93333-af0f800bbca8343e-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fa46ca46e3ee42c0a2e7a9835ae93333,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alexis-tran-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketin
