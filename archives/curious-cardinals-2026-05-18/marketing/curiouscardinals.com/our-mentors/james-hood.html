../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"0528fa71-4662-47bd-9649-1d3ba76b5004\"}":{"__typename":"CausesSupported","uuid":"0528fa71-4662-47bd-9649-1d3ba76b5004","name":"Operation Blessing International","description":"\u003cp\u003eThey helped me transport my team's unused soccer gear to an orphanage in Haiti.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/45d97394-0109-4ae8-96ac-e5ef6957c140/"},"CausesSupported:{\"uuid\":\"5b94d67d-e558-47d0-a358-4ebfe93365d2\"}":{"__typename":"CausesSupported","uuid":"5b94d67d-e558-47d0-a358-4ebfe93365d2","name":"Willing Hands","description":"\u003cp\u003eCollects unused produce to reduce food insecurity in New Hampshire.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/670865b4-b2f2-49e4-9019-132fec41f135/"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"ed0a914a-34ad-4523-ae62-6e3ed8a3650e\"}":{"__typename":"DeepDives","uuid":"ed0a914a-34ad-4523-ae62-6e3ed8a3650e","content":"\u003cp\u003eIn high school I organized a partnership between an orphanage I had the opportunity to visit in Hinche, Haiti, my club soccer organization, and a local nonprofit. I collected unused soccer equipment from my soccer organization and gave it to the local nonprofit for shipment in a container to Haiti. After arriving in Haiti, the orphanage, which otherwise did not have the resources to buy high quality soccer gear, picked up the supplies and shared them with the kids. It meant a lot to me that I was able to help kids less privileged than I to enjoy the game we all love.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"bcb78999-b3f5-4e96-a261-090cfe4b4ae2\"}":{"__typename":"DeepDives","uuid":"bcb78999-b3f5-4e96-a261-090cfe4b4ae2","content":"\u003cp\u003eSummers were a time for me to get outside, exercise, and spend time with friends. I played soccer, ran for preseason conditioning, swam for my summer league swim team, and surfed when the waves were big enough. I grinded during the school year, so I always used summers as a time to be happy and healthy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"4e190c57-2dc3-4f9b-8b60-693ed54b9d22\"}":{"__typename":"DeepDives","uuid":"4e190c57-2dc3-4f9b-8b60-693ed54b9d22","content":"\u003cp\u003eThis is definitely true now as well, but in high school I really discovered that I like to take things either very seriously or very unseriously. I always held myself to a high level with my academic responsibilities and sports teams, but in my free time I loved to let loose surfing or goofing around with friends. I didn't let things concern me unless I felt they were truly important.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"3158df0b-b5ef-44d8-a6d2-ea7a5469b6eb\"}":{"__typename":"DeepDives","uuid":"3158df0b-b5ef-44d8-a6d2-ea7a5469b6eb","content":"\u003cp\u003eI want to be a virus hunter. This crystallized into my dream job after seeing the pain and suffering caused by the 2015 Ebola outbreak. This epidemic claimed thousands of lives, but also highlighted the power of scientific research to find vaccines and treatments for the most dangerous diseases. The Ebola epidemic, and now the COVID-19 pandemic, have highlighted the threats that emerging viruses pose to our collective safety and happiness. But they have also underscored the potential of biological and chemical research to halt these diseases in their tracks.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"64a131b8-23f4-4894-88a7-abaf6a3ef260\"}":{"__typename":"Education","uuid":"64a131b8-23f4-4894-88a7-abaf6a3ef260","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Biology","degree":"B.A."},"School:{\"uuid\":\"5dbc1fe5-8fae-4a6d-8ecf-1409571aff4d\"}":{"__typename":"School","uuid":"5dbc1fe5-8fae-4a6d-8ecf-1409571aff4d","name":"Norfolk Academy","city":"Norfolk","type":"HIGH","state":"Virginia","country":"United States","zip":"23502"},"Education:{\"uuid\":\"03ae78a9-d267-4c5f-8f20-b299c4cf315f\"}":{"__typename":"Education","uuid":"03ae78a9-d267-4c5f-8f20-b299c4cf315f","school":{"__ref":"School:{\"uuid\":\"5dbc1fe5-8fae-4a6d-8ecf-1409571aff4d\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"812f422c-e24b-436c-83b0-a1a02139b2ca\"}":{"__typename":"MentorPublicProfile","uuid":"812f422c-e24b-436c-83b0-a1a02139b2ca","displayName":"James H.","slug":"james-hood","biography":"I am a senior at Dartmouth College planning on majoring in biology with a minor in Spanish. I grew up in Virginia Beach, Virginia, and graduated as valedictorian from my high school. During high school I worked part-time as a tutor for precalculus and volunteered helping kindergardeners with reading during the summers. These experiences formed my passion for teaching a wide range of subjects to a diverse set of students. In college, my studies focus on the intersection of infectious disease, the immune system, and ecology. I also have dedicated multiple classes to chemistry, statistics, anthropology, and art history. I am also writing a senior thesis for my research on COVID-19. Since high school, I have worked on multiple global health interventions across the world, from contact tracing in Virginia Beach to implementing water filter systems in rural Belize. I have always loved the Spanish language and how it facilitates amazing connections with amazing people, but I truly honed my fluency while studying abroad in Spain. I also love learning about the world from small molecules to colossal whales, which blends seamlessly with my natural passion for the outdoors, especially the ocean. In my free time, I like to cook, surf (even in New Hampshire!) ,and swim, bike, and run with Dartmouth's triathlon team. I also volunteer with a number of local non-profits tackling issues from food insecurity to finding homes for orphaned cats and dogs. This summer I will be working part-time for the New England Aquarium, scuba diving in the Giant Ocean Tank. In the fall, I will move to Lima, Peru, where I will work with the non-profit Partners in Health to expand their tuberculosis interventions to include HIV diagnosis, treatment, and prevention. After returning from Peru, I hope to begin my pursuit of a Ph.D. in immunology or virology.","teachingVideoPlaybackId":"pImCC2EJH6QrZ1zNazQSHnMyR36QLD92FWcwp7IFzdc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0528fa71-4662-47bd-9649-1d3ba76b5004\"}"},{"__ref":"CausesSupported:{\"uuid\":\"5b94d67d-e558-47d0-a358-4ebfe93365d2\"}"}],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ed0a914a-34ad-4523-ae62-6e3ed8a3650e\"}"},{"__ref":"DeepDives:{\"uuid\":\"bcb78999-b3f5-4e96-a261-090cfe4b4ae2\"}"},{"__ref":"DeepDives:{\"uuid\":\"4e190c57-2dc3-4f9b-8b60-693ed54b9d22\"}"},{"__ref":"DeepDives:{\"uuid\":\"3158df0b-b5ef-44d8-a6d2-ea7a5469b6eb\"}"}],"active":true,"profilePhotos":["https://api.dicebear.com/7.x/initials/svg?seed=JH","https://ucarecdn.com/b24f5521-81e4-424d-856a-fbc3bc083a6a/-/crop/565x565/89,218/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{
