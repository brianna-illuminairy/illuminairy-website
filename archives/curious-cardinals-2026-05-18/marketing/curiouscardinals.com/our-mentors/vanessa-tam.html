b\"}":{"__typename":"Favorites","uuid":"acc627e1-a6a0-4d8f-98e4-cfdb017d413b","photoUrl":"https://ucarecdn.com/329c65a0-f05c-409e-917a-4a6953c72caf/","title":"Rogue One: A Star Wars Story","type":"MOVIE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"52bb1986-43ce-4333-9d1d-8e64cb2b9a92\"}":{"__typename":"DeepDives","uuid":"52bb1986-43ce-4333-9d1d-8e64cb2b9a92","content":"\u003cp\u003eI love building and creating and helping others through the means of healthcare, but I didn't want to be a doctor! Instead, I chose to become a biomedical engineer to save even more lives than doctors with my inventions. :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"02643808-0146-4d04-9354-d4f8a202cfcf\"}":{"__typename":"DeepDives","uuid":"02643808-0146-4d04-9354-d4f8a202cfcf","content":"\u003cp\u003eGrowing up with big dreams in a town too small to hold them, I never really had anyone to look up to for guidance. I knew what I wanted to do, but reaching my goals was always a trial by fire. While effective, I wouldn't wish that on any kid with lofty aspirations and is just a little lost. Mentorship matters to me because I want to be the mentor and role model I never had and help any kid with great ambitions and no idea where to begin. I always want to be the change I want to see!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b2069eaa-8a90-4d0e-a1c4-bc49a5d782a3\"}":{"__typename":"DeepDives","uuid":"b2069eaa-8a90-4d0e-a1c4-bc49a5d782a3","content":"\u003cp\u003eYou are always becoming -- you're not done yet. In a world full of imposter syndrome and believing the grass is  greener on the other side, it's easy to lose track of your own sense of self. I would tell my younger self to relax and embrace the fact that she is still growing to be the best version of herself, and that is her greatest strength of all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"DeepDives:{\"uuid\":\"ca628cb3-0764-4449-a1d2-cb84ad4ec9c4\"}":{"__typename":"DeepDives","uuid":"ca628cb3-0764-4449-a1d2-cb84ad4ec9c4","content":"\u003cp\u003eGrowing up with big dreams in a town too small to hold them, I never really had anyone to look up to for guidance. I knew what I wanted to do, but reaching my goals were always a trial by fire. While effective, I wouldn't wish that on any kid with lofty aspirations and just a little lost. Mentorship matters to me because I want to be that mentor and role model I never had and help any kid with lofty aspirations and no idea where to begin. Always be the change you want to see!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"DeepDives:{\"uuid\":\"16189f13-805f-47b0-b42e-c630b3d8cde4\"}":{"__typename":"DeepDives","uuid":"16189f13-805f-47b0-b42e-c630b3d8cde4","content":"\u003cp\u003eYou are always becoming -- you're not done yet. In a world full of imposter syndrome and believing the grass is always greener on the other side, it's easy to lose track of your own sense of self. I would tell my younger self to relax and embrace the fact that she is still growing to be the best version of herself, and that is her greatest strength above all. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"DeepDives:{\"uuid\":\"fc8ff900-5643-4fc3-8ce4-47600b0c3fc1\"}":{"__typename":"DeepDives","uuid":"fc8ff900-5643-4fc3-8ce4-47600b0c3fc1","content":"\u003cp\u003eI love building and creating and helping others through the means of healthcare, but I didn't want to be a doctor! Instead, I chose to become a biomedical engineer to save even more lives than doctors with my inventions. :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"e125d70f-86a4-4953-92f9-14689e1d1b8f\"}":{"__typename":"Education","uuid":"e125d70f-86a4-4953-92f9-14689e1d1b8f","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Biomedical Engineering","degree":null},"School:{\"uuid\":\"63f5f364-6662-43ad-b46c-f4cd270cede4\"}":{"__typename":"School","uuid":"63f5f364-6662-43ad-b46c-f4cd270cede4","name":"Bentonville West High School","city":"Centerton","type":"HIGH","state":"Arkansas","country":"United States","zip":"72719"},"Education:{\"uuid\":\"3facc68e-c65b-48c2-a650-3cac02413fff\"}":{"__typename":"Education","uuid":"3facc68e-c65b-48c2-a650-3cac02413fff","school":{"__ref":"School:{\"uuid\":\"63f5f364-6662-43ad-b46c-f4cd270cede4\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"Testimonial:d46c3533-a5a3-406b-a415-e86203e0a501":{"__typename":"Testimonial","id":"d46c3533-a5a3-406b-a415-e86203e0a501","text":"Vanessa is incredible. She is the very reason why our daughter has fallen in love with engineering. Vanessa has exposed her to all areas of engineering, while working on multiple hands on projects.  It's incredible that she has developed skills that will benefit our daughter from CAD Design to Python, etc. We hit the jackpot when it comes to mentors!","date":"2025-06-02 16:57:57.192+00","rating":5,"endorser":{"__typename":"Endorser","name":"Julie Merges","tagline":"","avatar":null}},"Testimonial:31a5c8f8-d0d1-4117-af6f-11db3743b69f":{"__typename":"Testimonial","id":"31a5c8f8-d0d1-4117-af6f-11db3743b69f","text":"We love working with CC! We have had 2 mentors already and now looking to add a third mentor - each focusing on various aspects of College applications prep. There are many wonderful things about the mentors - their skills and interests are matched to what we need, mentors are extremely knowledgeable and committed to the student's success, very organized, clear on goals and what was accomplished (notes from each session); and probably one of the most important aspects - they \"speak the student's language\" and truly built a connection with my daughter! Highly recommend and have been referring many friends and colleagues. Thank you CC!","date":"2024-01-04 15:39:55.137+00","rating":5,"endorser":{"__typename":"Endorser","name":"Kalina Nikolova","tagline":null,"avatar":null}},"MentorPublicProfile:{\"uuid\":\"0ea979f1-1d3b-4b1b-a6e7-6609a560a796\"}":{"__typename":"MentorPublicProfile","uuid":"0ea979f1-1d3b-4b1b-a6e7-6609a560a796","displayName":"Vanessa T.","slug":"vanessa-tam","biography":"\u003cp\u003eEver since she was born at a young age, Vanessa was drawn to the field of engineering and obsessed with playing with Legos and breaking things to rebuild. Coming into college, she naturally gravitated towards engineering because of her love for building and designing things (and to get her parents off her butt about medical school). However, it wasn’t until one of her first year engineering professors told her that engineers have saved more lives than doctors, that she realized she was doing exactly what she was meant to be doing. Vanessa’s mission as a mentor is to support her students academically and socially in order to help them find the path they want to pursue.\u003cbr\u003e\u003cbr\u003eHailing from Bentonville, Arkansas (the headquarters of Walmart!), Vanessa is a recent graduate of Duke University where she obtained a Bachelor of Science in Biomedical Engineering (biomechanics focused, math minor, and certificate in Global Development Engineering) and a Master of Engineering in Biomedical Engineering (certificates in Medical Technology Design and Innovation \u0026amp; Entrepreneurship). At Duke, she was an undergraduate Biomedical Engineering Design Fellow and graduate Design Health Fellow, working closely with physicians at Duke University Medical Center to discover pressing needs in healthcare and create solutions at the intersection of engineering and medicine. In addition, Vanessa served as a teaching assistant for several undergraduate and graduate engineering courses and has facilitated the learning of over 400 students throughout her time at Duke. She is deeply passionate about supporting STEM education and spent her free time mentoring local middle school girls interested in STEM and engaging with the Society of Women Engineers and Biomedical Engineering Society.\u003cbr\u003e\u003cbr\u003eWhen she’s not wiring circuits, coding, or making CAD models, you can find Vanessa watching basketball, listening to music, reading, or eating.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"41KQKECMqLzUqI01018XpRc6l00JB3EwSroVx79tk7E3WY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4bbee445-6ca4-4689-84e9-c7b681934b49\"}"},{"__ref":"Favorites:{\"uuid\":\"a3f65c1f-9b9a-4376-980e-85e64403d391\"}"},{"__ref":"Favorites:{\"uuid\":\"acc627e1-a6a0-4d8f-98e4-cfdb017d413b\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"52bb1986-
