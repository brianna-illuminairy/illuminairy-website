/","title":"Fine Line by Harry Styles","type":"SONG"},"Favorites:{\"uuid\":\"25ad88b0-1b27-4fa9-bdc1-91b055263d99\"}":{"__typename":"Favorites","uuid":"25ad88b0-1b27-4fa9-bdc1-91b055263d99","photoUrl":"https://ucarecdn.com/ed26dc04-d266-49de-8bef-30fe34eb0714/","title":"Multitude by Stromae","type":"ALBUM"},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"fd4ca343-971c-4281-845d-aeb9002dca78\"}":{"__typename":"Education","uuid":"fd4ca343-971c-4281-845d-aeb9002dca78","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Molecular Biology","degree":"Bachelor"},"School:{\"uuid\":\"7d22325d-c755-46e3-adbc-01f61a6b833b\"}":{"__typename":"School","uuid":"7d22325d-c755-46e3-adbc-01f61a6b833b","name":"Kennesaw Mountain High School","city":"Kennesaw","type":"HIGH","state":"Georgia","country":"United States","zip":"30152"},"Education:{\"uuid\":\"080043d5-3396-4507-9c94-8f99304f5719\"}":{"__typename":"Education","uuid":"080043d5-3396-4507-9c94-8f99304f5719","school":{"__ref":"School:{\"uuid\":\"7d22325d-c755-46e3-adbc-01f61a6b833b\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"c90301c4-74d6-46c9-b664-997d1c41e197\"}":{"__typename":"MentorPublicProfile","uuid":"c90301c4-74d6-46c9-b664-997d1c41e197","displayName":"Naisha S.","slug":"naisha-sylvestre","biography":"\u003cp\u003eOriginally from Marietta, Ga, Naisha is a senior at Princeton University pursuing a major in Molecular Biology and minors in Latin American Studies and in Global Health Policy. Naisha is interested in history, public policy, and music.\u003cbr\u003e\u003cbr\u003eAt Princeton, Naisha was the co-President of the Princeton Black Student Union and a former Managing Editor at The Daily Princetonian. She also volunteers as a patient advocate at Henry J Austen Health Center. While at Princeton studied abroad in Argentina where she looked at the cultural importance of cuisine as well as the cultural influences of Afro-Argentinians. Summer 2023, she interned at the High Meadows Environmental Institute under the guidance of the Geoscience Department at Princeton.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLast summer, she interned at Insitute Oswaldo Cruz in partnership with the Brazilian Ministry of Health to study Trypanosomiasis. \u003cbr\u003e\u003cbr\u003eNaisha graduated from Kennesaw Mountain High School in 2021 where she received awards for her excellence in science, literature, Spanish, and AP Calculus. At KMHS, Naisha served as co-president of the Spanish Honor Society, communication chair in her school government, and section leader in her school’s marching band. She enjoys reading, going on hikes and runs, playing the flute, and hanging out with her friends. Naisha is very excited to spread her love of learning and passion for all thing science, math, and history related. She cannot wait to engage younger students and guide them on their path to being a great scholar!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3a8e99d2-daca-4d33-a5a7-1ccb3bb9c0d7\"}"},{"__ref":"Favorites:{\"uuid\":\"8ade9a8b-bdea-4d90-a369-4cd863f6f15b\"}"},{"__ref":"Favorites:{\"uuid\":\"25ad88b0-1b27-4fa9-bdc1-91b055263d99\"}"}],"causesSupported":[],"major":"Molecular Biology","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/fd03c916-032d-4859-bc9f-3a4e530a8d75/-/crop/692x692/0,116/-/preview/-/format/jpg/","https://ucarecdn.com/58d402ad-7660-446b-a5aa-57be659a8cb1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fd4ca3
