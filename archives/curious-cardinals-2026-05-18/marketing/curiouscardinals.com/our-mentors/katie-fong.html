0304184108d4\"}":{"__typename":"Favorites","uuid":"973ceb74-7dcf-4096-b888-0304184108d4","photoUrl":"https://ucarecdn.com/aedf7a90-ce71-4d17-a771-2fc48dc5975b/","title":"Be the Cowboy by Mitski","type":"ALBUM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d6fbd6b6-126b-4ade-9348-90c2591c1729\"}":{"__typename":"DeepDives","uuid":"d6fbd6b6-126b-4ade-9348-90c2591c1729","content":"\u003cp\u003eMentorship matters to me because I have seen how learners can flourish when they know they have someone in their corner who believes in them 100%, even when they struggle to believe in themselves. I seek to build caring, authentic relationships with my mentees, encouraging them to approach learning with curiosity and creativity and helping them reframe 'failure' as an opportunity to grow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3f64a820-4d4c-4846-9acf-105062a5ea23\"}":{"__typename":"DeepDives","uuid":"3f64a820-4d4c-4846-9acf-105062a5ea23","content":"\u003cp\u003eI chose my major because I believe that art has the power to effect meaningful social, cultural, political, and emotional change. Writing about art is another way of thinking critically about the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8a35b6bc-e227-4f6c-af8f-cfc7de605469\"}":{"__typename":"DeepDives","uuid":"8a35b6bc-e227-4f6c-af8f-cfc7de605469","content":"\u003cp\u003eI was (and still am, in many ways) a perfectionist and chronic overachiever! While I have always loved learning, I also grew up holding myself to impossibly high standards - a trait I share with many of my mentees. I am grateful to be able to offer my perspective and care to mentees who remind me of myself at their age.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"3b1d6e4d-40fd-4f98-bf26-fd62e6acd2b4\"}":{"__typename":"DeepDives","uuid":"3b1d6e4d-40fd-4f98-bf26-fd62e6acd2b4","content":"\u003cp\u003eMuseum curator of contemporary art!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"429b0645-c7d1-4eb6-b107-e7dcda0da0b6\"}":{"__typename":"Education","uuid":"429b0645-c7d1-4eb6-b107-e7dcda0da0b6","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":"2022","expectedGradYear":"2022","major":"Art History","degree":null},"School:{\"uuid\":\"6f2fd59b-97fb-4b24-9d53-7a53881c3737\"}":{"__typename":"School","uuid":"6f2fd59b-97fb-4b24-9d53-7a53881c3737","name":"Taipei American School","city":"Taipei","type":"HIGH","state":"TW","country":"Taiwan","zip":"111029"},"Education:{\"uuid\":\"560a1f39-6d7f-4ca2-a06e-4c8e2b5addcc\"}":{"__typename":"Education","uuid":"560a1f39-6d7f-4ca2-a06e-4c8e2b5addcc","school":{"__ref":"School:{\"uuid\":\"6f2fd59b-97fb-4b24-9d53-7a53881c3737\"}"},"startYear":"2005","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"9bc712a0-3475-4b5d-88d1-ae7bcd7aa8f2\"}":{"__typename":"MentorPublicProfile","uuid":"9bc712a0-3475-4b5d-88d1-ae7bcd7aa8f2","displayName":"Katie F.","slug":"katie-fong","biography":"\u003cp\u003eKatie Fong (she/her) is a recent Stanford University graduate in Art History and Comparative Studies in Race and Ethnicity. At Stanford, she received the J. E. Wallace Sterling Award for Scholastic Achievement as one of the top 25 graduating seniors in Stanford’s School of Humanities and Sciences. \u003c/p\u003e\u003cp\u003eKatie is currently pursuing her MA in Art History at NYU's Institute of Fine Arts. She has previously worked in curatorial, collections, and engagement roles at the Solomon R. Guggenheim Museum, New York; the Los Angeles County Museum of Art; Cantor Arts Center, Stanford; and the National Palace Museum, Taipei, Taiwan. Most recently, she held a development role at the International Studio and Curatorial Program in New York, where she supported residencies for global artists and curators and the inaugural cohort of the Vision Fund, dedicated solely to contemporary BIPOC artists. Katie is passionate about diversity and equity in the art world, and sees art curation, education, and praxis as tools towards our collective liberation. Her art history writing serves as an art form in itself— a poetic space for exploring the entanglements of identity, personal and collective history, and diaspora. In high school, Katie was a finalist in the International Public Policy Forum, a Varsity swimmer, an Oral Interpreter, and a musical theater actress. In addition to working as an ambassador for the National Palace Museum back home in Taipei, she also mentored new youth docents, teaching them Chinese art history and public-speaking. When she is not haunting art museums and galleries, Katie enjoys painting, singing, traveling the world, and eating delicious food.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"49835bab-ee2e-486d-a873-22fcd0385767\"}"},{"__ref":"Favorites:{\"uuid\":\"31e2f42b-7274-4b9d-8021-427f0c80a83f\"}"},{"__ref":"Favorites:{\"uuid\":\"973ceb74-7dcf-4096-b888-0304184108d4\"}"}],"causesSupported":[],"major":"Art History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d6fbd6b6-126b-4ade-9348-90c2591c1729\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f64a820-4d4c-4846-9acf-105062a5ea23\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a35b6bc-e227-4f6c-af8f-cfc7de605469\"}"},{"__ref":"DeepDives:{\"uuid\":\"3b1d6e4d-40fd-4f98-bf26-fd62e6acd2b4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2347b0bc-5aa5-427a-89d8-06422227d560/-/crop/692x693/0,13/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"429b0645-c7d1-4eb6-b107-e7dcda0da0b6\"}"},{"__ref":"Education:{\"uuid\":\"560a1f39-6d7f-4ca2-a06e-4c8e2b5addcc\"}"}],"hiredAt":"2021-09-10T16:06:26.000Z","topics":["Writing","College Essay Writing","Academic Coaching","Creative Writing","Visual Arts / Graphic Design","History Project"],"communityBadges":["https://ucarecdn.com/9fa2d8bf-132f-4356-a39d-e6f0aecb3e5b/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"katie-fong\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9bc712a0-3475-4b5d-88d1-ae7bcd7aa8f2\"}"}}},"_sentryTraceData":"70f9ed877d374e5f81efae6aa87f0b13-8165e5f2507472a5-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=70f9ed877d374e5f81efae6aa87f0b13,sentry-sample_rate=0.2,sentry-transaction=%
