:{"__typename":"Favorites","uuid":"51471c41-8220-49a1-a95e-8f359a7ef157","photoUrl":"https://ucarecdn.com/15850924-64ea-4e8c-a83e-b7926cf159c8/","title":"Titus Kaphar","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7793ba63-f19b-4f00-80d3-e8da3486fb46\"}":{"__typename":"DeepDives","uuid":"7793ba63-f19b-4f00-80d3-e8da3486fb46","content":"\u003cp\u003eI took HL Economics in my last two years of high school: we learned the basics of Micro and Macro, wrote essays, and solved supply and demand problems with the help of a graph. Economics was always interesting to me, but I struggled to make the connection between the purportedly rational and seamless diagrams of the global macro economy and me, a 'decision-maker' who didn't seem to act as rationally as the theory suggests. It was not until I read Richard Thaler's 'Misbehaving' and Levitt and Dubner's 'Freakonomics' in my senior year that I discovered the field of Behavioral Economics and became truly passionate about the subject!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"cbb356fe-cc2b-499c-99a8-0d4e8c7d7ecc\"}":{"__typename":"DeepDives","uuid":"cbb356fe-cc2b-499c-99a8-0d4e8c7d7ecc","content":"\u003cp\u003eAlthough it may sound trivial to some, I am proud of the progress that I have made when it comes to public speaking, standing up for myself, and meeting new people. I grew up as an extremely shy kid and hated talking to strangers: the thought of speaking in front of my class would fill me with dread. Now, when I tell people that I used to be like that, they are shocked! Every time I confidently deliver a presentation, I just know that little 10-year-old Eden would be so proud of me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"cb1bb58d-f756-4975-8c2e-18521320e08f\"}":{"__typename":"DeepDives","uuid":"cb1bb58d-f756-4975-8c2e-18521320e08f","content":"\u003cp\u003eFor so long, I shrunk away from my heritage and identity, trying to 'fit in' and believing that there were times when it was 'relevant' in my work and times when it was not. Now, I understand that I cannot separate my work from my identity, and I am extremely proud of who I am. I try to incorporate this into my teaching style: I build foundations with my mentees based on mutual respect, regardless of how similar or different our backgrounds may be. I believe that teaching has to come from a place of deep compassion. While it is an authority role, in my own experience I have grown the most academically when I felt listened to and respected, so I hope to be that presence for my mentees. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"828d760b-f963-45fb-9e57-1e0f46fb8d6d\"}":{"__typename":"DeepDives","uuid":"828d760b-f963-45fb-9e57-1e0f46fb8d6d","content":"\u003cp\u003eDuring my gap year, my friend and I were sitting on our apartment floor, eating ice cream and watching Survivor, when we decided we wanted to create a magazine. Over the next few months, we worked out the logistics, put out the word, came up with a name, shot, directed, and edited photoshoots, gathered a dozen written pieces to be featured, and continually uttered the phrase 'this is so stressful.' It was a collaborative process, and we would have never been able to make it happen without the community! Under ten months later, we held in our hands a glossy, comprehensive, creative, and undeniably unique product of our own invention. In that moment, I truly felt like I could achieve anything I set my mind to! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"d9e55d6a-e709-435a-b992-32f254f9e8a5\"}":{"__typename":"School","uuid":"d9e55d6a-e709-435a-b992-32f254f9e8a5","name":"Wellington College","city":"Crowthorne","type":"HIGH","state":"Berkshire","country":"United Kingdom","zip":"RG45 7PU"},"Education:{\"uuid\":\"86f0542a-b792-4ea4-afdd-cfbd74821045\"}":{"__typename":"Education","uuid":"86f0542a-b792-4ea4-afdd-cfbd74821045","school":{"__ref":"School:{\"uuid\":\"d9e55d6a-e709-435a-b992-32f254f9e8a5\"}"},"startYear":"2014","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"01b6d4c8-45db-4284-b52f-50c6c73576b2\"}":{"__typename":"Education","uuid":"01b6d4c8-45db-4284-b52f-50c6c73576b2","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Economics","degree":"BA"},"MentorPublicProfile:{\"uuid\":\"0d4fbef9-25ec-4f68-afd3-6a1b2b068b7a\"}":{"__typename":"MentorPublicProfile","uuid":"0d4fbef9-25ec-4f68-afd3-6a1b2b068b7a","displayName":"Eden B.","slug":"eden-bray","biography":"\u003cp\u003eEden is a rising Senior at Yale University pursuing a degree in Economics. She grew up in London, England and attended Wellington College, where she was awarded the Harvard Book Prize and graduated as a West Scholar with a score of 43 points in the IB Diploma. Along with her passion for Economics, Eden loves to be creative, and you’ll often find her writing short stories, sewing a new outfit, or making a short film. Last summer, she discovered her passion for production as an intern on The Late Show with Stephen Colbert! On Yale’s campus, Eden co-founded Fuse Magazine, Yale’s first publication dedicated to campus arts and culture. She continues to play an active role today as the Creative Director and Production Coordinator. While habitually working behind the camera, Eden constantly finds herself in front of it: balancing a full-time Yale degree with a professional modeling career. She is very familiar with the Metro North journey from New Haven to New York and has been featured in worldwide campaigns for brands such as Target, Macy’s, H\u0026amp;M, and Urban Outfitters. As an outspoken advocate for justice and equality in all its forms, Eden believes in getting involved in the communities around you. Previously, she was involved in the Yale Undergraduate Prison Project, a student group working to promote criminal justice reform and end the practice of solitary confinement in Connecticut. She also juggled one of her spring semesters with interning for the Center for Policing Equity, a group dedicated to helping law enforcement agencies identify ways to improve their relationship with the communities they serve. Often, she finds herself fusing creativity with her passion for activism: in her gap year, she worked as a marketing associate for a social justice-oriented sustainable jewelry brand. Outside the classroom, Eden spends her weekends working for Yale Athletics as a Sports Statistician for the women’s Field Hockey and Lacrosse teams and exploring New Haven's delicious food. She is also an avid reader, looking to beat her total of 55 books read last year!\u003c/p\u003e","teachingVideoPlaybackId":"HpgT9udxS2yFV19wmRbSo01p4Nyr02nzXS02joZ4KUUvjo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"550c7836-8260-468d-aa8e-0e03ccc9e880\"}"},{"__ref":"Favorites:{\"uuid\":\"e39842a9-f683-4d63-b4c1-0ff6b8d256b2\"}"},{"__ref":"Favorites:{\"uuid\":\"51471c41-8220-49a1-a95e-8f359a7ef157\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7793ba63-f19b-4f00-80d3-e8da3486fb46\"}"},{"__ref":"DeepDives:{\"uuid\":\"cbb356fe-cc2b-499c-99a8-0d4e8c7d7ecc\"}"},{"__ref":"DeepDives:{\"uuid\":\"cb1bb58d-f756-4975-8c2e-18521320e08f\"}"},{"__ref":"DeepDives:{\"uuid\":\"828d760b-f963-45fb-9e57-1e0f46fb8d6d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/79c2a2dc-6f4e-4ede-b2b3-b2706ff3469b/-/preview/-/format/jpg/","https://ucarecdn.com/5dee68ad-331e-4061-b268-71d374e295e4/-/preview/-/format/jpg/","https://ucarecdn.com/ca2ce177-8196-46f1-becb-fb16d6e953bf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"86f0542a-b792-4ea4-afdd-cfbd74821045\"}"},{"__ref":"Education:{\"uuid\":\"01b6d4c8-45db-4284-b52f-50c6c73576b2\"}"}],"hiredAt":"2023-05-21T21:17:20.740Z","topics":["Literature","History Project","Film / Theater","Fashion / Cosmetics","Creative Writing","Women \u0026 Gender Studies","Race \u0026 Ethnicity","Law / Government / Policy","Statistics","Precalculus / Trigonometry","Pre-Algebra","Geometry","Calculus","Algebra II","Algebra I","History","Reading","Geography","Economics","College Essay Writing","Academic Coaching","Writing","Business / Entrepreneurship","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibil
