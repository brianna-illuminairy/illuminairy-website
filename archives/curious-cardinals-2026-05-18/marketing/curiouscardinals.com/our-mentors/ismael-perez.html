55-f844-45aa-ad9f-0c714f004ecd\"}":{"__typename":"Favorites","uuid":"96227b55-f844-45aa-ad9f-0c714f004ecd","photoUrl":"https://ucarecdn.com/10ba2127-9d37-4a7e-b47b-fe39af8bbbe1/","title":"Cartagena, Colombia ","type":"CITY"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"91b8e538-23b2-4185-8fcc-e678881cb49d\"}":{"__typename":"DeepDives","uuid":"91b8e538-23b2-4185-8fcc-e678881cb49d","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to create a foundation in which children from impoverished communities in my home country of Colombia will find exposure to the arts and will find support in every area to pursue passions in those areas.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"14bd7f64-1df3-4237-a1a8-ab195e187841\"}":{"__typename":"DeepDives","uuid":"14bd7f64-1df3-4237-a1a8-ab195e187841","content":"\u003cp\u003eThe advice I would give my younger self is to be like a race horse, focus on my own path without looking to the sides for comparison. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"38fb081b-99f9-4aa8-ae0d-3ccdec06162d\"}":{"__typename":"DeepDives","uuid":"38fb081b-99f9-4aa8-ae0d-3ccdec06162d","content":"\u003cp\u003eMentorship matters to me because there were many times in my life in which I needed guidance through my artistic and academic endeavors. It was through the friendships with older students which served as mentorships that I was able to succeed in those areas as a result of their advice. Being a mentor to someone is my way of paying it forward. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"01fd50e3-01f5-4f8d-9fc7-89d91f54cc88\"}":{"__typename":"DeepDives","uuid":"01fd50e3-01f5-4f8d-9fc7-89d91f54cc88","content":"\u003cp\u003eIn my spare time I like going out with friends, reading, traveling, doing cool photo-shoots with my friends, making short films, listening to music, making music, watching movies, and cooking. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}":{"__typename":"School","uuid":"891dad70-4e24-4602-8353-1e8140b8eb0c","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60201"},"Education:{\"uuid\":\"04ea9dc1-caca-4f62-8b22-dd16768773fc\"}":{"__typename":"Education","uuid":"04ea9dc1-caca-4f62-8b22-dd16768773fc","school":{"__ref":"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Political Science and Vocal Performance","degree":"Bachelor of Arts and Bachelor of Music"},"School:{\"uuid\":\"4c752d8f-b198-4994-8952-1b4e7f5bc2b2\"}":{"__typename":"School","uuid":"4c752d8f-b198-4994-8952-1b4e7f5bc2b2","name":"New World School of the Arts","city":"Miami","type":"HIGH","state":"Fl","country":"United States of America","zip":"33132"},"Education:{\"uuid\":\"51389e2f-f6c6-44b5-bb69-14766cc64108\"}":{"__typename":"Education","uuid":"51389e2f-f6c6-44b5-bb69-14766cc64108","school":{"__ref":"School:{\"uuid\":\"4c752d8f-b198-4994-8952-1b4e7f5bc2b2\"}"},"startYear":"2016","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"3df24356-c0f0-4289-9948-616e26850df9\"}":{"__typename":"MentorPublicProfile","uuid":"3df24356-c0f0-4289-9948-616e26850df9","displayName":"Ismael P.","slug":"ismael-perez","biography":"\u003cp\u003eHey there! I'm Ismael, but you can call me Isma. I'm currently a Dual Degree student at Northwestern University, where I'm pursuing degrees in Vocal Performance and Journalism in the Medill School, with a major in Political Science.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOriginally from Medellín, Colombia, I grew up in Miami, Florida, so I’m deeply connected to my Colombian roots and culture. My background has really shaped who I am, and I love blending my Colombian heritage with my experiences in the U.S.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated from the highly competitive New World School of the Arts in Miami, where I was involved in the Spanish Honor Society, Student Government, and the Black Student Union. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern, I've participated in a variety of operatic productions, performed in a theater rendition of \u003cem\u003eIn the Heights\u003c/em\u003e, and handled public relations for various organizations and companies in the hospitality sector.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to offer mentorship in a range of areas, including essay help, Spanish language tutoring, homework assistance, passion projects, history, literature, vocabulary, geography, and music. Let’s connect and make great things happen!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was creating a way in which my high school's tradition of having the annual \"hispanic heritage show\" was accomplished while in quarantine. This virtual version of the longstanding tradition allowed my piers and I to express our art while in the confinement of our homes in such a trivial time where we didn't have the ability to sing, dance, or act as we had done before. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"77d9486b-4443-4bc8-af62-127ce49a88cf\"}"},{"__ref":"Favorites:{\"uuid\":\"3764411c-b4a9-4ed6-a636-02c6dead01ee\"}"},{"__ref":"Favorites:{\"uuid\":\"96227b55-f844-45aa-ad9f-0c714f004ecd\"}"}],"causesSupported":[],"major":"Political Science and Vocal Performance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"91b8e538-23b2-4185-8fcc-e678881cb49d\"}"},{"__ref":"DeepDives:{\"uuid\":\"14bd7f64-1df3-4237-a1a8-ab195e187841\"}"},{"__ref":"DeepDives:{\"uuid\":\"38fb081b-99f9-4aa8-ae0d-3ccdec06162d\"}"},{"__ref":"DeepDives:{\"uuid\":\"01fd50e3-01f5-4f8d-9fc7-89d91f54cc88\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9ae8cd39-e4a6-44ed-8c64-e2168642e63b/-/preview/-/format/jpg/","https://ucarecdn.com/563e9b93-4481-413a-8e32-5e5b361aa555/-/preview/-/format/jpg/","https://ucarecdn.com/443b613d-a4e3-45f4-8dd9-8bd11ff45e36/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"04ea9dc1-caca-4f62-8b22-dd16768773fc\"}"},{"__ref":"Education:{\"uuid\":\"51389e2f-f6c6-44b5-bb69-14766cc64108\"}"}],"hiredAt":"2023-04-06T23:18:28.719Z","topics":["6-8 Grade Science","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","History","Creative Writing","Music","Fashion / Cosmetics","Video / Photography","History Project","Film / Theater","K-6 Storybook","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/","htt
