5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c4517a79-268f-42f4-995a-922241eed48c\"}":{"__typename":"DeepDives","uuid":"c4517a79-268f-42f4-995a-922241eed48c","content":"\u003cp\u003eMentorship is super important to me because I understand the value of relationships and people that care about my success. There's so much to learn from a mentor that truly cares about your potential and you as a person. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e0718031-a0ac-41a5-9c6b-856e42267fc1\"}":{"__typename":"DeepDives","uuid":"e0718031-a0ac-41a5-9c6b-856e42267fc1","content":"\u003cp\u003eMy dream job is to be an entrepreneur or a film director. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b63526ff-f953-4741-b165-99ffb9ec15a2\"}":{"__typename":"Education","uuid":"b63526ff-f953-4741-b165-99ffb9ec15a2","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2025","major":"Environmental Engineering, Entrepreneurship","degree":"Bachelor of Science"},"School:{\"uuid\":\"70264558-5dba-426e-b671-ac84fb4c868a\"}":{"__typename":"School","uuid":"70264558-5dba-426e-b671-ac84fb4c868a","name":"Montgomery Bell Academy","city":"Nashville","type":"HIGH","state":"Tennessee","country":"United States","zip":"37205"},"Education:{\"uuid\":\"fea4a378-abd4-4d44-b218-93d9f9390c4e\"}":{"__typename":"Education","uuid":"fea4a378-abd4-4d44-b218-93d9f9390c4e","school":{"__ref":"School:{\"uuid\":\"70264558-5dba-426e-b671-ac84fb4c868a\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"2eb0dde9-2058-42e3-a866-e6eeb2dc92fa\"}":{"__typename":"MentorPublicProfile","uuid":"2eb0dde9-2058-42e3-a866-e6eeb2dc92fa","displayName":"Aidan N.","slug":"aidan-niswender","biography":"\u003cp\u003eHi! I'm Aidan, a student at the USC Viterbi School of Engineering in Los Angeles. I'm from Nashville, Tennessee, and I grew up as a lover of both art and science. While other students at my high school would play football, I would spend my time in the art studios, practicing painting, photography, filmmaking, and 2D design. This is where I really fell in love with art and began to consider its applications to science. My school experience has made me a design-thinker, and it is most definitely a skill that I would instill in any of my mentees. I went to a small, Catholic middle school where church was expected to be attended at least twice a week. This strict schedule has made me a more understanding and open-minded teacher and listener on the basis of religion, race, ethnicity, and other social demographics because I felt the lack of understanding in my education. For college, I left Nashville to head to the west coast to study engineering at the University of Southern California. There I pursued my interests in climate change technology, entrepreneurship, healthcare, and filmmaking. I was awarded a merit scholarship to attend USC, and since then I've worked on science projects like building devices to mitigate climate change in healthcare, as well as creative projects like shooting photos for National Geographic's magazine. I recently was admitted to Stanford to do a master's degree in environmental engineering. I also took up rock climbing, skiing, surfing, and hiking. My favorite thing to do in my free time is explore. I'm constantly asking my friends to go to Yosemite with me, and I love to explore the Los Angeles area on the weekends. I am notorious for going off the groomed path when I go skiing, and I just love to get lost in nature. My favorite book is The Elephant Vanishes, by Haruki Murakami, and I also have one other strange hobby: I make my own perfumes! I got really into it over COVID-19's peak, and I have made hundreds of fragrances for my family and friends, and plan to launch a business soon. The most important thing I care about as a mentor is establishing a personal relationship with my student. My goal is to have my students reach out, after our sessions, to either ask to learn more, or to set up more time to chat and learn about each other. I not only want to help other students learn, but I want to provide them the guidance in their careers that I did not have, so that they can not only be successful, but be successful doing the things that they are truly passionate about.\u003c/p\u003e","teachingVideoPlaybackId":"W12KirQU00rIkJyVbFJc8pro02N01Ajyw9IK9UL8bK62LA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environmental Engineering, Entrepreneurship","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"335baf26-abd3-4fb2-8f31-164a25974359\"}"},{"__ref":"DeepDives:{\"uuid\":\"c4517a79-268f-42f4-995a-922241eed48c\"}"},{"__ref":"DeepDives:{\"uuid\":\"e0718031-a0ac-41a5-9c6b-856e42267fc1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/eb8de8fb-5817-4626-aae7-659d4db7b93e/-/crop/623x624/0,110/-/preview/-/format/jpg/","https://ucarecdn.com/7f13ac0f-e1c0-41b7-b9e0-62ec6c5b75b0/-/preview/-/format/jpg/","https://ucarecdn.com/73a55e14-c45a-4b5f-8589-043a222e3d7f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gende
