MentorPublicProfile:{\"uuid\":\"feda803b-8605-461b-9b18-974a0d44a6f8\"}":{"__typename":"MentorPublicProfile","uuid":"feda803b-8605-461b-9b18-974a0d44a6f8","displayName":"Amarins L.","slug":"amarins-laanstracorn","biography":"Amarins Laanstra-Corn is a current sophomore at Stanford University studying International Relations with a focus on security and history. Her academic interests also include neuroscience, art history, psychology, and business. Previously she has held roles at the U.S. House of Representatives, Freedom House (a human rights and democracy NGO), the Lisbon Council (an EU-based economic think tank), and a cybersecurity and defense startup focusing on business development and growth strategy. Well at Stanford, Amarins additionally served as a research assistant for Professor James Fearon in the Center for International Security and Cooperation. There, she worked with data to understand, analyze, and dissect underlying trends of violence, particularly police brutality in Latin America and violence against women in western Africa. \n\nBeyond academics, Amarins has long been involved in the arts. Growing up, she studied various mediums of art practice and found herself wandering around museums and galleries for hours while her mother searched for her. She has assisted with curatorial work for local spaces, especially in collections that related to the intersection between activism and art. Recently, she was included in the student advisory group in the search for a new director and bettered practices for Stanford’s Cantor Museum. But most notably, Amarins has worked with Curious Cardinal students in dual art history and practice workshops on topics such as Jean Basquiat and Contemporary African American Art, Repetition and Motifs, and Self Portraits. \n\nLastly, she loves to laugh and dance around kitchens, long walks on the beach, soccer (Go Chelsea!), autobiographies, reading the NYT, traveling with no specific destination in mind, learning about emergent technologies, advocating for women’s rights, going to basketball games, listening to her friends talk their startups, and filling her home with flowers. ","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/302c377e-ebaa-4bf2-b343-86ec0d3b3d19/-/crop/692x691/0,116/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1c404e8d-bc3a-40f1-865c-81b1fa7daba9\"}"}],"hiredAt":"2021-09-10T15:07:33.000Z","topics":["Cooking","Creative Writing","STEM Project","Law / Government / Policy","Visual Arts / Graphic Design","Journalism","Economics","Global Health","History Project","Philosophy","History","Literature","Women \u0026 Gender Studies","Business / Entrepreneurship"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"amarins-laanstracorn\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"feda803b-8605-461b-9b18-974a0d44a6f8\"}"}}},"_sentryTraceData":"aaf9f18a686b4a9e84b62c50e15eb780-be481968c6377b91-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=aaf9f18a686b4a9e84b62c50e15eb780,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"amarins-laanstracorn"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataL
