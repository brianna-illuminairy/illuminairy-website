../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"24e39169-a7e4-42d3-a64d-f1d1ad436c97\"}":{"__typename":"DeepDives","uuid":"24e39169-a7e4-42d3-a64d-f1d1ad436c97","content":"\u003cp\u003eA year ago, at the club fair, I decided to try something new: fly fishing. I joined the club and learned how to tie flies that imitated small bugs in a local creek. The following weekend I went on a trip with my newfound friends to go fishing. I didn't catch anything, but I was hooked. I went again a few weeks later and, again, didn't catch anything. It was a long time before I caught my first fish! I relish the peace of mind and serenity that fly fishing offers me\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"eba51b0e-5ec3-4cbc-a7c3-409e6390fa42\"}":{"__typename":"DeepDives","uuid":"eba51b0e-5ec3-4cbc-a7c3-409e6390fa42","content":"\u003cp\u003eI chose my major because it makes me uncomfortable. In High School I was good at math and science, I wasn't good at writing. Upon arriving at Stanford I was determined to improve my writing. I took a class in philosophy without knowing what the word \"philosophy\" meant. I immediately fell in love with the kinds of texts I was reading. While I loved reading, I was still not satisfied with my writing. Over the next year I took more and more classes in literature and philosophy. As I got better at writing I enjoyed it more and more, eventually deciding to major in Comparative Literature!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"239d1b8c-0175-4bb3-a31d-e216aaecc16c\"}":{"__typename":"DeepDives","uuid":"239d1b8c-0175-4bb3-a31d-e216aaecc16c","content":"\u003cp\u003eIn my family, it is important in my family to be curious and ask questions; I try to bring this same attitude to my teaching style. I believe that I have as much to learn from my students as they have to learn from me. I constantly ask questions and push my students to evaluate their own reasoning when working through tough problems. I also believe that Jewish values of charity and compassion have guided me in finding common ground with my students while working toward a common goal.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"2028f5d4-474b-4a18-bf45-3453245b2f28\"}":{"__typename":"DeepDives","uuid":"2028f5d4-474b-4a18-bf45-3453245b2f28","content":"\u003cp\u003eI find that students who come to me often feel as though they are different or inadequate because they are receiving tutoring. I have learned through working with many students that this is never the case. Most students simply need a boost of confidence and some guidance on how to maximize their potential. Seeing students come to this realization is extraordinarily rewarding and why I keep coming back!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"077dc12b-385c-42d6-bfba-19b29ee2a993\"}":{"__typename":"Education","uuid":"077dc12b-385c-42d6-bfba-19b29ee2a993","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Comparative Literature","degree":"BA"},"School:{\"uuid\":\"f309c50f-b9a4-45eb-9811-bbf23d2a8d17\"}":{"__typename":"School","uuid":"f309c50f-b9a4-45eb-9811-bbf23d2a8d17","name":"Henry M Gunn High School","city":"Palo Alto","type":"HIGH","state":"California","country":"United States","zip":"94306"},"Education:{\"uuid\":\"2c17f01c-212f-4505-98c7-bede29381adb\"}":{"__typename":"Education","uuid":"2c17f01c-212f-4505-98c7-bede29381adb","school":{"__ref":"School:{\"uuid\":\"f309c50f-b9a4-45eb-9811-bbf23d2a8d17\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"f263e1f7-ef30-49a7-8c31-1a998cb1d0ed\"}":{"__typename":"MentorPublicProfile","uuid":"f263e1f7-ef30-49a7-8c31-1a998cb1d0ed","displayName":"Leo S.","slug":"leo-spunt","biography":"Leo is a Junior at Stanford University studying Russian Literature and Mathematics. Leo was born in Memphis, Tennessee and spent his childhood flying kites on the bluff or outside in the gardens at his Montessori School. Leo credits his love of learning and his student-centered teaching style to his primary education in a Montessori school where he mediated disputes at the peace table and performed science experiments of his choosing. Leo moved to Palo Alto, California when he was 12. \n\nIn high school, Leo participated in the chess club and was the captain of both the water polo and lacrosse teams. In the classroom, Leo loved every subject, but his weakest was reading and writing. Upon his arrival at Stanford, he decided to do what he was worst at to become a better overall student. He now primarily studies Classical Russian Literature and German Philosophy focused on the likes of Dostoevsky, Heidegger, Lermontov, and Bulgakov. He is fascinated by the intersection of philosophy, politics, and literature in the 19th and 20th centuries. When he's not reading or writing he can be found in math classes to broaden his intellectual horizons and improve his logical reasoning. Outside of the classroom, Leo writes and edits at two publications.\n\nFor fun, Leo is an avid poker player and placed 25th in the College World Series of Poker last year (despite being only 19 years old!). He also enjoys the outdoors and takes weekend trips to fly fish, car camp, and read in his hammock.\n","teachingVideoPlaybackId":"MA00aAfS26YW600OeNCMcHGrZ801mIsMaRgHxQ8nklGCjk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Comparative Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"24e39169-a7e4-42d3-a64d-f1d1ad436c97\"}"},{"__ref":"DeepDives:{\"uuid\":\"eba51b0e-5ec3-4cbc-a7c3-409e6390fa42\"}"},{"__ref":"DeepDives:{\"uuid\":\"239d1b8c-0175-4bb3-a31d-e216aaecc16c\"}"},{"__ref":"DeepDives:{\"uuid\":\"2028f5d4-474b-4a18-bf45-3453245b2f28\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/db997c6b-8e68-4683-83bb-b55bb51efc81/-/crop/2321x2323/0,79/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"077dc12b-385c-42d6-bfba-19b29ee2a993\"}"},{"__ref":"Education:{\"uuid\":\"2c17f01c-212f-4505-98c7-bede29381adb\"}"}],"hiredAt":"2023-03-15T18:01:48.159Z","topics":["Negotiation","History Project","Philosophy","Literature","Law / Government / Policy","World Cultures","Journalism","Public Speaking","Writing","Biology","Economics","Business / Entrepreneurship","Finance / Investing","STEM Project","6-8 Grade Science","Chemistry"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/c278d819-50e0-435a-a1b0-1b3a8793462f/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"leo-spunt\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f263e1f7-ef30-49a7-8c31-1a998cb1d0ed\"}"}}},"_sentryTraceData":"35fd98d88d6b4b92a3a6b43f87f51427-820a4b5638aeadbb-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-p
