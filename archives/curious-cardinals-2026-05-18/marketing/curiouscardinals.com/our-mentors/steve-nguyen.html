usiness Administration","degree":"Bachelor's"},"MentorPublicProfile:{\"uuid\":\"2667871a-460d-40a1-b3c5-736e4c3d6e7b\"}":{"__typename":"MentorPublicProfile","uuid":"2667871a-460d-40a1-b3c5-736e4c3d6e7b","displayName":"Steve N.","slug":"steve-nguyen","biography":"Hey there, I’m Steve ~(^-^)~! I love long division, making origami, 3-minute games of chess, a chaotic game of pickup soccer, and men's fashion/sneakers. \n\nI’m from Everett, MA a low-income community on the North Shore of Boston. I always pause in my intros to just mention how incredibly proud I feel about being from Everett. I wasn’t exposed to learning opportunities in tech until I got to college. My high school offered one single tech class where I learned to program Scratch games lol. I love my parents, they own a dry cleaner and pour their heart and soul into it, but they don’t know the first thing to teach me about tech. As a result, It’s been a long journey to get to where I’m at, where I feel comfortable walking in the world of tech + entrepreneurship. \n\nI most recently interned as a Technical Program Manager at ServiceNow where I built two internal Release Information dashboards for two engineering teams to optimize their release workflows. The summer before, I was the first product management intern at a health tech startup called Luma Health where I worked cross-functionally with engineering, design, and the UX team to deliver a product feature that detected over 75,000 duplicate patient records and provided a solution to merge them. Last semester I consulted on Marketing and Content for an audio startup called Elis, where I wrote a detailed research document on 10+ companies’ product launch strategies and built a cohort of content creators who created weekly audio content for the app.\n\nAt USC, I was most recently co-president of [Spark SC](http://sparksc.org), where we launched Trojan Marketplace(USC's first-ever student flea market which brought in on average $300 for 30~ student vendors), executed Startup Career Fair(where we brought in 10+ startups to USC to recruit students, with revenue of $2,000~), and Art, Grooves and Food(where we showcased student artists/performers to an audience of 150+). I also cofounded Quant SC, USC’s community for Quant enthusiasts, and led community there until my senior year. For funsies, you can find me booling at USC’s Vietnamese Student Association and playing blitz chess at Chess Club.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business Administration","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/28f04f4a-ff3b-4bcc-9b7d-9d5cb5db764d/-/crop/938x937/335,554/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"fb157430-5cbb-4bb1-9f24-919b7d240158\"}"}],"hiredAt":"2022-09-14T20:28:02.000Z","topics":["Public Speaking","Geometry","Negotiation","Business / Entrepreneurship","Finance / Investing","Precalculus / Trigonometry","Calculus","Algebra I","Statistics","Pre-Algebra","K-5 Grade Math","Economics","Algebra II"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"steve-nguyen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2667871a-460d-40a1-b3c5-736e4c3d6e7b\"}"}}},"_sentryTraceData":"fdc4493a1871445caca3d0bb65b371a7-9aa0d3fb367b8d82-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fdc4493a1871445caca3d0bb65b371a7,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"steve-nguyen"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","s
