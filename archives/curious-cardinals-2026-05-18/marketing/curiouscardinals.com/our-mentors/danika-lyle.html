l},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"471eba50-b3ac-4443-8dd6-5132249f8e99\"}":{"__typename":"Education","uuid":"471eba50-b3ac-4443-8dd6-5132249f8e99","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":"2022","expectedGradYear":"2022","major":"Film and Media Studies","degree":"BA"},"MentorPublicProfile:{\"uuid\":\"0a18ef76-5694-412a-b712-9d74753abe5d\"}":{"__typename":"MentorPublicProfile","uuid":"0a18ef76-5694-412a-b712-9d74753abe5d","displayName":"Danika L.","slug":"danika-lyle","biography":"\u003cp\u003eDani Lyle is a recent Stanford graduate with a BA in Film and Media Studies, with an emphasis in screenwriting, and currently lives in Los Angeles. She spent her Stanford days as Head Writer for the university’s premiere sketch comedy group and performing stand-up on campus, and now works at a video game startup while building a career in comedy and entertainment. With nearly a decade of experience in social media, Dani is passionate about helping students craft engaging online profiles, develop creative content, and grow an audience around their passions. She knows firsthand how rewarding—and challenging—it can be to chase a creative project while balancing school, work, and other responsibilities, and she loves helping students structure their ideas into tangible, exciting outcomes.\u003c/p\u003e\u003cp\u003eWhen she’s not managing projects at her startup or making sketches with friends for TikTok, Dani enjoys baking, attending open-mics, planning elaborately themed dinner parties, and brainstorming her next big film idea. She’s always fascinated by the ways creativity and technology intersect, whether that’s building a character that resonates across social platforms, designing content that reaches a niche audience, or helping a student launch a project with a real-world impact. On top of that -- Dani is a lifelong learner who loves school and is excited to dive into any subject that grows curiosity.\u003c/p\u003e\u003cp\u003eIf students aren’t focused on social media, Dani also thrives on helping them uncover what truly excites them and turn that spark into something meaningful. She loves guiding students through brainstorming, experimentation, and creative problem-solving, helping them define a clear vision for their project, set achievable milestones, and feel proud of the work they produce. For Dani, mentorship is about more than just skills—it’s about helping students gain confidence, explore new ideas, and see how their passions can inform both creative expression and personal growth.\u003c/p\u003e\u003cp\u003eCalifornia-raised (born in Los Gatos), Dani enjoys hiking, dancing, beach trips, and sunset pickleball. She is deeply committed to helping students find their voice, follow their curiosity, and have fun while building projects they’re excited about. Whether it’s growing an online presence, producing creative content, or launching a personal venture, Dani brings experience, energy, and genuine enthusiasm to help students bring their ideas to life.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Film and Media Studies","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/df8fe8cb-b813-4c7c-bd27-dc2853dd21e6/-/crop/707x708/0,7/-/preview/-/format/jpg/","https://ucarecdn.com/28cf42a2-967c-4e7f-8835-7c6aa5f6cc9a/-/preview/-/format/jpg/","https://ucarecdn.com/b2eb84a4-c2ff-48a3-b844-b8d6d68813f0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"638ae0b1-99d9-48e4-89a6-db0831b572bb\"}"},{"__ref":"Education:{\"uuid\":\"471eba50-b3ac-4443-8dd6-513224
