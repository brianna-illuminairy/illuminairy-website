"}":{"__typename":"Favorites","uuid":"e572e6e2-ceec-4f7d-bea1-c048a0d2fee9","photoUrl":"https://ucarecdn.com/f5f774cb-7f66-40d4-8817-608b62113e7d/","title":"Van Gogh","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7fdf9a97-fb3c-494a-9f22-2d73b476fa06\"}":{"__typename":"DeepDives","uuid":"7fdf9a97-fb3c-494a-9f22-2d73b476fa06","content":"\u003cp\u003eI really loved international relations because it offered an interdisciplinary education that dives into what happens in the world and why. Combining economics, political science, and history, you gain a range of perspectives and tools through which you can analyze and better understand the implications of current events and future trends. For me, this was the main pull: IR was a chance to begin lifelong learning about the decisions, impacts, and stories that matter most in our lifetime.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"85892af3-672f-4166-9d9a-ecaf01e59c26\"}":{"__typename":"DeepDives","uuid":"85892af3-672f-4166-9d9a-ecaf01e59c26","content":"\u003cp\u003eI love to spend time with my friends and move around, whether it's running, walking, (bad) dancing, or stretching.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"17be2ec6-9307-4173-acbf-a91eeec9ad90\"}":{"__typename":"DeepDives","uuid":"17be2ec6-9307-4173-acbf-a91eeec9ad90","content":"\u003cp\u003eI hope to one day write a book of my own!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9036acea-6776-4997-a4f9-a11140cc0f8d\"}":{"__typename":"DeepDives","uuid":"9036acea-6776-4997-a4f9-a11140cc0f8d","content":"\u003cp\u003eCarve out time and space to read and be alone with your thoughts. There's so much going on in this part of life, it's really important to take a step back and give oneself the opportunity to process stories about the world at a reasonable pace.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"6a408320-c2d2-4411-b0a8-6dd410ffd747\"}":{"__typename":"School","uuid":"6a408320-c2d2-4411-b0a8-6dd410ffd747","name":"Grand Junction High School","city":"Grand Junction","type":"HIGH","state":"CO","country":"US","zip":"81521"},"Education:{\"uuid\":\"291be978-c2fa-41de-8d72-f2aa4e3cd281\"}":{"__typename":"Education","uuid":"291be978-c2fa-41de-8d72-f2aa4e3cd281","school":{"__ref":"School:{\"uuid\":\"6a408320-c2d2-4411-b0a8-6dd410ffd747\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"9170f050-6519-4183-8db3-807e2d5765c6\"}":{"__typename":"Education","uuid":"9170f050-6519-4183-8db3-807e2d5765c6","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"International Relations","degree":"B.A."},"MentorPublicProfile:{\"uuid\":\"f02dec08-b1de-4faa-9811-4c692bb640a4\"}":{"__typename":"MentorPublicProfile","uuid":"f02dec08-b1de-4faa-9811-4c692bb640a4","displayName":"Tia S.","slug":"tia-sewell","biography":"\u003cp\u003eTia is a current student at Sciences Po's Paris School of International Affairs working towards a masters in international security with concentrations in intelligence and diplomacy. She received a degree in International Relations with a minor in Economics at Stanford University, graduating with distinction and completing an honors thesis which was awarded Stanford's Firestone Medal for excellence in undergraduate research. Tia has worked as an associate editor of Lawfare, a blog at the intersection of national security, law, and policy, and served as an intern for the U.S. delegation to the U.N. Security Council, among other research positions. She loves dogs, running, reading, yoga, and trying new restaurants with friends!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eFirestone medalist (awarded to the top 10 percent of theses in the social sciences at Stanford) for an honors thesis entitled \"The War Within: Perceived Legitimacy and Psychological Trauma Among Post-9/11 Veterans\"\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"dc845796-fa68-4a5d-9f7d-c2ee9a2ebc8c\"}"},{"__ref":"Favorites:{\"uuid\":\"f683cd17-4513-43e3-9575-fb2747b3e370\"}"},{"__ref":"Favorites:{\"uuid\":\"e572e6e2-ceec-4f7d-bea1-c048a0d2fee9\"}"}],"causesSupported":[],"major":"International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7fdf9a97-fb3c-494a-9f22-2d73b476fa06\"}"},{"__ref":"DeepDives:{\"uuid\":\"85892af3-672f-4166-9d9a-ecaf01e59c26\"}"},{"__ref":"DeepDives:{\"uuid\":\"17be2ec6-9307-4173-acbf-a91eeec9ad90\"}"},{"__ref":"DeepDives:{\"uuid\":\"9036a
