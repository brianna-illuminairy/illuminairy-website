\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6a5d85b8-8cd9-466a-b108-a27ab13904f8\"}":{"__typename":"DeepDives","uuid":"6a5d85b8-8cd9-466a-b108-a27ab13904f8","content":"\u003cp\u003eTo live life with more of an open mind! You never know what opportunity or experience will come your way!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"508d2090-8eb7-4bf2-80a8-97417a8f0a79\"}":{"__typename":"Education","uuid":"508d2090-8eb7-4bf2-80a8-97417a8f0a79","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Classics + Health and Human Biology","degree":"Bachelor of Arts"},"School:{\"uuid\":\"6e5e4e3d-6d56-4a03-9342-812d07108ece\"}":{"__typename":"School","uuid":"6e5e4e3d-6d56-4a03-9342-812d07108ece","name":"Trinity School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10075"},"Education:{\"uuid\":\"0d207df5-239d-4fb8-aeb6-7a7bcdb5987d\"}":{"__typename":"Education","uuid":"0d207df5-239d-4fb8-aeb6-7a7bcdb5987d","school":{"__ref":"School:{\"uuid\":\"6e5e4e3d-6d56-4a03-9342-812d07108ece\"}"},"startYear":"2006","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"9b7a850c-3428-40b3-8176-9aa089f45e06\"}":{"__typename":"MentorPublicProfile","uuid":"9b7a850c-3428-40b3-8176-9aa089f45e06","displayName":"Leyla G.","slug":"leyla-giordano","biography":"\u003cp\u003eLeyla is a recent graduate of Brown University with a Bachelor of Arts in both Classics \u0026amp; Health and Human Biology while also on the pre-medical track. Leyla is passionate about women's and children’s health in addition to being interested in global health issues surrounding disparities in the access to and quality of healthcare. Leyla has always loved learning about every subject and wants to pass on her passion for learning to her Curious Cardinals students!\u003cbr\u003e\u003cbr\u003eLeyla has been teaching and tutoring since her first year of high school, and she has loved it ever since. She has tutored children of all ages in all subjects, such as Math, Spanish, Latin. At Brown, she is a tutor with BRYTE, Brown Refugee Youth Tutoring and Enrichment program, and a teacher at the Wheeler School in Providence for all subjects. She has also tutored in Biology and Chemistry for 3 years. \u003cbr\u003e\u003cbr\u003eLeyla has worked in clinical research labs studying the predictors of adolescent obesity and pediatric asthma self-management intervention. Most recently, she has worked with a non-profit organization titled Health and Education for All (HAEFA), which provides free cervical cancer screenings, maternal care and on-site health treatment, immunizing children and adults, and education in nutrition and feminine health, and other areas of health education to refugees in Bangladesh. \u003cbr\u003e\u003cbr\u003eLeyla has been engaged in several advocacy groups at Brown, such as Circle of Women, which funds projects in developing countries to support girls’ education, Women’s Health Advocacy Group, which advocates for and educates individuals on the health and wellbeing of women in Providence and beyond, and Students for Saving Mothers, which helps eradicate preventable maternal deaths and birth-related complications in developing countries.\u003c/p\u003e","teachingVideoPlaybackId":"Vuv6IYAtToYssDinNBLxg38cy2QcgPz74GJqKNjlujk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI think my greatest achievement is my undergraduate thesis, titled \"An Analysis of the Management of Pregnancy and Antenatal Care in the Rohingya Refugee Camps in Cox's Bazar, Bangladesh.\" The thesis identified the existing resources and the gaps in the current state of antenatal care and proposed possible improvements in the Rohingya refugee camps in Bangladesh. I never thought I could write a piece like this, so never doubt yourselves!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"61209827-8784-4307-b005-3da23221ec8e\"}"},{"__ref":"Favorites:{\"uuid\":\"c70d6949-b617-4b02-bf8f-2844f83a8f65\"}"},{"__ref":"Favorites:{\"uuid\":\"c084e820-faa3-4eca-99fc-7f671b63d0df\"}"}],"causesSupported":[],"major":"Classics + Health and Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a8901ae8-1f12-4b4d-8b76-fa0a7ee50d93\"}"},{"__ref":"DeepDives:{\"uuid\":\"f6b0ea3a-8fbd-4223-a43d-72b2c259cecc\"}"},{"__ref":"DeepDives:{\"uuid\":\"66259d65-416d-4cba-9325-7378ee8b7ead\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a5d85b8-8cd9-466a-b108-a27ab13904f8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bbc6a8aa-6a0c-4614-ba2d-0859f988d653/-/crop/369x370/123,26/-/preview/-/format/jpg/","https://ucarecdn.com/62bc0b9b-2eaa-4e97-9dd5-2e6f76368f4a/-/preview/-/format/jpg/","https://ucarecdn.com/33bd9fd9-922f-41e5-b920-725a73ace2ca/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"508d2090-8eb7-4bf2-80a8-97417a8f0a79\"}"},{"__ref":"Education:{\"uuid\":\"0d207df5-239d-4fb8-aeb6-7a7bcdb5987d\"}"}],"hiredAt":"2022-07-22T03:07:09.000Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Chemistry","Biology","Spanish","Latin","Academic Coaching","College Essay Writing"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility"
