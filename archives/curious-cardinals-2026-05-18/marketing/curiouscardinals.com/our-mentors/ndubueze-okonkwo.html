ntorPublicProfile:{\"uuid\":\"c35164a1-f310-470c-807b-62a122e77612\"}":{"__typename":"MentorPublicProfile","uuid":"c35164a1-f310-470c-807b-62a122e77612","displayName":"Ndubueze O.","slug":"ndubueze-okonkwo","biography":"Ndubueze Tony Okonkwo is a Nigerian American Columbia college student who attended Chaminade highschool in Mineola, New York. During his highschool years he participated in Track and Field as a short distance sprinter where he began to develop a love for fitness. In highschool he also participated and served as the chief art editor for his school’s literary and art magazine and was the chief art editor for his school’s newspaper. Along with that he had the privilege to serve as the president of his school’s art club. Apart from art he also has a love for music which he fostered as an officer in his school’s glee club and a member of his school’s vocal chamber ensemble which performed at a number of esteemed concerts including but not limited to at NYAC and Carnegie hall. In his classes he also excelled finishing in the top 10 percent of his grade of 500 students. He is currently in his third year of college as a psychology major. He is also on a pre-med track being encouraged by his physician parents to pursue a career in health care. He hopes to give back by offering his services as a reconstructive plastic surgeon. To guide him towards this medical path Ndubueze has taken the time to assist his community in a number of ways during his college experience. He has spent time assisting in hospitals as both a student and an aid for rural hospitals in Wichita, Kansas as well as aiding his parents on mission trips to NIgeria to offer free medical care to the underprivileged civilians. In conjunction with his passion in medicine Ndubueze is also incredibly passionate about visual art and storytelling. He utilizes his gift in the arts to give back as well by participating as an educator in the Arts and Minds organization that hopes to combat the effects of
