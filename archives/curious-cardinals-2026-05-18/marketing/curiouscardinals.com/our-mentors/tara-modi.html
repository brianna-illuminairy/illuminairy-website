__typename":"Favorites","uuid":"eace9471-a10f-4168-8e11-5e263d266696","photoUrl":"https://ucarecdn.com/092099d5-d5db-4e8d-a1d5-e5ffaf6cd7d9/","title":"Big Hero 6","type":"MOVIE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"42ac531d-9751-489d-8c5e-87059183d33c\"}":{"__typename":"DeepDives","uuid":"42ac531d-9751-489d-8c5e-87059183d33c","content":"\u003cp\u003eI always gravitated towards assignments that involved some level of creativity or visual component, whether it was a poster about our favorite president or a cardboard tri-fold board about the Sustainable Development Goals. The enthusiasm and motivation I experienced while working on these types of assignments made me realize that I was really interested in studying a subject where I’d be able to use my creativity and think about how to execute it in a way that would serve a purpose. This realization during high school gave me clarity on choosing a major like design where I could explore a variety of media and create multiple types of projects that were all different from one another. Design is all about creating something that serves someone or something in your community. Ultimately, my major allows me to utilize my passion for creativity while problem-solving.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"4d6b1216-744d-44b4-8620-f7718673b4d2\"}":{"__typename":"DeepDives","uuid":"4d6b1216-744d-44b4-8620-f7718673b4d2","content":"\u003cp\u003eAs a biracial Asian American, I learned very early what it felt like to be different from others. At first, it was something that I felt self-conscious of, that I didn’t look like my peers and did not know if I was doing enough to connect with both of my cultures. There were moments when I didn’t feel Korean enough or I didn’t feel Indian enough, and balancing that as an American was confusing growing up. As I met new people who also came from various backgrounds with different heritages, I realized that everyone is different from one another in their own way and it’s actually a great thing. My initial self-consciousness evolved into a thoughtfulness towards others and helped me realize that everyone has a unique story, a realization I apply to my teaching style.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"4fffd084-c7df-40dd-93c8-17ec22f79e79\"}":{"__typename":"DeepDives","uuid":"4fffd084-c7df-40dd-93c8-17ec22f79e79","content":"\u003cp\u003eMy greatest role model is definitely my father, the bravest person I know. Growing up my dad assumed most of the responsibility of raising my brother and me, managing everything while working a full-time job after immigrating to the United States. I’m sure there were moments he felt clueless about what to do, but nevertheless, he persevered in the face of entirely uncharted territory. He definitely had moments when he felt overwhelmed but he always tried his best with a smile on his face. He is the one who taught me to always try new things even when I doubt myself and to approach new circumstances with an open mind.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"460264b7-bd26-4951-97d3-7c2e5c8277ca\"}":{"__typename":"DeepDives","uuid":"460264b7-bd26-4951-97d3-7c2e5c8277ca","content":"\u003cp\u003eI like hobbies that involve creativity to make things, as I definitely had a major DIY phase during middle school. While there were definitely moments where I have gotten ahead of myself, I also enjoyed the fact that I had the “do it yourself” mentality and looked forward to the accomplishments I made with it. Whether it was making jewelry, designing prints, or painting anything and everything, I enjoy activities with a process and an end result I can look forward to. It’s also why I like activities like baking or even simple things like reading or watching TV shows.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"1fdcf198-e23c-4aff-bbe1-c39c8b889b95\"}":{"__typename":"School","uuid":"1fdcf198-e23c-4aff-bbe1-c39c8b889b95","name":"Bergen County Technical High School","city":"Teterboro","type":"HIGH","state":"NJ","country":"United States","zip":"07608"},"Education:{\"uuid\":\"88a56014-e073-4cbc-9062-fc9c09357e4f\"}":{"__typename":"Education","uuid":"88a56014-e073-4cbc-9062-fc9c09357e4f","school":{"__ref":"School:{\"uuid\":\"1fdcf198-e23c-4aff-bbe1-c39c8b889b95\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"c6106995-0bdd-4c6b-b1f2-24884bf40626\"}":{"__typename":"Education","uuid":"c6106995-0bdd-4c6b-b1f2-24884bf40626","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Design \u0026 Humanities","degree":"Bachelors"},"MentorPublicProfile:{\"uuid\":\"665f5307-fa6d-4242-b52d-fc2323dbf436\"}":{"__typename":"MentorPublicProfile","uuid":"665f5307-fa6d-4242-b52d-fc2323dbf436","displayName":"Tara M.","slug":"tara-modi","biography":"Tara is a student at Carnegie Mellon University’s School of Design. Interested in pursuing Communications and Environmental Design, creativity has always been integral to her life. Growing up as a biracial Asian American, Tara’s background and culture constantly inspired her in her creative endeavors. While working on completing her portfolio, she was featured in the UK-based magazine “Middleground” for her artwork “What Meets the Eye?” And “International Beauty. She also worked with a high school student to conceptualize and design illustrations for a self-published anthology reflecting a teenager’s struggle with body image. \n\nAt Carnegie Mellon, Tara is a member of the Campus Design Committee of the American Marketing Association, responsible for creating logos and social media redesigns for various organizations on campus. Previously working at an art studio to help high school seniors create their art portfolios, she helped guide these students by assisting them during their process and helping them select which works to feature.\n\nTara is a firm believer in the idea that design and art are all around us. Previously working to organize an exhibition with her classmates at her senior art studio, she has worked with others to create a final exhibition piece and curate the works being featured. As a mentor at Curious Cardinals, she hopes to share her passion for art and design and inspire mentees to pursue their creative interests.","teachingVideoPlaybackId":"b7BNLWizMAF02mcOA9tidsM21ce31nxUqiv1ln02fszH00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1c7695c5-9c69-4070-b33d-cef03a249f12\"}"},
