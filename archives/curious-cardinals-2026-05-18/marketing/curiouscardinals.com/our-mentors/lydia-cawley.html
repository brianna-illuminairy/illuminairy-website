},"MentorPublicProfile:{\"uuid\":\"85f074aa-6ce1-493b-a26a-e30e8800e796\"}":{"__typename":"MentorPublicProfile","uuid":"85f074aa-6ce1-493b-a26a-e30e8800e796","displayName":"Lydia C.","slug":"lydia-cawley","biography":"Lydia received her Master’s from the University of Cambridge in 2021, where she earned a Distinction for her research on modern Arabic poetry adapted from ancient Greek tragedy. She studied Classics and Near Eastern Languages and Civilizations at Harvard, where she graduated summa cum laude in 2020. An avid linguist, Lydia is proficient in Arabic, French, Ancient Greek, and Latin, and loves discovering the connections between these languages and the history of the Mediterranean region, from ancient times to modern day.\n\nLydia grew up in Arlington, Virginia, but has taught writing, ancient literature, archaeology, art, and mythology across the world. She has worked in the Cultural Section of the U.S. Embassy in Algiers, Algeria, and developed student programming materials for museums in Washington, DC and Amman, Jordan. She believes that the arts and humanities should be accessible to all students, no matter their background. At Harvard, she tutored undergraduates in academic writing, and in high school she developed and taught an after-school program about the ancient world for elementary and middle-school students. Lydia is happiest when traipsing about ruined ancient sites, spending too long in art museums, and searching for the best vanilla iced latte wherever she visits!\n\nAt Curious Cardinals, Lydia is eager to teach subjects which touch on literature, language, history, and world cultures. Above all, she is keen to learn from her students and their fresh perspectives, and to engage their passions!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/6f8dba78-0a96-4f5f-9700-c102e0743330/-/cro
