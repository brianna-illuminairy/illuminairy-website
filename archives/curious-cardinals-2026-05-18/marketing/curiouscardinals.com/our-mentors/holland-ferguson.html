MentorPublicProfile:{\"uuid\":\"c7c71d26-cbdb-4bb4-9cdd-f997faabd79c\"}":{"__typename":"MentorPublicProfile","uuid":"c7c71d26-cbdb-4bb4-9cdd-f997faabd79c","displayName":"Holland F.","slug":"holland-ferguson","biography":"Holland Ferguson is pursuing a major in Aeronautics and Astronautics at Stanford University. Her academic interests also include electrical engineering, biology (particularly ecology), mathematical computational science, and music. At Stanford, outside of classes, Holland is currently involved in the Stanford Space Initiative’s Liquid Propulsion and Satellite Avionics teams. In addition, she also recently joined the Stanford Solar Car Aeronautics team. Before attending Stanford, Holland took a gap year where she interned with SpaceX’s Flight Reliability Team for eight months and helped conduct coral bleaching research as a dive assistant in partnership with the Seychelles National Parks Association. Holland has also interned for the drone company FlightWave and rocket launch company SpinLaunch. In addition to graduating Cum Laude from Greenwich Academy in 2020, Holland received multiple awards from the school and town of Greenwich for her contributions to the community and to the performing arts. During high school, Holland was involved in many activities aimed at promoting women in STEM fields. Upon noticing a lack in her school’s physics and engineering curriculum, Holland founded the school’s first rocketry team to compete in a national rocketry competition, the Team America Rocketry Challenge. In addition, she also developed and taught two engineering classes for middle school girls focused on the basics of circuitry and designing/3D printing model rockets. When she is not working on her newest engineering project, Holland enjoys scuba diving, singing, hiking, and watching animal documentaries. At Curious Cardinals, Holland is excited to share her love of all things engineering and inspire her students to reach their full potential!","teachingVi
