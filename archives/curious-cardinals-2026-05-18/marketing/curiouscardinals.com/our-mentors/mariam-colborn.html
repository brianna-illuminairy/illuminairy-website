../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"803c8e16-0ec1-4a6f-adbe-b6d107c07b8c\"}":{"__typename":"DeepDives","uuid":"803c8e16-0ec1-4a6f-adbe-b6d107c07b8c","content":"\u003cp\u003eWhile taking physics in high school, I fell in love with the process of designing and constructing class projects. My favorite subject is math, so being able to see its applications in a tangible product that I had created was really satisfying and rewarding, and infusing my own creativity into a design made me even more excited. Over the Covid pandemic, I decided to learn more about mechanical engineering and design to see if it would be something I'd be interested in. In my free time, I worked on mini projects like building a clothes rack or a mechanical movie prop, and I found a lot of enjoyment in being able to try making whatever I had wanted.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAs a mechanical engineering major, I love the trial and error that comes with working on a project. The mutual struggle I share with my teammates and eventual success we achieve forms strong friendships that I hold very dear. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"153dc602-0e5f-49fb-b91c-05cee94cc41f\"}":{"__typename":"DeepDives","uuid":"153dc602-0e5f-49fb-b91c-05cee94cc41f","content":"\u003cp\u003eI would tell myself that it is ok to be my most authentic self. Moving middle schools created a lot of stress and anxiety for me as I struggled to make new friends—I tended to overthink everything in my life, and l was so focused on what I should be or wanted to be, instead of what I actually am. As I transitioned to high school, I was able to let go of these feelings more and start doing the things I wanted to do. It didn't only make me happier, but it also helped me mature and feel more grounded in myself.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eBeing true to yourself and your own values and needs, whether it's pursuing an interest of yours that people might think is \"weird,\" or not wanting to do something the rest of the crowd wants to do, is completely valid. Acting as your most authentic self can only help you down the line, and gives you the strength to get through challenges throughout high school, college, and beyond.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f877f0a7-b9e0-432c-b248-203bcae9fad1\"}":{"__typename":"DeepDives","uuid":"f877f0a7-b9e0-432c-b248-203bcae9fad1","content":"\u003cp\u003eMentorship is important to me because there have been too many times where a topic in class is unnecessarily difficult or confusing, creating a lot of stress as I try to keep up with assignments while having to reteach concepts to myself. It can be very frustrating!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I want to help avoid this as much as possible by reframing a topic in the way it makes most sense to a student so they can conceptually understand. I deeply understand the stress and frustration that comes with \"not getting things,\" so it's important to me that I can help others avoid the feeling because trust me, I get it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ba4cc03d-28f9-44e0-bd3a-bbe90e1fb3f2\"}":{"__typename":"DeepDives","uuid":"ba4cc03d-28f9-44e0-bd3a-bbe90e1fb3f2","content":"\u003cp\u003eI love the arts— I am a filmmaker and musician, and I appreciate all realms of art and art practice. In my free time, I enjoy producing short films with friends or with Stanford's film club, as well as jamming out with bandmates or going to concerts. Lately, I've been interested in producing my own video edits and music to create promos for different sports teams and student clubs on campus! I also enjoy DJing for fun and often go to parties or social events to relax after a long day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"8faed7a8-1ef2-46db-80ef-cffd69c1f0b1\"}":{"__typename":"School","uuid":"8faed7a8-1ef2-46db-80ef-cffd69c1f0b1","name":"Canyon Crest Academy","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92130"},"Education:{\"uuid\":\"65d88465-4b74-47d7-b606-1893ad519c57\"}":{"__typename":"Education","uuid":"65d88465-4b74-47d7-b606-1893ad519c57","school":{"__ref":"School:{\"uuid\":\"8faed7a8-1ef2-46db-80ef-cffd69c1f0b1\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d625da17-26ca-44f5-bd7b-93ad5958038d\"}":{"__typename":"Education","uuid":"d625da17-26ca-44f5-bd7b-93ad5958038d","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":"BS"},"MentorPublicProfile:{\"uuid\":\"29e1901a-0241-44d7-bfff-ee969b85aa5b\"}":{"__typename":"MentorPublicProfile","uuid":"29e1901a-0241-44d7-bfff-ee969b85aa5b","displayName":"Mariam C.","slug":"mariam-colborn","biography":"\u003cp\u003eHi! I'm Mariam, a junior undergraduate student at Stanford studying mechanical engineering. I live in San Diego with my mom, older sister, and our two Bengal cats, and I love to spend time outdoors and surfing at the beach. At school, you can find me writing comedy pieces for stand-up shows or DJing a party! I’m also a filmmaker and musician (I play cello, bass, and guitar), and am minoring in both film and music through an interdisciplinary arts minor. I love combining art and STEM in my engineering projects, and hope to one day work in a creative and hands-on engineering role that contributes to positive change. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI discovered my excitement for tutoring in high school: I was a teacher’s assistant (TA) for an AP Calculus BC class, and frequently taught lectures to the class in my teacher’s absence. Being a TA showed me that conventional classrooms only take one approach to teaching a subject; in reality, math exists in the world in a variety of ways, so I realized I could teach it in a variety of ways. The ability to enhance someone’s conceptual understanding of a topic was beyond gratifying and ignited a spark in me that wanted to continue teaching students. I believe anyone can learn anything with an explanation that works best for them, which I’ll be sure to help you find! Whether it’s math, engineering, or art, I hope I can be of help to you in your learning journey!\u003c/p\u003e","teachingVideoPlaybackId":"QzImhK6vLRcU3X016noL01RXUie9kLD4Zqbk8Ts7UfkEE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"803c8e16-0ec1-4a6f-adbe-b6d107c07b8c\"}"},{"__ref":"DeepDives:{\"uuid\":\"153dc602-0e5f-49fb-b91c-05cee94cc41f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f877f0a7-b9e0-432c-b248-203bcae9fad1\"}"},{"__ref":"DeepDives:{\"uuid\":\"ba4cc03d-28f9-44e0-bd3a-bbe90e1fb3f2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/862f38d5-52e9-461f-b1e5-1f732e60ec17/-/crop/653x653/163,0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"65d88465-4b74-47d7-b606-1893ad519c57\"}"},{"__ref":"Edu
