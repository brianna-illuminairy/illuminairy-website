name":"Favorites","uuid":"f1e768ff-db25-4807-af24-a771a11db719","photoUrl":"https://ucarecdn.com/35862001-d99e-4095-9b5a-ba463d153b87/","title":"Paris","type":"CITY"},"CausesSupported:{\"uuid\":\"76b65546-6754-41fb-ae86-80d450d1ae4d\"}":{"__typename":"CausesSupported","uuid":"76b65546-6754-41fb-ae86-80d450d1ae4d","name":"Samaritans, Inc.","description":"\u003cp\u003eSuicide prevention line. Phone responder (3yrs), fundraising via NYC marathon'23\u003c/p\u003e","photoUrl":"https://ucarecdn.com/0669b63b-d587-4b3c-943e-91430cc8a579/"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6efecd30-769f-4535-bba0-39b331fa4a1d\"}":{"__typename":"DeepDives","uuid":"6efecd30-769f-4535-bba0-39b331fa4a1d","content":"\u003cp\u003eHaving attended a rigorous high school and played several sports competitively, for me the summers of my high school years were some of the times I most looked forward to for exploring other areas of passion! While several weeks were always dedicated to various sports camps for training or preparing for the high school season, I also sought out opportunities to push myself personally by either joining the work of existing organizations or tackling self-led projects. Some examples from my junior summer include: \u003cbr\u003e*\u003cem\u003e Volunteering in Nicaragua with Soccer Without Borders\u003cbr\u003e* Founding the Boston Chapter of Kids Tales, a creative-writing workshop for underserved communities\u003cbr\u003e* Traveling to Guyana (South America) to work the Ministries of Health and of Education to implement a youth-centric suicide prevention program\u003cbr\u003e\u003c/em\u003e* \u003cem\u003eWriting a 200-page fiction manuscript\u003c/em\u003e\u003cbr\u003e\u003cbr\u003eI love helping mentees figure out what they're passionate about and then combine those passions with service to have a positive impact! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"dda3a55e-4bcb-476b-b5a1-2409645ab9f7\"}":{"__typename":"DeepDives","uuid":"dda3a55e-4bcb-476b-b5a1-2409645ab9f7","content":"\u003cp\u003eShine as brightly as you can. The only true failure is the failure to learn from mistakes. Nobody has it all figured out. Feel fiercely and love openly. Drink a lot of water. People that speak badly about others probably speak badly about you as well. Your family will love you no matter what. Floss. Habits take 30 days. Love your body for what it can do, not for what it does or doesn't look like. Only boring people get bored; the next adventure is right around the corner if you can dream of it. Nothing is out of your reach. Time passes so fast... appreciate every second of it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"8dff9b2b-13d9-4ff2-9961-1a7debf39502\"}":{"__typename":"Education","uuid":"8dff9b2b-13d9-4ff2-9961-1a7debf39502","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Public Policy","degree":"BA"},"School:{\"uuid\":\"77022f07-5387-4ca9-8ad2-842248a14175\"}":{"__typename":"School","uuid":"77022f07-5387-4ca9-8ad2-842248a14175","name":"Buckingham Browne \u0026 Nichols Upper School","city":"Cambridge","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"a8556530-5c25-4081-837f-bfbe87f77246\"}":{"__typename":"Education","uuid":"a8556530-5c25-4081-837f-bfbe87f77246","school":{"__ref":"School:{\"uuid\":\"77022f07-5387-4ca9-8ad2-842248a14175\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"7d546cfc-7801-417d-8328-cf7e2388a92c\"}":{"__typename":"MentorPublicProfile","uuid":"7d546cfc-7801-417d-8328-cf7e2388a92c","displayName":"Mila C.","slug":"camilla-camargo","biography":"\u003cp\u003eMila is a Boston, Massachusetts native who has recently graduated from Stanford University with a Bachelors in Public Policy, a minor in International Relations, and a Masters in Public Policy. Academically, Mila is interested in economics, writing, and making an impact. Aside from her classes, Mila led the Stanford Spanish tutoring team and played on the Women’s Club Soccer team. She also participated in Stanford Women in Design, Stanford Women in Politics, and SENSA (Stanfords Social Impact Entrepreneurship group). Mila has interned at Facebook (now Meta), Amazon, and Bain \u0026amp; Co. in roles ranging from sales and advertising to finance to general management consulting. This fall, Mila will be moving to New York City to start working full-time at Bain \u0026amp; Co. as an Associate Consultant. \u003cbr\u003e\u003cbr\u003eWhen she isn't studying, Mila enjoys going on hikes with her friends, baking yummy treats, and curling up with a good book.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhen I think of pride, the first thing that comes to mind is my family. I am so unbelievably proud of each and every one of them, and the massive jumble of love that I was fortunate to grow up in. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b67a275f-3628-4f03-9fc1-35c074ce08a7\"}"},{"__ref":
