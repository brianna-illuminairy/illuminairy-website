__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ffea0d34-9e54-44d1-b6bb-f3afc0cdee7c\"}":{"__typename":"DeepDives","uuid":"ffea0d34-9e54-44d1-b6bb-f3afc0cdee7c","content":null,"videoPlaybackId":"x2VNjGYA4mJz75Bou4goSfOBCQpgyzy02qywLxGI02J4w","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2ff0550b-39c7-4e2d-9ce2-f6b8256a1285\"}":{"__typename":"DeepDives","uuid":"2ff0550b-39c7-4e2d-9ce2-f6b8256a1285","content":null,"videoPlaybackId":"qNxhy5iDTEpglU7tvyLgzK01IDEwI90266AQHxNOqjoIo","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"dee7d810-a68f-4fac-86ca-ab41975ae64f\"}":{"__typename":"DeepDives","uuid":"dee7d810-a68f-4fac-86ca-ab41975ae64f","content":"\u003cp\u003eWhen it comes to role models and mentors, I draw inspiration from various sources. One person who has greatly influenced me is Sheryl Sandberg, the Chief Operating Officer of Facebook. Her leadership, resilience, and commitment to empowering women in the tech industry have been truly inspiring. Sandberg's advocacy for diversity and inclusion resonates with me as a minority student in the field of computer science. Her success story and dedication to making a positive impact serve as a guiding light for me.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eBut we are missing a lot of black mentors. Having someone that looks like you providing expertise, support, and encouragement is instrumental in any persons’ academic and personal growth.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOverall, I am motivated by my thirst for knowledge and the desire to make a difference in the world, and I find inspiration in the achievements and guidance of individuals like Sheryl Sandberg and my mentors at Duke University.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"d0db357b-b3da-4c98-a478-48de43dfe8e6\"}":{"__typename":"Education","uuid":"d0db357b-b3da-4c98-a478-48de43dfe8e6","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science","degree":"BA "},"School:{\"uuid\":\"aa381120-060f-43fe-b143-9c465ea64726\"}":{"__typename":"School","uuid":"aa381120-060f-43fe-b143-9c465ea64726","name":"DuPont Manual High School","city":"Louisville","type":"HIGH","state":"Kentucky","country":"United States","zip":"40208"},"Education:{\"uuid\":\"163713e2-d0cf-4e61-a289-d99290c39aa9\"}":{"__typename":"Education","uuid":"163713e2-d0cf-4e61-a289-d99290c39aa9","school":{"__ref":"School:{\"uuid\":\"aa381120-060f-43fe-b143-9c465ea64726\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"40deca7e-8cf4-4654-8504-fce9fb4c9bac\"}":{"__typename":"MentorPublicProfile","uuid":"40deca7e-8cf4-4654-8504-fce9fb4c9bac","displayName":"Franck T.","slug":"franck-temgoua","biography":"\u003cp\u003e“If you want to go fast, go alone. If you want to go far, go together.”\u003c/p\u003e\u003cp\u003eHello! My name is Franck Temgoua. I’m a Duke University graduate in Computer Science with a minor in Finance, recently working as a Business Analyst at McKinsey \u0026amp; Company. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in Louisville, Kentucky, and a big part of my journey has come from understanding how much the right mentorship, exposure, and encouragement can change someone’s direction early in life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy background combines technology, leadership, entrepreneurship, and community building. At McKinsey, I’ve worked on AI and digital transformation initiatives across fintech and sales organizations, helping lead projects that impacted thousands of users and improved operational systems at scale. Before that, I founded Bull Dreams Collide, a creative platform that generated over $10,000 in sales while helping artists and creators turn ideas into real products and collaborations. I’ve also led student investment initiatives, worked with startups through Venture First, and participated in mentorship and leadership organizations focused on supporting minority students and future professionals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat motivates me most is helping students build confidence early — not just academically, but in how they think, communicate, and approach opportunities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHow I Plan on Making the Time:\u003cbr\u003eI take mentorship seriously, and I plan to approach it with structure and consistency. Throughout college, athletics, entrepreneurship, internships, and now consulting, I’ve learned how to balance demanding commitments while staying dependable to the people counting on me. Mentorship will be a real priority in my schedule, not something treated casually.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHow I Will Be the Driver:\u003cbr\u003eI believe students grow best with accountability, direction, and consistency. I plan to lead regular structured meetings focused on clear goals and steady progress. Whether it’s academics, confidence building, communication skills, leadership development, or career exposure, I want every session to feel productive and meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHow I Will Deliver Results:\u003cbr\u003eMy goal is to create measurable growth over time through practical guidance and consistent support. Students will gain exposure to real-world thinking, leadership habits, and problem-solving skills that extend beyond the classroom.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome of the ways I plan to deliver results include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eSetting clear short-term and long-term goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTracking progress through regular check-ins\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelping students strengthen communication and confidence\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIntroducing students to technology, business, entrepreneurship, and leadership pathways\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching practical problem-solving and critical thinking skills\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating accountability while still keeping mentorship approachable and supportive\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eHow I Will Ensure This Is Fun and Exciting:\u003cbr\u003eI want mentorship to feel engaging, personal, and motivating — not like another lecture. Whether we’re talking about sports, technology, music, career goals, or life experiences, I want students to feel comfortable being themselves while staying excited about improving and growing. My goal is to create an environment where students feel supported, challenged, and optimistic about their future.\u003c/p\u003e","teachingVideoPlaybackId":"oowG00ojk006IfRqku02XzTMUlYnP8MAnvmNqMKgvdHi9U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepD
