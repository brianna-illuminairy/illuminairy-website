9c-45097175d98e\"}":{"__typename":"Favorites","uuid":"c31fbeb3-34c2-4992-919c-45097175d98e","photoUrl":"https://ucarecdn.com/8a815579-c2be-4c19-b44d-ef21f73bf291/","title":"Yorushika","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fbd0e6c9-ead7-43d2-af6f-3be0d1ed3c92\"}":{"__typename":"DeepDives","uuid":"fbd0e6c9-ead7-43d2-af6f-3be0d1ed3c92","content":"\u003cp\u003eI was actually originally a biology major, focusing on Astrobiology. I wanted to be an Astronaut as a kid, and worked on rocket building competitions throughout my highschool career. I even was offered an internship at NASA once I hit college. In college, I double majored in Game Design and Biology, because I've always loved games, and soon discovered I liked making games more than playing them. I ultimately chose going down the Game Development route as I realized I wanted to express myself creatively more than anything else, and creating experiences in an interactive medium was the best way to do so.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef\"}":{"__typename":"School","uuid":"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90089"},"Education:{\"uuid\":\"3882bee4-314f-412b-99ba-c0b994d6cb1f\"}":{"__typename":"Education","uuid":"3882bee4-314f-412b-99ba-c0b994d6cb1f","school":{"__ref":"School:{\"uuid\":\"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":"2021","major":"Interactive Media and Game Design","degree":"Bachelor's"},"School:{\"uuid\":\"661a9dc6-5201-401f-9770-b207e504f786\"}":{"__typename":"School","uuid":"661a9dc6-5201-401f-9770-b207e504f786","name":"Irvine High School","city":"Irvine","type":"HIGH","state":"California","country":"United States","zip":"92604"},"Education:{\"uuid\":\"6a0dedfa-4ade-41a2-8890-c22fb25a50a5\"}":{"__typename":"Education","uuid":"6a0dedfa-4ade-41a2-8890-c22fb25a50a5","school":{"__ref":"School:{\"uuid\":\"661a9dc6-5201-401f-9770-b207e504f786\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"b101a61b-0b06-44db-91f3-3e9b66c40cbd\"}":{"__typename":"MentorPublicProfile","uuid":"b101a61b-0b06-44db-91f3-3e9b66c40cbd","displayName":"Meha M.","slug":"meha-magesh","biography":"Meha has recently graduated USC's Game Design program, ranked #1 in the country. She now works on games that reach millions of players at Activision. In her free time, Meha collaborates with fellow game industry professionals on personal projects, game jams, and playing games like Overwatch, Minecraft, and games from the Legend of Zelda series. \n\nMeha has plenty of experience teaching K-12 students, and started her own tutoring business for kindergarteners when she was in middle school. Since, then, she's been involved in various projects teaching students of all ages various subjects, from astrobiology to computer science. Meha recognizes that every student is different, and has unique needs and require different teaching styles. She is a highly flexible mentor, and always tailors her methods based on the students individual needs and goals.\n\nDuring highschool, Meha was interested in participating in as many clubs and classes she could fit in her schedule. She was part of her schools CubeSat program, which was an organization that works with NASA to build and launch a mini satellite in to space. She was also president of her local Art Club, and spearheaded the GoMonster project, where kindergarten students designed creatures that then more advanced high school artists drew in their own unique art styles to give back to the kids. She also has taken a sailing course, where her final was navigating a sailboat to Catalina Island.\n\nMeha recently graduated from University of Southern California's Game Design program, which is ranked #1 in the country. She was accepted into a cohort of 17 other game design students, all with varying backgrounds, skills and achievements. With an acceptance rate more selective than Harvard, the program led her through the ins and outs of game development, from making board games from scratch to publishing a game as a senior capstone project. Meha actually started off double majoring in environmental biology along with her game design track, even working for a Microbiology Lab on campus and being offered an internship at JPL's Astrobiology Lab. She has now fully committed myself to game development, and works at Activision Blizzard, who you might know for making games like Call of Duty, Crash Bandicoot 4, Overwatch, and World of Warcraft, among others. ","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b4254234-c7ae-4f99-9eb7-aa13d53079ab\"}"},{"__ref":"Favorites:{\"uuid\":\"23ede976-5050-48cc-accc-2014f7552b1c\"}"},{"__ref":"Favorites:{\"uuid\":\"c31fbeb3-34c2-4992-919c-45097175d98e\"}"}],"causesSupported":[],"major":"Interactive Media and Game Design","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fbd0e6c9-ead7-43d2-af6f-3be0d1ed3c92\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f9d0c28d-df81-42b9-9765-ae640ffcec9f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3882bee4-314f-412b-99ba-c0b994d6cb1f\"}"},{"__ref":"Education:{\"uuid\":\"6a0dedfa-4ade-41a2-8890-c22fb25a50a5\"}"}],"hiredAt":"2023-01-20T19:23:41.000Z","topics":["Game Design","Biology","Visual Arts / Graphic Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_Q
