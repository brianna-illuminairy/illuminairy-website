../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"83ecd5a8-00cd-47d0-9549-d0e9dfddfb01\"}":{"__typename":"Favorites","uuid":"83ecd5a8-00cd-47d0-9549-d0e9dfddfb01","photoUrl":"https://ucarecdn.com/e2d4b726-4338-4106-8b60-7edfe4957d01/","title":"Eloise","type":"ARTIST"},"Favorites:{\"uuid\":\"8ba2015a-4d78-480d-9937-0071913aa6ab\"}":{"__typename":"Favorites","uuid":"8ba2015a-4d78-480d-9937-0071913aa6ab","photoUrl":"https://ucarecdn.com/1d1b3843-83af-4eae-bccc-d04b4b31cc40/","title":"The Seven Husbands of Evelyn Hugo","type":"BOOK"},"Favorites:{\"uuid\":\"621908cd-d39a-430a-8994-872a12d63825\"}":{"__typename":"Favorites","uuid":"621908cd-d39a-430a-8994-872a12d63825","photoUrl":"https://ucarecdn.com/3250415c-f54b-468d-9816-c69572ab66c5/","title":"The Sign in Sidney Brustein's Window","type":"PLAY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e5405249-a2e7-4221-8a51-cd92f914008b\"}":{"__typename":"DeepDives","uuid":"e5405249-a2e7-4221-8a51-cd92f914008b","content":"\u003cp\u003eI would tell my middle \u003cem\u003eand\u003c/em\u003e high school selves to stay true to themselves (..ourselves?)! This isn't only about following your gut when it's chasing something good, but trusting yourself if you feel you shouldn't do something – and learning to be comfortable saying \"no\". Life is a huge journey full of countless paths to explore. It's taken college for me to realize that I spent so much time going down paths that I knew wouldn't fulfill me, waiting for someone to affirm that my gut was right all along. And turns out... that \"someone\" was me! I would tell myself to listen to my body, my mind, and my heart, so I never stop exploring those paths that light me up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"30ceb033-6b77-4969-915a-37cc6a9e99a0\"}":{"__typename":"DeepDives","uuid":"30ceb033-6b77-4969-915a-37cc6a9e99a0","content":"\u003cp\u003eHmmm:\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e- I'm incredibly unathletic but an excellent skier (my dad grew up in Colorado and taught me everything I know)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- I used to be terrified of swimming tests at summer camp and still can barely float on my back\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- I'm queer! \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- I have a younger sister, two dogs, and a pet rabbit \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- I would spend my whole life traveling if I could\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- My biggest fear is birds (sigh)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- I try to write a song every day\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e...And so much more that you'll have to find out! Humans are extremely complex puzzles, and our unique layers make us who we are. I can't wait to see what we have in common, and how we fit together :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c66a052b-2c18-45c9-b158-0c1a80f8e4e7\"}":{"__typename":"DeepDives","uuid":"c66a052b-2c18-45c9-b158-0c1a80f8e4e7","content":"\u003cp\u003eFor a multitude of reasons, I've always wished I had a mentor growing up. Most generally, this world is huge and sometimes overwhelming! I still find it difficult to focus on new information or digest things I learn in class –\u0026nbsp;even the things I'm most passionate about –\u0026nbsp;without decompressing first. I would've loved to have a space where I could do just this with someone, let everything out and \u003cem\u003ethen\u003c/em\u003e begin to take in something new, especially with someone closer to my age than a professor. So, being able to be that person for someone is really a dream come true! As much as the mentees are getting out of their mentorship, I am simultaneously making my inner child happy :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"df1bd4c6-62e7-44e2-9305-50b63b3f17f2\"}":{"__typename":"DeepDives","uuid":"df1bd4c6-62e7-44e2-9305-50b63b3f17f2","content":"\u003cp\u003eMy heritage and identity do not only impact my teaching style but the way I approach everything. As someone who is very mixed, my whole life has been people (wrongly) guessing my ethnicity, trying to pigeonhole me into their preconceived boxes of identity. Almost nothing has felt as bad as being told what I am and am not, or that if I'm \"enough\" of one part of me, I'm lacking in all the others. Therefore, I always lead with openness and listening. Beyond just hearing what people say, it is crucial to intentionally \u003cem\u003elisten\u003c/em\u003e to what the things they say mean to them. Identity is sacred. Having been made to feel like mine is not, I prioritize creating a comfortable, trusting space over everything. There's nothing without trust, especially not meaningful learning. I hope as a mentor I intertwine inspiring mentees' curiosity with helping them feel most comfortable in their skin. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"7c9ab257-3dae-4d80-919c-5c35b70877b3\"}":{"__typename":"Education","uuid":"7c9ab257-3dae-4d80-919c-5c35b70877b3","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Sociology - Music Concentration","degree":"BA"},"School:{\"uuid\":\"0072eaca-f18e-4553-96e4-9145769f0bd7\"}":{"__typename":"School","uuid":"0072eaca-f18e-4553-96e4-9145769f0bd7","name":"Nyack High School","city":"Nyack","type":"HIGH","state":"New York","country":"United States","zip":"10960"},"Education:{\"uuid\":\"051e38a9-8105-4dc1-85c1-b416ff03cd9c\"}":{"__typename":"Education","uuid":"051e38a9-8105-4dc1-85c1-b416ff03cd9c","school":{"__ref":"School:{\"uuid\":\"0072eaca-f18e-4553-96e4-9145769f0bd7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"Testimonial:0df7dada-36a1-4cfd-9374-e6f73990a842":{"__typename":"Testimonial","id":"0df7dada-36a1-4cfd-9374-e6f73990a842","text":"We are fortunate to be matched with Lula, who has been such a positive inspiration and influence to Phoebe's growth the past 7 months. Without Curious Cardinal, it'd be hard to imagine we can find a compatible mentor like lula.","date":"2025-06-04 23:11:01.968+00","rating":5,"endorser":{"__typename":"Endorser","name":"Eva Woo","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"4541f6b2-feb4-4688-9047-2dda01b65ac4\"}":{"__typename":"MentorPublicProfile","uuid":"4541f6b2-feb4-4688-9047-2dda01b65ac4","displayName":"Lula T.","slug":"lula-talenfeld","biography":"\u003cp\u003eLula is a senior at Yale majoring in Sociology with a concentration in Music and a minor in Education Studies. She loves all kinds of writing – music, poetry, journalism, creative fiction, etc. – and can often be found taking the train into NYC with her favorite novel or journal in hand. Otherwise, she’s probably singing in the kitchen, or sitting at the piano with her dogs nearby. At Nyack High School, Lula balanced her time between academics, music, and being the editor-in-chief of her school’s newspaper. She was fortunate enough to have starred in her school’s musicals and directed some of their fall plays, along with organizing and participating in talent shows for fellow classmates and musicians. Outside of the classroom, Lula volunteered at ArtsRock, a nonprofit organization that helps bring multicultural arts programming to diverse audiences in Rockland County. She especially enjoyed helping at children’s shows, greeting kids with milk and cookies at the end! As lockdown started her junior year, Lula spent the remainder of her high school career interning at a PR company for healthcare, assisting with the development of new COVID-19 vaccines in the marketing world. She graduated as the valedictorian and student body vice president and was awarded the Edward Hopper House Artistic Curiosity Scholarship for following her unique artistic path in songwriting. At Yale, Lula is deeply curious about the intersection of the arts and culture, especially through literary manifestations. Her extracurriculars reflect this passion, as she is the events coordinator and a staff writer for DOWN magazine, a BIPOC-centered webzine with a focus on arts and community that encourages writers and creatives of color to work together and amplify each other’s voices. She also acts and stage-manages in Yale’s undergraduate theater scene, and helped start Yale Songwriters Collective, a space for songwriters of any expertise to practice their craft – individually and through open mics. More recently, she is the lead singer of a band on campus and spends her free time producing a podcast with her best friend. Lula is endlessly excited by the chance to share any of her passions for songwriting, music, and literature with Curious Cardinals!\u003c/p\u003e","teachingVideoPlaybackId":"gbKBYvR4DZieVvYuzFPjxP3kNDLup01O5cMcDVNQJMmI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"83ecd5a8-00cd-47d0-9549-d0e9dfddfb01\"}"},{"__ref":"Favorites:{\"u
