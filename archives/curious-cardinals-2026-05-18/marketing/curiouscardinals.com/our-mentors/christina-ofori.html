ature","degree":"B.A."},"MentorPublicProfile:{\"uuid\":\"ad6379db-63c9-41db-bb85-52fc26bb6a32\"}":{"__typename":"MentorPublicProfile","uuid":"ad6379db-63c9-41db-bb85-52fc26bb6a32","displayName":"Christina O.","slug":"christina-ofori","biography":"Christina’s learning journey at Brown wound her through courses in 12 different departments before she finally landed on Comparative Literature (English, French); a choice she made after realizing that she had not only fulfilled over half the requirements but that the concentration would challenge her to master a second language and study abroad. She also loves that most of her classes are philosophy and theory-based because they challenge her with questions the real world doesn’t encourage, yet which are crucial to our cultural and individual development. Those like “What is the role of the visual in shaping our moral life?” and “How might a literary work at once confront us with our reality and open up its possibilities?”\nChristina has long been dedicated to fostering creativity in her community. In high school, as a response to the limits posed by an underfunded art program, she spearheaded a weekly after-school art course in which she taught lessons in visual analysis and encouraged artistic experimentation. She is also as analytical as she is creative: a quality she once used to exhaust her high school’s math curriculum by her sophomore year, but has more recently harnessed toward consulting. First, for a Providence non-profit working to provide educational and travel opportunities for Black youth; then for McKinsey her sophomore summer developing various diversity initiatives. These combined skills also come in handy in her work with college students developing personal statements, an experience she cherishes due to the self-reflection and expression inherent to the writing process.\nHaving grown up in a learning environment where the practical and career-oriented were valued over the theoretical, Christina is eager to connect with students who feel as though their urgent intellectual curiosities are overlooked by their learning institutions. She is also keen on connecting with students who, like her, were raised in environments where their identities were not shared by the majority of those around them. She's grateful for the exposure to this challenge, but she wishes she'd had an older friend help her navigate through!\nChristina keeps herself sane through solo travel, a hobby that forces her out of her head and acquaints her with interesting people from all over the world. On a more regular basis, you may also find her handwriting meticulously detailed birthday cards, laughing out loud to her favorite pop culture podcast, or dancing to Afrobeats.\n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Comparative Literature","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/90c7848b-7698-4f00-bb8f-ef5931aef14b/-/crop/692x692/0,201/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fef2e2e9-5c73-4cd4-a6b5-050c80a26f7d\"}"}],"hiredAt":"2023-02-15T00:07:28.413Z","topics":["History Project","Philosophy","Literature","Race \u0026 Ethnicity","Writing","Reading","Creative Writing","College Essay Writing","Academic Coaching","Visual Arts / Graphic Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"christina-ofori\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ad6379db-63c9-41db-bb85-52fc26bb6a32\"}"}}},"_sentryTraceData":"daf548bdf82545daa39fe80bfb8b0c0b-82eaddf4c40338df-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=daf548bdf82545daa39fe80bfb8b0c0b,sentry
