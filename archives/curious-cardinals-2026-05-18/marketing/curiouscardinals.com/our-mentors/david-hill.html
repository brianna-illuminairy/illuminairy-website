../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a6635fba-9dde-4519-8b7d-32e9bc58711d\"}":{"__typename":"DeepDives","uuid":"a6635fba-9dde-4519-8b7d-32e9bc58711d","content":"\u003cp\u003eMy mother is by far my greatest role model. She has instilled in me the work ethic and grit I have today. My mom is a fighter and has faced numerous challenges in her life. Despite this, she has been committed to offering the best life possible for me and my brother. Just seeing her makes me want to work harder and be better. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6afe1fa9-ac1e-48ae-969c-32e60c4c5704\"}":{"__typename":"DeepDives","uuid":"6afe1fa9-ac1e-48ae-969c-32e60c4c5704","content":"\u003cp\u003eAfter my parents divorce, my father decided to remove himself from my life. His decision to leave had quite a negative effect on me. I was fortunate to have a high school teacher, Colonel Brown, step in and serve as the father figure I needed. He talked to me a lot and gave me some great advice. I still talk to him today and listen to his wisdom. He inspires me to impart the little wisdom I have on to the younger generation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"677a5f79-2f2e-4773-a156-5f563e7f3290\"}":{"__typename":"DeepDives","uuid":"677a5f79-2f2e-4773-a156-5f563e7f3290","content":"\u003cp\u003eI would tell my high school self to stop stressing so much. Given that my father disappeared from life, I had a lot of pressure on me to succeed as the man of the house. This pressure led me to be quite irritable and sometimes mean. I have learned how to better control my stress. I now know that bad times never last forever and to just keep looking forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"81687a9b-8113-4990-acf4-aae9fdf5759e\"}":{"__typename":"Education","uuid":"81687a9b-8113-4990-acf4-aae9fdf5759e","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Applied Math and Physics","degree":null},"School:{\"uuid\":\"4057af30-ec24-4164-baa6-340836b32393\"}":{"__typename":"School","uuid":"4057af30-ec24-4164-baa6-340836b32393","name":"Ola High School","city":"McDonough","type":"HIGH","state":"Georgia","country":"United States","zip":"30252"},"Education:{\"uuid\":\"b38f8d7e-1c7d-4823-a56a-80668fb2db11\"}":{"__typename":"Education","uuid":"b38f8d7e-1c7d-4823-a56a-80668fb2db11","school":{"__ref":"School:{\"uuid\":\"4057af30-ec24-4164-baa6-340836b32393\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"Testimonial:d67d04c0-198b-4f0a-ab4d-ad056f0b3894":{"__typename":"Testimonial","id":"d67d04c0-198b-4f0a-ab4d-ad056f0b3894","text":"We've delightfully worked with David for a few years now.  He's been such a huge support and positive force for our son!  His confidence in maths has grown tremendously since David started working with him.  We've been so pleased to have him provide practical and analytical support on a weekly basis during the school year!","date":"2025-05-30 00:57:00.041+00","rating":5,"endorser":{"__typename":"Endorser","name":"Aishetu Fatima Dozie","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"dba23693-503a-4d65-8e0a-adf4413481fd\"}":{"__typename":"MentorPublicProfile","uuid":"dba23693-503a-4d65-8e0a-adf4413481fd","displayName":"David H.","slug":"david-hill","biography":"\u003cp\u003eI am a senior studying applied mathematics and physics at Harvard University. I value education and have completed over 4000 hours of tutoring.  I have been tutoring for 3 years and hope to continue working in academia after graduating college. Despite growing up in a small and rural part of Georgia, I achieved my dream of being admitted to Harvard University. I truly enjoy helping students attend their dream universities. Hence, my favorite subjects to teach include the SAT, ACT, and the college application process. In fact, I received a perfect score on the math portion of the SAT, and I believe every student - with enough practice - can attain a perfect score. I am also fond of tutoring all mathematical concepts found in the K-12 curriculum. In my free time, I love to exercise. Specifically, I like playing basketball, running, and lifting weights. My favorite board game is chess, and I almost never turn down a game of chess. Last but certainly not least, I make time for video games as well. My go-to video games are Call of Duty, NBA 2k, and Fortnite. I would love to be your child's tutor, and I hope you select me!!\u003c/p\u003e","teachingVideoPlaybackId":"jA00ZRP4003ImyjiDn5tjyI02s8Tf00Ess25RWrNscsZimg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was the first student from my high school to be accepted into Harvard, Yale, and Princeton. I just felt so proud of myself because I knew how much work I put in to be accepted to such amazing schools. \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Applied Math and Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a6635fba-9dde-4519-8b7d-32e9bc58711d\"}"},{"__ref":"DeepDives:{\"uuid\":\"6afe1fa9-ac1e-48ae-969c-32e60c4c5704\"}"},{"__ref":"DeepDives:{\"uuid\":\"677a5f79-2f2e-4773-a156-5f563e7f3290\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a6252951-6148-4652-80bf-eb09d1d3ea5f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"81687a9b-8113-4990-acf4-aae9fdf5759e\"}"},{"__ref":"Education:{\"uuid\":\"b38f8d7e-1c7d-4823-a56a-80668fb2db11\"}"}],"hiredAt":"2022-06-09T19:52:53.000Z","topics":["Physics","Business / Entrepreneurship","Writing","Calculus","K-5 Grade Math","Precalculus / Trigonometry","Reading","Geometry","Algebra I","Pre-Algebra","Algebra II","Statistics","Public Speaking","Finance / Investing","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:d67d04c0-198b-4f0a-ab4d-ad056f0b3894"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"david-hill\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"dba23693-503a-4d65-8e0a-adf4413481fd\"}"}}},"_sentryTraceData":"c865feea88aa4a99bfaedfb8fee5d722-bfd8c0dd6c84b591-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c865feea88aa4a99bfaedfb8fee5d722,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"david-hill"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
