../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"954e92c0-ffd1-4000-9705-f9afaaae91c0\"}":{"__typename":"DeepDives","uuid":"954e92c0-ffd1-4000-9705-f9afaaae91c0","content":"\u003cp\u003eI grew up in an environment that combined two dissimilar cultures. I was raised by my black Burundian mother, the daughter of a Catholic diplomat, and my white American father, the son of a Jewish doctor. I have strong ties to both sides of my heritage and continually grapple with the violence they have each faced as Jews and Tutsis. I am biracial, binational, and of two religions; each of these aspects has given me perspective. Further, I have an understanding of how to leverage these perspectives so that I may better understand others.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMy mother has given me my most vulnerable and, consequently, most valuable perspective, my skin color. This perspective has built indestructible avenues of empathy and has reinforced my desire to go into medicine. Further, having spent much of my life teaching my white family members of my experiences, I am a reliably vocal advocate of marginalized identities. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough open discussion and acknowledging differences, I have bridged the two cultures in my personal life, which has instilled a high level of cultural humility. I carry this cultural humility into how I teach. I make a great effort to meet my mentees where they are and adjust my pace and teaching style accordingly. Moreover, I love to learn about who they are outside of the classroom so that I can best mentor them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"912eb925-599b-4d9f-b9f0-7603927ac87f\"}":{"__typename":"DeepDives","uuid":"912eb925-599b-4d9f-b9f0-7603927ac87f","content":"\u003cp\u003eMy gap year, during the pandemic, played a crucial role in my journey to medical school and has informed my view and understanding of healthcare in America. I chose to unenroll and work at Boston Children’s Hospital to contribute to a healthcare system in dire need of support and staffing and better understand the workings and nuances of a career in medicine. I worked on the front line, exposed to COVID-19 and traumatic injury every day; I took shifts from midnight to noon, walked through blizzards to work on Sundays, and witnessed the devotion and organization necessary from my colleagues to maintain a productive Emergency Department (ED).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWitnessing the impacts of COVID-19 was mortifying, as was the disproportionate suffering of marginalized communities. Further, seeing the outdated protocols and bureaucratic processes that persist in most hospitals concerned me. However, I was also inspired by the impact made possible, especially during a time of emergency, when all of the moving parts in healthcare are at work. For example, researchers, some only blocks away, urgently created a vaccine, social workers helped patients get to appointments, and providers distributed it, all while working at clinical capacity. Even as a small component of this chain, I felt the value of my efforts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGiven the nature of the ED and the uncertainty that came with the pandemic, many factors were simultaneously in the balance when I was working there. There were weeks when we would be indefinitely understaffed. During these periods, I had to be flexible and prepared to work at any station within the ED. I would take on new responsibilities within my role; for example, I learned how to work in fast track, the clinic upstairs that only opens at night when the ED is far beyond capacity. This lack of structure was a massive adjustment for someone like me who likes to plan my days meticulously, but it significantly improved my ability to handle uncertainty.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe pandemic elongated my journey to medical school, but it served my journey well, building certainty in my decision to pursue medicine. When my medical training and career are inevitably difficult and stressful, I will reflect on my year spent working at Boston Children’s and the patients I met who were assisted and saved by their visit(s). I am now uniquely aware of the healthcare system I will enter as a physician in America, and I am unequivocally prepared to do so. My firsthand experience with the mental health crisis, vaccine hysteria, and the death toll served as a genuine awakening to the limitations of our healthcare system. This challenging period crucially contributed to my resilience in the face of medical trauma, appreciation for the intricate web of roles and responsibilities in healthcare, and determination to address systemic inequities and inefficiencies within our healthcare system.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d0b35d1d-22d1-45a2-ac32-2d4fa6944543\"}":{"__typename":"DeepDives","uuid":"d0b35d1d-22d1-45a2-ac32-2d4fa6944543","content":"\u003cp\u003eI would advise myself to follow my instincts and challenge myself. I would tell her that it is okay to make mistakes and that she should simply continue to follow her calling no matter what barriers lie ahead. I would reassure her that scientific curiosity, ambition, and a drive to improve community health will lead her to a career in teaching and medicine. Finally, I would tell her that she will become the mentor she could have greatly benefitted from having. We all deserve to have someone uniquely invested in our success and able to help us get there. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b3def29b-c33d-42b6-9384-7007bba7214a\"}":{"__typename":"DeepDives","uuid":"b3def29b-c33d-42b6-9384-7007bba7214a","content":"\u003cp\u003eI chose my major, Human Developmental and Regenerative Biology, because I am deeply interested in how stem cells work and am aware of their therapeutic potential. Harvard is the only school in the country to have a robust stem cell concentration for undergraduates, and I just knew I had to take advantage of the opportunity to learn more. I have always loved how understanding science has allowed us incredible capabilities which we continually use to improve health outcomes and the human experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"c7fdd92a-a52e-4547-8dd0-eff52af22e44\"}":{"__typename":"Education","uuid":"c7fdd92a-a52e-4547-8dd0-eff52af22e44","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Human Developmental and Regenerative Biology","degree":"B.A."},"School:{\"uuid\":\"600727db-f864-4848-9af0-ee055a1387f8\"}":{"__typename":"School","uuid":"600727db-f864-4848-9af0-ee055a1387f8","name":"James Hubert Blake High School","city":"Silver Spring","type":"HIGH","state":"MD","country":"United States","zip":"20905"},"Education:{\"uuid\":\"4b5a0675-c48a-47f4-9973-a9e175448fed\"}":{"__typename":"Education","uuid":"4b5a0675-c48a-47f4-9973-a9e175448fed","school":{"__ref":"School:{\"uuid\":\"600727db-f864-4848-9af0-ee055a1387f8\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"Testimonial:42c6e095-51a9-4ce1-bdc1-ee8fdffb3424":{"__typename":"Testimonial","id":"42c6e095-51a9-4ce1-bdc1-ee8fdffb3424","text":"Raia was not looking forward to having a math tutor before she started with Keza and now she looks forward to sessions and handles joining on time completely independently. When she is struggling with a new concept she is confident she will figure it out during her session with Keza. Raia and I both are very thankful for Keza!","date":"2025-05-30 00:04:16.259+00","rating":5,"endorser":{"__typename":"Endorser","name":"Benis Reffkin","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"796ac0b1-9bfc-4584-b455-074734c7294b\"}":{"__typename":"MentorPublicProfile","uuid":"796ac0b1-9bfc-4584-b455-074734c7294b","displayName":"Keza L.","slug":"keza-levine","biography":"\u003cp\u003eKeza is a senior at Harvard College concentrating in Human Developmental and Regenerative Biology with a secondary in Global Health and Health Policy. She grew up in Maryland where she attended a signature school for fine arts and humanities. In her high school years she played competitive travel softball and took over 15 AP classes. It was also then that her long standing interest in STEM emerged. \u003cbr\u003e\u003cbr\u003eKeza is pre-med; she is passionate about health equity and the advancement of novel therapeutics, particularly those which utilize stem cells. She has spent several years conducting research on hematological malignancies at Massachusetts General Hospital but also loves clinical work. During the academic year of 2020-2021, Keza took a gap year to work full time in the Emergency Department at Boston Children’s Hospital, the foremost pediatric hospital in the country. During this time, Keza worked with hundreds of pediatric patients and has since been eager to continue working with young individuals. Now, Keza conducts clinical research in pediatric orthopedics at the Hospital for Special Surgery.\u003cbr\u003e\u003cbr\u003eIn her free time Keza loves hiking, painting, and doing yoga with her roommates. She also loves music and knows nearly every Taylor Swift song by heart. Every week she volunteers at a senior center, some days she does art with the seniors and other days she helps them with physical therapy. Keza forever remembers and appreciates the teachers and peers in her life who assisted her on her journey to Harvard and who continue to assist her as she begins the medical school application process. It is deeply important to her that she too is able to serve as a support system for others as they navigate their interests and invest in their own education.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Developmental and Regenerative Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"954e92c0-ffd1-4000-9705-f9afaaae91c0\"}"},{"__ref":"DeepDives:{\"uuid\":\"912eb925-599b-4d9f-b9f0-7603927ac87f\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0b35d1d-22d1-45a2-ac32-2d4fa6944543\"}"},{"__ref":"DeepDives:{\"uuid\":\"b3def29b-c33d-42b6-9384-7007bba7214a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fcdefc61-9587-4c3c-92d3-bce5d61c43a6/-/crop/595x596/19,292/-/preview/-/format/jpg/","https://ucarecdn.com/2e7ebe98-8f0d-4f1b-875f-cdaf844aeae0/-/preview/-/format/jpg/","https://ucarecdn.com/c52635cb-6bc0-49da-b6d3-2000310d175e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c7fdd92a-a52e-4547-8dd0-eff52af22e44\"}"},{"__ref":"Education:{\"uuid\":\"4b5a0675-c48a-47f4-9973-a9e175448fed\"}"}],"hiredAt":"2023-02-06T23:04:35.044Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Biology","Chemistry","Writing","Academic Coaching","College Essay Writing","Reading"],"communityBadges":["https://ucarecdn.com/e447357
