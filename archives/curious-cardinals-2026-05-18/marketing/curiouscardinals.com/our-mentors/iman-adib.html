ss with a 4.8 GPA. I love to play tennis, badminton, and softball, but also talk about the beauty of Chemistry.\u0026nbsp;\u003c/p\u003e\u003cp\u003eFun Fact: My high school Chemistry teacher mysteriously disappeared, and I taught AP Chemistry to my classmates for two months! In my free time, I love to watch all types of movies, listen to unsolved crime podcasts, and hang out with friends and family. I also love to learn about other people's hobbies, taste in music, culture, whatever it may be. I believe that it is vital in establishing relationships with people who may be different than you, but also makes a person overall more knowledgeable. So if you or your child has a cuisine in mind, I would love to create it!\u003c/p\u003e\u003cp\u003eI have been invited to four leadership conferences and two women's empowerment conferences. I take pride in being able to lead and teach others how to have and use their voice. I love to talk about anything and everything, whether it be academics, what you had for breakfast, or your favorite makeup product, I am all ears! My goal as a mentor is to be able to guide students to pursue their passions. I want to help young students feel confident in their skills and voice. I want students to know that it is okay, more okay to not know something. We all start somewhere, and asking questions is the only way to grow. This is an essential skill to ensure a student's success in the future, and to not only advocate for themselves but for others! I want them to be able to have a love for all subjects, not just one. I want to build a personal connection with my mentees, put a smile on their faces, and see them go far in life!\u003c/p\u003e\u003cp\u003eI am very flexible when it comes to your child’s needs, so please do not hesitate to reach out with any comments or concerns!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,
