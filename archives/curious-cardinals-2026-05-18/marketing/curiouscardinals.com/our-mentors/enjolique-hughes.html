,"MentorPublicProfile:{\"uuid\":\"f77af109-8743-48f9-93e5-478e9b646a6d\"}":{"__typename":"MentorPublicProfile","uuid":"f77af109-8743-48f9-93e5-478e9b646a6d","displayName":"Enjolique H.","slug":"enjolique-hughes","biography":"Enjolique Hughes was born and raised in Kailua-Kona, Hawai’i. In high school, she was a very active member of her soccer and volleyball teams, traveling nationally to compete. Enjolique also founded her school’s Space Club, winning the NASA AMES Space Settlement Design Competition as the club’s president and being selected as a student delegate for the International MoonBase Summit and the International Space Development Conference. Through these achievements, she received recognition from the office of the governor for representing Hawai’i on the international level. She was also heavily involved in her school’s musical theatre program. \n\nEnjolique is now a junior at Princeton University where she is majoring in History while completing Pre-Medical requirements, and obtaining certificates in European Cultural Studies and the History and Practice of Diplomacy. She is a member of Army ROTC, the President of the Hawai’i Club, and a captain of the Women’s club volleyball team. She has also worked as a researcher in Holocaust history, as a nursing assistant at the Hospital for Special Surgery, and as an administrative assistant at Project Expedite Justice. After graduating from Princeton, she hopes to attend medical school. Enjolique is passionate about alternative historical narratives, international law, space settlement design, musical theatre, and rural healthcare. She especially cares about the representation of women of color in demographically challenging spaces. Through education, she hopes to empower students to seek out truths in the stories others tell.\n\n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhoto
