1a-a554-7e7cdcfdf158\"}":{"__typename":"Favorites","uuid":"b300ce07-3a6b-4a1a-a554-7e7cdcfdf158","photoUrl":"https://ucarecdn.com/0f866895-6554-4133-91fb-35bbb2637032/","title":"The Year of Magical Thinking by Joan Diddion ","type":"BOOK"},"CausesSupported:{\"uuid\":\"6a5c3a3b-7478-4c45-a17c-5ea460628d0c\"}":{"__typename":"CausesSupported","uuid":"6a5c3a3b-7478-4c45-a17c-5ea460628d0c","name":"Planned Parenthood","description":"\u003cp\u003eAttend marches, donate, share the importance of safe and accessible abortions!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/e62b58c7-9916-4f29-8bef-3fe9620ed0fc/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"36663a92-cb71-488e-b1b5-54caf5a335fa\"}":{"__typename":"DeepDives","uuid":"36663a92-cb71-488e-b1b5-54caf5a335fa","content":"\u003cp\u003eI was very lucky to have a few teachers along the way that have instilled me with academic confidence. Growing up, I never felt smart enough in a school setting. My sixth grade Latin teacher, Mr. Wilmot, pulled me aside one semester as he saw that my confidence was seeping into my school work. His words of validation that I was smart enough, and just needed to push through my feelings of inadequacy would pass. He inspired me to keep raising my hand even when I didn’t feel 100% sure of my comments, and to lean into the discomfort that sometimes comes with learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d7c91658-7cf2-496c-845b-b2016257c9db\"}":{"__typename":"DeepDives","uuid":"d7c91658-7cf2-496c-845b-b2016257c9db","content":"\u003cp\u003eJust follow your curiosity and excitement! In middle and high school, I was constantly caught up with getting to the next milestone or accomplishment on the school’s deadline. The most rewarding educational and personal journeys have sparked naturally through following an instinct to explore and collaborate with those around me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"088e0ccd-bdf7-40f6-92dc-f80dbf80b342\"}":{"__typename":"DeepDives","uuid":"088e0ccd-bdf7-40f6-92dc-f80dbf80b342","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eMy mom is my greatest role model. She always reminds me to ask questions about the information I’m given, and to never take no as an answer. She is the most curious person I know. A day at the museum can end in a full night of research on one of the subjects of a painting we saw. I am constantly inspired by her endless dedication to her work, as well as her confidence in making bold and innovative decisions that no one has done before.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4f54e976-6592-4e10-8282-c101a81a5d72\"}":{"__typename":"DeepDives","uuid":"4f54e976-6592-4e10-8282-c101a81a5d72","content":"\u003cp\u003eI can almost always be caught on an obnoxiously long walk while listening to a podcast or audio book in my spare time. I really utilize this time to silently take in information from whatever I’m listening to, while also clearing my head. I always step back into my room feeling inspired and relaxed!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"a0d50d59-6e1d-45d0-baae-1bea79a52e6c\"}":{"__typename":"Education","uuid":"a0d50d59-6e1d-45d0-baae-1bea79a52e6c","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Art History and English","degree":"Bachelor's "},"School:{\"uuid\":\"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122\"}":{"__typename":"School","uuid":"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122","name":"Spence School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"1819cfa9-ac54-4785-9dc3-8e1dd05e4aab\"}":{"__typename":"Education","uuid":"1819cfa9-ac54-4785-9dc3-8e1dd05e4aab","school":{"__ref":"School:{\"uuid\":\"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"1f4130ba-f32d-4b28-a36b-5210a179a8af\"}":{"__typename":"MentorPublicProfile","uuid":"1f4130ba-f32d-4b28-a36b-5210a179a8af","displayName":"Colette R.","slug":"colette-rohatyn","biography":"\u003cp\u003eCoco is studying Art History as well as English at Brown University. Learning about Art History has completely reframed how she looks at the walls she sees on a day-to-day basis. During her first year at Brown, she signed up for acting, playwriting, and issues in performance studies due to her interest— before she had even decided to declare it as a concentration. Because of this natural pull towards the performing arts department, it only felt natural to pursue a degree in it!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn 2021, she graduated from Spence, an all-girls school in New York. She began kindergarten at a co-ed school, but felt unsupported as an outspoken young girl in a male-dominated education system. Growing up in a feminist household, Coco found her time at Spence invaluable and empowering—she credits the school’s emphasis on public speaking for allowing her to foster and exercise her unique ability to speak confidently in front of crowds.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe grew up as a competitive figure skater for ten years and attributes much of her academic and extracurricular success to the discipline she learned within the rink. After her skating career came to an end due to injury, Coco channeled her love of performance through acting in high school. Skating taught Coco discipline—she grew up with 6 am practice being the norm! Skating also allowed her to learn how to work with almost anyone, as she trained with coaches of all different teaching styles and backgrounds.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Brown, Coco co-founded and runs the Brown Art Review, the school’s only art dedicated magazine. She can often be found on an Instagram Live interviewing an artist! The Brown Art Review works to highlight both student artists and up-and-coming artists. The mission of the Brown Art Review is to give a platform to marginalized artists who have been pushed aside. At the same time, the magazine often interviews bigger-named artists to make the success of the art world feel accessible to students. She also works for the Ivy Film Festival which presents the largest student run film festival once a year. Coco has also found her place in acting through Brown Motion Pictures, where she participates in student films, both as an actor and an E-Board member where she aids in picking the scripts. An avid movie and TV watcher, she takes humor seriously and tries to sprinkle it into any situation. She can often be found on a long walk while calling her grandmother, exploring the different pastries of Providence, or deep into a Jane Austen novel.\u003c/p\u003e","teachingVideoPlaybackId":"RDIAW00Q3502FYMHwRitw02agKKkEcj00Kl00zkCUfOn8lRU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn my freshman year fall semester I took a class in architecture, something I had never studied before. For my final project, I recreated architect Gerrit Rietveld’s military stool. Prior to this, I had never created such a tangible object by myself. After eight days in the design workshop being covered in sawdust and immersed in the sound of drills and saws, I successfully finished my chair!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ecc66b73-cebe-44ad-831a-6e58d1297271\"}"},{"__ref":"Favorites:{\"uuid\":\"2793c84c-7120-4868-bf65-183fa65262c4\"}"},{"__ref":"Favorites:{\"uuid\":\"b300ce07-3a6b-4a1a-a554-7e7cdcfdf158\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6a5c3a3b-7478-4c45-a17c-5ea460628d0c\"}"}],"major":"Art History and English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"36663a92-cb71-488e-b1b5-54caf5a335fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7c91658-7cf2-496c-845b-b2016257c9db\"}"},{"__ref":"DeepDives:{\"uuid\":\"088e0ccd-bdf7-40f6-92dc-f80dbf80b342\"}"},{"__ref":"DeepDives:{\"uuid\":\"4f54e976-6592-4e10-8282-c101a81a5d72\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0f800ebd-33b2-4e9e-abf6-373569815e0a/-/crop/595x595/48,164/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a0d50d59-6e1d-45d0-baae-1bea79a52e6c\"}"},{"__ref":"Education:{\"uuid\":\"1819cfa9-ac54-4785-9dc3-8e1dd05e4aab\"}"}],"hiredAt":"2023-02-10T19:29:55.151Z","topics":["Film / Theater","History Project"],"comm
