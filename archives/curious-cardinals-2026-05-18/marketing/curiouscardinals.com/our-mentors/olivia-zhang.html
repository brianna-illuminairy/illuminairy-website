37-9305-4339-a34e-74b61016fd7b\"}":{"__typename":"Favorites","uuid":"18108e37-9305-4339-a34e-74b61016fd7b","photoUrl":"https://ucarecdn.com/e08d6613-6c93-49a5-9381-ca40c27eed0c/","title":"You're On Your Own, Kid","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9e409f20-1d04-417d-be22-1e51b68fa19e\"}":{"__typename":"DeepDives","uuid":"9e409f20-1d04-417d-be22-1e51b68fa19e","content":"\u003cp\u003eBe brave! Middle school and high school can be really difficult, but if you remember your values and the things that matter most to you, it'll all be ok. Don't be afraid to take the leap into the unknown; it's often where the most rewarding adventures are! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e5be1b2b-e836-4f6b-91c7-610af4ade04b\"}":{"__typename":"DeepDives","uuid":"e5be1b2b-e836-4f6b-91c7-610af4ade04b","content":"\u003cp\u003eMentorship has shaped my academic, professional, and personal life. I think of mentorship as the thing that never ends, because you can always pass it on to someone else. It's why I joined Curious Cardinals! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"18ce4792-3c7c-4242-a7f6-6d93d86384ef\"}":{"__typename":"DeepDives","uuid":"18ce4792-3c7c-4242-a7f6-6d93d86384ef","content":"\u003cp\u003eI chose Ethics, Politics \u0026amp; Economics because I love thinking about the core elements that make up problems in our world. EP\u0026amp;E is interdisciplinary, inherently academic, and fully embraces the liberal arts experience. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"6714021b-474a-4e9e-93f5-b64b6211efbf\"}":{"__typename":"DeepDives","uuid":"6714021b-474a-4e9e-93f5-b64b6211efbf","content":"\u003cp\u003eMy family! They are the backbone of who I am today, and I think about the sacrifices that my parents and grandparents made for me to be able to live the life I do today. I would not be who I am today without them, and I'll spend my life making them proud! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"518fc3fb-a426-4011-9c58-9e7b578edf17\"}":{"__typename":"Education","uuid":"518fc3fb-a426-4011-9c58-9e7b578edf17","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Ethics, Politics \u0026 Economics","degree":"B.A"},"School:{\"uuid\":\"bc8063ad-65c0-4838-926a-66531b44ab06\"}":{"__typename":"School","uuid":"bc8063ad-65c0-4838-926a-66531b44ab06","name":"Westminster School","city":"Simsbury","type":"HIGH","state":"Connecticut","country":"United States","zip":"06070"},"Education:{\"uuid\":\"ea0cb4d2-b7cf-4693-acac-980023ea7fc2\"}":{"__typename":"Education","uuid":"ea0cb4d2-b7cf-4693-acac-980023ea7fc2","school":{"__ref":"School:{\"uuid\":\"bc8063ad-65c0-4838-926a-66531b44ab06\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"06fde7be-eb27-45d4-ba11-d7cd459c237c\"}":{"__typename":"MentorPublicProfile","uuid":"06fde7be-eb27-45d4-ba11-d7cd459c237c","displayName":"Olivia Z.","slug":"olivia-zhang","biography":"\u003cp\u003eOlivia is a senior at Yale University studying Ethics, Politics \u0026amp; Economics. She is originally from Long Island, NY, but has since moved with her family to Manhattan. Olivia is passionate about Ethics, Politics \u0026amp; Economics because the intersection of these areas align with many of our world’s most pressing issues; climate change, racial injustice, and inequality can all be understood through the interdisciplinary lens of EP\u0026amp;E. Her passion for executive functioning comes from the way her parents instilled it in her; helping others develop skills of teamwork, leadership, decision-making, working toward goals, critical thinking, adaptability, and emotional awareness helps create the next generation of citizens and leaders. On campus, she was the Publisher of the Yale Daily News, and was responsible for the over-arching financial health of the country's oldest college daily newspaper. She was also the social chair of Alpha Phi for two years, the best part of which was meeting people from all corners of Yale's campus and planning fun events for her closest friends on the weekends. Finally, Olivia is part of Yale's Alpine Ski Team, the Yale Alumni Fund, the Admissions Office, and does research on corporate sustainability with Professor Jeffrey Sonnenfeld. In her free time, you can find her trying out restaurants in New Haven with friends (shared tapas and a great tikka masala are her current favorites), doing hot yoga (working on a headstand), or avidly re-arranging her Google Calendar.\u003c/p\u003e","teachingVideoPlaybackId":"fZoir4LNfgx49TFZD1cfrT1jFSJNU2XHM6h38CBynXg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMaking my family proud. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"cbc42ce2-3fd7-4cb5-96f7-8b8fd9942aa5\"}"},{"__ref":"Favorites:{\"uuid\":\"c48e59b6-cbf2-4061-882e-c4b207300d84\"}"},{"__ref":"Favorites:{\"uuid\":\"18108e37-9305-4339-a34e-74b61016fd7b\"}"}],"causesSupported":[],"major":"Ethics, Politics \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9e409f20-1d04-417d-be22-1e51b68fa19e\"}"},{"__ref":"DeepDives:{\"uuid\":\"e5be1b2b-e836-4f6b-91c7-610af4ade04b\"}"},{"__ref":"DeepDives:{\"uuid\":\"18ce4792-3c7c-4242-a7f6-6d93d86384ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"6714021b-474a-4e9e-93f5-b64b6211efbf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5630e014-6d6c-4d47-b39d-4e7108a17848/-/preview/-/format/jpg/","https://ucarecdn.com/ba8bd99d-f59c-4adb-9c61-af5b1e865f5b/-/preview/-/format/jpg/","https://ucarecdn.com/fc368453-e159-469a-9d9d-72fe61c3d888/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"518fc3fb-a426-4011-9c58-9e7b578edf17\"}"},{"__ref":"Education:{\"uuid\":\"ea0cb4d2-b7cf-4693-acac-980023ea7fc2\"}"}],"hiredAt":"2022-11-18T17:52:01.000Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"olivia-zhang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"06fde7be-eb27-45d4-ba11-d7cd459c237c\"}"}}},"_sentryTraceData":"45140b0af83541d8a66dc82150b62f36-8db725cbf7332047-1","_sentryBaggag
