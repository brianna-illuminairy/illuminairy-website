ering from chronic pain. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSid is fluent in 3 languages and has also taken Spanish courses at the university level. In his free time, he enjoys exploring a wide range of fitness classes in Boston including spin, barre, boxing, and yoga. Since growing up in a musical family, Sid learned Indian classical music, taught himself to play finger-style guitar, and since college has developed in interest in music production.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/0588dd94-673c-4fe2-8c6e-7c2a83daea39/-/crop/622x622/19,0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"17d6e8b4-b7a3-43e2-ab37-8030411b2449\"}"},{"__ref":"Education:{\"uuid\":\"b246d154-db09-4665-ab2b-fcbb7df42260\"}"}],"hiredAt":"2023-03-22T01:52:23.615Z","topics":["Algebra I","Algebra II","6-8 Grade Science","Chemistry","Biology","Physics"],"communityBadges":["https://ucarecdn.com/d6e4ee1f-e382-4643-ba2c-be1b241e6cb1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:f93059f8-d674-435b-a593-361e92e513dc"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sid-kavuturu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b01deea9-620a-425f-b219-88cd4f02423e\"}"}}},"_sentryTraceData":"a77b15377c4d43b59ec592c4409506a7-9e1e03b92ee70c68-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a77b15377c4d43b59ec592c4409506a7,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sid-kavuturu"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback"
