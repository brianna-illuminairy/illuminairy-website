 driven to excel in the classroom, and I approached both my studies and sports with the same level of dedication and commitment. Despite my leadership role, I stayed true to a close-knit group of friends, valuing deep, meaningful connections over a larger social circle. My high school experience was defined by a strong work ethic, a focus on personal growth, and a commitment to those I trusted and cared about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"d20a52ed-d9fb-490a-bbe2-b8bf5fdaacbb\"}":{"__typename":"School","uuid":"d20a52ed-d9fb-490a-bbe2-b8bf5fdaacbb","name":"Hamilton College","city":"Clinton","type":"COLLEGE","state":"New York","country":"United States","zip":"13323"},"Education:{\"uuid\":\"9f96c155-15ce-41a1-b3bb-12d7f2cb147a\"}":{"__typename":"Education","uuid":"9f96c155-15ce-41a1-b3bb-12d7f2cb147a","school":{"__ref":"School:{\"uuid\":\"d20a52ed-d9fb-490a-bbe2-b8bf5fdaacbb\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Economics","degree":"BA"},"School:{\"uuid\":\"0ccf3216-aed5-4a74-adf8-722b5b0b7f7b\"}":{"__typename":"School","uuid":"0ccf3216-aed5-4a74-adf8-722b5b0b7f7b","name":"Fairfield Warde High School","city":"Fairfield","type":"HIGH","state":"Connecticut","country":"United States","zip":"06825"},"Education:{\"uuid\":\"edf4ec28-6465-44ff-9e99-3e2226c16791\"}":{"__typename":"Education","uuid":"edf4ec28-6465-44ff-9e99-3e2226c16791","school":{"__ref":"School:{\"uuid\":\"0ccf3216-aed5-4a74-adf8-722b5b0b7f7b\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"1170e6ec-0e6b-443b-a1c8-5caaf9c47d67\"}":{"__typename":"MentorPublicProfile","uuid":"1170e6ec-0e6b-443b-a1c8-5caaf9c47d67","displayName":"Connor B.","slug":"connor-burt","biography":"\u003cp\u003eConnor is a recent graduate of Hamilton College with a degree in Economics and a minor in Government. Originally from Fairfield, Connecticut, he attended Fairfield Warde High School, where he excelled academically, taking multiple AP courses and serving as the captain of the Varsity Football Team and President of the Red Cross Club. He also volunteered as a Peer Mentor at a local elementary school, assisting a student identified as needing extra support due to various challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Hamilton, Connor was an active member of the Finance Club and the Football team. He also worked as a mentor for 8th-grade students and developed strong skills in Microsoft Excel, Stata, and R through his coursework. He spent a semester abroad at the Stockholm School of Economics in Sweden, where he was chosen for a highly selective research internship at the Research Institute for Industrial Economics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring the summer of 2023, Connor worked as a Capital Markets Intern at Green Street Power Partners, gaining valuable experience in sustainable finance. He also worked as a mentor with Curious Cardinals. Connor is excited to begin his career in clean energy as he joins the Connecticut Green Bank as a Project Associate, Financing Programs on the Solar MAP team. In his free time, Connor enjoys watching and playing football, basketball, and golf, traveling, personal investing, poker, and fantasy sports.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a901e0b3-5c90-4e5c-8667-2d733aa987f3\"}"}],"active":true,"profilePhotos":["https://api.dicebear.com/7.x/initials/svg?seed=CB","https://ucarecdn.com/c0e4843d-64ec-49ea-ace6-2a3bd6b1ae8c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"9f96c155-15ce-41a1-b3bb-12d7f2cb147a\"}"},{"__ref":"Education:{\"uuid\":\"edf4ec28-6465-44ff-9e99-3e2226c16791\"}"}],"hiredAt":"20
