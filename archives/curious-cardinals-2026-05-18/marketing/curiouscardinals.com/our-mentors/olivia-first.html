dicine?\" As I learned more about the inequities in the American healthcare system, this question felt increasingly important to my future career in medicine. I ultimately chose to study medical anthropology because I find its content fascinating and because I believe its lessons will help me to become a better doctor. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"40f7827b-fd0b-49fb-8d53-6d0d13cc824b\"}":{"__typename":"DeepDives","uuid":"40f7827b-fd0b-49fb-8d53-6d0d13cc824b","content":"\u003cp\u003eI want to hike through Patagonia, and I want to sail across the Pacific or Atlantic oceans! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"89c76b33-8a8a-4de2-9187-4124b1e0fa92\"}":{"__typename":"DeepDives","uuid":"89c76b33-8a8a-4de2-9187-4124b1e0fa92","content":"\u003cp\u003eI want to be a surgeon for underserved communities in the United States.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"14bab6ee-512b-43f1-9d56-7472ce222598\"}":{"__typename":"DeepDives","uuid":"14bab6ee-512b-43f1-9d56-7472ce222598","content":"\u003cp\u003eCook! I am constantly finding and inventing new recipes. I love cooking both because it allows me to enjoy great food but also because it is an excellent skill for bringing people together. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"85266b48-97bc-429a-9b35-1c21e2ad690b\"}":{"__typename":"Education","uuid":"85266b48-97bc-429a-9b35-1c21e2ad690b","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Medical Anthropology and Biology ","degree":null},"School:{\"uuid\":\"d43e0ce8-a888-42d2-b18d-e7f973c774fd\"}":{"__typename":"School","uuid":"d43e0ce8-a888-42d2-b18d-e7f973c774fd","name":"Concord Academy","city":"Concord","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01742"},"Education:{\"uuid\":\"a2207061-31a9-4ae3-9130-e596c602d4bd\"}":{"__typename":"Education","uuid":"a2207061-31a9-4ae3-9130-e596c602d4bd","school":{"__ref":"School:{\"uuid\":\"d43e0ce8-a888-42d2-b18d-e7f973c774fd\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"0577ee94-5f7f-49d2-9b77-579912c2f93b\"}":{"__typename":"MentorPublicProfile","uuid":"0577ee94-5f7f-49d2-9b77-579912c2f93b","displayName":"Olivia F.","slug":"olivia-first","biography":"\u003cp\u003eOlivia graduated from Brown University in the spring of 2023 with a double major in Medical Anthropology and Biology. She is pre-medical and hopes to begin medical school in 2024. Olivia is interested in exploring the world of women’s health and reproductive endocrinology. Additionally, she is passionate about issues surrounding healthcare access and health disparities. Accordingly, Olivia served as a head outreach worker with Brown’s “Housing Opportunities for People Everywhere” (HOPE) club for two years. This club provides direct outreach and support for housing-insecure individuals in Providence. Outside of school, Olivia is an avid backpacker and sailor. She also loves to travel and spent three months of her gap year country-hopping around the world. Finally, Olivia loves cooking, especially when making food for others-- in March of 2020, she created an Instagram account so that she could continue sharing her creations while in quarantine. Olivia has many years of teaching and tutoring experience: she worked as a Brown University Organic Chemistry tutor for second-semester students, a biology tutor at her high school (Concord Academy), and a sailing coach for six years.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOlivia looks forward to sharing her knowledge of biology, anthropology, bioethics, and chemistry, as well as her love for writing with future students. \u003c/p\u003e","teachingVideoPlaybackId":"ESlQ3vyJrNb025i2XyPKKV2rTPEIqFaKLYAsnCnoS2Sk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Medical Anthropology and Biology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cd987c74-b955-4abe-8d3a-1afeb2ccb0e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"40f7827b-fd0b-49fb-8d53-6d0d13cc824b\"}"},{"__ref":"DeepDives:{\"uuid\":\"89c76b33-8a8a-4de2-9187-4124b1e0fa92\"}"},{"__ref":"DeepDives:{\"uuid\":\"14bab6ee-512b-43f1-9d56-7472ce222598\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e1caf7ec-f700-49f2-ae1c-8e1ae6715c8f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"85266b48-97bc-429a-9b35-1c21e2ad690b\"}"},{"__ref":"Education:{\"uuid\":\"a2207061-31a9-4ae3-9130-e596c602d4bd\"}"}],"hiredAt":"2022-09-27T16:33:07.000Z","topics":["Chemistry","Medicine / Health","Cooking","Biology","Physics","Literature","Creative Writing","Philoso
