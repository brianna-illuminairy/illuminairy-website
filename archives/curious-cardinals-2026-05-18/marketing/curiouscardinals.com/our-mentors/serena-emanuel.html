},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"87909bca-1e9a-4571-8a88-02df8ba68af1\"}":{"__typename":"Education","uuid":"87909bca-1e9a-4571-8a88-02df8ba68af1","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Symbolic Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"dee65a9a-215b-4bda-83ec-31440ae01821\"}":{"__typename":"MentorPublicProfile","uuid":"dee65a9a-215b-4bda-83ec-31440ae01821","displayName":"Serena T.","slug":"serena-emanuel","biography":"Serena is a senior at Stanford University majoring in Symbolic Systems with a concentration in Early Childhood Development. Serena’s greatest passions are (1) understanding how children learn and (2) leveraging that knowledge to enhance children’s engagement and enjoyment in their own education! From spending her gap year as a childhood enrichment teacher in Singapore for students aged 1-7 years old, to tutoring low-income preschoolers through the Haas Center of Public Service, to designing technological tools that cultivate early literacy and self-efficacy, Serena’s expertise lies at the intersection of early childhood education, psychology, and technology.\n\nAt Stanford, she also strives to be an advocate for social impact and ethical innovation. In her Junior year, she served as Co-President of the Stanford Social Entrepreneurial Students Association (SENSA). She created and taught a Social Entrepreneurship Bootcamp to 70+ Stanford students, comprising a curriculum based in Design Thinking that teaches students how to create and pitch a social impact venture.\n\nUpon graduating from high school, she was one of 259 students out of 160,000 in the world to achieve a perfect score of 45 in the IB Diploma Program, alongside being a Brother Patrick Trophy nominee for outstanding achievement and deep interest in theatre/performing arts. She was also named her school's highest performing student in Theory of Knowledge—a subject involving the philosophical inquiry of knowledge itself. Learning and the pursuit of knowledge bring her such joy, and she hopes to spark that same love in her students!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/5900f39d-446b-4010-9aca-c89c5717b9a6/-/crop/768x769/0,20/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5d49736e-faf0-4934-8bfb-7d0a8712abb9\"}"},{"__ref":"Education:{\"uuid\":\"87909bca-1e9a-4571-8a88-02df8ba68af1\"}"}],"hiredAt":"2022-07-14T05:31:58.000Z","topics":["6-8 Grade Science","STEM Project","K-5 Grade Math","Coding / Programming","Writing","Public Speaking","Reading","Product Design","Business / Entrepreneurship","Film / Theater"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"serena-emanuel\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"dee65a9a-215b-4bda-83ec-31440ae01821\"}"}}},"_sentryTraceData":"cc7131eadd2b4ec19ce16f53db2cb21f-a4a008fe20e8f2ec-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=cc7131eadd2b4ec19ce16f53db2cb21f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"serena-emanuel"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-mana
