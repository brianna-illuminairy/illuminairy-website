vorites:{\"uuid\":\"bb529148-3e56-4e6c-b888-38d9e431c91d\"}":{"__typename":"Favorites","uuid":"bb529148-3e56-4e6c-b888-38d9e431c91d","photoUrl":"https://ucarecdn.com/a7389e3f-dd45-47e4-93fb-30e205f34673/","title":"Pentatonix","type":"ALBUM"},"Favorites:{\"uuid\":\"e3d6d45e-581e-4326-bc4f-6912f7591523\"}":{"__typename":"Favorites","uuid":"e3d6d45e-581e-4326-bc4f-6912f7591523","photoUrl":"https://ucarecdn.com/07b9bdfd-7f8b-4e84-a1e2-b5f6003529ec/","title":"Pentatonix","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"92657469-6237-42d6-af49-0be0a4ffdba9\"}":{"__typename":"DeepDives","uuid":"92657469-6237-42d6-af49-0be0a4ffdba9","content":"\u003cp\u003eIt all started with a website. Twelve-year-old me decided that I would become a YouTube sensation and having my own website was necessary to accomplish this. The challenge then was building it myself. I had my mom’s old, brick-shaped Windows XP laptop, that could run Notepad ++ at best, and access to the internet - but this was all I needed. After nights of online tutorials and an endless amount of scrolling down stack overflow threads, I had successfully created a working website. At the time, this translation from colored text to organized buttons and images felt like magic! This early experience cemented my passion for computer science and engineering, and I’ve since sought every opportunity to immerse myself in these fields, from robotics to game design. My goal is to use technology to turn ideas into creations that help others in our ever evolving world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"7665c9bc-6861-4915-9236-f9b6632c713c\"}":{"__typename":"DeepDives","uuid":"7665c9bc-6861-4915-9236-f9b6632c713c","content":"\u003cp\u003eAs an African-American male from a low-income background, my heritage and identity profoundly shape my teaching style. Having experienced what it feels like to not always feel welcomed in academic spaces, I am committed to creating an inclusive environment where all students can thrive. As a male, I also recognize the importance of ensuring that voices, especially female voices, have the space they need to be heard. Coming from a low-income environment, I am keenly aware of how fundamental concepts can be glossed over, so I prioritize spending extra time reinforcing the foundation material. I frequently invoke the Socratic method to engage students in meaningful discussions, ensuring they are actively involved and have the opportunity to share their unique perspectives. This approach fosters a classroom where diverse voices are valued and supported, and where everyone has the opportunity to succeed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"890c8767-972b-4c0c-92f2-18a2fac0b082\"}":{"__typename":"DeepDives","uuid":"890c8767-972b-4c0c-92f2-18a2fac0b082","content":"\u003cp\u003eI would tell my middle or high school self not to force yourself into paths that others think you should take to be successful. Success isn’t a one-size-fits-all journey, and you don’t have to follow the crowd to achieve it. There is always room for success where your heart feels passion. Trust yourself, pursue what truly excites you, and that passion will fuel your drive and lead to opportunities you never imagined.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"84ecec46-b7cf-4517-b1cd-7f1ddf0210a3\"}":{"__typename":"DeepDives","uuid":"84ecec46-b7cf-4517-b1cd-7f1ddf0210a3","content":"\u003cp\u003eMentorship matters to me because of the profound impact it had on my life, particularly through the guidance of my high school robotics coach Dr. Humphreys. After moving schools unexpectedly, I feared losing all the progress I had made in robotics, but Dr. Humphreys believed in me from the start, offering me opportunities that I never imagined possible. His unwavering faith in my potential, even when I struggled with imposter syndrome, allowed me to gain confidence in my abilities. He pushed me to grow, trusted me with responsibilities, and showed me that success is attainable when someone believes in you. Mentorship, to me, is about creating opportunities, fostering confidence, and helping others realize their potential, just as Dr. Humphreys did for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"845493e7-fcdb-4f86-bbcc-f88ca201660e\"}":{"__typename":"Education","uuid":"845493e7-fcdb-4f86-bbcc-f88ca201660e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"School:{\"uuid\":\"eee61c2d-333a-4ae2-b294-36f063059e04\"}":{"__typename":"School","uuid":"eee61c2d-333a-4ae2-b294-36f063059e04","name":"Mississippi School for Mathematics and Science","city":"Columbus","type":"HIGH","state":"Mississippi","country":"United States","zip":"39701"},"Education:{\"uuid\":\"d58cff35-1736-4f42-bb8d-e727ac6f458e\"}":{"__typename":"Education","uuid":"d58cff35-1736-4f42-bb8d-e727ac6f458e","school":{"__ref":"School:{\"uuid\":\"eee61c2d-333a-4ae2-b294-36f063059e04\"}"},"startYear":"2019","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"45901507-ea0b-4ab3-ae06-6cb86d5376f7\"}":{"__typename":"MentorPublicProfile","uuid":"45901507-ea0b-4ab3-ae06-6cb86d5376f7","displayName":"Bryant P.","slug":"bryant-perkins","biography":" Bryant is a pursuing a major in Computer Science at Stanford University with a focus in Natural Language Processing. He attended the only residential STEM school in Mississippi, participating in football, track \u0026 field, science bowl, and (most importantly) robotics. His aforementioned love for robotics has led him to qualify for the VEX Robotics World Championship. He also enjoyed tinkering with Unity and producing passable games.\nAt Stanford, Bryant enjoys singing in an all-original comedy A Capella group, Fleet Street. He also is a TA for Stanford's introductory computer science courses CS106A and CS106B. Aside from computer languages, Bryant is interested in learning languages across globe, currently learning German, Hindi, and Spanish.\nUpon completion of his academic endeavors, Bryant plans to make meaningful contributions to his home state of Mississippi and increase support for STEM for schools in under-resourced areas. Until then he will continue learning and find more ways to stay engaged with his community.\n","teachingVideoPlaybackId":"xpIl6VKZ8qRaSgvOR8lP5oqdemk13ahCwWTBNmS828o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"210a7e39-9816-43d9-bc15-d40144
