on and Georgetown respectively.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"d491ee08-2ce9-4450-9539-fc85533bdbe4\"}":{"__typename":"Education","uuid":"d491ee08-2ce9-4450-9539-fc85533bdbe4","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics \u0026 Psychology (Double Major)","degree":"B.A."},"School:{\"uuid\":\"8c759b4c-125d-48bc-bd95-a62522e0e975\"}":{"__typename":"School","uuid":"8c759b4c-125d-48bc-bd95-a62522e0e975","name":"Loyola High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90006"},"Education:{\"uuid\":\"94b9bea9-a89c-4da3-8a79-8f02ed3eac73\"}":{"__typename":"Education","uuid":"94b9bea9-a89c-4da3-8a79-8f02ed3eac73","school":{"__ref":"School:{\"uuid\":\"8c759b4c-125d-48bc-bd95-a62522e0e975\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"1aa8138c-c901-46b9-9452-36ae3830f52a\"}":{"__typename":"MentorPublicProfile","uuid":"1aa8138c-c901-46b9-9452-36ae3830f52a","displayName":"Jesse T.","slug":"jesse-troyer","biography":"\u003cp\u003eJesse is pursuing a double concentration in Economics and Psychology at Harvard College. In 2021, he graduated with summa cum laude honors from Loyola High School in Los Angeles, CA. His extracurriculars included being editor-in-chief of the newspaper, co-founder of both the Sports Statistics and the Mental Health clubs, and president of both the Investment Club and the Ignatian Scholars Academic Society. Outside of school, Jesse played travel ice hockey with the LA Jr. Kings club from ages 6-18. \u003cbr\u003e\u003cbr\u003eAt Harvard, Jesse is a member of the Harvard Undergraduate Real Estate Investment Group (HUREIG), the Harvard Sports Analytics Collective (HSAC), and a partner and analyst at Harvard's Black Diamond Capital, one of the largest student-run hedge funds in America (\u0026gt;$300K AUM). He is also a member of the Men's Club Ice Hockey team, where he can keep his hockey player dream alive for longer than he should... \u003cbr\u003e\u003cbr\u003eHe spent his freshman summer interning in the hockey department at CAA (Creative Artists Agency), which is the second largest hockey agency in the world. His sophomore summer, he joined  Capitolis, a financial technology startup valued above $1B, as a strategy intern. This upcoming summer, he looks forward to working as an investment analyst in Menlo Park, CA at Makena Capital Management, a endowment-style investment company run by the former senior executives of the Stanford Management Company.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d398ffdb-ed81-48af-a36b-2cb40d2b17f1\"}"},{"__ref":"Favorites:{\"uuid\":\"28ca15a0-8821-4cbc-acbf-156538bfb876\"}"},{"__ref":"Favorites:{\"uuid\":\"ef33b482-a25a-40a9-9549-07051d4bf56e\"}"}],"causesSupported":[],"major":"Economics \u0026 Psychology (Double Major)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"659ba4f4-5266-44f8-99f4-809d4f5b629f\"}"},{"__ref":"DeepDives:{\"uuid\":\"77ccbb9b-5d12-4519-9541-24ae4336d0aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"c0e9aa15-f1d4-45ec-9a0c-ce65a11b15f3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e4bbc663-4987-4c44-b032-86e45eedaf31/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d491ee08-2ce9-4450-9539-fc85533bdbe4\"}"},{"__ref":"Education:{\"uuid\":\"94b9bea9-a89c-4da3-8a79-8f02ed3eac73\"}"}],"hiredAt":"2023-
