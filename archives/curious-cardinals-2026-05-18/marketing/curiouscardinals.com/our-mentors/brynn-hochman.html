MentorPublicProfile:{\"uuid\":\"e1a07a1a-624e-4223-9b44-1630bc320b7a\"}":{"__typename":"MentorPublicProfile","uuid":"e1a07a1a-624e-4223-9b44-1630bc320b7a","displayName":"Brynn H.","slug":"brynn-hochman","biography":"Brynn is pursuing a major in Symbolic Systems and a minor in Chinese at Stanford University. She graduated Brentwood High School where she received cum laude honors and the Benjamin Franklin Book Award while working as a peer tutor and as a member of student government, Girl Impact, and the Benefacta Service Board. Brynn also wrote and published her own children’s book, “The Perfect Swish,” financed through her own Kickstarter campaign. Her book was inspired by her work for the last ten years raising money for and personally delivering wheelchairs to Israel, South Africa, Vietnam, West Virginia, and Ecuador. Brynn's love of language also led her to co-found an organization dedicated to recording the life stories of the elderly. Brynn also has volunteered for several years as a listener at TEENLINE, a teen-to-teen suicide hotline. Brynn's experiences have trained her to actively listen, empathize, and figure out unique ways to connect to others. Brynn cannot wait to use that training to bolster students’ self-confidence and love of learning. \n \nOutside of academics, Brynn loves to engage in deep conversations about life. She cherishes her time with family and friends, reading, watching tv (especially all things Marvel), and running. \n \nThroughout her learning career, Brynn has come to realize it’s not about who’s the first one to understand the lesson or the fastest one to answer the question. She believes George Evans, an American cartoonist, sums up learning perfectly: “Every student can learn, just not on the same day, or the same way.”\n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/beaad
