uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b64637c8-d799-4c15-9f80-7ec139219303\"}":{"__typename":"DeepDives","uuid":"b64637c8-d799-4c15-9f80-7ec139219303","content":"\u003cp\u003eI have always had a fascination and deep appreciation for life, from a young age, I would watch lizards and newts in the back yard, and as I grew up became interested in marine biology, ecology and eventually human physiology. Majoring in Biology at Stanford gave me the chance to explore all of these areas.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"00daa993-13af-4d12-a1d2-76b27760b0b3\"}":{"__typename":"Education","uuid":"00daa993-13af-4d12-a1d2-76b27760b0b3","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Biology/Neurobiology","degree":null},"School:{\"uuid\":\"acc162be-1fe8-40f2-b048-44b38f0d7129\"}":{"__typename":"School","uuid":"acc162be-1fe8-40f2-b048-44b38f0d7129","name":"Woodside Priory School","city":"Portola Valley","type":"HIGH","state":"California","country":"United States","zip":"94028"},"Education:{\"uuid\":\"f4317fac-3784-48a6-8644-f5bedc6c1a90\"}":{"__typename":"Education","uuid":"f4317fac-3784-48a6-8644-f5bedc6c1a90","school":{"__ref":"School:{\"uuid\":\"acc162be-1fe8-40f2-b048-44b38f0d7129\"}"},"startYear":"2014","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"33600e0b-50b9-423c-9065-1c0e0540bc17\"}":{"__typename":"MentorPublicProfile","uuid":"33600e0b-50b9-423c-9065-1c0e0540bc17","displayName":"Emma J.","slug":"emma-jaeger","biography":"\u003cp\u003eEmma is a recent Stanford Graduate, having majored in Biology with a Neurobiology specialty. Emma is currently taking a gap year while applying for medical school, and working as an MRI scan operator and research coordinator in the Stanford Neurodevelopment Affect and pathology lab, she also currently has a publication under review. When not in the lab, she can be found volunteering at Stanford VA, or fostering kittens.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEmma was honored as Valedictorian of her graduating class at Woodside Priory High School and excelled at Model United Nations. She led her cross country team to state championships as varsity captain, and is passionate about her work coaching underserved girls with Bay Area Women’s Sports initiative. A lover of all things French, Emma speaks the language with her mother and loves discussing French art, film and culture. During her junior summer she served as a Dr. James Fann Teaching Fellow in the Cardiothoracic labs at Stanford, having dedicated her previous summers to cardiac study. Emma is also one of the youngest people to assist in the operating room in the first phase of a heart transplant alongside her mentor, Cardiothoracic Surgeon Paul Chang.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology/Neurobiology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b5b69d89-886b-4682-85c1-9068b2d15125\"}"},{"__ref":"DeepDives:{\"uuid\":\"b64637c8-d799-4c15-9f80-7ec139219303\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0fef6b29-c863-42da-a9be-db370a281f54/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"00daa993-13af-4d12-a1d2-76b27760b0b3\"}"},{"__
