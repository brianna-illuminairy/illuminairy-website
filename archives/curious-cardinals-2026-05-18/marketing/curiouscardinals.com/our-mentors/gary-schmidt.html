../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"183d4b06-9434-4c65-82d4-6dc972bb5b49\"}":{"__typename":"Favorites","uuid":"183d4b06-9434-4c65-82d4-6dc972bb5b49","photoUrl":"https://ucarecdn.com/39b8a29b-98a6-4591-bb6b-ba03683a3917/","title":"Rocket League","type":"GAME"},"Favorites:{\"uuid\":\"afa3410a-1c0a-40fe-8176-bdab203ef0df\"}":{"__typename":"Favorites","uuid":"afa3410a-1c0a-40fe-8176-bdab203ef0df","photoUrl":"https://ucarecdn.com/f09d742d-b704-4568-99ee-6a2cb6cd081e/","title":"Adam Sandler","type":"ACTOR"},"Favorites:{\"uuid\":\"f4074bf6-9e42-4d2f-8216-18337a87459f\"}":{"__typename":"Favorites","uuid":"f4074bf6-9e42-4d2f-8216-18337a87459f","photoUrl":"https://ucarecdn.com/c8b0f981-3a2e-40d8-b5bb-e45f4121703d/","title":"Chelsea Football Club","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"487f8ff2-ec03-492e-a98b-999bd9cf435e\"}":{"__typename":"DeepDives","uuid":"487f8ff2-ec03-492e-a98b-999bd9cf435e","content":"\u003cp\u003eMentorship matters to me because I have seen the immeasurable impact it can have in one’s life first-hand in mine. I have been so drastically impacted by mentors at nearly every step of my life and it has left me with a burning passion to carry this same impact into the lives of others. If I can make a fraction of the same difference others have for me, I will have done something to remember for the rest of my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"8df5117e-82ae-4c66-b9a8-05c8f2e01cb0\"}":{"__typename":"DeepDives","uuid":"8df5117e-82ae-4c66-b9a8-05c8f2e01cb0","content":"\u003cp\u003eThe people around me, family, friends, and everyone that has the audacity to believe in me. I have the luckiest and richest group of people in the world and that is something I will never take for granted. Every day I get to wake up and pursue the life of my dreams is a fortunate one and I will never be short on motivation because of that.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"545c9389-0f51-4220-8c02-0bf1b0b0af4c\"}":{"__typename":"DeepDives","uuid":"545c9389-0f51-4220-8c02-0bf1b0b0af4c","content":"\u003cp\u003eThere are two key reasons why mentorship is the best. The first is that I always find myself learning new things from these kids. I can be teaching nearly any subject and at the end of every session, I often come away with something new – there are few jobs anywhere that can bring you this. The second reason is a bit more heartfelt: the more I tutor, the better my life seems to be. Time spent enriching the lives of others has such a special impact on my heart. There really is no better job out there.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"8460c835-20aa-4204-aad7-b9ad287a4406\"}":{"__typename":"DeepDives","uuid":"8460c835-20aa-4204-aad7-b9ad287a4406","content":"\u003cp\u003eI like to credit two: my long-time soccer coach, Oumar Seck and my high school journalism advisor, Barb Tholen. Both played invaluable roles for me in teaching me not just about their respective fields, but about life. In different forms and at different times, these two stepped in for me in ways that truly changed the trajectory of my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e458e624-7807-4b07-ac5d-eb1620889efd\"}":{"__typename":"Education","uuid":"e458e624-7807-4b07-ac5d-eb1620889efd","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Economics","degree":null},"School:{\"uuid\":\"0caf5589-6b6f-4fbc-a9d5-19227106ffe8\"}":{"__typename":"School","uuid":"0caf5589-6b6f-4fbc-a9d5-19227106ffe8","name":"Lawrence High School","city":"Lawrence","type":"HIGH","state":"Kansas","country":"United States","zip":"66044"},"Education:{\"uuid\":\"fad6bd01-0fb8-4b4d-89eb-4dfe6de8ea26\"}":{"__typename":"Education","uuid":"fad6bd01-0fb8-4b4d-89eb-4dfe6de8ea26","school":{"__ref":"School:{\"uuid\":\"0caf5589-6b6f-4fbc-a9d5-19227106ffe8\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"07b3bd15-2372-49c2-addc-1e07f11526f8\"}":{"__typename":"MentorPublicProfile","uuid":"07b3bd15-2372-49c2-addc-1e07f11526f8","displayName":"Gary S.","slug":"gary-schmidt","biography":"\u003cp\u003eGary is a senior at Stanford University pursuing a Bachelors in Economics and planning on pursuing a Masters degree in Computer Science. Hailing from Lawrence, Kansas, he graduated valedictorian from Lawrence High School before journeying to California as a Questbridge National College Match recipient. Gary's proudest accomplishments prior to heading to Stanford centered around his work in Journalism, where as Editor-in-Chief of his school's newspaper, was able to lead his staff to receive a Pacemaker Award, the highest honor offered in Scholastic Journalism. At Stanford, he has been involved in many things from playing on the Rugby team to class leadership positions including Frosh Council, being part of Class Cabinets, and being a student leader working with administration to shape a new Stanford. Wherever it is he goes, he centers himself around working hard to curate and share in great communities, which he believes are the backbone of everything he does. After Covid hit during his freshman year, he made the difficult but deeply rewarding decision to take a gap year and pause his education. During this time he was able to gain meaningful experience working in finance roles and on a business development team for a sports betting startup, not to mention tutoring with Curious Cardinals. Returning to Stanford post-Covid and led by the meaningful life lessons his time away from school served him, he was reinvigorated with the passion to chase after what he loves, adding in a rigorous technical component to his Economics course load with the purpose of mastering a fantastic marriage between the intersection of business and technology. He has spent time working in different ares of business through experiences gained during his gap year and a summer spent living and working at a wealth management firm in Santiago, Chile. Though his work has centered around business and finance, his greatest passion lies in  sports and the unbelievably deep world that lies behind the scenes in business, technology and media. A soccer player his entire life, Gary one day desires to work in professional sports management, combining his academic and extracurricular passions. He is currently pursuing this dream by developing new products to serve different MLS franchises and is actively pursuing opportunities to gain exposure and hopefully work with different professional soccer teams. Gary believes firmly in pursuing what you are passionate about -- whatever it may be -- and is determined to help you reach your goals!\u003c/p\u003e","teachingVideoPlaybackId":"XOJdd01juPbGKsz96P01vafXUDKZ3rVyZbMAWzHYi14O4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"183d4b06-9434-4c65-82d4-6dc972bb5b49\"}"},{"__ref":"Favorites:{\"uuid\":\"afa3410a-1c0a-40fe-8176-bdab203ef0df\"}"},{"__ref":"Favorites:{\"uuid\":\"f4074bf6-9e42-4d2f-8216-18337a87459f\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"487f8ff2-ec03-492e-a98b-999bd9cf435e\"}"},{"__ref":"DeepDives:{\"uuid\":\"8df5117e-82ae-4c66-b9a8-05c8f2e01cb0\"}"},{"__ref":"DeepDives:{\"uuid\":\"545c9389-0f51-4220-8c02-0bf1b0b0af4c\"}"},{"__ref":"DeepDives:{\"uuid\":\"8460c835-20aa-4204-aad7-b9ad287a4406\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0fe34385-5bf3-44f0-a141-144ea513290e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e458e624-7807-4b07-ac5d-eb1620889efd\"}"},{"__ref":"Education:{\"uuid\":\"fad6bd01-0fb8-4b4d-89eb-4dfe6de8ea26\"}"}],"hiredAt":"2021-09-09T23:25:52.000Z","topics":["Statistics","Public Speaking","Journalism","Geometry","Economics","Algebra I","Pre-Algebra","Finance / Investing","Sports Journalism","Algebra II","Business / Entrepreneurship","Writing","Reading"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gary-schmidt\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"07b3bd15-2372-49c2-addc-1e07f11526f8\"}"}}},"_sentryTraceData":"d52628d8af2944d9b7a367fb1248078f-a0b1121663c3d5ac-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d52628d8af2944d9b7a367fb1248078f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"gary-schmidt"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.get
