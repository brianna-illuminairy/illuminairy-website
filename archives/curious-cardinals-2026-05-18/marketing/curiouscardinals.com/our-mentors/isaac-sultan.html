ool:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"8fcfbce9-2b59-438d-8394-af3bca5d2ded\"}":{"__typename":"Education","uuid":"8fcfbce9-2b59-438d-8394-af3bca5d2ded","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Journalism ","degree":null},"MentorPublicProfile:{\"uuid\":\"44cd3e15-014b-48e4-a63f-c2cfd055c7e6\"}":{"__typename":"MentorPublicProfile","uuid":"44cd3e15-014b-48e4-a63f-c2cfd055c7e6","displayName":"Isaac S.","slug":"isaac-sultan","biography":"\u003cp\u003eIsaac graduated from Northwestern University where he majored in journalism and earned minors in marketing and history. Isaac is passionate about reporting, writing, and crafting engaging narratives. From interviewing a San Francisco based artist about his interactive sound installation to speaking to city government leaders about public transportation reforms, Isaac is always searching for meaningful stories to answer his own questions and learn more about the world around him. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAt the Medill School of Journalism, he’s taken classes like data visualization, multimedia reporting, and even tried his hand with a bit of HTML coding this past quarter. Outside of the classroom, Isaac is a senior editor of North by Northwestern, the university’s leading print-magazine. He is also a frequent contributor to WNUR Radio, reporting and producing audio stories about the Northwestern and Evanston community. Last winter, he was selected to participate in Northwestern’s Bay Area Immersion Program, a unique quarter-long program based in San Francisco examining the intersections of journalism, design, and technology. Last summer, Isaac was a reporting intern for The Village Sun, a local online newspaper covering New York City’s downtown neighborhoods. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eIsaac is a proud New Yorker – he was a 13-year “survivor” at The Collegiate School where he was captain of the track team, editor-in-chief of the school newspaper, and peer mentor for underclassmen. In his free time, Isaac loves to run in Central Park, watch his favorite soccer team (Liverpool), and do The New York Times daily crossword. At Curious Cardinals he wants to help students find their voice in writing, learn to communicate clearly with language, and feel pride in their work.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Journalism ","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/7d2fd0f4-a6c8-4f6d-9f5b-90e398a87ef4/-/crop/624x625/52,67/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b69a07b7-5eef-4bea-93d9-39c4a6479740\"}"},{"__ref":"Education:{\"uuid\":\"8fcfbce9-2b59-438d-8394-af3bca5d2ded\"}"}],"hiredAt":"2021-11-05T18:54:43.000Z","topics":["Business / Entrepreneurship","Creative Writing","Literature","History Project","History","Journalism","Philosophy","Sports Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isaac-sultan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"44cd3e15-014b-48e4-a63f-c2cfd055c7e6\"}"}}},"_sentryTraceData":"4a76b8190aea49d5a717b7d0f7f05e21-870fe0845e5e9369-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4a76b8190aea49d5a717b7d0f7f05e21,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampl
