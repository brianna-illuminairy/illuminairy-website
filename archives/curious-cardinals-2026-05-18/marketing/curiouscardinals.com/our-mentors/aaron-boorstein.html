../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"b703396e-916d-4271-b815-b9188977bbf3\"}":{"__typename":"DeepDives","uuid":"b703396e-916d-4271-b815-b9188977bbf3","content":"\u003cp\u003eI've come to recognize the profound impact of mentors on personal and professional development. Whenever navigating an academic or professional domain, I turn to mentors who are experts in their fields. Today, I'm fortunate to be guided by several mentors—former professors, managers, and others—who generously share their wisdom and experience with me. Their guidance has fueled my curiosity, driven my growth, and ignited my passion for lifelong learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, I'm excited to give back by mentoring K-12 students. I'm eager to spark their curiosity, accelerate their learning, and exemplify the power of mentorship. For me, mentorship is deeply rewarding and genuinely enjoyable, never feeling like work. It's a joy to see students grow and thrive, and I hope to leave them inspired, eager to explore more, and confident in their potential after each session. Mentorship has become one of my life's most valuable educational tools, and it's an incredibly fulfilling way to make a difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"53371246-7584-4f20-8cf6-301780f3142e\"}":{"__typename":"Education","uuid":"53371246-7584-4f20-8cf6-301780f3142e","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Journalism","degree":"Bachelor of Science"},"School:{\"uuid\":\"b9430edb-849d-42cc-9da6-9615e1d8dd7e\"}":{"__typename":"School","uuid":"b9430edb-849d-42cc-9da6-9615e1d8dd7e","name":"Middleton High School","city":"Middleton","type":"HIGH","state":"Wisconsin","country":"United States","zip":"53562"},"Education:{\"uuid\":\"da977912-bab1-4dc7-b74a-2e3b1cad4e5d\"}":{"__typename":"Education","uuid":"da977912-bab1-4dc7-b74a-2e3b1cad4e5d","school":{"__ref":"School:{\"uuid\":\"b9430edb-849d-42cc-9da6-9615e1d8dd7e\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"c37c3319-7aab-4975-898f-c497a73c1a10\"}":{"__typename":"MentorPublicProfile","uuid":"c37c3319-7aab-4975-898f-c497a73c1a10","displayName":"Aaron B.","slug":"aaron-boorstein","biography":"\u003cp\u003eThe ability to express yourself clearly and effectively in writing isn’t just useful, it’s life-changing. It transforms the way you think, helps you ask better questions, and builds connections with people across backgrounds and ideas. My goal is to help students discover that same sense of power and possibility. Whether they dream of being novelists or astronauts, I want to help them become confident, thoughtful writers who are unafraid of anything that comes their way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo accomplish this, I integrate my passions for writing and teaching with my academic and professional experience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI start by helping students clarify their ideas before turning to grammar or structure. I ask them: What do you want to say? Why does it matter?\u0026nbsp;Once their message is clear, I encourage them to write a first draft freely and without inhibition, as this is often the hardest step. Then, we work together line by line to refine clarity, coherence, and style.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve supported students across a wide range of writing, from short stories and blog posts to academic essays and personal statements. Regardless of the medium, I strive to provide feedback that helps students build skills they can carry across all forms of writing. I also actively seek students’ feedback to ensure I’m meeting their needs and learning styles, and accordingly adapt my approach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was the founding Editor-in-Chief of our award-winning student newspaper, a jazz trumpeter, a rec-league basketball player, and the creator of a teen-focused column in our city’s local newspaper. I earned a perfect score on the ACT English section and took several AP courses, including Language and Composition and Literature and Composition.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern University, I served as Co-Editor-in-Chief of the\u0026nbsp;\u003cem\u003eNorthwestern Business Review\u003c/em\u003e\u0026nbsp;and won my journalism school’s annual essay contest. During my senior year, I also interned at\u0026nbsp;\u003cem\u003eSmithsonian Magazine\u003c/em\u003e, where I reported on everything from students using AI to preserve historic architecture in Hawaii to the unveiling of a dinosaur fossil at the Chicago Field Museum.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I work as an enterprise strategy and insights data analyst at Adobe, where I deliver data-driven insights to inform product and sales decisions. At the company, I've seized volunteer opportunities such as serving as an Employee Community Fund Grant Reviewer and a team lead for a design for good workshop in collaboration with a nearby university.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work, I’m an avid reader and writer of fiction. I enjoy playing sports (basketball, football, soccer), spending time outdoors, watching movies, and being with family and friends.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Journalism","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b703396e-916d-4271-b815-b9188977bbf3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a7aafac5-9cc9-4ddc-8fdd-60d90f2ef648/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"53371246-7584-4f20-8cf6-301780f3142e\"}"},{"__ref":"Education:{\"uuid\":\"da977912-bab1-4dc7-b74a-2e3b1cad4e5d\"}"}],"hiredAt":"2022-09-16T23:02:09.000Z","topics":["Writing","Public Speaking","Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"aaron-boorstein\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c37c3319-7aab-4975-898f-c497a73c1a10\"}"}}},"_sentryTraceData":"129ce6d3945d41cfac522e597f6aa61d-9f272f47d807c005-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=129ce6d3945d41cfac522e597f6aa61d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"aaron-boorstein"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
