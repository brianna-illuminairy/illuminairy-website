typename":"Favorites","uuid":"ac124925-a703-498a-a1d5-bdbf76cdf0c2","photoUrl":"https://ucarecdn.com/b30c4eb9-8211-451c-986d-ea51eba17463/","title":"Just A Dream","type":"SONG"},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"0866cb9a-48bd-4da9-aeb7-4529c6bd82eb\"}":{"__typename":"DeepDives","uuid":"0866cb9a-48bd-4da9-aeb7-4529c6bd82eb","content":"\u003cp\u003eLast semester, I taught my amazing 7th-grade mentee about the intersection between science and dance. With our shared background in ballet and passion for research, we built a website that explored the scientific elements of dance, the relationship between dance and the brain, and the psychology of dance therapy. We even highlighted  nonprofits using dance therapy in her communities!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2b00a136-3742-4d2a-b1a9-a6b865f35393\"}":{"__typename":"DeepDives","uuid":"2b00a136-3742-4d2a-b1a9-a6b865f35393","content":"\u003cp\u003eI would tell my younger self to keep spending time on the subjects I loved! Follow your gut and find intersections between your classes and the things you're drawn to in your free time. In my freshman year of high school, I immediately loved my science courses and kept signing up for more classes. I found an intersection with my background as a ballet dancer and my passion for teaching - this work ended up sparking several of my extracurriculars and my entire college application!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"aa75a6e7-2079-44b3-b24b-7115e81535cc\"}":{"__typename":"DeepDives","uuid":"aa75a6e7-2079-44b3-b24b-7115e81535cc","content":"\u003cp\u003eI love crafts! I'm very detail-oriented, and I love puzzles, cooking, and art. When I was younger, I taught myself calligraphy!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"94ae537b-1211-488e-8745-2cea67d14e5e\"}":{"__typename":"Education","uuid":"94ae537b-1211-488e-8745-2cea67d14e5e","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":"BA"},"School:{\"uuid\":\"b0ec6350-9b03-4caa-989c-9f3a8ab16531\"}":{"__typename":"School","uuid":"b0ec6350-9b03-4caa-989c-9f3a8ab16531","name":"Convent of the Sacred Heart","city":"New York","type":"HIGH","state":"NY","country":"United States","zip":"10128"},"Education:{\"uuid\":\"82972848-4a5b-4e09-8225-06fbcee4029c\"}":{"__typename":"Education","uuid":"82972848-4a5b-4e09-8225-06fbcee4029c","school":{"__ref":"School:{\"uuid\":\"b0ec6350-9b03-4caa-989c-9f3a8ab16531\"}"},"startYear":"2007","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"cf1ef1fd-dbf7-4f02-8dd1-c385ee2834c8\"}":{"__typename":"MentorPublicProfile","uuid":"cf1ef1fd-dbf7-4f02-8dd1-c385ee2834c8","displayName":"Francesca C.","slug":"francesca-cruz","biography":"\u003cp\u003eFrancesca is a senior at Yale University pursuing a degree in Economics with a certificate in Statistics and Data Science. Originally from New York City, she graduated from Convent of the Sacred Heart in 2021. In high school, her curriculum included a variety of A.P. courses in Calculus AB and BC, Chemistry, Biology, Spanish Language and Literature, World History, U.S. History, and English Literature.\u003cbr\u003e\u003cbr\u003eOutside of the classroom, Frankie was a principal dancer at Manhattan Ballet School for over 10 years, which remains one of her favorite pastimes. With a love for travel and international relations, she was also president of her school’s Model United Nations team and studied abroad to Madrid during her sophomore year. She plans to study abroad in Copenhagen in spring of this year!\u003cbr\u003e\u003cbr\u003ePassionate about STEM education, Frankie dedicated a majority of her time in high school to creating after school programs for East Harlem and Yorkville elementary school students. She led one of these programs, Steps Through Science, for four years, combining science concepts and movement to help students learn kinesthetically. Building on her passion for tactile learning, she co-founded Spring Into STEAM, which blended childhood science literature and hands-on activities. In her senior year, Frankie completed an Independent Study of Social-Emotional Learning with the Yale Center for Emotional Intelligence; this project became a central focus of her Senior Capstone project on inequities in STEM education for marginalized students.\u003cbr\u003e\u003cbr\u003eAt Yale, Frankie continues to pursue her love for teaching by volunteering as a college essay editor for the Fair Opportunities Project. She is also a Research Assistant for graduate students at Yale and Columbia studying the global trade in plastic waste, sparking her interest in data science for social impact. Strongly interested in tech, she spent the past summers working at PayPal and BlackRock's Wealth Tech division.\u003cbr\u003e\u003cbr\u003eIn her free time, Frankie loves watching any and all sitcoms and tv shows (Parks \u0026amp; Rec is a favorite!), cooking, attending Orange Theory classes, and spending time with her friends.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ee9fa6ca-3378-4ceb-b05f-ee12bc3cd979\"}"},{"__ref":"Favorites:{\"uuid\":\"31e4331f-867e-444a-997c-16a5013ab752\"}"},{"__ref":"Favorites:{\"uuid\":\"ac124925-a703-498a-a1d5-bdbf76cdf0c2\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0866cb9a-48bd-4da9-aeb7-4529c6bd82eb\"}"},{"__ref":"DeepDives:{\"uuid\":\"2b00a136-3742-4d2a-b1a9-a6b865f35393\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa75a6e7-2079-44b3-b24b-7115e81535cc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f9d8f5d6-5657-4a4a-b1f8-e426ad8384c9/-/crop/653x653/163,0/-/preview/-/format/jpg/","https://ucarecdn.com/a1411af0-f02a-4197-a824-ba6b4dfa5eca/-/preview/-/format/jpg/","https://ucarecdn.com/51b39b98-da27-4cde-b4f2-66d72352880b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"94ae537b-1211-488e-8745-2cea67d14e5e\"}"},{"__ref":"Education:{\"uuid\":\"82972848-4a5b-4e09-8225-06fbcee4029c\"}"}],"hiredAt":"2023-02-09T02:05:47.679Z","topics":["K-5 Grade Math","Algebra I","Geometry","Spanish","Writing"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"francesca-cruz\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"cf1ef1fd-dbf7-4f02-8dd1-c385ee2834c8\"}"}}},"_sentryTraceData":"47cc493efaff4c93bcd42976e451
