../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"00a9ebd3-dccf-483b-a148-ee220620d235\"}":{"__typename":"DeepDives","uuid":"00a9ebd3-dccf-483b-a148-ee220620d235","content":"\u003cp\u003eYou can't do everything! Focus in on what you really love, rather than doing activities just for the sake of doing them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4698d555-4198-4886-ab69-30996419eb68\"}":{"__typename":"DeepDives","uuid":"4698d555-4198-4886-ab69-30996419eb68","content":"\u003cp\u003eMentorship matters to me because I would not be where I am today without the guidance and support of the wonderful people in my life. I hope to be able to provide the same quality of counsel.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"9d1861d7-95f8-41c1-b572-72670dd7aa36\"}":{"__typename":"DeepDives","uuid":"9d1861d7-95f8-41c1-b572-72670dd7aa36","content":"\u003cp\u003eAs a high school student I was serious, shy, and perhaps a little too focused—to the detriment of my mental health at times. I hope to be able to help my mentees find balance, learning from my mistakes!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f0faa95a-bce7-42e1-9bd7-38c9300628e8\"}":{"__typename":"DeepDives","uuid":"f0faa95a-bce7-42e1-9bd7-38c9300628e8","content":"\u003cp\u003eI chose my major(s) because I couldn't decide on one! More specifically, I love both literature and politics, and I believe that contrary to what some may think, they complement each other in intriguing and productive ways.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"fc51edc4-91cc-4420-b9c5-d82cd9363070\"}":{"__typename":"School","uuid":"fc51edc4-91cc-4420-b9c5-d82cd9363070","name":"Rancho Mirage High School","city":"Rancho Mirage","type":"HIGH","state":"California","country":"United States","zip":"92270"},"Education:{\"uuid\":\"49e60a38-c784-4a86-8b38-f4d8af29830c\"}":{"__typename":"Education","uuid":"49e60a38-c784-4a86-8b38-f4d8af29830c","school":{"__ref":"School:{\"uuid\":\"fc51edc4-91cc-4420-b9c5-d82cd9363070\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"daa7b750-c946-41b0-a32a-6d27ed22c31a\"}":{"__typename":"Education","uuid":"daa7b750-c946-41b0-a32a-6d27ed22c31a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"International Relations and Comparative Literature","degree":"B.A."},"Testimonial:9beec355-b9fc-4575-b91d-7623239a6c27":{"__typename":"Testimonial","id":"9beec355-b9fc-4575-b91d-7623239a6c27","text":"Olivia Manes has been an outstanding mentor to Lauren. She has helped her to think big, put her ideas into action, and has given her confidence, knowing she was invested in her success and growth. We are grateful to Curious Cardinals and Olivia for being such a positive force and accelerator of Lauren’s development. \n\nMike Fridgen","date":"2025-05-30 18:40:04.37+00","rating":5,"endorser":{"__typename":"Endorser","name":"Mike Fridgen","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"e607aefb-8f62-4f44-8384-50818707ccc9\"}":{"__typename":"MentorPublicProfile","uuid":"e607aefb-8f62-4f44-8384-50818707ccc9","displayName":"Olivia M.","slug":"olivia-manes","biography":"\u003cp\u003eOlivia is a graduate of Stanford University with a dual BA in International Relations and Comparative Literature. She also recently completed an MPhil in International Studies at the University of Cambridge.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA native of the Southern California Desert, she grew up wandering through sand dunes, searching for treasure among the grains of sand. She found it in the form of the wonderful teachers, peers, and support systems she’s encountered in her years of education. In high school, she often felt her humanities education was lacking, and founded a literary club dedicated to the discussion of political literature. She created a creative writing blog, where she began reflecting on the unique ways humans and environment intersect in the desert. She was also an active member of her high school debate team, where her love of politics flourished, and her team won multiple regional championships. She graduated as valedictorian.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, Olivia had the opportunity to pursue her interests in new and often challenging ways. As editor in chief for \u003cem\u003eLeland Quarterly\u003c/em\u003e, Stanford's creative writing magazine, Olivia incorporated new voices in the publication, including its first-ever foreign language piece. She took classes on everything from authoritarianism to Russian literature to a novel-writing workshop. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, she has worked at the US Department of State for the Bureau of Democracy, Human Rights and Labor as well as the European Parliament doing human rights work. She is currently employed as an Associate Editor at \u003cem\u003eLawfare\u003c/em\u003e, a publication associated with Brookings that examines the intersection between law and national security issues.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn her free time, Olivia loves to read, write, work out, spend time with friends and family, and practice her Spanish and Russian. She watches the occasional pretentious film, but enjoys her fair share of really bad movies, too. As a Curious Cardinal mentor, Olivia hopes to provide her students with the same treasure she was lucky enough to find in hometown’s sand dunes: an enthusiasm for learning and growing that can only be inspired by patient, thoughtful, and flexible teachers who can adapt based on their student’s needs.\u003c/p\u003e","teachingVideoPlaybackId":"47T01TAFdR00Ig4dg3AnZN01rqaUdl2lk8KJdLgZ00TWFUQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"International Relations and Comparative Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"00a9ebd3-dccf-483b-a148-ee220620d235\"}"},{"__ref":"DeepDives:{\"uuid\":\"4698d555-4198-4886-ab69-30996419eb68\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d1861d7-95f8-41c1-b572-72670dd7aa36\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0faa95a-bce7-42e1-9bd7-38c9300628e8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b895dc80-f9d6-438a-9681-d4f2f6beb8c5/-/preview/-/format/jpg/","https://ucarecdn.com/1ddcfe31-5469-46f2-b04d-4fe1e46d8151/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"49e60a38-c784-4a86-8b38-f4d8af29830c\"}"},{"__ref":"Education:{\"uuid\":\"daa7b750-c946-41b0-a32a-6d27ed22c31a\"}"}],"hiredAt":"2023-03-14T19:05:05.450Z","topics":["Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","Creative Writing","K-6 Storybook","Law / Government / Policy","Journalism","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[{"__ref":"Testimonial:9beec355-b9fc-4575-b91d-7623239a6c27"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"olivia-manes\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":
