al manager of the Philadelphia Eagles.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4a472893-453f-4e0f-ada5-8c30bdfb8556\"}":{"__typename":"DeepDives","uuid":"4a472893-453f-4e0f-ada5-8c30bdfb8556","content":"\u003cp\u003eMentorship matters to me because I believe that all people have the right to engage with their personal passions. By helping young people broaden their intellectual and creative horizons, mentors can help to create a more thoughtful world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"2fa674a8-d06f-4699-b710-7259cc8981e5\"}":{"__typename":"DeepDives","uuid":"2fa674a8-d06f-4699-b710-7259cc8981e5","content":"\u003cp\u003eMy greatest role model is 20th Century American intellectual Randolph Bourne. While they understood his genius, the intelligentsia ostracized Bourne because of his physical disabilities and opposing viewpoints. His perseverance in advocating for pacifism and cultural inclusivity inspires me to stand up for my beliefs.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ed1810f4-7589-4e2d-a26f-592c273e1ead\"}":{"__typename":"DeepDives","uuid":"ed1810f4-7589-4e2d-a26f-592c273e1ead","content":"\u003cp\u003eIn my spare time, I love reading and playing guitar. College can be a exhilarating but also stressful, so taking time for myself to work at those hobbies helps keep me refreshed and grounded.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}":{"__typename":"School","uuid":"375c6521-abfd-4666-859e-1190f187c648","name":"Collegiate School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10069"},"Education:{\"uuid\":\"b4c4b9f9-a09b-457e-a0a6-df6c58bc86d1\"}":{"__typename":"Education","uuid":"b4c4b9f9-a09b-457e-a0a6-df6c58bc86d1","school":{"__ref":"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}"},"startYear":"2008","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"29c9ca8b-dd95-4343-8580-f984a08128e9\"}":{"__typename":"Education","uuid":"29c9ca8b-dd95-4343-8580-f984a08128e9","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"History \u0026 Economics","degree":"BA"},"MentorPublicProfile:{\"uuid\":\"fbe81f54-09c8-489d-bf35-862a0527d4cf\"}":{"__typename":"MentorPublicProfile","uuid":"fbe81f54-09c8-489d-bf35-862a0527d4cf","displayName":"Oliver F.","slug":"oliver-fuisz","biography":"\u003cp\u003eOliver is a student at Columbia University pursuing a double-major in History and Economics. A native New Yorker, Oliver graduated cum laude from Collegiate School, where he developed his passions for history and literature through AP courses, electives, and independent research projects. Additionally, he served as the president of the theater collective and event captain for the debate team, fueling his passion for helping others write, speak, and act persuasively. Through these activities, Oliver honed his abilities as a public speaker, critical thinker, and creative performer. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Columbia, Oliver has continued developing his skills as a historian and an actor. As an editor for the Columbia Journal of History, he has gotten hands-on experience in contributing to new historical research. He has also been heavily involved in Columbia’s King’s Crown Shakespeare Troupe, acting in lead roles in Henry IV and Antony and Cleopatra while serving on the club’s executive board. This Spring, he directed the troupe's production of A Midsummer Night's Dream, managing a team of 60+ cast and crew and a $10,000 budget. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn his free time, Oliver enjoys chatting about sports, playing poker, reading Russian literature, and spending quality time with family and friends. Deeply curious about all sorts of subjects, he can often be found diving down Wikipedia rabbit holes and rewatching old episodes of Jeopardy. From historical research to stage acting, Oliver is keen on engaging with students about his passions, and hopes to help them develop their love for learning and confidence in their ability to pursue their goals!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d2a15f3d-5d7e-4325-a4a0-f9afe3dbba48\"}"},{"__ref":"DeepDives:{\"uuid\":\"4a472893-453f-4e0f-ada5-8c30bdfb8556\"}"},{"__ref":"DeepDives:{\"uuid\":\"2fa674a8-d06f-4699-b710-7259cc8981e5\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed1810f4-7589-4e2d-a26f-592c273e1ead\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/97832ebb-1852-4eba-8b62-cf73bb2854b9/-/crop/499x499/0,99/-/previe
