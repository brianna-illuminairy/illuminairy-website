nce ","degree":"Bachelor’s"},"School:{\"uuid\":\"2af680fe-a7d5-49e3-89bf-a3e5ede5eb52\"}":{"__typename":"School","uuid":"2af680fe-a7d5-49e3-89bf-a3e5ede5eb52","name":"Dwight D Eisenhower High School","city":"Blue Island","type":"HIGH","state":"Illinois","country":"United States","zip":"60406"},"Education:{\"uuid\":\"5697309c-3b8b-451c-bce3-43e4ddc800a4\"}":{"__typename":"Education","uuid":"5697309c-3b8b-451c-bce3-43e4ddc800a4","school":{"__ref":"School:{\"uuid\":\"2af680fe-a7d5-49e3-89bf-a3e5ede5eb52\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"c2386919-ea4d-49fb-b87e-40740d740d8f\"}":{"__typename":"MentorPublicProfile","uuid":"c2386919-ea4d-49fb-b87e-40740d740d8f","displayName":"Halle C.","slug":"halle-clottey","biography":"Hello! My name is Halle Clottey and I am a senior at Harvard College studying computer science. I was born in London, but grew up in the south suburbs of Chicago where I attended an under-resourced public high school. I dedicated 8 years of my life to music as a mallet percussionist as well as a few years to basketball, golf, acting, and performing. In addition to all of this, I’ve been an avid reader, writer, and poet for most of my life. I placed second in the entire state of Illinois for Poetry Reading and competed nationally with the Speech and Debate Association where I placed top 30 in Program Oral Interpretation.\n\nI was fortunate enough to win many scholarships before matriculating to Harvard: the Gates Scholarship, United Negro College Fund STEM Scholarship, Ron Brown Scholarship, and so much more. My resilience and desire to learn abundantly—despite the limited resources I had at a low-income, predominantly Black and Brown high school—allowed me to flourish in university and beyond. I’m actively involved in Harvard Model Congress where I delegate discussions and debates amongst high schoolers all over the world. I served as the Vice President as well as the Director of Mentoring and Director of Operations and Technology in my previous terms. I also dedicate a lot of my time to BlackCAST (theater!) on campus where I've acted in some performances.\n\nIn my free time, I love to read, watch Netflix, FaceTime my family, walk by the Charles River, write poetry, dream, listen to music, spend time with friends, eat good food, and so much more. These moments allow me to reset and bring my fullest self to all of my conversations and interactions. As your mentor, I want to create a welcoming and nurturing environment to ensure your comfortability and success in your studies and extracurriculars. Whether you want to tighten your Algebra skills, be introduced to programming, explore the arts of theater, or strengthen your public speaking skills, I am here to aid you on your journey of growth and intellectual discovery.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science ","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/1f11ca2a-3ed9-40c7-8052-0e3649035794/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"54544fb4-abb3-4d7b-afd5-b3a4aa207b25\"}"},{"__ref":"Education:{\"uuid\":\"5697309c-3b8b-451c-bce3-43e4ddc800a4\"}"}],"hiredAt":"2023-02-06T18:38:16.405Z","topics":["K-6 Storybook","Creative Writing","Film / Theater","Coding / Programming","Web Design","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"halle-clottey\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c2386919-ea4d-49fb-b87e-40740d740d8f\"}"}}},"_sentryTraceData":"3e75fc440e4f4f8fbd678a41102df6bc-b37d5904a65e4fde-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-publi
