,"zip":"10028"},"Education:{\"uuid\":\"6e524429-bb7e-42c8-8c47-23f12f4a82fb\"}":{"__typename":"Education","uuid":"6e524429-bb7e-42c8-8c47-23f12f4a82fb","school":{"__ref":"School:{\"uuid\":\"79abe983-4f13-4082-9bc7-108edeb6ad2b\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"6c267f76-93f0-477f-bbb1-1a4a1b562279\"}":{"__typename":"Education","uuid":"6c267f76-93f0-477f-bbb1-1a4a1b562279","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"English + Film","degree":"BA"},"MentorPublicProfile:{\"uuid\":\"762a8028-7b49-4af8-9473-de7fd81dd3d7\"}":{"__typename":"MentorPublicProfile","uuid":"762a8028-7b49-4af8-9473-de7fd81dd3d7","displayName":"Justin P.","slug":"justin-portela","biography":"Hi! I'm Justin, I'm a Stanford senior studying English and Film, but I took a long and winding road to get here! \n\nSo much of my time at Stanford was spent on things that I felt like I had to do: I took the entire CS core because I felt like I had to understand AI, I took too many econ classes because I felt like I had to work at the UN, and I stopped all the artistic endeavors that had defined by life before college. But when COVID came and I had all the time in the world to do whatever I wanted, I realized I didn’t want to do any of that. \n\nBut my true love has always been art, and these days I spend my time reading, writing short stories and movie scripts, making short films, and working on everything else I can get my creative hands on. I've written some Stanford-funded scripts, won a short film contest, and have had writing featured across literary magazines and platforms! \n\nAlong the way, I’ve also done some fun things! I learned the guitar, learned a little French, learned a lot of Spanish, almost minored in Philosophy, ran a half-marathon, and, dearest to my grandmother's heart, mastered homemade pasta. \n\nIn the future, I’m hoping to work in the Hollywood world, and I’m also planning to teach English in France through the Fulbright program next year! In the meantime, I’m so excited to help students meet their goals and do the things they want to do. ","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English + Film","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ff0b21d3-e057-4db8-aedc-b62886dbece0\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a30338b-2c9e-4778-b267-e9c3996d66c6\"}"},{"__ref":"DeepDives:{\"uuid\":\"1c7ff0e7-deed-4e68-bf9b-b4063d6f518e\"}"},{"__ref":"DeepDives:{\"uuid\":\"0f68ad70-cce9-4e20-b3e0-abf45bae1e40\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fc3b0cfe-218d-4297-a552-328d4de904d0/-/crop/682x682/0,0/-/preview/-/format/jpg/","https://ucarecdn.com/12c76d41-019b-4e93-b53f-ee337f7b9838/-/preview/-/format/jpg/","https://ucarecdn.com/4364ea04-02db-4930-91f7-645689d8884f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6e524429-bb7e-42c8-8c47-23f12f4a82fb\"}"},{"__ref":"Education:{\"uuid\":\"6c267f76-93f0-477f-bbb1-1a4a1b562279\"}"}],"hiredAt":"2023-01-17T21:38:05.000Z","topics":["Coding / Programming","STEM Project","Video / Photography","Film / Theater","Philosophy","Literature","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Writing","Creative Writing","Algebra I","Algebra II","Public Speaking","Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCam
