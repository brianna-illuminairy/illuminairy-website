../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9a1f114c-f9e7-490c-81f6-bf15fcabb6de\"}":{"__typename":"DeepDives","uuid":"9a1f114c-f9e7-490c-81f6-bf15fcabb6de","content":"\u003cp\u003eGrowing up I was passionate about competitive swimming. Having a daily routine involving activity has become engrained in me. I now love to swim or run in my free time. I also like to sketch and read. Above all, I enjoy spending time with my friends and family, whether that is watching a movie with them, cooking, traveling, or trying new restaurants!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"a716c2a6-9a82-4cf3-9855-7595c97d33c5\"}":{"__typename":"DeepDives","uuid":"a716c2a6-9a82-4cf3-9855-7595c97d33c5","content":"\u003cp\u003eComing from a mix of Japanese, Taiwanese, German, and American heritages, I have a lot to offer when it comes to teaching. On top of this, I originally grew up in NYC and then moved to Switzerland where I attended an international school. Through this exposure of many different cultures, I have gotten to engage with people that have vastly different values and perspectives. I have also gotten to experience different styles of teaching in America vs. Europe. Thus, when I teach, I have an expansive way of looking at certain topics and approaches to learning. I am open to all types of perspectives and hope to show other students that being open minded to different ideas and diverse ways of learning is beneficial. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4b81a0cc-1f7f-477c-9322-bda28cb3bc75\"}":{"__typename":"DeepDives","uuid":"4b81a0cc-1f7f-477c-9322-bda28cb3bc75","content":"\u003cp\u003eI chose to major in Biological Sciences with a concentration in Cell \u0026amp; Molecular Biology for a variety of reasons. Growing up, I was always drawn towards a path in STEM. I was always interested in classes oriented towards science, and these interests grew through summer internships and experiences. I got to do research in labs where I found the intricate cellular mechanisms fascinating. I also got to complete my own research on the gut microbiome which enhanced this interest in molecular systems and processes. Lastly, I hope to pursue medical school in the future, as I want to work in the field of healthcare and make a meaningful impact in my career, and Biological Sciences will set me on this path. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e88f0ad3-8c1b-4bba-b108-25c7503ac3d7\"}":{"__typename":"DeepDives","uuid":"e88f0ad3-8c1b-4bba-b108-25c7503ac3d7","content":"\u003cp\u003eSome advice I would give my middle or high school self is to be open to meeting more people and expanding my personal connections. I think the best way to learn is from others. By meeting more people and engaging in conversation with others, you can take away and learn so much more in all types of aspects. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"6e08c71e-6a4b-488b-9a0b-007302fffcde\"}":{"__typename":"School","uuid":"6e08c71e-6a4b-488b-9a0b-007302fffcde","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14853"},"Education:{\"uuid\":\"e5c1f7bd-a029-4b84-a2b6-92285c28e2a7\"}":{"__typename":"Education","uuid":"e5c1f7bd-a029-4b84-a2b6-92285c28e2a7","school":{"__ref":"School:{\"uuid\":\"6e08c71e-6a4b-488b-9a0b-007302fffcde\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biological Sciences","degree":"Bachelor of Science"},"School:{\"uuid\":\"32d1296a-4d80-49f7-9e96-6fbfc800389d\"}":{"__typename":"School","uuid":"32d1296a-4d80-49f7-9e96-6fbfc800389d","name":"International School Basel","city":"Reinach","type":"HIGH","state":"Basel-Landschaft","country":"Switzerland","zip":"4153"},"Education:{\"uuid\":\"ac672a3a-3afa-499c-b14b-af201c07852a\"}":{"__typename":"Education","uuid":"ac672a3a-3afa-499c-b14b-af201c07852a","school":{"__ref":"School:{\"uuid\":\"32d1296a-4d80-49f7-9e96-6fbfc800389d\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ed4eb90b-e938-4c91-b254-36bff2e7f554\"}":{"__typename":"MentorPublicProfile","uuid":"ed4eb90b-e938-4c91-b254-36bff2e7f554","displayName":"Mayumi S.","slug":"mayumi-schaeperscheu","biography":"\u003cp\u003eMayumi is a sophomore at Cornell's College of Arts \u0026amp; Sciences. She is pursuing a degree in Biological Sciences with a Business Minor for Life Science Majors. She is interested in the intersection of medicine and business, and hopes to pursue these interests alongside social impact. Outside of classes, Mayumi is part of various pre-health clubs, such as Parkinson's Pals, and is in the Phi Chi Theta business fraternity. She also swims and runs with the Cornell Run Club and Swim Club. Mayumi originally grew up in NYC and then moved to Switzerland when she was 15. She can now speak fluent German as well. From this experience she has gained an international outlook on the world and hopes to explore more places as she gets older. She has previously interned for two research laboratories. One focused on gene therapy and the other on immune cell biology. She is now interning for a start-up company as a Medical Research Intern. In Mayumi's free time she loves to go on walks, sketch, read, and hang out with friends! She also loves going to new places and trying out different restaurants. Mayumi has always loved helping and teaching others, and hopes to build connections with younger students and share what she has learned.\u003c/p\u003e","teachingVideoPlaybackId":"lJMMR0201ysbjx4Dd8mInLkcAZIc84J7DOWt00TjSEQFAI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9a1f114c-f9e7-490c-81f6-bf15fcabb6de\"}"},{"__ref":"DeepDives:{\"uuid\":\"a716c2a6-9a82-4cf3-9855-7595c97d33c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b81a0cc-1f7f-477c-9322-bda28cb3bc75\"}"},{"__ref":"DeepDives:{\"uuid\":\"e88f0ad3-8c1b-4bba-b108-25c7503ac3d7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/81b71d47-fa81-401f-9ca5-026f60b586a3/-/crop/785x785/315,0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e5c1f7bd-a029-4b84-a2b6-92285c28e2a7\"}"},{"__ref":"Education:{\"uuid\":\"ac672a3a-3afa-499c-b14b-af201c07852a\"}"}],"hiredAt":"2023-04-26T21:42:37.576Z","topics":["Algebra I","K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Chemistry","Writing","Academic Coaching","Executive Function","K-6 Storybook","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mayumi-schaeperscheu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ed4eb90b-e938-4c91-b254-36bff2e7f554\"}"}}},"_sentryTraceData":"e8727fd9293447239f4a0d7d1a646208-8147051125e447b7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e8727fd9293447239f4a0d7d1a646208,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_S
