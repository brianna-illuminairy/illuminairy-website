hy I'm teaching them something! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"13c55614-f552-41d5-8468-84913475ec4e\"}":{"__typename":"DeepDives","uuid":"13c55614-f552-41d5-8468-84913475ec4e","content":"\u003cp\u003eMentors in my life have given me countless dollars worth of advice, and have shaped my career trajectory. They made me believe I could achieve what I thought was out of reach before, and encouraged me to pursue what interests me. I want to give back and show my students that they too can take risks and learn challenging concepts, putting them to use in and out of the classroom.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"6f044d47-468d-4b67-b654-18ebc4b641d9\"}":{"__typename":"DeepDives","uuid":"6f044d47-468d-4b67-b654-18ebc4b641d9","content":"\u003cp\u003eMy greatest source of motivation stems from the joy and value I can provide other people in everything I do. Whether it is cooking my family dinner or teaching sports analytics, I want to positively touch everyone around me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9e4b081a-d57f-45e2-80f4-918e7aff6b13\"}":{"__typename":"DeepDives","uuid":"9e4b081a-d57f-45e2-80f4-918e7aff6b13","content":"\u003cp\u003eI spent my summers running, mowing lawns, working part-time jobs (lifeguarding, restaurants, etc). A fun fact is that I've worked over a half dozen different jobs! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"c03cabff-51b9-44de-80ad-371c580b669e\"}":{"__typename":"Education","uuid":"c03cabff-51b9-44de-80ad-371c580b669e","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Statistics","degree":"BS"},"School:{\"uuid\":\"91a8851d-2eb9-4908-b097-be124de53908\"}":{"__typename":"School","uuid":"91a8851d-2eb9-4908-b097-be124de53908","name":"Naperville Central High School","city":"Naperville","type":"HIGH","state":"Illinois","country":"United States","zip":"60540"},"Education:{\"uuid\":\"f17c97f7-00e6-4be3-9d46-d08ddef63a5b\"}":{"__typename":"Education","uuid":"f17c97f7-00e6-4be3-9d46-d08ddef63a5b","school":{"__ref":"School:{\"uuid\":\"91a8851d-2eb9-4908-b097-be124de53908\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"f66360c9-1cf4-4b42-9cd2-14b134c02c79\"}":{"__typename":"MentorPublicProfile","uuid":"f66360c9-1cf4-4b42-9cd2-14b134c02c79","displayName":"Sean L.","slug":"sean-li","biography":"\u003cp\u003eSean is a senior at Duke University double majoring in Statistics and Computer Science, with a minor in Sociology.\u003cbr\u003e\u003cbr\u003eGrowing up, he ran cross country and track, delving deep into doing race/meet projections to help his high school team. Sean further pursued this interest in college by founding the Duke Sports Analytics Club. In the past two years, he's lead the club to establish multiple partnerships with Duke Division I sports teams such as soccer, lacrosse, and baseball. \u003cbr\u003e\u003cbr\u003eFurthermore, Sean has had extensive teaching experience through leading programming/ technical skill workshops in both Python and R. In a recent personal project, he used machine learning modeling to analyze the impact of NCAA College Basketball transfers. Outside of sports, he's participated in numerous hackathons and internships focused on data analysis and machine learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn his free time, you can find Sean watching Chicago Bulls basketball, watching standup comedy, playing Pokemon showdown, or listening to neuroscience podcasts during a workout. Sean also is an avid traveler, most recently visiting Australia to study abroad. It's his mission to help others pursue their dreams whether it is sports and math related aspirations or otherwise!\u003c/p\u003e","teachingVideoPlaybackId":"DH8n3CzK69B00Bf5JYFWh01v02cUL02H8qBxLLcncTGfVBM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bf1a528a-0f88-426f-abd3-0cac2e884613\"}"},{"__ref":"DeepDives:{\"uuid\":\"13c55614-f552-41d5-8468-84913475ec4e\"}"},{"__ref":"DeepDives:{\"uuid\":\"6f044d47-468d-4b67-b654-18ebc4b641d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"9e4b081a-d57f-45e2-80f4-918e7aff6b13\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9383661a-0d5f-42f4-a2aa-687ea33362fb/-/preview/-/format/jpg/","https://ucarecdn.com/3627f386-2983-48c7-88f1-a015b2597c1f/-/preview/-/format/jpg/","https://ucarecdn.com/9e7a0281-4d47-4f06-9fce-10697530146f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"c03cabff-51b9-44de-80ad-371c580b669e\"}"},{"__ref":"Education:{\"
