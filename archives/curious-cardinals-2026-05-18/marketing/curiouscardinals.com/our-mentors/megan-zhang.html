"biography":"\u003cp\u003eMegan is pursuing a major in Business Administration with an emphasis in Technology Entrepreneurship, while exploring her creativity through social media, poetry, and music creation. \u003cbr\u003e\u003cbr\u003eShe grew up in a prominent Asian community, excelled in all math subjects within an academically rigorous high school while navigating the exploration of her personal purpose. She also did visual arts throughout her entire childhood. \u003cbr\u003e\u003cbr\u003eMegan greatly values her relationships with people and understanding social dynamics. She has had extensive leadership experience throughout her organizations in high school and college, including but not limited to starting an education-based nonprofit, two Chinese-culture organizations, dance teams, volunteer programs, and a business organization, and hopes to take these leadership skills into her future career.\u003c/p\u003e","teachingVideoPlaybackId":"mTbLCUxvgBCau6sCuEx6dwORlu15cKmHFxogWbM4Skk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOver the summer, for my internship, my project was to improve a process in my workplace. This internship was operations based, so my manager's expectation was that I find an operations inefficiency to break down. However, as I have always been interested in culture and leadership, I identified the management culture to be a big disconnect. \u003cbr\u003e\u003cbr\u003eMaking my project about a culture that upper management directly perpetuated was scary, as I had to have a lot of really loaded and precarious conversations with people who had control over my experience at the company. However, it resulted in my creation of a very thorough and passionate project that my entire team supported, as well as actionable change. It did cause anger in a couple members of management, but I am proud of myself for being brave and true to myself to create something disruptive and impactful.\u003c/p\u003e","favorites":[{"__ref":"F
