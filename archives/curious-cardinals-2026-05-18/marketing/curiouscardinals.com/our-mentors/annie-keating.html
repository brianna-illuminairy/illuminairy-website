../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"88738ca0-8e76-449d-869d-852091ea34a3\"}":{"__typename":"DeepDives","uuid":"88738ca0-8e76-449d-869d-852091ea34a3","content":"\u003cp\u003eI would tell my middle school self to not be afraid to try new things. Even if it is an extracurricular that is something no one in your family has done. This is the time to explore all your interests, find activities that you are passionate about, and learn tools to help you be successful. I also would say to be true to yourself. No friendship is worth you not being your authentic self.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f7011e87-ec2e-4bdb-bdc5-49a435e0f2f1\"}":{"__typename":"DeepDives","uuid":"f7011e87-ec2e-4bdb-bdc5-49a435e0f2f1","content":"\u003cp\u003eI think it is so important to find people that you not only look up to but someone you trust and can inspire you to achieve greatness. The world can be a difficult place full of questions and worries but a mentor can be someone that can help lead and guide you. At the end of the day they are your friend who loves you for who you are and is someone you know that is always rooting for you. Growing up with a ton of learning disabilities and not many people believing in me except my family was hard. I really think that it would have helped me to know that I was not alone and these labels that were put on me would not define me. Having a mentor that encourages you and makes sure that you know that you are destined for greatness is something everyone needs and could completely propel a mentee.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"68b549f3-cfcf-451e-b993-affc014058be\"}":{"__typename":"DeepDives","uuid":"68b549f3-cfcf-451e-b993-affc014058be","content":"\u003cp\u003eI choose to study Neuroscience Pre- Med because I suffered from a Traumatic Brain Injury (TBI) that completely changed my life. After the TBI I continually suffered from migraines, my brain worked much slower than before, and I struggled with my short term memory. My world was rocked and the worst part was that even the best doctors in the country did not have any fix. Instead of playing the victim this situation inspired me to want to become a doctor so that I can help people go through similar if not more difficult battles. I want to be able to find cures that my doctors could not. The brain is so fascinating and is the center of how our lives function. Learning about how our brains work along with why we think and do the things we do is truly so interesting. I love the fact that there is still so much unknown and that new discoveries are being made every day. Hopefully someday I will be making one of them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b7d62602-1053-4be8-ad3e-cd17b69c7789\"}":{"__typename":"DeepDives","uuid":"b7d62602-1053-4be8-ad3e-cd17b69c7789","content":"\u003cp\u003eDuring my summers in high school I would compete against the best teams in the country. I\u0026nbsp; trained 5-7 hours a day in order to play a D1 sport. Those summers taught me the importance of hard work, determination, and working with a team. I had to make many sacrifices when I choose to prioritize this goal over relaxing or going to hang out with friends. Playing on a team and training at such a high level taught me skills to be successful. I have learned to not let anyone stop me from achieving greatness. On top of this, I started my own company where I ran a sports camp for tennis and lacrosse and taught private lessons. I would have over 20 students come to each camp and would share my knowledge and love of the game. Being an entrepreneur you have to be organized, on top of things, and able to adjust and think on your toes when something goes wrong. I had to be patience and get creative when trying to teach all different leaners and skill levels. My time coaching has really helped me tutoring. I know that each learner is different and understands stuff at a different pace and my goal is to help them in whatever way they need. Whether it is breaking down problems, explaining something in a different way, or finding a way that the person can relate to the material I will be that person who takes the time for them to understand.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"4241f4ff-2a26-4d90-b47d-c029808174b1\"}":{"__typename":"School","uuid":"4241f4ff-2a26-4d90-b47d-c029808174b1","name":"Academy of the Sacred Heart","city":"Bloomfield Hills","type":"HIGH","state":"Michigan","country":"United States","zip":"48304"},"Education:{\"uuid\":\"290934cd-cbf4-42bc-907f-28042fe57adf\"}":{"__typename":"Education","uuid":"290934cd-cbf4-42bc-907f-28042fe57adf","school":{"__ref":"School:{\"uuid\":\"4241f4ff-2a26-4d90-b47d-c029808174b1\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9895b04a-b026-4fbd-bb5e-d069f07019e7\"}":{"__typename":"School","uuid":"9895b04a-b026-4fbd-bb5e-d069f07019e7","name":"Baylor University","city":"Waco","type":"COLLEGE","state":"Texas","country":"United States","zip":"76706"},"Education:{\"uuid\":\"d74eb387-905a-42f8-b252-ee58d4072fbb\"}":{"__typename":"Education","uuid":"d74eb387-905a-42f8-b252-ee58d4072fbb","school":{"__ref":"School:{\"uuid\":\"9895b04a-b026-4fbd-bb5e-d069f07019e7\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"80b3bb8d-a68c-47db-aef9-2859655fca17\"}":{"__typename":"MentorPublicProfile","uuid":"80b3bb8d-a68c-47db-aef9-2859655fca17","displayName":"Annie K.","slug":"annie-keating","biography":"\u003cp\u003eThis past May, Annie graduated from Baylor University with a major in Neuroscience and a minor in Biochemistry. During her gap year before medical school, she is working as a medical assistant and scribe at a local hospital in Michigan. In addition, she conducts research at a Wayne State University lab focused on Traumatic Brain Injury and its effects on addiction. Annie started her own tennis instructional business in high school, and she continues to teach up to 40 players per week during the summer and fall months.\u003c/p\u003e\u003cp\u003eIn addition to her studies, Annie was actively involved in student government, serving as a senator for her grade. She also contributed to her sorority's philanthropy committee, competed on the club tennis team that qualified for the Club National Championships three times, and participated in medical organizations such as the American Medical Women’s Association.\u003c/p\u003e\u003cp\u003eThroughout high school, Annie excelled in athletics, playing three varsity sports all four years. She earned honors as a two-time individual State Tennis Champion, Captain of the tennis team, basketball MVP, and a starter on a Top 10 nationally ranked club field hockey team. Alongside her athletic achievements, she was a national qualifier in forensics, served as Captain of the Robotics team, and maintained her academic excellence.\u003c/p\u003e\u003cp\u003eAnnie loves playing sports, baking, traveling, and spending time with her family in her free time. Volunteering at local soup kitchens and health clinics remains one of her most fulfilling activities.\u003c/p\u003e\u003cp\u003eAnnie hopes that, at the end of each session, her mentees will feel more confident and excited. She believes it is essential for every person to know they can achieve anything they put their mind to and that encouragement and support are the key ingredients to success. Annie loves learning and believes that her mindset, combined with the positivity she brings, will make learning fun and engaging for everyone.\u003c/p\u003e","teachingVideoPlaybackId":"Sq302TVHsGYtYH5y9YFW2SNF5pHmek98ISwZ9LJJ00wIk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"88738ca0-8e76-449d-869d-852091ea34a3\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7011e87-ec2e-4bdb-bdc5-49a435e0f2f1\"}"},{"__ref":"DeepDives:{\"uuid\":\"68b549f3-cfcf-451e-b993-affc014058be\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7d62602-1053-4be8-ad3e-cd17b69c7789\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/466d7e5e-d0d8-4f9c-9352-388692e66d3f/-/preview/-/format/jpg/","https://ucarecdn.com/bba3e06b-ea87-46da-8fe6-19ea24e8670c/-/preview/-/format/jpg/","https://ucarecdn.com/1124e59e-41d5-4835-aee3-dd3a9da48db8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"290934cd-cbf4-42bc-907f-28042fe57adf\"}"},{"__ref":"Education:{\"uuid\":\"d74eb387-905a-42f8-b252-ee58d4072fbb\"}"}],"hiredAt":"2022-02-28T04:04:59.000Z","topics":["K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Algebra I","K-6 Storybook","Sports Journalism","Fashion / Cosmetics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"annie-keating\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"80b3bb8d-a68c-47db-aef9-2859655fca17\"}"}}},"_sentryTraceData":"fcf040c2f52a4cf7977e1863996cbc86-bf116a7643bb09f3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fcf040c2f52a4cf7977e1863996cbc86,sentry-sample_ra
