97ab42b646b9\"}":{"__typename":"Favorites","uuid":"b563d776-dd29-4cb0-b4e9-97ab42b646b9","photoUrl":"https://ucarecdn.com/98cfbbf5-0568-45ca-8658-fd3187d5762c/","title":"Song of Achilles ","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"689d9a9a-3acd-49ed-a6ef-136466efd0c4\"}":{"__typename":"DeepDives","uuid":"689d9a9a-3acd-49ed-a6ef-136466efd0c4","content":"\u003cp\u003eWhen I was in middle and high school, I struggled deeply with perfectionism. I based my self-worth on external validation—namely, my grades and accomplishments. I was paralyzed by the fear of failing at something and what it meant about me. I wish I could go back in time and encourage myself to explore freely without being afraid of failure, even learning to embrace failure as an essential part of growth. I think I would have developed a stronger idea of my passions and strengths a lot sooner!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7ee946e8-cf9c-486a-ba92-592e74439593\"}":{"__typename":"DeepDives","uuid":"7ee946e8-cf9c-486a-ba92-592e74439593","content":"\u003cp\u003eMentorship matters to me because I want to serve as the kind of mentor I really needed when I was growing up. I always looked up to older students at my school and wondered how they accomplished what they did. I remember wishing I could ask them questions but feeling too embarrassed. I wish I had a Curious Cardinals mentor when I was younger, and that is why I am passionate about serving as one!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"edae5c5d-f294-480b-8c28-fc62553eed81\"}":{"__typename":"DeepDives","uuid":"edae5c5d-f294-480b-8c28-fc62553eed81","content":"\u003cp\u003eMy dream is to be an analytics-savvy CMO of a Consumer packaged goods company, specifically in food and beverage! My dream companies would be PepsiCo, Goodles, or Poppi. At heart, I am a data-driven storyteller who is passionate about food and people. I have always been deeply curious about food and the way it brings people together. There is a lot of interesting innovation happening in the consumer packaged goods industry, specifically around sustainability and health. I would love to be a part of shaking up a very old industry and getting to marry my love of creativity and analytics!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"2b6a769a-d4bf-4f12-a7ed-c31f1f5878fe\"}":{"__typename":"Education","uuid":"2b6a769a-d4bf-4f12-a7ed-c31f1f5878fe","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Learning and Organizational Change, minors in Data Science and Business, certificate in marketing!","degree":"Bachelors of Science"},"School:{\"uuid\":\"c6bfd0d1-66cc-4fbd-94e3-ba9451ef5327\"}":{"__typename":"School","uuid":"c6bfd0d1-66cc-4fbd-94e3-ba9451ef5327","name":"Kinkaid School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77024"},"Education:{\"uuid\":\"ca6275bb-5a8e-4104-899c-71ba56635f8b\"}":{"__typename":"Education","uuid":"ca6275bb-5a8e-4104-899c-71ba56635f8b","school":{"__ref":"School:{\"uuid\":\"c6bfd0d1-66cc-4fbd-94e3-ba9451ef5327\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"d6a7dc57-15aa-405a-8cfd-d48e7cdc7f29\"}":{"__typename":"MentorPublicProfile","uuid":"d6a7dc57-15aa-405a-8cfd-d48e7cdc7f29","displayName":"Caroline M.","slug":"caroline-moseley","biography":"\u003cp\u003eCaroline just graduated from Northwestern University in June, where she studied Learning and Organizational Change, Data Science, Business, and Marketing! In her free time, Caroline enjoys singing Mezzo Soprano in her a cappella group Purple Haze, baking French pastries, throwing ceramics on the wheel, making sourdough bread, and cycling! In 2019, she became a National Merit Scholar and graduated Cum Laude from The Kinkaid School in Houston, Texas. In high school, she was very involved in the performing arts as the founding president of Kinkaid’s Thespian troupe and a Tommy Tune nominated actress.  Caroline has a high level of proficiency in Spanish and lived with a family in Málaga during her sophomore year of high school. As the second oldest of four kids, Caroline aims to serve as a mentor to young women who are exploring their eclectic passions. Caroline’s diverse academic interests match her enthusiastic, warm, and individualized approach to mentoring, teaching, and learning!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThis past March, my a cappella group Purple Haze competed in the International Competition of Collegiate A Cappella (ICCAs) and made it to semifinals! (Yes, that is the competition from the Pitch Perfect movies!) We even won the awards for best choreography and best soloist for our rendition of Adele's \"Set Fire to the Rain\". I am so proud of the hard work and dedication we put into ICCAs preparation. All the months of memorizing music, drilling harmonies, and practicing choreography were worth it to perform at semifinals with some of my closest friends. You can watch our set on Youtube and listen to Purple Haze's music on Spotify!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f029ca5e-fc19-4528-8eb8-6b0e9415b888\"}"},{"__ref":"Favorites:{\"uuid\":\"17492147-4e75-423e-ba7f-ea3431ccfe1a\"}"},{"__ref":"Favorites:{\"uuid\":\"b563d776-dd29-4cb0-b4e9-97ab42b646b9\"}"}],"causesSupported":[],"major":"Learning and Organizational Change, minors in Data Science and Business, certificate in marketing!","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"689d9a9a-3acd-49ed-a6ef-136466efd0c4\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ee946e8-cf9c-486a-ba92-592e74439593\"}"},{"__ref":"DeepDives:{\"uuid\":\"edae5c5d-f294-480b-8c28-fc62553eed81\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7077e66f-da40-4ed6-815c-0773676b01b9/-/preview/-/format/jpg/","https://ucarecdn.com/7b629725-b294-497a-add7-5b57f859b622/-/preview/-/format/jpg/","https://ucarecdn.com/472f498f-1539-4568-8e9d-f462df740569/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2b6a769a-d4bf-4f12-a7ed-c31f1f5878fe\"}"},{"__ref":"Education:{\"uuid\":\"ca6275bb-5a8e-4104-899c-71ba56635f8b\"}"}],"hiredAt":"2023-04-19T18:21:48.974Z","topics":["Negotiation","Business / Entrepreneurship","Cooking","Coding / Programming","Spanish","Statistics","Precalculus / Trigonometry","Pre-Algebra","Public Speaking","Economics"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"caroline-moseley\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d6a7dc57-15aa-405a-8cfd-d48e7cdc7f29\"}"}}},"_s
