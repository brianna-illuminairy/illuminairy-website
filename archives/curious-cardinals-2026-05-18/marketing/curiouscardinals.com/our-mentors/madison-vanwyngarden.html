haven't been able to take my eyes off the stars. My curiosity and amazement at what lies beyond our solar system continue to guide my studies today. I am ecstatic to be a part of the global community seeking answers among the Cosmos. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"5f81cf5f-8bc0-4477-939c-c9bb35bd13ea\"}":{"__typename":"School","uuid":"5f81cf5f-8bc0-4477-939c-c9bb35bd13ea","name":"Boston University","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02215"},"Education:{\"uuid\":\"1844dcc3-bbf1-4bd2-b307-7b431ed979d2\"}":{"__typename":"Education","uuid":"1844dcc3-bbf1-4bd2-b307-7b431ed979d2","school":{"__ref":"School:{\"uuid\":\"5f81cf5f-8bc0-4477-939c-c9bb35bd13ea\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Astronomy \u0026 Physics","degree":"Bachelor's"},"School:{\"uuid\":\"ee425ee1-2d7a-4760-90d6-a15a22db93ed\"}":{"__typename":"School","uuid":"ee425ee1-2d7a-4760-90d6-a15a22db93ed","name":"Elkhorn High School","city":"Omaha","type":"HIGH","state":"Nebraska","country":"United States","zip":"68022"},"Education:{\"uuid\":\"3156db20-6afe-48fa-8af8-fc208831bff2\"}":{"__typename":"Education","uuid":"3156db20-6afe-48fa-8af8-fc208831bff2","school":{"__ref":"School:{\"uuid\":\"ee425ee1-2d7a-4760-90d6-a15a22db93ed\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"809ee84f-646f-48cb-9edf-a45e828895d4\"}":{"__typename":"MentorPublicProfile","uuid":"809ee84f-646f-48cb-9edf-a45e828895d4","displayName":"Madison V.","slug":"madison-vanwyngarden","biography":"\u003cp\u003eMadi is a junior studying Physics and Astronomy at Boston University. After becoming entranced by the cosmos at a young age, she did all she could to learn more. Madi’s passion for the universe drove her from Omaha, Nebraska to Boston, where she is the first in her family to pursue a STEM degree. Though initially overwhelmed in her freshman physics courses, Madi has learned to combat feelings of imposter syndrome and her confidence in math and physics quickly grew. Applying her knowledge of advanced math, physics, and coding, Madi has conducted research on topics from dying stars, the evolution of distant planets, and particle colliders. At BU, Madi is engaged in extracurricular activities devoted to promoting women in STEM and uniting students with an interest in astronomy. As president of the undergraduate astronomy club and a peer mentor to freshman physics majors, she strives to help students feel that they belong and allow them to explore their curiosities! Outside of the classroom, you can find Madi hiking, reading classic literature, and searching for the best brunch spots in Boston. Madi just returned from studying in Geneva, Switzerland, where she worked at CERN and practiced her French.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eLast semester I had the unique opportunity to study abroad in Geneva, Switzerland! As a physics student at the University of Geneva, I took classes taught entirely in French. After only studying the language for three semesters, I barely knew how to hold a conversation in French, much less listen to a lecture on quantum mechanics! It was the most challenging semester I've ever had, but by asking lots of questions and working with my classmates I was able to learn so much.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Astronomy \u0026 Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"010b89f9-4418-4a06-93c3-fdff0d1a9138\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6050f0d8-0bda-48d0-94f4-ca814bc65d5c/-/crop/692x692/0,135/-/preview/-/format/jpg/","https://ucarecdn.com/f2b96fcd-dc35-40d1-857e-7edc722b87b3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref"
