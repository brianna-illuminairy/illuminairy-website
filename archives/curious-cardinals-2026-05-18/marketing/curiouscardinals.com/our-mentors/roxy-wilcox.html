../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b68b134e-f86e-4826-ad92-e0eb9f396eab\"}":{"__typename":"DeepDives","uuid":"b68b134e-f86e-4826-ad92-e0eb9f396eab","content":"\u003cp\u003eI spent my summers doing competitive dance! I was very artsy in high school (and still am) and spent every summer in intensive dance training. I was also on the Varisty POM team (similar to cheerleading but for dance) for 3 out of 4 years in highschool, and we had practice every day during the month of August. These two activities taught me the importance of routine and discipline, something I carried into my academic pursuits. They also were a nice break from academics, and I think it is SO important to be a well rounded student.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9c9bcf7c-ae31-4931-91e0-478a2298ca75\"}":{"__typename":"DeepDives","uuid":"9c9bcf7c-ae31-4931-91e0-478a2298ca75","content":"\u003cp\u003eMentorship matters to me because being mentored myself is what has gotten me to where I am today, and I want to give back. I used to feel guilty for not being able to repay my mentors for how much they helped me, but the true way to \"pay them back\" is to pay it forward by mentoring someone else! I find so much personal joy in seeing my students learn and grow. I love to help my students reach their initial goals, and it's fun to watch how their goals evolve and change over time as they find what they truly want to explore.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e2187071-3970-4e96-8df2-cca6d70fa732\"}":{"__typename":"DeepDives","uuid":"e2187071-3970-4e96-8df2-cca6d70fa732","content":"\u003cp\u003eMy dream job is to work at Google during the day and sing opera in NYC at night. I am halfway there!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"36ae8a2b-f9ac-49a6-9c30-12308a7576f4\"}":{"__typename":"Education","uuid":"36ae8a2b-f9ac-49a6-9c30-12308a7576f4","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":"2022","major":"Computer Science","degree":"B.A. in Computer Science"},"School:{\"uuid\":\"7bc738b4-6ac4-4758-aea9-d85f6464d152\"}":{"__typename":"School","uuid":"7bc738b4-6ac4-4758-aea9-d85f6464d152","name":"Monte Vista","city":"Danville","type":"HIGH","state":"CA","country":"United States","zip":"94526"},"Education:{\"uuid\":\"7651f9db-dced-430c-a0f6-8f447a54988c\"}":{"__typename":"Education","uuid":"7651f9db-dced-430c-a0f6-8f447a54988c","school":{"__ref":"School:{\"uuid\":\"7bc738b4-6ac4-4758-aea9-d85f6464d152\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"00231c44-71fc-4e46-923a-eb73486e5751\"}":{"__typename":"MentorPublicProfile","uuid":"00231c44-71fc-4e46-923a-eb73486e5751","displayName":"Roxy W.","slug":"roxy-wilcox","biography":"\u003cp\u003eRoxy graduated from Northwestern University with a major in Computer Science. Coming into college as a Theatre major, Roxy explored various subjects, like theatre, opera, economics, and math, before finally settling on computer science. During her time at Northwestern, Roxy spent her free time in various computer science extracurriculars, while doing a few theatre productions, too! She served as a TA for the largest CS course at Northwestern, where she taught sections specifically for students who had never coded before. Here, she found her love of mentoring and a passion for encouraging students from unconventional backgrounds to try CS. Roxy then joined the CS Advisory Board, where she helped implement a mentorship program for new CS students during the pandemic. Serving as a mentor for that program, Roxy mentored two students who primarily studied subjects other than CS and helped those students gain their footing in a new subject and apply the skills they already had to CS. Roxy’s undergraduate research focused on the intersection of CS and the learning sciences, and her project Knowledge Maps won first place at the international ACM CHI Student Research Competition in New Orleans in May 2022. Outside of school, Roxy speaks and studies Farsi, sings opera, and is hoping to finally learn how to cook this year! Roxy is currently a software engineer at Google in NYC, her dream job. She is excited to show others the world of computer science and diversify the field to include fresh perspectives!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b68b134e-f86e-4826-ad92-e0eb9f396eab\"}"},{"__ref":"DeepDives:{\"uuid\":\"9c9bcf7c-ae31-4931-91e0-478a2298ca75\"}"},{"__ref":"DeepDives:{\"uuid\":\"e2187071-3970-4e96-8df2-cca6d70fa732\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4b0840a3-78f7-479f-a592-eded96c5560b/-/crop/2316x2317/0,766/-/preview/-/format/jpg/","https://ucarecdn.com/1cc1af96-5523-48ca-a1ff-08d40f6eff52/-/preview/-/format/jpg/","https://ucarecdn.com/dd909c17-a7da-444e-9e74-823f57d1df07/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"36ae8a2b-f9ac-49a6-9c30-12308a7576f4\"}"},{"__ref":"Education:{\"uuid\":\"7651f9db-dced-430c-a0f6-8f447a54988c\"}"}],"hiredAt":"2022-08-31T18:46:11.000Z","topics":["Coding / Programming","Web Design","Product Design","K-5 Grade Math"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b4
