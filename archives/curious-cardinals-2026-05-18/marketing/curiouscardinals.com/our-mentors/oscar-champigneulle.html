 sciences and to prepare me for a career in medicine. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"be9a8a4f-60d1-4bd9-86d9-190961b24eaf\"}":{"__typename":"DeepDives","uuid":"be9a8a4f-60d1-4bd9-86d9-190961b24eaf","content":"\u003cp\u003eOrthopedic surgeon for Paris Saint Germain!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"1ab7a16b-0181-419f-8d4e-47fe11fc995e\"}":{"__typename":"Education","uuid":"1ab7a16b-0181-419f-8d4e-47fe11fc995e","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Applied Math and Biology","degree":null},"School:{\"uuid\":\"2e5313b3-331b-4102-b79d-80fb7bd91e79\"}":{"__typename":"School","uuid":"2e5313b3-331b-4102-b79d-80fb7bd91e79","name":"Poly Prep Country Day School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11228"},"Education:{\"uuid\":\"aee9e3ea-fb5c-416f-b167-2f1728b1e54c\"}":{"__typename":"Education","uuid":"aee9e3ea-fb5c-416f-b167-2f1728b1e54c","school":{"__ref":"School:{\"uuid\":\"2e5313b3-331b-4102-b79d-80fb7bd91e79\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"1bdc38ca-ef75-4166-b69d-c1914fbf902f\"}":{"__typename":"MentorPublicProfile","uuid":"1bdc38ca-ef75-4166-b69d-c1914fbf902f","displayName":"Oscar C.","slug":"oscar-champigneulle","biography":"\u003cp\u003eOscar graduated from Brown University in 2023 with a degree in applied math and biology. He graduated from Poly Prep (Brooklyn, NY) in 2019, where he played on the varsity soccer team since he was in 8th grade, ran with the track team for 3 years, tutored low income students, and volunteered at the NYU hospital in Brooklyn. Oscar was born in the united states, but lived in France for 4 years, where he learned to speak, read and write french fluently and gained a love for his dad's side of the family's culture. During his time at Brown, Oscar played for the varsity and club soccer teams, took a semester off to live in the Dominican Republic where he conducted research on the COVID-19 vaccine, worked in an orthopedic surgery clinic in Paris, played on a variety of intramural teams (including volleyball and water polo), and has developed a passion for kitesurfing. He is currently on a gap year while he applies to medical school. During this time he'll be conducting orthopedic research. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOscar would like to share his knowledge in the sciences with curious students, tutoring math, physics, biology, chemistry and sharing his passions for soccer and kitesurfing. He hopes to inspire in his students a desire to work hard, pursue their passions, and realize their goals!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Math and Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"852cf831-53a0-426a-8ad7-c50089c8d85e\"}"},{"__ref":"DeepDives:{\"uuid\":\"be9a8a4f-60d1-4bd9-86d9-190961b24eaf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5d34d3d0-ecde-4c12-b039-71d88d4ab8e4/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1ab7a16b-0181-419f-8d4e-47fe11fc995e\"}"},{"__ref":"Education:{\"uuid\"
