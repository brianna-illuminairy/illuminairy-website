eb82e\"}":{"__typename":"Favorites","uuid":"30808a29-8bc4-4b48-927f-6872874eb82e","photoUrl":"https://ucarecdn.com/900e09da-2bd4-4f27-a1b9-15daf7927090/","title":"Marc chagall ","type":"ARTIST"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8b2d9755-d386-4fde-a256-1642de31a3b6\"}":{"__typename":"DeepDives","uuid":"8b2d9755-d386-4fde-a256-1642de31a3b6","content":"\u003cp\u003eI started participating in speech and debate in sixth grade. As a kid, I definitely loved to argue, so joining debate was right up my alley! However,  I started to realize how important participating in debate was for me as a student. Debate taught me how to research, speak confidently, and be able to understand all angles of important topics at a young age. My Sophomore year of high school, I wanted to create the same formative opportunity for other middle schoolers. I reached out to a middle school in my community and was able to start an after-school debate program for the students. As I had never taught before, starting the program was not easy. I had to learn how to create lesson plans, keep the students engaged, and navigate coordinating with the students and the school. Nonetheless, working with the students, and watching as they became more confident public speakers and skilled debaters was one of my proudest moments! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cbc1cda0-56bd-488f-a582-eb8102fddf13\"}":{"__typename":"DeepDives","uuid":"cbc1cda0-56bd-488f-a582-eb8102fddf13","content":"\u003cp\u003eAnything outdoors!! Maybe it is the Oregonian in me, but being outside is my favorite way to use my free time. Whether I am skiing, hiking, surfing, or any other activity - I am happy. Especially if I am with my friends! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"fd42f10e-943b-409f-8dd8-1b522c6fe491\"}":{"__typename":"Education","uuid":"fd42f10e-943b-409f-8dd8-1b522c6fe491","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Global Affairs ","degree":"BA "},"School:{\"uuid\":\"c1c7076d-725a-4c32-91a8-cf1861d605f7\"}":{"__typename":"School","uuid":"c1c7076d-725a-4c32-91a8-cf1861d605f7","name":"Eugene International High School ","city":"Eugene","type":"HIGH","state":"OR","country":"United States","zip":"97403"},"Education:{\"uuid\":\"11737356-563e-40b4-b12b-0d37edd8a54f\"}":{"__typename":"Education","uuid":"11737356-563e-40b4-b12b-0d37edd8a54f","school":{"__ref":"School:{\"uuid\":\"c1c7076d-725a-4c32-91a8-cf1861d605f7\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"6df0b3e8-a53b-44ca-bdfc-fc82d2bec267\"}":{"__typename":"MentorPublicProfile","uuid":"6df0b3e8-a53b-44ca-bdfc-fc82d2bec267","displayName":"Noa A.","slug":"noa-ablowmeaselle","biography":"\u003cp\u003eNoa is a Yale University sophomore pursuing a degree in Global Affairs with a French minor. She grew up in Eugene, Oregon and Aix-en-Provence, France. She began learning french in kindergarten, and was enrolled in a French immersion program through high school. She loves learning French, and spent the summer of 2023 studying abroad in Paris! \u003cbr\u003e\u003cbr\u003eHer interest in Global Affairs and International policy began during high school when she became deeply involved with social justice initiatives and research. She led and grew a non-profit, called Justice Kids, which provided legal assistance, and mental health support, to asylum seekers in her community. Additionally, she assisted with medical anthropology research related to Mexican immigrant health disparities, and the biological impact of migration. Working on both the analytical and legal sides of immigration influenced her academic passion for global health and policy.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNoa believes that one of the most exciting ways to engage with these areas of interest and create social change is by teaching others. For three years, she led an educational summer program for high schoolers about creating social change through media, advocacy, and research. She has taught students how to use journalism, social media, and community action to improve their communities. Noa also spent two years coaching debate at middle schools, following many years of competitive debate. \u003cbr\u003e\u003cbr\u003eShe is still involved in mentorship and education at Yale, as a mentor through the Young Entrepreneurs Program. YEP leads business incubators and mentorship programs to teach high schoolers how to build a start-up and use entrepreneurship to create a product or organization that will create positive community change.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNoa is also interested in finances, financial services, and economics. She is involved in a group called Smart Women’s Securities, which teaches girls financial literacy, and manages an investment fund that invests in women-led groups and businesses. She is additionally part of a group called Global Research and Consulting, which provides consultation services to non-profit organizations worldwide.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, Noa loves the outdoors. She was a competitive ski racer her whole life and still loves to ski as much as possible. She also loves to read, try new foods, go for walks with her dog, Tala, and listen to Taylor Swift!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"dfd68586-32e8-458f-a730-fac0d76ac1bb\"}"},{"__ref":"Favorites:{\"uuid\":\"a474f869-52f9-440e-abe7-4eeab26b883c\"}"},{"__ref":"Favorites:{\"uuid\":\"30808a29-8bc4-4b48-927f-6872874eb82e\"}"}],"causesSupported":[],"major":"Global Affairs ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8b2d9755-d386-4fde-a256-1642de31a3b6\"}"},{"__ref":"DeepDives:{\"uuid\":\"cbc1cda0-56bd-488f-a582-eb8102fddf13\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3afb0f70-e31b-4990-9e38-c6991dc8b022/-/crop/264x264/0,7/-/preview/-/format/jpg/","https://ucarecdn.com/696bf7a7-3c35-4ebe-806c-b75380db9e90/-/preview/-/format/jpg/","https://ucarecdn.com/799bbe0d-e58a-4a75-b3d4-05e284ef15dd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fd42f10e-943b-409f-8dd8-1b522c6fe491\"}"},{"__ref":"Education:{\"uuid\":\"11737356-563e-40b4-b12b-0d37edd8a54f\"}"}],"hiredAt":"2023-02-27T17:38:37.309Z","topics":["History Project","Literature","Sustainability","Global Health","World Cultures","Journalism","Debate","Public Speaking","K-5 Grade Math","Pre-Algebra","Writing","French","Algebra I","6-8 Grade Science","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"noa-ablowmeaselle\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6df0b3e8-a53b-44ca-bdfc-fc82d2bec267\"}"}}},"_sen
