d57f0b528de6\"}":{"__typename":"Favorites","uuid":"e3c8865a-e940-4e11-926a-d57f0b528de6","photoUrl":"https://ucarecdn.com/e060ff12-5e4f-4e82-8593-5c82a1a0c674/","title":"Chess","type":"GAME"},"CausesSupported:{\"uuid\":\"bfe7af64-03c6-4e0d-8cfe-97ee2a6a67fb\"}":{"__typename":"CausesSupported","uuid":"bfe7af64-03c6-4e0d-8cfe-97ee2a6a67fb","name":"Team Seas ","description":"\u003cp\u003eInspiring environmental initiatives with global impact.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/c2758abf-77c0-461a-919e-56f2461a0722/"},"CausesSupported:{\"uuid\":\"a2ba6b86-6054-414a-ad69-35272bdb5fef\"}":{"__typename":"CausesSupported","uuid":"a2ba6b86-6054-414a-ad69-35272bdb5fef","name":"Team Trees","description":"\u003cp\u003eInspiring environmental initiatives with global impact.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/fbb59713-132f-45f1-82f7-5e19f7c0462c/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ecc8df63-1dda-4609-ae85-ce5429f0769d\"}":{"__typename":"DeepDives","uuid":"ecc8df63-1dda-4609-ae85-ce5429f0769d","content":"\u003cp\u003eDear 2016 Harrison,\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAs you navigate through the challenges and pressures of your academic journey, there is valuable advice to be shared. It's essential to remember that overstressing about AP classes shouldn't overshadow the importance of other aspects of your education. Instead, focusing on nurturing your passion for coding and exploring it further in your free time will prove invaluable.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eEncourage yourself to dedicate those extra hours to delve deeper into coding languages, explore new technologies, and engage in personal coding projects. By learning to code beyond the confines of the classroom, you will develop practical skills and a deeper understanding of programming concepts. This self-driven exploration will lay a strong foundation in coding, opening doors to exciting opportunities in the future.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMoreover, remind yourself to prioritize your hobbies and interests, such as chess. These activities not only bring joy but also foster critical thinking, problem-solving, and strategic planning skills that complement coding abilities. Embracing the joy of learning and the sense of accomplishment derived from pursuing passions will shape you into a well-rounded individual with a strong foundation in both knowledge and personal fulfillment.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eRemember, high school is a transformative time, and while academic achievements are important, they should not overshadow personal growth and the pursuit of what truly ignites curiosity. Embrace the balance between academics and personal interests, as it will shape you into a well-rounded individual with a solid foundation in both knowledge and passion.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eStay motivated, continue to challenge yourself, and enjoy the journey of self-discovery through coding and beloved hobbies.\u003c/p\u003e\u003cp\u003eWishing you all the very best, \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e2023 Harrison\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5f2ed588-dfca-49b3-b1ff-8f0b1e8c013d\"}":{"__typename":"DeepDives","uuid":"5f2ed588-dfca-49b3-b1ff-8f0b1e8c013d","content":"\u003cp\u003eIn choosing to pursue a major in CS/Math at university, the decision was driven by the appreciation for the interdisciplinary nature of these two subjects and their shared focus on problem-solving. The passion for playing, teaching, and studying chess played a significant role in nurturing a deep love for problem-solving during high school. Recognizing that both Computer Science and Mathematics provide avenues to satisfy this intrinsic need, it became evident that a Math/CS Major was the ideal path to pursue, seamlessly merging these two fields and enabling the exploration of complex problem-solving challenges.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2eface64-58dd-4478-8494-9d5a0e0147ce\"}":{"__typename":"DeepDives","uuid":"2eface64-58dd-4478-8494-9d5a0e0147ce","content":"\u003cp\u003eCurrently, I am engaged in the development of a React Native app that leverages JavaScript APIs and Expo. The primary objective of this app is to provide users with a platform to find job opportunities and offer assistance in their job search process. By harnessing the power of these technologies, I aim to create a seamless and user-friendly experience for individuals seeking employment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b1862aba-aa85-4d19-bd0c-647f146a12c5\"}":{"__typename":"DeepDives","uuid":"b1862aba-aa85-4d19-bd0c-647f146a12c5","content":"\u003cp\u003eDuring the summer after my Freshman year, I made the proactive decision to take a Health and Walking Fitness class online. By doing so, I was able to fulfill these requirements outside of high school, freeing up my schedule for more specialized courses. In the following summers of my 10th and 11th grade, I embarked on my first job experience as a chess instructor at Chess4life. I enthusiastically taught children from kindergarten to 7th grade the strategic intricacies of the game, fostering their analytical thinking and problem-solving skills. Additionally, in the summer before my 11th grade, I took an online Algebra 2 class, enabling me to bypass the course in high school. This academic leap allowed me to explore more advanced mathematics upon returning to school, maximizing my learning opportunities in the field.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"c400c57b-fff5-4f0c-b065-e45e40ddcb3a\"}":{"__typename":"School","uuid":"c400c57b-fff5-4f0c-b065-e45e40ddcb3a","name":"Western Washington University","city":"Bellingham","type":"COLLEGE","state":"Washington","country":"United States","zip":"98225"},"Education:{\"uuid\":\"39d8fd3a-8197-4da7-827f-04902f8b083c\"}":{"__typename":"Education","uuid":"39d8fd3a-8197-4da7-827f-04902f8b083c","school":{"__ref":"School:{\"uuid\":\"c400c57b-fff5-4f0c-b065-e45e40ddcb3a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Mathematics/Computer Science ","degree":"BS"},"School:{\"uuid\":\"1e834a44-24d3-4f7e-a6ed-71355ba61739\"}":{"__typename":"School","uuid":"1e834a44-24d3-4f7e-a6ed-71355ba61739","name":"Juanita High School","city":"Kirkland","type":"HIGH","state":"Washington","country":"United States","zip":"98034"},"Education:{\"uuid\":\"21059e35-db76-459a-b607-ca29ac8a3d5a\"}":{"__typename":"Education","uuid":"21059e35-db76-459a-b607-ca29ac8a3d5a","school":{"__ref":"School:{\"uuid\":\"1e834a44-24d3-4f7e-a6ed-71355ba61739\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"687242a6-60db-4992-bdcd-e4bac2c12bf0\"}":{"__typename":"MentorPublicProfile","uuid":"687242a6-60db-4992-bdcd-e4bac2c12bf0","displayName":"Harrison T.","slug":"harrison-toppenryan","biography":"\u003cp\u003eHarrison is a graduate at Western Washington University where he majored in Computer Science and Mathematics. He currently tutors other students in Chess and Mathematics. He is the former president of his university's chess club and participates in competitive tournaments regularly with an official USCF rating of 1900.\u003c/p\u003e","teachingVideoPlaybackId":"yKSOq1YQOz02L00Ox01lSUjuNAPEWPUwtejU7sEWGPdwRg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI take immense pride in my two greatest achievements thus far: successfully graduating from high school after undertaking numerous Honors and AP classes, and nearing completion of my undergraduate journey as a senior at university, where I will soon graduate with a BS in Math/CS. This major has been a demanding and rigorous pursuit, requiring perseverance and dedication, making the impending graduation a testament to the challenges I have overcome and the knowledge and skills I have acquired along the way.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"75a38d2a-0f52-4035-9ad4-ccd002a55303\"}"},{"__ref":"Favorites:{\"uuid\":\"ee49c79f-c774-4fd3-b948-c7c1b85cdd53\"}"},{"__ref":"Favorites:{\"uuid\":\"e3c8865a-e940-4e11-926a-d57f0b528de6\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"bfe7af64-03c6-4e0d-8cfe-97ee2a6a67fb\"}"},{"__ref":"CausesSupported:{\"uuid\":\"a2ba6b86-6054-414a-ad69-35272bdb5fef\"}"}],"major":"Mathematics/Computer Science ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ecc8df63-1dda-4609-ae85-ce5429f0769d\"}"},{"__ref":"DeepDives:{\"uuid\":\"5f2ed588-dfca-49b3-b1ff-8f0b1e8c013d\"}"},{"__ref":"DeepDives:{\"uuid\":\"2eface64-58dd-4478-8494-9d5a0e0147ce\"}"},{"__ref":"DeepDives:{\"uuid\":\"b1862aba-aa85-4d19-bd0c-647f146a12c5\"}"}],"activ
