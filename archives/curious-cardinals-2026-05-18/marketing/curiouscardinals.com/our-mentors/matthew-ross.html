typename":"Favorites","uuid":"6ed1957d-401b-40d7-8550-305b9c9a01f4","photoUrl":"https://ucarecdn.com/5e296e15-a90c-4c8e-a467-4597cf9d2e0e/","title":"Rafael Nadal","type":"ATHLETE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f13869f4-6aeb-4490-b2aa-0be09e0ea35e\"}":{"__typename":"DeepDives","uuid":"f13869f4-6aeb-4490-b2aa-0be09e0ea35e","content":"\u003cp\u003eI’ve been skiing for my entire life. Recently, I have spent most of my time on the slopes competing in giant slalom and slalom racing events for the Yale Ski Team. However, I’ve always been intrigued by those who abandoned the marked trails to venture into the backcountry and become an expert at doing so – the backcountry ski guide. To become one of these fearless individuals would be my dream profession.\u003c/p\u003e\u003cp\u003eA backcountry ski guide has to master the navigation of unpredictable terrain in each and every one of their runs, while simultaneously guarding the lives of others less experienced than them. No two runs are ever the same. Having to deal with this unpredictability is exciting, in that it destroys any notion of monotony within the profession. However, it requires an acute ability to recognize patterns over time, and to think quickly on one’s skis. Any mistakes can be catastrophic to oneself and those around them.\u003c/p\u003e\u003cp\u003eThe high pressure environment of a backcountry ski guide is one that I would not only thrive in, but wholeheartedly enjoy. The ability to harness my skiing and intellectual skills to become an expert in an unforgiving field, all while creating unforgettable experiences for myself and my clients, sounds like a dream job to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"dc11a5df-ca5d-4872-8449-810cd3fbc86f\"}":{"__typename":"Education","uuid":"dc11a5df-ca5d-4872-8449-810cd3fbc86f","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Statistics and Data Science","degree":"B.S."},"School:{\"uuid\":\"a3be0238-4698-4337-a9e6-f384b3ea35f5\"}":{"__typename":"School","uuid":"a3be0238-4698-4337-a9e6-f384b3ea35f5","name":"Cold Spring Harbor High School","city":"Cold Spring Harbor","type":"HIGH","state":"NY","country":"United States","zip":"11743"},"Education:{\"uuid\":\"556df2fc-0dcc-4743-a548-072793dd654b\"}":{"__typename":"Education","uuid":"556df2fc-0dcc-4743-a548-072793dd654b","school":{"__ref":"School:{\"uuid\":\"a3be0238-4698-4337-a9e6-f384b3ea35f5\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"69e90f43-8a14-46d6-94b0-6e7cf4b29c32\"}":{"__typename":"MentorPublicProfile","uuid":"69e90f43-8a14-46d6-94b0-6e7cf4b29c32","displayName":"Matthew R.","slug":"matthew-ross","biography":"\u003cp\u003eMatt is currently a Junior at Yale studying Statistics and Data Science. He is most passionate about teaching topics in mathematics and data analysis. Through teaching about these subjects’ connections to real life topics like sports, music, and politics, he hopes to develop students’ intellectual curiosity, which he believes serves as the perfect foundation for future academic success in the subject. \u003cbr\u003e\u003cbr\u003eMatt is originally from Cold Spring Harbor, NY (on the north shore of Long Island) where he went to public school, graduated valedictorian of his class, and was awarded the National Merit Scholarship: one of 2,500 recipients out of 1.5 million PSAT test takers. In high school he was a New York All State trumpet player, where he specialized in classical music and jazz improvisation. \u003cbr\u003e\u003cbr\u003eFor the past 4 years, Matt has co-run a social skills group for teens on the autism spectrum alongside a registered therapist, where they create curriculum and hold group and individual sessions to help teens adapt to their academic and social environments. \u003cbr\u003e\u003cbr\u003eAt Yale, Matt manages the portfolio of the Urban Philanthropic Fund, a student-run investment group that uses its returns to provide grants to New Haven nonprofits. In terms of hobbies, Matt is an avid skier. He is currently a member of the Yale Ski Team, where he competes in slalom and giant slalom events along the East Coast during the winter season. As much as Matt loves the East Coast, his favorite mountains (Alta, Jackson Hole, and Telluride) lie out west. \u003cbr\u003e\u003cbr\u003eHe loves all kinds of music. Whether it's jazz, electronic, rap, or classical, you name it and he probably has a Spotify playlist. Matt’s current musical endeavor is that he is trying to learn how to DJ! \u003cbr\u003e\u003cbr\u003eAs a tutor, Matt strives to be more than someone who assigns work and then walks you through an answer key. He believes that learning comes easiest when a personal connection exists between the student and the teacher.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5a261abd-1f61-4da2-b66c-8fe3802235e6\"}"},{"__ref":"Favorites:{\"uuid\":\"b84cb1db-7d50-44eb-9d3a-78925997c405\"}"},{"__ref":"Favorites:{\"uuid\":\"6ed1957d-401b-40d7-8550-305b9c9a01f4\"}"}],"causesSupported":[],"major":"Statistics and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f13869f4-6aeb-4490-b2aa-0be09e0ea35e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d519f62e-6e85-4973-b4de-a7c51fdc787d/-/crop/725x724/
