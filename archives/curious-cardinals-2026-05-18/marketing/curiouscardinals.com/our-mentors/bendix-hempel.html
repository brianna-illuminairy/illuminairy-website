er, many years later in 2009, she received the nobel prize in chemistry for revolutionising structural biology. She has shown me that you should always believe in yourself and never give up, even though other people are trying to stop you or aren't supporting you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"210879f8-57a2-496a-9b97-35f15ef92304\"}":{"__typename":"DeepDives","uuid":"210879f8-57a2-496a-9b97-35f15ef92304","content":"\u003cp\u003eIn my spare time, I love to spend my time in or on the water (sailing, surfing, swimming,...)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"474885e0-af4f-4e33-8405-89e6bed62dde\"}":{"__typename":"School","uuid":"474885e0-af4f-4e33-8405-89e6bed62dde","name":"Universität Heidelberg (Germany)","city":"Heidelberg","type":"COLLEGE","state":"Baden-Württemberg","country":"Germany","zip":"69117"},"Education:{\"uuid\":\"5a9978c9-866b-415e-b2ba-3bbe61d71d2c\"}":{"__typename":"Education","uuid":"5a9978c9-866b-415e-b2ba-3bbe61d71d2c","school":{"__ref":"School:{\"uuid\":\"474885e0-af4f-4e33-8405-89e6bed62dde\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2026","major":"Medicine","degree":null},"School:{\"uuid\":\"7de029c5-cd50-4266-9b7b-8b3b53622584\"}":{"__typename":"School","uuid":"7de029c5-cd50-4266-9b7b-8b3b53622584","name":"Hebbelschule","city":"Kiel","type":"HIGH","state":"Schleswig-Holstein","country":"Deutschland","zip":"24106"},"Education:{\"uuid\":\"6395813a-9412-4548-b2d9-4d4dc25637b8\"}":{"__typename":"Education","uuid":"6395813a-9412-4548-b2d9-4d4dc25637b8","school":{"__ref":"School:{\"uuid\":\"7de029c5-cd50-4266-9b7b-8b3b53622584\"}"},"startYear":"2011","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ed9f1617-da4c-43fb-baba-26eb4b956466\"}":{"__typename":"MentorPublicProfile","uuid":"ed9f1617-da4c-43fb-baba-26eb4b956466","displayName":"Bendix H.","slug":"bendix-hempel","biography":"Bendix is pursuing a medical degree at the University of Heidelberg (Germany). Already back in high school, he was passionate about medicine and organised events to inform about bone marrow and organ donations when he was student body president. In his gap year after high school, he worked as second surgical assistant in a local hospital and did several internships, one of them in the lab of nobel laureate Ada Yonath, doing research on antibiotic resistances. He even received a financial grant by the prime minister of his state for this internship. \nHaving the opinion that ethics is an important part of research, Bendix founded the International Debate Club for Ethics in Science in early 2020 in collaboration with some friends and the Israeli Weizmann Institute of Science. \n\nApart from academia, Bendix is a semi-professional sailor. He won the German Championships in preolympic sailing back in 2016 and is currently competing at the top of the German sailing league. When he’s not sailing, he gives his knowledge to the younger generations as a sailing coach. \nWith this experience in practical teaching, Bendix is happy to use these teaching techniques when tutoring the nobel laureates of tomorrow in the Curious Cardinals classes.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Medicine","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"58bbe90a-6a4c-4f7a-96ba-d8a079461def\"}"},{"__ref":"DeepDives:{\"uuid\":\"210879f8-57a2-496a-9b97-35f15ef92304\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/81852367-1105-4ab4-935f-dc9b754ec051/-/preview/-/format/jpg/"],"pronouns":"HE_HI
