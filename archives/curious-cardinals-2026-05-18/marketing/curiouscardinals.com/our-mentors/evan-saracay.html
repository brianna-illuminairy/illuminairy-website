"degree":"Masters"},"MentorPublicProfile:{\"uuid\":\"e801eae3-a13f-4080-904b-fb3d4a0a281f\"}":{"__typename":"MentorPublicProfile","uuid":"e801eae3-a13f-4080-904b-fb3d4a0a281f","displayName":"Evan S.","slug":"evan-saracay","biography":"Evan is a graduate student at Stanford University, where he is currently pursuing a Master's degree in Network Security. He has always been fascinated by cybersecurity, which is often depicted as a highly skilled field in movies. Being a curious person, Evan has taken a wide range of courses in both Computer Science and Electrical Engineering with the goal of gaining a comprehensive understanding of how computers work. He is aware that there are nearly an endless amount of levels of complexity that regular day computer users are just unaware of.\nPrior to attending Stanford, Evan was deeply involved in the world of robotics, participating in the FIRST Robotics Competition (FRC) throughout high school. As captain of his high school's robotics team, Evan gained valuable experience in developing projects from ideation to implementation. This included picking up skills such as CAD, GCode for CNC machines, 3D-printing, welding, microcontroller programming, and feedback systems programming. Evan also took advantage of opportunities to gain real-world experience in the tech industry, having spent multiple summers working as a Software Engineer for Google. During his internships, he worked on kernel code for Google Cloud, developed database pipeline processes for Google Play, and learned to create Web applications for Google.\nAs an undergraduate, Evan studied Computer Systems and continues to have a passion for technology and tinkering with microcontrollers in his free time. During his free time, he watches YouTubers like the “Hacksmith” and “Stuff Made Here” for inspiration. Inspired by their creativity, he often codes something up on his Raspberry Pi, whether it's a simple light display, a networking protocol, or even a Gameboy emulator (which is still in the works). Evan enjoys working on projects that combine mechanical engineering and computer science, perhaps because he is a huge fan of Star Wars and hopes to one day have a robot assistant like R2D2.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Systems","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/dc7545da-88c3-4123-8759-07f648a431bd/-/crop/270x270/46,0/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"41e92c44-5450-478a-9953-5ec138fbb7c0\"}"}],"hiredAt":"2023-01-18T04:42:31.000Z","topics":["Physics","Algebra I","Pre-Algebra","Coding / Programming","K-5 Grade Math","Web Design","Geometry","Precalculus / Trigonometry","Game Design","Machine Learning / AI","Algebra II","Robotics / Electronics / CAD","6-8 Grade Science","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"evan-saracay\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e801eae3-a13f-4080-904b-fb3d4a0a281f\"}"}}},"_sentryTraceData":"dd5118a0ac3d4042baa0342ef6000a70-884ee3b45a2654f0-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=dd5118a0ac3d4042baa0342ef6000a70,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"evan-saracay"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(
