 that. So, I decided to major in Ethics, Politics, and Economics at Yale because it emphasised a truly interdisciplinary and both quantitative and qualitative approach to higher education.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a08994c0-b3c5-4500-b8ce-b5266bffd37b\"}":{"__typename":"DeepDives","uuid":"a08994c0-b3c5-4500-b8ce-b5266bffd37b","content":"\u003cp\u003eI would love to write a creative non-fiction book about the different stages of life and centered around the phenomenon of a 'third-culture kid'\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7d1d6c98-04b3-4814-97fb-3d6c97ebba6c\"}":{"__typename":"DeepDives","uuid":"7d1d6c98-04b3-4814-97fb-3d6c97ebba6c","content":"\u003cp\u003eIn high school, I spent a few weeks each summer participating in intensive soccer camps, where I played every day for two weeks. Another summer, I interned at NowThis where I was a production intern with the Her channel and learned how to produce short-form multimedia content, write and edit scripts, and use a variety of software.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"631caf36-ce77-44f7-b0e5-ac79132381e9\"}":{"__typename":"DeepDives","uuid":"631caf36-ce77-44f7-b0e5-ac79132381e9","content":"\u003cp\u003eI love to read, write, cook and bake, go for long hikes with my dog (Gatsby), and catch up with friends. You can always find me listening to music and podcasts. If you have any recommendations I would love to hear them as I'm always on the hunt for new things to listen to. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"82be987d-bec6-4d96-a8e8-4776b89642a8\"}":{"__typename":"School","uuid":"82be987d-bec6-4d96-a8e8-4776b89642a8","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06510"},"Education:{\"uuid\":\"222f1b20-6c7f-45ef-8ea4-ee0d8d58cb0b\"}":{"__typename":"Education","uuid":"222f1b20-6c7f-45ef-8ea4-ee0d8d58cb0b","school":{"__ref":"School:{\"uuid\":\"82be987d-bec6-4d96-a8e8-4776b89642a8\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Ethics, Politics, Economics","degree":null},"School:{\"uuid\":\"2261481a-69ac-40e0-a886-848446414042\"}":{"__typename":"School","uuid":"2261481a-69ac-40e0-a886-848446414042","name":"The American School in London","city":"London","type":"HIGH","state":"England","country":"United Kingdom","zip":"NW8 0NP"},"Education:{\"uuid\":\"df5039f4-a100-46b5-aa79-924fe6c1bc6a\"}":{"__typename":"Education","uuid":"df5039f4-a100-46b5-aa79-924fe6c1bc6a","school":{"__ref":"School:{\"uuid\":\"2261481a-69ac-40e0-a886-848446414042\"}"},"startYear":"2009","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"16994c39-f2f4-4a16-90e2-07718a2b76de\"}":{"__typename":"MentorPublicProfile","uuid":"16994c39-f2f4-4a16-90e2-07718a2b76de","displayName":"Alexandra G.","slug":"alexandra-gers","biography":"\u003cp\u003eHi everyone, my name is Alexandra and I am currently pursuing a degree in Ethics, Politics, Economics, and a language certificate in Chinese from Yale University. I was born in the US and raised in London, but am half-French, so my love for learning new languages, travelling, and exploring new cultures stems from my upbringing. During high school, I spent most of my time involved in journalism, creative writing, debate, and playing soccer (or football). Now, at Yale, outside of the classroom I've explored my love for music and co-chaired Yale’s annual music festival, Spring Fling, over three years. You can  find me listening to Leon Bridges, Fleetwood Mac, or Still Woozy. I also founded Yale's only student publication dedicated to fashion and culture, Fuse Magazine, which took my love for collaboration and journalism in a completely different direction.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ethics, Politics, Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"390433dd-7088-463c-b7d6-f97ee3338a8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"a08994c0-b3c5-4500-b8ce-b5266bffd37b\"}"},{"__ref":"DeepDives:{\"uuid\":\"7d1d6c98-04b3-4814-97fb-3d6c97ebba6c\"}"},{"__ref":"DeepDives:{\"uuid\":\"631caf36-ce77-44f7-b0e5-ac79132381e9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d2440d54-f167-451f-a69d-9eb9ea3acc5d/-/crop/781x780/0,19/-/preview/-/format/jpg/","https://ucarecdn.com/f1eef47e-68a9-4e20-8846-360758620389/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"222f1b20-6c7f-45ef-8ea4-ee0d8d58cb0b\"}"},{"__ref":"Education:{\"uuid\":\"df5039f4-a100-46b5-aa79-924fe6c1bc6a\"}"}],"hiredAt":"2022-03-14T21:49:42.000Z","topics":["Writing","Mandarin Chinese","College Essay Writing","History","Reading","Economics","Creative Writing","History Project","K-6 Storybook","Fashion / Cosmetics","Finance / Investing","Law / Government / Policy","Journalism","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility
