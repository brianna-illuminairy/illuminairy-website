n music. In 2019, she graduated summa cum laude from the Groton School where she was a dual varsity captain in volleyball and track and field and an avid cello player, earning her the Harvard Book Prize for academic excellence and high character in 2018. With an incredible conviction that the ability to engineer using the material of life will fundamentally change the way we live, Montanna has spent time understanding how to translate biotechnology from the lab into the real world and how to practice human-centered design in the process. The Stanford d.School has become her second home and has changed her outlook on entrepreneurship, tech development, and need-finding.  ​Outside of the classroom, Montanna loves to design experiences. She's planned Stanford's first student design, directed, and modeled runway show with 700 attendees, and loves a great party theme. She is a Mayfield fellow through STVP, BioE, and design teaching assistant and course designer, member of Stanford's FashionX, club and a Stanford tour guide, which perhaps provides a forum for her greatest talents: talking too much and walking backward. When she’s feeling really feisty you can find her taking crazy self-timer photos, hosting a dinner party for 12, or leading her IM volleyball team to victory. She also LOVES Survivor.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e4cac0e2-0eb4-4048-969a-23209429e35e\"}"},{"__ref":"Favorites:{\"uuid\":\"b85fc220-162b-469a-b3b1-34a48885a82c\"}"},{"__ref":"Favorites:{\"uuid\":\"25536ec3-1dd5-496a-9c38-a1c71bcebeaf\"}"}],"causesSupported":[],"major":"Bioengineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fea4c0c1-fa0d-4219-9908-acdb11e0e968\"}"},{"__ref":"DeepDives:{\"uuid\":\"46d3122b-36f3-4110-a699-a6bca842ec1c\"}"},{"__ref":"DeepDives:{\"uuid\":\"1110c771-16a1-4eb9-a72c-90115e714143\"}"},{"__ref":"DeepDives:{\"uuid\":\"e2589fc4-5c02-4951-8840-4d5802e
