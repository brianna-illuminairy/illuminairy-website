s of interest. Without taking new classes, or involving myself in activities outside of school, I would have never found architecture. That, along with a balance between academic interests and activities I can do for fun, is the best way any student can find their passion.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef\"}":{"__typename":"School","uuid":"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90089"},"Education:{\"uuid\":\"052e6b71-a1b7-4ed2-bf87-e13d581299e8\"}":{"__typename":"Education","uuid":"052e6b71-a1b7-4ed2-bf87-e13d581299e8","school":{"__ref":"School:{\"uuid\":\"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2027","major":"Architecture","degree":"Bachelor of Architecture"},"School:{\"uuid\":\"7733a6b8-8792-49de-9d04-33393cc9109c\"}":{"__typename":"School","uuid":"7733a6b8-8792-49de-9d04-33393cc9109c","name":"Syosset High School","city":"Syosset","type":"HIGH","state":"New York","country":"United States","zip":"11791"},"Education:{\"uuid\":\"e8d48655-fd21-468e-9536-1f7a2186570b\"}":{"__typename":"Education","uuid":"e8d48655-fd21-468e-9536-1f7a2186570b","school":{"__ref":"School:{\"uuid\":\"7733a6b8-8792-49de-9d04-33393cc9109c\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"95cd2b4a-61bd-4f8d-8972-97636a21adbf\"}":{"__typename":"MentorPublicProfile","uuid":"95cd2b4a-61bd-4f8d-8972-97636a21adbf","displayName":"Joshua B.","slug":"joshua-burrows","biography":"Josh is currently studying architecture at the University of Southern California with interests in physics and landscape design as well. Growing up the in the New York area, Josh took advantage of his surroundings and found a passion for the built environment through his experiences in New York City, where he fell in love with the tall skyscrapers, historic sites, and the new life in the city. By going across the country to pursue a degree, he has found this same passion in new cities such as Los Angeles and Santa Fe. In high school, he took his passion for architecture as an opportunity to co-found and lead his high school's architecture club, while also involving himself as an English tutor through his school. In his time at USC, Josh has formed relationships with peers from around the world and has taken advantage of being able to collaborate with others to become more creative, innovative designers. He has found amazing opportunities to understand more about architecture through model-making and learning more about dwelling spaces, while also taking an in-depth look at how Los Angeles's neighborhoods are built by people of diverse backgrounds and ethnicities. Outside of the studio, he enjoys playing soccer, listening to techno music, and exploring new places both in his area and far away . He is looking forward to working with others to create rewarding and fulfilling outcomes through fun exploration and experimentation. ","teachingVideoPlaybackId":"ucbSosDtyScHEHo3Rpul005xtZi00Ja3WlNmkiyTkDZBU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Architecture","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e00104ad-1525-4c21-a9ad-034df91143b6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c4736a1e-7c62-4803-9b38-0d6d7dc1f70d/-/crop/290x290/480,127/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"052e6b71-a1b7-4ed2-bf87-e13d581299e8\"}"},{"__ref":"Education:{\"uuid\":\"e8d48655-fd21-468e-9536-1f7a2186570b\"}"}],"hiredAt":"2023-03-28T22:33:26.374Z","topics":["Algebra I","Algebra II","Precalculus / Trigonometry","Physics","Chemistry","6-8 Grade Science","Spanish",
