2b24eb7563c\"}":{"__typename":"Favorites","uuid":"c514f1c1-b3fd-4a65-b96e-82b24eb7563c","photoUrl":"https://ucarecdn.com/b11cc806-a688-4618-b23d-5c6e8ea99b93/","title":"Paris, France","type":"CITY"},"CausesSupported:{\"uuid\":\"0f574080-6a9c-4da1-82be-807fbb4818f0\"}":{"__typename":"CausesSupported","uuid":"0f574080-6a9c-4da1-82be-807fbb4818f0","name":"Youth Entrepreneurs Program","description":"\u003cp\u003eEmpowering New Haven's students to be tomorrow's entrepreneurs.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/709a0e5d-cdf0-4ad1-b598-1241dcf75e62/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b44529fa-aced-478f-8280-aafd84933939\"}":{"__typename":"DeepDives","uuid":"b44529fa-aced-478f-8280-aafd84933939","content":"\u003cp\u003eI believe that the number one route to success is a combination of positive reinforcement and consistent, unobstructed focus on your goals. Both of these thought patterns can be fostered by individual passion and persistence, but having an experienced, passionate mentor nudge you back on the right track and the start of your journey can make all the difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"8340b6af-d547-4860-88e0-fbe6fb7dc4b2\"}":{"__typename":"DeepDives","uuid":"8340b6af-d547-4860-88e0-fbe6fb7dc4b2","content":"\u003cp\u003eMy identity as a human-center programmer and a multi-faceted learner impacts my teaching style because I am highly motivated to bring the humanities into teaching STEM and vice versa. I like to make sure that students who want to build an app are knowledgeable of proper communication and captivating design. Similarly, writers and communicators should be able to use the benefits of statistics and data science to write meaningful, informed work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"2cf912e1-5568-4c3a-acaa-60015ab14a50\"}":{"__typename":"Education","uuid":"2cf912e1-5568-4c3a-acaa-60015ab14a50","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":"BA or BSE"},"School:{\"uuid\":\"7045d05b-2c08-40db-8a06-ab33c27ec416\"}":{"__typename":"School","uuid":"7045d05b-2c08-40db-8a06-ab33c27ec416","name":"Bronxville High School","city":"Bronxville","type":"HIGH","state":"NY","country":"USA","zip":"10708"},"Education:{\"uuid\":\"cc8defda-969b-43fa-a05a-46153fe2bf98\"}":{"__typename":"Education","uuid":"cc8defda-969b-43fa-a05a-46153fe2bf98","school":{"__ref":"School:{\"uuid\":\"7045d05b-2c08-40db-8a06-ab33c27ec416\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"a9e0d87a-d57a-41e1-82a1-d36e17171332\"}":{"__typename":"MentorPublicProfile","uuid":"a9e0d87a-d57a-41e1-82a1-d36e17171332","displayName":"Erin F.","slug":"erin-foley","biography":"Erin is pursuing a Computer Science degree at Yale University. In her academic and extra-curricular activities, she seeks to bridge the gap through the humanities and STEM, seeking to create tech-driven solutions for social issues she is passionate about. In 2021 and 2022, she researched for NASA's Climate Change Research Initiative to explore the connection between historic urban development patterns and modern climate change experience.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was presenting as a primary author at the American Meteorological Society in my senior year of HS. I presented on the relationship between current climate change experience and historic redlining legacies in New York City neighborhoods. Having such qualified scientists listening to my presentation showed me that despite my young age, I can achieve anything if I am passionate enough about it.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4c246ae2-69bd-4e1f-b26b-285f4577c805\"}"},{"__ref":"Favorites:{\"uuid\":\"8a5fea80-d113-4fc9-97c2-934866baa973\"}"},{"__ref":"Favorites:{\"uuid\":\"c514f1c1-b3fd-4a65-b96e-82b24eb7563c\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0f574080-6a9c-4da1-82be-807fbb4818f0\"}"}],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b44529fa-aced-478f-8280-aafd84933939\"}"},{"__ref":"DeepDives:{\"uuid\":\"8340b6af-d547-4860-88e0-fbe6fb7dc4b2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bd3fa099-3746-462e-b57f-8ca2f51fb659/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2cf912e1-5568-4c3a-acaa-60015ab14a50\"}"},{"__ref":"Education:{\"uuid\":\"cc8defda-969b-43fa-a05a-46153fe2bf98\"}"}],"hiredAt":"2023-05-16T19:00:10.161Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Computer Science","K-6 Storybook","Creative Writing","Music","Fashion / Cosmetics","Visual Arts / Graphic Design","History Project","Video / Photography","Business / Entrepreneurship","F
