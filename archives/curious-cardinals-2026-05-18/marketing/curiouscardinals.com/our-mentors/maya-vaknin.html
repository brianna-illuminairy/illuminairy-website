8d\"}":{"__typename":"Favorites","uuid":"c3da0f7d-7880-4ff4-ae41-60c515beb88d","photoUrl":"https://ucarecdn.com/a8a262f9-5f92-44fd-a6de-a43ab1d9296e/","title":"Moonrise Kingdom","type":"MOVIE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2a34667e-1188-4a3b-ba9f-4c941d2a9af2\"}":{"__typename":"DeepDives","uuid":"2a34667e-1188-4a3b-ba9f-4c941d2a9af2","content":"\u003cp\u003eThe key to learning absolutely anything is having the confidence in yourself to accomplish whatever you put your mind to, and mentorship can help students discover this in themselves and learn how to learn in new ways.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"40e94f14-ad7c-44b0-a3be-c598fa18eeae\"}":{"__typename":"DeepDives","uuid":"40e94f14-ad7c-44b0-a3be-c598fa18eeae","content":"\u003cp\u003eI did a really fun passion project about the history of protest music. In the end, I helped the student write her own song, combining her passions for singing and environmentalism.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"ffdfb33c-16e8-4af7-be91-7b07ab90abac\"}":{"__typename":"DeepDives","uuid":"ffdfb33c-16e8-4af7-be91-7b07ab90abac","content":"\u003cp\u003eI strongly believe that if I'm going to do something, I want to do it the best that I can!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"757757e1-05e3-4b11-b96d-ac287d7ac3f6\"}":{"__typename":"Education","uuid":"757757e1-05e3-4b11-b96d-ac287d7ac3f6","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Middle Eastern Studies; Education","degree":null},"School:{\"uuid\":\"bd711a62-66d0-4c2f-a35a-5010c93d2617\"}":{"__typename":"School","uuid":"bd711a62-66d0-4c2f-a35a-5010c93d2617","name":"Professional Performing Arts High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10036"},"Education:{\"uuid\":\"6e3822f2-765b-4f5c-82ad-d4acf551b5fb\"}":{"__typename":"Education","uuid":"6e3822f2-765b-4f5c-82ad-d4acf551b5fb","school":{"__ref":"School:{\"uuid\":\"bd711a62-66d0-4c2f-a35a-5010c93d2617\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"2372fca6-5e39-438d-a2b5-8b15f963bba1\"}":{"__typename":"MentorPublicProfile","uuid":"2372fca6-5e39-438d-a2b5-8b15f963bba1","displayName":"Maya V.","slug":"maya-vaknin","biography":"\u003cp\u003eMaya is a recent graduate of Yale University, with a bachelor's degree in Near Eastern languages and civilizations and a minor in education studies. A New York City native, you can find Maya playing guitar in her all-girl punk rock band, sitting at the park reading a book, or hanging out with her younger siblings. Maya was one of 15 students accepted to the Drama program at the Professional Performing Arts High School, where she also served as co-founder and editor-in-chief of the literary magazine. In her junior year, she was selected to teach English in the Dominican Republic through the organization Global Glimpse, which she is still an active member of today. In her senior year, Maya completed a public policy project about the status of school counselors in NYCPS addressed to the Department of Education. She obtained perfect scores on both the AP Literature exam and the writing and english sections of the ACT, and graduated with honors. At Yale, Maya has served on the board of the Yale First-Generation and Low-Income Advocacy Movement as well as the Middle Eastern and North African Student Association. She has had creative fiction published in several of Yale’s literary magazines. Currently, she is attending an intensive six-week publishing program at the Columbia School of Journalism, where she is learning about all aspects of book, magazine, and digital media publishing. Maya believes creativity can be applied to any discipline and is excited to bring her passion for innovation, organization, and hands-on learning to the Curious Cardinals community. Maya has experience teaching all ages and is excited to help students figure out how their diverse interests interconnect!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d238f5f0-d3de-4895-a0e4-be240aff485d\"}"},{"__ref":"Favorites:{\"uuid\":\"c72f6004-4cf4-4320-80f3-23b1e9db7925\"}"},{"__ref":"Favorites:{\"uuid\":\"c3da0f7d-7880-4ff4-ae41-60c515beb88d\"}"}],"causesSupported":[],"major":"Middle Eastern Studies; Education","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2a34667e-1188-4a3b-ba9f-4c941d2a9af2\"}"},{"__ref":"DeepDives:{\"uuid\":\"40e94f14-ad7c-44b0-a3be-c598fa18eeae\"}"},{"__ref":"DeepDives:{\"uuid\":\"ffdfb33c-16e8-4af7-be91-7b07ab90abac\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3ea2b41e-da26-492d-85ab-8e6b2b70be5d/-/preview/-/for
