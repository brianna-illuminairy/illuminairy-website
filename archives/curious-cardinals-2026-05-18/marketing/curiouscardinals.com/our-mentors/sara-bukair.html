6b8fa7c\"}":{"__typename":"Favorites","uuid":"cab4a4fc-4eeb-4dc3-bc26-77e426b8fa7c","photoUrl":"https://ucarecdn.com/3fed7a7e-a06f-4699-8ee3-12226c60847e/","title":"Il Postino","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8fbbe8a3-2a2f-43e4-a03a-92261d02ed8c\"}":{"__typename":"DeepDives","uuid":"8fbbe8a3-2a2f-43e4-a03a-92261d02ed8c","content":"\u003cp\u003eI love to absorb all sorts of media –\u0026nbsp;books, films, musicals, poems, art exhibitions. This is where I source a lot of inspiration in my own life, and engaging with these materials is super important to me. Other than that, I love to explore places I've never been to before, whether that be traveling, hiking, or road-tripping.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d8588282-bdea-4192-8bb9-90ffb2d5ea1c\"}":{"__typename":"DeepDives","uuid":"d8588282-bdea-4192-8bb9-90ffb2d5ea1c","content":"\u003cp\u003eMy biggest piece of advice to my middle school or high school self, is to engage with schoolwork critically and intentionally rather than passively. It's so important to question what you learn in order to understand it better. It's also this kind of critical thinking and questioning that causes mankind to reach breakthroughs and accomplish things we once thought were impossible! Another piece of advice I would give is to not compare yourself with others, everyone is on their own path. Spend your energy investing in yourself and the things you love learning – that way you'll always win.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"a12311c0-c027-429c-be74-11d5609c4d61\"}":{"__typename":"DeepDives","uuid":"a12311c0-c027-429c-be74-11d5609c4d61","content":"\u003cp\u003eI enjoyed both STEM and humanities classes. Specifically, I loved math, political science, and economics. I did a lot of debate/model-un, and would spend my time outside of school doing advocacy work, being with family and friends, and discovering new shows, books, podcasts, etc.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"d33cf04f-039c-4d83-87bd-39d275f9eb21\"}":{"__typename":"DeepDives","uuid":"d33cf04f-039c-4d83-87bd-39d275f9eb21","content":"\u003cp\u003eMy mom –\u0026nbsp;she was the first woman in her family to break so many barriers (going to college, working in journalism, travel the world). My mom was the only girl amongst five brothers, and I'm the only girl amongst 3 brothers. I relate to her in many ways and source endless inspiration from her stories and experiences. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"7fa88522-fbc7-48d8-b09a-af6d37a4a4ee\"}":{"__typename":"School","uuid":"7fa88522-fbc7-48d8-b09a-af6d37a4a4ee","name":"Bainbridge High School","city":"Bainbridge Island","type":"HIGH","state":"Washington","country":"United States","zip":"98110"},"Education:{\"uuid\":\"4ea0cde1-aeb6-468c-9ec5-0aab8889fb13\"}":{"__typename":"Education","uuid":"4ea0cde1-aeb6-468c-9ec5-0aab8889fb13","school":{"__ref":"School:{\"uuid\":\"7fa88522-fbc7-48d8-b09a-af6d37a4a4ee\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a84fb863-39b6-4c02-928b-50bea69b0bf8\"}":{"__typename":"Education","uuid":"a84fb863-39b6-4c02-928b-50bea69b0bf8","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science","degree":"BS"},"MentorPublicProfile:{\"uuid\":\"3ae23ddf-8896-4a96-aac2-62465d11e9dd\"}":{"__typename":"MentorPublicProfile","uuid":"3ae23ddf-8896-4a96-aac2-62465d11e9dd","displayName":"Sara B.","slug":"sara-bukair","biography":"\u003cp\u003eSara Bukair is a Junior at Stanford University, where she is studying Computer Science and Political Science, and is also planning to go to law school. Sara grew up overseas in the UAE and moved to Seattle as a Sophomore in High School. She is an extremely interdisciplinary student who loves both STEM and humanities, and finds the blend and intersection of these disciplines to be super interesting!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn High School, Sara spent her time outside of classes working as a student lobbyist in WA state. Most memorably, Sara advocated for WA community colleges that were at risk of facing financial cuts due to COVID, a move that would disproportionately affect BIPOC and low-income students. Sara also organized and moderated a “debate” for representatives on the Washington ballot to specifically discuss student issues and represent student causes, this included conversations about climate change, student debt, and BLM. She also worked on a voter registration campaign that targeted WA colleges for the 2020 presidential election.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond her interest and involvement in political lobbying, Sara enjoyed a range of subjects in high school, especially Math, Physics, Political Science, and Economics. Since coming to Stanford, Sara found the blend of Computer Science and Political Science to be exciting, and is interested in the intersection of these topics: Tech Ethics! This is an especially exciting topic for her considering all of the interesting conundrums and issues that surround AI.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSara is also involved with finance and consulting groups on campus. She is the lead of an impact VC fund on Stanford’s campus, and is a member of Stanford Consulting where she works on different consulting cases with big companies throughout the school year.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSara also has a passion for writing and is a contributor to the Stanford newspaper. Her love for the writing extends beyond journalism to a fondness for books, musicals, poetry, stand-up etc! Engaging in one of these mediums is definitely what you’ll find Sara doing in her free time. She cannot wait to meet with Curious Cardinal students and is excited to help them discover and develop their own passions!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e","teachingVideoPlaybackId":"xvA01kBeiu01l301xokwTfPmmDpmlcV9W02AAuL00cqCWJzs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"123afc3d-d99d-4fcd-8873-264bd023be34\"}"},{"__ref":"Favorites:{\"uuid\":\"41236e4d-4f8e-42c6-a87e-e1d40c102ef0\"}"},{"__ref":"Favorites:{\"uuid\":\"cab4a4fc-4eeb-4dc3-bc26-77e426b8fa7c\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8fbbe8a3-2a2f-43e4-a03a-92261d02ed8c\"}"},{"__ref":"DeepDives:{\"uuid\":\"d8588282-bdea-4192-8bb9-90ffb2d5ea1c\"}"},{"__ref":"DeepDives:{\"uuid\":\"a12311c0-c027-429c-be74-11d5609c4d61\"}"},{"__ref":"DeepDives:{\"uuid\":\"d33cf04f-039c-4d83-87bd-39d275f9eb21\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/25e76e0b-672e-4d1a-bb18-9c5be4b67c0c/-/crop/653x653/148,0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4ea0cde1-aeb6-468c-9ec5-0aab8889fb13\"}"},{"__ref":"Education:{\"uuid\":\"a84fb863-39b6-4c02-928b-50bea69b0bf8\"}"}],"hiredAt":"2022-09-24T01:11:24.000Z","topics":["Coding / Programming","Public Speaking","Race \u0026 Ethnicity","Writing","Business / Entrepreneurship","Web Design","Journalism","Economics","Law / Government / Policy","Debate","Machine Learning / AI","Computer Science","College Essay Writing","Academic Coaching","Algebra I","Algebra II","Geometry","Pre-Algebra","Precalculus / Trigonometry"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sara-bukair\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3ae23ddf-8896-4a96-aac2-62465d11e9dd\"}"}}},"_sentryTraceData":"e4e55c030b7e43389a0d18bba9f98930-ba09c4a25723a4ed-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e4e55c030b7e43389a0d18bba9f98930,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sara-bukair"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l
