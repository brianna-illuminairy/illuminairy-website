e4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"aea7234f-b0a1-40a1-bdf2-07d88b7f722e\"}":{"__typename":"DeepDives","uuid":"aea7234f-b0a1-40a1-bdf2-07d88b7f722e","content":"\u003cp\u003eMechanical Engineering allows me to continue to explore the beauty behind machines, at a deeper level too. This is why robots and cars fascinate me so much. When you start breaking a simple machine apart you then notice the fascinating intricacy behind it's design. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"c7237f57-197b-4d35-a46f-04f515d3f79a\"}":{"__typename":"School","uuid":"c7237f57-197b-4d35-a46f-04f515d3f79a","name":"UTRGV Mathematics and Science Academy","city":"Brownsville","type":"HIGH","state":"Texas","country":"United States","zip":"78586"},"Education:{\"uuid\":\"47e45354-83b5-4c3e-af41-52e0de7cab39\"}":{"__typename":"Education","uuid":"47e45354-83b5-4c3e-af41-52e0de7cab39","school":{"__ref":"School:{\"uuid\":\"c7237f57-197b-4d35-a46f-04f515d3f79a\"}"},"startYear":"2018","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"fa44f7ff-4613-4d9e-9f48-7c99a45cadd3\"}":{"__typename":"Education","uuid":"fa44f7ff-4613-4d9e-9f48-7c99a45cadd3","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":" Mechanical Engineering","degree":"Bachelor's"},"MentorPublicProfile:{\"uuid\":\"2714780f-71df-4f9a-b02f-1f58a60e2104\"}":{"__typename":"MentorPublicProfile","uuid":"2714780f-71df-4f9a-b02f-1f58a60e2104","displayName":"Romeo G.","slug":"romeo-garcia","biography":"\u003cp\u003eHello! My name is Romeo (yes, like Romeo and Juliet) and I'm a masters student at Stanford University currently majoring in Mechanical Engineering with a concentration in Mechatronics. To tell you a little bit about myself: I'm a hard-working, self-driven, enthusiastic learner. In my free time I love to watch movies, listen to music, exercise, read, hike, and above all, build things. I love being hands-on and making things come to life. Making things like robots or lamps or random 3D prints is exciting and always a good time. I also love being outdoors and appreciating the space around me. I've done various hikes around Stanford and, recently, one at Yosemite! Throughout my life, my teachers and professors have had a huge impact on my life. They have been sources of inspiration and motivation. Therefore, I too want to have an impact on the lives of students. As a mentor for Curious Cardinals I want to ignite that spark of curiosity that students have for learning. I will understand what each student’s unique learning methods are and use that to better mentor them. Together we will explore the beauty behind each subject and navigate the fun waters of learning!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting into Stanford was one of the best moments of my life. It was a huge relief and showed that all my hard work had paid off. After four years there, I can say it was an amazing opportunity. I was surrounded by great people and had access to countless opportunities.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c3381dec-af16-4b86-a202-87bf302f69c0\"}"},{"__ref":"Favorites:{\"uuid\":\"a8388aa9-c786-4cf2-8330-25fa96ff447d\"}"},{"__ref":"Favorites:{\"uuid\":\"acb368c2-a39e-4998-bf0f-fc8b03ddfc95\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"c82b8ee2-fc91-42bd-a08d-e3b8751cd47c\"}"},{"__ref":"CausesSuppor
