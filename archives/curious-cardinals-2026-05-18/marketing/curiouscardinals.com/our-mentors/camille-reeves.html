e room. So I am so excited that Curious Cardinals has given me the opportunity to be that someone for the next generation!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"69918638-9e92-4e06-b80c-8213133394df\"}":{"__typename":"DeepDives","uuid":"69918638-9e92-4e06-b80c-8213133394df","content":"\u003cp\u003eI hope to have the opportunity to work with the White House on outer space policies!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"95c97b96-521e-40d7-b746-93ab56b206c7\"}":{"__typename":"DeepDives","uuid":"95c97b96-521e-40d7-b746-93ab56b206c7","content":"\u003cp\u003eI would tell my high school self to take some more time for herself. Your hard work will pay off, so do everything you can to make sure you can truly enjoy the fruits of your labor! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c668e592-38c4-4d8c-988f-75aa5c39fece\"}":{"__typename":"DeepDives","uuid":"c668e592-38c4-4d8c-988f-75aa5c39fece","content":"\u003cp\u003eMy dream job is helping to shape the next generation of tech that takes us to outer space!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"5d6458c1-da78-4d35-9e20-e25c1766c59d\"}":{"__typename":"Education","uuid":"5d6458c1-da78-4d35-9e20-e25c1766c59d","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Astrophysical Sciences","degree":null},"School:{\"uuid\":\"37895e74-86d3-4ec3-89a5-ea14b158433f\"}":{"__typename":"School","uuid":"37895e74-86d3-4ec3-89a5-ea14b158433f","name":"Columbus Academy","city":"Gahanna","type":"HIGH","state":"Ohio","country":"United States","zip":"43230"},"Education:{\"uuid\":\"f1dfdfbc-2fea-4005-afea-3546ad5a14cd\"}":{"__typename":"Education","uuid":"f1dfdfbc-2fea-4005-afea-3546ad5a14cd","school":{"__ref":"School:{\"uuid\":\"37895e74-86d3-4ec3-89a5-ea14b158433f\"}"},"startYear":"2007","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"7a9d9aa5-4c56-4a78-ae25-76ce607d80e7\"}":{"__typename":"MentorPublicProfile","uuid":"7a9d9aa5-4c56-4a78-ae25-76ce607d80e7","displayName":"Camille R.","slug":"camille-reeves","biography":"\u003cp\u003eCamille is a Columbus, Ohio native who has recently graduated with her Bachelors in Astrophysics from Princeton University. Camille was often on the go, between her position as Director of Events \u0026amp; Public Relations for TigerTrends, Princeton’s premier fashion and lifestyle magazine, and her position in the Office of the Dean of Undergraduate Students assisting student organizations with their budgets and purchases. Between these commitments and her studies, Camille is an active member of Princeton Women’s Club Volleyball and Princeton's SHARE Peers Program, as well as Black Student Union and Princeton Association of Black Women. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eShe previously worked with the Northern Kenyan Conservation Clubs (NKCC), which are partnered with both Princeton University and Mpala Research Centre located in Mpala, Kenya. NKCC serves to teach students grades 3 through 8 about conservation, ecology, and environmentalism through hands-on games, activities, and lessons. During her tenure at Mpala, she developed lesson plans centered around relevant environmental topics critical for Kenyan students to understand as they grow into the nation’s next generation of leaders.\u003c/p\u003e","teachingVideoPlaybackId":"1XPuwBN5djOUywJ81yPbyORuMZ02b00uqAWNQAGT9q1EE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement would have to be my undergraduate thesis titled \"From Wall-E to Walled In: An Exploration of the Accumulating Effects of Privatization on Space Debris in the Post-Soviet Era\", which explored how private companies have both revolutionized the causes \u0026amp; solutions to the growing amount of trash in Earth's orbit!\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Astrophysical Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ab6a8c7a-dcab-4290-bfb0-3897ec63844e\"}"},{"__ref":"DeepDives:{\"uuid\":\"69918638-9e92-4e06-b80c-8213133394df\"}"},{"__ref":"DeepDives:{\"uuid\":\"95c97b96-521e-40d7-b746-93ab56b206c7\"}"},{"__ref":"DeepDives:{\"uuid\":\"c668e592-38c4-4d8c-988f-75aa5c39fece\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c6b828ad-82a5-40d4-8246-f5405ac96b93/-/preview/-/format/jpg/","https://ucarecdn.com/122ca682-930c-4355-b34b-af8402868a79/-/preview/-/format/jpg/","https://ucarecdn.com/cf858813-22c7-4d66-a8d4-e0bc239573b3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5d6458c1-da78-4d35-9e20-e25c1766c59d\"}"},{"__ref":"Education:{\"uuid\":\"f1dfdfbc-2fea-4005-afea-3546ad5a
