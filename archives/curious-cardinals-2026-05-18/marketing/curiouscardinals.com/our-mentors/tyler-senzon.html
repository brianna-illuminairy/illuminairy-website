:{"__typename":"Favorites","uuid":"4fe54f7f-7de8-42d2-afc9-5c8a544830fb","photoUrl":"https://ucarecdn.com/5bb8d151-148a-4af5-bb84-5e8cfa949aff/","title":"Kris Bowers","type":"ARTIST"},"CausesSupported:{\"uuid\":\"a10f77f0-d17b-4f01-bbf6-e6bdbddc43bb\"}":{"__typename":"CausesSupported","uuid":"a10f77f0-d17b-4f01-bbf6-e6bdbddc43bb","name":"The Farmlink Project","description":"\u003cp\u003eFarmlink is an engine driving food to people who need it most!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/51a2c00c-3323-4213-b497-1705898de4ce/"},"CausesSupported:{\"uuid\":\"258d4898-6083-484c-a4ad-79d8489a5f38\"}":{"__typename":"CausesSupported","uuid":"258d4898-6083-484c-a4ad-79d8489a5f38","name":"Crossroads","description":"\u003cp\u003eCrossroads drives profits to a healthcare clinic and school in Jeida, NG.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/ec14776d-005e-4095-921e-63101c4c4c07/"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7a85ee37-dbcc-4ecf-87f2-e4fa636a5f9c\"}":{"__typename":"DeepDives","uuid":"7a85ee37-dbcc-4ecf-87f2-e4fa636a5f9c","content":"\u003cp\u003eOver the my high school summers I worked on some projects related to social impact! \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eStarting with a remote in my sophomore summer internship for an organization called NINAYO located in Tanzania, I helped farmers own their produce further up the supply chain by aggregating and utilizing larger markets for more exposure. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI then pivoted to the Farmlink project in my Junior year, working for their deals team by moving suprlus produce from farms to food banks–\u0026nbsp;saving millions of pounds! I stayed at the Farmlink project in my Senior summer, working on a project called Farmlink International to bring operations and impact to Canada in Mexico!\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAll the while, simultaneously working for an accelerator called Hult Prize on their curriculum team. We helped entrepreneurs from around the world kick of their businesses, with the theme of getting back to work after covid!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAll of these experiences helped lead me to the work that I do today, with a drive for creating impact those in need around the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d82d05f1-142c-4232-9b78-b5568b8072b5\"}":{"__typename":"DeepDives","uuid":"d82d05f1-142c-4232-9b78-b5568b8072b5","content":"\u003cp\u003eThe Dyson School Applied Economics and Management is housed within two colleges at Cornell, allowing me to have the flexibility to choose what I study within my Degree. Those colleges being SC Johnson College of Business and the College of Agriculture and Life Sciences (CALS). I'm empowered within the Dyson School to study not only multiple concentrations of business, specifically Entrepreneurship and Finance, while combining these studies with Computer and Information Science in CALS, allowing me to combine passions both within STEM and business.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0edfa561-4bef-4b24-8525-69a894a5f13c\"}":{"__typename":"DeepDives","uuid":"0edfa561-4bef-4b24-8525-69a894a5f13c","content":"\u003cp\u003eRight now, I'm learning the basics of investment banking, trying to improve my run mile time, and building out a startup on campus called Crossroads. All the while mentoring startups around the world through the Hult Prize Foundation 2023 Accelerator!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"6e08c71e-6a4b-488b-9a0b-007302fffcde\"}":{"__typename":"School","uuid":"6e08c71e-6a4b-488b-9a0b-007302fffcde","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14853"},"Education:{\"uuid\":\"76032e28-931f-45c4-b730-9967a08d4b13\"}":{"__typename":"Education","uuid":"76032e28-931f-45c4-b730-9967a08d4b13","school":{"__ref":"School:{\"uuid\":\"6e08c71e-6a4b-488b-9a0b-007302fffcde\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Applied Economics and Management","degree":"Bachelor of Science"},"School:{\"uuid\":\"ed9484cc-e0ea-4031-b588-0cd9775c7c63\"}":{"__typename":"School","uuid":"ed9484cc-e0ea-4031-b588-0cd9775c7c63","name":"Bergen Technical High School - Teterboro","city":"Teterboro","type":"HIGH","state":"NJ","country":"United States","zip":"07608"},"Education:{\"uuid\":\"e6118b77-17e5-4347-b517-00ee57424690\"}":{"__typename":"Education","uuid":"e6118b77-17e5-4347-b517-00ee57424690","school":{"__ref":"School:{\"uuid\":\"ed9484cc-e0ea-4031-b588-0cd9775c7c63\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"64393746-ebba-4f4e-b296-3fe879e32a76\"}":{"__typename":"MentorPublicProfile","uuid":"64393746-ebba-4f4e-b296-3fe879e32a76","displayName":"Tyler S.","slug":"tyler-senzon","biography":"\u003cp\u003eTyler is a student at Cornell studying Applied Economics and Management at the Dyson School, with concentrations in Finance and Business Analytics. \u003cbr\u003e\u003cbr\u003eIn 2022, he graduated from Bergen County Technical High School, where he majored in computer science, led its Science Olympiad, and Future Business Leaders of America Chapter. \u003cbr\u003e\u003cbr\u003eAdditionally, during Tyler’s Senior summer, he led the Farmlink Project’s International Team, working to bring food insecure communities additional sources of surplus produce by accommodating charitable food organizations with the equipment they needed to expand capacity. \u003cbr\u003e\u003cbr\u003eAfter being inspired by the social impact sector of business, Tyler has continued to get involved with organizations on campus. He’s become involved in Dyson Diversity Council and Dyson Diversity Scholars, planning events related to educating Cornell’s business community on diversity, inclusion, and equity. \u003cbr\u003e\u003cbr\u003eTyler is also a Project Manager for Social Enterprise Group, working with an organization called Crossroads on product management, in which he designs clothing products, and interacts with Nigerian entrepreneurs to support their livelihoods and expand to their businesses U.S. markets, while supporting their sister organization, Crossbonds, with a portion of their earnings. \u003cbr\u003e\u003cbr\u003eAs a mentor at Curious Cardinals, Tyler hopes to utilize his experiences in making the world a better place to spread impact, through interactive learning, and enable students to learn skills to do the same.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWithin his sessions, Tyler dives into his mentee's passions and tailors each lesson on a weekly basis.\u003c/p\u003e","teachingVideoPlaybackId":"bo9xy01sVVPWxqZ00rsltF02zV5GEgDeNNscNrtb00LDrWk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement doesn't lie in just one catalytic event, but in an amalgamation of contributions from my peers and mentors from my local school, to nationwide college students, to international coworkers.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI've had the opportunity to contribute to some of the world's biggest problems and can say that I've helped make the world a better place, by devoting energy to the places where my time can create the most impact. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI've helped change the food system by facilitating the donation of millions of pounds of surplus produce with The Farmlink Project, facilitate international deals with organizations based in Kenya and Tanzania, and develop a startup driving economic opportunities, as well as improving healthcare and education access in Nigeria. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI've utilized a similar framework of problem identification, market analysis, and human-centered design to bring real solutions to those who need them most, and am proud to serve as a mentor for my students to fulfill similar projects.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"43656a0b-4d5c-4f5a-94af-833ac1e1d896\"}"},{"__ref":"Favorites:{\"uuid\":\"d1be870a-6909-43b5-9b54-69aefafa5e06\"}"},{"__ref":"Favorites:{\"uuid\":\"4fe54f7f-7de8-42d2-afc9-5c8a544830fb\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"a10f77f0-d17b-4f01-bbf6-e6bdbddc43bb\"}"},{"__ref":"CausesSupported:{\"uuid\":\"258d4898-6083-484c-a4ad-79d8489a5f38\"}"}],"major":"Applied Economics and Management","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7a85ee37-dbcc-4ecf-87f2-e4fa636a5f9c\"}"},{"__ref":"DeepDives:{\"uuid\":\"d82d05f1-142c-4232-9b78-b5568b8072b5\"}"},{"__ref":"DeepDives:{\"uuid\":\"0edfa561-4bef-4b24-8525-69a894a5f13c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dacad62a-d382-45d7-9d86-8dd1a025b876/-/preview/-/format/jpg/","https://ucarecdn.com/0bfc718a-05f4-4182-9e9a-f224bbec462f/-/preview/-/format/jpg/","https://ucarecdn.com/48a52acc-49e9-4186-88a3-c65a2ae0adec/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"76032e28-931f-45c4-b730-9967a08d4b13\"}"},{"__ref":"Education:{\"uuid\":\"e6
