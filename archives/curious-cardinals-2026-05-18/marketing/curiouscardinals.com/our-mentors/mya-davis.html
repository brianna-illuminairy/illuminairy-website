ovine \u0026 Young Academy","degree":"B.S. in the Arts, Technology, and Business of Innovation"},"MentorPublicProfile:{\"uuid\":\"ee02cac5-75a7-42c8-8e31-4aae77e49374\"}":{"__typename":"MentorPublicProfile","uuid":"ee02cac5-75a7-42c8-8e31-4aae77e49374","displayName":"Mya D.","slug":"mya-davis","biography":"Mya Davis is a senior at the University of Southern California, studying design and entrepreneurship at the Iovine \u0026 Young Academy. Forever fascinated with drawing and crafting visual/sonic narratives, Mya is now studying and actively applying what it takes to be a leader in creative direction and brand strategy. Outside his major, Mya is involved in USC's Concerts Committee, a student-run club that organizes, markets, and raises funds for some of USC's largest concerts (amassing 10k guests). There he brings the wildest ideas to life in experience design, using projection mapping, installation builds, coded light shows, and personalized digital avatars to blow show attendees away. He also helped found two startups at USC - “Two Cents”, a collegiate PR team that helps rebrand nonprofits/socially conscious businesses around L.A. - and “Silent Planet” - an underground creative collective and editorial that gives a unique platform to local artists. This past summer, Mya interned in the Brand Studio department at Creative Artists Agency (where talent like Beyonce, Harry Styles, and Zendaya go to be beautifully represented). Before this he's been blessed to work with Nike, Adidas, Top Dawg Entertainment, and Monkeypaw Productions on a myriad of design strategy projects. In high school, Mya was highly involved in his student government and track \u0026 field team, graduating with a 4.36 GPA. Mya, however, firmly believes that his later opportunities came from his involvement in starting businesses, social projects, and campaigns in his hometown of Santa Clarita, CA. Aside from creating radiant narratives for his clients and professors, Mya passionately loves making music, animating cartoons, studying fashion, and going on spontaneous adventures with his friends. He is forever open to appreciating the obscure, embracing the bizarre, and consistently pursuing childlike wonder because that’s exactly how we push our culture forward. If you’re into imaginative problem solving and building worlds, or passionate about the powerful symbiosis between design and social impact, Mya shouts “let’s work together!”","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Iovine \u0026 Young Academy","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/e7d98db9-bdb4-4621-a0ee-f8e6f1ecd195/-/crop/870x871/14,0/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0730d1ae-40e7-431e-8910-ea5d69b195e4\"}"}],"hiredAt":"2022-10-17T23:44:15.000Z","topics":["Visual Arts / Graphic Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mya-davis\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ee02cac5-75a7-42c8-8e31-4aae77e49374\"}"}}},"_sentryTraceData":"90254f1ca01049159a00603119faf49f-a31550ab2f5eda5f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=90254f1ca01049159a00603119faf49f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"mya-davis"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getEl
