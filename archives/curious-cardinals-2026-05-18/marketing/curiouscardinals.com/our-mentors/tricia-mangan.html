arning both in and out of the classroom. She attended traditional High School in Buffalo NY while earning a spot on the US Ski Team. As she continued her pursuit of her World Cup and Olympic dreams, she didn’t take the conventional path of foregoing school, but instead, continued pursuing her studies at Dartmouth College while competing internationally. This feat was challenging, but it allowed her to grow tremendously, as she was forced to reflect and prioritize what was really important and focus on efficiency and hard work. Today she is excited about creating community, inspiring others to achieve more than they ever thought possible, and encouraging people to forge their own path towards their goals.\u003c/p\u003e","teachingVideoPlaybackId":"3QtitdtDXmRO1eJD3NGAkbyB01202l4qmwz6UzFkcWOPM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"25fca3a0-f24b-4f9c-8b17-24dab24e6ec8\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b9a31e7-5f8a-4f2c-8527-f286022931a4\"}"},{"__ref":"DeepDives:{\"uuid\":\"d623688b-9485-4807-b637-07d1b090c097\"}"},{"__ref":"DeepDives:{\"uuid\":\"cd978cb9-36b0-4ae4-a9d1-5231f57163fe\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/08af445e-a13d-45a8-80d3-3716b8da8873/-/crop/692x692/0,116/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"eed77c33-aa29-4eea-80e1-ab3755139eee\"}"},{"__ref":"Education:{\"uuid\":\"b657ec69-df73-45c7-9161-03f609e5b8c5\"}"}],"hiredAt":"2021-08-25T09:47:03.000Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Writing","German","Academic Coaching","College Essay Writing","Reading","History","Computer Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query",
