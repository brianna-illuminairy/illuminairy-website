../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"83c25559-9156-44e8-bb09-4f50b5e77df6\"}":{"__typename":"CausesSupported","uuid":"83c25559-9156-44e8-bb09-4f50b5e77df6","name":"NAMI","description":"","photoUrl":""},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f06b9467-ae42-4656-a36e-cdc1205e3107\"}":{"__typename":"DeepDives","uuid":"f06b9467-ae42-4656-a36e-cdc1205e3107","content":"\u003cp\u003eMentorship matters to me because it has the power to change the way someone sees themselves and their future. I’ve been mentoring for over six years, and what I’ve learned is that sometimes all a student needs is someone to listen, encourage, and remind them that their goals are possible. For me, it’s not just about giving advice — it’s about helping people build confidence, discover their strengths, and realize that they already have the tools to succeed. Being able to share my experiences, whether in academics, career paths, or languages, and see how it helps someone else grow is one of the most rewarding parts of my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b512f910-63c7-416c-b99b-c5dc2db76413\"}":{"__typename":"DeepDives","uuid":"b512f910-63c7-416c-b99b-c5dc2db76413","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to grow into a strong leader — someone who is always learning and evolving both professionally and personally — while uplifting others along the way. I want to help people find their own purpose, set goals that inspire them, and believe in their potential to achieve their dreams.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"417a6ff8-4abc-42ca-a4cd-1c20293850c7\"}":{"__typename":"DeepDives","uuid":"417a6ff8-4abc-42ca-a4cd-1c20293850c7","content":"\u003cp\u003eIf I could give advice to my middle school or high school self, I would say: don’t be afraid to explore and try different things, even if they feel outside of your comfort zone. The subjects you study, the languages you learn, the hobbies you pursue — they all add up to shape who you become, even if you don’t realize it at the time. I would also remind myself that it’s okay not to have everything figured out right away. Growth comes step by step, and the most important thing is to stay curious, work hard, and trust that you’ll find your path. Finally, I’d tell myself to be confident in my voice and perspective. Coming from an international background taught me that differences are strengths — and embracing them early on would have saved me a lot of self-doubt.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"cee14120-4c46-4323-80b4-62d1bd6115d3\"}":{"__typename":"School","uuid":"cee14120-4c46-4323-80b4-62d1bd6115d3","name":"New York University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10003"},"Education:{\"uuid\":\"b7f7ae7f-f5ee-457b-83be-ede381b6aeb2\"}":{"__typename":"Education","uuid":"b7f7ae7f-f5ee-457b-83be-ede381b6aeb2","school":{"__ref":"School:{\"uuid\":\"cee14120-4c46-4323-80b4-62d1bd6115d3\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Business \u0026 Technology Management ","degree":null},"School:{\"uuid\":\"7c2b3c1f-5751-4100-a8c5-cefa2afac474\"}":{"__typename":"School","uuid":"7c2b3c1f-5751-4100-a8c5-cefa2afac474","name":"American School of Madrid","city":"Pozuelo de Alarcón","type":"HIGH","state":"Comunidad de Madrid","country":"Spain","zip":"28224"},"Education:{\"uuid\":\"351db6dc-8bc1-4fc3-9cbe-4829375c4392\"}":{"__typename":"Education","uuid":"351db6dc-8bc1-4fc3-9cbe-4829375c4392","school":{"__ref":"School:{\"uuid\":\"7c2b3c1f-5751-4100-a8c5-cefa2afac474\"}"},"startYear":"2003","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"4d072fcd-06e8-4246-848b-436e3548f0f2\"}":{"__typename":"MentorPublicProfile","uuid":"4d072fcd-06e8-4246-848b-436e3548f0f2","displayName":"Lucia M.","slug":"lucia-moreau","biography":"Lucia is a senior studying Business and Technology Management with a concentration in Finance at NYU’s Tandon School of Engineering. She’s passionate about new technology trends, the cosmetics industry, marketing, and learning new languages. She will begin working full-time at L’Oréal USA following her graduation. She has interned at two startups in the creative entrepreneurship industry and the health and wellness industry in the past: Third EYE Edge and Wholier. Lucia is a people person; she loves helping other people learn, she’s very patient, adapts to student’s learning pace, has tutored high school students, and has helped all younger family members learn. Before attending NYU, she went to the American School of Madrid high school where she graduated with an International Baccalaureate Diploma which includes 6 subjects: English Literature, Mandarin, Math, Biology, Business Management, and Environmental Sciences. Her highest score was in Mandarin (on a grade scale from 1-7, she scored a 7 on her final exam). She’s studied Mandarin for over 6 years, and her native languages are English and Spanish. She’s extremely invested in education. She’s there for her students every step of the way and is dedicated to helping everybody reach their goals!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement so far has been moving from Madrid to New York at 18 and building a life and career in a new country. Starting fresh in a completely different environment taught me resilience, adaptability, and independence. I’m proud to now work at Maybelline, the biggest makeup brand in the world, where I’ve grown professionally while pursuing my passion for creativity and strategy. Just as meaningful has been the six years I’ve dedicated to mentoring students — helping others gain confidence, set goals, and realize their potential has been one of the most rewarding parts of my journey.\u003c/p\u003e","favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"83c25559-9156-44e8-bb09-4f50b5e77df6\"}"}],"major":"Business \u0026 Technology Management ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f06b9467-ae42-4656-a36e-cdc1205e3107\"}"},{"__ref":"DeepDives:{\"uuid\":\"b512f910-63c7-416c-b99b-c5dc2db76413\"}"},{"__ref":"DeepDives:{\"uuid\":\"417a6ff8-4abc-42ca-a4cd-1c20293850c7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/30d5cdf7-5b8d-4629-a6f9-acd95d0e2c1c/-/preview/-/format/jpg/","https://ucarecdn.com/751f1df8-485e-4797-83f7-995170b4bd04/-/preview/-/format/jpg/","https://ucarecdn.com/a78e7a4f-50a6-4619-9d2a-80f183c6e464/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b7f7ae7f-f5ee-457b-83be-ede381b6aeb2\"}"},{"__ref":"Education:{\"uuid\":\"351db6dc-8bc1-4fc3-9cbe-4829375c4392\"}"}],"hiredAt":"2021-11-02T18:05:45.000Z","topics":["Literature","Cooking","Sustainability","STEM Project","Spanish","Web Design","Mandarin Chinese","Business / Entrepreneurship","Fashion / Cosmetics","Music","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/9fa2d8bf-132f-4356-a39d-e6f0aecb3e5b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lucia-moreau\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4d072fcd-06e8-4246-848b-436e3548f0f2\"}"}}},"_sentryTraceData":"044cfc7bd921474ea2703424332e9628-92e87fcff44870df-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=044cfc7bd921474ea2703424332e9628,
