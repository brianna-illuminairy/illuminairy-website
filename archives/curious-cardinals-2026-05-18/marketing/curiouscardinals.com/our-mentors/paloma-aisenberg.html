typename":"Favorites","uuid":"c794ec14-e96b-4232-b603-f9196a801675","photoUrl":"https://ucarecdn.com/89b21440-a9b1-4ded-9e03-b2eaa8f26424/","title":"Punta del Este","type":"CITY"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2cf207c7-f113-4caa-b1d7-9182036fced0\"}":{"__typename":"DeepDives","uuid":"2cf207c7-f113-4caa-b1d7-9182036fced0","content":"\u003cp\u003eMy dream job is to be on Broadway, and also act in TV/film as well as produce and direct projects of my own!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0e839125-c9dd-4ea2-8195-fce3165eed9f\"}":{"__typename":"DeepDives","uuid":"0e839125-c9dd-4ea2-8195-fce3165eed9f","content":"\u003cp\u003eI spent my summers in high school attending French Woods Festival of the Performing Arts, a musical theater summer camp in upstate New York!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b56aedbc-65d5-4d42-be73-208abff78a83\"}":{"__typename":"DeepDives","uuid":"b56aedbc-65d5-4d42-be73-208abff78a83","content":"\u003cp\u003eMentorship matters to me because I genuinely find joy in teaching my students and assisting them in discovering their own passions. Witnessing the growth and development of these individuals is incredibly fulfilling. By providing guidance and support, I have the opportunity to share my knowledge and experiences, helping them navigate their personal journeys. Seeing their confidence flourish and witnessing the positive impact mentorship has on their lives is truly rewarding. It is a privilege to play a role in shaping their futures and empowering them to pursue their dreams.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"529ead86-cd06-488c-a726-a17bc0eecf61\"}":{"__typename":"DeepDives","uuid":"529ead86-cd06-488c-a726-a17bc0eecf61","content":"\u003cp\u003eI'm a native Spanish speaker!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b55f0fe5-d72f-41a4-ba9c-37bb755bbaf4\"}":{"__typename":"Education","uuid":"b55f0fe5-d72f-41a4-ba9c-37bb755bbaf4","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Theatre and Performance Stud","degree":null},"School:{\"uuid\":\"6e531bba-aaf3-4e8e-8bbd-c95f8aa6cf38\"}":{"__typename":"School","uuid":"6e531bba-aaf3-4e8e-8bbd-c95f8aa6cf38","name":"Coral Reef High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33157"},"Education:{\"uuid\":\"4bb2eb45-264b-4937-a90d-eaf9c6ccb79b\"}":{"__typename":"Education","uuid":"4bb2eb45-264b-4937-a90d-eaf9c6ccb79b","school":{"__ref":"School:{\"uuid\":\"6e531bba-aaf3-4e8e-8bbd-c95f8aa6cf38\"}"},"startYear":"2015","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"Testimonial:79a90dba-0150-4436-87f2-a14d8100498b":{"__typename":"Testimonial","id":"79a90dba-0150-4436-87f2-a14d8100498b","text":"Paloma has really helped our daughter grow and build resiliency in her pursuit of musical theater and acting!","date":"2025-05-30 01:05:58.001+00","rating":5,"endorser":{"__typename":"Endorser","name":"Erin Kenway","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"c2ccbd96-5c5d-4fa1-aa3c-e6c65218a2f9\"}":{"__typename":"MentorPublicProfile","uuid":"c2ccbd96-5c5d-4fa1-aa3c-e6c65218a2f9","displayName":"Paloma A.","slug":"paloma-aisenberg","biography":"\u003cp\u003ePaloma Aisenberg is double-majoring in Theatre \u0026amp; Performance Studies and Film \u0026amp; Media Studies at Stanford additionally taking courses in History, International Relations, Psychology and Economics. She is passionate about exploring the space where art and social practice collide. Musical theater is her first love. She has performed (with many leading roles) in over 20 musicals. She is currently working on the new Nancy Drew musical in development with music by Alan Menken and directed by Tony Award-winning James Lapine. She recently performed in VIVA LA VIDA, a preview of songs from the upcoming Broadway musical FRIDA, THE MUSICAL at Lincoln Center. She placed in the Top 15 of BroadwayWorld’s Next on Stage Competition. Through Stanford Theater Lab, she starred in Marie Antoinette and HAL (a multi-media modern adaptation of Shakespeare’s Henry IV Parts 1 and 2). This summer, Paloma will be interning at Amazon Studios working on Latin American Content Development. Paloma has interned at Mike Medavoy’s Phoenix Pictures, Salmira Productions, Jay Roach’s Delirious Media, and Brian Oliver’s New Republic Pictures. Paloma worked for executive producer Jeffrey Silver at Walt Disney Studios on the pre-development of The Little Mermaid. She also worked for the L.A. Dance Project where she supported the partnership with The Gabriella Foundation offering quality dance programming to students from economically under-resourced communities. Paloma created Love is The Answer, an artistic musical endeavor, with all proceeds providing scholarships through the Hancock French Woods Arts Alliance for students to study the arts. She produced it as a medium for manifesting acceptance and unity. In high school, Paloma was awarded the Miami Herald Silver Knight Award in the Music and Dance category, Princeton University Service Award and the Hispanic Heritage Foundation - Gold Award for Media and Entertainment, as well as Best of Show and Critic’s Choice at Florida State Thespian Festival Competition. As artists and storytellers, Paloma believes we have a platform to talk about important social issues and is excited to do so with Curious Cardinals.\u003c/p\u003e","teachingVideoPlaybackId":"RB7ZJcckso2gwaOxBU02sxDJn017t00CkJyhz5xs7dvNEg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI created Love is The Answer, an artistic musical endeavor, with all proceeds providing scholarships through the Hancock French Woods Arts Alliance for students to study the arts.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"28d0fd47-4817-49bb-bb5f-3939924efbfe\"}"},{"__ref":"Favorites:{\"uuid\":\"4e6daba1-b8f4-48ed-836a-7d294fa2d51c\"}"},{"__ref":"Favorites:{\"uuid\":\"c794ec14-e96b-4232-b603-f9196a801675\"}"}],"causesSupported":[],"major":"Theatre and Performance Stud","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2cf207c7-f113-4caa-b1d7-9182036fced0\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e839125-c9dd-4ea2-8195-fce3165eed9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"b56aedbc-65d5-4d42-be73-208abff78a83\"}"},{"__ref":"DeepDives:{\"uuid\":\"529ead86-cd06-488c-a726-a17bc0eecf61\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7c02566e-81aa-423a-9a0a-68b8fe46c462/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Ed
