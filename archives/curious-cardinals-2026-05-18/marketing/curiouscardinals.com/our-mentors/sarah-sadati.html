../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ab728532-456e-4227-9a93-bd861e414e8f\"}":{"__typename":"DeepDives","uuid":"ab728532-456e-4227-9a93-bd861e414e8f","content":"\u003cp\u003eI majored in Global Affairs and in French. I knew even before matriculating to Yale that I wanted to major in GA because it was one of the newer majors that combined content from multiple departments: History, Economics, Political Science, Statistics, Language Studies, and Anthropology. I enjoyed studying across disciplines while not needing to narrow down my interests. I found that, because of this particular departmental structure, I could appreciate the breadth of international relations from a collaborative standpoint.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI have been interested in French (a true Francophile) since 5th grade, and always thought I would minor in it  during college. So, it ended up being a nice surprise that I had enough room between my Yale-required courses and GA required courses to major in French. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI am so happy that I was able to double-major in college—I was able to form connections to professors and faculty in both departments. Additionally, because of my double major, I was able to complete an independent study through the French department on Fashion Shows that was taught by a Global Affairs professor, and I even put on my own fashion show at the end of the course!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e684bbf0-9de4-4cd5-a485-2dfa66708bd9\"}":{"__typename":"DeepDives","uuid":"e684bbf0-9de4-4cd5-a485-2dfa66708bd9","content":"\u003cp\u003eI was extremely shy in middle school and only began coming out of my shell my junior year of high school. I was constantly afraid of judgement and, thus, never put myself out there. Once I learned there was nothing to fear or at least that judgement isn't that bad if you are proud enough of yourself, I began to embrace the opportunities around me and began to explore my interests a lot more. So, my advice for my middle or high school self would be to keep my head high, and I would encourage myself to step outside my comfort zone sooner rather than later.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e7cc9569-d503-474a-8ed5-004e6d4b12f3\"}":{"__typename":"DeepDives","uuid":"e7cc9569-d503-474a-8ed5-004e6d4b12f3","content":"\u003cp\u003eI have always been interested in fashion, but not many people took my interest very seriously, so I only began to pursue it during college. I joined a fashion organization on campus and even became Editor-in-Chief of the fashion magazine that the organization published yearly. Finally, during my senior year, I was introduced to this wonderful professor who was a true leader in fashion education. I completed my Global Affairs Capstone with her, \"Female Athletes: Fashion and Equity\" during the fall semester of my senior year, and I asked her if she would be willing to complete and independent study with me during the spring through the French department. She agreed, and, together, we created our own syllabus with one goal in mind—to put on a fashion show at the end of the spring semester. She taught me so much and recommended the greatest texts to provide me with a solid foundation on fashion shows. We worked very hard and ultimately were able to put on a fashion show on French style! \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI am proud that the culmination of my Yale studies led to my own fashion show production, and appreciate that I was granted the opportunity to do so.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"36605e89-961a-4d75-9d13-52700176718f\"}":{"__typename":"DeepDives","uuid":"36605e89-961a-4d75-9d13-52700176718f","content":"\u003cp\u003eMy parents are both immigrants (Panama and Iran), and their language and culture has been a huge part of my upbringing. While both of them speak English (with slight accents), they both have lamented the fact that they never took English language learning seriously. Thus, my parents have instilled in my sister and I the importance of appreciating and learning different languages. So, when I discovered French in 5th grade and quickly fell in love with the language and culture, my parents heavily supported my relentless pursuit towards fluency. My high school summers were a great time to commit myself to immersion and learn the language like a true native. So, every summer my mother, sister, and I traveled to France for a four-week immersion program to better our French. These summers culminated in the opportunity to study \"French Civilizations\" at La Sorbonne the summer before my senior year of high school. I am so grateful that I had this opportunity because I believe it is the main reason why I am fluent today—grammar and vocabulary taught in my middle and high school only complemented the greater speaking skills that I improved upon each summer in France.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"a37f34ca-7e2f-4641-9e1c-53a539098708\"}":{"__typename":"School","uuid":"a37f34ca-7e2f-4641-9e1c-53a539098708","name":"Oxbridge Academy","city":"West Palm Beach","type":"HIGH","state":"Florida","country":"United States","zip":"33409"},"Education:{\"uuid\":\"debc349d-83dc-4a55-afc6-571c890c09d0\"}":{"__typename":"Education","uuid":"debc349d-83dc-4a55-afc6-571c890c09d0","school":{"__ref":"School:{\"uuid\":\"a37f34ca-7e2f-4641-9e1c-53a539098708\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"4e4cfdd8-a0cc-464d-961d-d5bca0cd6ae7\"}":{"__typename":"Education","uuid":"4e4cfdd8-a0cc-464d-961d-d5bca0cd6ae7","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"French and Global Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"fdfd1888-7b26-42ac-99a9-d65efad94a66\"}":{"__typename":"MentorPublicProfile","uuid":"fdfd1888-7b26-42ac-99a9-d65efad94a66","displayName":"Sarah S.","slug":"sarah-sadati","biography":"Sarah earned her Bachelor of Arts degree in French and Global Affairs from Yale University in May 2023 and is excited to embark on her journey at the University of Chicago as a J.D. candidate this coming fall.\n\nHer academic journey began at Oxbridge Academy in West Palm Beach, Florida, where she completed her high school education in 2019. Over her high school years, Sarah passionately pursued language studies and even studied at La Sorbonne in Paris during the summer leading up to her senior year. This was an extension of her linguistic adventure that included summer language programs in Madrid, Nice, and Sancerre.\n\nBack in Florida, Sarah enriched her language skills by serving as a Teacher Assistant at Le Petit Prince, the French International School of Boca Raton, and the Owlets French Camp at Florida Atlantic University. Further, she demonstrated leadership by founding a chapter of the French National Honor Society at her high school, serving as President, and later reviving the Spanish National Honor Society. Her linguistic prowess earned her a nomination for the Palm Beach County Foreign Language Pathfinder Award at the end of her senior year.\n\nOutside her linguistic pursuits, Sarah broadened her intellectual horizon by participating in the \"The Crown and the Crisis\" program at Cambridge University. Here, she researched and authored an English paper on Charles Dickens' \"Great Expectations,\" under the tutelage of Cambridge professors. Moreover, she shined in the arena of public speaking as a nationally-ranked public forum debater.\n\nWhile at Yale, Sarah harnessed her passions by serving as the Editor-in-Chief of Y Fashion House and Vice President of The Women’s Network. She also contributed as an Editor for the Amuse-Bouche yearly magazine and was actively involved in cultural organizations like Central Americans for Empowerment and Persian Students at Yale.\n\nSarah's dual theses at Yale epitomize her intellectual vigor. She studied fashion and equity in the sports industry for her Global Affairs Capstone and translated a portion of a French-Armenian fashion journalist’s memoir, \"La Vocation,\" for her French translation thesis. Both these endeavors earned her nominations for distinction in her respective majors.\n\nCurrently, Sarah is interested in exploring diverse law fields like international law, transactional law, art law, and immigration law. However, her passions extend beyond academics. She is profoundly captivated by fashion, international relations, and languages. Being of Panamanian and Iranian descent, Sarah is fluent in Spanish and French, and is presently learning Persian.\n\nThis summer, she will be participating in a fashion sustainability program at the Institut Français de la Mode (IFM Paris), facilitated by Andrée-Anne Lemieux, the head of the IFM-Kering Sustainability Chair.\n\nWhen she steps away from her studies, Sarah loves spending quality time with her loved ones, playing volleyball, watching movies, hitting the beach, and testing her culinary skills. Sarah's wide range of interests and her unwavering determination form the bedrock of her future legal studies and professional aspirations.","teachingVideoPlaybackId":"V5nvN6e14kcoFztEp7ymIUBigGNGTSZYF4eJtt3I2dI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"French and Global Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ab728532-456e-4227-9a93-bd861e414e8f\"}"},{"__ref":"DeepDives:{\"uuid\":\"e684bbf0-9de4-4cd5-a485-2dfa66708bd9\"}"},{"__ref":"DeepDives:{\"uuid\":\"e7cc9569-d503-474a-8ed5-004e6d4b12f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"36605e89-961a-4d75-9d13-52700176718f\"}"}],"active":true,"profilePhotos":["https://api.dicebear.com/7.x/initials/svg?seed=SS","https://ucarecdn.com/789c4a31-fc3c-47ff-9400-65fc00c7dbac/-/crop/838x838/0,25/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"debc349d-83dc-4a55-afc6-571c890c09d0\"}"},{"__ref":"Education:{\"uuid\":\"4e4cfdd8-a0cc-464d-961d-d5bca0cd6ae7\"}"}],"hiredAt":"2023-05-30T21:00:50.906Z","topics":["Fashion / Cosmetics","Creative Writing","Film / Theater","History Project"],"communityBadges":["https://ucarecdn.com/fe18a7d8-d65b-4523-ab43-2a809d9f45e6/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sarah-sadati\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fdfd1888-7b26-42ac-99a9-d65efad94a66\"}"}}},"_sentryTraceData":"d2d08805833e46adb226083fbb201d8e-a90fa2257517545f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d2d08805833e46adb226083fbb201d8e,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","qu
