../../app.curiouscardinals.com/_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../../app.curiouscardinals.com/_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3d53d1b3-6432-4da0-89c5-4026144f9340\"}":{"__typename":"DeepDives","uuid":"3d53d1b3-6432-4da0-89c5-4026144f9340","content":"\u003cp\u003eIf I could give my younger self one super awesome piece of advice, it would be this: \u003cu\u003edon't worry too much about what others think of you. Instead, focus on being the best version of yourself every day—physically, mentally, and spiritually.\u003c/u\u003e Why? Because that's the secret sauce to achieving the goals that you're super passionate about!\u003c/p\u003e\u003cp\u003eIt's totally normal to want to fit in and be accepted by your friends. But here's the thing: \u003cstrong\u003ethe most important opinion is the one you have of yourself.\u003c/strong\u003e Embrace your uniqueness, quirks, and all the things that make you, \u003cem\u003eYOU\u003c/em\u003e. Be confident in your own skin and believe in your own abilities. You have incredible potential!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eLet's start with taking care of your body. Get moving and have fun! Play sports, dance around, or find an activity that gets your heart pumping. Feed your body with healthy food and make sure you get enough sleep to recharge your superpowers. When you have a strong and energized body, it will support you in reaching your dreams and doing all the amazing things you want to do!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eNow, let's talk about your superpower—your mind! Train your brain to be positive, strong, and focused. Embrace challenges as opportunities to learn and grow. Believe in yourself, even when things get tough. Surround yourself with friends who support and encourage you. Feed your brain with knowledge, curiosity, and a love for discovering new things.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOh, and don't forget about your spirit! Connect with your inner self and discover what makes your heart happy. Find activities that bring you joy and make time for them. It could be volunteering, being creative, or simply taking a moment to relax and reflect. Follow your passions and let your spirit soar high!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eEvery single day, make a promise to yourself to become a better version of YOU.\u003c/strong\u003e Set goals that light up your soul and work hard to achieve them. Remember, progress is important, so celebrate each step forward, no matter how small. And guess what? You don't have to do this alone! Surround yourself with positive people who believe in you and inspire you to reach for the stars.\u003c/p\u003e\u003cp\u003eKeep working hard, stay true to yourself, and believe in your dreams. \u003cstrong\u003eDream big and make it happen!\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d046c112-0168-473c-b71e-5d3aedeaebf2\"}":{"__typename":"DeepDives","uuid":"d046c112-0168-473c-b71e-5d3aedeaebf2","content":"\u003cp\u003eIn my free time, I get to do some really cool stuff that not only makes me happy but also helps me learn and grow. Let me tell you about some of my favorite hobbies and the awesome skills they help me develop!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eFirst up, weightlifting! When I hit the gym and lift weights, I not only get stronger physically, but I also learn about discipline, perseverance, and setting goals. It teaches me the importance of hard work and pushing myself to new limits. These skills come in handy in all areas of life, whether it's tackling a tough math problem or reaching for my dreams.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eNow, let's talk about reading fiction novels. When I dive into those captivating stories, I sharpen my imagination, expand my vocabulary, and improve my reading comprehension. It's like going on incredible adventures without leaving my room! Reading helps me become a better communicator and allows me to think creatively, which are essential skills in any subject or career.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMusic is another big part of my life. When I sing or play instruments like the ukulele and guitar, I develop my musical skills, improve my coordination, and boost my self-expression. Music also teaches me patience and the value of practice. It's a fantastic way to boost my confidence and showcase my unique talents. Plus, it's just plain fun!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAnd guess what? I'm a big anime fan too! Shows like One Piece, HunterxHunter, and Attack on Titan are some of my favorites.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"bbb80b62-5dbf-47c1-aab2-c07781159854\"}":{"__typename":"DeepDives","uuid":"bbb80b62-5dbf-47c1-aab2-c07781159854","content":"\u003cp\u003eMy biggest motivation comes from seeing others do amazing things and achieve their dreams. It makes me feel inspired and pushes me to work hard too. When I see someone else succeed, it reminds me that I can do it too!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAnother thing that keeps me motivated is thinking about my parents. They have worked really hard to give me good opportunities in life. I feel thankful for everything they've done, and it makes me want to make the most of those chances. It's like a special power that drives me to do my best.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI also love learning new things. It's like going on an exciting adventure every day! There's always something interesting to discover and skills to develop. Learning helps me grow as a person and understand the world better.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eSo, seeing others succeed, appreciating what my parents have done for me, and my love for learning all motivate me to work hard and achieve my goals. I want to make a positive impact, help others, and keep growing along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"1d21d59e-171e-4910-a1b7-785da8efa51f\"}":{"__typename":"DeepDives","uuid":"1d21d59e-171e-4910-a1b7-785da8efa51f","content":"\u003cp\u003eMentorship is an incredibly valuable and impactful choice when it comes to supporting a student's growth and development. As a mentor, I have the opportunity to make a positive and lasting difference in a mentee's life, and here's why mentorship is so important to me:\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eFirst and foremost, mentorship allows for personalized guidance and support. Each student is unique, with their own strengths, interests, and challenges. As a mentor, I can take the time to understand individual needs, learning style, and goals. This personalized approach ensures that I can help someone thrive academically and personally.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMoreover, mentorship goes beyond just academics. It encompasses holistic development, including character building, confidence, and life skills. I believe in nurturing not only intellectual growth but also emotional intelligence, resilience, and effective communication. I want my students to be confident in themselves!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAnother crucial aspect of mentorship is providing guidance and inspiration. As a mentor, I aim to be a positive role model, sharing my own experiences and knowledge to motivate and empower my mentees. I want to instill in them a sense of curiosity, a love for learning, and the belief that they can achieve their goals.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eFurthermore, mentorship is a collaborative journey. It involves not just teaching, but also listening, understanding, and building trust. I strive to create a safe and open environment where my mentee feels comfortable expressing their concerns, asking questions, and seeking guidance. It's important to feel supported!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eUltimately, mentorship, to me, is about making a meaningful impact. It's about being there to support, encourage, and guide them as they navigate challenges, overcome obstacles, and achieve their goals. I am passionate about mentorship because I believe in the potential and growth of every student.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"a5cce5d9-56f9-48ad-a1eb-4fbf890001bd\"}":{"__typename":"School","uuid":"a5cce5d9-56f9-48ad-a1eb-4fbf890001bd","name":"Mount Olive High School","city":"Mount Olive","type":"HIGH","state":"New Jersey","country":"United States","zip":"07836"},"Education:{\"uuid\":\"7f4831ed-8713-4ad2-90de-9bdc94c224eb\"}":{"__typename":"Education","uuid":"7f4831ed-8713-4ad2-90de-9bdc94c224eb","school":{"__ref":"School:{\"uuid\":\"a5cce5d9-56f9-48ad-a1eb-4fbf890001bd\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"c82c272a-a585-4427-a475-a6c0aa904b90\"}":{"__typename":"Education","uuid":"c82c272a-a585-4427-a475-a6c0aa904b90","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"fb80f9af-4084-4ab6-a7e2-5e9287b058bc\"}":{"__typename":"MentorPublicProfile","uuid":"fb80f9af-4084-4ab6-a7e2-5e9287b058bc","displayName":"Maya S.","slug":"maya-shah","biography":"\u003cp\u003eMeet Mentor Maya, your dynamic and versatile tutor! With a diverse range of experiences and a genuine passion for teaching, I'm here to make math K-12 an engaging and enjoyable subject for you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've been tutoring students since 2015, and it brings me immense joy to guide and inspire young minds. But my support extends beyond math—I'm also thrilled to assist with college applications and SAT tutoring. Drawing from my own experiences at Yale, I can help you navigate the college application process, craft compelling personal statements, and present your achievements in the best possible light. When it comes to SAT preparation, I have proven strategies and resources to help you excel in each section of the exam.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI currently work at Dispel, a cybersecurity company that provides remote access to industrial control systems. It was a learning curve after graduating with a BA in psychology, but it is something I now love!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs the valedictorian in a class of 375 students, I excelled academically throughout high school. Continuing my educational journey, I obtained a BA in psychology with distinction from Yale University. However, my true passion lies in teaching math to students of all ages.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not immersed in the world of numbers, I pursue my other passions. Weightlifting is a major part of my life, providing me with strength and focus. Additionally, I find joy in expressing myself through music. Whether it's singing, playing the ukulele, or strumming the guitar, I love the creative outlet music provides.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I wasn't just a bookworm—I also actively participated in Track and Field and tennis. These experiences taught me invaluable lessons about discipline, teamwork, and dedication. As the captain of the high school robotics team, I honed my skills in business, design, strategy, and programming.\u003c/p\u003e\u003cp\u003eAnimals, especially dogs, hold a special place in my heart. My loyal French Bulldog named Jaxon brings immense joy to my life. If you share my love for our furry friends, we'll have plenty to bond over!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my academic achievements, I've made notable contributions to the scientific community. I'm proud to have my name published in an official scientific journal. Currently, I work as an analyst at a cybersecurity firm in Brooklyn, where I play a crucial role in safeguarding the digital world from cyber threats. Furthermore, I've had the privilege of serving as an assistant project manager for the PSEGISS program, a sustainability initiative that aims to create a better future.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLet's embark on this exciting learning journey together! With my enthusiasm, expertise, and a touch of fun, we'll conquer the world of math, navigate the college admissions process, and unlock your true potential.\u003c/p\u003e","teachingVideoPlaybackId":"xqdWapVNUeQf2vK3WcZ4ohxPufp8HXc1v41ZpZiKg008","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3d53d1b3-6432-4da0-89c5-4026144f9340\"}"},{"__ref":"DeepDives:{\"uuid\":\"d046c112-0168-473c-b71e-5d3aedeaebf2\"}"},{"__ref":"DeepDives:{\"uuid\":\"bbb80b62-5dbf-47c1-aab2-c07781159854\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d21d59e-171e-4910-a1b7-785da8efa51f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4f16c6f5-1eb4-46cd-91af-0d1feb73abe2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7f4831ed-8713-4ad2-90de-9bdc94c224eb\"}"},{"__ref":"Education:{\"uuid\":\"c82c272a-a585-4427-a475-a6c0aa904b90\"}"}],"hiredAt":"2021-05-01T23:37:22.815Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Writing","Academic Coaching","College Essay Writing"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maya-shah\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fb80f9af-4084-4ab6-a7e2-5e9287b058bc\"}"}}},"_sentryTraceData":"d60759bae71f4d7b92a8177fc6f97784-8a33fc4ed9e60315-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d60759bae71f4d7b92a8177fc6f97784,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"maya-shah"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
