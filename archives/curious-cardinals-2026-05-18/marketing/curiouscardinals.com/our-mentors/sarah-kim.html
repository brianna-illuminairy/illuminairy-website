_typename":"Favorites","uuid":"807d52b0-0717-4315-8f90-600842a2dee3","photoUrl":"https://ucarecdn.com/35c0e844-063b-4203-bd30-154de5766252/","title":"Clash Royale","type":"GAME"},"CausesSupported:{\"uuid\":\"76e4cbcf-712a-4910-850c-0f2d8a9b0fab\"}":{"__typename":"CausesSupported","uuid":"76e4cbcf-712a-4910-850c-0f2d8a9b0fab","name":"First-Gen Low Income Student Support","description":"\u003cp\u003e\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0ba86ee5-91a1-4fb3-a212-75ae29ca44e9\"}":{"__typename":"DeepDives","uuid":"0ba86ee5-91a1-4fb3-a212-75ae29ca44e9","content":"\u003cp\u003eMentorship is a vulnerable and transparent relationship.  We choose to be mentors because we have a genuine passion to transfer knowledge to support and better those around us.  I feel this moreso as I engage with my mentees, but truly there is a no more wholesome and honest exchange between individuals than in mentorship.\u003cbr\u003e\u003cbr\u003eI personally have experienced how impactful the right mentor can be as some of mine directly contributed to the path that I walk right now.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"3e34a316-6063-48a6-85e5-6181d3825b07\"}":{"__typename":"DeepDives","uuid":"3e34a316-6063-48a6-85e5-6181d3825b07","content":"\u003cp\u003eImmigrant children have a pool of shared experiences; I feel that those who came here with nothing couldn't help but be resourceful.\u003cbr\u003e\u003cbr\u003eI'm grateful for my parents who have provided me the opportunity of experiencing hardship and challenge, and from such circumstances, I'm very proud of my grit.  \u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"35ce8d4b-ab10-4bae-8fe7-3f7a668c08d7\"}":{"__typename":"DeepDives","uuid":"35ce8d4b-ab10-4bae-8fe7-3f7a668c08d7","content":"\u003cp\u003eI'm currently in the process of creating my own start-up.  There is something incredibly rewarding and anxiety-inducing about having complete ownership of the direction of your life.  I often feel a sense of uncertainty as I additionally hope that such endeavors will not only support myself, but my family as well.\u003cbr\u003e\u003cbr\u003eThough in development, I recognize that almost everything I do and learn is for the sake of ensuring my success as a business owner in the future.  As such, no information or lesson is too small to ignore.   I hope that other mentees within Curious Cardinals will be able to walk down a similar path and learn with (in addition to \u003cem\u003efrom\u003c/em\u003e) me. :)\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b7feeddf-13e6-4f23-b317-c05833711987\"}":{"__typename":"DeepDives","uuid":"b7feeddf-13e6-4f23-b317-c05833711987","content":"\u003cp\u003eI had engaged in a few activities ranging from volunteering to interning during my summers in high school.  I feel that students often underestimate what they are able to provide for the community.\u003cbr\u003e\u003cbr\u003eA simple ask and a show of passion is all it takes to land a life changing opportunity.  I had volunteered for my Youth City Council, and continued to show my passion for Youth government and business.  As such, I was able to land an internship working with the president of the Chamber of Commerce in my city.  Tangentially, I would continue to volunteer and eventually became an ambassador at the Red Cross as well.\u003cbr\u003e\u003cbr\u003eI thank my parents for their support during this time as I was too young to drive...\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"97224e2a-8437-4e41-b2e5-be10824bb2b5\"}":{"__typename":"Education","uuid":"97224e2a-8437-4e41-b2e5-be10824bb2b5","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Finance, Management ","degree":"Bachelors"},"School:{\"uuid\":\"cbc9a302-3f82-4fb9-955c-a5a6d494dcbc\"}":{"__typename":"School","uuid":"cbc9a302-3f82-4fb9-955c-a5a6d494dcbc","name":"Skyline High School","city":"Salt Lake City","type":"HIGH","state":"Utah","country":"United States","zip":"84109"},"Education:{\"uuid\":\"d54c5768-7100-49c6-af35-6e833230e25b\"}":{"__typename":"Education","uuid":"d54c5768-7100-49c6-af35-6e833230e25b","school":{"__ref":"School:{\"uuid\":\"cbc9a302-3f82-4fb9-955c-a5a6d494dcbc\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"f080d4d2-3cf7-4f50-a6e5-e6fd09686349\"}":{"__typename":"MentorPublicProfile","uuid"
