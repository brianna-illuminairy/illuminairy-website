MentorPublicProfile:{\"uuid\":\"c9edd313-6e37-4c84-ae6b-88a533790283\"}":{"__typename":"MentorPublicProfile","uuid":"c9edd313-6e37-4c84-ae6b-88a533790283","displayName":"Emily S.","slug":"emily-schrader","biography":"Emily Schrader is a second-year student at Stanford University studying International Relations with a focus on international history and culture. In 2021, she put her interest for global affairs and intercultural exchange into action: She moved to Spain in April to study at the University of Salamanca, and spent the summer teaching conservation science to high school students in the cloud forests of Costa Rica. Last fall, she worked on integrating human rights and US foreign policy with an organization called Freedom House, interned on press freedom issues with Reporters Without Borders, and taught journalism to middle school students with Curious Cardinals. But her passion for advocacy across media platforms and cultural divides did not begin there. Emily spent years leading the gun control movement in the nation’s capital, organizing mass student walkouts and enlisting survivors to share their stories at the doorsteps of Congress. While editing her high school newspaper, she covered local issues with global implications: The Washington Post featured her political cartoon as the cover of their nationwide Snapchat, and the Columbia Scholastic Press Association recognized her investigation of the Church abuse scandal with a Gold Circle Award. In high school, Emily did anything from competing with the Chemistry team to attending a mushroom-foraging convention, and on campus, she read more philosophers than she can remember with the Structured Liberal Education program. She loves to paint (strictly for fun), read (as a passion, not a chore), and bake vegan desserts (tolerated by non-vegan siblings). An experienced tutor, she encourages students to follow passions and draw connections!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greate
