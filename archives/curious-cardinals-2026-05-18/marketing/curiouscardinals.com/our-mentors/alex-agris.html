cting device over the course of my summers in high school!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"795ee147-221f-489b-8e8e-ad1e47ab54d7\"}":{"__typename":"DeepDives","uuid":"795ee147-221f-489b-8e8e-ad1e47ab54d7","content":"\u003cp\u003eI have recently been working on starting a Women in Bioengineering Club at Stanford! I'm excited about bringing women and minorities together to discuss/support each other through this difficult but rewarding major!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"830fd5db-0281-4141-b421-5f9ba10507f6\"}":{"__typename":"DeepDives","uuid":"830fd5db-0281-4141-b421-5f9ba10507f6","content":"\u003cp\u003eI am super proud of the children's theater group I am a part of at Stanford. We teach creative writing to local second graders and then perform their stories for them through shows that we put together. After each show, as we hug our students and wish them luck on their future writing, I could not be prouder!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"48844fec-ea02-49fc-a963-719aa554bf1b\"}":{"__typename":"DeepDives","uuid":"48844fec-ea02-49fc-a963-719aa554bf1b","content":"\u003cp\u003eDoing your best doesn't mean getting perfect grades, it means putting your all into all that you do (I know it sounds cheesy but it's so true!). As long as your heart is in the right place, you are treating yourself and others with compassion, and you approach school with the mindset of learning as much as possible, then you are doing your best!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"bbe40255-0551-428e-88a5-afb61cd453c0\"}":{"__typename":"Education","uuid":"bbe40255-0551-428e-88a5-afb61cd453c0","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Bioengineering","degree":"Bachelor of Science"},"School:{\"uuid\":\"87526e1e-c241-46eb-8d6a-8fd68c668b1e\"}":{"__typename":"School","uuid":"87526e1e-c241-46eb-8d6a-8fd68c668b1e","name":"William A. Shine Great Neck South High School","city":"Lake Success","type":"HIGH","state":"New York","country":"United States","zip":"11020"},"Education:{\"uuid\":\"fb1e8682-c9fc-49a5-9a96-a521ae5805a9\"}":{"__typename":"Education","uuid":"fb1e8682-c9fc-49a5-9a96-a521ae5805a9","school":{"__ref":"School:{\"uuid\":\"87526e1e-c241-46eb-8d6a-8fd68c668b1e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"5f554be9-8880-4580-a50f-e7e4c15922ad\"}":{"__typename":"MentorPublicProfile","uuid":"5f554be9-8880-4580-a50f-e7e4c15922ad","displayName":"Alex A.","slug":"alex-agris","biography":"\u003cp\u003eHi! I’m Alex from Queens, New York. I grew up going to public school on Long Island. I have always loved school and learning, and my favorite subject is biology. I have three siblings very close in age to me who are my best friends. We spend a lot of time kayaking, baking, and binging Star Wars and Harry Potter. Beyond these interests, I love music: I play cello and am an avid listener of Broadway musical albums! One of my biggest passions, though, is teaching. I have taught kids since I was in middle school and have only gotten more excited about it since. I recently moved to California and am now an undergraduate student studying Bioengineering at Stanford! I hope to pursue an MD-PhD in the future and work in the biotechnology industry. I love the idea of combining creativity and science to impact people’s health, and it’s where I believe I can make the most of a difference in the world. I have done a lot of science research, working in a tuberculosis treatment lab, shadowing at NYU Langone Hospital, designing a stroke outcome predictive technology, and working at a biotechnology startup that uses AI to design novel antibodies. I am starting a new research endeavor at Stanford where I will use AI to predict drug and treatment success. I have also had many experiences teaching. I ran a club in my high school that connected high school tutors with middle school students. The high schoolers who were advanced in a particular subject would tutor middle school students struggling in those similar areas. While running this club, I tutored many students in subjects ranging from Latin to English to Biology. I also created an organization called Science Stars. We make middle school visits to conduct hands-on science experiments in order to get kids excited about STEM areas! We’ve built potato batteries, launched rockets, and talked with robots: it has led to me witnessing students transform their mindsets and dedication to subjects ranging from math to chemistry. More recently, I’ve joined an organization at Stanford called Flying Treehouse. We go to local elementary schools and teach creative writing. We then take the stories that the students write and perform them in short plays so that they can watch their writing come to life. It is an incredible way to get kids excited about reading and writing! All of these experiences have allowed me to approach teaching from unique lenses. I’ve been able to experiment with hands-on and visual methods that not only lead to deep understanding of academic material, but promote excitement around these subject areas. Watching a child’s eyes light up when a difficult concept clicks will never cease to excite me! I love connecting with my students: it facilitates an openness that fosters incredible learning experiences. I hope to continue to make this impact on my students: helping them learn and helping them become excited about the process of learning!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Bioengineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b4df5819-7380-4a26-a794-1271dad50411\"}"},{"__ref":"DeepDives:{\"uuid\":\"795ee147-221f-489b-8e8e-ad1e47ab54d7\"}"},{"__ref":"DeepDives:{\"uuid\":\"830fd5db-0281-4141-b421-5f9ba10507f6\"}"},{"__ref":"DeepDives:{\"uuid\":\"48844fec-ea02-49fc-a963-719aa554bf1b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e9f9c6a0-b385-4f42-9eb8-6ca6d5c95a2e/-/crop/715x715/0,0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"bbe40255-0551-428e-88a5-afb61cd453c0\"}"},{"__ref":"Education:{\"uuid\":\"fb1e8682-c9fc-49a5-9a96-a521ae5805a9\"}"}],"hiredAt":"2023-02-07T00:04:49.178Z","topics":["Sustainability","Biology","K-5 Grade Math","STEM Project","Pre-Algebra","Creative Writing","Writing"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\"
