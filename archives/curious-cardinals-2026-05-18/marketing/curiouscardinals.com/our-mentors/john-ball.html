},"MentorPublicProfile:{\"uuid\":\"655975de-3bd3-4d11-94cb-0a7110f1ae5f\"}":{"__typename":"MentorPublicProfile","uuid":"655975de-3bd3-4d11-94cb-0a7110f1ae5f","displayName":"John B.","slug":"john-ball","biography":"John Ball is a recent graduate of Harvard College, where he studied psychology, neuroscience, and government. John’s two biggest passions are comedy and politics. In high school, John pursued model legislature and debate, and was elected youth governor of the Ohio YMCA Youth and Government Program. He also took first place in the national debate competition of Youth and Government students, which took submissions from nearly 20,000 students nationwide, for his proposal to reduce mental health discrimination among colleges in America. At Harvard, John continued his work in policy, as well as comedy and political satire.  John wrote for the Harvard Lampoon, America’s longest-published humor magazine, and was president of the Harvard College Stand-Up Comics’ Society (Harvard SUCS). He also organized the Weatherhead Center for International Affair’s “International Comedy Night,” where he opened for noted comics Ronny Chieng and Harry Kondabolu. John was also able to combine his passions of comedy and neuroscience when he was awarded the Query On Inc. “Boston Genius Grant” to pursue his research project looking at the intersection of comedy and mental illness among amateur and famous comedians. With the help of advisor Shelley Carson, a psychology professor at Harvard, John was able to present his findings at the Harvard Global Mental Health Conference in 2018. Since Harvard, John has continued to work on his passions for politics and writing. For work, John has spent much of his time doing policy analysis, with a particular focus on mental health policy areas. He is particularly passionate about improving access to mental health care resources to all individuals, specifically in outpatient settings in addition to emergency inpatient care. John currently works
