-dc5f5ef80bbc\"}":{"__typename":"Favorites","uuid":"1d1bbe29-8ccf-43fe-8b97-dc5f5ef80bbc","photoUrl":"https://ucarecdn.com/eadf3839-c36a-45c9-9060-13e50272baa2/","title":"Mamma Mia!","type":"MOVIE"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"7aa05d40-8af9-42aa-bf72-8b78d20a8028\"}":{"__typename":"DeepDives","uuid":"7aa05d40-8af9-42aa-bf72-8b78d20a8028","content":"\u003cp\u003eI am very proud of my writing journey. My creative writing, expository writing, journalism, and scientific research papers have been published in over fifty publications both domestically and abroad, and I've also received accolades from both national and international organizations. I'm particularly proud of being able to be a mentor to young writers: I founded my high school's first-ever creative writing workshop, I have developed original writing curricula for multiple organizations around New York City, and I am the Writing Director of Stanford's creative magazine and editor of the Stanford Undergraduate Law Review, where I edit and spotlight students' work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"631038d8-e5a4-4e2e-af45-29c4e82afb4c\"}":{"__typename":"DeepDives","uuid":"631038d8-e5a4-4e2e-af45-29c4e82afb4c","content":"\u003cp\u003eI love to travel, study languages, read, write, be in nature, run and play tennis, explore new cultures and cuisines, and perform on stage!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"DeepDives:{\"uuid\":\"6967ad96-845e-465d-9ad6-ec531a9c5d95\"}":{"__typename":"DeepDives","uuid":"6967ad96-845e-465d-9ad6-ec531a9c5d95","content":"\u003cp\u003eI am very proud of my writing journey. My creative writing, expository writing, journalism, and scientific research papers have been published in over fifty publications both domestically and abroad, and I've also received accolades from both national and international organizations. I'm particularly proud of being able to be a mentor to young writers: I founded my high school's first-ever creative writing workshop, I have developed original writing curricula for multiple organizations around New York City, and I am the Writing Director of Stanford's creative magazine and editor of the Stanford Undergraduate Law Review, where I edit and spotlight students' work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"DeepDives:{\"uuid\":\"4543de38-d2ae-4abd-849a-71d0bb5183f3\"}":{"__typename":"DeepDives","uuid":"4543de38-d2ae-4abd-849a-71d0bb5183f3","content":"\u003cp\u003eI love to travel, study languages, read, write, be in nature, run and play tennis, explore new cultures and cuisines, and perform on stage!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"bf2ef120-95ed-4688-9922-99b4f20d56b4\"}":{"__typename":"Education","uuid":"bf2ef120-95ed-4688-9922-99b4f20d56b4","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Comparative Literature \u0026 Science, Technology, and Society (double major)","degree":null},"School:{\"uuid\":\"06d398e8-5a2b-437d-9ac6-994779a5da3f\"}":{"__typename":"School","uuid":"06d398e8-5a2b-437d-9ac6-994779a5da3f","name":"The Spence School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"e939d78b-7eac-4913-a82d-3b6b78925c92\"}":{"__typename":"Education","uuid":"e939d78b-7eac-4913-a82d-3b6b78925c92","school":{"__ref":"School:{\"uuid\":\"06d398e8-5a2b-437d-9ac6-994779a5da3f\"}"},"startYear":"2008","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"0fa13190-5e10-45e6-8587-825fa8f8b9c3\"}":{"__typename":"MentorPublicProfile","uuid":"0fa13190-5e10-45e6-8587-825fa8f8b9c3","displayName":"Divya M.","slug":"divya-mehrish","biography":"\u003cp\u003eDivya, a widely published writer of poetry, fiction, and creative nonfiction as well as scientific research, is pursuing a double major in Comparative Literature and in the interdisciplinary Science, Technology, and Society program as well as a minor in Symbolic Systems at Stanford University. Over the summer, she is working as a Sales \u0026amp; Trading Analyst at Morgan Stanley.\u003c/p\u003e\u003cp\u003eDivya’s writing has been published in over fifty journals and magazines, and she has received prestigious international awards for her writing, including being commended in the top 0.78% for the National Poetry Competition and the Foyle Young Poets of the Year Award (some of the most competitive writing awards in the UK) as well as the U.S. Scholastic Writing Awards.\u003c/p\u003e\u003cp\u003eDivya graduated from the Spence School in New York City with a 4.0 GPA in 2020 before taking a gap year. She founded Spence’s first-ever Creative Writing Workshop, developed and led the Microfinance Club, and fostered civic engagement as a Senior Member of Model Congress. Throughout high school, she also volunteered at organizations across NYC, designing unique curricula and mentoring students of all ages.\u003c/p\u003e\u003cp\u003eDivya is the Writing Director of Stanford’s creative magazine, editor of the Stanford Undergraduate Law Review, the President of Stanford’s Symbolic Systems Society, an Opinions writer for The Stanford Daily, and a head fellow of Stanford Women in Business. She is also pursuing research at the Stanford School of Medicine. Divya’s extensive professional experience includes managing a consulting company, performing sales and trading work as well as research at financial institutions, working at the intersections of free speech, human rights, and literary advocacy at PEN America, serving as a teaching associate at the Spence School, designing content at the prestigious publication The Adroit Journal, and performing data analytics work and scientific research for a health-focused tech startup. Four different research papers she wrote were published in various international journals, and she presented her work at multiple global conferences. With an international background (half Italian and half Indian), Divya also loves traveling, exploring new cuisines, and studying languages and etymology. Some of her other passions include theater, historical fiction (particularly Russian literature), running, and tennis. She can’t wait to help you uncover and pursue your own passions!\u003c/p\u003e","teachingVideoPlaybackId":"r02aUB01xwXN02EG1UViyxUugAKksTBAu02tGbxZ8w8tGKI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am very proud of my writing journey. My creative writing, expository writing, journalism, and scientific research papers have been published in over fifty publications both domestically and abroad, and I've also received accolades from both national and international organizations. I'm particularly proud of being able to be a mentor to young writers: I founded my high school's first-ever creative writing workshop, I have developed original writing curricula for multiple organizations around New York City, and I am the Writing Director of Stanford's creative magazine and editor of the Stanford Undergraduate Law Review, where I edit and spotlight students' work.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"2a1c7317-3b73-4454-ba17-4c02aead9d16\"}"},{"__ref":"Favorites:{\"uuid\":\"ec226368-9a28-414e-ab24-ee36a767f71f\"}"},{"__ref":"Favorites:{\"uuid\":\"1d1bbe29-8ccf-43fe-8b97-dc5f5ef80bbc\"}"}],"causesSupported":[],"major":"Comparative Literature \u0026 Science, Technology, and Society (double major)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7aa05d40-8af9-42aa-bf72-8b78d20a8028\"}"},{"__ref":"DeepDives:{\"uuid\":\"631038d8-e5a4-4e2e-af45-29c4e82afb4c\"}"},{"__ref":"DeepDives:{\"uuid\":\"6967ad96-845e-465d-9ad6-ec531a9c5d95\"}"},{"__ref":"DeepDives:{\"uuid\":\"4543de38-d2ae-4abd-849a-71d0bb5183f3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e3b9f27a-30fc-4ceb-95e5-207a2ecb773d/-/preview/-/format/jpg/","https://ucarecdn.com/1c78cf45-0f92-4ccf-9459-4b3d336d8ce8/-/preview/-/format/jpg/","https://ucarecdn.com/79c1a85a-d1cd-488f-91e0-ec2b9e218e49/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"bf2ef120-95ed-4688-9922-99b4f20d56b4\"}"},{"__ref":"Education:{\"uuid\":\"e939d78b-7eac-4913-a82d-3b6b78925c92\"}"}],"hiredAt":"2021-10-30T07:56:13.000Z","topics":["Writing","French","College Essay Writing","Academic Coaching","Executive Function","History","Reading","Creative Writing","K-6 Storybook","Film / Theater","History Project","Business / Entrepreneurship","Finance / Investing","Medicine / Health","Law / Government / Policy","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"divya-mehrish\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0fa
