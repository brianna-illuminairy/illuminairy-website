ename":"Favorites","uuid":"3215322d-7e2d-4a9e-94c3-8623a176cdab","photoUrl":"https://ucarecdn.com/a44d5498-721e-474e-a3b3-b73aafd7dbdf/","title":"Skiing","type":"SPORT"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"33423249-3950-4718-a6c3-8555ced31696\"}":{"__typename":"DeepDives","uuid":"33423249-3950-4718-a6c3-8555ced31696","content":"\u003cp\u003eIn my junior year of high school, I was fortunate enough to experience the profound impact of a mentor through the Hispanic Scholarship Fund's Youth Leadership Institute. My mentor's job was to guide me through the chaos of college applications; however, she did so much more than that. My mentor's impact on my growth was immediate, as her knowledge and experience paved new perspectives and insights for me. More importantly, my mentor and I formed a personal connection that quickly transformed into a friendship. This experience showed me that the impact of a mentor is more than simple guidance; mentors provide mentees with holistic and multifaceted experiences. The ripple effect that my mentor's influence had on me has pushed me to become a mentor, and provide my mentees with a similar profound transformation that I experienced. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"66e0410f-169b-44d7-962f-42be3fcc1317\"}":{"__typename":"DeepDives","uuid":"66e0410f-169b-44d7-962f-42be3fcc1317","content":"\u003cp\u003eIn the midst of the 2020 Presidential Election, I first-handedly witnessed the lack of voting in predominate minority-led communities. From my own experiences of interning on the Biden-Harris 2020 Campaign and being Hispanic, I quickly realized that a large reason for slim voter turnout in minority communities was the lack of voter education in these areas; so, I created Voting Equals Democracy, a podcast series that analyzed the importance of voting. Through analytical interviews with scholars, business owners, and non-profit organization representatives, I was able to intertwine my passion for politics with the need for more voter education. Voting Equals Democracy made a profound impact in my own community, with thousands of local listeners. You can check out Voting Equals Democracy here: https://www.listennotes.com/podcasts/voting-equals-democracy-andaluz-media-rita-gYFWRSIq2Pl/\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3d0fd881-b1ed-4da9-b32f-4a81d2c768b4\"}":{"__typename":"DeepDives","uuid":"3d0fd881-b1ed-4da9-b32f-4a81d2c768b4","content":"\u003cp\u003eIn my spare time, I enjoy spending time with friends and family. Whether it be at the beach or exploring a new city, I genuinely adore surrounding myself with my loved ones!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e4239ca2-9215-42fb-a9c1-db8ad2f2fce6\"}":{"__typename":"DeepDives","uuid":"e4239ca2-9215-42fb-a9c1-db8ad2f2fce6","content":"\u003cp\u003eI spent my summers in high school enjoying the Miami sun and water, rowing with my teammates and competing at various summer regattas. Additionally, I had summer internships each summer beginning in the summer of my freshman year. Most of these internships consisted of political campaign opportunities or business-related experiences. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"3ad10448-b2a0-4d7a-b580-4ea29f6399f4\"}":{"__typename":"School","uuid":"3ad10448-b2a0-4d7a-b580-4ea29f6399f4","name":"NSU University School","city":"Fort. Lauderdale","type":"HIGH","state":"FL","country":"United States ","zip":"33314"},"Education:{\"uuid\":\"e200a41f-a61a-4e68-915f-4a6047fe159e\"}":{"__typename":"Education","uuid":"e200a41f-a61a-4e68-915f-4a6047fe159e","school":{"__ref":"School:{\"uuid\":\"3ad10448-b2a0-4d7a-b580-4ea29f6399f4\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"2fb29e00-a6a8-4cf8-812a-d98bfc43ae96\"}":{"__typename":"Education","uuid":"2fb29e00-a6a8-4cf8-812a-d98bfc43ae96","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Political Science, Economics","degree":"B.A."},"MentorPublicProfile:{\"uuid\":\"3f9b7ae9-a197-42c0-ade9-7d9c3798573d\"}":{"__typename":"MentorPublicProfile","uuid":"3f9b7ae9-a197-42c0-ade9-7d9c3798573d","displayName":"Rita S.","slug":"rita-shuster","biography":"\u003cp\u003eRita is an undergraduate student at Stanford University, where she is pursuing her B.A. in Political Science with concentrations in Economics and Data Science. Rita is a Miami native, but is of Venezuelan and Mexican descent. This past summer, Rita was a Summer Analyst at J.P. Morgan in Investment Solutions, as well as a Girls Who Invest Summer Scholar. Rita holds the prestigious title of the Hispanic Scholarship Fund Scholar and was named as the 2021 Hispanic Heritage Foundation and Nike Scholar in Public Service and Justice. Rita has worked on various political campaigns, most notably being the youngest intern on the 2020 Biden-Harris Campaign, as a member of the Southeast Finance Committee. She had the opportunity of being a Precinct Captain during the Iowa Caucuses. Passionate about research, Rita has published two graduate-level papers on the Voter Choice Theory and Civil Discourse within High School Classrooms. These research experiences opened Rita's eyes to the myriad of correlations between politics and psychology. Outside of the classroom, Rita was a nationally qualifying coxswain on her club's rowing team. At Stanford, Rita is a Research Assistant at Stanford's Center on Democracy, Development, and the Rule of Law, where she analyzes democracy inventory on campus. Rita is also a Research Assistant on Stanford's Meta Community Forum collaboration. Rita is involved with Stanford's Hillel, as a Jewish Learning Fellow. Rita is an avid member of the Stanford Ski Team. Overall, Rita is a promoter of active listening and is eager to collaborate with students on any excitements they want to explore!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"726c1ae5-7b8f-4abf-a122-3d4002331742\"}"},{"__ref":"Favorites:{\"uuid\":\"2342dfba-ee0f-4ddf-8e1b-d5da67c26966\"}"},{"__ref":"Favorites:{\"uuid\":\"3215322d-7e2d-4a9e-94c3-8623a176cdab\"}"}],"causesSupported":[],"major":"Political Science, Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"33423249-3950-4718-a6c3-8555ced31696\"}"},{"__ref":"DeepDives:{\"uuid\":\"66e0410f-169b-44d7-962f-42be3fcc1317\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d0fd881-b1ed-4da9-b32f-4a81d2c768b4\"}"},{"__ref":"DeepDive
