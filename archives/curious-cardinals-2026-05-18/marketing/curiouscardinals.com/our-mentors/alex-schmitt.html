s","degree":"Bachelor's"},"MentorPublicProfile:{\"uuid\":\"9977c520-6821-4679-872c-54735faef35e\"}":{"__typename":"MentorPublicProfile","uuid":"9977c520-6821-4679-872c-54735faef35e","displayName":"Alex S.","slug":"alex-schmitt","biography":"Alex is a junior at Stanford University pursuing a major in Engineering Physics with a concentration in aerospace physics and a minor in mathematics. Academically, Alex is interested in physics, mechanical and electrical engineering, computer science, and music. Aside from classes, Alex is the operations lead of the Stanford Space Initiative and a member of the liquid propulsion and flight avionics teams. He is also a member of the Stanford Band, a member of the Stanford Quantum Computing Association, a university tour guide, and a research assistant in both a quantum physics laboratory and the behavioral lab in the Graduate School of Business on campus. Alex was an intern at the Johns Hopkins Applied Physics Laboratory for two years as a software engineer where he implemented image processing and machine learning algorithms to improve target detection software for defense applications. He is also currently an intern at BAE Systems, working as a systems engineer to ensure the safety and reliability of the next generations of U.S. ICBM missiles. Alex graduated as valedictorian from Manchester Valley High School in 2020 in a small rural town in Maryland, and was awarded numerous scholarships for his community service and scientific achievements while a student. As a high school student, Alex acted in the school's theater department, served as president of the National Honor Society, and committed more than 1,600 hours to community service. He was also the first student in his high school to obtain his Associate's degree alongside his high school diploma from Carroll Community College. When Alex isn't designing rockets and trying to prevent them from exploding, he enjoys going on hikes with his friends, playing piano, and rocking out in the Stanford Band. Alex is very excited to spread his fascination with all things space and physics-related to younger students and to show them what being a scientist and engineer is all about!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Engineering Physics","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/c56f99f5-459a-4bc2-9021-d0a5cd233c3b/-/crop/501x501/6,1/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7a9a5c01-c434-4c1d-b29d-845bc7fc7295\"}"}],"hiredAt":"2022-07-25T02:57:19.000Z","topics":["Web Design","Algebra I","Music","Calculus","Machine Learning / AI","Precalculus / Trigonometry","Algebra II","Robotics / Electronics / CAD","Physics","6-8 Grade Science","Aviation / Aerospace","Computer Science","Coding / Programming","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alex-schmitt\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9977c520-6821-4679-872c-54735faef35e\"}"}}},"_sentryTraceData":"0945c9750da543229c575c7d564eaa22-a7ce088dc1a351e4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=0945c9750da543229c575c7d564eaa22,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alex-schmitt"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d
