document.addEventListener("DOMContentLoaded", () => {
  // Get the current URL's query parameters
  const urlParams = new URLSearchParams(window.location.search);

  // Filter UTM parameters only
  const utmParams = Array.from(urlParams.entries())
    .filter(([key]) => key.startsWith("utm_"))
    .map(([key, value]) => `${encodeURIComponent(key)}=${encodeURIComponent(value)}`)
    .join("&");

  // If there are no UTM parameters, exit
  if (!utmParams) return;

  // Select all anchor tags on the page
  const links = document.querySelectorAll("a");

  links.forEach(link => {
    const href = link.getAttribute("href");

    // Only modify links with a valid href
    if (href && href.startsWith("http")) {
      const url = new URL(href);

      // Append UTM parameters to the URL
      url.search += (url.search ? "&" : "") + utmParams;

      // Update the href attribute
      link.setAttribute("href", url.toString());
    }
  });
});

<script>
  // Get current URL parameters
  const urlParams = window.location.search;
  
  // If there are parameters, append them to all internal links
  if (urlParams) {
    const links = document.querySelectorAll('a[href^="/"], a[href^="' + window.location.origin + '"]');
    links.forEach(link => {
      const url = new URL(link.href);
      const currentParams = new URLSearchParams(urlParams);
      
      // Append each parameter to the link
      currentParams.forEach((value, key) => {
        url.searchParams.set(key, value);
      });
      
      link.href = url.toString();
    });
  }
